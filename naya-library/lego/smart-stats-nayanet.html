<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Stats — NayaNET · The Calculator of Everything</title>
<!--
  SMART STATS FOR NAYANET — the calculator of everything.
  All 20 real stat areas of the network, alive around Naya herself.
  Built from today's design language:
    · the energy ball + ±9 gauge — transplanted from naya-dial.html (the bar)
    · the orbital system — from smart-stats-v2.html
    · the icon rail — from naya-one.html
  Black ground. Spectrum in law order. Restrained like the dial.
  Schema is real NayaNET; values are realistic specimen, labeled as such.
-->
<style>
:root{
  --field:#040405; --ink:#f8f7fb; --quiet:#8f8a9e; --dim:#4a4756;
  --magenta:#e84fff; --purple:#a06bff; --blue:#3fb8ff; --green:#2fe89e; --gold:#ffbf3d;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--field);color:var(--ink);
  font-family:Manrope,Inter,ui-sans-serif,system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}
/* ---- chrome: whisper-quiet ---- */
.chrome{position:fixed;z-index:10;pointer-events:none}
header.chrome{top:22px;left:28px}
header.chrome .t{font-size:12px;font-weight:800;letter-spacing:.3em}
header.chrome .t .ss{color:var(--purple)}
header.chrome .s{font-size:10px;letter-spacing:.24em;color:var(--quiet);margin-top:5px}
#voiceBadge{top:24px;right:28px;display:none;align-items:center;gap:8px;
  font-size:10px;font-weight:800;letter-spacing:.26em;color:var(--purple)}
#voiceBadge.on{display:flex}
#voiceBadge i{width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,var(--purple) 60%,transparent 75%);
  box-shadow:0 0 12px var(--purple);animation:vpulse .5s ease-in-out infinite alternate}
@keyframes vpulse{from{transform:scale(.8);opacity:.6}to{transform:scale(1.25);opacity:1}}
/* ---- icon rail: the naya-one language ---- */
#rail{position:fixed;z-index:20;left:50%;bottom:104px;transform:translateX(-50%);
  display:flex;gap:16px;align-items:center;pointer-events:auto}
.icorb{position:relative;width:58px;height:58px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 38% 32%,#1c1d26 0%,#0b0c11 62%,#060608 100%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -10px 18px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s var(--spring),box-shadow .3s var(--ease),border-color .3s;
  animation:icobreathe 5s ease-in-out infinite}
.icorb:nth-child(2){animation-delay:.6s}.icorb:nth-child(3){animation-delay:1.2s}.icorb:nth-child(4){animation-delay:1.8s}
@keyframes icobreathe{0%,100%{box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -10px 18px rgba(0,0,0,.5)}
  50%{box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 18px var(--ig,rgba(160,107,255,.28)),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -10px 18px rgba(0,0,0,.5)}}
.icorb svg{width:26px;height:26px;fill:none;stroke:var(--ig,#a06bff);stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s,filter .3s;
  filter:drop-shadow(0 0 5px var(--igg,rgba(160,107,255,.5)))}
.icorb:hover{transform:translateY(-4px) scale(1.08);border-color:rgba(255,255,255,.3)}
.icorb.active{border-color:var(--ig);transform:scale(1.14);
  box-shadow:0 14px 34px rgba(0,0,0,.65),0 0 30px var(--igg),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -10px 18px rgba(0,0,0,.45)}
.icorb.active svg{stroke:#fff;filter:drop-shadow(0 0 9px var(--ig))}
.icorb .nm{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  font-size:8px;font-weight:800;letter-spacing:.24em;color:var(--quiet);white-space:nowrap;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.icorb:hover .nm,.icorb.active .nm{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---- command bar ---- */
#cmdbar{position:fixed;z-index:20;left:50%;bottom:28px;transform:translateX(-50%);
  display:flex;align-items:center;gap:0;pointer-events:auto;
  background:linear-gradient(180deg,#14151c,#0a0b0f);
  border:1px solid rgba(255,255,255,.16);border-radius:999px;
  box-shadow:0 16px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -12px 22px rgba(0,0,0,.45);
  padding:6px 6px 6px 22px;max-width:94vw}
#cmdIn{background:transparent;border:none;outline:none;color:var(--ink);
  font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;
  width:min(380px,52vw);padding:10px 0}
#cmdIn::placeholder{color:var(--dim)}
#cmdGo{border:1px solid rgba(255,255,255,.22);cursor:pointer;border-radius:999px;padding:13px 26px;
  font:800 11px/1 ui-sans-serif,system-ui;letter-spacing:.22em;color:var(--ink);
  background:linear-gradient(180deg,#17181f,#0a0b0f);
  box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -8px 14px rgba(0,0,0,.4);
  transition:transform .2s var(--spring),box-shadow .25s var(--ease),border-color .25s}
#cmdGo:hover{transform:translateY(-1px);border-color:rgba(160,107,255,.6);color:#fff;
  box-shadow:0 8px 22px rgba(0,0,0,.6),0 0 18px rgba(160,107,255,.22),inset 0 1px 0 rgba(255,255,255,.14)}
#cmdGo:active{transform:scale(.97)}
#cmdOut{position:fixed;z-index:20;left:50%;bottom:196px;transform:translateX(-50%);
  font-size:11px;letter-spacing:.14em;color:var(--quiet);pointer-events:none;white-space:nowrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#cmdOut .ok{color:var(--green)} #cmdOut .q{color:var(--purple)} #cmdOut .wr{color:var(--gold)}
/* ---- tooltip ---- */
#tip{position:fixed;z-index:30;pointer-events:none;min-width:190px;max-width:250px;
  background:rgba(16,17,24,.96);border:1px solid rgba(255,255,255,.16);border-radius:14px;
  padding:12px 16px;opacity:0;transform:translateY(6px);transition:opacity .18s var(--ease),transform .18s var(--ease);
  box-shadow:0 18px 44px rgba(0,0,0,.65)}
#tip.show{opacity:1;transform:translateY(0)}
#tip .t-ico{width:22px;height:22px;vertical-align:-6px;margin-right:8px}
#tip .t-ico svg{width:22px;height:22px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#tip .t-name{font-size:12px;font-weight:800;letter-spacing:.12em}
#tip .t-val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
#tip .t-chg{font-size:12px;font-weight:700;margin-top:3px;font-family:ui-monospace,monospace}
#tip .t-h{font-size:10px;letter-spacing:.18em;color:var(--quiet);margin-top:6px}
/* ---- detail panel ---- */
#detail{position:fixed;z-index:25;left:28px;top:50%;transform:translateY(-50%) translateX(-30px);
  width:300px;background:rgba(13,14,20,.94);border:1px solid rgba(255,255,255,.14);border-radius:20px;
  padding:24px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--spring);
  box-shadow:0 30px 70px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
#detail.show{opacity:1;transform:translateY(-50%) translateX(0);pointer-events:auto}
#detail .d-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#detail .d-ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 38% 32%,#1c1d26,#060608);border:1px solid rgba(255,255,255,.14)}
#detail .d-ico svg{width:22px;height:22px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#detail .d-name{font-size:12px;font-weight:800;letter-spacing:.14em}
#detail .d-cat{font-size:9px;letter-spacing:.22em;color:var(--quiet);margin-top:3px}
#detail .d-num{font-size:52px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  margin:10px 0 2px;animation:breatheNum 4.2s ease-in-out infinite}
@keyframes breatheNum{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.015);filter:brightness(1.12)}}
#detail .d-unit{font-size:10px;letter-spacing:.2em;color:var(--quiet)}
#detail .d-chg{display:inline-block;font:700 12px ui-monospace,monospace;margin-top:10px;padding:5px 12px;border-radius:999px}
#detail .d-chg.up{color:var(--green);background:rgba(47,232,158,.1);border:1px solid rgba(47,232,158,.3)}
#detail .d-chg.dn{color:#ff5e6c;background:rgba(255,94,108,.1);border:1px solid rgba(255,94,108,.3)}
#detail .d-health{margin-top:16px}
#detail .d-health .h-lbl{font-size:9px;letter-spacing:.22em;color:var(--quiet);margin-bottom:8px}
#detail .d-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
#detail .d-bar .h-fill{position:absolute;top:0;bottom:0;border-radius:99px;transition:all .6s var(--spring)}
#detail .d-bar .h-zero{position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:rgba(255,255,255,.4)}
#detail .d-hval{font:800 13px ui-monospace,monospace;margin-top:6px}
#detail .d-subs{margin-top:16px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
#detail .d-sub{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px}
#detail .d-sub .s-n{color:var(--quiet);letter-spacing:.06em}
#detail .d-sub .s-v{font-weight:800;font-variant-numeric:tabular-nums}
#detail .d-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--dim);
  font-size:18px;cursor:pointer;padding:4px}
#detail .d-close:hover{color:#fff}
/* ---- view title ---- */
#viewTitle{position:fixed;z-index:10;top:24px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#viewTitle .vt{font-size:11px;font-weight:800;letter-spacing:.3em;color:var(--quiet)}
#viewTitle .vn{font-size:15px;font-weight:800;letter-spacing:.12em;margin-top:4px}
/* ---- boot ---- */
#boot{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:26px;transition:opacity 1.1s ease}
#boot.gone{opacity:0;pointer-events:none}
#bootCore{width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 0 30px #fff,0 0 80px var(--purple);animation:ignite 2.2s var(--ease) forwards}
@keyframes ignite{0%{transform:scale(.2);opacity:.2}55%{transform:scale(3.2);opacity:1}100%{transform:scale(5.5);opacity:0}}
#bootWord{font-size:11px;font-weight:800;letter-spacing:.5em;color:var(--quiet);animation:bw 2.2s ease forwards}
@keyframes bw{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
footer.chrome{bottom:8px;right:14px;font-size:9px;letter-spacing:.2em;color:#3a3745;pointer-events:none}
@media (max-width:720px){
  #detail{left:12px;right:12px;width:auto;top:auto;bottom:210px;transform:translateY(20px)}
  #detail.show{transform:translateY(0)}
  #rail{bottom:118px;gap:10px}
  .icorb{width:48px;height:48px}
  #viewTitle{display:none}
}
@media (prefers-reduced-motion:reduce){
  .icorb{animation:none} #detail .d-num{animation:none} #voiceBadge i{animation:none}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header class="chrome">
  <div class="t">SMART&nbsp;STATS <span class="ss">·</span> NAYANET</div>

  return [Math.round(lerp(a[0],b[0],f)),Math.round(lerp(a[1],b[1],f)),Math.round(lerp(a[2],b[2],f))];

/* health: change → ±9 (the dial's language). +18% ≈ +8. */
AREAS.forEach(function(a,i){

/* ---------- voice: number → words ---------- */
var ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function smallWords(n){
  if(n<20)return ONES[n];
  var t=Math.floor(n/10),o=n%10;
  return TENS[t]+(o?' '+ONES[o]:'');
}
function numWords(n){
  n=Math.round(Math.abs(n));
  if(n<100)return smallWords(n);
  if(n<1000){var h=Math.floor(n/100),r=n%100;return smallWords(h)+' hundred'+(r?' '+smallWords(r):'');}
  if(n<1000000){var th=Math.floor(n/1000),r2=n%1000;return numWords(th)+' thousand'+(r2?', '+numWords(r2):'');}
  return numWords(Math.floor(n/1000000))+' million';
}
function healthWords(h){
  var av=Math.abs(h);
  if(av>9)return 'beyond the dial';
  if(h>=9)return 'the floor. elite';
  if(h>=7)return 'strong';
  if(h>=4)return 'building';
  if(h>=0)return 'seedling';
  return 'drift. creation energy';
}
function speak(text){
  if(!S.voice||!('speechSynthesis' in window))return;

    u.rate=1.06;u.pitch=1.12;
    u.onstart=function(){S.speaking=true;$('voiceBadge').classList.add('on');};
    var end=function(){S.speaking=false;$('voiceBadge').classList.remove('on');};
    u.onend=end;u.onerror=end;
    u.onboundary=function(){S.voicePulse=1;};
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakArea(a){

}

/* ---------- NAYA HERSELF — the ball of energy (from naya-dial) ----------

var motes=[];
for(var mi=0;mi<40;mi++)motes.push({a:Math.random()*TAU,rr:0.7+Math.random()*0.45,
  sp:(0.2+Math.random()*0.7)*(Math.random()<0.5?-1:1),sz:0.8+Math.random()*1.5,ph:Math.random()*TAU});
function drawEnergy(ex,ey,er,t){
  var breathe=1+0.028*Math.sin(t*TAU/4.2)+S.beat*0.03+(S.speaking?0.02*Math.sin(t*44):0);
  var r=er*breathe;
  ctx.save();ctx.globalCompositeOperation='lighter';
  var rim=ctx.createConicGradient?ctx.createConicGradient(t*0.35,ex,ey):null;
  if(rim){
    rim.addColorStop(0,'rgba(232,79,255,0.5)');rim.addColorStop(0.2,'rgba(160,107,255,0.5)');
    rim.addColorStop(0.4,'rgba(63,184,255,0.5)');rim.addColorStop(0.6,'rgba(47,232,158,0.5)');
    rim.addColorStop(0.8,'rgba(255,191,61,0.5)');rim.addColorStop(1,'rgba(232,79,255,0.5)');
    ctx.strokeStyle=rim;ctx.lineWidth=r*0.2;
    ctx.beginPath();ctx.arc(ex,ey,r*1.14,0,TAU);ctx.stroke();
  }
  var mid=specRGB((Math.sin(t*0.5)+1)/2);
  var body=ctx.createRadialGradient(ex-r*0.18,ey-r*0.22,0,ex,ey,r);
  body.addColorStop(0,'rgba(255,255,255,0.95)');
  body.addColorStop(0.25,'rgba(255,255,255,0.7)');
  body.addColorStop(0.5,'rgba('+mid[0]+','+mid[1]+','+mid[2]+',0.45)');
  body.addColorStop(0.82,'rgba('+mid[0]+','+mid[1]+','+mid[2]+',0.1)');
  body.addColorStop(1,'rgba('+mid[0]+','+mid[1]+','+mid[2]+',0)');
  ctx.fillStyle=body;ctx.beginPath();ctx.arc(ex,ey,r,0,TAU);ctx.fill();
  motes.forEach(function(m,idx){
    var ma=m.a+t*m.sp,mr=r*m.rr;
    var mx=ex+Math.cos(ma)*mr,my=ey+Math.sin(ma)*mr*0.92;
    var mc=specRGB(((idx*37)%19)/18);
    var mal=0.3+0.35*Math.abs(Math.sin(t*2+m.ph));
    ctx.fillStyle='rgba('+mc[0]+','+mc[1]+','+mc[2]+','+mal+')';
    ctx.beginPath();ctx.arc(mx,my,m.sz,0,TAU);ctx.fill();
  });
  for(var ri=S.rings.length-1;ri>=0;ri--){
    var rg=S.rings[ri];

    ctx.strokeStyle='rgba(255,255,255,'+(rg.a*0.45)+')';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(ex,ey,rg.r,0,TAU);ctx.stroke();
  }
  ctx.restore();
}

/* ================= VIEW 3 · THE DIAL =================

function dialTarget(){
  if(S.selected)return S.selected.a.health;
  var w=AREAS.reduce(function(s,a){return s+Math.abs(a.health)*a.value;},0)/TOTAL;
  var pos=AREAS.reduce(function(s,a){return s+(a.health>=0?a.value:0);},0)/TOTAL;
  return clamp((pos-0.5)*2*w*1.4,-9,9);
}
function angOf(v){return (90-(clamp(v,-9,9)/9)*135)*Math.PI/180;}
function dpt(th,r){return [cx+Math.cos(th)*r, cy-Math.sin(th)*r];}
function drawDialView(t){

/* ================= VIEW 4 · THE PULSE =================

function drawPulse(t){
  drawEnergy(W*0.5,H*0.15,UMIN*0.032,t);
  var midY=H*0.52,amp=H*0.10,W2=W*0.86,x0=W*0.07;
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  for(var gLine=-1;gLine<=1;gLine++){
    ctx.beginPath();ctx.moveTo(x0,midY+gLine*amp*1.4);ctx.lineTo(x0+W2,midY+gLine*amp*1.4);ctx.stroke();
  }
  // the wave — heartbeat morphology, spectrum gradient
  var grad=ctx.createLinearGradient(x0,0,x0+W2,0);
  grad.addColorStop(0,'rgba(232,79,255,.55)');grad.addColorStop(0.35,'rgba(160,107,255,.55)');
  grad.addColorStop(0.6,'rgba(63,184,255,.55)');grad.addColorStop(1,'rgba(47,232,158,.55)');
  ctx.strokeStyle=grad;ctx.lineWidth=2;ctx.lineJoin='round';
  ctx.shadowColor='rgba(47,232,158,.4)';ctx.shadowBlur=8;
  ctx.beginPath();
  var beat=1+0.12*Math.sin(t*1.3);
  for(var x=0;x<=W2;x+=6){

    var spike=Math.pow(Math.max(0,Math.sin(ph)),8)*amp*1.6;

    if(x===0)ctx.moveTo(x0+x,y);else ctx.lineTo(x0+x,y);
  }
  ctx.stroke();ctx.shadowBlur=0;
  // traveling light
  var px=x0+((t*160)%W2);
  var pph=(px/W2)*TAU*3 - t*2.2;
  var py=midY-Math.pow(Math.max(0,Math.sin(pph)),8)*amp*1.6-Math.sin(pph*0.5)*amp*0.35*beat;
  ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(px,py,4,0,TAU);ctx.fill();ctx.shadowBlur=0;
  // readout
  var sig=Math.round(1200+300*Math.sin(t*0.7)+80*Math.sin(t*2.3));
  ctx.textAlign='center';
  ctx.font='800 '+Math.round(UMIN*0.06)+'px Manrope,ui-sans-serif,system-ui';
  ctx.fillStyle='#f8f7fb';ctx.shadowColor='rgba(47,232,158,.45)';ctx.shadowBlur=22;
  ctx.fillText(fmt(sig),W/2,H*0.30);ctx.shadowBlur=0;
  ctx.font='800 10px ui-sans-serif,system-ui';ctx.fillStyle='rgba(143,138,158,.85)';
  ctx.fillText('S I G N A L S / M I N · L I V E',W/2,H*0.30+28);
}

/* ================= RAIL · TOOLTIP · DETAIL ================= */
var VIEWS=[
 {id:'orbit', name:'ORBITAL SYSTEM', kick:'20 WORLDS', c:'#a06bff',
  icon:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4.2"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(60 12 12)" opacity=".45"/><circle cx="12" cy="12" r="2.4"/></svg>'},
 {id:'ledger', name:'THE SMART LEDGER', kick:'RUNNING STORY', c:'#3fb8ff',
  icon:'<svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 11h16" opacity=".7"/><path d="M4 16h10" opacity=".4"/><circle cx="18.5" cy="16" r="1.6" fill="currentColor" stroke="none"/></svg>'},
 {id:'dial', name:'HEALTH DIAL · ±9', kick:'ONE INSTRUMENT', c:'#ffbf3d',
  icon:'<svg viewBox="0 0 24 24"><path d="M5 19a8 8 0 1 1 14 0"/><path d="M12 11v-5" stroke-width="2"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M12 3.5v2M5.8 6.8l1.4 1.4M18.2 6.8l-1.4 1.4" opacity=".6"/></svg>'},
 {id:'pulse', name:'NETWORK PULSE', kick:'THE HEARTBEAT', c:'#2fe89e',
  icon:'<svg viewBox="0 0 24 24"><path d="M2 12h4l2.5-6.5 4 13 2.5-6.5H22"/></svg>'}
];
var rail=$('rail');
VIEWS.forEach(function(v){
  var b=document.createElement('button');
  b.className='icorb'+(v.id===S.view?' active':'');
  b.style.setProperty('--ig',v.c);
  var rgb=v.c.replace('#','');
  var rr=parseInt(rgb.substr(0,2),16),gg=parseInt(rgb.substr(2,2),16),bb=parseInt(rgb.substr(4,2),16);
  b.style.setProperty('--igg','rgba('+rr+','+gg+','+bb+',.5)');
  b.innerHTML=v.icon+'<span class="nm">'+v.name+'</span>';
  b.setAttribute('aria-label',v.name);
  b.addEventListener('click',function(){setView(v.id);});
  b.dataset.view=v.id;
  rail.appendChild(b);
});
function setView(id){
  S.view=id;S.selected=null;$('detail').classList.remove('show');
  document.querySelectorAll('.icorb').forEach(function(b){
    b.classList.toggle('active',b.dataset.view===id);
  });
  var v=VIEWS.filter(function(x){return x.id===id;})[0];
  $('vtKicker').textContent=v.kick;$('vtName').textContent=v.name;
  $('tip').classList.remove('show');
}
var tip=$('tip');
function showTip(o,x,y){
  var a=o.a;
  tip.querySelector('.t-ico').innerHTML='<svg viewBox="0 0 24 24" style="stroke:'+specCSS(a.spec,.95)+'">'+a.icon.replace(/<svg[^>]*>|<\/svg>/g,'')+'</svg>';
  tip.querySelector('.t-name').textContent=a.name;
  tip.querySelector('.t-name').style.color=specCSS(a.spec,.95);
  tip.querySelector('.t-val').textContent=fmt(a.value);
  var ch=tip.querySelector('.t-chg');
  ch.textContent=(a.change>=0?'+':'')+a.change.toFixed(1)+'% this week · '+a.unit;
  ch.style.color=a.change>=0?'#2fe89e':'#ff5e6c';
  tip.querySelector('.t-h').textContent='HEALTH '+(a.health>=0?'+':'')+a.health.toFixed(1)+' · CLICK FOR DETAIL';
  tip.style.left=clamp(x+18,8,W-260)+'px';
  tip.style.top=clamp(y-20,8,H-140)+'px';
  tip.classList.add('show');
}
function openDetail(o){
  var a=o.a;S.selected=o;
  $('dIco').innerHTML='<svg viewBox="0 0 24 24" style="stroke:'+specCSS(a.spec,.95)+'">'+a.icon.replace(/<svg[^>]*>|<\/svg>/g,'')+'</svg>';
  $('dName').textContent=a.name;$('dName').style.color=specCSS(a.spec,.95);
  $('dCat').textContent=a.cat+' · WORLD '+(AREAS.indexOf(a)+1)+' / 20';
  $('dNum').textContent=fmt(a.value);$('dNum').style.textShadow='0 0 34px '+specCSS(a.spec,.45);
  $('dUnit').textContent=a.unit.toUpperCase()+' · THIS WEEK';
  var ch=$('dChg');
  ch.textContent=(a.change>=0?'▲ +':'▼ ')+a.change.toFixed(1)+'%';
  ch.className='d-chg '+(a.change>=0?'up':'dn');
  var f=$('dFill'),pct=Math.abs(a.health)/9*50;
  if(a.health>=0){f.style.left='50%';f.style.width=pct+'%';f.style.background='linear-gradient(90deg,'+specCSS(a.spec,.7)+','+specCSS(a.spec,1)+')';}
  else{f.style.left=(50-pct)+'%';f.style.width=pct+'%';f.style.background='linear-gradient(90deg,#e84fff,#a06bff)';}
  f.style.boxShadow='0 0 12px '+specCSS(a.spec,.6);
  $('dHval').textContent=(a.health>=0?'+':'')+a.health.toFixed(1)+' · '+healthWords(a.health).toUpperCase();
  $('dHval').style.color=specCSS(a.spec,.95);
  $('dSubs').innerHTML=a.subs.map(function(s){
    var w=Math.round(s[1]/a.maxSub*100);
    return '<div class="d-sub"><span class="s-n">'+s[0]+'</span>'+
      '<span class="s-v">'+fmt(s[1])+'</span></div>';
  }).join('');
  $('detail').classList.add('show');
  o.ignite=1;
  speakArea(a);
}
$('dClose').addEventListener('click',function(){
  S.selected=null;$('detail').classList.remove('show');
});

/* ---------- pointer ---------- */
var mouseX=-999,mouseY=-999;
cv.addEventListener('mousemove',function(e){
  var r=cv.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;
  if(S.view!=='orbit'){S.hovered=null;tip.classList.remove('show');return;}
  var hit=null;
  orbs.forEach(function(o){
    if(Math.hypot(mouseX-o.x,mouseY-o.y)<o.r+10)hit=o;
  });
  S.hovered=hit;
  if(hit)showTip(hit,mouseX,mouseY);else tip.classList.remove('show');
  cv.style.cursor=hit?'pointer':'crosshair';
});
cv.addEventListener('click',function(){
  if(S.view==='orbit'&&S.hovered)openDetail(S.hovered);
  else if(S.view==='orbit'){S.selected=null;$('detail').classList.remove('show');}
});
cv.addEventListener('mouseleave',function(){S.hovered=null;tip.classList.remove('show');});

/* ================= COMMAND BAR — "give me the stats on X" ================= */
function cmdSay(html){$('cmdOut').innerHTML=html;}
function findArea(q){
  q=q.toLowerCase().trim();
  var best=null,bestLen=0;
  AREAS.forEach(function(a){
    var words=a.name.toLowerCase().split(' ');
    var idw=a.id.toLowerCase();
    if(q.indexOf(idw)>=0&&idw.length>bestLen){best=a;bestLen=idw.length;}
    words.forEach(function(w){
      if(w.length>3&&q.indexOf(w)>=0&&w.length>bestLen){best=a;bestLen=w.length;}
    });
    // aliases
    var alias={iblocks:['block','blocks'],snotes:['note','notes'],conns:['connection','friend','network'],
      msgs:['message','chat','dm'],mail:['email','letter','inbox'],shares:['share'],
      comments:['comment','reply'],likes:['like','love'],notif:['notification','ping','alert'],
      saves:['save','bookmark','kept'],spaces:['space','room'],maxis:['maxi','score','assessment'],
      payouts:['payout','money','paid','earning'],refer:['referral','invite'],
      apps:['app'],comps:['component'],lessons:['lesson','course'],boards:['board'],
      remix:['remix'],drafts:['draft']};
    (alias[a.id]||[]).forEach(function(al){
      if(q.indexOf(al)>=0&&al.length>bestLen){best=a;bestLen=al.length;}
    });
  });
  return best;
}
function execute(raw){
  var q=(raw||'').trim();
  if(!q){cmdSay('<span class="wr">◈</span> ask me — <span class="q">"stats on connections"</span>');return;}
  var low=q.toLowerCase();
  if(/ledger/.test(low)){setView('ledger');cmdSay('<span class="ok">◈</span> the ledger — the running story, live');speak('the smart ledger. every action, flowing.');return;}
  if(/pulse|heartbeat/.test(low)){setView('pulse');cmdSay('<span class="ok">◈</span> network pulse — live');return;}
  if(/dial|health/.test(low)){setView('dial');cmdSay('<span class="ok">◈</span> health dial — every score, one instrument');return;}
  if(/everything|all|overview|my week|my stats|week/.test(low)){
    setView('orbit');S.selected=null;$('detail').classList.remove('show');
    cmdSay('<span class="ok">◈</span> '+fmt(TOTAL)+' signals across 20 worlds');
    speak('your network. '+numWords(TOTAL)+' signals across twenty worlds this week. '+
      numWords(AREAS.filter(function(a){return a.change>0;}).length)+' worlds rising.');
    return;
  }
  var a=findArea(low.replace(/^(give me |show me |get )?(the )?stats (on|of|for) /,''));
  if(a){
    setView('orbit');
    var o=orbs.filter(function(x){return x.a===a;})[0];
    if(o){o.ignite=1;openDetail(o);}
    cmdSay('<span class="ok">◈</span> '+a.name.toLowerCase()+' — '+fmt(a.value)+' '+a.unit);
  }else{
    cmdSay('<span class="wr">◈</span> I track 20 worlds — try <span class="q">"connections"</span>, <span class="q">"ledger"</span>, <span class="q">"my week"</span>');
  }
}
$('cmdGo').addEventListener('click',function(){execute($('cmdIn').value);$('cmdIn').value='';$('cmdIn').blur();});
$('cmdIn').addEventListener('keydown',function(e){
  if(e.key==='Enter'){execute(e.target.value);e.target.value='';e.target.blur();}
  if(e.key==='Escape'){e.target.blur();}
});
document.addEventListener('keydown',function(e){
  if(document.activeElement===$('cmdIn'))return;
  if(e.key==='/'){$('cmdIn').focus();e.preventDefault();}
  var map={'1':'orbit','2':'ledger','3':'dial','4':'pulse'};
  if(map[e.key])setView(map[e.key]);
  if(e.key==='Escape'){S.selected=null;$('detail').classList.remove('show');}
});

/* ================= MAIN LOOP · BOOT ================= */
var last=performance.now();
function frame(now){
  var dt=Math.min((now-last)/1000,0.05);last=now;S.t+=dt;
  S.beat=Math.max(0,S.beat-dt*2.2);
  S.voicePulse=Math.max(0,S.voicePulse-dt*3);
  drawBG(S.t);
  if(S.view==='orbit')drawOrbit(S.t);
  else if(S.view==='ledger')drawLedger(S.t);
  else if(S.view==='dial')drawDialView(S.t);
  else if(S.view==='pulse')drawPulse(S.t);
  if(!REDUCED)requestAnimationFrame(frame);
}
function boot(){
  if(REDUCED){
    $('boot').style.display='none';S.booted=true;frame(performance.now());return;
  }
  setTimeout(function(){
    $('boot').classList.add('gone');
    setTimeout(function(){$('boot').style.display='none';},1200);
    S.booted=true;requestAnimationFrame(frame);
    setTimeout(function(){
      speak('smart stats. twenty worlds, one living system. ask me for the stats on anything.');
    },1400);
  },2100);
}
boot();

/* test hook */
window.__ssn={S:S,AREAS:AREAS,orbs:orbs,setView:setView,execute:execute,findArea:findArea,specRGB:specRGB};
})();
</script>
