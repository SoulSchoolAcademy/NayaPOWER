<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Graphs — Five Instruments · Naya</title>
<!--
  ELITE GRAPHS — five reinvented chart types as full-screen instruments.
  No documentation. No paragraphs. The instrument IS the page.
  Dial-grade: full-bleed canvas, minimal chrome, living motion, real data.
-->
<style>
:root{
  --field:#040405; --ink:#f8f7fb; --quiet:#8f8a9e;
  --magenta:#e84fff; --purple:#a06bff; --blue:#3fb8ff; --green:#2fe89e; --gold:#ffbf3d;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--field);color:var(--ink);
  font-family:Manrope,Inter,ui-sans-serif,system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}
/* ---- chrome: whisper-quiet ---- */
.chrome{position:fixed;z-index:10;pointer-events:none}
header.chrome{top:22px;left:28px}
header.chrome .t{font-size:11px;font-weight:800;letter-spacing:.3em;color:var(--quiet)}
header.chrome .n{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
header.chrome .n em{font-style:normal;color:var(--purple)}
#src{bottom:24px;right:28px;font-size:9px;font-weight:700;letter-spacing:.2em;color:#4a4756;text-align:right}
/* ---- view dots ---- */
#dots{position:fixed;z-index:10;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;gap:14px;align-items:center}
.dot{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  background:rgba(10,11,16,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font:800 10px ui-monospace,monospace;color:#5c5866;transition:all .3s var(--ease);
  backdrop-filter:blur(6px)}
.dot:hover{border-color:rgba(255,255,255,.4);color:var(--ink)}
.dot.on{border-color:var(--sc,#a06bff);color:#fff;box-shadow:0 0 16px var(--scg,rgba(160,107,255,.35))}
.dot .k{pointer-events:none}
#fade{position:fixed;inset:0;background:#040405;z-index:5;pointer-events:none;opacity:0;transition:opacity .32s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="fade"></div>
<header class="chrome">
  <div class="t">ELITE GRAPHS</div>
  <div class="n" id="instName">Light Columns</div>
</header>
<div class="chrome" id="src">SOURCE · SYSTEM SCORECARD V1 · 2026-10-05</div>
<nav id="dots" aria-label="instruments"></nav>
<script>
(function(){
'use strict';
/* ================= UTILS ================= */
var SPEC=['#e84fff','#a06bff','#3fb8ff','#2fe89e','#ffbf3d'];
function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function specColor(t){
  t=Math.max(0,Math.min(1,t))*(SPEC.length-1);
  var i=Math.min(Math.floor(t),SPEC.length-2),f=t-i,a=hx(SPEC[i]),b=hx(SPEC[i+1]);
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';
}
function rgba(hex,a){var c=hx(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function parseCol(col){
  if(col.charAt(0)==='#')return hx(col);
  var m=col.match(/(\d+),\s*(\d+),\s*(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[255,255,255];
}
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var cv=document.getElementById('stage'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1;
function size(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
size();
function txt(s,x,y,size,color,align,weight,ls){
  ctx.font=(weight||600)+' '+size+'px Manrope,Inter,ui-sans-serif,system-ui';
  try{ctx.letterSpacing=(ls||'0')+'px';}catch(e){}
  ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillText(s,x,y);
  try{ctx.letterSpacing='0px';}catch(e){}
}
function mono(s,x,y,size,color,align,weight){
  ctx.font=(weight||700)+' '+size+'px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillText(s,x,y);
}
function catmull(pts,samples){
  var out=[];
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(var j=0;j<samples;j++){
      var t=j/samples,t2=t*t,t3=t2*t;
      out.push([
        0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
  out.push(pts[pts.length-1].slice());
  return out;
}
function tooltip(x,y,lines,accent){
  var w=0;ctx.font='700 13px ui-monospace,Menlo,monospace';
  lines.forEach(function(l){w=Math.max(w,ctx.measureText(l).width);});
  w+=28;var h=lines.length*22+18;
  var bx=Math.min(Math.max(x+18,10),W-w-10),by=Math.max(y-h-14,10);
  ctx.fillStyle='rgba(10,11,16,.94)';ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(bx,by,w,h,12);else ctx.rect(bx,by,w,h);
  ctx.fill();ctx.stroke();
  ctx.fillStyle=accent;ctx.fillRect(bx,by+10,3,h-20);
  lines.forEach(function(l,i){
    ctx.font=(i===0?'800':'600')+' '+(i===0?'12':'13')+'px '+(i===0?'Manrope,Inter,sans-serif':'ui-monospace,Menlo,monospace');
    ctx.fillStyle=i===0?accent:'#f8f7fb';ctx.textAlign='left';
    ctx.fillText(l,bx+16,by+26+i*22);
  });
}
/* ================= REAL DATA ================= */
var AREAS=[
 {n:'LEARNING', full:'Learning',              score:5.0, weight:15},
 {n:'TRUTH',    full:'Truth',                 score:8.5, weight:14},
 {n:'MEMORY',   full:'Memory & Continuity',   score:7.0, weight:12},
 {n:'HUMAN',    full:'Human Value',           score:7.0, weight:12},
 {n:'RETRIEVAL',full:'Cold Retrieval',        score:6.5, weight:10},
 {n:'ACTION',   full:'Action & Execution',    score:7.0, weight:10},
 {n:'AUTHORITY',full:'Authority & Governance',score:7.5, weight:9},
 {n:'SAFETY',   full:'Safety',                score:7.0, weight:8},
 {n:'VOICE',    full:'Voice & Experience',    score:7.5, weight:6},
 {n:'PROD',     full:'Production Readiness',  score:3.0, weight:4}
];
var POP=[[1960,3.0],[1970,3.7],[1980,4.4],[1990,5.3],[2000,6.1],[2010,7.0],[2020,7.9],[2025,8.2]];
var SRCS=[
 'SOURCE · SYSTEM SCORECARD V1 · RATIFIED 2026-10-05',
 'SOURCE · UN WORLD POPULATION PROSPECTS 2024 · BILLIONS',
 'SOURCE · SYSTEM SCORECARD V1 · AREA WEIGHTS SUM 100%',
 'SOURCE · SCORECARD V1 · X: WEIGHT % · Y: SCORE /10',
 'SOURCE · SCORECARD V1 · SCORE / WEIGHT / IMPACT'
];
/* ================= AMBIENT DUST — the air the instruments breathe ================= */
var DUST=[];
for(var di=0;di<90;di++){
  DUST.push({x:Math.random(),y:Math.random(),s:0.5+Math.random()*1.4,
    c:SPEC[di%5],ph:Math.random()*7,sp:0.004+Math.random()*0.012});
}
function dust(now){
  if(REDUCED)return;
  var t=now/1000;
  DUST.forEach(function(d){
    d.y-=d.sp/60;if(d.y<-0.02){d.y=1.02;d.x=Math.random();}
    var tw=0.25+0.35*Math.abs(Math.sin(t*0.7+d.ph));
    var c=parseCol(d.c);
    ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(tw*0.5).toFixed(3)+')';
    ctx.beginPath();ctx.arc(d.x*W,d.y*H,d.s,0,7);ctx.fill();
  });
}
/* ================= 01 · LIGHT COLUMNS ================= */
var LC={cols:[],mx:-1,my:-1,t0:0,hot:-1};
function lcReset(){LC.cols=AREAS.map(function(a,i){return {a:a,x:0,v:0,delay:i*110};});LC.t0=performance.now();}
function lcDraw(now){
  ctx.clearRect(0,0,W,H);
  var pad=90,n=AREAS.length,slot=(W-pad*2)/n,bw=Math.min(92,slot*0.5),
      base=H-150,top=140;
  function X(i){return pad+slot*i+slot/2;}
  function Y(s){return base-(s/10)*(base-top);}
  var t=now-LC.t0;
  // 9.0 floor
  var fy=Y(9);
  ctx.setLineDash([7,7]);ctx.strokeStyle='rgba(255,191,61,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad,fy);ctx.lineTo(W-pad,fy);ctx.stroke();ctx.setLineDash([]);
  txt('9.0 FLOOR',W-pad,fy-10,10,'rgba(255,191,61,.6)','right',800,'2');
  // gridlines
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
  [0,2,4,6,8,10].forEach(function(s){
    var y=Y(s);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();
    mono(s.toFixed(0),pad-14,y+4,11,'#5c5866','right');
  });
  var hot=-1;
  LC.cols.forEach(function(c,i){
    if(REDUCED){c.x=1;}else{
      var lt=Math.max(0,t-c.delay)/1000;
      if(lt>0){c.v+=(1-c.x)*0.055;c.v*=0.80;c.x+=c.v*1.6;if(c.x>1){c.x=1;c.v=0;}}
    }
    var cx=X(i),colH=(base-Y(c.a.score))*Math.max(0.001,c.x),colTop=base-colH;
    var edge=specColor(c.a.score/10);
    if(LC.mx>=0&&Math.abs(LC.mx-cx)<slot/2&&LC.my>top&&LC.my<base)hot=i;
    var isHot=(i===hot),bw2=bw/2;
    var bg=ctx.createLinearGradient(0,colTop,0,base);
    bg.addColorStop(0,'rgba(22,23,34,.95)');bg.addColorStop(1,'rgba(6,6,8,.95)');
    ctx.fillStyle=bg;ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(cx-bw2,colTop,bw,colH,[9,9,0,0]);else ctx.rect(cx-bw2,colTop,bw,colH);
    ctx.fill();
    ctx.strokeStyle=edge;ctx.globalAlpha=isHot?1:0.7;ctx.lineWidth=isHot?2.4:1.2;ctx.stroke();ctx.globalAlpha=1;
    if(c.x>0.5){
      ctx.save();ctx.shadowColor=edge;ctx.shadowBlur=isHot?22:12;
      ctx.strokeStyle='#fff';ctx.globalAlpha=0.9;ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(cx-bw2+4,colTop);ctx.lineTo(cx+bw2-4,colTop);ctx.stroke();
      ctx.restore();ctx.globalAlpha=1;
    }
    if(colH>10){
      var rg=ctx.createLinearGradient(0,base,0,base+44);
      rg.addColorStop(0,rgba('#a06bff',0.14));rg.addColorStop(1,'rgba(160,107,255,0)');
      ctx.fillStyle=rg;ctx.fillRect(cx-bw2,base+3,bw,42);
    }
    if(c.x>0.97)mono(c.a.score.toFixed(1),cx,colTop-16,16,isHot?'#fff':'#c9c4d4','center',800);
    txt(c.a.n,cx,base+30,10,isHot?'#f8f7fb':'#5c5866','center',800,'1');
  });
  LC.hot=hot;
  if(hot>=0){
    var a=AREAS[hot];
    tooltip(LC.mx,LC.my,[a.n,'score '+a.score.toFixed(1)+' / 10','weight '+a.weight+'% of total'],specColor(a.score/10));
  }
}
/* ================= 02 · THE CURRENT ================= */
var CU={mx:-1,my:-1,pts:[]};
function cuDraw(now){
  ctx.clearRect(0,0,W,H);
  var padL=70,padR=60,padT=150,padB=170;
  var xs=POP.map(function(p){return p[0];});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),ymax=9;
  function X(v){return padL+(v-x0)/(x1-x0)*(W-padL-padR);}
  function Y(v){return H-padB-(v/ymax)*(H-padT-padB);}
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
  [0,3,6,9].forEach(function(v){
    var y=Y(v);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    mono(v.toFixed(0)+'B',padL-12,y+4,11,'#5c5866','right');
  });
  var pts=POP.map(function(p){return [X(p[0]),Y(p[1])];});
  CU.pts=pts;var P=catmull(pts,28);
  var mg=ctx.createLinearGradient(0,padT,0,H-padB);
  mg.addColorStop(0,'rgba(63,184,255,.10)');mg.addColorStop(1,'rgba(63,184,255,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);
  P.forEach(function(p){ctx.lineTo(p[0],p[1]);});
  ctx.lineTo(P[P.length-1][0],H-padB);ctx.lineTo(P[0][0],H-padB);ctx.closePath();ctx.fill();
  function pass(lw,alpha){
    for(var i=1;i<P.length;i++){
      ctx.strokeStyle=specColor(i/P.length);ctx.globalAlpha=alpha;ctx.lineWidth=lw;
      ctx.lineCap='round';ctx.beginPath();ctx.moveTo(P[i-1][0],P[i-1][1]);ctx.lineTo(P[i][0],P[i][1]);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  pass(11,0.10);pass(4,0.45);pass(1.8,0.95);
  if(!REDUCED){
    var s=((now/8000)%1),idx=Math.floor(s*(P.length-1)),cp=P[idx];
    for(var k=24;k>0;k--){
      var pi=Math.max(0,idx-k),pp=P[pi];
      ctx.fillStyle=specColor(pi/P.length);ctx.globalAlpha=0.35*(1-k/26);
      ctx.beginPath();ctx.arc(pp[0],pp[1],3.6*(1-k/30),0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
    var cg=ctx.createRadialGradient(cp[0],cp[1],0,cp[0],cp[1],20);
    cg.addColorStop(0,'rgba(255,255,255,.95)');cg.addColorStop(0.4,specColor(s));cg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cp[0],cp[1],20,0,7);ctx.fill();
  }
  var hot=-1;
  pts.forEach(function(p,i){
    var d=CU.mx>=0?Math.hypot(CU.mx-p[0],CU.my-p[1]):1e9;
    if(d<18)hot=i;
    var on=(i===hot);
    ctx.save();if(on){ctx.shadowColor=specColor(i/(pts.length-1));ctx.shadowBlur=16;}
    ctx.fillStyle=on?'#fff':specColor(i/(pts.length-1));
    ctx.beginPath();ctx.arc(p[0],p[1],on?5.5:3,0,7);ctx.fill();ctx.restore();
    txt(String(POP[i][0]),p[0],H-padB+28,11,on?'#f8f7fb':'#5c5866','center',700,'1');
  });
  if(hot>=0){
    tooltip(CU.mx,CU.my,[String(POP[hot][0]),POP[hot][1].toFixed(1)+' billion people'],specColor(hot/(pts.length-1)));
    mono(POP[hot][1].toFixed(1)+'B',pts[hot][0],pts[hot][1]-22,18,'#fff','center',800);
  }
}
/* ================= 03 · ORBITAL SHARES ================= */
var OS={mx:-1,my:-1};
function osDraw(now){
  ctx.clearRect(0,0,W,H);
  var cx=W/2,cy=H/2,R=Math.min(W,H)/2-70;
  var inner=AREAS.filter(function(a){return a.weight>=10;});
  var outer=AREAS.filter(function(a){return a.weight<10;});
  ctx.strokeStyle='rgba(255,255,255,.09)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,R*0.55,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R*0.92,0,7);ctx.stroke();
  var sg=ctx.createRadialGradient(cx-18,cy-22,6,cx,cy,72);
  sg.addColorStop(0,'#1c1d28');sg.addColorStop(0.7,'#0a0b10');sg.addColorStop(1,'#050507');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,68,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.4;ctx.stroke();
  mono('100',cx,cy+4,32,'#f8f7fb','center',800);
  txt('WEIGHT %',cx,cy+32,10,'#8f8a9e','center',800,'2');
  var t=REDUCED?0:now/1000,hot=null;
  function ring(list,rad,speed,phase){
    list.forEach(function(a,idx){
      var i=AREAS.indexOf(a);
      var ang=phase+idx/list.length*Math.PI*2+t*speed;
      var bx=cx+Math.cos(ang)*rad,by=cy+Math.sin(ang)*rad*0.94;
      var br=10+a.weight*1.1,col=specColor(i/(AREAS.length-1));
      var d=OS.mx>=0?Math.hypot(OS.mx-bx,OS.my-by):1e9;
      var on=d<br+12;if(on)hot={a:a,col:col,x:bx,y:by};
      var bgr=ctx.createRadialGradient(bx-br*0.35,by-br*0.4,br*0.1,bx,by,br);
      bgr.addColorStop(0,'#252630');bgr.addColorStop(0.65,'#0c0d13');bgr.addColorStop(1,'#050507');
      ctx.fillStyle=bgr;ctx.beginPath();ctx.arc(bx,by,br,0,7);ctx.fill();
      ctx.save();
      if(on){ctx.shadowColor=col;ctx.shadowBlur=24;}
      ctx.strokeStyle=col;ctx.globalAlpha=on?1:0.8;ctx.lineWidth=on?2.4:1.4;ctx.stroke();
      ctx.restore();ctx.globalAlpha=1;
      ctx.fillStyle=col;ctx.globalAlpha=0.9;
      ctx.beginPath();ctx.arc(bx-br*0.3,by-br*0.35,Math.max(2.4,br*0.16),0,7);ctx.fill();
      ctx.globalAlpha=1;
      mono(String(a.weight),bx,by+5,Math.max(11,br*0.5),'#f8f7fb','center',800);
      var la=Math.atan2(by-cy,bx-cx);
      txt(a.n,bx+Math.cos(la)*(br+18),by+Math.sin(la)*(br+18)+4,10,on?'#f8f7fb':'rgba(143,138,158,.75)','center',800,'1');
    });
  }
  ring(inner,R*0.55,0.05,0.4);
  ring(outer,R*0.92,-0.032,1.2);
  if(hot)tooltip(OS.mx,OS.my,[hot.a.n.toUpperCase(),hot.a.weight+'% of total score',hot.a.full],hot.col);
}
/* ================= 04 · THE FIELD ================= */
var FD={mx:-1,my:-1,stars:[]};
function fdDraw(){
  ctx.clearRect(0,0,W,H);
  var padL=80,padR=70,padT=130,padB=130;
  function X(w){return padL+(w/16)*(W-padL-padR);}
  function Y(s){return H-padB-(s/10)*(H-padT-padB);}
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(padL,padT-10);ctx.lineTo(padL,H-padB);ctx.lineTo(W-padR,H-padB);ctx.stroke();
  for(var wv=0;wv<=16;wv+=4)mono(wv+'%',X(wv),H-padB+28,11,'#5c5866','center');
  for(var sv=0;sv<=10;sv+=2)mono(sv.toFixed(0),padL-14,Y(sv)+5,11,'#5c5866','right');
  txt('WEIGHT →',(W+padL)/2,H-60,11,'#5c5866','center',800,'2');
  txt('SCORE →',26,(H+padT)/2,11,'#5c5866','center',800,'2');
  var n=AREAS.length,sx=0,sy=0,sxx=0,sxy=0;
  AREAS.forEach(function(x){sx+=x.weight;sy+=x.score;sxx+=x.weight*x.weight;sxy+=x.weight*x.score;});
  var slope=(n*sxy-sx*sy)/(n*sxx-sx*sx),icept=(sy-slope*sx)/n;
  var x0=0,x1=16,y0v=slope*x0+icept,y1v=slope*x1+icept;
  var m=sy/n,ss=0,rr=0;
  AREAS.forEach(function(x){ss+=(x.score-m)*(x.score-m);var f=slope*x.weight+icept;rr+=(x.score-f)*(x.score-f);});
  var r2=1-rr/ss;
  [[9,0.07],[3.6,0.2],[1.6,0.85]].forEach(function(p){
    var bg=ctx.createLinearGradient(X(x0),Y(y0v),X(x1),Y(y1v));
    bg.addColorStop(0,'rgba(255,191,61,0)');bg.addColorStop(0.5,'rgba(255,220,150,'+p[1]+')');bg.addColorStop(1,'rgba(255,191,61,0)');
    ctx.strokeStyle=bg;ctx.lineWidth=p[0];ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(X(x0),Y(y0v));ctx.lineTo(X(x1),Y(y1v));ctx.stroke();
  });
  mono('r = '+r2.toFixed(2),X(12.6),Y(slope*12.6+icept)-30,13,'rgba(255,220,150,.75)','center',700);
  FD.stars=AREAS.map(function(x){return {a:x,x:X(x.weight),y:Y(x.score)};});
  FD.stars.forEach(function(s,idx){
    var dens=0;
    FD.stars.forEach(function(o){if(Math.hypot(s.x-o.x,s.y-o.y)<90)dens++;});
    var col=specColor(idx/(AREAS.length-1)),c=parseCol(col);
    var ng=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,58);
    ng.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.05+0.04*dens)+')');
    ng.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    ctx.fillStyle=ng;ctx.beginPath();ctx.arc(s.x,s.y,58,0,7);ctx.fill();
  });
  var hot=-1;
  FD.stars.forEach(function(s,idx){
    var col=specColor(idx/(AREAS.length-1));
    var d=FD.mx>=0?Math.hypot(FD.mx-s.x,FD.my-s.y):1e9;
    var on=d<16;if(on)hot=idx;
    ctx.save();if(on){ctx.shadowColor=col;ctx.shadowBlur=18;}
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(s.x,s.y,on?8:5.5,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,1.8,0,7);ctx.fill();
    ctx.restore();
    txt(s.a.n,s.x+12,s.y-10,10,on?'#f8f7fb':'rgba(143,138,158,.7)','left',800,'1');
  });
  if(hot>=0){
    var s=FD.stars[hot];
    ctx.strokeStyle='rgba(255,255,255,.2)';ctx.setLineDash([5,5]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,H-padB);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(padL,s.y);ctx.stroke();
    ctx.setLineDash([]);
    tooltip(FD.mx,FD.my,[s.a.n,s.a.full,'weight '+s.a.weight+'% · score '+s.a.score.toFixed(1)],specColor(hot/(AREAS.length-1)));
  }
}
/* ================= 05 · SPECTRUM BANDS ================= */
var SB={mx:-1,my:-1,isolate:-1,series:[],chips:[],chipHover:-1};
function sbInit(){
  var maxC=0;
  AREAS.forEach(function(a){maxC=Math.max(maxC,a.score*a.weight/100);});
  SB.series=[
    {name:'SCORE', color:'#3fb8ff', vals:AREAS.map(function(a){return a.score/10;})},
    {name:'WEIGHT',color:'#a06bff', vals:AREAS.map(function(a){return a.weight/16;})},
    {name:'IMPACT',color:'#ffbf3d', vals:AREAS.map(function(a){return (a.score*a.weight/100)/maxC;})}
  ];
}
function sbDraw(){
  ctx.clearRect(0,0,W,H);
  var padL=70,padR=60,padT=150,padB=140,n=AREAS.length;
  function X(i){return padL+(i/(n-1))*(W-padL-padR);}
  function Y(v){return H-padB-v*(H-padT-padB);}
  SB.chips=[];
  var chx=padL;
  SB.series.forEach(function(s,si){
    ctx.font='800 11px Manrope,Inter,sans-serif';
    var w=ctx.measureText(s.name).width+34;
    var active=(SB.isolate===-1||SB.isolate===si);
    ctx.fillStyle=SB.isolate===si?'rgba(255,255,255,.10)':'rgba(255,255,255,.03)';
    ctx.strokeStyle=active?s.color:'rgba(255,255,255,.14)';ctx.lineWidth=1;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(chx,86,w,30,15);else ctx.rect(chx,86,w,30);
    ctx.fill();ctx.stroke();
    ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(chx+15,101,4.5,0,7);ctx.fill();
    txt(s.name,chx+25,105,11,active?'#f8f7fb':'#5c5866','left',800,'1');
    SB.chips.push({x:chx,y:86,w:w,h:30});
    chx+=w+12;
  });
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
  [0,0.5,1].forEach(function(v){
    ctx.beginPath();ctx.moveTo(padL,Y(v));ctx.lineTo(W-padR,Y(v));ctx.stroke();
    mono(Math.round(v*100)+'%',padL-12,Y(v)+4,11,'#5c5866','right');
  });
  var order=[2,1,0];
  order.forEach(function(si){
    var s=SB.series[si];
    var dim=(SB.isolate!==-1&&SB.isolate!==si);
    var pts=AREAS.map(function(a,i){return [X(i),Y(s.vals[i])];});
    var P=catmull(pts,20);
    var baseA=dim?0.008:(SB.isolate===si?0.09:0.035);
    var fg=ctx.createLinearGradient(0,padT,0,H-padB);
    var c=parseCol(s.color);
    fg.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+baseA+')');
    fg.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    ctx.fillStyle=fg;
    ctx.beginPath();ctx.moveTo(P[0][0],H-padB);
    P.forEach(function(p){ctx.lineTo(p[0],p[1]);});
    ctx.lineTo(P[P.length-1][0],H-padB);ctx.closePath();ctx.fill();
    ctx.strokeStyle=s.color;ctx.globalAlpha=dim?0.12:(SB.isolate===si?1:0.75);
    ctx.lineWidth=SB.isolate===si?2.6:1.6;ctx.lineJoin='round';
    ctx.beginPath();P.forEach(function(p,j){if(j===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);});ctx.stroke();
    ctx.globalAlpha=1;
  });
  var hot=-1,best=1e9;
  AREAS.forEach(function(a,i){
    var d=SB.mx>=0?Math.abs(SB.mx-X(i)):1e9;
    if(d<best){best=d;hot=i;}
    txt(a.n,X(i),H-padB+30,10,(i===hot&&SB.mx>=0)?'#f8f7fb':'#5c5866','center',800,'1');
  });
  if(SB.mx>=0&&best<(W-padL-padR)/n){
    var hx0=X(hot);
    ctx.strokeStyle='rgba(255,255,255,.22)';ctx.setLineDash([5,5]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(hx0,padT);ctx.lineTo(hx0,H-padB);ctx.stroke();ctx.setLineDash([]);
    SB.series.forEach(function(s){
      var y=Y(s.vals[hot]);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx0,y,4,0,7);ctx.fill();
      ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(hx0,y,2.2,0,7);ctx.fill();
    });
    var a=AREAS[hot];
    tooltip(SB.mx,SB.my,[a.n,a.full,
      'score '+(SB.series[0].vals[hot]*10).toFixed(1)+' · weight '+a.weight+'%',
      'impact '+(SB.series[2].vals[hot]*100).toFixed(0)+'% of max'],'#a06bff');
  }
}
/* ================= VIEW MANAGER ================= */
var VIEWS=[
 {id:'columns', name:'Light Columns', draw:lcDraw, reset:lcReset, c:'#e84fff', g:'rgba(232,79,255,.4)'},
 {id:'current', name:'The Current',   draw:cuDraw, reset:null,    c:'#3fb8ff', g:'rgba(63,184,255,.4)'},
 {id:'orbital', name:'Orbital Shares',draw:osDraw, reset:null,    c:'#a06bff', g:'rgba(160,107,255,.4)'},
 {id:'field',   name:'The Field',     draw:fdDraw, reset:null,    c:'#2fe89e', g:'rgba(47,232,158,.4)'},
 {id:'bands',   name:'Spectrum Bands',draw:sbDraw, reset:null,    c:'#ffbf3d', g:'rgba(255,191,61,.4)'}
];
var cur=0,fadeEl=document.getElementById('fade');
var dotsEl=document.getElementById('dots');
VIEWS.forEach(function(v,i){
  var b=document.createElement('button');
  b.className='dot'+(i===0?' on':'');
  b.innerHTML='<span class="k">'+(i+1)+'</span>';
  b.style.setProperty('--sc',v.c);b.style.setProperty('--scg',v.g);
  b.setAttribute('aria-label',v.name);
  b.addEventListener('click',function(){setView(i);});
  dotsEl.appendChild(b);
});
function setView(i){
  if(i===cur||i<0||i>=VIEWS.length)return;
  fadeEl.style.opacity='1';
  setTimeout(function(){
    cur=i;
    if(VIEWS[cur].reset)VIEWS[cur].reset();
    document.getElementById('instName').innerHTML=VIEWS[cur].name.replace(' ',' <em>·</em> ');
    document.getElementById('src').textContent=SRCS[cur];
    dotsEl.querySelectorAll('.dot').forEach(function(d,j){d.classList.toggle('on',j===cur);});
    fadeEl.style.opacity='0';
  },320);
}
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);
  if(n>=1&&n<=5)setView(n-1);
});
/* pointer routing */
function route(e){
  var r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
cv.addEventListener('mousemove',function(e){
  var p=route(e),v=VIEWS[cur].id;
  if(v==='columns'){LC.mx=p.x;LC.my=p.y;}
  else if(v==='current'){CU.mx=p.x;CU.my=p.y;}
  else if(v==='orbital'){OS.mx=p.x;OS.my=p.y;}
  else if(v==='field'){FD.mx=p.x;FD.my=p.y;}
  else if(v==='bands'){
    SB.mx=p.x;SB.my=p.y;SB.chipHover=-1;cv.style.cursor='crosshair';
    SB.chips.forEach(function(ch,si){
      if(p.x>ch.x&&p.x<ch.x+ch.w&&p.y>ch.y&&p.y<ch.y+ch.h){SB.chipHover=si;cv.style.cursor='pointer';}
    });
  }
});
cv.addEventListener('mouseleave',function(){
  LC.mx=-1;CU.mx=-1;OS.mx=-1;FD.mx=-1;SB.mx=-1;SB.chipHover=-1;cv.style.cursor='crosshair';
});
cv.addEventListener('click',function(){
  if(VIEWS[cur].id==='bands'&&SB.chipHover>=0)
    SB.isolate=(SB.isolate===SB.chipHover?-1:SB.chipHover);
});
/* ================= MASTER LOOP ================= */
sbInit();lcReset();
document.getElementById('instName').innerHTML='Light <em>·</em> Columns';
if(REDUCED){
  VIEWS.forEach(function(v){if(v.reset)v.reset();});
  var t=performance.now()+10000;
  VIEWS.forEach(function(v){ctx.save();v.draw(t);ctx.restore();});
  VIEWS[0].draw(t);
}else{
  (function frame(now){
    requestAnimationFrame(frame);
    dust(now);
    VIEWS[cur].draw(now);
  })(performance.now());
}
window.addEventListener('resize',size);
})();
</script>
