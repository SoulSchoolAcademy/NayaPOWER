<!doctype html>
<html lang="en">
  <body style="margin:0;background:#05050a;color:#fff;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:40px auto;padding:36px;border:1px solid #7c3aed;border-radius:24px;background:#0b0b12">
      <h1 style="margin:0 0 12px">NayaNET verification</h1>
      <p style="color:#cbd5e1">Your six-digit code is:</p>
      <div style="font-size:40px;font-weight:900;letter-spacing:10px;margin:20px 0;color:#a855f7">{{ .Token }}</div>
      <p style="color:#cbd5e1">Click the button below. It opens the NayaNET verification page where you can enter this code.</p>
      <p><a href="{{ .RedirectTo }}" style="display:inline-block;padding:14px 22px;border-radius:999px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:800">OPEN NAYANET & ENTER CODE</a></p>
      <p style="font-size:12px;color:#94a3b8">This email contains a one-time code. Never share it with anyone.</p>
    </div>
  </body>
</html>
