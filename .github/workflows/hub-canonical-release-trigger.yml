# TRIGGER-ONLY ADAPTER — no deployment logic lives here.
# The sole production deployment implementation is deploy-nayanet-hub-canonical-v2.yml.
# This adapter intentionally runs on canonical Hub source changes so every product change receives the full build/deploy/runtime proof chain.
name: Trigger Canonical NayaNET Hub Release

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - '.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
      - '.github/workflows/hub-canonical-release-trigger.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'NAYANET/HUB/**'
      - '.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
      - '.github/workflows/hub-canonical-release-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-release:
    uses: ./.github/workflows/deploy-nayanet-hub-canonical-v2.yml
    secrets: inherit
