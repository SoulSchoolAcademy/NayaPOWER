name: NayaNET Canonical Smart Board Repair

on:
  push:
    branches:
      - naya-smartboard-canonical-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize canonical Smart Boards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          labels=r'(?:IN A NUTSHELL|HUMAN NOTE|CHILD NOTE|GRANDMA NOTE|NAYA NOTE|MACHINE NOTE|LEARNING LESSON|WHAT IT MEANS|WHAT[’\']S IN IT FOR YOU)'

          # Normalize legacy visible labels first.
          s=re.sub(r'(?i)(>\s*)ADAPTIVE LEARNING(?:\s+LEARNING)?(\s*<)', r'\1LEARNING LESSON\2', s)
          s=re.sub(r'(?i)(>\s*)WHAT(?:\s+IS|\s+\'S|\s+’S)\s+IN\s+IT\s+FOR\s+YOU\??(\s*<)', r'\1WHAT\'S IN IT FOR YOU\2', s)

          # Layer headings are the only place where a numeric prefix is a label prefix.
          # Strip standalone 1–9 text whether it is plain text or isolated in a span,
          # while leaving legitimate numbers in the board content untouched.
          head=re.compile(r'(<[^>]*class=["\'][^"\']*layerHead[^"\']*["\'][^>]*>.*?</[^>]+>)', re.I|re.S)
          def clean_head(m):
              h=m.group(1)
              h=re.sub(r'(?is)(<span\b[^>]*>\s*)[1-9]\s*(?:[·•.\-:]\s*)?(\s*</span>)', r'\1\2', h)
              h=re.sub(r'(?is)(>\s*)[1-9]\s*(?:[·•.\-:]\s*)?(?=(?:<[^>]+>\s*)*(?:'+labels+r')\b)', r'\1', h)
              h=re.sub(r'(?is)(>\s*)[1-9]\s+(?=(?:'+labels+r')\b)', r'\1', h)
              return h
          s=head.sub(clean_head,s)

          # Final direct-text cleanup for any remaining label prefixes.
          s=re.sub(r'(?i)(>\s*)[1-9]\s*[·•.\-:]\s*('+labels+r')(?=\s*<)', r'\1\2', s)
          s=re.sub(r'(?i)(>\s*)[1-9]\s+((?:HUMAN NOTE|CHILD NOTE|GRANDMA NOTE|NAYA NOTE|MACHINE NOTE|LEARNING LESSON|WHAT IT MEANS))(?=\s*<)', r'\1\2', s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Structural verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('2026 09 15 NayaNETHUB.html').read_text(encoding='utf-8')
          required=['IN A NUTSHELL','HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS',"WHAT'S IN IT FOR YOU"]
          for x in required:
            n=len(re.findall(re.escape(x),s,re.I))
            print(x,n)
            if n < 1: raise SystemExit('Missing canonical layer: '+x)
          heads=re.findall(r'<[^>]*class=["\'][^"\']*layerHead[^"\']*["\'][^>]*>.*?</[^>]+>',s,re.I|re.S)
          for h in heads:
            if re.search(r'(?is)>\s*[1-9]\s*(?:[·•.\-:]\s*)?(?:<[^>]+>\s*)*(?:IN A NUTSHELL|HUMAN NOTE|CHILD NOTE|GRANDMA NOTE|NAYA NOTE|MACHINE NOTE|LEARNING LESSON|WHAT IT MEANS|WHAT[’\']S IN IT FOR YOU)\b',h):
              raise SystemExit('Visible numeric layer prefix remains')
          print('Canonical label verification passed.')
          PY

      - name: Commit verified source
        run: |
          git config user.name 'NayaNET Canonical Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Normalize Smart Boards to canonical nine-layer structure'; fi
          git push origin HEAD
