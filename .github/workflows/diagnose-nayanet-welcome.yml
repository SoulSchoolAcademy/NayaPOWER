name: Diagnose NayaNET Welcome Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-nayanet-welcome.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect production Welcome
        run: |
          node <<'NODE'
          const {chromium}=await import('playwright');
          const b=await chromium.launch({headless:true});
          const p=await b.newPage();
          await p.goto('https://welcome.nayanet.app',{waitUntil:'networkidle',timeout:60000});
          const data=await p.evaluate(()=>({
            url:location.href,
            title:document.title,
            inputs:[...document.querySelectorAll('input')].map(x=>({id:x.id,name:x.name,type:x.type,placeholder:x.placeholder,autocomplete:x.autocomplete})),
            buttons:[...document.querySelectorAll('button')].map(x=>({id:x.id,text:x.innerText.trim()})),
            forms:[...document.querySelectorAll('form')].map(x=>({id:x.id,action:x.action,method:x.method})),
            scripts:[...document.scripts].map(x=>x.src).filter(Boolean),
            body:document.body.innerText.slice(0,4000)
          }));
          const frame = p.frames().find(f => f.url().includes('shiny-wave-dd48.nayanet.workers.dev'));
          if (!frame) throw new Error('WELCOME_EMBEDDED_WORKER_NOT_FOUND');
          await frame.locator('#userName').fill('Naya Public Proof');
          await frame.locator('#entryForm button[type="submit"]').click();
          await frame.waitForURL(/\/identity\?name=Naya%20Public%20Proof/,{timeout:30000});
          const identity = await frame.evaluate(() => ({
            url:location.href,
            title:document.title,
            hasAlias:!!document.querySelector('#aliasInput'),
            activateTarget:String(window.activateAndRedirect).includes('academy.nayanet.app'),
            usesSupabase:document.documentElement.innerHTML.includes('supabase')
          }));
          console.log(JSON.stringify({...data,public_welcome_interaction:identity},null,2));
          await b.close();
          NODE
