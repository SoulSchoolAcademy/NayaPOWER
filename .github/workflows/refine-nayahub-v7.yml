name: Refine NayaNET Intelligent Hub V7 — Retired

# Historical PR mutator retained as a record only. It must not rewrite PR branches.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Assert current Hub ownership
        run: |
          set -euo pipefail
          test -d NAYANET/HUB
          test -f .github/workflows/deploy-nayanet-hub-canonical-v2.yml
          echo 'LEGACY_V7_PR_REFINEMENT=RETIRED'
          echo 'CURRENT_HUB_SOURCE=NAYANET/HUB'
          echo 'CURRENT_PUBLIC_DEPLOYMENT=.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
          echo 'RULE=NO_AUTOMATIC_PR_MUTATION'
