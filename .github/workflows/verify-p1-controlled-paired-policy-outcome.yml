name: Verify P1 Controlled Paired Policy Outcome

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run-controlled-paired-policy-experiment.mjs'
      - 'supabase/migrations/20260919003748_require_authority_grant_for_controlled_test_202609190001.sql'
      - 'supabase/migrations/20260919004500_p1_receiver_response_outcome_v2.sql'
      - '.github/workflows/verify-p1-controlled-paired-policy-outcome.yml'

permissions:
  contents: read

jobs:
  controlled-paired:
    name: Real V1/V2 paired Smart Mail outcome experiment
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase JS
        run: npm install --no-save @supabase/supabase-js@2.57.0

      - name: Execute controlled paired experiment
        run: |
          export RECEIPT_PATH="$RUNNER_TEMP/p1-controlled-paired-policy-receipt.json"
          node scripts/run-controlled-paired-policy-experiment.mjs

      - name: Validate machine receipt
        run: |
          test -s "$RUNNER_TEMP/p1-controlled-paired-policy-receipt.json"
          node -e "const r=require(process.argv[1]); if(!['PROVEN','NOT_PROVEN','POLICY_IMPROVEMENT_NOT_PROVEN'].includes(r.status)) throw new Error('unexpected result'); if(!r.aggregate||typeof r.aggregate.baseline_verified_value==='undefined'||typeof r.aggregate.candidate_verified_value==='undefined') throw new Error('aggregate result missing'); if(r.status==='PROVEN' && !(r.aggregate.candidate_verified_value>r.aggregate.baseline_verified_value && r.learning?.future_behavior_changed===true && r.future_behavior?.result==='POLICY_IMPROVEMENT_PROVEN')) throw new Error('proven result missing future learning improvement'); if(r.adversarial?.receipt_swap_rejected!==true) throw new Error('adversarial lineage gate missing'); if(r.adversarial?.revocation_denial_proven!==true) throw new Error('revocation denial gate missing');" "$RUNNER_TEMP/p1-controlled-paired-policy-receipt.json"

      - name: Upload canonical machine receipt
        uses: actions/upload-artifact@v4
        with:
          name: p1-controlled-paired-policy-receipt
          path: ${{ runner.temp }}/p1-controlled-paired-policy-receipt.json
          retention-days: 30

# learning-level retry: canonical E6_RETAINED / VERIFICATION provenance / evaluation type
