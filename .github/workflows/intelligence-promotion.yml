name: Naya Intelligence — Lesson Promotion

# Canonical pipeline: activity → intelligence → learning → evidence → feed.
# Generated projections remain idempotent, but persistent intelligence mutation
# is consequential and therefore requires explicit workflow authorization and
# the canonical NayaPOWER governance kernel.

on:
  push:
    branches: [main]
    paths:
      - 'MASTER-NOTES/INTELLIGENCE-EVENTS/**'
      - '.naya/intelligence/**'
      - 'tools/promote_intelligence.py'
      - 'tools/test_promote_intelligence.py'
      - 'tools/adaptive_learning.py'
      - 'tools/test_adaptive_learning.py'
      - 'tools/compound_intelligence.py'
      - 'tools/test_compound_intelligence.py'
      - '.github/workflows/intelligence-promotion.yml'
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit authorization to persist promoted intelligence state
        required: true
        type: choice
        options:
          - EXPLICIT_APPROVAL_GRANTED
          - DENY

permissions:
  contents: write

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.approval == 'EXPLICIT_APPROVAL_GRANTED'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce canonical NayaPOWER governance kernel
        shell: bash
        run: |
          set -euo pipefail
          python .naya/control-plane/workflow_gate.py \
            --actor "${{ github.actor }}" \
            --purpose "intelligence-promotion-repository-mutation" \
            --permission "repo:write:intelligence-promotion" \
            --request "promote:persistent-intelligence-state" \
            --mission "Persist verified compounding intelligence projections without silently inheriting authority" \
            --uncertainty 3 \
            --consequence 4 \
            --irreversibility 3 \
            --scope '{"repository":"SoulSchoolAcademy/NayaPOWER","paths":["MASTER-NOTES/ADAPTIVE-LEARNING","MASTER-NOTES/INTELLIGENCE-PROMOTIONS","MASTER-NOTES/NAYA-NOTES","MASTER-NOTES/SHAWN-NOTES","MASTER-NOTES/INTELLIGENCE-FEED","MASTER-NOTES/PRIMARY-INTELLIGENCE-HUB.md"],"operation":"write-and-push"}' \
            --evidence "explicit workflow_dispatch approval granted" \
            --evidence "promotion acceptance tests required"

      - name: Run Promotion Engine acceptance tests
        run: python3 tools/test_promote_intelligence.py

      - name: Run Adaptive Learning acceptance tests
        run: python3 tools/test_adaptive_learning.py

      - name: Run Compounding Intelligence bridge acceptance tests
        run: python3 tools/test_compound_intelligence.py

      - name: Build compounding learning projections
        run: python3 tools/compound_intelligence.py

      - name: Validate, deduplicate, classify, and promote intelligence events
        run: python3 tools/promote_intelligence.py

      - name: Verify generated promotion state is structurally valid
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('MASTER-NOTES/INTELLIGENCE-PROMOTIONS/LATEST-PROMOTION-RECEIPT.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['engine'] == 'Promotion Engine v1'
          assert data['event_count'] == len(data['receipts'])
          assert all('event_id' in r and 'promotion_status' in r for r in data['receipts'])
          assert data['verification_summary']['verified'] is False
          print(f"PASS receipt integrity: {data['event_count']} event(s)")
          PY

      - name: Commit complete promotion state when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            MASTER-NOTES/ADAPTIVE-LEARNING \
            MASTER-NOTES/INTELLIGENCE-PROMOTIONS \
            MASTER-NOTES/NAYA-NOTES \
            MASTER-NOTES/SHAWN-NOTES \
            MASTER-NOTES/INTELLIGENCE-FEED \
            MASTER-NOTES/PRIMARY-INTELLIGENCE-HUB.md; then
            echo "No generated intelligence state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            MASTER-NOTES/ADAPTIVE-LEARNING \
            MASTER-NOTES/INTELLIGENCE-PROMOTIONS \
            MASTER-NOTES/NAYA-NOTES \
            MASTER-NOTES/SHAWN-NOTES \
            MASTER-NOTES/INTELLIGENCE-FEED \
            MASTER-NOTES/PRIMARY-INTELLIGENCE-HUB.md
          git diff --cached --check
          git commit -m "chore(intelligence): persist compounding learning state"
          git push
