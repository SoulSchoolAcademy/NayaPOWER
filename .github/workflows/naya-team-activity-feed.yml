name: Naya Team Activity Feed

on:
  workflow_run:
    workflows:
      - Verify P1 Controlled Paired Policy Outcome
      - Verify Naya Superbrain Ready
      - Verify Team Naya Communication
      - Verify Execution Team Activity Bridge
      - Verify Smart Note Transaction
      - Verify Smart Note E2E Isolated
      - Golden Journey
      - Verify PIS
      - Verify Two User Owner Isolation
      - Verify Authority Grant Runtime
      - Verify NayaNET Name-First Lifecycle
      - Verify NayaNET Name-First Auth
      - Assistant Cloudflare Authenticated Proof
      - Assistant Cloudflare Hub Release
      - Verify Production Closure
    types: [completed]

permissions:
  contents: read

jobs:
  record:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish automatic activity receipt to the run summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion || 'unknown';
            const status = conclusion === 'success' ? 'PASS' : conclusion === 'failure' ? 'FAIL' : conclusion.toUpperCase();
            const sha = run.head_sha;
            const completed = run.updated_at || new Date().toISOString();
            const summary = [
              '# TEAM NAYA AUTOMATIC ACTIVITY RECEIPT',
              '',
              `**Workflow:** ${run.name}`,
              `**Result:** **${status}**`,
              `**Run:** ${run.html_url}`,
              `**Source SHA:** \`${sha}\``,
              `**Actor:** ${run.actor?.login || 'unknown'}`,
              `**Completed:** ${completed}`,
              '',
              '## Continuation rule',
              '',
              'This automated receipt proves the workflow result only. A meaningful Naya session must still write its human-readable CURRENT STATE / WHAT CHANGED / VERIFIED / OPEN / NEXT EXECUTION handoff to the canonical Naya Activity feed before the session ends.',
              '',
              '## Next Naya',
              '',
              'Inspect this run plus NAYA/ACTIVITY for the durable successor state. Never treat an automatic workflow receipt as a substitute for Naya-to-Naya handoff.'
            ].join('\n');
            core.summary.addRaw(summary);
            await core.summary.write();
