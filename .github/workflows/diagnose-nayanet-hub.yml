name: Diagnose NayaNET Hub Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-nayanet-hub.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          node <<'NODE'
          const {chromium}=await import('playwright');
          const b=await chromium.launch({headless:true});
          for (const u of ['https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/','https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/identity.html','https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/releases/8cbbc3768c635429d193612ebeaa09025ae6604e/']) {
            const p=await b.newPage();
            try {
              await p.goto(u,{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForTimeout(3000);
              console.log(JSON.stringify({requested:u,url:p.url(),title:await p.title(),runtime:await p.evaluate(()=>({naya:!!window.NayaAssistantRuntime,identity:!!window.NayaNETNameFirstAuth,snapshot:window.NayaAssistantRuntime?.snapshot?.()||null,auth:document.documentElement.dataset.nayaAuth||null})),scripts:await p.evaluate(()=>[...document.scripts].map(s=>s.src).filter(Boolean))},null,2));
            } catch(e){console.log(JSON.stringify({requested:u,error:String(e),url:p.url()}));}
            await p.close();
          }
          await b.close();
          NODE
