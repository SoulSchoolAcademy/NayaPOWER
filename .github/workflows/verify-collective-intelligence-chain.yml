name: Verify Collective Intelligence Chain Lesson

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/nayanet-compound-intelligence/index.ts'
      - 'supabase/functions/naya-learning-apply/index.ts'
      - 'supabase/functions/naya-decision-context/index.ts'
      - '.github/workflows/verify-collective-intelligence-chain.yml'

permissions:
  contents: read

jobs:
  collective-chain:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 20
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
      RUN_IDENTITY: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute one real collective intelligence lesson
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee collective-chain-proof.json
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const hub=process.env.HUB_URL, url=process.env.SUPABASE_URL, key=process.env.SUPABASE_PUBLISHABLE_KEY, run=process.env.RUN_IDENTITY;
          const token='collective-chain-'+run+'-'+crypto.randomBytes(5).toString('hex');
          const lessonId='lesson-'+token;
          const targetId='collective-chain-target-'+token;
          const lessonTitle='Collective Intelligence Chain lesson '+run;
          const lesson='When a verified project state has an explicit next action, a cold Naya should restore that state before acting; it should not invent a new authority or restart from zero.';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const page=await context.newPage();

          async function setupIdentity(targetPage=page, identitySuffix=''){
            await targetPage.goto(hub+'/',{waitUntil:'domcontentloaded',timeout:60000});
            await targetPage.waitForFunction(()=>!!window.NayaNETNameFirstAuth,{timeout:30000});
            const established=await targetPage.evaluate(async({run,identitySuffix})=>{
              const name='Collective Chain Proof '+run+' '+identitySuffix;
              const alias=('collective'+run+identitySuffix).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
              const identity=await window.NayaNETNameFirstAuth.establish({name,alias});
              const client=window.__NayaNETSupabaseClient;
              const session=client?(await client.auth.getSession()).data.session:null;
              return {identity,session:session?{userId:session.user.id,access_token:session.access_token}:null};
            },{run});
            if(!established.identity?.authenticated||!established.session?.access_token) throw new Error('AUTH_NOT_ESTABLISHED');
            return established.session;
          }

          async function issueSmartMailAuthority(session, receiverId){
            const source=await compound(session,'understand',{
              idempotency_key:'cc-authority-mail-'+run,
              title:'Collective Chain smart-mail outcome authority source '+run,
              content:'Fresh proof owner source for the independently observed receiver outcome.',
              category:'AUTHORITY',topic:'COLLECTIVE_CHAIN_OUTCOME',tags:['authority','collective-chain','outcome'],
              applicable_scope:'NayaNET project continuation',authority_scope:'PERSONAL_INTELLIGENCE_ONLY',
              what_changed:'Created the bounded source event required to authorize one controlled smart-mail outcome.',
              next_use:'Send one controlled message to the independent verifier/receiver.'
            });
            const sourceEventId=source.event?.event_id;
            if(!sourceEventId) throw new Error('SMART_MAIL_AUTHORITY_SOURCE_MISSING');
            const grant=await page.evaluate(async({sourceEventId,receiverId,run})=>{
              const client=window.__NayaNETSupabaseClient; const session=(await client.auth.getSession()).data.session;
              const {data,error}=await client.rpc('nayanet_issue_authority_grant',{
                p_subject_id:session.user.id,p_source_event_id:sourceEventId,
                p_mission_id:'NayaNET collective intelligence chain independent outcome',
                p_scope:{project_id:'NayaNET',target:receiverId},p_actions:['smart_mail_send'],
                p_constraints:{mode:'collective-chain-proof',no_external_side_effects:false,proof_run:run},
                p_expires_at:new Date(Date.now()+10*60*1000).toISOString(),
                p_evidence:{proof_run:run,source_event_id:sourceEventId,independent_verifier_id:receiverId}
              }); if(error) throw error; return data;
            },{sourceEventId,receiverId,run});
            if(!grant?.grant_id) throw new Error('SMART_MAIL_AUTHORITY_GRANT_FAILED'); return grant.grant_id;
          }

          async function issueCommitAuthority(session){
            const sourceId='collective-chain-authority-source-'+run;
            const source=await compound(session,'understand',{
              idempotency_key:sourceId,
              title:'Collective Chain authority source '+run,
              content:'Fresh proof owner created an owned source event before issuing intelligence_commit authority.',
              category:'AUTHORITY',
              topic:'COLLECTIVE_CHAIN_PROOF',
              tags:['authority','collective-chain','proof'],
              applicable_scope:'NayaNET project continuation',
              authority_scope:'PERSONAL_INTELLIGENCE_ONLY',
              what_changed:'Created the owned source event required to issue a bounded proof grant.',
              next_use:'Issue the minimum scoped intelligence_commit grant for this proof run.'
            });
            const sourceEventId=source.event?.event_id;
            if(!sourceEventId) throw new Error('AUTHORITY_SOURCE_EVENT_MISSING');
            const grant=await page.evaluate(async({sourceEventId,run})=>{
              const client=window.__NayaNETSupabaseClient;
              const session=(await client.auth.getSession()).data.session;
              const expires=new Date(Date.now()+10*60*1000).toISOString();
              const {data,error}=await client.rpc('nayanet_issue_authority_grant',{
                p_subject_id:session.user.id,
                p_source_event_id:sourceEventId,
                p_mission_id:'NayaNET collective intelligence chain proof',
                p_scope:{project_id:'NayaNET',target:'NayaNET'},
                p_actions:['intelligence_commit'],
                p_constraints:{proof_run:run,no_external_side_effects:true},
                p_expires_at:expires,
                p_evidence:{proof_run:run,source_event_id:sourceEventId}
              });
              if(error) throw error;
              return data;
            },{sourceEventId,run});
            const grantId=grant?.grant_id;
            if(!grantId) throw new Error('AUTHORITY_GRANT_ISSUANCE_FAILED');
            return grantId;
          }

          async function compound(session,action,extra={}){
            const idempotency_key='cc-'+run+'-'+action+'-'+crypto.randomBytes(5).toString('hex');
            const response=await fetch(url+'/functions/v1/nayanet-compound-intelligence',{
              method:'POST',
              headers:{Authorization:'Bearer '+session.access_token,apikey:key,'Content-Type':'application/json','x-idempotency-key':idempotency_key},
              body:JSON.stringify({action,idempotency_key,...extra})
            });
            const body=await response.json().catch(()=>({}));
            if(response.status!==200||body?.ok!==true) throw new Error(action+'_FAILED:'+JSON.stringify({status:response.status,body}));
            return body.result;
          }

          async function learningApply(session,evidenceId,replayId){
            const response=await fetch(url+'/functions/v1/naya-learning-apply',{
              method:'POST',
              headers:{Authorization:'Bearer '+session.access_token,apikey:key,'Content-Type':'application/json'},
              body:JSON.stringify({evidence_id:evidenceId,replay_id:replayId})
            });
            const body=await response.json().catch(()=>({}));
            if(response.status!==200||body?.ok!==true) throw new Error('LEARNING_APPLY_FAILED:'+JSON.stringify({status:response.status,body}));
            return body;
          }

          async function decision(session,targetId){
            const response=await fetch(url+'/functions/v1/naya-decision-context',{
              method:'POST',
              headers:{Authorization:'Bearer '+session.access_token,apikey:key,'Content-Type':'application/json'},
              body:JSON.stringify({target_id:targetId})
            });
            const body=await response.json().catch(()=>({}));
            if(response.status!==200||body?.ok!==true) throw new Error('DECISION_CONTEXT_FAILED:'+JSON.stringify({status:response.status,body}));
            return body;
          }

          (async()=>{
            const session=await setupIdentity(page,'sender');
            const authorityGrantId=await issueCommitAuthority(session);
            const verifierContext=await browser.newContext();
            const verifierPage=await verifierContext.newPage();
            await verifierPage.goto(hub+'/',{waitUntil:'domcontentloaded',timeout:60000});
            await verifierPage.waitForFunction(()=>!!window.__NayaNETSupabaseClient,{timeout:30000});
            const verifierSession=await verifierPage.evaluate(async()=>{
              const client=window.__NayaNETSupabaseClient;
              if(!client) throw new Error('VERIFIER_SUPABASE_CLIENT_MISSING');
              const {data,error}=await client.auth.signInAnonymously();
              if(error||!data.session||!data.user) throw new Error('VERIFIER_ANONYMOUS_AUTH_FAILED:'+JSON.stringify(error));
              return {userId:data.user.id,access_token:data.session.access_token};
            });
            if(verifierSession.userId===session.userId) throw new Error('INDEPENDENT_VERIFIER_IDENTITY_NOT_DISTINCT');
            const smartMailGrantId=await issueSmartMailAuthority(session,verifierSession.userId);

            const captured=await compound(session,'intelligence_commit',{
              idempotency_key:lessonId,
              authority_grant_id:authorityGrantId,
              title:lessonTitle,
              content:lesson,
              category:'COLLECTIVE_INTELLIGENCE',
              topic:'COLD_CONTINUATION',
              tags:['collective-chain','lesson','cold-continuation'],
              learning_claim:lesson,
              target_id:targetId,
              applicable_scope:'NayaNET project continuation',
              authority_scope:'PERSONAL_INTELLIGENCE_ONLY',
              execution_authorization:{authority_id:authorityGrantId,actor_id:session.userId,permission:'intelligence_commit',governance_state:'AUTHORIZED'},
              what_changed:'A verified continuation lesson was captured for later cold retrieval.',
              next_use:'Use when restoring project state before consequential continuation.',
              unknown:['Real-world usefulness outside the tested project scope remains unproven.']
            });
            const eventId=captured.source_event?.event_id;
            const evidenceId=captured.learning?.evidence_id;
            const checkpoint1=captured.checkpoint?.checkpoint_id;
            if(!eventId||!evidenceId||!checkpoint1) throw new Error('INITIAL_INTELLIGENCE_COMMIT_INCOMPLETE');

            const retrieved=await compound(session,'retrieve',{query:lessonTitle,limit:10});
            if(!retrieved.items?.some(x=>x.event_id===eventId)) throw new Error('LESSON_RETRIEVAL_FAILED');

            const connected=await compound(session,'understand',{
              title:'Connected interpretation '+run,
              content:'Connected lesson: restore canonical current state first; the lesson is applicable only when the restored project state matches the continuation scope.',
              tags:['collective-chain','connect','applicability'],
              parent_event_id:eventId
            });
            const connectedEventId=connected.event?.event_id;
            if(!connectedEventId) throw new Error('CONNECT_EVENT_MISSING');

            const reconciled=await compound(session,'reconcile',{});
            if(reconciled.status!=='TRANSPORT_PROVEN_RETRIEVAL_OPEN'||!reconciled.bridge?.persisted||!reconciled.bridge?.indexed||!reconciled.bridge?.projected) throw new Error('RECONCILIATION_NOT_PROVEN');

            const conflicting=await compound(session,'understand',{
              title:'Conflicting continuation interpretation '+run,
              content:'Conflicting interpretation: restart from zero without restoring the canonical current state.',
              tags:['collective-chain','conflict','reconciliation'],
              parent_event_id:connectedEventId
            });
            const conflictingEventId=conflicting.event?.event_id;
            if(!conflictingEventId) throw new Error('CONFLICT_EVENT_MISSING');

            const resolved=await compound(session,'understand',{
              title:'Reconciled continuation interpretation '+run,
              content:'Reconciled interpretation: restore the canonical current state first; restart only when the restored state proves continuation is not applicable.',
              tags:['collective-chain','reconciled','resolution'],
              parent_event_id:conflictingEventId
            });
            const resolvedEventId=resolved.event?.event_id;
            if(!resolvedEventId) throw new Error('SEMANTIC_RECONCILIATION_NOT_PROVEN');

            const replay=await page.evaluate(async({eventId})=>window.NayaAssistantRuntime.dreamReplay({event_id:eventId,idempotency_key:'cc-replay-'+eventId}),{eventId});
            if(!replay||replay.source_event_id!==eventId||replay.status!=='SIMULATED') throw new Error('REPLAY_NOT_VERIFIED');

            const applied=await learningApply(session,evidenceId,replay.id);
            if(!applied.learning?.learner_state_version) throw new Error('LEARNER_STATE_NOT_UPDATED');

            const decisionBefore=await decision(session,targetId);
            if(!decisionBefore.decision?.influenced||decisionBefore.decision?.decision!=='USE_VERIFIED_LEARNING_CONTEXT') throw new Error('APPLICABILITY_BEHAVIOR_CHANGE_NOT_PROVEN:'+JSON.stringify(decisionBefore));
            if(decisionBefore.decision.authority?.changed!==false||decisionBefore.decision.authority?.granted!==false) throw new Error('AUTHORITY_CHANGED');

            const outcomeToken='NAYA-COLLECTIVE-OUTCOME-'+run;
            const outcomeMessage=await page.evaluate(async({verifierId,body,grantId,url,key})=>{
              const client=window.__NayaNETSupabaseClient; const s=(await client.auth.getSession()).data.session;
              const res=await fetch(url+'/functions/v1/nayanet-smart-mail',{method:'POST',headers:{authorization:'Bearer '+s.access_token,apikey:key,'content-type':'application/json'},body:JSON.stringify({recipient_user_id:verifierId,body,subject:'Collective Chain independent outcome',kind:'direct',idempotency_key:'cc-outcome-'+Date.now(),project_id:'NayaNET',authority_grant_id:grantId})});
              const data=await res.json(); if(!res.ok||!data.ok) throw new Error('OUTCOME_MESSAGE_SEND_FAILED:'+JSON.stringify(data)); return data;
            },{verifierId:verifierSession.userId,body:'Return exactly '+outcomeToken+' when this controlled proof message is received.',grantId:smartMailGrantId});
            const outcomeMessageId=outcomeMessage.message_id, outcomeReceiptId=outcomeMessage.execution_receipt_id;
            if(!outcomeMessageId||!outcomeReceiptId) throw new Error('OUTCOME_MESSAGE_LINEAGE_MISSING');
            const verifierReply=await verifierPage.evaluate(async({messageId,token})=>{
              const client=window.__NayaNETSupabaseClient;
              const {data:message,error:messageError}=await client.from('v7_mail_messages').select('id,thread_id,execution_receipt_id,body').eq('id',messageId).single();
              if(messageError||!message) throw messageError||new Error('VERIFIER_MESSAGE_MISSING');
              const body=message.body.includes(token)?token:'NO_MATCH';
              const {data:reply,error:replyError}=await client.from('v7_mail_messages').insert({thread_id:message.thread_id,sender_id:(await client.auth.getSession()).data.session.user.id,body,metadata:{schema_version:'NAYANET_COLLECTIVE_CHAIN_OUTCOME_V1',reply_to_message_id:message.id,receiver_fixture:'controlled_exact_token_v1'}}).select('id').single();
              if(replyError||!reply?.id) throw replyError||new Error('VERIFIER_REPLY_CREATE_FAILED');
              const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token)); const expectedHash=Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('');
              const {data:outcome,error:outcomeError}=await client.rpc('nayanet_record_smart_mail_response_outcome',{p_receipt_id:message.execution_receipt_id,p_message_id:message.id,p_reply_message_id:reply.id,p_expected_reply_hash:expectedHash});
              if(outcomeError||outcome?.status!=='VERIFIED') throw outcomeError||new Error('INDEPENDENT_OUTCOME_RECORD_FAILED:'+JSON.stringify(outcome));
              return {reply,outcome};
            },{messageId:outcomeMessageId,token:outcomeToken});
            const {data:independentOutcome,error:independentOutcomeError}=await page.evaluate(async({receiptId})=>{const c=window.__NayaNETSupabaseClient; return await c.from('nayanet_execution_outcomes').select('outcome_id,receipt_id,verified,verified_value,verifier_id,evidence,verification_method').eq('receipt_id',receiptId).single();},{receiptId:outcomeReceiptId});
            if(independentOutcomeError||!independentOutcome?.verified||independentOutcome.verifier_id===session.userId) throw independentOutcomeError||new Error('INDEPENDENT_OUTCOME_NOT_VERIFIED');
            const verifiedLearning=await compound(session,'learning_verify',{evidence_id:evidenceId,verification_method:'INDEPENDENT_VERIFIED_RECEIVER_OUTCOME',observed_value:{run,lesson_event_id:eventId,connected_event_id:connectedEventId,reconciliation:'PASS',outcome_id:independentOutcome.outcome_id,receipt_id:outcomeReceiptId,verifier_id:independentOutcome.verifier_id}});
            if(verifiedLearning.status!=='VERIFIED_LEARNING'||verifiedLearning.learning?.status!=='ACTIVE') throw new Error('LEARNING_NOT_VERIFIED');


            const outcome=await page.evaluate(async({outcomeEventId,targetId,decisionBefore,lessonEventId})=>window.NayaAssistantRuntime.record({
              event_id:outcomeEventId,
              title:'Collective Intelligence Chain verified outcome',
              content:'Cold-governed decision context used the verified lesson for target '+targetId+'.',
              source:'verify-collective-intelligence-chain',
              actor:'naya',
              tags:['collective-chain','outcome','verified'],
              metadata:{
                lesson_event_id:lessonEventId,
                target_id:targetId,
                decision:decisionBefore.decision.decision,
                influenced:decisionBefore.decision.influenced,
                authority:decisionBefore.decision.authority,
                verification:'observed runtime decision context'
              }
            }),{outcomeEventId,targetId,decisionBefore,lessonEventId:eventId});
            if(!outcome?.receipt) throw new Error('OUTCOME_RECEIPT_MISSING');
            const freshOutcome={event_id:independentOutcome.outcome_id,metadata:{influenced:true,verifier_id:independentOutcome.verifier_id,verified:true}};
            if(!freshOutcome.metadata.influenced) throw new Error('OUTCOME_VERIFICATION_FAILED');

            const improved=await compound(session,'checkpoint',{
              checkpoint_id:'checkpoint:'+lessonId+':outcome',
              source_event_ids:[eventId,connectedEventId,independentOutcome.outcome_id],
              current_understanding:'The continuation lesson was connected to a reconciled interpretation, verified as active learning, retrieved in a fresh governed decision context, applied without authority change, and produced an observed verified outcome.',
              title:lessonTitle+' — Improved checkpoint after verified collective lesson',
              confidence:1,
              tags:['collective-chain','checkpoint','improved'],
              what_changed:'The initial lesson checkpoint was strengthened by verified applicability, behavior change, and an observed outcome.',
              learned:'Verified lesson retrieval changed governed decision behavior without changing authority.',
              evidence_refs:[
                {kind:'initial_checkpoint',checkpoint_id:checkpoint1},
                {kind:'learning_evidence',evidence_id:evidenceId},
                {kind:'reconciled_interpretation',event_id:resolvedEventId,resolves_conflict_event_id:conflictingEventId},
                {kind:'replay',replay_id:replay.id},
                {kind:'learning_apply',learner_state_version:applied.learning.learner_state_version},
                {kind:'outcome',event_id:independentOutcome.outcome_id,receipt_id:outcomeReceiptId,verifier_id:independentOutcome.verifier_id}
              ],
              authority_scope:'PERSONAL_INTELLIGENCE_ONLY',
              applicable_scope:'NayaNET project continuation',
              next_use:'A cold successor should restore this improved checkpoint and use the lesson when the applicability scope matches.',
              successor_relevance:'Fresh Naya must retrieve the lesson, recognize applicability, act under unchanged authority, and verify outcome.'
            });
            if(improved.status!=='CHECKPOINT_VERIFIED'||improved.checkpoint?.event_id!=='checkpoint:'+lessonId+':outcome') throw new Error('IMPROVED_CHECKPOINT_NOT_PERSISTED');

            const cold=await compound(session,'retrieve',{query:lessonTitle,limit:20});
            if(!cold.items?.some(x=>x.event_id===eventId)) throw new Error('COLD_RETRIEVE_LESSON_MISSING');
            if(!cold.items?.some(x=>x.event_id==='checkpoint:'+lessonId+':outcome')) throw new Error('COLD_RETRIEVE_IMPROVED_CHECKPOINT_MISSING');

            const proof={
              schema:'NAYANET_COLLECTIVE_INTELLIGENCE_CHAIN_PROOF_V1',
              status:'PROVEN',
              run_id:run,
              source_head:process.env.GITHUB_SHA,
              chain:{
                lesson_event_id:eventId,
                connected_event_id:connectedEventId,
                initial_checkpoint_id:checkpoint1,
                learning_evidence_id:evidenceId,
                replay_id:replay.id,
                learner_state_version:applied.learning.learner_state_version,
                outcome_event_id:independentOutcome.outcome_id,
                improved_checkpoint_id:'checkpoint:'+lessonId+':outcome'
              },
              acceptance:{
                lesson_captured:true,
                connected:true,
                reconciled:true,
                integrated:true,
                checkpointed:true,
                cold_retrieved:true,
                applicability_proven:true,
                behavior_changed:true,
                outcome_observed:true,
                outcome_verified:true,
                learning_updated:true,
                improved_checkpoint_proven:true,
                authority_unchanged:true
              }
            };
            fs.writeFileSync('collective-chain-proof.json',JSON.stringify(proof,null,2));
            console.log(JSON.stringify(proof,null,2));
            await context.close(); await browser.close();
          })().catch(async e=>{console.error(e);await context.close();await browser.close();process.exit(1)});
          NODE

      - name: Verify machine-readable proof
        run: |
          python - <<'PY'
          import json
          p=json.load(open('collective-chain-proof.json'))
          assert p["status"]=="PROVEN",p
          assert all(p["acceptance"].values()),p["acceptance"]
          assert p["chain"]["initial_checkpoint_id"] != p["chain"]["improved_checkpoint_id"]
          print("COLLECTIVE_INTELLIGENCE_CHAIN_PROOF=PASS")
          PY

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-intelligence-chain-proof-${{ github.run_id }}
          path: collective-chain-proof.json
          if-no-files-found: ignore
