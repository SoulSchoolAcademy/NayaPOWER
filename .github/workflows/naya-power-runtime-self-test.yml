name: Naya Power Runtime — Self Test

on:
  push:
    branches:
      - feat/naya-power-runtime-v1
    paths:
      - '.naya/runtime/NAYA-POWER-RUNTIME-CONTRACT.json'
      - '.naya/runtime/naya_power_kernel.py'
      - '.naya/runtime/test_naya_power_kernel.py'
      - '.github/workflows/naya-power-runtime-self-test.yml'
  pull_request:
    paths:
      - '.naya/runtime/NAYA-POWER-RUNTIME-CONTRACT.json'
      - '.naya/runtime/naya_power_kernel.py'
      - '.naya/runtime/test_naya_power_kernel.py'
      - '.github/workflows/naya-power-runtime-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run kernel unit self-test
        run: python3 .naya/runtime/test_naya_power_kernel.py
      - name: Run runtime self-test
        run: python3 .naya/runtime/naya_power_kernel.py --self-test
