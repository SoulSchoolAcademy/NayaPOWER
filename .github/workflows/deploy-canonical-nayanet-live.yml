name: Retired — legacy NayaNET live branch mutator

# The live branch already contains the canonical feed upgrade. This old one-time
# mutator is retired so ordinary main commits cannot mutate another branch or main.
# Use deploy-canonical-e02.yml for the canonical E02 runtime.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'LEGACY_LIVE_BRANCH_MUTATOR=RETIRED'
          echo 'CANONICAL_FEED_UPGRADE=ALREADY_PRESENT_ON_V7-LIVE'
          echo 'ACTIVE_DEPLOY_WORKFLOW=.github/workflows/deploy-canonical-e02.yml'
