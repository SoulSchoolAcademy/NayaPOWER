name: Retired — legacy NayaNET live branch mutator

# This historical mutator is retired. The current public Hub deployment is
# human-dispatched, exact-SHA-bound, and kernel-gated by deploy-nayanet-hub-canonical-v2.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'LEGACY_LIVE_BRANCH_MUTATOR=RETIRED'
          echo 'CANONICAL_HUB_SOURCE=NAYANET/HUB'
          echo 'ACTIVE_DEPLOY_WORKFLOW=.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
          echo 'RULE=NO_LEGACY_BRANCH_MUTATION'
