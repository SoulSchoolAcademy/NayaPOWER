name: Diagnose V7 Worker Identity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v7-worker.yml'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/worker.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Cloudflare worker identity
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 262c881746ea6e9978ca18b3eb831907
        run: |
          set -euo pipefail
          mkdir -p CLOUDFLARE-INTELLIGENT-HUB-V7
          {
            echo "OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '--- WORKER DETAILS ---'
            curl -fsSL -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/workers/nayanet-v7-intelligent-hub" | python3 -m json.tool
            echo '--- SCRIPT DETAILS ---'
            curl -fsSL -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/nayanet-v7-intelligent-hub/settings" | python3 -m json.tool
          } > CLOUDFLARE-INTELLIGENT-HUB-V7/worker-identity-diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/worker-identity-diagnostic.txt
          git commit -m 'Record V7 Cloudflare worker identity [skip ci]' || true
          git push || true
