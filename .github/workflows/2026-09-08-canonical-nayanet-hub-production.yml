name: 2026-09-08 Canonical NayaNET Hub Production

on:
  push:
    branches: [main]
    paths:
      - '2026 09 08 9:59 NAYANET HUB.html'
      - '2026 09 08 12:40 NAYANET INTELLIGENT FEED V3.js'
      - '2026 09 08 NAYANET INTELLIGENT FEED V4 INTERIOR EVOLUTION.js'
      - '.github/workflows/2026-09-08-canonical-nayanet-hub-production.yml'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'

permissions:
  contents: read

concurrency:
  group: nayanet-canonical-production
  cancel-in-progress: true

env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build canonical runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          hub = Path('2026 09 08 9:59 NAYANET HUB.html')
          feed = Path('2026 09 08 12:40 NAYANET INTELLIGENT FEED V3.js')
          interior = Path('2026 09 08 NAYANET INTELLIGENT FEED V4 INTERIOR EVOLUTION.js')
          out = hub.read_text(encoding='utf-8')
          feed_js = feed.read_text(encoding='utf-8')
          interior_js = interior.read_text(encoding='utf-8')

          if '</body>' not in out or '</head>' not in out:
              raise SystemExit('SOURCE_NOT_COMPLETE_HTML')

          # Surgical rule: remove the right activation/operations rail only. Preserve the left sidebar.
          out, removed = re.subn(r'<aside\\s+class=["\']activationRail["\'][\\s\\S]*?</aside>', '', out, count=1, flags=re.I)
          if removed != 1:
              raise SystemExit(f'RIGHT_RAIL_REMOVAL_FAILED={removed}')

          # Replace only the existing center home-feed body; keep the surrounding page/hero/sidebar intact.
          out, replaced = re.subn(r'<section class=["\']homeFeed["\'][\\s\\S]*?</section>\\s*</section>', '<section class="homeFeed"><div id="nayanet-elite-feed" aria-label="NayaNET Intelligent Feed"></div></section>', out, count=1, flags=re.I)
          if replaced != 1:
              raise SystemExit(f'HOME_FEED_REPLACEMENT_FAILED={replaced}')

          # The V3 feed helper must not rename or remove left navigation.
          feed_js = feed_js.replace('relabelSidebar();wire(root);render(preferred())', 'wire(root);render(preferred())', 1)

          # Mount the feed inside the existing center feed host rather than above the workspace.
          old_mount = "if(workspace)workspace.insertBefore(root,workspace.firstChild);else page.insertBefore(root,page.firstChild||null);relabelSidebar();wire(root);render(preferred())"
          new_mount = "const host=workspace?.querySelector('.homeFeed');if(host)host.replaceChildren(root);else if(workspace)workspace.insertBefore(root,workspace.firstChild);else page.insertBefore(root,page.firstChild||null);wire(root);render(preferred())"
          if old_mount not in feed_js:
              raise SystemExit('FEED_MOUNT_ANCHOR_NOT_FOUND')
          feed_js = feed_js.replace(old_mount, new_mount, 1)

          injected = '<script id="nayanet-canonical-feed-v3">\\n' + feed_js + '\\n</script>\\n<script id="nayanet-canonical-feed-v4">\\n' + interior_js + '\\n</script>\\n'
          out = out.replace('</body>', injected + '</body>', 1)

          # Final authority layer. It is intentionally stronger than legacy CSS/JS and cannot remove the left sidebar.
          authority = r'''<style id="nayanet-canonical-release-authority">
          html,body{background:#000!important}
          .homeWorkspace{display:block!important;grid-template-columns:1fr!important;width:100%!important;max-width:none!important;gap:0!important}
          .homeFeed{width:100%!important;max-width:none!important;min-width:0!important}
          #nayanet-elite-feed{width:100%!important;max-width:none!important}
          .activationRail{display:none!important;width:0!important;min-width:0!important;max-width:0!important;height:0!important;overflow:hidden!important;visibility:hidden!important;pointer-events:none!important}
          @media(max-width:900px){.sidebar{display:none!important}.app{display:block!important;grid-template-columns:1fr!important}.main{width:100%!important;padding-left:12px!important;padding-right:12px!important}}
          </style>
          <script id="nayanet-canonical-release-guard">
          (()=>{const enforce=()=>{document.querySelectorAll('.activationRail').forEach(x=>x.remove());document.querySelectorAll('.homeWorkspace').forEach(x=>{x.style.setProperty('display','block','important');x.style.setProperty('grid-template-columns','1fr','important');x.style.setProperty('width','100%','important')});document.querySelectorAll('.homeFeed,#nayanet-elite-feed').forEach(x=>x.style.setProperty('width','100%','important'))};const boot=()=>{enforce();new MutationObserver(enforce).observe(document.body,{childList:true,subtree:true});[100,500,1500,3000].forEach(x=>setTimeout(enforce,x))};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot,{once:true}):boot()})();
          </script>
          <script id="nayanet-canonical-feed-mirror">
          (()=>{const ROOT='#nayanet-elite-feed';const clean=s=>String(s||'').replace(/\\s+/g,' ').trim();const state=()=>{try{return JSON.parse(localStorage.getItem('nayanet:feed-mirror-actions')||'{}')}catch{return{}}};const save=s=>{try{localStorage.setItem('nayanet:feed-mirror-actions',JSON.stringify(s))}catch{}};function addActions(block){if(block.querySelector('.nhm-actions'))return;const title=clean(block.querySelector('.n3-title')?.textContent||'Intelligent Block'),key=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,90),st=state(),a=st[key]||{},bar=document.createElement('div');bar.className='nhm-actions';bar.innerHTML='<button data-a="share">＋ SHARE</button><button data-a="like">👍 LIKE</button><button data-a="love">♥ LOVE</button><button data-a="rank">★ RANK</button><button data-a="comment">💬 COMMENT</button><button data-a="save">🔖 SAVE</button>';bar.querySelectorAll('button').forEach(btn=>{const k=btn.dataset.a;if(a[k])btn.classList.add('active');btn.onclick=()=>{const s=state();s[key]=s[key]||{};if(k==='comment'){const text=prompt('Add a comment to this Intelligent Block:');if(!text||!text.trim())return;s[key].comments=s[key].comments||[];s[key].comments.push({text:text.trim(),createdAt:new Date().toISOString()});btn.textContent='💬 COMMENT '+s[key].comments.length}else if(k==='rank'){const n=Number(prompt('How valuable is this intelligence? Enter 1–5.',s[key].rank||''));if(!Number.isFinite(n)||n<1||n>5)return;s[key].rank=Math.round(n);btn.textContent='★ RANK '+s[key].rank+'/5'}else if(k==='share'){const text=title+'\\n\\n'+clean(block.querySelector('.n3-nutshell p')?.textContent||'')+'\\n\\nNayaNET — Create. Connect. Grow with US.';if(navigator.share)navigator.share({title,text,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(text).then(()=>{btn.textContent='✓ COPIED';setTimeout(()=>btn.textContent='＋ SHARE',1200)}).catch(()=>{});return}else{s[key][k]=!s[key][k];btn.classList.toggle('active',!!s[key][k])}save(s)}});block.appendChild(bar)}function blocks(){return [...document.querySelectorAll(ROOT+' .n3-block')]}function mirrorActivity(){const feed=document.querySelector(ROOT),body=feed?.querySelector('.n3-body');if(!feed||!body)return;const originals=[...body.querySelectorAll('.n3-block')];if(!originals.length)return;body.innerHTML=originals.map((b,i)=>{const c=b.cloneNode(true);c.classList.add('nhm-generated');const e=c.querySelector('.n3-eyebrow');if(e)e.innerHTML='<span class="n3-led"></span><b>INTELLIGENT BLOCK</b> · ACTIVITY · EVENT '+String(i+1).padStart(2,'0');return c.outerHTML}).join('');blocks().forEach(addActions)}function boot(){const feed=document.querySelector(ROOT);if(!feed||feed.dataset.canonicalMirror)return;feed.dataset.canonicalMirror='1';feed.addEventListener('click',e=>{const tab=e.target.closest('.n3-tab');if(!tab)return;const view=tab.dataset.view;if(view!=='activity')return;e.preventDefault();e.stopImmediatePropagation();feed.querySelectorAll('.n3-tab').forEach(x=>{x.classList.toggle('active',x===tab);x.setAttribute('aria-selected',String(x===tab))});mirrorActivity()},true);const t=setInterval(()=>{blocks().forEach(addActions)},400);setTimeout(()=>clearInterval(t),10000)}document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot,{once:true}):boot()})();
          </script>'''
          out = out.replace('</body>', authority + '\\n</body>', 1)

          d=Path('CLOUDFLARE-INTELLIGENT-HUB-V7');a=d/'assets';a.mkdir(parents=True,exist_ok=True);(a/'index.html').write_text(out,encoding='utf-8');(d/'index.html').write_text(out,encoding='utf-8')
          if 'class="activationRail"' in out or "class='activationRail'" in out: raise SystemExit('RIGHT_RAIL_STILL_IN_ARTIFACT')
          if 'class="sidebar"' not in out: raise SystemExit('LEFT_SIDEBAR_LOST')
          for marker in ['nayanet-elite-feed','COLLECTIVE INTELLIGENCE','PERSONAL INTELLIGENCE','ACTIVITY','nayanet-canonical-release-authority','nayanet-canonical-feed-mirror']:
              if marker not in out: raise SystemExit('MISSING_MARKER='+marker)
          print('CANONICAL_BUILD_PASS',len(out.encode('utf-8')))
          PY

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Verify public runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 "$RUNTIME/?release=${GITHUB_SHA}" -o /tmp/live.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/live.html').read_text(encoding='utf-8')
          for marker in ['COLLECTIVE INTELLIGENCE','PERSONAL INTELLIGENCE','ACTIVITY','nayanet-canonical-release-authority','nayanet-canonical-feed-mirror']:
              if marker not in text: raise SystemExit('LIVE_MISSING='+marker)
          if 'class="activationRail"' in text or "class='activationRail'" in text: raise SystemExit('LIVE_RIGHT_RAIL_PRESENT')
          if 'class="sidebar"' not in text: raise SystemExit('LIVE_LEFT_SIDEBAR_MISSING')
          print('PUBLIC_RUNTIME_VERIFIED')
          print('SMART_LINK='+ 'https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds')
          PY
