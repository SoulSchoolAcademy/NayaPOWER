name: Deploy Current NayaNET Cognitive Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Assert canonical deployment ownership
        run: |
          echo 'LEGACY_TIMESTAMPED_HTML_DEPLOYMENT=RETIRED'
          echo 'CURRENT_HUB_SOURCE=NAYANET/HUB'
          echo 'CURRENT_DEPLOYMENT=.github/workflows/deploy-nayanet-hub-canonical.yml'
          echo 'CURRENT_RUNTIME=https://aged-art-7c12.nayanet.workers.dev'
          echo 'RULE=ONE_CURRENT_HUB_DEPLOYMENT_AUTHORITY'
