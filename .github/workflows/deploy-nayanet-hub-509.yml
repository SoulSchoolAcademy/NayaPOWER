# 509 CANONICAL BASELINE → AAA SURGICAL EVOLUTION — preserve the 5:09 house and evolve its human experience.
# Release trigger: execute only after source, authority, artifact, deployment, and runtime can be independently verified.
name: Deploy NayaNET Hub — 509 AAA Canonical

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit to deploy
        required: true
        type: string
      reason:
        description: Deployment reason
        required: true
        type: string

permissions:
  contents: read

env:
  LEGACY_509: "2026 09 09 5:09 pm NayaNET HUB.html"
  AAA_LAYER: "NAYANET/509-AAA-SURGICAL-LAYER.js"
  WORKER_NAME: sparkling-shape-7ae5
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b

concurrency:
  group: nayanet-canonical-live-hub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact source
        id: source
        shell: bash
        env:
          PUSH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          SHA="${REQUESTED_SHA:-$PUSH_SHA}"
          test "${#SHA}" -eq 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Governance gate
        run: |
          set -euo pipefail
          python3 .naya/control-plane/workflow_gate.py \
            --actor "$GITHUB_ACTOR" \
            --purpose "deploy the canonical 509 NayaNET Intelligent Hub public runtime" \
            --permission "deploy_public_runtime" \
            --request "deploy_nayanet_hub_509" \
            --mission "make the NayaNET Intelligent Hub beautiful, useful, truthful, and operationally deployable" \
            --uncertainty 1 --consequence 8 --irreversibility 8 \
            --scope "public-runtime:sparkling-shape-7ae5:/" \
            --evidence "exact source SHA: ${{ steps.source.outputs.sha }}" \
            --evidence "canonical visual baseline: $LEGACY_509" \
            --evidence "surgical evolution layer: $AAA_LAYER"

      - name: Verify 509 baseline source
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          baseline = Path("2026 09 09 5:09 pm NayaNET HUB.html")
          layer = Path("NAYANET/509-AAA-SURGICAL-LAYER.js")
          checks = [
              (baseline, "file exists", baseline.is_file() and baseline.stat().st_size > 0),
              (layer, "AAA layer exists", layer.is_file() and layer.stat().st_size > 0),
          ]
          if not all(ok for _, _, ok in checks):
              for path, label, ok in checks: print(f"CHECK={label} RESULT={'PASS' if ok else 'FAIL'} PATH={path}")
              raise SystemExit(1)
          b = baseline.read_text(encoding="utf-8")
          a = layer.read_text(encoding="utf-8")
          required = [
              ("baseline title", "<title>NayaNET — Intelligent Hub V7</title>", b),
              ("baseline SMART FEED", "SMART FEED", b),
              ("baseline NayaNET", "NayaNET", b),
              ("AAA style marker", "naya509-aaa-style", a),
          ]
          failed = False
          for label, needle, haystack in required:
              ok = needle in haystack
              print(f"CHECK={label} RESULT={'PASS' if ok else 'FAIL'}")
              if not ok: failed = True
          if failed: raise SystemExit(1)
          digest = hashlib.sha256(baseline.read_bytes()).hexdigest()
          print("CANONICAL_509_BASELINE=PASS")
          print(f"SOURCE_COMMIT=${{SOURCE_COMMIT}}")
          print(f"BASELINE_509_SHA256={digest}")
          PY
          BASELINE_SHA256=$(sha256sum "$LEGACY_509" | awk '{print $1}')
          echo "BASELINE_509_SHA256=$BASELINE_SHA256" >> "$GITHUB_ENV"

      - name: Prepare Cloudflare 509 + AAA release
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/public
          cp "$LEGACY_509" release/public/index.html
          cp "$AAA_LAYER" release/public/naya-509-aaa.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release/public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<script src="/naya-509-aaa.js"></script>'
          if marker not in html:
              html=html.replace('</head>', marker+'</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY
          grep -Fq '/naya-509-aaa.js' release/public/index.html
          grep -Fq 'naya509-aaa-style' release/public/naya-509-aaa.js
          RENDERED_SHA256=$(sha256sum release/public/index.html | awk '{print $1}')
          echo "RENDERED_SHA256=$RENDERED_SHA256" >> "$GITHUB_ENV"
          echo "RENDERED_509_AAA_SHA256=$RENDERED_SHA256"
          cat > release/worker.js <<'EOF'
          export default { async fetch(request, env) {
            const url = new URL(request.url);
            const spaRoutes = new Set(['/','/index.html','/feed','/notes','/today','/reports','/library','/collective','/evidence','/connections','/mail','/space','/settings']);
            const isSpaRoute = spaRoutes.has(url.pathname) || url.pathname.startsWith('/intelligence/');
            const assetRequest = isSpaRoute ? new Request(new URL('/index.html', request.url).toString(), { method:'GET', headers:request.headers }) : request;
            const response = await env.ASSETS.fetch(assetRequest);
            if (!isSpaRoute) return response;
            const headers = new Headers(response.headers);
            headers.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');
            headers.set('Pragma','no-cache');
            headers.set('X-NayaNET-Canonical-Source','2026-09-09-5:09pm-509-baseline');
            headers.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT||'unknown');
            headers.set('X-NayaNET-509-Baseline-SHA256',env.BASELINE_509_SHA256||'unknown');
            headers.set('X-NayaNET-509-Rendered-SHA256',env.RENDERED_SHA256||'unknown');
            return new Response(response.body,{status:response.status,statusText:response.statusText,headers});
          } };
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"sparkling-shape-7ae5","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"${{ steps.source.outputs.sha }}","BASELINE_509_SHA256":"$BASELINE_509_SHA256","RENDERED_SHA256":"$RENDERED_SHA256"}}
          EOF

      - name: Deploy canonical 509 + AAA Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc

      - name: Promote newest Worker version to 100 percent
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json
          VERSION_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/deployments.json'))
          deployments=data.get('deployments') if isinstance(data,dict) else data
          versions=deployments[-1].get('versions') or []
          print(versions[-1].get('version_id') or versions[-1].get('versionId') or '')
          PY
          )
          test -n "$VERSION_ID"
          echo "CLOUDFLARE_VERSION_ID=$VERSION_ID"
          npx wrangler versions deploy "$VERSION_ID@100%" -y --name "$WORKER_NAME"

      - name: Independently verify public 509 + AAA runtime
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            root_code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/root -w '%{http_code}' "$RUNTIME/?probe=$attempt" || true)
            smart_code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/smart -w '%{http_code}' "$SMART_LINK?probe=$attempt" || true)
            root_hash=$(sha256sum /tmp/root 2>/dev/null | awk '{print $1}' || true)
            smart_hash=$(sha256sum /tmp/smart 2>/dev/null | awk '{print $1}' || true)
            root_source=$(grep -o 'X-NayaNET-Source-Commit[^<]*' /tmp/root 2>/dev/null | head -1 || true)
            overlay_ok=$(grep -F 'naya-509-aaa.js' /tmp/root >/dev/null 2>&1 && echo PASS || echo FAIL)
            echo "ATTEMPT=$attempt ROOT=$root_code SMART=$smart_code ROOT_HASH=$root_hash SMART_HASH=$smart_hash EXPECTED_RENDERED=$RENDERED_SHA256 OVERLAY=$overlay_ok SOURCE=${{ steps.source.outputs.sha }}"
            if [ "$root_code" = 200 ] && [ "$smart_code" = 200 ] && [ "$root_hash" = "$RENDERED_SHA256" ] && [ "$smart_hash" = "$RENDERED_SHA256" ] && [ "$overlay_ok" = PASS ]; then
              echo PUBLIC_RUNTIME_509_AAA=PASS
              exit 0
            fi
            sleep 5
          done
          echo PUBLIC_RUNTIME_509_AAA=FAIL
          exit 1
