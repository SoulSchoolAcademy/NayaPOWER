name: NayaNET canonical Smart Share governed proof
# PROOF-TRIGGER: rerun after successful canonical Hub production parity deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-smart-share-canonical.yml'
      - 'NAYANET/HUB/index.html'
      - 'NAYANET/HUB/public/assistant-runtime.js'
      - 'NAYANET/HUB/public/hub-completeness.js'
      - 'smart-feed.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smart-share:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STREAM_E_AUTHORITY_GRANT_ID: ${{ vars.STREAM_E_AUTHORITY_GRANT_ID }}
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - uses: actions/checkout@v4
      - name: Require governed authority grant
        run: node .github/scripts/require-governed-authority-grant.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute canonical Smart Share proof
        shell: bash
        run: |
          cat > verify-smart-share.mjs <<'EOF'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const base=process.env.SUPABASE_URL;
          const key=process.env.SUPABASE_PUBLISHABLE_KEY;
          const runtime=process.env.RUNTIME_URL;
          const project='NayaNET-Smart-Share-'+process.env.GITHUB_RUN_ID+'-'+crypto.randomBytes(4).toString('hex');

          async function req(url,opt={}) {
            const r=await fetch(url,opt);
            const t=await r.text();
            let b; try { b=JSON.parse(t) } catch { b={raw:t} }
            if(!r.ok) throw Error(r.status+' '+JSON.stringify(b));
            return b;
          }
          const headers=(token,extra={})=>({apikey:key,authorization:'Bearer '+token,'content-type':'application/json',...extra});
          const signup=()=>req(base+'/auth/v1/signup',{method:'POST',headers:{apikey:key,'content-type':'application/json'},body:'{}'});
          const A=await signup(), B=await signup(), C=await signup();
          if(!A.access_token||!A.user?.id||!B.access_token||!B.user?.id||!C.access_token||!C.user?.id) throw Error('AUTH_BOOTSTRAP_FAILED');

          const browser=await chromium.launch({headless:true});
          const origin=new URL(runtime).origin;
          const storageState=session=>({cookies:[],origins:[{origin,localStorage:[{name:'nayanet.supabase.auth',value:JSON.stringify(session)}]}]});
          async function contextFor(session,label,{diagnoseShare=false}={}) {
            const context=await browser.newContext({storageState:storageState(session),viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            if(diagnoseShare) await page.addInitScript(()=>{
              window.__smartShareDiag={registrations:0,handlerInvoked:0,dispatches:[],timeline:[]};
              const startedAt=Date.now();
              const pushTimeline=(kind,data={})=>{
                const row={kind,ms:Date.now()-startedAt,...data};
                const t=window.__smartShareDiag.timeline;
                const prev=t[t.length-1];
                if(!prev||JSON.stringify({...prev,ms:0})!==JSON.stringify({...row,ms:0})) t.push(row);
              };
              window.__smartShareDiag.captureBindingState=()=>{
                const buttons=[...document.querySelectorAll('[data-c4-kind="share-intel"]')];
                const exact=buttons.find(b=>b.closest('.block')?.querySelector('h3')?.textContent?.trim()===window.__smartShareDiag.expectedTitle)||buttons[0]||null;
                pushTimeline('poll',{
                  guard:window.__nayaCanonicalHubSmartShareBound===true,
                  buttonCount:buttons.length,
                  exactExists:!!exact,
                  exactBound:exact?.dataset.nayaSmartShareBound==='1',
                  observer:String(window.MutationObserver?.toString?.()||'').slice(0,220)
                });
              };
              const nativeDispatch=EventTarget.prototype.dispatchEvent;
              window.dispatchEvent=function(event){
                var type=event&&event.type||'';
                if(type==='nayanet:smart-share-published'||type==='nayanet:smart-share-failed'){
                  var detail=event&&event.detail||{};
                  window.__smartShareDiag.dispatches.push({
                    type:type,
                    publicationId:String(detail&&detail.publication&&detail.publication.id||''),
                    eventId:String(detail&&detail.event_id||''),
                    status:String(detail&&detail.publication&&detail.publication.status||''),
                    at:Date.now()
                  });
                }
                return nativeDispatch.call(this,event);
              };
              const nativeAdd=EventTarget.prototype.addEventListener;
              EventTarget.prototype.addEventListener=function(type,listener,options){
                if(type==='click'&&listener&&this&&this.matches&&this.matches('[data-c4-kind="share-intel"]')){
                  window.__smartShareDiag.registrations++;
                  const wrapped=function(){
                    window.__smartShareDiag.handlerInvoked++;
                    return listener.apply(this,arguments);
                  };
                  return nativeAdd.call(this,type,wrapped,options);
                }
                return nativeAdd.call(this,type,listener,options);
              };
              const poll=setInterval(()=>{
                try{window.__smartShareDiag.captureBindingState()}catch{}
              },25);
              setTimeout(()=>clearInterval(poll),12000);
            });
            const response=await page.goto(runtime+'/?smart_share_proof='+process.env.GITHUB_RUN_ID+'-'+label,{waitUntil:'domcontentloaded',timeout:60000});
            if(response?.status()!==200) throw Error(label+'_HUB_ROOT_NOT_200:'+response?.status());
            await page.waitForFunction(()=>!!window.NayaAssistantRuntime,{timeout:30000});
            const auth=await page.evaluate(async()=>window.NayaAssistantRuntime.init());
            if(!auth.authenticated||auth.user_id!==session.user.id) throw Error(label+'_AUTHENTICATED_HANDOFF_FAILED');
            return {context,page};
          }

          const Actx=await contextFor(A,'A',{diagnoseShare:true});
          const ap=Actx.page;
          const root=await ap.evaluate(()=>({title:document.title,directNine:document.querySelector('meta[name="nayanet-direct-nine"]')?.content||'',source:document.querySelector('meta[name="nayanet-source-commit"]')?.content||'',welcome:document.body.innerText.includes('welcome.nayanet.app')}));
          if(root.title!=='NayaNET — Intelligent Hub V7 · 509 AAA') throw Error('CANONICAL_TITLE_MISMATCH:'+root.title);
          if(root.directNine!=='verified-static-top-nine') throw Error('CANONICAL_DIRECT_NINE_MISSING');
          if(root.welcome) throw Error('WELCOME_FRONT_DOOR_PRESENT_ON_CANONICAL_HUB');

          const sourceSelection=await ap.evaluate(async()=>{
            const block=document.querySelector('.block[data-real-smart-note]')||document.querySelector('.block');
            const title=String(block?.querySelector('h3')?.textContent||'').replace(/\\s+/g,' ').trim();
            if(!title) throw new Error('SMART_SHARE_HUB_BLOCK_TITLE_MISSING');
            const created=await window.NayaAssistantRuntime.record({title,content:'Canonical Smart Share proof source bound to the protected Hub intelligence title.',source:'nayanet-smart-share-proof',type:'INSIGHT',classification:'observation',status:'active',tags:['smart-share','governed-proof','hub-source-binding']});
            const feed=await window.NayaAssistantRuntime.smartFeed({stream:'personal',limit:50,before:null});
            const item=(feed.items||[]).find(x=>String(x.title||'').replace(/\\s+/g,' ').trim()===title);
            return item?{event_id:item.event_id,id:item.id,title:item.title,receipt_id:created?.receipt?.id||created?.receipt_id||''}:null;
          });
          if(!sourceSelection?.event_id) throw Error('SMART_SHARE_OWNED_SOURCE_NOT_BOUND_TO_CANONICAL_HUB_BLOCK');
          const sourceEventId=String(sourceSelection.event_id);
          const sourceRows=await ap.evaluate(id=>window.NayaAssistantRuntime.retrieve(id),sourceEventId);
          if(!sourceRows.some(x=>x.event_id===sourceEventId&&x.user_id===A.user.id)) throw Error('OWNED_SOURCE_RETRIEVAL_FAILED');
          const sourceReceiptId=String(sourceSelection.receipt_id||sourceRows.find(x=>x.event_id===sourceEventId)?.receipt_id||'');
          if(!sourceReceiptId) throw Error('SOURCE_RECEIPT_NOT_PROVEN');
          const sourceBefore=await ap.evaluate(async()=>window.NayaAssistantRuntime.smartFeed({stream:'collective',limit:50}));
          if((sourceBefore.items||[]).some(x=>x.id===sourceRows[0].id)) throw Error('SOURCE_ALREADY_PUBLIC_BEFORE_SHARE');

          await ap.evaluate(title=>{window.__smartShareDiag.expectedTitle=String(title);window.__smartShareDiag.captureBindingState?.()},sourceSelection.title);
          const shareBlock=ap.locator('.block').filter({hasText:String(sourceSelection.title)}).first();
          const shareButton=shareBlock.locator('[data-c4-kind="share-intel"]').first();
          await shareButton.waitFor({state:'visible',timeout:15000});
          await shareButton.scrollIntoViewIfNeeded();

          const boundShareButton=await ap.waitForFunction(()=>{
            const expected=String(window.__smartShareDiag?.expectedTitle||'').trim();
            const buttons=[...document.querySelectorAll('[data-c4-kind="share-intel"]')];
            const button=buttons.find(b=>b.closest('.block')?.querySelector('h3')?.textContent?.trim()===expected)||buttons[0];
            return button&&button.dataset.nayaSmartShareBound==='1'?button:null;
          },{timeout:15000,polling:50});
          const beforeClick=await boundShareButton.evaluate(button=>({
            exists:true,
            bound:button.dataset.nayaSmartShareBound==='1',
            registrations:Number(window.__smartShareDiag?.registrations||0)
          }));
          console.log('SMART_SHARE_BROWSER_DIAGNOSTIC_BEFORE_CLICK='+JSON.stringify(beforeClick));
          console.log('SMART_SHARE_BROWSER_BINDING_TIMELINE='+JSON.stringify(await ap.evaluate(()=>window.__smartShareDiag?.timeline||[])));
          if(!beforeClick.exists) throw Error('SMART_SHARE_DIAGNOSTIC_BUTTON_MISSING');
          if(!beforeClick.bound) throw Error('SMART_SHARE_DIAGNOSTIC_HANDLER_NOT_BOUND');
          if(beforeClick.registrations<1) throw Error('SMART_SHARE_DIAGNOSTIC_NO_CLICK_HANDLER_REGISTRATION');

                    const smartFeedNetworkLog=[];
          ap.on('request',request=>{
            if(request.method()==='POST'&&request.url().includes('/functions/v1/naya-smart-feed')){
              const entry={phase:'request',method:request.method(),url:request.url(),postData:request.postData()};
              smartFeedNetworkLog.push(entry); console.log('SMART_FEED_NETWORK_REQUEST='+JSON.stringify(entry));
            }
          });
          ap.on('response',async response=>{
            if(response.request().method()==='POST'&&response.url().includes('/functions/v1/naya-smart-feed')){
              let body=''; try{body=await Promise.race([response.text(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('RESPONSE_BODY_TIMEOUT')),5000))])}catch(e){body='[body-read-error:'+String(e?.message||e)+']'}
              const entry={phase:'response',url:response.url(),status:response.status(),statusText:response.statusText(),body:body.slice(0,4000)};
              smartFeedNetworkLog.push(entry); console.log('SMART_FEED_NETWORK_RESPONSE='+JSON.stringify(entry));
            }
          });
          ap.on('requestfailed',request=>{
            if(request.method()==='POST'&&request.url().includes('/functions/v1/naya-smart-feed')){
              const entry={phase:'requestfailed',method:request.method(),url:request.url(),failure:request.failure()};
              smartFeedNetworkLog.push(entry); console.log('SMART_FEED_NETWORK_FAILED='+JSON.stringify(entry));
            }
          });
          const publishedDispatchPromise=ap.evaluate(()=>new Promise((resolve,reject)=>{
            let settled=false;
            const finish=(event)=>{
              if(settled)return;
              settled=true;
              clearTimeout(timer);
              window.removeEventListener('nayanet:smart-share-published',onPublished);
              window.removeEventListener('nayanet:smart-share-failed',onFailed);
              const detail=event?.detail||{};
              resolve({
                type:String(event?.type||''),
                publicationId:String(detail?.publication?.id||''),
                status:String(detail?.publication?.status||''),
                eventId:String(detail?.event_id||''),
                error:String(detail?.error||''),
                at:Date.now()
              });
            };
            const onPublished=event=>finish(event);
            const onFailed=event=>finish(event);
            const timer=setTimeout(()=>{
              if(settled)return;
              settled=true;
              window.removeEventListener('nayanet:smart-share-published',onPublished);
              window.removeEventListener('nayanet:smart-share-failed',onFailed);
              reject(new Error('SMART_SHARE_OUTCOME_TIMEOUT_20000MS'));
            },20000);
            window.addEventListener('nayanet:smart-share-published',onPublished,{once:true});
            window.addEventListener('nayanet:smart-share-failed',onFailed,{once:true});
          }));

          await boundShareButton.click({force:true});

          const publishedDispatch=await publishedDispatchPromise;
          if(publishedDispatch.type==='nayanet:smart-share-failed'){
            throw Error('SMART_SHARE_RUNTIME_FAILED_AFTER_CLICK:'+publishedDispatch.error);
          }
          await ap.waitForFunction(expectedPublicationId=>{
            const buttons=[...document.querySelectorAll('[data-c4-kind="share-intel"]')];
            return buttons.some(b=>String(b.dataset.publicationId||'')===String(expectedPublicationId)&&String(b.dataset.smartShareState||'')==='PUBLISHED');
          },publishedDispatch.publicationId,{timeout:10000,polling:50});
          const afterClick=await ap.evaluate(expectedPublicationId=>{
            const handlerInvoked=Number(window.__smartShareDiag?.handlerInvoked||0);
            const proof=window.__smartShareProof||null;
            const dispatches=Array.isArray(window.__smartShareDiag?.dispatches)?window.__smartShareDiag.dispatches:[];
            const button=[...document.querySelectorAll('[data-c4-kind="share-intel"]')].find(b=>String(b.dataset.publicationId||'')===String(expectedPublicationId));
            return {
              handlerInvoked,
              proof,
              dispatches,
              buttonState:String(button?.dataset.smartShareState||''),
              publicationId:String(button?.dataset.publicationId||'')
            };
          },publishedDispatch.publicationId);
          console.log('SMART_SHARE_BROWSER_DIAGNOSTIC_AFTER_CLICK='+JSON.stringify(afterClick));
          console.log('SMART_SHARE_POST_HANDLER_TRACE='+JSON.stringify({
            publicationId:afterClick.publicationId,
            buttonState:afterClick.buttonState,
            handlerInvoked:afterClick.handlerInvoked,
            dispatches:afterClick.dispatches,
            observedPublishedDispatch:publishedDispatch,
            correlationMatch:publishedDispatch.type==='nayanet:smart-share-published'&&!!afterClick.publicationId&&publishedDispatch.publicationId===afterClick.publicationId,
            publicationIdPresent:!!afterClick.publicationId
          }));
          if(afterClick.handlerInvoked<1) throw Error('SMART_SHARE_DIAGNOSTIC_CLICK_DID_NOT_REACH_HANDLER');
          if(!afterClick.publicationId) throw Error('SMART_SHARE_PUBLICATION_ID_NOT_PROVEN_AFTER_CLICK');
          if(publishedDispatch.type!=='nayanet:smart-share-published') throw Error('SMART_SHARE_PUBLISHED_DISPATCH_NOT_OBSERVED');
          if(!publishedDispatch.publicationId) throw Error('SMART_SHARE_PUBLISHED_DISPATCH_PUBLICATION_ID_MISSING');
          if(publishedDispatch.publicationId!==afterClick.publicationId) throw Error('SMART_SHARE_PUBLISHED_DISPATCH_PUBLICATION_ID_MISMATCH:'+publishedDispatch.publicationId+'!='+afterClick.publicationId);
          if(afterClick.buttonState!=='PUBLISHED') throw Error('SMART_SHARE_PUBLICATION_COMPLETION_NOT_REFLECTED_IN_BUTTON');
          console.log('NAYANET_SMART_SHARE_BROWSER_BINDING_DIAGNOSTIC=PASS');

          try{await ap.screenshot({path:process.env.RUNNER_TEMP+'/smart-share-browser-diagnostic.png',fullPage:true,timeout:5000});console.log('SMART_SHARE_BROWSER_SCREENSHOT=PASS')}catch(e){console.log('SMART_SHARE_BROWSER_SCREENSHOT=UNAVAILABLE:'+String(e?.message||e))}

          fs.writeFileSync(process.env.RUNNER_TEMP+'/smart-share-governed-proof.json',JSON.stringify({project,runtime,proof:'NAYANET_SMART_SHARE_BROWSER_BINDING_DIAGNOSTIC=PASS',checks:{share_button_exists:beforeClick.exists?'PASS':'FAIL',nayaSmartShareBound:beforeClick.bound?'PASS':'FAIL',click_reached_bound_handler:afterClick.handlerInvoked>0?'PASS':'FAIL'},beforeClick,afterClick},null,2));
          if(true){
          const publicationId=String(await shareButton.getAttribute('data-publication-id')||'');
          if(!publicationId) throw Error('SMART_SHARE_PUBLICATION_ID_NOT_PROVEN');
          const publishedReceipts=await ap.evaluate(()=>window.NayaAssistantRuntime.retrieve());
          const publicationReceipt=publishedReceipts.find(x=>x.source==='nayanet-hub.smart-share.publication'&&x.metadata?.publication_id===publicationId);
          const receiptEventId=String(publicationReceipt?.event_id||'');
          const receiptId=String(publicationReceipt?.receipt_id||'');
          if(!receiptEventId) throw Error('SMART_SHARE_RECEIPT_EVENT_ID_NOT_PROVEN:'+publicationId);
          if(!receiptId) throw Error('SMART_SHARE_RECEIPT_ID_NOT_PROVEN:'+publicationId);

          const authorizationEvent=await ap.evaluate(({sourceId,userId})=>window.NayaAssistantRuntime.retrieve().then(rows=>(rows||[]).find(x=>x.type==='smart_share_authorization'&&x.parent_event_id===sourceId&&x.user_id===userId)),{sourceId:sourceEventId,userId:A.user.id});
          const authorizationEventId=String(authorizationEvent?.event_id||'');
          if(!authorizationEventId) throw Error('SMART_SHARE_AUTHORIZATION_EVENT_NOT_RETRIEVED:'+sourceEventId);
          const grants=await ap.evaluate(target=>window.NayaAssistantRuntime.listAuthorityGrants(target),A.user.id);
          const grant=grants.find(g=>g.constraints?.source_event_id===sourceEventId&&g.actions?.includes('smart_feed_publish')&&g.scope?.target===sourceRows[0].id);
          if(!grant||grant.status!=='ACTIVE') throw Error('SMART_SHARE_AUTHORITY_GRANT_NOT_RETRIEVED:'+JSON.stringify(grants));
          if(String(grant.constraints?.authorization_event_id||'')!==authorizationEventId) throw Error('SMART_SHARE_AUTHORITY_EVENT_LINEAGE_MISMATCH:'+JSON.stringify({authorizationEventId,grantConstraints:grant.constraints}));
          const validation=await req(base+'/rest/v1/rpc/nayanet_validate_authority_grant',{method:'POST',headers:headers(A.access_token),body:JSON.stringify({p_grant_id:grant.grant_id,p_action:'smart_feed_publish',p_target:sourceRows[0].id})});
          if(validation.status!=='AUTHORIZED') throw Error('SMART_SHARE_AUTHORITY_NOT_AUTHORIZED:'+JSON.stringify(validation));
          const collectiveA=await ap.evaluate(()=>window.NayaAssistantRuntime.smartFeed({stream:'collective',limit:50}));
          const publishedA=(collectiveA.items||[]).find(x=>x.publication_id===publicationId&&x.id===sourceRows[0].id);
          if(!publishedA) throw Error('SMART_SHARE_COLLECTIVE_RETRIEVAL_FAILED');
          const receiptRows=await ap.evaluate(id=>window.NayaAssistantRuntime.retrieve(id),receiptEventId);
          if(!receiptRows.some(x=>x.event_id===receiptEventId&&x.source==='nayanet-hub.smart-share.publication'&&x.metadata?.publication_id===publicationId)) throw Error('SMART_SHARE_RECEIPT_RETRIEVAL_FAILED');
          const publicationRow=await req(base+'/rest/v1/nayanet_intelligence_publications?select=id,intelligence_event_id,owner_id,status,consent_state&id=eq.'+publicationId,{headers:headers(A.access_token)});
          if(publicationRow.length!==1||publicationRow[0].status!=='published'||publicationRow[0].consent_state!=='explicit'||publicationRow[0].owner_id!==A.user.id) throw Error('SMART_SHARE_DATABASE_PERSISTENCE_FAILED:'+JSON.stringify(publicationRow));
          const Bctx=await contextFor(B,'B'); const bp=Bctx.page;
          const collectiveB=await bp.evaluate(()=>window.NayaAssistantRuntime.smartFeed({stream:'collective',limit:50}));
          if(!(collectiveB.items||[]).some(x=>x.publication_id===publicationId&&x.id===sourceRows[0].id)) throw Error('SMART_SHARE_COLLECTIVE_RECEIVER_RETRIEVAL_FAILED');
          const personalB=await bp.evaluate(()=>window.NayaAssistantRuntime.smartFeed({stream:'personal',limit:50}));
          if((personalB.items||[]).some(x=>x.id===sourceRows[0].id)) throw Error('SMART_SHARE_PRIVATE_SOURCE_LEAKED_TO_RECEIVER_PERSONAL_FEED');
          const replay=await ap.evaluate(id=>window.NayaAssistantRuntime.publishSmartFeed(id),sourceEventId);
          console.log('SMART_SHARE_REPLAY_TRACE='+JSON.stringify({publicationId,receiptEventId,receiptId,replayPublicationId:String(replay?.publication?.id||''),replayReceiptEventId:String(replay?.receipt?.event?.event_id||''),replayReceiptId:String(replay?.receipt?.receipt?.id||''),replayReceipt:replay?.receipt||null}));
          if(String(replay?.publication?.id||'')!==publicationId) throw Error('SMART_SHARE_REPLAY_PUBLICATION_ID_CHANGED');
          if(String(replay?.receipt?.event?.event_id||'')!==receiptEventId) throw Error('SMART_SHARE_REPLAY_RECEIPT_EVENT_ID_CHANGED');
          if(String(replay?.receipt?.receipt?.id||'')!==receiptId) throw Error('SMART_SHARE_REPLAY_RECEIPT_ID_CHANGED');
          const Cctx=await contextFor(C,'C'); const cp=Cctx.page;
          const collectiveC=await cp.evaluate(()=>window.NayaAssistantRuntime.smartFeed({stream:'collective',limit:50}));
          if(!(collectiveC.items||[]).some(x=>x.publication_id===publicationId&&x.id===sourceRows[0].id)) throw Error('SMART_SHARE_COLLECTIVE_THIRD_PARTY_RETRIEVAL_FAILED');
          const personalC=await cp.evaluate(()=>window.NayaAssistantRuntime.smartFeed({stream:'personal',limit:50}));
          if((personalC.items||[]).some(x=>x.id===sourceRows[0].id)) throw Error('SMART_SHARE_PRIVATE_SOURCE_LEAKED_TO_THIRD_PARTY_PERSONAL_FEED');
          await ap.reload({waitUntil:'domcontentloaded'}); await ap.waitForFunction(()=>Boolean(window.NayaAssistantRuntime),null,{timeout:10000});
          const reloadCollective=await ap.evaluate(()=>window.NayaAssistantRuntime.smartFeed({stream:'collective',limit:50}));
          if(!(reloadCollective.items||[]).some(x=>x.publication_id===publicationId&&x.id===sourceRows[0].id)) throw Error('SMART_SHARE_NOT_RETRIEVED_AFTER_RELOAD');
          const revoke=await ap.evaluate(id=>window.NayaAssistantRuntime.smartFeedAction({action:'revoke',publication_id:id}),publicationId);
          if(revoke?.publication?.status!=='revoked') throw Error('SMART_SHARE_REVOKE_NOT_CONFIRMED:'+JSON.stringify(revoke));
          const revokedDb=await req(base+'/rest/v1/nayanet_intelligence_publications?select=id,status,consent_state&id=eq.'+publicationId,{headers:headers(A.access_token)});
          if(revokedDb.length!==1||revokedDb[0].status!=='revoked') throw Error('SMART_SHARE_REVOKE_DATABASE_NOT_PERSISTED');
          const revokedA=await ap.evaluate(()=>window.NayaAssistantRuntime.smartFeed({stream:'collective',limit:50}));
          if((revokedA.items||[]).some(x=>x.publication_id===publicationId)) throw Error('SMART_SHARE_REVOKED_STILL_RETRIEVABLE_A');
          const revokedB=await bp.evaluate(()=>window.NayaAssistantRuntime.smartFeed({stream:'collective',limit:50}));
          if((revokedB.items||[]).some(x=>x.publication_id===publicationId)) throw Error('SMART_SHARE_REVOKED_STILL_RETRIEVABLE_B');
          const expiryAuthorization=await ap.evaluate(sourceId=>window.NayaAssistantRuntime.record({
            event_id:'smart-share-expiry-authorization-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),
            parent_event_id:sourceId,
            type:'smart_share_authorization',
            classification:'authorization',
            title:'Smart Share expiry authorization',
            content:JSON.stringify({source_event_id:sourceId,consent_state:'explicit',authorization_type:'explicit_human_share_click_expiry_probe'}),
            source:'nayanet-hub.smart-share.expiry-proof',
            status:'active',
            actor:'human',
            tags:['intelligent-hub','smart-share','authorization','expiry-proof'],
            metadata:{action:'smart_share_expiry_probe',consent_state:'explicit',source_event_id:sourceId,persistence_boundary:'authenticated-canonical-cognition'}
          }),sourceEventId);
          const expiryAuthorizationEventId=String(expiryAuthorization?.event?.event_id||'');
          if(!expiryAuthorizationEventId) throw Error('SMART_SHARE_EXPIRY_AUTHORIZATION_EVENT_NOT_RECORDED');
          const shortExpiry=await req(base+'/rest/v1/rpc/nayanet_issue_authority_grant',{method:'POST',headers:headers(A.access_token),body:JSON.stringify({p_subject_id:A.user.id,p_source_event_id:expiryAuthorizationEventId,p_mission_id:'NayaNET Smart Share',p_scope:{project_id:project,target:sourceRows[0].id},p_actions:['smart_feed_publish'],p_constraints:{consent_state:'explicit',source_event_id:sourceEventId,authorization_event_id:expiryAuthorizationEventId},p_expires_at:new Date(Date.now()+1000).toISOString(),p_evidence:{proof:'smart-share-expiry',source_event_id:sourceEventId,authorization_event_id:expiryAuthorizationEventId},p_parent_authority:null})});
          if(!shortExpiry?.grant_id) throw Error('SMART_SHARE_EXPIRY_GRANT_ISSUANCE_FAILED');
          await new Promise(r=>setTimeout(r,1500));
          const expiryValidation=await req(base+'/rest/v1/rpc/nayanet_validate_authority_grant',{method:'POST',headers:headers(A.access_token),body:JSON.stringify({p_grant_id:shortExpiry.grant_id,p_action:'smart_feed_publish',p_target:sourceRows[0].id})});
          if(expiryValidation.status!=='BLOCKED'||expiryValidation.reason!=='GRANT_EXPIRED') throw Error('SMART_SHARE_EXPIRY_NOT_DENIED:'+JSON.stringify(expiryValidation));
          const unauthorized=await req(base+'/rest/v1/rpc/nayanet_issue_authority_grant',{method:'POST',headers:headers(B.access_token),body:JSON.stringify({p_subject_id:B.user.id,p_source_event_id:sourceEventId,p_mission_id:'NayaNET Smart Share',p_scope:{project_id:project,target:sourceRows[0].id},p_actions:['smart_feed_publish'],p_constraints:{consent_state:'explicit',source_event_id:sourceEventId},p_expires_at:new Date(Date.now()+3600000).toISOString(),p_evidence:{proof:'smart-share-unauthorized-issuer'},p_parent_authority:null})}).then(()=>null).catch(e=>e);
          if(!unauthorized) throw Error('SMART_SHARE_UNAUTHORIZED_ISSUANCE_UNEXPECTEDLY_SUCCEEDED');
          const receipt={project,source_event_id:sourceEventId,source_receipt_id:sourceReceiptId,publication_id:publicationId,publication_receipt_event_id:receiptEventId,grant_id:grant.grant_id,runtime,proof:'NAYANET_SMART_SHARE_GOVERNED_PROOF=VERIFIED',checks:{source_owned:'PASS',authority:'PASS',publication:'PASS',database_persistence:'PASS',collective_retrieval:'PASS',receiver_retrieval:'PASS',third_party_isolation:'PASS',receipt_retrieval:'PASS',replay_idempotency:'PASS',reload_retrieval:'PASS',revocation:'PASS',revoked_retrieval_denied:'PASS',expiry_denied:'PASS',unauthorized_failure:'PASS'}};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/smart-share-governed-proof.json',JSON.stringify(receipt,null,2));
          console.log('NAYANET_SMART_SHARE_GOVERNED_PROOF=VERIFIED'); console.log(JSON.stringify(receipt));
          await Cctx.context.close(); await Bctx.context.close(); await Actx.context.close(); await browser.close();
          }
