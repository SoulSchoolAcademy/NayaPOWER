name: Retired — legacy Living Sun deploy

# Historical workflow retained as a non-mutating record. The active public Hub
# deployment authority is the exact-SHA, human-dispatched, kernel-gated V2 workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retirement
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-nayanet-hub-canonical-v2.yml
          echo 'LEGACY_LIVING_SUN_DEPLOY=RETIRED'
          echo 'ACTIVE_DEPLOY_WORKFLOW=.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
          echo 'REASON=deployment must never mutate main as part of release execution'
