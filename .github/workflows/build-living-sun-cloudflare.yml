name: Retired — legacy Living Sun deploy

# This workflow is intentionally non-deploying. The previous version mutated main
# during deployment and created an unsafe self-triggering release loop. The active
# canonical deployment is now .github/workflows/deploy-canonical-e02.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retirement
        run: |
          echo 'LEGACY_LIVING_SUN_DEPLOY=RETIRED'
          echo 'ACTIVE_DEPLOY_WORKFLOW=.github/workflows/deploy-canonical-e02.yml'
          echo 'REASON=deployment must never mutate main as part of release execution'
