name: doc-completeness-gate

# Documentation Completeness Gate — Naya 5, Documentation Completeness owner.
# Shawn's order (2026-10-10): every intelligence artifact in 4 forms.
# Runs on changed files only — pre-existing debt is tracked, not blocking.

on:
  pull_request:
    paths:
      - '.naya/capture/**'
      - 'BRAIN/01-GOVERNANCE/**'
      - 'BRAIN/07-LEARNING/**'
  push:
    branches: [main]
    paths:
      - '.naya/capture/**'
      - 'BRAIN/01-GOVERNANCE/**'

# Rate-limit discipline: a rapid push burst must not run N stale copies of
# this gate. Only the newest run per PR (or per ref on push) survives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check documentation completeness on changed files
        run: python3 tools/doc_completeness_check.py --changed-only
