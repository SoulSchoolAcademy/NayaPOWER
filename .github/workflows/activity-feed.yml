name: Activity Feed Projection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-feed-projection
  cancel-in-progress: true

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate activity feed projection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/activity_feed.py

      - name: Publish projection artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-feed-projection
          path: ACTIVITY-FEED.md
          if-no-files-found: error
          retention-days: 7
