name: 509 — Smart Board Runtime Authority V6
on:
  push:
    branches: [main]

concurrency:
  group: naya-509-smart-board-public-runtime
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_NAME: sparkling-shape-7ae5
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6

      - name: Governance authorization
        run: |
          set -euo pipefail
          python3 .naya/control-plane/workflow_gate.py --actor SoulSchoolAcademy --purpose "deploy the canonical 509 NayaNET Intelligent Hub public runtime" --permission deploy_public_runtime --request deploy_nayanet_hub_canonical --mission "establish and verify the single approved Smart Board reference without changing protected content or architecture" --uncertainty 3 --consequence 8 --irreversibility 8 --scope "public-runtime:sparkling-shape-7ae5:/" --evidence "workflow push at exact source SHA $GITHUB_SHA" --evidence "one-board execution contract" --evidence "deterministic one-board renderer and browser acceptance" > /tmp/auth.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/auth.json"))["status"])')" = AUTHORIZED

      - name: Validate one-board execution contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.naya/execution-contracts/509-SMART-BOARD-CURRENT.json').read_text())
          assert c['status']=='ACTIVE'
          assert c['contract']=='509-SMART-BOARD-CURRENT'
          assert c['boards']['count']==1
          assert c['boards']['titles']==['What Is Naya Power?']
          assert c['boards']['semantic_layers']==['human','child','grandma','naya','machine','learning','meaning','apply','benefit']
          assert c['boards']['labels']==['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO USE / HOW TO APPLY',"WHAT'S IN IT FOR YOU"]
          assert c['sidebar']['exact_items']==[['Your Intelligence Today','intelligence','#9d75ff'],['Your Reports','reports','#6675ff'],['Intelligent Library','library','#55b9ee'],['Smart Share','start','#55e39a'],['Smart Ledger','ledgers','#b8ee57'],['Your Connections','connections','#f1d75a'],['Smart Lists','lists','#e8c766'],['Smart Spaces','spaces','#f09a4a'],['Smart Mail','mail','#ff5e6c'],['Settings','settings','#d86cff']]
          print('EXECUTION_CONTRACT=PASS')
          PY

      - name: Build candidate
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          cp 'SMART FEED CONTENT' release/public/NAYANET/SMART-FEED-CONTENT.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('release/public/index.html'); h=p.read_text()
          legacy=['509-AAA-SMART-NOTE-CANONICAL-RENDERER.js','509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js','509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js','509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js','509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V3.js','509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js','509-AAA-SMART-BOARD-V6-CANONICAL-CONTENT-RUNTIME.js','509-AAA-SMART-BOARD-V10-FINAL-GEOMETRY.js','509-AAA-SMART-BOARD-V20-CANONICAL-LAYER-RECONCILER.js','509-AAA-SMART-BOARD-V21-FINAL-ACCEPTANCE-FIX.js','509-AAA-SMART-BOARD-V22-CANONICAL-RESTORE.js','509-AAA-SMART-BOARD-V23-DETERMINISTIC-RESTORE.js','509-AAA-SMART-BOARD-V24-OUTER-CANONICAL-LOCK.js','509-AAA-SMART-BOARD-V25-FINAL-CANONICAL-RESTORE.js','509-AAA-SMART-BOARD-V26-CANONICAL-OUTER-RESTORE.js','509-AAA-SMART-BOARD-STRUCTURAL-LOCK.js']
          for n in legacy: h=re.sub(r'<script[^>]+%s[^>]*></script>'%re.escape(n),'',h,flags=re.I)
          shim='<script>window.$=window.$||((s,r=document)=>r.querySelector(s));window.$$=window.$$||((s,r=document)=>[...r.querySelectorAll(s)]);</script>'
          code=Path('NAYANET/509-AAA-SMART-BOARD-ONE-BOARD-REFERENCE.js').read_text().replace('</script>','<\\/script>')
          h=h.replace('</head>',shim+'</head>',1)
          h=h.replace('</body>','<script>'+code+'</script></body>',1)
          p.write_text(h)
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname==='/NAYANET/SMART-FEED-CONTENT.txt'){const a=await env.ASSETS.fetch(new Request(new URL('/NAYANET/SMART-FEED-CONTENT.txt',request.url),request));if(a.ok)return new Response(a.body,{headers:{'Content-Type':'text/plain; charset=utf-8','Cache-Control':'no-store'}})}const t=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(t);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          printf '{"name":"%s","main":"worker.js","compatibility_date":"2026-09-08","account_id":"%s","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"%s"}}\n' "$WORKER_NAME" "$ACCOUNT_ID" "$GITHUB_SHA" > release/wrangler.jsonc

      - name: Browser acceptance
        run: |
          set -euo pipefail
          mkdir -p /tmp/naya-browser && cd /tmp/naya-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          const L=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO USE / HOW TO APPLY',"WHAT'S IN IT FOR YOU"];
          const K=['human','child','grandma','naya','machine','learning','meaning','apply','benefit'];
          const C=['#ff3bbf','#9d75ff','#6675ff','#c97a4a','#35d39a','#b8ee57','#f1d75a','#e8c766','#e9edf5'];
          const S=['Your Intelligence Today','Your Reports','Intelligent Library','Smart Share','Smart Ledger','Your Connections','Smart Lists','Smart Spaces','Smart Mail','Settings'];
          const SK=['intelligence','reports','library','start','ledgers','connections','lists','spaces','mail','settings'];
          const SC=['#9d75ff','#6675ff','#55b9ee','#55e39a','#b8ee57','#f1d75a','#e8c766','#f09a4a','#ff5e6c','#d86cff'];
          const browser=await chromium.launch();
          for(const [name,w,h] of [['desktop',1440,1400],['tablet',900,1200],['mobile',390,1100]]){
            const p=await browser.newPage({viewport:{width:w,height:h}});const errors=[];p.on('pageerror',x=>errors.push(x.message));
            await p.goto(process.env.TARGET+'/?accept='+name+'_'+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForTimeout(5000);
            if(errors.length)throw Error(name+': PAGEERROR '+errors.join('|'));
            const d=await p.evaluate(({L,K,C,S,SK,SC})=>{const text=v=>(v?.textContent||'').replace(/\s+/g,' ').trim();const bs=[...document.querySelectorAll('.blocks>.block.naya509-reference')];const nav=[...document.querySelectorAll('.rail .nav button,.rail .nav a')];return{bs:bs.map(b=>{const r=b.getBoundingClientRect(),n=b.querySelector('.naya509-one-nutshell'),ls=[...b.querySelectorAll('.naya509-one-section')].map(x=>{const z=x.getBoundingClientRect();return{k:x.dataset.semanticLayer,l:text(x.querySelector('.naya509-one-title')),c:x.dataset.layerColor,x:z.x,w:z.width,y:z.y,body:text(x.querySelector('.naya509-one-body'))}});return{title:text(b.querySelector('h3')),x:r.x,w:r.width,y:r.y,n:n?{x:n.getBoundingClientRect().x,w:n.getBoundingClientRect().width}:null,l:ls,a:[...b.querySelectorAll('.naya509-one-actions button')].map(text)}}),nav:nav.map(x=>({t:text(x),k:x.dataset.nayaOne,c:getComputedStyle(x).getPropertyValue('--sem').trim()}))};},{L,K,C,S,SK,SC});
            if(d.bs.length!==1||d.bs[0].title!=='What Is Naya Power?')throw Error(name+': ONE_BOARD');
            if(d.bs[0].l.length!==9)throw Error(name+': SECTION_COUNT');
            if(JSON.stringify(d.bs[0].l.map(x=>x.k))!==JSON.stringify(K))throw Error(name+': SECTION_KEYS');
            if(JSON.stringify(d.bs[0].l.map(x=>x.l))!==JSON.stringify(L))throw Error(name+': SECTION_LABELS');
            if(JSON.stringify(d.bs[0].l.map(x=>x.c.toLowerCase()))!==JSON.stringify(C))throw Error(name+': SECTION_COLORS');
            if(d.bs[0].l.some(x=>!x.body))throw Error(name+': EMPTY_SECTION');
            if(Math.round(d.bs[0].n.x)!==Math.round(d.bs[0].x)||Math.round(d.bs[0].n.w)!==Math.round(d.bs[0].w))throw Error(name+': NUTSHELL_WIDTH');
            if(d.bs[0].l.some(x=>Math.round(x.x)!==Math.round(d.bs[0].x)||Math.round(x.w)!==Math.round(d.bs[0].w)))throw Error(name+': SECTION_WIDTH');
            if(d.bs[0].l.some((x,i,a)=>i&&x.y<=a[i-1].y))throw Error(name+': VERTICAL_STACK');
            if(d.bs[0].a.join('|')!=='Create Space|Favorite|Save')throw Error(name+': ACTIONS');
            if(d.nav.length!==10||JSON.stringify(d.nav.map(x=>x.t))!==JSON.stringify(S))throw Error(name+': SIDEBAR_NAMES');
            if(JSON.stringify(d.nav.map(x=>x.k))!==JSON.stringify(SK))throw Error(name+': SIDEBAR_KEYS');
            if(JSON.stringify(d.nav.map(x=>x.c.toLowerCase()))!==JSON.stringify(SC))throw Error(name+': SIDEBAR_COLORS');
            console.log(name+': PASS');await p.close();
          }
          await browser.close();console.log('BROWSER_ACCEPTANCE=PASS');
          EOF
          cd "$GITHUB_WORKSPACE/release/public" && python3 -m http.server 8787 >/tmp/naya-http.log 2>&1 & echo $! >/tmp/naya-http.pid
          sleep 2
          TARGET=http://127.0.0.1:8787 node /tmp/naya-browser/verify.mjs
          kill "$(cat /tmp/naya-http.pid)"

      - name: Deploy canonical runtime
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc

      - name: Post-deploy browser acceptance
        run: |
          set -euo pipefail
          cd /tmp/naya-browser
          TARGET="$RUNTIME" node verify.mjs
