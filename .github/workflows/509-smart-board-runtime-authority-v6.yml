name: 509 — Smart Board Runtime Authority V6
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_NAME: sparkling-shape-7ae5
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6

      - name: Governance authorization
        run: |
          set -euo pipefail
          python3 .naya/control-plane/workflow_gate.py --actor SoulSchoolAcademy --purpose "deploy the canonical 509 NayaNET Intelligent Hub public runtime" --permission deploy_public_runtime --request deploy_nayanet_hub_canonical --mission "restore the approved Smart Board and sidebar without changing protected content or architecture" --uncertainty 3 --consequence 8 --irreversibility 8 --scope "public-runtime:sparkling-shape-7ae5:/" --evidence "workflow push at exact source SHA $GITHUB_SHA" --evidence "singular Smart Board renderer and browser acceptance" > /tmp/auth.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/auth.json"))["status"])')" = AUTHORIZED

      - name: Validate execution contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.naya/execution-contracts/509-SMART-BOARD-CURRENT.json').read_text())
          assert c['status']=='ACTIVE'
          assert c['contract']=='509-SMART-BOARD-CURRENT'
          assert c['principle'].startswith('Requested change = authorized change')
          assert c['boards']['count']==1
          assert c['boards']['titles']==['What Is Naya Power?']
          assert len(c['boards']['semantic_layers'])==9
          assert len(c['sidebar']['exact_items'])==10
          assert c['sidebar']['forbidden']==['Collective','Evidence','Connection','Smart Mail — New']
          print('EXECUTION_CONTRACT=PASS')
          PY

      - name: Build canonical release
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          cp 'SMART FEED CONTENT' release/public/NAYANET/SMART-FEED-CONTENT.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('release/public/index.html'); h=p.read_text()
          legacy=['509-AAA-SMART-NOTE-CANONICAL-RENDERER.js','509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js','509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js','509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js','509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V3.js','509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js','509-AAA-SMART-BOARD-V6-CANONICAL-CONTENT-RUNTIME.js','509-AAA-SMART-BOARD-V10-FINAL-GEOMETRY.js','509-AAA-SMART-BOARD-V20-CANONICAL-LAYER-RECONCILER.js','509-AAA-SMART-BOARD-V21-FINAL-ACCEPTANCE-FIX.js','509-AAA-SMART-BOARD-V22-CANONICAL-RESTORE.js','509-AAA-SMART-BOARD-V23-DETERMINISTIC-RESTORE.js','509-AAA-SMART-BOARD-V24-OUTER-CANONICAL-LOCK.js','509-AAA-SMART-BOARD-V25-FINAL-CANONICAL-RESTORE.js']
          for n in legacy: h=re.sub(r'<script[^>]+%s[^>]*></script>'%re.escape(n),'',h,flags=re.I)
          shim='<script>window.$=window.$||((s,r=document)=>r.querySelector(s));window.$$=window.$$||((s,r=document)=>[...r.querySelectorAll(s)]);</script>'
          code=Path('NAYANET/509-AAA-SMART-BOARD-V26-CANONICAL-OUTER-RESTORE.js').read_text().replace('</script>','<\\/script>')
          lock=Path('NAYANET/509-AAA-SMART-BOARD-STRUCTURAL-LOCK.js').read_text().replace('</script>','<\\/script>')
          import subprocess,json
          stamp=subprocess.check_output(['git','log','-1','--format=%cI','--','SMART FEED CONTENT'],text=True).strip() or subprocess.check_output(['git','log','-1','--format=%cI','--','snapshots/NayaNET-509-AAA-CURRENT.html'],text=True).strip()
          h=h.replace('</head>',shim+'</head>',1)
          h=h.replace('</body>','<script>'+code+'</script><script>window.NAYA509_SOURCE_TIMESTAMP='+json.dumps(stamp)+'</script><script>'+lock+'</script></body>',1)
          p.write_text(h)
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname==='/NAYANET/SMART-FEED-CONTENT.txt'){const a=await env.ASSETS.fetch(new Request(new URL('/NAYANET/SMART-FEED-CONTENT.txt',request.url),request));if(a.ok)return new Response(a.body,{headers:{'Content-Type':'text/plain; charset=utf-8','Cache-Control':'no-store'}})}const t=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(t);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          printf '{"name":"%s","main":"worker.js","compatibility_date":"2026-09-08","account_id":"%s","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"%s"}}\n' "$WORKER_NAME" "$ACCOUNT_ID" "$GITHUB_SHA" > release/wrangler.jsonc

      - name: Deploy canonical runtime
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc

      - name: Actual browser runtime acceptance
        run: |
          set -euo pipefail
          mkdir -p /tmp/naya-browser && cd /tmp/naya-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          const L=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY IT',"WHAT'S IN IT FOR YOU"];
          const K=['human','child','grandma','naya','machine','learning','meaning','apply','benefit'];
          const C=['#ff3bbf','#9d75ff','#6675ff','#c97a4a','#35d39a','#b8ee57','#f1d75a','#e8c766','#e9edf5'];
          const S=['Intelligent','Reports','Intelligent Library','Smart Start','Smart Ledgers','Peer Connections','Smart Lists','Smart Spaces','Smart Mail','Settings'];
          const SK=['intelligence','reports','library','start','ledgers','connections','lists','spaces','mail','settings'];
          const SC=['#9d75ff','#6675ff','#55b9ee','#55e39a','#b8ee57','#f1d75a','#e8c766','#f09a4a','#ff5e6c','#d86cff'];
          const FORB=['SOURCE SEPARATED','PROVIDENCE','TRUTH','PROTECTION','COLLECTIVE','EVIDENCE','SMART MAIL — NEW'];
          const browser=await chromium.launch();
          for(const [name,w,h] of [['desktop',1440,1400],['tablet',900,1200],['mobile',390,1100]]){
            const p=await browser.newPage({viewport:{width:w,height:h}});const errors=[];p.on('pageerror',x=>errors.push(x.message));
            await p.goto(process.env.RUNTIME+'/?accept='+name+'_'+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForTimeout(30000);
            if(errors.length)throw Error(name+': PAGEERROR '+errors.join('|'));
            const d=await p.evaluate(({L,K,C,S,SK,SC,FORB})=>{const text=e=>typeof e==='string'?e.replace(/\s+/g,' ').trim():(e?.textContent||'').replace(/\s+/g,' ').trim();const bs=[...document.querySelectorAll('.block[data-real-smart-note]')];const nav=[...document.querySelectorAll('.rail .nav button')];return{bs:bs.map(b=>{const r=b.getBoundingClientRect(),ls=[...b.querySelectorAll('.naya509-section')].map(x=>{const z=x.getBoundingClientRect();return{k:x.dataset.semanticLayer||x.querySelector('.naya509-section-title')?.textContent?.toLowerCase(),l:text(x.querySelector('.naya509-section-title')),x:z.x,w:z.width,y:z.y,body:text(x.querySelector('.naya509-section-body'))}});const a=[...b.querySelectorAll('.naya509-board-actions .action')];return{title:text(b.querySelector('h3')),x:r.x,w:r.width,y:r.y,l:ls,a:a.map(x=>x.dataset.c4Kind),actionsRect:a[0]?.getBoundingClientRect().toJSON(),titleRect:b.querySelector('h3')?.getBoundingClientRect().toJSON()}}),nav:nav.map(x=>({t:text(x).replace(/\s*[—-]\s*New$/i,''),k:x.dataset.nayaSemantic,c:x.dataset.nayaColor})),controls:[...document.querySelectorAll('button,a,[role="button"]')].map(text),body:text(document.body)};},{L,K,C,S,SK,SC,FORB});
            if(d.bs.length!==1||d.bs[0].title!=='What Is Naya Power?')throw Error(name+': ONE_BOARD');
            const b=d.bs[0];if(b.l.length!==9)throw Error(name+': NINE_SECTIONS');
            if(JSON.stringify(b.l.map(x=>x.l))!==JSON.stringify(L))throw Error(name+': SECTION_ORDER');
            if(JSON.stringify(b.l.map(x=>x.k))!==JSON.stringify(K))throw Error(name+': SECTION_KEYS');
            if(b.l.some((x,i)=>!x.body||x.x!==b.x||x.w!==b.w||(i&&x.y<=b.l[i-1].y)))throw Error(name+': SECTION_GEOMETRY_OR_CONTENT');
            if(b.a.join(',')!=='create-space,favorite,save')throw Error(name+': ACTIONS');
            if(b.actionsRect&&b.titleRect&&b.actionsRect.bottom>b.titleRect.bottom+2)throw Error(name+': TOP_ACTION_PLACEMENT');
            if(d.nav.length!==10||JSON.stringify(d.nav.map(x=>x.t))!==JSON.stringify(S))throw Error(name+': SIDEBAR_NAMES');
            if(JSON.stringify(d.nav.map(x=>x.k))!==JSON.stringify(SK))throw Error(name+': SIDEBAR_KEYS');
            if(JSON.stringify(d.nav.map(x=>x.c.toLowerCase()))!==JSON.stringify(SC.map(x=>x.toLowerCase())))throw Error(name+': SIDEBAR_COLORS');
            for(const q of FORB)if(d.controls.some(t=>t.toUpperCase()===q))throw Error(name+': FORBIDDEN '+q);
            if(/SOURCE\s*,?\s*UNDERSTAND\s*,?\s*ACT\s*,?\s*VERIFY\s*,?\s*LEARN/i.test(d.body))throw Error(name+': SOURCE_BAR');
            console.log(name+': PASS');await p.close();
          }
          await browser.close();console.log('BROWSER_RUNTIME_VERIFICATION=PASS');
          EOF
          RUNTIME="$RUNTIME" node verify.mjs
