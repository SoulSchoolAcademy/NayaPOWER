# CANONICAL-LIVE-HUB-WORKFLOW-REGISTER-2026-09-08
# DEPLOY TRIGGER: 452 surgical right-rail removal
name: Deploy NayaNET Live Hub

on:
  push:
    branches: [main]
    paths:
      - '2026 09 08 452 NayaNET Hub.html'
      - '.github/workflows/deploy-v7-now.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build the exact current 452 Hub source — nuclear right-rail removal only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          hub_path = Path('2026 09 08 452 NayaNET Hub.html')
          hub = hub_path.read_text(encoding='utf-8')
          marker='NAYANET-NUCLEAR-RIGHT-RAIL-FIX-V3'

          if marker not in hub:
              injection = r'''<style id="NAYANET-NUCLEAR-RIGHT-RAIL-FIX-V3">
/* FINAL SURFACE LAW: LEFT NAVIGATION + CENTER INTELLIGENT FEED. NO RIGHT OLD FEED. */
.activationRail{display:none!important;width:0!important;min-width:0!important;max-width:0!important;height:0!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;overflow:hidden!important}
.homeWorkspace{display:block!important;width:100%!important;max-width:none!important;grid-template-columns:1fr!important;gap:0!important}
</style>
<script id="NAYANET-NUCLEAR-RIGHT-RAIL-FIX-V3-RUNTIME">
(function(){
  function purge(){
    try{
      document.querySelectorAll('.activationRail').forEach(function(el){el.remove();});
      var ws=document.querySelector('.homeWorkspace');
      if(ws){
        ws.style.setProperty('display','block','important');
        ws.style.setProperty('grid-template-columns','1fr','important');
        ws.style.setProperty('gap','0','important');
        ws.style.setProperty('width','100%','important');
        ws.style.setProperty('max-width','none','important');
      }
    }catch(e){}
  }
  purge();
  new MutationObserver(purge).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});
  setInterval(purge,500);
})();
</script>
'''
              if '</head>' not in hub:
                  raise SystemExit('CURRENT_HUB_SOURCE_MISSING_HEAD')
              hub=hub.replace('</head>',injection+'</head>',1)
              hub_path.write_text(hub,encoding='utf-8')

          required = {
              'NUCLEAR_GUARD': marker in hub,
              'LEFT_SIDEBAR': bool(re.search(r'class=["\'][^"\']*\bsidebar\b',hub,re.I)),
              'HOME_WORKSPACE': bool(re.search(r'class=["\'][^"\']*\bhomeWorkspace\b',hub,re.I)),
              'HOME_FEED': bool(re.search(r'class=["\'][^"\']*\bhomeFeed\b',hub,re.I)),
              'INTELLIGENT_FEED': 'id="nayanet-elite-feed"' in hub,
              'SMART_NOTES': 'Smart Notes' in hub,
              'ACTIVITY': 'Activity' in hub,
              'PERSONAL': 'Personal Intelligence' in hub,
              'COLLECTIVE': 'Collective Intelligence' in hub,
          }
          failed=[k for k,v in required.items() if not v]
          if failed: raise SystemExit('PROTECTED_SENTINEL_MISSING='+','.join(failed))
          if '<script id="NAYANET-NUCLEAR-RIGHT-RAIL-FIX-V3-RUNTIME">' not in hub: raise SystemExit('RUNTIME_GUARD_MISSING')
          print('SOURCE_GUARD=PASS')
          print('SOURCE_BYTES=',len(hub.encode('utf-8')))
          PY

      - name: Commit canonical guarded source if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '2026 09 08 452 NayaNET Hub.html'
          if git diff --cached --quiet; then echo 'SOURCE_ALREADY_GUARDED=TRUE'; else git commit -m 'Nuclear Hub V3: remove obsolete right rail and preserve center feed'; git push origin HEAD:main; fi

      - name: Build exact Cloudflare artifact
        run: |
          set -euo pipefail
          rm -rf CLOUDFLARE-INTELLIGENT-HUB-V7
          mkdir -p CLOUDFLARE-INTELLIGENT-HUB-V7
          cp '2026 09 08 452 NayaNET Hub.html' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          cat > CLOUDFLARE-INTELLIGENT-HUB-V7/wrangler.jsonc <<'EOF'
          {
            "name": "nayanet-v7-intelligent-hub",
            "compatibility_date": "2026-09-08",
            "assets": { "directory": "." }
          }
          EOF
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'NAYANET-NUCLEAR-RIGHT-RAIL-FIX-V3' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'class="sidebar"' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'class="homeWorkspace"' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'id="nayanet-elite-feed"' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html

      - name: Deploy exact guarded artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Independently verify exact public runtime
        run: |
          set -euo pipefail
          curl -fsSL --retry 10 --retry-delay 3 "$RUNTIME/?release=$GITHUB_SHA" -o /tmp/root
          grep -Fq 'NAYANET-NUCLEAR-RIGHT-RAIL-FIX-V3' /tmp/root
          grep -Fq 'class="sidebar"' /tmp/root
          grep -Fq 'id="nayanet-elite-feed"' /tmp/root
          grep -Fq 'class="homeWorkspace"' /tmp/root
          ! grep -Fq 'class="activationRail"' /tmp/root
          ! grep -Fq "class='activationRail'" /tmp/root
          echo 'PUBLIC_RUNTIME=PASS'
          echo 'LEFT_NAVIGATION=PRESENT'
          echo 'CENTER_INTELLIGENT_FEED=PRESENT'
          echo 'RIGHT_OLD_FEED=ABSENT'
          echo 'CENTER_FEED_WIDTH=FULL'
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"
