# CANONICAL-LIVE-HUB-WORKFLOW-REGISTER-2026-09-09
# FINAL-TRIGGER-CANONICAL-SMART-FEED
name: Deploy NayaNET Live Hub

on:
  push:
    branches: [main]
    paths:
      - '2026 09 08 452 NayaNET Hub.html'
      - '.naya/build/NAYANET-SMART-FEED-MASTER-V1.html'
      - '.github/workflows/deploy-v7-now.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HUB: '2026 09 08 452 NayaNET Hub.html'
  PAYLOAD: '.naya/build/NAYANET-SMART-FEED-MASTER-V1.html'
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Build canonical Smart Feed into exact 452 source
        shell: python
        run: |
          from pathlib import Path
          import re
          hub=Path('${{ env.HUB }}')
          payload=Path('${{ env.PAYLOAD }}')
          s=hub.read_text(encoding='utf-8')
          p=payload.read_text(encoding='utf-8')
          if 'NAYANET-SMART-FEED-MASTER-V1' not in p: raise SystemExit('PAYLOAD_MARKER_MISSING')
          p=p.replace('</article>}function render', "</article>'}function render")
          s=re.sub(r'<!-- NAYANET SMART FEED MASTER V1 -->[\s\S]*?</script>\s*(?=</head>)','',s,count=1)
          if '</head>' not in s: raise SystemExit('HEAD_BOUNDARY_MISSING')
          s=s.replace('</head>',p+'\n</head>',1)
          hub.write_text(s,encoding='utf-8')
          print('SMART_FEED_MASTER_APPLIED=TRUE')
      - name: JavaScript syntax gate
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path('${{ env.HUB }}').read_text(encoding='utf-8')
          m=re.search(r'<script id="NAYANET-SMART-FEED-MASTER-V1-RUNTIME">([\s\S]*?)</script>',s)
          if not m: raise SystemExit('SMART_FEED_RUNTIME_SCRIPT_MISSING')
          Path('/tmp/smart-feed.js').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/smart-feed.js'],text=True,capture_output=True)
          if r.returncode:
              print(r.stderr); raise SystemExit('SMART_FEED_JS_SYNTAX_FAILED')
          print('SMART_FEED_JS_SYNTAX=PASS')
      - name: Protected house gate
        shell: bash
        run: |
          set -euo pipefail
          H="$HUB"
          test -s "$H"
          grep -Fq 'NAYANET-SMART-FEED-MASTER-V1' "$H"
          grep -Fq 'id="nayaSmartFeedMaster"' "$H"
          grep -Fq 'ACTIVITY INTELLIGENCE' "$H"
          grep -Fq 'PERSONAL INTELLIGENCE' "$H"
          grep -Fq 'COLLECTIVE INTELLIGENCE' "$H"
          grep -Fq 'class="sidebar"' "$H"
          grep -Fq 'class="homeWorkspace"' "$H"
          grep -Fq 'class="homeFeed"' "$H"
          grep -Fq 'id="page-notes"' "$H"
          grep -Fq 'id="page-collective"' "$H"
          grep -Fq 'id="page-evidence"' "$H"
          grep -Fq 'id="page-connections"' "$H"
          grep -Fq 'id="page-mail"' "$H"
          echo 'PROTECTED_HOUSE_GATE=PASS'
      - name: Commit canonical 452 source if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$HUB"
          if git diff --cached --quiet; then echo 'CANONICAL_SOURCE_ALREADY_CURRENT=TRUE'; else git commit -m 'Build canonical NayaNET Smart Feed master'; git push origin HEAD:main; fi
      - name: Prepare isolated Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf CLOUDFLARE-INTELLIGENT-HUB-V7
          mkdir -p CLOUDFLARE-INTELLIGENT-HUB-V7/public
          cp "$HUB" CLOUDFLARE-INTELLIGENT-HUB-V7/public/index.html
          cat > CLOUDFLARE-INTELLIGENT-HUB-V7/wrangler.jsonc <<'JSON'
          {"name":"nayanet-v7-intelligent-hub","compatibility_date":"2026-09-08","assets":{"directory":"./public"}}
          JSON
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/public/index.html
          grep -Fq 'NAYANET-SMART-FEED-MASTER-V1' CLOUDFLARE-INTELLIGENT-HUB-V7/public/index.html
          echo 'ARTIFACT_GATE=PASS'
      - name: Deploy exact artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc
      - name: Independently verify exact public runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 10 --retry-delay 3 "$RUNTIME/?release=$GITHUB_SHA" -o /tmp/root
          grep -Fq 'NAYANET-SMART-FEED-MASTER-V1' /tmp/root
          grep -Fq 'id="nayaSmartFeedMaster"' /tmp/root
          grep -Fq 'ACTIVITY INTELLIGENCE' /tmp/root
          grep -Fq 'PERSONAL INTELLIGENCE' /tmp/root
          grep -Fq 'COLLECTIVE INTELLIGENCE' /tmp/root
          grep -Fq 'class="sidebar"' /tmp/root
          grep -Fq 'class="homeWorkspace"' /tmp/root
          echo 'PUBLIC_RUNTIME=PASS'
          echo 'SMART_FEED_RUNTIME=PASS'
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"
