name: Deploy NayaNET Live Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the actual NayaNET Live Hub
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          hub=Path('2026 09 07  1:14 NAYANETHUBONE.html').read_text()
          layers=[
            Path('2026 09 08 12:40 NAYANET INTELLIGENT FEED V3.js'),
            Path('2026 09 08 22:00 NAYANET INTELLIGENT FEED V4 SURGICAL POLISH.js'),
            Path('2026 09 08 NAYANET INTELLIGENT HUB V10 RAIL POLISH.js'),
            Path('2026 09 08 NAYANET INTELLIGENT HUB V11 FINAL POLISH.js'),
            Path('2026 09 08 NAYANET INTELLIGENT HUB V12 DEPLOYMENT AUTHORITY.js'),
            Path('CLOUDFLARE-INTELLIGENT-HUB-V7/v7-ten-star-play-naya-polish.js'),
          ]
          if '</body>' not in hub: raise SystemExit('Missing body boundary in authoritative Hub')
          out=hub
          for layer in layers:
              js=layer.read_text()
              out=out.replace('</body>', '<script>\n'+js+'\n</script>\n</body>', 1)
          d=Path('CLOUDFLARE-INTELLIGENT-HUB-V7'); d.mkdir(exist_ok=True)
          (d/'index.html').write_text(out)
          (d/'assets'/'index.html').parent.mkdir(exist_ok=True)
          (d/'assets'/'index.html').write_text(out)
          (d/'assets'/'_redirects').write_text('/index.html 200\n')
          Path('NAYANET-LIVE-HUB.html').write_text(out)
          print('LIVE_HUB_BYTES=',len(out.encode('utf-8')))
          PY

      - name: Validate the assembled Hub
        run: |
          set -euo pipefail
          for f in \
            '2026 09 08 12:40 NAYANET INTELLIGENT FEED V3.js' \
            '2026 09 08 22:00 NAYANET INTELLIGENT FEED V4 SURGICAL POLISH.js' \
            '2026 09 08 NAYANET INTELLIGENT HUB V10 RAIL POLISH.js' \
            '2026 09 08 NAYANET INTELLIGENT HUB V11 FINAL POLISH.js' \
            '2026 09 08 NAYANET INTELLIGENT HUB V12 DEPLOYMENT AUTHORITY.js' \
            'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-ten-star-play-naya-polish.js'; do node --check "$f"; done
          OUT='NAYANET-LIVE-HUB.html'
          for s in 'COLLECTIVE INTELLIGENCE' 'PERSONAL INTELLIGENCE' 'ACTIVITY' 'HOW NAYANET' 'IN A NUTSHELL' 'HOW TO USE IT' 'PLAY NAYA' 'YOUR DAILY INTELLIGENCE REPORT' 'CONNECT GITHUB' 'SYNC INTELLIGENCE' 'GET CONNECTED' 'YOUR INTELLIGENCE TODAY' 'YOUR REPORTS' 'INTELLIGENT LIBRARY' 'SMART LISTS' 'SMART SHARE' 'YOUR EVIDENCE' 'YOUR CONNECTIONS' 'SMART MAIL' 'SMART SPACES'; do grep -Fq "$s" "$OUT"; done
          for s in 'CAPTURE THE MEANING' 'ONE EVENT, MANY INTELLIGENT PERSPECTIVES' 'EXPERIENCE COMPOUNDS' 'COLLECTIVE WISDOM REQUIRES CONSENT' 'THE DAILY BRIEFING TURNS MEMORY INTO ACTION'; do grep -Fq "$s" "$OUT"; done
          for s in 'COLLECTIVE SIGNAL' 'NETWORK WISDOM' 'SHARED INTELLIGENCE' 'YOUR COMPOUNDING INTELLIGENCE' 'STANDARD SMART NOTE GRAMMAR'; do ! grep -Fq "$s" "$OUT"; done
          python3 - <<'PY'
          from pathlib import Path
          out=Path('NAYANET-LIVE-HUB.html').read_text()
          marker='/* NayaNET V7 — surgical Play Naya polish layer.'
          pos=out.find(marker)
          if pos < 0:
              raise SystemExit('Play Naya source missing')
          open_pos=out.rfind('<script>',0,pos)
          close_pos=out.rfind('</script>',0,pos)
          if open_pos < 0 or open_pos <= close_pos:
              raise SystemExit('Play Naya source marker is outside the immediately containing script tag')
          if len(out.encode('utf-8')) < 200000:
              raise SystemExit('Assembled Live Hub unexpectedly small')
          print('ASSEMBLED_LIVE_HUB=PASS')
          print('THREE_ZONE_NAV=PASS')
          print('RIGHT_RAIL=PASS')
          print('PLAY_NAYA_SCRIPT_BOUNDARY=PASS')
          print('LIVE_HUB_BYTES=',len(out.encode('utf-8')))
          PY

      - name: Persist the exact assembled source to GitHub
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NAYANET-LIVE-HUB.html CLOUDFLARE-INTELLIGENT-HUB-V7/index.html CLOUDFLARE-INTELLIGENT-HUB-V7/assets/index.html CLOUDFLARE-INTELLIGENT-HUB-V7/assets/_redirects
          if git diff --cached --quiet; then
            echo 'ASSEMBLED_SOURCE_CHANGED=NO'
          else
            git commit -m 'Build NayaNET Live Hub source [skip ci]'
            git push
            echo 'ASSEMBLED_SOURCE_CHANGED=YES'
          fi

      - name: Deploy the exact assembled source
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Verify exact public runtime
        run: |
          set -euo pipefail
          q="release=${GITHUB_SHA}"
          curl -fsSL --retry 8 --retry-delay 3 "$RUNTIME/?$q" -o /tmp/root
          curl -fsSL --retry 8 --retry-delay 3 "$SMART_LINK?$q" -o /tmp/smart
          for s in 'COLLECTIVE INTELLIGENCE' 'PERSONAL INTELLIGENCE' 'ACTIVITY' 'HOW NAYANET' 'IN A NUTSHELL' 'HOW TO USE IT' 'PLAY NAYA' 'YOUR DAILY INTELLIGENCE REPORT' 'CONNECT GITHUB' 'SYNC INTELLIGENCE' 'GET CONNECTED' 'YOUR INTELLIGENCE TODAY' 'YOUR REPORTS' 'INTELLIGENT LIBRARY' 'SMART LISTS' 'SMART SHARE' 'YOUR EVIDENCE' 'YOUR CONNECTIONS' 'SMART MAIL' 'SMART SPACES'; do grep -Fq "$s" /tmp/root; done
          for s in 'COLLECTIVE SIGNAL' 'NETWORK WISDOM' 'SHARED INTELLIGENCE' 'YOUR COMPOUNDING INTELLIGENCE' 'STANDARD SMART NOTE GRAMMAR'; do ! grep -Fq "$s" /tmp/root; done
          ! grep -Fq '/* NayaNET V7 — surgical Play Naya polish layer.' /tmp/root
          ! grep -Fq 'NayaNET V7 — surgical Play Naya polish layer.' /tmp/root
          grep -Fq 'COLLECTIVE INTELLIGENCE' /tmp/smart
          grep -Fq 'HOW NAYANET' /tmp/smart
          grep -Fq 'YOUR INTELLIGENCE TODAY' /tmp/smart
          grep -Fq 'n11-ready' /tmp/smart
          echo 'PUBLIC_RUNTIME_ROOT=PASS'
          echo 'PUBLIC_SMART_LINK=PASS'
          echo 'PLAY_NAYA_CODE_NOT_VISIBLE=PASS'
          echo 'THREE_ZONE_RUNTIME=PASS'
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"
          echo "RELEASE=$GITHUB_SHA"
