name: Deploy V7 Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          hub=Path('2026 09 07  1:14 NAYANETHUBONE.html').read_text()
          feed=Path('2026 09 08 12:40 NAYANET INTELLIGENT FEED V3.js').read_text()
          polish4=Path('2026 09 08 22:00 NAYANET INTELLIGENT FEED V4 SURGICAL POLISH.js').read_text()
          rail=Path('2026 09 08 NAYANET INTELLIGENT HUB V10 RAIL POLISH.js').read_text()
          polish=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/v7-ten-star-play-naya-polish.js').read_text()
          if '</body>' not in hub: raise SystemExit('Missing body boundary')
          out=hub.replace('</body>','<script>\n'+feed+'\n</script>\n<script>\n'+polish4+'\n</script>\n<script>\n'+rail+'\n</script>\n<script>\n'+polish+'\n</script>\n</body>',1)
          d=Path('CLOUDFLARE-INTELLIGENT-HUB-V7'); d.mkdir(exist_ok=True)
          (d/'index.html').write_text(out)
          a=d/'assets'; a.mkdir(exist_ok=True); (a/'index.html').write_text(out); (a/'_redirects').write_text('/index.html 200\n')
          PY
      - name: Validate
        run: |
          set -euo pipefail
          L='2026 09 08 12:40 NAYANET INTELLIGENT FEED V3.js'
          V4='2026 09 08 22:00 NAYANET INTELLIGENT FEED V4 SURGICAL POLISH.js'
          R='2026 09 08 NAYANET INTELLIGENT HUB V10 RAIL POLISH.js'
          P='CLOUDFLARE-INTELLIGENT-HUB-V7/v7-ten-star-play-naya-polish.js'
          node --check "$L"
          node --check "$V4"
          node --check "$R"
          node --check "$P"
          for s in 'COLLECTIVE INTELLIGENCE' 'PERSONAL INTELLIGENCE' 'ACTIVITY' 'HOW NAYANET' 'IN A NUTSHELL' 'human:' 'CHILD NOTE' 'GRANDMA NOTE' 'NAYA NOTE' 'MACHINE NOTE' 'LESSON' 'HOW TO USE IT' 'PLAY NAYA' 'YOUR LIFE CREATES YOUR INTELLIGENCE EVERY DAY' 'CREATE · CAPTURE · UNDERSTAND · REMEMBER · COMPOUND'; do grep -Fq "$s" "$L"; done
          for s in 'CAPTURE THE MEANING' 'ONE EVENT, MANY INTELLIGENT PERSPECTIVES' 'EXPERIENCE COMPOUNDS' 'COLLECTIVE WISDOM REQUIRES CONSENT' 'THE DAILY BRIEFING TURNS MEMORY INTO ACTION' 'YOUR DAILY INTELLIGENCE REPORT'; do grep -Fq "$s" "$V4"; done
          for s in 'YOUR DAILY' 'INTELLIGENCE REPORT' 'CONNECT GITHUB' 'SYNC INTELLIGENCE' 'GET CONNECTED' 'n10-rail' 'n10-report'; do grep -Fq "$s" "$R"; done
          for s in 'COLLECTIVE SIGNAL' 'NETWORK WISDOM' 'SHARED INTELLIGENCE' 'YOUR COMPOUNDING INTELLIGENCE' 'n10-standard'; do ! grep -Fq "$s" "$L"; done
          python3 - <<'PY'
          from pathlib import Path
          out=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html').read_text()
          marker='/* NayaNET V7 — surgical Play Naya polish layer.'
          if marker in out:
              pos=out.index(marker)
              before=out[:pos]
              if before.count('<script>') <= before.count('</script>'):
                  raise SystemExit('Play Naya source marker is outside a script tag')
          else:
              raise SystemExit('Play Naya source missing from built script payload')
          if '/* NayaNET V7 — surgical Play Naya polish layer.' in out and '<script>' not in out:
              raise SystemExit('Unexpected script boundary state')
          for s in ['YOUR DAILY','INTELLIGENCE REPORT','CONNECT GITHUB','SYNC INTELLIGENCE','GET CONNECTED']:
              if s not in out: raise SystemExit('Missing rail marker: '+s)
          print('BUILD_SCRIPT_BOUNDARY=PASS')
          print('V10_RAIL_MARKERS=PASS')
          PY
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc
      - name: Verify exact public runtime
        run: |
          set -euo pipefail
          q="release=${GITHUB_SHA}"
          curl -fsSL --retry 8 --retry-delay 3 "$RUNTIME/?$q" -o /tmp/root
          curl -fsSL --retry 8 --retry-delay 3 "$SMART_LINK?$q" -o /tmp/smart
          for s in 'COLLECTIVE INTELLIGENCE' 'PERSONAL INTELLIGENCE' 'ACTIVITY' 'HOW NAYANET' 'IN A NUTSHELL' 'HOW TO USE IT' 'PLAY NAYA' 'YOUR LIFE CREATES YOUR INTELLIGENCE EVERY DAY' 'CREATE · CAPTURE · UNDERSTAND · REMEMBER · COMPOUND' 'YOUR DAILY INTELLIGENCE REPORT' 'CAPTURE THE MEANING' 'ONE EVENT, MANY INTELLIGENT PERSPECTIVES' 'EXPERIENCE COMPOUNDS' 'COLLECTIVE WISDOM REQUIRES CONSENT' 'THE DAILY BRIEFING TURNS MEMORY INTO ACTION' 'CONNECT GITHUB' 'SYNC INTELLIGENCE' 'GET CONNECTED'; do grep -Fq "$s" /tmp/root; done
          for s in 'COLLECTIVE SIGNAL' 'NETWORK WISDOM' 'SHARED INTELLIGENCE' 'YOUR COMPOUNDING INTELLIGENCE'; do ! grep -Fq "$s" /tmp/root; done
          ! grep -Fq '/* NayaNET V7 — surgical Play Naya polish layer.' /tmp/root
          ! grep -Fq 'NayaNET V7 — surgical Play Naya polish layer.' /tmp/root
          grep -Fq 'COLLECTIVE INTELLIGENCE' /tmp/smart
          grep -Fq 'HOW NAYANET' /tmp/smart
          echo 'PUBLIC_RUNTIME_ROOT=PASS'
          echo 'PUBLIC_SMART_LINK=PASS'
          echo 'PLAY_NAYA_CODE_NOT_VISIBLE=PASS'
          echo 'V10_RAIL_RUNTIME_MARKERS=PASS'
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"
          echo "RELEASE=$GITHUB_SHA"
