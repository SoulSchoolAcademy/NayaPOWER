# CANONICAL-LIVE-HUB-WORKFLOW-REGISTER-2026-09-08
# DEPLOY TRIGGER: 452 surgical right-rail removal
name: Deploy NayaNET Live Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build the exact current 452 Hub source — surgical right-rail only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          hub_path = Path('2026 09 08 452 NayaNET Hub.html')
          hub = hub_path.read_text(encoding='utf-8')

          if '</body>' not in hub:
              raise SystemExit('CURRENT_HUB_SOURCE_MISSING_BODY')

          rail = re.compile(
              r'<(?P<tag>[A-Za-z][A-Za-z0-9]*)\b[^>]*\bclass=["\'][^"\']*\bactivationRail\b[^"\']*["\'][^>]*>[\s\S]*?</(?P=tag)>',
              re.I,
          )
          hub, removed = rail.subn('', hub, count=1)
          print(f'RIGHT_RAIL_REMOVED={removed}')
          if removed > 1:
              raise SystemExit('RIGHT_RAIL_MULTIPLE_MATCHES')

          old_grid = '.homeWorkspace{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;align-items:start}'
          new_grid = '.homeWorkspace{display:block;width:100%;max-width:none}'
          if old_grid in hub:
              hub = hub.replace(old_grid, new_grid, 1)
              print('CENTER_FEED_WIDTH=EXPANDED')
          elif new_grid in hub:
              print('CENTER_FEED_WIDTH=ALREADY_EXPANDED')
          else:
              raise SystemExit('HOME_WORKSPACE_GRID_SENTINEL_MISSING')

          required = {
              'LEFT_SIDEBAR': bool(re.search(r'class=["\'][^"\']*\bsidebar\b', hub, re.I)),
              'HOME_WORKSPACE': bool(re.search(r'class=["\'][^"\']*\bhomeWorkspace\b', hub, re.I)),
              'HOME_FEED': bool(re.search(r'class=["\'][^"\']*\bhomeFeed\b', hub, re.I)),
              'INTELLIGENT_FEED_HOST': 'homeIntelligentBlocks' in hub or 'nayanet-elite-feed' in hub,
              'ACTIVITY': bool(re.search(r'Activity Intelligence|\bACTIVITY\b', hub, re.I)),
              'PERSONAL_INTELLIGENCE': bool(re.search(r'Personal Intelligence', hub, re.I)),
              'COLLECTIVE_INTELLIGENCE': bool(re.search(r'Collective Intelligence', hub, re.I)),
          }
          failed = [k for k, v in required.items() if not v]
          if failed:
              raise SystemExit('PROTECTED_SENTINEL_MISSING=' + ','.join(failed))

          if rail.search(hub):
              raise SystemExit('RIGHT_RAIL_STILL_IN_ARTIFACT')
          if '<script id="nayanet-live-feed-v3">' in hub or '<script id="nayanet-live-feed-v4">' in hub:
              raise SystemExit('FORBIDDEN_FEED_REBUILD_IN_DEPLOY_ARTIFACT')
          if 'nayanet-live-canonical-runtime' in hub:
              raise SystemExit('FORBIDDEN_RUNTIME_REBUILD_LAYER_IN_DEPLOY_ARTIFACT')

          print('NO_FEED_REBUILD=TRUE')
          print('COLLATERAL_DAMAGE_GATE=PASS')

          d = Path('CLOUDFLARE-INTELLIGENT-HUB-V7')
          d.mkdir(exist_ok=True)
          (d / 'index.html').write_text(hub, encoding='utf-8')
          (d / 'assets').mkdir(exist_ok=True)
          (d / 'assets' / 'index.html').write_text(hub, encoding='utf-8')
          (d / 'assets' / '_redirects').write_text('/index.html 200\n', encoding='utf-8')
          Path('NAYANET-LIVE-HUB.html').write_text(hub, encoding='utf-8')
          print('CANONICAL_LIVE_BUILD=PASS', len(hub.encode('utf-8')))
          PY

      - name: Deploy the exact assembled source
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Verify exact public runtime
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 3 "$RUNTIME/?release=$GITHUB_SHA" -o /tmp/root
          curl -fsSL --retry 8 --retry-delay 3 "$SMART_LINK?release=$GITHUB_SHA" -o /tmp/smart
          grep -Fq 'class="sidebar"' /tmp/root
          grep -Fq 'class="homeWorkspace"' /tmp/root
          grep -Fq 'class="homeFeed"' /tmp/root
          ! grep -Fq 'class="activationRail"' /tmp/root
          ! grep -Fq "class='activationRail'" /tmp/root
          ! grep -Fq '<script id="nayanet-live-feed-v3">' /tmp/root
          ! grep -Fq '<script id="nayanet-live-feed-v4">' /tmp/root
          ! grep -Fq 'nayanet-live-canonical-runtime' /tmp/root
          grep -Fq 'homeIntelligentBlocks' /tmp/root || grep -Fq 'nayanet-elite-feed' /tmp/root
          grep -Fq 'Intelligent Feed' /tmp/root
          grep -Fq 'Smart Notes' /tmp/root
          echo 'PUBLIC_RUNTIME_ROOT=PASS'
          echo 'PUBLIC_SMART_LINK=PASS'
          echo 'RIGHT_OLD_FEED_RAIL=REMOVED'
          echo 'LEFT_SIDEBAR=PRESERVED'
          echo 'CENTER_SMART_FEED=PRESERVED'
          echo 'HOME_FEED_WIDTH=EXPANDED'
          echo 'NO_FEED_REBUILD=PASS'
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"
          echo "RELEASE=$GITHUB_SHA"
