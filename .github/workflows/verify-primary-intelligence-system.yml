name: Verify Primary Intelligence System
on:
  push:
    branches: [main]
    paths:
      - '.naya/**'
      - 'scripts/build-primary-intelligence-feed.py'
      - 'NAYANET/HUB/**'
      - 'NAYANET/name-first-auth-adapter.js'
      - 'NAYANET Login bridge page'
      - 'identity.html'
      - 'WelcometoNayaNET.html'
      - '.github/workflows/verify-primary-intelligence-system.yml'
      - '!SUPERBRAIN/NAYA-ACTIVITY/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY-FEED.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build PIS projection
        run: python3 scripts/build-primary-intelligence-feed.py
      - name: Validate PIS projection
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('NAYANET/HUB/public/intelligence/pis-feed.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['schema_version']=='PIS-1.0'
          assert data['event_count']==len(data['events'])
          ids=[e['event_id'] for e in data['events']]
          assert len(ids)==len(set(ids))
          for e in data['events']:
              assert e['event_id']; assert e['context']['canonical_path'].startswith('.naya/'); assert e['source']['type']=='smart_note'
          print(f'PIS_PROJECTION=PASS events={len(ids)}')
          PY
      - name: Validate persistent PIS adapter source
        run: |
          grep -q "@supabase/supabase-js" NAYANET/HUB/src/data/pis.ts
          grep -q "nayanet_intelligence_index" NAYANET/HUB/src/data/pis.ts
          grep -q "getUser" NAYANET/HUB/src/data/pis.ts
          grep -q "PIS_QUERY_LIMIT" NAYANET/HUB/src/data/pis.ts
      - name: Validate canonical name-first identity contract
        run: |
          test -s NAYANET/name-first-auth-adapter.js
          grep -q "signInAnonymously" NAYANET/name-first-auth-adapter.js
          grep -q "members" NAYANET/name-first-auth-adapter.js
          grep -q "nayanet_profiles" NAYANET/name-first-auth-adapter.js
          grep -q "nayanet_identity_version" NAYANET/name-first-auth-adapter.js
          if grep -Eq "signInWithPassword|[\"']email[\"']|password[[:space:]]*:" NAYANET/name-first-auth-adapter.js; then
            echo "Name-first adapter must not introduce email/password authentication."
            exit 1
          fi
          grep -q "NayaNETNameFirstAuth" "NAYANET Login bridge page"
          grep -q "NayaNETNameFirstAuth" identity.html
          echo "NAME_FIRST_SOURCE_CONTRACT=PASS"
      - name: Verify real Supabase anonymous authentication availability
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://dahisasgpfvziswqvmvm.supabase.co';
          const key = 'sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue';
          const probeName = `NayaNET Auth Probe ${Date.now()}`;
          const res = await fetch(`${url}/auth/v1/signup`, {
            method:'POST',
            headers:{apikey:key,Authorization:`Bearer ${key}`,'Content-Type':'application/json'},
            body:JSON.stringify({data:{display_name:probeName,nayanet_identity_version:'name-first-v1-probe'}})
          });
          const body = await res.text();
          console.log(`SUPABASE_ANONYMOUS_AUTH_HTTP_STATUS=${res.status}`);
          console.log(`SUPABASE_ANONYMOUS_AUTH_RESPONSE=${body}`);
          let parsed; try { parsed=JSON.parse(body); } catch { parsed={raw:body}; }
          if(!res.ok || !parsed.user?.id || !parsed.access_token || parsed.user.is_anonymous !== true){
            console.error(JSON.stringify({status:res.status,body:parsed},null,2)); process.exit(1);
          }
          console.log(JSON.stringify({status:res.status,authenticated:true,user_id_present:true,access_token_present:true,is_anonymous:true,probe_identity:probeName},null,2));
          NODE
          echo "SUPABASE_ANONYMOUS_AUTH=PASS"
      - name: Validate Naya continuous project execution loop
        run: test -f SUPERBRAIN/AI-BOOT/NAYA-CONTINUOUS-PROJECT-EXECUTION-LOOP.md
      - name: Validate canonical control plane
        run: |
          python3 .naya/control-plane/validate_control_plane.py --self-test
          python3 .naya/control-plane/validate_control_plane.py
      - name: Cold-Naya activation acceptance
        run: python3 .naya/runtime/cold_start_activation.py
      - name: Install Hub dependencies
        working-directory: NAYANET/HUB
        run: npm install
      - name: Typecheck Hub
        working-directory: NAYANET/HUB
        run: npm run typecheck
      - name: Build Hub from PIS
        working-directory: NAYANET/HUB
        run: npm run build
