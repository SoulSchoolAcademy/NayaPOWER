name: NayaNET V7 Intelligent Hub Build — Retired

# Historical V7 build path retained as a record only. It is intentionally
# non-mutating. Current Hub source is NAYANET/HUB and current public deployment
# is deploy-nayanet-hub-canonical-v2.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Assert current execution authority
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-nayanet-hub-canonical-v2.yml
          echo 'LEGACY_V7_HUB_BUILD=RETIRED'
          echo 'CURRENT_HUB_SOURCE=NAYANET/HUB'
          echo 'CURRENT_PUBLIC_DEPLOYMENT=.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
          echo 'RULE=ONE_CURRENT_HUB_BUILD_AND_DEPLOYMENT_AUTHORITY'
