name: 509 Finish Smart Feed
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finish-feed:
    if: ${{ !contains(github.event.head_commit.message, '[NAYA-FEED-FINISH]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical feed completion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('snapshots/NayaNET-509-AAA-CURRENT.html')
          s=p.read_text(encoding='utf-8')
          # Remove the three obsolete demo blocks from the live renderer while preserving the real nine Smart Notes.
          s,n=re.subn(r'const DEMO=\[[\s\S]*?\];\nconst state=', 'const DEMO=[];\nconst state=', s, count=1)
          if n!=1: raise SystemExit('DEMO_ARRAY_NOT_FOUND')
          # Use the canonical SMART FEED CONTENT for the missing final application section.
          marker='<!-- NAYA509-FEED-FINISH-2026-09-14 -->'
          if marker not in s:
            script=r'''<script>
/* NAYA509-FEED-FINISH-2026-09-14 — canonical section 10, no new card structure */
(()=>{'use strict';
const SOURCE='https://raw.githubusercontent.com/SoulSchoolAcademy/NayaPOWER/main/SMART%20FEED%20CONTENT';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));
const norm=s=>String(s||'').replace(/\\n/g,'\\n').replace(/\\r/g,'').trim();
function notes(raw){return String(raw).split(/={20,}\\s*/).map(x=>x.trim()).filter(x=>/SMART NOTE \\d+/i.test(x)).slice(0,9)}
function section10(x){const m=x.match(/(?:^|\\n)10\\.\\s*HOW TO APPLY IT\\s*\\n([\\s\\S]*?)(?=\\n11\\.\\s*WHAT'S IN IT FOR YOU\\??|$)/i);return m?m[1].trim():''}
async function run(){const boards=[...document.querySelectorAll('[data-real-smart-note]')];if(boards.length!==9)return;let raw='';try{const r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)return;raw=await r.text()}catch{return}const ns=notes(raw);if(ns.length!==9)return;boards.sort((a,b)=>Number(a.dataset.realSmartNote)-Number(b.dataset.realSmartNote));boards.forEach((b,i)=>{if(b.querySelector('.naya509-how-to-use'))return;const text=section10(ns[i]);if(!text)return;const wrap=b.querySelector('.layers');if(!wrap)return;const layer=document.createElement('section');layer.className='layer naya509-how-to-use';layer.style.setProperty('--layer',getComputedStyle(b).getPropertyValue('--tone')||'#9d75ff');layer.innerHTML='<div class="layerHead"><i class="dot"></i><b>10 · HOW TO USE IT</b><span class="state">APPLICATION</span></div><div class="layerBody"></div>';layer.querySelector('.layerBody').textContent=text;wrap.appendChild(layer)});document.documentElement.dataset.nayaRealSmartFeedComplete='true'}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(run,300),{once:true});else setTimeout(run,300);
setTimeout(run,1500);setTimeout(run,3000);
})();
</script>
'''
            s=s.replace('</body>',marker+script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          print('DEMO_BLOCKS_REMOVED=PASS')
          print('CANONICAL_HOW_TO_USE_INJECTOR=PASS')
          PY
      - name: Verify feed artifact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('snapshots/NayaNET-509-AAA-CURRENT.html').read_text(encoding='utf-8')
          assert 'const DEMO=[];' in s
          assert 'NAYA509-FEED-FINISH-2026-09-14' in s
          assert len(re.findall(r'data-real-smart-note="[1-9]"',s))==9
          assert 'Blockers Never Stop the Mission' not in s
          assert 'Source Intent Is Not Runtime Truth' not in s
          assert 'The Intelligent Block Is the Star' not in s
          print('NINE_REAL_SMART_NOTES=PASS')
          print('THREE_DEMO_BLOCKS_REMOVED=PASS')
          print('HOW_TO_USE_CANONICAL_PATH=PASS')
          PY
      - name: Commit feed completion
        run: |
          git config user.name 'Naya'
          git config user.email 'naya@users.noreply.github.com'
          git add snapshots/NayaNET-509-AAA-CURRENT.html .github/workflows/509-finish-smart-feed.yml
          git commit -m '[NAYA-FEED-FINISH] complete 509 Smart Feed' || echo 'NO_CHANGES'
          git push
