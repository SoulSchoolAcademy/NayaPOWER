name: Execute MAXESS Section 01

# Governed one-shot Section 01 checkpoint trigger.
# The trigger may observe relevant branch changes, but consequential mutation
# requires explicit workflow dispatch approval and the canonical governance kernel.

on:
  push:
    branches:
      - maxess-results-v21-working
    paths:
      - .github/workflows/execute-maxess-section01.yml
      - tools/execute_maxess_section01.py
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit authorization to mutate the MAXESS Section 01 checkpoint
        required: true
        type: choice
        options:
          - EXPLICIT_APPROVAL_GRANTED
          - DENY

permissions:
  contents: write

jobs:
  section01:
    if: github.event_name == 'workflow_dispatch' && inputs.approval == 'EXPLICIT_APPROVAL_GRANTED'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          fetch-depth: 0

      - name: Enforce canonical NayaPOWER governance kernel
        shell: bash
        run: |
          set -euo pipefail
          python .naya/control-plane/workflow_gate.py \
            --actor "${{ github.actor }}" \
            --purpose "maxess-section01-repository-mutation" \
            --permission "repo:write:maxess-section01" \
            --request "mutate:MAXESS Section 01 canonical checkpoint" \
            --mission "Execute the authorized MAXESS Section 01 surgical product checkpoint" \
            --uncertainty 3 \
            --consequence 4 \
            --irreversibility 3 \
            --scope '{"repository":"SoulSchoolAcademy/NayaPOWER","branch":"maxess-results-v21-working","paths":["tools/execute_maxess_section01.py","tools/build_v21_canonical.py","20260817 912am RESULTS PAGE CODE","V21-CANONICAL-BUILD-RESULT.md"],"operation":"surgical-write-and-push"}' \
            --evidence "explicit workflow_dispatch approval granted" \
            --evidence "one-shot Section 01 checkpoint scope"

      - name: Configure identity
        run: |
          git config user.name "Naya Lead Mode"
          git config user.email "naya-lead-mode@users.noreply.github.com"

      - name: Execute Section 01 Golden Master refinement when needed
        run: |
          if grep -q 'MAXESS-SECTION-01-GOLDEN-MASTER' tools/build_v21_canonical.py; then
            echo "Section 01 Golden Master already present; preserving verified product mutation."
          else
            python tools/execute_maxess_section01.py
          fi

      - name: Align V21 renderer with approved MAXESS narrative
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('tools/build_v21_canonical.py')
          s = p.read_text(encoding='utf-8')
          original = s

          for label, cls in [
              ('YOUR LEVER', 'v21-section v21-purple'),
              ('YOUR NEXT MOVE', 'v21-section v21-light'),
          ]:
              pattern = rf'(?m)^\s*\'\<section class=\\"{re.escape(cls)}\\"[^\n]*{re.escape(label)}[^\n]*$\n?'
              s, n = re.subn(pattern, '', s)
              if n != 1:
                  raise SystemExit(f'Expected exactly one obsolete section removal for {label}; found {n}')

          old_play = re.compile(r'(?m)^\s*\'\<section class=\\"v21-section v21-light\\"[^\n]*PLAYGROUND[^\n]*$\n?')
          new_play = "      '<section class=\\\"v21-section v21-dark\\\"><div class=\\\"v21-inner\\\"><span class=\\\"v21-kicker\\\">NAYA · IN PRACTICE</span><h2 class=\\\"v21-section-title\\\">See what your result can become.</h2><p class=\\\"v21-section-copy\\\">Naya helps turn your MAXESS result into a practical next step. Use the existing guided video and media experience here.</p><div id=\\\"v21-media-host\\\" class=\\\"v21-media-host\\\"></div></div></section>'+\n"
          s, n = old_play.subn(new_play, s)
          if n != 1:
              raise SystemExit(f'Expected exactly one Playground replacement; found {n}')

          old_media = "root.querySelectorAll('video,iframe,#naya-playground,.mx-reading,.mx-section').forEach(function(n){ if(media.indexOf(n)<0) media.push(n); });"
          new_media = "root.querySelectorAll('#ny-youtube-player,video,iframe[src*=\\\"youtube\\\"],iframe[src*=\\\"vimeo\\\"]').forEach(function(n){ if(media.indexOf(n)<0) media.push(n); });"
          if old_media not in s:
              raise SystemExit('Legacy media capture anchor not found')
          s = s.replace(old_media, new_media)

          old_host = "var host=root.querySelector('#v21-playground-host');if(host){media.forEach(function(n){if(n && n!==root && n.parentNode!==host)host.appendChild(n);});}"
          new_host = "var host=root.querySelector('#v21-media-host');if(host){media.forEach(function(n){if(n && n!==root && n.parentNode!==host)host.appendChild(n);});}"
          if old_host not in s:
              raise SystemExit('Legacy Playground host anchor not found')
          s = s.replace(old_host, new_host)

          old_ids = "var ids=['#mx-naya-listen','#v11-naya-listen','#v13-listen','.mx-naya-listen','.v18-listen'];"
          new_ids = "var ids=['.v21-listen.b1s1-listen','.v21-listen'];"
          if old_ids in s:
              s = s.replace(old_ids, new_ids)

          if s == original:
              raise SystemExit('Narrative alignment produced no source delta')
          p.write_text(s, encoding='utf-8')
          print('MAXESS V21 PRODUCT NARRATIVE ALIGNMENT: PASS')
          print('REMOVED: YOUR LEVER')
          print('REMOVED: YOUR NEXT MOVE')
          print('REPLACED: PLAYGROUND -> NAYA · IN PRACTICE')
          print('MEDIA OWNER: EXISTING VIDEO / MEDIA ASSETS')
          print('LISTEN OWNER: V21 HERO CONTROL')
          PY

      - name: Rebuild canonical artifact
        run: python tools/build_v21_canonical.py

      - name: Verify Section 01 source and narrative delta
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          p = Path('tools/build_v21_canonical.py')
          s = p.read_text(encoding='utf-8')
          required = [
              'MAXESS-SECTION-01-GOLDEN-MASTER',
              'b1s1-naya',
              'b1s1-listen',
              'b1s1-orb-live',
              'b1s1-orbital-bead',
              'b1s1-bridge',
              'NAYA · IN PRACTICE',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Required product evidence missing: ' + ', '.join(missing))
          for obsolete in ('YOUR LEVER','YOUR NEXT MOVE','PLAYGROUND'):
              if obsolete in s:
                  raise SystemExit('Obsolete renderer token remains: ' + obsolete)
          if 'window.MAXESS_RESULT' not in s:
              raise SystemExit('MAXESS_RESULT authority marker missing')
          if re.search(r'(^|\n)(<<<<<<<|=======|>>>>>>>)( |\n|$)', s):
              raise SystemExit('Unresolved conflict marker remains in builder')
          print('SECTION 01 / NARRATIVE SOURCE VERIFICATION: PASS')
          print('BUILDER SHA256:', hashlib.sha256(s.encode('utf-8')).hexdigest())
          PY

      - name: Run focused verification
        run: |
          python -m py_compile tools/execute_maxess_section01.py tools/build_v21_canonical.py
          echo "MAXESS Section 01 focused verification: PASS"

      - name: Commit verified product checkpoint
        run: |
          git add "20260817 912am RESULTS PAGE CODE" tools/build_v21_canonical.py V21-CANONICAL-BUILD-RESULT.md
          if git diff --cached --quiet; then
            echo "No product delta to checkpoint."
            exit 1
          fi
          git commit -m "Align MAXESS V21 product narrative"
          git push origin maxess-results-v21-working
