name: Verify Canonical Hub Smart Note Golden Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NAYANET/HUB/**"
      - ".github/scripts/canonical-smart-note-deep-link.mjs"
      - ".github/workflows/verify-canonical-hub-smart-note-golden-path.yml"
      - "supabase/functions/v7-smart-note-canonical/**"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  golden-path:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run canonical Smart Note golden path
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/canonical-smart-note-deep-link.mjs

      - name: Upload golden-path proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-hub-smart-note-golden-path-proof
          path: |
            canonical-smart-note-deep-link-proof.json
            golden-path-after-capture.png
            golden-path-after-reload.png
          if-no-files-found: warn

