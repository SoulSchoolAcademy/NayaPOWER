name: Verify Canonical Hub Smart Note Golden Path

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/index.html'
      - 'NAYANET/HUB/public/assistant-runtime.js'
      - 'NAYANET/HUB/public/nayanet-interface-command-station.js'
      - 'NAYANET/name-first-auth-adapter.js'
      - '.github/workflows/verify-canonical-hub-smart-note-golden-path.yml'
      - '.naya/control-plane/NAYANET-HUB-READINESS-INVENTORY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-path:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run canonical Smart Note golden path
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const hub = process.env.HUB_URL;
          const alias = ('golden'+process.env.GITHUB_RUN_ID+'-'+crypto.randomBytes(4).toString('hex')).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
          const title = 'Canonical Golden Smart Note '+process.env.GITHUB_RUN_ID;
          const content = 'Current-head canonical Hub Smart Note golden-path proof. This intelligence must persist, project, reload, and remain evidence-bound.';
          const proof = {status:'UNKNOWN',run_id:Number(process.env.GITHUB_RUN_ID),title,alias,checks:{},trace:[]};
          const mark=(step,extra={})=>{proof.trace.push({step,at:new Date().toISOString(),...extra});console.log('GOLDEN_PATH_TRACE',JSON.stringify(proof.trace.at(-1)))};

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({serviceWorkers:'block',viewport:{width:1440,height:1000}});
            const page=await context.newPage();

            await page.goto(hub+'/identity.html?name='+encodeURIComponent('Naya Golden Path')+'&alias='+encodeURIComponent(alias),{waitUntil:'networkidle',timeout:60000});
            mark('IDENTITY_LOADED');

            const established=await page.evaluate(async({name,alias})=>window.NayaNETNameFirstAuth.establish({name,alias}),{name:'Naya Golden Path',alias});
            if(!established?.authenticated||!established?.userId)throw new Error('AUTHENTICATION_FAILED:'+JSON.stringify(established));
            proof.user_id=established.userId;
            mark('AUTHENTICATED',{user_id:established.userId});

            await page.goto(hub+'/?golden_path='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.NayaAssistantRuntime,{timeout:30000});
            await page.waitForTimeout(1200);
            if(await page.title()!=='NayaNET — Intelligent Hub V7 · 509 AAA')throw new Error('CANONICAL_HUB_TITLE_MISMATCH');
            if(await page.locator('.shell').count()!==1)throw new Error('CANONICAL_SHELL_COUNT_NOT_ONE');
            mark('HUB_OPEN');

            const capture=page.locator('#naya-runtime-capture');
            await capture.waitFor({state:'visible',timeout:30000});
            proof.checks.capture_control='PASS';
            mark('CAPTURE_CONTROL_VISIBLE');

            const visibleCommandButtons=await page.locator('.naya-cs-btn:visible').count();
            if(visibleCommandButtons!==13)throw new Error('COMMAND_STATION_VISIBLE_BUTTON_COUNT_NOT_13:'+visibleCommandButtons);
            proof.checks.single_command_station='PASS';
            mark('SINGLE_COMMAND_STATION',{visible_buttons:visibleCommandButtons});

            await capture.click();
            await page.locator('#naya-runtime-note-title').fill(title);
            await page.locator('#naya-runtime-note-content').fill(content);
            await page.locator('#naya-runtime-note-save').click();
            mark('CAPTURE_SUBMITTED');

            await page.waitForFunction(()=>document.querySelector('#naya-runtime-note-state')?.textContent?.includes('CAPTURED'),{timeout:30000});
            const captureState=await page.locator('#naya-runtime-note-state').innerText();
            proof.capture_state=captureState;
            if(!captureState.includes('PERSISTED'))throw new Error('PERSISTENCE_STATE_NOT_CONFIRMED:'+captureState);
            proof.checks.receiver_persistence='PASS';
            mark('CAPTURE_PERSISTED',{state:captureState});

            await page.waitForFunction((expected)=>document.body.innerText.includes(expected),title,{timeout:30000});
            const bodyAfterCapture=await page.locator('body').innerText();
            if(!bodyAfterCapture.includes(title))throw new Error('SMART_NOTE_NOT_VISIBLE_AFTER_CAPTURE');
            proof.checks.smart_feed_projection='PASS';
            mark('SMART_FEED_RESULT_VISIBLE');

            try { await page.screenshot({path:'golden-path-after-capture.png',fullPage:true,timeout:5000}); } catch (error) { mark('CAPTURE_SCREENSHOT_NON_BLOCKING',{error:String(error)}); }

            await page.reload({waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1500);
            const bodyAfterReload=await page.locator('body').innerText();
            if(!bodyAfterReload.includes(title))throw new Error('SMART_NOTE_NOT_RESTORED_AFTER_RELOAD');
            if(!bodyAfterReload.includes('RUNTIME RETRIEVED'))throw new Error('RETRIEVAL_MARKER_NOT_VISIBLE_AFTER_RELOAD');
            proof.checks.reload_retrieval='PASS';
            mark('RELOAD_RETRIEVAL_VERIFIED');

            try { await page.screenshot({path:'golden-path-after-reload.png',fullPage:true,timeout:5000}); } catch (error) { mark('RELOAD_SCREENSHOT_NON_BLOCKING',{error:String(error)}); }

            const eventIds=await page.locator('[data-event-id]').evaluateAll(nodes=>nodes.map(n=>n.getAttribute('data-event-id')).filter(Boolean));
            const eventTextMatch=(await page.locator('body').innerText()).match(/Event ID:\s*([0-9a-f-]{36})/i);
            if(eventTextMatch&&!eventIds.includes(eventTextMatch[1]))eventIds.push(eventTextMatch[1]);
            proof.event_ids=eventIds;
            proof.checks.canonical_event_identity=eventIds.length>0?'PASS':'NOT_OBSERVED';
            if(!eventIds.length)throw new Error('CANONICAL_EVENT_ID_NOT_RENDERED');

            proof.status='VERIFIED';
            fs.writeFileSync('canonical-hub-smart-note-golden-path-proof.json',JSON.stringify(proof,null,2)+'\n');
            console.log(JSON.stringify(proof));
            await context.close();
            await browser.close();
          })().catch(async error=>{
            proof.status='FAILED';
            proof.error=String(error?.stack||error);
            fs.writeFileSync('canonical-hub-smart-note-golden-path-proof.json',JSON.stringify(proof,null,2)+'\n');
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload golden-path proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-hub-smart-note-golden-path-proof
          path: |
            canonical-hub-smart-note-golden-path-proof.json
            golden-path-after-capture.png
            golden-path-after-reload.png
          if-no-files-found: warn
