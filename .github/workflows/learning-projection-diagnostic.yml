name: Learning Projection Diagnostic

on:
  pull_request:
    paths:
      - 'supabase/functions/nayanet-github-dispatch/**'
      - 'tests/github_dispatch_contract.test.mjs'
      - '.github/workflows/learning-projection-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run real handler contract tests
        run: node --test tests/github_dispatch_contract.test.mjs
