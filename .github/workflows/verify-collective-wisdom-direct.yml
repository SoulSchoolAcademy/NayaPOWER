name: Verify collective wisdom contracts directly

on:
  push:
    paths:
      - "supabase/functions/nayanet-compound-intelligence/index.ts"
      - "supabase/functions/naya-smart-feed/index.ts"
      - "supabase/migrations/20260924150000_verified_learning_collective_wisdom_projection_v1.sql"
      - "tests/test_stream_b_collective_wisdom_projection.py"
      - "tests/test_stream_b_collective_wisdom_feed.py"
      - ".github/workflows/verify-collective-wisdom-direct.yml"
  pull_request:
    branches: [main]

jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile contract tests
        run: python -m py_compile tests/test_stream_b_collective_wisdom_projection.py tests/test_stream_b_collective_wisdom_feed.py
      - name: Execute contract functions directly
        run: |
          python - <<'PY'
          from tests.test_stream_b_collective_wisdom_projection import (
              test_verified_learning_projection_contract,
              test_projection_provenance_excludes_identity_and_raw_content,
              test_compound_capture_does_not_directly_publish_collective_wisdom,
              test_learning_verification_is_the_projection_boundary,
          )
          from tests.test_stream_b_collective_wisdom_feed import (
              test_collective_feed_reads_collective_wisdom_not_publications,
              test_collective_feed_preserves_identity_and_publication_boundaries,
          )
          tests = [
              test_verified_learning_projection_contract,
              test_projection_provenance_excludes_identity_and_raw_content,
              test_compound_capture_does_not_directly_publish_collective_wisdom,
              test_learning_verification_is_the_projection_boundary,
              test_collective_feed_reads_collective_wisdom_not_publications,
              test_collective_feed_preserves_identity_and_publication_boundaries,
          ]
          for test in tests:
              test()
              print("PASS", test.__name__)
          print("ALL_COLLECTIVE_WISDOM_CONTRACTS_PASS")
          PY
