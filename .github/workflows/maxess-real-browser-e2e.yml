name: MAXESS Real Browser E2E

on:
  push:
    branches:
      - maxess-results-v21-working
      - maxess-surgical-3point-repair
    paths:
      - 'E01-SECTION-01-WORKING.html'
      - 'E04-SECTION-04-WORKING.html'
      - 'tests/maxess-real-browser-e2e.mjs'
      - '.github/workflows/maxess-real-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxess-real-browser-e2e
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Results engineering branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Apply temporary surgical repair runner
        if: github.ref_name == 'maxess-surgical-3point-repair'
        shell: python
        run: |
          from pathlib import Path
          import re

          e04=Path('E04-SECTION-04-WORKING.html')
          s=e04.read_text(encoding='utf-8')
          old="""function readDirectionScore(result){
  if(!result)return null;
  var candidate=result.directionScore;
  if(candidate===undefined&&result.dimensions){
    var d=result.dimensions.direction||result.dimensions.DIRECTION;
    if(typeof d==='number')candidate=d;
    else if(d&&typeof d.score==='number')candidate=d.score;
  }
  return candidate!==undefined&&isFinite(Number(candidate))?Number(candidate):null;
}"""
          new="""function readDirectionScore(result){
  if(!result)return null;
  var candidate=result.directionScore;
  if(candidate===undefined&&Array.isArray(result.dimensions)){
    var d=result.dimensions.find(function(item){
      return item&&String(item.id||item.dimensionId||item.name||'').toLowerCase().replace(/[^a-z0-9]/g,'')==='direction';
    });
    if(d&&d.score!==undefined)candidate=d.score;
  }
  return candidate!==undefined&&isFinite(Number(candidate))?Number(candidate):null;
}"""
          if old not in s: raise SystemExit('E04 target missing')
          e04.write_text(s.replace(old,new,1),encoding='utf-8')

          test=Path('tests/maxess-real-browser-e2e.mjs')
          s=test.read_text(encoding='utf-8')
          old="""    await page.locator('#answers .answer').nth(answerIndexes[i]).click();
    await page.locator('#continueButton').click();
  }

  await page.locator('#interestsView.visible').waitFor({ state: 'visible', timeout: 10000 });
  await page.locator('.interest-area').first().click();
  const navigation = page.waitForURL((url) => url.toString().startsWith(resultsUrl), { timeout: 30000, waitUntil: 'domcontentloaded' });
  await page.locator('#interestContinue').click();
  await navigation;
"""
          new="""    await page.locator('#answers .answer').nth(answerIndexes[i]).click();
    await page.locator('#continueButton').click();
    if (i === 14) {
      await page.waitForURL((url) => url.toString().startsWith(resultsUrl), { timeout: 30000, waitUntil: 'domcontentloaded' });
    }
  }
"""
          if old not in s: raise SystemExit('E2E target missing')
          s=s.replace(old,new,1)
          s=s.replace("if (!Array.isArray(contract.selectedInterests) || contract.selectedInterests.length !== 1) throw new Error(`${profileName}: selectedInterests missing`);", "if (!Array.isArray(contract.selectedInterests) || contract.selectedInterests.length !== 0) throw new Error(`${profileName}: selectedInterests must be empty after interest stage removal`);")
          s=s.replace("  const profileB = [3,4,4,4,0,3,4,4,4,0,3,4,4,4,0];\n  const a = await completeAssessment(page, profileA, 'PROFILE A');\n  const b = await completeAssessment(page, profileB, 'PROFILE B');", "  const profileB = [3,4,4,4,0,3,4,4,4,0,3,4,4,4,0];\n  const profileC = Array(15).fill(4);\n  const a = await completeAssessment(page, profileA, 'PROFILE A LOW');\n  const b = await completeAssessment(page, profileB, 'PROFILE B MIXED');\n  const c = await completeAssessment(page, profileC, 'PROFILE C HIGH');")
          old="  if (!different.overallScore || !different.dimensions || !different.masteryStage || !different.strongestCapability || !different.highestLeverageOpportunity || !different.overallPattern || !different.personalizedInterpretation || !different.nextMove) throw new Error(`Differentiation proof failed: ${JSON.stringify(different)}`);\n  console.log(JSON.stringify({ status: 'PASS', profileA: { overallScore: a.contract.overallScore, masteryStage: a.contract.masteryStage, strongest: a.contract.strongestCapability, opportunity: a.contract.highestLeverageOpportunity, resultsUrl: a.resultsUrl }, profileB: { overallScore: b.contract.overallScore, masteryStage: b.contract.masteryStage, strongest: b.contract.strongestCapability, opportunity: b.contract.highestLeverageOpportunity, resultsUrl: b.resultsUrl }, differentiation: different }, null, 2));"
          new="  if (!different.overallScore || !different.dimensions || !different.masteryStage || !different.strongestCapability || !different.highestLeverageOpportunity || !different.overallPattern || !different.personalizedInterpretation || !different.nextMove) throw new Error(`Differentiation proof failed: ${JSON.stringify(different)}`);\n  if (!(Number(a.contract.overallScore) < Number(b.contract.overallScore) && Number(b.contract.overallScore) < Number(c.contract.overallScore))) throw new Error(`Scoring order proof failed: low=${a.contract.overallScore}, mixed=${b.contract.overallScore}, high=${c.contract.overallScore}`);\n  console.log(JSON.stringify({ status: 'PASS', profileA: { overallScore: a.contract.overallScore, masteryStage: a.contract.masteryStage, strongest: a.contract.strongestCapability, opportunity: a.contract.highestLeverageOpportunity, resultsUrl: a.resultsUrl }, profileB: { overallScore: b.contract.overallScore, masteryStage: b.contract.masteryStage, strongest: b.contract.strongestCapability, opportunity: b.contract.highestLeverageOpportunity, resultsUrl: b.resultsUrl }, profileC: { overallScore: c.contract.overallScore, masteryStage: c.contract.masteryStage, strongest: c.contract.strongestCapability, opportunity: c.contract.highestLeverageOpportunity, resultsUrl: c.resultsUrl }, differentiation: different }, null, 2));"
          if old not in s: raise SystemExit('E2E result block missing')
          test.write_text(s.replace(old,new,1),encoding='utf-8')

          wf=Path('.github/workflows/maxess-real-browser-e2e.yml')
          ws=wf.read_text(encoding='utf-8')
          # Restore this workflow to its governed production form after the one-time repair.
          marker='          # RESTORE_GOVERNED_WORKFLOW_AFTER_REPAIR'
          if marker not in ws: raise SystemExit('workflow restore marker missing')

      - name: Restore governed workflow after temporary repair
        if: github.ref_name == 'maxess-surgical-3point-repair'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/maxess-real-browser-e2e.yml
          git add -- E04-SECTION-04-WORKING.html tests/maxess-real-browser-e2e.mjs
          git commit -m 'fix: repair MAXESS E04 result mapping and final-flow E2E'
          git push
          exit 0

      - name: Fetch canonical assessment from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:'AIScoreMAXESS code' > AIScoreMAXESS-e2e.html
          test -s AIScoreMAXESS-e2e.html
          echo "Assessment bytes: $(wc -c < AIScoreMAXESS-e2e.html)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real 15-question browser E2E
        run: node tests/maxess-real-browser-e2e.mjs

          # RESTORE_GOVERNED_WORKFLOW_AFTER_REPAIR
