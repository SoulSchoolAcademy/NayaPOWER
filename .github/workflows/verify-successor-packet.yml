name: Verify Successor Packet

on:
  push:
    branches: [main]
    paths:
      - '.naya/runtime/successor_packet.py'
      - '.naya/runtime/test_successor_packet.py'
      - '.github/workflows/verify-successor-packet.yml'
permissions: {contents: read}
jobs:
  successor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python .naya/runtime/test_successor_packet.py
