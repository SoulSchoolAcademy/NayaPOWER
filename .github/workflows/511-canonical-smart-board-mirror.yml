# CANONICAL SMART BOARD EXECUTION LANE
# execution-proof-v21 — structural elite refinement
name: 511 Canonical Smart Board Mirror

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/511-canonical-smart-board-mirror.yml'
  workflow_run:
    workflows: ["Naya Power — Preflight Governance"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural normalization and renderer surgery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')

          # Remove the previous DOM-patch refinement layer and competing board visualizers.
          for sid in [
              'naya-elite-interface-refinement-runtime',
              'naya-aaa-smart-board-visual-v1-script',
              'naya-smart-board-living-intelligence-v2-script',
          ]:
              s=re.sub(r'<script[^>]*id=["\\\\]'+re.escape(sid)+r'["\\\\][^>]*>.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<style[^>]*id=["\\\\]naya-elite-interface-refinement["\\\\][^>]*>.*?</style>', '', s, flags=re.S)

          # Canonical labels.
          s=s.replace("LEARNING:'ADAPTIVE LEARNING'", "LEARNING:'LEARNING LESSON'")
          s=s.replace("\"WHAT'S IN IT FOR YOU?\":\"WHAT'S IN IT FOR YOU?\"", "\"WHAT'S IN IT FOR YOU?\":\"WHAT'S IN IT FOR YOU\"")
          s=s.replace('>01 · IN A NUTSHELL<', '>IN A NUTSHELL<')
          s=s.replace('>ADAPTIVE LEARNING<', '>LEARNING LESSON<')
          s=s.replace('<b>CHILD</b>', '<b>CHILD NOTE</b>')

          # One canonical icon family. These are inline SVGs rendered by the authoritative board() renderer.
          if 'const NayaBoardIconSVG=' not in s:
              helpers=r'''const NayaBoardIconSVG={
              spark:'<path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Z"/>',
              power:'<path d="M13.2 2.8 6.5 13h5.2l-1 8.2L17.5 11h-5.1l.8-8.2Z"/>',
              naya:'<path d="m12 2.5 1.9 6.1 6.1 1.9-6.1 1.9-1.9 6.1-1.9-6.1L4 10.5l6.1-1.9L12 2.5Z"/>',
              note:'<path d="M6 4.5h9.5L19 8v11.5H6z"/><path d="M15 4.5V8h4M9 12h6M9 15h6"/>',
              today:'<rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 3v5M16 3v5M4 10h16M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/>',
              report:'<path d="M5 19.5V9M12 19.5V5M19 19.5V2.5"/><path d="M3.5 19.5h17"/>',
              library:'<path d="M5 19V5.5L12 3l7 2.5V19"/><path d="M8 9h8M8 12h8M8 15h8"/>',
              list:'<path d="M7 6h13M7 12h13M7 18h13"/><circle cx="3.5" cy="6" r=".7"/><circle cx="3.5" cy="12" r=".7"/><circle cx="3.5" cy="18" r=".7"/>',
              feed:'<path d="M5 18V6M5 18h14"/><path d="M8 15c3.8 0 6.8-3 6.8-6.8M8 11.5a3.3 3.3 0 0 1 3.3-3.3M8 18.5h.01"/>',
              tabs:'<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9h16M8 5v4M12 5v4M16 5v4"/>',
              human:'<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.4-3.5 2.5-5.5 6.5-5.5s6.1 2 6.5 5.5"/>',
              child:'<circle cx="12" cy="8" r="2.8"/><path d="M6.5 20c.6-3.2 2.4-4.8 5.5-4.8s4.9 1.6 5.5 4.8"/><path d="M8.2 12.5h.01M15.8 12.5h.01"/>',
              grandma:'<circle cx="12" cy="9" r="4.4"/><path d="M6 20v-5.3a6 6 0 0 1 12 0V20M7.2 7.2c1.7-3.2 8.1-3.2 9.6 0"/>',
              machine:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M8.5 9h7M8.5 12h7M8.5 15h4M9 2.5v2M15 2.5v2M9 19v2.5M15 19v2.5M2.5 9H5M2.5 15H5M19 9h2.5M19 15h2.5"/>',
              learning:'<path d="m5 19 14-14M9 5h10v10"/><path d="M5 9V5h4"/>',
              meaning:'<circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.7 2.7 0 1 1 4.6 2c-1.3 1-2.1 1.5-2.1 3M12 17.6h.01"/>',
              value:'<path d="M12 20.5S4.5 16.2 4.5 10.8A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.8c0 5.4-7.5 9.7-7.5 9.7Z"/><path d="M12 11v5M9.8 13.5h4.4"/>'
              };
              const NayaBoardIconFor={'WHAT IS NAYA POWER?':'power','WHAT IS NAYA?':'naya','WHAT ARE SMART NOTES?':'note','YOUR INTELLIGENCE TODAY':'today','INTELLIGENCE REPORTS':'report','WHAT IS THE INTELLIGENT LIBRARY?':'library','SMART LISTS':'list','INTELLIGENT FEED / SMART FEED':'feed','SMART TABS':'tabs'};
              const NayaLayerIconFor={'IN A NUTSHELL':'spark','HUMAN NOTE':'human','CHILD NOTE':'child','GRANDMA NOTE':'grandma','NAYA NOTE':'naya','MACHINE NOTE':'machine','LEARNING LESSON':'learning','WHAT IT MEANS':'meaning',"WHAT'S IN IT FOR YOU":'value'};
              const nayaSvgIcon=(kind,extra='')=>`<span class="nayaSvgIcon ${extra}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${NayaBoardIconSVG[kind]||NayaBoardIconSVG.spark}</svg></span>`;
              '''
              s=s.replace('function board(note,idx){',helpers+'\nfunction board(note,idx){',1)

          # Replace the authoritative board renderer, not the rendered DOM.
          pat=r'function board\(note,idx\)\{.*?\}\nfunction stripLegacyBars\(\)'
          new=r'''function board(note,idx){const tone=tones[idx%tones.length],nums=Object.keys(note.sections).map(Number).sort((a,b)=>a-b),nuts=note.sections[1],now=new Date(),dateLabel=now.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',year:'numeric'}),timeLabel=now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),title=norm(note.title),layers=nums.filter(n=>n!==1).map(n=>{const s=note.sections[n],name=norm(s.name),canonical=name==='CHILD'?'CHILD NOTE':name==='ADAPTIVE LEARNING'?'LEARNING LESSON':name==="WHAT'S IN IT FOR YOU?"?"WHAT'S IN IT FOR YOU":name;return `<article class="layer" style="--layer:${tone}"><div class="layerHead"><span class="dot">${nayaSvgIcon(NayaLayerIconFor[canonical]||'meaning')}</span><b>${esc(canonical)}</b><span class="state">${esc(s.state||'INTELLIGENCE')}</span></div><div class="layerBody">${body(s.text)}</div></article>`}).join('');return `<article class="block naya509-board" data-real-smart-note="${note.number}" data-intelligence-id="smart-note-${String(note.number).padStart(2,'0')}" style="--tone:${tone}"><div class="blockInner"><div class="blockTop"><div class="identity"><div class="glyph">${nayaSvgIcon(NayaBoardIconFor[title]||'spark')}</div><div><h3>${esc(note.title)}</h3><div class="meta naya-meta"><span>${dateLabel}</span><span>${timeLabel}</span></div></div></div></div>${nuts?`<div class="nutshell"><b>IN A NUTSHELL</b><p>${body(nuts.text)}</p></div>`:''}<div class="layers">${layers}</div>${actions()}<div class="blockFoot"><span>ONE INTELLIGENCE · MANY VIEWS · ONE IDENTITY</span><span>TRUST: SOURCE / INTERPRETATION SEPARATED</span></div></div></article>`}
function stripLegacyBars()'''
          s2,n=re.subn(pat,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('FAIL: authoritative board() replacement did not match')
          s=s2

          # Replace the old finalizer with a single canonical nine-layer normalizer.
          fp=r'<script[^>]*id=["\\\\]naya-smart-board-finalizer["\\\\][^>]*>.*?</script>'
          finalizer=r'''<script id="naya-smart-board-finalizer">(()=>{'use strict';const A={'CHILD':'CHILD NOTE','CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','ADAPTER LEARNING':'LEARNING LESSON','ADAPTIVE LEARNING':'LEARNING LESSON','MACHINE / PROVENANCE':'MACHINE NOTE'};const ORDER=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS',"WHAT'S IN IT FOR YOU"];const run=()=>{document.querySelectorAll('.block').forEach(b=>{b.querySelectorAll('.truth,.naya509-block-kicker,.naya509-flow-marker,.naya509-living-spine,.naya509-block-context,.naya509-source-row,.naya509-next-status,.naya509-layer-tag,.nutshellIcon').forEach(x=>x.remove());const h=b.querySelector('h3');if(h)h.textContent=h.textContent.replace(/^\s*SMART\s*NOTE\s*\d+\s*[:·—-]?\s*/i,'').trim();const n=b.querySelector('.nutshell');if(n){n.classList.add('semantic-nutshell');const hb=n.querySelector('b');if(hb)hb.textContent='IN A NUTSHELL'}const layers=b.querySelector('.layers');if(!layers)return;const map=new Map();[...layers.children].forEach(x=>{const hb=x.querySelector('.layerHead b');if(!hb){x.remove();return}let t=hb.textContent.replace(/^\s*\d+\s*[·.\-—:]?\s*/,'').replace(/’/g,"'").trim().toUpperCase();t=A[t]||t;if(!ORDER.includes(t)){x.remove();return}hb.textContent=t;map.set(t,x)});layers.replaceChildren(...ORDER.map(k=>map.get(k)).filter(Boolean));layers.querySelectorAll('.layer').forEach(x=>{x.style.width='100%';x.style.gridColumn='1 / -1';x.style.float='none'});});};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run()})();</script>'''
          s,n=re.subn(fp,finalizer,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('FAIL: finalizer replacement did not match')

          # Remove any obsolete nutshell badge styling and prevent icon pseudo-duplicates.
          s=re.sub(r'\.naya-smart-board-v2 \.nutshellIcon\{[^}]*\}','',s)
          s=s.replace('.naya-smart-board-v2 .semantic-nutshell{position:relative;border:2px solid #fff8!important;box-shadow:inset 0 1px #fff8,0 18px 38px #000b,0 0 22px #fff2!important;padding-left:70px!important}', '.naya-smart-board-v2 .semantic-nutshell{position:relative;border:2px solid #fff8!important;box-shadow:inset 0 1px #fff8,0 18px 38px #000b,0 0 22px #fff2!important}')
          s=s.replace('.naya-smart-board-v2 .dot:before{content:attr(data-icon)}','')

          # Canonical icon/typography rules. No overlay badge, no duplicate O1 marker.
          css=r'''<style id="naya-canonical-elite-css">.nayaSvgIcon{display:inline-grid;place-items:center;width:100%;height:100%;color:#fff;filter:drop-shadow(0 3px 8px #000b)}.nayaSvgIcon svg{width:78%;height:78%;display:block;overflow:visible}.glyph .nayaSvgIcon{width:42px;height:42px}.layerHead .dot{width:40px!important;height:40px!important;flex:0 0 40px!important;display:grid!important;place-items:center!important;border-radius:12px!important;color:#fff!important;background:radial-gradient(circle at 32% 24%,#fff6, color-mix(in srgb,var(--layer) 30%,#09090e) 38%,#07070b 78%)!important;border:1.5px solid color-mix(in srgb,var(--layer) 65%,#fff 20%)!important;box-shadow:inset 0 1px #fff9,0 7px 18px #000b,0 0 18px color-mix(in srgb,var(--layer) 25%,transparent)!important}.naya-meta{display:inline-flex!important;align-items:center;gap:9px!important;font-size:10px!important;font-weight:780!important;letter-spacing:.04em!important;color:#bcb6c5!important}.naya-meta span:first-child{color:#f7f5fa!important}.naya-meta span+span:before{content:'·';margin-right:9px;color:#716b79}.semantic-value .layerBody,.semantic-value .layerBody strong{font-size:inherit!important;line-height:inherit!important}.semantic-nutshell{padding-left:0!important}.semantic-nutshell b{font-size:9px!important;font-weight:900!important;letter-spacing:.14em!important}.semantic-nutshell p{font-size:18px!important;line-height:1.68!important}@media(max-width:820px){.glyph .nayaSvgIcon{width:38px;height:38px}.layerHead .dot{width:36px!important;height:36px!important;flex-basis:36px!important}.semantic-nutshell p{font-size:16px!important}.naya-meta{font-size:9px!important}}
          </style>'''
          if 'id="naya-canonical-elite-css"' not in s: s=s.replace('</head>',css+'</head>',1)

          p.write_text(s,encoding='utf-8')
          print('STRUCTURAL_REFINEMENT=APPLIED')
          print('COMPETING_RENDERERS=REMOVED')
          print('CANONICAL_BOARD_RENDERER=UPGRADED')
          print('NUTSHELL_DUPLICATE_ICON=REMOVED')
          print('TOP_METADATA=TIME_AND_DATE')
          print('ELITE_SVG_ICON_FAMILY=APPLIED')
          PY

      - name: Structural verifier — elite canonical contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('2026 09 15 NayaNETHUB.html').read_text(encoding='utf-8')
          if 'function block(b,i){' in s or '.map(block)' in s: raise SystemExit('FAIL: legacy block renderer remains live')
          if 'naya-aaa-smart-board-visual-v1-script' in s or 'naya-smart-board-living-intelligence-v2-script' in s: raise SystemExit('FAIL: competing visual renderers remain')
          if 'nutshellIcon' in s: raise SystemExit('FAIL: duplicate nutshell icon artifact remains')
          if 'SMART NOTE ${String(note.number)' in s or 'CANONICAL INTELLIGENCE' in s[s.find('function board(note,idx)'):s.find('function stripLegacyBars')]: raise SystemExit('FAIL: internal canonical/build label remains in board header')
          if '>01 · IN A NUTSHELL<' in s: raise SystemExit('FAIL: visible numeric nutshell prefix remains')
          if 'HOW TO APPLY / HOW TO USE' in s: raise SystemExit('FAIL: non-canonical tenth visible layer remains')
          rs=s.find('function render()'); ms=s.find('function modal(',rs+1); bs=s.find('function board(note,idx){')
          if min(rs,ms,bs)<0: raise SystemExit('FAIL: canonical renderer boundaries missing')
          if 'notes.map((n,i)=>board(n,i))' not in s[rs:ms]: raise SystemExit('FAIL: render() not wired to board()')
          be=s.find('function stripLegacyBars',bs); bb=s[bs:be]
          for marker in ['Object.keys(note.sections)','nayaSvgIcon','IN A NUTSHELL','NayaBoardIconFor','NayaLayerIconFor','naya-meta']:
              if marker not in bb: raise SystemExit('FAIL: board renderer missing '+marker)
          for marker in ['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS',"WHAT'S IN IT FOR YOU"]:
              if marker not in bb: raise SystemExit('FAIL: canonical layer missing '+marker)
          if "LEARNING:'ADAPTIVE LEARNING'" in s: raise SystemExit('FAIL: legacy learning mapping remains')
          if 'id="naya-canonical-elite-css"' not in s: raise SystemExit('FAIL: elite CSS missing')
          print('CANONICAL_RENDER_PATH=PASS')
          print('NINE_LAYER_CONTRACT=PASS')
          print('NO_NUMERIC_NUTSHELL=PASS')
          print('NO_DUPLICATE_NUTSHELL_ICON=PASS')
          print('NO_COMPETING_RENDERERS=PASS')
          print('TIME_DATE_HEADER=PASS')
          print('ELITE_SVG_ICON_FAMILY=PASS')
          print('TYPOGRAPHY_CONSISTENCY_RULES=PASS')
          print('STRUCTURAL_VERIFIER=PASS')
          PY

      - name: Commit canonical source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '2026 09 15 NayaNETHUB.html'; then echo 'CANONICAL_SOURCE_CHANGE=NONE'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '2026 09 15 NayaNETHUB.html'
          git commit -m 'Make Smart Board refinement structural and elite'
          git push origin HEAD:main
          echo 'CANONICAL_SOURCE_COMMIT=PUSHED'
