# CANONICAL SMART BOARD EXECUTION LANE
# execution-proof-v18
name: 511 Canonical Smart Board Mirror

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/511-canonical-smart-board-mirror.yml'
  workflow_run:
    workflows: ["Naya Power — Preflight Governance"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce canonical nine-layer presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('2026 09 15 NayaNETHUB.html')
          s=path.read_text(encoding='utf-8')
          s=s.replace("LEARNING:'ADAPTIVE LEARNING'", "LEARNING:'LEARNING LESSON'")
          s=s.replace("\"WHAT'S IN IT FOR YOU?\":\"WHAT'S IN IT FOR YOU?\"", "\"WHAT'S IN IT FOR YOU?\":\"WHAT'S IN IT FOR YOU\"")
          if '.perspectiveNo{display:none!important}' not in s:
              s=s.replace('</style>', '.perspectiveNo{display:none!important}</style>', 1)
          inject="document.querySelectorAll('.perspectiveNo').forEach(e=>e.remove());"
          if inject not in s and 'function elevate(){' in s:
              s=s.replace('function elevate(){','function elevate(){'+inject,1)
          path.write_text(s,encoding='utf-8')
          print('CANONICAL_PRESENTATION_NORMALIZATION=APPLIED')
          PY

      - name: Structural verifier — all canonical boards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('2026 09 15 NayaNETHUB.html').read_text(encoding='utf-8')
          required=['IN A NUTSHELL','HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS',"WHAT'S IN IT FOR YOU"]
          if 'function block(b,i){' in s or re.search(r'\.map\(block\)',s): raise SystemExit('FAIL: legacy block renderer remains live')
          render_start=s.find('function render(){'); modal_start=s.find('function modal(',render_start+1)
          if render_start<0 or modal_start<0 or 'notes.map((n,i)=>board(n,i))' not in s[render_start:modal_start]: raise SystemExit('FAIL: render() not canonical')
          if 'function parseNotes' not in s: raise SystemExit('FAIL: canonical parseNotes missing')
          board_start=s.find('function board(note,idx){')
          if board_start<0: raise SystemExit('FAIL: canonical board() missing')
          board_end=s.find('function ',board_start+1); board_body=s[board_start:board_end] if board_end>board_start else s[board_start:]
          if 'Object.keys(note.sections)' not in board_body: raise SystemExit('FAIL: board() section contract missing')
          if '.perspectiveNo{display:none!important}' not in s: raise SystemExit('FAIL: numeric marker suppression missing')
          if "LEARNING:'ADAPTIVE LEARNING'" in s: raise SystemExit('FAIL: legacy ADAPTIVE LEARNING remains')
          if "\"WHAT'S IN IT FOR YOU?\":\"WHAT'S IN IT FOR YOU?\"" in s: raise SystemExit('FAIL: legacy question-mark label remains')
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('FAIL: canonical layer labels missing: '+', '.join(missing))
          if 'const labels=' not in s: raise SystemExit('FAIL: canonical runtime label map missing')
          print('CANONICAL_NINE_LAYER_LABELS=PASS')
          print('VISIBLE_NUMERIC_PREFIXES=PASS')
          print('LEGACY_LABELS=PASS')
          print('CANONICAL_RENDER_PATH=PASS')
          print('NINE_SMART_NOTES_RENDER_PATH=PASS')
          print('RUNTIME_LAYER_CONTRACT=PASS')
          print('STRUCTURAL_VERIFIER=PASS')
          PY

      - name: Commit canonical source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '2026 09 15 NayaNETHUB.html'; then echo 'CANONICAL_SOURCE_CHANGE=NONE'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '2026 09 15 NayaNETHUB.html'
          git commit -m 'Normalize Smart Board layers and remove visible numbering'
          git push origin HEAD:main
          echo 'CANONICAL_SOURCE_COMMIT=PUSHED'
