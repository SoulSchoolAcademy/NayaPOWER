name: 511 Canonical Smart Board Mirror
on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/511-canonical-smart-board-mirror.yml'
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical structural refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html'); s=p.read_text(encoding='utf-8')
          for sid in ['naya-elite-interface-refinement-runtime','naya-aaa-smart-board-visual-v1-script','naya-smart-board-living-intelligence-v2-script']:
              s=re.sub(r'<script[^>]*id=["\\\\]'+re.escape(sid)+r'["\\\\][^>]*>.*?</script>','',s,flags=re.S)
          s=re.sub(r'<style[^>]*id=["\\\\]naya-elite-interface-refinement["\\\\][^>]*>.*?</style>','',s,flags=re.S)
          s=s.replace("LEARNING:'ADAPTIVE LEARNING'","LEARNING:'LEARNING LESSON'").replace('>01 · IN A NUTSHELL<','>IN A NUTSHELL<').replace('>ADAPTIVE LEARNING<','>LEARNING LESSON<').replace('<b>CHILD</b>','<b>CHILD NOTE</b>')
          if 'const NayaBoardIconSVG=' not in s:
              h='''const NayaBoardIconSVG={power:'<path d="M13 2 6 13h5l-1 9 7-12h-5z"/>',naya:'<path d="m12 2 2 7 7 3-7 3-2 7-2-7-7-3 7-3z"/>',note:'<path d="M6 4h10l3 3v13H6z"/><path d="M15 4v4h4M9 12h6M9 16h6"/>',today:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v5M16 3v5M4 10h16M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/>',report:'<path d="M5 20V10M12 20V5M19 20V2"/><path d="M3 20h18"/>',library:'<path d="M5 20V6l7-3 7 3v14"/><path d="M8 10h8M8 14h8M8 18h8"/>',list:'<path d="M7 6h13M7 12h13M7 18h13"/><circle cx="3" cy="6" r=".7"/><circle cx="3" cy="12" r=".7"/><circle cx="3" cy="18" r=".7"/>',feed:'<path d="M5 19V5M5 19h14"/><path d="M8 15a6 6 0 0 0 6-6M8 11a2 2 0 0 1 2-2"/>',tabs:'<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9h16M8 5v4M12 5v4M16 5v4"/>',spark:'<path d="m12 2 2 7 7 3-7 3-2 7-2-7-7-3 7-3z"/>',human:'<circle cx="12" cy="8" r="3"/><path d="M6 20c.5-3.4 2.5-5 6-5s5.5 1.6 6 5"/>',child:'<circle cx="12" cy="8" r="2.7"/><path d="M7 20c.5-3 2.2-4.5 5-4.5s4.5 1.5 5 4.5"/>',grandma:'<circle cx="12" cy="9" r="4"/><path d="M6 20v-5a6 6 0 0 1 12 0v5M7 7c1.5-3 8.5-3 10 0"/>',machine:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 9h6M9 12h6M9 15h3M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',learning:'<path d="m5 19 14-14M9 5h10v10M5 9V5h4"/>',meaning:'<circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.7 2.7 0 1 1 4.5 2c-1.3 1-2 1.5-2 3M12 17.5h.01"/>',value:'<path d="M12 21S4.5 16.5 4.5 11A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 3c0 5.5-7.5 10-7.5 10Z"/><path d="M12 11v5M10 13.5h4"/>'};
const NayaBoardIconFor={'WHAT IS NAYA POWER?':'power','WHAT IS NAYA?':'naya','WHAT ARE SMART NOTES?':'note','YOUR INTELLIGENCE TODAY':'today','INTELLIGENCE REPORTS':'report','WHAT IS THE INTELLIGENT LIBRARY?':'library','SMART LISTS':'list','INTELLIGENT FEED / SMART FEED':'feed','SMART TABS':'tabs'};
const NayaLayerIconFor={'IN A NUTSHELL':'spark','HUMAN NOTE':'human','CHILD NOTE':'child','GRANDMA NOTE':'grandma','NAYA NOTE':'naya','MACHINE NOTE':'machine','LEARNING LESSON':'learning','WHAT IT MEANS':'meaning',"WHAT'S IN IT FOR YOU":'value'};
const nayaSvgIcon=k=>`<span class="nayaSvgIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${NayaBoardIconSVG[k]||NayaBoardIconSVG.spark}</svg></span>`;'''
              s=s.replace('function board(note,idx){',h+'\nfunction board(note,idx){',1)
          pat=r'function board\(note,idx\)\{.*?\}\nfunction stripLegacyBars\(\)'
          new='''function board(note,idx){const tone=tones[idx%tones.length],nums=Object.keys(note.sections).map(Number).sort((a,b)=>a-b),nuts=note.sections[1],now=new Date(),dateLabel=now.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',year:'numeric'}),timeLabel=now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),title=norm(note.title),layers=nums.filter(n=>n!==1).map(n=>{const z=note.sections[n],raw=norm(z.name),name=raw==='CHILD'?'CHILD NOTE':raw==='ADAPTIVE LEARNING'?'LEARNING LESSON':raw==="WHAT'S IN IT FOR YOU?"?"WHAT'S IN IT FOR YOU":raw;return `<article class="layer" style="--layer:${tone}"><div class="layerHead"><span class="dot">${nayaSvgIcon(NayaLayerIconFor[name]||'meaning')}</span><b>${esc(name)}</b><span class="state">${esc(z.state||'INTELLIGENCE')}</span></div><div class="layerBody">${body(z.text)}</div></article>`}).join('');return `<article class="block naya509-board" data-real-smart-note="${note.number}" data-intelligence-id="smart-note-${String(note.number).padStart(2,'0')}" style="--tone:${tone}"><div class="blockInner"><div class="blockTop"><div class="identity"><div class="glyph">${nayaSvgIcon(NayaBoardIconFor[title]||'spark')}</div><div><h3>${esc(note.title)}</h3><div class="meta naya-meta"><span>${dateLabel}</span><span>${timeLabel}</span></div></div></div></div>${nuts?`<div class="nutshell"><b>IN A NUTSHELL</b><p>${body(nuts.text)}</p></div>`:''}<div class="layers">${layers}</div>${actions()}<div class="blockFoot"><span>ONE INTELLIGENCE · MANY VIEWS · ONE IDENTITY</span><span>TRUST: SOURCE / INTERPRETATION SEPARATED</span></div></div></article>`}
function stripLegacyBars()'''
          s,n=re.subn(pat,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('board renderer replacement failed')
          fp=r'<script[^>]*id=["\\\\]naya-smart-board-finalizer["\\\\][^>]*>.*?</script>'
          fin='''<script id="naya-smart-board-finalizer">(()=>{'use strict';const A={'CHILD':'CHILD NOTE','CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','ADAPTER LEARNING':'LEARNING LESSON','ADAPTIVE LEARNING':'LEARNING LESSON'};const ORDER=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS',"WHAT'S IN IT FOR YOU"];const f=()=>document.querySelectorAll('.block').forEach(b=>{b.querySelectorAll('.truth,.naya509-block-kicker,.naya509-flow-marker,.naya509-living-spine,.naya509-block-context,.naya509-source-row,.naya509-next-status,.naya509-layer-tag,.nutshellIcon').forEach(x=>x.remove());const h=b.querySelector('h3');if(h)h.textContent=h.textContent.replace(/^\\s*SMART\\s*NOTE\\s*\\d+\\s*[:·—-]?\\s*/i,'').trim();const n=b.querySelector('.nutshell');if(n){const x=n.querySelector('b');if(x)x.textContent='IN A NUTSHELL'}const l=b.querySelector('.layers');if(!l)return;const m=new Map;[...l.children].forEach(x=>{const h=x.querySelector('.layerHead b');if(!h){x.remove();return}let t=h.textContent.replace(/^\\s*\\d+\\s*[·.\\-—:]?\\s*/,'').replace(/’/g,"'").trim().toUpperCase();t=A[t]||t;if(!ORDER.includes(t)){x.remove();return}h.textContent=t;m.set(t,x)});l.replaceChildren(...ORDER.map(k=>m.get(k)).filter(Boolean))});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',f,{once:true});else f()})();</script>'''
          s,n=re.subn(fp,fin,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('finalizer replacement failed')
          s=re.sub(r'\.naya-smart-board-v2 \.nutshellIcon\{[^}]*\}','',s).replace('.naya-smart-board-v2 .dot:before{content:attr(data-icon)}','')
          css='''<style id="naya-canonical-elite-css">.nayaSvgIcon{display:inline-grid;place-items:center;width:100%;height:100%;color:#fff;filter:drop-shadow(0 3px 8px #000b)}.nayaSvgIcon svg{width:78%;height:78%;display:block}.glyph .nayaSvgIcon{width:42px;height:42px}.layerHead .dot{width:40px!important;height:40px!important;flex:0 0 40px!important;display:grid!important;place-items:center!important;border-radius:12px!important;color:#fff!important;background:radial-gradient(circle at 32% 24%,#fff6,color-mix(in srgb,var(--layer) 30%,#09090e) 38%,#07070b 78%)!important;border:1.5px solid color-mix(in srgb,var(--layer) 65%,#fff 20%)!important;box-shadow:inset 0 1px #fff9,0 7px 18px #000b,0 0 18px color-mix(in srgb,var(--layer) 25%,transparent)!important}.naya-meta{display:inline-flex!important;align-items:center;gap:9px!important;font-size:10px!important;font-weight:780!important;letter-spacing:.04em!important;color:#bcb6c5!important}.naya-meta span:first-child{color:#f7f5fa!important}.naya-meta span+span:before{content:'·';margin-right:9px;color:#716b79}.semantic-value .layerBody,.semantic-value .layerBody strong{font-size:inherit!important;line-height:inherit!important}.semantic-nutshell{padding-left:0!important}.semantic-nutshell p{font-size:18px!important;line-height:1.68!important}@media(max-width:820px){.glyph .nayaSvgIcon{width:38px;height:38px}.layerHead .dot{width:36px!important;height:36px!important;flex-basis:36px!important}.semantic-nutshell p{font-size:16px!important}.naya-meta{font-size:9px!important}}</style>'''
          if 'id="naya-canonical-elite-css"' not in s:s=s.replace('</head>',css+'</head>',1)
          Path('.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md').unlink(missing_ok=True)
          p.write_text(s,encoding='utf-8')
          print('ELITE_STRUCTURAL_REFINEMENT_APPLIED')
          PY
      - name: Verify canonical contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('2026 09 15 NayaNETHUB.html').read_text(encoding='utf-8')
          assert 'function block(b,i){' not in s and '.map(block)' not in s
          assert 'naya-aaa-smart-board-visual-v1-script' not in s and 'naya-smart-board-living-intelligence-v2-script' not in s
          assert 'nutshellIcon' not in s
          assert '>01 · IN A NUTSHELL<' not in s
          assert 'HOW TO APPLY / HOW TO USE' not in s
          a=s.find('function board(note,idx){'); b=s.find('function stripLegacyBars',a)
          bb=s[a:b]
          assert 'Object.keys(note.sections)' in bb and 'nayaSvgIcon' in bb and 'naya-meta' in bb
          for x in ['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS',"WHAT'S IN IT FOR YOU"]: assert x in bb
          assert 'id="naya-canonical-elite-css"' in s
          print('STRUCTURAL_VERIFIER=PASS')
          print('NINE_LAYER_CONTRACT=PASS')
          print('NO_DUPLICATE_NUTSHELL_ICON=PASS')
          print('TIME_DATE_HEADER=PASS')
          print('ELITE_SVG_ICON_FAMILY=PASS')
          print('NO_COMPETING_RENDERERS=PASS')
          PY
      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md
          if git diff --quiet -- '2026 09 15 NayaNETHUB.html' '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'; then exit 0; fi
          git add '2026 09 15 NayaNETHUB.html' '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
          git commit -m 'Make Smart Board refinement structural and elite'
          git push origin HEAD:main
