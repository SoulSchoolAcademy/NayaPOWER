# CANONICAL SMART BOARD EXECUTION LANE
name: 511 Canonical Smart Board Mirror

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/511-canonical-smart-board-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose canonical Smart Board source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          print('SOURCE_BYTES=',len(s.encode('utf-8')))
          print('BOARD_IDS=',len(re.findall(r'id=[\"\']naya509-\d{2}[\"\']',s)))
          for name in ('board','block','render'):
              m=re.search(r'function '+name+r'\s*\([^)]*\)\s*\{',s)
              print('FUNCTION_'+name.upper()+'=', 'FOUND' if m else 'MISSING')
              if m:
                  print('FUNCTION_'+name.upper()+'_OFFSET=',m.start())
                  print(s[m.start():m.start()+1800])
          labels=['IN A NUTSHELL','HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"]
          for label in labels:
              print('LABEL',label,'COUNT=',len(re.findall(re.escape(label),s,re.I)))
          PY
      - name: Verify source is intact
        shell: bash
        run: |
          set -euo pipefail
          test -s '2026 09 15 NayaNETHUB.html'
          grep -Fq 'nayanet-direct-nine' '2026 09 15 NayaNETHUB.html'
          grep -Fq 'verified-static-top-nine' '2026 09 15 NayaNETHUB.html'
          echo 'CANONICAL_SOURCE_INTACT=PASS'
