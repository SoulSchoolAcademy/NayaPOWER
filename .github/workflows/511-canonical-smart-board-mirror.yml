# CANONICAL SMART BOARD EXECUTION LANE
name: 511 Canonical Smart Board Mirror

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/511-canonical-smart-board-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose canonical Smart Board data path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('2026 09 15 NayaNETHUB.html').read_text(encoding='utf-8')
          for name in ('dataFor','board','block','render'):
              m=re.search(r'function '+name+r'\s*\([^)]*\)\s*\{',s)
              print('\n===',name,'===')
              if not m:
                  print('MISSING')
                  continue
              print('OFFSET=',m.start())
              print(s[m.start():m.start()+2600])
          print('\n=== board call sites ===')
          for m in re.finditer(r'\bboard\s*\(',s): print(m.start(),s[m.start()-80:m.start()+180].replace('\n',' '))
          print('\n=== sections references ===')
          for m in re.finditer(r'\.sections\b',s): print(m.start(),s[m.start()-100:m.start()+180].replace('\n',' '))
          PY
      - name: Verify source is intact
        shell: bash
        run: |
          set -euo pipefail
          test -s '2026 09 15 NayaNETHUB.html'
          grep -Fq 'nayanet-direct-nine' '2026 09 15 NayaNETHUB.html'
          grep -Fq 'verified-static-top-nine' '2026 09 15 NayaNETHUB.html'
          echo 'CANONICAL_SOURCE_INTACT=PASS'
