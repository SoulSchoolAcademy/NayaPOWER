name: Verify Contract Registry Conformance

# Makes the CANONICAL CONTRACT REGISTRY enforceable instead of prose.
#
# A registry is the map a cold Naya reads to learn which contract governs what.
# This gate checks the registry's own claims against the repository: cited paths
# must exist, acceptance claims must be routed into a real workflow, RATIFIED
# claims must have a recorded human ratification, the six constitutional
# truth-model equations must still exist, and the required truth-state set must be
# definable at truth-model level.
#
# It is deliberately NOT the library structure audit; that is
# verify-contract-library-integrity.yml. Neither substitutes for the other.
#
# Known debt is baselined so this gate blocks NEW drift only. The report always
# states conforming=false while any debt remains, so a green run is never mistaken
# for a complete contract system.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-registry-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit canonical contract registry conformance
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python -B .naya/runtime/contract_registry_conformance.py | tee conformance.txt
          echo "REGISTRY=$(grep -m1 '^REGISTRY=' conformance.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "ENTRIES=$(grep -m1 '^REGISTRY_ENTRIES=' conformance.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "CITED=$(grep -m1 '^CITED_PATHS_CHECKED=' conformance.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "EQUATIONS=$(grep -m1 '^CONSTITUTIONAL_EQUATIONS=' conformance.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "DEBT=$(grep -m1 '^KNOWN_DEBT=' conformance.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "CONFORMING=$(grep -m1 '^CONFORMING=' conformance.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Prove the gate fails on new drift
        shell: bash
        run: |
          set -euo pipefail
          # A gate nobody has seen fail is not a gate. Corrupt a cited path in a
          # scratch copy and prove the auditor reports it as new drift.
          tmp=$(mktemp -d)
          cp -r .naya "$tmp/.naya"
          cp -r supabase "$tmp/supabase" 2>/dev/null || true
          cp -r .github "$tmp/.github"
          cp -r tests "$tmp/tests" 2>/dev/null || true
          rm -f "$tmp/supabase/migrations/20260924100000_wire_authority_grant_into_intelligence_commit_v1.sql"
          set +e
          python -B "$tmp/.naya/runtime/contract_registry_conformance.py" --root "$tmp" > "$tmp/out.txt" 2>&1
          code=$?
          set -e
          cat "$tmp/out.txt"
          test "$code" -ne 0
          grep -q NEW_DRIFT_DETAIL "$tmp/out.txt" || { echo "gate did not surface new drift detail"; exit 1; }
          echo "ADVERSARIAL_NEW_DRIFT_DETECTION_PROVEN"

      - name: Prove the gate fails when a constitutional equation is removed
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -r .naya "$tmp/.naya"
          cp -r supabase "$tmp/supabase" 2>/dev/null || true
          cp -r .github "$tmp/.github"
          cp -r tests "$tmp/tests" 2>/dev/null || true
          law="$tmp/.naya/contracts/00-NAYANET-CONSTITUTIONAL-CONTRACT-LAW.md"
          python - "$law" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          t = p.read_text(encoding="utf-8")
          n = t.replace("IMPLEMENTED \u2260 VERIFIED", "IMPLEMENTED is close enough to VERIFIED")
          assert n != t, "fixture assumption broken: equation text not found"
          p.write_text(n, encoding="utf-8")
          PY
          set +e
          python -B "$tmp/.naya/runtime/contract_registry_conformance.py" --root "$tmp" > "$tmp/out.txt" 2>&1
          code=$?
          set -e
          cat "$tmp/out.txt"
          test "$code" -ne 0
          grep -q CONSTITUTIONAL_EQUATION_MISSING "$tmp/out.txt"
          echo "ADVERSARIAL_EQUATION_REMOVAL_DETECTION_PROVEN"

      - name: Run the conformance test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check pytest
          python -m pytest tests/test_contract_registry_conformance.py -q

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-registry-conformance-report
          path: |
            .naya/contract-registry-conformance-report.json
            .naya/contracts/CONTRACT-REGISTRY-CONFORMANCE-BASELINE.json
          if-no-files-found: error

      - name: Report truth position
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "CONTRACT_REGISTRY=${{ steps.audit.outputs.REGISTRY }}"
          echo "REGISTRY_ENTRIES=${{ steps.audit.outputs.ENTRIES }}"
          echo "CITED_PATHS_CHECKED=${{ steps.audit.outputs.CITED }}"
          echo "CONSTITUTIONAL_EQUATIONS=${{ steps.audit.outputs.EQUATIONS }}"
          echo "KNOWN_DEBT=${{ steps.audit.outputs.DEBT }}"
          echo "CONFORMING=${{ steps.audit.outputs.CONFORMING }}"
          if [ "${{ steps.audit.outputs.CONFORMING }}" != "True" ]; then
            echo "CONTRACT_SYSTEM_COMPLETE=false"
            echo "The contract registry does NOT conform. Known debt is recorded, not resolved."
          else
            echo "CONTRACT_SYSTEM_COMPLETE=true"
          fi
