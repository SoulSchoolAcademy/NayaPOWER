name: Live Intelligence Commit Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-intelligence-commit-proof
  cancel-in-progress: false

env:
  RUNTIME_FUNCTION: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-intelligence-commit-runtime
  GRANT_ID: 0e082400-de6b-485e-9ebc-51b34f5debdc

jobs:
  fresh-lesson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Mint short-lived Naya runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Execute one fresh lesson through Naya runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, uuid
          lesson_key = "NAYA-FLOW-LESSON-" + uuid.uuid4().hex
          json.dump({
            "mode":"execute","p_authority_grant_id":os.environ["GRANT_ID"],"p_event_id":lesson_key,
            "p_title":"Naya runtime flow lesson",
            "p_content":"Durable authority should flow through short-lived runtime credentials without recurring human token handoff.",
            "p_category":"COLLECTIVE_INTELLIGENCE","p_topic":"RUNTIME_CONTINUITY",
            "p_target_id":"NAYA-NODE-0001","p_project_id":"NayaNET"}, open("lesson-request.json","w"), indent=2)
          PY
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @lesson-request.json "$RUNTIME_FUNCTION" > fresh-lesson-receipt.json
          cat fresh-lesson-receipt.json
          python - <<'PY'
          import json
          r=json.load(open("fresh-lesson-receipt.json"))
          assert r["ok"] is True, r
          assert r["status"] == "EXECUTED", r
          result=r["result"]
          assert result["ok"] is True, result
          assert result["understanding_state"] == "CANDIDATE", result
          json.dump({k:result[k] for k in ("event_id","intelligent_block_id","lineage_id","relationship_id","index_id","checkpoint_id","receipt_id")}, open("fresh-lesson-lineage-ids.json","w"), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-lesson-lineage
          path: |
            fresh-lesson-receipt.json
            fresh-lesson-lineage-ids.json

  independent-verification:
    needs: fresh-lesson
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Mint independent short-lived Naya runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - uses: actions/download-artifact@v4
        with:
          name: fresh-lesson-lineage
      - name: Independently reread persisted lesson lineage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open("fresh-lesson-lineage-ids.json"))
          json.dump({"mode":"verify", **x}, open("verify-request.json","w"))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @verify-request.json "$RUNTIME_FUNCTION" > independent-lineage-verification.json
          cat independent-lineage-verification.json
          python - <<'PY'
          import json
          r=json.load(open("independent-lineage-verification.json"))
          assert r["ok"] is True, r
          assert r["status"] == "LINEAGE_VERIFIED", r
          assert r["independent_verification"] is True, r
          assert all(r["checks"].values()), r
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-fresh-lesson-verification
          path: independent-lineage-verification.json
# Re-trigger canonical fresh-lesson proof after authority-target repair; execution path remains the existing Naya OIDC runtime seam.

  learn-promote-fresh-lesson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: fresh-lesson-lineage
      - name: Mint short-lived Naya runtime identity for LEARN candidate creation
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Bind the exact persisted Intelligent Block into existing LEARN candidate state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open("fresh-lesson-lineage-ids.json"))
          json.dump({"mode":"candidate","intelligent_block_id":x["intelligent_block_id"]},open("candidate-request.json","w"),indent=2)
          PY
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @candidate-request.json "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-learning-verify" > learning-candidate.json
          cat learning-candidate.json
          python - <<'PY'
          import json
          r=json.load(open("learning-candidate.json"))
          assert r["ok"] is True, r
          assert r["learning"]["status"] == "CANDIDATE", r
          assert r["learning"]["observed_value"]["intelligent_block_id"] == json.load(open("fresh-lesson-lineage-ids.json"))["intelligent_block_id"], r
          assert r["learning"]["observed_value"]["provenance_preserved"] is True, r
          json.dump(r["learning"],open("learning-record.json","w"),indent=2)
          PY
      - name: Execute existing causal learning experiment against this exact candidate
        shell: bash
        run: |
          set -euo pipefail
          learning_id="$(python -c 'import json; print(json.load(open("learning-record.json"))["id"])')"
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data "{\"learning_id\":\"$learning_id\"}" "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-cold-runtime-proof?mode=learning-influence" > causal-learning-experiment.json
          cat causal-learning-experiment.json
          python - <<'PY'
          import json
          r=json.load(open("causal-learning-experiment.json"))
          assert r["ok"] is True, r
          assert r["control"]["evidence"]["retained_intelligence_used"] is False, r
          assert r["treatment"]["evidence"]["retained_intelligence_used"] is True, r
          assert r["control"]["observed_result"] != r["treatment"]["observed_result"], r
          PY
      - name: Independently verify the causal outcome through existing CVO machinery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open("causal-learning-experiment.json"))
          json.dump({"mode":"cvo","learning_id":r["learning_id"],"treatment_receipt_id":r["treatment"]["id"],"control_receipt_id":r["control"]["id"]},open("cvo-request.json","w"))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @cvo-request.json "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-causal-learning-experiment" > causal-verification.json
          cat causal-verification.json
          python - <<'PY'
          import json
          r=json.load(open("causal-verification.json"))
          assert r["ok"] is True, r
          assert r["causal_verification"]["causal_assessment"] == "CAUSAL_SUPPORTED", r
          assert r["causal_verification"]["verification_status"] == "OUTCOME_VERIFIED", r
          PY
      - name: Promote through existing LEARN verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          e=json.load(open("causal-learning-experiment.json"))
          v=json.load(open("causal-verification.json"))
          payload={"learning_id":e["learning_id"],"evidence_refs":[e["treatment"]["id"],e["control"]["id"],e["learning_id"],v["causal_verification"]["causal_id"]],"receipt_id":e["treatment"]["id"],"verification_method":"Independent causal-learning runtime verification: control/treatment outcome delta recomputed from persisted receipts."}
          json.dump(payload,open("promotion-request.json","w"),indent=2)
          PY
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @promotion-request.json "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-learning-verify" > learning-promotion.json
          cat learning-promotion.json
          python - <<'PY'
          import json
          r=json.load(open("learning-promotion.json"))
          assert r["ok"] is True, r
          assert r["verified"] is True, r
          assert r["result"]["learning"]["status"] == "ACTIVE", r
          assert r["result"]["learning"]["provenance"] == "VERIFICATION", r
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-lesson-learning-promotion
          path: |
            learning-candidate.json
            learning-record.json
            causal-learning-experiment.json
            causal-verification.json
            learning-promotion.json

  independent-retained-learning-reread:
    needs: learn-promote-fresh-lesson
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: fresh-lesson-learning-promotion
      - name: Mint fresh independent OIDC verifier identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Independently reread retained learning from authoritative state
        shell: bash
        run: |
          set -euo pipefail
          learning_id="$(python -c 'import json; print(json.load(open("learning-record.json"))["id"])')"
          python - <<PY
          import json
          json.dump({"mode":"reread","learning_id":"$learning_id"},open("reread-request.json","w"))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @reread-request.json "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-learning-verify" > retained-learning-reread.json
          cat retained-learning-reread.json
          python - <<'PY'
          import json
          r=json.load(open("retained-learning-reread.json"))
          assert r["ok"] is True, r
          assert r["independent_reread"] is True, r
          assert r["learning"]["status"] == "ACTIVE", r
          assert r["learning"]["provenance"] == "VERIFICATION", r
          observed=r["learning"]["observed_value"]
          assert observed["provenance_preserved"] is True, r
          assert observed["intelligent_block_id"] == json.load(open("learning-record.json"))["observed_value"]["intelligent_block_id"], r
          print("FRESH LESSON RETAINED INTELLIGENCE INDEPENDENT REREAD PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-retained-learning-reread
          path: retained-learning-reread.json
