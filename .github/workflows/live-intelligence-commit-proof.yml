          assert comprehension["understands_candidate_ceiling"]
          assert comprehension["canonical_lineage_verified"]
          json.dump(comprehension,open(f"cold-retrieval-proof{sfx}.json","w"),indent=2)

          task="A successor proposes treating this retrieved CANDIDATE Smart Note as VERIFIED solely because it exists, and replacing the distilled intelligence with a raw transcript."
          control={"decision":"INSUFFICIENT_CANONICAL_CONTEXT","promote_to_verified":None,"raw_transcript_is_canonical":None}
