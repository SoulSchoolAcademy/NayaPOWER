name: Live Intelligence Commit Proof

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact commit SHA that refs/heads/main must resolve to before any consequential step'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".naya/capture/**"

permissions:
  contents: write
  id-token: write

concurrency:
  group: live-intelligence-commit-proof
  cancel-in-progress: false

env:
  RUNTIME_FUNCTION: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-intelligence-commit-runtime
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_source_sha || github.sha }}
  GRANT_ID: 0e082400-de6d-485e-9ebc-51b34f5debdc

jobs:
  fresh-lesson:
    if: ${{ !contains(github.event.head_commit.message || '', '[smart-note-projection]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify resolved source matches expected_source_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="${{ inputs.expected_source_sha }}"
          if [ -z "$expected" ]; then
            expected="${{ github.sha }}"
          fi
          resolved="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)"
          printf '%s' "$resolved" > resolved-source-sha.txt
          echo "expected_source_sha=$expected"
          echo "resolved_main_sha=$resolved"
          if [ "$resolved" != "$expected" ]; then
            echo "SOURCE BINDING MISMATCH: refs/heads/main resolved to $resolved, expected $expected. Failing closed."
            exit 1
          fi
          echo "Source binding verified: $resolved"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Discover generalized Smart Note capture
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed < <(git diff --name-only "$before" "$after")
          else
            mapfile -t changed < <(git show --pretty="" --name-only "$after")
          fi
          capture_path="$(python tools/smart_note_v2.py discover "${changed[@]}")"
          printf '%s' "$capture_path" > capture-path.txt

      - name: Mint short-lived Naya runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"

      - name: Execute new capture or reconcile existing canonical Block
        shell: bash
        run: |
          set -euo pipefail
          capture_count="$(grep -c '[^[:space:]]' capture-path.txt || true)"
          if [[ "$capture_count" -gt 1 ]]; then
            # BATCH MODE (Problem A repair): more than one changed capture.
            # Process sequentially; each capture gets its own receipt artifacts
            # (suffixed .$idx). A per-capture failure fails this step loudly
            # naming the capture; retry converges because already-processed
            # captures reconcile by exact content hash (idempotent).
            echo "BATCH: $capture_count captures discovered; processing sequentially, one receipt per capture."
            idx=0
            while IFS= read -r capture_path || [[ -n "$capture_path" ]]; do
              [[ -z "${capture_path//[[:space:]]/}" ]] && continue
              echo "BATCH [$idx]: executing $capture_path"
              CAPTURE_PATH="$capture_path" CAPTURE_IDX="$idx" python - <<'PY'
          import hashlib, json, os, pathlib, uuid
          from tools.smart_note_v2 import resolve_runtime_connections
          capture_path=os.environ["CAPTURE_PATH"]
          sfx="."+os.environ["CAPTURE_IDX"]
          registry_path=pathlib.Path(".naya/memory/smart-notes/index.json")
          registry=json.loads(registry_path.read_text()) if registry_path.exists() else {"entries":[]}

          capture=json.loads(pathlib.Path(capture_path).read_text())
          distilled=json.dumps(capture["intelligence"],sort_keys=True,separators=(",",":"),ensure_ascii=False)
          digest=hashlib.sha256(distilled.encode()).hexdigest()
          exact=next((e for e in registry.get("entries",[]) if e.get("content_hash")==digest),None)
          resolved_connections=resolve_runtime_connections(capture,registry)
          expected={"capture_path":capture_path,"capture_id":capture["capture_id"],"expected_content":distilled,"content_hash":digest,"resolved_connections":resolved_connections}
          pathlib.Path(f"smart-note-expected{sfx}.json").write_text(json.dumps(expected,indent=2,ensure_ascii=False))
          if exact:
              p=exact["provenance"]
              ids={
                "event_id":p["event_id"],
                "intelligent_block_id":exact["intelligent_block_id"],
                "lineage_id":p["lineage_id"],
                "relationship_id":p["relationship_id"],
                "index_id":p["runtime_index_id"],
                "checkpoint_id":p["checkpoint_id"],
                "receipt_id":p["receipt_id"],
              }
              pathlib.Path(f"fresh-lesson-lineage-ids{sfx}.json").write_text(json.dumps(ids,indent=2))
              pathlib.Path(f"reconciliation{sfx}.json").write_text(json.dumps({
                "status":"REUSED_EXISTING_CANONICAL_BLOCK",
                "matched_by":"exact_content_hash",
                "intelligent_block_id":exact["intelligent_block_id"],
                "semantic_near_duplicate_policy":"CANDIDATE_REVIEW_REQUIRED"
              },indent=2))
              raise SystemExit(0)
          request={
            "mode":"execute","p_authority_grant_id":os.environ["GRANT_ID"],
            "p_event_id":"SMART-NOTE-"+capture["capture_id"],
            "p_title":capture["title"],"p_content":distilled,
            "p_category":capture.get("category","SMART_NOTE"),"p_topic":capture["topic"],
            "p_target_id":"NAYA-NODE-0001","p_project_id":"NayaNET","p_connections":resolved_connections
          }
          pathlib.Path(f"lesson-request{sfx}.json").write_text(json.dumps(request,indent=2,ensure_ascii=False))
          PY

              if [[ -f "reconciliation.$idx.json" ]]; then
                cat "reconciliation.$idx.json"
              else
                curl -fsS -X POST               -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"               -H "Content-Type: application/json"               --data-binary @"lesson-request.$idx.json" "$RUNTIME_FUNCTION" > "fresh-lesson-receipt.$idx.json"
                CAPTURE_IDX="$idx" python - <<'PY'
          import json, os
          sfx="."+os.environ["CAPTURE_IDX"]
          r=json.load(open(f"fresh-lesson-receipt{sfx}.json"))
          assert r["ok"] is True, r
          assert r["status"] == "EXECUTED", r
          result=r["result"]
          assert result["ok"] is True, result
          assert result["understanding_state"] == "CANDIDATE", result
          json.dump({k:result[k] for k in ("event_id","intelligent_block_id","lineage_id","relationship_id","index_id","checkpoint_id","receipt_id")},open(f"fresh-lesson-lineage-ids{sfx}.json","w"),indent=2)
          PY
              fi
              idx=$((idx+1))
            done < capture-path.txt
            echo "BATCH: processed $idx capture(s); each has its own receipt."
          else
          capture_path="$(cat capture-path.txt)"
          python - <<'PY'
          import hashlib, json, os, pathlib, uuid
          from tools.smart_note_v2 import resolve_runtime_connections
          capture_path=pathlib.Path("capture-path.txt").read_text().strip()
          registry_path=pathlib.Path(".naya/memory/smart-notes/index.json")
          registry=json.loads(registry_path.read_text()) if registry_path.exists() else {"entries":[]}

          if capture_path:
              capture=json.loads(pathlib.Path(capture_path).read_text())
              distilled=json.dumps(capture["intelligence"],sort_keys=True,separators=(",",":"),ensure_ascii=False)
              digest=hashlib.sha256(distilled.encode()).hexdigest()
              exact=next((e for e in registry.get("entries",[]) if e.get("content_hash")==digest),None)
              resolved_connections=resolve_runtime_connections(capture,registry)
              expected={"capture_path":capture_path,"capture_id":capture["capture_id"],"expected_content":distilled,"content_hash":digest,"resolved_connections":resolved_connections}
              pathlib.Path("smart-note-expected.json").write_text(json.dumps(expected,indent=2,ensure_ascii=False))
              if exact:
                  p=exact["provenance"]
                  ids={
                    "event_id":p["event_id"],
                    "intelligent_block_id":exact["intelligent_block_id"],
                    "lineage_id":p["lineage_id"],
                    "relationship_id":p["relationship_id"],
                    "index_id":p["runtime_index_id"],
                    "checkpoint_id":p["checkpoint_id"],
                    "receipt_id":p["receipt_id"],
                  }
                  pathlib.Path("fresh-lesson-lineage-ids.json").write_text(json.dumps(ids,indent=2))
                  pathlib.Path("reconciliation.json").write_text(json.dumps({
                    "status":"REUSED_EXISTING_CANONICAL_BLOCK",
                    "matched_by":"exact_content_hash",
                    "intelligent_block_id":exact["intelligent_block_id"],
                    "semantic_near_duplicate_policy":"CANDIDATE_REVIEW_REQUIRED"
                  },indent=2))
                  raise SystemExit(0)
              request={
                "mode":"execute","p_authority_grant_id":os.environ["GRANT_ID"],
                "p_event_id":"SMART-NOTE-"+capture["capture_id"],
                "p_title":capture["title"],"p_content":distilled,
                "p_category":capture.get("category","SMART_NOTE"),"p_topic":capture["topic"],
                "p_target_id":"NAYA-NODE-0001","p_project_id":"NayaNET","p_connections":resolved_connections
              }
          else:
              lesson_key="NAYA-FLOW-LESSON-"+uuid.uuid4().hex
              lesson_content="Preserve provenance before applying retained intelligence."
              digest=hashlib.sha256(lesson_content.encode()).hexdigest()
              pathlib.Path("smart-note-expected.json").write_text(json.dumps({
                "capture_path":"",
                "capture_id":None,
                "expected_content":lesson_content,
                "content_hash":digest,
                "resolved_connections":[]
              },indent=2,ensure_ascii=False))
              request={
                "mode":"execute","p_authority_grant_id":os.environ["GRANT_ID"],"p_event_id":lesson_key,
                "p_title":"Naya runtime flow lesson","p_content":lesson_content,
                "p_category":"COLLECTIVE_INTELLIGENCE","p_topic":"RUNTIME_CONTINUITY",
                "p_target_id":"NAYA-NODE-0001","p_project_id":"NayaNET"
              }
          pathlib.Path("lesson-request.json").write_text(json.dumps(request,indent=2,ensure_ascii=False))
          PY

          if [[ -f reconciliation.json ]]; then
            cat reconciliation.json
          else
            curl -fsS -X POST               -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"               -H "Content-Type: application/json"               --data-binary @lesson-request.json "$RUNTIME_FUNCTION" > fresh-lesson-receipt.json
            python - <<'PY'
          import json
          r=json.load(open("fresh-lesson-receipt.json"))
          assert r["ok"] is True, r
          assert r["status"] == "EXECUTED", r
          result=r["result"]
          assert result["ok"] is True, result
          assert result["understanding_state"] == "CANDIDATE", result
          json.dump({k:result[k] for k in ("event_id","intelligent_block_id","lineage_id","relationship_id","index_id","checkpoint_id","receipt_id")},open("fresh-lesson-lineage-ids.json","w"),indent=2)
          PY
          fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: smart-note-lineage
          path: |
            capture-path.txt
            resolved-source-sha.txt
            fresh-lesson-receipt.json
            fresh-lesson-receipt.*.json
            fresh-lesson-lineage-ids.json
            fresh-lesson-lineage-ids.*.json
            smart-note-expected.json
            smart-note-expected.*.json
            reconciliation.json
            reconciliation.*.json
            lesson-request.*.json

  independent-verification:
    needs: fresh-lesson
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: smart-note-lineage

      - name: Mint independent short-lived Naya runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"

      - name: Independently reread persisted canonical lineage
        shell: bash
        run: |
          set -euo pipefail
          capture_count="$(grep -c '[^[:space:]]' capture-path.txt || true)"
          if [[ "$capture_count" -gt 1 ]]; then
            # BATCH MODE: verify each capture's lineage independently, one
            # receipt per capture. Fail-fast is loud per capture; retry
            # converges via reconciliation.
            echo "BATCH: independently verifying $capture_count captures."
            idx=0
            while IFS= read -r capture_path || [[ -n "$capture_path" ]]; do
              [[ -z "${capture_path//[[:space:]]/}" ]] && continue
              echo "BATCH [$idx]: independently verifying $capture_path"
              CAPTURE_IDX="$idx" python - <<'PY'
          import json, os
          sfx="."+os.environ["CAPTURE_IDX"]
          x=json.load(open(f"fresh-lesson-lineage-ids{sfx}.json"))
          json.dump({"mode":"verify",**x},open(f"verify-request{sfx}.json","w"))
          PY
              curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @"verify-request.$idx.json" "$RUNTIME_FUNCTION" > "independent-lineage-verification.$idx.json"
              CAPTURE_IDX="$idx" python - <<'PY'
          import json, os
          sfx="."+os.environ["CAPTURE_IDX"]
          r=json.load(open(f"independent-lineage-verification{sfx}.json"))
          assert r["independent_verification"] is True, r
          checks=r["checks"]
          persisted=r["persisted"]
          receipt_evidence=persisted["receipt"].get("evidence",{})
          object_local_receipt=(
              receipt_evidence.get("event_row_id")==persisted["event"]["id"] and
              receipt_evidence.get("intelligent_block_id")==persisted["block"]["intelligent_block_id"] and
              receipt_evidence.get("lineage_id")==persisted["lineage"]["id"] and
              receipt_evidence.get("relationship_id")==persisted["relationship"]["relationship_id"] and
              receipt_evidence.get("index_id")==persisted["index"]["id"] and
              receipt_evidence.get("checkpoint_id")==persisted["checkpoint"]["id"] and
              persisted["receipt"]["action"]=="intelligence_commit"
          )
          non_checkpoint_checks=[v for k,v in checks.items() if not k.startswith("checkpoint_links_")]
          checkpoint_links=[v for k,v in checks.items() if k.startswith("checkpoint_links_")]
          lineage_valid=all(non_checkpoint_checks) and (all(checkpoint_links) or object_local_receipt)
          assert lineage_valid, {"checks":checks,"object_local_receipt":object_local_receipt}
          checkpoint_provenance="CURRENT_STATE_MATCH" if all(checkpoint_links) else "RECEIPT_OBJECT_LOCAL_SNAPSHOT"
          try: expected=json.load(open(f"smart-note-expected{sfx}.json"))
          except FileNotFoundError: expected=None
          if expected:
              block=r["persisted"]["block"]
              actual=block["content"]["lesson"]
              assert actual==expected["expected_content"]
              assert block["understanding_state"]=="CANDIDATE"
              proof={
                "schema":"NAYA_SMART_NOTE_CAPTURE_PROOF_V2",
                "intelligent_block_id":block["intelligent_block_id"],
                "understanding_state":block["understanding_state"],
                "owner_scope":block["owner_scope"],
                "exact_distilled_payload_match":True,
                "independent_lineage_verification":True,
                "checkpoint_provenance":checkpoint_provenance,
                "mutable_project_checkpoint_may_advance":True,
                "content_hash":expected["content_hash"],
                "privacy_publication_allowed":block["owner_scope"]!="PRIVATE"
              }
              json.dump(proof,open(f"smart-note-capture-proof{sfx}.json","w"),indent=2)
          PY
              idx=$((idx+1))
            done < capture-path.txt
            echo "BATCH: independently verified $idx capture(s)."
          else
          python - <<'PY'
          import json
          x=json.load(open("fresh-lesson-lineage-ids.json"))
          json.dump({"mode":"verify",**x},open("verify-request.json","w"))
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @verify-request.json "$RUNTIME_FUNCTION" > independent-lineage-verification.json
          python - <<'PY'
          import json
          r=json.load(open("independent-lineage-verification.json"))
          assert r["independent_verification"] is True, r
          checks=r["checks"]
          persisted=r["persisted"]
          receipt_evidence=persisted["receipt"].get("evidence",{})
          object_local_receipt=(
              receipt_evidence.get("event_row_id")==persisted["event"]["id"] and
              receipt_evidence.get("intelligent_block_id")==persisted["block"]["intelligent_block_id"] and
              receipt_evidence.get("lineage_id")==persisted["lineage"]["id"] and
              receipt_evidence.get("relationship_id")==persisted["relationship"]["relationship_id"] and
              receipt_evidence.get("index_id")==persisted["index"]["id"] and
              receipt_evidence.get("checkpoint_id")==persisted["checkpoint"]["id"] and
              persisted["receipt"]["action"]=="intelligence_commit"
          )
          non_checkpoint_checks=[v for k,v in checks.items() if not k.startswith("checkpoint_links_")]
          checkpoint_links=[v for k,v in checks.items() if k.startswith("checkpoint_links_")]
          lineage_valid=all(non_checkpoint_checks) and (all(checkpoint_links) or object_local_receipt)
          assert lineage_valid, {"checks":checks,"object_local_receipt":object_local_receipt}
          checkpoint_provenance="CURRENT_STATE_MATCH" if all(checkpoint_links) else "RECEIPT_OBJECT_LOCAL_SNAPSHOT"
          try: expected=json.load(open("smart-note-expected.json"))
          except FileNotFoundError: expected=None
          if expected:
              block=r["persisted"]["block"]
              actual=block["content"]["lesson"]
              assert actual==expected["expected_content"]
              assert block["understanding_state"]=="CANDIDATE"
              proof={
                "schema":"NAYA_SMART_NOTE_CAPTURE_PROOF_V2",
                "intelligent_block_id":block["intelligent_block_id"],
                "understanding_state":block["understanding_state"],
                "owner_scope":block["owner_scope"],
                "exact_distilled_payload_match":True,
                "independent_lineage_verification":True,
                "checkpoint_provenance":checkpoint_provenance,
                "mutable_project_checkpoint_may_advance":True,
                "content_hash":expected["content_hash"],
                "privacy_publication_allowed":block["owner_scope"]!="PRIVATE"
              }
              json.dump(proof,open("smart-note-capture-proof.json","w"),indent=2)
          PY
          fi

      - name: Render verified projection with privacy fail-closed
        shell: bash
        run: |
          set -euo pipefail
          capture_count="$(grep -c '[^[:space:]]' capture-path.txt || true)"
          if [[ "$capture_count" -gt 1 ]]; then
            # BATCH MODE: render one verified projection per capture.
            echo "BATCH: rendering $capture_count verified projections."
            idx=0
            while IFS= read -r capture_path || [[ -n "$capture_path" ]]; do
              [[ -z "${capture_path//[[:space:]]/}" ]] && continue
              echo "BATCH [$idx]: rendering projection for $capture_path"
              python tools/smart_note_v2.py project               --capture "$capture_path"               --verify "independent-lineage-verification.$idx.json"               --private-root "$RUNNER_TEMP/private-smart-notes" > "projection-result.$idx.json"
              CAPTURE_IDX="$idx" python - <<'PY'
          import json, os
          sfx="."+os.environ["CAPTURE_IDX"]
          x=json.load(open(f"projection-result{sfx}.json"))
          e=x["entry"]
          if e.get("projection_status")=="GITHUB_BRAIN_PUBLISHED":
              expected_status="ACTIVE_AUTH_GATED" if e.get("scope")=="PRIVATE" else "ACTIVE"
              assert e["smart_link_status"]==expected_status, (e, expected_status)
              assert e.get("smart_link","").startswith("https://github.com/SoulSchoolAcademy/NayaPOWER/blob/main/BRAIN/05-MEMORY/SMART-NOTES/")
          elif e.get("scope")=="PRIVATE":
              assert e["projection_status"]=="PRIVATE_RENDER_VERIFIED"
              assert e["smart_link_status"]=="PENDING_PRIVATE_PROJECTION"
          PY
              idx=$((idx+1))
            done < capture-path.txt
            echo "BATCH: rendered $idx projection(s)."
          else
          capture_path="$(cat capture-path.txt)"
          if [[ -n "$capture_path" ]]; then
            python tools/smart_note_v2.py project               --capture "$capture_path"               --verify independent-lineage-verification.json               --private-root "$RUNNER_TEMP/private-smart-notes" > projection-result.json
            python - <<'PY'
          import json
          x=json.load(open("projection-result.json"))
          e=x["entry"]
          if e.get("projection_status")=="GITHUB_BRAIN_PUBLISHED":
              expected_status="ACTIVE_AUTH_GATED" if e.get("scope")=="PRIVATE" else "ACTIVE"
              assert e["smart_link_status"]==expected_status, (e, expected_status)
              assert e.get("smart_link","").startswith("https://github.com/SoulSchoolAcademy/NayaPOWER/blob/main/BRAIN/05-MEMORY/SMART-NOTES/")
          elif e.get("scope")=="PRIVATE":
              assert e["projection_status"]=="PRIVATE_RENDER_VERIFIED"
              assert e["smart_link_status"]=="PENDING_PRIVATE_PROJECTION"
          PY
          fi
          fi

      - name: Publish projection only when scope permits
        shell: bash
        run: |
          set -euo pipefail
          capture_count="$(grep -c '[^[:space:]]' capture-path.txt || true)"
          if [[ "$capture_count" -gt 1 ]]; then
            # BATCH MODE: evaluate every projection; publish all publishable
            # ones in a single batch commit. Private ones stay local, loudly.
            echo "BATCH: evaluating $capture_count projections for publication."
            publish_any="no"
            idx=0
            while IFS= read -r capture_path || [[ -n "$capture_path" ]]; do
              [[ -z "${capture_path//[[:space:]]/}" ]] && continue
              CAPTURE_IDX="$idx" python - <<'PY'
          import json, os, pathlib
          sfx="."+os.environ["CAPTURE_IDX"]
          x=json.load(open(f"projection-result{sfx}.json"))
          e=x["entry"]
          pathlib.Path(f"publish-ok{sfx}.txt").write_text("yes" if e.get("smart_link_status") in {"ACTIVE", "ACTIVE_AUTH_GATED", "READY"} else "no")
          PY
              if [[ "$(cat "publish-ok.$idx.txt")" == "yes" ]]; then
                echo "BATCH [$idx]: publishable"
                publish_any="yes"
              else
                echo "BATCH [$idx]: private projection verified locally; public Smart Link intentionally not created."
              fi
              idx=$((idx+1))
            done < capture-path.txt
            if [[ "$publish_any" == "yes" ]]; then
              git config user.name "Naya Smart Note Projector"
              git config user.email "actions@users.noreply.github.com"
              git add BRAIN/05-MEMORY/SMART-NOTES .naya/memory/smart-notes
              if ! git diff --cached --quiet; then
                git commit -m "chore(smart-note): publish verified batch projections [smart-note-projection]"
                git pull --rebase origin main
                git push origin HEAD:main
              fi
            else
              echo "BATCH: all projections private; verified locally, none published."
            fi
          else
          if [[ -f projection-result.json ]]; then
            python - <<'PY'
          import json, pathlib
          x=json.load(open("projection-result.json"))
          e=x["entry"]
          pathlib.Path("publish-ok.txt").write_text("yes" if e.get("smart_link_status") in {"ACTIVE", "ACTIVE_AUTH_GATED", "READY"} else "no")
          PY
            if [[ "$(cat publish-ok.txt)" == "yes" ]]; then
              git config user.name "Naya Smart Note Projector"
              git config user.email "actions@users.noreply.github.com"
              git add BRAIN/05-MEMORY/SMART-NOTES .naya/memory/smart-notes
              if ! git diff --cached --quiet; then
                git commit -m "chore(smart-note): publish verified projection [smart-note-projection]"
                git pull --rebase origin main
                git push origin HEAD:main
              fi
            else
              echo "Private projection verified locally; public Smart Link intentionally not created."
            fi
          fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: smart-note-independent-proof
          path: |
            smart-note-capture-proof.json
