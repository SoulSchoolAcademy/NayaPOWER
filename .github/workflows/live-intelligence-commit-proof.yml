  cold-successor-held-out:
    needs: independent-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Mint genuinely fresh runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"

      - uses: actions/download-artifact@v4
        with:
          name: smart-note-lineage

      - name: Cold retrieve this run's exact Smart Note(s) from machine registry and canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          count="$(cat capture-count.txt)"
          if [[ "$count" -gt 1 ]]; then
            for i in $(seq 0 $((count-1))); do
              IDX="$i" python - <<'PY'
          import json, os
          i=os.environ["IDX"]
          reg=json.load(open(".naya/memory/smart-notes/index.json"))
          capture_path=open("capture-paths.txt").read().splitlines()[int(i)]
          expected=json.load(open(f"smart-note-expected-{i}.json"))
          matches=[e for e in reg["entries"] if e.get("content_hash")==expected["content_hash"]]
          if len(matches)==1:
              e=matches[0]
              p=e["provenance"]
          else:
              # A new Smart Note projection is committed by the prior job *after* SOURCE_SHA.
              # The cold successor intentionally checks out SOURCE_SHA, so its registry may not
              # contain the just-created projection yet. Reconstruct from this run's immutable
              # lineage artifact instead of failing on that expected publication race.
              assert len(matches)==0, matches
              ids=json.load(open(f"fresh-lesson-lineage-ids-{i}.json"))
              e={"intelligent_block_id":ids["intelligent_block_id"]}
              p={
                "event_id":ids["event_id"],
                "lineage_id":ids["lineage_id"],
                "relationship_id":ids["relationship_id"],
                "runtime_index_id":ids["index_id"],
                "checkpoint_id":ids["checkpoint_id"],
                "receipt_id":ids["receipt_id"],
              }
          req={
            "mode":"verify",
            "event_id":p["event_id"],"intelligent_block_id":e["intelligent_block_id"],
            "lineage_id":p["lineage_id"],"relationship_id":p["relationship_id"],
            "index_id":p["runtime_index_id"],"checkpoint_id":p["checkpoint_id"],"receipt_id":p["receipt_id"]
          }
          json.dump(req,open(f"cold-verify-request-{i}.json","w"))
          json.dump({"content_hash":expected["content_hash"],"intelligent_block_id":e["intelligent_block_id"]},open(f"cold-target-{i}.json","w"),indent=2)
          PY
              attempt=1; max_attempts=5; backoff=5
              while [[ $attempt -le $max_attempts ]]; do
                if curl -fsS --connect-timeout 10 --max-time 30 -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @"cold-verify-request-$i.json" "$RUNTIME_FUNCTION" > "cold-runtime-reread-$i.json" 2>"curl-stderr-$i.txt"; then
                  if [[ -s "cold-runtime-reread-$i.json" ]]; then
                    break
                  fi
                  echo "COLD_RUNTIME_ATTEMPT_${attempt}: http ok but empty body"
                else
                  curl_exit=$?
                  echo "COLD_RUNTIME_ATTEMPT_${attempt}: curl exit=${curl_exit} stderr=$(head -c 300 "curl-stderr-$i.txt")"
                fi
                if [[ $attempt -eq $max_attempts ]]; then
                  echo "COLD_RUNTIME_VERIFY_EMPTY_RESPONSE: ${max_attempts} bounded attempts produced no JSON body"
                  exit 1
                fi
                sleep $backoff; backoff=$((backoff * 2)); attempt=$((attempt + 1))
              done
              IDX="$i" python - <<'PY'
          import hashlib, json, os
          i=os.environ["IDX"]
          r=json.load(open(f"cold-runtime-reread-{i}.json"))
          expected=json.load(open(f"smart-note-expected-{i}.json"))
          target=json.load(open(f"cold-target-{i}.json"))
          checks=r["checks"]; persisted=r["persisted"]
          receipt_evidence=persisted["receipt"].get("evidence",{})
          object_local_receipt=(
              receipt_evidence.get("event_row_id")==persisted["event"]["id"] and
              receipt_evidence.get("intelligent_block_id")==persisted["block"]["intelligent_block_id"] and
              receipt_evidence.get("lineage_id")==persisted["lineage"]["id"] and
              receipt_evidence.get("relationship_id")==persisted["relationship"]["relationship_id"] and
              receipt_evidence.get("index_id")==persisted["index"]["id"] and
              receipt_evidence.get("checkpoint_id")==persisted["checkpoint"]["id"] and
