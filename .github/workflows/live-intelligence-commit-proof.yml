          assert block["content"]["lesson"]==expected["expected_content"]
          actual_hash=hashlib.sha256(expected["expected_content"].encode()).hexdigest()
          assert actual_hash==expected["content_hash"]
          intel=json.loads(block["content"]["lesson"])
