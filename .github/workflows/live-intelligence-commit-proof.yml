              capture=json.load(open(capture_path))
              distilled=json.dumps(capture["intelligence"],sort_keys=True,separators=(",",":"),ensure_ascii=False)
              expected={"expected_content":distilled,"content_hash":hashlib.sha256(distilled.encode()).hexdigest()}
          target=json.load(open(f"cold-target{sfx}.json"))
          checks=r["checks"]; persisted=r["persisted"]
          receipt_evidence=persisted["receipt"].get("evidence",{})
          object_local_receipt=(
              receipt_evidence.get("event_row_id")==persisted["event"]["id"] and
