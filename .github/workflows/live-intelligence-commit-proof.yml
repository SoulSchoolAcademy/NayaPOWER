  independent-behavior-verification:
    needs: cold-successor-held-out
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smart-note-cold-successor-proof
      - name: Independently verify cold retrieval and held-out behavioral effect
        shell: bash
        run: |
          set -euo pipefail
          capture_count="$(grep -c '[^[:space:]]' capture-path.txt || true)"
          if [[ "$capture_count" -gt 1 ]]; then
            # BATCH MODE: verify every capture's cold-retrieval and held-out proofs.
