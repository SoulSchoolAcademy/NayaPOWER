          )
          non_checkpoint_checks=[v for k,v in checks.items() if not k.startswith("checkpoint_links_")]
          checkpoint_links=[v for k,v in checks.items() if k.startswith("checkpoint_links_")]
          lineage_valid=all(non_checkpoint_checks) and (all(checkpoint_links) or object_local_receipt)
          assert lineage_valid, {"checks":checks,"object_local_receipt":object_local_receipt}
          checkpoint_provenance="CURRENT_STATE_MATCH" if all(checkpoint_links) else "RECEIPT_OBJECT_LOCAL_SNAPSHOT"
          block=persisted["block"]
          assert block["intelligent_block_id"]==target["intelligent_block_id"], (block["intelligent_block_id"],target)
          assert block["content"]["lesson"]==expected["expected_content"]
          actual_hash=hashlib.sha256(expected["expected_content"].encode()).hexdigest()
          assert actual_hash==expected["content_hash"]
          intel=json.loads(block["content"]["lesson"])
          machine=intel.get("machine_view",{})
          comprehension={
