  cold-successor-held-out:
    needs: independent-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Mint genuinely fresh runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"

      - uses: actions/download-artifact@v4
        with:
          name: smart-note-lineage

      - name: Cold retrieve this run's exact Smart Note from machine registry and canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          capture_count="$(grep -c '[^[:space:]]' capture-path.txt || true)"
          if [[ "$capture_count" -gt 1 ]]; then
            # BATCH MODE: cold-retrieve and held-out-verify every capture.
            echo "BATCH: cold-retrieving $capture_count captures."
            idx=0
            while IFS= read -r capture_path || [[ -n "$capture_path" ]]; do
              [[ -z "${capture_path//[[:space:]]/}" ]] && continue
              echo "BATCH [$idx]: cold-retrieving $capture_path"
              CAPTURE_PATH="$capture_path" CAPTURE_IDX="$idx" python - <<'PY'
          import json, os
          capture_path=os.environ["CAPTURE_PATH"]
          sfx="."+os.environ["CAPTURE_IDX"]
          reg=json.load(open(".naya/memory/smart-notes/index.json"))

          try:
              expected=json.load(open(f"smart-note-expected{sfx}.json"))
          except FileNotFoundError:
              capture=json.load(open(capture_path))
              distilled=json.dumps(capture["intelligence"],sort_keys=True,separators=(",",":"),ensure_ascii=False)
              import hashlib
              expected={"expected_content":distilled,"content_hash":hashlib.sha256(distilled.encode()).hexdigest()}

          matches=[e for e in reg["entries"] if e.get("content_hash")==expected["content_hash"]]
          if len(matches)==1:
              e=matches[0]
              p=e["provenance"]
          else:
              # A new Smart Note projection is committed by the prior job *after* SOURCE_SHA.
              # The cold successor intentionally checks out SOURCE_SHA, so its registry may not
              # contain the just-created projection yet. Reconstruct from this run's immutable
              # lineage artifact instead of failing on that expected publication race.
              assert len(matches)==0, matches
              ids=json.load(open(f"fresh-lesson-lineage-ids{sfx}.json"))
              e={"intelligent_block_id":ids["intelligent_block_id"]}
              p={
                "event_id":ids["event_id"],
                "lineage_id":ids["lineage_id"],
                "relationship_id":ids["relationship_id"],
                "runtime_index_id":ids["index_id"],
                "checkpoint_id":ids["checkpoint_id"],
                "receipt_id":ids["receipt_id"],
              }

          req={
            "mode":"verify",
            "event_id":p["event_id"],"intelligent_block_id":e["intelligent_block_id"],
            "lineage_id":p["lineage_id"],"relationship_id":p["relationship_id"],
            "index_id":p["runtime_index_id"],"checkpoint_id":p["checkpoint_id"],"receipt_id":p["receipt_id"]
          }
          json.dump(req,open(f"cold-verify-request{sfx}.json","w"))
          json.dump({"content_hash":expected["content_hash"],"intelligent_block_id":e["intelligent_block_id"]},open(f"cold-target{sfx}.json","w"),indent=2)
          PY
              for attempt in 1 2 3; do
                if curl -fsS --connect-timeout 10 --max-time 30 -X POST \
                  -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" \
                  -H "Content-Type: application/json" \
