          }
          assert behavior["behavior_changed"] and behavior["change_is_traceable_to_retrieved_intelligence"]
          json.dump(behavior,open(f"held-out-behavior-proof{sfx}.json","w"),indent=2)
          PY
              idx=$((idx+1))
            done < capture-path.txt
            echo "BATCH: cold-retrieved and held-out-verified $idx capture(s)."
