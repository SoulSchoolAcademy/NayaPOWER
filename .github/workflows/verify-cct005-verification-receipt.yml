name: Verify CCT-005 independent verification receipt

on:
  push:
    branches: [main]
    paths:
      - '.naya/runtime/evidence_runtime.py'
      - '.naya/runtime/cct005_note_event_integration.py'
      - '.naya/runtime/cct005_verification_receipt.py'
      - '.naya/contracts/schemas/VERIFICATION-RECEIPT-SCHEMA.json'
      - 'tools/test_cct005_verification_receipt.py'
      - '.github/workflows/verify-cct005-verification-receipt.yml'
  workflow_dispatch:

# Naya checkpoint: execute current CCT-005 verification receipt proof.

permissions:
  contents: read

jobs:
  cct005-verification-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute CCT-005 verification receipt proof
        run: python tools/test_cct005_verification_receipt.py
