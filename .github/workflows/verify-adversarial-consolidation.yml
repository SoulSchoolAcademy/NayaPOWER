name: Adversarial Security Consolidation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: false
        type: string
        default: main
      test_token:
        required: true
        type: string

permissions:
  contents: write

env:
  SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
  FUNCTION_URL: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1

jobs:
