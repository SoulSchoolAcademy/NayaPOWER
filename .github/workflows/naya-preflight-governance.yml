name: Naya Power — Preflight Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight-governance:
    name: Preflight Governance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run structural preflight gate
        run: python3 .naya/runtime/naya_preflight_gate.py
