name: Verify Learning Output Semantic Classification — Read Only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning-output:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      LEARNING_EVIDENCE_ID: a0509374-cff6-4b59-aeb5-f17b68dda033
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @supabase/supabase-js@2.57.4 playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Execute read-only learning-output classification
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const hub=process.env.HUB_URL;
          const evidenceId=process.env.LEARNING_EVIDENCE_ID;
          const token=('learning-output-'+process.env.GITHUB_RUN_ID+'-'+crypto.randomBytes(5).toString('hex')).toLowerCase();
          const trace=[];
          const mark=(step,status,extra={})=>{const x={step,status,at:new Date().toISOString(),...extra};trace.push(x);console.log('LEARNING_OUTPUT_TRACE',JSON.stringify(x));};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({serviceWorkers:'block'});
            const page=await context.newPage();
            try{
              mark('START','PASS',{evidence_id:evidenceId,mode:'READ_ONLY'});
              await page.goto(hub+'/identity.html?name='+encodeURIComponent('Learning Output Classification Proof')+'&alias='+encodeURIComponent(token),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>!!document.querySelector('button'),{timeout:30000});
              const established=await page.evaluate(async({name,alias})=>window.NayaNETNameFirstAuth.establish({name,alias}),{name:'Learning Output Classification Proof',alias:token});
              if(!established?.authenticated||!established?.userId)throw new Error('AUTHENTICATION_FAILED');
              const ownerId=established.userId; mark('IDENTITY','PASS',{owner_id:ownerId});
              await page.goto(hub+'/?learning-output='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:60000});
              const init=await page.evaluate(async()=>window.NayaAssistantRuntime?.init?.());
              if(!init?.authenticated||init.user_id!==ownerId)throw new Error('AUTHORITY_INIT_MISMATCH');
              mark('AUTHORITY','PASS',{owner_id:ownerId});
              const observed=await page.evaluate(async evidenceId=>{
                const c=window.__NayaNETSupabaseClient;
                const [learning,event]=await Promise.all([
                  c.from('learning_evidence').select('*').eq('id',evidenceId).single(),
                  c.from('nayanet_cognition_events').select('*').eq('event_id','smart-mail-proof-bdee9ea5adfc4e0085e7bbecf2e2b342').single()
                ]);
                if(learning.error)throw new Error('LEARNING_READ_FAILED:'+learning.error.message);
                if(event.error)throw new Error('SOURCE_EVENT_READ_FAILED:'+event.error.message);
                const blocks=await c.from('nayanet_intelligent_blocks').select('block_id,owner_id,source_event_ids').eq('owner_id',learning.data.member_id).contains('source_event_ids',[event.data.id]);
                if(blocks.error)throw new Error('BLOCK_READ_FAILED:'+blocks.error.message);
                return {learning:learning.data,event:event.data,blocks:blocks.data||[]};
              },evidenceId);
              const l=observed.learning;
              const transactionSpecific=typeof l.target_id==='string' && l.target_id.startsWith('smart-mail:') && l.provenance==='VERIFICATION' && !!l.observed_value?.message_id && !!l.observed_value?.outcome_id;
              const decision=transactionSpecific?'DECLINE_PROMOTION':'PROMOTION_CANDIDATE';
              const reason=transactionSpecific?'CANONICAL_EVIDENCE_STATE: transaction-specific verified learning evidence belongs in learning_evidence; promoting it to Intelligent Block would duplicate canonical evidence rather than create generalized reusable understanding.':'REQUIRES_DEEPER_SEMANTIC_REVIEW';
              if(decision!=='DECLINE_PROMOTION')throw new Error('UNEXPECTED_CLASSIFICATION:'+decision);
              if(observed.blocks.length!==0)throw new Error('DUPLICATE_BLOCK_ALREADY_PRESENT:'+JSON.stringify(observed.blocks));
              mark('CLASSIFY','PASS',{decision,reason,canonical_home:'learning_evidence',source_event_id:l.source_event_id,block_count:observed.blocks.length});
              const fresh=await context.newPage();
              await fresh.goto(hub+'/?learning-output-fresh='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:60000});
              const freshInit=await fresh.evaluate(async()=>window.NayaAssistantRuntime?.init?.());
              if(!freshInit?.authenticated||freshInit.user_id!==ownerId)throw new Error('FRESH_AUTHORITY_MISMATCH');
              const freshObserved=await fresh.evaluate(async evidenceId=>{
                const c=window.__NayaNETSupabaseClient;
                const learning=(await c.from('learning_evidence').select('*').eq('id',evidenceId).single()).data;
                const event=learning?.source_event_id?(await c.from('nayanet_cognition_events').select('*').eq('event_id',learning.source_event_id).single()).data:null;
                const blocks=event?.id?(await c.from('nayanet_intelligent_blocks').select('block_id,owner_id').eq('owner_id',learning.member_id).contains('source_event_ids',[event.id])).data||[]:[];
                return {learning,event,blocks};
              },evidenceId);
              if(!freshObserved.learning||freshObserved.learning.id!==evidenceId)throw new Error('FRESH_LEARNING_RETRIEVAL_FAILED');
              if(freshObserved.blocks.length!==0)throw new Error('FRESH_DUPLICATE_BLOCK_PRESENT');
              if(freshObserved.learning.member_id!==ownerId)throw new Error('FRESH_OWNER_SCOPE_BREACH');
              mark('FRESH_RETRIEVAL','PASS',{evidence_id:evidenceId,canonical_home:'learning_evidence',block_count:0,owner_id:ownerId});
              fs.writeFileSync('learning-output-classification-proof.json',JSON.stringify({schema:'NAYANET_LEARNING_OUTPUT_CLASSIFICATION_V1',status:'VERIFIED',mode:'READ_ONLY',source_head:process.env.GITHUB_SHA,evidence_id:evidenceId,owner_id:ownerId,decision,reason,canonical_home:'learning_evidence',source_event_id:l.source_event_id,zero_duplicate_block:true,trace},null,2)+'\n');
              await fresh.close();await context.close();await browser.close();
            }catch(error){
              fs.writeFileSync('learning-output-classification-proof.json',JSON.stringify({schema:'NAYANET_LEARNING_OUTPUT_CLASSIFICATION_V1',status:'FAILED',mode:'READ_ONLY',source_head:process.env.GITHUB_SHA,evidence_id:evidenceId,error:String(error?.stack||error),trace},null,2)+'\n');
              throw error;
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-output-classification-proof
          path: learning-output-classification-proof.json
          if-no-files-found: error
