name: TEMP 509 Checkpoint Deployment Proof

on:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  WORKER_NAME: sparkling-shape-7ae5
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b

jobs:
  deploy:
    if: contains(github.event.issue.title, 'TEMP 509 CHECKPOINT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Build exact protected checkpoint release
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          CHECKPOINT=bcadf605ded9dbc95c807b725cd39ce2eb84a3f6
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${CHECKPOINT}/2026%2009%2013%20NayaNET%20HUB%20509%20AAA.html" -o release/public/index.html
          cp NAYANET/509-AAA-REAL-SMART-FEED-NAV-ADJACENT-PLACEMENT.js release/public/naya-509-real-smart-feed-nav-adjacent-placement.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release/public/index.html')
          s=p.read_text()
          tag='<script src="/naya-509-real-smart-feed-nav-adjacent-placement.js"></script>'
          if tag not in s:
            i=s.rfind('</body>')
            if i<0: raise SystemExit('FINAL_BODY_TAG_MISSING')
            s=s[:i]+tag+s[i:]
          p.write_text(s)
          PY
          SOURCE_HASH=$(sha256sum release/public/index.html|cut -d' ' -f1)
          PLACEMENT_HASH=$(sha256sum release/public/naya-509-real-smart-feed-nav-adjacent-placement.js|cut -d' ' -f1)
          echo SOURCE_HASH=$SOURCE_HASH >> "$GITHUB_ENV"
          echo PLACEMENT_HASH=$PLACEMENT_HASH >> "$GITHUB_ENV"
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const r=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Canonical-Source','509-AAA-GITHUB-CHECKPOINT');h.set('X-NayaNET-Source-Commit','bcadf605ded9dbc95c807b725cd39ce2eb84a3f6');h.set('X-NayaNET-Source-SHA256',env.SOURCE_HASH);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_HASH":"$SOURCE_HASH"}}
          EOF
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Verify exact public bytes
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl -fsSL "$RUNTIME/?checkpoint-proof=$i-$(date +%s%N)" -o /tmp/live.html || true
            ACTUAL=$(sha256sum /tmp/live.html 2>/dev/null|cut -d' ' -f1||true)
            echo "INDEX_ATTEMPT=$i ACTUAL=$ACTUAL EXPECTED=$SOURCE_HASH"
            if [ "$ACTUAL" = "$SOURCE_HASH" ]; then break; fi
            sleep 3
          done
          test "$(sha256sum /tmp/live.html|cut -d' ' -f1)" = "$SOURCE_HASH"
          curl -fsSL "$RUNTIME/naya-509-real-smart-feed-nav-adjacent-placement.js?checkpoint-proof=final" -o /tmp/placement.js
          test "$(sha256sum /tmp/placement.js|cut -d' ' -f1)" = "$PLACEMENT_HASH"
          curl -fsSL "$SMART_LINK?checkpoint-proof=final" -o /tmp/smart.html
          echo "CHECKPOINT_RUNTIME=PASS"
          echo "CHECKPOINT_SHA=bcadf605ded9dbc95c807b725cd39ce2eb84a3f6"
          echo "INDEX_SHA=$SOURCE_HASH"
          echo "PLACEMENT_SHA=$PLACEMENT_HASH"
          echo "SMART_FEED_HTTP=200"
