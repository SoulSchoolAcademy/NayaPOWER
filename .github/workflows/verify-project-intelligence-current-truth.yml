name: Verify Project Intelligence Current Truth

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-project-intelligence-current-truth.yml"
      - ".naya/runtime/project_intelligence_reconstruction.py"
      - ".naya/runtime/test_project_intelligence_reconstruction.py"
      - ".naya/memory/events/**"
      - ".naya/control-plane/**"
      - "SUPERBRAIN/AI-BOOT/DISTILL-PROJECT-INTELLIGENCE-CURRENT-TRUTH.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adversarial current-truth proof
        run: python .naya/runtime/test_project_intelligence_reconstruction.py
      - name: Generate full project context
        run: python .naya/runtime/project_intelligence_reconstruction.py --project NayaNET --out project-intelligence-current.json
      - name: Assert reconstruction contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open("project-intelligence-current.json",encoding="utf-8"))
          required={"current","historical","superseded","stale","conflicted","unknown","evidence","causal_lineage","project_state","current_block","next_action"}
          assert required <= p.keys()
          assert p["resolution"]["status"]=="RECONSTRUCTED"
          assert p["resolution"]["law"]
          assert p["next_action"]
          counts=p["counts"]
          assert counts["events"] > 0, "CURRENT_TRUTH_EMPTY: no project intelligence events were reconstructed"
          assert counts["current"] > 0, f"CURRENT_TRUTH_EMPTY: events={counts['events']} current={counts['current']} unknown={counts['unknown']} conflicted={counts['conflicted']} stale={counts['stale']} superseded={counts['superseded']}"
          forbidden_current={"UNKNOWN","STALE","SUPERSEDED","CONFLICTED","BLOCKED"}
          for claim in p["current"]:
              status=str(claim.get("status","UNKNOWN")).upper()
              assert status not in forbidden_current, f"CURRENT_TRUTH_INVALID: current claim {claim.get('event_id')} has status {status}"
              authority=claim.get("authority")
              verification=claim.get("verification") or {}
              evidence=verification.get("evidence") or []
              assert authority, f"CURRENT_TRUTH_UNRESOLVED_AUTHORITY: {claim.get('event_id')}"
              assert evidence, f"CURRENT_TRUTH_UNRESOLVED_EVIDENCE: {claim.get('event_id')}"
          print("CURRENT_TRUTH_GATE=PASS")
          print("FULL_PROJECT_INTELLIGENCE_RECONSTRUCTION=PASS")
          print("CANONICAL_CURRENT_TRUTH_RESOLVER=PASS")
          print("COLD_NAYA_CONTEXT_GENERATED=PASS")
          print("COLD_SUCCESSOR_INPUT=PASS")
          PY
      - name: Publish reconstructed context
        uses: actions/upload-artifact@v4
        with:
          name: project-intelligence-current-truth
          path: project-intelligence-current.json
          retention-days: 14
