name: Human Surface Completeness Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/human-surface-completeness-acceptance.yml'
permissions:
  contents: read
jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: assistant-cloudflare-production
    env:
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run human surface acceptance
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/node_modules
          cat > /tmp/surface.mjs <<'NODE'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          const base=process.env.SUPABASE_URL;
          const runtime=process.env.RUNTIME_URL;
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({serviceWorkers:'block'});const p=await ctx.newPage();
          p.on('pageerror',e=>console.log('BROWSER_PAGEERROR',e?.stack||String(e)));
          p.on('console',m=>{if(['error','warning'].includes(m.type()))console.log('BROWSER_CONSOLE',m.type(),m.text())});
          p.on('response',r=>{if(r.url().includes('name-first-auth-adapter.js'))console.log('ADAPTER_RESPONSE',r.status(),r.headers()['content-type']||'',r.url())});
          const alias=('surface'+process.env.GITHUB_RUN_ID+'-'+crypto.randomUUID().slice(0,6)).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
          await p.goto(runtime+'/identity.html?name='+encodeURIComponent('Naya Surface Audit')+'&alias='+encodeURIComponent(alias),{waitUntil:'networkidle',timeout:60000});
          const adapterProbe=await p.evaluate(async()=>{const s=document.querySelector('script[src*="name-first-auth-adapter.js"]');let fetchProbe=null;try{const r=await fetch(s?.src||'');const t=await r.text();fetchProbe={status:r.status,contentType:r.headers.get('content-type'),hasMarker:t.includes('NayaNET name-first identity adapter'),length:t.length,src:s?.src||null}}catch(e){fetchProbe={error:String(e),src:s?.src||null}}return {globalType:typeof window.NayaNETNameFirstAuth,scriptSrc:s?.src||null,fetchProbe}});
          console.log('NAME_FIRST_RUNTIME_PROBE',JSON.stringify(adapterProbe));
          if(adapterProbe.globalType!=='object')throw Error('FIRST_DIVERGENCE:NAME_FIRST_ADAPTER_GLOBAL_MISSING:'+JSON.stringify(adapterProbe));
          const established=await p.evaluate(async()=>window.NayaNETNameFirstAuth.establish({name:'Naya Surface Audit',alias:location.search.match(/[?&]alias=([^&]+)/)?.[1]||('surface'+Date.now())}));if(!established?.authenticated||!established?.userId)throw Error('FIRST_DIVERGENCE:NAME_FIRST_ESTABLISH_FAILED:'+JSON.stringify(established));
          const checks={};
          await p.goto(runtime+'/feed?naya_release='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1000);
          const feedProbe=await p.evaluate(()=>({url:location.href,title:document.title,shell:document.querySelectorAll('.shell').length,search:document.querySelectorAll('input[aria-label="Search intelligence"]').length,body:document.body.innerText.slice(0,220)}));
          console.log('FEED_RUNTIME_PROBE',JSON.stringify(feedProbe));
          if(feedProbe.title!=='NayaNET — Intelligent Hub V7 · 509 AAA'||!feedProbe.body.includes('Smart Feed'))throw Error('FIRST_DIVERGENCE:SMART_FEED_SURFACE_MISSING:'+JSON.stringify(feedProbe));
          checks.hub='PASS';
          await p.goto(runtime+'/',{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(800); const searchProbe=await p.evaluate(()=>({count:document.querySelectorAll('input[aria-label="Search intelligence"]').length,searchLike:[...document.querySelectorAll('input,button')].map(e=>({tag:e.tagName,aria:e.getAttribute('aria-label'),text:e.innerText})).filter(x=>/search/i.test((x.aria||'')+' '+(x.text||''))).slice(0,20)})); console.log('SEARCH_RUNTIME_PROBE',JSON.stringify(searchProbe)); if(searchProbe.count!==1)throw Error('FIRST_DIVERGENCE:SEARCH_INPUT_MISSING:'+JSON.stringify(searchProbe));
          const search=p.getByLabel('Search intelligence');await search.fill('intelligence');await search.press('Enter');await p.waitForTimeout(1200);
          if(!(await p.locator('.shell').count()))throw Error('SEARCH_SURFACE_DISAPPEARED');
          checks.search='PASS';
          await p.goto(runtime+'/reports',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const reportsProbe=await p.evaluate(()=>({title:document.title,route:location.pathname,h1:[...document.querySelectorAll('h1,h2')].map(x=>x.innerText).filter(Boolean),body:document.body.innerText.slice(0,500)})); console.log('REPORTS_RUNTIME_PROBE',JSON.stringify(reportsProbe)); if(!reportsProbe.h1.some(x=>/reports/i.test(x))&&!reportsProbe.body.includes('Reports'))throw Error('FIRST_DIVERGENCE:REPORTS_SURFACE_FAILED:'+JSON.stringify(reportsProbe));
          checks.reports='PASS';
          await p.goto(runtime+'/',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const settingsNav=p.locator('[data-page="settings"]').first();if(!(await settingsNav.count()))throw Error('FIRST_DIVERGENCE:SETTINGS_NAV_MISSING');
          await settingsNav.click();await p.waitForTimeout(300);
          const settingsPanel=p.locator('#naya-receiver-panel');
          if(!(await settingsPanel.count())||!(await settingsPanel.locator('h2').filter({hasText:'Settings'}).count())||!(await settingsPanel.locator('.naya-receiver-state').count()))throw Error('FIRST_DIVERGENCE:SETTINGS_SURFACE_FAILED');
          checks.settings='PASS';
          await p.goto(runtime+'/dream',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const dreamTitle=await p.locator('h1,h2').allTextContents();
          const dreamRoute=await p.evaluate(()=>location.pathname);if(dreamRoute!=='/dream'||!dreamTitle.some(x=>/dream/i.test(x)))throw Error('FIRST_DIVERGENCE:DREAM_ROUTE_OR_SURFACE_MISSING');
          checks.dream='PASS';
          await p.goto(runtime+'/',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const playNav=p.locator('[data-page="play"]').first();if(!(await playNav.count()))throw Error('FIRST_DIVERGENCE:NAYA_PLAY_NAV_MISSING');
          await playNav.click();await p.waitForTimeout(500);
          const playModal=p.locator('.nc-modal').last();if(!(await playModal.count())||!(await playModal.locator('h2').filter({hasText:'Naya Play'}).count()))throw Error('FIRST_DIVERGENCE:NAYA_PLAY_SURFACE_MISSING');
          checks.naya_play='PASS';
          await p.goto(runtime+'/lists',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(500);
          if(!(await p.locator('[data-surface="lists"]').count())||!(await p.locator('h1').filter({hasText:'Smart Lists'}).count())||!(await p.getByLabel('New Smart List name').count()))throw Error('FIRST_DIVERGENCE:SMART_LISTS_SURFACE_MISSING');
          checks.lists='PASS';
          await p.goto(runtime+'/spaces',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(500);
          if(!(await p.locator('[data-surface="spaces"]').count())||!(await p.locator('h1').filter({hasText:'Smart Spaces'}).count())||!(await p.getByPlaceholder('Name your Space').count()))throw Error('FIRST_DIVERGENCE:SMART_SPACES_SURFACE_MISSING');
          checks.spaces='PASS';
          await p.goto(runtime+'/connections',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(500);
          if(!(await p.locator('[data-surface="connections"]').count())||!(await p.locator('h1').filter({hasText:'Your Connections'}).count()))throw Error('FIRST_DIVERGENCE:CONNECTIONS_SURFACE_MISSING');
          checks.connections='PASS';
          await p.goto(runtime+'/share',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(500);
          if(!(await p.locator('[data-surface="share"]').count())||!(await p.locator('h1').filter({hasText:'Smart Share'}).count())||!(await p.getByLabel('Find intelligence to share').count()))throw Error('FIRST_DIVERGENCE:SMART_SHARE_SURFACE_MISSING');
          checks.share='PASS';
          await p.goto(runtime+'/mail',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(500);
          if(!(await p.locator('.naya-mail-page').count())||!(await p.locator('h1').filter({hasText:'Smart Mail'}).count())||!(await p.getByRole('button',{name:/SEND THROUGH NAYAPOWER/i}).count()))throw Error('FIRST_DIVERGENCE:SMART_MAIL_SURFACE_MISSING');
          checks.mail='PASS';
          console.log(JSON.stringify({status:'VERIFIED',checks}));
          await browser.close();
          NODE
          node /tmp/surface.mjs