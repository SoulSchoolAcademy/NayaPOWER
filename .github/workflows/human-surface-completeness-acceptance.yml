name: Human Surface Completeness Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run human surface acceptance
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/node_modules
          cat > /tmp/surface.mjs <<'NODE'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          const base=process.env.SUPABASE_URL;
          const runtime=process.env.RUNTIME_URL;
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext();const p=await ctx.newPage();
          await p.goto(runtime+'/identity.html',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>!!window.NayaNETNameFirstAuth,{timeout:30000});
          const established=await p.evaluate(async()=>window.NayaNETNameFirstAuth.establish({name:'Surface Audit '+crypto.randomUUID().slice(0,8),alias:'surfaceaudit'+Date.now()}));if(!established?.authenticated||!established?.userId)throw Error('NAME_FIRST_AUTH_FAILED');
          await p.goto(runtime+'/',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>!!window.NayaAssistantRuntime,{timeout:30000});
          const user=established.userId;
          const checks={};
          checks.hub='PASS';
          const title='Surface completeness search '+process.env.GITHUB_RUN_ID, content='Unique searchable intelligence '+crypto.randomUUID();
          const captured=await p.evaluate(async x=>window.NayaAssistantRuntime.captureSmartNote(x),{title,content});const eid=captured?.event_id||captured?.event?.event_id;if(!eid)throw Error('SEARCH_SETUP_CAPTURE_FAILED');
          await p.waitForFunction(async target=>{for(let i=0;i<20;i++){const rows=await window.NayaAssistantRuntime.retrieve(target);if(Array.isArray(rows)&&rows.some(x=>x.event_id===target))return true;await new Promise(r=>setTimeout(r,500));}return false;},eid,{timeout:15000});
          await p.goto(runtime+'/feed',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>!!document.querySelector('[data-shell-owner="AppShellV3"]'),{timeout:30000});await p.waitForTimeout(500);
          const search=p.getByLabel('Search intelligence');await search.fill(title);await search.press('Enter');await p.waitForTimeout(1000);
          if(!(await p.locator('.smart-feed-board[data-event-id="'+eid+'"]').count()))throw Error('SEARCH_EXACT_EVENT_NOT_VISIBLE');
          checks.search='PASS';
          await p.goto(runtime+'/reports',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          if(!(await p.locator('h1').filter({hasText:'Your Reports'}).count()))throw Error('REPORTS_SURFACE_FAILED');
          checks.reports='PASS';
          await p.goto(runtime+'/settings',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(500);
          if(!(await p.locator('.empty-route').count())||!(await p.locator('.empty-route').innerText()).includes('AUTHENTICATED'))throw Error('SETTINGS_SURFACE_FAILED');
          checks.settings='PASS';
          await p.goto(runtime+'/dream',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const dreamTitle=await p.locator('h1,h2').allTextContents();
          if(!(await p.locator('.app').getAttribute('data-route')==='/dream')||!dreamTitle.some(x=>/dream/i.test(x)))throw Error('FIRST_DIVERGENCE:DREAM_ROUTE_OR_SURFACE_MISSING');
          checks.dream='PASS';
          await p.goto(runtime+'/play',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          if(!(await p.locator('h1,h2').allTextContents()).some(x=>/naya play/i.test(x)))throw Error('FIRST_DIVERGENCE:NAYA_PLAY_ROUTE_OR_SURFACE_MISSING');
          checks.naya_play='PASS';
          console.log(JSON.stringify({status:'VERIFIED',checks,event_id:eid}));
          await browser.close();
          NODE
          node /tmp/surface.mjs