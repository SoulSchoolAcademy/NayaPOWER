name: Human Surface Completeness Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/human-surface-completeness-acceptance.yml'
permissions:
  contents: read
jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: assistant-cloudflare-production
    env:
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run human surface acceptance
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/node_modules
          cat > /tmp/surface.mjs <<'NODE'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          const base=process.env.SUPABASE_URL;
          const runtime=process.env.RUNTIME_URL;
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({serviceWorkers:'block'});const p=await ctx.newPage();
          p.on('pageerror',e=>console.log('BROWSER_PAGEERROR',e?.stack||String(e)));
          p.on('console',m=>{if(['error','warning'].includes(m.type()))console.log('BROWSER_CONSOLE',m.type(),m.text())});
          p.on('response',r=>{if(r.url().includes('name-first-auth-adapter.js'))console.log('ADAPTER_RESPONSE',r.status(),r.headers()['content-type']||'',r.url())});
          const alias=('surface'+process.env.GITHUB_RUN_ID+'-'+crypto.randomUUID().slice(0,6)).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
          await p.goto(runtime+'/identity.html?name='+encodeURIComponent('Naya Surface Audit')+'&alias='+encodeURIComponent(alias),{waitUntil:'networkidle',timeout:60000});
          const adapterProbe=await p.evaluate(async()=>{const s=document.querySelector('script[src*="name-first-auth-adapter.js"]');let fetchProbe=null;try{const r=await fetch(s?.src||'');const t=await r.text();fetchProbe={status:r.status,contentType:r.headers.get('content-type'),hasMarker:t.includes('NayaNET name-first identity adapter'),length:t.length,src:s?.src||null}}catch(e){fetchProbe={error:String(e),src:s?.src||null}}return {globalType:typeof window.NayaNETNameFirstAuth,scriptSrc:s?.src||null,fetchProbe}});
          console.log('NAME_FIRST_RUNTIME_PROBE',JSON.stringify(adapterProbe));
          if(adapterProbe.globalType!=='object')throw Error('FIRST_DIVERGENCE:NAME_FIRST_ADAPTER_GLOBAL_MISSING:'+JSON.stringify(adapterProbe));
          const established=await p.evaluate(async()=>window.NayaNETNameFirstAuth.establish({name:'Naya Surface Audit',alias:location.search.match(/[?&]alias=([^&]+)/)?.[1]||('surface'+Date.now())}));if(!established?.authenticated||!established?.userId)throw Error('FIRST_DIVERGENCE:NAME_FIRST_ESTABLISH_FAILED:'+JSON.stringify(established));
          const checks={};
          await p.goto(runtime+'/feed?naya_release='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1000);
          const feedProbe=await p.evaluate(()=>({url:location.href,title:document.title,shell:document.querySelectorAll('.shell').length,search:document.querySelectorAll('input[aria-label="Search intelligence"]').length,body:document.body.innerText.slice(0,220)}));
          console.log('FEED_RUNTIME_PROBE',JSON.stringify(feedProbe));
          await p.goto(runtime+'/',{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(800);
          const shellProbe=await p.evaluate(()=>({
            shellCount:document.querySelectorAll('.shell').length,
            leftRailCount:document.querySelectorAll('.shell > .rail.left').length,
            rightRailCount:document.querySelectorAll('.shell > .rail.right').length,
            visibleLeftRails:[...document.querySelectorAll('.shell > .rail.left')].filter(x=>getComputedStyle(x).display!=='none'&&x.getBoundingClientRect().width>0).length,
            visibleRightRails:[...document.querySelectorAll('.shell > .rail.right')].filter(x=>getComputedStyle(x).display!=='none'&&x.getBoundingClientRect().width>0).length,
            reactShellCount:document.querySelectorAll('[data-shell-owner="AppShellV3"]').length,
            reactMarkerCount:document.querySelectorAll('[data-runtime-marker="NAYANET-HUB-REACT-CANONICAL"]').length,
            commandSurfaceCount:document.querySelectorAll('.naya-cs-btn').length,
            visibleMobileCommandRail:getComputedStyle(document.querySelector('.naya-cs-mobile')||document.body).display
          }));
          console.log('SHELL_OWNERSHIP_PROBE',JSON.stringify(shellProbe));
          if(shellProbe.shellCount!==1)throw Error('FIRST_DIVERGENCE:SHELL_COUNT_NOT_ONE:'+JSON.stringify(shellProbe));
          if(shellProbe.leftRailCount!==1||shellProbe.visibleLeftRails!==1)throw Error('FIRST_DIVERGENCE:LEFT_RAIL_OWNERSHIP_FAILED:'+JSON.stringify(shellProbe));
          if(shellProbe.visibleRightRails!==0)throw Error('FIRST_DIVERGENCE:COMPETING_RIGHT_RAIL_VISIBLE:'+JSON.stringify(shellProbe));
          if(shellProbe.reactShellCount!==0||shellProbe.reactMarkerCount!==0)throw Error('FIRST_DIVERGENCE:REACT_SHELL_COMPETING_WITH_CANONICAL_HUB:'+JSON.stringify(shellProbe));
          if(shellProbe.shellCount!==1||shellProbe.leftRailCount!==1||shellProbe.rightRailCount!==0||shellProbe.reactShellCount!==0||shellProbe.reactMarkerCount!==0)throw Error('FIRST_DIVERGENCE:SHELL_OWNERSHIP:'+JSON.stringify(shellProbe));
          if(shellProbe.visibleMobileCommandRail!=='none')throw Error('FIRST_DIVERGENCE:MOBILE_COMMAND_RAIL_VISIBLE_ON_DESKTOP:'+JSON.stringify(shellProbe));
          if(feedProbe.title!=='NayaNET — Intelligent Hub V7 · 509 AAA'||!feedProbe.body.includes('Smart Feed'))throw Error('FIRST_DIVERGENCE:SMART_FEED_SURFACE_MISSING:'+JSON.stringify(feedProbe));
          checks.hub='PASS';
          await p.goto(runtime+'/',{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(800); const searchProbe=await p.evaluate(()=>({count:document.querySelectorAll('input[aria-label="Search intelligence"]').length,searchLike:[...document.querySelectorAll('input,button')].map(e=>({tag:e.tagName,aria:e.getAttribute('aria-label'),text:e.innerText})).filter(x=>/search/i.test((x.aria||'')+' '+(x.text||''))).slice(0,20)})); console.log('SEARCH_RUNTIME_PROBE',JSON.stringify(searchProbe)); if(searchProbe.count!==1)throw Error('FIRST_DIVERGENCE:SEARCH_INPUT_MISSING:'+JSON.stringify(searchProbe));
          const search=p.getByLabel('Search intelligence');await search.fill('intelligence');await search.press('Enter');await p.waitForTimeout(1200);
          if(!(await p.locator('.shell').count()))throw Error('SEARCH_SURFACE_DISAPPEARED');
          checks.search='PASS';
          await p.goto(runtime+'/reports',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const reportsProbe=await p.evaluate(()=>({title:document.title,route:location.pathname,h1:[...document.querySelectorAll('h1,h2')].map(x=>x.innerText).filter(Boolean),body:document.body.innerText.slice(0,500)})); console.log('REPORTS_RUNTIME_PROBE',JSON.stringify(reportsProbe)); if(!reportsProbe.h1.some(x=>/reports/i.test(x))&&!reportsProbe.body.includes('Reports'))throw Error('FIRST_DIVERGENCE:REPORTS_SURFACE_FAILED:'+JSON.stringify(reportsProbe));
          checks.reports='PASS';
          await p.goto(runtime+'/',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const settingsNav=p.locator('[data-naya-surface="settings"]').first();if(!(await settingsNav.count()))throw Error('FIRST_DIVERGENCE:COMMAND_STATION_SETTINGS_NAV_MISSING');
          await settingsNav.click();await p.waitForTimeout(500);
          const settingsPanel=p.locator('#naya-command-surface');
          if(!(await settingsPanel.count())||!(await settingsPanel.locator('h2').filter({hasText:'Settings'}).count())||!(await settingsPanel.locator('.cs-status').count()))throw Error('FIRST_DIVERGENCE:COMMAND_STATION_SETTINGS_SURFACE_FAILED');
          checks.settings='PASS';
          await p.goto(runtime+'/dream',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const dreamTitle=await p.locator('h1,h2').allTextContents();
          const dreamRoute=await p.evaluate(()=>location.pathname);if(dreamRoute!=='/dream'||!dreamTitle.some(x=>/dream/i.test(x)))throw Error('FIRST_DIVERGENCE:DREAM_ROUTE_OR_SURFACE_MISSING');
          checks.dream='PASS';
          await p.goto(runtime+'/',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(700);
          const playNav=p.locator('[data-naya-surface="play"]').first();if(!(await playNav.count()))throw Error('FIRST_DIVERGENCE:NAYA_PLAY_COMMAND_STATION_NAV_MISSING');
          await playNav.click();await p.waitForTimeout(500);
          const playSurface=p.locator('#naya-command-surface');if(!(await playSurface.count())||!(await playSurface.locator('h2').filter({hasText:'Naya Play'}).count()))throw Error('FIRST_DIVERGENCE:NAYA_PLAY_COMMAND_SURFACE_MISSING');
          checks.naya_play='PASS';
          const listsNav=p.locator('[data-naya-surface="lists"]').first();if(!(await listsNav.count()))throw Error('FIRST_DIVERGENCE:SMART_LISTS_NAV_MISSING');
          await listsNav.click();await p.waitForTimeout(500);
          const listsSurface=p.locator('#naya-command-surface');if(!(await listsSurface.count())||!(await listsSurface.locator('h2').filter({hasText:'Smart Lists'}).count())||!(await listsSurface.locator('.cs-status').count()))throw Error('FIRST_DIVERGENCE:SMART_LISTS_SURFACE_MISSING');
          checks.lists='PASS';
          const spacesNav=p.locator('[data-naya-surface="spaces"]').first();if(!(await spacesNav.count()))throw Error('FIRST_DIVERGENCE:SMART_SPACES_NAV_MISSING');
          await spacesNav.click();await p.waitForTimeout(500);
          const spacesSurface=p.locator('#naya-command-surface');if(!(await spacesSurface.count())||!(await spacesSurface.locator('h2').filter({hasText:'Smart Spaces'}).count())||!(await spacesSurface.locator('.cs-status').count()))throw Error('FIRST_DIVERGENCE:SMART_SPACES_SURFACE_MISSING');
          checks.spaces='PASS';
          const connectionsNav=p.locator('[data-naya-surface="contacts"]').first();if(!(await connectionsNav.count()))throw Error('FIRST_DIVERGENCE:CONTACTS_NAV_MISSING');
          await connectionsNav.click();await p.waitForTimeout(500);
          const connectionsSurface=p.locator('#naya-command-surface');if(!(await connectionsSurface.count())||!(await connectionsSurface.locator('h2').filter({hasText:'Contacts'}).count())||!(await connectionsSurface.locator('.cs-status').count()))throw Error('FIRST_DIVERGENCE:CONTACTS_SURFACE_MISSING');
          checks.connections='PASS';
          const shareNav=p.locator('[data-naya-surface="share"]').first();if(!(await shareNav.count()))throw Error('FIRST_DIVERGENCE:SMART_SHARE_NAV_MISSING');
          await shareNav.click();await p.waitForTimeout(500);
          const shareSurface=p.locator('#naya-command-surface');if(!(await shareSurface.count())||!(await shareSurface.locator('h2').filter({hasText:'Smart Share'}).count())||!(await shareSurface.locator('.cs-status').count()))throw Error('FIRST_DIVERGENCE:SMART_SHARE_SURFACE_MISSING');
          checks.share='PASS';
          const mailNav=p.locator('[data-naya-surface="mail"]').first();if(!(await mailNav.count()))throw Error('FIRST_DIVERGENCE:SMART_MAIL_NAV_MISSING');
          await mailNav.click();await p.waitForTimeout(500);
          const mailSurface=p.locator('#naya-command-surface');if(!(await mailSurface.count())||!(await mailSurface.locator('h2').filter({hasText:'Smart Mail'}).count())||!(await mailSurface.locator('.cs-status').count()))throw Error('FIRST_DIVERGENCE:SMART_MAIL_SURFACE_MISSING');
          checks.mail='PASS';
          console.log(JSON.stringify({status:'VERIFIED',checks}));
          await browser.close();
          NODE
          node /tmp/surface.mjs