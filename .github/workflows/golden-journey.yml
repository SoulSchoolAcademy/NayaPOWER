name: NAYA — Golden Journey Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical Smart Note transaction proof
        run: python scripts/verify-smart-note-transaction.py
      - name: Run golden journey contract
        run: python .naya/tests/test_golden_journey.py
      - name: Run golden journey acceptance
        run: python scripts/verify-golden-journey.py
