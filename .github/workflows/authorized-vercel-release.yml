name: NayaPOWER Authorized Vercel Release

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Exact Vercel target environment
        required: true
        type: choice
        options:
          - preview
          - production
      commit_sha:
        description: Exact 40-character commit SHA to release
        required: true
        type: string
      release_id:
        description: Unique release authorization ID
        required: true
        type: string
      release_reason:
        description: Why this exact commit is being released
        required: true
        type: string
      approval:
        description: Explicit release approval
        required: true
        type: choice
        options:
          - EXPLICIT_APPROVAL_GRANTED
          - DENY

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: team_RQnhoOb3bAXxMlcr67GFTu3Q
  VERCEL_PROJECT_ID: prj_cHa9gwrtscCW8JuMDjcvw6DafaOK
  NAYANET_RUNTIME: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE

concurrency:
  group: naya-power-vercel-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  authorize-and-deploy:
    name: Authorize exact commit and deploy canonical NayaNET runtime
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify exact commit binding
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "${{ inputs.commit_sha }}"
          test "${{ inputs.commit_sha }}" != "REQUIRED_EXACT_COMMIT_SHA"
          echo "EXACT COMMIT VERIFIED: $ACTUAL_SHA"

      - name: Verify canonical NayaNET runtime surface
        shell: bash
        run: |
          set -euo pipefail
          test -f "$NAYANET_RUNTIME/index.html"
          test -f "$NAYANET_RUNTIME/nayanet-10-experience.css"
          test -f "$NAYANET_RUNTIME/nayanet-10.js"
          test -f "$NAYANET_RUNTIME/naya-data.js"
          test -f "$NAYANET_RUNTIME/powercasts.json"
          grep -q 'nayanet-10-experience.css' "$NAYANET_RUNTIME/index.html"
          grep -q 'naya-data.js' "$NAYANET_RUNTIME/index.html"
          grep -q 'nayanet-10.js' "$NAYANET_RUNTIME/index.html"
          grep -q 'INTELLIGENT INTERNET BEGINS HERE' "$NAYANET_RUNTIME/index.html"
          echo "CANONICAL NAYANET RUNTIME SURFACE VERIFIED"

      - name: Run repository verification before authorization
        run: python .naya/runtime/deployment_governance_test.py

      - name: Materialize release authorization for this run
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_REASON: ${{ inputs.release_reason }}
          APPROVAL: ${{ inputs.approval }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          AUTHORIZED_BY: ${{ github.actor }}
          AUTHORIZED_AT: ${{ github.run_started_at }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          authorized_at = datetime.fromisoformat(os.environ["AUTHORIZED_AT"].replace("Z", "+00:00"))
          expires_at = authorized_at + timedelta(hours=1)
          auth = {
              "$schema": "naya/release-authorization/v1",
              "status": "AUTHORIZED",
              "version": "1.0.0",
              "release_id": os.environ["RELEASE_ID"],
              "repository": "SoulSchoolAcademy/NayaPOWER",
              "commit_sha": os.environ["COMMIT_SHA"],
              "target_environment": os.environ["TARGET_ENVIRONMENT"],
              "deployment_surface": "vercel",
              "vercel_project_id": "prj_cHa9gwrtscCW8JuMDjcvw6DafaOK",
              "release_reason": os.environ["RELEASE_REASON"],
              "verification": {
                  "status": "PASS",
                  "evidence": [
                      "exact commit checkout verified",
                      "canonical NayaNET runtime surface verified",
                      "deployment governance regression suite passed"
                  ]
              },
              "authorized_by": os.environ["AUTHORIZED_BY"],
              "authorized_at": authorized_at.isoformat(),
              "expires_at": expires_at.isoformat(),
              "approval": os.environ["APPROVAL"],
          }
          Path("/tmp/RELEASE-AUTHORIZATION.json").write_text(json.dumps(auth, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Enforce canonical governance-kernel release gate
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('gate', Path('.naya/runtime/release_authorization.py'))
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          auth = json.loads(Path('/tmp/RELEASE-AUTHORIZATION.json').read_text(encoding='utf-8'))
          decision = gate.authorize(
              authorization=auth,
              commit_sha=os.environ['COMMIT_SHA'],
              target_environment=os.environ['TARGET_ENVIRONMENT'],
          )
          if not decision.allowed:
              raise SystemExit(f'RELEASE DENIED: {decision.reason}')
          print(f'RELEASE AUTHORIZED: {decision.reason}')
          PY

      - name: Require Vercel credential
        shell: bash
        run: test -n "$VERCEL_TOKEN"

      - name: Bind checkout to the canonical Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NAYANET_RUNTIME/.vercel"
          cat > "$NAYANET_RUNTIME/.vercel/project.json" <<EOF
          {
            "projectId": "$VERCEL_PROJECT_ID",
            "orgId": "$VERCEL_ORG_ID"
          }
          EOF

      - name: Deploy exact verified NayaNET runtime to Vercel
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          cd "$NAYANET_RUNTIME"
          if [ "${{ inputs.target_environment }}" = "production" ]; then
            npx --yes vercel@latest deploy --token "$VERCEL_TOKEN" --yes --prod | tee /tmp/vercel-deploy.log
          else
            npx --yes vercel@latest deploy --token "$VERCEL_TOKEN" --yes | tee /tmp/vercel-deploy.log
          fi
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT URL: $DEPLOYMENT_URL"

      - name: Live verify deployed NayaNET artifact
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.DEPLOYMENT_URL }}
        run: |
          set -euo pipefail
          test "$(curl -L -sS -o /tmp/nayanet-live.html -w '%{http_code}' "$DEPLOYMENT_URL/")" = "200"
          grep -q 'INTELLIGENT INTERNET BEGINS HERE' /tmp/nayanet-live.html
          grep -q 'NayaNET' /tmp/nayanet-live.html
          test "$(curl -L -sS -o /tmp/nayanet-live.js -w '%{http_code}' "$DEPLOYMENT_URL/nayanet-10.js")" = "200"
          test "$(curl -L -sS -o /tmp/nayanet-live.css -w '%{http_code}' "$DEPLOYMENT_URL/nayanet-10-experience.css")" = "200"
          echo "LIVE NAYANET VERIFICATION PASSED: $DEPLOYMENT_URL"
