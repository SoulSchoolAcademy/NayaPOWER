name: Verify Smart Note E2E (Isolated)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smart-note-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check Smart Note runtime
        run: |
          python -m py_compile \
            .naya/runtime/smart_note_transaction.py \
            scripts/build-smart-feed-projection.py \
            scripts/verify-smart-note-transaction.py

      - name: Run isolated Smart Note E2E
        run: python scripts/verify-smart-note-transaction.py
