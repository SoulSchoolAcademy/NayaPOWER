name: Deploy 509 C4 — Real Smart Feed Finalize

# 2026-09-13 canonical redeploy trigger: force the exact current main source state through the verified 509 C4 pipeline.
# No product/UI source change is made by this line; the workflow still checks out github.sha and verifies runtime parity.

on:
  push:
    branches: [main]
    paths:
      - 'SMART FEED CONTENT'
      - '2026 09 13 NayaNET HUB 509 AAA.html'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-DISTILLATION.js'
      - 'NAYANET/509-AAA-SURGICAL-LAYER.js'
      - 'NAYANET/509-AAA-NEXT-LEVEL.js'
      - 'NAYANET/509-AAA-SMART-FEED-C3.js'
      - 'NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js'
      - 'NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js'
      - 'NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js'
      - 'NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-LIFECYCLE-REPAIR.js'
      - '.github/workflows/deploy-509-c4-real-smart-feed-finalize.yml'

permissions:
  contents: read

env:
  SOURCE_FILE: 2026 09 13 NayaNET HUB 509 AAA.html
  SMART_CONTENT_FILE: SMART FEED CONTENT
  REAL_CONTENT_FILE: NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js
  DISTILL_FILE: NAYANET/509-AAA-REAL-SMART-FEED-DISTILLATION.js
  LAYER_FILE: NAYANET/509-AAA-SURGICAL-LAYER.js
  NEXT_LAYER_FILE: NAYANET/509-AAA-NEXT-LEVEL.js
  C3_LAYER_FILE: NAYANET/509-AAA-SMART-FEED-C3.js
  C4_LAYER_FILE: NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js
  UNIFIED_FILE: NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js
  RUNTIME_FILE: NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js
  POLISH_FILE: NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js
  LIFECYCLE_FILE: NAYANET/509-AAA-REAL-SMART-FEED-LIFECYCLE-REPAIR.js
  WORKER_NAME: sparkling-shape-7ae5
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate canonical source and surgical layers
        run: |
          set -euo pipefail
          for f in "$SOURCE_FILE" "$SMART_CONTENT_FILE" "$REAL_CONTENT_FILE" "$DISTILL_FILE" "$LAYER_FILE" "$NEXT_LAYER_FILE" "$C3_LAYER_FILE" "$C4_LAYER_FILE" "$UNIFIED_FILE" "$RUNTIME_FILE" "$POLISH_FILE" "$LIFECYCLE_FILE"; do test -s "$f"; done
          for f in "$REAL_CONTENT_FILE" "$DISTILL_FILE" "$LAYER_FILE" "$NEXT_LAYER_FILE" "$C3_LAYER_FILE" "$C4_LAYER_FILE" "$UNIFIED_FILE" "$RUNTIME_FILE" "$POLISH_FILE" "$LIFECYCLE_FILE"; do node --check "$f"; done
          for marker in 'SMART NOTE 01' 'SMART NOTE 02' 'SMART NOTE 03' 'YOUR INTELLIGENCE TODAY' 'Intelligence Reports turn the intelligence of your life' 'Naya Power #06' '07 — SMART LISTS' '08 — INTELLIGENT FEED / SMART FEED' '09 — SMART TABS'; do grep -Fq "$marker" "$SMART_CONTENT_FILE"; done
          echo SMART_NOTE_COUNT=9

      - name: Generate exact source-derived real content asset
        id: build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          template=Path('NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js').read_text(encoding='utf-8')
          source=Path('SMART FEED CONTENT').read_bytes()
          generated=template.replace('__SMART_FEED_B64__',base64.b64encode(source).decode('ascii'))
          Path('/tmp/naya-509-real-smart-feed-content.js').write_text(generated,encoding='utf-8')
          PY
          node --check /tmp/naya-509-real-smart-feed-content.js
          echo SOURCE_HASH=$(sha256sum "$SOURCE_FILE"|cut -d' ' -f1) >> "$GITHUB_OUTPUT"
          echo SMART_CONTENT_HASH=$(sha256sum "$SMART_CONTENT_FILE"|cut -d' ' -f1) >> "$GITHUB_OUTPUT"
          echo GENERATED_HASH=$(sha256sum /tmp/naya-509-real-smart-feed-content.js|cut -d' ' -f1) >> "$GITHUB_OUTPUT"
          echo DISTILL_HASH=$(sha256sum "$DISTILL_FILE"|cut -d' ' -f1) >> "$GITHUB_OUTPUT"

      - name: Build exact 509 C4 release
        env:
          SOURCE_HASH: ${{ steps.build.outputs.SOURCE_HASH }}
          SMART_CONTENT_HASH: ${{ steps.build.outputs.SMART_CONTENT_HASH }}
          GENERATED_HASH: ${{ steps.build.outputs.GENERATED_HASH }}
          DISTILL_HASH: ${{ steps.build.outputs.DISTILL_HASH }}
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp "$SOURCE_FILE" release/public/index.html
          cp "$LAYER_FILE" release/public/naya-509-aaa.js
          cp "$NEXT_LAYER_FILE" release/public/naya-509-next-level.js
          cp "$C3_LAYER_FILE" release/public/naya-509-smart-feed-c3.js
          cp "$C4_LAYER_FILE" release/public/naya-509-intelligent-board-c4.js
          cp "$UNIFIED_FILE" release/public/naya-509-c4-unified-board-repair.js
          cp "$RUNTIME_FILE" release/public/naya-509-c4-single-board-runtime-repair.js
          cp "$POLISH_FILE" release/public/naya-509-c4-love-like-personal-polish.js
          cp "$LIFECYCLE_FILE" release/public/naya-509-real-smart-feed-lifecycle-repair.js
          cp /tmp/naya-509-real-smart-feed-content.js release/public/naya-509-real-smart-feed-content.js
          cp "$DISTILL_FILE" release/public/naya-509-real-smart-feed-distillation.js
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('release/public/index.html')
          s=p.read_text(encoding='utf-8')
          meta=(f'<meta name="nayanet-canonical-source" content="509-AAA-GITHUB-DRAFT">'
                f'<meta name="nayanet-source-commit" content="{os.environ["GITHUB_SHA"]}">'
                f'<meta name="nayanet-source-sha256" content="{os.environ["SOURCE_HASH"]}">'
                f'<meta name="nayanet-smart-feed-content-sha256" content="{os.environ["SMART_CONTENT_HASH"]}">'
                f'<meta name="nayanet-real-content-generated-sha256" content="{os.environ["GENERATED_HASH"]}">'
                f'<meta name="nayanet-real-content-distillation-sha256" content="{os.environ["DISTILL_HASH"]}">'
                f'<meta name="nayanet-smart-note-count" content="9">')
          scripts=''.join(f'<script src="{x}"></script>' for x in ['/naya-509-real-smart-feed-content.js','/naya-509-aaa.js','/naya-509-next-level.js','/naya-509-smart-feed-c3.js','/naya-509-intelligent-board-c4.js','/naya-509-c4-unified-board-repair.js','/naya-509-c4-single-board-runtime-repair.js','/naya-509-c4-love-like-personal-polish.js','/naya-509-real-smart-feed-distillation.js','/naya-509-real-smart-feed-lifecycle-repair.js'])
          final_boot='<script>window.Naya509RealSmartFeed&&window.Naya509RealSmartFeed.boot&&window.Naya509RealSmartFeed.boot();</script>'
          if '</head>' in s:s=s.replace('</head>',meta+'</head>',1)
          else:s=meta+s
          if '</body>' in s:s=s.replace('</body>',scripts+final_boot+'</body>',1)
          else:s += scripts+final_boot
          p.write_text(s,encoding='utf-8')
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const spa=u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/');const r=spa?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Canonical-Source','509-AAA-GITHUB-DRAFT');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);h.set('X-NayaNET-Source-SHA256',env.SOURCE_HASH);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$GITHUB_SHA","SOURCE_HASH":"$SOURCE_HASH"}}
          EOF

      - name: Verify release script order before deployment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('release/public/index.html').read_text(encoding='utf-8')
          assert s.index('/naya-509-real-smart-feed-content.js') < s.index('/naya-509-aaa.js')
          assert s.index('/naya-509-aaa.js') < s.index('/naya-509-intelligent-board-c4.js')
          assert s.index('/naya-509-intelligent-board-c4.js') < s.index('/naya-509-real-smart-feed-distillation.js')
          assert s.index('/naya-509-real-smart-feed-distillation.js') < s.index('/naya-509-real-smart-feed-lifecycle-repair.js')
          assert s.rfind('/naya-509-real-smart-feed-content.js') > s.index('<body')
          assert 'Naya509RealSmartFeed.boot()' in s
          assert 'nayanet-smart-note-count" content="9"' in s
          print('SCRIPT_ORDER=PASS REAL_CONTENT C4 DISTILL LIFECYCLE FINAL_BOOT_LAST')
          PY

      - name: Deploy exact 509 C4 release
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc

      - name: Verify exact public runtime parity
        env:
          SOURCE_HASH: ${{ steps.build.outputs.SOURCE_HASH }}
          SMART_CONTENT_HASH: ${{ steps.build.outputs.SMART_CONTENT_HASH }}
          GENERATED_HASH: ${{ steps.build.outputs.GENERATED_HASH }}
          DISTILL_HASH: ${{ steps.build.outputs.DISTILL_HASH }}
        run: |
          set -u
          ok=0
          for attempt in $(seq 1 12); do
            rm -f /tmp/runtime.html /tmp/smart.html /tmp/real.js /tmp/distill.js /tmp/lifecycle.js
            r1=$(curl -sS -L -o /tmp/runtime.html -w '%{http_code}' "$RUNTIME/?probe=$attempt&source=$GITHUB_SHA" || true)
            r2=$(curl -sS -L -o /tmp/smart.html -w '%{http_code}' "$SMART_LINK?probe=$attempt&source=$GITHUB_SHA" || true)
            r3=$(curl -sS -L -o /tmp/real.js -w '%{http_code}' "$RUNTIME/naya-509-real-smart-feed-content.js?probe=$attempt" || true)
            r4=$(curl -sS -L -o /tmp/distill.js -w '%{http_code}' "$RUNTIME/naya-509-real-smart-feed-distillation.js?probe=$attempt" || true)
            r5=$(curl -sS -L -o /tmp/lifecycle.js -w '%{http_code}' "$RUNTIME/naya-509-real-smart-feed-lifecycle-repair.js?probe=$attempt" || true)
            commit=$(grep -o 'nayanet-source-commit" content="[^"]*"' /tmp/runtime.html 2>/dev/null|head -1|sed 's/.*content="//;s/"$//' || true)
            source=$(grep -o 'nayanet-source-sha256" content="[^"]*"' /tmp/runtime.html 2>/dev/null|head -1|sed 's/.*content="//;s/"$//' || true)
            content=$(grep -o 'nayanet-smart-feed-content-sha256" content="[^"]*"' /tmp/runtime.html 2>/dev/null|head -1|sed 's/.*content="//;s/"$//' || true)
            generated=$(grep -o 'nayanet-real-content-generated-sha256" content="[^"]*"' /tmp/runtime.html 2>/dev/null|head -1|sed 's/.*content="//;s/"$//' || true)
            distill=$(grep -o 'nayanet-real-content-distillation-sha256" content="[^"]*"' /tmp/runtime.html 2>/dev/null|head -1|sed 's/.*content="//;s/"$//' || true)
            count=$(grep -o 'nayanet-smart-note-count" content="[^"]*"' /tmp/runtime.html 2>/dev/null|head -1|sed 's/.*content="//;s/"$//' || true)
            runtime_generated=$(sha256sum /tmp/real.js 2>/dev/null|cut -d' ' -f1 || true)
            runtime_distill=$(sha256sum /tmp/distill.js 2>/dev/null|cut -d' ' -f1 || true)
            lifecycle_hash=$(sha256sum /tmp/lifecycle.js 2>/dev/null|cut -d' ' -f1 || true)
            echo "ATTEMPT=$attempt HTTP_ROOT=$r1 HTTP_SMART=$r2 HTTP_REAL_JS=$r3 HTTP_DISTILL_JS=$r4 HTTP_LIFECYCLE_JS=$r5 COMMIT=$commit SOURCE=$source CONTENT=$content GENERATED=$generated RUNTIME_GENERATED=$runtime_generated DISTILL=$distill RUNTIME_DISTILL=$runtime_distill COUNT=$count LIFECYCLE_SHA=$lifecycle_hash"
            if [ "$r1" = "200" ] && [ "$r2" = "200" ] && [ "$r3" = "200" ] && [ "$r4" = "200" ] && [ "$r5" = "200" ] && [ "$commit" = "$GITHUB_SHA" ] && [ "$source" = "$SOURCE_HASH" ] && [ "$content" = "$SMART_CONTENT_HASH" ] && [ "$generated" = "$GENERATED_HASH" ] && [ "$runtime_generated" = "$GENERATED_HASH" ] && [ "$distill" = "$DISTILL_HASH" ] && [ "$runtime_distill" = "$DISTILL_HASH" ] && [ "$count" = "9" ]; then
              echo RUNTIME_PARITY=PASS SMART_NOTE_COUNT=9 DISTILLATION=PASS LIFECYCLE_ASSET=PASS
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
