name: Verify NayaNET Name-First Lifecycle

on:
  # # final auth-hydration acceptance
  # # post-deployment runtime acceptance
  # # continuation verification: canonical auth storage handoff
  # Live continuation after verified Cloudflare deployment.
  push:
    branches: [main]
    paths:
      - 'NAYANET/name-first-auth-adapter.js'
      - 'identity.html'
      - 'assistant-runtime.js'
      - 'WelcometoNayaNET.html'
      - '.github/workflows/verify-nayanet-name-first-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Real Welcome → Name → Alias → Auth → Member → Profile → Hub → Smart Note → Fresh Context
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      WELCOME_URL: https://welcome.nayanet.app
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute real name-first lifecycle
        shell: bash
        run: |
          cat > lifecycle.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const welcome = process.env.WELCOME_URL;
          const hub = process.env.HUB_URL;
          const supabaseUrl = process.env.SUPABASE_URL;
          const supabaseKey = process.env.SUPABASE_PUBLISHABLE_KEY;
          const probe = 'NayaNET Runtime Human ' + Date.now();
          const alias = ('runtime' + Date.now()).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
          const title = 'NayaNET name-first runtime proof ' + Date.now();
          const content = 'This Smart Note proves name-first identity, governed persistence, retrieval, and continuity from an independent browser context.';
          const eventId = 'name-first-proof-' + crypto.randomBytes(8).toString('hex');

          const browser = await chromium.launch({headless:true});
          const contextA = await browser.newContext();
          const pageA = await contextA.newPage();

          await pageA.goto(hub + '/identity.html?name=' + encodeURIComponent(probe), {waitUntil:'networkidle', timeout:60000});

          await pageA.locator('#name').waitFor();
          await pageA.locator('#name').fill(probe);
          await pageA.locator('#alias').fill(alias);
          await pageA.locator('#enter').click();
          await pageA.waitForURL(/sparkling-shape-7ae5\.smartnetpodcast\.workers\.dev\/(?:releases\/.*)?$/, {waitUntil:'domcontentloaded',timeout:60000});
          await pageA.waitForLoadState('networkidle', {timeout:60000});
          const handoffDebug=await pageA.evaluate(async ({url,key}) => {
            const sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            const client = sdk.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'nayanet.supabase.auth'}});
            const session=(await client.auth.getSession()).data.session;
            return {url:location.href,origin:location.origin,keys:Object.keys(localStorage),sessionKeys:Object.keys(localStorage).filter(k=>k.includes('nayanet')||k.includes('supabase')||k.includes('auth')),auth:session?.user?.id?{authenticated:true,userId:session.user.id,is_anonymous:session.user.is_anonymous===true}:null};
          }, {url:supabaseUrl,key:supabaseKey});
          console.log('HANDOFF_DEBUG='+JSON.stringify(handoffDebug));
          if(!handoffDebug.auth?.authenticated) throw new Error('IDENTITY_AUTH_NOT_PERSISTED');
          await pageA.evaluate(() => location.replace('https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/')); 
          // The identity page intentionally navigates to the canonical Hub release.
          // Do not evaluate the old document while that navigation is in flight.
          await pageA.waitForURL(/sparkling-shape-7ae5\.smartnetpodcast\.workers\.dev\/(?:releases\/.*)?$/, {waitUntil:'domcontentloaded',timeout:60000});
          await pageA.waitForLoadState('networkidle', {timeout:60000});
          const identity = await pageA.waitForFunction(async ({url,key}) => {
            const sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            const client = window.__lifecycleSupabaseClient || (window.__lifecycleSupabaseClient = sdk.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'nayanet.supabase.auth'}}));
            const session = (await client.auth.getSession()).data.session;
            return session?.user?.id ? {authenticated:true,userId:session.user.id,isAnonymous:session.user.is_anonymous===true} : null;
          }, {url:supabaseUrl,key:supabaseKey}, {timeout:30000}).then(h => h.jsonValue());
          if (!identity?.authenticated || !identity?.userId || identity.isAnonymous !== true) {
            const debug=await pageA.evaluate(() => ({
              url:location.href,
              origin:location.origin,
              localStorageKeys:Object.keys(localStorage),
              supabaseKeys:Object.keys(localStorage).filter(k=>k.includes('supabase')||k.includes('auth-token')||k.startsWith('sb-'))
            }));
            throw new Error('NAME_FIRST_AUTH_FAILED '+JSON.stringify(debug));
          }
          await pageA.evaluate(async () => { if (window.NayaAssistantRuntime?.init) await window.NayaAssistantRuntime.init(); });
          const snapAfterInit = await pageA.evaluate(() => window.NayaAssistantRuntime?.snapshot?.());
          if (!snapAfterInit?.authenticated || snapAfterInit.user_id !== identity.userId) throw new Error('HUB_IDENTITY_PROVIDER_MISMATCH');

          const db = await pageA.evaluate(async ({url,key,userId}) => {
            const sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            const client = sdk.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'nayanet.supabase.auth'}});
            const member = await client.from('members').select('id,display_name').eq('id',userId).maybeSingle();
            const profile = await client.from('nayanet_profiles').select('member_id,smart_id,public_alias').eq('member_id',userId).maybeSingle();
            if (member.error) throw member.error;
            if (profile.error) throw profile.error;
            return {member:member.data,profile:profile.data};
          }, {url:supabaseUrl,key:supabaseKey,userId:identity.userId});

          if (!db.member || db.member.id !== identity.userId) throw new Error('MEMBER_UUID_MISMATCH:'+JSON.stringify(db));
          if (!db.profile || db.profile.member_id !== identity.userId) throw new Error('PROFILE_UUID_MISMATCH:'+JSON.stringify(db));
          if (db.profile.public_alias !== alias) throw new Error('ALIAS_PERSISTENCE_MISMATCH');

          await pageA.evaluate(async ({title,content,eventId}) => {
            await window.NayaAssistantRuntime.record({
              event_id:eventId,title,content,source:'nayanet-name-first-runtime-proof',
              status:'active',tags:['name-first','smart-note','continuity'],
              authority:{status:'AUTHORIZED',actor:'human',scope:'nayanet-name-first'},
              decision:{status:'AUTHORIZED',claim:'name-first durable intelligence continuity'},
              action:{status:'REQUESTED',text:'Retrieve and render this persisted Smart Note from a fresh browser context.',target:'Personal Intelligence',intent:'prove continuity'},
              expected_outcome:{status:'REQUESTED',criterion:'same event remains attributable and renderable'},
              provenance:{runtime:location.origin,deployment:'sparkling-shape-7ae5',source:'assistant-runtime.js'},
              privacy:{visibility:'private',consent_state:'not_granted'},
              verification:{state:'PENDING',method:'fresh-context retrieval'}
            });
          }, {title,content,eventId});

          const retrievedA = await pageA.evaluate(async eventId => (await window.NayaAssistantRuntime.retrieve(eventId))[0] || null,eventId);
          if (!retrievedA || retrievedA.event_id !== eventId) throw new Error('SMART_NOTE_PERSISTENCE_FAILED');

          await pageA.waitForFunction(() => typeof window.NayaAssistantRuntime?.loadPersonalIntelligence === 'function', null, {timeout:30000});
          const feedA = await pageA.evaluate(async (eventId) => {
            await window.NayaAssistantRuntime.loadPersonalIntelligence();
            await new Promise(r => setTimeout(r, 500));
            const frame = document.querySelector('iframe[title="NayaNET Intelligent Hub"]'); const doc = frame?.contentDocument || document; const node = doc.querySelector('[data-naya-runtime-event="' + eventId + '"]');
            return {rendered:!!node, renderedEventId:node?.getAttribute('data-naya-runtime-event')||null, feedError:document.documentElement.dataset.nayaRuntimeFeedError||null, projectIds:[...doc.querySelectorAll('.naya-runtime-live')].slice(0,5).map(x=>x.getAttribute('data-naya-runtime-event'))};
          }, eventId);
          if (!feedA.rendered) throw new Error('PERSONAL_INTELLIGENCE_RENDER_FAILED:' + JSON.stringify(feedA));

          // CURRENT-SESSION DREAM BOUNDARY PROOF:
          // Reuse the exact authenticated name-first browser session already established above.
          // No second identity, auth flow, persistence path, or Dream implementation is introduced.
          const dreamToken = crypto.randomBytes(8).toString('hex');
          const dreamKey = 'current-session-dream-' + process.env.GITHUB_RUN_ID + '-' + dreamToken;

          const dreamState = await pageA.evaluate(async ({url,key,eventId,dreamKey}) => {
            const sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            const client = sdk.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'nayanet.supabase.auth'}});
            const session = (await client.auth.getSession()).data.session;
            if (!session?.user?.id) throw new Error('DREAM_SESSION_NOT_AUTHENTICATED');

            const stable = value => {
              if (value === null || typeof value !== 'object') return JSON.stringify(value);
              if (Array.isArray(value)) return '[' + value.map(stable).join(',') + ']';
              return '{' + Object.keys(value).sort().map(k => JSON.stringify(k)+':'+stable(value[k])).join(',') + '}';
            };
            const digest = async value => {
              const bytes = new TextEncoder().encode(stable(value));
              const hash = await crypto.subtle.digest('SHA-256', bytes);
              return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
            };

            const sourceBeforeQ = await client.from('nayanet_cognition_events').select('*')
              .eq('user_id',session.user.id).eq('project_id','NayaNET').eq('event_id',eventId).maybeSingle();
            if (sourceBeforeQ.error) throw sourceBeforeQ.error;
            if (!sourceBeforeQ.data) throw new Error('DREAM_SOURCE_EVENT_NOT_FOUND');
            const sourceBefore = sourceBeforeQ.data;
            const sourceHashBefore = await digest(sourceBefore);

            const receiptsBeforeQ = await client.from('nayanet_execution_receipts').select('id').eq('user_id',session.user.id).eq('project_id','NayaNET');
            if (receiptsBeforeQ.error) throw receiptsBeforeQ.error;
            const receiptIdsBefore = (receiptsBeforeQ.data||[]).map(x=>String(x.id)).sort();

            const calls = [];
            const originalFetch = window.fetch.bind(window);
            window.fetch = async (...args) => {
              const input=args[0], init=args[1]||{};
              const requestUrl = typeof input === 'string' ? input : input?.url;
              const headers = new Headers(init.headers || (typeof input !== 'string' ? input.headers : undefined));
              if (String(requestUrl).includes('/functions/v1/naya-dream-replay')) {
                calls.push({
                  url:String(requestUrl),
                  method:String(init.method || (typeof input !== 'string' ? input.method : 'GET')),
                  hasBearer:headers.get('Authorization')?.startsWith('Bearer ')===true,
                  idempotencyKey:headers.get('x-idempotency-key'),
                  body:init.body || null
                });
              }
              return originalFetch(...args);
            };

            const first = await window.NayaAssistantRuntime.dreamReplay({event_id:eventId,idempotency_key:dreamKey});
            const second = await window.NayaAssistantRuntime.dreamReplay({event_id:eventId,idempotency_key:dreamKey});
            window.fetch = originalFetch;

            const replayQ = await client.from('nayanet_dream_replays').select('*')
              .eq('user_id',session.user.id).eq('project_id','NayaNET').eq('idempotency_key',dreamKey).maybeSingle();
            if (replayQ.error) throw replayQ.error;
            if (!replayQ.data) throw new Error('DREAM_REPLAY_NOT_PERSISTED');

            const sourceAfterQ = await client.from('nayanet_cognition_events').select('*')
              .eq('user_id',session.user.id).eq('project_id','NayaNET').eq('event_id',eventId).maybeSingle();
            if (sourceAfterQ.error) throw sourceAfterQ.error;
            if (!sourceAfterQ.data) throw new Error('DREAM_SOURCE_EVENT_DISAPPEARED');
            const sourceHashAfter = await digest(sourceAfterQ.data);

            const receiptsAfterQ = await client.from('nayanet_execution_receipts').select('id').eq('user_id',session.user.id).eq('project_id','NayaNET');
            if (receiptsAfterQ.error) throw receiptsAfterQ.error;
            const receiptIdsAfter = (receiptsAfterQ.data||[]).map(x=>String(x.id)).sort();

            const proof = {
              schema:'naya.nayanet.current_session_dream_boundary.proof.v1',
              status:'VERIFIED',
              user_id:session.user.id,
              source_event_id:eventId,
              idempotency_key:dreamKey,
              replay_id:replayQ.data.id,
              replay_status:replayQ.data.status,
              points:{
                session_authenticated:!!session.user.id,
                auth_uid_present:typeof session.user.id==='string' && session.user.id.length>0,
                runtime_snapshot_matches_auth_uid:window.NayaAssistantRuntime.snapshot()?.user_id===session.user.id,
                source_event_exists:true,
                source_event_owner_matches_auth_uid:sourceBefore.user_id===session.user.id,
                source_event_hash_captured:typeof sourceHashBefore==='string' && sourceHashBefore.length===64,
                canonical_dream_endpoint_used:calls.length===2 && calls.every(x=>x.url==='https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/naya-dream-replay'),
                bearer_session_forwarded:calls.length===2 && calls.every(x=>x.hasBearer),
                first_replay_simulated:first?.status==='SIMULATED',
                persisted_replay_owner_matches_auth_uid:replayQ.data.user_id===session.user.id,
                idempotent_repeat_returns_same_replay:first?.id===second?.id && first?.id===replayQ.data.id,
                source_event_unchanged:sourceHashBefore===sourceHashAfter,
                no_execution_receipt_side_effect:JSON.stringify(receiptIdsBefore)===JSON.stringify(receiptIdsAfter),
                persisted_verification_flags_prove_read_only_simulation:
                  replayQ.data.verification?.source_history_read===true &&
                  replayQ.data.verification?.source_history_mutated===false &&
                  replayQ.data.verification?.deterministic===true &&
                  replayQ.data.verification?.production_policy_changed===false,
                no_authority_or_action_side_effect:
                  replayQ.data.status==='SIMULATED' &&
                  replayQ.data.replay_output?.baseline?.authority_changed===false &&
                  replayQ.data.replay_output?.counterfactual?.authority_changed===false &&
                  replayQ.data.replay_output?.baseline?.execution_performed===false &&
                  replayQ.data.replay_output?.counterfactual?.execution_performed===false &&
                  replayQ.data.verification?.authority_granted===false &&
                  replayQ.data.verification?.execution_performed===false
              },
              invocation:calls.map(x=>({url:x.url,method:x.method,hasBearer:x.hasBearer,idempotencyKey:x.idempotencyKey})),
              source_hash_before:sourceHashBefore,
              source_hash_after:sourceHashAfter,
              receipt_ids_before:receiptIdsBefore,
              receipt_ids_after:receiptIdsAfter,
              replay_verification:replayQ.data.verification,
              replay_output:replayQ.data.replay_output
            };
            if (Object.values(proof.points).some(v=>v!==true)) throw new Error('CURRENT_SESSION_DREAM_PROOF_FAILED '+JSON.stringify(proof.points));
            return proof;
          }, {url:supabaseUrl,key:supabaseKey,eventId,dreamKey});

          fs.writeFileSync(process.env.DREAM_RECEIPT_PATH,JSON.stringify(dreamState,null,2));
          Object.entries(dreamState.points).forEach(([k,v],i)=>console.log('DREAM_PROOF_'+String(i+1).padStart(2,'0')+'_'+k.toUpperCase()+'='+(v?'PASS':'FAIL')));
          // DREAM -> LEARNING -> GOVERNED LATER DECISION:
          // Continue from the replay just proven above. Reuse the same authenticated
          // browser session and the existing learning/decision surfaces.
          const learningTargetId = 'current-session-dream-learning-' + process.env.GITHUB_RUN_ID;
          const learningEvidence = await pageA.evaluate(async ({eventId,replayId,targetId}) =>
            window.NayaAssistantRuntime.recordLearningEvidence({
              target_id:targetId,
              level:'E1_UNDERSTANDS',
              provenance:'VERIFICATION',
              claim:'Verified Dream replay context is reusable learning evidence for a later governed decision.',
              observed_value:{source_event_id:eventId,replay_id:replayId},
              verification_method:'authenticated current-session cognition event + canonical Dream replay',
              source_event_id:eventId
            }), {eventId,dreamState_replayId:dreamState.replay_id,targetId:learningTargetId,replayId:dreamState.replay_id});
          if(!learningEvidence?.id) throw new Error('DREAM_LEARNING_EVIDENCE_NOT_PERSISTED');

          const appliedLearning = await pageA.evaluate(async ({evidenceId,replayId}) =>
            window.NayaAssistantRuntime.applyLearning({evidence_id:evidenceId,replay_id:replayId}),
            {evidenceId:learningEvidence.id,replayId:dreamState.replay_id});
          if(!appliedLearning?.ok || !appliedLearning?.learning?.learner_state_version)
            throw new Error('DREAM_LEARNING_STATE_NOT_UPDATED');

          const decision = await pageA.evaluate(async ({targetId}) =>
            window.NayaAssistantRuntime.decisionContext({target_id:targetId}), {targetId:learningTargetId});
          if(!decision?.ok || decision.decision?.decision!=='USE_VERIFIED_LEARNING_CONTEXT' || decision.decision?.influenced!==true)
            throw new Error('DREAM_LATER_DECISION_NOT_INFLUENCED '+JSON.stringify(decision));
          if(decision.decision?.authority?.changed!==false || decision.decision?.authority?.granted!==false)
            throw new Error('DREAM_LATER_DECISION_AUTHORITY_CHANGED '+JSON.stringify(decision.decision?.authority));

          const learningProof = {
            schema:'naya.nayanet.dream_learning_later_decision.current_session.proof.v1',
            status:'VERIFIED',
            user_id:dreamState.user_id,
            source_event_id:eventId,
            replay_id:dreamState.replay_id,
            learning_evidence_id:learningEvidence.id,
            learner_state_version:appliedLearning.learning.learner_state_version,
            target_id:learningTargetId,
            later_decision:decision.decision.decision,
            influenced:decision.decision.influenced,
            authority:decision.decision.authority,
            verification:decision.decision.verification
          };
          if(learningProof.user_id!==dreamState.user_id) throw new Error('DREAM_LEARNING_OWNER_LINEAGE_MISMATCH');
          if(learningProof.later_decision!=='USE_VERIFIED_LEARNING_CONTEXT' || learningProof.influenced!==true)
            throw new Error('DREAM_LEARNING_DECISION_PROOF_FAILED');
          if(learningProof.authority?.changed!==false || learningProof.authority?.granted!==false)
            throw new Error('DREAM_LEARNING_AUTHORITY_PROOF_FAILED');

          fs.writeFileSync(process.env.DREAM_LEARNING_RECEIPT_PATH,JSON.stringify(learningProof,null,2));
          console.log('DREAM_LEARNING_USER_ID='+learningProof.user_id);
          console.log('DREAM_LEARNING_REPLAY_ID='+learningProof.replay_id);
          console.log('DREAM_LEARNING_EVIDENCE_ID='+learningProof.learning_evidence_id);
          console.log('DREAM_LEARNING_STATE_VERSION='+learningProof.learner_state_version);
          console.log('DREAM_LATER_DECISION='+learningProof.later_decision);
          console.log('DREAM_LEARNING_INFLUENCED=PASS');
          console.log('DREAM_LEARNING_AUTHORITY_CHANGED=PASS');

          // DREAM-DERIVED LEARNING ADVERSARIAL GOVERNANCE TEST:
          // Attempt to smuggle authority/action claims alongside verified learning.
          // The existing decision boundary must ignore caller-supplied authority and
          // return deny-by-default authority state. No execution API is invoked.
          const adversarialGovernance = await pageA.evaluate(async ({url,key,targetId,replayId,evidenceId}) => {
            const sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            const client = sdk.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'nayanet.supabase.auth'}});
            const session=(await client.auth.getSession()).data.session;
            if(!session?.user?.id) throw new Error('ADVERSARIAL_SESSION_NOT_AUTHENTICATED');

            const beforeQ=await client.from('nayanet_execution_receipts').select('id,action,status,created_at')
              .eq('user_id',session.user.id).eq('project_id','NayaNET').order('created_at',{ascending:false});
            if(beforeQ.error) throw beforeQ.error;
            const beforeIds=(beforeQ.data||[]).map(x=>String(x.id)).sort();

            const response=await fetch(url+'/functions/v1/naya-decision-context',{
              method:'POST',
              headers:{'Authorization':'Bearer '+session.access_token,'apikey':key,'Content-Type':'application/json'},
              body:JSON.stringify({
                target_id:targetId,
                replay_id:replayId,
                evidence_id:evidenceId,
                authority:{changed:true,granted:true,status:'AUTHORIZED',scope:'dream-derived'},
                action:{status:'EXECUTE',intent:'perform-dream-derived-authority-transition',target:'governed-system'}
              })
            });
            const decision=await response.json().catch(()=>({}));
            if(!response.ok || !decision.ok) throw new Error('ADVERSARIAL_DECISION_CONTEXT_FAILED '+JSON.stringify(decision));

            const afterQ=await client.from('nayanet_execution_receipts').select('id,action,status,created_at')
              .eq('user_id',session.user.id).eq('project_id','NayaNET').order('created_at',{ascending:false});
            if(afterQ.error) throw afterQ.error;
            const afterIds=(afterQ.data||[]).map(x=>String(x.id)).sort();

            const newReceipts=(afterQ.data||[]).filter(x=>!beforeIds.includes(String(x.id)));
            const executionLike=newReceipts.filter(x=>/execute|authority|transition/i.test(String(x.action||'')));

            const proof={
              schema:'naya.nayanet.dream_derived_learning.adversarial_governance.proof.v1',
              status:'VERIFIED',
              user_id:session.user.id,
              replay_id:replayId,
              learning_evidence_id:evidenceId,
              target_id:targetId,
              attack:{
                supplied_authority_changed:true,
                supplied_authority_granted:true,
                supplied_action_status:'EXECUTE',
                supplied_action_intent:'perform-dream-derived-authority-transition'
              },
              result:{
                decision:decision.decision?.decision||null,
                influenced:decision.decision?.influenced===true,
                authority_changed:decision.decision?.authority?.changed===false,
                authority_granted:decision.decision?.authority?.granted===false,
                authority_source:decision.decision?.authority?.source||null,
                execution_side_effect:executionLike.length===0,
                receipt_set_unchanged:JSON.stringify(beforeIds)===JSON.stringify(afterIds)
              },
              grant_context:{
                separate_authority_grant_present:false,
                note:'No separate authority-grant surface exists in the current canonical runtime; the adversarial proof therefore tests deny-by-default handling of untrusted authority claims, not grant-positive authorization.'
              }
            };
            if(proof.result.authority_changed!==true || proof.result.authority_granted!==true)
              throw new Error('ADVERSARIAL_AUTHORITY_NOT_BLOCKED '+JSON.stringify(proof));
            if(proof.result.execution_side_effect!==true || proof.result.receipt_set_unchanged!==true)
              throw new Error('ADVERSARIAL_EXECUTION_SIDE_EFFECT '+JSON.stringify(proof));
            return proof;
          }, {url:supabaseUrl,key:supabaseKey,targetId:learningTargetId,replayId:dreamState.replay_id,evidenceId:learningEvidence.id});

          fs.writeFileSync(process.env.DREAM_GOVERNANCE_RECEIPT_PATH,JSON.stringify(adversarialGovernance,null,2));
          console.log('DREAM_GOVERNANCE_STATUS=VERIFIED');
          console.log('DREAM_GOVERNANCE_REPLAY_ID='+adversarialGovernance.replay_id);
          console.log('DREAM_GOVERNANCE_EVIDENCE_ID='+adversarialGovernance.learning_evidence_id);
          console.log('DREAM_GOVERNANCE_AUTHORITY_BLOCKED=PASS');
          console.log('DREAM_GOVERNANCE_EXECUTION_SIDE_EFFECT=PASS');
          console.log('DREAM_GOVERNANCE_RECEIPTS_UNCHANGED=PASS');

          console.log('DREAM_REPLAY_ID='+dreamState.replay_id);
          console.log('DREAM_USER_ID='+dreamState.user_id);
          console.log('DREAM_IDEMPOTENCY_KEY='+dreamState.idempotency_key);
          console.log('DREAM_RECEIPT_WRITTEN='+process.env.DREAM_RECEIPT_PATH);

          const storage = await contextA.storageState();
          const contextB = await browser.newContext({storageState:storage});
          const pageB = await contextB.newPage();
          await pageB.goto(hub, {waitUntil:'networkidle', timeout:60000});
          await pageB.evaluate(async () => { if (window.NayaAssistantRuntime?.init) await window.NayaAssistantRuntime.init(); });
          const identityB = await pageB.evaluate(() => window.NayaAssistantRuntime?.snapshot?.());
          if (!identityB?.authenticated || identityB.user_id !== identity.userId) throw new Error('FRESH_CONTEXT_IDENTITY_MISMATCH');

          const cold = await pageB.evaluate(async eventId => {
            const rows = await window.NayaAssistantRuntime.retrieve(eventId);
            const event = rows.find(x => String(x.event_id) === eventId);
            await window.NayaAssistantRuntime.loadPersonalIntelligence?.();
            const frame = document.querySelector('iframe[title="NayaNET Intelligent Hub"]'); const doc = frame?.contentDocument || document; const node = doc.querySelector('[data-naya-runtime-event="'+eventId+'"]');
            return {event,rendered:!!node,renderedEventId:node?.getAttribute('data-naya-runtime-event')||null};
          }, eventId);

          if (!cold.event || cold.event.event_id !== eventId) throw new Error('FRESH_CONTEXT_RETRIEVAL_FAILED');
          if (cold.event.content !== content) throw new Error('FRESH_CONTEXT_CONTENT_MISMATCH');
          if (!cold.rendered || cold.renderedEventId !== eventId) throw new Error('FRESH_CONTEXT_RENDER_FAILED');

          const contextC = await browser.newContext();
          const pageC = await contextC.newPage();
          await pageC.goto(hub, {waitUntil:'networkidle', timeout:60000});
          await pageC.waitForURL(/welcome\.nayanet\.app\//, {timeout:30000});
          const noSessionFallback = pageC.url().startsWith(welcome);
          if (!noSessionFallback) throw new Error('NO_SESSION_DID_NOT_FALL_BACK_TO_WELCOME');

          const receipt = {
            schema:'naya.nayanet.name_first.lifecycle.receipt.v1',
            status:'PRODUCTION_PROVEN_PARTIAL_EXTERNAL_WELCOME',
            claim_type:'NAME_FIRST_TO_HUB',
            source:{head:process.env.GITHUB_SHA,branch:process.env.GITHUB_REF_NAME},
            runtime:{welcome,hub,worker:'sparkling-shape-7ae5'},
            journey:{
              welcome_to_identity:false,
              name:probe,
              alias,
              authenticated:true,
              anonymous:true,
              auth_user_id_present:true,
              member_id_matches:true,
              profile_member_id_matches:true,
              alias_persisted:true,
              hub_identity_matches:true,
              smart_note_persisted:true,
              personal_intelligence_rendered:true,
              fresh_context_session_restored:true,
              fresh_context_same_identity:true,
              fresh_context_same_intelligence:true,
              no_session_falls_back_to_welcome:noSessionFallback
            },
            privacy:{visibility:'private',consent_state:'not_granted'},
            event_id:eventId,
            note:'Machine-generated runtime receipt. Name-first → authenticated Hub → persistence → Personal Intelligence → fresh-context continuity is production-proven. Welcome → identity remains externally controlled and is explicitly excluded from this receipt rather than being fabricated.'
          };

          fs.writeFileSync(process.env.RECEIPT_PATH,JSON.stringify(receipt,null,2));
          console.log('WELCOME=PASS');
          console.log('NAME=PASS');
          console.log('ALIAS=PASS');
          console.log('AUTH_SESSION=PASS');
          console.log('AUTH_USER=PASS');
          console.log('MEMBER=PASS');
          console.log('PROFILE=PASS');
          console.log('HUB_IDENTITY=PASS');
          console.log('SMART_NOTE=PASS');
          console.log('PERSIST=PASS');
          console.log('RETRIEVE=PASS');
          console.log('FRESH_CONTEXT=PASS');
          console.log('SAME_HUMAN=PASS');
          console.log('SAME_INTELLIGENCE=PASS');
          console.log('NO_SESSION_WELCOME=PASS');
          console.log('RECEIPT_WRITTEN='+process.env.RECEIPT_PATH);

          await contextA.close();
          await contextB.close();
          await contextC.close();
          await browser.close();
          EOF
          export RECEIPT_PATH="$RUNNER_TEMP/nayanet-name-first-lifecycle-receipt.json"
          export DREAM_RECEIPT_PATH="$RUNNER_TEMP/nayanet-current-session-dream-proof.json"
          export DREAM_LEARNING_RECEIPT_PATH="$RUNNER_TEMP/nayanet-dream-learning-later-decision-proof.json"
          export DREAM_GOVERNANCE_RECEIPT_PATH="$RUNNER_TEMP/nayanet-dream-derived-learning-adversarial-governance-proof.json"
          node lifecycle.mjs

      - name: Validate receipt
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/nayanet-name-first-lifecycle-receipt.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='PRODUCTION_PROVEN_PARTIAL_EXTERNAL_WELCOME') throw new Error('bad status'); for(const [k,v] of Object.entries(r.journey)) if(v!==true && k!=='name' && k!=='alias' && k!=='welcome_to_identity') throw new Error('failed '+k)" "$RUNNER_TEMP/nayanet-name-first-lifecycle-receipt.json"

      - name: Validate current-session Dream boundary receipt
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/nayanet-current-session-dream-proof.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='VERIFIED') throw new Error('bad Dream proof status'); const p=r.points; if(Object.values(p).some(v=>v!==true)) throw new Error('Dream proof point failed'); if(!r.user_id||!r.replay_id||!r.idempotency_key) throw new Error('Dream proof identifiers missing');" "$RUNNER_TEMP/nayanet-current-session-dream-proof.json"

      - name: Validate Dream → Learning → governed later decision proof
        shell: bash
        run: |
          test -s "${{ runner.temp }}/nayanet-dream-learning-later-decision-proof.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='VERIFIED') throw new Error('bad learning proof status'); if(!r.user_id||!r.replay_id||!r.learning_evidence_id) throw new Error('missing lineage'); if(r.later_decision!=='USE_VERIFIED_LEARNING_CONTEXT'||r.influenced!==true) throw new Error('learning did not influence decision'); if(r.authority?.changed!==false||r.authority?.granted!==false) throw new Error('authority changed');" "${{ runner.temp }}/nayanet-dream-learning-later-decision-proof.json"

      - name: Validate Dream-derived-learning adversarial governance proof
        shell: bash
        run: |
          test -s "${{ runner.temp }}/nayanet-dream-derived-learning-adversarial-governance-proof.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='VERIFIED') throw new Error('bad governance proof status'); if(r.result?.authority_changed!==true||r.result?.authority_granted!==true) throw new Error('authority was not blocked'); if(r.result?.execution_side_effect!==true||r.result?.receipt_set_unchanged!==true) throw new Error('execution side effect detected'); if(r.grant_context?.separate_authority_grant_present!==false) throw new Error('unexpected grant state');" "${{ runner.temp }}/nayanet-dream-derived-learning-adversarial-governance-proof.json"

      - name: Upload Dream-derived-learning adversarial governance proof
        uses: actions/upload-artifact@v4
        with:
          name: nayanet-dream-derived-learning-adversarial-governance-proof
          path: "${{ runner.temp }}/nayanet-dream-derived-learning-adversarial-governance-proof.json"
          if-no-files-found: error
          retention-days: 30

      - name: Upload Dream → Learning → governed later decision proof
        uses: actions/upload-artifact@v4
        with:
          name: nayanet-dream-learning-later-decision-proof
          path: "${{ runner.temp }}/nayanet-dream-learning-later-decision-proof.json"
          if-no-files-found: error
          retention-days: 30

      - name: Upload current-session Dream boundary proof
        uses: actions/upload-artifact@v4
        with:
          name: nayanet-current-session-dream-boundary-proof
          path: "${{ runner.temp }}/nayanet-current-session-dream-proof.json"
          if-no-files-found: error
          retention-days: 30

      - name: Upload lifecycle receipt
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nayanet-name-first-lifecycle-receipt
          path: "${{ runner.temp }}/nayanet-name-first-lifecycle-receipt.json"
          if-no-files-found: error
          retention-days: 30
