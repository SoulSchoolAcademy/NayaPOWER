name: 509 — Smart Board Final Canonical Deployment
on:
  push:
    branches: [main]

jobs:
  final:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_NAME: sparkling-shape-7ae5
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6
      - name: Governance authorization
        run: |
          python3 .naya/control-plane/workflow_gate.py --actor SoulSchoolAcademy --purpose "deploy the final canonical 509 Smart Board runtime" --permission deploy_public_runtime --request deploy_nayanet_hub_canonical --mission "restore the approved Smart Board structure and verify the actual public runtime" --uncertainty 3 --consequence 8 --irreversibility 8 --scope "public-runtime:sparkling-shape-7ae5:/" --evidence "final canonical Smart Board renderer" --evidence "browser runtime acceptance" > /tmp/auth.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/auth.json"))["status"])')" = AUTHORIZED
      - name: Build and deploy final renderer
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          cp 'SMART FEED CONTENT' release/public/NAYANET/SMART-FEED-CONTENT.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('release/public/index.html'); h=p.read_text()
          for name in ['509-AAA-SMART-NOTE-CANONICAL-RENDERER.js','509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js']:
              h=re.sub(r'<script[^>]+%s[^>]*></script>'%re.escape(name),'',h,flags=re.I)
          shim='<script>window.$=window.$||((s,r=document)=>r.querySelector(s));window.$$=window.$$||((s,r=document)=>[...r.querySelectorAll(s)]);</script>'
          code=Path('NAYANET/509-AAA-SMART-BOARD-V25-FINAL-CANONICAL-RESTORE.js').read_text().replace('</script>','<\\/script>')
          h=h.replace('<body>','<body>'+shim,1).replace('</body>','<script>'+code+'</script></body>',1)
          p.write_text(h)
          PY
          cat > release/worker.js <<'EOF'
          export default { async fetch(request, env) { const u=new URL(request.url); if(u.pathname==='/NAYANET/SMART-FEED-CONTENT.txt'){const a=await env.ASSETS.fetch(new Request(new URL('/NAYANET/SMART-FEED-CONTENT.txt',request.url),request));if(a.ok)return new Response(a.body,{headers:{'Content-Type':'text/plain; charset=utf-8','Cache-Control':'no-store'}})} const target=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request; const x=await env.ASSETS.fetch(target); const h=new Headers(x.headers); h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0'); h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT); return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h}); } };
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$GITHUB_SHA"}}
          EOF
          npx --yes wrangler@4 deploy --config release/wrangler.jsonc
      - name: Browser runtime acceptance — final ten-board contract
        run: |
          set -euo pipefail
          mkdir -p /tmp/naya-browser && cd /tmp/naya-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const OUTER=['What Is Naya Power?','What Is Naya?','What Are Smart Notes?','Your Intelligence Today','Intelligence Reports','What Is the Intelligent Library?','Smart Lists','Smart Spaces','Smart Mail'];
          const LABELS=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','ADAPTIVE LEARNING','WHAT IT MEANS','HOW TO USE / HOW TO APPLY',"WHAT'S IN IT FOR YOU"];
          const KEYS=['human','child','grandma','naya','machine','learning','meaning','apply','benefit'];
          const COLORS=['#ff3bbf','#9d75ff','#6675ff','#c97a4a','#35d39a','#b8ee57','#f1d75a','#e8c766','#e9edf5'];
          const BAD=['SOURCE SEPARATED','PROVIDENCE','TRUTH','PROTECTION','NINE NOTE'];
          const browser=await chromium.launch();
          for(const [name,width,height] of [['desktop',1440,1400],['tablet',900,1200],['mobile',390,1100]]){
            const page=await browser.newPage({viewport:{width,height}}); const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto(process.env.RUNTIME+'/?final='+name+'_'+Date.now(),{waitUntil:'domcontentloaded'}); await page.waitForTimeout(8000);
            if(errors.length)throw Error(name+': PAGEERROR '+errors.join(' | '));
            const d=await page.evaluate(()=>{const norm=s=>(s||'').replace(/\s+/g,' ').trim(),bs=[...document.querySelectorAll('.block[data-real-smart-note]')];return{bs:bs.map(b=>{const r=b.getBoundingClientRect(),n=b.querySelector('.nutshell');const ls=[...b.querySelectorAll('.layer')].filter(x=>getComputedStyle(x).display!=='none').map(x=>{const r=x.getBoundingClientRect(),i=x.querySelector('.layerIcon')?.getBoundingClientRect(),t=x.querySelector('.layerHead b')?.getBoundingClientRect(),s=x.querySelector('.layerHead .state')?.getBoundingClientRect();return{k:x.dataset.semanticLayer,c:x.dataset.layerColor,l:norm(x.querySelector('.layerHead b')?.textContent),x:r.x,w:r.width,ix:i?.x,tx:t?.x,sx:s?.x,svg:!!x.querySelector('.layerIcon svg'),body:norm(x.querySelector('.layerBody')?.textContent)} });return{title:norm(b.querySelector('h3')?.textContent),x:r.x,w:r.width,y:r.y,n:n?{x:n.getBoundingClientRect().x,w:n.getBoundingClientRect().width,text:norm(n.querySelector('p')?.textContent)}:null,l:ls,a:[...b.querySelectorAll('.naya509-board-actions .action')].map(x=>x.dataset.c4Kind)}}),body:norm(document.body.textContent)}});
            if(JSON.stringify(d.bs.map(x=>x.title))!==JSON.stringify(OUTER))throw Error(name+': OUTER_TITLES');
            if(d.bs.some(x=>!x.n||!x.n.text||x.n.text.length>900))throw Error(name+': NUTSHELL_NOT_CONCISE');
            if(d.bs.some(x=>x.l.length!==9))throw Error(name+': SEMANTIC_COUNT');
            if(d.bs.some(x=>JSON.stringify(x.l.map(y=>y.k))!==JSON.stringify(KEYS)))throw Error(name+': SEMANTIC_ORDER');
            if(d.bs.some(x=>JSON.stringify(x.l.map(y=>y.l))!==JSON.stringify(LABELS)))throw Error(name+': LABELS');
            if(d.bs.some(x=>JSON.stringify(x.l.map(y=>y.c))!==JSON.stringify(COLORS)))throw Error(name+': COLORS');
            if(d.bs.some(x=>x.l.some(y=>!y.svg||!(y.ix<y.tx)||y.sx==null||y.sx<=y.tx)))throw Error(name+': THREE_ZONE_GEOMETRY');
            const ws=d.bs.map(x=>Math.round(x.w)),xs=d.bs.map(x=>Math.round(x.x)); if(new Set(ws).size!==1||new Set(xs).size!==1)throw Error(name+': WIDTH_CONGRUENCE');
            if(d.bs.some(x=>Math.round(x.n.x)!==Math.round(x.x)||Math.round(x.n.w)!==Math.round(x.w)))throw Error(name+': NUTSHELL_WIDTH');
            if(d.bs.some((x,i)=>i&&x.y<=d.bs[i-1].y))throw Error(name+': NOT_VERTICAL');
            if(d.bs.some(x=>x.a.join(',')!=='create-space,favorite,save'))throw Error(name+': GLOBAL_CONTROLS');
            for(const b of BAD)if(d.body.toUpperCase().includes(b))throw Error(name+': FORBIDDEN_UI '+b);
            const bottom=d.bs[0].l.slice(-3).map(x=>x.l); if(JSON.stringify(bottom)!==JSON.stringify(['WHAT IT MEANS','HOW TO USE / HOW TO APPLY',"WHAT'S IN IT FOR YOU"]))throw Error(name+': BOTTOM_ORDER');
            if(d.bs.some(x=>x.l.some(y=>/^\d+\s+/.test(y.l))))throw Error(name+': DISPLAYED_PREFIX');
            await page.reload({waitUntil:'domcontentloaded'}); await page.waitForTimeout(8000);
            const refreshed=await page.evaluate(()=>[...document.querySelectorAll('.block[data-real-smart-note]')].map(b=>[...b.querySelectorAll('.layer')].filter(x=>getComputedStyle(x).display!=='none').map(x=>x.dataset.semanticLayer))); if(refreshed.some(x=>JSON.stringify(x)!==JSON.stringify(KEYS)))throw Error(name+': REFRESH_STRUCTURE');
            console.log(name+': PASS'); await page.close();
          }
          await browser.close(); console.log('BROWSER_RUNTIME_VERIFICATION=PASS');
          EOF
          RUNTIME="$RUNTIME" node verify.mjs
