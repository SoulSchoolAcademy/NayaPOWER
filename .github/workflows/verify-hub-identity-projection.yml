name: Verify Hub Identity Projection

on:
  push:
    branches: [main]
    paths:
      - '.naya/contracts/HUB-IDENTITY-PROJECTION-V1.json'
      - '.naya/control-plane/HUB-IDENTITY-PROJECTION-RECEIPT.json'
      - '.naya/control-plane/STATE.json'
      - '.naya/control-plane/MAP.json'
      - '.naya/control-plane/BATON.json'
      - '.naya/TEAM-NAYA/00-NAYANET-HUB-NORTH-STAR-MISSION-LOCK.md'
      - '.naya/runtime/hub_identity_projection.py'
      - '.naya/runtime/baton.py'
      - 'scripts/validate-control-plane-freshness.py'
      - 'tests/test_hub_identity_projection.py'
      - '.github/workflows/verify-hub-identity-projection.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Hub identity and control-plane regression tests
        run: python -m unittest tests/test_hub_identity_projection.py tests/test_control_plane_freshness.py -v
      - name: Resolve authority and validate committed projections
        run: python .naya/runtime/hub_identity_projection.py check --source-ref origin/main
      - name: Run full control-plane freshness audit
        run: python scripts/validate-control-plane-freshness.py
      - name: Upload projection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-identity-projection-receipt
          path: .naya/control-plane/HUB-IDENTITY-PROJECTION-RECEIPT.json
          if-no-files-found: error
