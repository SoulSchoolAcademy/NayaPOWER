name: Wave A Smart Mail resume acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
      NAYA_EXISTING_SPACE_ID: 04ee4dc8-bc73-47df-a1de-162570f6a56e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Smart Mail resume
        run: node .github/workflows/scripts/wave-a-smart-mail-resume.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wave-a-smart-mail-resume
          path: ${{ runner.temp }}/wave-a-smart-mail-resume.json
          if-no-files-found: error