name: Trigger Canonical NayaNET Hub Deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nayanet-canonical-live-hub-trigger
  cancel-in-progress: false
jobs:
  deploy:
    uses: ./.github/workflows/deploy-nayanet-hub-canonical.yml
    secrets: inherit
