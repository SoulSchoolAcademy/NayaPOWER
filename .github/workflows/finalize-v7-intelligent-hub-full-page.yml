name: Finalize V7 Intelligent Hub — Full Page Feed

on:
  workflow_run:
    workflows: ["Deploy V7 Intelligent Hub"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: nayanet-v7-full-page-finalizer
  cancel-in-progress: true

env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build final full-page artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          hub=Path('2026 09 07  1:14 NAYANETHUBONE.html')
          out=hub.read_text()
          if '</body>' not in out:
              raise SystemExit('Missing </body> boundary')

          # Server-side removal: the legacy activation/right rail must not ship in the final artifact.
          out=re.sub(r'<aside\s+class=["\']activationRail["\'][\s\S]*?</aside>', '', out, flags=re.I)

          # Final presentation authority runs AFTER every legacy/V16 layer and keeps the feed full-page.
          final=r'''<style id="nayanet-final-full-page-authority">
          html,body{background:#000!important}
          .homeWorkspace{display:block!important;grid-template-columns:1fr!important;width:100%!important;max-width:none!important;gap:0!important}
          .homeFeed{width:100%!important;max-width:none!important;min-width:0!important}
          .activationRail{display:none!important;width:0!important;min-width:0!important;max-width:0!important;height:0!important;overflow:hidden!important;visibility:hidden!important;pointer-events:none!important}
          #nayanet-elite-feed{width:100%!important;max-width:none!important}
          @media(max-width:900px){.sidebar{display:none!important}.app{display:block!important;grid-template-columns:1fr!important}.main{width:100%!important;padding-left:12px!important;padding-right:12px!important}.homeWorkspace{display:block!important;grid-template-columns:1fr!important}}
          </style>
          <script>
          (()=>{
            'use strict';
            const kill=()=>{
              document.querySelectorAll('.activationRail').forEach(el=>el.remove());
              document.querySelectorAll('.homeWorkspace').forEach(el=>{
                el.style.setProperty('display','block','important');
                el.style.setProperty('grid-template-columns','1fr','important');
                el.style.setProperty('gap','0','important');
                el.style.setProperty('width','100%','important');
              });
              document.querySelectorAll('.homeFeed').forEach(el=>el.style.setProperty('width','100%','important'));
            };
            const boot=()=>{kill();new MutationObserver(kill).observe(document.body,{childList:true,subtree:true});setTimeout(kill,100);setTimeout(kill,500);setTimeout(kill,1500);setTimeout(kill,3000);};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
          })();
          </script>'''
          out=out.replace('</body>',final+'\n</body>',1)

          d=Path('CLOUDFLARE-INTELLIGENT-HUB-V7'); d.mkdir(exist_ok=True)
          Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html').write_text(out)
          a=d/'assets'; a.mkdir(exist_ok=True)
          (a/'index.html').write_text(out)
          (a/'_redirects').write_text('/index.html 200\n')

          if 'class="activationRail"' in out or "class='activationRail'" in out:
              raise SystemExit('FINAL ARTIFACT STILL CONTAINS LEGACY ACTIVATION RAIL')
          if 'homeWorkspace{display:block!important' not in out:
              raise SystemExit('FINAL FULL-PAGE AUTHORITY MISSING')
          print('LEGACY_RIGHT_RAIL=REMOVED_FROM_ARTIFACT')
          print('FULL_PAGE_FEED_AUTHORITY=PASS')
          print('FINAL_ARTIFACT_BYTES=',len(out.encode('utf-8')))
          PY

      - name: Deploy final exact artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Verify exact public runtime
        shell: bash
        run: |
          set -euo pipefail
          q="final=${{ github.event.workflow_run.head_sha }}"
          curl -fsSL --retry 5 --retry-delay 3 "$RUNTIME/?$q" -o /tmp/root
          curl -fsSL --retry 5 --retry-delay 3 "$SMART_LINK?$q" -o /tmp/smart
          python3 - <<'PY'
          from pathlib import Path
          for name in ('/tmp/root','/tmp/smart'):
              text=Path(name).read_text()
              required=['COLLECTIVE INTELLIGENCE','PERSONAL INTELLIGENCE','ACTIVITY','HOW NAYANET','IN A NUTSHELL','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','WHAT WE LEARNED · WHAT IT MEANS','homeWorkspace{display:block!important','activationRail']
              missing=[x for x in required if x not in text]
              if missing: raise SystemExit(f'{name} missing runtime markers: {missing}')
              if 'class="activationRail"' in text or "class='activationRail'" in text: raise SystemExit(f'{name} still contains a shipped activation rail')
          print('PUBLIC_RUNTIME_ROOT=PASS')
          print('PUBLIC_SMART_LINK=PASS')
          print('RIGHT_SIDEBAR=REMOVED')
          print('FULL_SCREEN_FEED=PASS')
          PY
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"