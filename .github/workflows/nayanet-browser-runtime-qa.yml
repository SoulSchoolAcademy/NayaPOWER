name: NayaNET Browser Runtime QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Assert canonical browser QA ownership
        run: |
          echo 'LEGACY_E02_BROWSER_QA=RETIRED'
          echo 'CURRENT_HUB_SOURCE=NAYANET/HUB'
          echo 'CURRENT_RUNTIME_QA=GOVERNED_CANONICAL_RUNTIME'
          echo 'RULE=ONE_CURRENT_NAYANET_BROWSER_QA_AUTHORITY'
