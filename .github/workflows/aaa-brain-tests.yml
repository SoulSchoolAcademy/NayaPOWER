name: NayaPOWER Brain Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run brain and kernel tests
        run: python -m pytest -q tests/test_live_brain.py tests/test_brain_registry.py tests/test_value_calculus.py
