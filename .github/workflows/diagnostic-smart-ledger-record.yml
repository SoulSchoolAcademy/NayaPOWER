name: Diagnostic Smart Ledger record boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace deployed Ledger record boundary
        shell: bash
        env:
          NAYA_RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          cat > ledger-trace.mjs <<'EOF'
          import { chromium } from 'playwright';
          const runtime = process.env.NAYA_RUNTIME_URL;
          const browser = await chromium.launch({headless:true, args:['--no-sandbox','--disable-dev-shm-usage']});
          const context = await browser.newContext();
          const page = await context.newPage();
          page.on('console', m => { const text=m.text(); if(text.includes('NAYA_RECORD_TRACE')) console.log('LEDGER_TRACE_CONSOLE',text); });
          page.on('request', r => { if(r.url().includes('nayanet_record_cognition_event')) console.log('LEDGER_TRACE_REQUEST',r.method(),r.url(),r.postData()||''); });
          page.on('response', async r => { if(r.url().includes('nayanet_record_cognition_event')) console.log('LEDGER_TRACE_RESPONSE',r.status(),r.url(),(await r.text().catch(()=>'')).slice(0,2000)); });
          await page.goto(runtime+'/identity.html?name=Naya%20Ledger%20Trace&alias=ledgertrace'+Date.now(),{waitUntil:'networkidle',timeout:60000});
          await page.getByRole('button',{name:'ENTER NAYANET'}).click(); await page.waitForTimeout(1200);
          await page.goto(runtime+'/?ledger_trace='+Date.now(),{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(900);
          const nav=page.getByRole('button',{name:'Smart Ledger',exact:true}).first(); await nav.scrollIntoViewIfNeeded(); await nav.click(); await page.waitForTimeout(600);
          const card=page.locator('.feature-card').first(); await card.getByRole('button',{name:/Inspect evidence/i}).click();
          const modal=page.getByRole('dialog').last(); await modal.waitFor({state:'visible'}); await modal.getByRole('button',{name:/Inspect evidence/i}).click();
          console.log('LEDGER_TRACE_CLICK_RETURNED'); await page.waitForTimeout(9000);
          console.log('LEDGER_TRACE_FINAL_DOM',JSON.stringify({dialogs:await page.getByRole('dialog').count(),buttons:await page.locator('button').allTextContents()}));
          await browser.close();
          EOF
          node ledger-trace.mjs
