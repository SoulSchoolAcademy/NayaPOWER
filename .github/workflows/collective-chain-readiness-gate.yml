name: Collective Chain Readiness Gate

# The Collective Intelligence Chain is the acceptance test for NayaPOWER. Until this
# gate ran in CI it was a script nobody executed, which is how the 2026-09-26 reset
# could delete all 88 migrations, the canonical receiver and the machine contract and
# leave 8 of 11 links reporting BLOCKED_NO_RUNTIME for two days without detection.
#
# This workflow makes the instrument mandatory WITHOUT making the chain pass.
#
# Enforcement rule: this build fails on REGRESSION, not on incompleteness.
# The chain is 2/11 today. A gate that is red forever blocks every merge and is
# therefore ignored, which is the same failure mode as no gate at all. So the gate
# measures, records durable evidence, and fails ONLY if the measured number drops
# below the committed baseline in BRAIN/12-ENGINEERING/CHAIN-READINESS-BASELINE.json.
# Closing the remaining 9 links raises the baseline; it never fakes one.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  chain-readiness-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gate dependencies
        run: python -m pip install --quiet jsonschema

      # Controls run FIRST. A gate that can only ever report one answer is worthless,
      # so we prove the gate still discriminates BEFORE trusting any verdict from it.
      - name: Prove the gate still discriminates (controls)
        run: python BRAIN/12-ENGINEERING/verify-collective-chain-readiness-controls.py

      - name: Measure collective intelligence chain readiness
        id: measure
        run: |
          set +e
          python BRAIN/12-ENGINEERING/verify-collective-chain-readiness.py \
            | tee chain-readiness-report.txt
          status=${PIPESTATUS[0]}
          set -e
          satisfied=$(grep -oE '[0-9]+/11 links SATISFIED' chain-readiness-report.txt \
            | grep -oE '^[0-9]+' || echo 0)
          echo "satisfied=$satisfied" >> "$GITHUB_OUTPUT"
          echo "gate_exit=$status" >> "$GITHUB_OUTPUT"
          echo "Measured $satisfied/11 chain links SATISFIED (gate exit $status)."

      # Evidence is published as a workflow artifact, not committed by a bot.
      # github-actions[bot] has no push permission on this repository, and granting
      # it is a human authority decision, not a workflow's to make. A failing
      # auto-commit step would also mask the real verdict behind a permissions error.
      - name: Publish measured readiness as durable evidence
        if: always()
        run: |
          {
            echo '### Collective Intelligence Chain - measured readiness'
            echo ''
            echo '```'
            cat chain-readiness-report.txt 2>/dev/null || echo 'no report captured'
            echo '```'
            echo ''
            echo "HEAD \`$GITHUB_SHA\` | measured ${{ steps.measure.outputs.satisfied }}/11 SATISFIED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-readiness-${{ github.sha }}
          path: chain-readiness-report.txt
          if-no-files-found: error

      # The only step allowed to turn the build red.
      - name: Enforce no regression against committed baseline
        run: |
          python - <<'PY'
          import json, os, sys, pathlib
          base_file = pathlib.Path('BRAIN/12-ENGINEERING/CHAIN-READINESS-BASELINE.json')
          base = json.loads(base_file.read_text(encoding='utf-8')) if base_file.is_file() else None
          measured = int(os.environ['MEASURED'])
          if base is None:
              print(f'No baseline recorded. First measurement: {measured}/11. Recording as baseline.')
              sys.exit(0)
          floor = int(base['satisfied_links_floor'])
          print(f'baseline floor={floor}/11   measured={measured}/11')
          if measured < floor:
              print(f'REGRESSION: chain readiness fell below the committed floor of {floor}/11.')
              sys.exit(1)
          if measured > floor:
              print(f'IMPROVEMENT: {measured}/11 exceeds floor {floor}/11. '
                    f'Record the new floor deliberately; do not let it drift silently.')
          print('No regression. The chain is not required to be complete for this build to pass.')
          PY
        env:
          MEASURED: ${{ steps.measure.outputs.satisfied }}

      # --- Brain schema migration coherence -----------------------------------
      # PR #881 recovered 88 migrations the 2026-09-26 reset had deleted. Recovering a
      # file is not proving it is sound. This gate asks whether those migrations can
      # rebuild the brain schema from empty. They cannot: 11 core tables, including the
      # canonical event store and the Intelligent Block identity table, are created by
      # no migration at all. Same discipline as above -- fail on regression, not on the
      # known defect, so the count can never silently grow.
      - name: Prove the migration gate discriminates (controls)
        run: python BRAIN/12-ENGINEERING/verify-migration-coherence-controls.py

      - name: Measure brain schema migration coherence
        id: coherence
        run: |
          set +e
          python BRAIN/12-ENGINEERING/verify-migration-coherence.py | tee migration-coherence.txt
          set -e
          # Sum the per-class counts in the SUMMARY line. Done in python rather than
          # with bc/paste so the gate adds no shell dependency to the runner.
          defects=$(python - <<'PY'
          import re, sys
          try:
              line = next(l for l in open('migration-coherence.txt', encoding='utf-8')
                          if l.startswith('  SUMMARY:'))
          except StopIteration:
              print(0); raise SystemExit
          print(sum(int(n) for n in re.findall(r'=(\d+)', line)))
          PY
          )
          echo "defects=${defects:-0}" >> "$GITHUB_OUTPUT"
          echo "Measured $defects migration coherence defect(s)."

      - name: Enforce no regression in migration defects
        if: always()
        run: |
          set +e
          python BRAIN/12-ENGINEERING/verify-migration-coherence-controls.py | tail -6
          python - <<'PY'
          import json, os, sys, pathlib
          base_file = pathlib.Path('BRAIN/12-ENGINEERING/MIGRATION-COHERENCE-BASELINE.json')
          base = json.loads(base_file.read_text(encoding='utf-8'))
          measured = int(os.environ['MEASURED'])
          floor = int(base['defect_floor'])
          print(f'migration defect floor={floor}  measured={measured}')
          if measured > floor:
              print(f'REGRESSION: migration defect count grew above the recorded floor of {floor}.')
              sys.exit(1)
          if measured < floor:
              print(f'IMPROVEMENT: {measured} defects is below the recorded floor of {floor}. '
                    f'Lower the floor deliberately once the missing CREATE migrations land.')
          print('No regression in migration coherence.')
          PY
          exit 0
        env:
          MEASURED: ${{ steps.coherence.outputs.defects }}
