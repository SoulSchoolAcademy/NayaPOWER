# Claim-Evidence Gate — enforcement activation for the anti-citogenesis gate.
#
# WHAT: PR bodies that claim "independently verified" / "proven" must stand
# on admissible evidence (a real test, a green CI run, or a different seat's
# review). Same-seat notes, repetition, and bare claims FAIL CLOSED.
# The adjudicator is tools/check_claim_evidence.py (PR #2325); the caller
# that feeds it PR bodies is tools/ci_claim_evidence_gate.py.
#
# WHY pull_request_target (not pull_request): on `pull_request` the workflow
# file AND tools/ would come from the PR head -- the party being gated would
# supply its own judge (the bypass this repo already learned and documented
# in activation-delivery-gate.yml). On `pull_request_target` the judge is
# BASE code the PR cannot edit. The PR head is checked out to ./pr-head as
# DATA (a pinned, runner-provided SHA): its bytes are existence-checked,
# never executed as the judge.
# (Note: the original task brief said `pull_request`; the secure pattern
# wins -- a bypassable enforcement gate is not enforcement. Flagged to the
# reviewer at merge time.)
#
# WHAT IT CANNOT VERIFY (D32 -- the gate's honest boundaries, also in the
# runner's docstring): pooled evidence (one admissible item covers every
# attestation in the body); seat tags are parsed text, not identity, and
# spoofing is not detected; review state is not adjudicated beyond
# excluding DISMISSED; a green CI run proves the machines ran, not what
# they verified; missing author seat tags weaken the seat check.
#
# SCOPE: every PR to main. Bodies with no attestations pass vacuously.
# Infra failure (API blind) fails CLOSED -- a gate that passes when blind
# is theater.
#
# NOTE: marking this check *required* in branch protection is an authority
# change -- Shawn/admin. Until then the gate runs and reports; the lock's
# final click is his.
name: Claim-Evidence Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: claim-evidence-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claim-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # 1. BASE code = the trusted judge (default checkout on
      #    pull_request_target is the base branch).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 (pinned SHA)
      # 2. PR head as DATA: runner-provided SHA, existence-checked never
      #    trusted. Used only for test-path existence checks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 (pinned SHA)
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned SHA)
        with:
          python-version: "3.12"
      - name: Claim-evidence gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_DIR: pr-head
        run: python3 tools/ci_claim_evidence_gate.py
