name: Kernel Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: LAW behavioral gate
        run: python -m pytest -q tests/test_law_node.py
      - name: Full regression suite
        run: python -m pytest -q
