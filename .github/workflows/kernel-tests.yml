name: Kernel Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      # Runtime receipt consumers require the artifact produced by the
      # authenticated Live Learning Influence Proof workflow. Keeping that
      # assertion out of this source-only suite prevents a missing runtime
      # artifact from masquerading as a kernel regression.
      - run: python -m pytest -q --ignore=tests/test_independent_learning_influence.py
