name: Kernel Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml pglast reportlab pypdf
      - run: python -m pytest -q
      - name: Verify generated Brain index has no drift
        run: python tools/regenerate_brain_index.py --check
