name: 513 Smart Board V10 Surgical Repair
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-V10-SURGICAL-REPAIR.md'
      - '.github/workflows/513-smart-board-v10-surgical-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Smart Board authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          # Remove only our prior surgical authority, leaving the proven V10 jewel definitions intact.
          s=re.sub(r'<style id="NAYA-SMART-BOARD-V10-FINAL-AUTHORITY">.*?</style>\s*', '', s, flags=re.S)
          s=re.sub(r'<script id="NAYA-SMART-BOARD-V10-FINAL-AUTHORITY">.*?</script>\s*', '', s, flags=re.S)
          css=r'''<style id="NAYA-SMART-BOARD-V10-FINAL-AUTHORITY">
          .elite-board:first-child .blockTop{display:flex!important;align-items:center!important;gap:28px!important}
          .elite-board:first-child .glyph{width:116px!important;height:116px!important;flex:0 0 116px!important;border-radius:32px!important;position:relative!important;display:grid!important;place-items:center!important}
          .elite-board:first-child .identity{display:flex!important;align-items:center!important;gap:24px!important}
          .elite-board:first-child .block h3{font-size:clamp(36px,4.4vw,64px)!important;line-height:1!important}
          .elite-board .nutshell{margin:26px 0 22px!important;border:2px solid #dfe6ee66!important;border-radius:20px!important;background:linear-gradient(145deg,#14171c,#08090c)!important;box-shadow:inset 0 1px #fff7,0 18px 40px #000b,0 0 34px #dfe6ee12!important;overflow:visible!important}
          .elite-board .nutshell b{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:28px!important;min-height:118px!important;margin:0!important;padding:14px 28px!important;color:#f7f9fb!important;font-size:clamp(22px,2.1vw,32px)!important;font-weight:1000!important;letter-spacing:.16em!important;text-align:left!important}
          .elite-board .nutshell b .v10-final-star{width:86px!important;height:86px!important;flex:0 0 86px!important;display:grid!important;place-items:center!important;position:relative!important}
          .elite-board .nutshell b .v10-final-star svg{width:100%!important;height:100%!important;filter:drop-shadow(0 10px 12px #000b) drop-shadow(0 0 24px #dfe6ee66)!important}
          .elite-board .nutshell p{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;padding:0 28px 30px!important}
          .elite-board .layers{display:grid!important;gap:14px!important}
          .elite-board .layer{border-width:2px!important;border-radius:18px!important;overflow:hidden!important;background:#08090d!important;box-shadow:inset 0 1px #fff3,0 16px 34px #0009!important}
          .elite-board .layerHead{display:flex!important;align-items:center!important;gap:28px!important;min-height:112px!important;padding:14px 28px!important}
          .elite-board .layerHead .v10-final-jewel{width:82px!important;height:82px!important;flex:0 0 82px!important;display:grid!important;place-items:center!important;position:relative!important}
          .elite-board .layerHead .v10-final-jewel svg{width:100%!important;height:100%!important;filter:drop-shadow(0 8px 10px #000d) drop-shadow(0 0 25px var(--layer))!important}
          .elite-board .layerHead b{font-size:clamp(18px,1.6vw,26px)!important;line-height:1.15!important;letter-spacing:.12em!important}
          .elite-board .layerBody{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;padding:28px 34px 34px!important;color:#eeeaf2!important}
          .elite-board .layerBody strong{color:#fff!important}
          .elite-board .layer[data-naya-layer="human"]{--layer:#d86cff!important;border-color:#d86cff99!important}
          .elite-board .layer[data-naya-layer="child"]{--layer:#9d75ff!important;border-color:#9d75ff99!important}
          .elite-board .layer[data-naya-layer="grandma"]{--layer:#6675ff!important;border-color:#6675ff99!important}
          .elite-board .layer[data-naya-layer="naya"]{--layer:#ff8a5b!important;border-color:#ff8a5b99!important}
          .elite-board .layer[data-naya-layer="machine"]{--layer:#55e39a!important;border-color:#55e39a99!important}
          .elite-board .layer[data-naya-layer="learning"]{--layer:#b8ee57!important;border-color:#b8ee5799!important}
          .elite-board .layer[data-naya-layer="meaning"]{--layer:#f1d75a!important;border-color:#f1d75a99!important}
          .elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af3799!important}
          .elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important;border-color:#dfe6ee99!important}
          .elite-board .layer[data-naya-layer="human"] .layerHead{color:#d86cff}.elite-board .layer[data-naya-layer="child"] .layerHead{color:#9d75ff}.elite-board .layer[data-naya-layer="grandma"] .layerHead{color:#6675ff}.elite-board .layer[data-naya-layer="naya"] .layerHead{color:#ff8a5b}.elite-board .layer[data-naya-layer="machine"] .layerHead{color:#55e39a}.elite-board .layer[data-naya-layer="learning"] .layerHead{color:#b8ee57}.elite-board .layer[data-naya-layer="meaning"] .layerHead{color:#f1d75a}.elite-board .layer[data-naya-layer="apply"] .layerHead{color:#d4af37}.elite-board .layer[data-naya-layer="value"] .layerHead{color:#dfe6ee}
          .elite-board .layerHead .dot{display:none!important}
          .top .status{display:none!important}.top .title{font-size:15px!important;font-weight:900!important}
          @media(max-width:820px){.elite-board:first-child .glyph{width:82px!important;height:82px!important;flex-basis:82px!important;border-radius:24px!important}.elite-board:first-child .identity{gap:18px!important}.elite-board .nutshell b{min-height:88px!important;gap:18px!important;padding:10px 18px!important;font-size:clamp(19px,4.8vw,25px)!important}.elite-board .nutshell b .v10-final-star{width:64px!important;height:64px!important;flex-basis:64px!important}.elite-board .layerHead{gap:18px!important;min-height:86px!important;padding:10px 18px!important}.elite-board .layerHead .v10-final-jewel{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .layerBody{font-size:21px!important;padding:22px 22px 27px!important}}
          </style>'''
          js=r'''<script id="NAYA-SMART-BOARD-V10-FINAL-AUTHORITY">
          (()=>{
            const NS='http://www.w3.org/2000/svg';
            const order=['human','child','grandma','naya','machine','learning','meaning','apply','value'];
            const colors={human:'#d86cff',child:'#9d75ff',grandma:'#6675ff',naya:'#ff8a5b',machine:'#55e39a',learning:'#b8ee57',meaning:'#f1d75a',apply:'#d4af37',value:'#dfe6ee'};
            const shapes={
              power:'M50 8 60 38 91 45 63 57 50 91 37 57 9 45 40 38Z',
              human:'M50 9 62 34 90 42 66 58 59 88 50 65 41 88 34 58 10 42 38 34Z',
              child:'M50 8 64 29 88 36 70 55 72 83 50 67 28 83 30 55 12 36 36 29Z',
              grandma:'M50 9 70 24 88 45 70 66 50 89 30 66 12 45 30 24Z',
              naya:'M50 8 58 31 83 17 72 42 92 50 72 58 83 83 58 69 50 92 42 69 17 83 28 58 8 50 28 42 17 17 42 31Z',
              machine:'M50 7 61 25 82 18 78 39 93 50 78 61 82 82 61 75 50 93 39 75 18 82 22 61 7 50 22 39 18 18 39 25Z',
              learning:'M50 7 60 30 85 20 72 43 92 50 72 57 85 80 60 70 50 93 40 70 15 80 28 57 8 50 28 43 15 20 40 30Z',
              meaning:'M50 8 58 36 88 36 64 53 73 82 50 64 27 82 36 53 12 36 42 36Z',
              apply:'M50 6 61 34 91 40 68 57 72 88 50 72 28 88 32 57 9 40 39 34Z',
              value:'M50 8 62 28 86 37 71 55 73 82 50 68 27 82 29 55 14 37 38 28Z'
            };
            function jewelSvg(kind,color){const s=shapes[kind]||shapes.value;const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('aria-hidden','true');svg.innerHTML=`<defs><radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".18" stop-color="${color}"/><stop offset=".58" stop-color="${color}"/><stop offset="1" stop-color="#09090d"/></radialGradient></defs><circle cx="50" cy="50" r="43" fill="#08090d" stroke="#ffffff55" stroke-width="2"/><path d="${s}" fill="url(#g)" stroke="#fff" stroke-opacity=".72" stroke-width="2"/><path d="${s}" fill="none" stroke="#000" stroke-opacity=".65" stroke-width="5" transform="translate(0 3)"/><path d="M28 25 Q50 10 72 25" fill="none" stroke="#fff" stroke-opacity=".62" stroke-width="3"/>`;return svg}
            function cleanText(x){return String(x||'').replace(/^\s*\d+\s*[·.)-]\s*/,'').trim()}
            function run(){
              const first=document.querySelector('.elite-board'); if(!first)return;
              const title=first.querySelector('h3'); if(title){title.textContent='What is Naya Power'}
              const headline=first.querySelector('.glyph'); if(headline){headline.querySelectorAll('svg,img,.v10-final-jewel').forEach(x=>x.remove());headline.appendChild(jewelSvg('power','#a875ff'))}
              const nutshell=first.querySelector('.nutshell');
              if(nutshell){let b=nutshell.querySelector('b');if(!b){b=document.createElement('b');nutshell.prepend(b)};b.replaceChildren();const star=document.createElement('span');star.className='v10-final-star';star.appendChild(jewelSvg('power','#dfe6ee'));b.append(star,document.createTextNode('IN A NUTSHELL'));[...nutshell.children].forEach(x=>{if(x!==b&&!x.matches('p'))x.remove()})}
              const layers=first.querySelector('.layers');if(!layers)return;
              const items=[...layers.children];
              items.forEach((el)=>{const t=cleanText(el.querySelector('.layerHead b')?.textContent);let id='';if(/HUMAN/.test(t))id='human';else if(/CHILD/.test(t))id='child';else if(/GRANDMA/.test(t))id='grandma';else if(/NAYA/.test(t))id='naya';else if(/MACHINE/.test(t))id='machine';else if(/LEARNING|ADAPTIVE/.test(t))id='learning';else if(/MEANING/.test(t))id='meaning';else if(/APPLY|USE/.test(t))id='apply';else if(/IN IT FOR YOU|FOR YOU/.test(t))id='value';if(!id)return;el.dataset.nayaLayer=id;const label=el.querySelector('.layerHead b');if(label)label.textContent=id==='learning'?'LEARNING LESSON':id==='meaning'?'WHAT IT MEANS':id==='apply'?'HOW TO APPLY / HOW TO USE':id==='value'?"WHAT'S IN IT FOR YOU":`${id.toUpperCase()} NOTE`;const head=el.querySelector('.layerHead');if(head){head.querySelectorAll('.dot,svg,img,.v10-final-jewel,.v10-icon,.ico').forEach(x=>x.remove());const j=document.createElement('span');j.className='v10-final-jewel';j.appendChild(jewelSvg(id,colors[id]));head.prepend(j)}});
              order.forEach(id=>{const el=[...layers.children].find(x=>x.dataset.nayaLayer===id);if(el)layers.appendChild(el)});
            }
            const go=()=>{run();setTimeout(run,100);setTimeout(run,350)};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
          })();</script>'''
          s=re.sub(r'</head>',css+'\n</head>',s,count=1,flags=re.I)
          s=re.sub(r'</body>',js+'\n</body>',s,count=1,flags=re.I)
          p.write_text(s,encoding='utf-8')
          out=p.read_text(encoding='utf-8')
          required=['NAYA-SMART-BOARD-V10-FINAL-AUTHORITY','What is Naya Power','v10-final-star','v10-final-jewel','requestedOrder']
          for x in required:
            if x=='requestedOrder': continue
            assert x in out,x
          assert 'd4af37' in out and 'dfe6ee' in out
          print('SMART BOARD FINAL AUTHORITY: PASS')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Restore premium Smart Board jewel icons and final hierarchy'
          git push
