name: Verify Adversarial Governance Gate v2
on:
  push:
    branches: [main]
    paths:
      - '.naya/runtime/adversarial_governance_gate_v2.py'
      - '.github/workflows/verify-adversarial-governance-gate-v2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python .naya/runtime/adversarial_governance_gate_v2.py
