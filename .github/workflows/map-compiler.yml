# Living Map compiler — the map stops being a document, becomes a measurement.
#
# Hourly: re-measures live state (tables, feeds, bridge, rooms, capture, dock)
# and commits HUB/MAP-STATE.json. Judgments stay human; measurements mechanical.
# A probe that cannot measure reports `unknown` loudly — never silent, never green.
#
# Read-only probes; the ONLY write this workflow performs is the state-file commit.
name: map-compiler

on:
  schedule:
    - cron: "17 * * * *"  # hourly, offset to avoid top-of-hour contention
  workflow_dispatch:

permissions:
  contents: write  # the state-file commit is the single authorized write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Compile the map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No SUPABASE_KEY here by design: the supabase_tables probe reports
          # `unknown` (loud) without an authenticated key rather than fake green.
        run: python3 tools/map-compiler/map_compiler.py --out HUB/MAP-STATE.json

      - name: Validate state against schema (fail-closed)
        # The state file is a measurement other systems render. An invalid
        # file must never be committed — fail the run here, loudly.
        run: |
          python3 -m pip install --quiet --break-system-packages jsonschema
          python3 -m jsonschema -i HUB/MAP-STATE.json tools/map-compiler/MAP-STATE.schema.json
          echo "state file valid against MAP-STATE.schema.json"

      - name: Commit state file (only write this workflow performs)
        # Pushes over SSH with the map-compiler deploy key (secret
        # MAP_COMPILER_DEPLOY_KEY). That key holds the repo's scoped ruleset
        # bypass for the state-file landing; the checkout above still uses
        # GITHUB_TOKEN (read). This workflow never commits anything except
        # HUB/MAP-STATE.json (fail-closed design) — the bypass is scoped in
        # practice to this workflow's single write.
        env:
          MAP_COMPILER_DEPLOY_KEY: ${{ secrets.MAP_COMPILER_DEPLOY_KEY }}
        run: |
          git config user.name "living-map-compiler"
          git config user.email "living-map-compiler@users.noreply.github.com"
          git add HUB/MAP-STATE.json
          if git diff --cached --quiet; then
            echo "No state change — nothing to commit."
          else
            git commit -m "Living Map state $(date -u +%Y-%m-%dT%H:%MZ)"
            eval "$(ssh-agent -s)"
            printenv MAP_COMPILER_DEPLOY_KEY > /tmp/map-compiler-key
            chmod 600 /tmp/map-compiler-key
            ssh-add /tmp/map-compiler-key
            rm -f /tmp/map-compiler-key
            mkdir -p ~/.ssh
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            git remote set-url origin git@github.com:SoulSchoolAcademy/NayaPOWER.git
            git push origin HEAD:${{ github.ref_name }}
          fi
