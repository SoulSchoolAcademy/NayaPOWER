# CANONICAL NAYANET HUB RELEASE
# Source: NAYANET/HUB/
# Runtime: https://aged-art-7c12.nayanet.workers.dev
name: Deploy NayaNET Hub

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - '.naya/build/SMART_FEED_RELEASE_TRIGGER'
      - '.github/workflows/deploy-nayanet-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-canonical-hub
  cancel-in-progress: false

env:
  RUNTIME: https://aged-art-7c12.nayanet.workers.dev
  SMART_LINK: https://aged-art-7c12.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Build canonical Hub
        working-directory: NAYANET/HUB
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          echo 'CANONICAL_HUB_BUILD=PASS'

      - name: Verify first-slice artifact
        shell: bash
        run: |
          set -euo pipefail
          H='NAYANET/HUB/dist/index.html'
          for x in 'HOUSE FRAME' 'IDENTITY' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'ACTIVITY' 'Ask Naya' 'intelligentBlock'; do
            grep -Fqi "$x" "$H" || { echo "BUILT_ARTIFACT_MISSING=$x"; exit 1; }
          done
          echo 'FIRST_SLICE_ARTIFACT=PASS'

      - name: Prepare Cloudflare Worker artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf CLOUDFLARE-NAYANET-HUB
          mkdir -p CLOUDFLARE-NAYANET-HUB/public
          cp -R NAYANET/HUB/dist/. CLOUDFLARE-NAYANET-HUB/public/
          cat > CLOUDFLARE-NAYANET-HUB/worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === '/' || url.pathname === '/index.html' || url.pathname.startsWith('/intelligence/')) {
                return env.ASSETS.fetch(new Request(new URL('/index.html', request.url), request));
              }
              return env.ASSETS.fetch(request);
            }
          };
          EOF
          cat > CLOUDFLARE-NAYANET-HUB/wrangler.jsonc <<'EOF'
          {
            "name": "aged-art-7c12",
            "main": "worker.js",
            "compatibility_date": "2026-09-08",
            "account_id": "262c881746ea6e9978ca18b3eb831907",
            "assets": { "directory": "./public", "binding": "ASSETS" }
          }
          EOF
          echo 'CLOUDFLARE_ARTIFACT=READY'

      - name: Deploy to canonical Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-NAYANET-HUB
          command: deploy --config wrangler.jsonc

      - name: Independently verify production runtime and Smart Link parity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 10 --retry-delay 3 "$RUNTIME/?release=$GITHUB_SHA" -o /tmp/root
          curl -fsSL --retry 10 --retry-delay 3 "$SMART_LINK?release=$GITHUB_SHA" -o /tmp/smart
          cmp -s /tmp/root /tmp/smart || { echo 'RUNTIME_ROUTE_PARITY=FAIL'; exit 1; }
          for x in 'HOUSE FRAME' 'IDENTITY' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'ACTIVITY' 'Ask Naya' 'intelligentBlock'; do
            grep -Fqi "$x" /tmp/root || { echo "RUNTIME_MISSING=$x"; exit 1; }
          done
          echo 'PUBLIC_RUNTIME=PASS'
          echo 'RUNTIME_ROUTE_PARITY=PASS'
          echo 'ACTUAL_RUNTIME=https://aged-art-7c12.nayanet.workers.dev/'
          echo "SMART_LINK=$SMART_LINK"
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          {
            echo '## Canonical NayaNET Hub release'
            echo
            echo '**Source:** `NAYANET/HUB/`'
            echo '**Worker:** `aged-art-7c12`'
            echo '**Runtime:** https://aged-art-7c12.nayanet.workers.dev/'
            echo '**Smart Link:** https://aged-art-7c12.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds'
            echo '**Runtime parity:** PASS'
          } >> "$GITHUB_STEP_SUMMARY"
