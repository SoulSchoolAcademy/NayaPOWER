name: Fairness-Debt Bounds Gate (D60 wire)

# Wires the D60 fairness-debt bound engine onto the fairness path.
# Every debt-bound claim in tools/d60_fairness_debt_bounds_manifest.json
# is judged by the REAL engine; a proven BREACH or a conclusion mismatch
# (bound-laundering) BLOCKS (exit 1). Empty manifest = explicit DORMANT
# (exit 0), never a false green. Corrupt manifest, an engine refusal, or
# claims without the mechanism = fail-closed (exit 2).

on:
  pull_request:
    paths:
      - "drift_canary/fairness_debt_bounds.py"
      - "drift_canary/unresolved_evidence.py"
      - "drift_canary/eligibility_proof.py"
      - "drift_canary/fairness.py"
      - "tools/d60_fairness_debt_bounds_gate.py"
      - "tools/d60_fairness_debt_bounds_manifest.json"
      - "tests/test_d60_fairness_debt_bounds_gate.py"
      - ".github/workflows/d60-fairness-debt-bounds.yml"
  push:
    branches: ["main"]
    paths:
      - "drift_canary/fairness_debt_bounds.py"
      - "drift_canary/unresolved_evidence.py"
      - "drift_canary/eligibility_proof.py"
      - "drift_canary/fairness.py"
      - "tools/d60_fairness_debt_bounds_gate.py"
      - "tools/d60_fairness_debt_bounds_manifest.json"
      - "tests/test_d60_fairness_debt_bounds_gate.py"
      - ".github/workflows/d60-fairness-debt-bounds.yml"

jobs:
  fairness-debt-bounds-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Bare setup-python images do not always carry pytest; install it
      # explicitly (same lesson as the D55/D56/D59 mechanism gates).
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_d60_fairness_debt_bounds_gate.py -q -p no:cacheprovider
      - run: python tools/d60_fairness_debt_bounds_gate.py --json
