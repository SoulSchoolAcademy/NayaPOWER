# Branch hygiene — governed automation for the merge queue.
#
# Two jobs, one instrument:
#   1. auto-close-merged — on every merged PR: verify the head branch is fully
#      merged into main and unchanged since the merge, then delete the head
#      ref (the GitHub "delete head branches" behavior, governed and logged).
#      naya5/* team branches are NEVER auto-deleted (team convention from the
#      2026-10-10 branch triage): they get a `merged-cleanup-ok` label so the
#      owner can delete in one click.
#   2. stale-scan — daily: flag branches inactive >30 days. Branches with an
#      open PR get the `stale-branch` label (idempotent, one comment); branches
#      without a PR land in a dated JSON report artifact. Nothing is ever
#      deleted by the scan.
#
# Protected: main, production, release/* are never touched by either job.
# This workflow only acts on refs; it never deploys, never writes the
# database, never touches production state.
#
# Lane: production readiness (branch hygiene). Live-plan priority: "Hygiene
# automation: auto-close merged branches, 30-day stale flag (proposed)".

name: branch-hygiene

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "10 6 * * *" # daily 06:10 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute and report, take no writes"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      stale_days:
        description: "Inactivity threshold in days for the stale scan"
        required: false
        default: "30"
      label_cap:
        description: "Max PRs to label per stale-scan run"
        required: false
        default: "50"

permissions:
  contents: write # delete merged head-branch refs
  pull-requests: write # apply stale/merged labels

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  auto-close-merged:
    name: auto-close merged head branch
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and guard
        id: guard
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH head=$HEAD_SHA fork=$IS_FORK pr=$PR_NUMBER"
          DECISION="skip"
          REASON=""
          if [ "$IS_FORK" = "true" ]; then
            REASON="head repo is a fork; cannot delete"
          elif [ "$BRANCH" = "main" ] || [ "$BRANCH" = "production" ]; then
            REASON="protected branch"
          elif [[ "$BRANCH" == release/* ]]; then
            REASON="protected release/* pattern"
          else
            git fetch --quiet origin "$BRANCH" || { REASON="branch ref no longer exists"; }
            if [ -z "$REASON" ]; then
              CURRENT="$(git rev-parse "origin/$BRANCH")"
              if [ "$CURRENT" != "$HEAD_SHA" ]; then
                REASON="branch advanced past the merged head ($HEAD_SHA -> $CURRENT); refusing"
              elif ! git merge-base --is-ancestor "origin/$BRANCH" origin/main; then
                REASON="branch is not fully merged into main; refusing"
              elif [[ "$BRANCH" == naya5/* ]]; then
                DECISION="label"
                REASON="naya5/* team branch: label for owner deletion, never auto-delete"
              else
                DECISION="delete"
              fi
            fi
          fi
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          printf '{"pr":%s,"branch":"%s","head_sha":"%s","decision":"%s","reason":"%s"}\n' \
            "$PR_NUMBER" "$BRANCH" "$HEAD_SHA" "$DECISION" "$REASON" | tee -a auto-close-receipt.jsonl

      - name: Delete merged head branch
        if: steps.guard.outputs.decision == 'delete'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh api -X DELETE "/repos/${{ github.repository }}/git/refs/heads/$BRANCH"
          echo "deleted refs/heads/$BRANCH"

      - name: Label naya5 branch for owner cleanup
        if: steps.guard.outputs.decision == 'label'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! gh api "/repos/${{ github.repository }}/issues/$PR_NUMBER/labels" \
              --jq '.[].name' | grep -qx 'merged-cleanup-ok'; then
            gh api -X POST "/repos/${{ github.repository }}/issues/$PR_NUMBER/labels" \
              -f "labels[]=merged-cleanup-ok"
            gh api -X POST "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -f body="Branch \`$BRANCH\` is fully merged into main and unchanged since the merge — safe to delete. (branch-hygiene: naya5/* branches are labeled, never auto-deleted.)"
          else
            echo "already labeled merged-cleanup-ok; no duplicate comment"
          fi

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-hygiene-auto-close-${{ github.run_id }}
          path: auto-close-receipt.jsonl
          if-no-files-found: warn
          retention-days: 30

  stale-scan:
    name: daily stale-branch scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch all head refs (no checkout, no blobs)
        run: |
          set -euo pipefail
          git init -q scan && cd scan
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --quiet --filter=blob:none --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:lstrip=3)|%(committerdate:unix)|%(objectname:short)' \
            refs/remotes/origin > ../branch-tips.tsv
          wc -l ../branch-tips.tsv

      - name: Scan for stale branches
        id: scan
        env:
          STALE_DAYS: ${{ inputs.stale_days || '30' }}
          LABEL_CAP: ${{ inputs.label_cap || '50' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOW="$(date +%s)"
          CUTOFF=$(( NOW - STALE_DAYS * 86400 ))
          TODAY="$(date -u +%F)"
          LABELED=0
          : > "../stale-branches-$TODAY.jsonl"
          while IFS='|' read -r BRANCH TS SHORT; do
            case "$BRANCH" in
              main|production|release/*) continue ;;
            esac
            if [ "$TS" -ge "$CUTOFF" ]; then continue; fi
            AGE_DAYS=$(( (NOW - TS) / 86400 ))
            LAST_DATE="$(date -u -d "@$TS" +%FT%TZ)"
            PR_NUM="$(gh api "/repos/$REPO/pulls" -f "head=${REPO%%/*}:$BRANCH" -f state=open \
              --jq '.[0].number // empty' 2>/dev/null || true)"
            ACTION="report-only"
            if [ -n "$PR_NUM" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                ACTION="would-label-pr-$PR_NUM"
              elif [ "$LABELED" -lt "$LABEL_CAP" ]; then
                if ! gh api "/repos/$REPO/issues/$PR_NUM/labels" --jq '.[].name' \
                    | grep -qx 'stale-branch'; then
                  gh api -X POST "/repos/$REPO/issues/$PR_NUM/labels" -f "labels[]=stale-branch"
                  gh api -X POST "/repos/$REPO/issues/$PR_NUM/comments" -f body="Branch \`$BRANCH\` has been inactive for ${AGE_DAYS} days (last commit $LAST_DATE). If it is still needed, push or comment to clear the \`stale-branch\` label; unclaimed diverged branches are reviewed for closure per the 7-day claim process. (branch-hygiene daily scan)"
                  ACTION="labeled-pr-$PR_NUM"
                else
                  ACTION="already-labeled-pr-$PR_NUM"
                fi
                LABELED=$(( LABELED + 1 ))
              else
                ACTION="cap-reached-pr-$PR_NUM"
              fi
            elif [ "$DRY_RUN" = "true" ]; then
              ACTION="would-report"
            fi
            printf '{"branch":"%s","tip":"%s","last_commit":"%s","age_days":%d,"open_pr":%s,"action":"%s"}\n' \
              "$BRANCH" "$SHORT" "$LAST_DATE" "$AGE_DAYS" \
              "${PR_NUM:-null}" "$ACTION" >> "../stale-branches-$TODAY.jsonl"
          done < ../branch-tips.tsv
          echo "stale_report=stale-branches-$TODAY.jsonl" >> "$GITHUB_OUTPUT"
          echo "stale_count=$(wc -l < "../stale-branches-$TODAY.jsonl")" >> "$GITHUB_OUTPUT"
          echo "labeled=$LABELED dry_run=$DRY_RUN"

      - name: Upload stale report
        uses: actions/upload-artifact@v4
        with:
          name: branch-hygiene-stale-${{ github.run_id }}
          path: stale-branches-*.jsonl
          if-no-files-found: error
          retention-days: 90
