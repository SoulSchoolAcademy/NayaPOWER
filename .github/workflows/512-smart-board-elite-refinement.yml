name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Smart Board premium visual architecture V8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA-SMART-BOARD-ELITE-REFINEMENT-V8'
          if marker in s:
              print('V8 already applied')
              raise SystemExit(0)
          s=re.sub(r'<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V7">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V7">.*?</script>', '', s, flags=re.S)
          css='''<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V8">
          .elite-board:first-child .blockTop{display:flex!important;align-items:flex-start!important;gap:24px!important;margin:0 0 24px!important}
          .elite-board:first-child .glyph{display:grid!important;place-items:center!important;width:104px!important;height:104px!important;flex:0 0 104px!important;border-radius:28px!important;position:relative!important;overflow:visible!important;color:#fff!important;background:radial-gradient(circle at 30% 14%,#fff 0 4%,#e7d9ff 10%,#b58cff 24%,#6d3cc9 45%,#32145f 68%,#090611 100%)!important;border:2px solid #f0e8ff!important;box-shadow:inset 0 4px 4px #fff9,inset 0 -24px 34px #000e,0 7px 5px #000c,0 22px 38px #000f,0 0 34px #a875ffdd,0 0 95px #8b42ff44!important;transform:perspective(800px) rotateX(5deg)!important}
          .elite-board:first-child .glyph:before{content:"";position:absolute;inset:-9px;border-radius:31px;border:1px solid #c7a6ffcc;box-shadow:0 0 18px #a875ff90,inset 0 0 12px #fff4;pointer-events:none}
          .elite-board:first-child .glyph:after{content:"";position:absolute;inset:10px;border-radius:20px;border:1px solid #ffffff66;box-shadow:inset 0 3px #fff8,inset 0 -12px 18px #000a;pointer-events:none}
          .elite-board:first-child .glyph .v8-icon{width:72px!important;height:72px!important;position:relative!important;z-index:2!important;filter:drop-shadow(0 7px 3px #000e) drop-shadow(0 0 17px #d9c0ff)!important}
          .elite-board:first-child .identity{display:flex!important;align-items:flex-start!important;gap:20px!important}
          .elite-board:first-child .blockTop h3{font-size:clamp(40px,5vw,70px)!important;line-height:.96!important;letter-spacing:-.06em!important;margin:0 0 10px!important;color:#fff!important}
          .elite-board:first-child .meta{font-size:8px!important}
          .elite-board:first-child .nutshell{margin:0 0 26px!important;padding:0!important;border:2px solid #dfe6ee88!important;border-radius:20px!important;background:linear-gradient(145deg,#15181d,#08090c)!important;box-shadow:inset 0 1px #fff6,0 18px 42px #000c,0 0 36px #dfe6ee18!important;overflow:hidden!important;position:relative!important}
          .elite-board:first-child .nutshell b{display:flex!important;align-items:center!important;gap:22px!important;min-height:108px!important;margin:0!important;padding:15px 28px 15px 30px!important;color:#fff!important;font-size:13px!important;font-weight:1000!important;letter-spacing:.16em!important;border-bottom:1px solid #ffffff18!important;background:linear-gradient(145deg,#1b1f25,#0c0e12)!important;position:relative!important;z-index:3!important}
          .elite-board:first-child .nutshell b .v8-icon{display:block!important;width:72px!important;height:72px!important;flex:0 0 72px!important;position:relative!important;z-index:5!important;color:#f8fbff!important;filter:drop-shadow(0 6px 3px #000e) drop-shadow(0 0 16px #dfe6eeaa)!important}
          .elite-board:first-child .nutshell b:after{content:"";position:absolute;left:25px;top:24px;width:80px;height:80px;border-radius:50%;border:1px solid #ffffff66;box-shadow:inset 0 2px #fff6,inset 0 -10px 16px #0008;pointer-events:none}
          .elite-board:first-child .nutshell p{display:block!important;position:relative!important;z-index:4!important;margin:0!important;padding:25px 30px 31px!important;font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;color:#f5f7f9!important;max-width:none!important}
          .elite-board .layers{display:flex!important;flex-direction:column!important;gap:15px!important}
          .elite-board .layer{overflow:hidden!important;position:relative!important;border-width:2px!important;border-radius:20px!important;background:linear-gradient(145deg,#121217,#07070b)!important;box-shadow:inset 0 1px #fff3,0 15px 34px #0009!important}
          .elite-board .layerHead{display:flex!important;align-items:center!important;gap:22px!important;min-height:108px!important;padding:15px 28px 15px 30px!important;border-bottom:1px solid #ffffff14!important;background:linear-gradient(145deg,#18161c,#0b0a0f)!important}
          .elite-board .dot{width:80px!important;height:80px!important;flex:0 0 80px!important;border-radius:50%!important;position:relative!important;display:grid!important;place-items:center!important;overflow:visible!important;color:#fff!important;background:radial-gradient(circle at 29% 13%,#fff 0 4%,color-mix(in srgb,var(--layer) 90%,#fff 10%) 12%,color-mix(in srgb,var(--layer) 72%,#101015 28%) 37%,color-mix(in srgb,var(--layer) 44%,#030306 56%) 63%,#010103 100%)!important;border:2px solid color-mix(in srgb,var(--layer) 84%,#fff 16%)!important;box-shadow:inset 0 4px 4px #fff9,inset 0 -18px 25px #000d,0 7px 4px #000c,0 19px 32px #000f,0 0 26px color-mix(in srgb,var(--layer) 75%,transparent),0 0 78px color-mix(in srgb,var(--layer) 30%,transparent)!important;transform:perspective(800px) rotateX(5deg)!important}
          .elite-board .dot:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid color-mix(in srgb,var(--layer) 78%,#fff 12%);box-shadow:0 0 14px color-mix(in srgb,var(--layer) 42%,transparent),inset 0 0 9px #fff3;pointer-events:none}
          .elite-board .dot:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid #ffffff66;box-shadow:inset 0 2px #fff7,inset 0 -10px 15px #0009;pointer-events:none}
          .elite-board .dot .v8-icon{width:58px!important;height:58px!important;display:block!important;position:relative!important;z-index:2!important;filter:drop-shadow(0 6px 2px #000e) drop-shadow(0 0 15px color-mix(in srgb,var(--layer) 80%,transparent))!important}
          .elite-board .layerHead b{font-size:12px!important;color:#fff!important;letter-spacing:.13em!important;line-height:1.25!important}
          .elite-board .layerBody{padding:25px 30px 31px!important;font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;color:#e9e6ec!important}
          .elite-board .layerBody strong{color:#fff!important}
          .elite-board .layer[data-naya-layer="human"]{--layer:#ff2fa4!important;border-color:#ff2fa455!important}.elite-board .layer[data-naya-layer="child"]{--layer:#8b42ff!important;border-color:#8b42ff55!important}.elite-board .layer[data-naya-layer="grandma"]{--layer:#4b5dff!important;border-color:#4b5dff55!important}.elite-board .layer[data-naya-layer="naya"]{--layer:#ff9a5a!important;border-color:#ff9a5a55!important}.elite-board .layer[data-naya-layer="machine"]{--layer:#26c875!important;border-color:#26c87555!important}.elite-board .layer[data-naya-layer="learning"]{--layer:#b8ee57!important;border-color:#b8ee5755!important}.elite-board .layer[data-naya-layer="meaning"]{--layer:#f1d75a!important;border-color:#f1d75a55!important}.elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af3766!important;box-shadow:inset 0 1px #fff3,0 17px 36px #000c,0 0 34px #d4af3738!important}.elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important;border-color:#dfe6ee55!important}
          .elite-board .layer[data-naya-layer="apply"] .dot{background:radial-gradient(circle at 29% 13%,#fff 0 4%,#f8e39a 12%,#d4af37 32%,#8d6711 55%,#392804 77%,#070501 100%)!important;border-color:#f6df91!important;box-shadow:inset 0 4px #fff9,inset 0 -18px 24px #000c,0 7px 4px #000b,0 19px 31px #000f,0 0 29px #d4af37cc,0 0 72px #d4af3740!important}.elite-board .layer[data-naya-layer="value"] .dot{background:radial-gradient(circle at 29% 13%,#fff 0 4%,#f7fafc 12%,#c8d0d8 32%,#7f8994 55%,#343b43 77%,#08090b 100%)!important;border-color:#f2f6fa!important}
          .top .title{font-size:10px!important;min-width:175px!important;color:#f7f5fa!important;letter-spacing:.08em!important;font-weight:900!important}.top .title:after{content:none!important}
          @media(max-width:820px){.elite-board:first-child .blockTop{gap:14px!important}.elite-board:first-child .glyph{width:72px!important;height:72px!important;flex-basis:72px!important;border-radius:20px!important}.elite-board:first-child .glyph .v8-icon{width:52px!important;height:52px!important}.elite-board:first-child .blockTop h3{font-size:clamp(32px,9vw,50px)!important}.elite-board:first-child .nutshell b,.elite-board .layerHead{min-height:90px!important;padding:11px 16px 11px 19px!important;gap:16px!important}.elite-board:first-child .nutshell b .v8-icon{width:60px!important;height:60px!important;flex-basis:60px!important}.elite-board:first-child .nutshell p,.elite-board .layerBody{padding:20px 20px 24px!important;font-size:21px!important;line-height:1.58!important}.elite-board .dot{width:64px!important;height:64px!important;flex-basis:64px!important}.elite-board .dot .v8-icon{width:46px!important;height:46px!important}}
          </style>'''
          js='''<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V8">
          (()=>{
            const clean=x=>(x||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
            const paths={
              power:'<path fill="currentColor" d="M12 1.8 15 8.7l7.2 3.1-7.2 3.1-3 7.3-3-7.3L3.8 11.8 9 8.7 12 1.8Z"/><path fill="#fff" opacity=".8" d="m18.5 3.2.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9.9-2.4Z"/>',
              nutshell:'<path fill="currentColor" d="M12 2.2a9.8 9.8 0 1 0 9.8 9.8A9.8 9.8 0 0 0 12 2.2Z"/><path fill="#0a0b0e" d="M8.1 11.2 10.5 13l-1 3.1 2.5-1.8 2.5 1.8-1-3.1 2.4-1.8h-3l-1-3-1 3Z"/><circle cx="12" cy="12" r="8.1" fill="none" stroke="#fff" opacity=".5"/>',
              human:'<circle fill="currentColor" cx="12" cy="6.5" r="3.2"/><path fill="currentColor" d="M5.8 20v-4.1c0-2.8 2.7-4.8 6.2-4.8s6.2 2 6.2 4.8V20Z"/><circle fill="#fff" opacity=".55" cx="8.2" cy="6" r=".7"/>',
              child:'<circle fill="currentColor" cx="12" cy="7" r="3.2"/><path fill="currentColor" d="M5.8 20v-4.1c0-2.8 2.7-4.8 6.2-4.8s6.2 2 6.2 4.8V20Z"/><path fill="none" stroke="#fff" stroke-width="1.4" d="M5 11.2 7 10M19 11.2 17 10"/>',
              grandma:'<circle fill="currentColor" cx="12" cy="7" r="3.1"/><path fill="currentColor" d="M5.8 20v-4.1c0-2.8 2.7-4.8 6.2-4.8s6.2 2 6.2 4.8V20Z"/><path fill="none" stroke="#fff" stroke-width="1.5" d="M8.5 4.5c1-2.1 6-2.1 7 0M8.4 8.8 6.7 11M15.6 8.8l1.7 2.2"/>',
              naya:'<path fill="currentColor" d="m12 1.8 2.5 6.1 6.5 2.5-6.5 2.5-2.5 6.3-2.5-6.3L3 10.4l6.5-2.5L12 1.8Z"/><path fill="#fff" opacity=".75" d="m19 14.2.8 2.1 2.2.8-2.2.8-.8 2.1-.8-2.1-2.2-.8 2.2-.8Z"/>',
              machine:'<rect fill="currentColor" x="3.8" y="5" width="16.4" height="14" rx="3.2"/><path fill="none" stroke="#fff" stroke-width="1.6" d="M7.5 10h9M7.5 14h5M12 2v3M12 19v3M2 11.8h2M20 11.8h2"/><circle fill="#fff" cx="16.7" cy="14" r="1"/>',
              learning:'<path fill="currentColor" d="M3.8 5.2C6.6 3.7 9.4 4 12 5.7v14c-2.6-1.7-5.4-2-8.2-.5v-14Zm16.4 0C17.4 3.7 14.6 4 12 5.7v14c2.6-1.7 5.4-2-8.2-.5v-14Z"/><path fill="none" stroke="#fff" stroke-width="1.7" d="m8.2 11.2 2.1 2.1 5-5"/>',
              meaning:'<circle fill="currentColor" cx="12" cy="12" r="9.2"/><path fill="none" stroke="#fff" stroke-width="1.8" d="M9.2 9.5a2.9 2.9 0 1 1 5.1 1.9c-1.1 1-2.5 1.3-2.5 3.2M12 17.5h.01"/>',
              apply:'<path fill="currentColor" d="M12 2.2 14.2 8l5.8 2.2-5.8 2.2L12 18l-2.2-5.6L4 10.2 9.8 8Z"/><path fill="none" stroke="#fff" stroke-width="2" d="m7.2 17 2.5 2.5L17.8 11"/>',
              value:'<path fill="currentColor" d="m12 1.8 8.2 4.7v9.4L12 20.6l-8.2-4.7V6.5L12 1.8Z"/><path fill="none" stroke="#fff" stroke-width="1.8" d="m7.9 12 2.5 2.5 5.8-6"/>'
            };
            function icon(id){return `<svg class="v8-icon" viewBox="0 0 24 24" aria-hidden="true">${paths[id]||paths.value}</svg>`}
            const map=[['HUMAN NOTE','human'],['CHILD NOTE','child'],['GRANDMA NOTE','grandma'],['NAYA NOTE','naya'],['MACHINE NOTE','machine'],['LEARNING LESSON','learning'],['ADAPTIVE LEARNING','learning'],['WHAT IT MEANS','meaning'],['SIGNIFICANCE','meaning'],['HOW TO APPLY / HOW TO USE','apply'],['HOW TO APPLY','apply'],['HOW TO USE','apply'],["WHAT'S IN IT FOR YOU",'value'],['HUMAN VALUE','value']];
            function classify(k){for(const [n,id] of map)if(k.includes(n))return id;return null}
            function run(){
              document.querySelectorAll('.elite-board').forEach((b,bi)=>{
                const top=b.querySelector('.blockTop'),identity=b.querySelector('.identity'),h3=b.querySelector('.blockTop h3');
                if(bi===0&&top&&identity&&h3){let g=b.querySelector('.glyph');if(!g){g=document.createElement('div');g.className='glyph';g.setAttribute('aria-hidden','true');identity.insertBefore(g,identity.firstChild)}g.innerHTML=icon('power');h3.textContent='What is Naya Power'}
                const nutshell=b.querySelector('.nutshell');
                if(nutshell){let label=nutshell.querySelector('b');if(!label){label=document.createElement('b');nutshell.prepend(label)}label.textContent='';label.insertAdjacentHTML('afterbegin',icon('nutshell'));label.append('IN A NUTSHELL');nutshell.querySelectorAll('.nutshellIcon,.naya-elite-icon,.ico,[class*="nutshellIcon"]').forEach(e=>{if(!e.classList.contains('v8-icon'))e.remove()})}
                const ls=b.querySelector('.layers');if(!ls)return;
                [...ls.children].forEach(l=>{const h=l.querySelector('.layerHead b');const id=classify(clean(h?.textContent));if(id){l.dataset.nayaLayer=id;const dot=l.querySelector('.dot');if(dot)dot.innerHTML=icon(id)}});
                const apply=ls.querySelector('[data-naya-layer="apply"]'),value=ls.querySelector('[data-naya-layer="value"]');if(apply)ls.appendChild(apply);if(value)ls.appendChild(value);
              });
              const title=document.querySelector('.top .title');if(title){const render=()=>{title.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date())};render();if(!window.__nayaTimeTimer)window.__nayaTimeTimer=setInterval(render,30000)}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          </script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email 'actions@github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git commit -m 'Apply Smart Board premium visual architecture V8'
          git push origin HEAD:main
