          .top .title{font-size:12px!important;min-width:220px!important;color:#f7f5fa!important;letter-spacing:.06em!important;font-weight:900!important}.top .title:after{content:none!important}
          @media(max-width:820px){.elite-board:first-child .blockTop{gap:14px!important}.elite-board:first-child .identity{gap:14px!important}.elite-board:first-child .glyph{width:78px!important;height:78px!important;flex-basis:78px!important;border-radius:23px!important}.elite-board:first-child .glyph .v10-icon{width:54px!important;height:54px!important}.elite-board:first-child .blockTop h3{font-size:clamp(32px,9vw,50px)!important}.elite-board:first-child .nutshell b,.elite-board .layerHead{min-height:92px!important;padding:11px 18px!important;gap:14px!important}.elite-board:first-child .nutshell b .v10-nutshell-star,.elite-board:first-child .nutshell b .v10-nutshell-star:before{width:62px!important;height:62px!important;flex-basis:62px!important;font-size:29px!important}.elite-board:first-child .nutshell p,.elite-board .layerBody{padding:20px 21px 25px!important;font-size:21px!important;line-height:1.58!important}.elite-board .dot{width:64px!important;height:64px!important;flex-basis:64px!important}.elite-board .dot .v10-icon{width:46px!important;height:46px!important}}
          </style>'''

          js=r'''<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V10">
          (()=>{
            const NS='http://www.w3.org/2000/svg';
            const clean=x=>String(x||'').replace(/\s+/g,' ').trim().toUpperCase().replace(/^\d+\s*[·.)-]\s*/,'');
            const icons={
              power:'<path class="core" d="M12 2 15 9l7 2-7 3-3 8-3-8-7-3 7-2 3-7Z"/><path class="facet" d="M12 4.2 13.8 10l5.1 1.2-5.1 1.8-1.8 5.1-1.7-5.1-5.1-1.8L10.3 10 12 4.2Z"/><path class="edge" d="m18.5 16 .7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z"/>',
              human:'<circle class="core" cx="12" cy="6" r="3.3"/><path class="core" d="M5.8 20v-3.7c0-3.1 2.7-5.2 6.2-5.2s6.2 2.1 6.2 5.2V20Z"/><path class="facet" d="M10 4.1c.8-.8 2.2-1 3.3-.4l-1.2 3.2c-1.3.1-2.2-.8-2.1-2.8Z"/><path class="edge" d="M4 14c1.2-1.1 2.6-1.6 4.2-1.6M20 14c-1.2-1.1-2.6-1.6-4.2-1.6"/>',
              child:'<circle class="core" cx="12" cy="6.4" r="3.1"/><path class="core" d="M6.2 20v-3.6c0-2.9 2.5-4.8 5.8-4.8s5.8 1.9 5.8 4.8V20Z"/><path class="facet" d="M10.1 5c.8-.8 2.2-.9 3.2-.2-.4 1.4-1.2 2.1-2.4 2.1-.6-.4-.9-1-.8-1.9Z"/><path class="edge" d="m4.5 10.5 2.2-1.1M19.5 10.5l-2.2-1.1"/>',
              grandma:'<circle class="core" cx="12" cy="6.8" r="3.1"/><path class="core" d="M6.1 20v-3.7c0-2.9 2.5-4.8 5.9-4.8s5.9 1.9 5.9 4.8V20Z"/><path class="shade" d="M8 5.2c1.2-2.8 6.8-2.8 8 0-.8-.6-1.9-.8-3.1-.7l-.9 1.6-1.1-1.5c-1.1 0-2 .2-2.9.6Z"/><path class="edge" d="M8.3 4.3c1-2.3 6.4-2.3 7.4 0M8.1 8.5 6.4 11M15.9 8.5l1.7 2.5"/>',
              naya:'<path class="core" d="m12 2 2.5 6.2 6.5 2-6.5 2.3L12 19l-2.5-6.5L3.1 10.2l6.4-2L12 2Z"/><path class="facet" d="m12 4.4 1.5 4.8 4.7 1.2-4.7 1.5-1.5 4.2-1.5-4.2-4.6-1.5 4.6-1.2L12 4.4Z"/><path class="edge" d="m19.2 15 .7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2Z"/>',
              machine:'<rect class="core" x="4" y="5" width="16" height="14" rx="3"/><path class="facet" d="M7 7h10c1.1 0 2 .9 2 2H7c-1.1 0-2-.9-2-2h2Z"/><path class="edge" d="M8 11h8M8 14.5h5M12 2v3M12 19v3M2.5 12h2M19.5 12h2"/>',
              learning:'<path class="core" d="M3.5 5.2C6.4 3.9 9.3 4.3 12 6v14c-2.7-1.7-5.6-2.1-8.5-.8v-14ZM20.5 5.2C17.6 3.9 14.7 4.3 12 6v14c2.7-1.7 5.6-2.1 8.5-.8v-14Z"/><path class="facet" d="M5.3 6.3c2-.7 4.1-.3 5.5.6v10.4c-1.8-.8-3.6-.9-5.5-.4V6.3Z"/><path class="edge" d="m7.8 12 2.1 2.1 5-5.2"/>',
              meaning:'<circle class="core" cx="12" cy="12" r="8.5"/><path class="shade" d="M5.8 15.2c1.6 2.6 4.1 4 6.8 4 2.7 0 5.1-1.4 6.7-3.9-2.1 1.1-4.3 1.7-6.7 1.7-2.4 0-4.7-.6-6.8-1.8Z"/><path class="edge" d="M9.5 9.4a2.7 2.7 0 1 1 4.8 1.8c-1.1 1-2.3 1.2-2.3 3M12 17h.01"/>',
              apply:'<path class="core" d="m4.5 13.1 4.8 4.8L19.7 7.5l1.8 1.8L9.3 21.5 2.7 14.9l1.8-1.8Z"/><path class="facet" d="m5.1 13.6 4.2 4.2 9.4-9.4.6.6-10 10-4.8-4.8.6-.6Z"/><path class="edge" d="M12 3v8M8.5 6.5 12 3l3.5 3.5"/>',
              value:'<path class="core" d="m12 2 8 4.5v11L12 22l-8-4.5v-11L12 2Z"/><path class="facet" d="m12 4.3 5.9 3.3v8.3L12 19.3l-5.9-3.4V7.6L12 4.3Z"/><path class="edge" d="m8.4 12 2.3 2.3 4.9-5.1"/>'
            };
            const map=[['HUMAN NOTE','human'],['CHILD NOTE','child'],['GRANDMA NOTE','grandma'],['NAYA NOTE','naya'],['MACHINE NOTE','machine'],['LEARNING LESSON','learning'],['ADAPTIVE LEARNING','learning'],['WHAT IT MEANS','meaning'],['SIGNIFICANCE','meaning'],['HOW TO APPLY / HOW TO USE','apply'],['HOW TO APPLY','apply'],['HOW TO USE','apply'],["WHAT'S IN IT FOR YOU",'value'],['HUMAN VALUE','value']];
            const layerSpec={human:['HUMAN NOTE','#ff2fa4'],child:['CHILD NOTE','#8b42ff'],grandma:['GRANDMA NOTE','#4b5dff'],naya:['NAYA NOTE','#ff9a5a'],machine:['MACHINE NOTE','#26c875'],learning:['LEARNING LESSON','#b8ee57'],meaning:['WHAT IT MEANS','#f1d75a'],apply:['HOW TO APPLY / HOW TO USE','#d4af37'],value:["WHAT'S IN IT FOR YOU",'#dfe6ee']};
            const classify=t=>{t=clean(t).replace(/\?$/,'');for(const [n,id] of map)if(t.includes(n))return id;return null};
            function svg(kind,cls='v10-icon'){const e=document.createElementNS(NS,'svg');e.setAttribute('class',cls);e.setAttribute('viewBox','0 0 24 24');e.setAttribute('aria-hidden','true');e.setAttribute('fill','none');e.innerHTML=icons[kind]||icons.value;return e}
            function jewel(el,kind){el.querySelectorAll('.v10-icon').forEach(x=>x.remove());el.appendChild(svg(kind))}
            function normalizeBoard(b,index){
              b.classList.add('elite-board','naya-smart-board-v10');
              b.querySelectorAll('.truth,.naya509-block-kicker,.naya509-flow-marker,.naya509-living-spine,.naya509-block-context,.naya509-source-row,.naya509-next-status,.naya509-layer-tag').forEach(x=>x.remove());
              const h=b.querySelector('h3');
              if(h && index===0) h.textContent='What is Naya Power';
              const g=b.querySelector('.glyph');
              if(g){g.querySelectorAll('svg,img,.ico,.naya-elite-icon').forEach(x=>x.remove());jewel(g,'power')}
              const n=b.querySelector('.nutshell');
              if(n){
                n.querySelectorAll('svg,img,.nutshellIcon,.naya-elite-icon,.ico,[class*="nutshellIcon"]').forEach(x=>x.remove());
                const label=n.querySelector('b');
                if(label){label.textContent='';const star=document.createElement('span');star.className='v10-nutshell-star';star.setAttribute('aria-hidden','true');label.appendChild(star);label.appendChild(document.createTextNode('IN A NUTSHELL'))}
              }
              const layers=b.querySelector('.layers'); if(!layers)return;
              const seen=new Set();
              [...layers.children].forEach(l=>{
                const head=l.querySelector('.layerHead'); const btag=l.querySelector('.layerHead b'); if(!head||!btag){l.remove();return}
                const id=classify(btag.textContent);
                if(!id||seen.has(id)){l.remove();return}
                seen.add(id); const spec=layerSpec[id]; btag.textContent=spec[0]; l.dataset.nayaLayer=id; l.style.setProperty('--layer',spec[1]);
                const dot=l.querySelector('.dot'); if(dot){dot.innerHTML='';jewel(dot,id)}
              });
              const meaning=[...layers.children].find(x=>x.dataset.nayaLayer==='meaning');
              if(![...layers.children].some(x=>x.dataset.nayaLayer==='apply')&&meaning){const x=document.createElement('article');x.className='layer';x.dataset.nayaLayer='apply';x.style.setProperty('--layer','#d4af37');x.innerHTML='<div class="layerHead"><span class="dot"></span><b>HOW TO APPLY / HOW TO USE</b><span class="state">ACTION</span></div><div class="layerBody"><strong>Turn understanding into responsible action.</strong> Check the evidence and take one concrete next step supported by what is known. If no verified action exists, keep the intelligence in review rather than inventing certainty.</div>';meaning.after(x);const dot=x.querySelector('.dot');jewel(dot,'apply')}
              const value=[...layers.children].find(x=>x.dataset.nayaLayer==='value');
              if(value)layers.appendChild(value);
              const apply=[...layers.children].find(x=>x.dataset.nayaLayer==='apply');
              if(apply)layers.appendChild(apply); if(value)layers.appendChild(value);
            }
