name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Smart Board premium visual architecture V7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA-SMART-BOARD-ELITE-REFINEMENT-V7'
          if marker in s:
              print('V7 already applied')
              raise SystemExit(0)
          css='''<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V7">
          .elite-board:first-child .blockTop{display:flex!important;align-items:flex-start!important;gap:22px!important;margin:0 0 24px!important}
          .elite-board:first-child .glyph{display:grid!important;width:92px!important;height:92px!important;flex:0 0 92px!important;border-radius:26px!important;position:relative!important;overflow:visible!important;color:#fff!important;background:radial-gradient(circle at 30% 18%,#fff 0 5%,#d8c6ff 12%,#9d75ff 28%,#52269b 52%,#140b26 78%,#050507 100%)!important;border:2px solid #eadfff!important;box-shadow:inset 0 3px #fff9,inset 0 -20px 30px #000d,0 7px 5px #000c,0 22px 36px #000f,0 0 30px #9d75ffdd,0 0 85px #9d75ff42!important;transform:perspective(700px) rotateX(5deg)!important}
          .elite-board:first-child .glyph:before{content:"";position:absolute;inset:-8px;border-radius:29px;border:1px solid #b894ffbb;box-shadow:0 0 16px #9d75ff80,inset 0 0 10px #fff3;pointer-events:none}
          .elite-board:first-child .glyph:after{content:"";position:absolute;inset:9px;border-radius:19px;border:1px solid #ffffff55;box-shadow:inset 0 2px #fff8,inset 0 -10px 16px #0009;pointer-events:none}
          .elite-board:first-child .glyph .v7-icon{width:64px!important;height:64px!important;position:relative!important;z-index:2!important;filter:drop-shadow(0 6px 3px #000e) drop-shadow(0 0 15px #c9aaff)!important}
          .elite-board:first-child .identity{display:flex!important;align-items:flex-start!important;gap:18px!important}
          .elite-board:first-child .blockTop h3{font-size:clamp(38px,5vw,68px)!important;line-height:.96!important;letter-spacing:-.065em!important;margin:0 0 9px!important;color:#fff!important;text-shadow:0 0 28px #ffffff14!important}
          .elite-board:first-child .meta{font-size:8px!important}
          .elite-board:first-child .nutshell{margin:0 0 26px!important;padding:0!important;border:2px solid #dfe6ee72!important;border-radius:18px!important;background:linear-gradient(145deg,#111419,#08090c)!important;box-shadow:inset 0 1px #fff5,0 18px 40px #000b,0 0 34px #dfe6ee16!important;overflow:hidden!important;position:relative!important}
          .elite-board:first-child .nutshell:before{content:none!important}
          .elite-board:first-child .nutshell b{display:flex!important;align-items:center!important;gap:22px!important;min-height:104px!important;margin:0!important;padding:15px 26px 15px 30px!important;color:#fff!important;font-size:12px!important;font-weight:1000!important;letter-spacing:.16em!important;border-bottom:1px solid #ffffff18!important;background:linear-gradient(145deg,#1a1d22,#0c0e12)!important;position:relative!important;z-index:3!important}
          .elite-board:first-child .nutshell b:before{content:"✦";display:grid;place-items:center;width:78px;height:78px;flex:0 0 78px;border-radius:50%;color:#fff;font-size:34px;line-height:1;background:radial-gradient(circle at 30% 16%,#fff 0 5%,#f7fafc 13%,#dfe6ee 31%,#8e98a4 54%,#353c45 76%,#08090b 100%);border:2px solid #f5f8fb;box-shadow:inset 0 3px #fff9,inset 0 -17px 24px #000d,0 6px 4px #000c,0 18px 30px #000f,0 0 28px #dfe6eeaa,0 0 72px #dfe6ee35;transform:perspective(700px) rotateX(5deg)}
          .elite-board:first-child .nutshell b:after{content:"";position:absolute;left:23px;top:24px;width:92px;height:92px;border-radius:50%;border:1px solid #ffffff55;box-shadow:inset 0 0 9px #fff3;pointer-events:none}
          .elite-board:first-child .nutshell p{display:block!important;position:relative!important;z-index:4!important;margin:0!important;padding:24px 28px 29px!important;font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;color:#f5f7f9!important;max-width:none!important}
          .elite-board:first-child .nutshell svg,.elite-board:first-child .nutshell img,.elite-board:first-child .nutshell .nutshellIcon,.elite-board:first-child .nutshell .naya-elite-icon,.elite-board:first-child .nutshell .ico{display:none!important}
          .elite-board .layers{display:flex!important;flex-direction:column!important;gap:15px!important}
          .elite-board .layer{overflow:hidden!important;position:relative!important;border-width:2px!important;border-radius:18px!important;background:linear-gradient(145deg,#111116,#07070b)!important;box-shadow:inset 0 1px #fff3,0 15px 32px #0009!important}
          .elite-board .layerHead{display:flex!important;align-items:center!important;gap:22px!important;min-height:104px!important;padding:15px 26px 15px 30px!important;border-bottom:1px solid #ffffff14!important;background:linear-gradient(145deg,#17151b,#0b0a0f)!important}
          .elite-board .dot{width:78px!important;height:78px!important;flex:0 0 78px!important;border-radius:50%!important;position:relative!important;display:grid!important;place-items:center!important;overflow:visible!important;color:#fff!important;background:radial-gradient(circle at 30% 16%,#fff 0 5%,color-mix(in srgb,var(--layer) 92%,#fff 8%) 13%,color-mix(in srgb,var(--layer) 68%,#111 32%) 38%,color-mix(in srgb,var(--layer) 46%,#050508 54%) 62%,#020204 100%)!important;border:2px solid color-mix(in srgb,var(--layer) 84%,#fff 16%)!important;box-shadow:inset 0 3px #fff9,inset 0 -17px 24px #000d,0 6px 4px #000c,0 18px 30px #000f,0 0 24px color-mix(in srgb,var(--layer) 72%,transparent),0 0 74px color-mix(in srgb,var(--layer) 28%,transparent)!important;transform:perspective(700px) rotateX(5deg)!important}
          .elite-board .dot:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid color-mix(in srgb,var(--layer) 76%,#fff 10%);box-shadow:0 0 12px color-mix(in srgb,var(--layer) 40%,transparent),inset 0 0 8px #fff3;pointer-events:none}
          .elite-board .dot:after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid #ffffff66;box-shadow:inset 0 2px #fff7,inset 0 -9px 14px #0009;pointer-events:none}
          .elite-board .dot .naya-elite-icon,.elite-board .dot .v7-icon{width:56px!important;height:56px!important;display:block!important;position:relative!important;z-index:2!important;filter:drop-shadow(0 5px 2px #000e) drop-shadow(0 0 14px color-mix(in srgb,var(--layer) 78%,transparent))!important}
          .elite-board .dot svg{width:100%!important;height:100%!important;overflow:visible!important;stroke-width:1.05!important}
          .elite-board .layerHead b{font-size:12px!important;color:#fff!important;letter-spacing:.13em!important;line-height:1.25!important}
          .elite-board .layerBody{padding:24px 28px 29px!important;font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;color:#e9e6ec!important}
          .elite-board .layerBody strong{color:#fff!important}
          .elite-board .layer[data-naya-layer="human"]{--layer:#ff2fa4!important;border-color:#ff2fa455!important}
          .elite-board .layer[data-naya-layer="child"]{--layer:#8b42ff!important;border-color:#8b42ff55!important}
          .elite-board .layer[data-naya-layer="grandma"]{--layer:#4b5dff!important;border-color:#4b5dff55!important}
          .elite-board .layer[data-naya-layer="naya"]{--layer:#ff9a5a!important;border-color:#ff9a5a55!important}
          .elite-board .layer[data-naya-layer="machine"]{--layer:#26c875!important;border-color:#26c87555!important}
          .elite-board .layer[data-naya-layer="learning"]{--layer:#b8ee57!important;border-color:#b8ee5755!important}
          .elite-board .layer[data-naya-layer="meaning"]{--layer:#f1d75a!important;border-color:#f1d75a55!important}
          .elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af3766!important;box-shadow:inset 0 1px #fff3,0 17px 36px #000c,0 0 34px #d4af3738!important}
          .elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important;border-color:#dfe6ee55!important}
          .elite-board .layer[data-naya-layer="apply"] .dot{background:radial-gradient(circle at 29% 15%,#fff 0 5%,#f7df86 13%,#d4af37 32%,#8d6711 55%,#3c2a04 76%,#080602 100%)!important;border-color:#f6df91!important;box-shadow:inset 0 3px #fff9,inset 0 -16px 22px #000c,0 6px 4px #000b,0 18px 29px #000f,0 0 28px #d4af37cc,0 0 70px #d4af3740!important}
          .elite-board .layer[data-naya-layer="value"] .dot{background:radial-gradient(circle at 29% 15%,#fff 0 5%,#f7fafc 13%,#c8d0d8 32%,#7f8994 55%,#343b43 76%,#08090b 100%)!important;border-color:#f2f6fa!important}
          .top .title{font-size:10px!important;min-width:175px!important;color:#f7f5fa!important;letter-spacing:.08em!important;font-weight:900!important}.top .title:after{content:none!important}
          @media(max-width:820px){.elite-board:first-child .blockTop{gap:14px!important}.elite-board:first-child .glyph{width:68px!important;height:68px!important;flex-basis:68px!important;border-radius:20px!important}.elite-board:first-child .glyph .v7-icon{width:48px!important;height:48px!important}.elite-board:first-child .blockTop h3{font-size:clamp(32px,9vw,50px)!important}.elite-board:first-child .nutshell b,.elite-board .layerHead{min-height:88px!important;padding:11px 15px 11px 19px!important;gap:16px!important}.elite-board:first-child .nutshell b:before{width:62px!important;height:62px!important;flex-basis:62px!important;font-size:27px!important}.elite-board:first-child .nutshell p,.elite-board .layerBody{padding:19px 20px 23px!important;font-size:21px!important;line-height:1.58!important}.elite-board .dot{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .dot .naya-elite-icon{width:44px!important;height:44px!important}}
          </style>'''
          js='''<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V7">
          (()=>{
            const clean=x=>(x||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
            const paths={power:'<path d="M12 2.5 15 9l6.5 1.5L15 13l-3 8.5L9 13l-6.5-2.5L9 9l3-6.5Z"/><path d="m18.5 15 .7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2Z"/>',human:'<circle cx="12" cy="6.5" r="3"/><path d="M6.5 20v-4.2c0-2.6 2.4-4.5 5.5-4.5s5.5 1.9 5.5 4.5V20"/><path d="M4 13.5c1.2-1.2 2.5-1.7 4-1.7M20 13.5c-1.2-1.2-2.5-1.7-4-1.7"/>',child:'<circle cx="12" cy="7" r="3"/><path d="M6.5 20v-4.2c0-2.6 2.4-4.5 5.5-4.5s5.5 1.9 5.5 4.5V20"/><path d="M4 11.5 6 10M20 11.5 18 10"/>',grandma:'<circle cx="12" cy="7" r="3"/><path d="M6.5 20v-4.2c0-2.6 2.4-4.5 5.5-4.5s5.5 1.9 5.5 4.5V20"/><path d="M8.5 4.2c1-2.1 6-2.1 7 0M8.5 8.7 6.8 11M15.5 8.7l1.7 2.3"/>',naya:'<path d="m12 2 2.2 6 6.3 2-6.3 2.2L12 18l-2.2-5.8L3.5 10l6.3-2L12 2Z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/>',machine:'<rect x="4.5" y="5.5" width="15" height="13" rx="3"/><path d="M8 10h8M8 14h5M12 2v3.5M12 18.5V22M2.5 11h2M19.5 11h2"/>',learning:'<path d="M4 5.5C6.7 4 9.4 4.3 12 6v13c-2.6-1.7-5.3-2-8-.5v-13ZM20 5.5C17.3 4 14.6 4.3 12 6v13c2.6-1.7 5.3-2 8-.5v-13Z"/><path d="m8.5 11 2 2 4.5-5"/>',meaning:'<circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.8 2.8 0 1 1 4.9 1.9c-1.1 1-2.4 1.2-2.4 3M12 17.5h.01"/>',apply:'<path d="M5 13.5 9.5 18 19 7"/><path d="M12 3v9M8.5 6.5 12 3l3.5 3.5"/>',value:'<path d="M12 2.5 19 6.5v11L12 21.5 5 17.5v-11L12 2.5Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>'};
            function icon(id,cls='v7-icon'){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g stroke-width="1.25">${paths[id]||paths.value}</g></svg>`;}
            const map=[['HUMAN NOTE','human'],['CHILD NOTE','child'],['GRANDMA NOTE','grandma'],['NAYA NOTE','naya'],['MACHINE NOTE','machine'],['LEARNING LESSON','learning'],['ADAPTIVE LEARNING','learning'],['WHAT IT MEANS','meaning'],['SIGNIFICANCE','meaning'],['HOW TO APPLY / HOW TO USE','apply'],['HOW TO APPLY','apply'],['HOW TO USE','apply'],["WHAT'S IN IT FOR YOU",'value'],['HUMAN VALUE','value']];
            function classify(k){for(const [n,id] of map)if(k.includes(n))return id;return null;}
            function run(){
              document.querySelectorAll('.elite-board').forEach((b,bi)=>{
                const top=b.querySelector('.blockTop'),identity=b.querySelector('.identity'),h3=b.querySelector('.blockTop h3');
                if(bi===0&&top&&identity&&h3){let g=b.querySelector('.glyph');if(!g){g=document.createElement('div');g.className='glyph';g.setAttribute('aria-hidden','true');identity.insertBefore(g,identity.firstChild);}g.innerHTML=icon('power');g.classList.add('v7-headIcon');h3.textContent='What is Naya Power';}
                const nutshell=b.querySelector('.nutshell');
                if(nutshell){nutshell.querySelectorAll('.nutshellIcon,.naya-elite-icon,.ico,[class*="nutshellIcon"]').forEach(e=>e.remove());let label=nutshell.querySelector('b');if(!label){label=document.createElement('b');nutshell.prepend(label);}label.textContent='IN A NUTSHELL';label.insertAdjacentHTML('afterbegin',icon('nutshell','v7-icon nutshell-v7-icon'));}
                const ls=b.querySelector('.layers');if(!ls)return;
                [...ls.children].forEach(l=>{const h=l.querySelector('.layerHead b');const k=clean(h?.textContent);const id=classify(k);if(id){l.dataset.nayaLayer=id;const dot=l.querySelector('.dot');if(dot)dot.innerHTML=icon(id,'v7-icon');}});
                const apply=ls.querySelector('[data-naya-layer="apply"]'),value=ls.querySelector('[data-naya-layer="value"]');if(apply)ls.appendChild(apply);if(value)ls.appendChild(value);
              });
              const title=document.querySelector('.top .title');if(title){const render=()=>{const d=new Date();title.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d);};render();if(!window.__nayaTimeTimer)window.__nayaTimeTimer=setInterval(render,30000);}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          </script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email 'actions@github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git commit -m 'Apply Smart Board premium visual architecture V7'
          git push origin HEAD:main
