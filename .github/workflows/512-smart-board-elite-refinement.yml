          s=s.replace('</body>',js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('2026 09 15 NayaNETHUB.html').read_text(encoding='utf-8')
          assert s.count('NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')==2
          assert 'naya-smart-board-finalizer' not in s
          assert 'naya-aaa-smart-board-visual-v1-script' not in s
          assert 'naya-smart-board-living-intelligence-v2-script' not in s
          assert 'NAYA-SMART-BOARD-ELITE-REFINEMENT-V9' not in s
          assert "h.textContent='What is Naya Power'" in s
          assert 'v10-nutshell-star' in s
          assert "justify-content:center!important" in s
          assert 'naya-smart-board-v10' in s
          assert 'd4af37' in s
          print('V10 STATIC VERIFIER: PASS')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email 'actions@github.com'
