name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Smart Board visual refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA-SMART-BOARD-ELITE-REFINEMENT-V2'
          if marker in s:
              print('already applied')
              raise SystemExit(0)
          css='''<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V2">
          .elite-board{position:relative!important;isolation:isolate!important;margin:0 0 28px!important;padding:48px 42px 56px 48px!important;background:linear-gradient(145deg,#0d0c12,#050507 74%)!important;border:1px solid #ffffff14!important;box-shadow:inset 0 1px #fff2,0 28px 70px #000d,0 0 45px color-mix(in srgb,var(--tone) 12%,transparent)!important}
          .elite-board:before{left:10px!important;top:34px!important;bottom:34px!important;width:6px!important;border-radius:999px!important;background:var(--tone)!important;box-shadow:0 0 24px var(--tone),0 0 70px color-mix(in srgb,var(--tone) 32%,transparent)!important}
          .elite-board .glyph{width:86px!important;height:86px!important;flex:0 0 86px!important;border-radius:24px!important;color:var(--tone)!important;background:radial-gradient(circle at 28% 20%,#fff9,color-mix(in srgb,var(--tone) 40%,#09090e) 34%,#050508 78%)!important;border:2px solid color-mix(in srgb,var(--tone) 78%,#fff 12%)!important;box-shadow:inset 0 2px #fff9,inset 0 -14px 26px #000a,0 18px 34px #000d,0 0 38px color-mix(in srgb,var(--tone) 38%,transparent)!important;transform:translateY(-4px)!important}
          .elite-board .glyph .naya-elite-icon{width:72px!important;height:72px!important}.elite-board .nutshell{border:2px solid #fff!important;box-shadow:inset 0 1px #fff9,0 22px 46px #000d,0 0 34px #fff4!important}.elite-board .layer{position:relative!important;border:2px solid color-mix(in srgb,var(--layer) 68%,#fff 8%)!important;border-radius:19px!important;background:linear-gradient(145deg,#111116,#07070b)!important;box-shadow:inset 0 1px #fff2,0 16px 34px #000b,0 0 26px color-mix(in srgb,var(--layer) 16%,transparent)!important}.elite-board .layer:before{content:""!important;position:absolute!important;left:0!important;top:0!important;bottom:0!important;width:5px!important;background:var(--layer)!important;box-shadow:0 0 22px var(--layer),0 0 55px color-mix(in srgb,var(--layer) 28%,transparent)!important}.elite-board .layerHead{min-height:72px!important;padding:12px 18px 12px 22px!important;background:linear-gradient(90deg,color-mix(in srgb,var(--layer) 14%,transparent),transparent 64%)!important}.elite-board .dot{width:50px!important;height:50px!important;flex:0 0 50px!important;border-radius:15px!important;display:grid!important;place-items:center!important;color:#fff!important;background:radial-gradient(circle at 28% 20%,#fff9,color-mix(in srgb,var(--layer) 48%,#08080d) 34%,#050509 80%)!important;border:2px solid color-mix(in srgb,var(--layer) 80%,#fff 10%)!important;box-shadow:inset 0 2px #fff9,inset 0 -8px 15px #0009,0 10px 22px #000d,0 0 28px color-mix(in srgb,var(--layer) 40%,transparent)!important}.elite-board .dot .naya-elite-icon{width:42px!important;height:42px!important}.elite-board .layerHead b{font-size:10px!important;color:#fff!important;font-weight:950!important;letter-spacing:.12em!important}.elite-board .layerBody{padding:18px 21px 21px!important;font-size:12px!important;line-height:1.75!important}.top .title{font-size:0!important;min-width:145px!important}.top .title:after{content:'TIME · DATE'!important;font-size:10px!important;font-weight:900!important;letter-spacing:.12em!important;color:#f7f5fa!important}@media(max-width:820px){.elite-board{padding:36px 20px 44px 30px!important}.elite-board .glyph{width:68px!important;height:68px!important;flex-basis:68px!important}.elite-board .glyph .naya-elite-icon{width:56px!important;height:56px!important}.elite-board .dot{width:44px!important;height:44px!important;flex-basis:44px!important}.elite-board .dot .naya-elite-icon{width:36px!important;height:36px!important}}
          </style>'''
          js='''<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V2">
          (()=>{const I={human:'<circle cx="12" cy="8" r="3"/><path d="M5.5 20c.5-3.4 2.5-5.4 6.5-5.4s6 2 6.5 5.4"/>',child:'<circle cx="12" cy="8" r="3"/><path d="M6 20c.5-3.2 2.5-5 6-5s5.5 1.8 6 5"/>',grandma:'<circle cx="12" cy="9" r="4.5"/><path d="M5 20v-5.5a7 7 0 0 1 14 0V20M7 7c1.5-3 8.5-3 10 0"/>',naya:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/>',machine:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M8 9h8M8 12h8M8 15h5M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',learning:'<path d="M5 19 19 5M9 5h10v10M5 9V5h4"/>',meaning:'<circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.8 2.8 0 1 1 4.5 2c-1.3 1-2 1.5-2 3M12 17.5h.01"/>',apply:'<path d="M4 12h14M13 7l5 5-5 5"/>',value:'<path d="M12 21s-7.5-4.4-7.5-10A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 7.5 3c0 5.6-7.5 10-7.5 10Z"/><path d="M12 11v5M9.8 13h4.4"/>',nutshell:'<path d="M12 2.5 14.8 9.2 21.5 12l-6.7 2.8L12 21.5l-2.8-6.7L2.5 12l6.7-2.8L12 2.5Z"/>'};const P={'HUMAN NOTE':['#ff2fa4','human'],'CHILD NOTE':['#8b42ff','child'],'GRANDMA NOTE':['#4b5dff','grandma'],'NAYA NOTE':['#ff9a5a','naya'],'MACHINE NOTE':['#26c875','machine'],'LEARNING LESSON':['#b8ee57','learning'],'WHAT IT MEANS':['#f1d75a','meaning'],'HOW TO APPLY / HOW TO USE':['#e8c766','apply'],"WHAT'S IN IT FOR YOU":['#dfe6ee','value']};const N=x=>(x||'').replace(/\s+/g,' ').trim().toUpperCase().replace(/^\d+\s*[·.)-]\s*/,'');const S=k=>'<span class="naya-elite-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">'+(I[k]||I.nutshell)+'</svg></span>';function run(){document.querySelectorAll('.nutshellIcon').forEach(e=>e.remove());document.querySelectorAll('.block').forEach(b=>{b.classList.add('elite-board');b.querySelectorAll('.layer').forEach(l=>{const h=l.querySelector('.layerHead b'),hit=P[N(h?.textContent)];if(!hit)return;l.style.setProperty('--layer',hit[0]);const d=l.querySelector('.dot');if(d)d.innerHTML=S(hit[1]);});const ls=b.querySelector('.layers');if(!ls)return;const have=new Set([...ls.querySelectorAll('.layerHead b')].map(x=>N(x.textContent)));[['HOW TO APPLY / HOW TO USE','#e8c766','apply','ACTION','Turn understanding into responsible action. Check the evidence, choose one concrete next step, and apply the insight.'],["WHAT'S IN IT FOR YOU",'#dfe6ee','value','VALUE','Know the practical benefit: clearer thinking, less wasted effort, and a useful next step.']].forEach(([name,tone,icon,state,text])=>{if(have.has(name))return;const a=document.createElement('article');a.className='layer';a.style.setProperty('--layer',tone);a.innerHTML='<div class="layerHead"><span class="dot">'+S(icon)+'</span><b>'+name+'</b><span class="state">'+state+'</span></div><div class="layerBody">'+text+'</div>';ls.appendChild(a);});});const t=document.querySelector('.top .title');if(t){t.textContent='';t.setAttribute('aria-label','Current time and date')}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run()})();
          </script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          s=s.replace('SMART NOTE 01·CANONICAL INTELLIGENCE','').replace('SMART NOTE 01 · CANONICAL INTELLIGENCE','').replace('01 · IN A NUTSHELL','IN A NUTSHELL')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email 'actions@github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git commit -m 'Apply canonical Smart Board elite visual refinement V2'
          git push origin HEAD:main
