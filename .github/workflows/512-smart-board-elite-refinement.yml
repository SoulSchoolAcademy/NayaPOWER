name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Smart Board elite visual refinement V3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA-SMART-BOARD-ELITE-REFINEMENT-V3'
          if marker in s:
              print('already applied')
              raise SystemExit(0)
          css='''<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V3">
          /* V3: premium feature hierarchy + physically separated sculptural icon system */
          .elite-board{transform:translateY(-2px)!important;border-radius:28px!important;margin:0 18px 34px!important;padding:52px 46px 58px 54px!important;background:radial-gradient(900px 420px at 50% -8%,color-mix(in srgb,var(--tone) 10%,transparent),transparent 62%),linear-gradient(145deg,#111016,#060609 72%)!important;border:1px solid color-mix(in srgb,var(--tone) 24%,#fff 6%)!important;box-shadow:inset 0 1px #fff4,0 32px 80px #000e,0 0 55px color-mix(in srgb,var(--tone) 12%,transparent)!important}
          .elite-board .blockTop{align-items:center!important}
          .elite-board .identity{gap:22px!important;align-items:center!important}
          .elite-board .glyph{width:112px!important;height:112px!important;flex:0 0 112px!important;border-radius:32px!important;overflow:visible!important;color:var(--tone)!important;background:radial-gradient(circle at 30% 18%,#ffffffd9 0 4%,color-mix(in srgb,var(--tone) 62%,#101014) 24%,#07070b 68%,#020204 100%)!important;border:2px solid color-mix(in srgb,var(--tone) 82%,#fff 18%)!important;box-shadow:inset 0 2px 0 #fff9,inset 0 -18px 30px #000b,0 12px 10px #000a,0 24px 44px #000e,0 0 28px color-mix(in srgb,var(--tone) 42%,transparent),0 0 72px color-mix(in srgb,var(--tone) 20%,transparent)!important;filter:saturate(1.18)!important;transform:translateY(-7px)!important}
          .elite-board .glyph .naya-elite-icon{width:88px!important;height:88px!important;display:block!important;filter:drop-shadow(0 4px 2px #000a) drop-shadow(0 0 10px color-mix(in srgb,var(--tone) 55%,transparent))!important}
          .elite-board .glyph .naya-elite-icon svg{width:100%!important;height:100%!important;overflow:visible!important;stroke-width:1.25!important}
          .elite-board .glyph .naya-elite-icon svg path,.elite-board .glyph .naya-elite-icon svg circle,.elite-board .glyph .naya-elite-icon svg rect{filter:drop-shadow(0 2px 1px #000b)}
          /* The feature board is the reading anchor: larger, brighter, cleaner and with no competing icon. */
          .elite-board:first-child{border:2px solid #eef2f5!important;background:radial-gradient(900px 430px at 50% -12%,#ffffff14,transparent 60%),linear-gradient(145deg,#17191d,#07080b 70%)!important;box-shadow:inset 0 1px #fff9,0 34px 90px #000f,0 0 65px #ffffff18!important}
          .elite-board:first-child:before{background:linear-gradient(#fff,#dfe5ea)!important;box-shadow:0 0 24px #fff,0 0 70px #fff8!important}
          .elite-board:first-child .glyph{color:#f3f7fb!important;background:radial-gradient(circle at 28% 16%,#fff 0 5%,#e9eef2 15%,#8e9aa5 40%,#252b31 72%,#08090b 100%)!important;border-color:#ffffff!important;box-shadow:inset 0 3px 0 #fff,inset 0 -22px 32px #000c,0 16px 12px #000b,0 30px 52px #000f,0 0 34px #fff9,0 0 80px #fff2!important}
          .elite-board:first-child .glyph .naya-elite-icon{width:92px!important;height:92px!important}
          .elite-board:first-child h3{font-size:clamp(34px,4vw,58px)!important}
          .elite-board:first-child .nutshell{margin:30px 0 24px!important;padding:28px 30px!important;border:2px solid #f4f7f9!important;border-radius:24px!important;background:linear-gradient(145deg,#15181c,#08090b)!important;box-shadow:inset 0 2px #fff8,0 24px 50px #000e,0 0 40px #fff3!important}
          .elite-board:first-child .nutshell b{font-size:9px!important;color:#ffffff!important;letter-spacing:.2em!important}
          .elite-board:first-child .nutshell p{font-size:clamp(19px,1.65vw,25px)!important;line-height:1.72!important;max-width:1100px!important;color:#f3f5f7!important}
          /* Remove every legacy/duplicate nutshell icon container. The feature board has exactly one sculptural icon. */
          .elite-board .nutshellIcon,.elite-board .nutshell .naya-elite-icon{display:none!important}
          /* Layer icons are jewelry-like, large enough to read, and color-matched. */
          .elite-board .layerHead{gap:16px!important;min-height:86px!important;padding:13px 20px 13px 25px!important}
          .elite-board .dot{width:58px!important;height:58px!important;flex:0 0 58px!important;border-radius:18px!important;position:relative!important;overflow:visible!important;color:#fff!important;background:radial-gradient(circle at 27% 16%,#fff 0 4%,color-mix(in srgb,var(--layer) 72%,#fff 12%) 18%,color-mix(in srgb,var(--layer) 55%,#07070b) 45%,#050508 78%)!important;border:2px solid color-mix(in srgb,var(--layer) 88%,#fff 12%)!important;box-shadow:inset 0 3px 0 #fff9,inset 0 -10px 17px #000b,0 9px 6px #000a,0 17px 28px #000e,0 0 30px color-mix(in srgb,var(--layer) 52%,transparent),0 0 60px color-mix(in srgb,var(--layer) 20%,transparent)!important;transform:translateY(-3px)!important}
          .elite-board .dot:after{content:"";position:absolute;inset:5px;border-radius:13px;border:1px solid #ffffff45;pointer-events:none}
          .elite-board .dot .naya-elite-icon{width:44px!important;height:44px!important;display:block!important;filter:drop-shadow(0 3px 2px #000b) drop-shadow(0 0 9px color-mix(in srgb,var(--layer) 55%,transparent))!important}
          .elite-board .dot svg{width:100%!important;height:100%!important;overflow:visible!important;stroke-width:1.35!important}
          .elite-board .layerHead b{font-size:11px!important;letter-spacing:.13em!important}
          /* Correct semantic order: Apply sits directly before Value. */
          .elite-board .layers{display:flex!important;flex-direction:column!important;gap:11px!important}
          .elite-board .layers .layer:nth-child(8){order:8!important}
          .elite-board .layers .layer:nth-child(9){order:9!important}
          .elite-board .layers .layer[data-naya-layer="apply"]{order:8!important}
          .elite-board .layers .layer[data-naya-layer="value"]{order:9!important}
          .elite-board .layerBody{padding:17px 22px 22px 24px!important}
          .elite-board .blockFoot{margin-top:20px!important}
          @media(max-width:820px){.elite-board{margin:0 8px 24px!important;padding:38px 20px 44px 28px!important}.elite-board .identity{gap:15px!important}.elite-board .glyph{width:82px!important;height:82px!important;flex-basis:82px!important;border-radius:24px!important}.elite-board .glyph .naya-elite-icon{width:66px!important;height:66px!important}.elite-board .dot{width:48px!important;height:48px!important;flex-basis:48px!important}.elite-board .dot .naya-elite-icon{width:37px!important;height:37px!important}.elite-board:first-child .glyph{width:92px!important;height:92px!important;flex-basis:92px!important}.elite-board:first-child .glyph .naya-elite-icon{width:75px!important;height:75px!important}}
          </style>'''
          js='''<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V3">
          (()=>{
            const N=x=>(x||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
            const order=['IN A NUTSHELL','HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];
            const P={'HUMAN NOTE':['#ff2fa4','human'],'CHILD NOTE':['#8b42ff','child'],'GRANDMA NOTE':['#4b5dff','grandma'],'NAYA NOTE':['#ff9a5a','naya'],'MACHINE NOTE':['#26c875','machine'],'LEARNING LESSON':['#b8ee57','learning'],'WHAT IT MEANS':['#f1d75a','meaning'],'HOW TO APPLY / HOW TO USE':['#d6a62b','apply'],"WHAT'S IN IT FOR YOU":['#dfe6ee','value']};
            const I={human:'<path d="M12 10a3.2 3.2 0 1 0 0-6.4A3.2 3.2 0 0 0 12 10Z"/><path d="M4.5 21c.5-4.2 3-6.5 7.5-6.5s7 2.3 7.5 6.5"/>',child:'<path d="M12 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M5 21c.5-4 2.7-6 7-6s6.5 2 7 6"/><path d="M8 13.2c1.1-.8 2.5-1.2 4-1.2s2.9.4 4 1.2"/>',grandma:'<circle cx="12" cy="9" r="4.5"/><path d="M4.5 21v-5.5a7.5 7.5 0 0 1 15 0V21M7 6.5c1.4-3.2 8.6-3.2 10 0"/><path d="M9 20h6"/>',naya:'<path d="m12 1.8 2.7 7.5 7.5 2.7-7.5 2.7-2.7 7.5-2.7-7.5L1.8 12l7.5-2.7L12 1.8Z"/><circle cx="12" cy="12" r="2"/>',machine:'<rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="M8 9h8M8 12h8M8 15h5M9 1.8v2.7M15 1.8v2.7M9 19.5v2.7M15 19.5v2.7M1.8 9h2.7M1.8 15h2.7M19.5 9h2.7M19.5 15h2.7"/>',learning:'<path d="m4 20 16-16M7 5h13v13M4 9V5h4"/><circle cx="7" cy="17" r="2"/>',meaning:'<circle cx="12" cy="12" r="8.7"/><path d="M9.4 9.5a2.9 2.9 0 1 1 4.6 2.2c-1.3.9-2 1.6-2 3M12 18h.01"/>',apply:'<path d="M3.5 12h14.5M13 6.5l5.5 5.5-5.5 5.5"/><path d="M3.5 7.5v-3h3"/>',value:'<path d="M12 21s-7.7-4.5-7.7-10.1A4.7 4.7 0 0 1 12 8a4.7 4.7 0 0 1 7.7 2.9C19.7 16.5 12 21 12 21Z"/><path d="M12 11v5M9.7 13h4.6"/>',nutshell:'<path d="m12 1.7 2.9 7.4 7.4 2.9-7.4 2.9-2.9 7.4-2.9-7.4-7.4-2.9 7.4-2.9L12 1.7Z"/><circle cx="12" cy="12" r="2.2"/>'};
            const S=k=>'<span class="naya-elite-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">'+(I[k]||I.nutshell)+'</svg></span>';
            function run(){
              document.querySelectorAll('.elite-board').forEach((b,bi)=>{
                b.classList.add('elite-board');
                b.querySelectorAll('.nutshellIcon').forEach(e=>e.remove());
                b.querySelectorAll('.glyph .naya-elite-icon').forEach(e=>e.remove());
                const glyph=b.querySelector('.glyph');
                if(glyph) glyph.innerHTML=S(bi===0?'nutshell':(P[N(b.querySelector('.layerHead b')?.textContent)]?.[1]||'naya'));
                const ls=b.querySelector('.layers'); if(!ls)return;
                [...ls.children].forEach((l,li)=>{
                  const h=l.querySelector('.layerHead b'); const key=N(h?.textContent); const hit=P[key];
                  if(hit){l.style.setProperty('--layer',hit[0]);l.dataset.nayaLayer=hit[1];const d=l.querySelector('.dot');if(d){d.innerHTML=S(hit[1]);d.setAttribute('aria-hidden','true')}}
                });
                const have=new Set([...ls.querySelectorAll('.layerHead b')].map(x=>N(x.textContent)));
                if(!have.has('HOW TO APPLY / HOW TO USE')){const a=document.createElement('article');a.className='layer';a.dataset.nayaLayer='apply';a.style.setProperty('--layer','#d6a62b');a.innerHTML='<div class="layerHead"><span class="dot" aria-hidden="true">'+S('apply')+'</span><b>HOW TO APPLY / HOW TO USE</b><span class="state">ACTION</span></div><div class="layerBody">Turn understanding into responsible action. Check the evidence, choose one concrete next step, and apply the insight.</div>';ls.appendChild(a)}
                if(!have.has("WHAT'S IN IT FOR YOU")){const a=document.createElement('article');a.className='layer';a.dataset.nayaLayer='value';a.style.setProperty('--layer','#dfe6ee');a.innerHTML='<div class="layerHead"><span class="dot" aria-hidden="true">'+S('value')+'</span><b>WHAT\'S IN IT FOR YOU</b><span class="state">VALUE</span></div><div class="layerBody">Know the practical benefit: clearer thinking, less wasted effort, and a useful next step.</div>';ls.appendChild(a)}
                [...ls.children].forEach((l,i)=>{const k=N(l.querySelector('.layerHead b')?.textContent);l.style.order=String(order.indexOf(k)>=0?order.indexOf(k):i+10)});
              });
              const t=document.querySelector('.top .title'); if(t){t.textContent='';t.setAttribute('aria-label','Current time and date')}
              document.querySelectorAll('.top .title').forEach(t=>{if(t.textContent.includes('SMART NOTE')||t.textContent.includes('CANONICAL'))t.textContent=''})
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          </script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          s=s.replace('SMART NOTE 01·CANONICAL INTELLIGENCE','').replace('SMART NOTE 01 · CANONICAL INTELLIGENCE','').replace('SMART NOTE 01','').replace('01 · IN A NUTSHELL','IN A NUTSHELL')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email 'actions@github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git commit -m 'Upgrade Smart Board feature board and sculptural icon system'
          git push origin HEAD:main
