name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Smart Board hierarchy and premium jewelry icon refinement V6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA-SMART-BOARD-ELITE-REFINEMENT-V6'
          if marker in s:
              print('already applied')
              raise SystemExit(0)
          css='''<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V6">
          /* V6: restore the subject headline; keep In a Nutshell clean and icon-free. */
          .elite-board:first-child .blockTop{display:flex!important;align-items:flex-start!important;gap:18px!important;margin:0 0 22px!important}
          .elite-board:first-child .glyph{display:none!important}
          .elite-board:first-child .identity{display:block!important}
          .elite-board:first-child .blockTop h3{font-size:clamp(34px,4.6vw,64px)!important;line-height:.98!important;letter-spacing:-.06em!important;margin:0 0 7px!important;color:#fff!important;text-shadow:0 0 28px #ffffff12!important}
          .elite-board:first-child .meta{font-size:8px!important}
          .elite-board:first-child .nutshell{position:relative!important;margin:0 0 30px!important;padding:29px 34px 33px!important;min-height:0!important;border:1px solid #dfe6ee66!important;border-left:5px solid #e8edf2!important;border-radius:5px 24px 24px 5px!important;background:linear-gradient(145deg,#171a1e,#090a0d)!important;box-shadow:inset 0 1px #fff7,0 22px 52px #000d,0 0 42px #fff12!important;overflow:visible!important}
          .elite-board:first-child .nutshell:before{content:'IN A NUTSHELL'!important;display:block!important;margin:0 0 15px!important;color:#cbd3da!important;font-size:12px!important;font-weight:1000!important;letter-spacing:.24em!important;text-shadow:0 0 14px #fff5!important;position:relative!important;z-index:3!important}
          .elite-board:first-child .nutshell b{display:none!important}
          .elite-board:first-child .nutshell p{position:relative!important;z-index:4!important;font-size:clamp(23px,2vw,31px)!important;line-height:1.58!important;color:#f7f9fb!important;margin:0!important;max-width:none!important}
          .elite-board:first-child .nutshell svg,.elite-board:first-child .nutshell img,.elite-board:first-child .nutshell .nutshellIcon,.elite-board:first-child .nutshell .naya-elite-icon,.elite-board:first-child .nutshell .ico,.elite-board:first-child .nutshell [class*="icon"]{display:none!important}
          .elite-board:first-child .nutshell{background-image:linear-gradient(145deg,#171a1e,#090a0d)!important}

          /* Premium semantic icons: large, dimensional, gemstone-like, physically separated from text. */
          .elite-board .layerHead{gap:22px!important;min-height:104px!important;padding:15px 26px 15px 30px!important;align-items:center!important}
          .elite-board .dot{width:78px!important;height:78px!important;flex:0 0 78px!important;border-radius:50%!important;position:relative!important;display:grid!important;place-items:center!important;overflow:visible!important;color:#fff!important;background:radial-gradient(circle at 30% 16%,#fff 0 4%,color-mix(in srgb,var(--layer) 92%,#fff 8%) 13%,color-mix(in srgb,var(--layer) 68%,#111 32%) 38%,color-mix(in srgb,var(--layer) 48%,#050508 52%) 62%,#020204 100%)!important;border:2px solid color-mix(in srgb,var(--layer) 84%,#fff 16%)!important;box-shadow:inset 0 3px 0 #fff9,inset 0 -17px 24px #000d,0 6px 4px #000c,0 18px 30px #000f,0 0 24px color-mix(in srgb,var(--layer) 72%,transparent),0 0 74px color-mix(in srgb,var(--layer) 28%,transparent)!important;transform:translateY(-2px) perspective(700px) rotateX(5deg)!important;transition:transform .24s cubic-bezier(.16,.84,.22,1),filter .24s!important}
          .elite-board .dot:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid color-mix(in srgb,var(--layer) 76%,#fff 10%);box-shadow:0 0 12px color-mix(in srgb,var(--layer) 40%,transparent),inset 0 0 8px #fff3;pointer-events:none}
          .elite-board .dot:after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid #ffffff66;box-shadow:inset 0 2px #fff7,inset 0 -9px 14px #0009;pointer-events:none}
          .elite-board .dot .naya-elite-icon{width:54px!important;height:54px!important;display:block!important;position:relative!important;z-index:2!important;filter:drop-shadow(0 5px 2px #000e) drop-shadow(0 0 14px color-mix(in srgb,var(--layer) 78%,transparent))!important}
          .elite-board .dot svg{width:100%!important;height:100%!important;overflow:visible!important;stroke-width:1.05!important}
          .elite-board .dot:hover{transform:translateY(-9px) scale(1.05)!important;filter:saturate(1.25) brightness(1.1)!important}
          .elite-board .layerHead b{font-size:12px!important;color:#fff!important;letter-spacing:.13em!important;line-height:1.25!important}
          .elite-board .layerBody{padding:23px 28px 27px!important;font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;color:#e9e6ec!important}
          .elite-board .layerBody strong{color:#fff!important}
          .elite-board .layers{display:flex!important;flex-direction:column!important;gap:15px!important}
          .elite-board .layer{position:relative!important;overflow:visible!important}
          .elite-board .layerHead,.elite-board .layerBody{position:relative!important;z-index:2!important}

          .elite-board .layer[data-naya-layer="human"]{--layer:#ff2fa4!important}
          .elite-board .layer[data-naya-layer="child"]{--layer:#8b42ff!important}
          .elite-board .layer[data-naya-layer="grandma"]{--layer:#4b5dff!important}
          .elite-board .layer[data-naya-layer="naya"]{--layer:#ff9a5a!important}
          .elite-board .layer[data-naya-layer="machine"]{--layer:#26c875!important}
          .elite-board .layer[data-naya-layer="learning"]{--layer:#b8ee57!important}
          .elite-board .layer[data-naya-layer="meaning"]{--layer:#f1d75a!important}
          .elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af37aa!important;box-shadow:inset 0 1px #fff3,0 18px 38px #000c,0 0 34px #d4af3738!important}
          .elite-board .layer[data-naya-layer="apply"] .dot{background:radial-gradient(circle at 29% 15%,#fff 0 4%,#f7df86 13%,#d4af37 32%,#8d6711 55%,#3c2a04 76%,#080602 100%)!important;border-color:#f6df91!important;box-shadow:inset 0 3px #fff9,inset 0 -16px 22px #000c,0 6px 4px #000b,0 18px 29px #000f,0 0 28px #d4af37cc,0 0 70px #d4af3740!important}
          .elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important;border-color:#dfe6ee66!important}
          .elite-board .layer[data-naya-layer="value"] .dot{background:radial-gradient(circle at 29% 15%,#fff 0 4%,#f7fafc 13%,#c8d0d8 32%,#7f8994 55%,#343b43 76%,#08090b 100%)!important;border-color:#f2f6fa!important}

          .top .title{font-size:10px!important;min-width:175px!important;color:#f7f5fa!important;letter-spacing:.08em!important;font-weight:900!important}
          .top .title:after{content:none!important}
          @media(max-width:820px){
            .elite-board:first-child{margin:0 7px 26px!important;padding:30px 18px 38px 26px!important}
            .elite-board:first-child .blockTop{display:flex!important}
            .elite-board:first-child .blockTop h3{font-size:clamp(32px,9vw,48px)!important}
            .elite-board:first-child .nutshell{padding:25px 22px 28px!important}
            .elite-board .layerHead{min-height:88px!important;padding:11px 15px 11px 19px!important;gap:16px!important}
            .elite-board .dot{width:62px!important;height:62px!important;flex-basis:62px!important}
            .elite-board .dot .naya-elite-icon{width:42px!important;height:42px!important}
            .elite-board .layerBody{padding:18px 20px 22px!important;font-size:21px!important;line-height:1.58!important}
          }
          </style>'''
          js='''<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V6">
          (()=>{
            const clean=x=>(x||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
            const map=[
              ['HUMAN NOTE','human'],['CHILD NOTE','child'],['GRANDMA NOTE','grandma'],['NAYA NOTE','naya'],['MACHINE NOTE','machine'],
              ['LEARNING LESSON','learning'],['ADAPTIVE LEARNING','learning'],['WHAT IT MEANS','meaning'],['SIGNIFICANCE','meaning'],
              ['HOW TO APPLY / HOW TO USE','apply'],['HOW TO APPLY','apply'],['HOW TO USE','apply'],
              ["WHAT'S IN IT FOR YOU",'value'],['HUMAN VALUE','value']
            ];
            const classify=k=>{for(const [needle,id] of map)if(k.includes(needle))return id;return null};
            function iconSVG(id){
              const paths={
                human:'<path d="M12 5.2a2.7 2.7 0 1 0 0-5.4 2.7 2.7 0 0 0 0 5.4Zm-5 8.2c.2-3 2-4.7 5-4.7s4.8 1.7 5 4.7v2.1H7v-2.1Z"/><path d="M4.2 19.2c2.2-1.4 5-2.1 7.8-2.1s5.6.7 7.8 2.1"/>',
                child:'<circle cx="12" cy="7" r="3"/><path d="M7 20v-4.4c0-2.1 2.2-3.6 5-3.6s5 1.5 5 3.6V20"/><path d="M4 12.5c1.2-1 2.4-1.5 3.7-1.5M20 12.5c-1.2-1-2.4-1.5-3.7-1.5"/>',
                grandma:'<circle cx="12" cy="7" r="3"/><path d="M7 20v-4.3c0-2.2 2.2-3.7 5-3.7s5 1.5 5 3.7V20"/><path d="M8 4.2c1.1-2 6.9-2 8 0M8.5 8.5l-1.7 2.3M15.5 8.5l1.7 2.3"/>',
                naya:'<path d="m12 2 2.1 6.1L20 10l-5.9 2.1L12 18l-2.1-5.9L4 10l5.9-1.9L12 2Z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/>',
                machine:'<rect x="5" y="6" width="14" height="12" rx="2"/><path d="M8 10h8M8 14h5M12 2v4M12 18v4M3 10h2M19 10h2"/>',
                learning:'<path d="M4 5.5C6.6 4 9.3 4.3 12 6v13c-2.7-1.7-5.4-2-8-0.5v-13Z"/><path d="M20 5.5C17.4 4 14.7 4.3 12 6v13c2.7-1.7 5.4-2 8-.5v-13Z"/><path d="m9 10 1.5 1.5L14 8"/>',
                meaning:'<circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.8 2.8 0 1 1 4.9 1.9c-1.1 1-2.4 1.2-2.4 3M12 17.5h.01"/>',
                apply:'<path d="M6 13.5 10 17l8-9"/><path d="M5 20h14"/><path d="M12 4v9"/><path d="m8.5 7.5 3.5-3.5 3.5 3.5"/>',
                value:'<path d="M12 2.5 18.5 6v12L12 21.5 5.5 18V6L12 2.5Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>'
              };
              return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g stroke-width="1.35">${paths[id]||paths.value}</g></svg>`;
            }
            function run(){
              document.querySelectorAll('.elite-board').forEach((b,bi)=>{
                b.querySelectorAll('.nutshellIcon,.nutshell .naya-elite-icon,.nutshell svg,.nutshell img,.nutshell .ico,[class*="nutshellIcon"]').forEach(e=>e.remove());
                if(bi===0)b.querySelector('.glyph')?.remove();
                const ls=b.querySelector('.layers'); if(!ls)return;
                [...ls.children].forEach(l=>{
                  const h=l.querySelector('.layerHead b'); const k=clean(h?.textContent); const id=classify(k);
                  if(k.includes('IN A NUTSHELL')){l.remove();return;}
                  if(id){l.dataset.nayaLayer=id; const dot=l.querySelector('.dot'); if(dot){dot.innerHTML=iconSVG(id);}}
                });
                const order=['human','child','grandma','naya','machine','learning','meaning','apply','value'];
                [...ls.children].sort((a,b)=>order.indexOf(a.dataset.nayaLayer)-order.indexOf(b.dataset.nayaLayer)).forEach(l=>ls.appendChild(l));
              });
              const title=document.querySelector('.top .title');
              if(title){const render=()=>{const d=new Date();title.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d);};render();if(!window.__nayaTimeTimer)window.__nayaTimeTimer=setInterval(render,30000);}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          </script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email 'actions@github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git commit -m 'Repair Smart Board hierarchy and premium icon system V6'
          git push origin HEAD:main
