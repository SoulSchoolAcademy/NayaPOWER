name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
      - '.github/workflows/512-smart-board-elite-refinement.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical elite visual refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          # Remove competing visual runtime/finalizer layers so there is one authoritative renderer.
          ids=['naya-elite-interface-refinement-runtime','naya-smart-board-finalizer','naya-aaa-smart-board-visual-v1-script','naya-smart-board-living-intelligence-v2-script']
          for sid in ids:
              s=re.sub(r'<script[^>]*id=["\\\\]'+re.escape(sid)+r'["\\\\][^>]*>.*?</script>','',s,flags=re.S|re.I)
          for sid in ['naya-elite-interface-refinement','naya-canonical-elite-css']:
              s=re.sub(r'<style[^>]*id=["\\\\]'+re.escape(sid)+r'["\\\\][^>]*>.*?</style>','',s,flags=re.S|re.I)
          # Remove the gray/white duplicate nutshell icon at source level.
          s=re.sub(r'<[^>]*class=["\\\\][^"\\\\]*nutshellIcon[^"\\\\]*["\\\\][^>]*>.*?</[^>]+>','',s,flags=re.S|re.I)
          s=s.replace("let i=n.querySelector('.nutshellIcon');if(!i){i=document.createElement('span');i.className='nutshellIcon';i.setAttribute('data-icon','◉');n.prepend(i)}",'')
          # Clean visible internal header designation.
          s=re.sub(r'SmartNet\\s*O1\\s*Canonical\\s*Intelligence','',s,flags=re.I)
          s=re.sub(r'SMART\\s*NOTE\\s*0?1\\s*[·:—-]?\\s*CANONICAL\\s*INTELLIGENCE','',s,flags=re.I)
          # Normalize legacy labels.
          s=s.replace('ADAPTIVE LEARNING','LEARNING LESSON').replace('CHILD SIMPLIFIED','CHILD NOTE')
          # Replace the canonical board renderer with one renderer that owns the visual contract.
          a=s.find('function board(note,idx){')
          b=s.find('function stripLegacyBars',a)
          if a<0 or b<0: raise SystemExit('canonical board renderer not found')
          new=r'''function board(note,idx){const tonesBy=['#9d75ff','#6675ff','#55b9ee','#55e39a','#d86cff','#e8c766'];const tone=tonesBy[idx%tonesBy.length],nums=Object.keys(note.sections).map(Number).sort((a,b)=>a-b),nuts=note.sections[1],now=new Date(),dateLabel=now.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',year:'numeric'}),timeLabel=now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),title=norm(note.title);const aliases={'CHILD':'CHILD NOTE','CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','MACHINE / PROVENANCE':'MACHINE NOTE','ADAPTIVE LEARNING':'LEARNING LESSON','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU?":"WHAT'S IN IT FOR YOU"};const palette={'HUMAN NOTE':'#ff2fa4','CHILD NOTE':'#8b42ff','GRANDMA NOTE':'#4b5dff','NAYA NOTE':'#ff9a5a','MACHINE NOTE':'#26c875','LEARNING LESSON':'#b8ee57','WHAT IT MEANS':'#f1d75a','HOW TO APPLY / HOW TO USE':'#e8c766',"WHAT'S IN IT FOR YOU":'#dfe6ee'};const iconPaths={human:'<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.5-3.4 2.5-5.4 6.5-5.4s6 2 6.5 5.4"/>',child:'<circle cx="12" cy="8" r="3"/><path d="M6.5 20c.4-3.1 2.2-5 5.5-5s5.1 1.9 5.5 5"/>',grandma:'<circle cx="12" cy="9" r="4.5"/><path d="M5 20v-5.5a7 7 0 0 1 14 0V20M7.2 7c1.2-3 8.4-3 9.6 0"/>',naya:'<path d="m12 2.5 2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6Z"/>',machine:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M8 9h8M8 12h8M8 15h5M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',learning:'<path d="M5 19 19 5M9 5h10v10M5 9V5h4"/>',meaning:'<circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.8 2.8 0 1 1 4.5 2c-1.3 1-2 1.5-2 3M12 17.5h.01"/>',apply:'<path d="M5 12h12M13 7l5 5-5 5"/>',value:'<path d="M12 21s-7.5-4.4-7.5-10A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 7.5 3c0 5.6-7.5 10-7.5 10Z"/><path d="M12 11v5M9.8 13h4.4"/>',nutshell:'<path d="M12 3 14.5 9.5 21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>'};const layerIcon={'HUMAN NOTE':'human','CHILD NOTE':'child','GRANDMA NOTE':'grandma','NAYA NOTE':'naya','MACHINE NOTE':'machine','LEARNING LESSON':'learning','WHAT IT MEANS':'meaning','HOW TO APPLY / HOW TO USE':'apply',"WHAT'S IN IT FOR YOU":'value'};const boardIcon=title==='WHAT IS NAYA POWER?'?'nutshell':title==='WHAT IS NAYA?'?'naya':title==='WHAT ARE SMART NOTES?'?'meaning':title==='YOUR INTELLIGENCE TODAY'?'learning':title==='INTELLIGENCE REPORTS'?'machine':title==='WHAT IS THE INTELLIGENT LIBRARY?'?'value':title==='SMART LISTS'?'apply':title==='INTELLIGENT FEED / SMART FEED'?'learning':'nutshell';const svg=k=>`<span class="naya-elite-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${iconPaths[k]||iconPaths.nutshell}</svg></span>`;const normalize=n=>aliases[norm(n)]||norm(n);const existing={};nums.filter(n=>n!==1).forEach(n=>{const z=note.sections[n];const name=normalize(z.name);if(palette[name])existing[name]=z});const missingApply=!existing['HOW TO APPLY / HOW TO USE'];const missingValue=!existing["WHAT'S IN IT FOR YOU"];const renderLayer=(name,z)=>`<article class="layer semantic-${name.toLowerCase().replace(/[^a-z]+/g,'-')}" style="--layer:${palette[name]}"><div class="layerHead"><span class="dot">${svg(layerIcon[name])}</span><b>${esc(name)}</b><span class="state">${esc(z?.state||'INTELLIGENCE')}</span></div><div class="layerBody">${body(z?.text||'')}</div></article>`;const layers=Object.keys(palette).map(name=>existing[name]?renderLayer(name,existing[name]):name==='HOW TO APPLY / HOW TO USE'?renderLayer(name,{state:'ACTION',text:'Turn understanding into responsible action. Use the insight, check the evidence, and take one concrete next step.'}):name==="WHAT'S IN IT FOR YOU"?renderLayer(name,{state:'VALUE',text:'Know what this changes for you. Use the insight to make a clearer decision, save effort, or take a useful next step.'}):'').join('');return `<article class="block naya509-board elite-board" data-real-smart-note="${note.number}" data-intelligence-id="smart-note-${String(note.number).padStart(2,'0')}" style="--tone:${tone}"><div class="blockInner"><div class="blockTop"><div class="identity"><div class="glyph" style="--tone:${tone}">${svg(boardIcon)}</div><div><h3>${esc(note.title)}</h3><div class="meta naya-meta"><span>${dateLabel}</span><span>${timeLabel}</span></div></div></div></div>${nuts?`<div class="nutshell semantic-nutshell" style="--layer:#f7f7fa"><div class="nutshellHead"><span class="nutshellOnlyIcon">${svg('nutshell')}</span><b>IN A NUTSHELL</b></div><p>${body(nuts.text)}</p></div>`:''}<div class="layers">${layers}</div>${actions()}<div class="blockFoot"><span>ONE INTELLIGENCE · MANY VIEWS · ONE IDENTITY</span><span>TRUST: SOURCE / INTERPRETATION SEPARATED</span></div></div></article>`}
function stripLegacyBars'''
          s=s[:a]+new+s[b+len('function stripLegacyBars'):]
          css=r'''<style id="naya-elite-final-css">.elite-board{position:relative;isolation:isolate;padding:48px 42px 54px 48px!important;background:linear-gradient(145deg,#0c0b10,#050508 72%)!important;transform:translateZ(0);box-shadow:inset 0 1px #fff1,0 26px 60px #000c,0 0 0 1px #ffffff08!important}.elite-board:before{left:12px!important;top:42px!important;bottom:42px!important;width:5px!important;border-radius:999px;background:linear-gradient(180deg,var(--tone),color-mix(in srgb,var(--tone) 20%,transparent))!important;box-shadow:0 0 24px color-mix(in srgb,var(--tone) 58%,transparent),0 0 70px color-mix(in srgb,var(--tone) 18%,transparent)!important}.elite-board:after{background:radial-gradient(900px 340px at 18% 0%,color-mix(in srgb,var(--tone) 14%,transparent),transparent 68%)!important}.elite-board .blockTop{margin-bottom:4px}.elite-board .glyph{width:76px!important;height:76px!important;flex:0 0 76px!important;border-radius:22px!important;color:var(--tone)!important;background:radial-gradient(circle at 30% 22%,#fff8,color-mix(in srgb,var(--tone) 35%,#09090e) 34%,#07070b 76%)!important;border:2px solid color-mix(in srgb,var(--tone) 70%,#fff 16%)!important;box-shadow:inset 0 2px #fff9,inset 0 -12px 25px #0008,0 15px 30px #000d,0 0 34px color-mix(in srgb,var(--tone) 34%,transparent)!important;transform:translateY(-3px);}.elite-board .glyph .naya-elite-icon{width:64px!important;height:64px!important}.naya-elite-icon{display:inline-grid;place-items:center;width:100%;height:100%;color:currentColor;filter:drop-shadow(0 5px 8px #000c)}.naya-elite-icon svg{width:88%;height:88%;overflow:visible}.elite-board h3{font-size:clamp(29px,3.7vw,50px)!important}.naya-meta{font-size:10px!important;font-weight:800!important;color:#eeeaf2!important}.naya-meta span+span:before{content:'·';margin-right:9px;color:#77717e}.elite-board .nutshell{margin:26px 0 22px!important;padding:22px 25px!important;border:2px solid #fff!important;border-radius:20px!important;background:linear-gradient(145deg,#111116,#07070b)!important;box-shadow:inset 0 1px #fff9,0 20px 44px #000d,0 0 30px #fff3!important}.nutshellHead{display:flex;align-items:center;gap:13px;margin-bottom:10px}.nutshellOnlyIcon{width:34px;height:34px;display:grid;place-items:center;color:#fff;flex:0 0 34px}.nutshellOnlyIcon .naya-elite-icon{width:34px;height:34px}.elite-board .nutshell p{font-size:19px!important;line-height:1.68!important;color:#f3f0f5!important}.elite-board .layers{display:grid!important;gap:11px!important}.elite-board .layer{position:relative;border:2px solid color-mix(in srgb,var(--layer) 58%,#ffffff 8%)!important;border-radius:18px!important;background:linear-gradient(145deg,#101015,#07070b)!important;box-shadow:inset 0 1px #fff2,0 15px 32px #000a,0 0 22px color-mix(in srgb,var(--layer) 13%,transparent)!important;overflow:hidden}.elite-board .layer:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--layer);box-shadow:0 0 22px var(--layer),0 0 55px color-mix(in srgb,var(--layer) 28%,transparent)}.elite-board .layerHead{min-height:66px!important;padding:12px 16px 12px 20px!important;background:linear-gradient(90deg,color-mix(in srgb,var(--layer) 13%,transparent),transparent 60%)!important}.elite-board .dot{width:46px!important;height:46px!important;flex:0 0 46px!important;border-radius:14px!important;display:grid!important;place-items:center!important;color:#fff!important;background:radial-gradient(circle at 28% 22%,#fff9,color-mix(in srgb,var(--layer) 45%,#09090e) 35%,#050509 78%)!important;border:2px solid color-mix(in srgb,var(--layer) 76%,#fff 12%)!important;box-shadow:inset 0 2px #fff9,inset 0 -7px 14px #0008,0 9px 20px #000c,0 0 25px color-mix(in srgb,var(--layer) 36%,transparent)!important}.elite-board .dot .naya-elite-icon{width:39px!important;height:39px!important}.elite-board .layerHead b{font-size:10px!important;font-weight:950!important;letter-spacing:.12em!important;color:#fff!important}.elite-board .state{font-size:7px!important}.elite-board .layerBody{padding:17px 20px 19px!important;font-size:12px!important;line-height:1.72!important;color:#d3ced8!important}.elite-board .layerBody strong{color:#fff!important}.elite-board .actions{margin-top:20px}.elite-board .blockFoot{margin-top:20px}.top .title{font-size:0!important}.top .title:empty:after{content:''}.top .title{display:flex!important;align-items:center}.top .title:after{content:'TIME · DATE';font-size:10px;font-weight:900;letter-spacing:.12em;color:#f7f5fa}.top .title *{display:none!important}@media(max-width:820px){.elite-board{padding:36px 20px 42px 30px!important}.elite-board .glyph{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .glyph .naya-elite-icon{width:52px!important;height:52px!important}.elite-board .dot{width:40px!important;height:40px!important;flex-basis:40px!important}.elite-board .dot .naya-elite-icon{width:34px!important;height:34px!important}.elite-board .layerHead{min-height:58px!important;padding-left:15px!important}.elite-board .layerHead b{font-size:9px!important}.elite-board .nutshell p{font-size:17px!important}}</style>'''
          s=s.replace('</head>',css+'</head>',1)
          # Remove any static O1/nutshell duplicate artifacts after renderer insertion.
          s=s.replace('SMART NOTE 01·CANONICAL INTELLIGENCE','').replace('SMART NOTE 01 · CANONICAL INTELLIGENCE','')
          s=s.replace('01 · IN A NUTSHELL','IN A NUTSHELL')
          p.write_text(s,encoding='utf-8')
          print('ELITE_REFINEMENT_APPLIED')
          PY
      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('2026 09 15 NayaNETHUB.html').read_text(encoding='utf-8')
          assert s.count('function board(note,idx){')==1
          assert 'function block(b,i){' not in s and '.map(block)' not in s
          assert 'naya-elite-interface-refinement-runtime' not in s
          assert 'naya-smart-board-finalizer' not in s
          assert 'nutshellIcon' not in s
          assert 'SMART NOTE 01' not in s
          assert '01 · IN A NUTSHELL' not in s
          assert 'naya-elite-final-css' in s
          for x in ['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"]: assert x in s
          for x in ['#ff2fa4','#8b42ff','#4b5dff','#ff9a5a','#26c875','#b8ee57','#f1d75a','#e8c766','#dfe6ee']: assert x in s
          assert 'naya-elite-icon' in s and 'width:76px' in s and 'width:46px' in s
          print('CANONICAL_RENDERER=PASS')
          print('NO_GRAY_NUTSHELL_OVERLAY=PASS')
          print('LARGE_DIMENSIONAL_ICONS=PASS')
          print('SEMANTIC_COLOR_SYSTEM=PASS')
          print('HOW_TO_APPLY_LAYER=PASS')
          print('TIME_DATE_HEADER=PASS')
          print('SINGLE_RENDERER=PASS')
          PY
      - name: Commit refined canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md
          git add '2026 09 15 NayaNETHUB.html' '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Elevate Smart Boards to dimensional semantic interface'
          git push origin HEAD:main
