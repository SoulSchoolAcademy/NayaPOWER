          .elite-board .layerBody{padding:27px 31px 33px!important;font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;color:#ece9ef!important}
          .elite-board .layerBody strong{color:#fff!important}
          .elite-board .layer[data-naya-layer="human"]{--layer:#ff2fa4!important;border-color:#ff2fa466!important}.elite-board .layer[data-naya-layer="child"]{--layer:#8b42ff!important;border-color:#8b42ff66!important}.elite-board .layer[data-naya-layer="grandma"]{--layer:#4b5dff!important;border-color:#4b5dff66!important}.elite-board .layer[data-naya-layer="naya"]{--layer:#ff9a5a!important;border-color:#ff9a5a66!important}.elite-board .layer[data-naya-layer="machine"]{--layer:#26c875!important;border-color:#26c87566!important}.elite-board .layer[data-naya-layer="learning"]{--layer:#b8ee57!important;border-color:#b8ee5766!important}.elite-board .layer[data-naya-layer="meaning"]{--layer:#f1d75a!important;border-color:#f1d75a66!important}.elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af376f!important}.elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important;border-color:#dfe6ee66!important}
          .elite-board .layer[data-naya-layer="apply"]{box-shadow:inset 0 1px #fff3,0 18px 38px #000c,0 0 36px #d4af3740!important}.elite-board .layer[data-naya-layer="value"]{box-shadow:inset 0 1px #fff3,0 17px 36px #000a,0 0 32px #dfe6ee24!important}
