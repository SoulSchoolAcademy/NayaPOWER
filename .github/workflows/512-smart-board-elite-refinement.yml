            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          </script>'''
          s=re.sub(r'\s*<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V10">.*?</style>\s*','',s,flags=re.S)
          s=re.sub(r'\s*<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V10">.*?</script>\s*','',s,flags=re.S)
