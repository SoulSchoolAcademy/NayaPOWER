name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact V10 authority and remove competing visual overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          path=Path('2026 09 15 NayaNETHUB.html')
          current=path.read_text(encoding='utf-8')
          baseline=subprocess.check_output(['git','show','60c70db83c8ffdf954b73c45821fd53a3eeebbf7:2026 09 15 NayaNETHUB.html'],text=True)
          def block(src,tag,ident):
              m=re.search(r'<'+tag+r'\s+id=["\']'+re.escape(ident)+r'["\'][^>]*>.*?</'+tag+r'>',src,re.S|re.I)
              if not m: raise SystemExit('missing protected V10 '+tag)
              return m.group(0)
          v10_style=block(baseline,'style','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')
          v10_script=block(baseline,'script','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')
          if not all(x in v10_script for x in ['class="core"','class="facet"','class="shade"','class="edge"']): raise SystemExit('protected jewel definitions missing')
          current=re.sub(r'<style\s+id=["\']NAYA-SMART-BOARD-ELITE-REFINEMENT-[^"\']+["\'][^>]*>.*?</style>','',current,flags=re.S|re.I)
          current=re.sub(r'<script\s+id=["\']NAYA-SMART-BOARD-ELITE-REFINEMENT-[^"\']+["\'][^>]*>.*?</script>','',current,flags=re.S|re.I)
          for sid in ['naya-aaa-smart-board-visual-v1','naya-smart-board-living-intelligence-v2','naya-aaa-smart-board-visual-v1-script','naya-smart-board-living-intelligence-v2-script','naya-smart-board-finalizer','naya-elite-interface-refinement-runtime']:
              for tag in ['style','script']:
                  current=re.sub(r'<'+tag+r'\s+id=["\']'+re.escape(sid)+r'["\'][^>]*>.*?</'+tag+r'>','',current,flags=re.S|re.I)
          current=current.replace('</head>',v10_style+'\n</head>',1)
          surgical_style='''<style id="NAYA-SMART-BOARD-V10-SURGICAL-FINAL">
          .elite-board:first-child .nutshell{margin:0 0 28px!important;padding:0!important;overflow:hidden!important}
          .elite-board:first-child .nutshell b{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:24px!important;text-align:left!important;font-size:clamp(20px,2.1vw,29px)!important;min-height:116px!important;padding:14px 30px!important}
          .elite-board:first-child .nutshell b .v10-nutshell-star{order:0!important;margin:0!important;flex:0 0 78px!important}
          .elite-board:first-child .nutshell p{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;padding:27px 32px 33px!important}
          .elite-board:first-child .blockTop{gap:28px!important}.elite-board:first-child .identity{gap:22px!important}.elite-board:first-child .glyph{flex:0 0 116px!important}
          .elite-board .layerHead{gap:24px!important}.elite-board .layerHead b{font-size:14px!important}.elite-board .layerBody{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important;padding:27px 31px 33px!important}.elite-board .dot{flex:0 0 88px!important;width:88px!important;height:88px!important}.elite-board .dot .v10-icon{width:64px!important;height:64px!important}
          </style>'''
          current=current.replace('</head>',surgical_style+'\n</head>',1)
          surgical_script='''<script id="NAYA-SMART-BOARD-V10-SURGICAL-FINAL">
          (()=>{
            const q=(s,r=document)=>r.querySelector(s),qq=(s,r=document)=>[...r.querySelectorAll(s)];
            const norm=s=>String(s||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
            const ORDER=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];
            const ALIAS={'ADAPTIVE LEARNING':'LEARNING LESSON','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE','HOW TO APPLY':'HOW TO APPLY / HOW TO USE','CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','MACHINE / PROVENANCE':'MACHINE NOTE','SIGNIFICANCE':'WHAT IT MEANS','HUMAN VALUE':"WHAT'S IN IT FOR YOU"};
            function cleanNutshell(n){if(!n)return;const p=q('p',n),label=q('b',n);[...n.children].forEach(x=>{if(x!==label&&x!==p)x.remove()});if(label){label.replaceChildren();const star=document.createElement('span');star.className='v10-nutshell-star';star.setAttribute('aria-hidden','true');label.append(star,document.createTextNode('IN A NUTSHELL'));}}
            function normalize(){
              const boards=qq('.elite-board');
              boards.forEach((board,bi)=>{if(bi===0){const h=q('.blockTop h3',board);if(h)h.textContent='What is Naya Power';cleanNutshell(q('.nutshell',board));}const layers=q('.layers',board);if(!layers)return;const map=new Map();qq(':scope > .layer',layers).forEach(layer=>{const h=q('.layerHead b',layer);if(!h){layer.remove();return}let t=norm(h.textContent);t=ALIAS[t]||t;if(!ORDER.includes(t)){layer.remove();return}h.textContent=t;map.set(t,layer)});ORDER.forEach(name=>{const layer=map.get(name);if(layer)layers.appendChild(layer)});});
              qq('.status').forEach(x=>x.remove());
              const title=q('.top .title');if(title)title.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date());
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',normalize,{once:true});else normalize();
          })();
          </script>'''
          current=current.replace('</body>',v10_script+'\n'+surgical_script+'\n</body>',1)
          required=['NAYA-SMART-BOARD-ELITE-REFINEMENT-V10','NAYA-SMART-BOARD-V10-SURGICAL-FINAL','class="core"','class="facet"','class="shade"','class="edge"','human:','child:','grandma:','naya:','machine:','learning:','meaning:','apply:','value:','v10-nutshell-star','What is Naya Power']
          for token in required:
              if token not in current: raise SystemExit('missing required token: '+token)
          for sid in ['naya-aaa-smart-board-visual-v1','naya-smart-board-living-intelligence-v2','naya-smart-board-finalizer','naya-elite-interface-refinement-runtime']:
              if sid in current: raise SystemExit('competing override survived: '+sid)
          path.write_text(current,encoding='utf-8')
          print('EXACT_V10_ICON_SYSTEM_RESTORED; LEGACY_OVERRIDES_REMOVED')
          PY
      - name: Verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          for x in 'NAYA-SMART-BOARD-ELITE-REFINEMENT-V10' 'NAYA-SMART-BOARD-V10-SURGICAL-FINAL' 'class="core"' 'class="facet"' 'class="shade"' 'class="edge"' 'v10-nutshell-star' 'What is Naya Power'; do grep -q "$x" "$f"; done
          ! grep -q 'naya-aaa-smart-board-visual-v1' "$f"
          ! grep -q 'naya-smart-board-living-intelligence-v2' "$f"
          ! grep -q 'naya-elite-interface-refinement-runtime' "$f"
          ! grep -q 'naya-smart-board-finalizer' "$f"
          echo 'CANONICAL_V10_AUTHORITY_VERIFIED'
      - name: Commit canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NayaPOWER Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then echo 'NO_CANONICAL_CHANGE'; exit 1; fi
          git commit -m 'Restore exact V10 jewel icons and remove legacy overrides'
          git push origin HEAD:main
