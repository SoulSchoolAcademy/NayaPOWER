name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Smart Board elite visual refinement V5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA-SMART-BOARD-ELITE-REFINEMENT-V5'
          if marker in s:
              print('already applied')
              raise SystemExit(0)
          css='''<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V5">
          /* V5: In a Nutshell is clean, text-first, silver, and icon-free. */
          .elite-board:first-child .blockTop{display:none!important}
          .elite-board:first-child .glyph{display:none!important}
          .elite-board:first-child .nutshell{margin:0 0 28px!important;padding:30px 36px 34px!important;min-height:0!important;border:0!important;border-left:5px solid #e5ebf0!important;border-radius:4px 24px 24px 4px!important;background:linear-gradient(145deg,#171a1e,#090a0d)!important;box-shadow:inset 0 1px #fff6,0 22px 52px #000d,0 0 42px #fff1!important}
          .elite-board:first-child .nutshell:before{content:'IN A NUTSHELL'!important;display:block!important;margin:0 0 16px!important;color:#bfc8d0!important;font-size:11px!important;font-weight:1000!important;letter-spacing:.24em!important;text-shadow:0 0 14px #fff4!important}
          .elite-board:first-child .nutshell b{display:none!important}
          .elite-board:first-child .nutshell p{font-size:clamp(21px,1.8vw,29px)!important;line-height:1.62!important;color:#f5f7f9!important;margin:0!important;max-width:none!important}
          .elite-board .nutshellIcon,.elite-board .nutshell .naya-elite-icon{display:none!important}
          /* Jewelry grammar: gemstone body, raised bezel, inner facet, luminous semantic color. */
          .elite-board .layerHead{gap:20px!important;min-height:94px!important;padding:14px 24px 14px 28px!important}
          .elite-board .dot{width:72px!important;height:72px!important;flex:0 0 72px!important;border-radius:50%!important;position:relative!important;display:grid!important;place-items:center!important;overflow:visible!important;color:#fff!important;background:radial-gradient(circle at 30% 18%,#fff 0 4%,color-mix(in srgb,var(--layer) 92%,#fff 8%) 13%,color-mix(in srgb,var(--layer) 68%,#111 32%) 38%,color-mix(in srgb,var(--layer) 48%,#050508 52%) 62%,#020204 100%)!important;border:2px solid color-mix(in srgb,var(--layer) 82%,#fff 18%)!important;box-shadow:inset 0 3px 0 #fff9,inset 0 -16px 22px #000c,0 5px 3px #000b,0 16px 26px #000f,0 0 22px color-mix(in srgb,var(--layer) 70%,transparent),0 0 68px color-mix(in srgb,var(--layer) 25%,transparent)!important;transform:translateY(-3px) perspective(650px) rotateX(4deg)!important;transition:transform .24s cubic-bezier(.16,.84,.22,1),filter .24s!important}
          .elite-board .dot:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid color-mix(in srgb,var(--layer) 72%,#fff 8%);box-shadow:0 0 10px color-mix(in srgb,var(--layer) 38%,transparent),inset 0 0 7px #fff3;pointer-events:none}
          .elite-board .dot:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #ffffff55;box-shadow:inset 0 2px #fff6,inset 0 -8px 13px #0008;pointer-events:none}
          .elite-board .dot .naya-elite-icon{width:50px!important;height:50px!important;display:block!important;position:relative!important;z-index:2!important;filter:drop-shadow(0 4px 2px #000e) drop-shadow(0 0 12px color-mix(in srgb,var(--layer) 72%,transparent))!important}
          .elite-board .dot svg{width:100%!important;height:100%!important;overflow:visible!important;stroke-width:1.05!important}
          .elite-board .dot:hover{transform:translateY(-8px) scale(1.045)!important;filter:saturate(1.25) brightness(1.1)!important}
          .elite-board .layerHead b{font-size:11px!important;color:#fff!important;letter-spacing:.13em!important}
          /* Every explanatory text block reads at the same comfortable scale as In a Nutshell. */
          .elite-board .layerBody{padding:22px 26px 25px!important;font-size:clamp(21px,1.8vw,29px)!important;line-height:1.62!important;color:#e8e5eb!important}
          .elite-board .layerBody strong{color:#fff!important}
          .elite-board .layers{display:flex!important;flex-direction:column!important;gap:13px!important}
          /* Explicit semantic identities. */
          .elite-board .layer[data-naya-layer="human"]{--layer:#ff2fa4!important}
          .elite-board .layer[data-naya-layer="child"]{--layer:#8b42ff!important}
          .elite-board .layer[data-naya-layer="grandma"]{--layer:#4b5dff!important}
          .elite-board .layer[data-naya-layer="naya"]{--layer:#ff9a5a!important}
          .elite-board .layer[data-naya-layer="machine"]{--layer:#26c875!important}
          .elite-board .layer[data-naya-layer="learning"]{--layer:#b8ee57!important}
          .elite-board .layer[data-naya-layer="meaning"]{--layer:#f1d75a!important}
          .elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af37aa!important;box-shadow:inset 0 1px #fff3,0 18px 38px #000c,0 0 34px #d4af3738!important}
          .elite-board .layer[data-naya-layer="apply"] .dot{background:radial-gradient(circle at 29% 15%,#fff 0 4%,#f7df86 13%,#d4af37 32%,#8d6711 55%,#3c2a04 76%,#080602 100%)!important;border-color:#f6df91!important;box-shadow:inset 0 3px #fff9,inset 0 -16px 22px #000c,0 6px 4px #000b,0 18px 29px #000f,0 0 28px #d4af37cc,0 0 70px #d4af3740!important}
          .elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important}
          .elite-board .layer[data-naya-layer="value"] .dot{background:radial-gradient(circle at 29% 15%,#fff 0 4%,#f7fafc 13%,#c8d0d8 32%,#7f8994 55%,#343b43 76%,#08090b 100%)!important;border-color:#f2f6fa!important}
          .elite-board .layer[data-naya-layer="value"]{border-color:#dfe6ee66!important}
          .top .title{font-size:10px!important;min-width:175px!important;color:#f7f5fa!important;letter-spacing:.08em!important;font-weight:900!important}
          .top .title:after{content:none!important}
          @media(max-width:820px){
            .elite-board:first-child{margin:0 7px 26px!important;padding:34px 18px 38px 26px!important}
            .elite-board:first-child .nutshell{padding:25px 22px 28px!important}
            .elite-board .layerHead{min-height:78px!important;padding:11px 15px 11px 19px!important;gap:14px!important}
            .elite-board .dot{width:58px!important;height:58px!important;flex-basis:58px!important}
            .elite-board .dot .naya-elite-icon{width:40px!important;height:40px!important}
            .elite-board .layerBody{padding:17px 19px 21px!important;font-size:21px!important;line-height:1.58!important}
          }
          </style>'''
          js='''<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V5">
          (()=>{
            const clean=x=>(x||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
            function run(){
              document.querySelectorAll('.elite-board').forEach((b,bi)=>{
                b.querySelectorAll('.nutshellIcon').forEach(e=>e.remove());
                b.querySelectorAll('.nutshell .naya-elite-icon').forEach(e=>e.remove());
                if(bi===0){b.querySelector('.glyph')?.remove();}
                const ls=b.querySelector('.layers'); if(!ls)return;
                [...ls.children].forEach(l=>{
                  const h=l.querySelector('.layerHead b'); const k=clean(h?.textContent);
                  const map={'HUMAN NOTE':'human','CHILD NOTE':'child','GRANDMA NOTE':'grandma','NAYA NOTE':'naya','MACHINE NOTE':'machine','LEARNING LESSON':'learning','WHAT IT MEANS':'meaning','HOW TO APPLY / HOW TO USE':'apply',"WHAT'S IN IT FOR YOU":'value'};
                  if(map[k])l.dataset.nayaLayer=map[k];
                  if(k==='IN A NUTSHELL')l.remove();
                });
                const apply=ls.querySelector('[data-naya-layer="apply"]'),value=ls.querySelector('[data-naya-layer="value"]');
                if(apply)ls.appendChild(apply); if(value)ls.appendChild(value);
              });
              const title=document.querySelector('.top .title');
              if(title){const render=()=>{const d=new Date();title.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d);};render();if(!window.__nayaTimeTimer)window.__nayaTimeTimer=setInterval(render,30000);}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          </script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email 'actions@github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git commit -m 'Refine Smart Board feature hierarchy and jewelry icons V5'
          git push origin HEAD:main
