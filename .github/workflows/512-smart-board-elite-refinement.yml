name: 512 Smart Board Elite Refinement
on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Smart Board elite visual refinement V4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA-SMART-BOARD-ELITE-REFINEMENT-V4'
          if marker in s:
              print('already applied')
              raise SystemExit(0)
          css='''<style id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V4">
          /* FEATURE-FIRST: In a Nutshell is the visual hero. */
          .elite-board:first-child{margin:0 14px 38px!important;padding:58px 52px 64px 60px!important;border-radius:30px!important;border:2px solid #f4f7fa!important;background:radial-gradient(1000px 480px at 48% -10%,#ffffff1b,transparent 58%),linear-gradient(145deg,#191c20,#07080b 72%)!important;box-shadow:inset 0 2px #fff9,0 36px 100px #000f,0 0 75px #fff3!important;transform:translateY(-4px)!important}
          .elite-board:first-child:before{left:9px!important;top:30px!important;bottom:30px!important;width:7px!important;border-radius:99px!important;background:linear-gradient(#fff,#cfd7de,#fff)!important;box-shadow:0 0 28px #fff,0 0 82px #fff9!important}
          .elite-board:first-child .blockTop{align-items:center!important}
          .elite-board:first-child .identity{gap:26px!important}
          .elite-board:first-child .glyph{width:128px!important;height:128px!important;flex-basis:128px!important;border-radius:36px!important;overflow:visible!important;color:#f7fbff!important;background:radial-gradient(circle at 28% 14%,#fff 0 5%,#edf2f5 14%,#aab5bf 35%,#4d5761 55%,#171c21 76%,#050609 100%)!important;border:2px solid #fff!important;box-shadow:inset 0 4px #fff,inset 0 -25px 36px #000d,0 12px 8px #000b,0 34px 58px #000f,0 0 40px #fff,0 0 95px #fff3!important;transform:translateY(-10px) perspective(700px) rotateX(3deg)!important}
          .elite-board:first-child .glyph .naya-elite-icon{width:104px!important;height:104px!important;filter:drop-shadow(0 5px 2px #000c) drop-shadow(0 0 14px #fff9)!important}
          .elite-board:first-child .nutshell{position:relative!important;margin:34px 0 26px!important;padding:34px 38px!important;border:2px solid #f4f7fa!important;border-radius:26px!important;background:radial-gradient(700px 220px at 50% 0%,#ffffff12,transparent 68%),linear-gradient(145deg,#171a1e,#090a0d)!important;box-shadow:inset 0 2px #fff8,inset 0 -18px 32px #0008,0 26px 58px #000f,0 0 48px #fff2!important;min-height:170px!important}
          .elite-board:first-child .nutshell:before{content:'FEATURE · IN A NUTSHELL'!important;display:block!important;margin-bottom:12px!important;color:#fff!important;font-size:10px!important;font-weight:1000!important;letter-spacing:.22em!important}
          .elite-board:first-child .nutshell b{display:none!important}
          .elite-board:first-child .nutshell p{font-size:clamp(21px,1.8vw,29px)!important;line-height:1.7!important;max-width:1200px!important;color:#f6f8fa!important;margin:0!important}
          .elite-board .nutshellIcon,.elite-board .nutshell .naya-elite-icon{display:none!important}
          /* All semantic icons share one sculptural jewelry grammar, but inherit their own semantic color. */
          .elite-board .layerHead{gap:18px!important;min-height:94px!important;padding:14px 22px 14px 28px!important}
          .elite-board .dot{width:64px!important;height:64px!important;flex:0 0 64px!important;border-radius:20px!important;position:relative!important;overflow:visible!important;color:#fff!important;background:radial-gradient(circle at 25% 13%,#fff 0 5%,color-mix(in srgb,var(--layer) 82%,#fff 10%) 17%,color-mix(in srgb,var(--layer) 60%,#08080d) 43%,#050508 79%,#020204 100%)!important;border:2px solid color-mix(in srgb,var(--layer) 88%,#fff 12%)!important;box-shadow:inset 0 4px 0 #fff9,inset 0 -13px 19px #000c,0 8px 5px #000b,0 19px 32px #000f,0 0 34px color-mix(in srgb,var(--layer) 60%,transparent),0 0 75px color-mix(in srgb,var(--layer) 22%,transparent)!important;transform:translateY(-4px) perspective(500px) rotateX(2deg)!important;transition:transform .22s cubic-bezier(.16,.84,.22,1),filter .22s!important}
          .elite-board .dot:before{content:"";position:absolute;inset:-4px;border-radius:24px;border:1px solid color-mix(in srgb,var(--layer) 55%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--layer) 35%,transparent);pointer-events:none}
          .elite-board .dot:after{content:"";position:absolute;inset:6px;border-radius:14px;border:1px solid #ffffff4d;box-shadow:inset 0 1px #fff6;pointer-events:none}
          .elite-board .dot:hover{transform:translateY(-8px) scale(1.035)!important;filter:saturate(1.25) brightness(1.08)!important}
          .elite-board .dot .naya-elite-icon{width:48px!important;height:48px!important;display:block!important;filter:drop-shadow(0 4px 2px #000d) drop-shadow(0 0 11px color-mix(in srgb,var(--layer) 65%,transparent))!important}
          .elite-board .dot svg{width:100%!important;height:100%!important;overflow:visible!important;stroke-width:1.25!important}
          .elite-board .layerHead b{font-size:11px!important;color:#fff!important;letter-spacing:.13em!important}
          /* Gold means gold, not yellow. */
          .elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af37aa!important;box-shadow:inset 0 1px #fff3,0 18px 36px #000c,0 0 32px #d4af3733!important}
          .elite-board .layer[data-naya-layer="apply"] .dot{background:radial-gradient(circle at 25% 13%,#fff 0 5%,#f5d979 17%,#b88a18 45%,#4d3505 72%,#0b0802 100%)!important;border-color:#f4d878!important;box-shadow:inset 0 4px #fff9,inset 0 -13px 19px #000c,0 10px 7px #000b,0 20px 34px #000f,0 0 38px #d4af37aa,0 0 78px #d4af3733!important}
          /* Silver value layer follows gold Apply. */
          .elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important}
          .elite-board .layers{display:flex!important;flex-direction:column!important;gap:12px!important}
          .elite-board .layerBody{padding:18px 24px 23px!important}
          .top .title{font-size:10px!important;min-width:175px!important;color:#f7f5fa!important;letter-spacing:.08em!important;font-weight:900!important}
          .top .title:after{content:none!important}
          @media(max-width:820px){.elite-board:first-child{margin:0 7px 26px!important;padding:40px 20px 46px 30px!important}.elite-board:first-child .glyph{width:96px!important;height:96px!important;flex-basis:96px!important;border-radius:27px!important}.elite-board:first-child .glyph .naya-elite-icon{width:78px!important;height:78px!important}.elite-board:first-child .nutshell{padding:25px 24px!important;min-height:145px!important}.elite-board .dot{width:52px!important;height:52px!important;flex-basis:52px!important}.elite-board .dot .naya-elite-icon{width:39px!important;height:39px!important}}
          </style>'''
          js='''<script id="NAYA-SMART-BOARD-ELITE-REFINEMENT-V4">
          (()=>{
            const clean=x=>(x||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
            const names=['IN A NUTSHELL','HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];
            const tones={HUMAN:'#ff2fa4',CHILD:'#8b42ff',GRANDMA:'#4b5dff',NAYA:'#ff9a5a',MACHINE:'#26c875',LEARNING:'#b8ee57',MEANING:'#f1d75a',APPLY:'#d4af37',VALUE:'#dfe6ee'};
            function run(){
              document.querySelectorAll('.elite-board').forEach((b,bi)=>{
                b.querySelectorAll('.nutshellIcon').forEach(e=>e.remove());
                b.querySelectorAll('.nutshell .naya-elite-icon').forEach(e=>e.remove());
                const ls=b.querySelector('.layers'); if(!ls)return;
                [...ls.children].forEach(l=>{const h=l.querySelector('.layerHead b');const k=clean(h?.textContent);if(k==='IN A NUTSHELL')l.dataset.nayaLayer='nutshell';else if(k==='HUMAN NOTE')l.dataset.nayaLayer='human';else if(k==='CHILD NOTE')l.dataset.nayaLayer='child';else if(k==='GRANDMA NOTE')l.dataset.nayaLayer='grandma';else if(k==='NAYA NOTE')l.dataset.nayaLayer='naya';else if(k==='MACHINE NOTE')l.dataset.nayaLayer='machine';else if(k==='LEARNING LESSON')l.dataset.nayaLayer='learning';else if(k==='WHAT IT MEANS')l.dataset.nayaLayer='meaning';else if(k==='HOW TO APPLY / HOW TO USE')l.dataset.nayaLayer='apply';else if(k==="WHAT'S IN IT FOR YOU")l.dataset.nayaLayer='value';});
                const apply=ls.querySelector('[data-naya-layer="apply"]'),value=ls.querySelector('[data-naya-layer="value"]');
                if(apply)ls.appendChild(apply); if(value)ls.appendChild(value);
              });
              const title=document.querySelector('.top .title');
              if(title){const render=()=>{const d=new Date();title.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d);};render();if(!window.__nayaTimeTimer)window.__nayaTimeTimer=setInterval(render,30000);}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          </script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaPOWER Automation'
          git config user.email 'actions@github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git commit -m 'Refine Smart Board feature hierarchy and jewelry icons'
          git push origin HEAD:main
