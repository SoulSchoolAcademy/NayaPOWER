name: Worker Protocol Gates

# LAW IS CODE — machine enforcement of BRAIN/01-GOVERNANCE/WORKER-PROTOCOL.md.
# Runs on every PR to main. Fast by design: stdlib python3 only, no installs,
# jobs run in parallel. These gates make protocol violations difficult, not
# merely documented.
#
# Gates:
#   receipt              [CODE] PR body has ## Evidence with >=1 LIVE artifact
#                        handle (URL resolves / SHA exists / path exists).
#                        "No receipt, no merge." Dead links fail.
#   no-silent-deletion   [CODE] Every deleted file declared under ## Deletions
#                        with a reason. Kills the stale-head trap that nearly
#                        deleted THE-TUNE-IN-TEMPLATE.md (PR #2136, 2026-10-10).
#   overlap              [ADVISORY] Warns when another open PR touches the same
#                        files. Never blocks — information, not bureaucracy.
#
# Escape hatch: if a gate false-positives, document the drop rationale in the
# merge commit message (the no-silent-deletion gate reads `## Deletions` /
# prose-with-rationale / `Waived-Deletions:` there) plus a note on the live
# board #2537. A gate that blocks good work is a bug — report it, don't
# route around it.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# Rate-limit discipline: a rapid push burst (worker sprints) must not run N
# stale copies of every gate. Only the newest run per PR survives; older
# queued/in-progress runs are cancelled before they burn API calls.
concurrency:
  group: worker-protocol-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  receipt:
    name: Receipt gate (evidence or it didn't happen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 is LOAD-BEARING: check_pr_receipt.py validates
          # 40-char SHAs with `git cat-file -e` against the local store.
          # A depth-1 checkout of the PR merge ref never contains the head
          # commit object, so a CORRECT head SHA always failed the gate.
          # (Sibling jobs already fetch full history for the same reason.)
          fetch-depth: 0
      - name: Validate PR receipt
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/check_pr_receipt.py

  no-silent-deletion:
    name: No silent deletions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deletions are declared
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_pr_deletions.py

  overlap:
    name: Duplicate-work watch (advisory)
    runs-on: ubuntu-latest
    # Rate-limit discipline: this job is the hottest API consumer in the gate
    # suite (1 + N calls, N = open PRs). `edited` events change no files, so
    # they are skipped outright. On synchronize the file set may have
    # changed — but the advisory posts once per PR (marker-gated), so a
    # 1-call marker pre-check skips the N+2-call scan when the warning is
    # already posted. If the API is blind the pre-check degrades to 0 and the
    # scan runs, preserving the script's own graceful-skip behavior.
    if: github.event.action != 'edited'
    steps:
      - name: Check for an already-posted overlap warning (1 API call)
        id: marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
            --jq '[.[] | select(.body != null and (.body | contains("<!-- overlap-watch -->")))] | length' 2>/dev/null || echo 0)
          echo "posted=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.marker.outputs.posted == '0'
        with:
          fetch-depth: 0
      - name: Warn on overlapping open PRs
        if: steps.marker.outputs.posted == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/warn_overlapping_prs.py
