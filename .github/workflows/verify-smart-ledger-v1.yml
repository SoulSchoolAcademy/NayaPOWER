name: Verify Smart Ledger V1

on:
  push:
    branches: [main]
    paths:
      - '.naya/contracts/**'
      - '.naya/runtime/smart_ledger_engine.py'
      - '.naya/runtime/test_smart_ledger_engine.py'
      - '.naya/contracts/PRIMARY-INTELLIGENCE-SYSTEM-CONTRACT-V1.json'
      - 'scripts/build-primary-intelligence-feed.py'
      - 'NAYANET/HUB/**'
      - 'SUPERBRAIN/NAYA-ACTIVITY/**'
      - '.github/workflows/verify-smart-ledger-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile engine
        run: python -m py_compile .naya/runtime/smart_ledger_engine.py
      - name: Run Smart Ledger tests
        working-directory: .naya/runtime
        run: python -m unittest -v test_smart_ledger_engine.py
      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.naya/contracts').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'VALID JSON: {path}')
          PY

  verify-pis:
    name: Verify Primary Intelligence System
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build PIS projection
        run: python3 scripts/build-primary-intelligence-feed.py
      - name: Validate PIS projection
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('NAYANET/HUB/public/intelligence/pis-feed.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['schema_version']=='PIS-1.0'
          assert data['event_count']==len(data['events'])
          ids=[e['event_id'] for e in data['events']]
          assert len(ids)==len(set(ids)), 'duplicate PIS event_id'
          for e in data['events']:
              assert e['event_id']
              assert e['context']['canonical_path'].startswith('.naya/')
              assert e['source']['type']=='smart_note'
          print(f"PIS_PROJECTION=PASS events={len(ids)}")
          PY
      - name: Validate authenticated PIS adapter source
        run: |
          grep -q "@supabase/supabase-js" NAYANET/HUB/src/data/pis.ts
          grep -q "nayanet_intelligence_index" NAYANET/HUB/src/data/pis.ts
          grep -q "auth.getUser" NAYANET/HUB/src/data/pis.ts
          grep -q "PIS_QUERY_LIMIT" NAYANET/HUB/src/data/pis.ts
          grep -q "onAuthStateChange" NAYANET/HUB/src/identity/session.tsx
          grep -q "VITE_SUPABASE_PUBLISHABLE_KEY" NAYANET/HUB/src/identity/session.tsx
          echo 'PIS_AUTHENTICATED_ADAPTER_SOURCE=PASS'
      - name: Install Hub dependencies
        working-directory: NAYANET/HUB
        run: npm install
      - name: Typecheck Hub
        working-directory: NAYANET/HUB
        run: npm run typecheck
      - name: Build Hub from PIS
        working-directory: NAYANET/HUB
        run: npm run build
      - name: Verify PIS feed is in production artifact
        working-directory: NAYANET/HUB
        run: |
          test -f dist/intelligence/pis-feed.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('public/intelligence/pis-feed.json').read_text())
          artifact=json.loads(Path('dist/intelligence/pis-feed.json').read_text())
          assert source['event_count']==artifact['event_count']
          assert [e['event_id'] for e in source['events']]==[e['event_id'] for e in artifact['events']]
          print('PIS_ARTIFACT_PARITY=PASS')
          PY
