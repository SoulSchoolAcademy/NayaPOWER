name: 2026-09-08 Canonical Hub Smart Feed Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  HUB: '2026 09 08 452 NayaNET Hub.html'
  PAYLOAD: '.naya/build/NAYANET-SMART-FEED-MASTER-V1.html'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply canonical Smart Feed master
        shell: python
        run: |
          from pathlib import Path
          import re
          hub=Path('${{ env.HUB }}')
          payload=Path('${{ env.PAYLOAD }}')
          s=hub.read_text(encoding='utf-8')
          p=payload.read_text(encoding='utf-8')
          marker='NAYANET-SMART-FEED-MASTER-V1'
          if marker not in p:
              raise SystemExit('PAYLOAD_MARKER_MISSING')
          s=re.sub(r'<!-- NAYANET SMART FEED MASTER V1 -->[\s\S]*?</script>\s*(?=</head>)','',s,count=1)
          if '</head>' not in s:
              raise SystemExit('HEAD_BOUNDARY_MISSING')
          s=s.replace('</head>',p+'\n</head>',1)
          hub.write_text(s,encoding='utf-8')
          print('SMART_FEED_MASTER_APPLIED=TRUE')

      - name: Verify Smart Feed JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path('${{ env.HUB }}').read_text(encoding='utf-8')
          m=re.search(r'<script id="NAYANET-SMART-FEED-MASTER-V1-RUNTIME">([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('SMART_FEED_RUNTIME_SCRIPT_MISSING')
          Path('/tmp/smart-feed.js').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/smart-feed.js'],text=True,capture_output=True)
          if r.returncode:
              print(r.stdout); print(r.stderr); raise SystemExit('SMART_FEED_JS_SYNTAX_FAILED')
          print('SMART_FEED_JS_SYNTAX=PASS')

      - name: Verify protected house and canonical feed
        shell: bash
        run: |
          set -euo pipefail
          H="$HUB"
          test -s "$H"
          grep -Fq 'NAYANET-SMART-FEED-MASTER-V1' "$H"
          grep -Fq 'id="nayaSmartFeedMaster"' "$H"
          grep -Fq 'ACTIVITY INTELLIGENCE' "$H"
          grep -Fq 'PERSONAL INTELLIGENCE' "$H"
          grep -Fq 'COLLECTIVE INTELLIGENCE' "$H"
          grep -Fq 'class="sidebar"' "$H"
          grep -Fq 'class="homeWorkspace"' "$H"
          grep -Fq 'class="homeFeed"' "$H"
          grep -Fq 'id="page-notes"' "$H"
          grep -Fq 'id="page-collective"' "$H"
          grep -Fq 'id="page-evidence"' "$H"
          grep -Fq 'id="page-connections"' "$H"
          grep -Fq 'id="page-mail"' "$H"
          grep -Fq 'id="page-settings"' "$H"
          echo 'PROTECTED_HOUSE_GATE=PASS'
          echo 'SMART_FEED_GATE=PASS'

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$HUB"
          git diff --cached --quiet && echo 'NO_SOURCE_CHANGE' || git commit -m 'Build canonical NayaNET Smart Feed master'
          git push origin HEAD:main

      - name: Prepare isolated Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf CLOUDFLARE-INTELLIGENT-HUB-V7
          mkdir -p CLOUDFLARE-INTELLIGENT-HUB-V7/public
          cp "$HUB" CLOUDFLARE-INTELLIGENT-HUB-V7/public/index.html
          cat > CLOUDFLARE-INTELLIGENT-HUB-V7/wrangler.jsonc <<'JSON'
          {
            "name": "nayanet-v7-intelligent-hub",
            "compatibility_date": "2026-09-08",
            "assets": { "directory": "./public" }
          }
          JSON
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/public/index.html
          grep -Fq 'NAYANET-SMART-FEED-MASTER-V1' CLOUDFLARE-INTELLIGENT-HUB-V7/public/index.html
          echo 'ARTIFACT_GATE=PASS'

      - name: Deploy exact artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Verify exact public runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 10 --retry-delay 3 'https://nayanet-v7-intelligent-hub.nayanet.workers.dev/?smartfeed=v1' -o /tmp/live
          grep -Fq 'NAYANET-SMART-FEED-MASTER-V1' /tmp/live
          grep -Fq 'id="nayaSmartFeedMaster"' /tmp/live
          grep -Fq 'ACTIVITY INTELLIGENCE' /tmp/live
          grep -Fq 'PERSONAL INTELLIGENCE' /tmp/live
          grep -Fq 'COLLECTIVE INTELLIGENCE' /tmp/live
          grep -Fq 'class="sidebar"' /tmp/live
          echo 'LIVE_SMART_FEED_RUNTIME_VERIFIED=TRUE'
