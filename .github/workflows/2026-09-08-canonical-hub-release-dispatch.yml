name: 2026-09-08 Canonical Hub Release Dispatch

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    if: github.event.issue.title == 'NAYANET-CANONICAL-HUB-RELEASE'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Hub deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-v7-intelligent-hub.yml --ref main
      - name: Close release trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Canonical Hub deployment dispatched. Runtime verification belongs to the deployment workflow."
