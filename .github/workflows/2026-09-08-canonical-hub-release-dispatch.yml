name: Retired Legacy Canonical Hub Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy canonical release retired
        run: |
          echo 'LEGACY_CANONICAL_HUB_RELEASE=RETIRED'
          echo 'CANONICAL_DEPLOYMENT=.github/workflows/deploy-v7-now.yml'
          echo 'CANONICAL_RUNTIME=https://aged-art-7c12.nayanet.workers.dev/'
          echo 'RULE=ONLY_THE_CANONICAL_LIVE_HUB_WORKFLOW_MAY_DEPLOY_THE_CURRENT_452_HUB'
