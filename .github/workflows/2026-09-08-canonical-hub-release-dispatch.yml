name: Retired Legacy Canonical Hub Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy canonical release retired
        run: |
          echo 'LEGACY_CANONICAL_HUB_RELEASE=RETIRED'
          echo 'CANONICAL_DEPLOYMENT=.github/workflows/deploy-nayanet-hub-canonical.yml'
          echo 'CANONICAL_SOURCE=NAYANET/HUB'
          echo 'CANONICAL_RUNTIME=https://aged-art-7c12.nayanet.workers.dev/'
          echo 'RULE=ONE_CURRENT_HUB_DEPLOYMENT_AUTHORITY'
