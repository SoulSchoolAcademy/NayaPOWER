name: Retired Legacy Canonical Hub Vercel Deployment

# Retired: deployment authority is centralized in
# .github/workflows/authorized-vercel-release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy deployment retired
        run: |
          echo 'LEGACY_CANONICAL_HUB_VERCEL_DEPLOYMENT=RETIRED'
          echo 'CANONICAL_DEPLOYMENT=.github/workflows/authorized-vercel-release.yml'
          echo 'RULE=ONE_HUMAN_AUTHORIZED_VERCEL_DEPLOYMENT_CONTROL_PLANE'
