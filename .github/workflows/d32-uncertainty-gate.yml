name: Uncertainty Gate (D32 wire)

# Wires the D32 evidence-bounded uncertainty-propagation engine onto the
# drift-canary governance-verification path. Every uncertainty scenario in
# tools/d32_uncertainty_manifest.json is cold-executed against the REAL
# engine (drift_canary.uncertainty_propagation): modality derivations must
# never upgrade, conflicts must never license conclusions about unrelated
# claims, observation gaps must invalidate only dependent inferences, and
# edge propagation must follow the relationship semantics. A scenario the
# law refuses - an upgraded modality, an explosive inference, a gap that
# erases independent evidence - BLOCKS (exit 1). Before judging, three
# fixed canary probes must pass or the gate fails closed (exit 2): the
# gate never certifies through a blind engine. Empty manifest = explicit
# DORMANT (exit 0), never a false green. Corrupt manifest, unknown
# modality/verdict/kind/relationship/coverage values, or a broken engine =
# fail-closed (exit 2).
#
# OPERATING PATH: the drift-canary governance-verification CI path.
# Trigger: this check on pull_request / push-to-main for the paths
# below. Block: check red blocks the merge path. Defect class:
# uncertainty laundered into certainty by derivation; conclusions
# licensed from unrelated conflicts; independent claims invalidated by
# someone else's observation gap; invented uncertainty vocabulary.
# Verify-still-connected: this file exists and the check runs on the
# drift-canary path; `python tools/d32_uncertainty_gate.py --json`
# exits 0 DORMANT on a claim-free tree.

on:
  pull_request:
    paths:
      - "drift_canary/uncertainty_propagation.py"
      - "drift_canary/uncertainty.py"
      - "drift_canary/propagation.py"
      - "tools/d32_uncertainty_gate.py"
      - "tools/d32_uncertainty_manifest.json"
      - "tests/test_d32_uncertainty_gate.py"
      - ".github/workflows/d32-uncertainty-gate.yml"
  push:
    branches: ["main"]
    paths:
      - "drift_canary/uncertainty_propagation.py"
      - "drift_canary/uncertainty.py"
      - "drift_canary/propagation.py"
      - "tools/d32_uncertainty_gate.py"
      - "tools/d32_uncertainty_manifest.json"
      - "tests/test_d32_uncertainty_gate.py"
      - ".github/workflows/d32-uncertainty-gate.yml"

jobs:
  uncertainty-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Bare setup-python images do not always carry pytest; install it
      # explicitly (same lesson as the sibling wire gates).
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_d32_uncertainty_gate.py -q -p no:cacheprovider
      - run: python tools/d32_uncertainty_gate.py --json
