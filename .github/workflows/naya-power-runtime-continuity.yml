name: Naya Power Runtime Continuity

on:
  push:
    paths:
      - '.naya/runtime/**'
      - '.github/workflows/naya-power-runtime-continuity.yml'
  pull_request:
    paths:
      - '.naya/runtime/**'
      - '.github/workflows/naya-power-runtime-continuity.yml'

jobs:
  continuity-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime slice only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.naya/runtime/
          sparse-checkout-cone-mode: false

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile runtime sources
        run: python -m compileall -q .naya/runtime

      - name: Validate runtime contract JSON
        run: python -m json.tool .naya/runtime/NAYA-POWER-RUNTIME-CONTRACT.json >/dev/null

      - name: Run constitutional kernel self-test
        run: python .naya/runtime/naya_power_kernel.py --self-test

      - name: Run no-dead-end orchestrator self-test
        run: python .naya/runtime/test_naya_power_orchestrator.py

      - name: Run ChatGPT host adapter self-test
        run: python .naya/runtime/test_chatgpt_host_adapter.py

      - name: Run live host bridge self-test
        run: python .naya/runtime/test_naya_power_live.py

      - name: Run execution state machine self-test
        run: python .naya/runtime/execution_controller.py self-test

      - name: Run conservative risk classifier self-test
        run: python .naya/runtime/risk_engine.py self-test

      - name: Run model tool gateway self-test
        run: python .naya/runtime/test_model_tool_gateway.py

      - name: Run executable activation gate
        run: python .naya/runtime/runtime_activation_check.py
