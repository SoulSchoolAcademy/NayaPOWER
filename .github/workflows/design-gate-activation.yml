name: Design and Activation Law Gate

on:
  pull_request:
    paths:
      - "tools/design_gate.py"
      - "tools/qa/**"
      - "smart-blocks/**"
      - ".github/workflows/design-gate-activation.yml"
      - ".github/workflows/naya-activation-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-activation-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design-activation-falsifiers:
    name: Lawful pass + unlawful rejection controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile gate
        run: python -m py_compile tools/design_gate.py
      - name: Run lawful and adversarial falsifiers
        run: python tools/design_gate.py --self-test
      - name: Run independent activation consistency falsifiers from PR #1974
        run: node --test tools/qa/activation_receipt_consistency.test.mjs
      - name: Reject a fabricated receipt through the real CLI path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          repo_id="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .id)"
          test "${#main_sha}" -eq 40
          mkdir -p /tmp/naya-fabricated-receipt
          MAIN_SHA="${main_sha}" REPO_ID="${repo_id}" python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          receipt = {
            "schema":"naya.activation.receipt.v2","status":"ACTIVATED",
            "session_id":"fabricated-ci-control","naya_identity":"fake",
            "human_authority":"fake","repository":os.environ["GITHUB_REPOSITORY"],
            "repository_id":os.environ["REPO_ID"],"job":"fabricated receipt control",
            "gates":["CI"],"proof_plan":"must be rejected",
            "main_sha":os.environ["MAIN_SHA"],"activated_at":datetime.now(timezone.utc).isoformat(),
            "activation_run_id":"999999999999","activation_run_attempt":"1",
            "activation_workflow":".github/workflows/naya-activation-receipt.yml"
          }
          raw=json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()+b"\n"
          open("/tmp/naya-fabricated-receipt/receipt.json","wb").write(raw)
          digest=hashlib.sha256(raw).hexdigest()
          page='''<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><style>html{background:#050507}body{background:#050507;color:#f8f7fb}</style></head><body><!-- NAYA-ACTIVATION-RECEIPT-SHA256:'''+digest+''' --></body></html>'''
          open("/tmp/naya-fabricated-receipt/page.html","w",encoding="utf-8").write(page)
          PY
          if python tools/design_gate.py /tmp/naya-fabricated-receipt/page.html --require-activation --receipt=/tmp/naya-fabricated-receipt/receipt.json --expected-repo="${GITHUB_REPOSITORY}" --expected-repo-id="${repo_id}" --expected-main-sha="${main_sha}"; then
            echo "SECURITY FAILURE: fabricated activation receipt passed the real CLI gate"
            exit 1
          else
            echo "PASS: fabricated receipt rejected by independent GitHub run/artifact provenance"
          fi
