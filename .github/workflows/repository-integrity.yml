name: MAXESS Repository Integrity

on:
  push:
    branches: [maxess-results-v21-working]
  pull_request:
    branches: [maxess-results-v21-working]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository identity and map gate
        run: |
          test "${GITHUB_REPOSITORY}" = "SoulSchoolAcademy/MaxRESULTS"
          test -f README.md
          test -f START-HERE.md
          test -f docs/REPOSITORY-MAP.md
          test -f NAYA-REPO-LOCK.md
          test -f NAYA-OS.md
          test -f docs/SMART-NOTES.md
          test -f docs/smart-notes/INDEX.md
          test -d docs/smart-notes
          test -f docs/MAXESS-RESULTS-PRODUCT-SPEC.md
          test -f docs/DEPLOYMENT-CONTRACT.md
          test -f docs/RELEASE-CHECKLIST.md
          test -f BASELINE-WORKING.html
          test -f tools/nitro_aaa_upgrade.py

      - name: Smart Notes integrity gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          protocol = Path('docs/SMART-NOTES.md').read_text(encoding='utf-8')
          index = Path('docs/smart-notes/INDEX.md').read_text(encoding='utf-8')
          daily_files = sorted(Path('docs/smart-notes').glob('20??-??-??.md'))
          assert 'Default capture law' in protocol
          assert 'Retrieval law' in protocol
          assert 'Smart Notes are **memory, not authority**' in protocol
          assert 'Entry ID' in protocol
          assert 'Keywords' in protocol
          assert 'Every new durable note gets:' in index
          assert daily_files, 'No dated Smart Notes file exists'
          assert re.search(r'SN-\d{8}-\d{3}', index), 'No indexed Smart Notes entry found'
          latest = daily_files[-1].name
          assert latest in index, f'Latest daily Smart Notes file is not indexed: {latest}'
          print('SMART NOTES INTEGRITY GATE: PASS')
          print('latest:', latest)
          PY

      - name: Frozen E01 / active E02 section integrity gate
        run: |
          set -euo pipefail
          E01='E01-SECTION-01-WORKING.html'
          E02='E02-SECTION-02-WORKING.html'
          EXPECTED_E01='c01ba966c4b1439b8b3e95161c6f8316202736d8'
          test -f "$E01"
          test -f "$E02"
          ACTUAL_E01="$(git hash-object "$E01")"
          test "$ACTUAL_E01" = "$EXPECTED_E01"
          python - <<'PY'
          from pathlib import Path
          import re
          e01 = Path('E01-SECTION-01-WORKING.html').read_text(encoding='utf-8')
          e02 = Path('E02-SECTION-02-WORKING.html').read_text(encoding='utf-8')
          assert 'maxess-artifact" content="E01-SECTION-01-WORKING"' in e01
          assert 'maxess-version" content="nitro-e01-v39"' in e01
          assert 'maxess-artifact" content="E02-SECTION-02-WORKING"' in e02
          assert 'MAXESS — Section 02 · Your Five Dimensions' in e02
          assert '<main id="e02"' in e02
          assert 'id="e01"' not in e02
          assert 'E01-SECTION-01-WORKING' not in e02
          assert 'nitro-e01-v39' not in e02
          assert e02.count('id="e02"') == 1
          assert e02.count('id="e02-orbs"') == 1
          for name in ('Direction','Communication','Evaluation','Iteration','Systems Thinking'):
              assert name in e02, f'missing dimension: {name}'
          assert 'window.MAXESS_RESULT' in e02
          assert 'DEMO' not in e02.upper()
          assert 'PLACEHOLDER' not in e02.upper()
          assert 'iframe' not in e02.lower()
          print('FROZEN E01 / ACTIVE E02 INTEGRITY GATE: PASS')
          PY
          echo "E01 blob: $ACTUAL_E01"

      - name: Source authority gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('BASELINE-WORKING.html')
          s = p.read_text(encoding='utf-8')
          assert 'window.MAXESS_RESULT' in s
          assert '<html' in s.lower()
          assert s.lower().count('</html>') == 1
          assert not re.search(r'(^|\n)(<<<<<<<|=======|>>>>>>>)( |\n|$)', s)
          assert len(s.encode()) > 500_000
          assert len(s.splitlines()) > 6500
          print('SOURCE AUTHORITY GATE: PASS')
          print('source:', p)
          print('bytes:', len(s.encode()))
          print('lines:', len(s.splitlines()))
          PY

      - name: Python syntax gate
        run: python -m py_compile tools/*.py

      - name: Runtime contract QA
        run: python tools/qa_v21_runtime_contract.py

      - name: System flow QA
        run: python tools/qa_v21_system_flow.py
