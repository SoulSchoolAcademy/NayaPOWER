name: Build verified AIScore app bridge
on:
  push:
    paths:
      - '.github/workflows/build-aiscore-app-bridge.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from known-good AIScore baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('AIScoreMAXESS code')
          baseline = subprocess.check_output(['git','show','f0b4bf5b8bdc895c9895e235791f97b5b041b00f:AIScoreMAXESS code'], text=True)
          old = '''function finishInterestSelection(){

  DOM.interestsView.classList.remove(
    "visible"
  );

  renderResults();

}'''
          new = '''function finishInterestSelection(){

  publishMAXESSResultToApp();

}'''
          if old not in baseline:
              raise SystemExit('Known-good finishInterestSelection block not found.')
          bridge = r'''

/* =========================================================
   MAXESS_RESULT_V1 — APP RESULTS BRIDGE
========================================================= */

function publishMAXESSResultToApp(){

  const results = calculateResults();

  if(!results || !Array.isArray(results.dimensions) || results.dimensions.length !== 5){
    console.error('MAXESS: unable to build Results payload.');
    return;
  }

  if(!Array.isArray(state.responses) || state.responses.length !== 15){
    console.error('MAXESS: refusing to publish an incomplete assessment.');
    return;
  }

  state.results = results;
  state.status = "completed";
  state.completedAt = new Date().toISOString();

  const contract = {
    contractVersion: "MAXESS_RESULT_V1",
    assessmentId: MAXESS_ASSESSMENT.id,
    assessmentVersion: MAXESS_ASSESSMENT.version,
    completedAt: state.completedAt,
    overallScore: Math.round(Number(results.overall) * 10) / 10,
    masteryStage: results.band && results.band.label ? results.band.label : "",
    masteryBand: results.band || null,
    fiveDimensions: results.dimensions,
    dimensions: results.dimensions,
    responses: state.responses.slice(),
    selectedInterests: Array.from(state.selectedInterests || []),
    naya: {
      name: "Naya",
      image: "https://i.postimg.cc/bw4fyKF8/Naya-Profile-black-face-zoom.jpg"
    }
  };

  if(!Number.isFinite(contract.overallScore) ||
     contract.overallScore < 0 ||
     contract.overallScore > 100 ||
     contract.responses.length !== 15){
    console.error('MAXESS: invalid Results payload.');
    return;
  }

  const json = JSON.stringify(contract);
  const bytes = new TextEncoder().encode(json);
  let binary = "";
  bytes.forEach(byte => binary += String.fromCharCode(byte));
  const encoded = btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");

  try{
    sessionStorage.setItem("MAXESS_RESULT_V1", json);
  }catch(e){}

  try{
    localStorage.setItem("MAXESS_RESULT_V1", json);
  }catch(e){}

  window.MAXESS_RESULT = contract;
  window.dispatchEvent(new CustomEvent("MAXESS_RESULT_READY", {detail:contract}));
  window.dispatchEvent(new CustomEvent("maxess:result-updated", {detail:contract}));

  window.location.assign(
    "https://results.nayanet.app/#maxess-result=" + encoded
  );
}

'''
          marker = '\n</script>'
          if marker not in baseline:
              raise SystemExit('AIScore closing script marker not found.')
          built = baseline.replace(old, new, 1)
          built = built.replace(marker, bridge + marker, 1)
          p.write_text(built, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'https://results.nayanet.app/#maxess-result=' 'AIScoreMAXESS code'
          grep -q 'contractVersion: "MAXESS_RESULT_V1"' 'AIScoreMAXESS code'
          grep -q 'state.responses.length !== 15' 'AIScoreMAXESS code'
          grep -q 'function finishInterestSelection(){' 'AIScoreMAXESS code'
          if grep -q 'results.nayanet.xyz' 'AIScoreMAXESS code'; then exit 1; fi
          if grep -q 'oldResults.style.display' 'AIScoreMAXESS code'; then exit 1; fi
          node --check <(sed -n '/<script>/,/<\/script>/p' 'AIScoreMAXESS code' | sed '1d;$d')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'SoulSchoolAcademy'
          git config user.email '221210320+SoulSchoolAcademy@users.noreply.github.com'
          git add 'AIScoreMAXESS code'
          git commit -m 'Build verified AIScore to Results app bridge' || exit 0
          git push
