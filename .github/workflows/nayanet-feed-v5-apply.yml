name: NayaNET Feed V5 Apply

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Switch authoritative feed runtime to corrected V6
        shell: bash
        run: |
          set -euo pipefail
          for FILE in 'index.html' '2026 09 08 452 NayaNET Hub.html'; do
            test -f "$FILE"
            sed -i 's/nayanet-intelligent-feed-v5\.js/nayanet-intelligent-feed-v6.js/g' "$FILE"
          done
          node --check nayanet-intelligent-feed-v6.js
          grep -q 'nayanet-intelligent-feed-v6.js' index.html
          grep -q 'nayanet-intelligent-feed-v6.js' '2026 09 08 452 NayaNET Hub.html'
      - name: Commit corrected runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '2026 09 08 452 NayaNET Hub.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Correct NayaNET Intelligent Feed V5 runtime'
          git push
