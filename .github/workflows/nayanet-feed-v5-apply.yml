name: NayaNET Feed V5 Apply — Retired

# Historical workflow retained as a record only. It cannot mutate the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'LEGACY_V5_FEED_WORKFLOW=RETIRED'
          echo 'CURRENT_HUB_SOURCE=NAYANET/HUB'
          echo 'RULE=NO_HISTORICAL_FEED_MUTATION'
