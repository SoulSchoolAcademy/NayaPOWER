name: Verify Intelligent Hub Build

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - 'SUPERBRAIN/SMART-NOTES/**'
      - 'SMART FEED CONTENT'
      - 'scripts/build-smart-feed-projection.py'
      - 'scripts/nayanet-cognitive-engine.js'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NAYANET/HUB
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build Hub and PIS
        run: npm run build
      - name: Verify generated PIS survives production build
        run: |
          test -s public/intelligence/pis-feed.json
          test -s dist/intelligence/pis-feed.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('public/intelligence/pis-feed.json'), Path('dist/intelligence/pis-feed.json')]:
              payload = json.loads(path.read_text(encoding='utf-8'))
              count = payload.get('event_count', 0)
              events = payload.get('events', [])
              assert isinstance(events, list) and count == len(events) and count > 0, f'Invalid PIS at {path}'
              print(f'PIS_PROOF path={path} events={count}')
          PY
