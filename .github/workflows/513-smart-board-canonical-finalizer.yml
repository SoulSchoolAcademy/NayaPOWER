name: 513 Smart Board Canonical Finalizer

# DELIBERATE SOURCE MUTATION ONLY
# The Assistant Cloudflare Hub Release workflow is the sole production deployment
# authority for the canonical Hub. This workflow may finalize source on explicit
# dispatch, then the canonical release lane observes the resulting main commit.
# It must never deploy Cloudflare or claim live-runtime authority.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run deterministic source finalizer
        run: python3 tools/finalize-smart-board.py
      - name: Verify canonical source
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          test "$(grep -o 'NAYA-SMART-BOARD-ELITE-REFINEMENT-V10' "$f" | wc -l)" -eq 2
          ! grep -q 'NAYA-SMART-BOARD-V11-GITHUB-FINAL' "$f"
          ! grep -q 'NAYA-SMART-BOARD-V10-SURGICAL-FINAL' "$f"
          ! grep -q 'naya-509-real-smart-feed-' "$f"
          grep -q 'font-size:18px!important' "$f"
          grep -q 'font-size:14px!important' "$f"
          grep -q 'HOW TO APPLY / HOW TO USE' "$f"
          grep -q 'What is Naya Power' "$f"
          grep -q 'LEARNING LESSON' "$f"
          grep -q "WHAT'S IN IT FOR YOU" "$f"
          grep -q 'core' "$f"
          grep -q 'facet' "$f"
          grep -q 'shade' "$f"
          grep -q 'edge' "$f"
      - name: Commit canonical source
        run: |
          set -euo pipefail
          git config user.name 'NayaPOWER Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then
            echo 'NO_CANONICAL_CHANGE'
          else
            git commit -m 'Finalize Smart Board canonical source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Handoff to canonical release lane
        run: |
          echo 'SOURCE_FINALIZATION_VERIFIED'
          echo 'DEPLOYMENT_AUTHORITY=assistant-cloudflare-hub-release.yml'
          echo 'NEXT=CANONICAL_RELEASE_LANE'
