name: Verify NayaNET Authority Grant Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260918170000_authority_grant_runtime_v1.sql'
      - 'docs/NAYA-AUTHORITY-GRANT-ISSUANCE-CONTRACT-V1.md'

permissions:
  contents: read

jobs:
  authority-grant:
    name: Human authorization → grant → validator → BLOCKED/AUTHORIZED
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute authority grant proof
        shell: bash
        run: |
          cat > authority-grant-proof.mjs <<'EOF'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';

          const hub = process.env.HUB_URL;
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          const run = process.env.GITHUB_RUN_ID;
          const probe = 'NayaNET Authority Human ' + Date.now();
          const alias = ('authority' + Date.now()).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
          const dreamReplayId = 'fafd1383-5e18-4732-8938-52e7aedc5a6f';
          const learningEvidenceId = 'a9e40bbc-ce65-4d1b-b34d-4840e2e68dc8';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          const page = await context.newPage();
          await page.goto(hub + '/identity.html?name=' + encodeURIComponent(probe), {waitUntil:'networkidle', timeout:60000});
          await page.locator('#name').fill(probe);
          await page.locator('#alias').fill(alias);
          await page.locator('#enter').click();
          await page.waitForURL(/sparkling-shape-7ae5\\.smartnetpodcast\\.workers\\.dev\\/releases\\//, {waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForLoadState('networkidle', {timeout:60000});

          const result = await page.evaluate(async ({url,key,run,dreamReplayId,learningEvidenceId}) => {
            const sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            const client = sdk.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'nayanet.supabase.auth'}});
            const session = (await client.auth.getSession()).data.session;
            if (!session?.user?.id) throw new Error('AUTH_SESSION_MISSING');
            const uid = session.user.id;

            const lineageReplay = await client.from('nayanet_dream_replays').select('id,user_id,status,source_event_id').eq('id',dreamReplayId).maybeSingle();
            const lineageLearning = await client.from('learning_evidence').select('id,user_id,status,source_event_id').eq('id',learningEvidenceId).maybeSingle();
            if (lineageReplay.error) throw lineageReplay.error;
            if (lineageLearning.error) throw lineageLearning.error;
            if (!lineageReplay.data || !lineageLearning.data) throw new Error('VERIFIED_LINEAGE_NOT_FOUND');
            if (lineageReplay.data.user_id !== lineageLearning.data.user_id) throw new Error('LINEAGE_OWNER_MISMATCH');

            const existing = await client.from('nayanet_authority_grants').select('grant_id,source_event_id,evidence').or('source_event_id.eq.' + encodeURIComponent(lineageReplay.data.source_event_id) + ',source_event_id.eq.' + encodeURIComponent(lineageLearning.data.source_event_id));
            if (existing.error) throw existing.error;
            const lineageGrantMatches = (existing.data||[]).filter(g => JSON.stringify(g.evidence||{}).includes(dreamReplayId) || JSON.stringify(g.evidence||{}).includes(learningEvidenceId));

            const noGrantId = crypto.randomUUID();
            const noGrant = await client.rpc('nayanet_validate_authority_grant',{p_grant_id:noGrantId,p_action:'proof.authorize',p_target:'NayaNET'});
            if (noGrant.error) throw noGrant.error;
            if (noGrant.data?.status !== 'BLOCKED') throw new Error('NO_GRANT_NOT_BLOCKED:' + JSON.stringify(noGrant.data));

            const sourceEvent = 'human-authorization-' + run + '-' + crypto.randomUUID();
            const issued = await client.rpc('nayanet_issue_authority_grant',{
              p_subject_id:uid,
              p_source_event_id:sourceEvent,
              p_mission_id:'NayaNET Authority Grant Proof / Mission + Authorized Actions',
              p_scope:{project_id:'NayaNET',target:'NayaNET'},
              p_actions:['proof.authorize'],
              p_constraints:{mode:'verification-only',no_external_side_effects:true},
              p_expires_at:new Date(Date.now()+10*60*1000).toISOString(),
              p_evidence:{authorization_type:'explicit_human_name_first_session',mission_semantics:'Mission + Authorized Actions',run_id:run},
              p_parent_authority:null
            });
            if (issued.error) throw issued.error;
            const grant = issued.data;
            if (!grant?.grant_id) throw new Error('GRANT_NOT_ISSUED');
            if (grant.issuer_id !== uid || grant.subject_id !== uid) throw new Error('ISSUER_SUBJECT_LINEAGE_MISMATCH');

            const authorized = await client.rpc('nayanet_validate_authority_grant',{p_grant_id:grant.grant_id,p_action:'proof.authorize',p_target:'NayaNET'});
            if (authorized.error) throw authorized.error;
            if (authorized.data?.status !== 'AUTHORIZED') throw new Error('VALID_GRANT_NOT_AUTHORIZED:' + JSON.stringify(authorized.data));
            if (authorized.data?.issuer_id !== uid || authorized.data?.subject_id !== uid) throw new Error('VALIDATOR_IDENTITY_MISMATCH');

            const wrongAction = await client.rpc('nayanet_validate_authority_grant',{p_grant_id:grant.grant_id,p_action:'proof.other',p_target:'NayaNET'});
            if (wrongAction.error) throw wrongAction.error;
            if (wrongAction.data?.status !== 'BLOCKED' || wrongAction.data?.reason !== 'ACTION_OUT_OF_SCOPE') throw new Error('WRONG_ACTION_NOT_BLOCKED:' + JSON.stringify(wrongAction.data));

            const wrongTarget = await client.rpc('nayanet_validate_authority_grant',{p_grant_id:grant.grant_id,p_action:'proof.authorize',p_target:'OTHER_TARGET'});
            if (wrongTarget.error) throw wrongTarget.error;
            if (wrongTarget.data?.status !== 'BLOCKED' || wrongTarget.data?.reason !== 'TARGET_OUT_OF_SCOPE') throw new Error('WRONG_TARGET_NOT_BLOCKED:' + JSON.stringify(wrongTarget.data));

            const revoked = await client.rpc('nayanet_revoke_authority_grant',{p_grant_id:grant.grant_id,p_evidence:{reason:'proof-revocation'}});
            if (revoked.error) throw revoked.error;
            const afterRevoke = await client.rpc('nayanet_validate_authority_grant',{p_grant_id:grant.grant_id,p_action:'proof.authorize',p_target:'NayaNET'});
            if (afterRevoke.error) throw afterRevoke.error;
            if (afterRevoke.data?.status !== 'BLOCKED' || afterRevoke.data?.reason !== 'GRANT_REVOKED') throw new Error('REVOCATION_NOT_BLOCKED:' + JSON.stringify(afterRevoke.data));

            const expiring = await client.rpc('nayanet_issue_authority_grant',{
              p_subject_id:uid,
              p_source_event_id:'human-authorization-expiry-' + run + '-' + crypto.randomUUID(),
              p_mission_id:'NayaNET Authority Grant Expiration Proof',
              p_scope:{project_id:'NayaNET',target:'NayaNET'},
              p_actions:['proof.expire'],
              p_constraints:{mode:'verification-only'},
              p_expires_at:new Date(Date.now()+1200).toISOString(),
              p_evidence:{authorization_type:'explicit_human_name_first_session',run_id:run},
              p_parent_authority:null
            });
            if (expiring.error) throw expiring.error;
            await new Promise(r=>setTimeout(r,1800));
            const afterExpiry = await client.rpc('nayanet_validate_authority_grant',{p_grant_id:expiring.data.grant_id,p_action:'proof.expire',p_target:'NayaNET'});
            if (afterExpiry.error) throw afterExpiry.error;
            if (afterExpiry.data?.status !== 'BLOCKED' || afterExpiry.data?.reason !== 'GRANT_EXPIRED') throw new Error('EXPIRATION_NOT_BLOCKED:' + JSON.stringify(afterExpiry.data));

            const receiptCols = await client.from('nayanet_execution_receipts').select('authority_grant_id,authority_issuer_id,authority_scope,authority_actions,authority_constraints,authority_status_at_execution,authority_source_event_id,authority_validated_at').limit(1);
            if (receiptCols.error) throw receiptCols.error;

            return {
              status:'VERIFIED',
              user_id:uid,
              is_anonymous:session.user.is_anonymous===true,
              lineage:{dream_replay_id:dreamReplayId,learning_evidence_id:learningEvidenceId,owner_match:lineageReplay.data.user_id===uid || lineageLearning.data.user_id===uid,lineage_grant_matches:lineageGrantMatches.length},
              no_grant:{status:noGrant.data.status,reason:noGrant.data.reason},
              human_issued_grant:{grant_id:grant.grant_id,issuer_id:grant.issuer_id,subject_id:grant.subject_id,source_event_id:grant.source_event_id,mission_id:grant.mission_id,scope:grant.scope,actions:grant.actions,constraints:grant.constraints,status:grant.status},
              valid_grant:{status:authorized.data.status,reason:authorized.data.reason},
              wrong_action:{status:wrongAction.data.status,reason:wrongAction.data.reason},
              wrong_target:{status:wrongTarget.data.status,reason:wrongTarget.data.reason},
              revoked:{status:afterRevoke.data.status,reason:afterRevoke.data.reason},
              expired:{status:afterExpiry.data.status,reason:afterExpiry.data.reason},
              receipt_provenance_columns_present:Array.isArray(receiptCols.data)
            };
          }, {url,key,run,dreamReplayId,learningEvidenceId});

          console.log('AUTHORITY_GRANT_PROOF=' + JSON.stringify(result));
          if (result.status !== 'VERIFIED') throw new Error('AUTHORITY_GRANT_PROOF_FAILED');
          if (result.lineage.lineage_grant_matches !== 0) throw new Error('DREAM_LEARNING_LINEAGE_HAS_AUTHORITY_GRANT');
          if (result.no_grant.status !== 'BLOCKED') throw new Error('NO_GRANT_NOT_BLOCKED');
          if (result.valid_grant.status !== 'AUTHORIZED') throw new Error('VALID_GRANT_NOT_AUTHORIZED');
          if (result.revoked.status !== 'BLOCKED' || result.expired.status !== 'BLOCKED') throw new Error('LIFECYCLE_GATES_FAILED');
          if (!result.receipt_provenance_columns_present) throw new Error('RECEIPT_PROVENANCE_SCHEMA_MISSING');
          console.log('AUTHORITY_GRANT_NO_GRANT=BLOCKED');
          console.log('AUTHORITY_GRANT_REAL_HUMAN=AUTHORIZED');
          console.log('AUTHORITY_GRANT_WRONG_ACTION=BLOCKED');
          console.log('AUTHORITY_GRANT_WRONG_TARGET=BLOCKED');
          console.log('AUTHORITY_GRANT_REVOKED=BLOCKED');
          console.log('AUTHORITY_GRANT_EXPIRED=BLOCKED');
          console.log('AUTHORITY_GRANT_DREAM_LEARNING=BLOCKED');
          await browser.close();
          EOF
          node authority-grant-proof.mjs
