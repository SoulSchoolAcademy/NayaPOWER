name: Verify NayaNET Authority Grant Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260918170000_authority_grant_runtime_v1.sql'
      - 'supabase/migrations/20260918172000_lock_authority_grant_mutation_to_transactions.sql'
      - 'docs/NAYA-AUTHORITY-GRANT-ISSUANCE-CONTRACT-V1.md'
      - 'supabase/migrations/20260918180000_wire_authority_grant_into_commit_cognition.sql'
      - '.github/workflows/verify-authority-grant-runtime.yml'

permissions:
  contents: read

jobs:
  authority-grant:
    name: Human authorization → grant → validator → BLOCKED/AUTHORIZED
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute authority grant proof
        shell: bash
        run: |
          cat > authority-grant-proof.mjs <<'EOF'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          const hub=process.env.HUB_URL,url=process.env.SUPABASE_URL,key=process.env.SUPABASE_PUBLISHABLE_KEY,run=process.env.GITHUB_RUN_ID;
          const probe='NayaNET Authority Human '+Date.now(); const alias=('authority'+Date.now()).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
          const dreamReplayId=null,learningEvidenceId=null;
          const browser=await chromium.launch({headless:true}),context=await browser.newContext(),page=await context.newPage();
          await page.goto(hub+'/identity.html?name='+encodeURIComponent(probe),{waitUntil:'networkidle',timeout:60000});
          await page.locator('#name').fill(probe); await page.locator('#alias').fill(alias); await page.locator('#enter').click();
          await page.waitForURL(url => url.hostname === 'sparkling-shape-7ae5.smartnetpodcast.workers.dev' && url.pathname.includes('/releases/'),{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForLoadState('networkidle',{timeout:60000});
          const result=await page.evaluate(async ({url,key,run,dreamReplayId,learningEvidenceId})=>{
            const sdk=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            const client=sdk.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'nayanet.supabase.auth'}});
            const session=(await client.auth.getSession()).data.session; if(!session?.user?.id) throw new Error('AUTH_SESSION_MISSING'); const uid=session.user.id;
            const replayQ=await client.from('nayanet_dream_replays').select('id,user_id,status,source_event_id').eq('user_id',uid).order('created_at',{ascending:false}).limit(1).maybeSingle();
            const learningQ=await client.from('learning_evidence').select('id,user_id,status,source_event_id').eq('user_id',uid).order('created_at',{ascending:false}).limit(1).maybeSingle();
            if(replayQ.error)throw replayQ.error;if(learningQ.error)throw learningQ.error;if(!replayQ.data||!learningQ.data)throw new Error('VERIFIED_LINEAGE_NOT_FOUND');
            const replay=replayQ, learning=learningQ;
            if(replay.data.user_id!==learning.data.user_id)throw new Error('LINEAGE_OWNER_MISMATCH');
            const grantLineageQ=await client.from('nayanet_authority_grants').select('grant_id,source_event_id').eq('issuer_id',uid).or('source_event_id.eq.'+encodeURIComponent(replay.data.source_event_id)+',source_event_id.eq.'+encodeURIComponent(learning.data.source_event_id));
            if(grantLineageQ.error)throw grantLineageQ.error;
            if((grantLineageQ.data||[]).length!==0)throw new Error('DREAM_LEARNING_LINEAGE_AUTHORITY_CONTAMINATION');
            const noGrant=await client.rpc('nayanet_validate_authority_grant',{p_grant_id:crypto.randomUUID(),p_action:'proof.authorize',p_target:'NayaNET'}); if(noGrant.error)throw noGrant.error;
            if(noGrant.data?.status!=='BLOCKED')throw new Error('NO_GRANT_NOT_BLOCKED');
            const issued=await client.rpc('nayanet_issue_authority_grant',{p_subject_id:uid,p_source_event_id:'human-authorization-'+run+'-'+crypto.randomUUID(),p_mission_id:'NayaNET Authority Grant Proof / Mission + Authorized Actions',p_scope:{project_id:'NayaNET',target:'NayaNET'},p_actions:['proof.authorize'],p_constraints:{mode:'verification-only',no_external_side_effects:true},p_expires_at:new Date(Date.now()+10*60*1000).toISOString(),p_evidence:{authorization_type:'explicit_human_name_first_session',mission_semantics:'Mission + Authorized Actions',run_id:run},p_parent_authority:null});
            if(issued.error)throw issued.error; const grant=issued.data; if(!grant?.grant_id)throw new Error('GRANT_NOT_ISSUED'); if(grant.issuer_id!==uid||grant.subject_id!==uid)throw new Error('ISSUER_SUBJECT_LINEAGE_MISMATCH');
            const authorized=await client.rpc('nayanet_validate_authority_grant',{p_grant_id:grant.grant_id,p_action:'proof.authorize',p_target:'NayaNET'}); if(authorized.error)throw authorized.error;
            const wrongAction=await client.rpc('nayanet_validate_authority_grant',{p_grant_id:grant.grant_id,p_action:'proof.other',p_target:'NayaNET'}); if(wrongAction.error)throw wrongAction.error;
            const wrongTarget=await client.rpc('nayanet_validate_authority_grant',{p_grant_id:grant.grant_id,p_action:'proof.authorize',p_target:'OTHER_TARGET'}); if(wrongTarget.error)throw wrongTarget.error;
            const revoked=await client.rpc('nayanet_revoke_authority_grant',{p_grant_id:grant.grant_id,p_evidence:{reason:'proof-revocation'}}); if(revoked.error)throw revoked.error;
            const afterRevoke=await client.rpc('nayanet_validate_authority_grant',{p_grant_id:grant.grant_id,p_action:'proof.authorize',p_target:'NayaNET'}); if(afterRevoke.error)throw afterRevoke.error;
            const expiring=await client.rpc('nayanet_issue_authority_grant',{p_subject_id:uid,p_source_event_id:'human-authorization-expiry-'+run+'-'+crypto.randomUUID(),p_mission_id:'NayaNET Authority Grant Expiration Proof',p_scope:{project_id:'NayaNET',target:'NayaNET'},p_actions:['proof.expire'],p_constraints:{mode:'verification-only'},p_expires_at:new Date(Date.now()+1200).toISOString(),p_evidence:{authorization_type:'explicit_human_name_first_session',run_id:run},p_parent_authority:null}); if(expiring.error)throw expiring.error;
            await new Promise(r=>setTimeout(r,1800)); const afterExpiry=await client.rpc('nayanet_validate_authority_grant',{p_grant_id:expiring.data.grant_id,p_action:'proof.expire',p_target:'NayaNET'}); if(afterExpiry.error)throw afterExpiry.error;
            const receiptCols=await client.from('nayanet_execution_receipts').select('authority_grant_id,authority_issuer_id,authority_scope,authority_actions,authority_constraints,authority_status_at_execution,authority_source_event_id,authority_validated_at').limit(1); if(receiptCols.error)throw receiptCols.error;
            return {status:'VERIFIED',user_id:uid,is_anonymous:session.user.is_anonymous===true,lineage:{dream_replay_id:replay.data.id,learning_evidence_id:learning.data.id,owner_match:replay.data.user_id===learning.data.user_id,lineage_grant_matches:(grantLineageQ.data||[]).length},no_grant:noGrant.data,human_issued_grant:{grant_id:grant.grant_id,issuer_id:grant.issuer_id,subject_id:grant.subject_id,source_event_id:grant.source_event_id,mission_id:grant.mission_id,scope:grant.scope,actions:grant.actions,constraints:grant.constraints,status:grant.status},valid_grant:authorized.data,wrong_action:wrongAction.data,wrong_target:wrongTarget.data,revoked:afterRevoke.data,expired:afterExpiry.data,receipt_provenance_columns_present:Array.isArray(receiptCols.data)};
          },{url,key,run,dreamReplayId,learningEvidenceId});
          console.log('AUTHORITY_GRANT_PROOF='+JSON.stringify(result));
          if(result.status!=='VERIFIED')throw new Error('AUTHORITY_GRANT_PROOF_FAILED');
          if(result.lineage.lineage_grant_matches!==0||!result.lineage.owner_match)throw new Error('DREAM_LEARNING_LINEAGE_AUTHORITY_CONTAMINATION');
          if(result.no_grant.status!=='BLOCKED')throw new Error('NO_GRANT_NOT_BLOCKED');
          if(result.valid_grant.status!=='AUTHORIZED')throw new Error('VALID_GRANT_NOT_AUTHORIZED');
          if(result.wrong_action.status!=='BLOCKED'||result.wrong_target.status!=='BLOCKED')throw new Error('SCOPE_GATES_FAILED');
          if(result.revoked.status!=='BLOCKED'||result.expired.status!=='BLOCKED')throw new Error('LIFECYCLE_GATES_FAILED');
          if(!result.receipt_provenance_columns_present)throw new Error('RECEIPT_PROVENANCE_SCHEMA_MISSING');
          console.log('AUTHORITY_GRANT_NO_GRANT=BLOCKED'); console.log('AUTHORITY_GRANT_REAL_HUMAN=AUTHORIZED'); console.log('AUTHORITY_GRANT_WRONG_ACTION=BLOCKED'); console.log('AUTHORITY_GRANT_WRONG_TARGET=BLOCKED'); console.log('AUTHORITY_GRANT_REVOKED=BLOCKED'); console.log('AUTHORITY_GRANT_EXPIRED=BLOCKED'); console.log('AUTHORITY_GRANT_DREAM_LEARNING=BLOCKED');
          await browser.close();
          EOF
          set +e
          node authority-grant-proof.mjs 2>&1 | tee authority-grant-runtime.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload runtime failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-grant-runtime-log
          path: authority-grant-runtime.log
          if-no-files-found: warn
