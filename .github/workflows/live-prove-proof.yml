name: Live PROVE Node Proof

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  LAW_RUNTIME: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-law-runtime
  KNOW_RUNTIME: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-know-runtime
  PROVE_RUNTIME: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-prove-runtime

jobs:
  evidence-assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Mint governed organism identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"

      - name: LAW authorizes bounded parent application context
        shell: bash
        run: |
          set -euo pipefail
          cat > law-request.json <<'JSON'
          {
            "mode":"evaluate",
            "request":{
              "action":"naya_node_apply",
              "target":"NAYA-NODE-0001",
              "project_id":"NayaNET",
              "resource_scope":"PROVE_EVIDENCE_ASSESSMENT",
              "privacy":"PRIVATE"
            }
          }
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @law-request.json "$LAW_RUNTIME" > law-authorized.json
          python - <<'PY'
          import json
          x=json.load(open("law-authorized.json"))
          assert x["ok"] is True, x
          assert x["decision"]["status"]=="AUTHORIZED", x
          json.dump({"law_receipt_id":x["receipt"]["id"]},open("ids.json","w"),indent=2)
          PY

      - name: KNOW creates positive contextual evidence handoff
        shell: bash
        run: |
          set -euo pipefail
          law_id="$(python -c 'import json; print(json.load(open("ids.json"))["law_receipt_id"])')"
          cat > know-positive-request.json <<JSON
          {
            "mode":"retrieve",
            "law_receipt_id":"$law_id",
            "task_id":"PROVE-PROVENANCE-HELDOUT-001",
            "task_class":"RELATED_HELDOUT",
            "required_capability":"provenance_preservation"
          }
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @know-positive-request.json "$KNOW_RUNTIME" > know-positive.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json")); x=json.load(open("know-positive.json"))
          assert x["ok"] is True and x["result"]["status"]=="HIT", x
          ids["positive_know_receipt_id"]=x["receipt"]["id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY

      - name: PROVE derives bounded evidence-backed claim
        shell: bash
        run: |
          set -euo pipefail
          know_id="$(python -c 'import json; print(json.load(open("ids.json"))["positive_know_receipt_id"])')"
          cat > prove-positive-request.json <<JSON
          {"mode":"assess","know_receipt_id":"$know_id"}
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @prove-positive-request.json "$PROVE_RUNTIME" > prove-positive.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json")); x=json.load(open("prove-positive.json"))
          assert x["ok"] is True, x
          a=x["assessment"]
          assert x["status"]=="PROVE_SUPPORTED", x
          assert a["state"]=="ASSESSED" and a["epistemic_state"]=="SUPPORTED", a
          assert a["claim_strength"]=="MODERATE" and a["evidence_strength"]=="STRONG", a
          assert a["proof_creates_authority"] is False, a
          assert a["handoff_to"]=="NAYA-KERNEL-CONNECT", a
          assert "causality" in " ".join(a["limitations"]).lower(), a
          ids["positive_prove_receipt_id"]=x["receipt"]["id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY

      - name: KNOW creates unrelated bounded MISS
        shell: bash
        run: |
          set -euo pipefail
          law_id="$(python -c 'import json; print(json.load(open("ids.json"))["law_receipt_id"])')"
          cat > know-negative-request.json <<JSON
          {
            "mode":"retrieve",
            "law_receipt_id":"$law_id",
            "task_id":"PROVE-UNRELATED-ARITHMETIC-001",
            "task_class":"UNRELATED_NEGATIVE_TRANSFER",
            "required_capability":"arithmetic_only"
          }
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @know-negative-request.json "$KNOW_RUNTIME" > know-negative.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json")); x=json.load(open("know-negative.json"))
          assert x["ok"] is True and x["result"]["status"]=="MISS", x
          ids["negative_know_receipt_id"]=x["receipt"]["id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY

      - name: PROVE refuses to promote a KNOW miss
        shell: bash
        run: |
          set -euo pipefail
          know_id="$(python -c 'import json; print(json.load(open("ids.json"))["negative_know_receipt_id"])')"
          cat > prove-negative-request.json <<JSON
          {"mode":"assess","know_receipt_id":"$know_id"}
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @prove-negative-request.json "$PROVE_RUNTIME" > prove-negative.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json")); x=json.load(open("prove-negative.json"))
          assert x["ok"] is True, x
          a=x["assessment"]
          assert x["status"]=="PROVE_NOT_PROMOTED", x
          assert a["epistemic_state"]=="UNVERIFIED", a
          assert a["failure_reason"]=="KNOW_HIT_REQUIRED", a
          assert a["handoff_to"] is None, a
          assert x["receipt"]["status"]=="BLOCKED", x
          ids["negative_prove_receipt_id"]=x["receipt"]["id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: prove-primary-proof
          path: |
            law-authorized.json
            know-positive.json
            know-negative.json
            prove-positive.json
            prove-negative.json
            ids.json

  independent-prove-verification:
    needs: evidence-assessment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prove-primary-proof

      - name: Mint fresh independent verifier identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"

      - name: Independently recompute positive PROVE assessment
        shell: bash
        run: |
          set -euo pipefail
          prove_id="$(python -c 'import json; print(json.load(open("ids.json"))["positive_prove_receipt_id"])')"
          cat > inspect-positive.json <<JSON
          {"mode":"inspect","prove_receipt_id":"$prove_id"}
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @inspect-positive.json "$PROVE_RUNTIME" > verified-positive.json
          python - <<'PY'
          import json
          x=json.load(open("verified-positive.json"))
          assert x["ok"] is True and x["independent_verification"] is True, x
          assert x["assessment_integrity_state"]=="VERIFIED", x
          assert x["claim_epistemic_state"]=="SUPPORTED", x
          assert x["executor_claim_trusted_as_verification"] is False, x
          assert x["proof_creates_authority"] is False, x
          PY

      - name: Independently recompute negative non-promotion
        shell: bash
        run: |
          set -euo pipefail
          prove_id="$(python -c 'import json; print(json.load(open("ids.json"))["negative_prove_receipt_id"])')"
          cat > inspect-negative.json <<JSON
          {"mode":"inspect","prove_receipt_id":"$prove_id"}
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @inspect-negative.json "$PROVE_RUNTIME" > verified-negative.json
          python - <<'PY'
          import json
          x=json.load(open("verified-negative.json"))
          assert x["ok"] is True and x["independent_verification"] is True, x
          assert x["assessment_integrity_state"]=="VERIFIED", x
          assert x["claim_epistemic_state"]=="UNVERIFIED", x
          assert x["recomputed"]["handoff_to"] is None, x
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: prove-independent-proof
          path: |
            verified-positive.json
            verified-negative.json
