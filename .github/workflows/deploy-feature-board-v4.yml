name: 509 — Feature Board V4 Runtime Verification
on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V4.js'
      - '.github/workflows/deploy-feature-board-v4.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_NAME: sparkling-shape-7ae5
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('release/public/index.html'); h=p.read_text(encoding='utf-8')
          h=re.sub(r'<script[^>]+509-AAA-SMART-NOTE-CANONICAL-RENDERER\\.js[^>]*></script>','',h)
          h=re.sub(r'<script[^>]+509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR\\.js[^>]*></script>','',h)
          v4=Path('NAYANET/509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V4.js').read_text(encoding='utf-8').replace('</script>','<\\/script>')
          scripts='<script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260914-semantic-v3"></script><script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js?v=20260915-title-lock-v5"></script><script src="/NAYANET/509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js?v=20260915-feature-board-v2"></script><script>'+v4+'</script>'
          h=h.replace('</body>',scripts+'</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const r=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$GITHUB_SHA"}}
          EOF
          echo BUILD=PASS
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p && cd /tmp/p
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > v.mjs <<'EOF'
          import {chromium} from 'playwright'; const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:1440,height:1400}}); p.on('pageerror',e=>console.log('PAGEERROR='+e.message)); p.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR='+m.text())}); await p.goto(process.env.RUNTIME+'/?v4='+Date.now(),{waitUntil:'domcontentloaded'}); await p.waitForTimeout(11000); const r=await p.evaluate(()=>({notes:[...document.querySelectorAll('.block[data-real-smart-note]')].map(b=>({title:b.querySelector('h3')?.textContent.trim(),layers:[...b.querySelectorAll('.layer')].map(x=>x.dataset.semanticLayer),eighth:b.querySelectorAll('.layer')[7]?.querySelector('.layerBody')?.textContent||''})),completion:window.NAYA509_FEATURE_RUNTIME_COMPLETION})); console.log(JSON.stringify(r)); if(r.notes.length!==9||r.notes.some(n=>n.layers.length!==11))throw Error('LAYER_COUNT'); if(r.notes.some(n=>JSON.stringify(n.layers)!==JSON.stringify(['nutshell','human','child','grandma','naya','machine','learning','meaning','connect','apply','benefit'])))throw Error('LAYER_KEYS'); if(r.completion!=='v4+canonical-sections-9-11')throw Error('COMPLETION'); await b.close(); console.log('BROWSER_RUNTIME_VERIFICATION=PASS');
          EOF
          RUNTIME="$RUNTIME" node v.mjs
