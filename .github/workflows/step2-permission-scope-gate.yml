name: Step 2 Permission Scope Gate

on:
  push:
    branches: [main]
    paths:
      - '.naya/memory/permission_scope.py'
      - '.naya/memory/smart_notes_v3.py'
      - '.naya/memory/tests/test_permission_scope.py'
      - '.naya/memory/test_smart_brain_v3.py'
      - '.github/workflows/step2-permission-scope-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Python syntax gate
        run: python -m py_compile .naya/memory/permission_scope.py .naya/memory/smart_notes_v3.py .naya/memory/tests/test_permission_scope.py .naya/memory/test_smart_brain_v3.py
      - name: Ten adversarial permission tests
        run: python -m unittest discover -s .naya/memory/tests -p 'test_*.py' -v
      - name: Smart Brain regression suite
        run: python .naya/memory/test_smart_brain_v3.py -v
      - name: Canonical validation regression
        run: python .naya/memory/smart_notes_v3.py validate
