# Authoritative Step 2 rerun marker: execute the complete permission/scope gate against current main.
name: Step 2 Permission Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.naya/memory/permission_scope.py'
      - '.naya/memory/smart_notes_v3.py'
      - '.naya/memory/tests/test_permission_scope.py'
      - '.naya/memory/test_smart_brain_v3.py'
      - '.naya/memory/events/INDEX.json'
      - '.github/workflows/step2-permission-scope-gate.yml'
  push:
    branches: [main]
    paths:
      - '.naya/memory/permission_scope.py'
      - '.naya/memory/smart_notes_v3.py'
      - '.naya/memory/tests/test_permission_scope.py'
      - '.naya/memory/test_smart_brain_v3.py'
      - '.naya/memory/events/INDEX.json'
      - '.github/workflows/step2-permission-scope-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Rebuild canonical event index
        run: python .naya/memory/smart_notes_v3.py index
      - name: Python syntax gate
        run: python -m py_compile .naya/memory/permission_scope.py .naya/memory/smart_notes_v3.py .naya/memory/tests/test_permission_scope.py .naya/memory/test_smart_brain_v3.py
      - name: Ten adversarial permission tests
        run: python -m unittest discover -s .naya/memory/tests -p 'test_*.py' -v
      - name: Smart Brain regression suite
        run: python .naya/memory/test_smart_brain_v3.py -v
      - name: Canonical validation regression
        run: python .naya/memory/smart_notes_v3.py validate
      - name: Emit Step 2 execution evidence
        run: |
          python -m unittest discover -s .naya/memory/tests -p 'test_*.py' -v 2>&1 | tee .naya/memory/STEP-2-TEST-OUTPUT.txt
          git rev-parse HEAD > .naya/memory/STEP-2-TEST-COMMIT.txt
      - name: Upload Step 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step-2-permission-scope-evidence
          path: |
            .naya/memory/STEP-2-TEST-OUTPUT.txt
            .naya/memory/STEP-2-TEST-COMMIT.txt
            .naya/memory/events/INDEX.json
