name: Naya Power Memory + Restore Runtime

on:
  push:
    branches: [main]
    paths:
      - '.naya/memory/**'
      - '.naya/runtime/restore_context.py'
      - '.naya/runtime/test_restore_context.py'
      - '.naya/checkpoints/**'
      - '.naya/handoffs/**'
      - '.naya/naya-context-manifest.json'
      - '.naya/NAYA-CONTEXT-BOOT-PROTOCOL.md'
      - 'README.md'
      - '.github/workflows/naya-memory-runtime.yml'
  pull_request:
    paths:
      - '.naya/memory/**'
      - '.naya/runtime/restore_context.py'
      - '.naya/runtime/test_restore_context.py'
      - '.naya/checkpoints/**'
      - '.naya/handoffs/**'
      - '.naya/naya-context-manifest.json'
      - '.naya/NAYA-CONTEXT-BOOT-PROTOCOL.md'
      - 'README.md'
      - '.github/workflows/naya-memory-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact target context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Assert exact target commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$TARGET_SHA"
          echo "Exact target commit verified: $actual"

      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('.naya/memory/note.schema.json'),
              Path('.naya/memory/INDEX.json'),
              Path('.naya/memory/RETRIEVAL-MANIFEST.json'),
              Path('.naya/memory/STATE.json'),
              Path('.naya/naya-context-manifest.json'),
          ]
          for p in paths:
              json.loads(p.read_text(encoding='utf-8'))
              print('VALID JSON:', p)
          PY

      - name: Run Smart Note validator
        working-directory: .naya/memory
        run: python memory_runtime.py validate

      - name: Run Smart Note tests
        working-directory: .naya/memory
        run: python -m unittest -v test_memory_runtime.py

      - name: Run Restore Context tests
        working-directory: .naya/runtime
        run: python -m unittest -v test_restore_context.py

      - name: Execute current Restore Context
        run: python .naya/runtime/restore_context.py restore --pretty

      - name: Execute historical Restore Context
        run: |
          HISTORICAL_AT="$(git log -1 --format=%cI HEAD~5)"
          echo "Historical restore timestamp: ${HISTORICAL_AT}"
          python .naya/runtime/restore_context.py restore --at "${HISTORICAL_AT}" --pretty

      - name: Verify command surfaces
        run: |
          grep -q 'Naya Power — RESTORE CONTEXT' .naya/memory/BOOTSTRAP.md
          grep -q 'Naya Power — MAKE THIS A SMART NOTE' .naya/memory/BOOTSTRAP.md
          grep -q 'current_verified_reality_overrides' .naya/naya-context-manifest.json
          grep -q 'historical_restore_is_reconstruction_not_current_truth' .naya/naya-context-manifest.json
          grep -q 'SoulSchoolAcademy/NayaPOWER' README.md
          echo 'RESTORE / SMART NOTE / CANONICAL REPOSITORY surfaces present'
