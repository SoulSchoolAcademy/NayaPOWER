name: Wave A acceptance receipt gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wave-a-acceptance-receipt.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  acceptance-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      PREREQUISITE_RUN_ID: '35464691600'
      PREREQUISITE_ARTIFACT_NAME: wave-a-smart-mail-resume
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified Smart Mail handoff artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prerequisite"
          gh run download "$PREREQUISITE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PREREQUISITE_ARTIFACT_NAME" --dir "$RUNNER_TEMP/prerequisite"
          test -s "$RUNNER_TEMP/prerequisite/wave-a-smart-mail-resume.json"
      - name: Execute acceptance receipt gate only
        shell: bash
        run: |
          node <<'EOF'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const path=process.env.RUNNER_TEMP+'/prerequisite/wave-a-smart-mail-resume.json';
          const p=JSON.parse(fs.readFileSync(path,'utf8'));
          const required=['smart_mail','smart_mail_render','b_receiver_verification','b_retrieval','intelligence_retrieval','c_isolation'];
          for(const k of required) if(p?.checks?.[k]!=='PASS') throw new Error('PREREQUISITE_CHECK_NOT_PASS:'+k);
          if(p.status!=='VERIFIED') throw new Error('PREREQUISITE_STATUS_NOT_VERIFIED');
          if(String(p.run_id)!==process.env.PREREQUISITE_RUN_ID) throw new Error('PREREQUISITE_RUN_ID_MISMATCH');
          if(!p.message_id||!p.thread_id||!p.identities?.A||!p.identities?.B||!p.identities?.C) throw new Error('PREREQUISITE_IDENTITY_OR_LINEAGE_MISSING');
          const headers=cp.execFileSync('curl',['-sS','-D','-','-o','/tmp/runtime-body','-I',process.env.RUNTIME_URL+'/assistant-runtime.js'],{encoding:'utf8'});
          if(!/^HTTP\\/.* 200/m.test(headers)) throw new Error('RUNTIME_ASSISTANT_SURFACE_NOT_HTTP_200');
          const receipt={schema:'nayanet.wave-a.acceptance-receipt.v1',receipt_status:'VERIFIED',wave_a_status:'NOT_PROVEN',gate:'ACCEPTANCE_RECEIPT',generated_run_id:Number(process.env.GITHUB_RUN_ID),source_head:process.env.GITHUB_SHA,prerequisite:{workflow_run_id:Number(process.env.PREREQUISITE_RUN_ID),artifact_name:process.env.PREREQUISITE_ARTIFACT_NAME,status:p.status,checks:p.checks,message_id:p.message_id,thread_id:p.thread_id,identities:p.identities,network_evidence_count:Array.isArray(p.network)?p.network.length:0},runtime_surface:{url:process.env.RUNTIME_URL+'/assistant-runtime.js',http_status:200,checked_at:new Date().toISOString()},human_facing_scope:{verified:['Smart Mail send/render','B receiver verification/retrieval','intelligence retrieval','C isolation'],not_proven:['full human-facing Wave A acceptance','user-visible replay/idempotency','user-visible revocation/denial','user-visible fresh-Naya continuation'],disposition:'This receipt records the verified handoff evidence; it does not promote Wave A to PRODUCTION_PROVEN.'}};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/wave-a-acceptance-receipt.json',JSON.stringify(receipt,null,2));
          console.log('WAVE_A_ACCEPTANCE_RECEIPT_GATE=VERIFIED');
          console.log(JSON.stringify(receipt));
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wave-a-acceptance-receipt
          path: ${{ runner.temp }}/wave-a-acceptance-receipt.json
          if-no-files-found: error
