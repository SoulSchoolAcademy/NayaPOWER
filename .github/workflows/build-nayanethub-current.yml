name: Build Current NayaNET Hub from latest timestamped NAYANETHUBONE artifact

on:
  push:
    branches: [main]
    paths:
      - '*NAYANETHUBONE.html'
      - '*NAYANET INTELLIGENT FEED V2.js'
      - '.github/workflows/build-nayanethub-current.yml'
  pull_request:
    paths:
      - '*NAYANETHUBONE.html'
      - '*NAYANET INTELLIGENT FEED V2.js'
      - '.github/workflows/build-nayanethub-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve latest timestamped authoritative Hub source and feed layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          def stamp(name):
              m=re.match(r'^(\d{4}) (\d{2}) (\d{2}) +(\d{1,2}):(\d{2}) ', name)
              if not m: raise SystemExit(f'Invalid timestamped artifact name: {name}')
              y,mo,d,h,mi=map(int,m.groups())
              return (y,mo,d,h,mi)
          hubs=sorted([p.name for p in Path('.').glob('*NAYANETHUBONE.html')], key=stamp, reverse=True)
          feeds=sorted([p.name for p in Path('.').glob('*NAYANET INTELLIGENT FEED V2.js')], key=stamp, reverse=True)
          if not hubs: raise SystemExit('No timestamped NAYANETHUBONE.html source found')
          if not feeds: raise SystemExit('No timestamped NAYANET INTELLIGENT FEED V2.js layer found')
          hub=hubs[0]; feed=feeds[0]
          Path('source.env').write_text(f'AUTHORITATIVE_SOURCE={hub}\nSOURCE_TIMESTAMP={hub.rsplit(" NAYANETHUBONE.html",1)[0]}\nAUTHORITATIVE_FEED_LAYER={feed}\nFEED_TIMESTAMP={feed.rsplit(" NAYANET INTELLIGENT FEED V2.js",1)[0]}\n')
          print('AUTHORITATIVE_SOURCE=',hub)
          print('AUTHORITATIVE_FEED_LAYER=',feed)
          PY
      - name: Validate authoritative source and presentation layer
        shell: bash
        run: |
          set -euo pipefail
          source source.env
          test -s "$AUTHORITATIVE_SOURCE"
          test -s "$AUTHORITATIVE_FEED_LAYER"
          test "$(grep -oi '<!doctype html>' "$AUTHORITATIVE_SOURCE" | wc -l | tr -d ' ')" -eq 1
          test "$(grep -o '</html>' "$AUTHORITATIVE_SOURCE" | wc -l | tr -d ' ')" -eq 1
          grep -q 'nayanet-login-welcome' "$AUTHORITATIVE_SOURCE"
          grep -Eq 'Good (morning|afternoon|evening), Shawn\.' "$AUTHORITATIVE_SOURCE"
          grep -q 'Your Intelligence Today' "$AUTHORITATIVE_SOURCE"
          node --check "$AUTHORITATIVE_FEED_LAYER"
          git diff --check
          echo "SOURCE_BYTES=$(wc -c < "$AUTHORITATIVE_SOURCE")"
          echo "SOURCE_SHA256=$(sha256sum "$AUTHORITATIVE_SOURCE" | awk '{print $1}')"
          echo "FEED_LAYER_BYTES=$(wc -c < "$AUTHORITATIVE_FEED_LAYER")"
          echo "FEED_LAYER_SHA256=$(sha256sum "$AUTHORITATIVE_FEED_LAYER" | awk '{print $1}')"
      - name: Build release artifact with deterministic feed presentation layer
        shell: bash
        run: |
          set -euo pipefail
          source source.env
          python3 - <<'PY'
          from pathlib import Path
          src=Path(__import__('os').environ['AUTHORITATIVE_SOURCE']).read_text()
          layer=Path(__import__('os').environ['AUTHORITATIVE_FEED_LAYER']).read_text()
          marker='</body>'
          if src.count(marker)!=1: raise SystemExit('Expected exactly one </body> boundary')
          built=src.replace(marker,'<script>\n'+layer+'\n</script>\n'+marker,1)
          Path('index.html').write_text(built)
          PY
          printf '/index.html 200\n' > _redirects
          test -s index.html
          test "$(wc -c < index.html)" -gt 100000
          zip -9 -j NayaNET-Intelligent-Hub-Cloudflare.zip index.html _redirects
          unzip -t NayaNET-Intelligent-Hub-Cloudflare.zip
          test "$(unzip -Z1 NayaNET-Intelligent-Hub-Cloudflare.zip | wc -l | tr -d ' ')" -eq 2
          echo "INDEX_BYTES=$(wc -c < index.html)"
          echo "INDEX_SHA256=$(sha256sum index.html | awk '{print $1}')"
          echo "AUTHORITATIVE_SOURCE=$AUTHORITATIVE_SOURCE"
          echo "AUTHORITATIVE_FEED_LAYER=$AUTHORITATIVE_FEED_LAYER"
      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare
          path: NayaNET-Intelligent-Hub-Cloudflare.zip
          if-no-files-found: error
      - name: Upload authoritative source inspection
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Hub-Source-Inspection
          path: '*NAYANETHUBONE.html'
          if-no-files-found: error
      - name: Upload authoritative feed layer inspection
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Feed-V2-Inspection
          path: '*NAYANET INTELLIGENT FEED V2.js'
          if-no-files-found: error
