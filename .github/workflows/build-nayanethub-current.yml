          unzip -t NayaNET-Hub-One-Cloudflare-Upload.zip
          test "$(unzip -Z1 NayaNET-Hub-One-Cloudflare-Upload.zip | wc -l | tr -d ' ')" -eq 2
          echo "HUB_ONE_BYTES=$(wc -c < NAYANETHUBONE)"
          echo "HUB_ONE_SHA256=$(sha256sum NAYANETHUBONE | awk '{print $1}')"
