name: Build Current NayaNET Hub from NAYANETHUBONE

on:
  push:
    branches: [main, hub-surgical-work-20260907]
    paths:
      - 'NAYANETHUBONE.html'
      - '.github/workflows/build-nayanethub-current.yml'
  pull_request:
    paths:
      - 'NAYANETHUBONE.html'
      - '.github/workflows/build-nayanethub-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Surgical inspection report
        shell: python
        run: |
          from pathlib import Path
          import re, hashlib
          p=Path('NAYANETHUBONE.html')
          s=p.read_text(encoding='utf-8')
          print('FILE_BYTES', p.stat().st_size)
          print('FILE_SHA256', hashlib.sha256(s.encode()).hexdigest())
          pats={
            'smart_notes_nav': r'Smart Notes',
            'smart_share': r'Smart Share',
            'your_intelligence_today': r'Your Intelligence Today',
            'daily_report': r'DAILY INTELLIGENCE REPORT|Daily Intelligence Report',
            'connect_github': r'CONNECT GITHUB|Connect GitHub',
            'sync_intelligence': r'SYNC INTELLIGENCE|Sync Intelligence',
            'smart_spaces': r'Smart Spaces',
            'smart_lists': r'Smart Lists',
            'smart_mail_new': r'NEW',
            'smart_notes_toggle': r'Smart Notes.*?(?:ON|OFF)|smart.?notes.*?(?:toggle|switch)',
            'intelligent_layer': r'Intelligent Layer|intelligentLayer',
            'flashing_quote': r'Your life creates intelligence every day',
            'country_fallback': r'Canada|🇨🇦',
            'greeting': r'Good morning|Good afternoon|Good evening',
            'collective': r'COLLECTIVE|Collective',
            'personal': r'PERSONAL|Personal',
            'five_star': r'★★★★★|5 stars|five.?star',
            'inline_comment': r'Add your perspective|Comment',
            'quote_function': r'function quote\s*\(',
            'supabase': r'Supabase',
            'localstorage': r'localStorage',
          }
          for k,pat in pats.items(): print(k, len(re.findall(pat,s,re.I|re.S)))
          print('SCRIPT_TAGS', len(re.findall(r'<script\\b',s,re.I)))
          print('STYLE_TAGS', len(re.findall(r'<style\\b',s,re.I)))
          print('DOCTYPE', len(re.findall(r'<!doctype html>',s,re.I)))
          print('HTML_END', s[-1000:])
      - name: Validate authoritative Hub source
        run: |
          set -euo pipefail
          test -s NAYANETHUBONE.html
          test "$(grep -o '<!doctype html>' NAYANETHUBONE.html | wc -l | tr -d ' ')" -eq 1
          test "$(grep -o '</html>' NAYANETHUBONE.html | wc -l | tr -d ' ')" -eq 1
          grep -q 'nayanet-login-welcome' NAYANETHUBONE.html
          grep -q 'Good morning, Shawn.' NAYANETHUBONE.html
          grep -q 'Your Intelligence Today' NAYANETHUBONE.html
          git diff --check
          echo "AUTHORITATIVE_SOURCE=NAYANETHUBONE.html"
          echo "SOURCE_BYTES=$(wc -c < NAYANETHUBONE.html)"
          echo "SOURCE_SHA256=$(sha256sum NAYANETHUBONE.html | awk '{print $1}')"
      - name: Build exact deployment artifact from authoritative source
        run: |
          set -euo pipefail
          cp NAYANETHUBONE.html index.html
          printf '/index.html 200\n' > _redirects
          test -s index.html
          test "$(wc -c < index.html)" -gt 100000
          zip -9 -j NayaNET-Intelligent-Hub-Cloudflare.zip index.html _redirects
          unzip -t NayaNET-Intelligent-Hub-Cloudflare.zip
          test "$(unzip -Z1 NayaNET-Intelligent-Hub-Cloudflare.zip | wc -l | tr -d ' ')" -eq 2
          echo "INDEX_BYTES=$(wc -c < index.html)"
          echo "INDEX_SHA256=$(sha256sum index.html | awk '{print $1}')"
      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare
          path: NayaNET-Intelligent-Hub-Cloudflare.zip
          if-no-files-found: error
      - name: Upload authoritative source inspection
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Hub-Source-Inspection
          path: NAYANETHUBONE.html
          if-no-files-found: error
