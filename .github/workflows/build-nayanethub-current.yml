# 2026 09 07 — canonical 2:05 source + Smart Feed V3 release build
name: Build Current NayaNET Hub from canonical 2:05 source

on:
  push:
    branches: [main]
    paths:
      - '2026 09 07 2:05 NAYANET HUB.HTML'
      - '*NAYANET INTELLIGENT FEED V2.js'
      - '.github/workflows/build-nayanethub-current.yml'
  pull_request:
    paths:
      - '2026 09 07 2:05 NAYANET HUB.HTML'
      - '*NAYANET INTELLIGENT FEED V2.js'
      - '.github/workflows/build-nayanethub-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve canonical 2:05 source and latest feed layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          hub=Path('2026 09 07 2:05 NAYANET HUB.HTML')
          if not hub.is_file(): raise SystemExit(f'Missing canonical source: {hub}')
          def stamp(name):
              m=re.match(r'^(\d{4}) (\d{2}) (\d{2}) +(\d{1,2}):(\d{2}) ', name)
              if not m: raise SystemExit(f'Invalid timestamped feed name: {name}')
              return tuple(map(int,m.groups()))
          feeds=sorted([p.name for p in Path('.').glob('*NAYANET INTELLIGENT FEED V2.js')], key=stamp, reverse=True)
          if not feeds: raise SystemExit('No timestamped NAYANET INTELLIGENT FEED V2.js layer found')
          feed=feeds[0]
          Path('source.env').write_text(f'AUTHORITATIVE_SOURCE={hub!s}\nAUTHORITATIVE_FEED_LAYER={feed!r}\n')
          print('AUTHORITATIVE_SOURCE=',hub)
          print('AUTHORITATIVE_FEED_LAYER=',feed)
          PY
      - name: Validate canonical source and feed layer
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source source.env
          set +a
          test -s "$AUTHORITATIVE_SOURCE"
          test -s "$AUTHORITATIVE_FEED_LAYER"
          test "$(grep -oi '<!doctype html>' "$AUTHORITATIVE_SOURCE" | wc -l | tr -d ' ')" -eq 1
          test "$(grep -o '</html>' "$AUTHORITATIVE_SOURCE" | wc -l | tr -d ' ')" -eq 1
          grep -q 'nayanet-login-welcome' "$AUTHORITATIVE_SOURCE"
          grep -Eq 'Good (morning|afternoon|evening), Shawn\.' "$AUTHORITATIVE_SOURCE"
          grep -q 'NayaNET' "$AUTHORITATIVE_SOURCE"
          node --check "$AUTHORITATIVE_FEED_LAYER"
          grep -q 'HOW NAYANET INTELLIGENT FEEDS TURN EXPERIENCE INTO COMPOUNDING INTELLIGENCE' "$AUTHORITATIVE_FEED_LAYER"
          grep -q 'PERSONAL INTELLIGENCE' "$AUTHORITATIVE_FEED_LAYER"
          grep -q 'COLLECTIVE INTELLIGENCE' "$AUTHORITATIVE_FEED_LAYER"
          grep -q 'ACTIVITY' "$AUTHORITATIVE_FEED_LAYER"
          grep -q 'CHILD NOTE' "$AUTHORITATIVE_FEED_LAYER"
          grep -q 'GRANDMA NOTE' "$AUTHORITATIVE_FEED_LAYER"
          grep -q 'SMART LINK' "$AUTHORITATIVE_FEED_LAYER"
          git diff --check
      - name: Build release artifact from exact 2:05 source
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source source.env
          set +a
          python3 - <<'PY'
          from pathlib import Path
          import os
          src=Path(os.environ['AUTHORITATIVE_SOURCE']).read_text()
          layer=Path(os.environ['AUTHORITATIVE_FEED_LAYER']).read_text()
          marker='</body>'
          if src.count(marker)!=1: raise SystemExit('Expected exactly one </body> boundary')
          Path('index.html').write_text(src.replace(marker,'<script>\n'+layer+'\n</script>\n'+marker,1))
          PY
          printf '/index.html 200\n' > _redirects
          test -s index.html
          test "$(wc -c < index.html)" -gt 100000
          grep -q 'HOW NAYANET INTELLIGENT FEEDS TURN EXPERIENCE INTO COMPOUNDING INTELLIGENCE' index.html
          grep -q 'IN A NUTSHELL' index.html
          grep -q 'HUMAN NOTE' index.html
          grep -q 'CHILD NOTE' index.html
          grep -q 'GRANDMA NOTE' index.html
          grep -q 'NAYA NOTE' index.html
          grep -q 'MACHINE NOTE' index.html
          grep -q 'WHAT WE LEARNED · WHAT IT MEANS' index.html
          grep -q 'PERSONAL INTELLIGENCE' index.html
          grep -q 'COLLECTIVE INTELLIGENCE' index.html
          grep -q 'ACTIVITY' index.html
          node --check <(python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(); print('')") 2>/dev/null || true
          zip -9 -j NayaNET-Intelligent-Hub-Cloudflare.zip index.html _redirects
          unzip -t NayaNET-Intelligent-Hub-Cloudflare.zip
      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare
          path: NayaNET-Intelligent-Hub-Cloudflare.zip
          if-no-files-found: error
      - name: Upload exact source inspection
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Hub-Canonical-2-05-Source
          path: '2026 09 07 2:05 NAYANET HUB.HTML'
          if-no-files-found: error
      - name: Upload feed layer inspection
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Feed-V3
          path: '*NAYANET INTELLIGENT FEED V2.js'
          if-no-files-found: error
