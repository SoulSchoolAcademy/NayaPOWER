name: Verify Cognition Receipt Revision Concurrency

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-cognition-receipt-concurrency.mjs'
      - '.github/workflows/verify-cognition-receipt-concurrency.yml'
      - 'supabase/migrations/20260919183100_align_cognition_receipt_revision_with_receipt_namespace.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run concurrent production writers
        run: node scripts/verify-cognition-receipt-concurrency.mjs
