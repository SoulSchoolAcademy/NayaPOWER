# CANONICAL-LIVE-HUB-WORKFLOW-V3-2026-09-13
# Canonical runtime deployment. An authorized push to main is the deployment approval.
# The exact pushed SHA remains bound to the build, Cloudflare artifact, and runtime verification.
name: Deploy Canonical NayaNET Hub V3

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - 'scripts/build-primary-intelligence-feed.py'
      - 'scripts/nayanet-cognitive-engine.js'
      - '.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
      - '.naya/control-plane/**'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character NayaPOWER commit to deploy
        required: true
        type: string
      reason:
        description: Why this exact commit is being deployed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nayanet-canonical-live-hub
  cancel-in-progress: false

env:
  HUB: NAYANET/HUB
  WORKER_NAME: sparkling-shape-7ae5
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact source SHA
        id: source
        shell: bash
        env:
          PUSH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SHA" ]; then
            test "${#REQUESTED_SHA}" -eq 40
            echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact source SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.sha }}

      - name: Verify exact source binding and authorized deployment approval
        shell: bash
        env:
          REQUESTED_SHA: ${{ steps.source.outputs.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REASON_INPUT: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "${#REQUESTED_SHA}" -eq 40
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          echo "SOURCE_COMMIT=$ACTUAL_SHA" >> "$GITHUB_ENV"
          if [ "$EVENT_NAME" = "push" ]; then
            REASON="authorized main push: deployment approval is granted by repository authority"
          else
            REASON="$REASON_INPUT"
          fi
          test -n "$REASON"
          echo "DEPLOYMENT_REASON=$REASON" >> "$GITHUB_ENV"
          echo "EXACT_SOURCE_SHA=PASS: $ACTUAL_SHA"
          echo "DEPLOYMENT_APPROVAL=AUTHORIZED_MAIN_PUSH_OR_EXPLICIT_DISPATCH"

      - name: Enforce canonical NayaPOWER governance kernel
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 .naya/control-plane/workflow_gate.py \
            --actor "$ACTOR" \
            --purpose "deploy the canonical NayaNET Intelligent Hub public runtime" \
            --permission "deploy_public_runtime" \
            --request "deploy_nayanet_hub_canonical" \
            --mission "make NayaPOWER operationally capable of safely governing Intelligent Hub production deployment" \
            --uncertainty 1 \
            --consequence 8 \
            --irreversibility 8 \
            --scope "public-runtime:sparkling-shape-7ae5:/" \
            --evidence "authorized main push or explicit deployment dispatch" \
            --evidence "exact source SHA verified: $SOURCE_COMMIT" \
            --evidence "deployment reason: $DEPLOYMENT_REASON"

      - name: Install
        working-directory: NAYANET/HUB
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: NAYANET/HUB
        run: npm run typecheck

      - name: Build
        working-directory: NAYANET/HUB
        env:
          VITE_RELEASE_COMMIT: ${{ steps.source.outputs.sha }}
        run: npm run build

      - name: Inspect actual generated artifact
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          D="$HUB/dist"
          test -s "$D/index.html"
          test -s "$D/nayanet-cognitive-engine.js"
          APP_JS=$(find "$D/assets" -maxdepth 1 -type f -name '*.js' -print -quit | sed "s#^$D/##")
          test -n "$APP_JS"
          test -s "$D/$APP_JS"
          for x in 'NayaNET' 'Intelligent Hub' 'IDENTITY' 'ACTIVITY FEED' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'Ask Naya' 'Create Smart Space' 'NUTSHELL' 'HUMAN' 'CHILD' 'GRANDMA' 'NAYA' 'MACHINE' 'WEAVER' 'LESSON' 'MEANING' 'ACTION' 'TRUST' 'RELATED INTELLIGENCE' 'Favorite intelligence' 'Save intelligence' 'RATE / RANK' 'COMMENT' 'SHARE' 'CONNECT' 'NAYANET-HUB-REACT-CANONICAL'; do grep -RFiq "$x" "$D/index.html" "$D/$APP_JS" || { echo "ARTIFACT_MISSING=$x"; exit 1; }; done
          for x in 'NayaNetCognition' 'recordPersistent' 'nayanet_record_cognition_event'; do grep -Fqi "$x" "$D/nayanet-cognitive-engine.js" || { echo "COGNITION_ARTIFACT_MISSING=$x"; exit 1; }; done
          if git grep -nEi -- 'Where.?s Naya Now|SUPERBRAIN|PASS THE TORCH|VERIFY STATE' -- NAYANET/HUB/src scripts >/tmp/forbidden-source 2>/dev/null; then cat /tmp/forbidden-source; echo FORBIDDEN_SOURCE_UI_FOUND; exit 1; fi
          for x in "Where's Naya Now" 'Where’s Naya Now' 'SUPERBRAIN' 'PASS THE TORCH' 'VERIFY STATE'; do if grep -RFiq "$x" "$D/index.html" "$D/$APP_JS"; then echo "FORBIDDEN_ARTIFACT=$x"; exit 1; fi; done
          test ! -e "$D/nayanet-intelligent-feed-v6.js"
          grep -Fq "$SOURCE_COMMIT" "$D/index.html" "$D/$APP_JS"
          sha256sum "$D/index.html" > /tmp/index.sha256
          sha256sum "$D/nayanet-cognitive-engine.js" > /tmp/cognition.sha256
          echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          echo CANONICAL_HUB_BUILD=PASS
          echo ARTIFACT_INSPECTION=PASS
          echo COGNITIVE_ENGINE_ARTIFACT=PASS
          echo FORBIDDEN_PRODUCT_UI=ABSENT

      - name: Prepare exact Cloudflare artifact
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/public
          cp -R "$HUB/dist/." release/public/
          cat > release/worker.js <<'EOF'
          export default { async fetch(request, env) { const url = new URL(request.url); const spaRoutes = new Set(['/','/index.html','/feed','/notes','/today','/reports','/library','/collective','/evidence','/connections','/mail','/space','/settings']); const isSpaRoute = spaRoutes.has(url.pathname) || url.pathname.startsWith('/intelligence/'); const assetRequest = isSpaRoute ? new Request(new URL('/index.html', request.url).toString(), { method: 'GET', headers: request.headers }) : request; const response = await env.ASSETS.fetch(assetRequest); if (!isSpaRoute) return response; const headers = new Headers(response.headers); headers.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0'); headers.set('Pragma','no-cache'); headers.set('X-NayaNET-Canonical-Source','NAYANET/HUB React'); headers.set('X-NayaNET-Source-Commit', env.SOURCE_COMMIT || 'unknown'); return new Response(response.body,{status:response.status,statusText:response.statusText,headers}); } };
          EOF
          cat > release/wrangler.jsonc <<'EOF'
          {"name":"sparkling-shape-7ae5","main":"worker.js","compatibility_date":"2026-09-08","account_id":"b5e2a51b3e883f7722287c5f51b1196b","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"SOURCE_COMMIT_PLACEHOLDER"}}
          EOF
          sed -i "s/SOURCE_COMMIT_PLACEHOLDER/$SOURCE_COMMIT/" release/wrangler.jsonc
          printf 'RELEASE_SOURCE_COMMIT=%s\nRELEASE_SOURCE=NAYANET/HUB\nRELEASE_TARGET=sparkling-shape-7ae5\n' "$SOURCE_COMMIT" > release/RELEASE-MANIFEST.txt
          cat /tmp/index.sha256 /tmp/cognition.sha256 >> release/RELEASE-MANIFEST.txt

      - name: Deploy exact Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc

      - name: Inspect and explicitly promote newest Worker version to 100%
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json
          VERSION_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/deployments.json'))
          deployments=data.get('deployments') if isinstance(data,dict) else data
          if not deployments: raise SystemExit('NO_DEPLOYMENTS')
          versions=deployments[-1].get('versions') or []
          if not versions: raise SystemExit('NO_DEPLOYMENT_VERSIONS')
          print(versions[-1].get('version_id') or versions[-1].get('versionId') or '')
          PY
          )
          test -n "$VERSION_ID"
          npx wrangler versions deploy "$VERSION_ID@100%" -y --name "$WORKER_NAME"

      - name: Independently verify exact public runtime and built assets
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
        run: |
          set -u
          echo "VERIFY_RUNTIME=$RUNTIME"
          echo "VERIFY_SMART_LINK=$SMART_LINK"
          echo "VERIFY_SOURCE_COMMIT=$SOURCE_COMMIT"
          for attempt in $(seq 1 24); do
            root_code=$(curl -sS --connect-timeout 5 --max-time 10 -D /tmp/root.headers -o /tmp/root -w '%{http_code}' "$RUNTIME/?release=$SOURCE_COMMIT&probe=$attempt" 2>/tmp/root.err || true)
            smart_code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/smart -w '%{http_code}' "$SMART_LINK?release=$SOURCE_COMMIT&probe=$attempt" 2>/tmp/smart.err || true)
            root_size=$(wc -c </tmp/root 2>/dev/null || echo 0)
            smart_size=$(wc -c </tmp/smart 2>/dev/null || echo 0)
            echo "ATTEMPT=$attempt ROOT_HTTP=$root_code ROOT_BYTES=$root_size SMART_HTTP=$smart_code SMART_BYTES=$smart_size"
            if [ "$root_code" = 200 ] && [ "$smart_code" = 200 ]; then
              root_hash=$(sha256sum /tmp/root | awk '{print $1}')
              smart_hash=$(sha256sum /tmp/smart | awk '{print $1}')
              echo "ROOT_SHA256=$root_hash SMART_SHA256=$smart_hash"
              if [ "$root_hash" = "$smart_hash" ]; then
                js_src=$(grep -oE 'src="[^"]+\.js"' /tmp/root | head -1 | cut -d'"' -f2 || true)
                case "$js_src" in /*) ;; '') ;; *) js_src="/$js_src";; esac
                js_code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/app-js -w '%{http_code}' "$RUNTIME$js_src?release=$SOURCE_COMMIT&probe=$attempt" 2>/tmp/js.err || true)
                cognitive_code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/cognition -w '%{http_code}' "$RUNTIME/nayanet-cognitive-engine.js?release=$SOURCE_COMMIT&probe=$attempt" 2>/tmp/cognition.err || true)
                runtime_header=$(tr -d '\r' </tmp/root.headers | grep -i '^x-nayanet-source-commit:' | awk '{print $2}' || true)
                echo "ASSET_JS=$js_src JS_HTTP=$js_code COGNITION_HTTP=$cognitive_code RUNTIME_HEADER=$runtime_header"
                if [ "$js_code" = 200 ] && [ "$cognitive_code" = 200 ] && grep -Fq "$SOURCE_COMMIT" /tmp/root /tmp/app-js 2>/dev/null; then
                  pass=1
                  for x in 'NayaNET' 'Intelligent Hub' 'IDENTITY' 'ACTIVITY FEED' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'Ask Naya' 'Create Smart Space' 'NUTSHELL' 'HUMAN' 'CHILD' 'GRANDMA' 'NAYA' 'MACHINE' 'WEAVER' 'LESSON' 'MEANING' 'ACTION' 'TRUST' 'RELATED INTELLIGENCE' 'Favorite intelligence' 'Save intelligence' 'RATE / RANK' 'COMMENT' 'SHARE' 'CONNECT' 'NAYANET-HUB-REACT-CANONICAL'; do grep -RFiq "$x" /tmp/root /tmp/app-js 2>/dev/null || pass=0; done
                  for x in "Where's Naya Now" 'Where’s Naya Now' 'SUPERBRAIN' 'PASS THE TORCH' 'VERIFY STATE'; do if grep -RFiq "$x" /tmp/root /tmp/app-js 2>/dev/null; then pass=0; fi; done
                  if [ "$pass" -eq 1 ]; then echo PUBLIC_RUNTIME=PASS; echo RUNTIME_ROUTE_PARITY=PASS; echo RUNTIME_JS_ASSET=PASS; echo RUNTIME_SOURCE_COMMIT_BODY=PASS; exit 0; fi
                fi
              fi
            fi
            sleep 5
          done
          echo RELEASE_BLOCKED_PUBLIC_RUNTIME_NOT_CANONICAL
          exit 1
