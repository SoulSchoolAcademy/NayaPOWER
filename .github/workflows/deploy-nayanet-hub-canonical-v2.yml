# CANONICAL-LIVE-HUB-WORKFLOW-V2-2026-09-09
# Surgical runtime-integrity repair. Build from NAYANET/HUB, deploy to aged-art-7c12,
# explicitly promote the created Worker version to 100%, then prove the public runtime.
name: Deploy Canonical NayaNET Hub V2

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: nayanet-canonical-live-hub
  cancel-in-progress: false

env:
  HUB: NAYANET/HUB
  WORKER_NAME: aged-art-7c12
  RUNTIME: https://aged-art-7c12.nayanet.workers.dev
  SMART_LINK: https://aged-art-7c12.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds
  ACCOUNT_ID: 262c881746ea6e9978ca18b3eb831907

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Capture checked-out source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: NAYANET/HUB
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: NAYANET/HUB
        run: npm run typecheck

      - name: Build
        working-directory: NAYANET/HUB
        env:
          VITE_RELEASE_COMMIT: ${{ steps.source.outputs.sha }}
        run: npm run build

      - name: Inspect actual generated artifact
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          D="$HUB/dist"
          test -s "$D/index.html"
          test -s "$D/nayanet-cognitive-engine.js"
          APP_JS=$(grep -oE 'assets/[^" ]+\.js' "$D/index.html" | head -1)
          test -s "$D/$APP_JS"
          for x in 'NayaNET' 'Intelligent Hub' 'IDENTITY' 'ACTIVITY FEED' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'Ask Naya' 'Create Smart Space' 'NUTSHELL' 'HUMAN' 'CHILD' 'GRANDMA' 'NAYA' 'MACHINE' 'WEAVER' 'LESSON' 'MEANING' 'ACTION' 'TRUST' 'RELATED INTELLIGENCE' 'Favorite intelligence' 'Save intelligence' 'RATE / RANK' 'COMMENT' 'SHARE' 'CONNECT' 'NAYANET-HUB-REACT-CANONICAL'; do grep -RFiq "$x" "$D/index.html" "$D/$APP_JS" || { echo "ARTIFACT_MISSING=$x"; exit 1; }; done
          for x in 'NayaNetCognition' 'recordPersistent' 'nayanet_record_cognition_event'; do grep -Fqi "$x" "$D/nayanet-cognitive-engine.js" || { echo "COGNITION_ARTIFACT_MISSING=$x"; exit 1; }; done
          if git grep -nEi -- 'Where.?s Naya Now|SUPERBRAIN|PASS THE TORCH|VERIFY STATE' -- NAYANET/HUB/src scripts >/tmp/forbidden-source 2>/dev/null; then cat /tmp/forbidden-source; echo FORBIDDEN_SOURCE_UI_FOUND; exit 1; fi
          for x in "Where's Naya Now" 'Where’s Naya Now' 'SUPERBRAIN' 'PASS THE TORCH' 'VERIFY STATE'; do if grep -RFiq "$x" "$D/index.html" "$D/$APP_JS"; then echo "FORBIDDEN_ARTIFACT=$x"; exit 1; fi; done
          test ! -e "$D/nayanet-intelligent-feed-v6.js"
          grep -Fq "$SOURCE_COMMIT" "$D/index.html" "$D/$APP_JS"
          sha256sum "$D/index.html" > /tmp/index.sha256
          sha256sum "$D/nayanet-cognitive-engine.js" > /tmp/cognition.sha256
          echo "APP_JS=$APP_JS"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          echo CANONICAL_HUB_BUILD=PASS
          echo ARTIFACT_INSPECTION=PASS
          echo COGNITIVE_ENGINE_ARTIFACT=PASS
          echo FORBIDDEN_PRODUCT_UI=ABSENT

      - name: Prepare exact Cloudflare artifact
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/public
          cp -R "$HUB/dist/." release/public/
          cat > release/worker.js <<'EOF'
          export default { async fetch(request, env) { const url = new URL(request.url); const isSpaRoute = url.pathname === '/' || url.pathname === '/index.html' || url.pathname.startsWith('/intelligence/'); const assetRequest = isSpaRoute ? new Request(new URL('/index.html', request.url).toString(), { method: 'GET', headers: request.headers }) : request; const response = await env.ASSETS.fetch(assetRequest); if (!isSpaRoute) return response; const headers = new Headers(response.headers); headers.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0'); headers.set('Pragma','no-cache'); headers.set('X-NayaNET-Canonical-Source','NAYANET/HUB React'); headers.set('X-NayaNET-Source-Commit', env.SOURCE_COMMIT || 'unknown'); return new Response(response.body,{status:response.status,statusText:response.statusText,headers}); } };
          EOF
          cat > release/wrangler.jsonc <<'EOF'
          {"name":"aged-art-7c12","main":"worker.js","compatibility_date":"2026-09-08","account_id":"262c881746ea6e9978ca18b3eb831907","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"SOURCE_COMMIT_PLACEHOLDER"}}
          EOF
          sed -i "s/SOURCE_COMMIT_PLACEHOLDER/$SOURCE_COMMIT/" release/wrangler.jsonc
          printf 'RELEASE_SOURCE_COMMIT=%s\nRELEASE_SOURCE=NAYANET/HUB\nRELEASE_TARGET=aged-art-7c12\n' "$SOURCE_COMMIT" > release/RELEASE-MANIFEST.txt
          cat /tmp/index.sha256 /tmp/cognition.sha256 >> release/RELEASE-MANIFEST.txt

      - name: Deploy exact Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc

      - name: Inspect and explicitly promote newest Worker version to 100%
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json
          cat /tmp/deployments.json
          VERSION_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/deployments.json'))
          if isinstance(data, dict):
              deployments=data.get('deployments') or []
          elif isinstance(data, list):
              deployments=data
          else:
              raise SystemExit('INVALID_DEPLOYMENTS_JSON')
          if not deployments:
              raise SystemExit('NO_DEPLOYMENTS')
          newest=deployments[-1]
          if not isinstance(newest, dict):
              raise SystemExit('INVALID_DEPLOYMENT_ENTRY')
          versions=newest.get('versions') or []
          if not versions:
              raise SystemExit('NO_DEPLOYMENT_VERSIONS')
          version=versions[-1]
          version_id=version.get('version_id') or version.get('versionId')
          if not version_id:
              raise SystemExit('NO_VERSION_ID')
          print(version_id)
          PY
          )
          test -n "$VERSION_ID"
          echo "NEWEST_VERSION_ID=$VERSION_ID"
          npx wrangler versions deploy "$VERSION_ID@100%" -y --name "$WORKER_NAME"
          echo "PROMOTED_VERSION_ID=$VERSION_ID"

      - name: Independently verify exact public runtime and built assets
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -u
          for attempt in $(seq 1 12); do
            echo "RUNTIME_PROBE_ATTEMPT=$attempt"
            get(){ curl -sS -o "$2" -w '%{http_code}' "$1" || true; }
            status=$(get "$RUNTIME/?release=$SOURCE_COMMIT&probe=$attempt" /tmp/root)
            smart_status=$(get "$SMART_LINK?release=$SOURCE_COMMIT&probe=$attempt" /tmp/smart)
            echo "ROOT_HTTP=$status SMART_HTTP=$smart_status"
            if [ "$status" = 200 ] && [ "$smart_status" = 200 ] && cmp -s /tmp/root /tmp/smart ]; then
              js_src=$(grep -oE 'src="[^"]+\.js"' /tmp/root 2>/dev/null | head -1 | cut -d'"' -f2 || true)
              case "$js_src" in /*) ;; '') ;; *) js_src="/$js_src";; esac
              js_status=$(get "$RUNTIME$js_src?release=$SOURCE_COMMIT&probe=$attempt" /tmp/app-js)
              cognitive_status=$(get "$RUNTIME/nayanet-cognitive-engine.js?release=$SOURCE_COMMIT&probe=$attempt" /tmp/cognition)
              runtime_header=$(curl -sSI "$RUNTIME/?release=$SOURCE_COMMIT&probe=$attempt" | tr -d '\r' | grep -i '^x-nayanet-source-commit:' | awk '{print $2}' || true)
              echo "JS_SRC=$js_src JS_HTTP=$js_status COGNITION_HTTP=$cognitive_status RUNTIME_HEADER_SOURCE_COMMIT=$runtime_header"
              if [ "$js_status" = 200 ] && [ "$cognitive_status" = 200 ] && [ "$runtime_header" = "$SOURCE_COMMIT" ] && grep -Fq "$SOURCE_COMMIT" /tmp/root /tmp/app-js 2>/dev/null; then
                pass=1
                for x in 'NayaNET' 'Intelligent Hub' 'IDENTITY' 'ACTIVITY FEED' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'Ask Naya' 'Create Smart Space' 'NUTSHELL' 'HUMAN' 'CHILD' 'GRANDMA' 'NAYA' 'MACHINE' 'WEAVER' 'LESSON' 'MEANING' 'ACTION' 'TRUST' 'RELATED INTELLIGENCE' 'Favorite intelligence' 'Save intelligence' 'RATE / RANK' 'COMMENT' 'SHARE' 'CONNECT' 'NAYANET-HUB-REACT-CANONICAL'; do grep -RFiq "$x" /tmp/root /tmp/app-js 2>/dev/null || { echo "FAIL_RUNTIME_MARKER=$x"; pass=0; }; done
                for x in "Where's Naya Now" 'Where’s Naya Now' 'SUPERBRAIN' 'PASS THE TORCH' 'VERIFY STATE'; do if grep -RFiq "$x" /tmp/root /tmp/app-js 2>/dev/null; then echo "FAIL_FORBIDDEN_RUNTIME=$x"; pass=0; fi; done
                if [ "$pass" -eq 1 ]; then
                  echo PUBLIC_RUNTIME=PASS
                  echo RUNTIME_ROUTE_PARITY=PASS
                  echo RUNTIME_JS_ASSET=PASS
                  echo RUNTIME_COGNITIVE_ENGINE=PASS
                  echo RUNTIME_INTELLIGENCE_MARKERS=PASS
                  echo RUNTIME_FORBIDDEN_PRODUCT_UI=ABSENT
                  echo RUNTIME_SOURCE_COMMIT=PASS
                  echo RUNTIME_HEADER_SOURCE_COMMIT=PASS
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo RELEASE_BLOCKED_PUBLIC_RUNTIME_NOT_CANONICAL
          exit 1
