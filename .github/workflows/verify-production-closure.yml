name: Verify authenticated production closure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute authenticated production closure
        env:
          PROOF_PATH: ${{ runner.temp }}/nayanet-production-closure-proof.json
        run: node scripts/verify-production-closure.mjs
      - name: Validate verified proof
        env:
          PROOF_PATH: ${{ runner.temp }}/nayanet-production-closure-proof.json
        run: |
          test -s "$PROOF_PATH"
          node -e "const r=require(process.argv[1]); if(r.status!=='VERIFIED') throw new Error('production closure not verified'); if(r.fresh_runtime!==true) throw new Error('fresh runtime proof missing'); if(r.governed_action.receipt_status!=='VERIFIED') throw new Error('receipt not verified');" "$PROOF_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: nayanet-production-closure-proof
          path: ${{ runner.temp }}/nayanet-production-closure-proof.json
          if-no-files-found: error
          retention-days: 30
