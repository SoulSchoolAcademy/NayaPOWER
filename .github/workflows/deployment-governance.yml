name: NayaPOWER Deployment Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run fail-closed deployment governance tests
        run: python .naya/runtime/deployment_governance_test.py

      - name: Assert Vercel is not invoked by this workflow
        shell: bash
        run: |
          if grep -RniE '(^|[[:space:]])(vercel deploy|npx vercel|npm exec vercel|yarn vercel|pnpm vercel)([[:space:]]|$)' .github/workflows; then
            echo 'FAIL: direct Vercel deployment command found in GitHub workflows.'
            exit 1
          fi
          echo 'PASS: no direct Vercel deployment command found in GitHub workflows.'

      - name: Governance receipt
        run: |
          echo 'DEPLOYMENT GOVERNANCE: PASS'
          echo 'Automatic Git deployment: DENY'
          echo 'Preview deployment: DENY unless explicitly authorized'
          echo 'Production deployment: DENY unless explicitly authorized'
