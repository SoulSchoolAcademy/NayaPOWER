# Activation Delivery Gate — the locked door (round 2, bypass-1 fix).
#
# WHY pull_request_target: on `pull_request` the workflow would check out the
# PR's own code — the party being gated would supply the judge (round-1
# bypass 2). On `pull_request_target` the workflow file AND tools/ come from
# BASE: the gate that judges the PR is base-branch code the PR cannot edit.
# The PR head is checked out to ./pr-head as DATA (a pinned, runner-provided
# SHA): its bytes are verified, never executed as the judge.
#
# WHAT it guards: any PR to main that changes a deliverable
# (tools/activation_gate.py::_is_deliverable — smart-blocks/** or *.html,
# case-insensitive) must carry a valid, fresh, tip-bound activation receipt
# at .naya/activation/receipt.json in the PR head, binding every changed
# deliverable by path + sha256. No receipt, stale receipt, transplanted
# receipt, or unregistered component class -> REJECT (exit 1, fail closed)
# and the PR cannot merge while this check is required. PRs that change no
# deliverable -> PASS (nothing to gate).
#
# WHY no `paths:` filter (round-4): GitHub's paths filter is case-sensitive
# minimatch while _is_deliverable is case-insensitive — docs/FOO.HTML was a
# deliverable the gate never saw (round-3 trigger case-gap). Any YAML-side
# filter is a SECOND perimeter that can drift from the predicate. The
# workflow runs on every PR to main; the gate computes scope itself via the
# single _is_deliverable authority. Predicate == perimeter.
#
# WHY `actions: read` (round-4, production break): verify_issuance() calls
# GET /repos/{repo}/actions/runs/{run_id} and GET .../artifacts. Without the
# Actions permission both 403 ("Resource not accessible by integration") ->
# ISSUANCE_UNVERIFIABLE -> every lawful delivery REJECTs. The permission set
# is part of the system under test: the issuance e2e is re-proven in CI
# under exactly this permission set (see unified-activation-gate.yml,
# job issuance-permissions-proof), not the proof workflow's actions:write.
#
# NOTE: marking this check *required* in main's branch protection is an
# authority change — it needs Shawn/admin. Until then the door is built and
# proven; the lock's final click is his.
name: Activation Delivery Gate

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  delivery-gate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # 1. BASE code = the trusted judge (default checkout on
      #    pull_request_target is the base branch).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 (pinned SHA)
      # 2. PR head as DATA: runner-provided SHA, verified never trusted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 (pinned SHA)
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned SHA)
        with:
          python-version: "3.12"
      # 3. ROW 7 delegate-and-verify: fetch the design lane's gate + manifest
      #    at the PINNED reviewed commit (content-addressed, immutable — the
      #    PR cannot change its judge). If the fetch fails the gate still
      #    runs and fails closed (DESIGN_GATE_UNAVAILABLE -> REJECT).
      - name: Fetch pinned design gate (row-7 delegation)
        env:
          PIN: 3bfa8f64cafa482a17ed89790f7be02c2e320628
        run: |
          mkdir -p /tmp/design-gate-pin
          for f in tools/design_gate.py smart-blocks/manifest.json; do
            out="/tmp/design-gate-pin/$(basename "$f")"
            curl -sfL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${f}?ref=${PIN}" \
              | python3 -c "import json,sys,base64; d=json.load(sys.stdin); open('$out','w').write(base64.b64decode(d['content']).decode())" \
              && echo "pinned: $f" || echo "FETCH FAILED: $f (gate will fail closed)"
          done
      - name: Delivery gate — bound receipt or no shipment
        run: >-
          python3 tools/activation_gate.py --delivery
          --pr-head pr-head
          --pr ${{ github.event.pull_request.number }}
          --design-gate /tmp/design-gate-pin/design_gate.py
          --design-manifest /tmp/design-gate-pin/manifest.json
