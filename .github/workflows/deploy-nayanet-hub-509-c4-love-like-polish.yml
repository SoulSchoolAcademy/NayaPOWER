name: Deploy NayaNET Hub — 509 C4 Real Smart Feed Content

on:
  push:
    branches: [main]
    paths:
      - 'SMART FEED CONTENT'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js'
      - 'NAYANET/509-AAA-SURGICAL-LAYER.js'
      - 'NAYANET/509-AAA-NEXT-LEVEL.js'
      - 'NAYANET/509-AAA-SMART-FEED-C3.js'
      - 'NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js'
      - 'NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js'
      - 'NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js'
      - 'NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js'
      - '.github/workflows/deploy-nayanet-hub-509-c4-love-like-polish.yml'

permissions:
  contents: read

env:
  SOURCE_FILE: 2026 09 13 NayaNET HUB 509 AAA.html
  SMART_CONTENT_FILE: SMART FEED CONTENT
  REAL_CONTENT_FILE: NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js
  LAYER_FILE: NAYANET/509-AAA-SURGICAL-LAYER.js
  NEXT_LAYER_FILE: NAYANET/509-AAA-NEXT-LEVEL.js
  C3_LAYER_FILE: NAYANET/509-AAA-SMART-FEED-C3.js
  C4_LAYER_FILE: NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js
  UNIFIED_FILE: NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js
  RUNTIME_FILE: NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js
  POLISH_FILE: NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js
  WORKER_NAME: sparkling-shape-7ae5
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact triggering SHA
        id: source
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          test "${#SHA}" -eq 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Verify source, content, and syntax
        run: |
          set -euo pipefail
          for f in "$SOURCE_FILE" "$SMART_CONTENT_FILE" "$REAL_CONTENT_FILE" "$LAYER_FILE" "$NEXT_LAYER_FILE" "$C3_LAYER_FILE" "$C4_LAYER_FILE" "$UNIFIED_FILE" "$RUNTIME_FILE" "$POLISH_FILE"; do test -s "$f"; done
          for f in "$REAL_CONTENT_FILE" "$LAYER_FILE" "$NEXT_LAYER_FILE" "$C3_LAYER_FILE" "$C4_LAYER_FILE" "$UNIFIED_FILE" "$RUNTIME_FILE" "$POLISH_FILE"; do node --check "$f"; done
          grep -Fq 'Intelligent Hub' "$SOURCE_FILE"
          grep -Fq 'IN A NUTSHELL' "$SOURCE_FILE"
          grep -Fq 'SMART NOTE 01' "$SMART_CONTENT_FILE"
          grep -Fq 'SMART NOTE 09' "$SMART_CONTENT_FILE"
          echo SOURCE_CONTENT_AND_SYNTAX=PASS
      - name: Build generated real-content layer and calculate exact hashes
        id: hash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          template = Path('NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js').read_text(encoding='utf-8')
          source = Path('SMART FEED CONTENT').read_bytes()
          payload = base64.b64encode(source).decode('ascii')
          generated = template.replace('__SMART_FEED_B64__', payload)
          Path('/tmp/naya-509-real-smart-feed-content.js').write_text(generated, encoding='utf-8')
          PY
          node --check /tmp/naya-509-real-smart-feed-content.js
          echo "source=$(sha256sum "$SOURCE_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "smart_content=$(sha256sum "$SMART_CONTENT_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "real_template=$(sha256sum "$REAL_CONTENT_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "real_generated=$(sha256sum /tmp/naya-509-real-smart-feed-content.js|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "layer=$(sha256sum "$LAYER_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "next=$(sha256sum "$NEXT_LAYER_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "c3=$(sha256sum "$C3_LAYER_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "c4=$(sha256sum "$C4_LAYER_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "unified=$(sha256sum "$UNIFIED_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "runtime=$(sha256sum "$RUNTIME_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "polish=$(sha256sum "$POLISH_FILE"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Build exact release
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          SOURCE_HASH: ${{ steps.hash.outputs.source }}
          SMART_CONTENT_HASH: ${{ steps.hash.outputs.smart_content }}
          REAL_TEMPLATE_HASH: ${{ steps.hash.outputs.real_template }}
          REAL_GENERATED_HASH: ${{ steps.hash.outputs.real_generated }}
          LAYER_HASH: ${{ steps.hash.outputs.layer }}
          NEXT_HASH: ${{ steps.hash.outputs.next }}
          C3_HASH: ${{ steps.hash.outputs.c3 }}
          C4_HASH: ${{ steps.hash.outputs.c4 }}
          UNIFIED_HASH: ${{ steps.hash.outputs.unified }}
          RUNTIME_HASH: ${{ steps.hash.outputs.runtime }}
          POLISH_HASH: ${{ steps.hash.outputs.polish }}
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp "$SOURCE_FILE" release/public/index.html
          cp "$LAYER_FILE" release/public/naya-509-aaa.js
          cp "$NEXT_LAYER_FILE" release/public/naya-509-next-level.js
          cp "$C3_LAYER_FILE" release/public/naya-509-smart-feed-c3.js
          cp "$C4_LAYER_FILE" release/public/naya-509-intelligent-board-c4.js
          cp "$UNIFIED_FILE" release/public/naya-509-c4-unified-board-repair.js
          cp "$RUNTIME_FILE" release/public/naya-509-c4-single-board-runtime-repair.js
          cp "$POLISH_FILE" release/public/naya-509-c4-love-like-personal-polish.js
          cp /tmp/naya-509-real-smart-feed-content.js release/public/naya-509-real-smart-feed-content.js
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('release/public/index.html'); s=p.read_text(encoding='utf-8')
          marker=(f'<meta name="nayanet-canonical-source" content="509-AAA-GITHUB-DRAFT">'
                  f'<meta name="nayanet-source-commit" content="{os.environ["SOURCE_COMMIT"]}">'
                  f'<meta name="nayanet-source-sha256" content="{os.environ["SOURCE_HASH"]}">'
                  f'<meta name="nayanet-smart-feed-content-sha256" content="{os.environ["SMART_CONTENT_HASH"]}">'
                  f'<meta name="nayanet-real-content-template-sha256" content="{os.environ["REAL_TEMPLATE_HASH"]}">'
                  f'<meta name="nayanet-real-content-generated-sha256" content="{os.environ["REAL_GENERATED_HASH"]}">'
                  f'<meta name="nayanet-aaa-layer-sha256" content="{os.environ["LAYER_HASH"]}">'
                  f'<meta name="nayanet-aaa-next-level-sha256" content="{os.environ["NEXT_HASH"]}">'
                  f'<meta name="nayanet-aaa-smart-feed-c3-sha256" content="{os.environ["C3_HASH"]}">'
                  f'<meta name="nayanet-aaa-intelligent-board-c4-sha256" content="{os.environ["C4_HASH"]}">'
                  f'<meta name="nayanet-aaa-c4-unified-board-repair-sha256" content="{os.environ["UNIFIED_HASH"]}">'
                  f'<meta name="nayanet-aaa-c4-single-board-runtime-repair-sha256" content="{os.environ["RUNTIME_HASH"]}">'
                  f'<meta name="nayanet-aaa-c4-love-like-personal-polish-sha256" content="{os.environ["POLISH_HASH"]}">')
          inject=('<script src="/naya-509-aaa.js"></script><script src="/naya-509-next-level.js"></script>'
                  '<script src="/naya-509-smart-feed-c3.js"></script><script src="/naya-509-intelligent-board-c4.js"></script>'
                  '<script src="/naya-509-c4-unified-board-repair.js"></script><script src="/naya-509-c4-single-board-runtime-repair.js"></script>'
                  '<script src="/naya-509-c4-love-like-personal-polish.js"></script><script src="/naya-509-real-smart-feed-content.js"></script>')
          s=s.replace('</head>',marker+inject+'</head>',1); p.write_text(s,encoding='utf-8')
          PY
          cat > release/worker.js <<'EOF'
          export default { async fetch(request, env) { const url = new URL(request.url); const spa = url.pathname === '/' || url.pathname === '/index.html' || url.pathname.startsWith('/intelligence/'); const req = spa ? new Request(new URL('/index.html', request.url), request) : request; const response = await env.ASSETS.fetch(req); const headers = new Headers(response.headers); headers.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0'); headers.set('Pragma','no-cache'); headers.set('X-NayaNET-Canonical-Source','509-AAA-GITHUB-DRAFT'); headers.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT); headers.set('X-NayaNET-Source-SHA256',env.SOURCE_HASH); return new Response(response.body,{status:response.status,statusText:response.statusText,headers}); } };
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$SOURCE_COMMIT","SOURCE_HASH":"$SOURCE_HASH"}}
          EOF
      - name: Deploy 509 C4 real Smart Feed content
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Independently verify runtime parity
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          SOURCE_HASH: ${{ steps.hash.outputs.source }}
          SMART_CONTENT_HASH: ${{ steps.hash.outputs.smart_content }}
          REAL_GENERATED_HASH: ${{ steps.hash.outputs.real_generated }}
          NEXT_HASH: ${{ steps.hash.outputs.next }}
          C3_HASH: ${{ steps.hash.outputs.c3 }}
          C4_HASH: ${{ steps.hash.outputs.c4 }}
          UNIFIED_HASH: ${{ steps.hash.outputs.unified }}
          RUNTIME_HASH: ${{ steps.hash.outputs.runtime }}
          POLISH_HASH: ${{ steps.hash.outputs.polish }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            code=$(curl -LsS --connect-timeout 5 --max-time 10 -o /tmp/r -w '%{http_code}' "$RUNTIME/?probe=$attempt&source=$SOURCE_COMMIT" || true)
            smart=$(curl -LsS --connect-timeout 5 --max-time 10 -o /tmp/s -w '%{http_code}' "$SMART_LINK?probe=$attempt&source=$SOURCE_COMMIT" || true)
            real_code=$(curl -LsS --connect-timeout 5 --max-time 10 -o /tmp/real -w '%{http_code}' "$RUNTIME/naya-509-real-smart-feed-content.js?probe=$attempt" || true)
            body_commit=$(grep -o 'nayanet-source-commit" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            body_hash=$(grep -o 'nayanet-source-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            content_hash=$(grep -o 'nayanet-smart-feed-content-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            generated_hash=$(grep -o 'nayanet-real-content-generated-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            next_hash=$(grep -o 'nayanet-aaa-next-level-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            c3_hash=$(grep -o 'nayanet-aaa-smart-feed-c3-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            c4_hash=$(grep -o 'nayanet-aaa-intelligent-board-c4-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            unified_hash=$(grep -o 'nayanet-aaa-c4-unified-board-repair-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            runtime_hash=$(grep -o 'nayanet-aaa-c4-single-board-runtime-repair-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            polish_hash=$(grep -o 'nayanet-aaa-c4-love-like-personal-polish-sha256" content="[^"]*"' /tmp/r|head -1|sed 's/.*content="//;s/"$//' || true)
            note09=$(grep -c 'SMART NOTE 09' /tmp/real || true)
            if [ "$code" = 200 ] && [ "$smart" = 200 ] && [ "$real_code" = 200 ] && [ "$body_commit" = "$SOURCE_COMMIT" ] && [ "$body_hash" = "$SOURCE_HASH" ] && [ "$content_hash" = "$SMART_CONTENT_HASH" ] && [ "$generated_hash" = "$REAL_GENERATED_HASH" ] && [ "$next_hash" = "$NEXT_HASH" ] && [ "$c3_hash" = "$C3_HASH" ] && [ "$c4_hash" = "$C4_HASH" ] && [ "$unified_hash" = "$UNIFIED_HASH" ] && [ "$runtime_hash" = "$RUNTIME_HASH" ] && [ "$polish_hash" = "$POLISH_HASH" ] && [ "$note09" -ge 1 ]; then
              ok=1; echo "RUNTIME_PARITY=PASS ATTEMPT=$attempt REAL_CONTENT=PASS"; break
            fi
            echo "ATTEMPT=$attempt ROOT=$code SMART=$smart REAL=$real_code BODY_COMMIT=$body_commit CONTENT_HASH=$content_hash GENERATED_HASH=$generated_hash NOTE09=$note09"; sleep 5
          done
          test "$ok" -eq 1
          echo PUBLIC_RUNTIME_509_C4_REAL_SMART_FEED=PASS