# RETIRED — legacy V12 deployment path
# The old 2026-09-08 452/V12 artifact was no longer authoritative and was
# causing false release failures against the current NayaNET cognitive Hub.
# Production authority is .github/workflows/deploy-current-nayanet-hub.yml.
name: Retired Supreme V12 Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retirement
        run: |
          echo 'LEGACY_V12_DEPLOYMENT=RETIRED'
          echo 'CURRENT_DEPLOYMENT=.github/workflows/deploy-current-nayanet-hub.yml'
          echo 'CURRENT_SOURCE=2026 09 09 1213 NAYANET HUB.html'
          echo 'CURRENT_RUNTIME=https://nayanet-v7-intelligent-hub.nayanet.workers.dev'
          echo 'RULE=ONE_CURRENT_HUB_DEPLOYMENT_AUTHORITY'
