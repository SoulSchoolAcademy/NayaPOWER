name: Spec Integrity

# Verifies ratified machine-readable governance specs (Nonstop Loop, Captain
# Protocol) are intact: blob pins match the manifest, the envelope is
# director-ratified, phases form a clean sequence, invariants are present.
# Spec integrity only — this check does NOT enforce agent conduct and reads
# no agent behavior. A deliberate spec change must update the manifest pins
# in the same (reviewed) PR.

on:
  pull_request:
  push:
    branches: ["main"]

# Rate-limit discipline: a rapid push burst must not run N stale copies of
# this gate. Only the newest run per PR (or per ref on push) survives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spec-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ratified spec integrity
        run: python tools/spec_integrity_check.py
