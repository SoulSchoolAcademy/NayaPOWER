name: verify-canonical-ib-retrieval

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  canonical-ib-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical IB retrieval proof
        run: python -m unittest tests/test_canonical_ib_retrieval.py -v
