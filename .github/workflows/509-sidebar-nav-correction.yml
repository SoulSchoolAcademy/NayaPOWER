name: 509 Sidebar Nav Correction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/509-sidebar-nav-correction.yml'

jobs:
  correct:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Surgical sidebar correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html
          p=Path('snapshots/NayaNET-509-AAA-CURRENT.html')
          s=p.read_text()
          m=re.search(r'(<nav class="nav">)(.*?)(</nav>)',s,re.S)
          if not m: raise SystemExit('NAV_NOT_FOUND')
          nav=m.group(2)
          buttons=re.findall(r'<button\b[^>]*>.*?</button>',nav,re.S)
          def clean(b): return ' '.join(html.unescape(re.sub(r'<[^>]+>',' ',b)).split())
          def norm(t): return re.sub(r'[^a-z0-9]+',' ',t.lower()).strip()
          print('CURRENT_SIDEBAR_BUTTONS=',len(buttons))
          for i,b in enumerate(buttons,1): print(f'CURRENT_{i}: {clean(b)}')

          expected=['Your Intelligence Today','Your Reports','Intelligent Library','Smart Share','Smart Ledger','Your Connections','Smart Lists','Smart Spaces','Smart Mail']
          keys=[
            ['your intelligence today','intelligence today','today'],
            ['your reports','your report','reports','report'],
            ['intelligent library','intelligence library','library'],
            ['smart share','collective'],
            ['smart ledger','ledger','evidence'],
            ['your connections','connections','connection'],
            ['smart lists','lists','list'],
            ['smart spaces','spaces','space'],
            ['smart mail','mail'],
          ]
          used=set(); out=[]
          def button_text(b):
            return norm(clean(b))
          for want, ks in zip(expected,keys):
            pick=None
            for i,b in enumerate(buttons):
              if i in used: continue
              t=button_text(b)
              if any(norm(k) in t for k in ks): pick=(i,b); break
            if pick:
              i,b=pick; used.add(i)
              nb=re.sub(r'(<span class="ico">.*?</span>).*?(</button>)',lambda x:x.group(1)+want+x.group(2),b,count=1,flags=re.S)
              out.append(nb)
              continue
            # Missing sidebar destination: only add it if the existing application source already exposes
            # a matching navigation handler. Never invent a dead/placeholder control.
            candidates=[]
            for onclick in re.findall(r'onclick=["\']([^"\']+)["\']',s,re.I):
              low=onclick.lower()
              if any(re.search(r'\b'+re.escape(k)+r'\b',low) for k in ks): candidates.append(onclick)
            if not candidates:
              raise SystemExit(f'MISSING_REAL_HANDLER_FOR: {want}')
            handler=candidates[0]
            out.append(f'<button type="button" onclick="{html.escape(handler,quote=True)}"><span class="ico">•</span>{want}</button>')
          newnav=''.join(out)
          s=s[:m.start(2)]+newnav+s[m.end(2):]
          marker='<!-- NAYA509-SIDEBAR-NAV-CORRECTED -->'
          if marker not in s: s=s.replace('</head>',marker+'</head>',1)
          p.write_text(s)
          print('TARGET_SIDEBAR=', ' | '.join(expected))
          PY

      - name: Verify GitHub artifact before deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('snapshots/NayaNET-509-AAA-CURRENT.html').read_text()
          nav=re.search(r'<nav class="nav">(.*?)</nav>',s,re.S).group(1)
          labels=[]
          for b in re.findall(r'<button\b[^>]*>.*?</button>',nav,re.S):
            x=re.sub(r'<[^>]+>',' ',b); labels.append(' '.join(x.split()))
          expected=['Your Intelligence Today','Your Reports','Intelligent Library','Smart Share','Smart Ledger','Your Connections','Smart Lists','Smart Spaces','Smart Mail']
          assert labels[:9]==expected,(labels,expected)
          assert not any(x.lower()=='home' for x in labels[:9])
          assert not any(x.lower()=='smart notes' for x in labels[:9])
          print('GITHUB_SIDEBAR_ORDER=PASS')
          print('GITHUB_NO_HOME=PASS')
          print('GITHUB_NO_SMART_NOTES=PASS')
          PY

      - name: Commit exact corrected GitHub artifact
        run: |
          git config user.name 'Naya'
          git config user.email 'naya@users.noreply.github.com'
          git add snapshots/NayaNET-509-AAA-CURRENT.html
          git commit -m '509: correct Intelligent Hub sidebar navigation' || echo 'NO_ARTIFACT_CHANGES'
          git push

      - name: Prepare exact artifact for production
        run: |
          rm -rf release
          mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cat > release/worker.js <<'EOF'
          export default { async fetch(request, env) { return env.ASSETS.fetch(request); } };
          EOF
          cat > release/wrangler.jsonc <<'EOF'
          {
            "name": "sparkling-shape-7ae5",
            "main": "worker.js",
            "compatibility_date": "2026-09-14",
            "assets": { "directory": "./public", "binding": "ASSETS" }
          }
          EOF
          grep -q 'Your Intelligence Today' release/public/index.html
          grep -q 'Your Reports' release/public/index.html
          grep -q 'Smart Lists' release/public/index.html
          grep -q 'Smart Spaces' release/public/index.html
          echo EXACT_GITHUB_ARTIFACT_PREPARED=PASS

      - name: Deploy exact artifact to existing production worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b5e2a51b3e883f7722287c5f51b1196b
          workingDirectory: release
          command: deploy

      - name: Verify exact live result
        run: |
          set -e
          curl -fsSL --max-time 30 https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/ -o /tmp/live.html
          python - <<'PY'
          import re
          s=open('/tmp/live.html',encoding='utf-8').read()
          nav=re.search(r'<nav class="nav">(.*?)</nav>',s,re.S).group(1)
          labels=[]
          for b in re.findall(r'<button\b[^>]*>.*?</button>',nav,re.S):
            x=re.sub(r'<[^>]+>',' ',b); labels.append(' '.join(x.split()))
          expected=['Your Intelligence Today','Your Reports','Intelligent Library','Smart Share','Smart Ledger','Your Connections','Smart Lists','Smart Spaces','Smart Mail']
          print('LIVE_SIDEBAR=',labels)
          assert labels[:9]==expected,(labels,expected)
          assert ' Home' not in ' '+' '.join(labels[:9])
          assert 'Smart Notes' not in ' | '.join(labels[:9])
          assert 'NAYA509-SIDEBAR-NAV-CORRECTED' in s
          print('LIVE_SIDEBAR_ORDER=PASS')
          print('LIVE_NO_HOME=PASS')
          print('LIVE_NO_SMART_NOTES=PASS')
          print('LIVE_CORRECTION_MARKER=PASS')
          PY
