            const {data:grant,error:grantError}=await client.rpc('nayanet_issue_authority_grant',{p_subject_id:auth.runtime.user_id,p_source_event_id:'human-e2e-authority-'+eventId,p_mission_id:'Human E2E learned successor action',p_scope:{project_id:'NayaNET',target:receiver.member_id,space_id:spaceId},p_actions:['smart_mail_send'],p_constraints:{mode:'human-e2e-compounding',no_external_side_effects:true},p_expires_at:new Date(Date.now()+600000).toISOString(),p_evidence:{human_event_id:eventId,learning_evidence_id:evidence.id},p_parent_authority:null});if(grantError||!grant?.grant_id)throw new Error('CONSOLIDATED_AUTHORITY_GRANT_FAILED:'+JSON.stringify(grantError||grant));
