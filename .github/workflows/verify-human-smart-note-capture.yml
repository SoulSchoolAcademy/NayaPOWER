name: Verify Human Hub Smart Note Capture

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/src/app/AppShellV3.tsx'
      - 'NAYANET/HUB/src/intelligence/SmartFeedBoard.tsx'
      - 'NAYANET/HUB/src/data/pis.ts'
      - 'NAYANET/HUB/public/assistant-runtime.js'
      - 'NAYANET/name-first-auth-adapter.js'
      - '.github/workflows/verify-human-smart-note-capture.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source SHA to test'
        required: true
        type: string
      deployed_source_sha:
        description: 'Source SHA known to be deployed at HUB_URL'
        required: false
        type: string

permissions:
  contents: read

jobs:
  human-capture:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      DEPLOYED_SOURCE_SHA: ${{ inputs.deployed_source_sha || github.sha }}
    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1

      - name: Assert source identity before browser test
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SOURCE_SHA=$EXPECTED_SOURCE_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          echo "DEPLOYED_SOURCE_SHA=$DEPLOYED_SOURCE_SHA"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          if [ -n "$DEPLOYED_SOURCE_SHA" ]; then test "$actual" = "$DEPLOYED_SOURCE_SHA"; fi

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute human capture → receiver → feed → reload
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hub = process.env.HUB_URL;
          const expectedSha = process.env.EXPECTED_SOURCE_SHA;
          const deployedSha = process.env.DEPLOYED_SOURCE_SHA;
          const trace=[];
          const mark=(step,extra={})=>{trace.push({step,at:new Date().toISOString(),...extra});console.log('HUMAN_CAPTURE_TRACE',JSON.stringify(trace.at(-1)))};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({serviceWorkers:'block'});
            const page=await context.newPage();
            const alias=('humanui'+process.env.GITHUB_RUN_ID+'-'+crypto.randomBytes(4).toString('hex')).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
            const title='Human Hub Capture Proof '+process.env.GITHUB_RUN_ID;
            const content='A real human-facing NayaNET Hub capture control must send this note through the canonical Smart Note receiver and preserve the same event identity into Smart Feed and reload.';
            mark('SOURCE_IDENTITY',{expectedSha,deployedSha});
            await page.goto(hub+'/?name='+encodeURIComponent('Naya Human Capture Proof')+'&alias='+encodeURIComponent(alias),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.NayaNETNameFirstAuth?.establish,{timeout:30000});
            const established=await page.evaluate(async({name,alias})=>window.NayaNETNameFirstAuth.establish({name,alias}),{name:'Naya Human Capture Proof',alias});
            if(!established?.authenticated||!established?.userId)throw new Error('AUTHENTICATION_ESTABLISH_FAILED');
            mark('AUTHENTICATED',{userId:established.userId});
            await page.goto(hub+'/?naya_release='+encodeURIComponent(expectedSha),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.NayaAssistantRuntime,{timeout:30000});
            await page.locator('.shell').waitFor({state:'visible',timeout:30000});
            mark('CANONICAL_HUB_SHELL_VISIBLE',{title:await page.title(),marker:await page.locator('meta[name="nayanet-canonical-marker"]').getAttribute('content').catch(()=>null)});
            const runtime=await page.evaluate(()=>({runtime:!!window.NayaAssistantRuntime,auth:window.NayaAssistantRuntime?.snapshot?.()}));
            if(!runtime.runtime||!runtime.auth?.authenticated)throw new Error('HUB_RUNTIME_NOT_AUTHENTICATED');
            const captureButton=page.locator('[data-ws-action="open-notes"]').first();
            await captureButton.waitFor({state:'visible',timeout:30000}); await captureButton.click();
            await page.evaluate(()=>{const rt=window.NayaAssistantRuntime;window.__humanCaptureResult=null;const original=rt.captureSmartNote.bind(rt);rt.captureSmartNote=async(...args)=>{const result=await original(...args);window.__humanCaptureResult=result;return result};});
            await page.getByTestId('smart-note-capture-submit').waitFor({state:'visible',timeout:30000});
            await page.getByTestId('smart-note-title').fill(title); await page.getByTestId('smart-note-content').fill(content); await page.getByTestId('smart-note-capture-submit').click();
            await page.waitForFunction(()=>!!window.__humanCaptureResult,{timeout:30000});
            const result=await page.evaluate(()=>window.__humanCaptureResult); const tx=result?.transaction||{};
            const eventId=result?.event?.event_id||result?.event_id||tx?.evidence?.event_id||tx?.hub_state?.event_id||'';
            if(!eventId||!tx?.id)throw new Error('CANONICAL_CAPTURE_RESULT_INCOMPLETE');
            mark('CAPTURE_VERIFIED',{eventId,transactionId:tx.id});
            await page.goto(hub+'/feed?event_id='+encodeURIComponent(eventId)+'&stream=personal',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.feed .blocks').waitFor({state:'visible',timeout:30000}); mark('FEED_ROUTE_REACHED',{url:page.url()});
            const feedDiagnostic=await page.evaluate(async({eventId})=>{const rt=window.NayaAssistantRuntime;const data=await rt.smartFeed({stream:'personal',limit:50,before:null});const items=Array.isArray(data?.items)?data.items:[];const matching=items.filter(x=>String(x?.event_id||x?.id||'')===String(eventId));const blocks=[...document.querySelectorAll('.feed .blocks [data-event-id]')].map(x=>({event_id:x.getAttribute('data-event-id'),real:x.hasAttribute('data-real-smart-note'),display:getComputedStyle(x).display}));return{item_count:items.length,matching_count:matching.length,matching:matching.map(x=>({id:x.id,event_id:x.event_id,title:x.title,source_id:x.source_id,status:x.status,has_block:!!x.intelligent_block})),canonical_flag:document.documentElement.dataset.nayaCanonicalSmartFeed||null,canonical_meta:!!document.querySelector('meta[name="nayanet-direct-nine"]'),blocks_count:blocks.length,blocks:blocks.slice(0,30),body_has_event:document.body.innerText.includes(String(eventId))};},{eventId});
            mark('FEED_RUNTIME_DIAGNOSTIC',feedDiagnostic);
            const board=page.locator('[data-real-smart-note][data-event-id="'+eventId+'"]');
            await board.waitFor({state:'visible',timeout:30000});
            mark('FEED_BOARD_VISIBLE',{eventId});
            const activityTab=page.locator('.feedNav button[data-feed="activity"]');
            await activityTab.waitFor({state:'visible',timeout:30000});
            await activityTab.click();
            await page.waitForFunction(()=>document.querySelector('.feedNav button[data-feed="activity"]')?.classList.contains('active'),{timeout:30000});
            const activity=page.locator('[data-real-smart-note][data-event-id="'+eventId+'"]');
            await activity.waitFor({state:'visible',timeout:30000});
            mark('ACTIVITY_EXACT_EVENT_PRESERVED',{eventId});
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            const restored=page.locator('[data-real-smart-note][data-event-id="'+eventId+'"]');
            await restored.waitFor({state:'visible',timeout:30000});
            mark('RELOAD_EXACT_EVENT_PRESERVED',{eventId});
            const proof={status:'VERIFIED',expected_source_sha:expectedSha,deployed_source_sha:deployedSha,event_id:eventId,transaction_id:tx.id,checks:{source_identity:'PASS',human_capture_control:'PASS',canonical_receiver:'PASS',same_event_identity:'PASS',smart_feed_render:'PASS',reload_identity:'PASS'},trace};
            fs.writeFileSync('human-smart-note-capture-proof.json',JSON.stringify(proof,null,2)+'\\n');
            console.log(JSON.stringify(proof));
            await context.close();await browser.close();
          })().catch(async error=>{fs.writeFileSync('human-smart-note-capture-proof.json',JSON.stringify({status:'FAILED',expected_source_sha:expectedSha,deployed_source_sha:deployedSha,error:String(error?.stack||error),trace},null,2)+'\\n');console.error(error);process.exit(1)});
          NODE

      - name: Upload human capture proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-smart-note-capture-proof
          path: human-smart-note-capture-proof.json
          if-no-files-found: error

# CURRENT-MAIN-HUMAN-PROOF-REVALIDATION-TRIGGER-2026-09-25
