            page.on('console',message=>{if(message.text().includes('PIS_LIVE_INDEX_TRACE')){pisMapped.push(message.text());console.log('PIS_BROWSER_MAPPING_TRACE',message.text())}});
            const alias=('humanui'+process.env.GITHUB_RUN_ID+'-'+crypto.randomBytes(4).toString('hex')).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
