name: Verify Human Hub Smart Note Capture

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/src/app/AppShellV3.tsx'
      - 'NAYANET/HUB/src/intelligence/SmartFeedBoard.tsx'
      - 'NAYANET/HUB/src/data/pis.ts'
      - 'NAYANET/HUB/public/assistant-runtime.js'
      - '.github/workflows/verify-human-smart-note-capture.yml'
  workflow_dispatch:

# Naya execution checkpoint: run the existing human Smart Note capture proof on the current main push.

permissions:
  contents: read

jobs:
  human-capture:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute human capture → receiver → feed → reload
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hub = process.env.HUB_URL;
          const trace=[];
          const mark=(step,extra={})=>{trace.push({step,at:new Date().toISOString(),...extra});console.log('HUMAN_CAPTURE_TRACE',JSON.stringify(trace.at(-1)))};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({serviceWorkers:'block'});
            const page=await context.newPage();
