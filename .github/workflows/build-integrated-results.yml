name: Build Integrated MAXESS Results

# This workflow mutates repository source and pushes a commit. It is therefore
# an explicitly invoked control-plane action, not an automatic push reaction.
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit authorization to mutate and push the Results artifact
        required: true
        type: choice
        options:
          - EXPLICIT_APPROVAL_GRANTED
          - DENY

permissions:
  contents: write

jobs:
  build:
    if: inputs.approval == 'EXPLICIT_APPROVAL_GRANTED'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce canonical NayaPOWER governance kernel
        shell: bash
        run: |
          set -euo pipefail
          python .naya/control-plane/workflow_gate.py \
            --actor "${{ github.actor }}" \
            --purpose "integrated-results-repository-mutation" \
            --permission "repo:write:integrated-results" \
            --request "mutate:MAXESS-RESULTS-INTEGRATED-V1.html" \
            --mission "Surgically repair the existing complete MAXESS Results artifact" \
            --uncertainty 2 \
            --consequence 4 \
            --irreversibility 3 \
            --scope '{"repository":"SoulSchoolAcademy/NayaPOWER","path":"MAXESS-RESULTS-INTEGRATED-V1.html","operation":"surgical-write-and-push"}' \
            --evidence "workflow_dispatch approval granted" \
            --evidence "existing complete Results artifact required"

      - name: Surgical bridge repair on the existing complete Results artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          output = Path('MAXESS-RESULTS-INTEGRATED-V1.html')
          bridge = Path('MAXESS-RESULT-CONSUMER-V2.html')

          if not output.exists():
              raise SystemExit('Complete Results artifact is missing; refusing to synthesize or redesign it.')
          if not bridge.exists():
              raise SystemExit('MAXESS result consumer bridge is missing.')

          page = output.read_text(encoding='utf-8')
          consumer = bridge.read_text(encoding='utf-8').strip()
          marker = '<!-- MAXESS V2 BRIDGE INTEGRATION -->'

          if marker not in page:
              insertion = '\n' + marker + '\n' + consumer + '\n'
              match = re.search(r'</body>\s*</html>\s*$', page, re.I | re.S)
              if match:
                  page = page[:match.start()] + insertion + page[match.start():]
              else:
                  page = page.rstrip() + insertion

          required = ['<html', '<head>', '<body', '</html>', 'MAXESS_RESULT_V1', 'MAXESS_RESULT_READY', 'maxess:result-updated', 'MAXESS V2 BRIDGE INTEGRATION']
          missing = [x for x in required if x.lower() not in page.lower()]
          if missing:
              raise SystemExit(f'Integrated artifact missing required markers: {missing}')

          output.write_text(page, encoding='utf-8')
          print(f'Wrote {output} ({output.stat().st_size} bytes)')
          PY

      - name: Verify complete Results sections survived
        run: |
          grep -q 'id="e01"' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'id="e02"' MAXESS-RESULTS-INTEGRATED-V1.html || grep -q 'id="maxess-e02-v' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'id="e03"' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'id="e04"' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'MAXESS V2 BRIDGE INTEGRATION' MAXESS-RESULTS-INTEGRATED-V1.html
          echo 'MAXESS COMPLETE RESULTS STRUCTURAL QA: PASS'

      - name: Commit integrated artifact
        run: |
          git config user.name 'MAXESS Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'MAXESS-RESULTS-INTEGRATED-V1.html'
          git diff --cached --quiet || git commit -m 'Build complete MAXESS Results page with repaired V2 score bridge'
          git push

# Guardrail: never rebuild the complete Results page from a missing/unknown source.
# Preserve the existing complete artifact and apply only additive bridge repairs.
