name: NayaNET Universal Envelope — Hub Runtime sender coverage proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-universal-envelope-hub-runtime-sender.yml'
      - '.github/scripts/universal-envelope-hub-runtime-sender.mjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  hub-runtime-sender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      RUN_IDENTITY: hub-runtime-envelope-sender
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute Hub runtime sender proof
        run: node .github/scripts/universal-envelope-hub-runtime-sender.mjs
      - name: Upload sender coverage proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-envelope-hub-runtime-sender-proof
          path: universal-envelope-hub-runtime-sender-proof.json
          if-no-files-found: error
