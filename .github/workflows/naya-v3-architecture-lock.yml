name: Naya v3 Architecture Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  architecture-lock:
    name: Protect Constitution v2 during architecture phase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify architecture mandate exists
        run: test -f GOVERNANCE/NAYA-V3-ARCHITECTURE-MANDATE.md

      - name: Block constitutional v2 changes during architecture-only phase
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          changed="$(git diff --name-only "$base" "$head" -- GOVERNANCE/NAYA-COLLECTIVE-AGREEMENT-v2.0.md)"
          if [ -n "$changed" ]; then
            echo "CONSTITUTION LOCK: v2.0 constitutional prose may not be changed during the architecture-only phase."
            echo "Complete and accept NAYA-V3-ARCHITECTURE-SPECIFICATION.md before constitutional rewriting."
            exit 1
          fi

      - name: Require architecture specification before constitutional phase can open
        run: |
          if [ -f NAYA-V3-ARCHITECTURE-SPECIFICATION.md ]; then
            echo "Architecture specification present. Constitutional phase still requires explicit governance acceptance."
          else
            echo "Architecture specification not yet present: constitutional v2 remains locked."
          fi

      - name: Enforce UNKNOWN is never silently green in architecture artifacts
        shell: bash
        run: |
          if grep -RniE 'UNKNOWN.*(VERIFIED|GREEN)|UNKNOWN.*PASS|UNKNOWN.*COMPLETE' NAYA-V3-ARCHITECTURE-SPECIFICATION.md 2>/dev/null; then
            echo "Architecture gate failed: UNKNOWN cannot be represented as VERIFIED, GREEN, PASS, or COMPLETE without evidence."
            exit 1
          fi
