name: Verify Cold Applicability Action Outcome Learning

on:
  push:
    branches: [main]
    paths:
      - '.naya/runtime/verify_cold_applicability_action_outcome_learning.py'
      - '.naya/project-intelligence/2026-09-23-SMART-NOTE-COMPOUNDING-LOOP-PROOF.json'
      - '.naya/control-plane/PROOF.json'
      - '.github/workflows/verify-cold-applicability-action-outcome-learning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile existing production proof chain
        run: python .naya/runtime/verify_cold_applicability_action_outcome_learning.py
