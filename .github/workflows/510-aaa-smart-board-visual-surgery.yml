# V10 CANONICAL VISUAL AUTHORITY — current-artifact surgical correction
name: 510 Smart Board V10 Canonical Visual Authority
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/510-aaa-smart-board-visual-surgery.yml'
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canonical-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final geometry to the existing V10 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html'); s=p.read_text(encoding='utf-8')
          def remove(src,tag,marker):
              pat=r'<'+tag+r'\b[^>]*'+re.escape(marker)+r'[^>]*>.*?</'+tag+r'>'
              return re.sub(pat,'',src,flags=re.S|re.I)
          s=remove(s,'style','NAYA-SMART-BOARD-V10-SURGICAL-FINAL')
          s=remove(s,'script','NAYA-SMART-BOARD-V10-SURGICAL-FINAL')
          css='''<style id="NAYA-SMART-BOARD-V10-SURGICAL-FINAL">
          .elite-board:first-child .nutshell b{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:24px!important;min-height:116px!important;padding:14px 30px!important;text-align:left!important;font-size:clamp(20px,2.1vw,29px)!important}
          .elite-board:first-child .nutshell b .v10-nutshell-star{width:78px!important;height:78px!important;flex:0 0 78px!important;margin:0!important}
          .elite-board:first-child .nutshell p,.elite-board .layerBody{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important}
          .elite-board:first-child .nutshell p{padding:27px 32px 33px!important}.elite-board .layerBody{padding:27px 32px 33px!important}
          .elite-board .layerHead{display:flex!important;align-items:center!important;gap:24px!important;min-height:116px!important;padding:14px 30px!important}
          .elite-board .layerHead .dot{width:78px!important;height:78px!important;flex:0 0 78px!important;margin:0!important}
          .elite-board .dot .v10-icon{width:58px!important;height:58px!important}
          .elite-board .layerHead b{font-size:clamp(20px,2.1vw,29px)!important;line-height:1.15!important;letter-spacing:.02em!important}
          .elite-board:first-child .blockTop{gap:28px!important}.elite-board:first-child .identity{gap:22px!important}.elite-board:first-child .glyph{width:116px!important;height:116px!important;flex:0 0 116px!important}.elite-board:first-child .glyph .v10-icon{width:78px!important;height:78px!important}
          @media(max-width:820px){.elite-board:first-child .nutshell b,.elite-board .layerHead{min-height:92px!important;padding:11px 18px!important;gap:14px!important}.elite-board:first-child .nutshell b .v10-nutshell-star{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .layerHead .dot{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .dot .v10-icon{width:46px!important;height:46px!important}.elite-board:first-child .nutshell p,.elite-board .layerBody{padding:20px 21px 25px!important;font-size:21px!important;line-height:1.58!important}}
          </style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          js='''<script id="NAYA-SMART-BOARD-V10-SURGICAL-FINAL">(()=>{
          const q=(s,r=document)=>r.querySelector(s),qq=(s,r=document)=>[...r.querySelectorAll(s)];
          const O=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];
          const A={'ADAPTIVE LEARNING':'LEARNING LESSON','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE','HOW TO APPLY':'HOW TO APPLY / HOW TO USE','CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','MACHINE / PROVENANCE':'MACHINE NOTE','SIGNIFICANCE':'WHAT IT MEANS','HUMAN VALUE':"WHAT'S IN IT FOR YOU"};
          const N=s=>String(s||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
          function run(){const boards=qq('#blocks > .block');boards.forEach((b,i)=>{b.classList.add('elite-board','naya-smart-board-v10');const h=q('h3',b);if(h&&i===0)h.textContent='What is Naya Power';const g=q('.glyph',b);if(g){const svg=q('.v10-icon',g);if(svg)g.replaceChildren(svg)}const n=q('.nutshell',b);if(n){const p=q('p',n),label=q('b',n);[...n.children].forEach(x=>{if(x!==label&&x!==p)x.remove()});if(label){label.replaceChildren();const star=document.createElement('span');star.className='v10-nutshell-star';star.setAttribute('aria-hidden','true');label.append(star,document.createTextNode('IN A NUTSHELL'));}}const layers=q('.layers',b);if(layers){const m=new Map();qq(':scope > .layer',layers).forEach(x=>{const h=q('.layerHead b',x);if(!h){x.remove();return}let t=A[N(h.textContent)]||N(h.textContent);if(!O.includes(t)){x.remove();return}h.textContent=t;m.set(t,x)});O.forEach(k=>{if(m.has(k))layers.appendChild(m.get(k))});}qq('.status',b).forEach(x=>x.remove());});const t=q('.top .title');if(t)t.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date());}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();})();</script>'''
          s=s.replace('</body>',js+'\n</body>',1)
          assert len(re.findall(r'<style\b[^>]*NAYA-SMART-BOARD-ELITE-REFINEMENT-V10[^>]*>',s,re.I))==1
          assert len(re.findall(r'<script\b[^>]*NAYA-SMART-BOARD-ELITE-REFINEMENT-V10[^>]*>',s,re.I))==1
          assert len(re.findall(r'<style\b[^>]*NAYA-SMART-BOARD-V10-SURGICAL-FINAL[^>]*>',s,re.I))==1
          assert len(re.findall(r'<script\b[^>]*NAYA-SMART-BOARD-V10-SURGICAL-FINAL[^>]*>',s,re.I))==1
          assert 'What is Naya Power' in s and 'HOW TO APPLY / HOW TO USE' in s and "WHAT'S IN IT FOR YOU" in s
          p.write_text(s,encoding='utf-8')
          print('V10_FINAL_GEOMETRY_READY')
          PY
      - name: Verify canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          test "$(grep -o 'NAYA-SMART-BOARD-ELITE-REFINEMENT-V10' "$f" | wc -l)" -eq 2
          test "$(grep -o 'NAYA-SMART-BOARD-V10-SURGICAL-FINAL' "$f" | wc -l)" -eq 2
          grep -q 'What is Naya Power' "$f"
          grep -q 'HOW TO APPLY / HOW TO USE' "$f"
          grep -q "WHAT'S IN IT FOR YOU" "$f"
          grep -q 'v10-nutshell-star' "$f"
          grep -q 'width:78px!important' "$f"
          grep -q 'font-size:clamp(20px,2.1vw,29px)!important' "$f"
          echo 'V10_FINAL_GEOMETRY_VERIFIED'
      - name: Commit canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NayaPOWER Automation'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then echo 'NO_CANONICAL_CHANGE'; exit 1; fi
          git commit -m 'Finalize congruent V10 Smart Board icon geometry'
          git pull --rebase origin main
          git push origin HEAD:main
