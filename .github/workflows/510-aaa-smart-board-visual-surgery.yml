name: 510 AAA Smart Board Visual Surgery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/510-aaa-smart-board-visual-surgery.yml'
      - '2026 09 15 NayaNETHUB.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-surgery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evolve canonical Smart Board presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('2026 09 15 NayaNETHUB.html')
          s = p.read_text(encoding='utf-8')
          marker = 'NAYA-AAA-SMART-BOARD-VISUAL-V1'
          if marker not in s:
              css = r'''<style id="naya-aaa-smart-board-visual-v1">
          :root{--sb-white:#f8fbff;--sb-human:#ff2fa4;--sb-child:#8b42ff;--sb-grandma:#4b5dff;--sb-naya:#ff9a5a;--sb-machine:#26c875;--sb-learning:#b8ee57;--sb-meaning:#f1d75a;--sb-gold:#e8c766;--sb-silver:#dfe6ee}
          .naya509-unified-board .block.naya509-board{border-color:color-mix(in srgb,var(--tone) 42%,#fff 8%);box-shadow:inset 0 1px #fff9,0 24px 55px #000b,0 0 34px color-mix(in srgb,var(--tone) 16%,transparent)}
          .naya509-unified-board .nutshell{position:relative;margin:22px 0 12px;padding:24px 24px 24px 82px;border:2px solid var(--sb-white);border-radius:22px;background:radial-gradient(360px 180px at 0 50%,#ffffff14,transparent 72%),linear-gradient(145deg,#111218,#07080b);box-shadow:inset 0 1px #fff9,0 18px 38px #000a,0 0 32px #f8fbff1c}
          .naya509-unified-board .nutshell:before{content:'◉';position:absolute;left:22px;top:50%;transform:translateY(-50%);width:43px;height:43px;border-radius:14px;display:grid;place-items:center;color:var(--sb-white);font-size:17px;background:radial-gradient(circle at 35% 25%,#fff8,#ffffff18 28%,#07080b 72%);border:2px solid #f8fbffcc;box-shadow:inset 0 2px #fff,0 8px 24px #000b,0 0 22px #f8fbff2a}
          .naya509-unified-board .nutshell b{color:var(--sb-white)}
          .naya509-unified-board .layers{display:flex!important;flex-direction:column!important;gap:12px!important}
          .naya509-unified-board .layer{position:relative;width:100%!important;border:2px solid color-mix(in srgb,var(--layer) 58%,#fff 10%)!important;border-radius:20px!important;background:linear-gradient(145deg,#101015,#07080b)!important;box-shadow:inset 0 1px #fff7,0 18px 38px #000a,0 0 30px color-mix(in srgb,var(--layer) 18%,transparent)!important;overflow:hidden}
          .naya509-unified-board .layer:before{content:'';position:absolute;inset:5px;border-radius:15px;border:1px solid color-mix(in srgb,var(--layer) 22%,transparent);box-shadow:inset 0 0 20px color-mix(in srgb,var(--layer) 6%,transparent);pointer-events:none}
          .naya509-unified-board .layer:after{content:'';position:absolute;inset:0;background:radial-gradient(420px 140px at 0 0,color-mix(in srgb,var(--layer) 12%,transparent),transparent 72%);pointer-events:none}
          .naya509-unified-board .layerHead{position:relative;z-index:1;min-height:72px;padding:12px 16px;border-bottom:1px solid color-mix(in srgb,var(--layer) 28%,#fff 6%)!important;gap:13px}
          .naya509-unified-board .layerHead b{font-size:15px!important;letter-spacing:.12em!important;color:#f7f4fa}
          .naya509-unified-board .layerBody{position:relative;z-index:1;padding:17px 18px 20px!important;color:#e9e5ed!important;font-size:14px!important;line-height:1.78!important}
          .naya509-unified-board .layerBody strong{color:#fff}
          .naya509-unified-board .dot{position:relative;flex:0 0 45px;width:45px!important;height:45px!important;border-radius:14px!important;background:radial-gradient(circle at 32% 25%,#fff9,transparent 16%),radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--layer) 42%,#fff 6%),#0a0b0f 68%)!important;border:2px solid color-mix(in srgb,var(--layer) 82%,#fff 18%)!important;box-shadow:inset 0 2px #fff7,inset 0 -4px 9px #0009,0 9px 22px #000b,0 0 20px color-mix(in srgb,var(--layer) 42%,transparent)!important;display:grid!important;place-items:center;font-size:0}
          .naya509-unified-board .dot:after{content:attr(data-icon);font-size:19px;font-weight:900;line-height:1;color:var(--layer);text-shadow:0 1px #fff5,0 0 13px color-mix(in srgb,var(--layer) 60%,transparent)}
          .naya509-unified-board .state{color:color-mix(in srgb,var(--layer) 70%,#aaa 30%)!important}
          .naya509-unified-board .layer.semantic-nutshell{--layer:var(--sb-white)!important}.naya509-unified-board .layer.semantic-human{--layer:var(--sb-human)!important}.naya509-unified-board .layer.semantic-child{--layer:var(--sb-child)!important}.naya509-unified-board .layer.semantic-grandma{--layer:var(--sb-grandma)!important}.naya509-unified-board .layer.semantic-naya{--layer:var(--sb-naya)!important}.naya509-unified-board .layer.semantic-machine{--layer:var(--sb-machine)!important}.naya509-unified-board .layer.semantic-learning{--layer:var(--sb-learning)!important}.naya509-unified-board .layer.semantic-meaning{--layer:var(--sb-meaning)!important}.naya509-unified-board .layer.semantic-apply{--layer:var(--sb-gold)!important}.naya509-unified-board .layer.semantic-value{--layer:var(--sb-silver)!important}
          .naya509-unified-board .semantic-human .layerHead b{color:#ffd1e9}.naya509-unified-board .semantic-child .layerHead b{color:#dfc8ff}.naya509-unified-board .semantic-grandma .layerHead b{color:#cbd2ff}.naya509-unified-board .semantic-naya .layerHead b{color:#ffd5bd}.naya509-unified-board .semantic-machine .layerHead b{color:#c8ffe0}.naya509-unified-board .semantic-learning .layerHead b{color:#e9ffc5}.naya509-unified-board .semantic-meaning .layerHead b{color:#fff4a8}.naya509-unified-board .semantic-apply .layerHead b{color:#ffefb0}.naya509-unified-board .semantic-value .layerHead b{color:#f4f7fb}
          .naya509-unified-board .naya509-board-top-actions{position:relative;z-index:3;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
          .naya509-unified-board .naya509-board-top-actions .action{min-height:42px!important;border-color:#8b63ff66!important;background:linear-gradient(145deg,#16131d,#08090d)!important;box-shadow:inset 0 1px #fff7,0 10px 24px #0009!important}
          .naya509-unified-board .naya509-board-top-actions .action:hover{transform:translateY(-2px) scale(1.015)}
          .naya509-unified-board .actions.naya509-actions-structured{padding-top:4px;border-top:1px solid #ffffff12}
          @media(max-width:800px){.naya509-unified-board .nutshell{padding:20px 18px 20px 70px}.naya509-unified-board .layerHead{min-height:64px}.naya509-unified-board .dot{flex-basis:40px;width:40px!important;height:40px!important}.naya509-unified-board .dot:after{font-size:17px}.naya509-unified-board .layerBody{font-size:13px!important}}
          </style>'''
              js = r'''<script id="naya-aaa-smart-board-visual-v1-script">(()=>{'use strict';const q=(s,r=document)=>r.querySelector(s),qq=(s,r=document)=>[...r.querySelectorAll(s)];const norm=s=>(s||'').replace(/\s+/g,' ').trim().toUpperCase();const spec=[['IN A NUTSHELL','semantic-nutshell','#f8fbff','◉'],['HUMAN NOTE','semantic-human','#ff2fa4','♥'],['CHILD NOTE','semantic-child','#8b42ff','●'],['GRANDMA NOTE','semantic-grandma','#4b5dff','◆'],['NAYA NOTE','semantic-naya','#ff9a5a','✦'],['MACHINE NOTE','semantic-machine','#26c875','⬡'],['ADAPTER LEARNING','semantic-learning','#b8ee57','↗'],['WHAT IT MEANS','semantic-meaning','#f1d75a','✧'],['HOW TO APPLY / HOW TO USE','semantic-apply','#e8c766','→'],["WHAT'S IN IT FOR YOU",'semantic-value','#dfe6ee','✚']];const aliases={'CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','MACHINE / PROVENANCE':'MACHINE NOTE','HOW TO USE':'HOW TO APPLY / HOW TO USE'};function classify(layer){const h=q('.layerHead b',layer);if(!h)return;let t=norm(h.textContent);if(aliases[t]){t=aliases[t];h.textContent=t}const found=spec.find(x=>x[0]===t);if(found){layer.className=layer.className.replace(/\bsemantic-\S+/g,'').trim();layer.classList.add(found[1]);layer.style.setProperty('--layer',found[2]);const dot=q('.dot',layer);if(dot)dot.setAttribute('data-icon',found[3]);}}function ensureUse(layers){const all=qq(':scope > .layer',layers),has=all.find(x=>norm(q('.layerHead b',x)?.textContent)==='HOW TO APPLY / HOW TO USE');if(has)return;const meaning=all.find(x=>norm(q('.layerHead b',x)?.textContent)==='WHAT IT MEANS');if(!meaning)return;const x=document.createElement('div');x.className='layer semantic-apply';x.style.setProperty('--layer','#e8c766');x.innerHTML='<div class="layerHead"><span class="dot" data-icon="→"></span><b>HOW TO APPLY / HOW TO USE</b><span class="state">ACTION GUIDANCE</span></div><div class="layerBody"><strong>Turn understanding into responsible action.</strong> Use the verified meaning, check the evidence, and take a concrete next step when one is supported. If no verified action exists, keep the intelligence in review rather than inventing certainty.</div>';meaning.after(x)}function run(){qq('.naya509-unified-board .nutshell').forEach(n=>{n.classList.add('semantic-nutshell');n.style.setProperty('--layer','#f8fbff')});qq('.naya509-unified-board .layers').forEach(layers=>{qq(':scope > .layer',layers).forEach(classify);ensureUse(layers);const map={};qq(':scope > .layer',layers).forEach(x=>{const h=q('.layerHead b',x);if(h)map[norm(h.textContent)]=x});spec.forEach(([name])=>{if(map[name])layers.appendChild(map[name])});qq(':scope > .layer',layers).forEach(classify)});}run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true})})();</script>'''
              s = s.replace('</head>', css + '\n</head>', 1)
              s = s.replace('</body>', '<!-- NAYA-AAA-SMART-BOARD-VISUAL-V1 -->\n' + js + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify visual contract markers
        shell: bash
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          test -s "$f"
          grep -q 'NAYA-AAA-SMART-BOARD-VISUAL-V1' "$f"
          for x in 'IN A NUTSHELL' 'HUMAN NOTE' 'CHILD NOTE' 'GRANDMA NOTE' 'NAYA NOTE' 'MACHINE NOTE' 'ADAPTER LEARNING' 'WHAT IT MEANS' 'HOW TO APPLY / HOW TO USE' "WHAT'S IN IT FOR YOU"; do grep -q "$x" "$f"; done
          grep -q -- '--sb-human:#ff2fa4' "$f"
          grep -q -- '--sb-naya:#ff9a5a' "$f"
          grep -q -- '--sb-gold:#e8c766' "$f"
          grep -q -- '--sb-silver:#dfe6ee' "$f"
      - name: Commit visual evolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then echo 'AAA_VISUAL_NO_CHANGE'; exit 0; fi
          git commit -m 'Elevate Smart Board to AAA semantic visual intelligence surface'
          git push
