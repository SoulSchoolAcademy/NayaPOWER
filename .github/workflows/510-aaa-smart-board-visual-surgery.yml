name: 510 AAA Smart Board Visual Surgery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/510-aaa-smart-board-visual-surgery.yml'
      - '2026 09 15 NayaNETHUB.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-surgery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce canonical Smart Board presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('2026 09 15 NayaNETHUB.html')
          s = p.read_text(encoding='utf-8')
          marker = 'NAYA-SMART-BOARD-LIVING-INTELLIGENCE-V2'
          if marker not in s:
              css = r'''<style id="naya-smart-board-living-intelligence-v2">
          :root{--sb-white:#f8fbff;--sb-human:#ff2fa4;--sb-child:#8b42ff;--sb-grandma:#4b5dff;--sb-naya:#ff9a5a;--sb-machine:#26c875;--sb-learning:#b8ee57;--sb-meaning:#f1d75a;--sb-gold:#e8c766;--sb-silver:#dfe6ee}
          .naya-smart-board-v2 .layers{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:16px!important;width:100%!important}
          .naya-smart-board-v2 .layer{display:block!important;position:relative!important;width:100%!important;max-width:none!important;min-width:0!important;grid-column:1 / -1!important;float:none!important;clear:both!important;margin:0!important;border:2px solid color-mix(in srgb,var(--layer) 62%,#fff 10%)!important;border-radius:22px!important;background:linear-gradient(145deg,#111217,#07080b)!important;box-shadow:inset 0 1px #fff8,0 20px 42px #000b,0 0 34px color-mix(in srgb,var(--layer) 17%,transparent)!important;overflow:hidden!important;transform:translateZ(0)!important}
          .naya-smart-board-v2 .layer:before{content:'';position:absolute;inset:5px;border-radius:17px;border:1px solid color-mix(in srgb,var(--layer) 26%,transparent);box-shadow:inset 0 0 22px color-mix(in srgb,var(--layer) 7%,transparent);pointer-events:none;z-index:0}
          .naya-smart-board-v2 .layer:after{content:'';position:absolute;inset:0;background:radial-gradient(500px 160px at 0 0,color-mix(in srgb,var(--layer) 12%,transparent),transparent 72%);pointer-events:none;z-index:0}
          .naya-smart-board-v2 .layerHead{position:relative!important;z-index:1!important;display:flex!important;align-items:center!important;gap:14px!important;min-height:76px!important;padding:13px 18px!important;border-bottom:1px solid color-mix(in srgb,var(--layer) 30%,#fff 5%)!important}
          .naya-smart-board-v2 .layerHead b{font-size:15px!important;line-height:1.1!important;letter-spacing:.1em!important;color:#f8f5fa!important}
          .naya-smart-board-v2 .layerBody{position:relative!important;z-index:1!important;padding:18px 20px 22px!important;color:#e9e5ed!important;font-size:14px!important;line-height:1.78!important}
          .naya-smart-board-v2 .dot{position:relative!important;flex:0 0 48px!important;width:48px!important;height:48px!important;border-radius:15px!important;display:grid!important;place-items:center!important;background:radial-gradient(circle at 30% 24%,#fff9,transparent 17%),radial-gradient(circle at 36% 30%,color-mix(in srgb,var(--layer) 48%,#fff 8%),#080a0d 68%)!important;border:2px solid color-mix(in srgb,var(--layer) 88%,#fff 12%)!important;box-shadow:inset 0 2px #fff8,inset 0 -5px 10px #000a,0 10px 25px #000c,0 0 22px color-mix(in srgb,var(--layer) 42%,transparent)!important;font-size:0!important}
          .naya-smart-board-v2 .dot:after{content:attr(data-icon)!important;font-size:20px!important;font-weight:900!important;line-height:1!important;color:var(--layer)!important;text-shadow:0 1px #fff5,0 0 14px color-mix(in srgb,var(--layer) 60%,transparent)!important}
          .naya-smart-board-v2 .layer.semantic-nutshell{--layer:var(--sb-white)!important}.naya-smart-board-v2 .layer.semantic-human{--layer:var(--sb-human)!important}.naya-smart-board-v2 .layer.semantic-child{--layer:var(--sb-child)!important}.naya-smart-board-v2 .layer.semantic-grandma{--layer:var(--sb-grandma)!important}.naya-smart-board-v2 .layer.semantic-naya{--layer:var(--sb-naya)!important}.naya-smart-board-v2 .layer.semantic-machine{--layer:var(--sb-machine)!important}.naya-smart-board-v2 .layer.semantic-learning{--layer:var(--sb-learning)!important}.naya-smart-board-v2 .layer.semantic-meaning{--layer:var(--sb-meaning)!important}.naya-smart-board-v2 .layer.semantic-apply{--layer:var(--sb-gold)!important}.naya-smart-board-v2 .layer.semantic-value{--layer:var(--sb-silver)!important}
          .naya-smart-board-v2 .nutshell{position:relative!important;width:100%!important;margin:22px 0 16px!important;padding:24px 24px 24px 82px!important;border:2px solid var(--sb-white)!important;border-radius:22px!important;background:radial-gradient(360px 180px at 0 50%,#fff14,transparent 72%),linear-gradient(145deg,#111218,#07080b)!important;box-shadow:inset 0 1px #fff9,0 20px 42px #000a,0 0 34px #f8fbff1d!important}
          .naya-smart-board-v2 .nutshell:before{content:'◉';position:absolute;left:22px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--sb-white);font-size:18px;background:radial-gradient(circle at 35% 25%,#fff9,#ffffff18 28%,#07080b 72%);border:2px solid #f8fbffcc;box-shadow:inset 0 2px #fff,0 9px 25px #000c,0 0 24px #f8fbff2b}
          .naya-smart-board-v2 .nutshell b{color:var(--sb-white)!important}
          .naya-smart-board-v2 .blockTop{align-items:flex-start!important}
          .naya-smart-board-v2 .truth,.naya-smart-board-v2 .naya509-block-kicker,.naya-smart-board-v2 .naya509-flow-marker,.naya-smart-board-v2 .naya509-living-spine,.naya-smart-board-v2 .naya509-block-context,.naya-smart-board-v2 .naya509-source-row,.naya-smart-board-v2 .naya509-next-status,.naya-smart-board-v2 .naya509-layer-tag{display:none!important}
          .naya-smart-board-v2 .block.naya509-board{border-color:color-mix(in srgb,var(--tone) 48%,#fff 8%);box-shadow:inset 0 1px #fff9,0 26px 58px #000b,0 0 38px color-mix(in srgb,var(--tone) 14%,transparent)}
          @media(max-width:800px){.naya-smart-board-v2 .layers{gap:12px!important}.naya-smart-board-v2 .layerHead{min-height:66px!important;padding:11px 13px!important}.naya-smart-board-v2 .dot{flex-basis:42px!important;width:42px!important;height:42px!important}.naya-smart-board-v2 .dot:after{font-size:17px!important}.naya-smart-board-v2 .layerBody{padding:15px 16px 18px!important;font-size:13px!important}.naya-smart-board-v2 .nutshell{padding:20px 18px 20px 70px!important}.naya-smart-board-v2 .nutshell:before{left:17px;width:40px;height:40px}}
          </style>'''
              js = r'''<script id="naya-smart-board-living-intelligence-v2-script">(()=>{'use strict';const q=(s,r=document)=>r.querySelector(s),qq=(s,r=document)=>[...r.querySelectorAll(s)],norm=s=>(s||'').replace(/\s+/g,' ').trim().toUpperCase();const SPEC=[['IN A NUTSHELL','semantic-nutshell','#f8fbff','◉'],['HUMAN NOTE','semantic-human','#ff2fa4','♥'],['CHILD NOTE','semantic-child','#8b42ff','●'],['GRANDMA NOTE','semantic-grandma','#4b5dff','◆'],['NAYA NOTE','semantic-naya','#ff9a5a','✦'],['MACHINE NOTE','semantic-machine','#26c875','⬡'],['LEARNING LESSON','semantic-learning','#b8ee57','↗'],['WHAT IT MEANS','semantic-meaning','#f1d75a','✧'],['HOW TO APPLY / HOW TO USE','semantic-apply','#e8c766','→'],["WHAT'S IN IT FOR YOU",'semantic-value','#dfe6ee','✚']];const ALIAS={'CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE','MACHINE / PROVENANCE':'MACHINE NOTE'};const iconFor=t=>SPEC.find(x=>x[0]===t)?.[3]||'✦';const meta=(b)=>{const old=q('.meta',b);if(!old)return;const bits=[...old.querySelectorAll('*')].map(x=>norm(x.textContent)).filter(Boolean);return bits};function semantic(t){t=ALIAS[t]||t;return SPEC.find(x=>x[0]===t)||null}function cleanBoard(b){b.classList.add('naya-smart-board-v2','naya509-board');b.querySelectorAll('.naya509-block-kicker,.naya509-flow-marker,.naya509-living-spine,.naya509-block-context,.naya509-source-row,.naya509-next-status,.naya509-layer-tag').forEach(x=>x.remove());b.querySelectorAll('.truth').forEach(x=>x.remove());const h=q('h3',b);if(h){h.textContent=h.textContent.replace(/^\s*SMART\s*NOTE\s*\d+\s*[:·—-]?\s*/i,'').trim()||'INTELLIGENCE';}const layers=q('.layers',b);if(!layers)return;layers.style.display='flex';layers.style.flexDirection='column';layers.style.alignItems='stretch';layers.style.width='100%';const by=new Map();qq(':scope > .layer',layers).forEach(l=>{const h=q('.layerHead b',l);if(!h)return;let t=norm(h.textContent);t=ALIAS[t]||t;const spec=semantic(t);if(!spec){l.remove();return}h.textContent=spec[0];l.classList.remove(...[...l.classList].filter(x=>x.startsWith('semantic-')));l.classList.add(spec[1]);l.style.setProperty('--layer',spec[2]);const dot=q('.dot',l);if(dot)dot.setAttribute('data-icon',spec[3]);by.set(spec[0],l)});const meaning=by.get('WHAT IT MEANS');if(!by.has('HOW TO APPLY / HOW TO USE')&&meaning){const x=document.createElement('div');x.className='layer semantic-apply';x.style.setProperty('--layer','#e8c766');x.innerHTML='<div class="layerHead"><span class="dot" data-icon="→"></span><b>HOW TO APPLY / HOW TO USE</b><span class="state">ACTION</span></div><div class="layerBody"><strong>Turn understanding into responsible action.</strong> Use the verified meaning, check the evidence, and take one concrete next step that is supported by what is known. If no verified action exists, keep the intelligence in review rather than inventing certainty.</div>';meaning.after(x);by.set('HOW TO APPLY / HOW TO USE',x)}SPEC.forEach(([name])=>{const l=by.get(name);if(l)layers.appendChild(l)});qq(':scope > .layer',layers).forEach((l)=>{l.style.width='100%';l.style.gridColumn='1 / -1';l.style.float='none';l.style.clear='both';});}
          function run(){qq('.block').forEach(cleanBoard)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();let timer;const obs=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(run,30)});obs.observe(document.body,{childList:true,subtree:true});})();</script>'''
              s = s.replace('</head>', css + '\n</head>', 1)
              s = s.replace('</body>', '\n<!-- NAYA-SMART-BOARD-LIVING-INTELLIGENCE-V2 -->\n' + js + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Static acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          test -s "$f"
          grep -q 'NAYA-SMART-BOARD-LIVING-INTELLIGENCE-V2' "$f"
          for x in 'IN A NUTSHELL' 'HUMAN NOTE' 'CHILD NOTE' 'GRANDMA NOTE' 'NAYA NOTE' 'MACHINE NOTE' 'LEARNING LESSON' 'WHAT IT MEANS' 'HOW TO APPLY / HOW TO USE' "WHAT'S IN IT FOR YOU"; do grep -q "$x" "$f"; done
          grep -q -- '--sb-human:#ff2fa4' "$f"
          grep -q -- '--sb-child:#8b42ff' "$f"
          grep -q -- '--sb-grandma:#4b5dff' "$f"
          grep -q -- '--sb-naya:#ff9a5a' "$f"
          grep -q -- '--sb-machine:#26c875' "$f"
          grep -q -- '--sb-learning:#b8ee57' "$f"
          grep -q -- '--sb-meaning:#f1d75a' "$f"
          grep -q -- '--sb-gold:#e8c766' "$f"
          grep -q -- '--sb-silver:#dfe6ee' "$f"
          grep -q 'grid-template-columns' "$f"
          grep -q 'grid-column:1 / -1' "$f"
          grep -q 'display:flex!important;flex-direction:column!important' "$f"

      - name: Commit canonical source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then echo 'NO_CANONICAL_CHANGE'; exit 0; fi
          git commit -m 'Lock Smart Board as vertical living intelligence object'
          git push
