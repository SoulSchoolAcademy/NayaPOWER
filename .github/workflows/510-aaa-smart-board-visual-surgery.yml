# V10 CANONICAL VISUAL AUTHORITY — deterministic source surgery
name: 510 Smart Board V10 Canonical Visual Authority
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/510-aaa-smart-board-visual-surgery.yml'
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canonical-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact V10 authority and apply geometric correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('2026 09 15 NayaNETHUB.html'); s=p.read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show','60c70db83c8ffdf954b73c45821fd53a3eeebbf7:2026 09 15 NayaNETHUB.html'],text=True)
          def grab(src,tag,marker):
              pos=src.find(marker,start:=0)
              if pos<0: raise SystemExit('protected marker missing: '+marker)
              a=src.rfind('<'+tag,0,pos); b=src.find('</'+tag+'>',pos)
              if a<0 or b<0: raise SystemExit('protected block boundary missing')
              return src[a:b+len(tag)+3]
          v10style=grab(base,'style','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')
          v10script=grab(base,'script','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')
          if not all(x in v10script for x in ['class="core"','class="facet"','class="shade"','class="edge"']): raise SystemExit('protected V10 jewel definitions missing')
          def remove_marker_blocks(src,tag,marker):
              while True:
                  pos=src.find(marker)
                  if pos<0:return src
                  a=src.rfind('<'+tag,0,pos); b=src.find('</'+tag+'>',pos)
                  if a<0 or b<0: raise SystemExit('cannot remove marker block '+marker)
                  src=src[:a]+src[b+len(tag)+3:]
          s=remove_marker_blocks(s,'style','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')
          s=remove_marker_blocks(s,'script','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')
          s=remove_marker_blocks(s,'style','NAYA-SMART-BOARD-V10-SURGICAL-FINAL')
          s=remove_marker_blocks(s,'script','NAYA-SMART-BOARD-V10-SURGICAL-FINAL')
          for id in ['naya-aaa-smart-board-visual-v1','naya-smart-board-living-intelligence-v2','naya-aaa-smart-board-visual-v1-script','naya-smart-board-living-intelligence-v2-script','naya-smart-board-finalizer','naya-elite-interface-refinement-runtime']:
              s=remove_marker_blocks(s,'style',id); s=remove_marker_blocks(s,'script',id)
          s=re.sub(r'\.naya509-unified-board\s+\.nutshell:before\s*\{[^}]*\}','',s,flags=re.S|re.I)
          s=s.replace('</head>',v10style+'\n</head>',1)
          surgical='''<style id="NAYA-SMART-BOARD-V10-SURGICAL-FINAL">
          /* One shared geometry: every semantic icon begins where the Nutshell star begins. */
          .elite-board:first-child .nutshell b{justify-content:flex-start!important;gap:24px!important;padding:14px 30px!important;text-align:left!important;font-size:clamp(20px,2.1vw,29px)!important;min-height:116px!important}
          .elite-board:first-child .nutshell b .v10-nutshell-star{width:78px!important;height:78px!important;flex:0 0 78px!important;margin:0!important}
          .elite-board .layerHead{display:flex!important;align-items:center!important;gap:24px!important;min-height:116px!important;padding:14px 30px!important}
          .elite-board .layerHead b{font-size:clamp(20px,2.1vw,29px)!important;line-height:1.15!important;letter-spacing:.02em!important}
          .elite-board .layerHead .dot{width:78px!important;height:78px!important;flex:0 0 78px!important;margin:0!important}
          .elite-board .dot .v10-icon{width:58px!important;height:58px!important}
          .elite-board .nutshell p,.elite-board .layerBody{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important}
          .elite-board .nutshell p{padding:27px 32px 33px!important}.elite-board .layerBody{padding:27px 32px 33px!important}
          .elite-board:first-child .blockTop{gap:28px!important}.elite-board:first-child .identity{gap:22px!important}
          .elite-board:first-child .glyph{width:116px!important;height:116px!important;flex:0 0 116px!important}
          .elite-board:first-child .glyph .v10-icon{width:78px!important;height:78px!important}
          @media(max-width:820px){.elite-board:first-child .nutshell b,.elite-board .layerHead{min-height:92px!important;padding:11px 18px!important;gap:14px!important}.elite-board:first-child .nutshell b .v10-nutshell-star{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .layerHead .dot{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .dot .v10-icon{width:46px!important;height:46px!important}.elite-board:first-child .nutshell p,.elite-board .layerBody{padding:20px 21px 25px!important;font-size:21px!important;line-height:1.58!important}}
          </style>'''
          s=s.replace('</head>',surgical+'\n</head>',1)
          fix='''<script id="NAYA-SMART-BOARD-V10-SURGICAL-FINAL">(()=>{
          const q=(s,r=document)=>r.querySelector(s),qq=(s,r=document)=>[...r.querySelectorAll(s)];
          const O=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];
          const A={'ADAPTIVE LEARNING':'LEARNING LESSON','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE','HOW TO APPLY':'HOW TO APPLY / HOW TO USE','CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','MACHINE / PROVENANCE':'MACHINE NOTE','SIGNIFICANCE':'WHAT IT MEANS','HUMAN VALUE':"WHAT'S IN IT FOR YOU"};
          const N=s=>String(s||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
          function cleanNutshell(n){if(!n)return;const p=q('p',n),b=q('b',n);[...n.children].forEach(x=>{if(x!==b&&x!==p)x.remove()});if(b){b.replaceChildren();const star=document.createElement('span');star.className='v10-nutshell-star';star.setAttribute('aria-hidden','true');b.append(star,document.createTextNode('IN A NUTSHELL'));}}
          function run(){const boards=qq('#blocks > .block');boards.forEach((b,i)=>{b.classList.add('elite-board','naya-smart-board-v10');const h=q('h3',b);if(h&&i===0)h.textContent='What is Naya Power';const g=q('.glyph',b);if(g){const svg=q('.v10-icon',g);if(svg)g.replaceChildren(svg)}cleanNutshell(q('.nutshell',b));const layers=q('.layers',b);if(layers){const map=new Map();qq(':scope > .layer',layers).forEach(layer=>{const h=q('.layerHead b',layer);if(!h){layer.remove();return}let t=A[N(h.textContent)]||N(h.textContent);if(!O.includes(t)){layer.remove();return}h.textContent=t;map.set(t,layer)});O.forEach(k=>{if(map.has(k))layers.appendChild(map.get(k))});}qq('.status').forEach(x=>x.remove());});const t=q('.top .title');if(t)t.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date());}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();})();</script>'''
          s=s.replace('</body>',v10script+'\n'+fix+'\n</body>',1)
          assert len(re.findall(r'<style\b[^>]*NAYA-SMART-BOARD-ELITE-REFINEMENT-V10[^>]*>',s,re.I))==1
          assert len(re.findall(r'<script\b[^>]*NAYA-SMART-BOARD-ELITE-REFINEMENT-V10[^>]*>',s,re.I))==1
          assert len(re.findall(r'<style\b[^>]*NAYA-SMART-BOARD-V10-SURGICAL-FINAL[^>]*>',s,re.I))==1
          assert len(re.findall(r'<script\b[^>]*NAYA-SMART-BOARD-V10-SURGICAL-FINAL[^>]*>',s,re.I))==1
          assert 'What is Naya Power' in s and 'HOW TO APPLY / HOW TO USE' in s and "WHAT'S IN IT FOR YOU" in s
          for x in ['naya-aaa-smart-board-visual-v1','naya-smart-board-living-intelligence-v2','naya-smart-board-finalizer','naya-elite-interface-refinement-runtime']: assert x not in s
          p.write_text(s,encoding='utf-8')
          print('V10_GEOMETRY_AUTHORITY_READY')
          PY
      - name: Verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          test "$(grep -o 'NAYA-SMART-BOARD-ELITE-REFINEMENT-V10' "$f" | wc -l)" -eq 2
          test "$(grep -o 'NAYA-SMART-BOARD-V10-SURGICAL-FINAL' "$f" | wc -l)" -eq 2
          grep -q 'What is Naya Power' "$f"
          grep -q 'HOW TO APPLY / HOW TO USE' "$f"
          grep -q 'WHAT''S IN IT FOR YOU' "$f"
          grep -q 'class="core"' "$f"; grep -q 'class="facet"' "$f"; grep -q 'class="shade"' "$f"; grep -q 'class="edge"' "$f"
          ! grep -q 'naya-aaa-smart-board-visual-v1' "$f"; ! grep -q 'naya-smart-board-living-intelligence-v2' "$f"; ! grep -q 'naya-smart-board-finalizer' "$f"; ! grep -q 'naya-elite-interface-refinement-runtime' "$f"
          echo 'V10_GEOMETRY_SOURCE_VERIFIED'
      - name: Commit canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NayaPOWER Automation'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then echo 'NO_CANONICAL_CHANGE'; exit 1; fi
          git commit -m 'Align V10 jewel icons and Smart Board typography'
          git pull --rebase origin main
          git push origin HEAD:main
