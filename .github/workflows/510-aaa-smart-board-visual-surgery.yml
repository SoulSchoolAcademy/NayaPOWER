name: 510 AAA Smart Board Visual Surgery

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/510-aaa-smart-board-visual-surgery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce-canonical-smart-board:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Apply idempotent Smart Board runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('2026 09 15 NayaNETHUB.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "new MutationObserver(run).observe(document.body,{childList:true,subtree:true})",
              "/* static canonical board: mutation observer disabled to prevent self-triggering runtime loop */"
          )
          s = s.replace(
              "let timer;const obs=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(run,30)});obs.observe(document.body,{childList:true,subtree:true});",
              "/* static canonical board: continuous observer disabled */"
          )
          marker = '<!-- NAYA-CLOUDFLARE-RUNTIME-REPROOF-2026-09-16 -->'
          if marker not in s:
              s = s.replace('</head>', marker + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Prove canonical Smart Board contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NAYA-SMART-BOARD-LIVING-INTELLIGENCE-V2' '2026 09 15 NayaNETHUB.html'
          ! grep -q 'new MutationObserver(run).observe(document.body,{childList:true,subtree:true})' '2026 09 15 NayaNETHUB.html'
          ! grep -q 'new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(run,30)});obs.observe(document.body' '2026 09 15 NayaNETHUB.html'
          grep -q 'NAYA-CLOUDFLARE-RUNTIME-REPROOF-2026-09-16' '2026 09 15 NayaNETHUB.html'
          for label in 'HUMAN NOTE' 'CHILD NOTE' 'GRANDMA NOTE' 'NAYA NOTE' 'MACHINE NOTE' 'LEARNING LESSON' 'WHAT IT MEANS' 'HOW TO APPLY / HOW TO USE' "WHAT'S IN IT FOR YOU"; do grep -q "$label" '2026 09 15 NayaNETHUB.html'; done
          grep -q 'grid-template-columns' '2026 09 15 NayaNETHUB.html'
          grep -q 'display:flex;flex-direction:column' '2026 09 15 NayaNETHUB.html'

      - name: Commit canonical runtime repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '2026 09 15 NayaNETHUB.html'; then
            echo 'Canonical Smart Board already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git commit -m 'Prepare canonical Hub for Cloudflare runtime reproof'
          git push origin HEAD:main
