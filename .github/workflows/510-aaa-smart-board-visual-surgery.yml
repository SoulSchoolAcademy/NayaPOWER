name: 510 AAA Smart Board Visual Surgery
on:
  push:
    branches: [main]
    paths: ['2026 09 15 NayaNETHUB.html','.github/workflows/510-aaa-smart-board-visual-surgery.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  enforce-canonical-smart-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Smart Board runtime repair to every intelligent block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("new MutationObserver(run).observe(document.body,{childList:true,subtree:true})","/* observer disabled */")
          s=s.replace("let timer;const obs=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(run,30)});obs.observe(document.body,{childList:true,subtree:true});","/* observer disabled */")
          shim='''<script id="naya-static-runtime-observer-shim">(()=>{class NayaStaticMutationObserver{constructor(){}observe(){}disconnect(){}takeRecords(){return[]}}window.MutationObserver=NayaStaticMutationObserver})();</script>'''
          start=s.find('<script id="naya-static-runtime-observer-shim">')
          if start>=0:
              end=s.find('</script>',start)+9; s=s[:start]+s[end:]
          s=s.replace('<head>','<head>\n'+shim,1)
          start=s.find('<script id="naya-smart-board-finalizer">')
          if start>=0:
              end=s.find('</script>',start)+9; s=s[:start]+s[end:]
          finalizer='''<script id="naya-smart-board-finalizer">(()=>{const A={'CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','MACHINE / PROVENANCE':'MACHINE NOTE','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE','ADAPTIVE LEARNING':'LEARNING LESSON'};const C={'HUMAN NOTE':['semantic-human','#ff2fa4','♥'],'CHILD NOTE':['semantic-child','#8b42ff','●'],'GRANDMA NOTE':['semantic-grandma','#4b5dff','◆'],'NAYA NOTE':['semantic-naya','#ff9a5a','✦'],'MACHINE NOTE':['semantic-machine','#26c875','⬡'],'LEARNING LESSON':['semantic-learning','#b8ee57','↗'],'WHAT IT MEANS':['semantic-meaning','#f1d75a','✧'],'HOW TO APPLY / HOW TO USE':['semantic-apply','#e8c766','→'],"WHAT'S IN IT FOR YOU":['semantic-value','#dfe6ee','✚']};const ORDER=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];function iconize(x,t,c){let d=x.querySelector('.dot');if(!d){d=document.createElement('span');d.className='dot';const h=x.querySelector('.layerHead');if(h)h.prepend(d)}d.setAttribute('data-icon',c[2]);x.className='layer '+c[0];x.style.setProperty('--layer',c[1]);const h=x.querySelector('.layerHead b');if(h)h.textContent=t}function repairLayerList(l){l.style.display='flex';l.style.flexDirection='column';l.style.width='100%';const seen=new Set();[...l.children].forEach(x=>{const h=x.querySelector('.layerHead b');if(!h)return;let t=h.textContent.replace(/^\\s*\\d+\\s*[·.-]\\s*/,'').replace(/’/g,"'").trim().toUpperCase();t=A[t]||t;if(C[t]){iconize(x,t,C[t]);seen.add(t)}else x.remove()});if(!seen.has('HOW TO APPLY / HOW TO USE')){const x=document.createElement('div');x.className='layer semantic-apply';x.style.setProperty('--layer','#e8c766');x.innerHTML="<div class='layerHead'><span class='dot' data-icon='→'></span><b>HOW TO APPLY / HOW TO USE</b><span class='state'>ACTION</span></div><div class='layerBody'><strong>Turn understanding into responsible action.</strong> Check the evidence and take one concrete next step supported by what is known.</div>";l.append(x)}if(!seen.has("WHAT'S IN IT FOR YOU")){const x=document.createElement('div');x.className='layer semantic-value';x.style.setProperty('--layer','#dfe6ee');x.innerHTML="<div class='layerHead'><span class='dot' data-icon='✚'></span><b>WHAT'S IN IT FOR YOU</b><span class='state'>VALUE</span></div><div class='layerBody'><strong>Know what this changes for you.</strong> Use the insight to make a clearer decision, save effort, or take a useful next step.</div>";l.append(x)}const map=new Map([...l.children].map(x=>[x.querySelector('.layerHead b')?.textContent,x]));ORDER.forEach(k=>{const x=map.get(k);if(x)l.append(x)});l.querySelectorAll(':scope>.layer').forEach(x=>{x.style.width='100%';x.style.gridColumn='1 / -1';x.style.float='none'})}function repairBlock(b){b.querySelectorAll('h1,h2,h3,h4,h5,.layerHead b').forEach(h=>h.textContent=h.textContent.replace(/^\\s*SMART\\s*NOTE\\s*\\d+\\s*[:·—-]?\\s*/i,'').replace(/^\\s*\\d+\\s*[·.-]\\s*/,'').trim());b.querySelectorAll('.truth,.naya509-block-kicker,.naya509-flow-marker,.naya509-living-spine,.naya509-block-context,.naya509-source-row,.naya509-next-status,.naya509-layer-tag').forEach(x=>x.remove());const n=b.querySelector('.nutshell');if(n){n.classList.add('semantic-nutshell');n.style.setProperty('--layer','#f7f7fa');let i=n.querySelector('.nutshellIcon');if(!i){i=document.createElement('span');i.className='nutshellIcon';i.setAttribute('data-icon','◉');n.prepend(i)}}const l=b.querySelector('.layers');if(l)repairLayerList(l)}function f(){let b=document.querySelector('.naya509-unified-board');const nav=document.querySelector('.feedNav'),head=document.querySelector('.feedHead'),blocks=document.querySelector('.blocks');if(!b&&nav&&blocks){b=document.createElement('section');b.className='naya509-unified-board naya-smart-board-v2 naya509-board';nav.parentNode.insertBefore(b,nav);b.append(nav);if(head)b.append(head);b.append(blocks)}if(!b)return;b.classList.add('naya-smart-board-v2','naya509-board');b.querySelectorAll('.block').forEach(repairBlock);const styleId='naya-smart-board-contract-css';if(!document.getElementById(styleId)){const st=document.createElement('style');st.id=styleId;st.textContent='.naya-smart-board-v2 .blocks{display:block!important}.naya-smart-board-v2 .block{width:100%!important;display:block!important}.naya-smart-board-v2 .layers{display:flex!important;flex-direction:column!important;width:100%!important}.naya-smart-board-v2 .layer{width:100%!important;display:block!important;float:none!important;grid-column:1 / -1!important}.naya-smart-board-v2 .layerHead{min-height:58px}.naya-smart-board-v2 .dot{width:38px!important;height:38px!important;flex:0 0 38px!important;border-radius:12px!important;display:grid!important;place-items:center!important;border:2px solid color-mix(in srgb,var(--layer) 62%,#fff 12%)!important;background:radial-gradient(circle at 32% 25%,#fff7,color-mix(in srgb,var(--layer) 30%,#09090e) 38%,#07070b 78%)!important;color:#fff!important;box-shadow:inset 0 1px #fff9,0 7px 18px #000b,0 0 18px color-mix(in srgb,var(--layer) 28%,transparent)!important;font-size:15px!important}.naya-smart-board-v2 .dot:before{content:attr(data-icon)}.naya-smart-board-v2 .semantic-nutshell{position:relative;border:2px solid #fff8!important;box-shadow:inset 0 1px #fff8,0 18px 38px #000b,0 0 22px #fff2!important;padding-left:70px!important}.naya-smart-board-v2 .nutshellIcon{position:absolute;left:20px;top:20px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,#fff,#cfd2dc 38%,#5d606c 100%);border:2px solid #fff;box-shadow:inset 0 1px #fff,0 7px 18px #000b,0 0 20px #fff6;font-size:14px}.naya-smart-board-v2 .semantic-human{--layer:#ff2fa4}.naya-smart-board-v2 .semantic-child{--layer:#8b42ff}.naya-smart-board-v2 .semantic-grandma{--layer:#4b5dff}.naya-smart-board-v2 .semantic-naya{--layer:#ff9a5a}.naya-smart-board-v2 .semantic-machine{--layer:#26c875}.naya-smart-board-v2 .semantic-learning{--layer:#b8ee57}.naya-smart-board-v2 .semantic-meaning{--layer:#f1d75a}.naya-smart-board-v2 .semantic-apply{--layer:#e8c766}.naya-smart-board-v2 .semantic-value{--layer:#dfe6ee}@media(max-width:820px){.naya-smart-board-v2 .layerHead{min-height:54px}.naya-smart-board-v2 .dot{width:34px!important;height:34px!important;flex-basis:34px!important;font-size:13px!important}.naya-smart-board-v2 .semantic-nutshell{padding-left:62px!important}.naya-smart-board-v2 .nutshellIcon{left:16px;top:16px;width:34px;height:34px}}';document.head.append(st)}b.querySelectorAll('.layer').forEach(x=>{x.style.width='100%';x.style.gridColumn='1 / -1';x.style.float='none'})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',f);else f();setTimeout(f,500);setTimeout(f,1500)})();</script>'''
          s=s.replace('</body>',finalizer+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Prove canonical Smart Board contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'naya-smart-board-finalizer' '2026 09 15 NayaNETHUB.html'
          grep -q 'HOW TO APPLY / HOW TO USE' '2026 09 15 NayaNETHUB.html'
          grep -q "WHAT'S IN IT FOR YOU" '2026 09 15 NayaNETHUB.html'
          grep -q 'semantic-nutshell' '2026 09 15 NayaNETHUB.html'
          grep -q 'querySelectorAll(.block)' '2026 09 15 NayaNETHUB.html' || grep -q 'querySelectorAll(\x27.block\x27)' '2026 09 15 NayaNETHUB.html' || true
      - name: Commit canonical runtime repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '2026 09 15 NayaNETHUB.html'; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'; git commit -m 'Fix Smart Board renderer across every intelligence block'; git push origin HEAD:main
