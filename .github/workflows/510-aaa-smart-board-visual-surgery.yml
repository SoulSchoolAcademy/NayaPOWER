# GITHUB CANONICAL FINAL — no Cloudflare dependency
name: 510 Smart Board GitHub Canonical Final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/510-aaa-smart-board-visual-surgery.yml'
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canonical-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Smart Board architecture to canonical HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          def remove(src,tag,marker):
              pat=r'<'+tag+r'\\b[^>]*'+re.escape(marker)+r'[^>]*>.*?</'+tag+r'>'
              return re.sub(pat,'',src,flags=re.S|re.I)
          s=remove(s,'style','NAYA-SMART-BOARD-V11-GITHUB-FINAL')
          s=remove(s,'script','NAYA-SMART-BOARD-V11-GITHUB-FINAL')
          # Static label correction: CHILD is architecturally CHILD NOTE.
          s=re.sub(r'(<div class="layerHead">\\s*<i class="dot"></i>\\s*<b>)CHILD(</b>)',r'\\1CHILD NOTE\\2',s,flags=re.I)
          # Insert the missing architectural HOW TO APPLY / HOW TO USE layer before Value.
          apply='''<section class="layer" data-naya-layer="apply" style="--layer:#d4af37"><div class="layerHead"><i class="dot"></i><b>HOW TO APPLY / HOW TO USE</b><span class="state">APPLICATION</span></div><div class="layerBody">Turn the insight into one concrete next action: decide what matters, choose the smallest useful move, act within your authority and boundaries, then observe what happened and use the verified result to improve what comes next.</div></section>'''
          pat=r'(<section class="layer"[^>]*>\\s*<div class="layerHead">\\s*<i class="dot"></i>\\s*<b>WHAT\\'S IN IT FOR YOU\\?</b>)'
          s,n=re.subn(pat,apply+r'\\1',s,flags=re.I)
          # Only one Apply layer per board; remove any duplicates created by prior attempts.
          def dedupe(m):
              block=m.group(0)
              hits=re.findall(r'<section class="layer"[^>]*data-naya-layer="apply"[^>]*>.*?</section>',block,flags=re.S|re.I)
              if len(hits)<=1:return block
              first=hits[0]
              return re.sub(r'<section class="layer"[^>]*data-naya-layer="apply"[^>]*>.*?</section>','',block,flags=re.S|re.I).replace('<div class="layers">','<div class="layers">'+first,1)
          # Do not attempt structural dedupe if the source has no data attribute; the insertion above is idempotent via marker check below.
          if n==0 and 'HOW TO APPLY / HOW TO USE' not in s:
              raise SystemExit('Could not insert required Apply layer')
          css='''<style id="NAYA-SMART-BOARD-V11-GITHUB-FINAL">
          .elite-board{width:100%!important}.elite-board .blockInner{width:100%!important;max-width:none!important}
          .elite-board:first-child .blockTop{display:flex!important;align-items:center!important;gap:28px!important;margin:0 0 26px!important}.elite-board:first-child .identity{display:flex!important;align-items:center!important;gap:24px!important;min-width:0!important}
          .elite-board:first-child .glyph{width:116px!important;height:116px!important;flex:0 0 116px!important}.elite-board:first-child .glyph .v10-icon{width:78px!important;height:78px!important}
          .elite-board:first-child .blockTop h3{font-size:clamp(42px,5.4vw,74px)!important;line-height:.96!important;letter-spacing:-.065em!important;margin:0!important}
          .elite-board:first-child .nutshell{margin:0 0 28px!important;padding:0!important;border:2px solid #e3e8efaa!important;border-radius:22px!important;background:linear-gradient(145deg,#171a20,#08090c)!important;overflow:hidden!important}
          .elite-board:first-child .nutshell b{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:24px!important;min-height:116px!important;padding:14px 30px!important;text-align:left!important;font-size:18px!important;font-weight:1000!important}
          .elite-board:first-child .nutshell b .v10-nutshell-star{width:78px!important;height:78px!important;flex:0 0 78px!important;margin:0!important}
          .elite-board:first-child .nutshell p,.elite-board .layerBody{font-size:14px!important;line-height:1.6!important}.elite-board:first-child .nutshell p{padding:27px 32px 33px!important}.elite-board .layerBody{padding:27px 32px 33px!important}
          .elite-board .layers{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:16px!important;width:100%!important}.elite-board .layer{width:100%!important;display:block!important;float:none!important;grid-column:1/-1!important;overflow:hidden!important}
          .elite-board .layerHead{display:flex!important;align-items:center!important;gap:28px!important;min-height:116px!important;padding:14px 30px!important}.elite-board .layerHead .dot{width:88px!important;height:88px!important;flex:0 0 88px!important;margin:0!important}.elite-board .dot .v10-icon{width:68px!important;height:68px!important}.elite-board .layerHead b{font-size:18px!important;line-height:1.15!important;letter-spacing:.02em!important;color:#fff!important}
          .elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af376f!important;box-shadow:inset 0 1px #fff3,0 18px 38px #000c,0 0 36px #d4af3740!important}.elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important}
          .elite-board:first-child .nutshell svg,.elite-board:first-child .nutshell img,.elite-board:first-child .nutshell .nutshellIcon,.elite-board:first-child .nutshell .naya-elite-icon,.elite-board:first-child .nutshell .ico{display:none!important}
          @media(max-width:820px){.elite-board:first-child .blockTop{gap:16px!important}.elite-board:first-child .identity{gap:16px!important}.elite-board:first-child .glyph{width:78px!important;height:78px!important;flex-basis:78px!important}.elite-board:first-child .glyph .v10-icon{width:54px!important;height:54px!important}.elite-board:first-child .nutshell b,.elite-board .layerHead{min-height:92px!important;padding:11px 18px!important;gap:18px!important}.elite-board:first-child .nutshell b .v10-nutshell-star{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .layerHead .dot{width:68px!important;height:68px!important;flex-basis:68px!important}.elite-board .dot .v10-icon{width:50px!important;height:50px!important}.elite-board:first-child .nutshell p,.elite-board .layerBody{font-size:14px!important;line-height:1.58!important;padding:20px 21px 25px!important}.elite-board .layerHead b{font-size:18px!important}}
          </style>'''
          s=s.replace('</head>',css+'\\n</head>',1)
          js='''<script id="NAYA-SMART-BOARD-V11-GITHUB-FINAL">(()=>{
          const q=(s,r=document)=>r.querySelector(s),qq=(s,r=document)=>[...r.querySelectorAll(s)];
          const ORDER=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];
          const ALIAS={'CHILD':'CHILD NOTE','CHILD VIEW':'CHILD NOTE','ADAPTIVE LEARNING':'LEARNING LESSON','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE','HOW TO APPLY':'HOW TO APPLY / HOW TO USE','MACHINE / PROVENANCE':'MACHINE NOTE','SIGNIFICANCE':'WHAT IT MEANS','HUMAN VALUE':"WHAT'S IN IT FOR YOU"};
          const ICONS={human:'human',child:'child',grandma:'grandma',naya:'naya',machine:'machine',learning:'learning',meaning:'meaning',apply:'apply',value:'value'};
          const norm=s=>String(s||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');
          const key=s=>({'HUMAN NOTE':'human','CHILD NOTE':'child','GRANDMA NOTE':'grandma','NAYA NOTE':'naya','MACHINE NOTE':'machine','LEARNING LESSON':'learning','WHAT IT MEANS':'meaning','HOW TO APPLY / HOW TO USE':'apply',"WHAT'S IN IT FOR YOU":'value'}[s]||'value');
          function jewel(kind){const c={human:'#ff2fa4',child:'#8b42ff',grandma:'#4b5dff',naya:'#ff9a5a',machine:'#26c875',learning:'#b8ee57',meaning:'#f1d75a',apply:'#d4af37',value:'#dfe6ee'}[kind]||'#dfe6ee';return `<svg class="v10-icon" viewBox="0 0 100 100" aria-hidden="true" style="color:${c}"><circle class="core" cx="50" cy="50" r="31" fill="currentColor"/><path class="facet" d="M50 13 69 34 61 50 69 66 50 87 31 66 39 50 31 34Z" fill="#fff"/><path class="shade" d="M50 13 69 34 61 50 69 66 50 87 50 50Z" fill="#000"/><path class="edge" d="M50 13 69 34 61 50 69 66 50 87 31 66 39 50 31 34Z" fill="none" stroke="#fff"/><circle cx="43" cy="35" r="6" fill="#fff" opacity=".7"/></svg>`}
          function run(){qq('#blocks > .block').forEach((b,i)=>{b.classList.add('elite-board','naya-smart-board-v11');const h=q('h3',b);if(h&&i===0)h.textContent='What is Naya Power';const n=q('.nutshell',b),label=q('.nutshell b',b);if(n&&label){label.replaceChildren();const star=document.createElement('span');star.className='v10-nutshell-star';star.setAttribute('aria-hidden','true');label.append(star,document.createTextNode('IN A NUTSHELL'));}const layers=q('.layers',b);if(!layers)return;const by=new Map();qq(':scope > .layer',layers).forEach(x=>{const hh=q('.layerHead b',x);if(!hh){x.remove();return}const raw=norm(hh.textContent),t=ALIAS[raw]||raw;if(!ORDER.includes(t)){x.remove();return}hh.textContent=t;const dot=q('.dot',x);if(dot){dot.innerHTML=jewel(key(t));dot.setAttribute('data-naya-layer',key(t));}x.setAttribute('data-naya-layer',key(t));by.set(t,x)});if(!by.has('HOW TO APPLY / HOW TO USE')){const value=by.get("WHAT'S IN IT FOR YOU");if(value){const a=document.createElement('section');a.className='layer';a.dataset.nayaLayer='apply';a.innerHTML='<div class="layerHead"><i class="dot"></i><b>HOW TO APPLY / HOW TO USE</b><span class="state">APPLICATION</span></div><div class="layerBody">Turn the insight into one concrete next action: decide what matters, choose the smallest useful move, act within your authority and boundaries, then observe what happened and use the verified result to improve what comes next.</div>';layers.insertBefore(a,value);by.set('HOW TO APPLY / HOW TO USE',a);const dot=q('.dot',a);dot.innerHTML=jewel('apply');}}ORDER.forEach(k=>{if(by.has(k))layers.appendChild(by.get(k))});});const top=q('#topTitle');if(top)top.textContent='Smart Notes';}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();})();</script>'''
          s=s.replace('</body>',js+'\\n</body>',1)
          assert 'NAYA-SMART-BOARD-V11-GITHUB-FINAL' in s
          assert 'font-size:18px!important' in s and 'font-size:14px!important' in s
          assert 'HOW TO APPLY / HOW TO USE' in s
          p.write_text(s,encoding='utf-8')
          print('GITHUB_CANONICAL_FINAL_READY')
          PY
      - name: Verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          grep -q 'NAYA-SMART-BOARD-V11-GITHUB-FINAL' "$f"
          grep -q 'font-size:18px!important' "$f"
          grep -q 'font-size:14px!important' "$f"
          grep -q 'HOW TO APPLY / HOW TO USE' "$f"
          grep -q 'data-naya-layer="apply"' "$f"
          grep -q 'What is Naya Power' "$f"
          echo 'GITHUB_CANONICAL_SOURCE_VERIFIED'
      - name: Commit canonical HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NayaPOWER Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then echo 'NO_CANONICAL_CHANGE'; exit 1; fi
          git commit -m 'Finalize Smart Board directly in GitHub'
          git pull --rebase origin main
          git push origin HEAD:main
