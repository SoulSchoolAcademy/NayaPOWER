name: 510 Smart Board GitHub Canonical Final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/510-aaa-smart-board-visual-surgery.yml'
      - '.naya/control-plane/SMART-BOARD-REFINEMENT-TRIGGER.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canonical-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize canonical HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA-SMART-BOARD-V11-GITHUB-FINAL'
          s=re.sub(r'<style id="'+marker+r'">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="'+marker+r'">.*?</script>','',s,flags=re.S)
          s=re.sub(r'(<div class="layerHead">\s*<i class="dot"></i>\s*<b>)CHILD(</b>)',r'\1CHILD NOTE\2',s,flags=re.I)
          apply='<section class="layer" data-naya-layer="apply" style="--layer:#d4af37"><div class="layerHead"><i class="dot"></i><b>HOW TO APPLY / HOW TO USE</b><span class="state">APPLICATION</span></div><div class="layerBody">Turn the insight into one concrete next action: decide what matters, choose the smallest useful move, act within your authority and boundaries, then observe what happened and use the verified result to improve what comes next.</div></section>'
          pat=r"(<section class=\"layer\"[^>]*>\s*<div class=\"layerHead\">\s*<i class=\"dot\"></i>\s*<b>WHAT'S IN IT FOR YOU\?</b>)"
          s=re.sub(pat,lambda m: ('' if 'HOW TO APPLY / HOW TO USE' in m.string[max(0,m.start()-5000):m.start()] else apply)+m.group(1),s,flags=re.I)
          css='''<style id="NAYA-SMART-BOARD-V11-GITHUB-FINAL">
.elite-board{width:100%!important}.elite-board .blockInner{width:100%!important;max-width:none!important}
.elite-board:first-child .blockTop{display:flex!important;align-items:center!important;gap:28px!important;margin:0 0 26px!important}.elite-board:first-child .identity{display:flex!important;align-items:center!important;gap:24px!important;min-width:0!important}.elite-board:first-child .glyph{width:116px!important;height:116px!important;flex:0 0 116px!important}.elite-board:first-child .glyph .v10-icon{width:78px!important;height:78px!important}.elite-board:first-child .blockTop h3{font-size:clamp(42px,5.4vw,74px)!important;line-height:.96!important;letter-spacing:-.065em!important;margin:0!important}
.elite-board:first-child .nutshell{margin:0 0 28px!important;padding:0!important;border:2px solid #e3e8efaa!important;border-radius:22px!important;background:linear-gradient(145deg,#171a20,#08090c)!important;overflow:hidden!important}.elite-board:first-child .nutshell b{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:24px!important;min-height:116px!important;padding:14px 30px!important;text-align:left!important;font-size:18px!important;font-weight:1000!important}.elite-board:first-child .nutshell b .v10-nutshell-star{width:78px!important;height:78px!important;flex:0 0 78px!important;margin:0!important}.elite-board:first-child .nutshell p,.elite-board .layerBody{font-size:14px!important;line-height:1.6!important}.elite-board:first-child .nutshell p{padding:27px 32px 33px!important}.elite-board .layerBody{padding:27px 32px 33px!important}
.elite-board .layers{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:16px!important;width:100%!important}.elite-board .layer{width:100%!important;display:block!important;float:none!important;overflow:hidden!important}.elite-board .layerHead{display:flex!important;align-items:center!important;gap:28px!important;min-height:116px!important;padding:14px 30px!important}.elite-board .layerHead .dot{width:88px!important;height:88px!important;flex:0 0 88px!important;margin:0!important}.elite-board .dot .v10-icon{width:68px!important;height:68px!important}.elite-board .layerHead b{font-size:18px!important;line-height:1.15!important;letter-spacing:.02em!important;color:#fff!important}.elite-board .layer[data-naya-layer="apply"]{--layer:#d4af37!important;border-color:#d4af376f!important;box-shadow:inset 0 1px #fff3,0 18px 38px #000c,0 0 36px #d4af3740!important}.elite-board .layer[data-naya-layer="value"]{--layer:#dfe6ee!important}.elite-board:first-child .nutshell svg,.elite-board:first-child .nutshell img,.elite-board:first-child .nutshell .nutshellIcon,.elite-board:first-child .nutshell .naya-elite-icon,.elite-board:first-child .nutshell .ico{display:none!important}.elite-board .layerHead .dot{border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8 0 8%,transparent 9%),radial-gradient(circle at 50% 48%,color-mix(in srgb,var(--layer) 82%,#fff 8%),#07070b 72%);border:2px solid color-mix(in srgb,var(--layer) 70%,#fff 12%);box-shadow:inset 0 2px 3px #fff5,0 0 24px color-mix(in srgb,var(--layer) 45%,transparent),0 12px 24px #000b)}
@media(max-width:820px){.elite-board:first-child .blockTop{gap:16px!important}.elite-board:first-child .identity{gap:16px!important}.elite-board:first-child .glyph{width:78px!important;height:78px!important;flex-basis:78px!important}.elite-board:first-child .glyph .v10-icon{width:54px!important;height:54px!important}.elite-board:first-child .nutshell b,.elite-board .layerHead{min-height:92px!important;padding:11px 18px!important;gap:18px!important}.elite-board:first-child .nutshell b .v10-nutshell-star{width:62px!important;height:62px!important;flex-basis:62px!important}.elite-board .layerHead .dot{width:68px!important;height:68px!important;flex-basis:68px!important}.elite-board .dot .v10-icon{width:50px!important;height:50px!important}.elite-board:first-child .nutshell p,.elite-board .layerBody{font-size:14px!important;line-height:1.58!important;padding:20px 21px 25px!important}.elite-board .layerHead b{font-size:18px!important}}
.top .status{display:none!important}
</style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          js='''<script id="NAYA-SMART-BOARD-V11-GITHUB-FINAL">(()=>{const q=(s,r=document)=>r.querySelector(s),qq=(s,r=document)=>[...r.querySelectorAll(s)];const ORDER=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];const ALIAS={'CHILD':'CHILD NOTE','ADAPTIVE LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE','HOW TO APPLY':'HOW TO APPLY / HOW TO USE'};const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toUpperCase().replace(/^\d+\s*[·.)-]\s*/,'');const key=s=>({'HUMAN NOTE':'human','CHILD NOTE':'child','GRANDMA NOTE':'grandma','NAYA NOTE':'naya','MACHINE NOTE':'machine','LEARNING LESSON':'learning','WHAT IT MEANS':'meaning','HOW TO APPLY / HOW TO USE':'apply',"WHAT'S IN IT FOR YOU":'value'}[s]||'value');function jewel(k){const c={human:'#ff2fa4',child:'#8b42ff',grandma:'#4b5dff',naya:'#ff9a5a',machine:'#26c875',learning:'#b8ee57',meaning:'#f1d75a',apply:'#d4af37',value:'#dfe6ee'}[k]||'#dfe6ee';return `<svg class="v10-icon" viewBox="0 0 100 100" aria-hidden="true" style="color:${c}"><circle cx="50" cy="50" r="31" fill="currentColor"/><path d="M50 10 72 31 62 50 72 69 50 90 28 69 38 50 28 31Z" fill="#fff" opacity=".9"/><path d="M50 10 72 31 62 50 72 69 50 90 50 50Z" fill="#000" opacity=".34"/><path d="M50 10 72 31 62 50 72 69 50 90 28 69 38 50 28 31Z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="42" cy="34" r="6" fill="#fff" opacity=".75"/></svg>`}function run(){qq('#blocks > .block').forEach((b,i)=>{b.classList.add('elite-board','naya-smart-board-v11');const h=q('h3',b);if(h&&i===0)h.textContent='What is Naya Power';const n=q('.nutshell',b),label=q('.nutshell b',b);if(n&&label){label.replaceChildren();const star=document.createElement('span');star.className='v10-nutshell-star';star.setAttribute('aria-hidden','true');label.append(star,document.createTextNode('IN A NUTSHELL'))}const layers=q('.layers',b);if(!layers)return;const by=new Map();qq(':scope > .layer',layers).forEach(x=>{const hh=q('.layerHead b',x);if(!hh){x.remove();return}const t=ALIAS[norm(hh.textContent)]||norm(hh.textContent);if(!ORDER.includes(t)){x.remove();return}hh.textContent=t;x.dataset.nayaLayer=key(t);const dot=q('.dot',x);if(dot){dot.innerHTML=jewel(key(t));dot.dataset.nayaLayer=key(t)}by.set(t,x)});if(!by.has('HOW TO APPLY / HOW TO USE')){const value=by.get("WHAT'S IN IT FOR YOU");if(value){const a=document.createElement('section');a.className='layer';a.dataset.nayaLayer='apply';a.innerHTML='<div class="layerHead"><i class="dot"></i><b>HOW TO APPLY / HOW TO USE</b><span class="state">APPLICATION</span></div><div class="layerBody">Turn the insight into one concrete next action: decide what matters, choose the smallest useful move, act within your authority and boundaries, then observe what happened and use the verified result to improve what comes next.</div>';layers.insertBefore(a,value);q('.dot',a).innerHTML=jewel('apply');by.set('HOW TO APPLY / HOW TO USE',a)}}ORDER.forEach(k=>{if(by.has(k))layers.appendChild(by.get(k))})});const top=q('#topTitle');if(top)top.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date())}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run()})();</script>'''
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify canonical source
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          grep -q 'NAYA-SMART-BOARD-V11-GITHUB-FINAL' "$f"
          grep -q 'font-size:18px!important' "$f"
          grep -q 'font-size:14px!important' "$f"
          grep -q 'HOW TO APPLY / HOW TO USE' "$f"
          grep -q 'data-naya-layer="apply"' "$f"
          grep -q 'What is Naya Power' "$f"
      - name: Commit canonical HTML
        run: |
          set -euo pipefail
          git config user.name 'NayaPOWER Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then echo 'NO_CANONICAL_CHANGE'; exit 0; fi
          git commit -m 'Finalize Smart Board directly in GitHub'
          git pull --rebase origin main
          git push origin HEAD:main
