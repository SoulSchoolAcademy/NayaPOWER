name: 510 AAA Smart Board Visual Surgery

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/510-aaa-smart-board-visual-surgery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce-canonical-smart-board:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
      - name: Apply final Smart Board runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html'); s=p.read_text(encoding='utf-8')
          s=s.replace("new MutationObserver(run).observe(document.body,{childList:true,subtree:true})","/* observer disabled */")
          s=s.replace("let timer;const obs=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(run,30)});obs.observe(document.body,{childList:true,subtree:true});","/* observer disabled */")
          shim='''<script id="naya-static-runtime-observer-shim">(()=>{class NayaStaticMutationObserver{constructor(){}observe(){}disconnect(){}takeRecords(){return[]}}window.MutationObserver=NayaStaticMutationObserver})();</script>'''
          start=s.find('<script id="naya-static-runtime-observer-shim">')
          if start>=0:
              end=s.find('</script>',start)+9; s=s[:start]+s[end:]
          s=s.replace('<head>','<head>\n'+shim,1)
          finalizer='''<script id="naya-smart-board-finalizer">(()=>{const A={'CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','MACHINE / PROVENANCE':'MACHINE NOTE','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE'};const C={'HUMAN NOTE':['semantic-human','#ff2fa4','♥'],'CHILD NOTE':['semantic-child','#8b42ff','●'],'GRANDMA NOTE':['semantic-grandma','#4b5dff','◆'],'NAYA NOTE':['semantic-naya','#ff9a5a','✦'],'MACHINE NOTE':['semantic-machine','#26c875','⬡'],'LEARNING LESSON':['semantic-learning','#b8ee57','↗'],'WHAT IT MEANS':['semantic-meaning','#f1d75a','✧'],'HOW TO APPLY / HOW TO USE':['semantic-apply','#e8c766','→'],"WHAT'S IN IT FOR YOU":['semantic-value','#dfe6ee','✚']};function f(){let b=document.querySelector('.naya509-unified-board');const nav=document.querySelector('.feedNav'),head=document.querySelector('.feedHead'),blocks=document.querySelector('.blocks');if(!b&&nav&&blocks){b=document.createElement('section');b.className='naya509-unified-board naya-smart-board-v2 naya509-board';nav.parentNode.insertBefore(b,nav);b.append(nav);if(head)b.append(head);b.append(blocks)}if(!b)return;b.classList.add('naya-smart-board-v2','naya509-board');b.querySelectorAll('.truth,.naya509-block-kicker,.naya509-flow-marker,.naya509-living-spine,.naya509-block-context,.naya509-source-row,.naya509-next-status,.naya509-layer-tag').forEach(x=>x.remove());b.querySelectorAll('h1,h2,h3,h4,h5,.layerHead').forEach(h=>h.textContent=h.textContent.replace(/^\s*SMART\s*NOTE\s*\d+\s*[:·—-]?\s*/i,'').trim());const l=b.querySelector('.layers');if(!l)return;l.style.display='flex';l.style.flexDirection='column';l.style.width='100%';b.querySelectorAll('.nutshell').forEach(n=>n.classList.add('semantic-nutshell'));const seen=new Set();[...l.children].forEach(x=>{let h=x.querySelector('.layerHead b');if(!h)return;let t=h.textContent.replace(/^\s*\d+\s*[·.-]\s*/,'').trim().toUpperCase();t=A[t]||t;if(C[t]){h.textContent=t;x.className='layer '+C[t][0];x.style.setProperty('--layer',C[t][1]);x.querySelector('.dot')?.setAttribute('data-icon',C[t][2]);seen.add(t)}else x.remove()});if(!seen.has('HOW TO APPLY / HOW TO USE')){const m=[...l.children].find(x=>x.querySelector('.layerHead b')?.textContent==='WHAT IT MEANS');if(m){const x=document.createElement('div');x.className='layer semantic-apply';x.style.setProperty('--layer','#e8c766');x.innerHTML='<div class="layerHead"><span class="dot" data-icon="→"></span><b>HOW TO APPLY / HOW TO USE</b><span class="state">ACTION</span></div><div class="layerBody"><strong>Turn understanding into responsible action.</strong> Check the evidence and take one concrete next step supported by what is known.</div>';m.after(x);seen.add('HOW TO APPLY / HOW TO USE')}}if(!seen.has("WHAT'S IN IT FOR YOU")){const x=document.createElement('div');x.className='layer semantic-value';x.style.setProperty('--layer','#dfe6ee');x.innerHTML='<div class="layerHead"><span class="dot" data-icon="✚"></span><b>WHAT\'S IN IT FOR YOU</b><span class="state">VALUE</span></div><div class="layerBody"><strong>Know what this changes for you.</strong> Use the insight to make a clearer decision, save effort, or take a useful next step.</div>';l.append(x)}const order=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];const map=new Map([...l.children].map(x=>[x.querySelector('.layerHead b')?.textContent,x]));order.forEach(k=>{const x=map.get(k);if(x)l.append(x)});l.querySelectorAll(':scope>.layer').forEach(x=>{x.style.width='100%';x.style.gridColumn='1 / -1';x.style.float='none'})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',f);else f();setTimeout(f,500)})();</script>'''
          start=s.find('<script id="naya-smart-board-finalizer">')
          if start>=0:
              end=s.find('</script>',start)+9; s=s[:start]+s[end:]
          s=s.replace('</body>',finalizer+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Prove canonical Smart Board contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'naya-smart-board-finalizer' '2026 09 15 NayaNETHUB.html'
          grep -q 'NAYA-SMART-BOARD-LIVING-INTELLIGENCE-V2' '2026 09 15 NayaNETHUB.html'
          grep -q 'HOW TO APPLY / HOW TO USE' '2026 09 15 NayaNETHUB.html'
          grep -q 'WHAT'"'"'S IN IT FOR YOU' '2026 09 15 NayaNETHUB.html'
          test "$(grep -n 'id=\"naya-static-runtime-observer-shim\"' '2026 09 15 NayaNETHUB.html' | head -1 | cut -d: -f1)" -lt 100
      - name: Commit canonical runtime repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '2026 09 15 NayaNETHUB.html'; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'; git commit -m 'Complete Smart Board value layer'; git push origin HEAD:main
