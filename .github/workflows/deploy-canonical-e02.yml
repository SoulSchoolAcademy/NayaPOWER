name: Deploy Canonical NayaNET E02

# One canonical release path. No release step writes back to main.
on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/**'
      - '.github/workflows/deploy-canonical-e02.yml'
  workflow_dispatch:

concurrency:
  group: canonical-e02-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify canonical release contract
        shell: python
        run: |
          import json
          from pathlib import Path
          import re

          root = Path('.')
          required = [
              'index.html',
              'nayanet-10-experience.css',
              'nayanet-elite.css',
              'nayanet-10.js',
              'naya-data.js',
              'powercasts.json',
              'worker.js',
              'wrangler.jsonc',
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit('MISSING_RUNTIME_FILES=' + ','.join(missing))

          html = (root / 'index.html').read_text(encoding='utf-8')
          js = (root / 'nayanet-10.js').read_text(encoding='utf-8')
          css = (root / 'nayanet-10-experience.css').read_text(encoding='utf-8')
          data = (root / 'naya-data.js').read_text(encoding='utf-8')
          worker = (root / 'worker.js').read_text(encoding='utf-8')
          casts = json.loads((root / 'powercasts.json').read_text(encoding='utf-8'))

          assert html.lower().count('<!doctype html>') == 1, 'HTML_DOCTYPE_INVALID'
          assert '</html>' in html, 'HTML_DOCUMENT_INCOMPLETE'
          assert 'nayanet-10-experience.css' in html, 'CANONICAL_CSS_NOT_REFERENCED'
          assert 'nayanet-10.js' in html, 'CANONICAL_JS_NOT_REFERENCED'
          assert 'naya-data.js' in html, 'PERSISTENCE_BRIDGE_NOT_REFERENCED'
          assert len(casts) == 18, f'POWERCAST_COUNT={len(casts)}'
          assert '@import url(\'/nayanet-elite.css\')' in css, 'ELITE_CSS_CHAIN_BROKEN'
          assert 'SUPABASE_URL' in data and 'LOCAL_KEY' in data, 'PERSISTENCE_CONTRACT_MISSING'
          assert 'fetch(request)' in worker, 'WORKER_FETCH_HANDLER_MISSING'
          assert 'assets' in (root / 'wrangler.jsonc').read_text(encoding='utf-8'), 'WRANGLER_ASSETS_MISSING'
          print('RUNTIME_FILES=PASS')
          print('POWERCASTS=18')
          print('CANONICAL_CSS=PASS')
          print('CANONICAL_JS=PASS')
          print('PERSISTENCE_BRIDGE=PASS')
          print('WORKER=PASS')
          print('RELEASE_CONTRACT=PASS')

      - name: Syntax-check runtime JavaScript
        run: |
          node --check nayanet-10.js
          node --check naya-data.js
          node --check worker.js
          echo 'JAVASCRIPT_SYNTAX=PASS'

      - name: Deploy exact canonical artifact to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          command: deploy --config wrangler.jsonc

      - name: Record release evidence
        run: |
          echo 'DEPLOYMENT=SUCCESS'
          echo 'SOURCE=NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE'
          echo 'WORKER=nayanet-living-intelligence'
          echo 'MAIN_MUTATION=NONE'
          echo 'RELEASE_POLICY=VERIFY_BEFORE_DEPLOY'
