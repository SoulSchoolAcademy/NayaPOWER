name: NAYA — Diagnose Cloudflare Zone Authority
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query nayanet.app zone authority
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=nayanet.app&status=active" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{"id":z["id"],"name":z["name"],"status":z["status"],"account_id":z["account"]["id"],"account_name":z["account"].get("name")} for z in d.get("result",[])],indent=2))'
