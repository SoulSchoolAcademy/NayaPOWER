name: Verify NayaNET Cold Project Intelligence

on:
  push:
    branches: [main]
    paths:
      - ".naya/project-intelligence/**"
      - ".naya/control-plane/**"
      - ".naya/TEAM-NAYA/**"
      - "NAYANET/HUB/index.html"
      - ".naya/naya-context-manifest.json"
      - ".naya/runtime/cold_start_activation.py"
      - "SUPERBRAIN/AI-BOOT/START-HERE.md"
      - "SUPERBRAIN/NAYAPOWER-CANONICAL-SOURCE-MAP.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-project-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical control plane
        run: python .naya/control-plane/validate_control_plane.py
      - name: Validate cold-start Project Intelligence
        run: python .naya/runtime/cold_start_activation.py
