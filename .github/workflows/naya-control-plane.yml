name: Naya Control Plane

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  SMART_FEED_RELEASE: canonical

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch single canonical live Hub deployment FIRST
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SoulSchoolAcademy/NayaPOWER/actions/workflows/deploy-v7-now.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'CANONICAL_LIVE_HUB_RELEASE_DISPATCHED=TRUE'
      - name: Python syntax check
        run: python -m py_compile .naya/control-plane/validate_control_plane.py .naya/runtime/cold_start_control_plane_acceptance.py .naya/runtime/cold_start_activation.py
      - name: Validator self-test
        run: python .naya/control-plane/validate_control_plane.py --self-test
      - name: Cold Naya control-plane acceptance
        run: python .naya/runtime/cold_start_control_plane_acceptance.py
      - name: Cold Naya boot and no-orphan acceptance
        run: python .naya/runtime/cold_start_activation.py
      - name: MAP → STATE → BLOCK → PROOF acceptance
        run: python .naya/control-plane/validate_control_plane.py

  cct-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CCT-005 value feedback
        run: python .naya/runtime/cct005_value_feedback_test.py
      - name: CCT-005 Smart Note integration
        run: python .naya/runtime/cct005_note_event_integration_test.py
      - name: CCT-004 adversarial semantics
        run: python .naya/runtime/cct004_adversarial_test.py
      - name: CCT-003 two-Naya exchange
        run: python .naya/runtime/cct003_two_naya_test.py
      - name: Naya claim concurrency
        run: python .naya/runtime/naya_claim_test.py
      - name: Intelligent Block
        run: python .naya/runtime/cct_intelligent_block_test.py
      - name: Note Event promotion
        run: python .naya/runtime/cct_note_event_promotion_test.py
