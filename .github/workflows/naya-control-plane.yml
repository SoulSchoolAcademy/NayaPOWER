name: Naya Control Plane

on:
  push:
    branches: [main]
    paths:
      - '.naya/**'
      - 'SUPERBRAIN/**'
      - 'NAYANET/HUB/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/naya-control-plane.yml'
      - '!SUPERBRAIN/NAYA-ACTIVITY/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY-FEED.md'
  pull_request:
    branches: [main]
    paths:
      - '.naya/**'
      - 'SUPERBRAIN/**'
      - 'NAYANET/HUB/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/naya-control-plane.yml'
      - '!SUPERBRAIN/NAYA-ACTIVITY/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY-FEED.md'

permissions:
  contents: write

env:
  SMART_FEED_RELEASE: canonical

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Governance adapter syntax check
        run: python -m py_compile .naya/governance/governance_kernel.py .naya/control-plane/workflow_gate.py .naya/governance/test_naya_execution_boundaries.py
      - name: Governance kernel self-test
        run: python .naya/governance/test_governance_kernel.py
      - name: Execution-boundary self-test
        run: python .naya/governance/test_naya_execution_boundaries.py
      - name: Python control-plane syntax check
        run: python -m py_compile .naya/control-plane/validate_control_plane.py .naya/control-plane/test_p0_workflow_contract.py .naya/runtime/cold_start_control_plane_acceptance.py .naya/runtime/cold_start_activation.py
      - name: Validator self-test
        run: python .naya/control-plane/validate_control_plane.py --self-test
      - name: P0 workflow contract
        run: python .naya/control-plane/test_p0_workflow_contract.py
      - name: Cold Naya control-plane acceptance
        run: python .naya/runtime/cold_start_control_plane_acceptance.py
      - name: Cold Naya boot and no-orphan acceptance
        run: python .naya/runtime/cold_start_activation.py
      - name: MAP → STATE → BLOCK → PROOF acceptance
        run: python .naya/control-plane/validate_control_plane.py

  cct-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: CCT-005 value feedback
        run: python .naya/runtime/cct005_value_feedback_test.py
      - name: CCT-005 Smart Note integration
        run: python .naya/runtime/cct005_note_event_integration_test.py
      - name: CCT-004 adversarial semantics
        run: python .naya/runtime/cct004_adversarial_test.py
      - name: CCT-003 two-Naya exchange
        run: python .naya/runtime/cct003_two_naya_test.py
      - name: Naya claim concurrency
        run: python .naya/runtime/naya_claim_test.py
      - name: Intelligent Block
        run: python .naya/runtime/cct_intelligent_block_test.py
      - name: Note Event promotion
        run: python .naya/runtime/cct_note_event_promotion_test.py

  smart-board-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run deterministic Smart Board source finalizer
        run: python3 tools/finalize-smart-board.py
      - name: Verify canonical Smart Board source
        run: |
          set -euo pipefail
          f='2026 09 15 NayaNETHUB.html'
          grep -q 'NAYA-SMART-BOARD-V11-GITHUB-FINAL' "$f"
          grep -q 'font-size:18px!important' "$f"
          grep -q 'font-size:14px!important' "$f"
          grep -q 'HOW TO APPLY / HOW TO USE' "$f"
          grep -q 'data-naya-layer="apply"' "$f"
          grep -q 'What is Naya Power' "$f"
      - name: Commit canonical Smart Board source
        run: |
          set -euo pipefail
          git config user.name 'NayaPOWER Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then echo 'NO_CANONICAL_CHANGE'; exit 0; fi
          git commit -m 'Finalize Smart Board canonical source'
          git pull --rebase origin main
          git push origin HEAD:main
