name: Naya Control Plane

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SMART_FEED_RELEASE: canonical

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Canonical deployment ownership check
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-nayanet-hub-canonical.yml
          test -f .github/workflows/deploy-v7-now.yml
          grep -q 'RETIRED HUB DEPLOYMENT PATH' .github/workflows/deploy-v7-now.yml
          grep -q 'name: Deploy Canonical NayaNET Hub' .github/workflows/deploy-nayanet-hub-canonical.yml
          echo 'CANONICAL_LIVE_HUB_DEPLOYMENT=.github/workflows/deploy-nayanet-hub-canonical.yml'
          echo 'CONTROL_PLANE_DEPLOYMENT_DISPATCH=DISABLED'
          echo 'RULE=ONE_CURRENT_HUB_DEPLOYMENT_AUTHORITY'
      - name: Python syntax check
        run: python -m py_compile .naya/control-plane/validate_control_plane.py .naya/runtime/cold_start_control_plane_acceptance.py .naya/runtime/cold_start_activation.py
      - name: Validator self-test
        run: python .naya/control-plane/validate_control_plane.py --self-test
      - name: Cold Naya control-plane acceptance
        run: python .naya/runtime/cold_start_control_plane_acceptance.py
      - name: Cold Naya boot and no-orphan acceptance
        run: python .naya/runtime/cold_start_activation.py
      - name: MAP → STATE → BLOCK → PROOF acceptance
        run: python .naya/control-plane/validate_control_plane.py

  cct-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: CCT-005 value feedback
        run: python .naya/runtime/cct005_value_feedback_test.py
      - name: CCT-005 Smart Note integration
        run: python .naya/runtime/cct005_note_event_integration_test.py
      - name: CCT-004 adversarial semantics
        run: python .naya/runtime/cct004_adversarial_test.py
      - name: CCT-003 two-Naya exchange
        run: python .naya/runtime/cct003_two_naya_test.py
      - name: Naya claim concurrency
        run: python .naya/runtime/naya_claim_test.py
      - name: Intelligent Block
        run: python .naya/runtime/cct_intelligent_block_test.py
      - name: Note Event promotion
        run: python .naya/runtime/cct_note_event_promotion_test.py

  materialize-509:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Materialize canonical 509 Hub artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Materialize canonical 509 feed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 09 5:09 pm NayaNET HUB.html'); js=Path('scripts/nayanet-509-intelligent-feed-v2.js').read_text(encoding='utf-8'); s=p.read_text(encoding='utf-8')
          for marker in ('<div class="app">','class="sidebar"','class="topbar"','id="page-home"','class="homeWorkspace"','class="homeFeed"','</body>'): assert marker in s, '509 SHELL MISSING: '+marker
          exact_ids=('nayanet-canonical-feed-upgrade-style','NAYANET-SMART-FEED-MASTER-V1','NAYANET-SMART-FEED-FORCE-MOUNT-V2','NAYANET-SMART-FEED-MASTER-V1-RUNTIME','NAYANET-SMART-FEED-FORCE-MOUNT-V2-RUNTIME','nayanet-canonical-hub-authority')
          for ident in exact_ids:s=re.sub(r'<(style|script|div)[^>]*id=["\']'+re.escape(ident)+r'["\'][^>]*>.*?</(style|script|div)>','',s,flags=re.S|re.I)
          script_pattern=re.compile(r'<script[^>]*>.*?</script>',re.S|re.I); legacy=('function strengthenFeed()','nh-v11-intel','nhV11Today','nh-authority-actions','nayanet.presentationMode','function addTodayNav()','NAYANET_INTELLIGENT_FEED_V5_RUNTIME','The Intelligent Feed Turns Experience Into Usable Intelligence','One Intelligence Event = One Board','Source Intent Is Not Runtime Truth','NayaNET V16 presentation layer')
          s=script_pattern.sub(lambda m:'' if any(x.lower() in m.group(0).lower() for x in legacy) else m.group(0),s)
          s=re.sub(r'<script[^>]*src=["\']\./nayanet-intelligent-feed-v6\.js["\'][^>]*>.*?</script>','',s,flags=re.S|re.I); s=re.sub(r'<(?:div|section)[^>]*id=["\']nayaSmartFeedForceMount["\'][^>]*>.*?</(?:div|section)>','',s,flags=re.S|re.I)
          for marker in legacy+exact_ids+('nayanet-intelligent-feed-v6.js',):s=s.replace(marker,'')
          start=s.find('<section class="homeFeed">'); assert start>=0; pos=start+len('<section class="homeFeed">'); depth=1; token=re.compile(r'<section[^>]*>|</section[^>]*>',re.I)
          while depth:q=token.search(s,pos);assert q;depth+=-1 if q.group(0).lower().startswith('</') else 1;pos=q.end()
          s=s[:start]+'<section class="homeFeed"></section>'+s[pos:]
          s=re.sub(r'<script[^>]*id=["\']NAYANET_509_INTELLIGENT_FEED_DIRECT_V2["\'][^>]*>.*?</script>','',s,flags=re.S|re.I); s=s.replace('</body>','<script id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V2">\n'+js+'\n</script>\n</body>',1); p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exact 509 target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('2026 09 09 5:09 pm NayaNET HUB.html').read_text(encoding='utf-8')
          for marker in ('<div class="app">','class="sidebar"','class="topbar"','id="page-home"','class="homeWorkspace"','class="homeFeed"'):assert marker in s,marker
          assert s.count('NAYANET_509_INTELLIGENT_FEED_DIRECT_V2')==1; assert '<section class="homeFeed"></section>' in s
          forbidden=('NAYANET-SMART-FEED-MASTER-V1','NAYANET-SMART-FEED-FORCE-MOUNT-V2','nayanet-canonical-feed-upgrade-style','nayanet-canonical-hub-authority','NAYANET_INTELLIGENT_FEED_V5_RUNTIME','NayaNET V16 presentation layer','nayanet-intelligent-feed-v6.js','The Intelligent Feed Turns Experience Into Usable Intelligence','One Intelligence Event = One Board','Source Intent Is Not Runtime Truth')
          for marker in forbidden:assert marker not in s,marker
          for marker in ('COLLECTIVE INTELLIGENCE','PERSONAL INTELLIGENCE','ACTIVITY FEED','width:calc(100vw - 250px)','width:calc(100% + 40px)'):assert marker in s,marker
          print('509_TARGET_VERIFICATION=PASS')
          PY
      - name: Commit exact target only when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'; git config user.email 'naya-power@users.noreply.github.com'; git add -- '2026 09 09 5:09 pm NayaNET HUB.html'
          if git diff --cached --quiet; then echo '509_TARGET_ALREADY_CURRENT=1'; exit 0; fi
          git commit -m 'fix(509): materialize canonical Intelligent Feed into Hub'
          git push origin main
