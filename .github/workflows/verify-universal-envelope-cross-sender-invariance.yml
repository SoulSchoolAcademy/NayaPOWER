name: NayaNET Universal Envelope — cross-sender contract invariance # rerun after Hub record repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-universal-envelope-cross-sender-invariance.yml'

permissions:
  contents: read
  id-token: write

jobs:
  invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      RUN_IDENTITY: cross-sender-invariance-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser for Hub sender
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run three sender classes and compare receiver-observed invariants
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/cross-sender-invariance.mjs

      - name: Upload invariance proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-envelope-cross-sender-invariance-proof
          path: universal-envelope-cross-sender-invariance-proof.json
          if-no-files-found: error
