name: Deploy 509 C4 — Flow Repair v2
on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js'
      - '.github/workflows/deploy-509-c4-flow-repair-v2.yml'
permissions:
  contents: read
env:
  WORKER_NAME: sparkling-shape-7ae5
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: ${{ github.sha }}, fetch-depth: 0}
      - name: Build and deploy exact 509 release
        shell: bash
        run: |
          set -euo pipefail
          test -s '2026 09 13 NayaNET HUB 509 AAA.html'
          test -s 'SMART FEED CONTENT'
          test -s 'NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js'
          test -s 'NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js'
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,os
          src=Path('2026 09 13 NayaNET HUB 509 AAA.html').read_bytes()
          smart=Path('SMART FEED CONTENT').read_bytes()
          tpl=Path('NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js').read_text()
          real=tpl.replace('__SMART_FEED_B64__',base64.b64encode(smart).decode())
          assert 'SMART NOTE 01' in smart.decode(errors='ignore')
          assert 'SMART NOTE 09' in smart.decode(errors='ignore') or 'SMART NOTE 9' in smart.decode(errors='ignore')
          out=Path('release/public'); out.mkdir(parents=True,exist_ok=True)
          html=src.decode()
          meta=f'<meta name="nayanet-source-commit" content="{os.environ["GITHUB_SHA"]}"><meta name="nayanet-source-sha256" content="{hashlib.sha256(src).hexdigest()}"><meta name="nayanet-smart-feed-content-sha256" content="{hashlib.sha256(smart).hexdigest()}"><meta name="nayanet-real-content-generated-sha256" content="{hashlib.sha256(real.encode()).hexdigest()}"><meta name="nayanet-smart-note-count" content="9">'
          html=html.replace('</head>',meta+'</head>',1)
          assets=[('NAYANET/509-AAA-SURGICAL-LAYER.js','naya-509-aaa.js'),('NAYANET/509-AAA-NEXT-LEVEL.js','naya-509-next-level.js'),('NAYANET/509-AAA-SMART-FEED-C3.js','naya-509-smart-feed-c3.js'),('NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js','naya-509-intelligent-board-c4.js'),('NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js','naya-509-c4-unified-board-repair.js'),('NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js','naya-509-c4-single-board-runtime-repair.js'),('NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js','naya-509-c4-love-like-personal-polish.js'),('NAYANET/509-AAA-REAL-SMART-FEED-DISTILLATION.js','naya-509-real-smart-feed-distillation.js'),('NAYANET/509-AAA-REAL-SMART-FEED-LIFECYCLE-REPAIR.js','naya-509-real-smart-feed-lifecycle-repair.js'),('NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js','naya-509-feed-flow-and-board-visible-repair.js')]
          for a,b in assets:(out/b).write_text(Path(a).read_text())
          (out/'naya-509-real-smart-feed-content.js').write_text(real)
          tags=''.join(f'<script src="/{b}"></script>' for _,b in assets[:-1])+'<script src="/naya-509-feed-flow-and-board-visible-repair.js"></script>'
          html=html.replace('</body>',tags+'<script>window.Naya509RealSmartFeed&&window.Naya509RealSmartFeed.boot&&window.Naya509RealSmartFeed.boot();</script></body>',1)
          (out/'index.html').write_text(html)
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const r=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);h.set('X-NayaNET-Source-SHA256',env.SOURCE_HASH);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          echo '{"name":"'"$WORKER_NAME"'","main":"worker.js","compatibility_date":"2026-09-08","account_id":"'"$ACCOUNT_ID"'","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"'"$GITHUB_SHA"'","SOURCE_HASH":"'"$(sha256sum '2026 09 13 NayaNET HUB 509 AAA.html'|cut -d' ' -f1)'"}}' > release/wrangler.jsonc
      - name: Deploy exact release
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Verify public runtime source and nine-note asset
        run: |
          set -euo pipefail
          curl -fsSL "$RUNTIME/?flow=$GITHUB_SHA" -o /tmp/runtime.html
          curl -fsSL "$SMART_LINK?flow=$GITHUB_SHA" -o /tmp/smart.html
          curl -fsSL "$RUNTIME/naya-509-real-smart-feed-content.js?flow=$GITHUB_SHA" -o /tmp/real.js
          grep -Fq "$GITHUB_SHA" /tmp/runtime.html
          grep -Fq 'nayanet-smart-note-count" content="9"' /tmp/runtime.html
          grep -Fq 'SMART NOTE 01' /tmp/real.js
          grep -Fq 'SMART NOTE 09' /tmp/real.js || grep -Fq 'SMART NOTE 9' /tmp/real.js
          grep -Fq 'naya-509-feed-flow-and-board-visible-repair.js' /tmp/runtime.html
          echo SOURCE_TO_RUNTIME=PASS
          echo SMART_NOTE_COUNT=9
          echo FLOW_REPAIR_ASSET=PASS
