# CANONICAL-LIVE-HUB-WORKFLOW-REGISTER-2026-09-09
name: Deploy Canonical NayaNET Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: nayanet-canonical-live-hub
  cancel-in-progress: false
env:
  HUB: NAYANET/HUB
  WORKER_NAME: aged-art-7c12
  RUNTIME: https://aged-art-7c12.nayanet.workers.dev
  SMART_LINK: https://aged-art-7c12.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds
jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Install
        working-directory: NAYANET/HUB
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: NAYANET/HUB
        run: npm run typecheck
      - name: Build
        working-directory: NAYANET/HUB
        env:
          VITE_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Inspect actual generated artifact
        run: |
          set -euo pipefail
          D="NAYANET/HUB/dist"
          test -s "$D/index.html" && test -s "$D/nayanet-cognitive-engine.js"
          APP_JS=$(grep -oE 'assets/[^" ]+\.js' "$D/index.html" | head -1)
          test -n "$APP_JS" && test -s "$D/$APP_JS"
          for x in 'NayaNET' 'Intelligent Hub' 'IDENTITY' 'ACTIVITY FEED' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'Ask Naya' 'Create Smart Space' 'NUTSHELL' 'HUMAN' 'CHILD' 'GRANDMA' 'NAYA' 'MACHINE' 'WEAVER' 'LESSON' 'MEANING' 'ACTION' 'TRUST' 'RELATED INTELLIGENCE' 'Favorite intelligence' 'Save intelligence' 'RATE / RANK' 'COMMENT' 'SHARE' 'CONNECT' 'NAYANET-HUB-REACT-CANONICAL'; do grep -RFiq "$x" "$D/index.html" "$D/$APP_JS" || { echo "ARTIFACT_MISSING=$x"; exit 1; }; done
          for x in 'NayaNetCognition' 'recordPersistent' 'nayanet_record_cognition_event'; do grep -RFiq "$x" "$D/nayanet-cognitive-engine.js" || { echo "COGNITION_ARTIFACT_MISSING=$x"; exit 1; }; done
          if git -C . grep -nEi -- 'Where.?s Naya Now|SUPERBRAIN|PASS THE TORCH|VERIFY STATE' -- NAYANET/HUB/src scripts 2>/dev/null; then echo 'FORBIDDEN_SOURCE_UI_FOUND'; exit 1; fi
          for x in "Where's Naya Now" 'Where’s Naya Now' 'SUPERBRAIN' 'PASS THE TORCH' 'VERIFY STATE'; do if grep -RFiq "$x" "$D/index.html" "$D/$APP_JS"; then echo "FORBIDDEN_ARTIFACT=$x"; exit 1; fi; done
          if grep -RPiEq 'CAPTURE.{0,120}(PASS THE TORCH|VERIFY STATE|EVENTS|RECEIPTS|MEMORY)' "$D/$APP_JS"; then echo 'FORBIDDEN_CAPTURE_OPERATOR_CLUSTER'; exit 1; fi
          if grep -RPiEq 'SUPERBRAIN.{0,160}(CAPTURE|PASS THE TORCH|VERIFY STATE|EVENTS|RECEIPTS|MEMORY)' "$D/$APP_JS"; then echo 'FORBIDDEN_SUPERBRAIN_OPERATOR_CLUSTER'; exit 1; fi
          test ! -e "$D/nayanet-intelligent-feed-v6.js"
          sha256sum "$D/index.html" > /tmp/index.sha256; sha256sum "$D/nayanet-cognitive-engine.js" > /tmp/cognition.sha256
          echo "APP_JS=$APP_JS"
          echo 'CANONICAL_HUB_BUILD=PASS'; echo 'ARTIFACT_INSPECTION=PASS'; echo 'COGNITIVE_ENGINE_ARTIFACT=PASS'; echo 'FORBIDDEN_PRODUCT_UI=ABSENT'
      - name: Prepare exact Cloudflare artifact
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp -R NAYANET/HUB/dist/. release/public/
          cat > release/worker.js <<'EOF'
          export default { async fetch(request, env) { const url = new URL(request.url); const isSpaRoute = url.pathname === '/' || url.pathname === '/index.html' || url.pathname.startsWith('/intelligence/'); const assetRequest = isSpaRoute ? new Request(new URL('/index.html', request.url).toString(), { method: 'GET', headers: request.headers }) : request; return env.ASSETS.fetch(assetRequest); } };
          EOF
          cat > release/wrangler.jsonc <<'EOF'
          {"name":"aged-art-7c12","main":"worker.js","compatibility_date":"2026-09-08","account_id":"262c881746ea6e9978ca18b3eb831907","assets":{"directory":"./public","binding":"ASSETS"}}
          EOF
          test -s release/public/index.html && test -s release/public/nayanet-cognitive-engine.js && test -s release/worker.js
          printf 'RELEASE_SOURCE_COMMIT=%s\nRELEASE_SOURCE=NAYANET/HUB\nRELEASE_TARGET=aged-art-7c12\n' "$GITHUB_SHA" > release/RELEASE-MANIFEST.txt
          cat /tmp/index.sha256 /tmp/cognition.sha256 >> release/RELEASE-MANIFEST.txt
      - name: Deploy exact Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '262c881746ea6e9978ca18b3eb831907'
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Independently verify exact public runtime and built assets
        run: |
          set -u
          fail=0
          get(){ curl -sS -o "$2" -w '%{http_code}' "$1" || true; }
          status=$(get "$RUNTIME/?release=$GITHUB_SHA" /tmp/root); echo "ROOT_HTTP=$status"; [ "$status" = 200 ] || { echo FAIL_ROOT_HTTP; fail=1; }
          smart_status=$(get "$SMART_LINK?release=$GITHUB_SHA" /tmp/smart); echo "SMART_HTTP=$smart_status"; [ "$smart_status" = 200 ] || { echo FAIL_SMART_HTTP; fail=1; }
          if [ -s /tmp/root ] && [ -s /tmp/smart ]; then cmp -s /tmp/root /tmp/smart && echo ROUTE_PARITY=PASS || { echo FAIL_ROUTE_PARITY; fail=1; }; else echo FAIL_ROUTE_BODY; fail=1; fi
          js_src=$(grep -oE 'src="[^"]+\.js"' /tmp/root 2>/dev/null | head -1 | cut -d'"' -f2 || true); echo "JS_SRC=$js_src"; [ -n "$js_src" ] || { echo FAIL_JS_SOURCE_DISCOVERY; fail=1; }
          case "$js_src" in /*) ;; '') ;; *) js_src="/$js_src";; esac
          if [ -n "$js_src" ]; then js_status=$(get "$RUNTIME$js_src?release=$GITHUB_SHA" /tmp/app-js); echo "JS_HTTP=$js_status"; [ "$js_status" = 200 ] && [ -s /tmp/app-js ] || { echo FAIL_JS_ASSET; fail=1; }; fi
          cognitive_status=$(get "$RUNTIME/nayanet-cognitive-engine.js?release=$GITHUB_SHA" /tmp/cognition); echo "COGNITION_HTTP=$cognitive_status"; [ "$cognitive_status" = 200 ] && [ -s /tmp/cognition ] || { echo FAIL_COGNITION_ASSET; fail=1; }
          for x in 'NayaNET' 'Intelligent Hub' 'IDENTITY' 'ACTIVITY FEED' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'Ask Naya' 'Create Smart Space' 'NUTSHELL' 'HUMAN' 'CHILD' 'GRANDMA' 'NAYA' 'MACHINE' 'WEAVER' 'LESSON' 'MEANING' 'ACTION' 'TRUST' 'RELATED INTELLIGENCE' 'Favorite intelligence' 'Save intelligence' 'RATE / RANK' 'COMMENT' 'SHARE' 'CONNECT' 'NAYANET-HUB-REACT-CANONICAL'; do grep -RFiq "$x" /tmp/root /tmp/app-js 2>/dev/null && echo "RUNTIME_MARKER_PASS=$x" || { echo "FAIL_RUNTIME_MARKER=$x"; fail=1; }; done
          for x in 'NayaNetCognition' 'recordPersistent' 'nayanet_record_cognition_event'; do grep -RFiq "$x" /tmp/root /tmp/app-js /tmp/cognition 2>/dev/null && echo "RUNTIME_COGNITION_PASS=$x" || { echo "FAIL_RUNTIME_COGNITION=$x"; fail=1; }; done
          for x in "Where's Naya Now" 'Where’s Naya Now' 'SUPERBRAIN' 'PASS THE TORCH' 'VERIFY STATE'; do if grep -RFiq "$x" /tmp/root /tmp/app-js 2>/dev/null; then echo "FAIL_FORBIDDEN_RUNTIME=$x"; fail=1; else echo "RUNTIME_FORBIDDEN_ABSENT=$x"; fi; done
          if grep -RPiEq 'CAPTURE.{0,120}(PASS THE TORCH|VERIFY STATE|EVENTS|RECEIPTS|MEMORY)' /tmp/app-js 2>/dev/null; then echo FAIL_FORBIDDEN_CAPTURE_OPERATOR_CLUSTER; fail=1; else echo RUNTIME_CAPTURE_OPERATOR_CLUSTER=ABSENT; fi
          if grep -RPiEq 'SUPERBRAIN.{0,160}(CAPTURE|PASS THE TORCH|VERIFY STATE|EVENTS|RECEIPTS|MEMORY)' /tmp/app-js 2>/dev/null; then echo FAIL_FORBIDDEN_SUPERBRAIN_OPERATOR_CLUSTER; fail=1; else echo RUNTIME_SUPERBRAIN_OPERATOR_CLUSTER=ABSENT; fi
          grep -Fq 'nayanet-intelligent-feed-v6.js' /tmp/root && { echo FAIL_RETIRED_FEED; fail=1; } || echo RETIRED_FEED=ABSENT
          grep -Fq '2026 09 08 452 NayaNET Hub' /tmp/root && { echo FAIL_RETIRED_452; fail=1; } || echo RETIRED_452=ABSENT
          grep -Fq "$GITHUB_SHA" /tmp/root /tmp/app-js 2>/dev/null && echo RUNTIME_SOURCE_COMMIT=PASS || { echo FAIL_RUNTIME_SOURCE_COMMIT; fail=1; }
          echo "ACTUAL_RUNTIME=$RUNTIME"; echo "SMART_LINK=$SMART_LINK"; echo "SOURCE_COMMIT=$GITHUB_SHA"
          [ "$fail" -eq 0 ] || exit 1
          echo PUBLIC_RUNTIME=PASS; echo RUNTIME_ROUTE_PARITY=PASS; echo RUNTIME_JS_ASSET=PASS; echo RUNTIME_COGNITIVE_ENGINE=PASS; echo RUNTIME_INTELLIGENCE_MARKERS=PASS; echo RUNTIME_FORBIDDEN_PRODUCT_UI=ABSENT; echo RUNTIME_SOURCE_COMMIT=PASS
