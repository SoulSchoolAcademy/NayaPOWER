# CANONICAL-LIVE-HUB-WORKFLOW-REGISTER-2026-09-09
# RELEASE PATH: NAYANET/HUB -> VITE BUILD -> CLOUDFLARE aged-art-7c12
name: Deploy Canonical NayaNET Hub

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: nayanet-canonical-live-hub
  cancel-in-progress: false

env:
  HUB: NAYANET/HUB
  WORKER_NAME: aged-art-7c12
  RUNTIME: https://aged-art-7c12.nayanet.workers.dev
  SMART_LINK: https://aged-art-7c12.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install
        working-directory: NAYANET/HUB
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: NAYANET/HUB
        run: npm run typecheck

      - name: Build
        working-directory: NAYANET/HUB
        run: npm run build

      - name: Inspect actual generated artifact
        run: |
          set -euo pipefail
          D="NAYANET/HUB/dist"
          test -s "$D/index.html"
          test -n "$(find "$D" -type f | head -n 1)"
          for x in 'NayaNET' 'Intelligent Hub' 'IDENTITY' 'ACTIVITY' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'Ask Naya' 'Create Smart Space' 'NUTSHELL' 'HUMAN' 'CHILD' 'GRANDMA' 'NAYA' 'MACHINE' 'WEAVER' 'LESSON' 'MEANING' 'ACTION' 'TRUST' 'RELATED INTELLIGENCE'; do grep -RFiq "$x" "$D" || { echo "ARTIFACT_MISSING=$x"; exit 1; }; done
          test ! -e "$D/nayanet-intelligent-feed-v6.js"
          sha256sum "$D/index.html" > /tmp/index.sha256
          find "$D" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/artifact.sha256
          echo 'CANONICAL_HUB_BUILD=PASS'
          echo 'ARTIFACT_INSPECTION=PASS'
          echo "ARTIFACT_FILES=$(find "$D" -type f | wc -l)"
          echo "ARTIFACT_BYTES=$(du -sb "$D" | cut -f1)"
          echo "INDEX_SHA256=$(cut -d' ' -f1 /tmp/index.sha256)"

      - name: Prepare exact Cloudflare artifact
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/public
          cp -R NAYANET/HUB/dist/. release/public/
          cat > release/worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              const isSpaRoute = url.pathname === '/' || url.pathname === '/index.html' || url.pathname.startsWith('/intelligence/');
              const assetRequest = isSpaRoute
                ? new Request(new URL('/index.html', request.url).toString(), { method: 'GET', headers: request.headers })
                : request;
              const response = await env.ASSETS.fetch(assetRequest);
              const headers = new Headers(response.headers);
              headers.set('Cache-Control', 'no-store, no-cache, must-revalidate, max-age=0');
              headers.set('Pragma', 'no-cache');
              headers.set('X-NayaNET-Source-Commit', '__SOURCE_COMMIT__');
              headers.set('X-NayaNET-Source', 'NAYANET/HUB');
              headers.set('X-NayaNET-Release-Path', 'NAYANET/HUB -> VITE -> CLOUDFLARE aged-art-7c12');
              return new Response(response.body, { status: response.status, headers });
            }
          };
          EOF
          sed -i "s/__SOURCE_COMMIT__/${GITHUB_SHA}/g" release/worker.js
          cat > release/wrangler.jsonc <<'EOF'
          {
            "name": "aged-art-7c12",
            "main": "worker.js",
            "compatibility_date": "2026-09-08",
            "account_id": "262c881746ea6e9978ca18b3eb831907",
            "assets": { "directory": "./public", "binding": "ASSETS" }
          }
          EOF
          test -s release/public/index.html
          test -s release/worker.js
          echo "RELEASE_SOURCE_COMMIT=$GITHUB_SHA" > release/RELEASE-MANIFEST.txt
          echo "RELEASE_SOURCE=NAYANET/HUB" >> release/RELEASE-MANIFEST.txt
          echo "RELEASE_TARGET=aged-art-7c12" >> release/RELEASE-MANIFEST.txt
          cat /tmp/index.sha256 >> release/RELEASE-MANIFEST.txt
          echo 'CLOUDFLARE_ARTIFACT=READY'

      - name: Deploy exact Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '262c881746ea6e9978ca18b3eb831907'
          workingDirectory: release
          command: deploy --config wrangler.jsonc

      - name: Independently verify exact public runtime and built assets
        run: |
          set -euo pipefail
          status=0
          for attempt in $(seq 1 20); do
            status=$(curl -sS -o /tmp/root -w '%{http_code}' "$RUNTIME/?release=$GITHUB_SHA" || true)
            echo "RUNTIME_ATTEMPT=$attempt HTTP=$status"
            if [ "$status" = "200" ]; then break; fi
            sleep 3
          done
          test "$status" = "200"
          smart_status=$(curl -sS -o /tmp/smart -w '%{http_code}' "$SMART_LINK?release=$GITHUB_SHA" || true)
          test "$smart_status" = "200"
          cmp -s /tmp/root /tmp/smart || { echo 'RUNTIME_ROUTE_PARITY=FAIL'; exit 1; }
          js_src=$(grep -oE 'src="[^"]+\.js"' /tmp/root | head -1 | cut -d'"' -f2)
          test -n "$js_src"
          case "$js_src" in /*) ;; *) js_src="/$js_src" ;; esac
          js_status=$(curl -sS -o /tmp/app-js -w '%{http_code}' "$RUNTIME$js_src?release=$GITHUB_SHA" || true)
          test "$js_status" = "200"
          test -s /tmp/app-js
          for x in 'NayaNET' 'Intelligent Hub' 'IDENTITY' 'ACTIVITY' 'PERSONAL INTELLIGENCE' 'COLLECTIVE INTELLIGENCE' 'Ask Naya' 'Create Smart Space' 'NUTSHELL' 'HUMAN' 'CHILD' 'GRANDMA' 'NAYA' 'MACHINE' 'WEAVER' 'LESSON' 'MEANING' 'ACTION' 'TRUST' 'RELATED INTELLIGENCE'; do grep -RFiq "$x" /tmp/root /tmp/app-js || { echo "PUBLIC_RUNTIME_MISSING=$x"; exit 1; }; done
          headers=$(curl -fsSI --retry 10 --retry-delay 3 "$RUNTIME/?release=$GITHUB_SHA")
          echo "$headers" | grep -F "X-NayaNET-Source-Commit: $GITHUB_SHA" >/dev/null || { echo 'RUNTIME_SOURCE_COMMIT_HEADER=FAIL'; echo "$headers"; exit 1; }
          echo "$headers" | grep -F 'X-NayaNET-Source: NAYANET/HUB' >/dev/null || { echo 'RUNTIME_SOURCE_HEADER=FAIL'; echo "$headers"; exit 1; }
          echo "$headers" | grep -F 'X-NayaNET-Release-Path: NAYANET/HUB -> VITE -> CLOUDFLARE aged-art-7c12' >/dev/null || { echo 'RUNTIME_RELEASE_PATH_HEADER=FAIL'; echo "$headers"; exit 1; }
          echo 'PUBLIC_RUNTIME=PASS'
          echo 'RUNTIME_ROUTE_PARITY=PASS'
          echo 'RUNTIME_JS_ASSET=PASS'
          echo 'RUNTIME_INTELLIGENCE_MARKERS=PASS'
          echo 'RUNTIME_SOURCE_COMMIT_HEADER=PASS'
          echo 'RUNTIME_SOURCE_HEADER=PASS'
          echo 'RUNTIME_RELEASE_PATH_HEADER=PASS'
          echo "ACTUAL_RUNTIME=$RUNTIME"
          echo "SMART_LINK=$SMART_LINK"
          echo "JS_ASSET=$js_src"
          echo "SOURCE_COMMIT=$GITHUB_SHA"
