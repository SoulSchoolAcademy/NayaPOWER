name: Deploy Canonical NayaNET Hub
on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - '.github/workflows/deploy-nayanet-hub-canonical.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  WORKER_NAME: aged-art-7c12
  RUNTIME: https://aged-art-7c12.nayanet.workers.dev
jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: NAYANET/HUB/package-lock.json}
      - name: Install
        working-directory: NAYANET/HUB
        run: npm install
      - name: Typecheck
        working-directory: NAYANET/HUB
        run: npm run typecheck
      - name: Build
        working-directory: NAYANET/HUB
        run: npm run build
      - name: Inspect artifact
        working-directory: NAYANET/HUB
        run: |
          test -s dist/index.html
          grep -q 'NayaNET' dist/index.html
          grep -q 'Intelligent Hub' dist/index.html
          test ! -e dist/nayanet-intelligent-feed-v6.js
      - name: Prepare Cloudflare artifact
        run: |
          mkdir -p release
          cp -R NAYANET/HUB/dist/. release/
          cat > release/wrangler.jsonc <<'EOF'
          {"name":"aged-art-7c12","compatibility_date":"2026-09-08","assets":{"directory":"./"}}
          EOF
          cat > release/_routes.json <<'EOF'
          {"version":1,"include":["/*"],"exclude":[]}
          EOF
      - name: Deploy exact Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '262c881746ea6e9978ca18b3eb831907'
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Independent runtime observation
        run: |
          set -e
          curl -fsSL "$RUNTIME/" -o runtime.html
          grep -q 'NayaNET' runtime.html
          grep -q 'Intelligent Hub' runtime.html
          grep -q 'MORE INTELLIGENCE. LESS WASTE.' runtime.html
          grep -q 'ONE CANONICAL INTELLIGENCE OBJECT' runtime.html
          echo "PUBLIC_RUNTIME=$RUNTIME"
          echo 'RUNTIME_OBSERVATION=PASS'
