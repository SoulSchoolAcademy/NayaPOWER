name: Retired — legacy NayaNET Hub V1 deploy

# V1 is retired. It deployed without explicit Worker-version promotion and could
# race the V2 release authority. Production release is now V2 only.
# Active trigger: .github/workflows/hub-canonical-release-trigger.yml
# Active implementation: .github/workflows/deploy-nayanet-hub-canonical-v2.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm V1 retirement
        run: |
          echo 'CANONICAL_NAYANET_HUB_V1=RETIRED'
          echo 'CANONICAL_NAYANET_HUB_V2=ACTIVE'
          echo 'ACTIVE_TRIGGER=.github/workflows/hub-canonical-release-trigger.yml'
          echo 'ACTIVE_IMPLEMENTATION=.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
          echo 'REASON=single release authority with explicit Worker promotion and independent runtime proof'
