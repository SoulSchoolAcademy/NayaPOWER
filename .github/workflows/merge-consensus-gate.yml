name: Merge consensus gate

# Shawn's protocol as code: no merge without (1) one approving review from a
# seat other than the author, and (2) a scorecard receipt naming the exact
# head SHA. Until branch protection requires this check, it reports but does
# not block — the freeze directive on the board is the interim enforcement.
#
# Scope note: the seat-receipt convention started 2026-10-11T16:30:00Z
# (PR #2352). PRs opened before that are SKIPPED with a clear message —
# enforcing the convention retroactively is a stale assertion. API failures
# fail closed with plain words ("unable to verify consensus"), never a
# traceback: a red check with a stack trace trains everyone to ignore red.
#
# 2026-10-12 (t0252, Lane 8 — Naya Sentinel): the `issue_comment` trigger is
# REMOVED. It fired on every comment repo-wide, including the #2175 lane
# coordination feed (~130 runs/hr on the tip, all skipped at the job gate:
# 0 runner minutes, but pure noise on the tip's check list — 143 runs on
# f9b5ac3d, 127 of them skipped). Verdict comments posted on PRs no longer
# auto-refresh this gate; re-request it explicitly after posting a verdict:
#   bin/gh-api POST /repos/<owner>/<repo>/actions/runs/<run-id>/rerun
# pull_request (opened/synchronize/reopened/edited) and pull_request_review
# (submitted/dismissed) still trigger automatically. The gate script still
# reads PR comments via the issues API — only the trigger is gone.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]

# Least privilege: the gate only reads PRs, reviews, and PR comments
# (served by the issues API). Declared explicitly so a future default
# restriction cannot silently 403 the gate into permanent red.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  consensus:
    name: Team review + scorecard receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get PR info
        id: pr
        run: |
          # Both remaining triggers (pull_request, pull_request_review) carry
          # the PR object in the event payload — no API call needed.
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "head_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
      - name: Check merge consensus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 tools/check_merge_consensus.py
