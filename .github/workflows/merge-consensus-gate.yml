name: Merge consensus gate

# Shawn's protocol as code: no merge without (1) one approving review from a
# seat other than the author, and (2) a scorecard receipt naming the exact
# head SHA. Until branch protection requires this check, it reports but does
# not block — the freeze directive on the board is the interim enforcement.
#
# Scope note: the seat-receipt convention started 2026-10-11T16:30:00Z
# (PR #2352). PRs opened before that are SKIPPED with a clear message —
# enforcing the convention retroactively is a stale assertion. API failures
# fail closed with plain words ("unable to verify consensus"), never a
# traceback: a red check with a stack trace trains everyone to ignore red.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]

# Least privilege: the gate reads PRs, reviews, PR comments (issues API), and
# workflow runs for the PR-scoped merge-authority check. actions: read is
# required for that read-only Actions API call; write access is not needed.
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  consensus:
    name: Team review + scorecard receipt
    runs-on: ubuntu-latest
    # Only run for PR comments, not issue comments
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@v4
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For pull_request events, use the event payload directly (no API call needed).
          # Only issue_comment events need the API lookup for the head SHA.
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUM="${{ github.event.issue.number }}"
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
            # Retry the API call up to 5 times with backoff (rate-limit
            # resilience: comment events fire during merge bursts when the
            # shared token quota is exhausted; a hard fail here is the same
            # chronic-red family as the consensus step itself)
            HEAD_SHA=""
            for attempt in 1 2 3 4 5; do
              if HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUM" --jq .head.sha 2>/dev/null) && [ -n "$HEAD_SHA" ]; then
                break
              fi
              echo "gh api attempt $attempt failed, retrying..." >&2
              sleep $((attempt * 10))
            done
            if [ -z "$HEAD_SHA" ]; then
              echo "ERROR: could not resolve head SHA for PR $PR_NUM after 5 attempts (API unavailable, not a consensus verdict)" >&2
              exit 1
            fi
            # Fail-closed SHA binding: only a well-formed 40-hex git SHA may
            # leave this step as head_sha. An unverified, malformed, or
            # hardcoded-looking value is rejected here — never echoed into
            # $GITHUB_OUTPUT. A blind lookup failure must produce NO output,
            # never a confident-looking SHA (P-008 defect class).
            #
            # The line-anchored grep below is NOT sufficient on its own
            # (residual found in #2517 IV, Naya Mu): grep matches per line,
            # so a value like "<40hex>\n<injected line>" passes on its first
            # line and then writes BOTH lines into $GITHUB_OUTPUT, where the
            # injected line (GitHub parses last-wins) silently overrides the
            # bound head_sha — defeating the fail-closed binding entirely.
            # Reject any newline first: a git SHA is exactly one line, so
            # multiline values are never legitimate and always fail closed.
            case "$HEAD_SHA" in
              *$'\n'*)
                echo "ERROR: head SHA lookup for PR $PR_NUM returned a multiline value; rejecting as fail-closed" >&2
                exit 1
                ;;
            esac
            if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "ERROR: head SHA lookup for PR $PR_NUM returned an invalid value (not a 40-hex git SHA); rejecting as fail-closed" >&2
              exit 1
            fi
            echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Check merge consensus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 tools/check_merge_consensus.py

  # L245: the DELEGATED-MERGE-AUTHORITY packet is built from REAL PR data by
  # tools/assemble_merge_packet.py and verified by the canonical check
  # tools/protocol/checks/merge_authority.py. This MUST be its own job:
  # GitHub creates one check run per job, named by the job's `name:` field,
  # and the post-merge authority audit (tools/authority_audit.py) looks up
  # the check run named exactly "Verify merge authority" on each merged
  # head. A step inside the consensus job would be invisible to the audit.
  #
  # Aggregation scope (L307 prong (b), T-H4): PR-scoped. The kernel `test`
  # job failing at head AND at the live base tip is an inherited tip
  # defect — recorded, never a veto. Only a head failure with a green (or
  # unknown) base counts. The gate's own previous check-run never vetoes.
  authority:
    name: Verify merge authority
    runs-on: ubuntu-latest
    # Only run for PR comments, not issue comments
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@v4
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same PR-number/head-SHA resolution as the consensus job (the
          # jobs cannot share step outputs). For pull_request events the
          # payload carries both; issue_comment events need the API lookup
          # with the same retry/backoff discipline.
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUM="${{ github.event.issue.number }}"
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
            HEAD_SHA=""
            for attempt in 1 2 3 4 5; do
              if HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUM" --jq .head.sha 2>/dev/null) && [ -n "$HEAD_SHA" ]; then
                break
              fi
              echo "gh api attempt $attempt failed, retrying..." >&2
              sleep $((attempt * 10))
            done
            if [ -z "$HEAD_SHA" ]; then
              echo "ERROR: could not resolve head SHA for PR $PR_NUM after 5 attempts (API unavailable, not an authority verdict)" >&2
              exit 1
            fi
            echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Verify merge authority (L245)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # The packet is built from REAL PR data (fail-closed: missing
          # fields or API failure never read as permission); the check's
          # exact reason is the verdict. Posture: until branch protection
          # requires this check, a red check plus the freeze directive is
          # the interim enforcement - same as the consensus job. API
          # failures fail closed with plain words ("unable to verify"),
          # never a traceback.
          python3 tools/assemble_merge_packet.py \
            --pr "${{ steps.pr.outputs.pr_number }}" --verify
