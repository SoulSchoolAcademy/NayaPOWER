name: NayaNET Ultimate Surgical Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: !contains(github.event.head_commit.message, '[nayanet-ultimate]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical house
        uses: actions/checkout@v4

      - name: Build Ultimate Hub from 5:09 canonical source
        env:
          CANONICAL: '2026 09 09 5:09 pm NayaNET HUB'
          REFERENCE: '2026 09 09 511 pm NayaNET HUB'
          BACKUP: '.naya/backups/2026-09-09-ultimate-prechange-5-09.html'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          canonical = Path('2026 09 09 5:09 pm NayaNET HUB')
          reference = Path('2026 09 09 511 pm NayaNET HUB')
          backup = Path('.naya/backups/2026-09-09-ultimate-prechange-5-09.html')
          if not canonical.exists():
              raise SystemExit('Canonical 5:09 source missing')
          if not reference.exists():
              raise SystemExit('5:11 reference missing')
          backup.parent.mkdir(parents=True, exist_ok=True)
          if not backup.exists():
              shutil.copy2(canonical, backup)

          base = canonical.read_text(encoding='utf-8')
          ref = reference.read_text(encoding='utf-8')
          if 'data-nayanet-ultimate-feed' in base:
              raise SystemExit('Ultimate feed marker already present; refusing duplicate patch')

          # Preserve the entire 5:09 house and surgically add one canonical intelligence layer.
          css = r'''<style id="nayanet-ultimate-feed-css">
          #nayanet-ultimate-feed{margin:24px 0 0;border:1px solid #ffffff1c;border-radius:28px;background:linear-gradient(145deg,#101016,#08080c);box-shadow:inset 0 1px #fff4,0 28px 70px #000b;overflow:hidden}
          #nayanet-ultimate-feed .uf-head{padding:22px 24px 18px;border-bottom:1px solid #ffffff12;background:radial-gradient(700px 240px at 15% 0,#6675ff12,transparent 70%),radial-gradient(700px 260px at 90% 100%,#d86cff0d,transparent 70%)}
          #nayanet-ultimate-feed .uf-kicker{font-size:8px;font-weight:1000;letter-spacing:.18em;color:#9e98aa}
          #nayanet-ultimate-feed .uf-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-top:8px}
          #nayanet-ultimate-feed h2{font-size:clamp(27px,3.4vw,43px);line-height:.95;letter-spacing:-.055em;margin:0}
          #nayanet-ultimate-feed .uf-sub{max-width:720px;margin:10px 0 0;color:#c8c3ce;font-size:11px;line-height:1.55}
          #nayanet-ultimate-feed .uf-status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #e8c76645;border-radius:999px;color:#f0dc9a;background:#e8c7660c;font-size:7px;font-weight:1000;letter-spacing:.08em;white-space:nowrap}
          #nayanet-ultimate-feed .uf-status i{width:7px;height:7px;border-radius:50%;background:#e8c766;box-shadow:0 0 12px #e8c766}
          #nayanet-ultimate-feed .uf-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 24px;border-bottom:1px solid #ffffff10;background:#09090d}
          #nayanet-ultimate-feed .uf-group{display:flex;gap:6px;flex-wrap:wrap}
          #nayanet-ultimate-feed button{min-height:38px;border:1px solid #ffffff1b;border-radius:11px;background:linear-gradient(145deg,#111118,#08080c);color:#bbb6c2;padding:0 11px;font-size:8px;font-weight:1000;letter-spacing:.05em}
          #nayanet-ultimate-feed button:hover{border-color:#ffffff45;color:#fff;transform:translateY(-1px)}
          #nayanet-ultimate-feed button[aria-pressed="true"]{color:#fff;border-color:#d86cff70;background:linear-gradient(145deg,#24152d,#0c0b11);box-shadow:0 0 22px #d86cff0c,inset 0 1px #fff4}
          #nayanet-ultimate-feed .uf-mode[aria-pressed="true"]{border-color:#55b9ee60;background:#55b9ee0b}
          #nayanet-ultimate-feed .uf-feed{display:grid;gap:14px;padding:18px 24px 24px}
          #nayanet-ultimate-feed .uf-block{border:1px solid #ffffff18;border-radius:22px;background:linear-gradient(145deg,#14141a,#09090d);box-shadow:inset 0 1px #fff3,0 18px 42px #0009;overflow:hidden}
          #nayanet-ultimate-feed .uf-ident{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 17px;border-bottom:1px solid #ffffff10}
          #nayanet-ultimate-feed .uf-ident-left{display:flex;align-items:center;gap:9px;min-width:0}
          #nayanet-ultimate-feed .uf-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#d86cff,#3d2271);color:#050507;font-size:10px;font-weight:1000;box-shadow:0 0 20px #d86cff22}
          #nayanet-ultimate-feed .uf-ident strong{font-size:9px}.uf-ident small{display:block;color:#817b89;font-size:7px;margin-top:2px}
          #nayanet-ultimate-feed .uf-type{padding:5px 8px;border-radius:999px;border:1px solid #55b9ee30;background:#55b9ee0b;color:#bfe8ff;font-size:7px;font-weight:1000}
          #nayanet-ultimate-feed .uf-body{padding:18px 17px 15px}
          #nayanet-ultimate-feed .uf-nutshell{font-size:19px;line-height:1.17;letter-spacing:-.025em;margin:0 0 12px;color:#fff}
          #nayanet-ultimate-feed .uf-signal{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.uf-chip{padding:5px 7px;border-radius:8px;font-size:7px;font-weight:1000;border:1px solid #ffffff15;color:#a9a3b0}.uf-chip.known{border-color:#55e39a40;color:#bfffd8;background:#55e39a08}.uf-chip.inferred{border-color:#e8c76640;color:#f1dc9a;background:#e8c76608}
          #nayanet-ultimate-feed .uf-perspectives{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
          #nayanet-ultimate-feed .uf-perspective{padding:10px;border:1px solid #ffffff12;border-radius:12px;background:#08080c;min-height:92px}.uf-perspective b{display:block;font-size:7px;letter-spacing:.08em;margin-bottom:6px}.uf-perspective p{margin:0;color:#bdb7c4;font-size:9px;line-height:1.45}.uf-human b{color:#d86cff}.uf-child b{color:#6675ff}.uf-grandma b{color:#7f8cff}.uf-naya b{color:#55b9ee}.uf-machine b{color:#55e39a}
          #nayanet-ultimate-feed .uf-deeper{display:none;margin-top:11px;padding-top:11px;border-top:1px solid #ffffff10}.uf-block[data-expanded="true"] .uf-deeper{display:block}
          #nayanet-ultimate-feed .uf-row{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0}.uf-row+ .uf-row{border-top:1px solid #ffffff0c}.uf-row b{font-size:7px;letter-spacing:.1em;color:#8d8795}.uf-row span{font-size:9px;color:#c9c3cf;line-height:1.5}
          #nayanet-ultimate-feed .uf-related{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.uf-rel{padding:7px 9px;border:1px solid #d86cff28;border-radius:9px;background:#d86cff07;color:#d9c5e6;font-size:7px;font-weight:900}
          #nayanet-ultimate-feed .uf-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 17px;border-top:1px solid #ffffff10;background:#08080c}.uf-actionset{display:flex;gap:6px;flex-wrap:wrap}.uf-actionset button{min-height:34px}.uf-actionset button.primary{border-color:#d86cff55;color:#fff}.uf-state{font-size:7px;color:#8f8996}.uf-state.success{color:#bfffd8}.uf-state.error{color:#ffb6b6}
          #nayanet-ultimate-feed .uf-empty{padding:34px;text-align:center;color:#8f8996;font-size:10px}
          @media(max-width:980px){#nayanet-ultimate-feed .uf-perspectives{grid-template-columns:repeat(2,minmax(0,1fr))}.uf-machine{grid-column:span 2}}
          @media(max-width:680px){#nayanet-ultimate-feed{border-radius:20px;margin-top:16px}#nayanet-ultimate-feed .uf-head{padding:18px}.uf-title{align-items:start!important;flex-direction:column}#nayanet-ultimate-feed .uf-controls{padding:11px 14px}#nayanet-ultimate-feed .uf-feed{padding:12px 14px 18px}#nayanet-ultimate-feed .uf-perspectives{grid-template-columns:1fr}.uf-machine{grid-column:auto}.uf-row{grid-template-columns:1fr!important;gap:4px!important}.uf-actionset{width:100%}.uf-actionset button{flex:1}.uf-status{font-size:6px}}
          @media(prefers-reduced-motion:reduce){#nayanet-ultimate-feed button{transition:none!important;transform:none!important}}
          </style>'''

          # The runtime module intentionally uses a single canonical event array and one renderer.
          js = r'''<script id="nayanet-ultimate-feed-js">
          (()=>{
            'use strict';
            const KEY='nayanet:ultimate:intelligence:v1';
            const state={lens:'ACTIVITY',mode:'SKIM',events:[],actionStates:{}};
            const seed=[
              {id:'evt-001',type:'LESSON',actor:'Naya',time:'Just now',nutshell:'Useful intelligence becomes more valuable when it can be found, trusted, connected, and used again.',status:'KNOWN',meaning:'The unit of value is the intelligence event—not the post.',action:'Create Smart Space',related:[['leads to','evt-002'],['supports','evt-003']],human:'This should save me from relearning the same thing.',child:'Save the smart thing so you can find it later.',grandma:'A lesson kept is a lesson that can help someone twice.',naya:'The compounding advantage comes from persistent context and meaningful relationships.',machine:'Canonical event → projection → renderer; no second feed truth model.'},
              {id:'evt-002',type:'DISCOVERY',actor:'Shawn + Naya',time:'Earlier',nutshell:'The strongest Hub architecture protects the proven house while making the Intelligent Block the atomic unit.',status:'STRONGLY INFERRED',meaning:'Surgical evolution beats wholesale reconstruction when the existing product contains proven behavior.',action:'Save',related:[['derived from','evt-001'],['improves','evt-003']],human:'Keep what works; improve what matters.',child:'Do not tear down the house to fix one room.',grandma:'Good builders respect the foundation.',naya:'5:09 is the protected base; the best 5:11 feed ideas belong inside one canonical renderer.',machine:'Source parity must be checked before release claims.'},
              {id:'evt-003',type:'VERIFIED RULE',actor:'NayaNET Standard',time:'Today',nutshell:'Every action is a promise: its visible state must come from actual system state.',status:'KNOWN',meaning:'Trust is a product capability, not a decorative label.',action:'Open Source',related:[['supports','evt-001'],['verified by','evt-004']],human:'I should know whether something actually happened.',child:'The button should tell the truth.',grandma:'Never promise what you cannot prove.',naya:'Fixture behavior must never masquerade as production persistence.',machine:'IDLE → ACTIVE → PERSISTING → SUCCESS; terminal ERROR/REJECTED/UNAUTHORIZED/UNAVAILABLE.'},
              {id:'evt-004',type:'EVIDENCE',actor:'Machine / Release Gate',time:'Today',nutshell:'Completion is proven only when source, build, artifact, deployment, exact runtime, and observation agree.',status:'KNOWN',meaning:'Source intent is not runtime truth.',action:'Verify',related:[['verifies','evt-003']],human:'Show me the proof.',child:'Check the real thing, not just the file.',grandma:'Measure twice; tell the truth once.',naya:'The next Naya should inherit evidence, not assumptions.',machine:'SOURCE → BUILD → ARTIFACT → DEPLOYMENT → EXACT RUNTIME → INDEPENDENT OBSERVATION → VISUAL OBSERVATION.'}
            ];
            function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.events))Object.assign(state,x)}catch(e){} if(!state.events.length)state.events=seed.map(x=>({...x}));}
            function save(){try{localStorage.setItem(KEY,JSON.stringify({events:state.events,actionStates:state.actionStates}))}catch(e){}}
            const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            function block(e){
              const expanded=state.mode!=='SKIM';
              const p=(label,text,cls)=>`<div class="uf-perspective ${cls}"><b>${label}</b><p>${esc(text)}</p></div>`;
              const rel=(e.related||[]).map(([r,id])=>`<span class="uf-rel">${esc(r)} · ${esc(id)}</span>`).join('');
              const st=state.actionStates[e.id]||'READY';
              return `<article class="uf-block" data-id="${esc(e.id)}" data-expanded="${expanded}">
                <div class="uf-ident"><div class="uf-ident-left"><div class="uf-avatar">N</div><div><strong>${esc(e.actor)}</strong><small>${esc(e.time)} · canonical intelligence event</small></div></div><span class="uf-type">${esc(e.type)}</span></div>
                <div class="uf-body"><h3 class="uf-nutshell">${esc(e.nutshell)}</h3><div class="uf-signal"><span class="uf-chip ${e.status==='KNOWN'?'known':'inferred'}">${esc(e.status)}</span><span class="uf-chip">${esc(state.mode)}</span><span class="uf-chip">${esc(state.lens)}</span></div>
                <div class="uf-perspectives">${p('HUMAN',e.human,'uf-human')}${p('CHILD',e.child,'uf-child')}${p('GRANDMA',e.grandma,'uf-grandma')}${p('NAYA',e.naya,'uf-naya')}${p('MACHINE',e.machine,'uf-machine')}</div>
                <div class="uf-deeper"><div class="uf-row"><b>MEANING</b><span>${esc(e.meaning)}</span></div><div class="uf-row"><b>NEXT ACTION</b><span>${esc(e.action)}</span></div><div class="uf-row"><b>RELATED INTELLIGENCE</b><span><span class="uf-related">${rel||'<span class="uf-rel">No relationship asserted</span>'}</span></span></div><div class="uf-row"><b>PROVENANCE</b><span>Origin: NayaNET design standard · Evidence state: ${esc(e.status)} · Local fixture receipt: ${esc(e.id)}</span></div></div></div>
                <div class="uf-actions"><div class="uf-actionset"><button class="primary" data-act="expand">${expanded?'Collapse':'Understand'}</button><button data-act="save">Save</button><button data-act="share">Share</button><button data-act="space">Create Smart Space</button><button data-act="source">Open Source</button></div><span class="uf-state ${st==='SUCCESS'?'success':''}">${esc(st)} · LOCAL FIXTURE</span></div>
              </article>`;
            }
            function lensEvents(){
              const all=state.events.slice();
              if(state.lens==='PERSONAL')return all.filter(e=>e.actor.includes('Shawn')||e.type==='LESSON');
              if(state.lens==='COLLECTIVE')return all.filter(e=>e.type==='DISCOVERY'||e.type==='VERIFIED RULE'||e.type==='EVIDENCE');
              return all;
            }
            function render(){const root=document.querySelector('#nayanet-ultimate-feed');if(!root)return;const events=lensEvents();root.querySelector('.uf-feed').innerHTML=events.length?events.map(block).join(''):'<div class="uf-empty">No intelligence matches this lens yet.</div>';root.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',act));root.querySelectorAll('[data-lens]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lens===state.lens)));root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));}
            function act(ev){const b=ev.currentTarget,card=b.closest('.uf-block'),id=card?.dataset.id,kind=b.dataset.act,e=state.events.find(x=>x.id===id);if(!id)return;if(kind==='expand'){card.dataset.expanded=card.dataset.expanded!=='true';b.textContent=card.dataset.expanded==='true'?'Collapse':'Understand';return}state.actionStates[id]='ACTIVE';render();setTimeout(()=>{state.actionStates[id]='PERSISTING';render();setTimeout(()=>{state.actionStates[id]='SUCCESS';save();render()},220)},180);}
            function mount(){if(document.querySelector('#nayanet-ultimate-feed'))return;const pages=[...document.querySelectorAll('.page')];let home=document.querySelector('#home')||pages.find(p=>/home|intelligent hub|welcome/i.test(p.textContent||''))||document.querySelector('.page.active');if(!home)return;const el=document.createElement('section');el.id='nayanet-ultimate-feed';el.dataset.nayanetUltimateFeed='true';el.innerHTML=`<div class="uf-head"><div class="uf-kicker">NAYANET · INTELLIGENT FEED · CANONICAL PROJECTION</div><div class="uf-title"><div><h2>Living Intelligence</h2><p class="uf-sub">One canonical event model. One Intelligent Block language. Many lenses. The feed is a projection of intelligence—not a second memory system.</p></div><span class="uf-status"><i></i>5:09 HOUSE PROTECTED</span></div></div><div class="uf-controls"><div class="uf-group"><button data-lens="ACTIVITY" aria-pressed="true">Activity</button><button data-lens="PERSONAL" aria-pressed="false">Personal</button><button data-lens="COLLECTIVE" aria-pressed="false">Collective</button></div><div class="uf-group"><button class="uf-mode" data-mode="SKIM" aria-pressed="true">Skim</button><button class="uf-mode" data-mode="LEARN" aria-pressed="false">Learn</button><button class="uf-mode" data-mode="VERIFY" aria-pressed="false">Verify</button><button class="uf-mode" data-mode="OPERATE" aria-pressed="false">Operate</button><button class="uf-mode" data-mode="EXPLORE" aria-pressed="false">Explore</button><button class="uf-mode" data-mode="TEACH" aria-pressed="false">Teach</button></div></div><div class="uf-feed"></div>`;home.insertBefore(el,home.firstChild);el.querySelectorAll('[data-lens]').forEach(b=>b.addEventListener('click',()=>{state.lens=b.dataset.lens;render()}));el.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;render()}));render();}
            function boot(){load();mount();const mo=new MutationObserver(()=>mount());mo.observe(document.body,{childList:true,subtree:true});setTimeout(()=>mo.disconnect(),6000)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
            window.NayaNETUltimate={state,render,mount};
          })();
          </script>'''

          # Pull the best conceptual signal from 5:11 without importing its mirror/guard runtime.
          ref_has_feed = bool(re.search(r'(?i)smart\s*feed|activity|collective|intelligent', ref))
          marker = '<!-- NAYANET ULTIMATE SURGICAL LAYER: 5:09 HOUSE + 5:11 FEED CONCEPTS -->'
          injection = marker + ('\n' + css + '\n' + js)
          if '</body>' not in base:
              raise SystemExit('5:09 source has no </body>; refusing unsafe rewrite')
          built = base.replace('</body>', injection + '\n</body>', 1)
          built = built.replace('<title>NayaNET — Intelligent Hub V7</title>','<title>NayaNET — Intelligent Hub V7 · Ultimate Intelligence</title>',1)
          if not ref_has_feed:
              raise SystemExit('5:11 reference did not expose expected feed concepts')
          canonical.write_text(built,encoding='utf-8')

          # Static release-gate checks.
          checks=['data-nayanet-ultimate-feed','ONE CANONICAL','Living Intelligence','ACTIVITY','PERSONAL','COLLECTIVE','SKIM','LEARN','VERIFY','OPERATE','EXPLORE','TEACH','LOCAL FIXTURE','prefers-reduced-motion']
          missing=[x for x in checks if x not in built]
          if missing: raise SystemExit('Release gate failed; missing: '+', '.join(missing))
          if 'mirror' in built.lower() or 'querySelectorAll("#nayanet-ultimate-feed")' not in built:
              # mirror is a prohibited implementation concept; fail rather than inherit it.
              if 'mirror' in built.lower(): raise SystemExit('Release gate failed: mirror runtime detected')
          if len(built) < 200000: raise SystemExit('Release gate failed: canonical source unexpectedly shrank')
          print('Ultimate surgical build complete:', len(built), 'bytes')
          PY

      - name: Verify source integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('2026 09 09 5:09 pm NayaNET HUB')
          b=p.read_text(encoding='utf-8')
          assert b.startswith('<!doctype html>')
          assert b.count('<html') == 1
          assert b.count('</html>') == 1
          assert b.count('<body') == 1 and b.count('</body>') == 1
          assert 'data-nayanet-ultimate-feed' in b
          print('HTML integrity gate: PASS')
          print('Bytes:', len(b))
          PY

      - name: Commit verified surgical result
        run: |
          git config user.name "NayaNET Surgical Builder"
          git config user.email "actions@nayanet.local"
          git add '2026 09 09 5:09 pm NayaNET HUB' '.naya/backups/2026-09-09-ultimate-prechange-5-09.html'
          git commit -m "[nayanet-ultimate] evolve 5:09 into canonical intelligent feed" || echo "No commit needed"
          git push
