name: Verify automatic intelligence boundary

on:
  push:
    branches:
      - naya/automatic-intelligence-boundary-20260924
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pytest -q tests/test_stream_b_canonical_intelligence_commit_bridge.py
