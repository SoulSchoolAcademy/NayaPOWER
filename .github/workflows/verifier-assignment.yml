name: Verifier assignment

# Removes the manual bottleneck on independent verification: every PR
# targeting main automatically gets an independent verifier seat assigned
# (never the author's seat), with the exact head SHA and the verification
# recipe. Feeds the merge-consensus gate — the gate still requires a real
# [NAYA M · REVIEW] + scorecard before merge. A PR with no verifier waits;
# it never auto-merges.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

jobs:
  assign:
    name: Assign independent verifier
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    # On label events, only act when the needs-verification label is added
    # (the action itself adds that label; idempotency in the script prevents
    # a loop).
    if: github.event.action != 'labeled' || github.event.label.name == 'needs-verification'
    steps:
      - uses: actions/checkout@v4
      - name: Assign verifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/assign_verifier.py
