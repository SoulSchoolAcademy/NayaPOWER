name: Deploy NayaNET Intelligent Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-intelligent-hub-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_RQnhoOb3bAXxMlcr67GFTu3Q
  VERCEL_PROJECT_ID: prj_ZpMGeKq4LcMBYslrO9D70jINpEVA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical GitHub source
        uses: actions/checkout@v4

      - name: Install Hub dependencies
        working-directory: NAYANET/HUB
        run: npm ci

      - name: Build Hub and generated PIS
        working-directory: NAYANET/HUB
        run: npm run build

      - name: Verify generated PIS before deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('NAYANET/HUB/public/intelligence/pis-feed.json')
          if not p.exists():
              raise SystemExit('PIS_MISSING: NAYANET/HUB/public/intelligence/pis-feed.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          count = data.get('event_count')
          if not isinstance(count, int) or count <= 0:
              raise SystemExit(f'PIS_INVALID_EVENT_COUNT: {count!r}')
          print(f'PIS_PREDEPLOY_OK event_count={count}')
          PY

      - name: Deploy existing Vercel project to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN_MISSING'
            exit 1
          fi
          npx vercel@latest deploy NAYANET/HUB --prod --yes --token "$VERCEL_TOKEN"

      - name: Record deployment commit identity
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID"
