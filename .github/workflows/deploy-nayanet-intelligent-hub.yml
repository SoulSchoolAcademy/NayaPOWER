name: Deploy NayaNET Intelligent Hub — Cloudflare Production

on:
  push:
    branches:
      - main
    paths:
      - 'NAYANET/HUB/**'
      - '2026 09 17 NAYANET HUB.html'
      - 'assistant-runtime.js'
      - 'scripts/build-smart-feed-projection.py'
      - '.github/workflows/deploy-nayanet-intelligent-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-intelligent-hub-production
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  CLOUDFLARE_WORKER: sparkling-shape-7ae5
  NAYA_HUB_RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout canonical GitHub source
        uses: actions/checkout@v4

      - name: Install Hub dependencies
        working-directory: NAYANET/HUB
        run: npm ci

      - name: Build Hub and generated PIS
        working-directory: NAYANET/HUB
        run: npm run build

      - name: Verify generated PIS before deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('NAYANET/HUB/dist/intelligence/pis-feed.json')
          if not p.exists():
              raise SystemExit('PIS_MISSING: NAYANET/HUB/dist/intelligence/pis-feed.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          count = data.get('event_count')
          if not isinstance(count, int) or count <= 0:
              raise SystemExit(f'PIS_INVALID_EVENT_COUNT: {count!r}')
          print(f'PIS_PREDEPLOY_OK event_count={count}')
          PY

      - name: Install canonical Hub presentation baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f '2026 09 17 NAYANET HUB.html'
          cp '2026 09 17 NAYANET HUB.html' 'NAYANET/HUB/dist/index.html'
          test -f 'assistant-runtime.js'
          cp 'assistant-runtime.js' 'NAYANET/HUB/dist/assistant-runtime.js'
          mkdir -p "NAYANET/HUB/dist/releases/${GITHUB_SHA}"
          cp 'NAYANET/HUB/dist/index.html' "NAYANET/HUB/dist/releases/${GITHUB_SHA}/index.html"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('NAYANET/HUB/wrangler.jsonc')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['vars'] = {'NAYA_RELEASE': os.environ['GITHUB_SHA']}
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print(f"NAYA_RELEASE_BOUND={os.environ['GITHUB_SHA']}")
          PY
          echo "CANONICAL_PRESENTATION_BASELINE_INSTALLED source='2026 09 17 NAYANET HUB.html'"
          echo "RUNTIME_BRIDGE_INSTALLED source='assistant-runtime.js'"
          echo "VERSIONED_CANONICAL_ASSET_INSTALLED release='${GITHUB_SHA}'"

      - name: Verify Cloudflare authorization inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -f NAYANET/HUB/wrangler.jsonc
          echo "CLOUDFLARE_TARGET_READY worker=$CLOUDFLARE_WORKER account=$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy canonical NayaNET Hub to Cloudflare
        working-directory: NAYANET/HUB
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify live Hub artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 -D "$RUNNER_TEMP/live-hub.headers" "${NAYA_HUB_RUNTIME_URL}/?naya_release=${GITHUB_SHA}" -o "$RUNNER_TEMP/live-hub.html"
          grep -qi 'x-naya-canonical-asset:' "$RUNNER_TEMP/live-hub.headers"
          grep -q "${GITHUB_SHA}" "$RUNNER_TEMP/live-hub.html"
          grep -q 'NayaNET' "$RUNNER_TEMP/live-hub.html"
          grep -q 'naya509-final' "$RUNNER_TEMP/live-hub.html"
          grep -q 'COLLECTIVE INTELLIGENCE' "$RUNNER_TEMP/live-hub.html"
          grep -q 'PERSONAL INTELLIGENCE' "$RUNNER_TEMP/live-hub.html"
          grep -q 'ACTIVITY' "$RUNNER_TEMP/live-hub.html"
          echo "LIVE_HUB_REACHABLE_AND_CANONICAL_PRESENTATION_VERIFIED url=$NAYA_HUB_RUNTIME_URL"

      - name: Record deployment commit identity
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "CLOUDFLARE_WORKER=$CLOUDFLARE_WORKER"
          echo "NAYA_HUB_RUNTIME_URL=$NAYA_HUB_RUNTIME_URL"
