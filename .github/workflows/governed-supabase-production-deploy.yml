name: Governed Supabase Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to authorize a production Edge Function deployment"
        required: true
        default: "NO"
        type: string

permissions:
  contents: read
  actions: write
  id-token: write

env:
  SUPABASE_PROJECT_ID: dahisasgpfvziswqvmvm
  PROOF_WORKFLOW: live-supabase-runtime-proof.yml
  DEPLOY_BROKER_URL: ${{ vars.NAYANET_DEPLOYMENT_BROKER_URL }}

jobs:
  deploy-and-prove:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require explicit human production authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "DEPLOY"
          test -n "${DEPLOY_BROKER_URL}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Mint short-lived governed deployment identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-production-deploy" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"
          printf '%s' "$token" > "$RUNNER_TEMP/deploy-oidc.jwt"

      - name: Build immutable governed deployment request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          request = {
              "schema": "NAYANET_GOVERNED_DEPLOYMENT_REQUEST_V1",
              "human_authorization":"DEPLOY",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "source_revision":os.environ["GITHUB_SHA"],
              "project_id": os.environ["SUPABASE_PROJECT_ID"],
              "functions":[
                  "nayanet-cold-runtime-proof",
                  "nayanet-intelligence-commit-runtime",
                  "nayanet-causal-learning-experiment",
                  "nayanet-learning-verify",
              ],
              "proof_workflow": os.environ["PROOF_WORKFLOW"],
          }
          json.dump(request, open("deployment-request.json","w"), indent=2)
          PY

      - name: Execute deployment through OIDC-authenticated machine broker
        shell: bash
        run: |
          set -euo pipefail
          http_status="$(curl -sS \
            -X POST \
            -H "Authorization: Bearer $(cat "$RUNNER_TEMP/deploy-oidc.jwt")" \
            -H "Content-Type: application/json" \
            --data-binary @deployment-request.json \
            -o deployment-response.json \
            -w "%{http_code}" \
            "$DEPLOY_BROKER_URL")"
          cat deployment-response.json
          echo "HTTP_STATUS=$http_status"
          test "$http_status" = "200"
          python - <<'PY'
          import json, os
          response=json.load(open("deployment-response.json"))
          expected=[
              "nayanet-cold-runtime-proof",
              "nayanet-intelligence-commit-runtime",
              "nayanet-causal-learning-experiment",
              "nayanet-learning-verify",
          ]
          assert response.get("ok") is True, response
          assert response.get("runtime_identity") == "github-actions-oidc", response
          assert response.get("source_revision") == os.environ["GITHUB_SHA"], response
          assert response.get("project_id") == os.environ["SUPABASE_PROJECT_ID"], response
          assert sorted(response.get("deployed_functions", [])) == sorted(expected), response
          assert response.get("provider_authentication") != "recurring-human-token", response
          json.dump(response, open("deployment-receipt.json","w"), indent=2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: governed-production-deployment-receipt
          path: |
            deployment-request.json
            deployment-response.json
            deployment-receipt.json

      - name: Dispatch the canonical live proof workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "$PROOF_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main

      - name: Wait for the canonical proof workflow and report its result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$PROOF_WORKFLOW" --branch main --limit 10 --json databaseId,headSha,status,conclusion,event,createdAt)"
            run_id="$(python - <<'PY' "$run_json"
          import json,sys,os
          runs=json.loads(sys.argv[1])
          head=os.environ["GITHUB_SHA"]
          matches=[r for r in runs if r.get("headSha")==head and r.get("event")=="workflow_dispatch"]
          print(max(matches,key=lambda r:r["createdAt"])["databaseId"] if matches else "")
          PY
            )"
            if [ -n "$run_id" ]; then
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
              exit $?
            fi
            sleep 10
          done
          echo "Timed out waiting for canonical proof workflow dispatch"
          exit 1
