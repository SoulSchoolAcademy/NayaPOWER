      - name: Write production promotion failure receipt
        # Complements the fail-closed handshake above: when the chain fails,
        # the handshake step is skipped and no receipt exists. This step runs
        # on EVERY failure path — unconditional failure() — and writes a
        # durable, always-emittable failure receipt
        # (tools/production_promotion_failure_receipt.py) that records the
        # refusal explicitly and binds every available proof-leg artifact to
        # the authorized source and deployment commit. It never certifies
        # PROMOTED_AND_PROVEN and never raises on missing inputs: absent gate
        # evidence is recorded as UNKNOWN / NOT_EXECUTED, never invented.
        # It also binds the UPSTREAM gate evidence (standing-policy verdict,
        # promotion denial, required-workflow run conclusions at the source
        # SHA) so the receipt names the gate that stopped the chain instead
        # of leaving the failure unexplained.
        # Rationale for unconditional failure(): the 2026-10-08 finding (run
        # 37813418273 — superseded-tip race failing "Resolve standing
        # authorization mode" BEFORE the policy step ran) proved that gating
        # this step on the policy step's output leaves pre-policy failures
        # silent, with no receipt at all. A failed promotion attempt is a
        # receipted event no matter how early the chain stopped.
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from tools.production_promotion_failure_receipt import (
              build_failure_receipt, SCHEMA, REQUIRED_WORKFLOWS,
              VERDICT_FILE, DENIAL_FILE,
          )
          def load(name):
              try:
                  with open(name, encoding="utf-8") as f:
                      return json.load(f)
              except (OSError, ValueError):
                  return None
          files = {
              "supabase-production-check.json": load("supabase-production-check.json"),
              "producer-run.json": load("producer-run.json"),
              "proof-run.json": load("proof-run.json"),
              "act-proof-run.json": load("act-proof-run.json"),
              "learning-act-proof-run.json": load("learning-act-proof-run.json"),
              "connect-proof-run.json": load("connect-proof-run.json"),
          }
          def observe_required_workflows():
              """Read-only observation of the required workflows' latest runs
              at the source SHA (same selection rule as the enforcement
              step). Any API failure yields UNKNOWN entries, never raises."""
              sha = os.environ["GITHUB_SHA"]
              repo = os.environ["REPO"]
              observed = {}
              for workflow in REQUIRED_WORKFLOWS:
                  try:
                      data = json.loads(subprocess.check_output(
                          ["gh", "api",
                           f"repos/{repo}/actions/workflows/{workflow}/runs?head_sha={sha}&event=push&per_page=100"],
                          text=True, timeout=60,
                      ))
                      matches = [
                          r for r in data.get("workflow_runs", [])
                          if r.get("head_sha") == sha
                          and r.get("head_branch") == "main"
                          and r.get("event") == "push"
                          and str(r.get("path", "")).split("@", 1)[0] == ".github/workflows/" + workflow
                      ]
                      observed[workflow] = (
                          max(matches, key=lambda r: (int(r.get("id", 0)), int(r.get("run_attempt", 0))))
                          if matches else None
                      )
                  except Exception:
                      observed[workflow] = "OBSERVATION_FAILED"
              return observed
          gates = {
              "standing_policy_verdict": load(VERDICT_FILE),
              "promotion_denial": load(DENIAL_FILE),
              "required_workflows": observe_required_workflows(),
          }
          receipt = build_failure_receipt(
              github_sha=os.environ["GITHUB_SHA"],
              production_branch=os.environ["PRODUCTION_BRANCH"],
              promotion_mode=os.environ.get("PROMOTION_MODE", "UNKNOWN"),
              authorized_source_sha=os.environ.get("AUTHORIZED_SOURCE_SHA", os.environ["GITHUB_SHA"]),
              actor=os.environ.get("GITHUB_ACTOR"),
              workflow_run_id=os.environ.get("GITHUB_RUN_ID"),
              env=dict(os.environ),
              files=files,
              gates=gates,
          )
          assert receipt["schema"] == SCHEMA
          assert receipt["status"] != "PROMOTED_AND_PROVEN"
          assert "gates" in receipt
          json.dump(receipt, open("production-promotion-failure-receipt.json", "w"), indent=2)
          PY
          cat production-promotion-failure-receipt.json

      - name: Emit production parity verdict (signal-only)
        # Complements the promotion receipts with durable production parity
        # evidence: binds the promoted source SHA, the production branch tip,
        # and the DEPLOYED_SOURCE_REVISION stamp read from each deployed
        # function source into a machine-verifiable verdict
        # (tools/production_parity_verdict.py). Signal-only: runs on every
        # outcome and never fails the build; it certifies and authorizes
        # nothing. The builder is pure -- this step does the IO (fetch the
        # production branch, read the stamped sources, test ancestry) and
        # passes parsed mappings in.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY' || true
          import json, os, re, subprocess
          from tools.production_parity_verdict import (
              SCHEMA, STAMPED_FUNCTIONS, build_parity_verdict, extract_stamp,
          )

          def sh(*args):
              try:
                  return subprocess.check_output(
                      args, text=True, stderr=subprocess.DEVNULL
                  ).strip()
              except Exception:
                  return ""

          sh("git", "fetch", "origin", "production:refs/remotes/origin/production")
          prod_tip = sh("git", "rev-parse", "refs/remotes/origin/production") or None
          promoted = os.environ.get("AUTHORIZED_SOURCE_SHA") or os.environ.get("GITHUB_SHA")

          functions = {}
          for key, path in STAMPED_FUNCTIONS:
              source = sh("git", "show", "refs/remotes/origin/production:" + path)
              stamp = extract_stamp(source) if source else None
              ancestor = None
              if stamp and stamp != "UNSTAMPED" and promoted:
                  rc = subprocess.run(
                      ["git", "merge-base", "--is-ancestor", stamp, promoted],
                      capture_output=True,
                  ).returncode
                  ancestor = (rc == 0)
              functions[key] = {
                  "stamp": stamp,
                  "source_path": path,
                  "stamp_is_ancestor_of_promoted": ancestor,
              }

          receipt = build_parity_verdict(
              promoted_sha=promoted,
              production_tip_sha=prod_tip,
              functions=functions,
              context={
                  "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
                  "promotion_mode": os.environ.get("PROMOTION_MODE", "UNKNOWN"),
                  "actor": os.environ.get("GITHUB_ACTOR"),
              },
          )
          assert receipt["schema"] == SCHEMA
          json.dump(receipt, open("production-parity-verdict.json", "w"), indent=2)
          PY
          cat production-parity-verdict.json 2>/dev/null || echo "parity verdict not emitted"

      - name: Assemble runtime proof chain (signal-only)
        # The proof-chain machinery (tools/production_proof_chain.py) was
        # built and live-exercised, but no workflow ever assembled a chain:
        # receipts were uploaded individually with nothing binding them into
        # an ordered, tamper-evident bundle. This step closes that hole. It
        # collects every chainable receipt the run produced in canonical
        # order (denial -> promotion receipt (success or failure) -> parity
        # verdict), hash-links them into a NAYAPOWER_PRODUCTION_PROOF_CHAIN_V1
        # bundle, self-verifies the bundle, and writes both artifacts for
        # upload. Signal-only: certifies nothing about promotion and never
        # fails the build; a BROKEN self-verification is printed loudly so
        # the run log names it. A verifier can re-check any uploaded bundle
        # with: python tools/production_proof_chain.py --verify
        # production-proof-chain.json
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY' || true
          import json, os
          from tools.production_proof_chain import assemble_deploy_chain, verify_chain

          def load(name):
              try:
                  with open(name, encoding="utf-8") as f:
                      return json.load(f)
              except (OSError, ValueError):
                  return None

          chain = assemble_deploy_chain(
              {
                  "promotion_denial": load("production-promotion-denial.json"),
                  "promotion_receipt": load("production-promotion-receipt.json"),
                  "failure_receipt": load("production-promotion-failure-receipt.json"),
                  "parity_verdict": load("production-parity-verdict.json"),
              },
              authorized_source_sha=os.environ.get("AUTHORIZED_SOURCE_SHA") or os.environ.get("GITHUB_SHA"),
              chained_by=os.environ.get("GITHUB_ACTOR"),
              chain_purpose="governed-supabase-production-deploy runtime proof bundle",
          )
          verification = verify_chain(chain)
          json.dump(chain, open("production-proof-chain.json", "w"), indent=2)
          json.dump(verification, open("production-proof-chain-verification.json", "w"), indent=2)
          print("CHAIN_ID:", chain["chain_id"], "LINKS:", chain["link_count"],
                "ROLES:", [r["role"] for r in chain["roles_chained"]])
          print("SELF-VERIFICATION:", verification["overall"],
                "INTEGRITY_INTACT:", verification["integrity_intact"])
          if chain.get("roles_skipped"):
              print("SKIPPED_ROLES:", [(r["role"], r["reason"]) for r in chain["roles_skipped"]])
          if chain.get("role_conflicts"):
              print("ROLE_CONFLICTS:", chain["role_conflicts"])
          for link in verification["links"]:
              print("  link", link["seq"], link["schema"], "->", link["verdict"], "-", link["detail"])
          PY
          cat production-proof-chain-verification.json 2>/dev/null || echo "proof chain not assembled"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-promotion-receipt
          path: |
            production-promotion-receipt.json
            production-promotion-failure-receipt.json
            production-parity-verdict.json
            production-proof-chain.json
            production-proof-chain-verification.json
            production-promotion-denial.json
            standing-authorization-verdict.json
            standing-ci-evidence.json
            standing-changed-paths.json
            supabase-production-check.json
            producer-run.json
            proof-run.json
            act-proof-run.json
            learning-act-proof-run.json
            connect-proof-run.json
