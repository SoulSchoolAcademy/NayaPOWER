name: Governed Production Promotion

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to authorize a protected/manual production promotion"
        required: true
        default: "DEPLOY"
        type: string
      source_sha:
        description: "Exact 40-hex main SHA authorized by the Human Director"
        required: true
        type: string

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: governed-production-promotion
  cancel-in-progress: false

env:
  PRODUCTION_BRANCH: production
  PRODUCER_WORKFLOW: live-intelligence-commit-proof.yml
  PROOF_WORKFLOW: live-supabase-runtime-proof.yml
  ACT_PROOF_WORKFLOW: live-verified-ai-action-proof.yml

jobs:
  promote-and-prove:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve standing authorization mode
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "${{ inputs.confirm }}" = "DEPLOY"
            authorized_sha="${{ inputs.source_sha }}"
            if ! printf '%s' "$authorized_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "FAIL CLOSED: source_sha must be exactly 40 lowercase hex characters."
              exit 1
            fi
            if [ "$authorized_sha" != "$GITHUB_SHA" ]; then
              echo "FAIL CLOSED: authorized source_sha $authorized_sha does not equal workflow source $GITHUB_SHA. Re-authorize the exact current main SHA."
              exit 1
            fi
            git fetch origin main
            resolved_main="$(git rev-parse origin/main)"
            if [ "$authorized_sha" != "$resolved_main" ]; then
              echo "FAIL CLOSED: main moved to $resolved_main after authorization of $authorized_sha. Re-authorize the exact current main SHA."
              exit 1
            fi
            echo "AUTHORIZED_SOURCE_SHA=$authorized_sha" >> "$GITHUB_ENV"
            echo "PROMOTION_MODE=EXPLICIT_HUMAN" >> "$GITHUB_ENV"
          else
            echo "PROMOTION_MODE=STANDING_POLICY" >> "$GITHUB_ENV"
          fi

      - name: Enforce ratified standing policy before automatic promotion
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path(".naya/governance/STANDING-PRODUCTION-PROMOTION-V1.json").read_text(encoding="utf-8"))
          assert policy["status"] == "RATIFIED"
          assert policy["policy_id"] == "STANDING-PRODUCTION-PROMOTION-V1"
          assert policy["scope"] == {
              "repository": "SoulSchoolAcademy/NayaPOWER",
              "source_branch": "main",
              "target_branch": "production",
              "source_sha": "RESOLVE_AT_EXECUTION",
              "target_environment": "production",
              "mechanism": "EXISTING_GOVERNED_PRODUCTION_PROMOTION",
          }
          print("standing policy identity and scope: PASS")
          PY

          git fetch origin main
          # Compare the full undeployed delta, not merely the latest push.
          git fetch origin production:refs/remotes/origin/production
          git show origin/production:supabase/functions/nayanet-cold-runtime-proof/index.ts > production-runtime-source.ts
          python - <<'PYCODE'
          import json, os, re, subprocess
          from pathlib import Path
          source=Path("production-runtime-source.ts").read_text()
          matches=re.findall(r'const DEPLOYED_SOURCE_REVISION = "([0-9a-f]{40})";', source)
          if len(matches)!=1:
              raise SystemExit("FAIL CLOSED: production source provenance missing; explicit bootstrap required")
          base=matches[0]
          subprocess.run(["git","merge-base","--is-ancestor",base,os.environ["GITHUB_SHA"]],check=True)
          paths=subprocess.check_output(["git","diff","--name-only",base,os.environ["GITHUB_SHA"]],text=True).splitlines()
          json.dump(paths,open("standing-changed-paths.json","w"))
          PYCODE

          blocker_state="$(gh api "repos/$REPO/issues/978" --jq .state)"
          if [ "$blocker_state" != "closed" ]; then
            echo "FAIL CLOSED: production blocker #978 is $blocker_state."
            exit 1
          fi

          python - <<'PY'
          import json, os, subprocess, time
          required={"kernel-tests.yml","collective-chain-readiness-gate.yml"}
          repo=os.environ["REPO"]
          sha=os.environ["GITHUB_SHA"]
          for attempt in range(90):
              found={}
              for workflow in required:
                  data=json.loads(subprocess.check_output([
                      "gh","api",f"repos/{repo}/actions/workflows/{workflow}/runs?head_sha={sha}&event=push&per_page=100"
                  ],text=True))
                  matches=[r for r in data.get("workflow_runs",[]) if
                      r.get("head_sha")==sha and r.get("head_branch")=="main" and r.get("event")=="push" and
                      str(r.get("path","")).split("@",1)[0]==".github/workflows/"+workflow]
                  if matches:
                      found[workflow]=max(matches,key=lambda r:(int(r.get("id",0)),int(r.get("run_attempt",0))))
              missing=required-set(found)
              failed={name:r.get("conclusion") for name,r in found.items() if r.get("status")=="completed" and r.get("conclusion")!="success"}
              pending={name:r.get("status") for name,r in found.items() if r.get("status")!="completed"}
              if failed:
                  raise SystemExit(f"FAIL CLOSED: required workflow failed: {failed}")
              if not missing and not pending:
                  json.dump(found,open("standing-ci-evidence.json","w"))
                  print("required workflows for exact main: PASS")
                  break
              if attempt == 89:
                  raise SystemExit(f"FAIL CLOSED: required workflows not complete: missing={sorted(missing)} pending={pending}")
              time.sleep(10)
          PY

          cat > standing-policy-context.json <<JSON
          {
            "repository": "$REPO",
            "source_branch": "main",
            "source_sha": "$GITHUB_SHA",
            "resolved_main_sha": "$GITHUB_SHA",
            "target_branch": "production",
            "changed_paths": [],
            "requested_operation": "PROMOTE_PRODUCTION",
            "policy_active": true,
            "policy_not_expired": true,
            "policy_not_revoked": true,
            "required_ci": true,
            "required_tests": true,
            "required_security_checks": true,
            "no_unresolved_production_blocker": true,
            "source_revision_identified": true,
            "deployment_artifact_provenance_bound": true,
            "production_target_exact": true,
            "deployment_mechanism_authorized": true,
            "concurrency_safe": true,
            "deployment_check_required": true,
            "source_runtime_parity_required": true,
            "canonical_runtime_proof_required": true
          }
          JSON
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.standing_production_promotion_policy import evaluate_policy, build_denial_receipt
          policy=json.loads(Path(".naya/governance/STANDING-PRODUCTION-PROMOTION-V1.json").read_text(encoding="utf-8"))
          context=json.loads(Path("standing-policy-context.json").read_text(encoding="utf-8"))
          context["changed_paths"]=json.loads(Path("standing-changed-paths.json").read_text())
          result=evaluate_policy(policy, context)
          json.dump({"policy_id":policy["policy_id"],"policy_version":policy["version"],"context":context,"verdict":result},open("standing-authorization-verdict.json","w"),indent=2)
          print(result)
          if result["decision"] != "ALLOW":
              denial=build_denial_receipt(policy, context, result, {"workflow_run_id":os.environ.get("GITHUB_RUN_ID"),"actor":os.environ.get("GITHUB_ACTOR"),"event":os.environ.get("GITHUB_EVENT_NAME")})
              json.dump(denial,open("production-promotion-denial.json","w"),indent=2)
              print(json.dumps(denial,indent=2))
              raise SystemExit(f"FAIL CLOSED: machine policy evaluator denied the automatic promotion: reason={result.get('reason')}")
          PY

          echo "standing production policy preconditions: PASS"
          echo "automatic production promotion is authorized for this candidate."

      - name: Build provenance-stamped production deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          paths=[
              Path("supabase/functions/nayanet-cold-runtime-proof/index.ts"),
              Path("supabase/functions/nayanet-verified-ai-action/index.ts"),
          ]
          sentinel='const DEPLOYED_SOURCE_REVISION = "UNSTAMPED";'
          replacement=f'const DEPLOYED_SOURCE_REVISION = "{os.environ["GITHUB_SHA"]}";'
          for p in paths:
              source=p.read_text(encoding="utf-8")
              if source.count(sentinel) != 1:
                  raise SystemExit(f"expected exactly one UNSTAMPED revision sentinel in {p}")
              p.write_text(source.replace(sentinel, replacement), encoding="utf-8")
              print("stamped", p, "with source revision", os.environ["GITHUB_SHA"])
          PY

          source_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCTION_BRANCH" > production-ref.json 2>/dev/null; then
            production_parent="$(python -c 'import json; print(json.load(open("production-ref.json"))["object"]["sha"])')"
          else
            production_parent="$GITHUB_SHA"
          fi

          : > deployment-tree-entries.jsonl
          for runtime_path in             supabase/functions/nayanet-cold-runtime-proof/index.ts             supabase/functions/nayanet-verified-ai-action/index.ts
          do
            python - "$runtime_path" <<'PY' > deployment-blob-request.json
          import base64, json, sys
          from pathlib import Path
          payload=Path(sys.argv[1]).read_bytes()
          json.dump({"content":base64.b64encode(payload).decode("ascii"),"encoding":"base64"}, sys.stdout)
          PY
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input deployment-blob-request.json > deployment-blob.json
            blob_sha="$(python -c 'import json; print(json.load(open("deployment-blob.json"))["sha"])')"
            python - "$runtime_path" "$blob_sha" <<'PY' >> deployment-tree-entries.jsonl
          import json,sys
          print(json.dumps({"path":sys.argv[1],"mode":"100644","type":"blob","sha":sys.argv[2]}))
          PY
          done

          python - "$source_tree" <<'PY' > deployment-tree-request.json
          import json,sys
          entries=[json.loads(line) for line in open("deployment-tree-entries.jsonl") if line.strip()]
          json.dump({"base_tree":sys.argv[1],"tree":entries}, sys.stdout)
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input deployment-tree-request.json > deployment-tree.json
          deployment_tree="$(python -c 'import json; print(json.load(open("deployment-tree.json"))["sha"])')"

          python - "$deployment_tree" "$production_parent" <<'PY' > deployment-commit-request.json
          import json, os, sys
          json.dump({
            "message":f"deploy: stamp Naya runtime source {os.environ['GITHUB_SHA']}",
            "tree":sys.argv[1],
            "parents":[sys.argv[2]],
          }, sys.stdout)
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input deployment-commit-request.json > deployment-commit.json
          deployment_sha="$(python -c 'import json; print(json.load(open("deployment-commit.json"))["sha"])')"
          printf '%s\n' "$deployment_sha" > deployment-sha.txt
          {
            echo "DEPLOYMENT_SHA=$deployment_sha"
            echo "SOURCE_TREE_SHA=$source_tree"
            echo "DEPLOYMENT_TREE_SHA=$deployment_tree"
          } >> "$GITHUB_ENV"

          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$deployment_sha/check-runs?per_page=100" > checks-before.json
          python - <<'PY'
          import json
          data=json.load(open("checks-before.json"))
          ids=[]
          for check in data.get("check_runs", []):
              app=check.get("app") or {}
              label=(" ".join([str(app.get("slug") or ""), str(app.get("name") or ""), str(check.get("name") or "")])).lower()
              if "supabase" in label:
                  ids.append(check["id"])
          json.dump(ids, open("supabase-check-ids-before.json","w"))
          print("existing Supabase checks on deployment commit:", ids)
          PY

      - name: Promote provenance-stamped deployment commit to production branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCTION_BRANCH" > production-ref-before.json 2>/dev/null; then
            current="$(python -c 'import json; print(json.load(open("production-ref-before.json"))["object"]["sha"])')"
            parent="$(python -c 'import json; print(json.load(open("deployment-commit.json"))["parents"][0]["sha"])')"
            test "$current" = "$parent"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$PRODUCTION_BRANCH" \
              -f sha="$DEPLOYMENT_SHA" -F force=false > production-ref-after.json
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$PRODUCTION_BRANCH" -f sha="$DEPLOYMENT_SHA" > production-ref-after.json
          fi
          actual="$(python -c 'import json; print(json.load(open("production-ref-after.json"))["object"]["sha"])')"
          test "$actual" = "$DEPLOYMENT_SHA"
          echo "production deployment commit: $DEPLOYMENT_SHA"
          echo "authorized source revision: $GITHUB_SHA"

      - name: Wait for a new Supabase GitHub Integration deployment check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          print("baseline Supabase check ids:", json.load(open("supabase-check-ids-before.json")))
          PY
          for i in $(seq 1 90); do
            gh api -H "Accept: application/vnd.github+json"               "repos/$GITHUB_REPOSITORY/commits/$DEPLOYMENT_SHA/check-runs?per_page=100" > checks-now.json
            status="$(python - <<'PY'
          import json
          before=set(json.load(open("supabase-check-ids-before.json")))
          data=json.load(open("checks-now.json"))
          matches=[]
          for check in data.get("check_runs", []):
              app=check.get("app") or {}
              label=(" ".join([str(app.get("slug") or ""), str(app.get("name") or ""), str(check.get("name") or "")])).lower()
              if "supabase" in label and check.get("id") not in before:
                  matches.append(check)
          if not matches:
              print("WAIT")
          else:
              newest=max(matches,key=lambda c:c["id"])
              json.dump(newest, open("supabase-production-check.json","w"), indent=2)
              if newest.get("status") != "completed":
                  print("WAIT")
              elif newest.get("conclusion") == "success":
                  print("SUCCESS")
              else:
                  print("FAIL")
          PY
            )"
            case "$status" in
              SUCCESS) break ;;
              FAIL)
                cat supabase-production-check.json
                echo "Supabase GitHub Integration reported a failed production deployment check."
                exit 1
                ;;
            esac
            if [ "$i" -eq 90 ]; then
              echo "No successful NEW Supabase GitHub Integration check appeared after production promotion."
              echo "One-time setup required: Project Settings > Integrations > GitHub Integration; connect this repository, working directory '.', production branch '$PRODUCTION_BRANCH', and enable Deploy to production."
              exit 1
            fi
            sleep 10
          done

      - name: Revalidate authorized source and deployment ownership before producer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          production_now="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCTION_BRANCH" --jq .object.sha)"
          test "$production_now" = "$DEPLOYMENT_SHA"

      - name: Dispatch canonical fresh-intelligence producer after deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > producer-dispatch-start.txt
          gh workflow run "$PRODUCER_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          for i in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$PRODUCER_WORKFLOW" --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,event,createdAt,url)"
            python - <<'PY' "$runs"
          import json,sys
          runs=json.loads(sys.argv[1])
          start=open("producer-dispatch-start.txt").read().strip()
          matches=[r for r in runs if r.get("createdAt","")>=start]
          json.dump(max(matches,key=lambda r:r["createdAt"]) if matches else {}, open("producer-run.json","w"), indent=2)
          PY
            run_id="$(python -c 'import json; print(json.load(open("producer-run.json")).get("databaseId",""))')"
            if [ -n "$run_id" ]; then
              producer_head="$(python -c 'import json; print(json.load(open("producer-run.json")).get("headSha",""))')"
              if [ "$producer_head" != "$GITHUB_SHA" ]; then
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                echo "Producer resolved to $producer_head instead of authorized source $GITHUB_SHA."
                exit 1
              fi
              git fetch origin main
              if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                echo "main moved after producer dispatch; refusing to continue."
                exit 1
              fi
              for j in $(seq 1 180); do
                status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
                conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
                state="${status}:${conclusion}"
                case "$state" in
                  completed:success) break ;;
                  completed:*) echo "Producer run failed: $state"; exit 1 ;;
                esac
                if [ "$j" -eq 180 ]; then echo "Timed out waiting for producer run."; exit 1; fi
                sleep 5
              done
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,status,conclusion,event,createdAt,updatedAt,url > producer-run.json
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out locating canonical producer run."
              exit 1
            fi
            sleep 5
          done

      - name: Dispatch canonical end-to-end runtime proof after producer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > proof-dispatch-start.txt
          producer_run_id="$(python -c 'import json; print(json.load(open("producer-run.json"))["databaseId"])')"
          gh workflow run "$PROOF_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main -f source_sha="$GITHUB_SHA" -f producer_run_id="$producer_run_id"
          for i in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$PROOF_WORKFLOW" --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha,status,conclusion,event,createdAt,url)"
            python - <<'PY' "$runs" > proof-run.json
          import json,sys
          runs=json.loads(sys.argv[1])
          start=open("proof-dispatch-start.txt").read().strip()
          matches=[r for r in runs if r.get("createdAt","")>=start]
          json.dump(max(matches,key=lambda r:r["createdAt"]) if matches else {}, open("proof-run.json","w"), indent=2)
          PY
            run_id="$(python -c 'import json; print(json.load(open("proof-run.json")).get("databaseId",""))')"
            if [ -n "$run_id" ]; then
              proof_head="$(python -c 'import json; print(json.load(open("proof-run.json")).get("headSha",""))')"
              if [ "$proof_head" != "$GITHUB_SHA" ]; then
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                echo "Proof resolved to $proof_head instead of authorized source $GITHUB_SHA."
                exit 1
              fi
              git fetch origin main
              if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                echo "main moved after proof dispatch; refusing to continue."
                exit 1
              fi
              for j in $(seq 1 180); do
                status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
                conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
                state="${status}:${conclusion}"
                case "$state" in
                  completed:success) break ;;
                  completed:*) echo "Runtime proof run failed: $state"; exit 1 ;;
                esac
                if [ "$j" -eq 180 ]; then echo "Timed out waiting for runtime proof run."; exit 1; fi
                sleep 5
              done
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,status,conclusion,event,createdAt,updatedAt,url > proof-run.json
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out locating canonical runtime proof run."
              exit 1
            fi
            sleep 5
          done

      - name: Dispatch canonical ACT proof after deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > act-proof-dispatch-start.txt
          gh workflow run "$ACT_PROOF_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          for i in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$ACT_PROOF_WORKFLOW" --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha,status,conclusion,event,createdAt,url)"
            python - <<'PY' "$runs"
          import json,sys
          runs=json.loads(sys.argv[1])
          start=open("act-proof-dispatch-start.txt").read().strip()
          matches=[r for r in runs if r.get("createdAt","")>=start]
          json.dump(max(matches,key=lambda r:r["createdAt"]) if matches else {}, open("act-proof-run.json","w"), indent=2)
          PY
            run_id="$(python -c 'import json; print(json.load(open("act-proof-run.json")).get("databaseId",""))')"
            if [ -n "$run_id" ]; then
              act_head="$(python -c 'import json; print(json.load(open("act-proof-run.json")).get("headSha",""))')"
              if [ "$act_head" != "$GITHUB_SHA" ]; then
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                echo "ACT proof resolved to $act_head instead of authorized source $GITHUB_SHA."
                exit 1
              fi
              git fetch origin main
              if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                echo "main moved after ACT proof dispatch; refusing to continue."
                exit 1
              fi
              for j in $(seq 1 180); do
                status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
                conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
                state="${status}:${conclusion}"
                case "$state" in
                  completed:success) break ;;
                  completed:*) echo "ACT proof run failed: $state"; exit 1 ;;
                esac
                if [ "$j" -eq 180 ]; then echo "Timed out waiting for ACT proof run."; exit 1; fi
                sleep 5
              done
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,status,conclusion,event,createdAt,updatedAt,url > act-proof-run.json
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out locating canonical ACT proof run."
              exit 1
            fi
            sleep 5
          done

      - name: Write durable production promotion receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          supabase_check=json.load(open("supabase-production-check.json"))
          producer=json.load(open("producer-run.json"))
          proof=json.load(open("proof-run.json"))
          act_proof=json.load(open("act-proof-run.json"))
          receipt={
            "schema":"NAYAPOWER_PRODUCTION_PROMOTION_RECEIPT_V1",
            "source_sha":os.environ["GITHUB_SHA"],
            "production_branch":os.environ["PRODUCTION_BRANCH"],
            "human_authorization":{
              "type":("STANDING_POLICY" if os.environ.get("PROMOTION_MODE")=="STANDING_POLICY" else "EXPLICIT_HUMAN"),
              "confirmation":("STANDING-PRODUCTION-PROMOTION-V1" if os.environ.get("PROMOTION_MODE")=="STANDING_POLICY" else "DEPLOY"),
              "authorized_source_sha":(os.environ.get("GITHUB_SHA") if os.environ.get("PROMOTION_MODE")=="STANDING_POLICY" else os.environ.get("AUTHORIZED_SOURCE_SHA")),
              "actor":os.environ.get("GITHUB_ACTOR"),
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
            },
            "machine_deployment":{
              "mechanism":"SUPABASE_NATIVE_GITHUB_INTEGRATION",
              "supabase_check_id":supabase_check.get("id"),
              "supabase_check_name":supabase_check.get("name"),
              "supabase_check_conclusion":supabase_check.get("conclusion"),
              "deployment_commit_sha":os.environ["DEPLOYMENT_SHA"],
              "deployed_source_revision":os.environ["GITHUB_SHA"],
              "source_tree_sha":os.environ["SOURCE_TREE_SHA"],
              "deployment_tree_sha":os.environ["DEPLOYMENT_TREE_SHA"],
              "attested_components":["nayanet-cold-runtime-proof","nayanet-verified-ai-action"],
              "parity_scope":"ATTESTED_COMPONENTS_ONLY",
            },
            "canonical_proof":{
              "producer_run_id":producer.get("databaseId"),
              "producer_conclusion":producer.get("conclusion"),
              "runtime_proof_run_id":proof.get("databaseId"),
              "runtime_proof_conclusion":proof.get("conclusion"),
              "act_proof_run_id":act_proof.get("databaseId"),
              "act_proof_conclusion":act_proof.get("conclusion"),
            },
            "authority_boundary":{
              "human_authorization_is_deployment_decision":True,
              "machine_authentication_is_supabase_github_integration":True,
              "learning_runtime_identity_remains_github_oidc":True,
              "supabase_personal_access_token_in_workflow":False,
            },
          }
          assert receipt["machine_deployment"]["supabase_check_conclusion"]=="success", receipt
          assert receipt["canonical_proof"]["producer_conclusion"]=="success", receipt
          assert receipt["canonical_proof"]["runtime_proof_conclusion"]=="success", receipt
          assert receipt["canonical_proof"]["act_proof_conclusion"]=="success", receipt
          assert producer.get("headSha")==os.environ["GITHUB_SHA"], receipt
          assert proof.get("headSha")==os.environ["GITHUB_SHA"], receipt
          assert act_proof.get("headSha")==os.environ["GITHUB_SHA"], receipt
          json.dump(receipt, open("production-promotion-receipt.json","w"), indent=2)
          PY
          cat production-promotion-receipt.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-promotion-receipt
          path: |
            production-promotion-receipt.json
            production-promotion-denial.json
            standing-authorization-verdict.json
            standing-ci-evidence.json
            standing-changed-paths.json
            supabase-production-check.json
            producer-run.json
            proof-run.json
            act-proof-run.json
