name: 2026-09-08 10:05 — Apply NayaNET Hub Surgical Patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/2026-09-08-10-05-NAYANET-HUB-RIGHT-SIDEBAR-AND-FEED-SURGICAL-PATCH.py'
      - '.github/workflows/2026-09-08-10-05-apply-nayanet-hub-surgical-patch.yml'
      - '.naya/NAYA-MASTER-EXECUTION-CONTRACT.md'
      - '.naya/NAYA-INTELLIGENCE-ORGANIZATION-PROTOCOL.md'
      - '.naya/activity/2026/09/08/2026-09-08-TODAY.md'
  issues:
    types: [opened]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical patch
        run: python scripts/2026-09-08-10-05-NAYANET-HUB-RIGHT-SIDEBAR-AND-FEED-SURGICAL-PATCH.py
      - name: Verify mission markers
        run: |
          test -f '2026 09 08 9:59 NAYANET HUB.html'
          grep -q 'NAYANET-HUB-RIGHT-SIDEBAR-FEED-MIRROR-V1' '2026 09 08 9:59 NAYANET HUB.html'
          grep -q '.activationRail{display:none!important}' '2026 09 08 9:59 NAYANET HUB.html'
          grep -q '.sidebar' '2026 09 08 9:59 NAYANET HUB.html'
          grep -q 'SHARE' '2026 09 08 9:59 NAYANET HUB.html'
          grep -q 'COMMENT' '2026 09 08 9:59 NAYANET HUB.html'
      - name: Commit patched current Hub
        run: |
          if git diff --quiet -- '2026 09 08 9:59 NAYANET HUB.html'; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add -- '2026 09 08 9:59 NAYANET HUB.html'
          git commit -m '2026-09-08 10:20 — Apply right-sidebar removal and unified feed actions'
          git push
