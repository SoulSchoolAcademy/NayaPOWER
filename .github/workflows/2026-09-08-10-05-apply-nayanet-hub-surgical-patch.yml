name: 2026-09-08 10:05 — Apply NayaNET Hub Surgical Patch

# This workflow mutates repository source and pushes a commit. It is therefore
# an explicitly invoked control-plane action, not an automatic push reaction.
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit authorization to mutate and push the Hub patch
        required: true
        type: choice
        options:
          - EXPLICIT_APPROVAL_GRANTED
          - DENY

permissions:
  contents: write

jobs:
  patch:
    if: inputs.approval == 'EXPLICIT_APPROVAL_GRANTED'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical patch
        run: python scripts/2026-09-08-10-05-NAYANET-HUB-RIGHT-SIDEBAR-AND-FEED-SURGICAL-PATCH.py
      - name: Verify mission markers
        run: |
          grep -q 'NAYANET-HUB-RIGHT-SIDEBAR-FEED-MIRROR-V1' '2026 09 08 9:59 NAYANET HUB'
          grep -q '.activationRail{display:none!important}' '2026 09 08 9:59 NAYANET HUB'
          grep -q '.sidebar' '2026 09 08 9:59 NAYANET HUB'
      - name: Commit patched current Hub
        run: |
          if git diff --quiet -- '2026 09 08 9:59 NAYANET HUB'; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add -- '2026 09 08 9:59 NAYANET HUB'
          git commit -m '2026-09-08 10:05 — Correct right sidebar and mirror intelligent feeds'
          git push
