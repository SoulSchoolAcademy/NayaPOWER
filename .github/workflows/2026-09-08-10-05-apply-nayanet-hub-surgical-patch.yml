name: 2026-09-08 10:05 — NayaNET Hub Surgical Patch — Retired

# Historical patch record retained as a non-mutating workflow. The old HTML
# surface is no longer an execution authority. Current Hub source is NAYANET/HUB.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm current Hub authority
        run: |
          set -euo pipefail
          test -d NAYANET/HUB
          test -f .github/workflows/deploy-nayanet-hub-canonical-v2.yml
          echo 'LEGACY_HTML_SURGICAL_PATCH=RETIRED'
          echo 'CURRENT_HUB_SOURCE=NAYANET/HUB'
          echo 'CURRENT_PUBLIC_DEPLOYMENT=.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
          echo 'RULE=NO_HISTORICAL_HTML_MUTATION'
