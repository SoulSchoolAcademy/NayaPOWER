# Unified Activation Gate — CI proof, ROUND 2 (Naya 1's bar).
#
# This workflow IS the proof Naya 1 demanded: a verified run of the actual
# required CI workflow demonstrating the lawful case AND the adversarial
# rejection cases, with exact commit identities, run/job IDs, exit results,
# and inspectable evidence.
#
# Round-2 closures under test (see tools/activation_gate.py):
#   bypass 1 (row 8, gate guarded nothing) .... activation-delivery-gate.yml
#   bypass 2 (PR-editable trust root) ......... event-payload repo identity
#       + env cross-check; pull_request_target delivery workflow runs BASE code
#   bypass 3 (row 7, freestyle component) ..... interim manifest closed-world
#       (design_gate.py, PR #1996, owns it at merge)
#   bypass 4 (receipt transplant) ............. deliverables[] sha256 binding
#   bypass 5 (local "PASS" substring, exit 0) .. LOCAL-REHEARSAL-*, exit 3
#
# The protected runner resolves truth ITSELF (runner-written event payload +
# GITHUB_TOKEN from the runner context, live GitHub API). No step supplies
# truth via flags. A builder cannot establish authenticity by writing a
# plausible JSON file.
name: Unified Activation Gate

on:
  push:
    branches: [naya5/unified-activation-gate-r2]
  pull_request:
    branches: [main]
    paths:
      - "tools/activation_gate.py"
      - "tools/activation_gate_ci_proof.py"
      - "tools/issuance_perm_proof.py"
      - "tools/test_activation_gate.py"
      - ".github/workflows/unified-activation-gate.yml"
      - ".github/workflows/activation-delivery-gate.yml"

permissions:
  contents: read
  actions: write # the proof dispatches the real mint workflow (issuance e2e)

jobs:
  gate-proof:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned SHA)
        with:
          python-version: "3.12"
      - name: Rehearsal — unit tests (local predicate logic)
        run: python3 tools/test_activation_gate.py
      - name: Proof — lawful PASS + adversarial REJECTs in protected mode
        run: python3 tools/activation_gate_ci_proof.py

  issuance-permissions-proof:
    # A4 (round-4): the permission set is part of the system under test.
    # Round-3's proof ran under this workflow's `actions: write` token while
    # the delivery workflow ships with no Actions permission at all — every
    # lawful delivery 403'd into ISSUANCE_UNVERIFIABLE. This job's token
    # carries EXACTLY the delivery workflow's production permission set, and
    # re-proves the issuance e2e (genuine accepted, forgery caught, no 403)
    # under it. If this job goes red, the door is bricked again.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned SHA)
        with:
          python-version: "3.12"
      - name: Issuance e2e under the production permission set
        run: python3 tools/issuance_perm_proof.py
