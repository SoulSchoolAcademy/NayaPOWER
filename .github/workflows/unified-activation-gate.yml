# Unified Activation Gate — CI proof (Naya 1's bar), ROUND 2.
#
# This workflow IS the proof Naya 1 demanded: a verified run of the actual
# required CI workflow demonstrating the lawful case AND the adversarial
# rejection cases, with exact commit identities, run/job IDs, exit results,
# and inspectable evidence.
#
# ROUND-2 TRUST MODEL (the independent attacker's four bypasses, closed):
#
#  1. UNAVOIDABLE TRIGGER. `pull_request_target` with NO paths filter fires
#     on EVERY PR to main; `push` fires on every push to main. A deliverable
#     PR cannot avoid the gate by touching only "safe" paths.
#  2. BASE-PINNED GATE CODE. pull_request_target executes THIS workflow file
#     from the BASE ref — a PR cannot edit the workflow, the gate, or the
#     triggers. The PR's code is checked out separately (./pr) and is only
#     ever READ as text, never executed. The pin-check job additionally
#     asserts the executed gate is byte-identical to the base ref.
#  3. RUNNER-ANCHORED TRUTH. tools/activation_gate.py::resolve_truth()
#     reads the repository identity from the runner-written event payload
#     (GITHUB_EVENT_PATH) and cross-checks GITHUB_REPOSITORY; any override
#     or disagreement is REFUSED. The trust-root-attack job proves a forged
#     GITHUB_REPOSITORY cannot establish trust.
#  4. DESIGN-GATE DELEGATION. The gate runs tools/design_gate.py resolved
#     from the PROTECTED base ref (never the PR's) and folds its verdict in.
#     Absent design gate => BLOCKED-DESIGN-GATE-ABSENT, never a silent PASS.
#
# REQUIRED STATUS CHECK (authority step — needs Shawn's word): setting
# "Unified Activation Gate / gate-proof" as a required check on main's
# branch protection is a governance/authority change. Until it is set, this
# workflow RUNS on every PR but cannot BLOCK merges — stated honestly here
# so nobody mistakes a green run for enforcement at the merge boundary.
name: Unified Activation Gate

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pin-check:
    # The gate that runs must be the BASE ref's gate, not the PR's.
    # pull_request_target already guarantees this (workflow + checkout are
    # base-pinned); this job asserts it byte-for-byte so a future trigger
    # change cannot silently reintroduce PR-editable gate code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Assert gate code is byte-identical to the base ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.sha }}"
          fi
          git fetch -q origin "$BASE_SHA"
          for f in tools/activation_gate.py tools/activation_gate_ci_proof.py tools/test_activation_gate.py; do
            if ! diff -q <(git show "$BASE_SHA:$f") "$f" >/dev/null 2>&1; then
              echo "PIN-CHECK FAIL: $f differs from base ref $BASE_SHA — the PR may be editing the gate"
              exit 1
            fi
          done
          echo "PIN-CHECK: gate code is base-pinned (ref $BASE_SHA)"

  trust-root-attack:
    # The attacker's A3: a step-level GITHUB_REPOSITORY override must NOT
    # establish trust. resolve_truth() reads the runner-written event
    # payload and refuses on any conflict — or when no payload exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Forged GITHUB_REPOSITORY must be refused
        env:
          GITHUB_REPOSITORY: evil-corp/stolen-repo
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, "tools")
          from activation_gate import resolve_truth
          try:
              resolve_truth()
          except RuntimeError as e:
              print("HOLD: forged repository identity refused:", e)
              sys.exit(0)
          print("BREACH: forged GITHUB_REPOSITORY established trust")
          sys.exit(1)
          EOF

  gate-proof:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # pull_request_target: this checkout is the BASE ref (gate code).
      - name: Check out the PR head (read-only, never executed)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Rehearsal — unit tests (local predicate logic)
        run: python3 tools/test_activation_gate.py
      - name: Proof — lawful PASS + adversarial REJECTs in protected mode
        run: python3 tools/activation_gate_ci_proof.py
      - name: Claim scan — self-test (marker→receipt matching logic)
        run: python3 tools/activation_gate_pr_scan.py --self-test
      # Pinned design gate for the claim scan (hole 3): the reviewed commit,
      # never the PR's. If the fetch fails the scan still runs — any claim
      # then verdicts BLOCKED-DESIGN-GATE-ABSENT (fail closed, never silent).
      - name: Fetch pinned design gate (reviewed commit 3bfa8f64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/design-gate-pin
          for f in tools/design_gate.py smart-blocks/manifest.json; do
            out="/tmp/design-gate-pin/$(basename $f)"
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/SoulSchoolAcademy/NayaPOWER/contents/$f?ref=3bfa8f64cafa482a17ed89790f7be02c2e320628" \
              -o "$out" || true
          done
          ls -la /tmp/design-gate-pin/
      # Delivery-boundary teeth (hole 1): every activation CLAIM in the
      # deliverable set is verified by base-pinned code. On PRs this scans
      # the PR head (read-only); on push it self-scans the base checkout.
      # A marker with no matching receipt, or a claim that fails the full
      # gate (authenticity + binding + structural delegation), fails the job.
      - name: Claim scan — verify activation claims in the deliverable set
        env:
          SCAN_DIR: ${{ github.event_name == 'pull_request_target' && 'pr' || '.' }}
        run: |
          DG_ARGS=""
          if [ -f /tmp/design-gate-pin/design_gate.py ] && [ -f /tmp/design-gate-pin/manifest.json ]; then
            DG_ARGS="--design-gate /tmp/design-gate-pin/design_gate.py --design-manifest /tmp/design-gate-pin/manifest.json"
            echo "claim scan: design-gate delegation from pinned commit"
          else
            echo "claim scan: design-gate pin unavailable — claims will BLOCK (fail closed)"
          fi
          python3 tools/activation_gate_pr_scan.py \
            --repo-dir "$SCAN_DIR" \
            --gate tools/activation_gate.py \
            $DG_ARGS
