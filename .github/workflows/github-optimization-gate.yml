name: GitHub Optimization Gate

on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/**'
      - 'scripts/validate_github_optimization_gate.py'
      - '.github/workflows/github-optimization-gate.yml'
  pull_request:
    paths:
      - '.naya/control-plane/**'
      - 'scripts/validate_github_optimization_gate.py'
      - '.github/workflows/github-optimization-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-optimization-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimization-gate:
    name: Validate GitHub operating environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run fail-closed optimization gate
        run: python scripts/validate_github_optimization_gate.py
