name: NayaNET Hub Quality Gate

on:
  pull_request:
    paths:
      - 'NAYANET/HUB/**'
      - '.github/workflows/hub-quality.yml'
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - '.github/workflows/hub-quality.yml'

jobs:
  hub-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NAYANET/HUB
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NAYANET/HUB/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
