name: Verify Stream B canonical intelligence commit bridge

on:
  push:
    paths:
      - "supabase/migrations/20260924130000_canonical_intelligence_commit_bridge_v1.sql"
      - "tests/test_stream_b_canonical_intelligence_commit_bridge.py"
      - "supabase/migrations/20260924150000_verified_learning_collective_wisdom_projection_v1.sql"
      - "tests/test_stream_b_collective_wisdom_projection.py"
      - "tests/test_stream_b_collective_wisdom_feed.py"
      - ".naya/runtime/production_authority_adapter.py"
      - "tests/test_production_authority_adapter.py"
      - "supabase/migrations/20260924150000_verified_learning_collective_wisdom_projection_v1.sql"
      - "tests/test_stream_b_collective_wisdom_projection.py"
      - "tests/test_stream_b_collective_wisdom_feed.py"
  pull_request:
    paths:
      - "supabase/migrations/20260924130000_canonical_intelligence_commit_bridge_v1.sql"
      - "tests/test_stream_b_canonical_intelligence_commit_bridge.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/test_stream_b_canonical_intelligence_commit_bridge.py
      - run: python tests/test_production_authority_adapter.py
      - run: python -m pytest -q tests/test_stream_b_collective_wisdom_projection.py tests/test_stream_b_collective_wisdom_feed.py
