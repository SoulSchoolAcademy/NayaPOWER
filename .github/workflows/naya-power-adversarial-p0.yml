name: Naya Power — P0 Adversarial Tests

on:
  push:
    paths:
      - 'tests/adversarial/**'
      - 'NAYA-POWER-ADVERSARIAL-TEST-SUITE-V1.0.md'
      - '.naya/governance/**'
      - '.naya/control-plane/**'
      - '.naya/runtime/**'
      - '.github/workflows/**'
      - '.github/workflows/naya-power-adversarial-p0.yml'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: read

jobs:
  offline-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assert exact workflow checkout SHA
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run canonical cold-start continuity acceptance
        run: python3 .naya/runtime/cold_start_activation.py
      - name: Run canonical control-plane validator
        run: python3 .naya/control-plane/validate_control_plane.py
      - name: Run canonical governance kernel adversarial tests
        run: python3 .naya/governance/test_governance_kernel.py
      - name: Run canonical execution-boundary adversarial tests
        run: python3 .naya/governance/test_naya_execution_boundaries.py
      - name: Run behavioral bypass adversarial tests
        run: python3 .naya/governance/test_behavioral_bypasses.py
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naya-power-p0-offline-evidence
          path: tests/adversarial/evidence/
          if-no-files-found: warn

  live-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assert exact workflow checkout SHA
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run live P0 harness (fail closed when target is absent)
        env:
          NAYA_POWER_TARGET_URL: ${{ vars.NAYA_POWER_TARGET_URL }}
        run: python3 tests/adversarial/run_p0.py
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naya-power-p0-live-evidence
          path: tests/adversarial/evidence/
          if-no-files-found: warn
