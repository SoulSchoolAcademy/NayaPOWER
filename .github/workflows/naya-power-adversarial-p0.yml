name: Naya Power — P0 Adversarial Tests

on:
  push:
    branches: [main]
    paths:
      - '.naya/control-plane/**'
      - '.naya/governance/**'
      - '.naya/runtime/**'
      - 'SUPERBRAIN/NAYA-ACTIVITY/**'
      - 'tests/adversarial/**'
      - 'NAYA-POWER-ADVERSARIAL-TEST-SUITE-V1.0.md'
      - '.github/workflows/naya-power-adversarial-p0.yml'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: read

jobs:
  offline-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow execution identity
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
      - name: Assert exact workflow checkout SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate canonical control plane
        run: python3 .naya/control-plane/validate_control_plane.py
      - name: Validate canonical Activity Feed
        run: python3 SUPERBRAIN/NAYA-ACTIVITY/validate_activity_feed.py
      - name: Validate P0 workflow contract
        run: python3 .naya/control-plane/test_p0_workflow_contract.py
      - name: Run behavioral bypass adversarial tests
        run: python3 .naya/governance/test_behavioral_bypasses.py

  live-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow execution identity
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
      - name: Assert exact workflow checkout SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run live P0 harness when explicitly requested
        env:
          NAYA_POWER_TARGET_URL: ${{ vars.NAYA_POWER_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${NAYA_POWER_TARGET_URL:-}" ]; then
            echo 'LIVE_RUNTIME=BLOCKED_EXTERNAL_TARGET — NAYA_POWER_TARGET_URL is not configured.'
            echo 'BLOCKED_COUNT=0'
            echo 'PASS_COUNT=0'
            echo 'FAIL_COUNT=0'
            echo 'REVIEW_COUNT=0'
            echo 'EXIT_CODE=3'
            exit 3
          fi
          python3 tests/adversarial/run_p0.py
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naya-power-p0-live-evidence
          path: tests/adversarial/evidence/
          if-no-files-found: warn
