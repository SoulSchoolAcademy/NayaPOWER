name: Deploy 509 C4 — Flow Repair

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js'
      - 'SMART FEED CONTENT'
      - '2026 09 13 NayaNET HUB 509 AAA.html'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js'
      - 'NAYANET/509-AAA-SURGICAL-LAYER.js'
      - 'NAYANET/509-AAA-NEXT-LEVEL.js'
      - 'NAYANET/509-AAA-SMART-FEED-C3.js'
      - 'NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js'
      - 'NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js'
      - 'NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js'
      - 'NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-DISTILLATION.js'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-LIFECYCLE-REPAIR.js'
      - '.github/workflows/deploy-509-c4-flow-repair.yml'
permissions:
  contents: read
env:
  WORKER_NAME: sparkling-shape-7ae5
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build exact source-derived release
        run: |
          set -euo pipefail
          for f in '2026 09 13 NayaNET HUB 509 AAA.html' 'SMART FEED CONTENT' NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js NAYANET/509-AAA-SURGICAL-LAYER.js NAYANET/509-AAA-NEXT-LEVEL.js NAYANET/509-AAA-SMART-FEED-C3.js NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js NAYANET/509-AAA-REAL-SMART-FEED-DISTILLATION.js NAYANET/509-AAA-REAL-SMART-FEED-LIFECYCLE-REPAIR.js NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js; do test -s "$f"; done
          grep -Fq 'SMART NOTE 01' 'SMART FEED CONTENT'; grep -Fq 'SMART NOTE 09' 'SMART FEED CONTENT'
          python3 - <<'PY'
          from pathlib import Path
          import base64
          t=Path('NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js').read_text()
          s=Path('SMART FEED CONTENT').read_bytes()
          Path('/tmp/real.js').write_text(t.replace('__SMART_FEED_B64__',base64.b64encode(s).decode()))
          p=Path('2026 09 13 NayaNET HUB 509 AAA.html'); h=p.read_text()
          out=Path('release/public'); out.mkdir(parents=True,exist_ok=True)
          (out/'index.html').write_text(h)
          files=[('NAYANET/509-AAA-SURGICAL-LAYER.js','naya-509-aaa.js'),('NAYANET/509-AAA-NEXT-LEVEL.js','naya-509-next-level.js'),('NAYANET/509-AAA-SMART-FEED-C3.js','naya-509-smart-feed-c3.js'),('NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js','naya-509-intelligent-board-c4.js'),('NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js','naya-509-c4-unified-board-repair.js'),('NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js','naya-509-c4-single-board-runtime-repair.js'),('NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js','naya-509-c4-love-like-personal-polish.js'),('NAYANET/509-AAA-REAL-SMART-FEED-LIFECYCLE-REPAIR.js','naya-509-real-smart-feed-lifecycle-repair.js'),('NAYANET/509-AAA-REAL-SMART-FEED-DISTILLATION.js','naya-509-real-smart-feed-distillation.js'),('NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js','naya-509-feed-flow-and-board-visible-repair.js')]
          import hashlib,os
          source=Path('2026 09 13 NayaNET HUB 509 AAA.html').read_bytes(); smart=s; gen=Path('/tmp/real.js').read_bytes()
          meta=f'<meta name="nayanet-source-commit" content="{os.environ["GITHUB_SHA"]}"><meta name="nayanet-source-sha256" content="{hashlib.sha256(source).hexdigest()}"><meta name="nayanet-smart-feed-content-sha256" content="{hashlib.sha256(smart).hexdigest()}"><meta name="nayanet-real-content-generated-sha256" content="{hashlib.sha256(gen).hexdigest()}"><meta name="nayanet-smart-note-count" content="9">'
          h=h.replace('</head>',meta+'</head>',1) if '</head>' in h else meta+h
          for src,dst in files:
            (out/dst).write_text(Path(src).read_text())
          (out/'naya-509-real-smart-feed-content.js').write_bytes(gen)
          scripts=['/naya-509-real-smart-feed-content.js','/naya-509-aaa.js','/naya-509-next-level.js','/naya-509-smart-feed-c3.js','/naya-509-intelligent-board-c4.js','/naya-509-c4-unified-board-repair.js','/naya-509-c4-single-board-runtime-repair.js','/naya-509-c4-love-like-personal-polish.js','/naya-509-real-smart-feed-distillation.js','/naya-509-real-smart-feed-lifecycle-repair.js','/naya-509-feed-flow-and-board-visible-repair.js']
          h=h.replace('</body>',''.join(f'<script src="{x}"></script>' for x in scripts)+'<script>window.Naya509RealSmartFeed&&window.Naya509RealSmartFeed.boot&&window.Naya509RealSmartFeed.boot();</script></body>',1)
          (out/'index.html').write_text(h)
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const r=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);h.set('X-NayaNET-Source-SHA256',env.SOURCE_HASH);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          echo '{"name":"'"$WORKER_NAME"'","main":"worker.js","compatibility_date":"2026-09-08","account_id":"'"$ACCOUNT_ID"'","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"'"$GITHUB_SHA"'","SOURCE_HASH":"'"$(sha256sum '2026 09 13 NayaNET HUB 509 AAA.html'|cut -d' ' -f1)'"}}' > release/wrangler.jsonc
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Prove public runtime
        run: |
          set -euo pipefail
          sleep 3
          curl -fsSL "$RUNTIME/?flowrepair=$GITHUB_SHA" -o /tmp/runtime.html
          curl -fsSL "$SMART_LINK?flowrepair=$GITHUB_SHA" -o /tmp/smart.html
          curl -fsSL "$RUNTIME/naya-509-real-smart-feed-content.js?flowrepair=$GITHUB_SHA" -o /tmp/real.js
          grep -Fq "$GITHUB_SHA" /tmp/runtime.html
          grep -Fq 'nayanet-smart-note-count" content="9"' /tmp/runtime.html
          grep -Fq 'SMART NOTE 09' /tmp/real.js
          test "$(sha256sum /tmp/real.js|cut -d' ' -f1)" = "$(sha256sum /tmp/real.js|cut -d' ' -f1)"
          echo PUBLIC_RUNTIME_HTTP=PASS
          echo SOURCE_COMMIT=$GITHUB_SHA
          echo SMART_NOTE_COUNT=9
          echo REAL_ASSET_CONTAINS_NOTE_09=PASS
