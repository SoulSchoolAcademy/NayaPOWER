name: Verify Intelligent Block Lifecycle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-intelligent-block-lifecycle.yml'
      - 'supabase/migrations/20260923000000_intelligent_block_supersession_lifecycle_v1.sql'
      - 'supabase/functions/nayanet-compound-intelligence/**'
      - 'assistant-runtime.js'
      - 'NAYANET/HUB/index.html'
      - 'smart-feed.js'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Execute lifecycle proof
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cat > intelligent-block-lifecycle-proof.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const HUB='https://sparkling-shape-7ae5.smartnetpodcast.workers.dev';
          const SUPA='https://dahisasgpfvziswqvmvm.supabase.co';
          const KEY='sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue';
          const token='ibl'+Date.now().toString(36);
          const title='Intelligent Block Lifecycle Proof '+token;
          const content='A verified lifecycle proof records idempotent replay, explicit supersession, durable lineage, and preserved authority.';
          const idem='ib-lifecycle-'+token;
          const newBlockId=crypto.randomUUID();
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const trace=[];
          const sourceHead=process.env.GITHUB_SHA;
          const mark=(step,status,extra={})=>{const x={step,status,at:new Date().toISOString(),...extra};trace.push(x);console.log('PI_BLOCK_LIFECYCLE',JSON.stringify(x));};
          try{
            await page.goto(HUB+'/?ibl=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.NayaNETNameFirstAuth?.establish,{timeout:30000});
            const session=await page.evaluate(async({token})=>await window.NayaNETNameFirstAuth.establish({name:'Intelligent Block Lifecycle Proof '+token,alias:token}),{token});
            if(!session?.authenticated||!session?.userId)throw new Error('OWNER_SESSION_NOT_ESTABLISHED');
            mark('IDENTITY','PASS',{owner_id:session.userId});

            const capture=await page.evaluate(async({title,content,idem})=>{
              const r=window.NayaAssistantRuntime;
              if(!r)throw new Error('ASSISTANT_RUNTIME_UNAVAILABLE');
              return await r.captureSmartNote({title,content,source:'intelligent-block-lifecycle-proof',idempotency_key:idem});
            },{title,content,idem});
            const eventId=String(capture?.event?.event_id||capture?.transaction?.evidence?.event_id||'');
            if(!eventId)throw new Error('SMART_NOTE_EVENT_ID_MISSING');
            mark('SMART_NOTE','PASS',{event_id:eventId,receipt_id:capture?.receipt?.id||null});

            const blockId=eventId;
            const row=await page.evaluate(async({blockId})=>{
              const c=window.__NayaNETSupabaseClient;
              if(!c)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');
              const q=await c.from('nayanet_intelligent_blocks').select('*').eq('block_id',blockId).maybeSingle();
              if(q.error)throw new Error('BLOCK_QUERY_FAILED:'+JSON.stringify(q.error));
              return q.data;
            },{blockId});
            if(!row)throw new Error('INTELLIGENT_BLOCK_NOT_CREATED');
            mark('BLOCK_CREATE','PASS',{block_id:row.block_id,version:row.version,block_status:row.status,understanding_state:row.understanding_state});
            const sourceEvent=await page.evaluate(async({eventId})=>{const c=window.__NayaNETSupabaseClient;if(!c)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');const q=await c.from('nayanet_cognition_events').select('id,event_id').eq('event_id',eventId).single();if(q.error)throw new Error('SOURCE_EVENT_QUERY_FAILED:'+JSON.stringify(q.error));return q.data;},{eventId});
            if(!sourceEvent?.id)throw new Error('SOURCE_EVENT_DB_ID_MISSING');

            const callSupersede=async()=>{
              const token=await page.evaluate(async()=>{const c=window.__NayaNETSupabaseClient;if(!c)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');const r=await c.auth.getSession();return r.data?.session?.access_token||null;});
              if(!token)throw new Error('OWNER_ACCESS_TOKEN_NOT_ESTABLISHED');
              const response=await page.evaluate(async({token,body})=>await fetch('https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-compound-intelligence',{method:'POST',headers:{Authorization:'Bearer '+token,apikey:'sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue','Content-Type':'application/json','x-idempotency-key':body.idempotency_key},body:JSON.stringify(body)}).then(async r=>({status:r.status,body:await r.json()})),{token,body:{
                action:'supersede',superseded_event_id:sourceEvent.id,superseded_block_id:blockId,new_block_id:newBlockId,idempotency_key:idem,
                title:'Intelligent Block Lifecycle Proof — superseding revision',content:'The later verified revision supersedes the original block without changing ownership or authority.',
                verified:true,evidence_refs:[{type:'runtime-proof',source_commit:process.env.GITHUB_SHA}],
                reason:'Verified lifecycle proof of explicit supersession'
              }});
              return response;
            };

            const first=await callSupersede();
            if(first.status!==200||first.body?.ok!==true)throw new Error('SUPERSESSION_FAILED:'+JSON.stringify(first));
            const newId=first.body.result?.intelligent_block?.block_id||first.body.result?.lineage?.new_block_id;
            if(newId!==newBlockId)throw new Error('SUCCESSOR_BLOCK_ID_MISMATCH');
            mark('SUPERSEDE','PASS',{old_block_id:blockId,new_block_id:newId,replayed:false});

            const replay=await callSupersede();
            if(replay.status!==200||replay.body?.ok!==true||replay.body?.result?.replayed!==true)throw new Error('SUPERSESSION_REPLAY_NOT_IDEMPOTENT:'+JSON.stringify(replay));
            mark('REPLAY','PASS',{new_block_id:newId,replayed:true});

            const final=await page.evaluate(async({blockId,newId})=>{
              const c=window.__NayaNETSupabaseClient;
              if(!c)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');
              const a=await c.from('nayanet_intelligent_blocks').select('*').eq('block_id',blockId).single();
              const b=await c.from('nayanet_intelligent_blocks').select('*').eq('block_id',newId).single();
              if(a.error)throw a.error;if(b.error)throw b.error;return {old:a.data,new:b.data};
            },{blockId,newId});
            if(final.old.status!=='SUPERSEDED'||final.old.superseded_by_block_id!==newId)throw new Error('OLD_BLOCK_SUPERSESSION_LINEAGE_INVALID');
            if(final.new.status!=='ACTIVE'||final.new.supersedes_block_id!==blockId||Number(final.new.version)!==Number(final.old.version)+1)throw new Error('NEW_BLOCK_LINEAGE_INVALID');
            mark('VERIFY','PASS',{old_status:final.old.status,new_status:final.new.status,old_superseded_by:final.old.superseded_by_block_id,new_supersedes:final.new.supersedes_block_id,new_version:final.new.version});

            const successorEventId=first.body.result?.event?.event_id;
            if(!successorEventId)throw new Error('SUPERSESSION_EVENT_ID_MISSING');

            const retrieved=await page.evaluate(async({blockId,newId,successorEventId,ownerId,expectedVersion})=>{
              const c=window.__NayaNETSupabaseClient;
              if(!c)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');
              const block=await c.from('nayanet_intelligent_blocks').select('*').eq('block_id',newId).eq('owner_id',ownerId).single();
              const event=await c.from('nayanet_cognition_events').select('id,event_id,parent_event_id,title,status,metadata').eq('event_id',successorEventId).eq('user_id',ownerId).single();
              if(block.error)throw new Error('SUCCESSOR_BLOCK_RETRIEVE_FAILED:'+JSON.stringify(block.error));
              if(event.error)throw new Error('SUCCESSOR_EVENT_RETRIEVE_FAILED:'+JSON.stringify(event.error));
              if(block.data?.block_id!==newId||block.data?.supersedes_block_id!==blockId||Number(block.data?.version)!==expectedVersion)throw new Error('SUCCESSOR_BLOCK_IDENTITY_INVALID');
              return {block:block.data,event:event.data};
            },{blockId,newId,successorEventId,ownerId:session.userId,expectedVersion:Number(final.old.version)+1});
            if(retrieved.block.status!=='ACTIVE'||retrieved.block.supersedes_block_id!==blockId||!Array.isArray(retrieved.block.source_event_ids)||!retrieved.block.source_event_ids.includes(retrieved.event.id))throw new Error('SUCCESSOR_BLOCK_RETRIEVAL_LINEAGE_INVALID:'+JSON.stringify(retrieved));
            mark('RETRIEVE','PASS',{block_id:retrieved.block.block_id,event_id:retrieved.event.event_id,source_event_id:retrieved.event.id});

            await page.goto(HUB+'/?ibl=1',{waitUntil:'domcontentloaded',timeout:60000});
            const feedProbe=await page.evaluate(async({successorEventId})=>{
              const rt=window.NayaAssistantRuntime;
              if(!rt?.smartFeed)throw new Error('SMART_FEED_RUNTIME_UNAVAILABLE');
              const data=await rt.smartFeed({stream:'personal',limit:50,before:null});
              const item=(data?.items||[]).find(x=>String(x?.event_id||'')===String(successorEventId));
              return {found:!!item,event_id:item?.event_id||null,has_intelligent_block:!!item?.intelligent_block,has_metadata_intelligent_block:!!item?.metadata?.intelligent_block_v1,intelligent_block:item?.intelligent_block||null};
            },{successorEventId});
            console.log('SMART_FEED_PAYLOAD_PROBE',JSON.stringify(feedProbe));
            if(!feedProbe.found)throw new Error('SMART_FEED_SUCCESSOR_EVENT_NOT_FOUND:'+JSON.stringify(feedProbe));
            if(!feedProbe.has_intelligent_block)throw new Error('SMART_FEED_INTELLIGENT_BLOCK_MISSING:'+JSON.stringify(feedProbe));
            await page.waitForSelector('[data-event-id="'+successorEventId+'"]',{timeout:30000});
            const rendered=await page.locator('[data-event-id="'+successorEventId+'"]').evaluate(node=>({
              eventId:node.getAttribute('data-event-id'),
              title:node.querySelector('h2')?.textContent||'',
              schema:node.getAttribute('data-intelligent-block-schema'),
              blockEventId:node.getAttribute('data-intelligent-block-event-id'),
              truth:node.getAttribute('data-intelligent-block-truth'),
              authority:node.getAttribute('data-intelligent-block-authority'),
              value:node.getAttribute('data-intelligent-block-value'),
              privacy:node.getAttribute('data-intelligent-block-privacy'),
              lifecycle:node.getAttribute('data-intelligent-block-lifecycle'),
              hash:node.getAttribute('data-intelligent-block-hash')
            }));
            if(rendered.eventId!==successorEventId||rendered.schema!=='INTELLIGENT_BLOCK_V1'||rendered.blockEventId!==successorEventId)throw new Error('HUB_SUPERSEDED_BLOCK_RENDER_MISMATCH:'+JSON.stringify(rendered));
            mark('RENDER','PASS',{event_id:rendered.eventId,schema:rendered.schema,block_event_id:rendered.blockEventId,lifecycle:rendered.lifecycle});

            const authority=await page.evaluate(async({sourceEventId,target})=>{
              const token=(await window.__NayaNETSupabaseClient.auth.getSession()).data?.session?.access_token;
              if(!token)throw new Error('OWNER_ACCESS_TOKEN_NOT_ESTABLISHED');
              const body={action:'issue_pi_authority',source_event_id:sourceEventId,target};
              const r=await fetch('https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-compound-intelligence',{method:'POST',headers:{Authorization:'Bearer '+token,apikey:'sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue','Content-Type':'application/json'},body:JSON.stringify(body)});
              return {status:r.status,body:await r.json()};
            },{sourceEventId:successorEventId,target:successorEventId});
            if(authority.status!==200||authority.body?.ok!==true||authority.body?.result?.status!=='AUTHORIZED')throw new Error('CONTINUATION_AUTHORITY_FAILED:'+JSON.stringify(authority));
            const grantId=authority.body.result.grant?.grant_id;
            if(!grantId)throw new Error('CONTINUATION_GRANT_ID_MISSING');
            const continuation=await page.evaluate(async({grantId,parentEventId,sourceHead})=>{
              const token=(await window.__NayaNETSupabaseClient.auth.getSession()).data?.session?.access_token;
              const r=await fetch('https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-compound-intelligence',{method:'POST',headers:{Authorization:'Bearer '+token,apikey:'sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue','Content-Type':'application/json'},body:JSON.stringify({action:'continue_authorized',authority_grant_id:grantId,parent_event_id:parentEventId,outcome:'Cold successor continued from the verified superseding Intelligent Block.',source_head:sourceHead})});
              return {status:r.status,body:await r.json()};
            },{grantId,parentEventId:successorEventId});
            if(continuation.status!==200||continuation.body?.ok!==true||continuation.body?.result?.status!=='CONTINUATION_VERIFIED')throw new Error('CONTINUATION_FAILED:'+JSON.stringify(continuation));
            const continuationEventId=continuation.body.result?.continuation_event?.event_id;
            if(!continuationEventId)throw new Error('CONTINUATION_EVENT_ID_MISSING');
            mark('CONTINUE','PASS',{parent_event_id:successorEventId,continuation_event_id:continuationEventId,grant_id:grantId});

            const handoff=await page.evaluate(async({parentEventId,continuationEventId,sourceHead})=>{
              const token=(await window.__NayaNETSupabaseClient.auth.getSession()).data?.session?.access_token;
              const r=await fetch('https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-compound-intelligence',{method:'POST',headers:{Authorization:'Bearer '+token,apikey:'sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue','Content-Type':'application/json'},body:JSON.stringify({action:'successor_handoff',parent_event_id:parentEventId,what_happened:'Verified Intelligent Block supersession lifecycle completed.',what_changed:'A successor block superseded the predecessor with preserved lineage.',learned:'Idempotent supersession preserves canonical identity and evidence lineage.',next_action:'Cold Naya retrieves the successor Block and continues from its verified state.',evidence_required:'Verify successor retrieval/render/continuation lineage.',source_head:sourceHead,continuation_event_id:continuationEventId})});
              return {status:r.status,body:await r.json()};
            },{parentEventId:successorEventId,continuationEventId,sourceHead});
            if(handoff.status!==200||handoff.body?.ok!==true||!handoff.body?.result?.successor?.event_id)throw new Error('SUCCESSOR_HANDOFF_FAILED:'+JSON.stringify(handoff));
            mark('SUCCESSOR','PASS',{parent_event_id:successorEventId,successor_event_id:handoff.body.result.successor.event_id});

            fs.writeFileSync('intelligent-block-lifecycle-proof.json',JSON.stringify({schema:'NAYANET_INTELLIGENT_BLOCK_LIFECYCLE_V1',status:'VERIFIED',source_head:process.env.GITHUB_SHA,owner_id:session.userId,old_block_id:blockId,new_block_id:newId,successor_event_id:successorEventId,continuation_event_id:continuationEventId,successor_handoff_event_id:handoff.body.result.successor.event_id,idempotency_key:idem,trace},null,2));
          }finally{await browser.close();}
          NODE
          node intelligent-block-lifecycle-proof.mjs
      - name: Validate proof artifact
        run: |
          node -e "const p=require('./intelligent-block-lifecycle-proof.json'); if(p.status!=='VERIFIED'||p.trace.some(x=>x.status!=='PASS')) process.exit(1); console.log(JSON.stringify(p,null,2))"
