name: Verify Project Intelligence Bridge Adversarially
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/nayanet-project-intelligence-bridge/index.ts'
      - 'supabase/migrations/20260925040000_bind_bridge_owner_to_oidc_workflow_v1.sql'
      - '.github/workflows/verify-project-intelligence-bridge-adversarial.yml'
permissions:
  contents: read
  id-token: write
jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Establish fresh proof owner identity
        shell: bash
        run: |
          owner=$(curl -sSf -X POST -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" "$SUPABASE_URL/auth/v1/signup" -d '{}')
           owner_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["user"]["id"])' <<< "$owner")
           owner_access_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$owner")
           echo "::add-mask::$owner_access_token"
           echo "NAYANET_OWNER_ACCESS_TOKEN=$owner_access_token" >> "$GITHUB_ENV"
           echo "NAYANET_OWNER_ID=$owner_id" >> "$GITHUB_ENV"
          echo "RUN_IDENTITY=github-actions:${GITHUB_RUN_ID}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build packet
        run: python .naya/runtime/project_intelligence_bridge.py build --out project-intelligence-bridge-packet.json
      - name: Mint GitHub OIDC bridge token
        id: oidc
        shell: bash
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nayanet-project-intelligence-bridge" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
           echo "token=$token" >> "$GITHUB_OUTPUT"
           binding=$(curl -sSf -X POST "$NAYANET_BRIDGE_AUTH_URL/rest/v1/rpc/nayanet_issue_bridge_owner_binding" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $NAYANET_OWNER_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$(jq -n --arg w "$GITHUB_WORKFLOW_REF" --arg r "$GITHUB_RUN_ID" --arg e "$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)" '{p_repository:"SoulSchoolAcademy/NayaPOWER",p_workflow_ref:$w,p_run_id:$r,p_expires_at:$e}')")
           binding_token=$(echo "$binding" | python -c 'import json,sys; print(json.load(sys.stdin)["owner_binding_token"])')
           echo "::add-mask::$binding_token"
           echo "NAYANET_OWNER_BINDING_TOKEN=$binding_token" >> "$GITHUB_ENV"
      - name: Oscar adversarial bridge checks
        env:
          NAYANET_BRIDGE_URL: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-project-intelligence-bridge
          NAYANET_BRIDGE_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python .naya/runtime/verify_project_intelligence_bridge_adversarial.py
      - name: Publish adversarial evidence
        uses: actions/upload-artifact@v4
        with:
          name: project-intelligence-bridge-adversarial
          path: project-intelligence-bridge-packet.json
          retention-days: 30