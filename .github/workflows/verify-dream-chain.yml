name: Verify NayaNET Dream Apply Verify Chain
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dream-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
      PROOF_PATH: ${{ github.workspace }}/nayanet-dream-chain.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependency
        run: npm install --no-save @supabase/supabase-js
      - name: Execute Dream scoring proof
        run: node scripts/verify-p0-dream-scoring.mjs
      - name: Validate Dream proof
        run: test -s "$PROOF_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: nayanet-dream-scoring-proof
          path: ${{ github.workspace }}/nayanet-dream-chain.json
          if-no-files-found: error
          retention-days: 30
