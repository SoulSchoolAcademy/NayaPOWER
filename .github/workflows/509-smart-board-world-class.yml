name: 509 — Smart Board World-Class Runtime Authority
on:
  push:
    branches: [main]
concurrency:
  group: naya-509-world-class-public-runtime
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      WORKER_NAME: sparkling-shape-7ae5
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6
      - name: Governance authorization
        run: |
          set -euo pipefail
          python3 .naya/control-plane/workflow_gate.py --actor SoulSchoolAcademy --purpose "deploy the canonical 509 NayaNET Intelligent Hub public runtime" --permission deploy_public_runtime --request deploy_nayanet_hub_canonical --mission "Make Naya Power operationally trustworthy by establishing one perfect Smart Board reference state, verifying it end-to-end, and only then replicating it without architectural drift or context loss." --uncertainty 2 --consequence 8 --irreversibility 8 --scope "public-runtime:sparkling-shape-7ae5:/" --evidence "exact source SHA $GITHUB_SHA" --evidence "CURRENT-EXECUTION-TRANSACTION" --evidence "509-SMART-BOARD-CURRENT" --evidence "candidate browser acceptance" > /tmp/auth.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/auth.json"))["status"])')" = AUTHORIZED
      - name: Validate one-board contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.naya/execution-contracts/509-SMART-BOARD-CURRENT.json').read_text())
          tx=json.loads(Path('.naya/execution-contracts/CURRENT-EXECUTION-TRANSACTION.json').read_text())
          assert c['status']=='ACTIVE' and c['boards']['count']==1
          assert c['boards']['titles']==['What Is Naya Power?']
          assert tx['status']=='ACTIVE' and 'one perfect Smart Board reference state' in tx['current_mission']
          assert tx['required_state'][0]=='exactly one canonical board titled What Is Naya Power?'
          print('ONE_BOARD_CONTRACTS=PASS')
          PY
      - name: Fail if another 509 deploy lane is executable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          active=[]
          for p in Path('.github/workflows').glob('*.yml'):
              s=p.read_text(errors='ignore')
              if p.name=='509-smart-board-world-class.yml': continue
              if ('cloudflare/wrangler-action' in s or re.search(r'\bwrangler\s+deploy\b',s)) and ('509' in p.name or '509' in s):
                  if 'workflow_dispatch' not in s or not re.search(r'(?i)disabled|retired',s): active.append(str(p))
          assert not active, active
          print('DEPLOY_LANE_AUDIT=PASS')
          PY
      - name: Build isolated candidate
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          cp 'SMART FEED CONTENT' release/public/NAYANET/SMART-FEED-CONTENT.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('release/public/index.html'); h=p.read_text()
          legacy=['509-AAA-SMART-NOTE-CANONICAL-RENDERER.js','509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js','509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js','509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js','509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V3.js','509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js','509-AAA-SMART-BOARD-V6-CANONICAL-CONTENT-RUNTIME.js','509-AAA-SMART-BOARD-V10-FINAL-GEOMETRY.js','509-AAA-SMART-BOARD-V20-CANONICAL-LAYER-RECONCILER.js','509-AAA-SMART-BOARD-V21-FINAL-ACCEPTANCE-FIX.js','509-AAA-SMART-BOARD-V22-CANONICAL-RESTORE.js','509-AAA-SMART-BOARD-V23-DETERMINISTIC-RESTORE.js','509-AAA-SMART-BOARD-V24-OUTER-CANONICAL-LOCK.js','509-AAA-SMART-BOARD-V25-FINAL-CANONICAL-RESTORE.js','509-AAA-SMART-BOARD-V26-CANONICAL-OUTER-RESTORE.js','509-AAA-SMART-BOARD-STRUCTURAL-LOCK.js']
          for n in legacy: h=re.sub(r'<script[^>]+%s[^>]*></script>'%re.escape(n),'',h,flags=re.I)
          shim='<script>window.$=window.$||((s,r=document)=>r.querySelector(s));window.$$=window.$$||((s,r=document)=>[...r.querySelectorAll(s)]);</script>'
          code=Path('NAYANET/509-AAA-SMART-BOARD-ONE-BOARD-REFERENCE.js').read_text().replace('</script>','<\\/script>')
          h=h.replace('</head>',shim+'</head>',1)
          h=h.replace('</body>','<script>'+code+'</script></body>',1)
          p.write_text(h)
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname==='/NAYANET/SMART-FEED-CONTENT.txt'){const a=await env.ASSETS.fetch(new Request(new URL('/NAYANET/SMART-FEED-CONTENT.txt',request.url),request));if(a.ok)return new Response(a.body,{headers:{'Content-Type':'text/plain; charset=utf-8','Cache-Control':'no-store'}})}const t=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(t);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          printf '{"name":"%s","main":"worker.js","compatibility_date":"2026-09-08","account_id":"%s","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"%s"}}\n' "$WORKER_NAME" "$ACCOUNT_ID" "$GITHUB_SHA" > release/wrangler.jsonc
      - name: Candidate browser acceptance
        run: |
          set -euo pipefail
          mkdir -p /tmp/naya-browser && cd /tmp/naya-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          const L=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO USE / HOW TO APPLY',"WHAT'S IN IT FOR YOU"],K=['human','child','grandma','naya','machine','learning','meaning','apply','benefit'],C=['#ff3bbf','#9d75ff','#6675ff','#c97a4a','#35d39a','#b8ee57','#f1d75a','#e8c766','#e9edf5'],S=['Your Intelligence Today','Your Reports','Intelligent Library','Smart Share','Smart Ledger','Your Connections','Smart Lists','Smart Spaces','Smart Mail','Settings'],SK=['intelligence','reports','library','start','ledgers','connections','lists','spaces','mail','settings'],SC=['#9d75ff','#6675ff','#55b9ee','#55e39a','#b8ee57','#f1d75a','#e8c766','#f09a4a','#ff5e6c','#d86cff'];
          const browser=await chromium.launch();for(const [name,w,h] of [['desktop',1440,1400],['tablet',900,1200],['mobile',390,1100]]){const p=await browser.newPage({viewport:{width:w,height:h}});const errors=[];p.on('pageerror',x=>errors.push(x.message));await p.goto(process.env.TARGET+'/?accept='+name+'_'+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForTimeout(5000);if(errors.length)throw Error(name+': PAGEERROR '+errors.join('|'));const d=await p.evaluate(()=>{const t=v=>(v?.textContent||'').replace(/\s+/g,' ').trim();const b=[...document.querySelectorAll('.blocks>.block.naya509-reference')];const n=[...document.querySelectorAll('.rail .nav button,.rail .nav a')];return{b:b.map(x=>({title:t(x.querySelector('h3')),layers:[...x.querySelectorAll('.naya509-one-section')].map(y=>({k:y.dataset.semanticLayer,l:t(y.querySelector('.naya509-one-title')),c:y.dataset.layerColor,r:y.getBoundingClientRect(),body:t(y.querySelector('.naya509-one-body'))})),r:x.getBoundingClientRect(),actions:[...x.querySelectorAll('.naya509-one-actions button')].map(t)})),n:n.map(x=>({t:t(x),k:x.dataset.nayaOne,c:getComputedStyle(x).getPropertyValue('--sem').trim()}))}});if(d.b.length!==1||d.b[0].title!=='What Is Naya Power?')throw Error(name+': ONE_BOARD');if(JSON.stringify(d.b[0].layers.map(x=>x.k))!==JSON.stringify(K)||JSON.stringify(d.b[0].layers.map(x=>x.l))!==JSON.stringify(L)||JSON.stringify(d.b[0].layers.map(x=>x.c.toLowerCase()))!==JSON.stringify(C))throw Error(name+': LAYERS');if(d.b[0].layers.some(x=>!x.body))throw Error(name+': EMPTY');if(d.b[0].layers.some(x=>Math.round(x.r.x)!==Math.round(d.b[0].r.x)||Math.round(x.r.width)!==Math.round(d.b[0].r.width)))throw Error(name+': WIDTH');if(d.b[0].layers.some((x,i,a)=>i&&x.r.y<=a[i-1].r.y))throw Error(name+': STACK');if(d.b[0].actions.join('|')!=='Create Space|Favorite|Save')throw Error(name+': ACTIONS');if(d.n.length!==10||JSON.stringify(d.n.map(x=>x.t))!==JSON.stringify(S)||JSON.stringify(d.n.map(x=>x.k))!==JSON.stringify(SK)||JSON.stringify(d.n.map(x=>x.c.toLowerCase()))!==JSON.stringify(SC))throw Error(name+': SIDEBAR');console.log(name+': PASS');await p.close()}await browser.close();console.log('CANDIDATE_BROWSER=PASS');
          EOF
          cd "$GITHUB_WORKSPACE/release/public" && python3 -m http.server 8787 >/tmp/naya-http.log 2>&1 & echo $! >/tmp/naya-http.pid
          sleep 2
          TARGET=http://127.0.0.1:8787 node /tmp/naya-browser/verify.mjs
          kill "$(cat /tmp/naya-http.pid)"
      - name: Deploy canonical runtime
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Post-deploy browser acceptance
        run: |
          set -euo pipefail
          cd /tmp/naya-browser
          TARGET="$RUNTIME" node verify.mjs
