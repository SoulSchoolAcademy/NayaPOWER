name: NayaPOWER — P0 Execution Plane Bridge

on:
  push:
    branches: [main]
    paths:
      - '.naya/**'
      - 'SUPERBRAIN/**'
      - 'NAYANET/HUB/**'
      - '.github/workflows/naya-power-p0-execution-bridge.yml'
      - '!SUPERBRAIN/NAYA-ACTIVITY/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY-FEED.md'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture bridge identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BRIDGE_EVENT=${{ github.event_name }}"
            echo "BRIDGE_REF=${{ github.ref }}"
            echo "BRIDGE_SHA=${{ github.sha }}"
            echo "BRIDGE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee /tmp/bridge.env

      - name: Dispatch canonical P0 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "DISPATCH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a /tmp/bridge.env
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/naya-power-adversarial-p0.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'P0_DISPATCH=SUCCESS' | tee -a /tmp/bridge.env

      - name: Locate dispatched P0 run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            payload=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/naya-power-adversarial-p0.yml/runs?branch=main&event=workflow_dispatch&per_page=20")
            run_id=$(printf '%s' "$payload" | jq -r --arg sha "$EXPECTED_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "P0_RUN_ID=${run_id}" | tee -a /tmp/bridge.env

      - name: Wait for dispatched P0 completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(grep '^P0_RUN_ID=' /tmp/bridge.env | cut -d= -f2)
          for attempt in $(seq 1 120); do
            run=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            status=$(printf '%s' "$run" | jq -r '.status')
            if [ "$status" = 'completed' ]; then
              printf '%s' "$run" > /tmp/p0-run.json
              echo "P0_STATUS=${status}" | tee -a /tmp/bridge.env
              echo "P0_CONCLUSION=$(printf '%s' "$run" | jq -r '.conclusion // ""')" | tee -a /tmp/bridge.env
              break
            fi
            sleep 5
          done
          test -s /tmp/p0-run.json

      - name: Capture jobs and exact SHA chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(grep '^P0_RUN_ID=' /tmp/bridge.env | cut -d= -f2)
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/p0-jobs.json
          set -a
          . /tmp/bridge.env
          set +a
          jq -n \
            --argjson run "$(cat /tmp/p0-run.json)" \
            --argjson jobs "$(cat /tmp/p0-jobs.json)" \
            '{bridge:{event:env.BRIDGE_EVENT,ref:env.BRIDGE_REF,sha:env.BRIDGE_SHA},p0:{id:$run.id,event:$run.event,ref:$run.head_branch,head_sha:$run.head_sha,status:$run.status,conclusion:$run.conclusion,jobs:$jobs.jobs|map({id,name,status,conclusion,steps})}}' \
            > /tmp/naya-power-p0-execution-receipt.json

      - name: Assert exact-head dispatch proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/naya-power-p0-execution-receipt.json').read_text())
          assert p['bridge']['ref']=='refs/heads/main'
          assert p['p0']['ref']=='main'
          assert p['p0']['head_sha']==p['bridge']['sha'], (p['p0']['head_sha'], p['bridge']['sha'])
          assert p['p0']['event']=='workflow_dispatch'
          print('P0_DISPATCH_EXACT_HEAD=PASS')
          PY

      - name: Upload execution-plane receipt
        uses: actions/upload-artifact@v4
        with:
          name: naya-power-p0-execution-plane-${{ github.sha }}
          path: /tmp/naya-power-p0-execution-receipt.json
          if-no-files-found: error
