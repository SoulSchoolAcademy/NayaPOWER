name: Automatic Protocol Pin Drift Alarm

# Alerting only: never blocks ordinary work and never silently re-pins law.
# The activation gate remains the fail-closed enforcement point.
on:
  push:
    branches: ["main"]
    paths:
      - "PROTOCOL.md"
      - "tools/protocol_pin.py"
      - ".github/workflows/automatic-protocol-pin-drift-alarm.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: protocol-pin-drift-alarm-main
  cancel-in-progress: false

jobs:
  alarm:
    name: Check pinned protocol bytes and ring the board on drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate canonical protocol pin
        id: drift
        shell: bash
        run: |
          set +e
          python3 tools/protocol_pin.py --drift-alarm --repo-root . --json > "$RUNNER_TEMP/protocol-pin-drift.json" 2> "$RUNNER_TEMP/protocol-pin-drift.err"
          rc=$?
          set -e
          python3 - "$RUNNER_TEMP/protocol-pin-drift.json" "$RUNNER_TEMP/protocol-pin-drift.err" "$rc" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          payload_path, error_path, raw_rc, output_path = sys.argv[1:]
          rc = int(raw_rc)
          raw = pathlib.Path(payload_path).read_text(encoding="utf-8").strip()
          error = pathlib.Path(error_path).read_text(encoding="utf-8").strip()
          try:
              payload = json.loads(raw) if raw else {}
          except json.JSONDecodeError:
              payload = {}
          healthy = rc == 0 and payload.get("alarm") is False
          if healthy:
              detail = "Protocol pin matches canonical bytes; no drift."
          else:
              detail = json.dumps({
                  "exit_code": rc,
                  "payload": payload,
                  "stderr": error,
                  "stdout": raw if not payload else "",
              }, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          safe = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          with open(output_path, "a", encoding="utf-8") as f:
              f.write(f"alarm={'false' if healthy else 'true'}\n")
              f.write(f"detail={safe}\n")
          print("PROTOCOL PIN: " + ("PASS" if healthy else "ALARM — drift or unreadable pin; fail closed"))
          print(detail)
          PY
      - name: Update one persistent board alarm
        if: steps.drift.outputs.alarm == 'true'
        uses: actions/github-script@v7
        env:
          ALARM_DETAIL: \${{ steps.drift.outputs.detail }}
        with:
          script: |
            const marker = '<!-- NAYA-PROTOCOL-PIN-DRIFT-ALARM -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = 2599;
            const body = [
              marker,
              '## AUTOMATIC PROTOCOL PIN DRIFT ALARM',
              '',
              'The canonical protocol pin check is drifted or could not be verified. This is an alert, not authorization to re-pin.',
              '',
              'Required cure: inspect the exact byte/hash difference; if the change is intentional, obtain the required governance authorization and update the pin through the canonical re-pin process. If not intentional, restore the canonical bytes. Re-run the pin check after repair.',
              '',
              'Machine evidence (JSON):',
              process.env.ALARM_DETAIL || 'No diagnostic was emitted; inspect this workflow run.',
              '',
              'Workflow run: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId,
              '',
              'This comment is maintained in place to avoid alarm spam. The workflow never changes protocol pins and never blocks unrelated work.'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const prior = comments.find(c => c.body?.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Clean state confirmation
        if: steps.drift.outputs.alarm == 'false'
        run: echo "Protocol pin matches its canonical fingerprint; no action required."
