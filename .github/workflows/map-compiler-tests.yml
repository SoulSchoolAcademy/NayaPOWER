name: Living Map Compiler Tests

on:
  pull_request:
    paths:
      - 'tools/map-compiler/**'
      - '.github/workflows/map-compiler-tests.yml'

permissions:
  contents: read

jobs:
  measurement-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run map compiler probe regression suite
        run: python -m unittest discover -s tools/map-compiler/tests -v
