name: Build NayaNET Intelligent Hub from canonical 5:09 source

# Release execution: the current approved 5:09 Hub is the canonical source for this build.

on:
  push:
    paths:
      - '2026 09 09 5:09 pm NayaNET HUB.html'
      - 'scripts/nayanet-509-intelligent-feed-v2.js'
      - '.github/workflows/build-nayahub-intelligent.yml'
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical 5:09 Hub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Surgical integration — remove stray code and install one widescreen feed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('2026 09 09 5:09 pm NayaNET HUB.html')
          renderer=Path('scripts/nayanet-509-intelligent-feed-v2.js')
          html=src.read_text(encoding='utf-8')
          if html.count('<!doctype html>')!=1 or html.count('</html>')!=1:
              raise SystemExit('Canonical 5:09 Hub is not a complete document')
          # Remove previously materialized copies of this layer so the build is deterministic.
          html=re.sub(r'<style id="n509-final-style">.*?</style>', '', html, flags=re.S)
          html=re.sub(r'<script id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V2">.*?</script>', '', html, flags=re.S)
          # Remove actual pre/code elements from the canonical artifact; these are the stray code blocks.
          html=re.sub(r'<pre\b[^>]*>.*?</pre>', '', html, flags=re.S|re.I)
          html=re.sub(r'<code\b[^>]*>.*?</code>', '', html, flags=re.S|re.I)
          # Force the existing Hub feed surface to be full-width without changing the outer shell.
          html += '''\n<style id="n509-final-style">#page-home .homeWorkspace,#page-home .homeFeed,#naya509feed{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important}#page-home .homeFeed{min-width:0!important;padding-left:0!important;padding-right:0!important}#naya509feed .n509-board{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important}</style>\n'''
          body=renderer.read_text(encoding='utf-8')
          html += '\n<script id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V2">\n'+body+'\n</script>\n'
          Path('index.html').write_text(html,encoding='utf-8')
          Path('_redirects').write_text('/intelligence/* /index.html 200\n',encoding='utf-8')
          print('CANONICAL_SOURCE_BYTES',src.stat().st_size)
          print('INDEX_BYTES',Path('index.html').stat().st_size)
          PY
      - name: Validate exact requested changes
        shell: bash
        run: |
          set -e
          test -s index.html
          grep -q 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V2' index.html
          grep -q 'n509-final-style' index.html
          grep -q 'CREATE SPACES' index.html
          grep -q '#7C4DFF' index.html
          grep -q '#6675FF' index.html
          grep -q '#55B9EE' index.html
          ! grep -qi '<pre' index.html
          ! grep -qi '<code' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('<!doctype html>')==1 and s.count('</html>')==1
          assert 'width:100%!important;max-width:none!important' in s
          assert 'grid-template-columns:repeat(3' not in s[s.find('id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V2"'):]
          print('PASS: single canonical widescreen feed renderer; stray pre/code removed')
          PY
      - name: Commit completed canonical Hub and index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html _redirects
          if git diff --cached --quiet; then echo 'No generated changes'; else git commit -m 'Build canonical NayaNET Hub widescreen feed [skip ci]'; git push; fi
      - name: Upload Cloudflare package
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare
          path: |
            index.html
            _redirects
          if-no-files-found: error
