name: NAYA — Monotonic Progress Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.naya/governance/**'
      - '.naya/codex/**'
      - '.naya/control-plane/**'
      - 'SUPERBRAIN/AI-BOOT/**'
      - 'SUPERBRAIN/NAYAPOWER-CANONICAL-SOURCE-MAP.md'
      - 'scripts/verify-monotonic-progress.py'
      - '.github/workflows/naya-monotonic-progress-guard.yml'

permissions:
  contents: read

concurrency:
  group: naya-monotonic-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Protected State + Checkpoint Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected state and checkpoint ancestry
        run: python3 scripts/verify-monotonic-progress.py
