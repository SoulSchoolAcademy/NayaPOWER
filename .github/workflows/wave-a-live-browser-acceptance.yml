# WAVE-A REGISTRATION REPAIR: second-source push proves this workflow from its registered definition.
# Canonical lifecycle gate: Smart Note -> canonical event -> Personal Smart Feed -> reload -> same event ID.
# Run after current-main release 683 so acceptance is source-current.
# CURRENT_SMART_FEED_LINEAGE_REPAIR: verify row-id and canonical event-id block projection.
# CURRENT_SMART_FEED_BLOCK_LOOKUP_REPAIR: map returned items by id or event_id.
# CURRENT_SMART_FEED_DEPLOYMENT_CHECK: verify Supabase function version 14 source parity.
name: Wave A authenticated browser handoff acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wave-a-hydration-diagnostic.yml'
      - '.github/workflows/wave-a-live-browser-acceptance.yml'
      - '.github/scripts/wave-a-canonical-hub-acceptance.mjs'
      - '.naya/control-plane/BLOCKS.json'
      - 'assistant-runtime.js'
      - 'NAYANET/HUB/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
      NAYA_EXISTING_SPACE_ID: 04ee4dc8-bc73-47df-a1de-162570f6a56e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute canonical approved Hub browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          export RECEIPT_PATH="$RUNNER_TEMP/wave-a-canonical-hub-acceptance.json"
          node .github/scripts/wave-a-canonical-hub-acceptance.mjs

      - name: Upload machine receipt
        uses: actions/upload-artifact@v4
        with:
          name: wave-a-canonical-hub-acceptance
          path: ${{ runner.temp }}/wave-a-canonical-hub-acceptance.json
          if-no-files-found: error
