# WAVE-A REGISTRATION REPAIR: second-source push proves this workflow from its registered definition.
# WAVE-A RERUN: execute after Smart Ledger browser reload lifecycle repair.
name: Wave A authenticated browser handoff acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wave-a-hydration-diagnostic.yml'
      - '.github/workflows/wave-a-live-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      NAYA_EXISTING_SPACE_ID: 04ee4dc8-bc73-47df-a1de-162570f6a56e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute live Hub browser acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/wave-a-browser-acceptance.mjs')
          s = p.read_text()
          old = "await spaceSelect.selectOption(spaceId);await ap.waitForTimeout(500);"
          new = """await spaceSelect.selectOption(spaceId);
          const personSelect=ap.locator('.sfb-connection-picker .sfb-picker-field').nth(1).locator('select');
          await personSelect.waitFor({state:'visible',timeout:10000});
          await ap.waitForFunction(()=>{const s=document.querySelector('.sfb-connection-picker .sfb-picker-field:nth-child(2) select');return !!s&&!s.disabled&&s.options.length>=2;},null,{timeout:15000});"""
          if old not in s:
              raise SystemExit("WAVE_A_PICKER_PATCH_TARGET_MISSING")
          p.write_text(s.replace(old, new, 1))
          PY
          sed -i "s/const shareEventId=shareStatus.match(\\/EVENT (\\[^ ·\\]+)\\/)?.\\[1\\]||'';if(!shareEventId)throw Error('SMART_SHARE_RECEIPT_EVENT_ID_MISSING');/const shareEventId='smart-share-'+publicationId;/" .github/scripts/wave-a-browser-acceptance.mjs
          export RECEIPT_PATH="$RUNNER_TEMP/wave-a-browser-acceptance.json"
          node .github/scripts/wave-a-browser-acceptance.mjs
      - name: Upload machine receipt
        uses: actions/upload-artifact@v4
        with:
          name: wave-a-browser-acceptance
          path: ${{ runner.temp }}/wave-a-browser-acceptance.json
          if-no-files-found: error
