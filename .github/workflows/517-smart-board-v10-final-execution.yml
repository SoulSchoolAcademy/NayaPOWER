name: 517 Smart Board V10 Final Execution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/517-smart-board-v10-final-execution.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact V10 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('2026 09 15 NayaNETHUB.html'); s=p.read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show','60c70db83c8ffdf954b73c45821fd53a3eeebbf7:2026 09 15 NayaNETHUB.html'],text=True)
          def grab(src,tag,marker):
              m=re.search(r'<'+tag+r'\b(?=[^>]*'+re.escape(marker)+r')[^>]*>.*?</'+tag+r'>',src,re.S|re.I)
              if not m: raise SystemExit('protected '+tag+' missing')
              return m.group(0)
          v10style=grab(base,'style','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10'); v10script=grab(base,'script','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')
          def strip_tag_with_marker(src,tag,marker):
              return re.sub(r'<'+tag+r'\b(?=[^>]*'+re.escape(marker)+r')[^>]*>.*?</'+tag+r'>','',src,flags=re.S|re.I)
          s=strip_tag_with_marker(s,'style','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10'); s=strip_tag_with_marker(s,'script','NAYA-SMART-BOARD-ELITE-REFINEMENT-V10')
          s=strip_tag_with_marker(s,'style','NAYA-SMART-BOARD-V10-SURGICAL-FINAL'); s=strip_tag_with_marker(s,'script','NAYA-SMART-BOARD-V10-SURGICAL-FINAL')
          for marker in ['naya-aaa-smart-board-visual-v1','naya-smart-board-living-intelligence-v2','naya-smart-board-finalizer','naya-elite-interface-refinement-runtime']:
              s=strip_tag_with_marker(s,'style',marker); s=strip_tag_with_marker(s,'script',marker)
          s=re.sub(r'\.naya509-unified-board\s+\.nutshell:before\s*\{[^}]*\}','',s,flags=re.S|re.I)
          s=s.replace('</head>',v10style+'\n</head>',1)
          css='''<style id="NAYA-SMART-BOARD-V10-SURGICAL-FINAL">.elite-board:first-child .nutshell{margin:0 0 28px!important;padding:0!important;overflow:hidden!important}.elite-board:first-child .nutshell b{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:24px!important;text-align:left!important;font-size:clamp(20px,2.1vw,29px)!important;min-height:116px!important;padding:14px 30px!important}.elite-board:first-child .nutshell b .v10-nutshell-star{order:0!important;margin:0!important;flex:0 0 78px!important}.elite-board:first-child .nutshell p{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important}.elite-board:first-child .blockTop{gap:28px!important}.elite-board:first-child .identity{gap:22px!important}.elite-board .layerHead{gap:24px!important}.elite-board .layerBody{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.6!important}.elite-board .dot{width:88px!important;height:88px!important;flex:0 0 88px!important}.elite-board .dot .v10-icon{width:64px!important;height:64px!important}</style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          js='''<script id="NAYA-SMART-BOARD-V10-SURGICAL-FINAL">(()=>{const q=(s,r=document)=>r.querySelector(s),qq=(s,r=document)=>[...r.querySelectorAll(s)];const O=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON','WHAT IT MEANS','HOW TO APPLY / HOW TO USE',"WHAT'S IN IT FOR YOU"];const A={'ADAPTIVE LEARNING':'LEARNING LESSON','ADAPTER LEARNING':'LEARNING LESSON','HOW TO USE':'HOW TO APPLY / HOW TO USE','HOW TO APPLY':'HOW TO APPLY / HOW TO USE','CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','SIGNIFICANCE':'WHAT IT MEANS','HUMAN VALUE':"WHAT'S IN IT FOR YOU"};const N=s=>String(s||'').replace(/\\s+/g,' ').trim().toUpperCase().replace(/^\\d+\\s*[·.)-]\\s*/,'');function nut(n){if(!n)return;const p=q('p',n),b=q('b',n);[...n.children].forEach(x=>{if(x!==b&&x!==p)x.remove()});if(b){b.replaceChildren();const z=document.createElement('span');z.className='v10-nutshell-star';z.setAttribute('aria-hidden','true');b.append(z,document.createTextNode('IN A NUTSHELL'));}}function run(){const bs=qq('#blocks > .block');bs.forEach((b,i)=>{b.classList.add('elite-board','naya-smart-board-v10');const h=q('h3',b);if(h&&i===0)h.textContent='What is Naya Power';nut(q('.nutshell',b));const ls=q('.layers',b);if(ls){const m=new Map();qq(':scope > .layer',ls).forEach(x=>{const h=q('.layerHead b',x);if(!h){x.remove();return}let t=A[N(h.textContent)]||N(h.textContent);if(!O.includes(t)){x.remove();return}h.textContent=t;m.set(t,x)});O.forEach(k=>{if(m.has(k))ls.append(m.get(k))});}});qq('.status').forEach(x=>x.remove());const t=q('.top .title');if(t)t.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date())}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run()})();</script>'''
          s=s.replace('</body>',v10script+'\n'+js+'\n</body>',1)
          # Source-level proof. The protected baseline itself is authoritative for the jewel definitions.
          assert len(re.findall(r'<style\b[^>]*NAYA-SMART-BOARD-ELITE-REFINEMENT-V10[^>]*>',s,re.I))==1
          assert len(re.findall(r'<script\b[^>]*NAYA-SMART-BOARD-ELITE-REFINEMENT-V10[^>]*>',s,re.I))==1
          assert len(re.findall(r'<style\b[^>]*NAYA-SMART-BOARD-V10-SURGICAL-FINAL[^>]*>',s,re.I))==1
          assert len(re.findall(r'<script\b[^>]*NAYA-SMART-BOARD-V10-SURGICAL-FINAL[^>]*>',s,re.I))==1
          assert 'What is Naya Power' in s and 'HOW TO APPLY / HOW TO USE' in s and "WHAT'S IN IT FOR YOU" in s
          for x in ['naya-aaa-smart-board-visual-v1','naya-smart-board-living-intelligence-v2','naya-smart-board-finalizer','naya-elite-interface-refinement-runtime']: assert x not in s
          p.write_text(s,encoding='utf-8')
          print('V10_FINAL_SOURCE_PASS')
          PY
      - name: Commit canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NayaPOWER Automation'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git diff --cached --quiet && { echo 'NO_CANONICAL_CHANGE'; exit 1; }
          git commit -m 'Finalize exact V10 jewel icon authority and Smart Board repair'
          git push origin HEAD:main
