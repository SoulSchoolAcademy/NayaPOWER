name: Live Learning Influence Proof

on:
  pull_request:
  push:
    branches:
      - main
      - naya/learning-influence-proof-v1
  workflow_dispatch:

concurrency:
  group: live-learning-influence-proof
  cancel-in-progress: false

jobs:
  authenticated-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pytest -q tests/test_live_learning_influence.py
        env:
          SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
          SUPABASE_USER_ACCESS_TOKEN: ${{ secrets.SUPABASE_USER_ACCESS_TOKEN }}
          SUPABASE_USER_REFRESH_TOKEN: ${{ secrets.SUPABASE_USER_REFRESH_TOKEN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: learning-influence-receipt
          path: learning-influence-receipt.json

  independent-verification:
    needs: authenticated-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: learning-influence-receipt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pytest -q tests/test_independent_learning_influence.py
