name: Live Learning Influence Proof

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-learning-influence-proof
  cancel-in-progress: false

env:
  RUNTIME_FUNCTION: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-cold-runtime-proof

jobs:
  authenticated-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Mint short-lived Naya runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Execute canonical learning-influence runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" "${RUNTIME_FUNCTION}?mode=learning-influence" > learning-influence-receipt.json
          cat learning-influence-receipt.json
          python - <<'PY'
          import json
          r=json.load(open("learning-influence-receipt.json"))
          assert r["ok"] is True, r
          assert r["control"]["evidence"]["retained_intelligence_used"] is False, r
          assert r["treatment"]["evidence"]["retained_intelligence_used"] is True, r
          assert r["control"]["observed_result"] != r["treatment"]["observed_result"], r
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: learning-influence-receipt
          path: learning-influence-receipt.json

  independent-verification:
    needs: authenticated-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: learning-influence-receipt
      - name: Mint independent short-lived Naya runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Independently reread persisted learning influence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open("learning-influence-receipt.json"))
          print(json.dumps({"mode":"verify","learning_id":r["learning_id"],"treatment_receipt_id":r["treatment"]["id"],"control_receipt_id":r["control"]["id"]}))
          PY
          python - <<'PY'
          import json
          r=json.load(open("learning-influence-receipt.json"))
          json.dump({"mode":"verify","learning_id":r["learning_id"],"treatment_receipt_id":r["treatment"]["id"],"control_receipt_id":r["control"]["id"]},open("verify-request.json","w"))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @verify-request.json "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-causal-learning-experiment" > independent-verification.json
          cat independent-verification.json
          python - <<'PY'
          import json
          r=json.load(open("independent-verification.json"))
          assert r["ok"] is True, r
          assert r["verification"]["independent_verification"] is True, r
          assert r["verification"]["executor_claim_trusted"] is False, r
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-learning-influence-verification
          path: independent-verification.json
