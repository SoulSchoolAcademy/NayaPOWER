name: Naya Power Excellence Gate

on:
  push:
    branches: [main]
    paths:
      - '.naya/**'
      - 'SUPERBRAIN/**'
      - 'NAYANET/HUB/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/naya-power-excellence-gate.yml'
      - '!SUPERBRAIN/NAYA-ACTIVITY/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY-FEED.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excellence:
    name: Deterministic Excellence by Default gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate machine-readable policy
        run: python3 -m json.tool SUPERBRAIN/naya_power_excellence_policy.json >/dev/null

      - name: Compile governance and excellence evaluators
        run: |
          python3 -m py_compile \
            .naya/governance/governance_kernel.py \
            .naya/control-plane/workflow_gate.py \
            .naya/governance/test_naya_execution_boundaries.py \
            SUPERBRAIN/naya_power_excellence.py \
            SUPERBRAIN/test_naya_power_excellence.py

      - name: Run canonical governance kernel tests
        run: python3 .naya/governance/test_governance_kernel.py

      - name: Run execution-boundary tests
        run: python3 .naya/governance/test_naya_execution_boundaries.py

      - name: Run deterministic excellence tests
        working-directory: SUPERBRAIN
        run: python3 -m unittest -v test_naya_power_excellence.py

      - name: Emit policy provenance
        run: |
          echo "NAYA_POWER_EXCELLENCE_POLICY=SUPERBRAIN/naya_power_excellence_policy.json"
          echo "NAYA_POWER_EXCELLENCE_EVALUATOR=SUPERBRAIN/naya_power_excellence.py"
          echo "NAYAPOWER_GOVERNANCE_KERNEL=.naya/governance/governance_kernel.py"
          echo "NAYAPOWER_EXECUTION_BOUNDARY_TEST=.naya/governance/test_naya_execution_boundaries.py"
          echo "SOURCE_SHA=${GITHUB_SHA}"
