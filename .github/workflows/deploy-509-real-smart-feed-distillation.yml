name: Deploy 509 C4 — Real Smart Feed Distillation

on:
  push:
    branches: [main]
    paths:
      - 'SMART FEED CONTENT'
      - '2026 09 13 NayaNET HUB 509 AAA.html'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js'
      - 'NAYANET/509-AAA-REAL-SMART-FEED-DISTILLATION.js'
      - 'NAYANET/509-AAA-SURGICAL-LAYER.js'
      - 'NAYANET/509-AAA-NEXT-LEVEL.js'
      - 'NAYANET/509-AAA-SMART-FEED-C3.js'
      - 'NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js'
      - 'NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js'
      - 'NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js'
      - 'NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js'
      - '.github/workflows/deploy-509-real-smart-feed-distillation.yml'

permissions:
  contents: read

env:
  SOURCE_FILE: 2026 09 13 NayaNET HUB 509 AAA.html
  SMART_CONTENT_FILE: SMART FEED CONTENT
  REAL_CONTENT_FILE: NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js
  DISTILL_FILE: NAYANET/509-AAA-REAL-SMART-FEED-DISTILLATION.js
  LAYER_FILE: NAYANET/509-AAA-SURGICAL-LAYER.js
  NEXT_LAYER_FILE: NAYANET/509-AAA-NEXT-LEVEL.js
  C3_LAYER_FILE: NAYANET/509-AAA-SMART-FEED-C3.js
  C4_LAYER_FILE: NAYANET/509-AAA-INTELLIGENT-BOARD-C4.js
  UNIFIED_FILE: NAYANET/509-AAA-C4-UNIFIED-BOARD-REPAIR.js
  RUNTIME_FILE: NAYANET/509-AAA-C4-SINGLE-BOARD-RUNTIME-REPAIR.js
  POLISH_FILE: NAYANET/509-AAA-C4-LOVE-LIKE-PERSONAL-POLISH.js
  WORKER_NAME: sparkling-shape-7ae5
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate canonical source and all surgical layers
        run: |
          set -euo pipefail
          for f in "$SOURCE_FILE" "$SMART_CONTENT_FILE" "$REAL_CONTENT_FILE" "$DISTILL_FILE" "$LAYER_FILE" "$NEXT_LAYER_FILE" "$C3_LAYER_FILE" "$C4_LAYER_FILE" "$UNIFIED_FILE" "$RUNTIME_FILE" "$POLISH_FILE"; do test -s "$f"; done
          for f in "$REAL_CONTENT_FILE" "$DISTILL_FILE" "$LAYER_FILE" "$NEXT_LAYER_FILE" "$C3_LAYER_FILE" "$C4_LAYER_FILE" "$UNIFIED_FILE" "$RUNTIME_FILE" "$POLISH_FILE"; do node --check "$f"; done
          for marker in 'SMART NOTE 01' 'SMART NOTE 02' 'SMART NOTE 03' 'YOUR INTELLIGENCE TODAY' 'Intelligence Reports turn the intelligence of your life' 'Naya Power #06' '07 — SMART LISTS' '08 — INTELLIGENT FEED / SMART FEED' '09 — SMART TABS'; do grep -Fq "$marker" "$SMART_CONTENT_FILE"; done
          echo SMART_NOTE_COUNT=9
      - name: Generate exact real-content asset
        id: build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          t=Path('NAYANET/509-AAA-REAL-SMART-FEED-CONTENT.js').read_text(encoding='utf-8')
          s=Path('SMART FEED CONTENT').read_bytes()
          Path('/tmp/naya-509-real-smart-feed-content.js').write_text(t.replace('__SMART_FEED_B64__',base64.b64encode(s).decode('ascii')),encoding='utf-8')
          PY
          node --check /tmp/naya-509-real-smart-feed-content.js
          echo SOURCE_HASH=$(sha256sum "$SOURCE_FILE"|cut -d' ' -f1) >> "$GITHUB_OUTPUT"
          echo SMART_CONTENT_HASH=$(sha256sum "$SMART_CONTENT_FILE"|cut -d' ' -f1) >> "$GITHUB_OUTPUT"
          echo GENERATED_HASH=$(sha256sum /tmp/naya-509-real-smart-feed-content.js|cut -d' ' -f1) >> "$GITHUB_OUTPUT"
          echo DISTILL_HASH=$(sha256sum "$DISTILL_FILE"|cut -d' ' -f1) >> "$GITHUB_OUTPUT"
      - name: Build exact 509 C4 release
        env:
          SOURCE_HASH: ${{ steps.build.outputs.SOURCE_HASH }}
          SMART_CONTENT_HASH: ${{ steps.build.outputs.SMART_CONTENT_HASH }}
          GENERATED_HASH: ${{ steps.build.outputs.GENERATED_HASH }}
          DISTILL_HASH: ${{ steps.build.outputs.DISTILL_HASH }}
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp "$SOURCE_FILE" release/public/index.html
          cp "$LAYER_FILE" release/public/naya-509-aaa.js
          cp "$NEXT_LAYER_FILE" release/public/naya-509-next-level.js
          cp "$C3_LAYER_FILE" release/public/naya-509-smart-feed-c3.js
          cp "$C4_LAYER_FILE" release/public/naya-509-intelligent-board-c4.js
          cp "$UNIFIED_FILE" release/public/naya-509-c4-unified-board-repair.js
          cp "$RUNTIME_FILE" release/public/naya-509-c4-single-board-runtime-repair.js
          cp "$POLISH_FILE" release/public/naya-509-c4-love-like-personal-polish.js
          cp "$DISTILL_FILE" release/public/naya-509-real-smart-feed-distillation.js
          cp /tmp/naya-509-real-smart-feed-content.js release/public/naya-509-real-smart-feed-content.js
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('release/public/index.html'); s=p.read_text(encoding='utf-8')
          meta=(f'<meta name="nayanet-canonical-source" content="509-AAA-GITHUB-DRAFT">'
                f'<meta name="nayanet-source-commit" content="{os.environ["GITHUB_SHA"]}">'
                f'<meta name="nayanet-source-sha256" content="{os.environ["SOURCE_HASH"]}">'
                f'<meta name="nayanet-smart-feed-content-sha256" content="{os.environ["SMART_CONTENT_HASH"]}">'
                f'<meta name="nayanet-real-content-generated-sha256" content="{os.environ["GENERATED_HASH"]}">'
                f'<meta name="nayanet-real-content-distillation-sha256" content="{os.environ["DISTILL_HASH"]}">'
                f'<meta name="nayanet-smart-note-count" content="9">')
          scripts=''.join(f'<script src="{x}"></script>' for x in ['/naya-509-aaa.js','/naya-509-next-level.js','/naya-509-smart-feed-c3.js','/naya-509-intelligent-board-c4.js','/naya-509-c4-unified-board-repair.js','/naya-509-c4-single-board-runtime-repair.js','/naya-509-c4-love-like-personal-polish.js','/naya-509-real-smart-feed-content.js','/naya-509-real-smart-feed-distillation.js'])
          p.write_text(s.replace('</head>',meta+scripts+'</head>',1),encoding='utf-8')
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const spa=u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/');const r=spa?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Canonical-Source','509-AAA-GITHUB-DRAFT');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);h.set('X-NayaNET-Source-SHA256',env.SOURCE_HASH);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$GITHUB_SHA","SOURCE_HASH":"$SOURCE_HASH"}}
          EOF
      - name: Deploy exact 509 C4 release with distillation
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Verify exact public runtime metadata parity
        env:
          SOURCE_HASH: ${{ steps.build.outputs.SOURCE_HASH }}
          SMART_CONTENT_HASH: ${{ steps.build.outputs.SMART_CONTENT_HASH }}
          GENERATED_HASH: ${{ steps.build.outputs.GENERATED_HASH }}
          DISTILL_HASH: ${{ steps.build.outputs.DISTILL_HASH }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl -fsSL "$RUNTIME/?probe=$attempt&source=$GITHUB_SHA" -o /tmp/runtime.html || true
            curl -fsSL "$SMART_LINK?probe=$attempt&source=$GITHUB_SHA" -o /tmp/smart.html || true
            curl -fsSL "$RUNTIME/naya-509-real-smart-feed-content.js?probe=$attempt" -o /tmp/real.js || true
            curl -fsSL "$RUNTIME/naya-509-real-smart-feed-distillation.js?probe=$attempt" -o /tmp/distill.js || true
            commit=$(grep -o 'nayanet-source-commit" content="[^"]*"' /tmp/runtime.html|head -1|sed 's/.*content="//;s/"$//' || true)
            source=$(grep -o 'nayanet-source-sha256" content="[^"]*"' /tmp/runtime.html|head -1|sed 's/.*content="//;s/"$//' || true)
            content=$(grep -o 'nayanet-smart-feed-content-sha256" content="[^"]*"' /tmp/runtime.html|head -1|sed 's/.*content="//;s/"$//' || true)
            generated=$(grep -o 'nayanet-real-content-generated-sha256" content="[^"]*"' /tmp/runtime.html|head -1|sed 's/.*content="//;s/"$//' || true)
            distill=$(grep -o 'nayanet-real-content-distillation-sha256" content="[^"]*"' /tmp/runtime.html|head -1|sed 's/.*content="//;s/"$//' || true)
            count=$(grep -o 'nayanet-smart-note-count" content="[^"]*"' /tmp/runtime.html|head -1|sed 's/.*content="//;s/"$//' || true)
            notes=$(grep -o 'SMART NOTE [0-9][0-9]' /tmp/real.js|sort -u|wc -l|tr -d ' ')
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$source" = "$SOURCE_HASH" ] && [ "$content" = "$SMART_CONTENT_HASH" ] && [ "$generated" = "$GENERATED_HASH" ] && [ "$distill" = "$DISTILL_HASH" ] && [ "$count" = "9" ] && [ "$notes" -ge 9 ] && grep -Fq 'naya509-distill' /tmp/distill.js; then echo RUNTIME_PARITY=PASS SMART_NOTE_COUNT=9 DISTILLATION=PASS; exit 0; fi
            echo "ATTEMPT=$attempt COMMIT=$commit SOURCE=$source CONTENT=$content GENERATED=$generated DISTILL=$distill COUNT=$count NOTES=$notes"; sleep 5
          done
          echo RUNTIME_PARITY=FAIL; exit 1
