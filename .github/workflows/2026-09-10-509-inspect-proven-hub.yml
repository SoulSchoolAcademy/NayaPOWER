name: 2026-09-10 — 509 Inspect Proven Hub
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/2026-09-10-509-inspect-proven-hub.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect current and proven artifact signatures
        shell: bash
        run: |
          set -euo pipefail
          TARGET='2026 09 09 5:09 pm NayaNET HUB.html'
          PROVEN='262b2eae951d9dcd23d1095a804ce1a646b7693e'
          git fetch --no-tags origin "$PROVEN"
          git show "$PROVEN:$TARGET" > /tmp/proven.html
          python - <<'PY'
          from pathlib import Path
          import re
          for label,path in [('PROVEN','/tmp/proven.html'),('CURRENT','2026 09 09 5:09 pm NayaNET HUB.html')]:
              s=Path(path).read_text(encoding='utf-8')
              print(f'=== {label} ===')
              print('BYTES',len(s))
              for pat in ['Good afternoon','Good morning','Your intelligence has a place to come together','Your Intelligence Today','class="homeFeed"','intelligentBlock','intelligentFeedHead','nhAuthorityQuote','nhV11Today','naya509feed','NAYANET_509_INTELLIGENT_FEED_DIRECT_V2','COLLECT SOURCE','CAPTURE WEB','MATTERS','COMPOUND','WHAT LEARNS','DAILY INTELLIGENCE REPORT']:
                  hits=list(re.finditer(re.escape(pat),s,re.I))
                  print(pat, len(hits))
                  for h in hits[:3]:
                      a=max(0,h.start()-220); b=min(len(s),h.end()+420)
                      print('SNIP',re.sub(r'\s+',' ',s[a:b])[:700])
          PY
