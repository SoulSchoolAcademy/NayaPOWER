name: 2026-09-10 — 509 Finalize
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nayanet-509-intelligent-feed-v2.js'
      - '.github/workflows/2026-09-10-509-finalize.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/nayanet-509-intelligent-feed-v2.js'
      - '.github/workflows/2026-09-10-509-finalize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Remove unwanted 509 layer and force true widescreen Home
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 09 5:09 pm NayaNET HUB.html')
          s=p.read_text(encoding='utf-8')

          # Remove the injected 509 renderer and its styles. The 509 board copy is not
          # part of the approved Home content; it was a temporary diagnostic layer.
          for ident in ('NAYANET_509_INTELLIGENT_FEED_DIRECT_V2','n509-final-style'):
              s=re.sub(r'<(?:script|style)[^>]*id=["\']'+re.escape(ident)+r'["\'][^>]*>.*?</(?:script|style)>','',s,flags=re.S|re.I)

          # Remove any remaining literal 509 board container if present.
          s=re.sub(r'<div[^>]*id=["\']naya509feed["\'][^>]*>.*?</div>','',s,flags=re.S|re.I)

          # Remove the known naked Play Naya payload and any literal code containers.
          s=re.sub(r'\s*/\*\s*NayaNET V7 — surgical Play Naya polish layer\..*?(?=</body>)','\n',s,flags=re.S|re.I)
          s=re.sub(r'<(?:pre|code)\b[^>]*>.*?</(?:pre|code)>','',s,flags=re.S|re.I)

          # Remove legacy feed systems that can remount or recreate the unwanted board.
          legacy_patterns = [
              r'<!--\s*NAYANET SMART FEED MASTER V1\s*-->.*?<!--\s*NAYANET SMART FEED FORCE MOUNT V2\s*-->',
              r'<style id=["\']NAYANET-SMART-FEED-MASTER-V1["\'][^>]*>.*?</style>',
              r'<script id=["\']NAYANET-SMART-FEED-MASTER-V1-RUNTIME["\'][^>]*>.*?</script>',
              r'<style id=["\']NAYANET-SMART-FEED-FORCE-MOUNT-V2["\'][^>]*>.*?</style>',
              r'<script id=["\']NAYANET-SMART-FEED-FORCE-MOUNT-V2-RUNTIME["\'][^>]*>.*?</script>',
          ]
          for pat in legacy_patterns:
              s=re.sub(pat,'',s,flags=re.S|re.I)

          # Home must occupy the entire main content cell, exactly matching the width
          # of the top search/header area. No 40px desktop gutter and no side column.
          css='''<style id="nayanet-home-widescreen-fix">\n#page-home,#page-home .homeWorkspace,#page-home .homeFeed{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important;padding-left:0!important;padding-right:0!important;box-sizing:border-box!important}\n#page-home .homeWorkspace{display:block!important;grid-template-columns:none!important;gap:0!important}\n#page-home .activationRail{display:none!important}\n#page-home .intelligentFeed{width:100%!important;max-width:none!important;margin:0!important}\n@media(min-width:901px){.main{width:100%!important;max-width:none!important;margin:0!important;padding-left:0!important;padding-right:0!important}.topbar{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important}.page{width:100%!important;max-width:none!important}}\n</style>\n'''
          # Replace prior fix so repeated workflow runs remain deterministic.
          s=re.sub(r'<style id="nayanet-home-widescreen-fix">.*?</style>\s*','',s,flags=re.S|re.I)
          s=s.replace('</body>',css+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exact cleanup and widescreen contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V2' '2026 09 09 5:09 pm NayaNET HUB.html'
          ! grep -q 'n509-final-style' '2026 09 09 5:09 pm NayaNET HUB.html'
          ! grep -q 'naya509feed' '2026 09 09 5:09 pm NayaNET HUB.html'
          ! grep -q 'NAYANET-SMART-FEED-MASTER-V1' '2026 09 09 5:09 pm NayaNET HUB.html'
          ! grep -q 'NAYANET-SMART-FEED-FORCE-MOUNT-V2' '2026 09 09 5:09 pm NayaNET HUB.html'
          ! grep -q 'surgical Play Naya polish layer' '2026 09 09 5:09 pm NayaNET HUB.html'
          ! grep -qi '<pre\b' '2026 09 09 5:09 pm NayaNET HUB.html'
          ! grep -qi '<code\b' '2026 09 09 5:09 pm NayaNET HUB.html'
          grep -q 'nayanet-home-widescreen-fix' '2026 09 09 5:09 pm NayaNET HUB.html'
          grep -q 'padding-left:0!important;padding-right:0!important' '2026 09 09 5:09 pm NayaNET HUB.html'
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add -- '2026 09 09 5:09 pm NayaNET HUB.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(509): make Home content truly edge-to-edge'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
