name: 2026-09-10 — 509 Finalize
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nayanet-509-intelligent-feed-v2.js'
      - '.github/workflows/2026-09-10-509-finalize.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/nayanet-509-intelligent-feed-v2.js'
      - '.github/workflows/2026-09-10-509-finalize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Remove unwanted 509 layer and make only the Home feed edge-to-edge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 09 5:09 pm NayaNET HUB.html')
          s=p.read_text(encoding='utf-8')
          for ident in ('NAYANET_509_INTELLIGENT_FEED_DIRECT_V2','n509-final-style'):
              s=re.sub(r'<(?:script|style)[^>]*id=["\']'+re.escape(ident)+r'["\'][^>]*>.*?</(?:script|style)>','',s,flags=re.S|re.I)
          s=re.sub(r'<div[^>]*id=["\']naya509feed["\'][^>]*>.*?</div>','',s,flags=re.S|re.I)
          s=re.sub(r'\s*/\*\s*NayaNET V7 — surgical Play Naya polish layer\..*?(?=</body>)','\n',s,flags=re.S|re.I)
          s=re.sub(r'<(?:pre|code)\b[^>]*>.*?</(?:pre|code)>','',s,flags=re.S|re.I)
          legacy_patterns=[r'<!--\s*NAYANET SMART FEED MASTER V1\s*-->.*?<!--\s*NAYANET SMART FEED FORCE MOUNT V2\s*-->',r'<style id=["\']NAYANET-SMART-FEED-MASTER-V1["\'][^>]*>.*?</style>',r'<script id=["\']NAYANET-SMART-FEED-MASTER-V1-RUNTIME["\'][^>]*>.*?</script>',r'<style id=["\']NAYANET-SMART-FEED-FORCE-MOUNT-V2["\'][^>]*>.*?</style>',r'<script id=["\']NAYANET-SMART-FEED-FORCE-MOUNT-V2-RUNTIME["\'][^>]*>.*?</script>']
          for pat in legacy_patterns: s=re.sub(pat,'',s,flags=re.S|re.I)
          css='''<style id="nayanet-home-widescreen-fix">
#page-home,#page-home *{box-sizing:border-box}
/* Preserve the approved Home shell/banner width. Only the actual feed breaks out. */
#page-home .homeFeed{width:100%!important;max-width:none!important;min-width:0!important;margin-left:0!important;margin-right:0!important}
#page-home .homeFeed .intelligentFeed{width:100%!important;max-width:none!important;min-width:0!important;margin-left:0!important;margin-right:0!important}
@media(min-width:901px){
  .main{min-width:0!important;padding:0 40px 100px!important}
  .topbar{width:auto!important;max-width:none!important;margin-left:0!important;margin-right:0!important}
  #page-home{width:auto!important;max-width:none!important;min-width:0!important;margin:0!important;padding:34px 0 100px!important}
  #page-home .homeFeed{width:calc(100% + 80px)!important;max-width:none!important;margin-left:-40px!important;margin-right:-40px!important;padding-left:0!important;padding-right:0!important}
  #page-home .homeFeed .intelligentFeed{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important}
}
@media(max-width:900px){
  #page-home .homeFeed{width:100vw!important;max-width:100vw!important;margin-left:calc(50% - 50vw)!important;margin-right:calc(50% - 50vw)!important;padding-left:0!important;padding-right:0!important}
  #page-home .homeFeed .intelligentFeed{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important}
}
</style>
'''
          s=re.sub(r'<style id="nayanet-home-widescreen-fix">.*?</style>\s*','',s,flags=re.S|re.I)
          s=s.replace('</body>',css+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exact cleanup and feed-only widescreen contract
        shell: bash
        run: |
          set -euo pipefail
          f='2026 09 09 5:09 pm NayaNET HUB.html'
          ! grep -q 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V2' "$f"
          ! grep -q 'n509-final-style' "$f"
          ! grep -q 'naya509feed' "$f"
          ! grep -q 'NAYANET-SMART-FEED-MASTER-V1' "$f"
          ! grep -q 'NAYANET-SMART-FEED-FORCE-MOUNT-V2' "$f"
          ! grep -q 'surgical Play Naya polish layer' "$f"
          ! grep -qi '<pre\b' "$f"
          ! grep -qi '<code\b' "$f"
          grep -q 'nayanet-home-widescreen-fix' "$f"
          grep -q 'width:calc(100% + 80px)' "$f"
          grep -q 'margin-left:-40px' "$f"
          grep -q 'width:100vw' "$f"
          grep -q 'padding:0 40px 100px' "$f"
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add -- '2026 09 09 5:09 pm NayaNET HUB.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(509): make only Home feed edge-to-edge'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
