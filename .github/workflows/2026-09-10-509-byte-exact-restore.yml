name: 2026-09-10 — 509 Byte-Exact Known-Good Restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/2026-09-10-509-byte-exact-restore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore exact known-good Hub artifact
        shell: bash
        run: |
          set -euo pipefail
          TARGET='2026 09 09 5:09 pm NayaNET HUB.html'
          PROVEN='262b2eae951d9dcd23d1095a804ce1a646b7693e'
          git fetch --no-tags origin "$PROVEN"
          PROVEN_BLOB="$(git rev-parse "$PROVEN:$TARGET")"
          git restore --source="$PROVEN" -- "$TARGET"
          CURRENT_BLOB="$(git hash-object "$TARGET")"
          test "$CURRENT_BLOB" = "$PROVEN_BLOB"
          echo "PROVEN_BLOB=$PROVEN_BLOB"
          echo "CURRENT_BLOB=$CURRENT_BLOB"
          echo '509_BYTE_EXACT_RESTORE=PASS'
      - name: Verify duplicate welcome is absent and original shell is preserved
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('2026 09 09 5:09 pm NayaNET HUB.html').read_text(encoding='utf-8')
          visible=re.split(r'<script\b[^>]*>.*?</script>',s,flags=re.S|re.I)
          visible='\n'.join(visible[::2])
          for marker in ('<div class="app">','class="sidebar"','class="topbar"','id="page-home"','class="homeWorkspace"','class="homeFeed"'):
              assert marker.lower() in s.lower(), marker
          assert 'naya509feed' not in s
          assert 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V2' not in s
          assert not re.search(r'Good\s+morning,\s+(?:Shawn|Sean)',visible,re.I)
          print('509_PRIMARY_WELCOME_CLEAN=PASS')
          print('509_PROVEN_HUB_SHELL=PASS')
          print('509_BAD_V7_RENDERER=ABSENT')
          PY
      - name: Commit exact restored target and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add -- '2026 09 09 5:09 pm NayaNET HUB.html'
          git rm --ignore-unmatch .github/workflows/2026-09-10-509-byte-exact-restore.yml
          git commit -m 'fix(509): restore exact known-good Hub artifact'
          git push origin main
