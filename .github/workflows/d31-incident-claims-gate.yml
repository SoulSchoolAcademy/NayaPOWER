name: d31-incident-claims-gate

# WIRE lane (Naya 2): D31 causal uncertainty without false blame, wired to
# the drift-canary governance path.
#
# Every registered incident-representation claim is cold-judged against the
# REAL IncidentAnalyzer (incident rebuilt from serialized bytes through the
# deserialization seam, exactly as a cold successor would). A claim the D31
# uncertainty law refuses turns this check red and blocks the PR. Zero live
# scenarios = explicit DORMANT. The forbidden collapse - a single
# failure_reason field - is a structural VIOLATION.
#
# Exit contract: 0 PASS / 0 DORMANT / 1 VIOLATION (block) / 2 BROKEN
# (fail-closed: manifest corrupt, mechanism missing/tampered, canary fail).

on:
  pull_request:
    paths:
      - "drift_canary/d31_incident.py"
      - "drift_canary/tests/test_d31_incident.py"
      - "tools/d31_incident_claims_gate.py"
      - "tools/d31_incident_claims_manifest.json"
      - "tests/test_d31_incident_claims_gate.py"
      - ".github/workflows/d31-incident-claims-gate.yml"
  push:
    branches: [main]
    paths:
      - "drift_canary/d31_incident.py"
      - "drift_canary/tests/test_d31_incident.py"
      - "tools/d31_incident_claims_gate.py"
      - "tools/d31_incident_claims_manifest.json"
      - "tests/test_d31_incident_claims_gate.py"
      - ".github/workflows/d31-incident-claims-gate.yml"

permissions:
  contents: read

jobs:
  d31-incident-claims-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bare setup-python images do not always carry pytest; install it
      # explicitly (same lesson as the sibling mechanism and wire gates).
      - name: Install pytest
        run: python -m pip install pytest

      - name: Gate unit tests (incl. sabotage negative controls)
        run: python -m pytest tests/test_d31_incident_claims_gate.py -q -p no:cacheprovider

      - name: Mechanism suite on the live tree
        run: python -m pytest drift_canary/tests/test_d31_incident.py -q -p no:cacheprovider

      - name: D31 incident-representation claims gate
        run: python tools/d31_incident_claims_gate.py
