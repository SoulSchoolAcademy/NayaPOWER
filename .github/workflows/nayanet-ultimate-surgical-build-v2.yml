name: NayaNET Ultimate Surgical Build v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[nayanet-ultimate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical evolution of 5:09
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          p=Path('2026 09 09 5:09 pm NayaNET HUB')
          r=Path('2026 09 09 511 pm NayaNET HUB')
          b=Path('.naya/backups/2026-09-09-ultimate-prechange-5-09.html')
          if not p.exists() or not r.exists(): raise SystemExit('Required Hub sources missing')
          b.parent.mkdir(parents=True,exist_ok=True)
          if not b.exists(): shutil.copy2(p,b)
          s=p.read_text(encoding='utf-8')
          ref=r.read_text(encoding='utf-8')
          if 'id="nayanet-ultimate-feed"' in s: raise SystemExit('Already evolved; refusing duplicate patch')
          if not any(x in ref.lower() for x in ('smart feed','activity','collective','intelligent')): raise SystemExit('5:11 feed reference check failed')
          css='''<style id="nayanet-ultimate-feed-css">#nayanet-ultimate-feed{margin:22px 0;border:1px solid #ffffff18;border-radius:26px;background:linear-gradient(145deg,#14141b,#08080c);box-shadow:inset 0 1px #fff3,0 24px 60px #0009;overflow:hidden}#nayanet-ultimate-feed .uhead{padding:22px;border-bottom:1px solid #ffffff12}#nayanet-ultimate-feed h2{margin:6px 0;font-size:clamp(28px,4vw,46px);letter-spacing:-.055em}#nayanet-ultimate-feed .uk{font-size:8px;letter-spacing:.18em;color:#a49daa;font-weight:900}#nayanet-ultimate-feed .us{font-size:11px;line-height:1.55;color:#c8c2cd;max-width:760px}#nayanet-ultimate-feed .uct{display:flex;gap:7px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid #ffffff10;background:#09090d}#nayanet-ultimate-feed button{min-height:38px;border:1px solid #ffffff1b;border-radius:10px;background:#111118;color:#bcb6c3;padding:0 11px;font-size:8px;font-weight:900}#nayanet-ultimate-feed button[aria-pressed=true]{color:#fff;border-color:#d86cff70;background:#d86cff0c}#nayanet-ultimate-feed .ufeed{display:grid;gap:14px;padding:18px 22px 24px}#nayanet-ultimate-feed article{border:1px solid #ffffff18;border-radius:20px;background:linear-gradient(145deg,#16161d,#09090d);overflow:hidden;box-shadow:inset 0 1px #fff3,0 18px 42px #0009}#nayanet-ultimate-feed .ui{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid #ffffff10}#nayanet-ultimate-feed .ui small{display:block;color:#817b89;font-size:7px;margin-top:3px}#nayanet-ultimate-feed .ut{padding:4px 8px;border:1px solid #55b9ee30;border-radius:999px;color:#bfe8ff;font-size:7px;font-weight:900;height:max-content}#nayanet-ultimate-feed .ub{padding:17px}#nayanet-ultimate-feed .nuts{font-size:19px;line-height:1.2;margin:0 0 12px}#nayanet-ultimate-feed .ps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}#nayanet-ultimate-feed .p{padding:10px;border:1px solid #ffffff12;border-radius:11px;background:#08080c;min-height:88px}#nayanet-ultimate-feed .p b{display:block;font-size:7px;margin-bottom:6px}.h b{color:#d86cff}.c b{color:#6675ff}.g b{color:#8790ff}.n b{color:#55b9ee}.m b{color:#55e39a}#nayanet-ultimate-feed .p span{font-size:9px;line-height:1.45;color:#beb8c4}#nayanet-ultimate-feed .deep{display:none;margin-top:12px;border-top:1px solid #ffffff10;padding-top:12px}.open .deep{display:block}#nayanet-ultimate-feed .deep div{padding:8px 0;color:#c9c3cf;font-size:9px;line-height:1.5}.deep b{display:block;color:#918b98;font-size:7px;letter-spacing:.1em;margin-bottom:3px}#nayanet-ultimate-feed .ua{display:flex;gap:6px;flex-wrap:wrap;padding:11px 16px;border-top:1px solid #ffffff10;background:#08080c}#nayanet-ultimate-feed .state{margin-left:auto;color:#8e8895;font-size:7px;padding:8px}#nayanet-ultimate-feed .state.ok{color:#bfffd8}@media(max-width:900px){#nayanet-ultimate-feed .ps{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){#nayanet-ultimate-feed .ps{grid-template-columns:1fr}#nayanet-ultimate-feed .ufeed{padding:12px}#nayanet-ultimate-feed .uhead,#nayanet-ultimate-feed .uct{padding-left:14px;padding-right:14px}}@media(prefers-reduced-motion:reduce){#nayanet-ultimate-feed *{scroll-behavior:auto!important;transition:none!important}}</style>'''
          js='''<script id="nayanet-ultimate-feed-js">(()=>{const S={lens:'ACTIVITY',mode:'SKIM',events:[{id:'01',type:'LESSON',actor:'Naya',text:'Useful intelligence becomes more valuable when it can be found, trusted, connected, and used again.',h:'Save what matters so I can use it later.',c:'Keep the smart thing.',g:'A lesson kept can help someone twice.',n:'Persistence plus relationships create compounding leverage.',m:'Canonical event → feed projection → one renderer.',meaning:'The unit of value is the intelligence event—not the post.',rel:'leads to · discovery'},{id:'02',type:'DISCOVERY',actor:'Shawn + Naya',text:'Protect the proven 5:09 house and bring the strongest 5:11 feed concepts into it.',h:'Keep what works; improve what matters.',c:'Do not tear down the house.',g:'Good builders respect the foundation.',n:'Surgical evolution preserves proven behavior while deepening intelligence.',m:'Source parity must precede release claims.',meaning:'Architecture should become more canonical without wholesale destruction.',rel:'supports · lesson'},{id:'03',type:'VERIFIED RULE',actor:'NayaNET Standard',text:'Every action is a promise: its visible state must come from actual system state.',h:'I should know whether it actually happened.',c:'The button tells the truth.',g:'Never promise what you cannot prove.',n:'Fixture behavior must never masquerade as production persistence.',m:'IDLE → ACTIVE → PERSISTING → SUCCESS; or truthful terminal failure.',meaning:'Trust is a product capability.',rel:'verified by · evidence'}]};const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(e){let open=S.mode!=='SKIM';return `<article data-id="${e.id}" class="${open?'open':''}"><div class="ui"><div><b>${esc(e.actor)}</b><small>canonical intelligence event · ${esc(e.type)}</small></div><span class="ut">${esc(e.type)}</span></div><div class="ub"><h3 class="nuts">${esc(e.text)}</h3><div class="ps"><div class="p h"><b>HUMAN</b><span>${esc(e.h)}</span></div><div class="p c"><b>CHILD</b><span>${esc(e.c)}</span></div><div class="p g"><b>GRANDMA</b><span>${esc(e.g)}</span></div><div class="p n"><b>NAYA</b><span>${esc(e.n)}</span></div><div class="p m"><b>MACHINE</b><span>${esc(e.m)}</span></div></div><div class="deep"><div><b>MEANING</b>${esc(e.meaning)}</div><div><b>RELATED INTELLIGENCE</b>${esc(e.rel)}</div><div><b>PROVENANCE</b>Design-standard fixture · truth state is explicitly local fixture</div></div></div><div class="ua"><button data-a="open">${open?'Collapse':'Understand'}</button><button data-a="save">Save</button><button data-a="share">Share</button><button data-a="space">Create Smart Space</button><span class="state">READY · LOCAL FIXTURE</span></div></article>`}function render(){const root=document.querySelector('#nayanet-ultimate-feed');if(!root)return;root.querySelector('.ufeed').innerHTML=S.events.map(card).join('');root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const c=b.closest('article'),a=b.dataset.a;if(a==='open'){c.classList.toggle('open');b.textContent=c.classList.contains('open')?'Collapse':'Understand';return}const st=c.querySelector('.state');st.textContent='ACTIVE';setTimeout(()=>{st.textContent='PERSISTING';setTimeout(()=>{st.textContent='SUCCESS · LOCAL FIXTURE';st.classList.add('ok')},220)},160)});root.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lens=b.dataset.l;root.querySelectorAll('[data-l]').forEach(x=>x.setAttribute('aria-pressed',x===b));});root.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;root.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()})}function mount(){if(document.querySelector('#nayanet-ultimate-feed'))return;const home=document.querySelector('#home,.page.active')||document.body;const x=document.createElement('section');x.id='nayanet-ultimate-feed';x.innerHTML=`<div class="uhead"><div class="uk">NAYANET · CANONICAL INTELLIGENCE PROJECTION</div><h2>Living Intelligence</h2><div class="us">One canonical event model. One Intelligent Block language. Many lenses. The feed is a projection of intelligence—not a second memory system.</div></div><div class="uct"><button data-l="ACTIVITY" aria-pressed="true">Activity</button><button data-l="PERSONAL" aria-pressed="false">Personal</button><button data-l="COLLECTIVE" aria-pressed="false">Collective</button><button data-m="SKIM" aria-pressed="true">Skim</button><button data-m="LEARN" aria-pressed="false">Learn</button><button data-m="VERIFY" aria-pressed="false">Verify</button><button data-m="OPERATE" aria-pressed="false">Operate</button><button data-m="EXPLORE" aria-pressed="false">Explore</button><button data-m="TEACH" aria-pressed="false">Teach</button></div><div class="ufeed"></div></section>`;home.insertBefore(x,home.firstChild);render()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount()})();</script>'''
          patch='<!-- NAYANET ULTIMATE SURGICAL LAYER: 5:09 HOUSE + 5:11 FEED CONCEPTS -->\n'+css+'\n'+js
          if '</body>' not in s: raise SystemExit('No closing body; refusing rewrite')
          out=s.replace('</body>',patch+'\n</body>',1)
          if len(out)<len(s)*.95: raise SystemExit('Source shrink gate failed')
          p.write_text(out,encoding='utf-8')
          print('BUILT',len(out))
          PY
      - name: Verify release gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('2026 09 09 5:09 pm NayaNET HUB').read_text(encoding='utf-8')
          for x in ['nayanet-ultimate-feed','Living Intelligence','ACTIVITY','PERSONAL','COLLECTIVE','SKIM','LEARN','VERIFY','OPERATE','EXPLORE','TEACH','LOCAL FIXTURE','prefers-reduced-motion']:
              assert x in s, x
          assert s.count('<html')==1 and s.count('</html>')==1
          print('SOURCE + FEATURE GATE PASS')
          PY
      - name: Commit result
        run: |
          git config user.name 'NayaNET Surgical Builder'
          git config user.email 'actions@nayanet.local'
          git add '2026 09 09 5:09 pm NayaNET HUB' '.naya/backups/2026-09-09-ultimate-prechange-5-09.html'
          git commit -m '[nayanet-ultimate] evolve 5:09 canonical hub with intelligent feed'
          git push
