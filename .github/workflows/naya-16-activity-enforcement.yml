name: Naya 16 Activity Enforcement

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/**'
      - 'SUPERBRAIN/**'
      - '.naya/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY-FEED.md'
  pull_request:
    branches: [main]
    paths:
      - 'NAYANET/**'
      - 'SUPERBRAIN/**'
      - '.naya/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY/**'
      - '!SUPERBRAIN/NAYA-ACTIVITY-FEED.md'

permissions:
  contents: read

jobs:
  naya16:
    name: Enforce Naya 16 activity record
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Naya 16 validator
        run: python tests/verify_naya16_activity.py --before HEAD^ --after HEAD
      - name: Run validator negative-path self-check
        run: python tests/verify_naya16_activity.py --negative-test
