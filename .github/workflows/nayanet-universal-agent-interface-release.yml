name: NAYA — Universal Agent Interface Release

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit authorization to deploy the Universal Agent Interface
        required: true
        type: string
      reason:
        description: Why this release is authorized
        required: true
        type: string
      source_ref:
        description: Exact source ref or commit to deploy
        required: true
        default: main
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      AGENT_BASE_URL: https://nayanet-universal-agent-interface.smartnetpodcast.workers.dev
      NAYANET_FROZEN_LEARNING_ACCESS_TOKEN: ${{ secrets.NAYANET_FROZEN_LEARNING_ACCESS_TOKEN }}
    steps:
      - name: Require explicit deployment authorization
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "${APPROVAL}" = "EXPLICIT_APPROVAL_GRANTED"
          test -n "${REASON}"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve canonical runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s assistant-runtime.js
          SUPABASE_URL="$(sed -n "s/.*const URL='\\([^']*\\)'.*/\\1/p" assistant-runtime.js | head -n1)"
          SUPABASE_ANON_KEY="$(sed -n "s/.*KEY='\\([^']*\\)'.*/\\1/p" assistant-runtime.js | head -n1)"
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_ANON_KEY}"
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          } >> "${GITHUB_ENV}"

      - name: Validate canonical adapter source
        shell: bash
        run: |
          set -euo pipefail
          test -s NAYANET/UNIVERSAL-AGENT-INTERFACE/worker.js
          test -s NAYANET/UNIVERSAL-AGENT-INTERFACE/openapi.yaml
          grep -q "nayanet-compound-intelligence" NAYANET/UNIVERSAL-AGENT-INTERFACE/worker.js
          grep -q "/mcp" NAYANET/UNIVERSAL-AGENT-INTERFACE/worker.js
          grep -q "/v1/retrieve" NAYANET/UNIVERSAL-AGENT-INTERFACE/openapi.yaml
          grep -q "nayanet-universal-agent-interface.smartnetpodcast.workers.dev" NAYANET/UNIVERSAL-AGENT-INTERFACE/openapi.yaml
          grep -q "url.pathname==='/health'" NAYANET/UNIVERSAL-AGENT-INTERFACE/worker.js
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_ANON_KEY}"
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Write Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nayanet-universal-agent-interface",
            "main": "NAYANET/UNIVERSAL-AGENT-INTERFACE/worker.js",
            "compatibility_date": "2026-09-21",
            "account_id": "b5e2a51b3e883f7722287c5f51b1196b"
          }
          EOF

      - name: Bind canonical runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_ANON_KEY}"
          printf '%s' "${SUPABASE_ANON_KEY}" | npx --yes wrangler@4 secret put SUPABASE_ANON_KEY --name nayanet-universal-agent-interface
          npx --yes wrangler@4 deploy --var "SUPABASE_URL:${SUPABASE_URL}"

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "${AGENT_BASE_URL}/health" | grep -q '"canonical":true'; then
              echo "UNIVERSAL_AGENT_INTERFACE_HEALTH_VERIFIED"
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Verify unauthorized fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/unauthorized.json --write-out '%{http_code}' -X POST "${AGENT_BASE_URL}/v1/restore" -H 'Content-Type: application/json' -d '{}')
          test "${status}" = "401"
          grep -q 'AUTHORIZATION_REQUIRED' /tmp/unauthorized.json
          echo "UNAUTHORIZED_RESTORE_REJECTED"

      - name: Verify MCP surface without credentials
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/mcp.json --write-out '%{http_code}' -X POST "${AGENT_BASE_URL}/mcp" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}')
          test "${status}" = "401"
          grep -q 'AUTHORIZATION_REQUIRED' /tmp/mcp.json
          echo "MCP_UNAUTHORIZED_REJECTED"

      - name: Verify authenticated MCP contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NAYANET_FROZEN_LEARNING_ACCESS_TOKEN}"
          auth=(-H "Authorization: Bearer ${NAYANET_FROZEN_LEARNING_ACCESS_TOKEN}" -H 'Content-Type: application/json')
          init_status=$(curl --silent --output /tmp/mcp_init.json --write-out '%{http_code}' -X POST "${AGENT_BASE_URL}/mcp" "${auth[@]}" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}')
          test "${init_status}" = "200"
          grep -q 'nayanet-universal-agent-interface' /tmp/mcp_init.json
          list_status=$(curl --silent --output /tmp/mcp_list.json --write-out '%{http_code}' -X POST "${AGENT_BASE_URL}/mcp" "${auth[@]}" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          test "${list_status}" = "200"
          grep -q 'nayanet_restore' /tmp/mcp_list.json
          grep -q 'nayanet_retrieve' /tmp/mcp_list.json
          restore_status=$(curl --silent --output /tmp/mcp_restore.json --write-out '%{http_code}' -X POST "${AGENT_BASE_URL}/mcp" "${auth[@]}" -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"nayanet_restore","arguments":{}}}')
          test "${restore_status}" = "200"
          grep -q '"ok":true' /tmp/mcp_restore.json
          retrieve_status=$(curl --silent --output /tmp/mcp_retrieve.json --write-out '%{http_code}' -X POST "${AGENT_BASE_URL}/mcp" "${auth[@]}" -d '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"nayanet_retrieve","arguments":{"query":"NayaNET","limit":3}}}')
          test "${retrieve_status}" = "200"
          grep -q '"ok":true' /tmp/mcp_retrieve.json
          echo "MCP_AUTHENTICATED_CONTRACT_VERIFIED"
