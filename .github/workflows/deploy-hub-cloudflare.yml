name: Deploy Hub to Cloudflare

# AUTO-DEPLOY (Shawn, 2026-10-17 — standing law): the Hub deploys automatically.
# No human approval, no manual dispatch, no blockers. The SCORE is the gate:
# only work that scored 9+ merges to main (the merge gates enforce it), and
# what lands on main ships. We unblock; we don't block.

on:
  push:
    branches: [main]
    paths:
      - "HUB/**"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Hub worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HUB
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate wrangler config
        run: |
          node --check hub-worker.js
          npx -y wrangler@latest --version

      - name: Deploy to Cloudflare Workers
        run: npx -y wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is an identifier, not a secret (visible in dash URL).
          CLOUDFLARE_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b

      - name: Health check the deployment
        run: |
          sleep 10
          curl -sf -o /dev/null --max-time 20 https://nayanet.live/ \
            && echo "HEALTHY: nayanet.live responds" \
            || { echo "health check failed"; exit 1; }

      - name: Record deploy receipt
        run: |
          echo "Deployed ${{ github.sha }} to hub worker at $(date -u +%FT%TZ)" \
            >> "$GITHUB_STEP_SUMMARY"
