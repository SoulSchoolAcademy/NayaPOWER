name: Deploy Hub to Cloudflare

# PROTECTED GATE: production deploy. This workflow does NOT run on push.
# It runs only by manual dispatch with an exact 40-char commit SHA, inside
# the assistant-cloudflare-production environment. Shawn's approval is the
# deploy authority — the environment's protection rules enforce it.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact commit SHA to deploy (40-char hex)"
        required: true
      reason:
        description: "Why this deploy (receipt link or board comment URL)"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Hub worker
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    defaults:
      run:
        working-directory: HUB
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate SHA is 40-char hex
        run: |
          if ! [[ "${{ inputs.sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a 40-char hex commit SHA"; exit 1
          fi
          git cat-file -e "${{ inputs.sha }}^{commit}" || { echo "SHA not found"; exit 1; }

      - name: Validate wrangler config
        run: |
          node --check hub-worker.js
          npx -y wrangler@latest --version

      - name: Deploy to Cloudflare Workers
        run: npx -y wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is an identifier, not a secret (visible in dash URL).
          CLOUDFLARE_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b

      - name: Health check the deployment
        run: |
          sleep 10
          curl -sf -o /dev/null --max-time 20 https://nayanet.live/ \
            && echo "HEALTHY: nayanet.live responds" \
            || { echo "health check failed"; exit 1; }
