name: Current Truth Resolver

on:
  workflow_dispatch:
  # Daily cold-truth pulse. Scheduled evidence collection must remain read-only:
  # it resolves current truth and publishes artifacts; it does not deploy,
  # promote learning, or create authority.
  schedule:
    - cron: "17 15 * * *"
  push:
    branches: [main]
    paths:
      - "BRAIN/**"
      - "NAYANODE/0014-CURRENT-REALITY-CONTRACT-V1.md"
      - "tools/current_truth_resolver.py"
      - ".github/workflows/current-truth-resolver.yml"

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  resolve-current-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect live GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(".")
          repo = os.environ["REPO"]
          ops = json.loads((root / "BRAIN/90-OPERATIONS/0003-ULTIMATE-MASTER-EXECUTION-PLAN-V1.json").read_text())
          brain = json.loads((root / "BRAIN/NAYAPOWER-BRAIN-INDEX.json").read_text())

          def out(*args):
              return subprocess.check_output(args, text=True).strip()

          main_head = json.loads(out("gh", "api", f"repos/{repo}/branches/main"))["commit"]["sha"]
          production = json.loads(out("gh", "api", f"repos/{repo}/branches/production"))["commit"]["sha"]

          issue_ids = {str(brain["operations"]["active_issue"])}
          for item in ops.get("top_10", []):
              value = str(item.get("id") or "")
              if value.startswith("#") and value[1:].isdigit():
                  issue_ids.add(value[1:])

          issue_states = {}
          for issue_id in sorted(issue_ids, key=int):
              payload = json.loads(out("gh", "api", f"repos/{repo}/issues/{issue_id}"))
              issue_states[issue_id] = payload["state"].upper()

          prs = json.loads(out(
              "gh", "pr", "list",
              "--repo", repo,
              "--state", "open",
              "--limit", "100",
              "--json", "number,title,headRefOid,isDraft,mergeStateStatus,updatedAt",
          ))
          open_prs = [
              {
                  "number": p["number"],
                  "title": p["title"],
                  "head_sha": p["headRefOid"],
                  "draft": p.get("isDraft"),
                  "merge_state": p.get("mergeStateStatus"),
                  "updated_at": p.get("updatedAt"),
              }
              for p in prs
          ]

          runs_raw = out(
              "gh", "run", "list",
              "--workflow", "live-supabase-runtime-proof.yml",
              "--status", "success",
              "--limit", "1",
              "--json", "databaseId,headSha,attempt,conclusion,updatedAt",
          )
          runs = json.loads(runs_raw)
          latest = None
          if runs:
              r = runs[0]
              latest = {
                  "run_id": r["databaseId"],
                  "head_sha": r["headSha"],
                  "attempt": r.get("attempt"),
                  "conclusion": r.get("conclusion"),
                  "updated_at": r.get("updatedAt"),
              }

          evidence = {
              "main_head": main_head,
              "production_branch_head": production,
              "issue_states": issue_states,
              "open_prs": open_prs,
              "latest_successful_runtime_proof": latest,
              # Current runtime identity is intentionally UNKNOWN here. The existing
              # runtime OIDC boundary is not widened for this resolver.
              "live_runtime_source": None,
              "collector": "github-actions",
          }
          pathlib.Path("current-truth-live-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n"
          )
          PY

      - name: Resolve current truth
        shell: bash
        run: |
          set +e
          python tools/current_truth_resolver.py             --live-evidence current-truth-live-evidence.json             --output current-truth-resolution.json             --markdown-output current-truth-brief.md             --fail-on-conflict
          status=$?
          cat current-truth-resolution.json
          exit "$status"

      - name: Publish continuation brief to job summary
        if: always()
        shell: bash
        run: |
          if [ -f current-truth-brief.md ]; then
            cat current-truth-brief.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Current-truth brief was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-truth-resolution
          path: |
            current-truth-live-evidence.json
            current-truth-resolution.json
            current-truth-brief.md
