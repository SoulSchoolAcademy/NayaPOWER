name: 2026-09-08 Dispatch Live Hub After Architecture

on:
  workflow_run:
    workflows: ["Naya v3 Architecture Lock"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authoritative live Hub deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-v7-now.yml --ref main
