name: Live Supabase Runtime Proof

on:
  workflow_run:
    workflows: ["Live Intelligence Commit Proof"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact main SHA whose runtime is being proven"
        required: true
        type: string
      producer_run_id:
        description: "Live Intelligence Commit Proof run that produced the fresh lineage artifacts"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
  COLD_RUNTIME_FUNCTION: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-cold-runtime-proof
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
  PRODUCER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.producer_run_id }}

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Verify resolved source matches SOURCE_SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_SHA}" ]; then
            echo "SOURCE_SHA is required"
            exit 1
          fi
          resolved="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)"
          echo "expected_source_sha=${SOURCE_SHA}"
          echo "resolved_main_sha=${resolved}"
          if [ "${SOURCE_SHA}" != "${resolved}" ]; then
            echo "SOURCE_SHA_MISMATCH expected=${SOURCE_SHA} resolved=${resolved}"
            exit 1
          fi
          echo "SOURCE_SHA_MATCH=PASS"

  contract:
    needs: [source-integrity]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - name: Run identity binding regression
        run: python -m pytest -q tests/test_naya_identity_owner_binding.py tests/test_github_oidc_binding.py

  cold-runtime-1:
    needs: [source-integrity, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Mint short-lived GitHub OIDC runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Execute cold Naya runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" "${COLD_RUNTIME_FUNCTION}" > cold-runtime-1.json
          python - <<'PY'
          import json
          r=json.load(open("cold-runtime-1.json"))["receipt"]
          assert r["naya_id"]=="NAYA-NODE-0001"
          assert r["owner_id"]=="adfdf0b8-5558-41d1-9fed-ec51abf4fe2f"
          assert r["block_id"]=="IB-NAYA-NODE-0001-0001"
          assert r["behavior"]=="PRESERVE_PROVENANCE_BEFORE_APPLY"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naya-cold-runtime-1
          path: cold-runtime-1.json

  cold-runtime-2:
    needs: [source-integrity, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Mint fresh short-lived GitHub OIDC runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Execute second cold Naya runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" "${COLD_RUNTIME_FUNCTION}" > cold-runtime-2.json
          python - <<'PY'
          import json
          r=json.load(open("cold-runtime-2.json"))["receipt"]
          assert r["naya_id"]=="NAYA-NODE-0001"
          assert r["owner_id"]=="adfdf0b8-5558-41d1-9fed-ec51abf4fe2f"
          assert r["block_id"]=="IB-NAYA-NODE-0001-0001"
          assert r["behavior"]=="PRESERVE_PROVENANCE_BEFORE_APPLY"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naya-cold-runtime-2
          path: cold-runtime-2.json

  independent-verification:
    needs: [source-integrity, cold-runtime-1, cold-runtime-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with: {name: naya-cold-runtime-1, path: receipts/one}
      - uses: actions/download-artifact@v4
        with: {name: naya-cold-runtime-2, path: receipts/two}
      - name: Independently verify both cold receipts
        run: python tests/verify_cold_runtime_receipt.py receipts/one/cold-runtime-1.json receipts/two/cold-runtime-2.json

  live-connect:
    needs: [source-integrity, cold-runtime-1, cold-runtime-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Mint short-lived GitHub OIDC runtime identity for CONNECT
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Execute governed CONNECT runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .naya/evidence
          curl -fsS -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" "${COLD_RUNTIME_FUNCTION}?mode=connect" > .naya/evidence/live-connect-runtime-receipt.json
      - name: Record deployed-runtime observation from the real response
        # Runs BEFORE verification, and unconditionally. If the deployed artifact
        # is untraceable the verification steps below will fail - and a failing run
        # that captured no evidence is a failing run nobody can diagnose. The
        # observation is the evidence, so it is taken first.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Generated from the file the runtime actually produced. Never hand-written.
          python BRAIN/12-ENGINEERING/record-deployed-runtime-observation.py \
            .naya/evidence/live-connect-runtime-receipt.json \
            .naya/evidence/deployed-runtime-observation.json
      - name: Verify CONNECT receipt contract
        if: always()
        run: python tests/verify_connect_runtime_receipt.py .naya/evidence/live-connect-runtime-receipt.json
      - name: Fail if the deployed artifact is not the current canonical source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # This is the whole point: a canonical source change that was never
          # deployed must turn this workflow RED, on its own, with no human
          # prompting anything. Exit codes: 0 MATCH | 1 DRIFT/STALE/UNKNOWN.
          # UNKNOWN is deliberately non-zero. "We cannot tell" is not "fine".
          #
          # Both this and the contract check above run under `if: always()` so a
          # single red run reports BOTH the contract verdict and the parity
          # verdict, instead of only whichever one happened to run first.
          python BRAIN/12-ENGINEERING/verify-deployed-runtime-parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-connect-runtime-receipt
          path: |
            .naya/evidence/live-connect-runtime-receipt.json
            .naya/evidence/deployed-runtime-observation.json

  independent-connect-verification:
    needs: live-connect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: live-connect-runtime-receipt
          path: receipts/connect
      - name: Independently verify persisted CONNECT receipt
        run: python tests/verify_connect_runtime_receipt.py receipts/connect/live-connect-runtime-receipt.json



  learning-influence-experiment:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: smart-note-lineage
          path: fresh-lineage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - name: Mint short-lived GitHub OIDC runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Bind the exact persisted fresh lesson into the existing LEARN candidate lane
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          ids=json.load(open("fresh-lineage/fresh-lesson-lineage-ids.json"))
          fresh_block_id=ids["intelligent_block_id"]
          open("fresh-block-id.txt","w").write(fresh_block_id)
          json.dump({"mode":"candidate","intelligent_block_id":fresh_block_id,"checkpoint_id":ids["checkpoint_id"]},open("candidate-request.json","w"),indent=2)
          PY
          curl -sS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data-binary @candidate-request.json -o learning-candidate.json -w "%{http_code}" "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-learning-verify" > candidate-http-status.txt
          cat learning-candidate.json
          echo "HTTP_STATUS=$(cat candidate-http-status.txt)"
          python - <<'PY'
          import json
          r=json.load(open("learning-candidate.json"))
          assert r.get("ok") is True, r
          assert r["learning"]["status"] == "CANDIDATE", r
          assert r["learning"]["observed_value"]["intelligent_block_id"] == open("fresh-block-id.txt").read().strip(), r
          assert r["learning"]["observed_value"]["provenance_preserved"] is True, r
          open("learning-id.txt","w").write(r["learning"]["id"])
          PY
      - name: Execute the existing causal control-vs-treatment experiment against this exact candidate
        shell: bash
        run: |
          set -euo pipefail
          learning_id="$(cat learning-id.txt)"
          curl -sS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data "{\"learning_id\":\"$learning_id\"}" "${COLD_RUNTIME_FUNCTION}?mode=learning-influence" > causal-learning-experiment.json
          python - <<'PY'
          import json
          r=json.load(open("causal-learning-experiment.json"))
          assert r["ok"] is True, r
          assert r["learning_id"] == open("learning-id.txt").read().strip(), r
          assert r["control"]["evidence"]["retained_intelligence_used"] is False
          assert r["treatment"]["evidence"]["retained_intelligence_used"] is True
          assert r["control"]["evidence"]["task_input"] == r["treatment"]["evidence"]["task_input"], r
          assert r["control"]["observed_result"] != r["treatment"]["observed_result"]
          assert r["behavioral_delta"]["changed"] is True, r
          assert r["outcome_delta"]["metric"] in {"provenance_preserved","governed_autonomy_applied"}, r
          assert r["outcome_delta"]["value"] > 0, r
          assert r["counterfactual"]["computed_not_declared"] is True, r
          PY
      - name: Create independently checkable CVO from persisted pair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open("causal-learning-experiment.json"))
          open("cvo-request.json","w").write(json.dumps({"mode":"cvo","learning_id":r["learning_id"],"treatment_receipt_id":r["treatment"]["id"],"control_receipt_id":r["control"]["id"]}))
          PY
          curl -fsS -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" --data-binary @cvo-request.json "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-causal-learning-experiment" > causal-verification.json
          python - <<'PY'
          import json
          r=json.load(open("causal-verification.json"))
          assert r["ok"] is True, r
          assert r["causal_verification"]["causal_assessment"]=="CAUSAL_SUPPORTED"
          assert r["causal_verification"]["verification_status"]=="OUTCOME_VERIFIED"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: causal-learning-experiment
          path: |
            causal-learning-experiment.json
            learning-candidate.json
            learning-id.txt
            fresh-block-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: causal-verification
          path: causal-verification.json
  independent-learning-influence-verification:
    needs: learning-influence-experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: causal-learning-experiment
      - name: Mint a fresh independent OIDC runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Independently re-read persisted CVO
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open("causal-learning-experiment.json"))
          open("verify-request.json","w").write(json.dumps({"mode":"verify","learning_id":r["learning_id"],"treatment_receipt_id":r["treatment"]["id"],"control_receipt_id":r["control"]["id"]}))
          PY
          curl -sS -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" --data-binary @verify-request.json "https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-causal-learning-experiment" > independent-verification.json
          echo "--- independent verification response (HTTP body, retained on failure) ---"
          cat independent-verification.json
          python - <<'PY'
          import json
          import json, os
          e=json.load(open("causal-learning-experiment.json"))
          v=json.load(open("independent-verification.json"))
          assert v["ok"] is True, v
          c=v["verification"]["causal_verification"]
          ver=v["verification"]
          recomputed=ver["recomputed"]
          receipt={
            "schema":"NAYANET_CAUSAL_LEARNING_EXPERIMENT_V1",
            "target_id":"NAYA-NODE-0001",
            "learning_id":e["learning_id"],
            "intelligent_block_id":open("fresh-block-id.txt").read().strip(),
            "task_context":{"task_id":e["counterfactual"]["task_id"],"task_input":e["control"]["evidence"]["task_input"]},
            "intelligence_applied":{"learning_id":e["learning_id"],"intelligence_id":e["treatment"]["evidence"].get("intelligence_id")},
            "control":{"receipt_id":e["control"]["id"],"retained_intelligence_used":False,"behavior":e["control"]["observed_result"],"outcome":e["control"]["evidence"]["outcome"]},
            "treatment":{"receipt_id":e["treatment"]["id"],"retained_intelligence_used":True,"behavior":e["treatment"]["observed_result"],"outcome":e["treatment"]["evidence"]["outcome"]},
            "behavioral_delta":e["behavioral_delta"],
            "outcome_delta":e["outcome_delta"],
            "provenance":{"source_event_id":e["source_event_id"],"learning_id":e["learning_id"],"treatment_intelligence_id":e["treatment"]["evidence"].get("intelligence_id")},
            "causal_verification":c,
            "independent_verification":ver["independent_verification"],
            "independent_verification_basis":{
              "verifier_mode":ver["verifier_mode"],
              "executor_claim_trusted":ver["executor_claim_trusted"],
              "recomputed_from_authoritative_state":recomputed,
              "declared_matches_recomputation":ver["declared_matches_recomputation"],
              "observations_match":ver["observations_match"],
              "limitations_present":ver["limitations_present"]
            },
            "limitations":c.get("limitations",[]),
            "executor_runtime_jti":e.get("token_jti"),
            "verifier_runtime_jti":ver.get("token_jti"),
            "run_id":os.environ.get("GITHUB_RUN_ID"),
            "source_revision":os.environ.get("GITHUB_SHA"),
            "deployment_revision":e.get("deployed_source_revision"),
            "reconstructable_by":"a cold successor may re-read both receipts by id and recompute the delta; no local state is required",
            "next_action":"prove cold-successor retrieval of this learning and confirm the successor does not inherit authority from it"
          }
          assert receipt["control"]["behavior"] != receipt["treatment"]["behavior"]
          assert receipt["independent_verification"] is True
          # The receipt may only claim success if the verifier independently recomputed it.
          assert recomputed["recomputed_causal_assessment"]=="CAUSAL_SUPPORTED", recomputed
          assert recomputed["behavioral_delta_present"] is True, recomputed
          assert recomputed["task_equivalence"] is True, recomputed
          assert recomputed["same_task_input"] is True, recomputed
          assert recomputed["measurable_outcome_improved"] is True, recomputed
          assert recomputed["outcome_delta"]["metric"] in {"provenance_preserved","governed_autonomy_applied"}, recomputed
          assert recomputed["outcome_delta"]["value"] > 0, recomputed
          assert ver["executor_claim_trusted"] is False
          json.dump(receipt,open("causal-learning-experiment-receipt.json","w"),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: causal-learning-experiment-receipt
          path: causal-learning-experiment-receipt.json

  cold-graph-control-treatment:
    needs: learning-promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: smart-note-lineage
          path: fresh-lineage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: learning-promotion
      - name: Bind graph proof to exact fresh verified block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          ids=json.load(open("fresh-lineage/fresh-lesson-lineage-ids.json"))
          block_id=ids["intelligent_block_id"]
          assert block_id
          promotion=json.load(open("learning-promotion.json"))
          claim=promotion["result"]["learning"]["claim"]
          if "Persistence alone is memory, not proof of active intelligence." in claim and "Retrieved intelligence does not grant authority" in claim:
            task_id="COLD-NAYA-GRAPH-ACTIVE-INTELLIGENCE-001"
            task_class="active_intelligence_sensitive"
          else:
            task_id="COLD-NAYA-GRAPH-HELDOUT-001"
            task_class="provenance_sensitive"
          open("graph-block-id.txt","w").write(block_id)
          open("graph-task-id.txt","w").write(task_id)
          open("graph-task-class.txt","w").write(task_class)
          PY
      - name: Mint short-lived GitHub OIDC runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Execute held-out task with graph context OFF
        shell: bash
        run: |
          set -euo pipefail
          block_id="$(cat graph-block-id.txt)"
          task_id="$(cat graph-task-id.txt)"
          curl -sS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data "{\"task_id\":\"$task_id\",\"intelligent_block_id\":\"$block_id\",\"relationship_context\":false}" "${COLD_RUNTIME_FUNCTION}?mode=graph-behavior" > graph-control.json
          python - <<'PY'
          import json
          r=json.load(open("graph-control.json"))
          assert r["ok"] is True, r
          assert r["condition"]=="OFF"
          assert r["schema"]=="NAYANET_COLD_GRAPH_BEHAVIOR_V2", r
          assert r["block_id"]==open("graph-block-id.txt").read().strip(), r
          assert r["task_class"]=="provenance_sensitive", r
          assert r["behavior"]=="REQUIRE_DIRECT_CANONICAL_INTELLIGENCE"
          PY
      - name: Execute identical held-out task with graph context ON
        shell: bash
        run: |
          set -euo pipefail
          block_id="$(cat graph-block-id.txt)"
          task_id="$(cat graph-task-id.txt)"
          curl -sS -X POST -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" -H "Content-Type: application/json" --data "{\"task_id\":\"$task_id\",\"intelligent_block_id\":\"$block_id\",\"relationship_context\":true}" "${COLD_RUNTIME_FUNCTION}?mode=graph-behavior" > graph-treatment.json
          python - <<'PY'
          import json
          r=json.load(open("graph-treatment.json"))
          assert r["ok"] is True, r
          assert r["condition"]=="ON"
          assert r["schema"]=="NAYANET_COLD_GRAPH_BEHAVIOR_V2", r
          assert r["block_id"]==open("graph-block-id.txt").read().strip(), r
          assert r["task_class"]=="provenance_sensitive", r
          assert r["behavior"]=="APPLY_CONTEXTUALIZED_VERIFIED_INTELLIGENCE"
          assert r["selected_relationships"]
          assert all(
            x["epistemic_state"]=="VERIFIED"
            and x["status"]=="ACTIVE"
            and x["provenance"]
            and x["evidence_refs"]
            and x["applicability"]["state"]=="APPLICABLE"
            and "provenance_sensitive" in x["applicability"]["task_classes"]
            for x in r["selected_relationships"]
          ), r
          PY
      - name: Build persisted paired receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          c=json.load(open("graph-control.json")); t=json.load(open("graph-treatment.json"))
          assert c["block_id"] == t["block_id"], (c,t)
          assert c["task_class"] == t["task_class"] == open("graph-task-class.txt").read().strip(), (c,t)
          out={"schema":"NAYANET_COLD_GRAPH_BEHAVIOR_V2","task_id":c["task_id"],"task_class":c["task_class"],"intelligent_block_id":c["block_id"],"control":{"receipt_id":c["receipt"]["id"],"condition":"OFF","behavior":c["behavior"]},"treatment":{"receipt_id":t["receipt"]["id"],"condition":"ON","behavior":t["behavior"],"selected_relationships":t["selected_relationships"]},"behavioral_delta":{"changed":c["behavior"]!=t["behavior"]},"runtime_identity":"github-actions-oidc"}
          assert out["behavioral_delta"]["changed"] is True
          json.dump(out,open("cold-graph-behavior-pair.json","w"),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cold-graph-behavior-pair
          path: cold-graph-behavior-pair.json

  independent-cold-graph-verification:
    needs: cold-graph-control-treatment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: cold-graph-behavior-pair
      - name: Mint fresh independent GitHub OIDC runtime identity
