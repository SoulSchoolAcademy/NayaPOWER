name: Live Supabase Runtime Proof

on:
  push:
    branches:
      - "naya/runtime-connect-convergence-v1"

jobs:
  live-read-only-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_USER_ACCESS_TOKEN: ${{ secrets.SUPABASE_USER_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require protected live-proof credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_USER_ACCESS_TOKEN"
          test -n "$SUPABASE_API_KEY"
          echo "Protected Supabase proof environment is configured."
      - run: python -m pip install pytest
      - name: Run live authenticated read-only proof
        run: python -m pytest -q tests/test_live_supabase_intelligent_blocks.py
