        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Cold successor reconstructs from authoritative state only
        shell: bash
        run: |
          set -euo pipefail
          learning_id="$(python -c 'import json; print(json.load(open("causal-learning-experiment-receipt.json"))["learning_id"])')"
          curl -sS -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" "${COLD_RUNTIME_FUNCTION}?mode=cold-successor&learning_id=${learning_id}" > cold-successor.json
          cat cold-successor.json
          python - <<'PY'
          import json
          r=json.load(open("cold-successor.json"))
          assert r["ok"] is True, r
          # Reconstruction, not delivery.
          assert r["cold_start"]["intelligence_content_accepted_as_input"] is False, r
          assert r["cold_start"]["local_state_used"] is False, r
          assert r["cold_start"]["input_supplied_by_caller"] == "learning_id_only", r
          # Lineage actually reconstructed from durable state.
          assert r["reconstruction"]["intelligent_block_id"], r
          assert r["reconstruction"]["verified_relationship_count"] > 0, r
          # Material use of the retrieved intelligence.
          assert r["use"]["behavior_derived_from_retrieved_lesson"] == "PRESERVE_PROVENANCE_BEFORE_APPLY", r
          # NON-INHERITANCE: knowledge conferred no authority.
          ab = r["authority_boundary"]
          assert ab["authority_inherited"] is False, ab
          assert ab["knowledge_creates_authority"] is False, ab
          assert ab["successor_grant_count"] == 0, ab
          assert ab["consequential_actions_authorized"] is False, ab
          assert ab["executed"] is False, ab
          assert ab["blocked_by"] == "IDENTITY_SCOPE", ab
          assert r["rls_changed"] is False and r["credentials_committed"] is False, r
          json.dump(r, open("cold-successor-receipt.json","w"), indent=2)
      - uses: actions/upload-artifact@v4
        with:
          name: cold-successor-receipt
          path: cold-successor-receipt.json

