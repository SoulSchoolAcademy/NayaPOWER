name: Live Supabase Runtime Proof

on:
  push:
    branches:
      - "naya/node-genome-aaa-v1"
  workflow_dispatch:

jobs:
  live-proof:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_USER_ACCESS_TOKEN: ${{ secrets.SUPABASE_USER_ACCESS_TOKEN }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Require protected live-proof credentials
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_USER_ACCESS_TOKEN SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing protected secret::$name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - name: Run live canonical retrieval proof
        run: python -m pytest -q tests/test_live_supabase_intelligent_blocks.py
