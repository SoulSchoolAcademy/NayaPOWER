  cold-successor:
    # Depends only on live-connect, which proves the canonical block exists and is
    # owner-scoped. It deliberately does NOT depend on
    # independent-learning-influence-verification: that job needs a rotated owner
    # credential, and the cold-successor proof reads learning_evidence directly, so
    # gating on it would make this proof permanently unrunnable.
    needs: independent-retained-learning-reread
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
