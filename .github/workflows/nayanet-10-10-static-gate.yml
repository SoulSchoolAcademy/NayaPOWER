name: NayaNET 10-10 Static Gate

on:
  push:
    paths:
      - 'NAYANET/HUB/**'
      - 'scripts/nayanet-cognitive-engine.js'
      - 'scripts/nayanet-hub-intelligence-layer.js'
      - 'SMART_NOTE_CONSTITUTION.md'
      - '00-NAYA-POWER-CONSTITUTIONAL-MANDATES.md'
      - 'SUPERBRAIN/**'
      - 'tests/**'
      - '.github/workflows/nayanet-10-10-static-gate.yml'
      - '.github/workflows/deploy-nayanet-hub-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run source-level 10/10 gate
        run: python tests/verify_nayanet_10_10.py
      - name: Verify production canonical Hub source
        run: |
          set -euo pipefail
          test -f 'NAYANET/HUB/index.html'
          test -f 'NAYANET/HUB/src/app/App.tsx'
          test -f 'NAYANET/HUB/src/intelligence/cognition.ts'
          grep -q 'nayanet-cognitive-engine.js' 'NAYANET/HUB/index.html'
          grep -q 'NAYANET-HUB-REACT-CANONICAL' 'NAYANET/HUB/src/app/App.tsx'
          grep -q 'recordPersistent' 'NAYANET/HUB/src/intelligence/cognition.ts'
          grep -q 'name: Deploy Canonical NayaNET Hub' '.github/workflows/deploy-nayanet-hub-canonical.yml'
          echo 'STATIC_CANONICAL_SOURCE=PASS'
      - name: Publish gate boundary
        run: |
          echo 'STATIC_SOURCE_GATES=PASS'
          echo 'AUTHENTICATED_LIFECYCLE=EXTERNAL_REQUIRED'
          echo 'DEPLOYED_RUNTIME_PARITY=EXTERNAL_REQUIRED'
          echo 'FINAL_10_10=BLOCKED_UNTIL_EXTERNAL_RECEIPTS'
