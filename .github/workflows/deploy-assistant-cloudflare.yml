name: Deploy Canonical Assistant Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - 'assistant-runtime.js'
      - 'smart-feed.js'
      - 'smart-tabs.js'
      - 'scripts/build-smart-feed-projection.py'
      - 'identity.html'
      - 'NAYANET/name-first-auth-adapter.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: NAYANET/HUB
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NAYANET/HUB/package.json

      - name: Install Hub dependencies
        run: npm install --no-package-lock

      - name: Typecheck canonical Hub
        run: npm run typecheck

      - name: Build canonical Hub
        run: npm run build

      - name: Deploy canonical Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record deployment target
        run: |
          echo "CANONICAL_WORKER=sparkling-shape-7ae5" >> "$GITHUB_STEP_SUMMARY"
          echo "CANONICAL_HUB_SOURCE=NAYANET/HUB" >> "$GITHUB_STEP_SUMMARY"
          echo "CANONICAL_DEPLOYMENT=PASS" >> "$GITHUB_STEP_SUMMARY"
