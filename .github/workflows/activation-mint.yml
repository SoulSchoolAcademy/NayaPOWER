# Activation Mint — trusted issuance for the unified activation gate.
#
# This workflow IS the authenticity root that closes forgery A1: a receipt
# is authentic iff THIS workflow (base code, trusted runner) minted its exact
# bytes. The delivery gate verifies via the live API that the receipt's
# attested run exists in the gated repository, ran this workflow to success
# via workflow_dispatch, and its artifact's receipt.json is byte-identical
# to the presented receipt. A self-minted receipt with perfect public data
# cannot forge this.
#
# HOW TO USE (builders/agents): finish the deliverables, compute each one's
# canonical sha256 (marker-stripped), then dispatch:
#   gh workflow run activation-mint.yml \
#     --ref <branch> \
#     -f deliverables='[{"path":"smart-blocks/x.html","sha256":"<64hex>"}]' \
#     -f job='one sentence: the real outcome' \
#     -f proof_plan='how it will be verified'
# Download the `activation-receipt-<run_id>` artifact, commit receipt.json to
# .naya/activation/receipt.json in the delivery PR. The receipt is tip-bound
# and 4h-TTL: mint close to delivery.
#
# SECURITY: workflow_dispatch on the base repo requires write access — a PR
# author without it cannot mint. The mint binds only what it is told; the
# delivery gate recomputes every hash from the PR's actual bytes, so lying
# at dispatch produces a receipt that cannot verify.
name: Activation Mint

on:
  workflow_dispatch:
    inputs:
      deliverables:
        description: 'JSON list of {"path","sha256"[,"action":"delete"]}'
        required: true
      job:
        description: 'One sentence: the real outcome'
        required: true
      proof_plan:
        description: 'How the work will be verified'
        required: false
        default: ''
      gates:
        description: 'Comma-separated governing gates'
        required: false
        default: 'Usefulness Gate'

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned SHA)
        with:
          python-version: "3.12"
      - name: Mint run-attested receipt
        run: >-
          python3 tools/activation_mint.py
          --deliverables '${{ inputs.deliverables }}'
          --job '${{ inputs.job }}'
          --proof-plan '${{ inputs.proof_plan }}'
          --gates '${{ inputs.gates }}'
          --out receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned SHA)
        with:
          name: activation-receipt-${{ github.run_id }}
          path: receipt.json
          if-no-files-found: error
