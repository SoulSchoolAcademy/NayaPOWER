name: Surgical NayaNET Right Rail Removal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgical-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove only the old right-side feed/rail
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('2026 09 08 452 NayaNET Hub.html')
          html = path.read_text(encoding='utf-8')
          original = html

          rail = re.compile(
              r'<(?P<tag>[A-Za-z][A-Za-z0-9]*)\b[^>]*\bclass=["\'][^"\']*\bactivationRail\b[^"\']*["\'][^>]*>[\s\S]*?</(?P=tag)>',
              re.I
          )
          html, removed = rail.subn('', html, count=1)
          print(f'RIGHT_RAIL_REMOVED={removed}')
          if removed != 1:
              raise SystemExit('RIGHT_RAIL_NOT_FOUND_EXACTLY_ONCE')

          old_grid = '.homeWorkspace{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;align-items:start}'
          new_grid = '.homeWorkspace{display:block;width:100%;max-width:none}'
          if old_grid not in html:
              raise SystemExit('HOME_WORKSPACE_GRID_SENTINEL_MISSING')
          html = html.replace(old_grid, new_grid, 1)

          protected = {
              'LEFT_NAV_SIDEBAR': bool(re.search(r'\.sidebar\s*\{', html)),
              'HOME_WORKSPACE': 'homeWorkspace' in html,
              'HOME_FEED': bool(re.search(r'homeFeed', html)),
              'INTELLIGENT_FEED': bool(re.search(r'intelligentFeed|intelligentBlocks|nayanet-elite-feed', html, re.I)),
              'ACTIVITY': bool(re.search(r'Activity Intelligence|ACTIVITY|activity', html, re.I)),
              'PERSONAL_INTELLIGENCE': bool(re.search(r'Personal Intelligence|PERSONAL INTELLIGENCE', html, re.I)),
              'COLLECTIVE_INTELLIGENCE': bool(re.search(r'Collective Intelligence|COLLECTIVE INTELLIGENCE', html, re.I)),
          }
          missing = [k for k, ok in protected.items() if not ok]
          if missing:
              raise SystemExit('PROTECTED_SURFACE_MISSING=' + ','.join(missing))
          if rail.search(html):
              raise SystemExit('RIGHT_RAIL_STILL_PRESENT')
          if html == original:
              raise SystemExit('NO_SOURCE_CHANGE')

          path.write_text(html, encoding='utf-8')
          print('CENTER_SMART_FEED=PRESERVED')
          print('ACTIVITY=PRESERVED')
          print('PERSONAL_INTELLIGENCE=PRESERVED')
          print('COLLECTIVE_INTELLIGENCE=PRESERVED')
          print('LEFT_NAV=PRESERVED')
          print('RIGHT_OLD_FEED_RAIL=REMOVED')
          print('CENTER_FEED_WIDTH=EXPANDED')
          print('NO_FEED_REBUILD=TRUE')
          print('COLLATERAL_DAMAGE_GATE=PASS')
          PY

      - name: Commit and win the main-branch race safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 08 452 NayaNET Hub.html'
          git diff --cached --quiet && { echo 'NO_SOURCE_CHANGE_NEEDED'; exit 0; }
          git commit -m 'Surgical Hub fix: remove old right-side feed and widen Smart Feed'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo 'REBASE_CONFLICT'; exit 1; }
            if git push origin HEAD:main; then
              echo "SURGICAL_PUSH_SUCCESS_ATTEMPT=$attempt"
              exit 0
            fi
            sleep 2
          done
          echo 'SURGICAL_PUSH_FAILED_AFTER_RETRIES'
          exit 1
