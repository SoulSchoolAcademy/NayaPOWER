name: NayaNET World-Class Feed Activation
on:
  push:
    branches: [v7-intelligent-hub-live]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire definitive feed runtime
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/nayanet-intelligent-feed-v5.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker,tag+marker,1)
              else:
                  s += tag
              p.write_text(s,encoding='utf-8')
      - name: Commit activation
        run: |
          git config user.name 'NayaNET Release Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Activate definitive NayaNET intelligent feed runtime'
          git push
