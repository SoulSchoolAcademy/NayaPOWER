# CANONICAL_RELEASE_RECONCILIATION_2026-09-08
name: Deploy V7 Intelligent Hub

on:
  push:
    branches: [main]
    paths:
      - '2026 09 08 9:59 NAYANET HUB.html'
      - '2026 09 08 12:40 NAYANET INTELLIGENT FEED V3.js'
      - '2026 09 08 NAYANET INTELLIGENT FEED V4 INTERIOR EVOLUTION.js'
      - '.github/workflows/deploy-v7-intelligent-hub.yml'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-v7-canonical-production
  cancel-in-progress: true

env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  deploy-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build from the exact current Hub source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          hub = Path('2026 09 08 9:59 NAYANET HUB.html')
          feed = Path('2026 09 08 12:40 NAYANET INTELLIGENT FEED V3.js')
          interior = Path('2026 09 08 NAYANET INTELLIGENT FEED V4 INTERIOR EVOLUTION.js')
          base = hub.read_text(encoding='utf-8')
          feed_js = feed.read_text(encoding='utf-8')
          interior_js = interior.read_text(encoding='utf-8')

          if '</body>' not in base or '</head>' not in base:
              raise SystemExit('CURRENT HUB SOURCE IS NOT A COMPLETE HTML DOCUMENT')

          # The current file is the source of truth. Remove only the explicitly retired right rail.
          out = re.sub(r'<aside\\s+class=["\']activationRail["\'][\\s\\S]*?</aside>', '', base, flags=re.I)

          # Put the three-view Intelligent Feed into the existing center feed host.
          old_host = re.compile(r'<section class=["\']homeFeed["\'][\\s\\S]*?</section>\\s*</div>\\s*</section>', re.I)
          replacement = '<section class="homeFeed"><div id="nayanet-elite-feed" aria-label="NayaNET Intelligent Feed"></div></section></div></section>'
          out, host_count = old_host.subn(replacement, out, count=1)
          if host_count != 1:
              raise SystemExit(f'HOME_FEED_HOST_REPLACEMENT_FAILED count={host_count}')

          # Keep the original left navigation untouched. The older feed helper relabelled it; this deployment does not.
          feed_js = feed_js.replace('relabelSidebar();wire(root);render(preferred())', 'wire(root);render(preferred())')

          # Make Activity, Personal, and Collective use the same Intelligent Block language.
          activity_old = "if(view==='activity'){body.innerHTML=activities().map(([ico,title,text,time])=>`<div class=\\\"n3-event\\\"><div class=\\\"n3-event-icon\\\">${ico}</div><div><b>${title}</b><p>${text}</p></div><span class=\\\"n3-time\\\">${time}</span></div>`).join('');return;}"
          activity_new = "if(view==='activity'){const notes=harvest();const list=notes.length?[FEED_NOTE,...notes]:seeds;body.innerHTML=list.map((n,i)=>block(n,i,view)).join('');return;}"
          if activity_old in feed_js:
              feed_js = feed_js.replace(activity_old, activity_new, 1)
          else:
              feed_js = re.sub(r"if\(view==='activity'\)\{body\.innerHTML=activities\(\)\.map\(\(\[ico,title,text,time\]\)=>`<div class=\\\"n3-event[\\s\\S]*?return;\}", activity_new, feed_js, count=1)

          # Put today's requested organization/operation lesson into the visible demo feed.
          demo = "{id:'organization-operation',title:'ORGANIZE INTELLIGENCE BY DAY, TIME, AND SUBJECT',nutshell:'Naya Power keeps intelligence findable by organizing each meaningful event by day, time, and subject so a future Naya can recover the current state without rebuilding the story from memory.',human:'I need the system to know what day we are on, what we worked on, when the latest state was created, and what subject it belongs to so the next Naya can continue intelligently.',child:'Put each important thing where it belongs, with the day and time, so we can find it again.',grandma:'If you want to remember something, give it a proper place and a clear date. Then the lesson can serve you again.',naya:'The operating protocol is simple: capture the meaningful event, timestamp it, name the subject, place it in the current day bucket, connect the relevant perspectives, preserve the result, and make it retrievable. The purpose is not filing for its own sake. The purpose is continuity.',machine:'DATE identifies when. TIME identifies the state. SUBJECT identifies what the event is about. The event is stored under the current day and remains traceable to its source and lifecycle state.',lesson:'Organization is part of intelligence. A system that cannot reliably recover the latest state cannot compound intelligence reliably.',use:'When something matters, capture it once, timestamp it, give it a precise subject, store it in the current day, and make the resulting intelligence easy for the next Naya to retrieve.'},"
          if "const seeds=[" not in feed_js:
              raise SystemExit('FEED_SEEDS_ANCHOR_MISSING')
          feed_js = feed_js.replace('const seeds=[', 'const seeds=[' + demo, 1)

          # Add the current interior-evolution layer after the feed runtime.
          injected = (
              '<script id="nayanet-current-intelligent-feed-v3">\\n' + feed_js + '\\n</script>\\n'
              '<script id="nayanet-current-intelligent-feed-v4-interior">\\n' + interior_js + '\\n</script>\\n'
          )
          out = out.replace('</body>', injected + '</body>', 1)

          # Final presentation authority: remove the retired rail even if another legacy layer tries to recreate it.
          authority = '''<style id="nayanet-current-hub-release-authority">
          html,body{background:#000!important}
          .homeWorkspace{display:block!important;grid-template-columns:1fr!important;width:100%!important;max-width:none!important;gap:0!important}
          .homeFeed{width:100%!important;max-width:none!important;min-width:0!important}
          #nayanet-elite-feed{width:100%!important;max-width:none!important}
          .activationRail{display:none!important;width:0!important;min-width:0!important;max-width:0!important;height:0!important;overflow:hidden!important;visibility:hidden!important;pointer-events:none!important}
          @media(max-width:900px){.sidebar{display:none!important}.app{display:block!important;grid-template-columns:1fr!important}.main{width:100%!important;padding-left:12px!important;padding-right:12px!important}.homeWorkspace{display:block!important;grid-template-columns:1fr!important}}
          </style>
          <script id="nayanet-current-hub-release-guard">
          (()=>{
            'use strict';
            const enforce=()=>{
              document.querySelectorAll('.activationRail').forEach(el=>el.remove());
              document.querySelectorAll('.homeWorkspace').forEach(el=>{el.style.setProperty('display','block','important');el.style.setProperty('grid-template-columns','1fr','important');el.style.setProperty('width','100%','important');el.style.setProperty('gap','0','important')});
              document.querySelectorAll('.homeFeed,#nayanet-elite-feed').forEach(el=>el.style.setProperty('width','100%','important'));
            };
            const boot=()=>{enforce();new MutationObserver(enforce).observe(document.body,{childList:true,subtree:true});[100,500,1500,3000].forEach(ms=>setTimeout(enforce,ms));};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
          })();
          </script>'''
          out = out.replace('</body>', authority + '\\n</body>', 1)

          d = Path('CLOUDFLARE-INTELLIGENT-HUB-V7')
          d.mkdir(exist_ok=True)
          (d/'index.html').write_text(out, encoding='utf-8')
          a = d/'assets'
          a.mkdir(exist_ok=True)
          (a/'index.html').write_text(out, encoding='utf-8')
          (a/'_redirects').write_text('/index.html 200\\n', encoding='utf-8')

          required = [
              'id="nayanet-elite-feed"', 'COLLECTIVE INTELLIGENCE', 'PERSONAL INTELLIGENCE', 'ACTIVITY',
              'HOW NAYANET', 'IN A NUTSHELL', 'CHILD NOTE', 'GRANDMA NOTE', 'NAYA NOTE', 'MACHINE NOTE',
              'WHAT WE LEARNED · WHAT IT MEANS', 'nayanet-current-hub-release-authority',
              'NAYANET-HUB-RIGHT-SIDEBAR-FEED-MIRROR-V1'
          ]
          missing = [x for x in required if x not in out]
          if missing:
              raise SystemExit(f'BUILD_MISSING_MARKERS={missing}')
          if 'class="activationRail"' in out or "class='activationRail'" in out:
              raise SystemExit('RETIRED_RIGHT_RAIL_SHIPPED_IN_ARTIFACT')
          if 'class="sidebar"' not in out:
              raise SystemExit('LEFT_SIDEBAR_MISSING_FROM_ARTIFACT')
          print('CURRENT_SOURCE=2026 09 08 9:59 NAYANET HUB.html')
          print('RIGHT_RAIL=REMOVED')
          print('LEFT_SIDEBAR=PRESERVED')
          print('THREE_FEED_VIEWS=EMBEDDED')
          print('ACTIVITY_BLOCK_MIRROR=ENABLED')
          print('CURRENT_DAY_ORGANIZATION_DEMO=EMBEDDED')
          print('ARTIFACT_BYTES=', len(out.encode('utf-8')))
          PY

      - name: Deploy exact artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Independently verify exact public runtime
        shell: bash
        run: |
          set -euo pipefail
          q="release=${GITHUB_SHA}"
          curl -fsSL --retry 5 --retry-delay 3 "$RUNTIME/?$q" -o /tmp/root
          curl -fsSL --retry 5 --retry-delay 3 "$SMART_LINK?$q" -o /tmp/smart
          python3 - <<'PY'
          from pathlib import Path
          for name in ('/tmp/root','/tmp/smart'):
              text=Path(name).read_text(encoding='utf-8')
              required=['COLLECTIVE INTELLIGENCE','PERSONAL INTELLIGENCE','ACTIVITY','HOW NAYANET','IN A NUTSHELL','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','WHAT WE LEARNED · WHAT IT MEANS','ORGANIZE INTELLIGENCE BY DAY, TIME, AND SUBJECT','nayanet-current-hub-release-authority']
              missing=[x for x in required if x not in text]
              if missing: raise SystemExit(f'{name} missing runtime markers: {missing}')
              if 'class="activationRail"' in text or "class='activationRail'" in text: raise SystemExit(f'{name} STILL SHIPS RIGHT ACTIVATION RAIL')
              if 'class="sidebar"' not in text: raise SystemExit(f'{name} LOST LEFT SIDEBAR')
          print('PUBLIC_RUNTIME_ROOT=PASS')
          print('PUBLIC_SMART_LINK=PASS')
          print('RIGHT_RAIL=REMOVED')
          print('LEFT_SIDEBAR=PRESERVED')
          print('THREE_FEED_VIEWS=PASS')
          print('ACTIVITY_BLOCK_MIRROR=PASS')
          print('CURRENT_DAY_ORGANIZATION_DEMO=PASS')
          PY
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"