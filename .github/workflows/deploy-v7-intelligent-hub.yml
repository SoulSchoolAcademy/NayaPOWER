# NayaNET V7 — canonical Hub deployment and runtime proof
name: Deploy V7 Intelligent Hub
on:
  push:
    branches: [main]
    paths:
      - '2026 09 07 2:05 NAYANET HUB.HTML'
      - '*NAYANET INTELLIGENT FEED V2.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'
      - '.github/workflows/deploy-v7-intelligent-hub.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nayanet-v7-canonical-production
  cancel-in-progress: true
env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds
jobs:
  deploy-v7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLOUDFLARE-INTELLIGENT-HUB-V7
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build one canonical feed artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          hub=Path('../2026 09 07 2:05 NAYANET HUB.HTML')
          feeds=sorted(Path('..').glob('*NAYANET INTELLIGENT FEED V2.js'),key=lambda p:tuple(map(int,re.match(r'^(\d{4}) (\d{2}) (\d{2}) +(\d{1,2}):(\d{2}) ',p.name).groups())),reverse=True)
          if len(feeds)!=1: raise SystemExit(f'Expected exactly one canonical V2 feed layer; found {len(feeds)}: {[p.name for p in feeds]}')
          layer=feeds[0]
          Path('.authoritative-source').write_text(str(hub))
          Path('.authoritative-feed-layer').write_text(layer.name)
          Path('index.html').write_text(hub.read_text().replace('</body>','<script>\n'+layer.read_text()+'\n</script>\n'+Path('v7-ten-star-play-naya-polish.js').read_text()+'\n</body>',1))
          Path('assets').mkdir(exist_ok=True)
          Path('assets/index.html').write_text(Path('index.html').read_text())
          Path('assets/_redirects').write_text('/index.html 200\n')
          print('CANONICAL_FEED_LAYER=',layer.name)
          print('CANONICAL_FEED_LAYER_COUNT=1')
          PY
      - name: Validate the ten-star contract before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -Fq 'NayaNET INTELLIGENT HUB — TEN-STAR EXPERIENCE' index.html
          grep -Fq 'ACTIVITY' index.html
          grep -Fq 'PERSONAL INTELLIGENCE' index.html
          grep -Fq 'COLLECTIVE INTELLIGENCE' index.html
          grep -Fq 'IN A NUTSHELL' index.html
          grep -Fq 'HUMAN' index.html
          grep -Fq 'CHILD' index.html
          grep -Fq 'GRANDMA' index.html
          grep -Fq 'NAYA' index.html
          grep -Fq 'MACHINE' index.html
          grep -Fq 'WHAT WE LEARNED · WHAT IT MEANS' index.html
          grep -Fq 'PLAY NAYA' index.html
          grep -Fq 'Favorite / Star this intelligence' index.html
          grep -Fq 'Save / Keep this intelligence' index.html
          grep -Fq 'Share this intelligence' index.html
          grep -Fq 'Love this intelligence' index.html
          grep -Fq 'Rate usefulness from one to five stars' index.html
          grep -Fq '＋ SHARE' index.html
          grep -Fq 'Private by default. Shared by choice. Collective by consent. Public by decision.' index.html
          grep -Fq 'Your Intelligence Today' index.html
          grep -Fq 'Your Reports' index.html
          grep -Fq 'Intelligent Library' index.html
          grep -Fq 'Smart Lists' index.html
          grep -Fq 'Smart Share' index.html
          grep -Fq 'Your Evidence' index.html
          grep -Fq 'Your Connections' index.html
          grep -Fq 'Smart Mail' index.html
          grep -Fq 'Smart Spaces' index.html
          if grep -Fq 'LOVE · SHARE' index.html; then exit 1; fi
          if grep -Fq 'SMART LINK</button>' index.html; then exit 1; fi
          node --check v7-ten-star-play-naya-polish.js
          test "$(find .. -maxdepth 1 -name '*NAYANET INTELLIGENT FEED V2.js' | wc -l)" -eq 1
          echo 'TEN_STAR_SOURCE_CONTRACT=PASS'
          echo 'SINGLE_CANONICAL_FEED_LAYER=PASS'
          echo 'NO_COMBINED_LOVE_SHARE=PASS'
          echo 'NO_UNEXPLAINED_SMART_LINK_CONTROL=PASS'
      - name: Deploy exact artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc
      - name: Independently verify public runtime and Smart Link
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 "$RUNTIME/" -o /tmp/runtime.html
          curl -fsSL --retry 5 --retry-delay 3 "$SMART_LINK" -o /tmp/smart.html
          grep -Fq 'NayaNET INTELLIGENT HUB — TEN-STAR EXPERIENCE' /tmp/runtime.html
          grep -Fq 'PERSONAL INTELLIGENCE' /tmp/runtime.html
          grep -Fq 'COLLECTIVE INTELLIGENCE' /tmp/runtime.html
          grep -Fq 'PLAY NAYA' /tmp/runtime.html
          grep -Fq 'Favorite / Star this intelligence' /tmp/runtime.html
          grep -Fq 'Save / Keep this intelligence' /tmp/runtime.html
          grep -Fq 'Share this intelligence' /tmp/runtime.html
          grep -Fq 'Private by default. Shared by choice. Collective by consent. Public by decision.' /tmp/runtime.html
          grep -Fq 'NayaNET INTELLIGENT HUB — TEN-STAR EXPERIENCE' /tmp/smart.html
          grep -Fq 'PLAY NAYA' /tmp/smart.html
          echo 'PUBLIC_RUNTIME_ROOT=PASS'
          echo 'PUBLIC_SMART_LINK=PASS'
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"
      - name: Record release identity
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo "AUTHORITATIVE_SOURCE=$(cat .authoritative-source)"
          echo "AUTHORITATIVE_FEED_LAYER=$(cat .authoritative-feed-layer)"
          echo "WORKER=nayanet-v7-intelligent-hub"
