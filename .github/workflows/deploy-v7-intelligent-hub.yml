# 2026 09 07 — deploy exact 2:05 source + latest Smart Feed V2 — runtime-verified release
name: Deploy V7 Intelligent Hub from canonical 2:05 source

on:
  push:
    branches: [main]
    paths:
      - '2026 09 07 2:05 NAYANET HUB.HTML'
      - '*NAYANET INTELLIGENT FEED V2.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/worker.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-release-enhancements.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-intelligence-distribution.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-ten-star-play-naya-polish.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/wrangler.jsonc'
      - '.github/workflows/deploy-v7-intelligent-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-v7-canonical-production
  cancel-in-progress: true

env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds

jobs:
  deploy-v7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLOUDFLARE-INTELLIGENT-HUB-V7
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve exact 2:05 source and latest Smart Feed V2 layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          hub=Path('../2026 09 07 2:05 NAYANET HUB.HTML')
          if not hub.is_file(): raise SystemExit(f'Missing canonical source: {hub}')
          def stamp(name):
              m=re.match(r'^(\d{4}) (\d{2}) (\d{2}) +(\d{1,2}):(\d{2}) ', name)
              if not m: raise SystemExit(f'Invalid timestamped feed name: {name}')
              return tuple(map(int,m.groups()))
          feeds=sorted([p.name for p in Path('..').glob('*NAYANET INTELLIGENT FEED V2.js')], key=stamp, reverse=True)
          if not feeds: raise SystemExit('No timestamped NAYANET INTELLIGENT FEED V2.js layer found')
          feed=feeds[0]
          Path('.authoritative-source').write_text(str(hub))
          Path('.authoritative-feed-layer').write_text(feed)
          print('AUTHORITATIVE_SOURCE=',hub)
          print('AUTHORITATIVE_FEED_LAYER=',feed)
          PY
          cp "$(cat .authoritative-source)" index.html
          cat "../$(cat .authoritative-feed-layer)" > .feed-layer.js
          cat v7-ten-star-play-naya-polish.js >> .feed-layer.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); src=p.read_text(); layer=Path('.feed-layer.js').read_text(); marker='</body>'
          if src.count(marker)!=1: raise SystemExit('Expected exactly one </body> boundary')
          p.write_text(src.replace(marker,'<script>\n'+layer+'\n</script>\n'+marker,1))
          PY
          rm -rf assets
          mkdir -p assets
          cp index.html assets/index.html
          printf '/index.html 200\n' > assets/_redirects

      - name: Validate exact release artifact before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/index.html
          test -s worker.js
          test -s wrangler.jsonc
          test -s v7-smart-note-runtime.js
          test -s v7-release-enhancements.js
          test -s v7-intelligence-distribution.js
          test -s v7-ten-star-play-naya-polish.js
          grep -Fq 'NayaNET — Intelligent Hub V7' index.html
          grep -Fq 'NayaNET INTELLIGENT HUB — TEN-STAR EXPERIENCE' index.html
          grep -Fq 'PERSONAL INTELLIGENCE' index.html
          grep -Fq 'COLLECTIVE INTELLIGENCE' index.html
          grep -Fq 'ACTIVITY' index.html
          grep -Fq 'IN A NUTSHELL' index.html
          grep -Fq 'HUMAN NOTE' index.html
          grep -Fq 'CHILD NOTE' index.html
          grep -Fq 'GRANDMA NOTE' index.html
          grep -Fq 'NAYA NOTE' index.html
          grep -Fq 'MACHINE NOTE' index.html
          grep -Fq 'WHAT WE LEARNED · WHAT IT MEANS' index.html
          grep -Fq 'PLAY NAYA' index.html
          grep -Fq 'Ask your intelligence' index.html
          grep -Fq 'NAYA_PLAY_NAYA_POLISH' index.html
          node --check worker.js
          node --check v7-smart-note-runtime.js
          node --check v7-release-enhancements.js
          node --check v7-intelligence-distribution.js
          node --check v7-ten-star-play-naya-polish.js
          node --check .feed-layer.js
          cmp -s index.html assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          s=Path('index.html').read_text()
          assert s.count('<html') == 1 and s.count('</html>') == 1, 'HTML boundary invalid'
          assert 'v7-intelligence-distribution.js' not in s, 'Broken legacy distribution layer must not be injected into canonical artifact'
          print('V7 artifact validation: PASS')
          print('index.html bytes:', len(s.encode()))
          print('index.html sha256:', hashlib.sha256(s.encode()).hexdigest())
          print('source artifact:', Path('.authoritative-source').read_text().strip())
          print('feed layer:', Path('.authoritative-feed-layer').read_text().strip())
          print('feed layer sha256:', hashlib.sha256(Path('.feed-layer.js').read_bytes()).hexdigest())
          print('clean asset bytes:', Path('assets/index.html').stat().st_size)
          print('legacy distribution injection: DISABLED')
          print('Play Naya surgical polish: ENABLED')
          PY

      - name: Deploy exact V7 source to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Independently verify public runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 "$RUNTIME/" -o /tmp/hub-runtime.html
          grep -Fq 'NayaNET INTELLIGENT HUB — TEN-STAR EXPERIENCE' /tmp/hub-runtime.html
          grep -Fq 'PERSONAL INTELLIGENCE' /tmp/hub-runtime.html
          grep -Fq 'COLLECTIVE INTELLIGENCE' /tmp/hub-runtime.html
          grep -Fq 'ACTIVITY' /tmp/hub-runtime.html
          grep -Fq 'PLAY NAYA' /tmp/hub-runtime.html
          grep -Fq 'Ask your intelligence' /tmp/hub-runtime.html
          grep -Fq 'NAYA_PLAY_NAYA_POLISH' /tmp/hub-runtime.html
          curl -fsSL --retry 5 --retry-delay 3 "$SMART_LINK" -o /tmp/smart-link.html
          grep -Fq 'NayaNET INTELLIGENT HUB — TEN-STAR EXPERIENCE' /tmp/smart-link.html
          grep -Fq 'PLAY NAYA' /tmp/smart-link.html
          grep -Fq 'TEN-STAR' /tmp/smart-link.html
          grep -Fq 'NAYA_PLAY_NAYA_POLISH' /tmp/smart-link.html
          echo 'PUBLIC_RUNTIME_ROOT=PASS'
          echo 'PUBLIC_SMART_LINK=PASS'
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo "AUTHORITATIVE_SOURCE=$(cat .authoritative-source)"
          echo "AUTHORITATIVE_FEED_LAYER=$(cat .authoritative-feed-layer)"
          echo "PLAY_NAYA_POLISH=v7-ten-star-play-naya-polish.js"
          echo "WORKER=nayanet-v7-intelligent-hub"
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"
