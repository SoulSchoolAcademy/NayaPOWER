# NayaNET V7 — source → build → artifact → deploy → runtime → Smart Link
name: Deploy V7 Intelligent Hub
on:
  push:
    branches: [main]
    paths:
      - '2026 09 07  1:14 NAYANETHUBONE.html'
      - '*NAYANET INTELLIGENT FEED V2.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'
      - '.github/workflows/deploy-v7-intelligent-hub.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nayanet-v7-canonical-production
  cancel-in-progress: true
env:
  RUNTIME: https://nayanet-v7-intelligent-hub.nayanet.workers.dev
  SMART_LINK: https://nayanet-v7-intelligent-hub.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds
  HUB_FILE: 2026 09 07  1:14 NAYANETHUBONE.html
jobs:
  deploy-v7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLOUDFLARE-INTELLIGENT-HUB-V7
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exactly one canonical feed artifact from the known-good Hub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          hub=Path('../2026 09 07  1:14 NAYANETHUBONE.html')
          feeds=sorted(Path('..').glob('*NAYANET INTELLIGENT FEED V2.js'),key=lambda p:tuple(map(int,re.match(r'^(\d{4}) (\d{2}) (\d{2}) +(\d{1,2}):(\d{2}) ',p.name).groups())),reverse=True)
          if len(feeds)!=1: raise SystemExit(f'Expected exactly one canonical V2 feed layer; found {len(feeds)}: {[p.name for p in feeds]}')
          layer=feeds[0]
          if not hub.exists(): raise SystemExit(f'Missing authoritative Hub: {hub}')
          Path('.authoritative-source').write_text(str(hub))
          Path('.authoritative-feed-layer').write_text(layer.name)
          base=hub.read_text()
          inject='<script>\n'+layer.read_text()+'\n</script>\n'+Path('v7-ten-star-play-naya-polish.js').read_text()+'\n'
          if '</body>' not in base: raise SystemExit('Authoritative Hub has no </body> boundary')
          Path('index.html').write_text(base.replace('</body>',inject+'</body>',1))
          Path('assets').mkdir(exist_ok=True)
          Path('assets/index.html').write_text(Path('index.html').read_text())
          Path('assets/_redirects').write_text('/index.html 200\n')
          print('AUTHORITATIVE_HUB=',hub)
          print('CANONICAL_FEED_LAYER=',layer.name)
          print('CANONICAL_FEED_LAYER_COUNT=1')
          PY
      - name: Validate elite three-view contract
        shell: bash
        run: |
          set -euo pipefail
          LAYER="../$(cat .authoritative-feed-layer)"
          test -s "$LAYER"
          node --check "$LAYER"
          for s in 'COLLECTIVE INTELLIGENCE' 'PERSONAL INTELLIGENCE' 'ACTIVITY' 'IN A NUTSHELL' 'HUMAN NOTE' 'CHILD NOTE' 'GRANDMA NOTE' 'NAYA NOTE' 'MACHINE NOTE' 'LESSON' 'HOW TO USE IT' 'Favorite / Star this intelligence' 'Save / Keep this intelligence' 'Share this intelligence' 'PLAY NAYA' 'Private by default. Shared by choice. Collective by consent. Public by decision.' 'Your Intelligence Today' 'Your Reports' 'Intelligent Library' 'Smart Lists' 'Smart Share' 'Your Evidence' 'Your Connections' 'Smart Mail' 'Smart Spaces' 'YOUR LIFE CREATES YOUR INTELLIGENCE EVERY DAY'; do grep -Fq "$s" "$LAYER"; done
          if grep -Fq 'LOVE · SHARE' "$LAYER"; then echo 'Love and Share are combined'; exit 1; fi
          if grep -Fq 'SMART LINK</button>' "$LAYER"; then echo 'Unexplained Smart Link control exists'; exit 1; fi
          echo 'ELITE_THREE_VIEW_SOURCE_CONTRACT=PASS'
          echo 'SINGLE_CANONICAL_FEED_LAYER=PASS'
          echo 'KNOWN_GOOD_HUB_BASELINE=PASS'
      - name: Deploy exact artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc
      - name: Independently verify exact public runtime and Smart Link
        shell: bash
        run: |
          set -euo pipefail
          Q="release=${GITHUB_SHA}"
          curl -fsSL --retry 5 --retry-delay 3 "$RUNTIME/?$Q" -o /tmp/runtime.html
          curl -fsSL --retry 5 --retry-delay 3 "$SMART_LINK?$Q" -o /tmp/smart.html
          for s in 'COLLECTIVE INTELLIGENCE' 'PERSONAL INTELLIGENCE' 'ACTIVITY' 'IN A NUTSHELL' 'HOW TO USE IT' 'PLAY NAYA' 'YOUR LIFE CREATES YOUR INTELLIGENCE EVERY DAY'; do grep -Fq "$s" /tmp/runtime.html; done
          for s in 'COLLECTIVE INTELLIGENCE' 'IN A NUTSHELL' 'HOW TO USE IT'; do grep -Fq "$s" /tmp/smart.html; done
          echo 'PUBLIC_RUNTIME_ROOT=PASS'
          echo 'PUBLIC_SMART_LINK=PASS'
          echo "RUNTIME=$RUNTIME/"
          echo "SMART_LINK=$SMART_LINK"
          echo "RELEASE_QUERY=$Q"
      - name: Record release identity
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo "AUTHORITATIVE_SOURCE=$(cat .authoritative-source)"
          echo "AUTHORITATIVE_FEED_LAYER=$(cat .authoritative-feed-layer)"
          echo "WORKER=nayanet-v7-intelligent-hub"
          echo "THREE_VIEW_DEFAULT=COLLECTIVE_FOR_NEW_OR_UNPREFERENCED_USERS"
