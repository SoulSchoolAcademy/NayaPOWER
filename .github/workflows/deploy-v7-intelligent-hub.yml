name: Deploy V7 Intelligent Hub from latest timestamped source

on:
  push:
    branches: [main]
    paths:
      - '*NAYANETHUBONE.html'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/worker.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-release-enhancements.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-intelligence-distribution.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/wrangler.jsonc'
      - '.github/workflows/deploy-v7-intelligent-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-v7-canonical-production
  cancel-in-progress: true

jobs:
  deploy-v7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLOUDFLARE-INTELLIGENT-HUB-V7
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest timestamped authoritative Hub source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find .. -maxdepth 1 -type f -name '*NAYANETHUBONE.html' -printf '%f\n' | sort -r)
          test "${#candidates[@]}" -gt 0
          source_name="${candidates[0]}"
          if ! [[ "$source_name" =~ ^[0-9]{4}\ [0-9]{2}\ [0-9]{2}\ +[0-9]{1,2}:[0-9]{2}\ NAYANETHUBONE\.html$ ]]; then
            echo "Latest candidate does not follow the required timestamped naming contract: $source_name"
            exit 1
          fi
          cp "../$source_name" index.html
          printf '%s\n' "$source_name" > .authoritative-source
          echo "AUTHORITATIVE_SOURCE=$source_name"

      - name: Validate exact V7 artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s worker.js
          test -s wrangler.jsonc
          test -s v7-smart-note-runtime.js
          test -s v7-release-enhancements.js
          test -s v7-intelligence-distribution.js
          grep -Fq 'NayaNET — Intelligent Hub V7' index.html
          node --check worker.js
          node --check v7-smart-note-runtime.js
          node --check v7-release-enhancements.js
          node --check v7-intelligence-distribution.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('<html') == 1 and s.count('</html>') == 1, 'HTML boundary invalid'
          print('V7 artifact validation: PASS')
          print('index.html bytes:', len(s.encode()))
          print('index.html sha256:', __import__('hashlib').sha256(s.encode()).hexdigest())
          print('source artifact:', Path('.authoritative-source').read_text().strip())
          PY

      - name: Deploy exact V7 source to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo "AUTHORITATIVE_SOURCE=$(cat .authoritative-source)"
          echo "WORKER=nayanet-v7-intelligent-hub"
          echo "RUNTIME=https://noisy-block-35d0.nayanet.workers.dev/"
