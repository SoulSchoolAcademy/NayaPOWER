name: Safety-Liveness Gate (D55)

# Executable gate for D55 — Safe Recovery Holds vs. Liveness Failures.
# Runs the classifier's test suite (incl. the directive-named adversarial
# mutation) and the AER-LIVE-001 experiment end to end.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  safety-liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Bare setup-python images do not always carry pytest; install it
      # explicitly (same lesson as the directive-register gates).
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_safety_liveness_classifier.py -q -p no:cacheprovider
      - run: python tools/safety_liveness_classifier.py --run-experiment > /dev/null
