name: Live CVO Runtime Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-cvo-runtime-proof
  cancel-in-progress: false

jobs:
  cvo-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Mint short-lived GitHub OIDC runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - name: Execute persisted CVO derivation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .naya/evidence
          curl -fsS -X POST \
            -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" \
            -H "Content-Type: application/json" \
            --data '{"mode":"cvo"}' \
            "${CVO_FUNCTION_URL}" > .naya/evidence/live-cvo-runtime-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('.naya/evidence/live-cvo-runtime-receipt.json',encoding='utf-8'))
          assert r['ok'] is True
          c=r['causal_verification']
          assert c['schema']=='NAYANET_CAUSAL_VERIFICATION_V1'
          assert c['causal_assessment']=='CAUSAL_SUPPORTED'
          assert c['verification_status']=='OUTCOME_VERIFIED'
          assert c['production_action_executed'] is True
          print('CVO runtime proof PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-cvo-runtime-receipt
          path: .naya/evidence/live-cvo-runtime-receipt.json
    env:
      CVO_FUNCTION_URL: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-causal-verify

  independent-verification:
    needs: cvo-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Mint independent short-lived GitHub OIDC runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
      - uses: actions/download-artifact@v4
        with:
          name: live-cvo-runtime-receipt
          path: receipts/cvo
      - name: Independently reread persisted CVO from Supabase
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")" \
            -H "Content-Type: application/json" \
            --data '{"mode":"verify"}' \
            "${CVO_FUNCTION_URL}")"
          printf '%s' "$response" > receipts/cvo/independent-verification.json
          python - <<'PY'
          import json
          r=json.load(open('receipts/cvo/independent-verification.json',encoding='utf-8'))
          assert r['ok'] is True, r
          v=r['verification']
          assert v['independent_verification'] is True
          assert v['causal_verification']['verification_status']=='OUTCOME_VERIFIED'
          assert v['causal_verification']['causal_assessment']=='CAUSAL_SUPPORTED'
          print('Independent CVO verification PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-cvo-verification
          path: receipts/cvo/independent-verification.json
    env:
      CVO_FUNCTION_URL: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-causal-verify
