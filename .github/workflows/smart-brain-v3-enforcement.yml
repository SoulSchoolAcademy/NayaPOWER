name: Smart Brain v3 Enforcement

on:
  push:
    branches: [main]
    paths:
      - '.naya/codex/SMART-BRAIN-OPERATING-SYSTEM.md'
      - '.naya/codex/SMART-NOTES-AND-CIS-CONSTITUTION.md'
      - '.naya/codex/HUMAN-CAPABILITY-AND-MASTERY-OPERATING-PROTOCOL.md'
      - '.naya/NAYA-CONTEXT-BOOT-PROTOCOL.md'
      - '.naya/naya-context-manifest.json'
      - '.naya/memory/**'
      - '.naya/runtime/**'
      - 'SUPERBRAIN/AI-BOOT/**'
      - '.github/workflows/smart-brain-v3-enforcement.yml'
  pull_request:
    paths:
      - '.naya/codex/**'
      - '.naya/NAYA-CONTEXT-BOOT-PROTOCOL.md'
      - '.naya/naya-context-manifest.json'
      - '.naya/memory/**'
      - '.naya/runtime/**'
      - 'SUPERBRAIN/AI-BOOT/**'
      - '.github/workflows/smart-brain-v3-enforcement.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

concurrency:
  group: smart-brain-v3-main
  cancel-in-progress: false

jobs:
  brain-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Cold-start Naya activation acceptance
        run: python .naya/runtime/cold_start_activation.py
      - name: Validate Smart Brain
        run: python .naya/memory/smart_notes_v3.py validate
      - name: Validate canonical Naya context manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.naya/naya-context-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          required = '.naya/codex/HUMAN-CAPABILITY-AND-MASTERY-OPERATING-PROTOCOL.md'
          assert required in data['boot_order'], 'human capability protocol missing from boot_order'
          assert data['subjects']['human_capability_and_mastery']['canonical'] == required
          for route_name, route in data['task_routes'].items():
              assert 'human_capability_and_mastery' in route, f'protocol missing from task route: {route_name}'
          assert Path(required).is_file(), f'canonical protocol missing: {required}'
          print('Naya context manifest: HUMAN CAPABILITY & MASTERY protocol registered and routable.')
          PY
      - name: Rebuild derived event index
        run: python .naya/memory/smart_notes_v3.py index
      - name: Audit duplicates and entity collisions
        run: python .naya/memory/duplicate_entity_audit.py
      - name: Run permission scope adversarial tests
        run: python -m unittest discover -s .naya/memory/tests -p 'test_*.py' -v
      - name: Run Smart Brain regression tests
        run: python .naya/memory/test_smart_brain_v3.py -v
      - name: Verify index is clean
        run: git diff --exit-code -- .naya/memory/events/INDEX.json
      - name: Preserve validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smart-brain-validation-diagnostics
          if-no-files-found: ignore
          path: |
            .naya/memory/VALIDATION-REPORT.json
            .naya/memory/DUPLICATE-ENTITY-AUDIT.json

  daily-intelligence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: brain-gate
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Emit verified Daily Intelligence Note Event
        run: |
          DAY=$(TZ=America/Vancouver date -d 'yesterday' +%Y-%m-%d)
          python .naya/memory/emit_daily_intelligence.py --day "$DAY" --timezone America/Vancouver
      - name: Re-verify generated event, duplicates, and index
        run: |
          python .naya/memory/smart_notes_v3.py index
          python .naya/memory/smart_notes_v3.py validate
          python .naya/memory/duplicate_entity_audit.py
          python .naya/memory/test_smart_brain_v3.py -v
          git diff --exit-code -- .naya/memory/events/INDEX.json
      - name: Commit verified CIS artifact
        run: |
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add .naya/memory/events .naya/memory/DUPLICATE-ENTITY-AUDIT.json
          git diff --cached --quiet || git commit -m 'cis: publish verified daily intelligence event'
          git push
