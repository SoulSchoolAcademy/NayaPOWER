name: Smart Brain v3 Enforcement

on:
  push:
    branches: [main]
    paths: ['.naya/memory/**','.naya/runtime/**','.naya/naya-context-manifest.json','.naya/codex/**','SUPERBRAIN/AI-BOOT/**','.github/workflows/smart-brain-v3-enforcement.yml']
  pull_request:
    paths: ['.naya/memory/**','.naya/runtime/**','.naya/naya-context-manifest.json','.naya/codex/**','SUPERBRAIN/AI-BOOT/**','.github/workflows/smart-brain-v3-enforcement.yml']
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
concurrency:
  group: smart-brain-v3-main
  cancel-in-progress: false
jobs:
  brain-gate:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Compile Step 2 runtime
        continue-on-error: true
        run: python -m py_compile .naya/memory/permission_scope.py .naya/memory/smart_notes_v3.py .naya/memory/tests/test_permission_scope.py .naya/memory/test_smart_brain_v3.py
      - name: Run permission scope adversarial tests
        continue-on-error: true
        run: python -m unittest discover -s .naya/memory/tests -p 'test_permission_scope.py' -v
      - name: Run Smart Brain regression tests
        continue-on-error: true
        run: python .naya/memory/test_smart_brain_v3.py -v
      - name: Validate Smart Brain canonical events
        continue-on-error: true
        run: python .naya/memory/smart_notes_v3.py validate
      - name: Cold-start Naya activation acceptance
        continue-on-error: true
        run: python .naya/runtime/cold_start_activation.py
      - name: Validate canonical Naya context manifest
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.naya/naya-context-manifest.json');data=json.loads(path.read_text(encoding='utf-8'));required='.naya/codex/HUMAN-CAPABILITY-AND-MASTERY-OPERATING-PROTOCOL.md'
          assert required in data['boot_order'];assert data['subjects']['human_capability_and_mastery']['canonical']==required
          for route_name,route in data['task_routes'].items():assert 'human_capability_and_mastery' in route,f'protocol missing from task route: {route_name}'
          assert Path(required).is_file();print('manifest OK')
          PY
      - name: Rebuild derived event index
        continue-on-error: true
        run: python .naya/memory/smart_notes_v3.py index
      - name: Audit duplicates and entity collisions
        continue-on-error: true
        run: python .naya/memory/duplicate_entity_audit.py
      - name: Verify index is clean
        continue-on-error: true
        run: git diff --exit-code -- .naya/memory/events/INDEX.json
      - name: Diagnostic summary
        if: always()
        run: |
          echo 'Step 2 diagnostic run completed. Inspect individual step conclusions above.'
      - name: Preserve validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smart-brain-validation-diagnostics
          if-no-files-found: ignore
          path: |
            .naya/memory/VALIDATION-REPORT.json
            .naya/memory/DUPLICATE-ENTITY-AUDIT.json
