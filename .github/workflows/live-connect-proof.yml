# Live CONNECT Graph Proof
#
# PRODUCTION GATE:
# Run this workflow only after the exact current main revision has completed the
# governed production promotion and Supabase reports successful deployment.
#
# This proof intentionally exercises CURRENT canonical CONNECT behavior only:
# - the canonical 22-type relationship vocabulary;
# - R1 writer normalization/persistence (20260930040000);
# - governed runtime threading of p_connections (20260930050000);
# - KNOW supersession chasing and capability-filtered related context;
# - retrieval never creates authority.
#
# It does NOT ratify or depend on Graph Relationship Contract V2 candidate
# consent/applicability/temporal semantics. Those remain separately governed.
#
# What this proves (CONNECT as an independently qualified kernel
# responsibility):
#   POSITIVE: edges written through the governed runtime change retrieval
#     for the right reason -- superseding A with B via the runtime
#     supersede bridge makes live KNOW retrieve serve B (the current
#     truth) instead of A.
#   NEGATIVE 1 (forged type): a FORGED relationship type passed in
#     p_connections is normalized away at write time and never persists.
#   NEGATIVE 2 (irrelevant capability): a SUPPORTS edge to a block that
#     does not serve the requested capability does not annotate the
#     retrieved related_context.
# ONE GRAPH is preserved throughout: nayanet_brain_relationships stays the
# system of record; connections is a write-time projection.
name: Live CONNECT Graph Proof

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact commit SHA that refs/heads/main must resolve to before consequential CONNECT proof steps'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-connect-proof
  cancel-in-progress: false

env:
  LAW_RUNTIME: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-law-runtime
  KNOW_RUNTIME: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-know-runtime
  COMMIT_RUNTIME: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-intelligence-commit-runtime

jobs:
  connect-graph-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Verify resolved source matches expected_source_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="${{ inputs.expected_source_sha }}"
          if [ -z "$expected" ]; then
            echo "expected_source_sha is required"
            exit 1
          fi
          resolved="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)"
          printf '%s' "$resolved" > resolved-source-sha.txt
          echo "expected_source_sha=$expected"
          echo "resolved_main_sha=$resolved"
          if [ "$expected" != "$resolved" ]; then
            echo "SOURCE_SHA_MISMATCH expected=$expected resolved=$resolved"
            exit 1
          fi
          echo "SOURCE_SHA_MATCH=PASS"

      - uses: actions/checkout@v5

      - name: Mint governed organism identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nayanet-runtime" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"

      - name: LAW authorizes CONNECT proof context (intelligence_commit)
        shell: bash
        run: |
          set -euo pipefail
          cat > law-connect-request.json <<'JSON'
          {
            "mode":"evaluate",
            "request":{
              "action":"intelligence_commit",
              "target":"NAYA-NODE-0001",
              "project_id":"NayaNET",
              "resource_scope":"CONNECT_GRAPH_PROOF",
              "privacy":"PRIVATE"
            }
          }
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @law-connect-request.json "$LAW_RUNTIME" > law-connect-authorized.json
          python - <<'PY'
          import json
          x=json.load(open("law-connect-authorized.json"))
          assert x["ok"] is True, x
          assert x["decision"]["status"]=="AUTHORIZED", x
          refs=x["decision"].get("authority_refs",[])
          assert len(refs)==1, x
          json.dump({"connect_grant_id":refs[0]},open("ids.json","w"),indent=2)
          PY

      - name: LAW authorizes bounded KNOW context (naya_node_apply)
        shell: bash
        run: |
          set -euo pipefail
          cat > law-know-request.json <<'JSON'
          {
            "mode":"evaluate",
            "request":{
              "action":"naya_node_apply",
              "target":"NAYA-NODE-0001",
              "project_id":"NayaNET",
              "resource_scope":"KNOW_CONTEXTUAL_RETRIEVAL",
              "privacy":"PRIVATE"
            }
          }
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @law-know-request.json "$LAW_RUNTIME" > law-know-authorized.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("law-know-authorized.json"))
          assert x["ok"] is True, x
          assert x["decision"]["status"]=="AUTHORIZED", x
          ids["know_law_receipt_id"]=x["receipt"]["id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY

      - name: POSITIVE - commit block A through the governed runtime
        shell: bash
        run: |
          set -euo pipefail
          grant="$(python -c 'import json; print(json.load(open("ids.json"))["connect_grant_id"])')"
          python - "$grant" <<'PY'
          import json,sys,uuid
          grant=sys.argv[1]
          req={
            "mode":"execute","p_authority_grant_id":grant,
            "p_event_id":"CONNECT-PROOF-A-"+uuid.uuid4().hex,
            "p_title":"CONNECT proof block A (superseded)",
            "p_content":"Preserve provenance before applying retained intelligence; retrieval never grants authority. CONNECT positive baseline.",
            "p_category":"CONNECT_PROOF","p_topic":"CONNECT_PROOF",
            "p_target_id":"NAYA-NODE-0001","p_project_id":"NayaNET"
          }
          json.dump(req,open("commit-a-request.json","w"),indent=2)
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @commit-a-request.json "$COMMIT_RUNTIME" > commit-a.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("commit-a.json"))
          assert x["ok"] is True, x
          r=x["result"]
          assert r["ok"] is True, r
          ids["a_block_row_id"]=r["block_row_id"]
          ids["a_intelligent_block_id"]=r["intelligent_block_id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY

      - name: POSITIVE - supersede A with block B through the governed runtime
        shell: bash
        run: |
          set -euo pipefail
          ids_json="$(cat ids.json)"
          grant="$(python -c 'import json; print(json.load(open("ids.json"))["connect_grant_id"])')"
          a_row="$(python -c 'import json; print(json.load(open("ids.json"))["a_block_row_id"])')"
          python - "$grant" "$a_row" <<'PY'
          import json,sys,uuid
          grant,a_row=sys.argv[1],sys.argv[2]
          req={
            "mode":"supersede","p_authority_grant_id":grant,
            "p_superseded_block_id":a_row,
            "p_title":"CONNECT proof block B (current truth)",
            "p_content":"Preserve provenance before applying retained intelligence; retrieval never grants authority. CONNECT positive successor.",
            "p_project_id":"NayaNET",
            "p_idempotency_key":"CONNECT-PROOF-"+uuid.uuid4().hex
          }
          json.dump(req,open("supersede-b-request.json","w"),indent=2)
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @supersede-b-request.json "$COMMIT_RUNTIME" > supersede-b.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("supersede-b.json"))
          assert x["ok"] is True, x
          assert x["status"]=="SUPERSEDED", x
          r=x["result"]
          assert r["supersedes_block_id"]==ids["a_block_row_id"], r
          ids["b_intelligent_block_id"]=r["intelligent_block_id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY

      - name: POSITIVE - KNOW retrieve serves B, the current truth
        shell: bash
        run: |
          set -euo pipefail
          law_id="$(python -c 'import json; print(json.load(open("ids.json"))["know_law_receipt_id"])')"
          cat > know-positive-request.json <<JSON
          {
            "mode":"retrieve",
            "law_receipt_id":"$law_id",
            "task_id":"CONNECT-PROOF-POSITIVE-001",
            "task_class":"CONNECT_SUPERSESSION",
            "required_capability":"provenance_preservation"
          }
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @know-positive-request.json "$KNOW_RUNTIME" > know-positive.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("know-positive.json"))
          assert x["ok"] is True, x
          r=x["result"]
          assert r["status"]=="HIT", x
          # The superseded block A is excluded by status; the SUPERSEDES
          # edge stamped atomically by the supersession writer makes B the
          # served current truth. A relevant relationship changed behavior
          # for the right reason.
          assert r["selected_block_id"]==ids["b_intelligent_block_id"], x
          assert r["retrieval_creates_authority"] is False, x
          ids["positive_receipt_id"]=x["receipt"]["id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY

      - name: NEGATIVE 1 - forged relationship type is normalized away at write time
        shell: bash
        run: |
          set -euo pipefail
          grant="$(python -c 'import json; print(json.load(open("ids.json"))["connect_grant_id"])')"
          a_ib="$(python -c 'import json; print(json.load(open("ids.json"))["a_intelligent_block_id"])')"
          python - "$grant" "$a_ib" <<'PY'
          import json,sys,uuid
          grant,a_ib=sys.argv[1],sys.argv[2]
          req={
            "mode":"execute","p_authority_grant_id":grant,
            "p_event_id":"CONNECT-PROOF-C-"+uuid.uuid4().hex,
            "p_title":"CONNECT proof block C (forged edge)",
            "p_content":"This block attempts a forged relationship type. The writer must normalize it away.",
            "p_category":"CONNECT_PROOF","p_topic":"CONNECT_PROOF",
            "p_target_id":"NAYA-NODE-0001","p_project_id":"NayaNET",
            "p_connections":[{"type":"FORGED_REL","target":a_ib}]
          }
          json.dump(req,open("commit-c-request.json","w"),indent=2)
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @commit-c-request.json "$COMMIT_RUNTIME" > commit-c.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("commit-c.json"))
          assert x["ok"] is True, x
          r=x["result"]
          assert r["ok"] is True, r
          # Read the block back through the governed verify mode and assert
          # the forged edge never persisted (fail closed).
          verify={
            "mode":"verify",
            "receipt_id":r["receipt_id"],"event_id":r["event_id"],
            "intelligent_block_id":r["intelligent_block_id"],
            "lineage_id":r["lineage_id"],"relationship_id":r["relationship_id"],
            "index_id":r["index_id"],"checkpoint_id":r["checkpoint_id"]
          }
          json.dump(verify,open("verify-c-request.json","w"),indent=2)
          ids["c_intelligent_block_id"]=r["intelligent_block_id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @verify-c-request.json "$COMMIT_RUNTIME" > verify-c.json
          python - <<'PY'
          import json
          x=json.load(open("verify-c.json"))
          assert x["ok"] is True, x
          block=x["persisted"]["block"]
          assert block["connections"]==[], block["connections"]
          assert "FORGED_REL" not in json.dumps(block["connections"]), block["connections"]
          PY

      - name: NEGATIVE 2 - irrelevant edge does not annotate retrieval
        shell: bash
        run: |
          set -euo pipefail
          grant="$(python -c 'import json; print(json.load(open("ids.json"))["connect_grant_id"])')"
          python - "$grant" <<'PY'
          import json,sys,uuid
          grant=sys.argv[1]
          # Block S: eligible but does NOT serve provenance_preservation
          # (content avoids the capability-bearing lesson phrase).
          s={
            "mode":"execute","p_authority_grant_id":grant,
            "p_event_id":"CONNECT-PROOF-S-"+uuid.uuid4().hex,
            "p_title":"CONNECT proof block S (irrelevant capability)",
            "p_content":"Arithmetic ledger facts for reconciliation drills. Nothing about retained intelligence here.",
            "p_category":"CONNECT_PROOF","p_topic":"CONNECT_PROOF",
            "p_target_id":"NAYA-NODE-0001","p_project_id":"NayaNET"
          }
          json.dump(s,open("commit-s-request.json","w"),indent=2)
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @commit-s-request.json "$COMMIT_RUNTIME" > commit-s.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("commit-s.json"))
          assert x["ok"] is True, x
          ids["s_intelligent_block_id"]=x["result"]["intelligent_block_id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY
          s_ib="$(python -c 'import json; print(json.load(open("ids.json"))["s_intelligent_block_id"])')"
          python - "$grant" "$s_ib" <<'PY'
          import json,sys,uuid
          grant,s_ib=sys.argv[1],sys.argv[2]
          # Block D: serves provenance_preservation AND carries a SUPPORTS
          # edge to S. The edge is real and persists, but S must not
          # annotate the result because it does not serve the requested
          # capability.
          d={
            "mode":"execute","p_authority_grant_id":grant,
            "p_event_id":"CONNECT-PROOF-D-"+uuid.uuid4().hex,
            "p_title":"CONNECT proof block D (supports irrelevant S)",
            "p_content":"Preserve provenance before applying retained intelligence; retrieval never grants authority. CONNECT negative-two.",
            "p_category":"CONNECT_PROOF","p_topic":"CONNECT_PROOF",
            "p_target_id":"NAYA-NODE-0001","p_project_id":"NayaNET",
            "p_connections":[{"type":"SUPPORTS","target":s_ib}]
          }
          json.dump(d,open("commit-d-request.json","w"),indent=2)
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @commit-d-request.json "$COMMIT_RUNTIME" > commit-d.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("commit-d.json"))
          assert x["ok"] is True, x
          assert x["result"]["ok"] is True, x
          # Read D back: the SUPPORTS edge is REAL and persisted -- the
          # negative assertion below is that a real edge to an irrelevant
          # block does not annotate retrieval.
          r=x["result"]
          verify={
            "mode":"verify",
            "receipt_id":r["receipt_id"],"event_id":r["event_id"],
            "intelligent_block_id":r["intelligent_block_id"],
            "lineage_id":r["lineage_id"],"relationship_id":r["relationship_id"],
            "index_id":r["index_id"],"checkpoint_id":r["checkpoint_id"]
          }
          json.dump(verify,open("verify-d-request.json","w"),indent=2)
          ids["d_intelligent_block_id"]=r["intelligent_block_id"]
          json.dump(ids,open("ids.json","w"),indent=2)
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @verify-d-request.json "$COMMIT_RUNTIME" > verify-d.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("verify-d.json"))
          assert x["ok"] is True, x
          conns=x["persisted"]["block"]["connections"]
          assert any(c.get("relationship_type")=="SUPPORTS" and c.get("target_block_id")==ids["s_intelligent_block_id"] for c in conns), conns
          PY
          law_id="$(python -c 'import json; print(json.load(open("ids.json"))["know_law_receipt_id"])')"
          cat > know-negative-request.json <<JSON
          {
            "mode":"retrieve",
            "law_receipt_id":"$law_id",
            "task_id":"CONNECT-PROOF-NEG2-001",
            "task_class":"CONNECT_IRRELEVANT_EDGE",
            "required_capability":"provenance_preservation"
          }
          JSON
          curl -fsS -X POST             -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc.jwt")"             -H "Content-Type: application/json"             --data-binary @know-negative-request.json "$KNOW_RUNTIME" > know-negative.json
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          x=json.load(open("know-negative.json"))
          assert x["ok"] is True, x
          r=x["result"]
          assert r["status"]=="HIT", x
          # The irrelevant edge must not influence the result: block S is
          # never annotated in related_context, whatever block is selected.
          annotated=[e.get("block_id") for e in r.get("related_context",[])]
          assert ids["s_intelligent_block_id"] not in annotated, annotated
          assert r["retrieval_creates_authority"] is False, x
          PY

      - name: Write durable CONNECT proof receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          ids=json.load(open("ids.json"))
          receipt={
            "schema":"naya.connect.proof.v1",
            "node":"CONNECT",
            "positive":{
              "selected_block_id":json.load(open("know-positive.json"))["result"]["selected_block_id"],
              "expected_block_id":ids["b_intelligent_block_id"],
              "superseded_block_id":ids["a_intelligent_block_id"],
              "result":"PASS: relevant SUPERSEDES relationship changed retrieval for the right reason"
            },
            "negative_forged_type":{
              "block_id":ids["c_intelligent_block_id"],
              "persisted_connections":json.load(open("verify-c.json"))["persisted"]["block"]["connections"],
              "result":"PASS: forged relationship type normalized away at write time (fail closed)"
            },
            "negative_irrelevant_capability":{
              "supporting_block_id":ids["s_intelligent_block_id"],
              "related_context":json.load(open("know-negative.json"))["result"]["related_context"],
              "result":"PASS: SUPPORTS edge to a block not serving the requested capability did not annotate retrieval"
            },
            "ids":ids
          }
          json.dump(receipt,open("connect-proof-receipt.json","w"),indent=2)
          print(json.dumps(receipt,indent=2)[:2000])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: connect-graph-proof
          path: |
            connect-proof-receipt.json
            law-connect-authorized.json
            law-know-authorized.json
            commit-a.json
            supersede-b.json
            know-positive.json
            commit-c.json
            verify-c.json
            commit-s.json
            commit-d.json
            verify-d.json
            know-negative.json
            ids.json

