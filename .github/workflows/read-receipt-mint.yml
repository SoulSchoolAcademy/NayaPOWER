# Read-Receipt Mint — trusted issuance for protocol read receipts.
#
# This workflow IS the authenticity root that closes the read-receipt forgery:
# a read receipt is authentic iff THIS workflow (base code, trusted runner)
# minted its exact bytes. The boot gate verifies via the live API that the
# receipt's attested run exists in the gated repository, ran this workflow to
# success via workflow_dispatch, and its artifact's receipt.json is
# byte-identical to the presented receipt. A self-minted receipt with correct
# answers and a valid-looking SHA-256 hash cannot forge this.
#
# HOW TO USE (agents): answer the authority questions, then dispatch:
#   gh workflow run read-receipt-mint.yml \
#     --ref <branch> \
#     -f agent_id='naya-5' \
#     -f answers='{"q1": "Shawn Vibert", "q2": "...", ...}'
# Download the `read-receipt-<run_id>` artifact; present receipt.json at boot.
# The mint grades the answers itself — wrong answers mint nothing.
#
# HONEST CAVEAT: attestation proves the trusted runner ran and graded THESE
# answers, not which agent it ran for. The agent_id is caller-supplied.
#
# SECURITY: workflow_dispatch on the base repo requires write access — a seat
# without it cannot mint. The mint binds only what it grades; the boot gate
# re-verifies issuance via the API, so a forged attestation cannot verify.
name: Read-Receipt Mint

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Claiming agent seat id (attested, not proven)'
        required: true
      answers:
        description: 'JSON object mapping question id -> answer text'
        required: true

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned SHA)
        with:
          python-version: "3.12"
      - name: Mint run-attested read receipt
        run: >-
          python3 tools/read_receipt_mint.py
          --agent-id '${{ inputs.agent_id }}'
          --answers '${{ inputs.answers }}'
          --out receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned SHA)
        with:
          name: read-receipt-${{ github.run_id }}
          path: receipt.json
          if-no-files-found: error
