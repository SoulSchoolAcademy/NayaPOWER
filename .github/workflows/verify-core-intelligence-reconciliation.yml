name: Verify Core Intelligence Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.naya/runtime/core_intelligence_reconciliation.py'
      - '.naya/runtime/test_core_intelligence_reconciliation.py'
      - '.github/workflows/verify-core-intelligence-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python .naya/runtime/test_core_intelligence_reconciliation.py
