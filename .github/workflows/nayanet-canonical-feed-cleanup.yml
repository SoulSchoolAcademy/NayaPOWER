name: NayaNET Canonical Feed Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[nayanet-canonical-feed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate experimental feed and apply canonical upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('2026 09 09 5:09 pm NayaNET HUB')
          s=p.read_text(encoding='utf-8')
          pattern=r'\s*<!-- NAYANET ULTIMATE SURGICAL LAYER: 5:09 HOUSE \+ 5:11 FEED CONCEPTS -->\s*<style id="nayanet-ultimate-feed-css">.*?<script id="nayanet-ultimate-feed-js">.*?</script>\s*'
          cleaned,n=re.subn(pattern,'\n',s,flags=re.S)
          if n<1: raise SystemExit('Expected experimental Ultimate layer not found')
          # The current 5:09 source already contains the proven V17/V4 feed. Evolve that renderer; do not create Feed #2.
          upgrade=r'''<!-- NAYANET CANONICAL FEED SURGICAL UPGRADE V1 -->
          <style id="nayanet-canonical-feed-upgrade-style">
          #nayanet-elite-feed .ncf-modebar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 16px;padding:7px;border:1px solid #ffffff15;border-radius:16px;background:#050507;box-shadow:inset 0 1px #fff3,0 16px 35px #0009}
          #nayanet-elite-feed .ncf-modebar span{font-size:7px;font-weight:1000;letter-spacing:.13em;color:#817b89;padding:0 6px}
          #nayanet-elite-feed .ncf-mode{min-height:36px;padding:0 11px;border:1px solid #ffffff1b;border-radius:10px;background:#0b0b10;color:#a9a3af;font-size:7px;font-weight:1000;letter-spacing:.06em}
          #nayanet-elite-feed .ncf-mode[aria-pressed=true]{color:#fff;border-color:#d86cff77;background:#1b1025;box-shadow:0 0 20px #d86cff14}
          #nayanet-elite-feed .ncf-depth{display:grid;grid-template-columns:1.1fr .9fr;gap:9px;margin:0 19px 13px}
          #nayanet-elite-feed .ncf-panel{padding:12px 13px;border:1px solid #ffffff14;border-radius:13px;background:#07070b}
          #nayanet-elite-feed .ncf-panel b{display:block;font-size:7px;letter-spacing:.14em;color:#d5a4ff;margin-bottom:5px}
          #nayanet-elite-feed .ncf-panel span{display:block;color:#bcb6c3;font-size:9px;line-height:1.55}
          #nayanet-elite-feed .ncf-trust{border-color:#55b9ee35}.ncf-trust b{color:#8ed9ff!important}
          #nayanet-elite-feed .ncf-related{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
          #nayanet-elite-feed .ncf-related a{padding:6px 8px;border:1px solid #ffffff18;border-radius:8px;background:#09090d;color:#c9c2cf;font-size:7px;text-decoration:none}
          #nayanet-elite-feed .ncf-related a:hover{border-color:#d86cff66;color:#fff}
          #nayanet-elite-feed.ncf-skim .n3-perspectives{display:none!important}#nayanet-elite-feed.ncf-skim .n3-footer{display:none!important}
          #nayanet-elite-feed.ncf-verify .n3-perspective:not(:has(.n3-phead b)){display:block}
          #nayanet-elite-feed.ncf-verify .ncf-depth{display:grid}
          #nayanet-elite-feed.ncf-operate .n3-perspective{display:none!important}#nayanet-elite-feed.ncf-operate .n3-perspective:last-child{display:block!important}
          #nayanet-elite-feed.ncf-teach .n3-perspective{display:none!important}#nayanet-elite-feed.ncf-teach .n3-perspective:nth-child(2),#nayanet-elite-feed.ncf-teach .n3-perspective:nth-child(3){display:block!important}
          @media(max-width:760px){#nayanet-elite-feed .ncf-depth{grid-template-columns:1fr;margin-left:12px;margin-right:12px}#nayanet-elite-feed .ncf-mode{min-height:40px;flex:1 1 auto}}
          @media(prefers-reduced-motion:reduce){#nayanet-elite-feed .ncf-mode{transition:none!important}}
          </style>
          <script id="nayanet-canonical-feed-upgrade-runtime">
          (()=>{'use strict';
          const ROOT='#nayanet-elite-feed';
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
          const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
          function enrich(){
            const feed=document.querySelector(ROOT); if(!feed||feed.dataset.ncfReady==='1')return false;
            feed.dataset.ncfReady='1';
            const host=feed.parentElement||feed;
            const bar=document.createElement('div');bar.className='ncf-modebar';
            bar.innerHTML='<span>VIEW</span>'+['SKIM','LEARN','VERIFY','OPERATE','EXPLORE','TEACH'].map((m,i)=>`<button class="ncf-mode" data-ncf-mode="${m}" aria-pressed="${i===0}">${m}</button>`).join('');
            feed.insertBefore(bar,feed.firstChild);
            const apply=(mode)=>{feed.classList.remove('ncf-skim','ncf-learn','ncf-verify','ncf-operate','ncf-explore','ncf-teach');feed.classList.add('ncf-'+mode.toLowerCase());bar.querySelectorAll('.ncf-mode').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.ncfMode===mode)));feed.querySelectorAll('.n3-block').forEach((b,i)=>{let d=b.querySelector('.ncf-depth');if(!d){d=document.createElement('div');d.className='ncf-depth';const title=clean(b.querySelector('.n3-title')?.textContent||'Intelligent Block');const ps=[...b.querySelectorAll('.n3-perspective')];const lesson=ps.find(x=>/LESSON/i.test(x.textContent||''));const use=ps.find(x=>/HOW TO USE IT/i.test(x.textContent||''));const meaning=clean(lesson?.querySelector('.n3-pbody')?.textContent||'Meaning has not been independently synthesized in this runtime.');const action=clean(use?.querySelector('.n3-pbody')?.textContent||'No explicit action has been asserted by the source event.');const others=[...feed.querySelectorAll('.n3-block')].filter(x=>x!==b).slice(0,4);d.innerHTML=`<div class="ncf-panel"><b>MEANING</b><span>${esc(meaning)}</span></div><div class="ncf-panel"><b>NEXT ACTION</b><span>${esc(action)}</span></div><div class="ncf-panel ncf-trust"><b>TRUST / PROVENANCE</b><span>Source is the current canonical Hub feed. Interpretation is presented only where the source block provides it. Runtime/backend verification remains a separate release gate.</span></div><div class="ncf-panel"><b>RELATED INTELLIGENCE</b><span>Neighboring blocks available for exploration — no typed graph edge is asserted without canonical relationship data.</span><div class="ncf-related">${others.map((o,j)=>`<a href="#ncf-related-${i}-${j}">${esc(clean(o.querySelector('.n3-title')?.textContent||'Related intelligence'))}</a>`).join('')}</div></div>`;b.insertBefore(d,b.querySelector('.n3-perspectives'));}})};
            bar.addEventListener('click',e=>{const b=e.target.closest('[data-ncf-mode]');if(b)apply(b.dataset.ncfMode)});
            apply('SKIM');
            return true;
          }
          const boot=()=>{if(!enrich()){let n=0;const t=setInterval(()=>{if(enrich()||++n>20)clearInterval(t)},250)}};
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
          })();
          </script>
          <!-- NAYANET CANONICAL FEED SURGICAL UPGRADE V1 END -->
          '''
          cleaned=cleaned.replace('</body>',upgrade+'\n</body>',1)
          if cleaned.count('NAYANET CANONICAL FEED SURGICAL UPGRADE V1')!=2: raise SystemExit('Upgrade insertion gate failed')
          if 'NAYANET ULTIMATE SURGICAL LAYER' in cleaned: raise SystemExit('Duplicate experimental layer remains')
          if cleaned.count('id="nayanet-elite-feed"')>1: raise SystemExit('Second feed renderer detected')
          p.write_text(cleaned,encoding='utf-8')
          print('Canonical feed cleanup built:',len(cleaned),'bytes; removed experimental layers:',n)
          PY
      - name: Verify and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('2026 09 09 5:09 pm NayaNET HUB').read_text(encoding='utf-8')
          assert 'NAYANET ULTIMATE SURGICAL LAYER' not in s
          assert s.count('NAYANET CANONICAL FEED SURGICAL UPGRADE V1')==2
          assert s.count('id="nayanet-elite-feed"')<=1
          for x in ['SKIM','LEARN','VERIFY','OPERATE','EXPLORE','TEACH','TRUST / PROVENANCE','RELATED INTELLIGENCE','NEXT ACTION']:
              assert x in s,x
          assert s.count('<html')==1 and s.count('</html>')==1
          print('CANONICAL FEED RELEASE GATE PASS')
          PY
          git config user.name 'NayaNET Canonical Builder'
          git config user.email 'actions@nayanet.local'
          rm -f .naya/ultimate-build-trigger.txt .naya/ultimate-build-trigger-v3.txt .naya/ultimate-build-trigger-v4.txt
          rm -f .github/workflows/nayanet-ultimate-surgical-build.yml .github/workflows/nayanet-ultimate-surgical-build-v2.yml .github/workflows/nayanet-ultimate-surgical-commit.yml
          git add '2026 09 09 5:09 pm NayaNET HUB' .naya .github/workflows/nayanet-canonical-feed-cleanup.yml
          git commit -m '[nayanet-canonical-feed] normalize one canonical Intelligent Feed renderer'
          git push
