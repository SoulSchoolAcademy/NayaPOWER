name: NayaNET Exact Runtime Smart Feed Visual Proof

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - '.github/workflows/nayanet-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-exact-runtime-smart-feed-visual-proof
  cancel-in-progress: false

env:
  RUNTIME: https://aged-art-7c12.nayanet.workers.dev

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture exact-runtime desktop and mobile proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          cat > proof.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';
          const url = process.env.RUNTIME + '/?proof=' + process.env.GITHUB_SHA;
          const browser = await chromium.launch({headless:true});
          const results=[];
          async function capture(name, contextOptions){
            const context=await browser.newContext(contextOptions);
            const page=await context.newPage();
            await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1200);
            const state=await page.evaluate(()=>{
              const visible=el=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'&&r.width>0&&r.height>0};
              const text=document.body.innerText;
              const board=document.querySelector('.smart-feed-board');
              const nutshell=document.querySelector('.sfb-nutshell');
              const perspectives=[...document.querySelectorAll('.sfb-perspective')];
              const meaning=document.querySelector('.sfb-meaning-grid');
              const actions=document.querySelector('.sfb-actions');
              const comment=document.querySelector('.sfb-comment');
              const lenses=document.querySelector('.sfb-lenses');
              const headerActions=document.querySelector('.sfb-header-actions');
              const forbidden=['Where\'s Naya Now','Where’s Naya Now','SUPERBRAIN','PASS THE TORCH','VERIFY STATE'];
              return {
                title:document.title,
                viewportWidth:innerWidth,
                boardVisible:visible(board),
                nutshellVisible:visible(nutshell),
                perspectiveCount:perspectives.length,
                meaningVisible:visible(meaning),
                actionsVisible:visible(actions),
                commentVisible:visible(comment),
                lensesVisible:visible(lenses),
                headerActionsVisible:visible(headerActions),
                collective:text.includes('COLLECTIVE INTELLIGENCE'),
                personal:text.includes('PERSONAL INTELLIGENCE'),
                activity:text.includes('ACTIVITY FEED'),
                nutshell:text.includes('IN A NUTSHELL'),
                human:text.includes('01 · HUMAN'),
                child:text.includes('02 · CHILD'),
                grandma:text.includes('03 · GRANDMA'),
                naya:text.includes('04 · NAYA'),
                machine:text.includes('05 · MACHINE / EVIDENCE'),
                learned:text.includes('WHAT WE LEARNED'),
                means:text.includes('WHAT IT MEANS'),
                action:text.includes('WHAT TO DO'),
                ask:text.includes('ASK NAYA'),
                createSpace:text.includes('CREATE SPACE'),
                favorite:text.includes('Favorite intelligence'),
                save:text.includes('Save intelligence'),
                rate:text.includes('RATE / RANK'),
                comment:text.includes('COMMENT'),
                share:text.includes('SHARE'),
                connect:text.includes('CONNECT'),
                related:text.includes('INTELLIGENCE GRAPH'),
                forbidden:forbidden.filter(x=>text.toLowerCase().includes(x.toLowerCase()))
              };
            });
            const required=state=>state.boardVisible&&state.nutshellVisible&&state.perspectiveCount>=6&&state.meaningVisible&&state.actionsVisible&&state.commentVisible&&state.lensesVisible&&state.headerActionsVisible&&state.collective&&state.personal&&state.activity&&state.nutshell&&state.human&&state.child&&state.grandma&&state.naya&&state.machine&&state.learned&&state.means&&state.action&&state.ask&&state.createSpace&&state.favorite&&state.save&&state.rate&&state.comment&&state.share&&state.connect&&state.related&&state.forbidden.length===0;
            if(!required(state)){console.log(JSON.stringify(state,null,2));throw new Error(`SMART_FEED_VISUAL_PROOF_FAILED_${name.toUpperCase()}`)}
            await page.screenshot({path:`proof/${name}.png`,fullPage:true});
            fs.writeFileSync(`proof/${name}.json`,JSON.stringify(state,null,2));
            results.push({name,...state});
            await context.close();
          }
          await capture('desktop',{viewport:{width:1440,height:1000},deviceScaleFactor:1});
          await capture('mobile',{...devices['iPhone 13']});
          fs.writeFileSync('proof/visual-proof.json',JSON.stringify({url,results},null,2));
          await browser.close();
          EOF
          node proof.mjs

      - name: Build human-readable proof receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > proof/RELEASE-RECEIPT.md <<EOF
          # NayaNET Smart Feed — Exact Runtime Visual Proof

          **STATUS:** AUTOMATED VISUAL PROOF PASS — HUMAN VISUAL APPROVAL STILL REQUIRED
          **SOURCE COMMIT:** $GITHUB_SHA
          **EXACT RUNTIME:** $RUNTIME/
          **PROOF RUN:** https://github.com/SoulSchoolAcademy/NayaPOWER/actions/runs/$GITHUB_RUN_ID

          ## Verified
          - Canonical Smart Board is visible.
          - Three Smart Feed lenses are visible.
          - Collective Intelligence, Personal Intelligence, and Activity Feed are present.
          - In a Nutshell is visible.
          - Human, Child, Grandma, Naya, and Machine perspectives are present.
          - What We Learned, What It Means, and What To Do are present.
          - Ask Naya, Create Space, Favorite, Save, Rate/Rank, Share, Connect, and Comment are present.
          - Forbidden internal Superbrain/operator UI is absent from the rendered runtime.
          - Desktop and iPhone-sized browser sessions rendered from the exact public runtime.

          Automated visual proof is not a substitute for Shawn's subjective 10/10 product approval.
          EOF

      - name: Upload exact-runtime visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-SMART-FEED-VISUAL-PROOF-${{ github.sha }}
          path: proof/
          if-no-files-found: error
          retention-days: 30
