name: NayaNET Exact Runtime Visual Proof

on:
  push:
    branches: [main]
    paths:
      - '.naya/build/SMART_FEED_RELEASE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-exact-runtime-visual-proof
  cancel-in-progress: false

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    env:
      RUNTIME: https://aged-art-7c12.nayanet.workers.dev
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture exact-runtime desktop and mobile proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          cat > proof.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';
          const url = process.env.RUNTIME + '/?proof=' + process.env.GITHUB_SHA;
          const browser = await chromium.launch({headless:true});
          const results = [];
          async function capture(name, contextOptions) {
            const context = await browser.newContext(contextOptions);
            const page = await context.newPage();
            await page.goto(url, {waitUntil:'networkidle', timeout:60000});
            await page.waitForTimeout(1800);
            const state = await page.evaluate(() => {
              const visible = el => { if(!el)return false; const s=getComputedStyle(el),r=el.getBoundingClientRect(); return s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'&&r.width>0&&r.height>0; };
              const rail=document.querySelector('.activationRail');
              const sidebar=document.querySelector('.sidebar');
              const feed=document.querySelector('.homeFeed .intelligentBlocks');
              const blocks=[...document.querySelectorAll('.homeFeed .intelligentBlock')];
              const masterLayers=[...document.querySelectorAll('.master-v2-layer')];
              const main=document.querySelector('main.main');
              return {
                title:document.title,
                sidebarVisible:visible(sidebar),
                feedVisible:visible(feed),
                blockCount:blocks.length,
                masterLayerCount:masterLayers.length,
                rightRailVisible:visible(rail),
                mainWidth:main?.getBoundingClientRect().width||0,
                viewportWidth:innerWidth,
                activity:document.body.innerText.includes('ACTIVITY INTELLIGENCE'),
                personal:document.body.innerText.includes('PERSONAL INTELLIGENCE'),
                collective:document.body.innerText.includes('COLLECTIVE INTELLIGENCE'),
                nutshell:document.body.innerText.includes('IN A NUTSHELL'),
                human:document.body.innerText.includes('HUMAN NOTE'),
                child:document.body.innerText.includes('CHILD NOTE'),
                grandma:document.body.innerText.includes('GRANDMA NOTE'),
                naya:document.body.innerText.includes('NAYA NOTE'),
                machine:document.body.innerText.includes('MACHINE NOTE'),
                learned:document.body.innerText.includes('WHAT WE LEARNED'),
                means:document.body.innerText.includes('WHAT IT MEANS'),
                v1Present:document.body.innerText.includes('NAYANET SMART FEED MASTER V1'),
                forceMountPresent:!!document.querySelector('#nayaSmartFeedForceMount')
              };
            });
            if (!state.feedVisible || !state.blockCount || state.masterLayerCount < state.blockCount*7 || !state.activity || !state.personal || !state.collective || !state.nutshell || !state.human || !state.child || !state.grandma || !state.naya || !state.machine || !state.learned || !state.means || state.rightRailVisible || state.v1Present || state.forceMountPresent) {
              console.log(JSON.stringify(state,null,2));
              throw new Error(`VISUAL_LAYOUT_FAILED_${name.toUpperCase()}`);
            }
            await page.screenshot({path:`proof/${name}.png`,fullPage:true});
            fs.writeFileSync(`proof/${name}.json`,JSON.stringify(state,null,2));
            results.push({name,...state});
            await context.close();
          }
          await capture('desktop',{viewport:{width:1440,height:1000},deviceScaleFactor:1});
          await capture('mobile',{...devices['iPhone 13']});
          fs.writeFileSync('proof/visual-proof.json',JSON.stringify({url,results},null,2));
          await browser.close();
          EOF
          node proof.mjs

      - name: Build human-readable proof receipt as artifact
        shell: bash
        run: |
          set -euo pipefail
          cat > proof/RELEASE-RECEIPT.md <<EOF
          # NayaNET Smart Feed Master V2 — Exact Runtime Visual Proof

          **STATUS:** VISUALLY VERIFIED — AWAITING HUMAN APPROVAL

          **SOURCE COMMIT:** $GITHUB_SHA

          **EXACT RUNTIME:** $RUNTIME/

          **PROOF RUN:** https://github.com/SoulSchoolAcademy/NayaPOWER/actions/runs/$GITHUB_RUN_ID

          ## Mission
          Replace the failed compressed/two-column Smart Feed experiment with one substantial Intelligent Block presentation that preserves the existing feed intelligence and uses the strongest visual language already present in the Hub.

          ## Automated visual proof
          - Existing center Intelligent Feed remains the feed surface.
          - No persistent right activation rail is visible.
          - Existing left navigation remains present on desktop.
          - Activity / Personal / Collective intelligence language remains present.
          - Each rendered Intelligent Block contains the unified seven-layer intelligence grammar plus the Nutshell and Meaning endpoints.
          - Desktop and mobile browser sessions rendered successfully from the exact public runtime.
          - The previous V1 master and force-mount composition are absent from the public runtime.

          ## Human approval
          Shawn must judge the visual quality and whether the synthesis truly hits the extraordinary NayaNET standard. Automated layout proof does not equal subjective 10/10 approval.
          EOF

      - name: Upload exact-runtime visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-SMART-FEED-MASTER-V2-VISUAL-PROOF-${{ github.sha }}
          path: proof/
          if-no-files-found: error
          retention-days: 30
