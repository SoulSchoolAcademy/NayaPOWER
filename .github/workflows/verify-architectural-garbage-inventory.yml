name: Verify Architectural Garbage Inventory
on:
  workflow_dispatch:
  push:
    branches:
      - "naya3/system54-current-truth-20260923"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build read-only inventory
        run: node scripts/architectural-garbage-inventory.mjs
      - name: Enforce proposal-only contract
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('architectural-garbage-inventory.json','utf8'));
          if(p.status!=='PROPOSAL_ONLY') throw new Error('STATUS_MISMATCH');
          if(p.deletion_performed!==false) throw new Error('DELETION_DETECTED');
          console.log(JSON.stringify(p,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: architectural-garbage-inventory-${{ github.sha }}
          path: architectural-garbage-inventory.json
          if-no-files-found: error