      - name: Commit source and remove temporary executor
        run: |
          set -euo pipefail
          git config user.name 'NayaNET Surgical Release Bot'
          git config user.email 'nayanet-surgical-release@users.noreply.github.com'
          git rm .github/workflows/nayanethubone-surgical-inspect.yml
          git add NAYANETHUBONE
          git commit -m 'feat: make Smart Notes the primary intelligence feed'
          git push origin HEAD:main
      - name: Build clean Cloudflare upload ZIP
        run: |
          set -euo pipefail
          cp NAYANETHUBONE index.html
          printf '/index.html 200\n' > _redirects
          test "$(wc -c < index.html)" -gt 100000
          rm -f NayaNET-Hub-Upload.zip
          zip -9 -j NayaNET-Hub-Upload.zip index.html _redirects
          unzip -t NayaNET-Hub-Upload.zip
          test "$(unzip -Z1 NayaNET-Hub-Upload.zip | wc -l | tr -d ' ')" -eq 2
          echo "SOURCE_BYTES=$(wc -c < NAYANETHUBONE)"
          echo "INDEX_BYTES=$(wc -c < index.html)"
          echo "SOURCE_SHA256=$(sha256sum NAYANETHUBONE | awk '{print $1}')"
          echo "INDEX_SHA256=$(sha256sum index.html | awk '{print $1}')"
      - name: Upload clean Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Hub-One-Cloudflare-Upload
          path: NayaNET-Hub-Upload.zip
          if-no-files-found: error
