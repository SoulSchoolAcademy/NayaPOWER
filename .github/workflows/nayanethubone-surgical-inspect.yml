name: NayaNET Hub One Surgical Execute
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  surgical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Surgical patch NAYANETHUBONE
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          p=Path('NAYANETHUBONE')
          s=p.read_text(encoding='utf-8')
          marker='nayanet-surgical-hubone-feed-v1'
          if marker in s:
              raise SystemExit('PATCH_ALREADY_PRESENT')

          # 1) Default the actual page to Smart Notes without rebuilding the page.
          old='<section class="page active" id="page-home">'
          new='<section class="page" id="page-home">'
          if s.count(old)!=1: raise SystemExit(f'Unexpected home active count: {s.count(old)}')
          s=s.replace(old,new,1)
          old='<section class="page" id="page-notes">'
          new='<section class="page active" id="page-notes">'
          if s.count(old)!=1: raise SystemExit(f'Unexpected notes page count: {s.count(old)}')
          s=s.replace(old,new,1)
          if '<strong id="pageTitle">Home</strong>' not in s: raise SystemExit('Initial page title not found')
          s=s.replace('<strong id="pageTitle">Home</strong>','<strong id="pageTitle">Smart Notes</strong>',1)

          # 2) Remove only the redundant Smart Notes sidebar destination; preserve the feed and feature report link.
          old='<button data-page="notes"><span class="ico">▤</span>Smart Notes</button>'
          if s.count(old)!=1: raise SystemExit(f'Sidebar Smart Notes button count: {s.count(old)}')
          s=s.replace(old,'',1)

          # 3) Make the first sidebar destination Your Intelligence Today and add Smart Share directly beneath it.
          old='<button class="active" data-page="home"><span class="ico">⌂</span>Home</button>'
          if s.count(old)!=1: raise SystemExit(f'Home sidebar button count: {s.count(old)}')
          new='<button data-page="intelligence"><span class="ico">✦</span>Your Intelligence Today</button><button data-page="connections"><span class="ico">↗</span>Smart Share</button>'
          s=s.replace(old,new,1)

          # 4) Remove the duplicate Intelligence Library sidebar destination; its existing page is repurposed as Today.
          old='<button data-page="intelligence"><span class="ico">✦</span>Intelligence Library</button>'
          if s.count(old)!=1: raise SystemExit(f'Intelligence Library sidebar button count: {s.count(old)}')
          s=s.replace(old,'',1)

          # 5) Smart Spaces belongs immediately above Smart Mail.
          old='<div class="navlabel">COMMUNICATION</div><nav class="nav"><button data-page="mail"><span class="ico">✉</span>Smart Mail <span class="badge">NEW</span></button></nav>'
          if s.count(old)!=1: raise SystemExit('Communication sidebar block not found')
          new='<div class="navlabel">COMMUNICATION</div><nav class="nav"><button data-page="smartspaces"><span class="ico">▦</span>Smart Spaces</button><button data-page="mail"><span class="ico">✉</span>Smart Mail</button></nav>'
          s=s.replace(old,new,1)

          # 6) Mobile navigation follows the same no-redundant-Smart-Notes principle.
          old='<nav class="mobileNav"><button class="active" data-page="home">⌂<span>Home</span></button><button data-page="notes">▤<span>Notes</span></button><button data-page="reports">◫<span>Reports</span></button><button data-page="intelligence">✦<span>Intel</span></button><button data-page="mail">✉<span>Mail</span></button></nav>'
          if s.count(old)!=1: raise SystemExit('Mobile navigation block not found')
          new='<nav class="mobileNav"><button data-page="intelligence">✦<span>Today</span></button><button data-page="reports">◫<span>Reports</span></button><button data-page="mail">✉<span>Mail</span></button></nav>'
          s=s.replace(old,new,1)

          # 7) Remove the misleading obsolete phrase from the old hidden refinement layer.
          obsolete='Your life creates intelligence every day. Naya helps you capture it, understand it, remember it, compound it, and use it.'
          if s.count(obsolete)!=1: raise SystemExit(f'Obsolete phrase count: {s.count(obsolete)}')
          s=s.replace(obsolete,'Your intelligence, organized for action.',1)

          # 8) Surgical presentation/runtime layer. It augments the existing system; it does not rebuild it.
          addition=r'''<style id="nayanet-surgical-hubone-feed-style">
          .nh-feed-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}.nh-feed-main{min-width:0}.nh-feed-rail{position:sticky;top:96px;display:grid;gap:12px}.nh-feed-rail .board{margin:0}.nh-feed-mode{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.nh-feed-mode button{min-height:40px;padding:0 13px;border:1px solid #ffffff25;border-radius:12px;background:#09090d;color:#aaa4b0;font-size:8px;font-weight:1000;letter-spacing:.08em}.nh-feed-mode button.active{color:#fff;border-color:#d86cff80;background:#1b1024;box-shadow:0 0 22px #d86cff12}.nh-feed-note{border:1px solid #ffffff1d;border-radius:19px;background:linear-gradient(145deg,#14141a,#09090d);box-shadow:inset 0 1px #fff3,0 18px 38px #0009;overflow:hidden;margin-bottom:12px}.nh-feed-note-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 17px;border-bottom:1px solid #ffffff12}.nh-feed-note-head strong{font-size:8px;letter-spacing:.1em}.nh-feed-note-head span{font-size:7px;color:#99939f}.nh-feed-note-body{padding:17px}.nh-feed-note-body h3{font-size:19px;letter-spacing:-.035em;margin:0 0 8px}.nh-feed-note-body p{font-size:12px;color:#d8d3dd;line-height:1.6;margin:0}.nh-feed-perspectives{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 17px 15px}.nh-feed-perspective{padding:11px;border:1px solid #ffffff14;border-radius:11px;background:#08080c}.nh-feed-perspective b{display:block;font-size:6px;letter-spacing:.13em;margin-bottom:5px}.nh-feed-perspective span{display:block;color:#aaa4b1;font-size:8px;line-height:1.5}.nh-feed-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 17px;border-top:1px solid #ffffff10}.nh-feed-actions button{min-height:38px;padding:0 8px;border:0;background:transparent;color:#bdb7c4;font-size:9px;font-weight:900;letter-spacing:.02em;border-radius:9px}.nh-feed-actions button:hover{background:#ffffff08;color:#fff}.nh-feed-actions button.on{color:#fff;border-bottom:2px solid #d86cff}.nh-feed-stars{display:inline-flex;align-items:center;gap:1px}.nh-feed-stars button{font-size:20px;line-height:1;min-height:32px;padding:0 2px;color:#77717e}.nh-feed-stars button.on,.nh-feed-stars button:hover{color:#e8c766}.nh-feed-comment{padding:0 17px 15px}.nh-feed-comment input{width:100%;min-height:42px;border:1px solid #ffffff20;border-radius:12px;background:#07070a;color:#fff;padding:0 12px;outline:none;font-size:10px}.nh-feed-comment input:focus{border-color:#d86cff70}.nh-feed-comments{margin-top:8px;display:grid;gap:5px}.nh-feed-comments div{padding:8px 10px;border-radius:10px;background:#08080c;color:#bdb7c4;font-size:8px}.nh-today-shell{padding-top:22px}.nh-today-shell .pageHead{margin-bottom:18px}.nh-today-controls{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.nh-today-controls button{min-height:40px;padding:0 13px;border:1px solid #8b63ff55;border-radius:11px;background:#09090e;color:#c8c1d3;font-size:8px;font-weight:1000;letter-spacing:.07em}.nh-today-controls button.active{border-color:#55e39a;color:#fff;background:#0b1711}.nh-today-search{width:100%;min-height:50px;border:1px solid #ffffff20;border-radius:13px;background:#07070a;color:#fff;padding:0 14px;outline:none;margin-bottom:18px}.nh-today-card{padding:18px;border:1px solid #ffffff1d;border-radius:18px;background:linear-gradient(145deg,#14141a,#09090d);box-shadow:inset 0 1px #fff3,0 18px 38px #0009;margin-bottom:11px}.nh-today-card h2{font-size:20px;letter-spacing:-.04em;margin:0 0 7px}.nh-today-card p{font-size:11px;line-height:1.6;color:#c9c3ce;margin:0}.nh-today-card .eyebrow{margin-bottom:7px}.nh-report-history{margin:0 0 18px;padding:15px;border:1px solid #55b9ee44;border-radius:18px;background:#0b1118}.nh-report-history-controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.nh-report-history-controls button{min-height:38px;padding:0 12px;border:1px solid #ffffff20;border-radius:10px;background:#08090c;color:#c9c3ce;font-size:8px;font-weight:1000}.nh-report-history-controls button.active{border-color:#55b9ee;color:#fff}.nh-report-history-card{padding:15px;border:1px solid #ffffff15;border-radius:14px;background:#08090c}.nh-report-history-card h3{font-size:12px;margin:0 0 8px}.nh-report-history-card p{font-size:10px;line-height:1.6;color:#c9c3ce;margin:0 0 8px}.nh-report-history-card b{font-size:7px;letter-spacing:.12em;color:#8ed9ff}.nh-smartspaces{padding:22px;border:1px solid #d86cff42;border-radius:22px;background:linear-gradient(145deg,#15101c,#09090d);box-shadow:inset 0 1px #fff3,0 22px 45px #000a}.nh-smartspaces h2{font-size:28px;letter-spacing:-.04em;margin:0 0 8px}.nh-smartspaces p{max-width:760px;color:#cfc9d5;font-size:12px;line-height:1.65}.nh-smartspaces .actions{margin-top:17px}@media(max-width:900px){.nh-feed-layout{grid-template-columns:1fr}.nh-feed-rail{position:static;grid-template-columns:1fr 1fr}.nh-feed-perspectives{grid-template-columns:1fr}.nh-feed-mode{justify-content:flex-start}.nh-today-shell{padding-top:5px}}@media(max-width:600px){.nh-feed-rail{grid-template-columns:1fr}.nh-feed-actions button{font-size:9px}.nh-feed-stars button{font-size:18px}}
          </style><script id="nayanet-surgical-hubone-feed-v1">(function(){'use strict';
          const NKEY='nayanet_v7_feed_state';const loadF=()=>{try{return JSON.parse(localStorage.getItem(NKEY)||'{"favorites":{},"saved":{},"loves":{},"ratings":{},"comments":{},"mode":"PERSONAL"}')}catch(e){return{favorites:{},saved:{},loves:{},ratings:{},comments:{},mode:'PERSONAL'}}};const saveF=s=>{try{localStorage.setItem(NKEY,JSON.stringify(s))}catch(e){}};let fs=loadF();let feedMode=fs.mode==='COLLECTIVE'?'COLLECTIVE':'PERSONAL';
          const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
          const dayKey2=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
          const demoItems=()=>demoBlocks.map((b,i)=>({id:'demo-'+i,createdAt:new Date(2026,7,30-i,10+i,15).toISOString(),text:b.body.join(' '),type:b.type,title:b.title,human:b.human||b.body.join(' '),naya:b.naya||'Pending production intelligence service. No AI interpretation is fabricated.',machine:b.machine||'Demo event metadata · not a production receipt.',collective:true}));
          const liveItems=()=>notes.map(n=>{const sec=parseNote(n.text||'');return{id:n.id,createdAt:n.createdAt,text:n.text||'',type:n.type||'INSIGHT',title:(sec.body||n.text||'Intelligent Event').split(/[.!?]\s+/)[0].replace(/^#\s*/,'').slice(0,110)||'Intelligent Event',human:sec.human||n.text||'',naya:sec.naya||'Pending production intelligence service. No AI interpretation is fabricated here.',machine:sec.machine||('event_id '+n.id+' · '+n.type+' · local_persisted · private'),collective:false}});
          const feedItems=()=>{const a=liveItems();return a.length?a:demoItems()};
          const shareItem=id=>{const n=feedItems().find(x=>x.id===id);if(!n)return;const text=n.title+' — '+n.text;if(navigator.share){navigator.share({title:n.title,text}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert('Intelligence copied for sharing.')).catch(()=>{})}else alert(text)};
          const renderComments=id=>{const c=fs.comments[id]||[];return c.length?'<div class="nh-feed-comments">'+c.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>':''};
          function renderNotesSurgical(){const root=document.getElementById('noteList');if(!root)return;const q=(document.getElementById('noteSearch')?.value||'').toLowerCase().trim();const type=document.querySelector('#filters .filter.active')?.dataset.filter||'ALL';let list=feedItems().filter(n=>(type==='ALL'||n.type===type)&&(!q||(n.title+' '+n.text+' '+n.type).toLowerCase().includes(q)));if(!list.length){root.innerHTML='<div class="empty"><b>No matching intelligence.</b><span>Nothing is invented to fill the space.</span></div>';return}root.innerHTML=list.map(n=>{const fav=!!fs.favorites[n.id],saved=!!fs.saved[n.id],love=!!fs.loves[n.id],rating=fs.ratings[n.id]?.value||0;const perspective=(label,val)=>'<div class="nh-feed-perspective"><b>'+label+'</b><span>'+esc(String(val||'Pending.'))+'</span></div>';const stars=Array.from({length:5},(_,i)=>'<button data-feed-star="'+n.id+'" data-value="'+(i+1)+'" class="'+(i<rating?'on':'')+'" aria-label="Rate '+(i+1)+' of 5">'+(i<rating?'★':'☆')+'</button>').join('');return '<article class="nh-feed-note" id="nh-feed-'+esc(n.id)+'"><div class="nh-feed-note-head"><div><strong>'+esc(n.type)+' · '+(feedMode==='COLLECTIVE'?'COLLECTIVE':'PERSONAL')+'</strong></div><span>'+esc(time(n.createdAt))+' · '+esc(date(n.createdAt))+'</span></div><div class="nh-feed-note-body"><h3>'+esc(n.title)+'</h3><p>'+esc(n.text)+'</p></div><div class="nh-feed-perspectives">'+perspective('HUMAN',n.human)+perspective('NAYA',n.naya)+perspective('MACHINE',n.machine)+'</div><div class="nh-feed-actions">'+(feedMode==='COLLECTIVE'?'<button data-feed-love="'+n.id+'" class="'+(love?'on':'')+'">♥ LOVE</button><span class="nh-feed-stars">'+stars+'</span><button data-feed-comment="'+n.id+'">💬 COMMENT</button>':'<button data-feed-fav="'+n.id+'" class="'+(fav?'on':'')+'">★ '+(fav?'FAVORITED':'FAVORITE')+'</button>')+'<button data-feed-save="'+n.id+'" class="'+(saved?'on':'')+'">🔖 '+(saved?'SAVED':'SAVE')+'</button><button data-feed-share="'+n.id+'">＋ SHARE</button></div>'+(feedMode==='COLLECTIVE'?'<div class="nh-feed-comment"><input data-feed-comment-input="'+n.id+'" placeholder="Add your perspective…" aria-label="Add your perspective">'+renderComments(n.id)+'</div>':'')+'</article>'}).join('')}
          function installFeed(){const page=document.getElementById('page-notes');if(!page)return;const head=page.querySelector('.pageHead');if(head&&!document.getElementById('nhFeedMode')){const c=document.createElement('div');c.id='nhFeedMode';c.className='nh-feed-mode';c.innerHTML='<button data-feed-mode="PERSONAL" class="'+(feedMode==='PERSONAL'?'active':'')+'">PERSONAL</button><button data-feed-mode="COLLECTIVE" class="'+(feedMode==='COLLECTIVE'?'active':'')+'">COLLECTIVE</button>';head.appendChild(c)}if(head){const p=head.querySelector('p');if(p)p.textContent='Your living intelligence feed — private by default, shared by choice.'}if(!page.querySelector('.nh-feed-layout')){const shell=document.createElement('div');shell.className='nh-feed-layout';const left=document.createElement('div');left.className='nh-feed-main';const right=document.createElement('aside');right.className='nh-feed-rail';const compose=page.querySelector('.compose'),search=page.querySelector('#noteSearch'),filters=page.querySelector('#filters'),list=page.querySelector('#noteList');[compose,search,filters,list].forEach(x=>x&&left.appendChild(x));const rail=document.querySelector('#page-home .activationRail');if(rail)right.appendChild(rail);const daily=document.createElement('article');daily.className='board';daily.style.setProperty('--tone','var(--gold)');daily.innerHTML='<div class="boardTop"><span>00 · REVIEW IT</span><span>REPORT</span></div><div class="orb"><span>✦</span></div><h3>Daily Intelligence Report</h3><p>See the highlights Naya has synthesized from your preserved intelligence.</p><div class="why"><b>WHY IT MATTERS</b><span>Capture is useful. Understanding what matters is the next layer.</span></div><button class="btn gold" data-page="reports">OPEN DAILY REPORT</button>';right.insertBefore(daily,right.firstChild);shell.appendChild(left);shell.appendChild(right);head.insertAdjacentElement('afterend',shell)}renderNotesSurgical()}
          function installToday(){const ip=document.getElementById('page-intelligence');if(!ip||document.getElementById('nhTodayShell'))return;Array.from(ip.children).forEach(x=>{x.style.display='none';x.dataset.nhLegacy='true'});const shell=document.createElement('div');shell.id='nhTodayShell';shell.className='nh-today-shell';shell.innerHTML='<div class="pageHead"><div><div class="eyebrow">NAYANET HIGHLIGHTS</div><h1>YOUR INTELLIGENCE TODAY</h1><p>A clear snapshot of what happened, what mattered, what changed, and what is worth carrying forward.</p></div></div><div class="nh-today-controls"><button data-today-range="TODAY" class="active">TODAY</button><button data-today-range="YESTERDAY">YESTERDAY</button><button data-today-range="WEEK">THIS WEEK</button><button data-today-range="MONTH">THIS MONTH</button></div><input class="nh-today-search" id="nhTodaySearch" placeholder="Search your highlights…"><div id="nhTodayResults"></div>';ip.prepend(shell);renderTodayHighlights()}
          let todayRange='TODAY';
          function renderTodayHighlights(){const root=document.getElementById('nhTodayResults');if(!root)return;const q=(document.getElementById('nhTodaySearch')?.value||'').toLowerCase().trim();const now=new Date();const base=feedItems();let list=base.filter(n=>{const d=new Date(n.createdAt);if(q)return(n.title+' '+n.text+' '+n.type).toLowerCase().includes(q);if(todayRange==='TODAY')return dayKey2(n.createdAt)===dayKey2(now.toISOString());if(todayRange==='YESTERDAY'){const y=new Date(now);y.setDate(y.getDate()-1);return dayKey2(n.createdAt)===dayKey2(y.toISOString())}if(todayRange==='WEEK'){return (now-d)<=7*86400000}return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()});if(!list.length)list=base.slice(0,3);root.innerHTML=list.slice(0,8).map((n,i)=>'<article class="nh-today-card"><div class="eyebrow">'+(i===0?'HIGHLIGHT':'KEY MOMENT')+' · '+esc(n.type)+'</div><h2>'+esc(n.title)+'</h2><p>'+esc(n.text)+'</p></article>').join('')}
          function installReportHistory(){const rp=document.getElementById('page-reports');if(!rp||document.getElementById('nhReportHistory'))return;const box=document.createElement('section');box.id='nhReportHistory';box.className='nh-report-history';box.innerHTML='<div class="eyebrow">REPORT ARCHIVE</div><h2 style="font-size:24px;letter-spacing:-.04em;margin:7px 0 0">Daily Intelligence Report</h2><div class="nh-report-history-controls"><button data-report-range="TODAY" class="active">TODAY</button><button data-report-range="YESTERDAY">YESTERDAY</button><button data-report-range="WEEK">THIS WEEK</button><button data-report-range="MONTH">THIS MONTH</button></div><div id="nhReportHistoryCard"></div>';const anchor=rp.querySelector('.pageHead');anchor.insertAdjacentElement('afterend',box);renderReportHistory('TODAY')}
          function reportSource(range){const now=new Date();const all=feedItems();return all.filter(n=>{const d=new Date(n.createdAt);if(range==='TODAY')return dayKey2(n.createdAt)===dayKey2(now.toISOString());if(range==='YESTERDAY'){const y=new Date(now);y.setDate(y.getDate()-1);return dayKey2(n.createdAt)===dayKey2(y.toISOString())}if(range==='WEEK')return now-d<=7*86400000;return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()})}
          function renderReportHistory(range){const root=document.getElementById('nhReportHistoryCard');if(!root)return;const src=reportSource(range);const mattered=src.slice(0,3).map(n=>n.title).join(' · ')||'No verified source events in this period.';const learned=src.filter(n=>['LESSON','BREAKTHROUGH','INSIGHT','MISTAKE'].includes(n.type)).slice(0,3).map(n=>n.text).join(' ')||'No learning event is verified in this period.';const forward=src.filter(n=>['DECISION','GOAL','OPPORTUNITY','WIN'].includes(n.type)).slice(0,3).map(n=>n.title).join(' · ')||'No carry-forward item is verified in this period.';const key=range+'-'+todayKey();const archive=loadF().reports||{};archive[key]={range,createdAt:new Date().toISOString(),mattered,learned,forward};fs=Object.assign(fs,{reports:archive});saveF(fs);root.innerHTML='<div class="nh-report-history-card"><b>'+range+' · SOURCE-BACKED SNAPSHOT</b><h3>WHAT MATTERED</h3><p>'+esc(mattered)+'</p><h3>WHAT WAS LEARNED</h3><p>'+esc(learned)+'</p><h3>WHAT CARRIES FORWARD</h3><p>'+esc(forward)+'</p></div>'}
          function installSmartSpaces(){if(document.getElementById('page-smartspaces'))return;const main=document.querySelector('.main');if(!main)return;const p=document.createElement('section');p.className='page';p.id='page-smartspaces';p.innerHTML='<div class="pageHead"><div><div class="eyebrow">ORGANIZE INTELLIGENCE</div><h1>Smart Spaces</h1><p>Bring related intelligence together around a purpose, topic, project, or shared space.</p></div></div><section class="nh-smartspaces"><h2>Organize what matters.</h2><p>Smart Spaces are the organizing layer around Smart Notes, Smart Lists, and shared intelligence. This keeps the feed as the source of truth while giving you places to work with groups of intelligence.</p><div class="actions"><button class="btn purple" data-page="nayalists">OPEN SMART LISTS</button><button class="btn blue" data-page="collective">OPEN COLLECTIVE</button></div><div class="state">PRIVATE BY DEFAULT · SHARED BY CHOICE · COLLECTIVE BY CONSENT · PUBLIC BY DECISION</div></section>';main.appendChild(p)}
          function installSidebar(){const side=document.querySelector('.sidebar');if(!side)return;side.querySelectorAll('[data-page="notes"]').forEach(x=>x.remove());const il=side.querySelector('[data-page="intelligence"]');if(il){il.innerHTML='<span class="ico">✦</span>Your Intelligence Today'}const mail=side.querySelector('[data-page="mail"]');if(mail){const badge=mail.querySelector('.badge');if(badge)badge.remove()}const lists=side.querySelector('[data-page="nayalists"]');if(lists){const ico=lists.querySelector('.ico');lists.innerHTML='';if(ico)lists.appendChild(ico);lists.appendChild(document.createTextNode('Smart Lists'))}if(!side.querySelector('[data-page="smartspaces"]')){const mailNav=mail?.closest('.nav');if(mailNav){const b=document.createElement('button');b.dataset.page='smartspaces';b.innerHTML='<span class="ico">▦</span>Smart Spaces';mailNav.insertBefore(b,mail)}}}
          function installCountry(){const el=document.getElementById('nayanet-login-country');if(!el)return;const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';const lang=(navigator.language||'').toUpperCase();let country='Canada',flag='🇨🇦';if(/America\/(Vancouver|Edmonton|Winnipeg|Toronto|Halifax|St_Johns|Regina|Whitehorse|Dawson|Yellowknife|Inuvik|Moncton|Glace_Bay)/.test(tz)){country='Canada';flag='🇨🇦'}else if(/(^|[-_])US$/.test(lang)||/^en-US/.test(navigator.language||'')){country='United States';flag='🇺🇸'}else if(/(^|[-_])GB$/.test(lang)){country='United Kingdom';flag='🇬🇧'}else if(/(^|[-_])AU$/.test(lang)){country='Australia';flag='🇦🇺'}el.textContent=flag+' '+country}
          function install(){installSidebar();installFeed();installToday();installReportHistory();installSmartSpaces();installCountry();if(typeof window.updateIdentity==='function'){}if(document.getElementById('page-notes')?.classList.contains('active'))renderNotesSurgical();}
