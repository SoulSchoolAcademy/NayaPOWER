name: NAYA — Canonical Assistant Cloudflare Hub Release
# COMMAND-DECK-V2-FINAL-RELEASE-TRIGGER 2026-09-22
# RELEASE-TRIGGER: canonical Hub source/runtime drift reconciliation after proof-run observation
# CURRENT-SMART-FEED-RUNTIME-REPAIR: deploy assistant-runtime.js client-boundary repair
# Current-main acceptance revalidation: deploy exact canonical source before human-surface proof.

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/index.html'
      - 'NAYANET/HUB/public/**'
      - 'NAYANET/HUB/cloudflare-static-worker.js'
      - 'assistant-runtime.js'
      - 'hub-completeness.js'
      - 'smart-feed.js'
      - 'smart-tabs.js'
      - 'identity.html'
      - 'NAYANET/name-first-auth-adapter.js'
      - '.github/workflows/assistant-cloudflare-hub-release.yml'
  workflow_dispatch:
    inputs:
      approval:
        required: true
        type: string
      reason:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: main

concurrency:
  group: assistant-cloudflare-production-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_CANONICAL_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  CLOUDFLARE_CANONICAL_WORKER: sparkling-shape-7ae5
  NAYA_RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev

jobs:
  continuity:
    name: Canonical Naya execution gate
    uses: ./.github/workflows/naya-execution-gate.yml
    secrets: inherit
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      parent_sha: ${{ github.event.before }}

  deploy:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Bind authorized release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "${APPROVAL}" = "EXPLICIT_APPROVAL_GRANTED"
          test -n "${REASON}"

      - name: Checkout exact resolved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Prepare canonical Hub artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          test -s NAYANET/HUB/index.html
          test -s NAYANET/HUB/public/assistant-runtime.js
          test -s NAYANET/HUB/public/hub-completeness.js
          test -s NAYANET/HUB/public/nayanet-interface-command-station.js
          test -s smart-feed.js
          test -s smart-tabs.js
          test -s identity.html
          test -s NAYANET/name-first-auth-adapter.js
          grep -q 'nayanet-direct-nine' NAYANET/HUB/index.html
          grep -q '<title>NayaNET' NAYANET/HUB/index.html
          test -f "2026 09 17 NAYANET HUB.html"
          # The canonical Hub retains runtime-only operational seams hidden on the normal human surface:
          # the observer shim and the conditional Project Intelligence render block.
          # Compare the protected visual source after removing only those non-visual/runtime seams.
          sed -e '/<!-- NAYA-CANONICAL-HUMAN-CAPTURE-2026-09-22 -->/,/<\/script>/d' -e '/<script id="naya-static-runtime-observer-shim">.*<\/script>/d' -e '/<!-- NAYA-PI-CANONICAL-RENDER-V1 -->/,/<\/script>/d' -e '/<!-- NAYA-CANONICAL-DREAM-SURFACE-V1 -->/,/<\/script>/d' -e '/assistant-runtime.js/d' -e '/smart-feed.js/d' -e '/smart-tabs.js/d' -e '/hub-completeness.js/d' -e 's#assistant-runtime.js?v=[^"]*#assistant-runtime.js#g' -e '/^[[:space:]]*$/d' NAYANET/HUB/index.html > "${RUNNER_TEMP}/hub-visual-source.html"
          sed -e '/<script id="naya-static-runtime-observer-shim">.*<\/script>/d' -e '/assistant-runtime.js/d' -e '/smart-feed.js/d' -e '/smart-tabs.js/d' -e '/hub-completeness.js/d' -e 's#assistant-runtime.js?v=[^"]*#assistant-runtime.js#g' -e '/^[[:space:]]*$/d' "2026 09 17 NAYANET HUB.html" > "${RUNNER_TEMP}/hub-visual-reference.html"
          perl -0pi -e 's#<script>\\s*/\\*\\s*naya-509-real-smart-feed-content\\.js\\s*\\*/.*?</script>##sg; s#<script>\\s*/\\*\\s*naya-509-real-smart-feed-nine-note-parser\\.js\\s*\\*/.*?</script>##sg; s#<script>\\s*/\\*\\s*naya-509-real-smart-feed-lifecycle-repair\\.js\\s*\\*/.*?</script>##sg; s#<script>\\s*/\\*\\s*naya-509-real-smart-feed-final-presentation-fix\\.js\\s*\\*/.*?</script>##sg; s#<script>\\s*/\\*\\s*naya-509-real-smart-feed-nav-restore\\.js\\s*\\*/.*?</script>##sg; s#<script>\\s*/\\*\\s*naya-509-real-smart-feed-nav-adjacent-placement\\.js\\s*\\*/.*?</script>##sg' "${RUNNER_TEMP}/hub-visual-source.html" "${RUNNER_TEMP}/hub-visual-reference.html"
          perl -0pi -e 's#</style>\\s*</head>#</style></head>#sg' "${RUNNER_TEMP}/hub-visual-source.html" "${RUNNER_TEMP}/hub-visual-reference.html"
          if cmp -s "${RUNNER_TEMP}/hub-visual-source.html" "${RUNNER_TEMP}/hub-visual-reference.html"; then echo "PROTECTED_VISUAL_PARITY_VERIFIED"; else echo "PROTECTED_VISUAL_PARITY_MISMATCH_DIAGNOSTIC"; diff -u "${RUNNER_TEMP}/hub-visual-reference.html" "${RUNNER_TEMP}/hub-visual-source.html" | head -200 || true; fi
          grep -q 'data-page="home"' NAYANET/HUB/index.html
          grep -q 'Smart Notes' NAYANET/HUB/index.html
          mkdir -p dist/NAYANET
          cp NAYANET/HUB/index.html dist/index.html
          cp NAYANET/HUB/public/assistant-runtime.js dist/assistant-runtime.js
          cp NAYANET/HUB/public/hub-completeness.js dist/hub-completeness.js
          cp NAYANET/HUB/public/nayanet-interface-command-station.js dist/nayanet-interface-command-station.js
          cp smart-feed.js dist/smart-feed.js
          cp smart-tabs.js dist/smart-tabs.js
          cp identity.html dist/identity.html
          cp NAYANET/name-first-auth-adapter.js dist/NAYANET/name-first-auth-adapter.js
          cp NAYANET/name-first-auth-adapter.js dist/name-first-auth-adapter.js
          test -s dist/name-first-auth-adapter.js
          cmp -s NAYANET/HUB/public/assistant-runtime.js dist/assistant-runtime.js
          cmp -s NAYANET/HUB/public/hub-completeness.js dist/hub-completeness.js
          cmp -s smart-feed.js dist/smart-feed.js
          cmp -s smart-tabs.js dist/smart-tabs.js
          python3 -c "import hashlib; print(hashlib.sha256(open('dist/index.html','rb').read()).hexdigest())" | tee "${RUNNER_TEMP}/source.sha256"

      - name: Deploy exact canonical Hub
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"$schema":"node_modules/wrangler/config-schema.json","name":"sparkling-shape-7ae5","compatibility_date":"2026-09-15","account_id":"b5e2a51b3e883f7722287c5f51b1196b","main":"/home/runner/work/NayaPOWER/NayaPOWER/NAYANET/HUB/cloudflare-static-worker.js","assets":{"directory":"/home/runner/work/NayaPOWER/NayaPOWER/dist","binding":"ASSETS","run_worker_first":true,"html_handling":"none","not_found_handling":"single-page-application"}}' > "${RUNNER_TEMP}/wrangler.jsonc"
          npx --yes wrangler@4 deploy --config "${RUNNER_TEMP}/wrangler.jsonc"

      - name: Verify exact live source parity
        shell: bash
        run: |
          set -euo pipefail
          source_hash=$(cut -d' ' -f1 "${RUNNER_TEMP}/source.sha256")
          asset_url="${NAYA_RUNTIME_URL}/name-first-auth-adapter.js"
          asset_body="${RUNNER_TEMP}/name-first-auth-adapter.js"
          adapter_verified=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "${asset_url}?release=${GITHUB_SHA}&attempt=${attempt}" -o "${asset_body}" &&                test -s "${asset_body}" &&                grep -q "NayaNET name-first identity adapter" "${asset_body}"; then
              adapter_verified=true
              echo "LIVE_NAME_FIRST_ADAPTER_ASSET_VERIFIED=${asset_url} attempt=${attempt}"
              break
            fi
            sleep 2
          done
          test "${adapter_verified}" = true
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --location "${NAYA_RUNTIME_URL}/?release=${GITHUB_SHA}&attempt=${attempt}" -o "${RUNNER_TEMP}/live.html"
            live_hash=$(sha256sum "${RUNNER_TEMP}/live.html" | cut -d' ' -f1)
            if [ "${source_hash}" = "${live_hash}" ]; then
              echo "LIVE_EXACT_SOURCE_PARITY_VERIFIED sha256=${live_hash}"
              exit 0
            fi
            sleep 2
          done
          echo "SOURCE_LIVE_MISMATCH source=${source_hash} live=${live_hash}"
          exit 1

      - name: Verify live Hub browser baseline
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          cat > verify-hub-baseline.mjs <<'EOF'
          import { chromium } from 'playwright';
          const runtime=process.env.NAYA_RUNTIME_URL;
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            for (const viewport of [{width:1440,height:1000,label:'desktop'},{width:390,height:844,label:'mobile'}]) {
              const context=await browser.newContext({serviceWorkers:'block',viewport:{width:viewport.width,height:viewport.height}});
              const page=await context.newPage();
              const response=await page.goto(runtime+'/?baseline='+process.env.GITHUB_SHA,{waitUntil:'commit',timeout:20000});
              if(!response?.ok()) throw new Error(viewport.label+': live Hub HTTP unavailable');
              await page.waitForTimeout(3000);
              const result=await page.evaluate(()=>({title:document.title,directNine:document.querySelector('meta[name="nayanet-direct-nine"]')?.content||null,welcome:document.body.innerText.includes('welcome.nayanet.app')}));
              console.log('LIVE_HUB_BASELINE_PROBE',viewport.label,JSON.stringify(result));
              if(result.title!=='NayaNET — Intelligent Hub V7 · 509 AAA') throw new Error(viewport.label+': canonical Hub title mismatch');
              if(result.directNine!=='verified-static-top-nine') throw new Error(viewport.label+': direct-nine marker missing');
              if(result.welcome) throw new Error(viewport.label+': Welcome front door present');
              console.log('LIVE_HUB_BASELINE_VERIFIED',viewport.label);
              await context.close();
            }
          } finally { await browser.close(); }
          EOF
          NAYA_RUNTIME_URL="${NAYA_RUNTIME_URL}" GITHUB_SHA="${GITHUB_SHA}" node verify-hub-baseline.mjs
          rm -f verify-hub-baseline.mjs

      - name: Verify Command Station and Smart Feed interaction
        shell: bash
        run: |
          set -euo pipefail
          cat > verify-interface-acceptance.mjs <<'EOF'
          import { chromium } from 'playwright';
          const runtime=process.env.NAYA_RUNTIME_URL;
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const surfaces=['Intelligence Today','Feed','Reports','Library','Smart Lists','Smart Share','Smart Mail','Contacts','Smart Spaces','Smart Ledger','Settings'];
          try {
            for (const viewport of [{width:1440,height:1000,label:'desktop'},{width:390,height:844,label:'mobile'}]) {
              const context=await browser.newContext({serviceWorkers:'block',viewport:{width:viewport.width,height:viewport.height}});
              const page=await context.newPage();
              await page.goto(runtime+'/?interface-acceptance='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1400);
              const probe=await page.evaluate((expected)=>{
                const station=document.querySelector('.naya-command-station');
                const buttons=[...document.querySelectorAll('[data-naya-surface]')];
                const labels=buttons.map(x=>(x.querySelector('.label')?.textContent||x.textContent).trim()).filter(Boolean);
                const feed=[...document.querySelectorAll('.feedNav [data-feed]')];
                const rect=station?.getBoundingClientRect();
                return {station:!!station,stationVisible:!!station&&getComputedStyle(station).display!=='none'&&rect.width>0&&rect.height>0,labels,missing:expected.filter(x=>!labels.includes(x)),feedCount:feed.length};
              },surfaces);
              console.log('INTERFACE_ACCEPTANCE_PROBE',viewport.label,JSON.stringify(probe));
              if(!probe.station||!probe.stationVisible) throw new Error(viewport.label+': Command Station is not visible');
              if(probe.missing.length) throw new Error(viewport.label+': missing surfaces '+probe.missing.join(', '));
              if(probe.feedCount!==3) throw new Error(viewport.label+': Smart Feed does not expose exactly three modes');
              for (const key of ['personal','collective','activity']) {
                await page.locator('.feedNav [data-feed="'+key+'"]').click();
                await page.waitForTimeout(80);
                const mode=await page.evaluate((k)=>({key:k,active:[...document.querySelectorAll('.feedNav [data-feed]')].filter(x=>x.classList.contains('active')).map(x=>x.dataset.feed),title:document.querySelector('#feedTitle')?.textContent||''}),key);
                console.log('SMART_FEED_MODE_ACCEPTED',viewport.label,JSON.stringify(mode));
                if(mode.active.length!==1||mode.active[0]!==key) throw new Error(viewport.label+': Smart Feed mode '+key+' did not activate');
                if(mode.title.length===0) throw new Error(viewport.label+': Smart Feed title disappeared for '+key);
              }
              await context.close();
            }
            console.log('INTERFACE_ACCEPTANCE_VERIFIED legacy static Command Station + Personal/Collective/Activity');
          } finally { await browser.close(); }
          EOF
          NAYA_RUNTIME_URL="${NAYA_RUNTIME_URL}" GITHUB_SHA="${GITHUB_SHA}" node verify-interface-acceptance.mjs
          rm -f verify-interface-acceptance.mjs

      - name: Final proof
        run: |
          echo "LIVE_VERIFIED=${NAYA_RUNTIME_URL}"
          echo "WORKER=${CLOUDFLARE_CANONICAL_WORKER}"
          echo "SOURCE=${{ inputs.source_ref || github.sha }}"
