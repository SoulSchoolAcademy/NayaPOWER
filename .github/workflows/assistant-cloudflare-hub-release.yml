name: NAYA — Canonical Hub Release

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - '.github/workflows/assistant-cloudflare-hub-release.yml'
  workflow_dispatch:
    inputs:
      approval:
        required: true
        type: string
      reason:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: main

concurrency:
  group: nayanet-hub-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_CANONICAL_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  CLOUDFLARE_CANONICAL_WORKER: sparkling-shape-7ae5
  NAYA_RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev

jobs:
  release:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Bind authorized release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "${APPROVAL}" = "EXPLICIT_APPROVAL_GRANTED"
          test -n "${REASON}"

      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1

      - name: Install Hub toolchain
        working-directory: NAYANET/HUB
        run: npm ci

      - name: Enforce canonical boundary
        working-directory: NAYANET/HUB
        run: npm run verify:boundary

      - name: Build exact Hub artifact
        working-directory: NAYANET/HUB
        run: |
          set -euo pipefail
          npm run build
          npm run verify:artifact
          sha256sum dist/index.html | tee artifact.sha256

      - name: Deploy only the canonical Hub boundary
        working-directory: NAYANET/HUB
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify exact live artifact parity
        working-directory: NAYANET/HUB
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_hash="$(cut -d' ' -f1 artifact.sha256)"
          curl --fail --silent --show-error --location "${NAYA_RUNTIME_URL}/?release=${RELEASE_SHA}" -o live.html
          live_hash="$(sha256sum live.html | cut -d' ' -f1)"
          test "${source_hash}" = "${live_hash}"
          echo "LIVE_EXACT_ARTIFACT_PARITY_VERIFIED sha256=${live_hash}"

          for asset in assistant-runtime.js hub-completeness.js smart-feed.js smart-tabs.js identity.html name-first-auth-adapter.js; do
            curl --fail --silent --show-error --location "${NAYA_RUNTIME_URL}/${asset}?release=${RELEASE_SHA}" -o "live-${asset//\//-}"
            cmp -s "dist/${asset}" "live-${asset//\//-}"
            echo "LIVE_ASSET_PARITY_VERIFIED=${asset}"
          done

      - name: Browser proof of canonical experience
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          cat > verify-canonical-hub.mjs <<'EOF'
          import { chromium } from 'playwright';
          const runtime=process.env.NAYA_RUNTIME_URL;
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            for (const viewport of [{width:1440,height:1000,label:'desktop'},{width:390,height:844,label:'mobile'}]) {
              const context=await browser.newContext({serviceWorkers:'block',viewport:{width:viewport.width,height:viewport.height}});
              const page=await context.newPage();
              const response=await page.goto(runtime+'/?hub-proof='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:60000});
              if(!response?.ok()) throw new Error(viewport.label+': HTTP failure');
              await page.waitForTimeout(1500);
              const p=await page.evaluate(()=>({
                title:document.title,
                marker:document.querySelector('meta[name="nayanet-direct-nine"]')?.content,
                leftRail:!!document.querySelector('.rail.left'),
                rightRail:!!document.querySelector('.rail.right'),
                search:!!document.querySelector('#search'),
                hero:!!document.querySelector('.hero'),
                feed:!!document.querySelector('.feed'),
                blocks:document.querySelectorAll('.blocks > .block').length,
                modes:[...document.querySelectorAll('.feedNav [data-feed]')].map(x=>x.dataset.feed),
                mission:document.querySelector('.mission')?.innerText||'',
                features:!!document.querySelector('.features')
              }));
              console.log('HUB_BROWSER_PROBE',viewport.label,JSON.stringify(p));
              if(p.title!=='NayaNET — Intelligent Hub V7 · 509 AAA') throw new Error(viewport.label+': title mismatch');
              if(p.marker!=='verified-static-top-nine') throw new Error(viewport.label+': canonical marker missing');
              if(!p.leftRail||!p.rightRail||!p.search||!p.hero||!p.feed) throw new Error(viewport.label+': shell incomplete');
              if(p.blocks<3) throw new Error(viewport.label+': intelligent blocks missing');
              if(JSON.stringify(p.modes)!==JSON.stringify(['collective','personal','activity'])) throw new Error(viewport.label+': Smart Feed mode contract mismatch');
              if(!p.mission.includes('Your life creates your intelligence every day.')) throw new Error(viewport.label+': mission bar missing');
              if(!p.features) throw new Error(viewport.label+': feature bar missing');
              for(const key of ['collective','personal','activity']){
                await page.locator('.feedNav [data-feed="'+key+'"]').click();
                await page.waitForTimeout(80);
                if(await page.locator('.feedNav [data-feed].active').getAttribute('data-feed')!==key) throw new Error(viewport.label+': feed mode did not activate: '+key);
              }
              await context.close();
            }
          } finally { await browser.close(); }
          EOF
          NAYA_RUNTIME_URL="${NAYA_RUNTIME_URL}" GITHUB_SHA="${GITHUB_SHA}" node verify-canonical-hub.mjs

      - name: Release receipt
        working-directory: NAYANET/HUB
        run: |
          echo "SOURCE_COMMIT=${GITHUB_SHA}"
          echo "ARTIFACT_SHA256=$(cut -d' ' -f1 artifact.sha256)"
          echo "WORKER=${CLOUDFLARE_CANONICAL_WORKER}"
          echo "LIVE=${NAYA_RUNTIME_URL}"
