name: NAYA — Canonical Assistant Cloudflare Hub Release
# COMMAND-DECK-V2-FINAL-RELEASE-TRIGGER 2026-09-22
# RELEASE-TRIGGER: canonical Hub source/runtime drift reconciliation after proof-run observation
# CURRENT-SMART-FEED-RUNTIME-REPAIR: deploy assistant-runtime.js client-boundary repair
# Current-main acceptance revalidation: deploy exact canonical source before human-surface proof.

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/index.html'
      - 'NAYANET/HUB/package.json'
      - 'NAYANET/HUB/vite.config.ts'
      - 'NAYANET/HUB/tsconfig.json'
      - 'NAYANET/HUB/src/**'
      - 'NAYANET/HUB/public/**'
      - 'NAYANET/HUB/cloudflare-static-worker.js'
      - 'assistant-runtime.js'
      - 'hub-completeness.js'
      - 'smart-feed.js'
      - 'smart-tabs.js'
      - 'NAYANET/HUB/intelligence-surfaces-runtime.js'
      - '.github/workflows/assistant-cloudflare-hub-release.yml'
      - '.naya/control-plane/EXECUTION-SESSION.json'
  workflow_dispatch:
    inputs:
      approval:
        required: true
        type: string
      reason:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: main

concurrency:
  group: assistant-cloudflare-production-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_CANONICAL_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  CLOUDFLARE_CANONICAL_WORKER: sparkling-shape-7ae5
  NAYA_RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Bind authorized release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "${APPROVAL}" = "EXPLICIT_APPROVAL_GRANTED"
          test -n "${REASON}"

      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2

      - name: Enforce canonical Hub preservation and freeze gate
        shell: bash
        run: |
          set -euo pipefail
          test -s .naya/control-plane/HUB-PRESERVATION.json
          git fetch --no-tags --unshallow origin 2>/dev/null || git fetch --no-tags origin main
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          p=Path('.naya/control-plane/HUB-PRESERVATION.json')
          g=json.loads(p.read_text())
          if g.get('status')!='ACTIVE': raise SystemExit('HUB_PRESERVATION_GATE_NOT_ACTIVE')
          c=g.get('canonical',{})
          required_paths=[
              'NAYANET/HUB/index.html',
              'NAYANET/HUB/src/',
              '.github/workflows/assistant-cloudflare-hub-release.yml'
          ]
          if c.get('human_facing_entrypoint')!='NAYANET/HUB/index.html': raise SystemExit('CANONICAL_HUB_ENTRYPOINT_MISMATCH')
          if c.get('implementation_root')!='NAYANET/HUB/src/': raise SystemExit('CANONICAL_HUB_IMPLEMENTATION_ROOT_MISMATCH')
          rules=g.get('preservation_rules',{})
          if rules.get('additive_by_default') is not True: raise SystemExit('ADDITIVE_BY_DEFAULT_GATE_MISSING')
          if rules.get('no_silent_authority_transfer') is not True: raise SystemExit('SILENT_AUTHORITY_TRANSFER_GATE_MISSING')
          transfer=g.get('recorded_authority_transfer',{})
          if transfer.get('required') is True and transfer.get('status')!='RECORDED':
              raise SystemExit('AUTHORITY_TRANSFER_NOT_RECORDED')
          cp=g.get('current_checkpoint',{})
          for k in ['main_observed_head','checkpoint_branch','previous_major_hub_checkpoint_commit','previous_major_hub_checkpoint_blob_sha']:
              if not cp.get(k): raise SystemExit('PRESERVATION_CHECKPOINT_MISSING:'+k)
          if not subprocess.run(['git','cat-file','-e',cp['main_observed_head']+'^{commit}'],capture_output=True).returncode==0:
              raise SystemExit('RECOVERY_CHECKPOINT_COMMIT_NOT_REACHABLE')
          if not subprocess.run(['git','cat-file','-e',cp['previous_major_hub_checkpoint_commit']+'^{commit}'],capture_output=True).returncode==0:
              raise SystemExit('HISTORICAL_CHECKPOINT_COMMIT_NOT_REACHABLE')
          print('HUB_PRESERVATION_GATE_VERIFIED')
          print('CANONICAL_ENTRYPOINT',c['human_facing_entrypoint'])
          print('IMPLEMENTATION_ROOT',c['implementation_root'])
          print('CURRENT_RECOVERY',cp['checkpoint_branch'],cp['main_observed_head'])
          print('HISTORICAL_RECOVERY',cp['previous_major_hub_checkpoint_commit'],cp['previous_major_hub_checkpoint_blob_sha'])
          print('AUTHORITY_TRANSFER',transfer.get('status'))
          PY

      - name: Enforce Naya session and merge-boundary lease
        shell: bash
        run: |
          set -euo pipefail
          test -s .naya/control-plane/EXECUTION-SESSION.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('.naya/control-plane/EXECUTION-SESSION.json').read_text())
          required=['session_id','naya_id','status','parent_head','authorized_action','successor_prompt']
          missing=[k for k in required if not s.get(k)]
          if missing: raise SystemExit('SESSION_FIELDS_MISSING:'+','.join(missing))
          if s['status']!='CLOSED': raise SystemExit('SESSION_NOT_CLOSED')
          if not s.get('read_ack',{}).get('all_required_sources'): raise SystemExit('READ_ACK_FAILED')
          lease=s.get('execution_lease',{})
          if lease.get('status')!='ACQUIRED' or lease.get('exclusive') is not True: raise SystemExit('EXECUTION_LEASE_FAILED')
          if s.get('action_result',{}).get('verification')!='PASS': raise SystemExit('VERIFICATION_NOT_PASS')
          if s.get('record',{}).get('status')!='COMPLETE': raise SystemExit('ACTIVITY_RECORD_NOT_COMPLETE')
          if s.get('control_plane',{}).get('updated') is not True: raise SystemExit('CONTROL_PLANE_NOT_UPDATED')
          if s.get('sign_out',{}).get('status')!='SIGNED_OUT': raise SystemExit('SIGN_OUT_MISSING')
          parents=subprocess.check_output(['git','rev-list','--parents','-n','1','HEAD'],text=True).strip().split()
          execution_parent=parents[1]
          subprocess.run(['git','fetch','--no-tags','origin','main'],check=True)
          if subprocess.run(['git','merge-base','--is-ancestor',s['parent_head'],execution_parent]).returncode!=0:
              raise SystemExit('SESSION_PARENT_NOT_ANCESTOR_OF_EXECUTION_COMMIT')
          print('NAYA_SESSION_VERIFIED',s['session_id'],'HEAD',parents[0],'PARENT',execution_parent)
          PY

      - name: Build canonical React Hub artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf NAYANET/HUB/dist dist
          cd NAYANET/HUB
          npm install --no-package-lock
          npm run typecheck
          npm run build
          cd ../..
          test -s NAYANET/HUB/dist/index.html
          test -s NAYANET/HUB/dist/assistant-runtime.js
          test -s NAYANET/HUB/dist/name-first-auth-adapter.js || cp NAYANET/HUB/public/NAYANET/name-first-auth-adapter.js NAYANET/HUB/dist/name-first-auth-adapter.js
          mkdir -p dist
          cp -R NAYANET/HUB/dist/. dist/
          mkdir -p dist/NAYANET
          cp NAYANET/HUB/public/NAYANET/name-first-auth-adapter.js dist/NAYANET/name-first-auth-adapter.js
          test -s dist/index.html
          test -s dist/NAYANET/name-first-auth-adapter.js
          sha256sum dist/index.html | tee "${RUNNER_TEMP}/source.sha256"

      - name: Deploy exact canonical Hub artifact
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"$schema":"node_modules/wrangler/config-schema.json","name":"sparkling-shape-7ae5","compatibility_date":"2026-09-15","account_id":"b5e2a51b3e883f7722287c5f51b1196b","main":"/home/runner/work/NayaPOWER/NayaPOWER/NAYANET/HUB/cloudflare-static-worker.js","assets":{"directory":"/home/runner/work/NayaPOWER/NayaPOWER/dist","binding":"ASSETS","run_worker_first":true,"html_handling":"none","not_found_handling":"single-page-application"}}' > "${RUNNER_TEMP}/wrangler.jsonc"
          npx --yes wrangler@4 deploy --config "${RUNNER_TEMP}/wrangler.jsonc"

      - name: Verify live canonical React artifact
        shell: bash
        run: |
          set -euo pipefail
          source_hash=$(cut -d' ' -f1 "${RUNNER_TEMP}/source.sha256")
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --location "${NAYA_RUNTIME_URL}/?release=${GITHUB_SHA}&attempt=${attempt}" -o "${RUNNER_TEMP}/live.html"
            live_hash=$(sha256sum "${RUNNER_TEMP}/live.html" | cut -d' ' -f1)
            if [ "${source_hash}" = "${live_hash}" ]; then
              echo "LIVE_EXACT_CANONICAL_ARTIFACT_VERIFIED sha256=${live_hash}"
              break
            fi
            sleep 2
          done
          test "${source_hash}" = "${live_hash}"
          npm install --no-save --no-package-lock playwright@1.55.0
          NAYA_RUNTIME_URL="${NAYA_RUNTIME_URL}" GITHUB_SHA="${GITHUB_SHA}" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const runtime=process.env.NAYA_RUNTIME_URL;
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            for (const viewport of [{width:1440,height:1000,label:'desktop'},{width:390,height:844,label:'mobile'}]) {
              const context=await browser.newContext({serviceWorkers:'block',viewport:{width:viewport.width,height:viewport.height}});
              const page=await context.newPage();
              const response=await page.goto(runtime+'/?release='+process.env.GITHUB_SHA+'&viewport='+viewport.label,{waitUntil:'domcontentloaded',timeout:60000});
              if(!response?.ok()) throw new Error(viewport.label+': live Hub HTTP unavailable');
              await page.waitForFunction(()=>!!window.NayaAssistantRuntime,{timeout:30000});
              const probe=await page.evaluate(()=>({
                title:document.title,
                shell:!!document.querySelector('.app[data-shell-owner="AppShell"]'),
                runtime:!!window.NayaAssistantRuntime,
                capture:!!document.querySelector('[data-testid="capture-smart-note"]'),
                sidebar:document.querySelector('.sidebar')?.innerText||'',
                legacy:!!document.querySelector('#naya-smart-tabs')
              }));
              console.log('CANONICAL_REACT_HUB_PROBE',viewport.label,JSON.stringify(probe));
              if(probe.title!=='NayaNET — Intelligent Hub V7 · 509 AAA') throw new Error(viewport.label+': canonical title mismatch');
              if(!probe.shell||!probe.runtime||!probe.capture) throw new Error(viewport.label+': canonical React runtime incomplete');
              if(probe.legacy) throw new Error(viewport.label+': legacy Smart Tabs runtime present');
              for(const label of ['Intelligence Today','Reports','Intelligence Library','Smart Share','Smart Lists','Smart Spaces','Your Connections','Smart Mail','Smart Ledger','Naya Play','Settings']) if(!probe.sidebar.includes(label)) throw new Error(viewport.label+': missing canonical sidebar surface '+label);
              await page.goto(runtime+'/?release='+process.env.GITHUB_SHA+'&viewport='+viewport.label+'&surface=intelligence-today',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>document.querySelector('.today-room h1')?.textContent?.trim()==='Your Intelligence Today' || !!document.querySelector('.today-room.error'),{timeout:30000});
              const todayProbe=await page.evaluate(()=>({
                room:!!document.querySelector('.today-room'),
                heading:document.querySelector('.today-room h1')?.textContent?.trim()||'',
                pulse:!!document.querySelector('.today-pulse'),
                intelligenceGrid:document.querySelectorAll('.today-intelligence-card').length,
                valueGrid:!!document.querySelector('.today-value-grid'),
                honesty:!!document.querySelector('.today-honesty')
              }));
              console.log('ROOM_01_INTELLIGENCE_TODAY_PROBE',viewport.label,JSON.stringify(todayProbe));
              if(!todayProbe.room||todayProbe.heading!=='Your Intelligence Today') throw new Error(viewport.label+': Room 01 did not render');
              if(!todayProbe.pulse||!todayProbe.valueGrid||!todayProbe.honesty) throw new Error(viewport.label+': Room 01 workspace incomplete');
              if(todayProbe.intelligenceGrid===0) throw new Error(viewport.label+': Room 01 has no canonical intelligence cards');
              await context.close();
            }
          } finally { await browser.close(); }
          NODE

      - name: Final proof
        run: |
          echo "LIVE_VERIFIED=${NAYA_RUNTIME_URL}"
          echo "WORKER=${CLOUDFLARE_CANONICAL_WORKER}"
          echo "SOURCE=${{ inputs.source_ref || github.sha }}"
          echo "CANONICAL_HUB_RUNTIME=REACT_VITE"
