# Canonical release gate: source contract → typecheck → build → Assistant Cloudflare deployment.
name: NAYA 509 — Assistant Cloudflare Hub Release

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/HUB/**'
      - 'scripts/validate-nayanet-hub-nine-board.py'
      - '.github/workflows/assistant-cloudflare-hub-release.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_CANONICAL_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  CLOUDFLARE_CANONICAL_WORKER: sparkling-shape-7ae5

concurrency:
  group: assistant-cloudflare-hub-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    steps:
      - name: Checkout canonical Hub source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NAYANET/HUB/package.json
      - name: Install dependencies
        working-directory: NAYANET/HUB
        run: npm install --no-audit --no-fund
      - name: Source contract
        run: python3 scripts/validate-nayanet-hub-nine-board.py
      - name: Typecheck
        working-directory: NAYANET/HUB
        run: npm run typecheck
      - name: Production build
        working-directory: NAYANET/HUB
        run: npm run build
      - name: Validate Cloudflare release credentials and target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: NAYANET/HUB
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing from environment assistant-cloudflare-production'; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text())
          expected_account = 'b5e2a51b3e883f7722287c5f51b1196b'
          expected_worker = 'sparkling-shape-7ae5'
          if config.get('account_id') != expected_account:
              raise SystemExit('Canonical Cloudflare account binding mismatch')
          if config.get('name') != expected_worker:
              raise SystemExit('Canonical Cloudflare Worker binding mismatch')
          print(f'Cloudflare target: {expected_worker}')
          print('Cloudflare account binding: VERIFIED')
          print('Cloudflare API token: PRESENT (value intentionally not printed)')
          PY
      - name: Deploy Assistant-authoritative Worker
        working-directory: NAYANET/HUB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
