# CANONICAL RUNTIME RELEASE — deploy the exact current protected Hub freeze point.
# Canonical source: NAYANET/HUB React host preserving the protected 509 baseline visual contract; legacy static Hub remains preserved as historical surface.
# Assistant lane only. GitHub 509 is a separate fail-closed lane.
# Execution note: protected-main push and manual dispatch are both canonical execution surfaces.
name: NAYA — Canonical Assistant Cloudflare Hub Release

on:
  push:
    branches: [main]
    paths:
      - '2026 09 17 NAYANET HUB.html'
      - 'assistant-runtime.js'
      - 'smart-feed.js'
      - 'smart-tabs.js'
      - 'NAYANET/HUB/**'
      - '.github/workflows/assistant-cloudflare-hub-release.yml'
  workflow_dispatch:
    inputs:
      commit_sha:
        required: false
        type: string
      approval:
        required: false
        type: string
      reason:
        required: false
        type: string
      release_surface:
        required: false
        type: choice
        options:
          - legacy-v7
          - sparkling-shape-react
        default: sparkling-shape-react

permissions:
  contents: read

env:
  CLOUDFLARE_CANONICAL_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  CLOUDFLARE_CANONICAL_WORKER: sparkling-shape-7ae5
  NAYA_RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Bind manual dispatch to exact current main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          APPROVAL: ${{ inputs.approval }}
          REASON: ${{ inputs.reason }}
          RELEASE_SURFACE: ${{ inputs.release_surface }}
        run: |
          set -euo pipefail
          test -n "${REQUESTED_COMMIT_SHA}"
          test "${REQUESTED_COMMIT_SHA}" = "${GITHUB_SHA}"
          test "${APPROVAL}" = "EXPLICIT_APPROVAL_GRANTED"
          test -n "${REASON}"
          test "${RELEASE_SURFACE}" = "legacy-v7" || test "${RELEASE_SURFACE}" = "sparkling-shape-react"
          echo "AUTHORIZED_MANUAL_DISPATCH_BOUND=${GITHUB_SHA}"
          echo "AUTHORIZED_RELEASE_SURFACE=${RELEASE_SURFACE}"

      - name: Checkout exact main source
        uses: actions/checkout@v4

      - name: Prepare authorized Hub artifact
        shell: bash
        env:
          RELEASE_SURFACE: ${{ inputs.release_surface || 'sparkling-shape-react' }}
        run: |
          set -euo pipefail
          rm -rf dist
          if [ "$RELEASE_SURFACE" = "sparkling-shape-react" ]; then
            test -s 'NAYANET/HUB/package.json'
            test -s 'NAYANET/HUB/index.html'
            test -s 'NAYANET/HUB/src/app/App.tsx'
            test -s 'NAYANET/HUB/src/baseline/HubBaselineApp.tsx'
            test -s 'NAYANET/HUB/src/baseline/hub-baseline.html'
            test -s 'assistant-runtime.js'
            cd NAYANET/HUB
            npm install --no-audit --no-fund
            npm run build
            test -s dist/index.html
            grep -q 'NAYANET-HUB-REACT-CANONICAL' dist/index.html
            grep -q 'CANONICAL-2026-09-17T17-20-00Z-WHAT-IS-A-SMART-NOTE' dist/intelligence/pis-feed.json
            grep -q 'What Is a Smart Note?' dist/intelligence/pis-feed.json
            cd ../..
            sha256sum NAYANET/HUB/dist/index.html | tee "$RUNNER_TEMP/source.sha256"
            echo 'REACT_SOURCE_ARTIFACT_READY'
          else
            test -s '2026 09 17 NAYANET HUB.html'
            test -s 'assistant-runtime.js'
            test -s 'smart-feed.js'
            test -s 'smart-tabs.js'
            test -s 'identity.html'
            test -s 'NAYANET/name-first-auth-adapter.js'
            mkdir -p dist/NAYANET
            cp '2026 09 17 NAYANET HUB.html' dist/index.html
            cp 'assistant-runtime.js' dist/assistant-runtime.js
            cp 'smart-feed.js' dist/smart-feed.js
            cp 'smart-tabs.js' dist/smart-tabs.js
            cp 'identity.html' dist/identity.html
            cp 'NAYANET/name-first-auth-adapter.js' dist/NAYANET/name-first-auth-adapter.js
            grep -q 'nayanet-direct-nine' dist/index.html
            grep -q 'assistant-runtime.js' dist/index.html
            grep -q 'NayaNET — Intelligent Hub' dist/index.html
            grep -q 'id="name"' dist/identity.html
            grep -q 'id="alias"' dist/identity.html
            grep -q 'id="enter"' dist/identity.html
            grep -q 'NayaNETNameFirstAuth' dist/identity.html
            grep -q 'signInAnonymously' dist/NAYANET/name-first-auth-adapter.js
            sha256sum dist/index.html | tee "$RUNNER_TEMP/source.sha256"
            sha256sum dist/assistant-runtime.js | tee "$RUNNER_TEMP/runtime-source.sha256"
            sha256sum dist/smart-feed.js | tee "$RUNNER_TEMP/smart-feed-source.sha256"
            sha256sum dist/smart-tabs.js | tee "$RUNNER_TEMP/smart-tabs-source.sha256"
            sha256sum dist/identity.html | tee "$RUNNER_TEMP/identity-source.sha256"
            sha256sum dist/NAYANET/name-first-auth-adapter.js | tee "$RUNNER_TEMP/adapter-source.sha256"
            echo 'ASSISTANT_SOURCE_ARTIFACT_READY'
          fi
      - name: Bind exact authorized Cloudflare target
        shell: bash
        env:
          RELEASE_SURFACE: ${{ inputs.release_surface || 'sparkling-shape-react' }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ "$RELEASE_SURFACE" = "sparkling-shape-react" ]; then
            printf '%s\n' '{"$schema":"node_modules/wrangler/config-schema.json","name":"sparkling-shape-7ae5","compatibility_date":"2026-09-15","account_id":"b5e2a51b3e883f7722287c5f51b1196b","assets":{"directory":"/home/runner/work/NayaPOWER/NayaPOWER/NAYANET/HUB/dist","not_found_handling":"single-page-application"}}' > "$RUNNER_TEMP/wrangler.jsonc"
          else
            printf '%s\n' '{"$schema":"node_modules/wrangler/config-schema.json","name":"sparkling-shape-7ae5","compatibility_date":"2026-09-15","account_id":"b5e2a51b3e883f7722287c5f51b1196b","assets":{"directory":"/home/runner/work/NayaPOWER/NayaPOWER/dist","not_found_handling":"single-page-application"}}' > "$RUNNER_TEMP/wrangler.jsonc"
          fi
      - name: Deploy exact Assistant-lane artifact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config "$RUNNER_TEMP/wrangler.jsonc"

      - name: Verify live artifact identity and exact source parity
        shell: bash
        env:
          RELEASE_SURFACE: ${{ inputs.release_surface || 'sparkling-shape-react' }}
        run: |
          set -euo pipefail
          source_hash=$(cut -d' ' -f1 "$RUNNER_TEMP/source.sha256")
          verified=0
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --location "$NAYA_RUNTIME_URL/?naya_release=${GITHUB_SHA}-attempt-${attempt}" -o "$RUNNER_TEMP/live.html"
            sha256sum "$RUNNER_TEMP/live.html" | tee "$RUNNER_TEMP/live.sha256"
            live_hash=$(cut -d' ' -f1 "$RUNNER_TEMP/live.sha256")
            if [ "$RELEASE_SURFACE" = "sparkling-shape-react" ]; then
              if [ "$source_hash" = "$live_hash" ] && grep -q 'NAYANET-HUB-REACT-CANONICAL' "$RUNNER_TEMP/live.html" && grep -q 'NayaNET — Intelligent Hub' "$RUNNER_TEMP/live.html"; then
                verified=1
                break
              fi
            else
              runtime_source_hash=$(cut -d' ' -f1 "$RUNNER_TEMP/runtime-source.sha256")
              smart_feed_source_hash=$(cut -d' ' -f1 "$RUNNER_TEMP/smart-feed-source.sha256")
              smart_tabs_source_hash=$(cut -d' ' -f1 "$RUNNER_TEMP/smart-tabs-source.sha256")
              identity_source_hash=$(cut -d' ' -f1 "$RUNNER_TEMP/identity-source.sha256")
              adapter_source_hash=$(cut -d' ' -f1 "$RUNNER_TEMP/adapter-source.sha256")
              curl --fail --silent --show-error --location "$NAYA_RUNTIME_URL/assistant-runtime.js?naya_release=${GITHUB_SHA}-attempt-${attempt}" -o "$RUNNER_TEMP/live-runtime.js"
              curl --fail --silent --show-error --location "$NAYA_RUNTIME_URL/smart-feed.js?naya_release=${GITHUB_SHA}-attempt-${attempt}" -o "$RUNNER_TEMP/live-smart-feed.js"
              curl --fail --silent --show-error --location "$NAYA_RUNTIME_URL/smart-tabs.js?naya_release=${GITHUB_SHA}-attempt-${attempt}" -o "$RUNNER_TEMP/live-smart-tabs.js"
              curl --fail --silent --show-error --location "$NAYA_RUNTIME_URL/identity.html?naya_release=${GITHUB_SHA}-attempt-${attempt}" -o "$RUNNER_TEMP/live-identity.html"
              curl --fail --silent --show-error --location "$NAYA_RUNTIME_URL/NAYANET/name-first-auth-adapter.js?naya_release=${GITHUB_SHA}-attempt-${attempt}" -o "$RUNNER_TEMP/live-name-first-adapter.js"
              runtime_live_hash=$(sha256sum "$RUNNER_TEMP/live-runtime.js" | cut -d' ' -f1)
              smart_feed_live_hash=$(sha256sum "$RUNNER_TEMP/live-smart-feed.js" | cut -d' ' -f1)
              smart_tabs_live_hash=$(sha256sum "$RUNNER_TEMP/live-smart-tabs.js" | cut -d' ' -f1)
              identity_live_hash=$(sha256sum "$RUNNER_TEMP/live-identity.html" | cut -d' ' -f1)
              adapter_live_hash=$(sha256sum "$RUNNER_TEMP/live-name-first-adapter.js" | cut -d' ' -f1)
              if [ "$source_hash" = "$live_hash" ] && [ "$runtime_source_hash" = "$runtime_live_hash" ] && [ "$smart_feed_source_hash" = "$smart_feed_live_hash" ] && [ "$smart_tabs_source_hash" = "$smart_tabs_live_hash" ] && [ "$identity_source_hash" = "$identity_live_hash" ] && [ "$adapter_source_hash" = "$adapter_live_hash" ] && grep -q 'nayanet-direct-nine' "$RUNNER_TEMP/live.html" && grep -q 'NayaAssistantRuntime' "$RUNNER_TEMP/live-runtime.js" && grep -q 'NAYANET · LIVING INTELLIGENCE PROJECTION' "$RUNNER_TEMP/live-smart-feed.js" && grep -q 'SMART TABS · YOUR NAVIGATION' "$RUNNER_TEMP/live-smart-tabs.js" && grep -q 'NayaNET — Intelligent Hub' "$RUNNER_TEMP/live.html" && grep -q 'id="name"' "$RUNNER_TEMP/live-identity.html" && grep -q 'id="alias"' "$RUNNER_TEMP/live-identity.html" && grep -q 'id="enter"' "$RUNNER_TEMP/live-identity.html" && grep -q 'NayaNETNameFirstAuth' "$RUNNER_TEMP/live-identity.html" && grep -q 'signInAnonymously' "$RUNNER_TEMP/live-name-first-adapter.js"; then
                verified=1
                break
              fi
            fi
            echo "WAITING_FOR_CLOUDFLARE_PROPAGATION attempt=$attempt source=$source_hash live=$live_hash"
            sleep 2
          done
          test "$verified" = "1"
          echo "LIVE_EXACT_SOURCE_PARITY_VERIFIED sha256=$live_hash"
      - name: Verify Assistant runtime baseline — desktop and mobile
        shell: bash
        env:
          RELEASE_SURFACE: ${{ inputs.release_surface || 'sparkling-shape-react' }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          cat > verify-assistant-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox','--disable-dev-shm-usage']
          });

          try {
            if (process.env.RELEASE_SURFACE === 'sparkling-shape-react') {
              for (const viewport of [
                { width: 1440, height: 1000, label: 'desktop' },
                { width: 390, height: 844, label: 'mobile' }
              ]) {
                const context = await browser.newContext({ serviceWorkers: 'block', viewport: { width: viewport.width, height: viewport.height } });
                const page = await context.newPage();
                const proofAlias = 'ci' + process.env.GITHUB_SHA.slice(0, 16) + viewport.label;
                await page.goto(process.env.NAYA_RUNTIME_URL + '/identity.html?name=Naya%20CI%20Proof&alias=' + proofAlias, { waitUntil: 'networkidle', timeout: 30000 });
                await page.getByRole('button', { name: 'ENTER NAYANET' }).click();
                await page.waitForTimeout(1500);
                const identityProof = await page.evaluate(async () => window.NayaNETNameFirstAuth ? await window.NayaNETNameFirstAuth.current() : null);
                if (!identityProof?.authenticated || !identityProof?.userId) throw new Error('VIEWPORT_IDENTITY_NOT_AUTHENTICATED');
                await page.goto(process.env.NAYA_RUNTIME_URL + '/?naya_release=' + process.env.GITHUB_SHA, { waitUntil: 'networkidle', timeout: 30000 });
                await page.waitForTimeout(2500);
                const result = await page.evaluate(async () => ({
                  title: document.title,
                  marker: document.querySelector('meta[name="nayanet-canonical-marker"]')?.getAttribute('content') || '',
                  assistantRuntime: !!window.NayaAssistantRuntime,
                  identity: window.NayaNETNameFirstAuth ? await window.NayaNETNameFirstAuth.current() : null,
                  shell: document.querySelector('[data-shell-owner="AppShellV3"]')?.getAttribute('data-runtime-marker') || '',
                  nav: [...document.querySelectorAll('.nav-item')].map(x => x.textContent?.replace(/\s+/g, ' ').trim()).filter(Boolean),
                  feedBoards: document.querySelectorAll('.smart-feed-board').length,
                  private: document.body.innerText.includes('PRIVATE BY DEFAULT'),
                  naya: document.body.innerText.includes('NAYA'),
                  intelligence: document.body.innerText.includes('INTELLIGENCE')
                }));
                const expectedNav = ['Your Intelligence Today','Your Report','Intelligence Library','Smart Lists','Smart Share','Smart Spaces','Your Connections','Smart Mail','Settings'];
                if (!result.identity?.authenticated || !result.identity?.userId) throw new Error('HUB_IDENTITY_NOT_AUTHENTICATED');
                if (result.marker !== 'NAYANET-HUB-REACT-CANONICAL') throw new Error('REACT_MARKER_MISSING');
                if (result.assistantRuntime !== true) throw new Error('ASSISTANT_RUNTIME_NOT_LOADED');
                if (result.shell !== 'NAYANET-HUB-REACT-CANONICAL') throw new Error('CANONICAL_REACT_SHELL_MISSING');
                if (JSON.stringify(result.nav) !== JSON.stringify(expectedNav)) throw new Error('CANONICAL_SIDEBAR_MISMATCH:' + JSON.stringify(result.nav));
                if (result.feedBoards < 1) throw new Error('INTELLIGENT_FEED_DID_NOT_RENDER');
                if (!result.private || !result.naya || !result.intelligence) throw new Error('REQUIRED_HUB_CONTENT_MISSING');
                await page.getByRole('button', { name: 'Intelligence Library' }).click();
                await page.waitForTimeout(500);
                if (!page.url().includes('/library')) throw new Error('INTELLIGENCE_LIBRARY_ROUTE_FAILED');
                if (!(await page.locator('h1').filter({hasText:'Intelligence Library'}).count())) throw new Error('INTELLIGENCE_LIBRARY_SURFACE_MISSING');
                await page.getByRole('button', { name: 'Smart Mail' }).click();
                await page.waitForTimeout(500);
                if (!page.url().includes('/mail')) throw new Error('SMART_MAIL_ROUTE_FAILED');
                if (!(await page.locator('h1').filter({hasText:'Smart Mail'}).count())) throw new Error('SMART_MAIL_SURFACE_MISSING');
                console.log('CANONICAL_REACT_HUB_VERIFIED', viewport.label, JSON.stringify(result));
                await context.close();
              }
            } else {
              for (const viewport of [
                { width: 1440, height: 1000, label: 'desktop' },
                { width: 390, height: 844, label: 'mobile' }
              ]) {
                const context = await browser.newContext({ serviceWorkers: 'block', viewport: { width: viewport.width, height: viewport.height } });
                const page = await context.newPage();
                await page.goto('file://' + process.env.RUNNER_TEMP + '/live.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForTimeout(1000);
                const result = await page.evaluate(() => ({
                  title: document.title,
                  directNine: !!document.querySelector('meta[name="nayanet-direct-nine"]'),
                  navCount: document.querySelectorAll('.naya509-primary-nav a').length,
                  blockCount: document.querySelectorAll('.block').length,
                  layerCounts: [...document.querySelectorAll('.block')].map(b => b.querySelectorAll('.layer').length),
                  hasNaya: !!document.body && document.body.innerText.includes('Naya'),
                  hasIntelligence: !!document.body && document.body.innerText.includes('INTELLIGENCE')
                }));
                if (!result.directNine) throw new Error(`${viewport.label}: missing direct-nine runtime marker`);
                if (!result.title.includes('NayaNET')) throw new Error(`${viewport.label}: unexpected title ${result.title}`);
                if (result.blockCount < 1) throw new Error(`${viewport.label}: no intelligence blocks rendered`);
                if (result.layerCounts.some(n => n < 1)) throw new Error(`${viewport.label}: block without layers`);
                if (!result.hasNaya || !result.hasIntelligence) throw new Error(`${viewport.label}: expected runtime content missing`);
                console.log(`ASSISTANT_RUNTIME_BASELINE_VERIFIED ${viewport.label}`, JSON.stringify(result));
                await context.close();
              }
            }
          } finally {
            await browser.close();
          }
          EOF
          NAYA_RUNTIME_URL="$NAYA_RUNTIME_URL" RELEASE_SURFACE="$RELEASE_SURFACE" GITHUB_SHA="$GITHUB_SHA" node verify-assistant-runtime.mjs
          rm -f verify-assistant-runtime.mjs
      - name: Final Assistant-lane runtime proof
        shell: bash
        run: |
          echo "ASSISTANT_LANE_RUNTIME_VERIFIED=$NAYA_RUNTIME_URL"
          echo "ASSISTANT_LANE_WORKER=$CLOUDFLARE_CANONICAL_WORKER"
          echo "ASSISTANT_LANE_ACCOUNT=$CLOUDFLARE_CANONICAL_ACCOUNT_ID"
          echo "SOURCE=2026 09 17 NAYANET HUB.html"
          echo "LANE=ASSISTANT_CLOUDFLARE"
