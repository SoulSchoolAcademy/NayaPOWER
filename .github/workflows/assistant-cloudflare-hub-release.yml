# CANONICAL RUNTIME RELEASE — deploy the exact current Hub artifact
# The canonical HTML is the source of truth. This workflow must not rewrite its architecture.
name: NAYA — Canonical Cloudflare Hub Release

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/assistant-cloudflare-hub-release.yml'
      - '.naya/control-plane/PROGRESS-CHECKPOINT.json'
  workflow_dispatch:

permissions: {contents: read}

env:
  CLOUDFLARE_CANONICAL_ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  CLOUDFLARE_CANONICAL_WORKER: sparkling-shape-7ae5
  NAYA_RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare exact canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s '2026 09 15 NayaNETHUB.html'
          mkdir -p dist
          cp '2026 09 15 NayaNETHUB.html' dist/index.html
          test -s dist/index.html
          grep -q 'nayanet-direct-nine' dist/index.html
          grep -q 'What is Naya Power' dist/index.html
          echo 'CANONICAL_ARTIFACT_READY'

      - name: Bind exact Cloudflare target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cat > "$RUNNER_TEMP/wrangler.jsonc" <<'EOF'
          {"$schema":"node_modules/wrangler/config-schema.json","name":"sparkling-shape-7ae5","compatibility_date":"2026-09-15","account_id":"b5e2a51b3e883f7722287c5f51b1196b","assets":{"directory":"/home/runner/work/NayaPOWER/NayaPOWER/dist","not_found_handling":"single-page-application"}}
          EOF

      - name: Deploy exact canonical Hub
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config "$RUNNER_TEMP/wrangler.jsonc"

      - name: Verify live artifact identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$NAYA_RUNTIME_URL" -o "$RUNNER_TEMP/live.html"
          grep -q 'nayanet-direct-nine' "$RUNNER_TEMP/live.html"
          grep -q 'What is Naya Power' "$RUNNER_TEMP/live.html"
          if grep -q 'naya-canonical-eight-layer-guard' "$RUNNER_TEMP/live.html"; then
            echo 'FAIL: obsolete eight-layer deployment guard is still live'
            exit 1
          fi
          if grep -q 'SMART NOTE 01·CANONICAL INTELLIGENCE' "$RUNNER_TEMP/live.html"; then
            echo 'FAIL: stale 509 Hub artifact is still live'
            exit 1
          fi
          echo 'LIVE_ARTIFACT_IDENTITY_VERIFIED'

      - name: Verify browser runtime geometry and typography
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          cat > verify-smart-board.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url = process.env.NAYA_RUNTIME_URL;
          const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            for (const viewport of [{width:1440,height:1000,label:'desktop'},{width:390,height:844,label:'mobile'}]) {
              const page = await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
              await page.goto(url,{waitUntil:'networkidle',timeout:30000});
              await page.waitForTimeout(1200);
              const result = await page.evaluate(() => {
                const first = document.querySelector('.block');
                const layers = first?.querySelector('.layers');
                const items = layers ? [...layers.querySelectorAll(':scope > .layer')] : [];
                const labels = items.map(x => (x.querySelector('.layerHead b')?.textContent || '').trim().toUpperCase());
                const title = first?.querySelector('h3')?.textContent?.trim() || '';
                const bodies = [...document.querySelectorAll('.layerBody, .nutshell p')];
                const heads = [...document.querySelectorAll('.layerHead b, .nutshell b')];
                const titleSizes = heads.map(x => parseFloat(getComputedStyle(x).fontSize));
                const bodySizes = bodies.map(x => parseFloat(getComputedStyle(x).fontSize));
                const icons = [...document.querySelectorAll('.layerHead .dot, .v10-icon, .v10-nutshell-star')];
                return {title,labels,titleSizes,bodySizes,iconCount:icons.length,layerCount:items.length};
              });
              if (result.title !== 'What is Naya Power') throw new Error(`${viewport.label}: wrong board title: ${result.title}`);
              if (result.layerCount !== 8) throw new Error(`${viewport.label}: expected current canonical 8-layer source, got ${result.layerCount}`);
              if (result.labels.some(x => /^\d/.test(x))) throw new Error(`${viewport.label}: visible numeric layer prefix`);
              if (!result.titleSizes.some(n => Math.abs(n-18)<0.75)) throw new Error(`${viewport.label}: 18px layer typography not live`);
              if (!result.bodySizes.some(n => Math.abs(n-14)<0.75)) throw new Error(`${viewport.label}: 14px body typography not live`);
              if (result.iconCount < 8) throw new Error(`${viewport.label}: premium icon system not present`);
              console.log(`SMART_BOARD_RUNTIME_VERIFIED ${viewport.label}`, JSON.stringify(result));
              await page.close();
            }
          } finally { await browser.close(); }
          EOF
          NAYA_RUNTIME_URL="$NAYA_RUNTIME_URL" node verify-smart-board.mjs
          rm -f verify-smart-board.mjs

      - name: Final runtime proof
        shell: bash
        run: |
          echo "LIVE_RUNTIME_VERIFIED $NAYA_RUNTIME_URL"
          echo "WORKER $CLOUDFLARE_CANONICAL_WORKER"
