                const expectedNav = ['Your Intelligence Today','Smart Feed','Smart Notes','Your Report','Intelligence Library','Smart Lists','Smart Share','Collective Intelligence','Evidence','Smart Spaces','Your Connections','Smart Mail','Smart Ledger','Settings'];
                if (!result.identity?.authenticated || !result.identity?.userId) throw new Error('HUB_IDENTITY_NOT_AUTHENTICATED');
                if (result.marker !== 'NAYANET-HUB-REACT-CANONICAL') throw new Error('REACT_MARKER_MISSING');
                if (result.assistantRuntime !== true) throw new Error('ASSISTANT_RUNTIME_NOT_LOADED');
                if (result.shell !== 'NAYANET-HUB-REACT-CANONICAL') throw new Error('CANONICAL_REACT_SHELL_MISSING');
                if (JSON.stringify(result.nav) !== JSON.stringify(expectedNav)) throw new Error('CANONICAL_SIDEBAR_MISMATCH:' + JSON.stringify(result.nav));
                if (result.feedBoards < 1) throw new Error('INTELLIGENT_FEED_DID_NOT_RENDER');
                if (!result.private || !result.naya || !result.intelligence) throw new Error('REQUIRED_HUB_CONTENT_MISSING');

                const board = page.locator('.smart-feed-board').first();
                const statusFor = async (label) => {
                  const status = await board.locator('.sfb-status').textContent().catch(() => '');
                  if (!String(status || '').includes('ACTION PERSISTED') && !String(status || '').includes('SHARE PERSISTED')) throw new Error('SMART_FEED_ACTION_NOT_PERSISTED:' + label + ':' + String(status || 'NO_STATUS'));
                  if (!String(status || '').includes('RECEIPT ')) throw new Error('SMART_FEED_ACTION_RECEIPT_NOT_RETURNED:' + label + ':' + String(status || 'NO_RECEIPT'));
                };
                const actionButton = (name) => board.getByRole('button', { name, exact: true }).first();

                await board.locator('[aria-label="Favorite intelligence"]').first().click();
                await page.waitForTimeout(700); await statusFor('favorite');

                await actionButton('Save intelligence').click();
                await page.waitForTimeout(700); await statusFor('save');

                await actionButton('♥ LIKE').click();
                await page.waitForTimeout(700); await statusFor('like');