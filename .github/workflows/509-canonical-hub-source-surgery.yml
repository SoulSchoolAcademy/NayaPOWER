name: 509 Canonical Hub Source Surgery

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/509-canonical-hub-source-surgery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical visible intelligence spine
        shell: python
        run: |
          from pathlib import Path
          p=Path('2026 09 15 NayaNETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- NAYA-CANONICAL-HUB-SPINE-V1 -->'
          if marker not in s:
            script=r'''<!-- NAYA-CANONICAL-HUB-SPINE-V1 -->
<style>
.layers{display:flex!important;flex-direction:column!important;gap:10px!important}
.layer{width:100%!important}
</style>
<script>
(()=>{
 const wanted=['IN A NUTSHELL','HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','ADAPTER LEARNING','WHAT IT MEANS','HOW TO USE',"WHAT'S IN IT FOR YOU"];
 const aliases={'CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','MACHINE / PROVENANCE':'MACHINE NOTE'};
 const side={'Home':'Your Intelligence Today','Reports':'Your Report','Intelligence Library':'Intelligence','Collective':'Smart Share','Connections':'Your Connections'};
 const text=x=>(x||'').replace(/\s+/g,' ').trim().toUpperCase();
 function fix(){
   document.querySelectorAll('.label').forEach(x=>{const t=text(x.textContent);if(['YOUR INTELLIGENCE','SHARE & EVIDENCE','COMMUNICATION','SYSTEM'].includes(t)){} });
   document.querySelectorAll('.nav button').forEach(b=>{const raw=b.textContent.replace(/\s+/g,' ').trim();for(const [a,v] of Object.entries(side)){if(text(raw).startsWith(a.toUpperCase())){for(const n of b.childNodes)if(n.nodeType===3&&n.textContent.trim())n.textContent=n.textContent.replace(a,v);}}});
   document.querySelectorAll('.label').forEach(l=>{const t=text(l.textContent);if(t.includes('SHARE')||t.includes('EVIDENCE'))l.textContent='SHARE & CONNECT';if(t.includes('COMMUNICATION'))l.textContent='PROOF & COMMUNICATION';if(t.includes('SYSTEM'))l.textContent='SYSTEM';if(t.includes('YOUR INTELLIGENCE'))l.textContent='YOUR INTELLIGENCE';});
   document.querySelectorAll('.layers').forEach(layers=>{
     const current=[...layers.querySelectorAll(':scope > .layer')];
     current.forEach(layer=>{const h=layer.querySelector('.layerHead b');if(!h)return;const t=text(h.textContent);if(aliases[t])h.textContent=aliases[t];});
     const by={};[...layers.querySelectorAll(':scope > .layer')].forEach(x=>{const h=x.querySelector('.layerHead b');if(h)by[text(h.textContent)]=x;});
     const meaning=by['WHAT IT MEANS'];
     if(meaning&&!by['HOW TO USE']){
       const tone=getComputedStyle(meaning).getPropertyValue('--tone')||'#55b9ee';
       const x=document.createElement('div');x.className='layer';x.style.setProperty('--layer','#55b9ee');x.innerHTML='<div class="layerHead"><span class="dot"></span><b>HOW TO USE</b><span class="state">ACTION GUIDANCE</span></div><div class="layerBody"><strong>Use the intelligence without inventing certainty.</strong> Check the source and evidence, understand the meaning, then apply a concrete action when one is verified. If no verified action exists, keep this as intelligence to review rather than fabricate a use case.</div>';
       meaning.after(x);
     }
     const use=by['WHAT\\'S IN IT FOR YOU']||[...layers.querySelectorAll(':scope > .layer')].find(x=>text(x.textContent).includes("WHAT'S IN IT FOR YOU"));
     if(use){const h=use.querySelector('.layerHead b');if(h)h.textContent="WHAT'S IN IT FOR YOU";}
     const ordered={};[...layers.querySelectorAll(':scope > .layer')].forEach(x=>{const h=x.querySelector('.layerHead b');if(h)ordered[text(h.textContent)]=x;});
     wanted.forEach(k=>{if(ordered[k])layers.appendChild(ordered[k]);});
   });
 }
 fix(); new MutationObserver(fix).observe(document.body,{childList:true,subtree:true});
})();
</script>'''
            s=s.replace('</body>',script+'\n</body>')
            p.write_text(s,encoding='utf-8')
      - name: Verify canonical source contains the required spine
        shell: bash
        run: |
          set -euo pipefail
          test -s '2026 09 15 NayaNETHUB.html'
          grep -q 'NAYA-CANONICAL-HUB-SPINE-V1' '2026 09 15 NayaNETHUB.html'
          for x in 'IN A NUTSHELL' 'HUMAN NOTE' 'CHILD NOTE' 'GRANDMA NOTE' 'NAYA NOTE' 'MACHINE NOTE' 'ADAPTER LEARNING' 'WHAT IT MEANS' 'HOW TO USE' "WHAT'S IN IT FOR YOU"; do grep -q "$x" '2026 09 15 NayaNETHUB.html'; done
      - name: Commit canonical source mutation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Make canonical Hub source carry ten-layer intelligence spine'
          git push

# trigger canonical surgery from a contents commit
