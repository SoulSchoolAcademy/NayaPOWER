name: 509 Canonical Hub Source Surgery

on:
  push:
    branches: [main]
    paths:
      - '2026 09 15 NayaNETHUB.html'
      - '.github/workflows/509-canonical-hub-source-surgery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Naya Power the canonical board template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('2026 09 15 NayaNETHUB.html')
          s = p.read_text(encoding='utf-8')

          # Replace the board renderer itself so every Smart Note receives the
          # same canonical structural spine. Board-specific title, glyph, tone,
          # and intelligence remain unique to each note.
          pattern = re.compile(r"function board\(note,idx\)\{.*?\nfunction stripLegacyBars\(\)", re.S)
          replacement = r'''function board(note,idx){
          const tone=tones[idx%tones.length];
          const specs=[[1,'IN A NUTSHELL'],[2,'HUMAN NOTE'],[3,'CHILD NOTE'],[4,'GRANDMA NOTE'],[5,'NAYA NOTE'],[6,'MACHINE NOTE'],[7,'LEARNING LESSON'],[8,"WHAT'S IN IT FOR YOU"]];
          const cleanLayerText=s=>s?.text||'';
          const layers=specs.map(([n,label])=>{const s=note.sections[n];if(!s)return '';return `<article class="layer" style="--layer:${tone}"><div class="layerHead"><span class="dot"></span><b>${label}</b><span class="state">SMART NOTE · ${String(note.number).padStart(2,'0')}</span></div><div class="layerBody">${body(cleanLayerText(s))}</div></article>`}).join('');
          const nuts=note.sections[1];
          return `<article class="block naya509-board" data-real-smart-note="${note.number}" data-intelligence-id="smart-note-${String(note.number).padStart(2,'0')}" style="--tone:${tone}"><div class="blockInner"><div class="blockTop"><div class="identity"><div class="glyph">${glyphs[idx%glyphs.length]}</div><div><h3>${esc(note.title)}</h3><div class="meta"><span>SMART NOTE ${String(note.number).padStart(2,'0')}</span><span>CANONICAL INTELLIGENCE</span></div></div></div><div class="truth">SOURCE CONTENT</div></div>${nuts?`<div class="nutshell"><b>IN A NUTSHELL</b><p>${body(cleanLayerText(nuts))}</p></div>`:''}<div class="layers">${layers}</div>${actions()}<div class="blockFoot"><span>REAL SMART NOTE CONTENT · SOURCE: SMART FEED CONTENT</span><span>INTELLIGENCE EVENT ${String(note.number).padStart(2,'0')}</span></div></div></article>`}
function stripLegacyBars()'''

          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('BOARD_RENDERER_PATTERN_NOT_FOUND')
          s = s2

          # Remove any prior canonical spine injections so they cannot fight the
          # new renderer. Then add a small compatibility guard for any legacy DOM
          # that may survive in a cached/runtime path.
          s = re.sub(r"<!-- NAYA-CANONICAL-HUB-SPINE-V1 -->.*?</script>\s*", "", s, flags=re.S)
          s = re.sub(r"<!-- NAYA-CANONICAL-HUB-SPINE-V2 -->.*?</script>\s*", "", s, flags=re.S)

          marker = '<!-- NAYA-CANONICAL-HUB-SPINE-V2 -->'
          guard = r'''<!-- NAYA-CANONICAL-HUB-SPINE-V2 -->
          <script>
          (()=>{
            const required=['IN A NUTSHELL','HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','LEARNING LESSON',"WHAT'S IN IT FOR YOU"];
            const clean=s=>String(s||'').replace(/^\s*\d+\s*[·.\-—:]?\s*/,'').replace(/\s+/g,' ').trim().toUpperCase();
            const aliases={'CHILD VIEW':'CHILD NOTE','GRABBER VIEW':'GRANDMA NOTE','GRANDMA VIEW':'GRANDMA NOTE','ADAPTIVE LEARNING':'LEARNING LESSON','LEARNING':'LEARNING LESSON','MACHINE / PROVENANCE':'MACHINE NOTE'};
            function fix(){
              document.querySelectorAll('.layers').forEach(layers=>{
                const items=[...layers.querySelectorAll(':scope > .layer')];
                const by={};
                items.forEach(layer=>{
                  const h=layer.querySelector('.layerHead b');
                  if(!h)return;
                  const normalized=aliases[clean(h.textContent)]||clean(h.textContent);
                  h.textContent=normalized;
                  by[normalized]=layer;
                });
                items.forEach(layer=>{const h=layer.querySelector('.layerHead b');if(h&&['WHAT IT MEANS','HOW TO USE','SIGNIFICANCE'].includes(clean(h.textContent)))layer.remove()});
                const current=[...layers.querySelectorAll(':scope > .layer')];
                const map={};current.forEach(layer=>{const h=layer.querySelector('.layerHead b');if(h)map[clean(h.textContent)]=layer});
                required.forEach(label=>{const layer=map[label];if(layer)layers.appendChild(layer)});
              });
            }
            fix();
            new MutationObserver(fix).observe(document.body,{childList:true,subtree:true});
          })();
          </script>'''
          s = s.replace('</body>', guard + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify canonical board structure in source
        shell: bash
        run: |
          set -euo pipefail
          test -s '2026 09 15 NayaNETHUB.html'
          grep -q 'function board(note,idx)' '2026 09 15 NayaNETHUB.html'
          for x in 'IN A NUTSHELL' 'HUMAN NOTE' 'CHILD NOTE' 'GRANDMA NOTE' 'NAYA NOTE' 'MACHINE NOTE' 'LEARNING LESSON' "WHAT'S IN IT FOR YOU"; do
            grep -q "$x" '2026 09 15 NayaNETHUB.html'
          done
          if grep -q 'ADAPTIVE LEARNING' '2026 09 15 NayaNETHUB.html'; then
            echo 'LEGACY_ADAPTIVE_LABEL_REMAINS_IN_SOURCE'
            exit 1
          fi

      - name: Commit canonical source mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026 09 15 NayaNETHUB.html'
          if git diff --cached --quiet; then
            echo 'CANONICAL_SURGERY_NO_CHANGE'
            exit 0
          fi
          git commit -m 'Mirror all Smart Note boards to canonical Naya Power structure'
          git push
