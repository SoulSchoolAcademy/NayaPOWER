name: Protocol Gates

# Prime 2: THE LAW IS THE CODE.
# These gates run on every PR. They enforce the Team Naya Operating Protocol
# as machine law — not as advice, not as documentation, but as checks that
# block merging when violated.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  machine-law:
    name: Protocol machine law (kernel/protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run protocol gate tests
        run: python -m pytest tests/test_protocol_machine_law.py -q
      - name: Verify protocol document exists
        run: test -f BRAIN/01-GOVERNANCE/TEAM-NAYA-OPERATING-PROTOCOL-V1.md

  no-competing-constitution:
    name: No competing boot/authority systems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a second decision engine appears
        run: |
          # The Decision Value Calculus is the one decision engine.
          # The activation chain is the one boot path.
          # This check fails if anyone adds a competing one.
          if grep -ril "decision value calculus\|value_calculus" --include="*.py" kernel/ | grep -v "kernel/value_calculus.py" | grep -v "kernel/protocol/" | grep -q .; then
            echo "FAIL: competing decision engine detected outside kernel/value_calculus.py and kernel/protocol/"
            exit 1
          fi
          echo "OK: one decision engine, one boot path"
