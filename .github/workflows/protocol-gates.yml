name: Protocol Gates

# Prime 2: THE LAW IS THE CODE.
# These gates run on every PR. They enforce the Team Naya Operating Protocol
# as machine law — not as advice, not as documentation, but as checks that
# block merging when violated.
#
# This is the corrected revival of #1807's protocol-gates.yml (closed
# unmerged). Two fixes vs #1807:
#   1. The competing-engine check is now AST-based
#      (tools/check_no_competing_engine.py). #1807's grep flagged ANY
#      mention of value_calculus under kernel/ — including the legitimate
#      `from kernel.value_calculus import (...)` in kernel/act_pipeline.py
#      and comments — which would red-line every PR. The AST check sees only
#      actual definitions, so imports and comments can never trip it.
#      Verified: green on main, catches a planted competing engine.
#   2. The governance-doc check covers BOTH the v1.0 protocol doc and the
#      41-law OPERATING-LAW.md (which supersedes v1.0 in breadth).
#
# KNOWN WEAKNESS (tracked, not fixed here — needs a real crypto fix):
#   kernel/protocol/read_receipt.py :: ReadReceipt.sign() uses an UNKEYED
#   SHA-256 over the payload. Anyone can recompute the hash, so receipts are
#   forgeable. CI enforcement of the tests does not fix this; it needs a
#   keyed signature (HMAC) or server-side issuance. Left as-is deliberately.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  machine-law:
    name: Protocol machine law (kernel/protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run protocol gate tests
        run: python -m pytest tests/test_protocol_machine_law.py -q
      - name: Verify governance documents exist
        run: |
          test -f BRAIN/01-GOVERNANCE/TEAM-NAYA-OPERATING-PROTOCOL-V1.md
          test -f BRAIN/01-GOVERNANCE/OPERATING-LAW.md

  no-competing-constitution:
    name: No competing boot/authority systems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if a second decision/scoring engine is defined
        run: |
          # The Decision Value Calculus (kernel/value_calculus.py) is the one
          # decision engine. The activation chain is the one boot path.
          # AST-based: only actual definitions are flagged — imports and
          # comments can never trip this check.
          python3 tools/check_no_competing_engine.py --root .

  no-test-weakening:
    name: No test weakening
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if the PR weakens tests to manufacture a pass
        run: |
          # "Never weaken tests to make a score pass" (Operating Protocol,
          # WHAT WE NEVER DO) as machine law. AST-based on the PR diff:
          # newly added skips without a ticket reference, bare pytest.skip()
          # calls, and deleted tests with no replacement all fail the gate.
          # Renames, moves, refactors, and splits are never flagged.
          python3 tools/check_no_test_weakening.py \
            --base-ref origin/main --head-ref HEAD
