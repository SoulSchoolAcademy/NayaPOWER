name: Naya Governance Gate

on:
  push:
    branches: [main]
    paths:
      - '.naya/**'
      - '.github/workflows/**'
      - 'SUPERBRAIN/MASTER-NOTES/**'
      - 'NAYANET/HUB/**'
  pull_request:
    branches: [main]
    paths:
      - '.naya/**'
      - '.github/workflows/**'
      - 'SUPERBRAIN/MASTER-NOTES/**'
      - 'NAYANET/HUB/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify canonical NayaNET execution directive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ultimate=Path('.naya/NAYANET-ULTIMATE-EXECUTION-DIRECTIVE.md'); directive=Path('.naya/NAYA-INTELLIGENT-HUB-MASTER-EXECUTION-DIRECTIVE.md'); constitution=Path('SUPERBRAIN/MASTER-NOTES/NAYA-ULTIMATE-MASTER-DESIGN-CODING-CONTRACT.md'); continuity=Path('.naya/NAYA-EXECUTION-CONTINUITY-AND-LEARNING-LAW.md'); obstacle=Path('.naya/notes/2026-09-07-SMART-NOTE-EXECUTION-OBSTACLE-SOLUTION-LOOP.md')
          for p in [ultimate,directive,constitution,continuity,obstacle]:
              if not p.exists(): raise SystemExit(f'MISSING GOVERNANCE ARTIFACT: {p}')
          ultimate_text=ultimate.read_text(); text=directive.read_text(); constitution_text=constitution.read_text(); continuity_text=continuity.read_text(); obstacle_text=obstacle.read_text()
          ultimate_required=['**STATUS:** CANONICAL OPERATING DIRECTIVE','**NORTH STAR:** The human defines the outcome. Naya owns the execution.','UNDERSTAND → PLAN → EXECUTE → VERIFY → DELIVER → LEARN → COMPOUND','NEVER DESTROY THE HOUSE TO RENOVATE ONE ROOM.','RETRIEVE → UNDERSTAND → REUSE → ADAPT → EXECUTE','SOURCE → ARCHITECTURE → BUILD → DEPLOYMENT → RUNTIME','STOP. RETURN TO MISSION.','WHEN YOU HIT A WALL, SOLVE THE WALL.','SOURCE INTENT IS NOT RUNTIME TRUTH.','RUNTIME MISMATCH = RELEASE-BLOCKING INTEGRITY ISSUE.','THE SMART NOTE PRESERVES THE LESSON.','THE NEXT EXECUTION USES THE LESSON.']
          missing=[x for x in ultimate_required if x not in ultimate_text]
          if missing: raise SystemExit(f'ULTIMATE_DIRECTIVE_CONTRACT_FAILURE: {missing}')
          required=['**STATUS:** CANONICAL','**NORTH STAR:** Turn human experience and human–AI interaction into persistent, verified, reusable, compounding intelligence.','LEARN → CREATE → REMEMBER → IMPROVE → BECOME','CAPTURE → DISTILL → ORGANIZE → REMEMBER → FIND → COMPOUND','One Intelligent Block equals one intelligence event.','NEVER DESTROY THE HOUSE TO RENOVATE ONE ROOM.','RETRIEVE PRIOR INTELLIGENCE','SELECT PROVEN METHOD','NAYA OWNS THE BLOCKER.','SOURCE INTENT IS NOT RUNTIME TRUTH.','THE COLD-NAYA TEST','STOP → IDENTIFY → CONTAIN → DIAGNOSE → CORRECT → VERIFY → RECORD → LEARN → PREVENT','THE SYSTEM COMPOUNDS.']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'HUB_DIRECTIVE_CONTRACT_FAILURE: {missing}')
          for marker in ['AN AI DOES NOT LEAVE SILENTLY.','THE NEXT AI RESTORES FROM THE REPOSITORY — NOT FROM THE PREVIOUS AI\'S MEMORY.','NO SILENT LOSS. NO FALSE RECEIPTS. NO FALSE CONTINUITY.']:
              if marker not in continuity_text: raise SystemExit(f'CONTINUITY_LAW_FAILURE: {marker}')
          for marker in ['DO NOT REPEAT A KNOWN BLOCKER WITHOUT FIRST APPLYING THE KNOWN SOLUTION.','STOP → THINK → SEARCH KNOWN SOLUTIONS → TRY THE SAFEST ALTERNATIVE → VERIFY → RECORD THE LESSON → CONTINUE']:
              if marker not in obstacle_text: raise SystemExit(f'EXECUTION_LEARNING_FAILURE: {marker}')
          if '**STATUS:** CANONICAL MASTER CONSTITUTION' not in constitution_text: raise SystemExit('ULTIMATE_MASTER_CONTRACT_IS_NOT_CANONICAL')
          print('NAYANET_ULTIMATE_EXECUTION_DIRECTIVE=PASS'); print('NAYA_MASTER_EXECUTION_DIRECTIVE=PASS'); print('ULTIMATE_MASTER_CONTRACT=PASS'); print('CONTINUITY_LAW=PASS'); print('EXECUTION_OBSTACLE_LEARNING=PASS'); print('GOVERNANCE_GATE=PASS')
          PY
      - name: Verify single-authority execution language
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ultimate=Path('.naya/NAYANET-ULTIMATE-EXECUTION-DIRECTIVE.md').read_text(); directive=Path('.naya/NAYA-INTELLIGENT-HUB-MASTER-EXECUTION-DIRECTIVE.md').read_text()
          for source,text in [('ULTIMATE',ultimate),('HUB',directive)]:
              for marker in ['declare success without runtime evidence','repeat a known blocker without first applying the known solution']:
                  if marker in text: raise SystemExit(f'GOVERNANCE_CONTRADICTION {source}: {marker}')
          print('GOVERNANCE_CONSISTENCY=PASS')
          PY
  canonical_release:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, 'release') || contains(github.event.head_commit.message, 'Cloudflare'))
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: main}
      - name: Build canonical NAYANET/HUB
        working-directory: NAYANET/HUB
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          echo 'CANONICAL_HUB_BUILD=PASS'
      - name: Verify first-slice artifact
        shell: bash
        run: |
          set -euo pipefail
          H='NAYANET/HUB/dist/index.html'
          for x in 'Intelligent Hub' 'Good morning' 'MORE INTELLIGENCE. LESS WASTE.' 'Ask Naya or search your intelligence' 'PERSONAL' 'COLLECTIVE' 'ACTIVITY' 'ONE CANONICAL INTELLIGENCE OBJECT' 'intelligenceObject'; do grep -Fqi "$x" "$H" || { echo "BUILT_ARTIFACT_MISSING=$x"; exit 1; }; done
          echo 'FIRST_SLICE_ARTIFACT=PASS'
      - name: Prepare canonical Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf CLOUDFLARE-NAYANET-HUB
          mkdir -p CLOUDFLARE-NAYANET-HUB/public
          cp -R NAYANET/HUB/dist/. CLOUDFLARE-NAYANET-HUB/public/
          cat > CLOUDFLARE-NAYANET-HUB/worker.js <<'EOF'
          export default { async fetch(request, env) { const url = new URL(request.url); if (url.pathname === '/' || url.pathname === '/index.html' || url.pathname.startsWith('/intelligence/')) return env.ASSETS.fetch(new Request(new URL('/index.html', request.url), request)); return env.ASSETS.fetch(request); } };
          EOF
          cat > CLOUDFLARE-NAYANET-HUB/wrangler.jsonc <<'EOF'
          {"name":"aged-art-7c12","main":"worker.js","compatibility_date":"2026-09-08","account_id":"262c881746ea6e9978ca18b3eb831907","assets":{"directory":"./public","binding":"ASSETS"}}
          EOF
      - name: Deploy exact artifact to canonical Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 262c881746ea6e9978ca18b3eb831907
          workingDirectory: CLOUDFLARE-NAYANET-HUB
          command: deploy --config wrangler.jsonc
      - name: Independently verify root and Smart Link runtime parity
        shell: bash
        run: |
          set -euo pipefail
          R='https://aged-art-7c12.nayanet.workers.dev'; S='https://aged-art-7c12.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds'
          curl -fsSL --retry 10 --retry-delay 3 "$R/?release=$GITHUB_SHA" -o /tmp/root
          curl -fsSL --retry 10 --retry-delay 3 "$S?release=$GITHUB_SHA" -o /tmp/smart
          cmp -s /tmp/root /tmp/smart || { echo 'RUNTIME_ROUTE_PARITY=FAIL'; exit 1; }
          for x in 'Intelligent Hub' 'Good morning' 'MORE INTELLIGENCE. LESS WASTE.' 'Ask Naya or search your intelligence' 'PERSONAL' 'COLLECTIVE' 'ACTIVITY' 'ONE CANONICAL INTELLIGENCE OBJECT' 'intelligenceObject'; do grep -Fqi "$x" /tmp/root || { echo "RUNTIME_MISSING=$x"; exit 1; }; done
          echo 'PUBLIC_RUNTIME=PASS'; echo 'RUNTIME_ROUTE_PARITY=PASS'; echo 'ACTUAL_RUNTIME=https://aged-art-7c12.nayanet.workers.dev/'; echo 'SMART_LINK=https://aged-art-7c12.nayanet.workers.dev/intelligence/nayanet-intelligent-feeds'; echo "SOURCE_COMMIT=$GITHUB_SHA"
