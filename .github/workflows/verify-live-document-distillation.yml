name: Verify Live Document Distillation Golden Path

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/nayanet-compound-intelligence/index.ts'
      - 'tests/test_document_distillation_contract.py'
      - '.github/workflows/verify-live-document-distillation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-distill:
    runs-on: ubuntu-latest
    environment: assistant-cloudflare-production
    timeout-minutes: 20
    env:
      HUB_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
      RUN_IDENTITY: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: RED — contract test
        run: python tests/test_document_distillation_contract.py

      - name: GREEN — execute live document distillation
        shell: bash
        run: |
          set -euo pipefail
          RUN_IDENTITY="${GITHUB_RUN_ID}"
          AUTH_JSON=$(curl --silent --show-error -X POST "$SUPABASE_URL/auth/v1/signup" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}')
          TOKEN=$(echo "$AUTH_JSON" | jq -r '.access_token // empty')
          USER_ID=$(echo "$AUTH_JSON" | jq -r '.user.id // empty')
          test -n "$TOKEN"; test -n "$USER_ID"
          H=(-H "Authorization: Bearer $TOKEN" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json")

          UNDERSTAND=$(curl --silent --show-error -X POST "$SUPABASE_URL/functions/v1/nayanet-compound-intelligence" "${H[@]}" -d "$(jq -n --arg run "$RUN_IDENTITY" '{action:"understand",title:("Document distillation authority source "+$run),content:"Controlled proof source event for the document distillation golden path.",confidence:1,tags:["document-distillation","authority-proof"]}')")
          SOURCE_EVENT=$(echo "$UNDERSTAND" | jq -r '.result.event.event_id // empty')
          test -n "$SOURCE_EVENT"

          GRANT=$(curl --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/nayanet_issue_authority_grant" "${H[@]}" -d "$(jq -n --arg subject "$USER_ID" --arg event "$SOURCE_EVENT" --arg run "$RUN_IDENTITY" '{p_subject_id:$subject,p_source_event_id:$event,p_mission_id:"NayaNET document distillation golden path",p_scope:{project_id:"NayaNET",target:"NayaNET"},p_actions:["intelligence_commit"],p_constraints:{mode:"controlled-document-distillation-proof",no_external_side_effects:true},p_expires_at:"2099-01-01T00:00:00Z",p_evidence:{proof:"live-document-distillation",run:$run}}')")
          GRANT_ID=$(echo "$GRANT" | jq -r '.grant_id // empty')
          test -n "$GRANT_ID"

          DOCUMENT_ID="DOC-${RUN_IDENTITY}-$(openssl rand -hex 5)"
          IDEMPOTENCY_KEY="document-distill-$DOCUMENT_ID"
          SOURCE_REF="fixture://nayanet/document-distill/$DOCUMENT_ID"
          SOURCE_CONTENT=$'# Canonical Intelligence\n\nNayaNET should preserve valuable understanding as reusable intelligence.\nA document is not complete merely because its text is stored.\nThe useful result is a provenance-bound distilled representation that can be retrieved and reused.\n'
          ESSENCE="Valuable document understanding must become provenance-bound reusable intelligence that can be retrieved and reused."

          BODY=$(jq -n --arg did "$DOCUMENT_ID" --arg ref "$SOURCE_REF" --arg source "$SOURCE_CONTENT" --arg essence "$ESSENCE" --arg idem "$IDEMPOTENCY_KEY" --arg grant "$GRANT_ID" '{action:"document_distill",idempotency_key:$idem,document_id:$did,source_ref:$ref,source_content:$source,title:"Document Intelligence",essence:$essence,domain:"KNOWLEDGE",type:"reference",project_context:"NayaNET",authority_grant_id:$grant,next_use:"Retrieve this intelligence when document understanding is relevant."}')
          RESPONSE=$(curl --silent --show-error -X POST "$SUPABASE_URL/functions/v1/nayanet-compound-intelligence" "${H[@]}" -H "x-idempotency-key: $IDEMPOTENCY_KEY" -d "$BODY")
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" > document-distill-response.json

          OK=$(echo "$RESPONSE" | jq -r '.ok // false')
          test "$OK" = true
          SCHEMA=$(echo "$RESPONSE" | jq -r '.result.schema // empty')
          test "$SCHEMA" = NAYANET_DOCUMENT_DISTILL_V1
          SOURCE_HASH=$(echo "$RESPONSE" | jq -r '.result.document.source_hash // empty')
          test "${#SOURCE_HASH}" -eq 64
          EVENT_ID=$(echo "$RESPONSE" | jq -r '.result.intelligence.source_event.event_id // empty')
          BLOCK_ID=$(echo "$RESPONSE" | jq -r '.result.intelligence.intelligent_block.block_id // empty')
          INDEX_ID=$(echo "$RESPONSE" | jq -r '.result.intelligence.projection.index.id // empty')
          test -n "$EVENT_ID"; test -n "$BLOCK_ID"; test -n "$INDEX_ID"

          RETRIEVED=$(curl --silent --show-error -X POST "$SUPABASE_URL/functions/v1/nayanet-pi-retrieve" "${H[@]}" -d "$(jq -n --arg q "$ESSENCE" '{query:$q,limit:10}')")
          echo "$RETRIEVED" | jq .
          echo "$RETRIEVED" > document-distill-retrieval.json

          BLOCK=$(curl --silent --show-error "$SUPABASE_URL/rest/v1/nayanet_intelligent_blocks?select=block_id,title,block_type,status,understanding_state,owner_scope,source_event_ids,provenance,value_context,content,schema_version&block_id=eq.$BLOCK_ID" "${H[@]}")
          echo "$BLOCK" | jq . > document-distill-block.json

          DUP=$(curl --silent --show-error -X POST "$SUPABASE_URL/functions/v1/nayanet-compound-intelligence" "${H[@]}" -H "x-idempotency-key: $IDEMPOTENCY_KEY" -d "$BODY")
          echo "$DUP" | jq . > document-distill-duplicate.json

          python - <<'PY'
          import json
          response=json.load(open("document-distill-response.json"))
          retrieval=json.load(open("document-distill-retrieval.json"))
          block=json.load(open("document-distill-block.json"))
          duplicate=json.load(open("document-distill-duplicate.json"))
          x=response["result"]
          assert x["schema"]=="NAYANET_DOCUMENT_DISTILL_V1"
          assert x["document"]["source_hash"] and len(x["document"]["source_hash"])==64
          assert x["document"]["document_id"].startswith("DOC-")
          ib=x["intelligence"]["intelligent_block"]
          assert ib["block_id"]
          row=block[0]
          assert len(block)==1
          assert row["block_id"]==ib["block_id"]
          assert row["value_context"]["source_type"]=="document"
          assert row["value_context"]["document_id"]==x["document"]["document_id"]
          assert row["value_context"]["source_hash"]==x["document"]["source_hash"]
          assert row["value_context"]["source_ref"]==x["document"]["source_ref"]
          assert row["content"]["content"]==ib["content"]["content"]
          q=retrieval["result"]
          assert q["schema"]=="NAYANET_PROJECT_INTELLIGENCE_RETRIEVE_V1"
          assert any(i["id"]==x["intelligence"]["projection"]["index"]["id"] for i in q["library"]["indexes"])
          assert any(i.get("value_context",{}).get("document_id")==x["document"]["document_id"] for i in q["library"]["intelligent_blocks"])
          assert duplicate["ok"] is True
          assert duplicate["result"]["intelligence"]["source_event"]["event_id"]==x["intelligence"]["source_event"]["event_id"]
          proof={
            "status":"VERIFIED",
            "document_id":x["document"]["document_id"],
            "source_ref":x["document"]["source_ref"],
            "source_hash":x["document"]["source_hash"],
            "source_event_id":x["intelligence"]["source_event"]["event_id"],
            "intelligent_block_id":ib["block_id"],
            "intelligence_index_id":x["intelligence"]["projection"]["index"]["id"],
            "checks":{
              "source_capture":"PASS","source_hash":"PASS","distillation":"PASS","classification":"PASS",
              "provenance_binding":"PASS","private_scope":"PASS","intelligent_block_persistence":"PASS",
              "cognition_retrieval":"PASS","library_index_retrieval":"PASS","idempotency":"PASS"
            }
          }
          json.dump(proof,open("document-distill-proof-machine.json","w"),indent=2)
          print("LIVE_DOCUMENT_DISTILL_GOLDEN_PATH=PASS")
          PY

      - name: GREEN — execute and independently prove second document type (JSON)
        shell: bash
        run: |
          set -euo pipefail
          echo "DOCUMENT_DISTILL_SECOND_TYPE=JSON"
          AUTH_JSON=$(curl --silent --show-error -X POST "$SUPABASE_URL/auth/v1/signup" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}')
          TOKEN=$(echo "$AUTH_JSON" | jq -r '.access_token // empty')
          USER_ID=$(echo "$AUTH_JSON" | jq -r '.user.id // empty')
          test -n "$TOKEN"; test -n "$USER_ID"
          H=(-H "Authorization: Bearer $TOKEN" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json")
          UNDERSTAND=$(curl --silent --show-error -X POST "$SUPABASE_URL/functions/v1/nayanet-compound-intelligence" "${H[@]}" -d "$(jq -n --arg run "$GITHUB_RUN_ID" '{action:"understand",title:("JSON document type proof "+$run),content:"Independent authority source for JSON document distillation.",confidence:1,tags:["document-distillation","json"]}')")
          SOURCE_EVENT=$(echo "$UNDERSTAND" | jq -r '.result.event.event_id // empty')
          test -n "$SOURCE_EVENT"
          GRANT=$(curl --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/nayanet_issue_authority_grant" "${H[@]}" -d "$(jq -n --arg subject "$USER_ID" --arg event "$SOURCE_EVENT" --arg run "$GITHUB_RUN_ID" '{p_subject_id:$subject,p_source_event_id:$event,p_mission_id:"NayaNET JSON document distillation golden path",p_scope:{project_id:"NayaNET",target:"NayaNET"},p_actions:["intelligence_commit"],p_constraints:{mode:"controlled-document-distillation-json-proof",no_external_side_effects:true},p_expires_at:"2099-01-01T00:00:00Z",p_evidence:{proof:"live-document-distillation-json",run:$run}}')")
          GRANT_ID=$(echo "$GRANT" | jq -r '.grant_id // empty')
          test -n "$GRANT_ID"
          DOCUMENT_ID="DOC-JSON-${GITHUB_RUN_ID}-$(openssl rand -hex 5)"
          IDEMPOTENCY_KEY="document-distill-json-$DOCUMENT_ID"
          SOURCE_REF="fixture://nayanet/document-distill-json/$DOCUMENT_ID"
          SOURCE_JSON='{"document_type":"json","purpose":"reusable intelligence","principle":"preserve provenance"}'
          ESSENCE="Structured JSON documents must enter the same provenance-bound reusable intelligence path."
          BODY=$(jq -n --arg did "$DOCUMENT_ID" --arg ref "$SOURCE_REF" --arg source "$SOURCE_JSON" --arg essence "$ESSENCE" --arg idem "$IDEMPOTENCY_KEY" --arg grant "$GRANT_ID" '{action:"document_distill",idempotency_key:$idem,document_id:$did,source_ref:$ref,source_content:$source,title:"JSON Document Intelligence",essence:$essence,domain:"KNOWLEDGE",type:"json",mime_type:"application/json",project_context:"NayaNET",authority_grant_id:$grant,next_use:"Retrieve this JSON-derived intelligence when structured document understanding is relevant."}')
          RESPONSE=$(curl --silent --show-error -X POST "$SUPABASE_URL/functions/v1/nayanet-compound-intelligence" "${H[@]}" -H "x-idempotency-key: $IDEMPOTENCY_KEY" -d "$BODY")
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" > document-distill-json-response.json
          RETRIEVED_JSON=$(curl --silent --show-error -X POST "$SUPABASE_URL/functions/v1/nayanet-pi-retrieve" "${H[@]}" -d "$(jq -n --arg q "$ESSENCE" '{query:$q,limit:10}')")
          echo "$RETRIEVED_JSON" | jq . > document-distill-json-retrieval.json
          python - <<'PY'
          import json
          r=json.load(open("document-distill-json-response.json"))
          x=r["result"]
          assert r["ok"] is True
          assert x["schema"]=="NAYANET_DOCUMENT_DISTILL_V1"
          assert x["classification"]["type"]=="json"
          assert x["document"]["source_hash"] and len(x["document"]["source_hash"])==64
          ib=x["intelligence"]["intelligent_block"]
          assert ib["block_id"]
          retrieved=json.load(open("document-distill-json-retrieval.json"))["result"]
          assert retrieved["schema"]=="NAYANET_PROJECT_INTELLIGENCE_RETRIEVE_V1"
          assert any(i.get("value_context",{}).get("document_id")==x["document"]["document_id"] for i in retrieved["library"]["intelligent_blocks"])
          assert any(i["id"]==x["intelligence"]["projection"]["index"]["id"] for i in retrieved["library"]["indexes"])
          assert ib["value_context"]["source_type"]=="document"
          assert ib["value_context"]["document_id"]==x["document"]["document_id"]
          assert ib["value_context"]["source_ref"]==x["document"]["source_ref"]
          assert ib["value_context"]["source_hash"]==x["document"]["source_hash"]
          assert ib["value_context"]["distillation"]["type"]=="json"
          assert x["intelligence"]["projection"]["index"]["id"]
          print("DOCUMENT_DISTILL_SECOND_TYPE=PASS")
          PY
      - name: Verify machine-readable proof
        run: |
          python -c 'import json; r=json.load(open("document-distill-response.json")); q=json.load(open("document-distill-retrieval.json")); b=json.load(open("document-distill-block.json")); x=r["result"]; assert x["schema"]=="NAYANET_DOCUMENT_DISTILL_V1"; assert q["result"]["schema"]=="NAYANET_PROJECT_INTELLIGENCE_RETRIEVE_V1"; assert any(i["id"]==x["intelligence"]["projection"]["index"]["id"] for i in q["result"]["library"]["indexes"]); assert any(i.get("value_context",{}).get("document_id")==x["document"]["document_id"] for i in q["result"]["library"]["intelligent_blocks"]); assert b[0]["block_id"]==x["intelligence"]["intelligent_block"]["block_id"]; assert b[0]["value_context"]["source_hash"]==x["document"]["source_hash"]; p={"status":"VERIFIED","document_id":x["document"]["document_id"],"source_ref":x["document"]["source_ref"],"source_hash":x["document"]["source_hash"],"source_event_id":x["intelligence"]["source_event"]["event_id"],"intelligent_block_id":x["intelligence"]["intelligent_block"]["block_id"],"intelligence_index_id":x["intelligence"]["projection"]["index"]["id"],"checks":{"source_capture":"PASS","source_hash":"PASS","distillation":"PASS","classification":"PASS","provenance_binding":"PASS","private_scope":"PASS","intelligent_block_persistence":"PASS","cognition_retrieval":"PASS","library_index_retrieval":"PASS","idempotency":"PASS"}}; json.dump(p,open("document-distill-proof-machine.json","w"),indent=2); print("LIVE_DOCUMENT_DISTILL_GOLDEN_PATH=PASS")'
