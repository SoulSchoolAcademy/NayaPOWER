name: NAYA — Superbrain Readiness Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Control-plane validation
        run: python .naya/control-plane/validate_control_plane.py
      - name: Golden Journey evidence
        run: |
          python scripts/verify-smart-note-transaction.py
          python scripts/verify-golden-journey.py
      - name: Privacy and concurrency evidence
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_personal_feed_privacy_boundary.py
          python -m pytest -q tests/test_smart_note_transaction_concurrency.py
          python -m pytest -q tests/test_smart_note_transaction_rollback.py
      - name: Temporal and supersession evidence
        run: python scripts/verify-temporal-conflict.py
      - name: Build exact-HEAD automated evidence bundle
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/naya-readiness-evidence.json" <<EOF
          {
            "observed_head": "\${GITHUB_SHA}",
            "claims": {
              "golden_journey": {"status":"VERIFIED","claim_type":"WHOLE_JOURNEY","observed_head":"\${GITHUB_SHA}","evidence":["verify-smart-note-transaction.py=PASS","verify-golden-journey.py=PASS"]},
              "learning_adaptation": {"status":"VERIFIED","claim_type":"WHOLE_JOURNEY","observed_head":"\${GITHUB_SHA}","evidence":["golden journey learning=PASS","golden journey behavior adaptation=PASS"]},
              "privacy_access": {"status":"VERIFIED","claim_type":"AUTOMATED","observed_head":"\${GITHUB_SHA}","evidence":["private-by-default rejection=PASS","personal-feed permission boundary=PASS"]},
              "concurrency_idempotency": {"status":"VERIFIED","claim_type":"AUTOMATED","observed_head":"\${GITHUB_SHA}","evidence":["cross-process transaction lock=PASS","Smart Note replay/idempotency=PASS"]},
              "temporal_conflict": {"status":"VERIFIED","claim_type":"AUTOMATED","observed_head":"\${GITHUB_SHA}","evidence":["supersession ranking=PASS","exact historical retrieval=PASS"]}
            }
          }
          EOF
      - name: Readiness gate contract
        run: python .naya/tests/test_naya_superbrain_ready.py
      - name: Build exact-HEAD automated evidence bundle
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/naya-readiness-evidence.json" <<EOF
          {
            "observed_head": "${GITHUB_SHA}",
            "claims": {
              "golden_journey": {"status":"VERIFIED","claim_type":"WHOLE_JOURNEY","observed_head":"${GITHUB_SHA}","evidence":["verify-smart-note-transaction.py=PASS","verify-golden-journey.py=PASS"]},
              "learning_adaptation": {"status":"VERIFIED","claim_type":"WHOLE_JOURNEY","observed_head":"${GITHUB_SHA}","evidence":["golden journey learning=PASS","golden journey behavior adaptation=PASS"]},
              "privacy_access": {"status":"VERIFIED","claim_type":"AUTOMATED","observed_head":"${GITHUB_SHA}","evidence":["private-by-default rejection=PASS","personal-feed permission boundary=PASS"]},
              "concurrency_idempotency": {"status":"VERIFIED","claim_type":"AUTOMATED","observed_head":"${GITHUB_SHA}","evidence":["cross-process transaction lock=PASS","Smart Note replay/idempotency=PASS"]},
              "temporal_conflict": {"status":"VERIFIED","claim_type":"AUTOMATED","observed_head":"${GITHUB_SHA}","evidence":["supersession ranking=PASS","exact historical retrieval=PASS"]}
            }
          }
          EOF
      - name: Enforce NAYA_SUPERBRAIN_READY
        env:
          NAYA_READINESS_EVIDENCE_FILE: ${{ runner.temp }}/naya-readiness-evidence.json
        run: python .naya/control-plane/naya_superbrain_ready.py
