name: Retired NayaNET E03 Foundation Deployment

# Retired: E03 is not an independent deployment authority.
# Consequential Vercel publication is governed by the canonical human-authorized release boundary.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy E03 deployment retired
        run: |
          echo 'LEGACY_NAYANET_E03_DEPLOYMENT=RETIRED'
          echo 'CANONICAL_DEPLOYMENT=.github/workflows/authorized-vercel-release.yml'
          echo 'RULE=NO_AUTOMATIC_OR_PARALLEL_VERCEL_DEPLOYMENT_AUTHORITY'
