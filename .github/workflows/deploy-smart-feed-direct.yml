name: 509 — Direct Smart Feed Deployment
on:
  push:
    branches: [main]
    paths:
      - 'snapshots/NayaNET-509-AAA-CURRENT.html'
      - 'SMART FEED CONTENT'
      - 'NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js'
      - 'NAYANET/509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js'
      - 'NAYANET/509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js'
      - 'NAYANET/509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V3.js'
      - 'NAYANET/509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js'
      - 'NAYANET/509-AAA-SMART-BOARD-V6-CANONICAL-CONTENT-RUNTIME.js'
      - 'NAYANET/509-AAA-SMART-BOARD-V10-FINAL-GEOMETRY.js'
      - 'NAYANET/509-AAA-SMART-BOARD-V20-CANONICAL-LAYER-RECONCILER.js'
      - '.github/workflows/deploy-smart-feed-direct.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      WORKER_NAME: sparkling-shape-7ae5
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6
      - name: Governance authorization
        run: |
          set -euo pipefail
          python3 .naya/control-plane/workflow_gate.py --actor SoulSchoolAcademy --purpose "deploy the canonical 509 NayaNET Intelligent Hub public runtime" --permission deploy_public_runtime --request deploy_nayanet_hub_canonical --mission "make NayaPOWER operationally capable of safely governing Intelligent Hub production deployment" --uncertainty 3 --consequence 8 --irreversibility 8 --scope "public-runtime:sparkling-shape-7ae5:/" --evidence "workflow push at exact source SHA $GITHUB_SHA" --evidence "canonical deployment workflow path is the authorized 509 runtime lane" > /tmp/auth.json
          test "$(python3 -c 'import json;print(json.load(open("/tmp/auth.json"))["status"])')" = AUTHORIZED
      - name: Build release
        run: |
          set -euo pipefail
          rm -rf release; mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          cp 'SMART FEED CONTENT' release/public/NAYANET/SMART-FEED-CONTENT.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('release/public/index.html'); h=p.read_text()
          h=re.sub(r'<script[^>]+509-AAA-SMART-NOTE-CANONICAL-RENDERER\\.js[^>]*></script>','',h)
          h=re.sub(r'<script[^>]+509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR\\.js[^>]*></script>','',h)
          shim='<script>window.$=window.$||((s,r=document)=>r.querySelector(s));window.$$=window.$$||((s,r=document)=>[...r.querySelectorAll(s)]);window.NAYA509_GLOBAL_DOM_SHIM=true;</script>'
          js=[]
          for f in ['NAYANET/509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V3.js','NAYANET/509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js','NAYANET/509-AAA-SMART-BOARD-V6-CANONICAL-CONTENT-RUNTIME.js','NAYANET/509-AAA-SMART-BOARD-V10-FINAL-GEOMETRY.js','NAYANET/509-AAA-SMART-BOARD-V20-CANONICAL-LAYER-RECONCILER.js']:
            js.append('<script>'+Path(f).read_text().replace('</script>','<\\/script>')+'</script>')
          scripts='<script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260914"></script><script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js?v=20260915"></script><script src="/NAYANET/509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js?v=20260915"></script>'+''.join(js)
          h=re.sub(r'(<body[^>]*>)',r'\1'+shim,h,count=1); h=h.replace('</body>',scripts+'</body>',1); p.write_text(h)
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname==='/NAYANET/SMART-FEED-CONTENT.txt'){const a=await env.ASSETS.fetch(new Request(new URL('/NAYANET/SMART-FEED-CONTENT.txt',request.url),request));if(a.ok)return new Response(a.body,{headers:{'Content-Type':'text/plain; charset=utf-8','Cache-Control':'no-store'}})}const r=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$GITHUB_SHA"}}
          EOF
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Static runtime proof
        run: |
          set -euo pipefail
          sleep 8
          curl -fsSL "$RUNTIME/?verify=$GITHUB_SHA" -o /tmp/live.html
          curl -fsSL "$RUNTIME/NAYANET/SMART-FEED-CONTENT.txt?v=$GITHUB_SHA" -o /tmp/live-content.txt
          python3 - <<'PY'
          from pathlib import Path
          h=Path('/tmp/live.html').read_text(errors='replace'); c=Path('/tmp/live-content.txt').read_text(errors='replace')
          titles=['What Is Naya Power?','What Is Naya?','What Are Smart Notes?','Your Intelligence Today','Intelligence Reports','What Is the Intelligent Library?','Smart Lists','Smart Spaces','Smart Mail']
          assert not [x for x in titles if x not in c and x not in h]
          assert len(c)>50000
          print('STATIC_PUBLIC_RUNTIME=PASS content_bytes='+str(len(c)))
          PY
      - name: Browser runtime acceptance — exact Smart Board contract
        run: |
          set -euo pipefail
          mkdir -p /tmp/naya-browser; cd /tmp/naya-browser
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          const outerTitles=['What Is Naya Power?','What Is Naya?','What Are Smart Notes?','Your Intelligence Today','Intelligence Reports','What Is the Intelligent Library?','Smart Lists','Smart Spaces','Smart Mail'];
          const keys=['human','child','grandma','naya','machine','learning','meaning','apply','benefit'];
          const colors=['#ff3bbf','#9d75ff','#6675ff','#c97a4a','#35d39a','#b8ee57','#f1d75a','#e8c766','#e9edf5'];
          const labels=['HUMAN NOTE','CHILD NOTE','GRANDMA NOTE','NAYA NOTE','MACHINE NOTE','ADAPTIVE LEARNING','WHAT IT MEANS','HOW TO USE / HOW TO APPLY',"WHAT'S IN IT FOR YOU"];
          const sizes=[['desktop',1440,1400],['tablet',900,1200],['mobile',390,1100]];
          const browser=await chromium.launch();
          for(const [name,w,h] of sizes){
            const p=await browser.newPage({viewport:{width:w,height:h}}); const errs=[]; p.on('pageerror',e=>errs.push(e.message));
            await p.goto(process.env.RUNTIME+`/?contract=${name}_${Date.now()}`,{waitUntil:'domcontentloaded'}); await p.waitForTimeout(30000);
            const r=await p.evaluate(()=>{const t=e=>(e?.textContent||'').replace(/\\s+/g,' ').trim();return {boards:[...document.querySelectorAll('.block[data-real-smart-note]')].map(b=>{const br=b.getBoundingClientRect();return {title:t(b.querySelector('h3')),br:{x:Math.round(br.x),w:Math.round(br.width)},nuts:b.querySelectorAll('.nutshell').length,layers:[...b.querySelectorAll('.layer')].filter(x=>getComputedStyle(x).display!=='none').map(x=>({k:x.dataset.semanticLayer,c:x.dataset.layerColor,l:t(x.querySelector('.layerHead b')),icon:!!x.querySelector('.layerIcon svg')})),actions:[...b.querySelectorAll('.naya-feature-actions .action')].map(x=>x.dataset.c4Kind)}})}}); console.log(name+':'+JSON.stringify(r));
            if(errs.length)throw Error(name+':PAGEERROR:'+errs.join('|')); if(r.boards.length!==9)throw Error(name+':OUTER_BOARD_COUNT');
            if(JSON.stringify(r.boards.map(x=>x.title))!==JSON.stringify(outerTitles))throw Error(name+':OUTER_TITLES');
            if(r.boards.some(x=>x.nuts!==1))throw Error(name+':NUTSHELL_COUNT');
            if(r.boards.some(x=>JSON.stringify(x.layers.map(y=>y.k))!==JSON.stringify(keys)))throw Error(name+':SEMANTIC_ORDER');
            if(r.boards.some(x=>JSON.stringify(x.layers.map(y=>y.c))!==JSON.stringify(colors)))throw Error(name+':SEMANTIC_COLORS');
            if(r.boards.some(x=>JSON.stringify(x.layers.map(y=>y.l))!==JSON.stringify(labels)))throw Error(name+':SEMANTIC_LABELS');
            if(r.boards.some(x=>x.layers.some(y=>!y.icon)))throw Error(name+':ICON_MISSING');
            if(r.boards.some(x=>x.actions.join(',')!=='create-space,favorite,save'))throw Error(name+':GLOBAL_ACTIONS');
            const widths=r.boards.map(x=>x.br.w),xs=r.boards.map(x=>x.br.x); if(new Set(widths).size!==1||new Set(xs).size!==1)throw Error(name+':BOARD_CONGRUENCE');
            if(r.boards.some((x,i)=>i&&x.br.y<=r.boards[i-1].br.y))throw Error(name+':VERTICAL_STACK');
            const text=await p.locator('body').innerText(); for(const bad of ['01','02','03','04','05','06','07','08','09','10','SOURCE-SEPARATED','SOURCE / SEPARATED','PROVIDENCE','TRUTH','PROTECTION','UNDERSTAND','ACT','VERIFY','LEARN','WHAT','WHY','SO WHAT'])if(new RegExp('(^|\\s)'+bad.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'($|\\s)','i').test(text))throw Error(name+':BAD_TEXT:'+bad);
            if(text.includes('NINE NOTE')||text.includes('HOW TO APPLY IT'))throw Error(name+':OLD_LABEL');
            await p.reload({waitUntil:'domcontentloaded'}); await p.waitForTimeout(30000); const rr=await p.evaluate(()=>[...document.querySelectorAll('.block[data-real-smart-note]')].map(b=>[...b.querySelectorAll('.layer')].map(x=>x.dataset.semanticLayer)); if(rr.some(x=>JSON.stringify(x)!==JSON.stringify(keys)))throw Error(name+':REFRESH');
            console.log(name+':PASS'); await p.close();
          }
          await browser.close(); console.log('BROWSER_RUNTIME_VERIFICATION=PASS');
          EOF
          RUNTIME="$RUNTIME" node verify.mjs
