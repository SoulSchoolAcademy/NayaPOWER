name: 509 — Direct Smart Feed Deployment

on:
  push:
    branches: [main]
    paths:
      - 'snapshots/NayaNET-509-AAA-CURRENT.html'
      - 'SMART FEED CONTENT'
      - 'NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js'
      - 'NAYANET/509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js'
      - '.github/workflows/deploy-smart-feed-direct.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_NAME: sparkling-shape-7ae5
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6
      - name: Build canonical release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('release/public/index.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'<script[^>]+509-AAA-SMART-NOTE-CANONICAL-RENDERER\.js[^>]*></script>','',h)
          h=re.sub(r'<script[^>]+509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR\.js[^>]*></script>','',h)
          h=h.replace('</body>','<script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260914-semantic-v3"></script><script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js?v=20260915-title-lock-v4"></script></body>',1)
          p.write_text(h,encoding='utf-8')
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const r=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$GITHUB_SHA"}}
          EOF
          python3 -m json.tool release/wrangler.jsonc >/dev/null
          echo CANONICAL_RELEASE_BUILD=PASS
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Static runtime proof
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsSL -D /tmp/live-headers.txt "$RUNTIME/?verify=$GITHUB_SHA" -o /tmp/live.html
          curl -fsSL "$RUNTIME/NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260914-semantic-v3" -o /tmp/live-renderer.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('/tmp/live.html').read_text(errors='replace')
          js=Path('/tmp/live-renderer.js').read_text(errors='replace')
          required=['What Is Naya Power?','What Is Naya?','What Are Smart Notes?','Your Intelligence Today','Intelligence Reports','What Is the Intelligent Library?','Smart Lists','Smart Spaces','Smart Mail','IN A NUTSHELL','HOW TO APPLY IT',"WHAT'S IN IT FOR YOU?",'const NOTE_COLORS','layerIcon','noteIdentityColor']
          missing=[x for x in required if x not in js and x not in html]
          assert '509-AAA-SMART-NOTE-CANONICAL-RENDERER.js' in html
          assert '509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js' in html
          assert '509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js' not in html
          assert not missing, missing
          assert '2026-09-14-vertical-11-layer-semantic-v2' in js
          print('STATIC_PUBLIC_RUNTIME=PASS')
          PY
      - name: Browser runtime verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/naya-browser && cd /tmp/naya-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1400}});
          await page.goto(process.env.RUNTIME+'/?browser_verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(5000);
          const read=()=>page.evaluate(()=>{const t=e=>(e?.innerText||e?.textContent||'').replace(/\s+/g,' ').trim();return {buttons:[...document.querySelectorAll('.rail .nav button,.rail .nav a')].map(e=>e.getAttribute('aria-label')||t(e)),notes:[...document.querySelectorAll('.block[data-real-smart-note]')].map(b=>({title:t(b.querySelector('h3')),identity:b.dataset.noteIdentityColor,layers:[...b.querySelectorAll('.layer')].map(x=>({n:x.dataset.intelligenceLayer,key:x.dataset.semanticLayer,color:x.dataset.layerColor,icon:x.querySelector('.layerIcon')?.innerHTML||'',prominence:x.dataset.prominence,head:t(x.querySelector('.layerHead'))}))})),marker:window.NAYA509_CANONICAL_NOTES,interface:window.NAYA509_INTERFACE_STANDARD,lock:window.NAYA509_TITLE_LOCK,how:document.querySelectorAll('.layer[data-semantic-layer="apply"]').length}});
          const r=await read();
          console.log('RUNTIME_NOTES='+JSON.stringify(r.notes.map(n=>({title:n.title,identity:n.identity,layers:n.layers.length,keys:n.layers.map(x=>x.key)}))));
          const nav=['Your Intelligence','Your Reports','Intelligent Library','Smart Share','Smart Ledger','Your Connections','Smart Lists','Smart Spaces','Smart Mail','Settings'];
          const noteTitles=['What Is Naya Power?','What Is Naya?','What Are Smart Notes?','Your Intelligence Today','Intelligence Reports','What Is the Intelligent Library?','Smart Lists','Smart Spaces','Smart Mail'];
          const keys=['nutshell','human','child','grandma','naya','machine','learning','meaning','connect','apply','benefit'];
          const colors=['#ffffff','#9d75ff','#6675ff','#55b9ee','#55e39a','#b8ee57','#f1d75a','#e8c766','#e8c766','#f09a4a','#ff5e6c'];
          const outer=['#9d75ff','#6675ff','#55b9ee','#55e39a','#b8ee57','#f1d75a','#e8c766','#f09a4a','#ff5e6c'];
          if(JSON.stringify(r.buttons)!==JSON.stringify(nav)) throw Error('SIDEBAR_MISMATCH');
          if(r.notes.length!==9) throw Error('NOTE_COUNT');
          if(JSON.stringify(r.notes.map(n=>n.title))!==JSON.stringify(noteTitles)) throw Error('NOTE_TITLES');
          if(r.notes.some((n,i)=>n.identity!==outer[i])) throw Error('OUTER_IDENTITY');
          if(r.notes.some(n=>n.layers.length!==11)) throw Error('LAYER_COUNT');
          if(r.notes.some(n=>JSON.stringify(n.layers.map(x=>x.key))!==JSON.stringify(keys))) throw Error('LAYER_KEYS');
          if(r.notes.some(n=>JSON.stringify(n.layers.map(x=>x.color))!==JSON.stringify(colors))) throw Error('LAYER_COLORS');
          if(r.notes.some(n=>new Set(n.layers.map(x=>x.icon)).size!==11)) throw Error('ICONS');
          if(r.notes.some(n=>n.layers[0].prominence!=='top'||n.layers[10].prominence!=='bottom')) throw Error('PROMINENCE');
          if(r.how!==9) throw Error('HOW_TO_APPLY');
          if(r.marker!=='2026-09-14-vertical-11-layer-semantic-v2') throw Error('MARKER');
          if(r.lock!=='canonical-9-note-title-order-v4+layer-canonicalization') throw Error('TITLE_LOCK');
          await page.reload({waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(5000); const a=await read();
          if(a.notes.length!==9||a.notes.some(n=>n.layers.length!==11)||JSON.stringify(a.notes.map(n=>n.title))!==JSON.stringify(noteTitles)) throw Error('REFRESH_REGRESSION');
          await browser.close(); console.log('BROWSER_RUNTIME_VERIFICATION=PASS'); console.log('REFRESH_VERIFICATION=PASS');
          EOF
          RUNTIME="$RUNTIME" node verify.mjs
