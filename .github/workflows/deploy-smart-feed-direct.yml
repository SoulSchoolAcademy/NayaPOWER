name: 509 — Direct Smart Feed Deployment

on:
  push:
    branches: [main]
    paths:
      - 'snapshots/NayaNET-509-AAA-CURRENT.html'
      - 'SMART FEED CONTENT'
      - 'NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js'
      - 'NAYANET/509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js'
      - 'NAYANET/509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js'
      - 'NAYANET/509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V3.js'
      - 'NAYANET/509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js'
      - '.github/workflows/deploy-smart-feed-direct.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_NAME: sparkling-shape-7ae5
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6
      - name: Canonical governance authorization gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/naya-governance
          python3 .naya/control-plane/workflow_gate.py --actor SoulSchoolAcademy --purpose "deploy the canonical 509 NayaNET Intelligent Hub public runtime" --permission deploy_public_runtime --request deploy_nayanet_hub_canonical --mission "make NayaPOWER operationally capable of safely governing Intelligent Hub production deployment" --uncertainty 3 --consequence 8 --irreversibility 8 --scope "public-runtime:sparkling-shape-7ae5:/" --evidence "workflow push at exact source SHA $GITHUB_SHA" --evidence "canonical deployment workflow path is the authorized 509 runtime lane" | tee /tmp/naya-governance/authorization.json
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' /tmp/naya-governance/authorization.json)" = "AUTHORIZED"
          echo GOVERNANCE_AUTHORIZATION=PASS
      - name: Build canonical release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('release/public/index.html'); h=p.read_text(encoding='utf-8')
          h=re.sub(r'<script[^>]+509-AAA-SMART-NOTE-CANONICAL-RENDERER\\.js[^>]*></script>','',h)
          h=re.sub(r'<script[^>]+509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR\\.js[^>]*></script>','',h)
          v3=Path('NAYANET/509-AAA-FEATURE-BOARD-RUNTIME-COMPLETION-V3.js').read_text(encoding='utf-8').replace('</script>','<\\/script>')
          v5=Path('NAYANET/509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js').read_text(encoding='utf-8').replace('</script>','<\\/script>')
          scripts='<script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260914-semantic-v3"></script><script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js?v=20260915-title-lock-v5"></script><script src="/NAYANET/509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js?v=20260915-feature-board-v2"></script><script>'+v3+'</script><script>'+v5+'</script>'
          if '</body>' in h: h=h.replace('</body>',scripts+'</body>',1)
          elif '</html>' in h: h=h.replace('</html>',scripts+'</html>',1)
          else: h+=scripts
          p.write_text(h,encoding='utf-8')
          print('CANONICAL_SCRIPT_INJECTED=',all(x in h for x in ['509-AAA-SMART-NOTE-CANONICAL-RENDERER.js','509-AAA-SMART-NOTE-CANONICAL-TITLE-LOCK.js','509-AAA-FEATURE-BOARD-PRESENTATION-UPGRADE-V2.js','509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION']))
          print('LEGACY_VISIBLE_REPAIR_PRESENT=', '509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js' in h)
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const r=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$GITHUB_SHA"}}
          EOF
          python3 -m json.tool release/wrangler.jsonc >/dev/null
          test -s release/public/index.html
          test -s release/public/NAYANET/509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js
          echo CANONICAL_RELEASE_BUILD=PASS
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Static runtime proof
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsSL -D /tmp/live-headers.txt "$RUNTIME/?verify=$GITHUB_SHA" -o /tmp/live.html
          curl -fsSL "$RUNTIME/NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260914-semantic-v3" -o /tmp/live-renderer.js
          curl -fsSL "$RUNTIME/NAYANET/509-AAA-SMART-BOARD-V5-VISUAL-INTERACTION.js?v=20260915-board-v5" -o /tmp/live-board-v5.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('/tmp/live.html').read_text(errors='replace'); js=Path('/tmp/live-renderer.js').read_text(errors='replace'); v5=Path('/tmp/live-board-v5.js').read_text(errors='replace')
          required=['What Is Naya Power?','What Is Naya?','What Are Smart Notes?','Your Intelligence Today','Intelligence Reports','What Is the Intelligent Library?','Smart Lists','Smart Spaces','Smart Mail','IN A NUTSHELL','HOW TO APPLY IT',"WHAT'S IN IT FOR YOU?",'const NOTE_COLORS','layerIcon','noteIdentityColor']
          assert not [x for x in required if x not in js and x not in html]
          assert 'SMART_BOARD_V5' in v5 and '#ff3bbf' in v5 and '#35d39a' in v5 and '#e9edf5' in v5
          print('STATIC_PUBLIC_RUNTIME=PASS')
          PY
      - name: Browser runtime verification — desktop tablet mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/naya-browser && cd /tmp/naya-browser
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          const expectedTitles=['What Is Naya Power?','What Is Naya?','What Are Smart Notes?','Your Intelligence Today','Intelligence Reports','What Is the Intelligent Library?','Smart Lists','Smart Spaces','Smart Mail'];
          const expectedVisible=['nutshell','human','child','grandma','naya','machine','learning','meaning','apply','benefit'];
          const expectedColors=['#ffffff','#ff3bbf','#9d75ff','#6675ff','#c97a4a','#35d39a','#b8ee57','#f1d75a','#e8c766','#e9edf5'];
          const sizes=[['desktop',1440,1400],['tablet',900,1200],['mobile',390,1100]];
          const browser=await chromium.launch({headless:true});
          for(const [name,w,h] of sizes){const page=await browser.newPage({viewport:{width:w,height:h}});page.on('pageerror',e=>console.log(`${name}_PAGEERROR=${e.message}`));await page.goto(process.env.RUNTIME+`/?board_v5=${name}_${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(11000);const r=await page.evaluate(()=>{const raw=e=>(e?.textContent||'').replace(/\\s+/g,' ').trim();return {notes:[...document.querySelectorAll('.block[data-real-smart-note]')].map(b=>({title:raw(b.querySelector('h3')),board:b.classList.contains('naya-feature-board-v2'),nutshell:!!b.querySelector('.nutshell'),actions:[...b.querySelectorAll('.naya-feature-actions [data-c4-kind]')].map(x=>x.dataset.c4Kind),layers:[...b.querySelectorAll('.layer')].map(x=>({key:x.dataset.semanticLayer,color:x.dataset.layerColor,display:getComputedStyle(x).display,icon:!!x.querySelector('.layerIcon svg')}))})),v5:window.NAYA509_SMART_BOARD_V5}});console.log(`${name.toUpperCase()}_FEATURE_RUNTIME=`+JSON.stringify(r));if(r.notes.length!==9)throw Error(name+':NOTE_COUNT');if(JSON.stringify(r.notes.map(n=>n.title))!==JSON.stringify(expectedTitles))throw Error(name+':NOTE_TITLES');if(r.notes.some(n=>!n.board||!n.nutshell))throw Error(name+':BOARD_OR_NUTSHELL');if(r.notes.some(n=>JSON.stringify(n.layers.filter(x=>x.display!=='none').map(x=>x.key))!==JSON.stringify(expectedVisible)))throw Error(name+':VISIBLE_LAYER_SEQUENCE');if(r.notes.some(n=>JSON.stringify(n.layers.filter(x=>x.display!=='none').map(x=>x.color))!==JSON.stringify(expectedColors)))throw Error(name+':SEMANTIC_COLORS');if(r.notes.some(n=>n.layers.filter(x=>x.display!=='none').some(x=>!x.icon)))throw Error(name+':ICON');if(r.notes.some(n=>JSON.stringify(n.actions)!==JSON.stringify(['create-space','favorite','save'])))throw Error(name+':TOP_ACTIONS');if(r.v5!=='living-intelligence-object+semantic-lighting+sculptural-icons+existing-nutshell+gold-application+silver-benefit')throw Error(name+':V5_MARKER');await page.reload({waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(11000);const rr=await page.evaluate(()=>({count:document.querySelectorAll('.block[data-real-smart-note]').length,layers:[...document.querySelectorAll('.block[data-real-smart-note]')].map(b=>[...b.querySelectorAll('.layer')].filter(x=>getComputedStyle(x).display!=='none').length)}));if(rr.count!==9||rr.layers.some(x=>x!==10))throw Error(name+':REFRESH_REGRESSION');await page.close()}
          await browser.close();console.log('BROWSER_RUNTIME_VERIFICATION=PASS');console.log('REFRESH_VERIFICATION=PASS');
          EOF
          RUNTIME="$RUNTIME" node verify.mjs
