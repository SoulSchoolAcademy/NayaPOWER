name: 509 — Direct Smart Feed Deployment

# CANONICAL 509 PRODUCTION PATH
# Snapshot + canonical renderer + feed-flow runtime only.
# Legacy self-mutating and competing C4 deployment workflows are disabled.

on:
  push:
    branches: [main]
    paths:
      - 'snapshots/NayaNET-509-AAA-CURRENT.html'
      - 'SMART FEED CONTENT'
      - 'NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js'
      - 'NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js'
      - 'SUPERBRAIN/NAYA-ACTIVITY/DAILY/2026-09-14-HUB-EXECUTION-TORCH-02.md'
      - '.github/workflows/deploy-smart-feed-direct.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_NAME: sparkling-shape-7ae5
      ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
      RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
    steps:
      - uses: actions/checkout@v6
      - name: Build direct Smart Feed release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/public
          cp snapshots/NayaNET-509-AAA-CURRENT.html release/public/index.html
          cp -R NAYANET release/public/NAYANET
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release/public/index.html')
          h=p.read_text(encoding='utf-8')
          scripts=[
            '<script src="/NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260915-canonical-v4"></script>',
            '<script src="/NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js?v=20260915-feed-finish"></script>'
          ]
          for src in scripts:
              if src not in h:
                  h=h.replace('</body>',src+'</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const r=(u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/'))?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$GITHUB_SHA"}}
          EOF
          python3 -m json.tool release/wrangler.jsonc >/dev/null
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Prove public runtime
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -sS -L -D /tmp/live-headers.txt "$RUNTIME/?verify=$GITHUB_SHA" -o /tmp/live.html
          curl -sS -L "$RUNTIME/NAYANET/509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260915-canonical-v4" -o /tmp/live-renderer.js
          curl -sS -L "$RUNTIME/NAYANET/509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js?v=20260915-feed-finish" -o /tmp/live-feed.js
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          h=Path('/tmp/live.html').read_text(errors='replace')
          r=Path('/tmp/live-renderer.js').read_text(errors='replace')
          f=Path('/tmp/live-feed.js').read_text(errors='replace')
          headers=Path('/tmp/live-headers.txt').read_text(errors='replace')
          print('LIVE_HTML_BYTES=',len(h))
          print('LIVE_RENDERER_BYTES=',len(r))
          print('LIVE_FEED_BYTES=',len(f))
          print('LIVE_SOURCE_HEADER=',bool(re.search(r'^x-nayanet-source-commit:',headers,re.I|re.M)))
          checks={
            'html_renderer_v4': '509-AAA-SMART-NOTE-CANONICAL-RENDERER.js?v=20260915-canonical-v4' in h,
            'html_feed_repair': '509-AAA-FEED-FLOW-AND-BOARD-VISIBLE-REPAIR.js?v=20260915-feed-finish' in h,
            'renderer_marker': '2026-09-15-canonical-renderer-v4' in r,
            'how_to_use': '10 · HOW TO USE IT' in r,
            'remove_duplicates': "const REMOVE=['Evidence','Collective','Connections','Smart Mail — New','Smart Notes']" in r,
            'settings_preserved': "'Settings'" in r,
            'naya_power': 'What Is Naya Power?' in r,
            'naya': 'What Is Naya?' in r,
            'smart_notes': 'What Are Smart Notes?' in r,
            'intelligence_today': 'Your Intelligence Today' in r,
            'reports': 'Intelligence Reports' in r,
            'library': 'What Is the Intelligent Library?' in r,
            'lists': 'Smart Lists' in r,
            'spaces': 'Smart Spaces' in r,
            'mail': 'Smart Mail' in r,
          }
          for k,v in checks.items(): print('CHECK_'+k.upper()+'=',v)
          missing=[k for k,v in checks.items() if not v]
          if missing: raise SystemExit('RUNTIME_PROOF_MISSING='+','.join(missing))
          print('LIVE_SMART_FEED_DEPLOYMENT=verified')
          print('LIVE_CANONICAL_RENDERER_V4=verified')
          print('LIVE_RUNTIME_HEADERS=verified')
          PY
