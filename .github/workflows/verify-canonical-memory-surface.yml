name: Verify Canonical Memory Surface

on:
  push:
    branches: [main]
    paths:
      - '.naya/memory/**'
      - '.naya/naya-context-manifest.json'
      - '.github/workflows/verify-canonical-memory-surface.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fresh-start memory boundary
        run: |
          python .naya/memory/verify_memory_surface.py
          python -m pytest .naya/memory/test_verify_memory_surface.py -q
