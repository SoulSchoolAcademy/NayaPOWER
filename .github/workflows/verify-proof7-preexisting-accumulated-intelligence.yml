name: Verify NayaNET Proof 7 Pre-existing Accumulated Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-proof7-preexisting-accumulated-intelligence.mjs'
      - '.github/workflows/verify-proof7-preexisting-accumulated-intelligence.yml'
      - 'NAYA-TEAM/2026/09/18/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof7_preexisting:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Startup-isolation repair probe: no path filter; push trigger is intentionally unconditional.
    env:
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
      PROOF7_OWNER_ACCESS_TOKEN: ${{ secrets.NAYAPOWER_PROOF7_OWNER_ACCESS_TOKEN }}
      PROOF_PATH: ${{ runner.temp }}/nayanet-proof7-preexisting-accumulated-intelligence.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute pre-existing accumulated-intelligence proof
        run: node scripts/verify-proof7-preexisting-accumulated-intelligence.mjs 2>&1 | tee "${RUNNER_TEMP}/proof7-preexisting-runtime.log"
      - name: Validate proof
        run: |
          test -s "${PROOF_PATH}"
          node -e "const r=require(process.argv[1]); if(r.status!=='VERIFIED') throw new Error('bad proof'); if(r.decision.influenced!==true) throw new Error('decision not influenced'); if(r.decision.authority_changed!==false||r.decision.authority_granted!==false) throw new Error('authority changed'); if(r.action.receiver_verified!==true) throw new Error('receiver not verified'); if(r.outcome_learning.fresh_retrieval_influenced!==true) throw new Error('fresh learning retrieval failed'); if(r.policy.improvement!=='NOT_PROVEN') throw new Error('policy improvement fabricated');" "${PROOF_PATH}"
      - uses: actions/upload-artifact@v4
        with:
          name: nayanet-proof7-preexisting-accumulated-intelligence
          path: ${{ runner.temp }}/nayanet-proof7-preexisting-accumulated-intelligence.json
          if-no-files-found: error
          retention-days: 30
