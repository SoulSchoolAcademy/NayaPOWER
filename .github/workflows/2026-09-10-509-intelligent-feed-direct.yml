name: 2026-09-10 — 509 Intelligent Feed Direct Update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/2026-09-10-509-intelligent-feed-direct.yml'
      - 'scripts/nayanet-509-intelligent-feed-v2.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-509:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the actual 509 HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('2026 09 09 5:09 pm NayaNET HUB.html')
          js=Path('scripts/nayanet-509-intelligent-feed-v2.js').read_text(encoding='utf-8')
          s=html.read_text(encoding='utf-8')
          s=re.sub(r'<script id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V1">.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V2">.*?</script>\s*','',s,flags=re.S)
          block='<script id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V2">\n'+js+'\n</script>\n'
          if '</body>' not in s:
              raise SystemExit('509 HTML missing </body>')
          s=s.replace('</body>',block+'</body>',1)
          html.write_text(s,encoding='utf-8')
          print('509_SOURCE_RENDERER=V2')
          PY
      - name: Verify the actual 509 source
        shell: bash
        run: |
          set -euo pipefail
          FILE='2026 09 09 5:09 pm NayaNET HUB.html'
          test "$(grep -o 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V2' "$FILE" | wc -l)" -eq 1
          grep -q 'The Intelligent Feed Turns Experience Into Usable Intelligence' "$FILE"
          grep -q 'One Intelligence Event = One Board' "$FILE"
          grep -q 'Source Intent Is Not Runtime Truth' "$FILE"
          grep -q 'HUMAN' "$FILE"
          grep -q 'CHILD' "$FILE"
          grep -q 'GRANDMA' "$FILE"
          grep -q 'NAYA' "$FILE"
          grep -q 'MACHINE' "$FILE"
          grep -q 'LEARNING' "$FILE"
          grep -q 'MEANING' "$FILE"
          grep -q 'ACTION' "$FILE"
          grep -q 'TRUST' "$FILE"
          grep -q 'CONNECTIONS' "$FILE"
          grep -q 'CREATE SPACE' "$FILE"
          grep -q 'SAVED TO SMART LIST' "$FILE"
          grep -q 'SHARE INTEL' "$FILE"
          grep -q 'RATE THIS INTELLIGENCE' "$FILE"
          git diff --check
          echo '509_SOURCE_VERIFICATION=PASS'
      - name: Commit the actual 509 HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add -- '2026 09 09 5:09 pm NayaNET HUB.html'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '509_SOURCE_CHANGE=ALREADY_PRESENT'
            exit 0
          fi
          git commit -m 'feat(509): install canonical intelligent feed v2'
          git push
