name: 2026-09-10 — 509 Intelligent Feed Direct Update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/2026-09-10-509-intelligent-feed-direct.yml'
      - 'scripts/nayanet-509-intelligent-feed-v2.js'
      - '.naya/activity/2026-09-10-509-LEGACY-FEED-CLEANUP.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-509:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgically remove every legacy 509 feed layer and install V2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('2026 09 09 5:09 pm NayaNET HUB.html')
          js_path = Path('scripts/nayanet-509-intelligent-feed-v2.js')
          s = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')

          def remove_script_by_id(text, script_id):
              pattern = rf'<script\\s+id="{re.escape(script_id)}"[^>]*>.*?</script>\\s*'
              return re.sub(pattern, '', text, flags=re.S | re.I)

          def remove_style_by_id(text, style_id):
              pattern = rf'<style\\s+id="{re.escape(style_id)}"[^>]*>.*?</style>\\s*'
              return re.sub(pattern, '', text, flags=re.S | re.I)

          legacy_script_ids = [
              'nayanet-canonical-feed-upgrade-runtime',
              'nayanet-right-sidebar-feed-mirror-runtime',
              'nayanet-v7-intelligent-feed-excellence',
              'nayanet-intelligent-feed-v5-runtime',
              'nayanet-intelligent-feed-v6-runtime',
              'nayanet-authority-correction-runtime',
              'NAYANET_509_INTELLIGENT_FEED_DIRECT_V1',
              'NAYANET_509_INTELLIGENT_FEED_DIRECT_V2',
          ]
          legacy_style_ids = [
              'nayanet-right-sidebar-feed-mirror-style',
              'NAYANET-LIVE-RIGHT-RAIL-GUARD-V5',
              'NAYANET-LIVE-RIGHT-RAIL-GUARD-V6',
              'nh-authority-correction-style',
              'nh-v72-style',
          ]
          for ident in legacy_script_ids:
              s = remove_script_by_id(s, ident)
          for ident in legacy_style_ids:
              s = remove_style_by_id(s, ident)

          s = re.sub(r'<script\\s+src=["\']\\./nayanet-intelligent-feed-v6\\.js["\'][^>]*>\\s*</script>\\s*', '', s, flags=re.I)

          start_match = re.search(r'<section\\s+class="homeFeed"[^>]*>', s, flags=re.I)
          if not start_match:
              raise SystemExit('509 HTML missing homeFeed mount')
          start = start_match.start()
          pos = start_match.end()
          depth = 1
          token = re.compile(r'<section\\b[^>]*>|</section\\s*>', re.I)
          while depth:
              m = token.search(s, pos)
              if not m:
                  raise SystemExit('Could not find matching homeFeed section close')
              if m.group(0).lower().startswith('</'):
                  depth -= 1
              else:
                  depth += 1
              pos = m.end()
          s = s[:start] + '<section class="homeFeed"></section>' + s[pos:]

          block = '<script id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V2">\\n' + js + '\\n</script>\\n'
          if '</body>' not in s:
              raise SystemExit('509 HTML missing </body>')
          s = s.replace('</body>', block + '</body>', 1)
          html_path.write_text(s, encoding='utf-8')
          print('509_SOURCE_RECONSTRUCTION=V2_ONLY')
          PY

      - name: Verify the source contains only the new feed
        shell: bash
        run: |
          set -euo pipefail
          FILE='2026 09 09 5:09 pm NayaNET HUB.html'
          test "$(grep -o 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V2' "$FILE" | wc -l)" -eq 1
          ! grep -q 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V1' "$FILE"
          ! grep -q 'nayanet-intelligent-feed-v6.js' "$FILE"
          ! grep -q 'nayanet-right-sidebar-feed-mirror-runtime' "$FILE"
          ! grep -q 'nayanet-v7-intelligent-feed-excellence' "$FILE"
          grep -q 'The Intelligent Feed Turns Experience Into Usable Intelligence' "$FILE"
          grep -q 'One Intelligence Event = One Board' "$FILE"
          grep -q 'Source Intent Is Not Runtime Truth' "$FILE"
          grep -q 'IN A NUTSHELL' "$FILE"
          grep -q 'HUMAN' "$FILE"
          grep -q 'CHILD' "$FILE"
          grep -q 'GRANDMA' "$FILE"
          grep -q 'NAYA' "$FILE"
          grep -q 'MACHINE' "$FILE"
          grep -q 'LEARNING' "$FILE"
          grep -q 'MEANING' "$FILE"
          grep -q 'ACTION' "$FILE"
          grep -q 'TRUST' "$FILE"
          grep -q 'CONNECTIONS' "$FILE"
          grep -q 'CREATE SPACE' "$FILE"
          grep -q 'SAVED TO SMART LIST' "$FILE"
          grep -q 'SHARE INTEL' "$FILE"
          grep -q 'RATE THIS INTELLIGENCE' "$FILE"
          git diff --check
          echo '509_SOURCE_VERIFICATION=PASS'

      - name: Commit the surgical 509 source reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add -- '2026 09 09 5:09 pm NayaNET HUB.html'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '509_SOURCE_CHANGE=ALREADY_PRESENT'
            exit 0
          fi
          git commit -m 'fix(509): remove legacy feed layers and keep canonical v2'
          git push