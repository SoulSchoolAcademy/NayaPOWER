name: 2026-09-10 — 509 Intelligent Feed Direct Update
# ISOLATED 509 RECONSTRUCTION: this push-triggered run is intentionally scoped to one surgical source transformation.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/2026-09-10-509-intelligent-feed-direct.yml'
      - 'scripts/nayanet-509-intelligent-feed-v2.js'
      - '.naya/activity/2026-09-10-509-LEGACY-FEED-CLEANUP.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-509:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgically remove every legacy 509 feed layer and install V2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html_path=Path('2026 09 09 5:09 pm NayaNET HUB.html')
          js_path=Path('scripts/nayanet-509-intelligent-feed-v2.js')
          s=html_path.read_text(encoding='utf-8')
          js=js_path.read_text(encoding='utf-8')
          def rs(t,i): return re.sub(rf'<script\s+id="{re.escape(i)}"[^>]*>.*?</script>\s*','',t,flags=re.S|re.I)
          def rt(t,i): return re.sub(rf'<style\s+id="{re.escape(i)}"[^>]*>.*?</style>\s*','',t,flags=re.S|re.I)
          for i in ['nayanet-canonical-feed-upgrade-runtime','nayanet-right-sidebar-feed-mirror-runtime','nayanet-v7-intelligent-feed-excellence','nayanet-intelligent-feed-v5-runtime','nayanet-intelligent-feed-v6-runtime','nayanet-authority-correction-runtime','NAYANET_509_INTELLIGENT_FEED_DIRECT_V1','NAYANET_509_INTELLIGENT_FEED_DIRECT_V2']: s=rs(s,i)
          for i in ['nayanet-right-sidebar-feed-mirror-style','NAYANET-LIVE-RIGHT-RAIL-GUARD-V5','NAYANET-LIVE-RIGHT-RAIL-GUARD-V6','nh-authority-correction-style','nh-v72-style']: s=rt(s,i)
          s=re.sub(r'<script\s+src=["\']\./nayanet-intelligent-feed-v6\.js["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
          m=re.search(r'<section\s+class="homeFeed"[^>]*>',s,flags=re.I)
          if not m: raise SystemExit('509 HTML missing homeFeed mount')
          start=m.start(); pos=m.end(); depth=1; tok=re.compile(r'<section\b[^>]*>|</section\s*>',re.I)
          while depth:
              q=tok.search(s,pos)
              if not q: raise SystemExit('Could not find matching homeFeed section close')
              depth += -1 if q.group(0).lower().startswith('</') else 1
              pos=q.end()
          s=s[:start]+'<section class="homeFeed"></section>'+s[pos:]
          if '</body>' not in s: raise SystemExit('509 HTML missing </body>')
          s=s.replace('</body>','<script id="NAYANET_509_INTELLIGENT_FEED_DIRECT_V2">\n'+js+'\n</script>\n</body>',1)
          html_path.write_text(s,encoding='utf-8')
          PY
      - name: Verify only the new feed remains
        shell: bash
        run: |
          set -euo pipefail
          FILE='2026 09 09 5:09 pm NayaNET HUB.html'
          test "$(grep -o 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V2' "$FILE" | wc -l)" -eq 1
          ! grep -q 'NAYANET_509_INTELLIGENT_FEED_DIRECT_V1' "$FILE"
          ! grep -q 'nayanet-intelligent-feed-v6.js' "$FILE"
          ! grep -q 'nayanet-right-sidebar-feed-mirror-runtime' "$FILE"
          ! grep -q 'nayanet-v7-intelligent-feed-excellence' "$FILE"
          grep -q 'One Intelligence Event = One Board' "$FILE"
          grep -q 'Source Intent Is Not Runtime Truth' "$FILE"
          for x in 'IN A NUTSHELL' HUMAN CHILD GRANDMA NAYA MACHINE LEARNING MEANING ACTION TRUST CONNECTIONS 'CREATE SPACE' 'SAVED TO SMART LIST' 'SHARE INTEL' 'RATE THIS INTELLIGENCE'; do grep -q "$x" "$FILE"; done
          git diff --check
      - name: Commit the actual 509 HTML once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add -- '2026 09 09 5:09 pm NayaNET HUB.html'
          if git diff --cached --quiet; then echo 'NO_509_SOURCE_CHANGE'; exit 0; fi
          git commit -m 'fix(509): remove legacy feed layers and install canonical v2 only'
          git push