name: Retired Legacy Hub Feed Repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy repair retired
        run: |
          echo 'LEGACY_V3_V4_REPAIR=RETIRED'
          echo 'CANONICAL_HUB_SOURCE=2026 09 08 452 NayaNET Hub.html'
          echo 'CANONICAL_SMART_FEED=.naya/build/NAYANET-SMART-FEED-MASTER-V1.html'
          echo 'RULE=DO_NOT_REWRITE_THE_HUB_WITH_HISTORICAL_FEED_LAYERS'
