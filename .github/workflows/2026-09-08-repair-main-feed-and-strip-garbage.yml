name: Retired Legacy Hub Feed Repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy repair retired
        run: |
          echo 'LEGACY_V3_V4_REPAIR=RETIRED'
          echo 'CANONICAL_HUB_SOURCE=NAYANET/HUB'
          echo 'CANONICAL_PUBLIC_DEPLOYMENT=.github/workflows/deploy-nayanet-hub-canonical-v2.yml'
          echo 'RULE=DO_NOT_REWRITE_THE_HUB_WITH_HISTORICAL_FEED_LAYERS'
