name: Verify Project Intelligence Bridge

on:
  push:
    branches: [main]
    paths:
      - ".naya/project-intelligence/**"
      - ".naya/runtime/project_intelligence_bridge.py"
      - "supabase/functions/nayanet-project-intelligence-bridge/index.ts"
      - "supabase/migrations/20260925040000_bind_bridge_owner_to_oidc_workflow_v1.sql"
      - ".naya/control-plane/**"
      - ".github/workflows/verify-project-intelligence-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NAYANET_BRIDGE_AUTH_URL: https://dahisasgpfvziswqvmvm.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Establish fresh proof owner identity
        shell: bash
        run: |
          set -euo pipefail
          owner=$(curl -sSf -X POST -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" "$NAYANET_BRIDGE_AUTH_URL/auth/v1/signup" -d '{}')
           owner_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["user"]["id"])' <<< "$owner")
           owner_access_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$owner")
           echo "::add-mask::$owner_access_token"
           echo "NAYANET_OWNER_ACCESS_TOKEN=$owner_access_token" >> "$GITHUB_ENV"
           echo "NAYANET_OWNER_ID=$owner_id" >> "$GITHUB_ENV"
          echo "RUN_IDENTITY=github-actions:${GITHUB_RUN_ID}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Validate canonical bridge
        run: python .naya/runtime/project_intelligence_bridge.py validate
      - name: Build canonical packet
        run: python .naya/runtime/project_intelligence_bridge.py build --out project-intelligence-bridge-packet.json
      - name: Assert packet contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open("project-intelligence-bridge-packet.json",encoding="utf-8"))
          required={"protocol","packet_id","project_id","source_ref","content_hash","operating_context","intelligence","provenance","privacy","idempotency_key"}
          assert required <= p.keys()
          assert p["protocol"]=="NAYANET_PROJECT_INTELLIGENCE_BRIDGE_V1"
          assert p["project_id"]=="NayaNET"
          assert p["privacy"]["default_visibility"]=="PRIVATE"
          print("PROJECT_INTELLIGENCE_BRIDGE_PACKET=VALID")
          print("SOURCE_REF="+p["source_ref"])
          print("PACKET_ID="+p["packet_id"])
          print("CONTENT_HASH="+p["content_hash"])
          PY
      - name: Mint GitHub OIDC bridge token
        id: oidc
        shell: bash
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nayanet-project-intelligence-bridge" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Send to authorized receiver
        env:
          NAYANET_BRIDGE_URL: https://dahisasgpfvziswqvmvm.supabase.co/functions/v1/nayanet-project-intelligence-bridge
          NAYANET_BRIDGE_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python .naya/runtime/project_intelligence_bridge.py send project-intelligence-bridge-packet.json
      - name: Publish bridge packet
        uses: actions/upload-artifact@v4
        with:
          name: project-intelligence-bridge-packet
          path: project-intelligence-bridge-packet.json
          retention-days: 14
