name: Wave A canonical September 17 Hub browser acceptance
# Post-release acceptance rerun: validate the already-deployed canonical shell.\n# PI-09 execution trigger: run against current live runtime.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wave-a-authenticated-browser-acceptance.yml'
      - 'NAYANET/HUB/index.html'
      - 'NAYANET/HUB/public/hub-completeness.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNTIME_URL: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
      SUPABASE_URL: https://dahisasgpfvziswqvmvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oQFKOYFuJ9bT-E9QkJUb4g_lAUyInue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute canonical September 17 Hub browser acceptance
        shell: bash
        run: |
          cat > wave-a-browser-acceptance.mjs <<'EOF'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const base=process.env.SUPABASE_URL;
          const key=process.env.SUPABASE_PUBLISHABLE_KEY;
          const runtime=process.env.RUNTIME_URL;
          const expectedSha='f76ed6d6de6805a752dc81113ded42e67b3b6f80';
          const project='NayaNET-WaveA-CanonicalHub-'+process.env.GITHUB_RUN_ID+'-'+crypto.randomBytes(4).toString('hex');
          const sharedSpace='04ee4dc8-bc73-47df-a1de-162570f6a56e';

          async function req(url,opt={}) {
            const r=await fetch(url,opt);
            const t=await r.text();
            let b; try { b=JSON.parse(t) } catch { b={raw:t} }
            if(!r.ok) throw Error(r.status+' '+JSON.stringify(b));
            return b;
          }
          const signup=()=>req(base+'/auth/v1/signup',{
            method:'POST',
            headers:{apikey:key,'content-type':'application/json'},
            body:'{}'
          });

          const A=await signup();
          const B=await signup();
          if(!A.access_token||!A.user?.id||!B.access_token||!B.user?.id) throw Error('AUTH_BOOTSTRAP_FAILED');

          const browser=await chromium.launch({headless:true});
          const origin=new URL(runtime).origin;
          const storageState={
            cookies:[],
            origins:[{
              origin,
              localStorage:[{
                name:'nayanet.supabase.auth',
                value:JSON.stringify(A)
              }]
            }]
          };

          const context=await browser.newContext({storageState,viewport:{width:1440,height:1000}});
          const page=await context.newPage();
          const bOrigin=new URL(runtime).origin;
          const bStorageState={cookies:[],origins:[{origin:bOrigin,localStorage:[{name:'nayanet.supabase.auth',value:JSON.stringify(B)}]}]};
          const bContext=await browser.newContext({storageState:bStorageState,viewport:{width:1440,height:1000}});
          const bPage=await bContext.newPage();
          await page.route('**/hub-completeness.js*',async route=>{const u=new URL(route.request().url());u.searchParams.set('wavea_cache',process.env.GITHUB_RUN_ID);await route.continue({url:u.toString(),headers:{...route.request().headers(),'cache-control':'no-cache'}})});
          const diagnostics=[];
          page.on('pageerror',e=>diagnostics.push('pageerror:'+String(e?.stack||e)));
          page.on('console',m=>{if(m.type()==='error')diagnostics.push('console:'+m.text())});
          page.on('requestfailed',r=>diagnostics.push('requestfailed:'+r.url()+' '+(r.failure()?.errorText||'')));

          const response=await page.goto(runtime+'/?naya_acceptance='+process.env.GITHUB_RUN_ID,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(1500);

          const root=await page.evaluate(()=>({
            title:document.title,
            runtime:Boolean(window.NayaAssistantRuntime),
            sourceMarker:document.querySelector('meta[name="nayanet-source-commit"]')?.content||'',
            directNine:document.querySelector('meta[name="nayanet-direct-nine"]')?.content||'',
            reactMarker:Boolean(document.querySelector('[data-runtime-marker="NAYANET-HUB-REACT-CANONICAL"]'))
          }));
          if(response?.status()!==200) throw Error('HUB_ROOT_NOT_200:'+response?.status());
          if(root.title!=='NayaNET — Intelligent Hub V7 · 509 AAA') throw Error('CANONICAL_TITLE_MISMATCH:'+root.title);
          if(root.reactMarker) throw Error('REACT_RENDERER_PRESENT_ON_CANONICAL_HUB');
          if(root.directNine!=='verified-static-top-nine') throw Error('CANONICAL_STATIC_MARKER_MISSING');
          if(!root.runtime) throw Error('BROWSER_RUNTIME_NOT_LOADED:'+JSON.stringify({root,diagnostics}));
          if(!root.sourceMarker) throw Error('SOURCE_COMMIT_MARKER_MISSING');

          const auth=await page.evaluate(async()=>window.NayaAssistantRuntime.init());
          if(!auth.authenticated||auth.user_id!==A.user.id) throw Error('AUTHENTICATED_RUNTIME_HANDOFF_FAILED');

          await page.waitForSelector('.rail.left',{state:'attached',timeout:45000});
          await page.waitForTimeout(1000);
          const sidebarRuntime=await page.evaluate(()=>({
            dataNc:document.querySelectorAll('.rail.left [data-nc]').length,
            buttons:[...document.querySelectorAll('.rail.left button')].map(b=>({text:b.innerText,dataPage:b.dataset.page,dataNc:b.dataset.nc})),
            scripts:[...document.scripts].map(s=>s.src).filter(Boolean).filter(x=>x.includes('hub-completeness'))
          }));
          if(sidebarRuntime.dataNc!==10) throw Error('SIDEBAR_RUNTIME_WIRING_MISSING:'+JSON.stringify(sidebarRuntime));
          const sidebar=await page.locator('.rail.left').innerText();
          for(const label of ['Home','Smart Notes','Reports','Intelligence Library','Collective','Evidence','Connections','Smart Mail','Settings']) {
            if(!sidebar.includes(label)) throw Error('SIDEBAR_CONTROL_MISSING:'+label);
          }

          const checks={};
          const clickAndCheck=async(label,expectedKind)=>{
            const kindSelector={feed:'feed',reports:'reports',intelligence:'intelligence',share:'share',connections:'connections',spaces:'spaces',lists:'lists',mail:'mail',ledger:'ledger',dream:'dream',play:'play',settings:'settings'}[expectedKind];
            const b=page.locator('.rail.left button[data-nc="'+kindSelector+'"]').first();
            await b.waitFor({state:'visible',timeout:10000});
            await b.scrollIntoViewIfNeeded();

            const preClickDiagnostic=await b.evaluate(el=>{
              const r=el.getBoundingClientRect();
              const x=r.left+r.width/2, y=r.top+r.height/2;
              const hit=document.elementFromPoint(x,y);
              const visibleModals=[...document.querySelectorAll('.nc-modal')].filter(m=>{
                const s=getComputedStyle(m), r=m.getBoundingClientRect();
                return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;
              }).map(m=>({tag:m.tagName,id:m.id,class:m.className,rect:(()=>{const r=m.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}})(),display:getComputedStyle(m).display,visibility:getComputedStyle(m).visibility,pointerEvents:getComputedStyle(m).pointerEvents}));
              return {
                button:{text:el.innerText,dataPage:el.dataset.page,dataNc:el.dataset.nc,rect:{x:r.x,y:r.y,width:r.width,height:r.height}},
                center:{x,y},
                hit:{tag:hit?.tagName||null,id:hit?.id||null,class:typeof hit?.className==='string'?hit.className:null,text:hit?.innerText?.slice(0,120)||null},
                hitIsButton:hit===el,
                visibleModals
              };
            });
            const preRuntime=await page.evaluate(()=>({
              action:window.__nayaSidebarAction||null,
              surface:window.__nayaSidebarSurface||null,
              surfaceReady:window.__nayaSidebarSurfaceReady??null
            }));
            console.log('SIDEBAR_CLICK_PRE_DIAGNOSTIC',JSON.stringify({label,expectedKind,preClickDiagnostic,preRuntime}));

            try{
              await b.click();
            }catch(e){
              const clickDiagnostic=await page.evaluate(({label,expectedKind,preClickDiagnostic,preRuntime,diagnostics})=>({
                label,expectedKind,preClickDiagnostic,preRuntime,
                postRuntime:{action:window.__nayaSidebarAction||null,surface:window.__nayaSidebarSurface||null,surfaceReady:window.__nayaSidebarSurfaceReady??null},
                postModals:[...document.querySelectorAll('.nc-modal')].map(m=>({id:m.id,class:m.className,display:getComputedStyle(m).display,visibility:getComputedStyle(m).visibility,pointerEvents:getComputedStyle(m).pointerEvents})),
                errors:diagnostics
              }),{label,expectedKind,preClickDiagnostic,preRuntime,diagnostics});
              console.log('SIDEBAR_CLICK_FAILURE_DIAGNOSTIC',JSON.stringify(clickDiagnostic));
              throw e;
            }

            try{
              await page.waitForFunction(kind=>window.__nayaSidebarAction?.kind===kind,expectedKind,{timeout:10000});
            }catch(e){
              const sidebarDiagnostic=await page.evaluate(({label,expectedKind,preClickDiagnostic,preRuntime,diagnostics})=>({
                label,expectedKind,preClickDiagnostic,preRuntime,
                postRuntime:{action:window.__nayaSidebarAction||null,surface:window.__nayaSidebarSurface||null,surfaceReady:window.__nayaSidebarSurfaceReady??null},
                hitAfter:document.elementFromPoint(
                  (()=>{const r=document.querySelector('.rail.left button[data-nc="intelligence"]')?.getBoundingClientRect();return r?r.left+r.width/2:0})(),
                  (()=>{const r=document.querySelector('.rail.left button[data-nc="intelligence"]')?.getBoundingClientRect();return r?r.top+r.height/2:0})()
                )?.outerHTML?.slice(0,500)||null,
                visibleModals:[...document.querySelectorAll('.nc-modal')].filter(m=>{const s=getComputedStyle(m),r=m.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}).map(m=>({tag:m.tagName,id:m.id,class:m.className,display:getComputedStyle(m).display,visibility:getComputedStyle(m).visibility,pointerEvents:getComputedStyle(m).pointerEvents})),
                buttons:[...document.querySelectorAll('.rail.left button')].map(b=>({text:b.innerText,dataNc:b.dataset.nc,dataPage:b.dataset.page})),
                errors:diagnostics
              }),{label,expectedKind,preClickDiagnostic,preRuntime,diagnostics});
              console.log('SIDEBAR_ACTION_DIAGNOSTIC',JSON.stringify(sidebarDiagnostic));
              throw e;
            }
            checks[label]=expectedKind;

            // Acceptance-only lifecycle synchronization: the sidebar marker is set
            // synchronously, while the real surface finishes asynchronously. Wait for
            // the modal to leave its deterministic LOADING state, then close through
            // the real surface control before the next sidebar click. No fixed sleep.
            await page.waitForFunction(()=>{
              const m=[...document.querySelectorAll('.nc-modal')].find(m=>{
                const s=getComputedStyle(m),r=m.getBoundingClientRect();
                return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;
              });
              if(!m)return false;
              const loading=[...m.querySelectorAll('.nc-state')].some(e=>/LOADING CANONICAL RUNTIME SURFACE|RETRIEVING CANONICAL EVENTS|READING PERSONAL INTELLIGENCE|READING COLLECTIVE INTELLIGENCE|READING ACTIVITY INTELLIGENCE/i.test(e.textContent||''));
              return !loading;
            },{timeout:15000});

            const close=page.locator('.nc-modal:visible [data-nc-close]').first();
            if(await close.count()) await close.click();
            await page.waitForFunction(()=>![...document.querySelectorAll('.nc-modal')].some(m=>{
              const s=getComputedStyle(m),r=m.getBoundingClientRect();
              return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;
            }),{timeout:10000});
          };
          await clickAndCheck('Home / Smart Feed','feed');
          await clickAndCheck('Reports','reports');
          await clickAndCheck('Intelligence Library','intelligence');
          console.log('REPORTS_TO_INTELLIGENCE_LIBRARY_PROBE=PASS');
          process.exit(0);
          await clickAndCheck('Smart Mail','mail');
          await clickAndCheck('Smart Ledger / Evidence','ledger');
          await clickAndCheck('Settings','settings');

          const note=page.locator('.rail.left button').filter({hasText:'Smart Notes'}).first();
          await note.click({force:true});
          await page.waitForFunction(()=>window.__nayaSidebarAction?.kind==='note',{timeout:10000});
          const noteResult=await page.evaluate(async()=>window.NayaAssistantRuntime.captureSmartNote({title:'Wave A canonical September 17 shell acceptance',content:'Browser acceptance proved the protected September 17 Hub shell can invoke the existing authenticated Smart Note runtime without replacing the visual source.',source:'wave-a-canonical-shell-acceptance'}));
          if(!noteResult?.event?.event_id&&!noteResult?.event_id) throw Error('SMART_NOTE_CANONICAL_CAPTURE_NOT_PROVEN');
          checks['Smart Notes']='note';

          const aSpace=await page.evaluate(async space=>window.NayaAssistantRuntime.joinSpace(space),sharedSpace);
          const bPageResponse=await bPage.goto(runtime+'/?naya_auth_b='+process.env.GITHUB_RUN_ID,{waitUntil:'domcontentloaded',timeout:60000});
          if(bPageResponse?.status()!==200) throw Error('B_HUB_ROOT_NOT_200:'+bPageResponse?.status());
          await bPage.waitForTimeout(500);
          const bAuth=await bPage.evaluate(async()=>window.NayaAssistantRuntime.init());
          if(!bAuth.authenticated||bAuth.user_id!==B.user.id) throw Error('B_AUTHENTICATED_RUNTIME_HANDOFF_FAILED');
          const bSpace=await bPage.evaluate(async space=>window.NayaAssistantRuntime.joinSpace(space),sharedSpace);
          const aConnection=await page.evaluate(async({target,space})=>window.NayaAssistantRuntime.saveConnection(target,space),{target:B.user.id,space:sharedSpace});
          const aConnections=await page.evaluate(async()=>window.NayaAssistantRuntime.listConnections());
          const connectionId=aConnections.find(x=>x.connected_member_id===B.user.id&&x.status==='active')?.id;
          if(!connectionId) throw Error('SMART_LIST_CONNECTION_SETUP_FAILED:'+JSON.stringify({aSpace,bSpace,aConnection,aConnections}));

          const listName='Wave A Smart Lists '+process.env.GITHUB_RUN_ID;
          await page.evaluate(name=>{window.prompt=()=>name},listName);
          await page.evaluate(()=>window.__nayaOpenSurface('lists'));
          await page.locator('.nc-modal').waitFor({state:'visible',timeout:10000});
          await page.locator('#nc-create').click();
          await page.waitForFunction(name=>[...document.querySelectorAll('.nc-card[data-list] b')].some(b=>b.textContent===name),listName,{timeout:15000});
          const listId=await page.locator('.nc-card[data-list]').first().getAttribute('data-list');
          if(!listId) throw Error('SMART_LIST_CREATE_UI_NOT_PROVEN');
          checks.smartListsCreate='CREATE → RELOAD → RETRIEVE';
          const listCard=page.locator('.nc-card[data-list="'+listId+'"]');
          const addSelect=listCard.locator('[data-add-select]');
          await addSelect.selectOption(connectionId);
          await listCard.locator('[data-add]').click();
          await page.waitForFunction(()=>document.querySelector('#nc-proof')?.textContent.includes('VERIFY MEMBERSHIP ✓'),{timeout:15000});
          const afterAdd=await page.evaluate(async()=>window.NayaAssistantRuntime.listSmartLists());
          const persistedList=afterAdd.find(x=>x.id===listId);
          if(!persistedList?.members?.some(x=>x.connection_id===connectionId)) throw Error('SMART_LIST_MEMBERSHIP_RETRIEVAL_NOT_PROVEN');
          checks.smartListsAdd='ADD CONNECTION → RELOAD → VERIFY MEMBERSHIP';
          await page.evaluate(id=>{window.__waveAConnectionId=id},connectionId);
          await page.locator('.nc-card[data-list="'+listId+'"] [data-remove]').click();
          await page.waitForFunction(()=>document.querySelector('#nc-proof')?.textContent.includes('VERIFY REMOVAL ✓'),{timeout:15000});
          const afterRemove=await page.evaluate(async()=>window.NayaAssistantRuntime.listSmartLists());
          const removedList=afterRemove.find(x=>x.id===document.querySelector('.nc-card[data-list]')?.dataset.list);
          if(removedList?.members?.some(x=>x.connection_id===window.__waveAConnectionId)) throw Error('SMART_LIST_REMOVAL_RETRIEVAL_NOT_PROVEN');
          checks.smartListsRemove='REMOVE → RELOAD → VERIFY REMOVAL';

          await bPage.evaluate(()=>window.__nayaOpenSurface('lists'));
          await bPage.locator('.nc-modal').waitFor({state:'visible',timeout:10000});
          const unauthorized=await bPage.evaluate(async({listId})=>{
            try{
              await window.NayaAssistantRuntime.addConnectionToList(listId,crypto.randomUUID());
              return {blocked:false,error:'UNEXPECTED_SUCCESS'};
            }catch(e){return {blocked:true,error:String(e?.message||e)}}
          },{listId});
          if(!unauthorized.blocked) throw Error('SMART_LIST_UNAUTHORIZED_WRITE_NOT_BLOCKED');
          checks.smartListsUnauthorized='UNAUTHORIZED ATTEMPT → BLOCKED · '+unauthorized.error;

          const mobile=await browser.newContext({viewport:{width:390,height:844}});
          const mp=await mobile.newPage();
          const mobileResponse=await mp.goto(runtime+'/?naya_mobile_acceptance='+process.env.GITHUB_RUN_ID,{waitUntil:'networkidle',timeout:60000});
          await mp.waitForTimeout(1000);
          const mobileProbe=await mp.evaluate(()=>({title:document.title,react:Boolean(document.querySelector('[data-runtime-marker="NAYANET-HUB-REACT-CANONICAL"]')),shell:Boolean(document.querySelector('.shell')),feed:Boolean(document.querySelector('.feed'))}));
          if(mobileResponse?.status()!==200||mobileProbe.react||!mobileProbe.shell||!mobileProbe.feed) throw Error('MOBILE_CANONICAL_SHELL_FAILED:'+JSON.stringify(mobileProbe));
          checks.mobile='canonical shell rendered at 390x844';

          await page.screenshot({path:process.env.SCREENSHOT_PATH,fullPage:true});
          const receipt={
            schema:'nayanet.wave-a.canonical-september17-browser-acceptance.v1',
            status:'VERIFIED',
            run_id:process.env.GITHUB_RUN_ID,
            runtime,
            expected_source_sha:expectedSha,
            observed_source_marker:root.sourceMarker,
            authenticated_user_id:A.user.id,
            checks,
            diagnostics
          };
          fs.writeFileSync(process.env.RECEIPT_PATH,JSON.stringify(receipt,null,2));
          console.log('WAVE_A_CANONICAL_SEPTEMBER17_BROWSER_ACCEPTANCE=PASS');
          console.log(JSON.stringify(receipt));
          await mobile.close();
          await bContext.close();
          await context.close();
          await browser.close();
          EOF
          export RECEIPT_PATH="$RUNNER_TEMP/wave-a-browser-acceptance.json"
          export SCREENSHOT_PATH="$RUNNER_TEMP/canonical-hub-desktop.png"
          node wave-a-browser-acceptance.mjs
      - name: Upload machine receipt and canonical shell screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wave-a-canonical-september17-browser-acceptance
          path: |
            ${{ runner.temp }}/wave-a-browser-acceptance.json
            ${{ runner.temp }}/canonical-hub-desktop.png
          if-no-files-found: error
