name: Deploy 509 C4 — Smart Note Placement
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  FILE: snapshots/NayaNET-509-AAA-CURRENT.html
  WORKER_NAME: sparkling-shape-7ae5
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current GitHub HTML
        uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - name: Verify the nine static boards in GitHub
        run: |
          set -euo pipefail
          test -s "$FILE"
          test "$(grep -o 'data-naya-direct-note="[1-9]"' "$FILE" | wc -l)" -eq 9
          grep -Fq 'name="nayanet-direct-nine"' "$FILE"
          for t in 'WHAT IS NAYA POWER?' 'WHAT IS NAYA?' 'WHAT ARE SMART NOTES?' 'YOUR INTELLIGENCE TODAY' 'INTELLIGENCE REPORTS' 'WHAT IS THE INTELLIGENT LIBRARY?' 'SMART LISTS' 'INTELLIGENT FEED / SMART FEED' 'SMART TABS'; do grep -Fq "$t" "$FILE"; done
          echo GITHUB_EXACT_CURRENT_HTML=PASS
      - name: Prepare exact GitHub artifact for Cloudflare
        run: |
          set -euo pipefail
          rm -rf release; mkdir -p release/public
          cp "$FILE" release/public/index.html
          printf '%s\n' 'export default {async fetch(request,env){const u=new URL(request.url);const r=new Request(new URL("/index.html",request.url),request);const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set("Cache-Control","no-store, no-cache, must-revalidate, max-age=0");h.set("X-NayaNET-Direct-HTML","true");h.set("X-NayaNET-GitHub-Artifact","snapshots/NayaNET-509-AAA-CURRENT.html");return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}' > release/worker.js
          printf '{"name":"%s","main":"worker.js","compatibility_date":"2026-09-08","account_id":"%s","assets":{"directory":"./public","binding":"ASSETS"}}\n' "$WORKER_NAME" "$ACCOUNT_ID" > release/wrangler.jsonc
      - name: Deploy exact GitHub artifact
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc
      - name: Verify exact live artifact
        run: |
          set -euo pipefail
          curl -fsSL "$RUNTIME/?verify=${GITHUB_SHA}" -o /tmp/live.html
          test "$(grep -o 'data-naya-direct-note="[1-9]"' /tmp/live.html | wc -l)" -eq 9
          grep -Fq 'name="nayanet-direct-nine"' /tmp/live.html
          grep -Fq 'WHAT IS NAYA POWER?' /tmp/live.html
          grep -Fq 'SMART TABS' /tmp/live.html
          echo LIVE_EXACT_GITHUB_HTML=PASS
