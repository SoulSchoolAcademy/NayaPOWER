name: Deploy 509 C4 — Smart Note Placement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NAYANET/509-AAA-REAL-SMART-FEED-NAV-ADJACENT-PLACEMENT.js'
      - '.github/workflows/deploy-509-c4-smart-note-placement.yml'

permissions:
  contents: read

env:
  WORKER_NAME: sparkling-shape-7ae5
  RUNTIME: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev
  SMART_LINK: https://sparkling-shape-7ae5.smartnetpodcast.workers.dev/intelligence/nayanet-intelligent-feeds
  ACCOUNT_ID: b5e2a51b3e883f7722287c5f51b1196b
  PLACEMENT_FILE: NAYANET/509-AAA-REAL-SMART-FEED-NAV-ADJACENT-PLACEMENT.js

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative checkpoint source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate source
        run: |
          set -euo pipefail
          test -s "$PLACEMENT_FILE"
          node --check "$PLACEMENT_FILE"

      - name: Build checkpoint release without inheriting live HTML
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release/public
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/2026%2009%2013%20NayaNET%20HUB%20509%20AAA.html" -o release/public/index.html
          for asset in \
            naya-509-aaa.js \
            naya-509-next-level.js \
            naya-509-smart-feed-c3.js \
            naya-509-intelligent-board-c4.js \
            naya-509-c4-unified-board-repair.js \
            naya-509-c4-single-board-runtime-repair.js \
            naya-509-c4-love-like-personal-polish.js \
            naya-509-real-smart-feed-content.js \
            naya-509-real-smart-feed-distillation.js \
            naya-509-real-smart-feed-lifecycle-repair.js \
            naya-509-real-smart-feed-final-presentation-fix.js \
            naya-509-real-smart-feed-nav-restore.js; do
            if curl -fsSL "$RUNTIME/$asset?placement-probe=${GITHUB_SHA}" -o "release/public/$asset"; then
              echo "PRESERVED_RUNTIME_ASSET=$asset"
            else
              rm -f "release/public/$asset"
              echo "OPTIONAL_RUNTIME_ASSET_MISSING=$asset"
            fi
          done
          cp "$PLACEMENT_FILE" release/public/naya-509-real-smart-feed-nav-adjacent-placement.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release/public/index.html')
          s=p.read_text(encoding='utf-8')
          script='<script src="/naya-509-real-smart-feed-nav-adjacent-placement.js"></script>'
          if script not in s:
              i=s.rfind('</body>')
              if i<0: raise SystemExit('FINAL_BODY_TAG_MISSING')
              s=s[:i]+script+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
          SOURCE_COMMIT="$GITHUB_SHA"
          SOURCE_HASH=$(sha256sum release/public/index.html | awk '{print $1}')
          PLACEMENT_HASH=$(sha256sum release/public/naya-509-real-smart-feed-nav-adjacent-placement.js | awk '{print $1}')
          echo "EXPECTED_INDEX_SHA256=$SOURCE_HASH" >> "$GITHUB_ENV"
          echo "EXPECTED_PLACEMENT_SHA256=$PLACEMENT_HASH" >> "$GITHUB_ENV"
          cat > release/worker.js <<'EOF'
          export default {async fetch(request,env){const u=new URL(request.url);const spa=u.pathname==='/'||u.pathname==='/index.html'||u.pathname.startsWith('/intelligence/');const r=spa?new Request(new URL('/index.html',request.url),request):request;const x=await env.ASSETS.fetch(r);const h=new Headers(x.headers);h.set('Cache-Control','no-store, no-cache, must-revalidate, max-age=0');h.set('X-NayaNET-Canonical-Source','509-AAA-GITHUB-CHECKPOINT');h.set('X-NayaNET-Source-Commit',env.SOURCE_COMMIT);h.set('X-NayaNET-Source-SHA256',env.SOURCE_HASH);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}}
          EOF
          cat > release/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"worker.js","compatibility_date":"2026-09-08","account_id":"$ACCOUNT_ID","assets":{"directory":"./public","binding":"ASSETS"},"vars":{"SOURCE_COMMIT":"$SOURCE_COMMIT","SOURCE_HASH":"$SOURCE_HASH"}}
          EOF

      - name: Validate checkpoint release
        run: |
          set -euo pipefail
          test -s release/public/index.html
          grep -Fq 'NayaNET' release/public/index.html
          grep -Fq '/naya-509-real-smart-feed-nav-adjacent-placement.js' release/public/index.html
          test -s release/public/naya-509-real-smart-feed-nav-adjacent-placement.js
          echo CHECKPOINT_RELEASE=PASS
          echo CHECKPOINT_SHA=$GITHUB_SHA
          echo EXPECTED_INDEX_SHA256=$EXPECTED_INDEX_SHA256
          echo EXPECTED_PLACEMENT_SHA256=$EXPECTED_PLACEMENT_SHA256

      - name: Deploy checkpoint release
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: release
          command: deploy --config wrangler.jsonc

      - name: Verify exact public runtime bytes
        run: |
          set -u
          fail(){ echo "PUBLIC_CHECKPOINT_VERIFY=FAIL:$1"; exit 1; }
          verified=0
          for attempt in $(seq 1 20); do
            probe="${GITHUB_SHA}-${attempt}-$(date +%s%N)"
            index_code=$(curl -sS -L -o /tmp/live.html -w '%{http_code}' "$RUNTIME/?checkpoint-verify=${probe}" || true)
            actual_index_sha=$(sha256sum /tmp/live.html 2>/dev/null | awk '{print $1}' || true)
            echo "VERIFY_ATTEMPT=$attempt INDEX_HTTP=$index_code INDEX_SHA256=$actual_index_sha EXPECTED=$EXPECTED_INDEX_SHA256"
            if [ "$index_code" = "200" ] && [ "$actual_index_sha" = "$EXPECTED_INDEX_SHA256" ] && grep -Fq '/naya-509-real-smart-feed-nav-adjacent-placement.js' /tmp/live.html; then
              verified=1
              break
            fi
            sleep 3
          done
          [ "$verified" = "1" ] || fail "PUBLIC_RUNTIME_INDEX_HASH_MISMATCH"
          placement_code=$(curl -sS -L -o /tmp/live-placement.js -w '%{http_code}' "$RUNTIME/naya-509-real-smart-feed-nav-adjacent-placement.js?checkpoint-verify=${GITHUB_SHA}-final") || fail "PLACEMENT_CURL"
          actual_placement_sha=$(sha256sum /tmp/live-placement.js | awk '{print $1}')
          echo "PLACEMENT_HTTP=$placement_code PLACEMENT_SHA256=$actual_placement_sha EXPECTED=$EXPECTED_PLACEMENT_SHA256"
          [ "$placement_code" = "200" ] || fail "PLACEMENT_HTTP_$placement_code"
          [ "$actual_placement_sha" = "$EXPECTED_PLACEMENT_SHA256" ] || fail "PLACEMENT_HASH_MISMATCH"
          grep -Fq 'window.Naya509NavAdjacentPlacement' /tmp/live-placement.js || fail "PLACEMENT_SYMBOL_MISSING"
          smart_code=$(curl -sS -L -o /tmp/smart.html -w '%{http_code}' "$SMART_LINK?checkpoint-verify=${GITHUB_SHA}-final") || fail "SMART_LINK_CURL"
          echo "SMART_LINK_HTTP=$smart_code"
          [ "$smart_code" = "200" ] || fail "SMART_LINK_HTTP_$smart_code"
          echo "INDEX_BYTES=$(wc -c < /tmp/live.html)"
          echo "PLACEMENT_BYTES=$(wc -c < /tmp/live-placement.js)"
          echo PUBLIC_CHECKPOINT_RELEASE=PASS
          echo SMART_FEED_ROUTE=PASS
