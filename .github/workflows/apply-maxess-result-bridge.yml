name: Apply MAXESS Assessment Results Bridge

# This workflow mutates repository source and pushes a commit. It is therefore
# an explicitly invoked control-plane action, not an automatic push reaction.
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit authorization to mutate and push the bridge
        required: true
        type: choice
        options:
          - EXPLICIT_APPROVAL_GRANTED
          - DENY

permissions:
  contents: write

concurrency:
  group: maxess-result-bridge
  cancel-in-progress: false

jobs:
  patch:
    if: inputs.approval == 'EXPLICIT_APPROVAL_GRANTED'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Enforce canonical NayaPOWER governance kernel
        shell: bash
        run: |
          set -euo pipefail
          python .naya/control-plane/workflow_gate.py \
            --actor "${{ github.actor }}" \
            --purpose "maxess-result-repository-mutation" \
            --permission "repo:write:maxess-result" \
            --request "mutate:AIScoreMAXESS code:MAXESS_RESULT_BRIDGE_V1" \
            --mission "Apply the MAXESS assessment Results bridge without destroying the existing artifact" \
            --uncertainty 2 \
            --consequence 4 \
            --irreversibility 3 \
            --scope '{"repository":"SoulSchoolAcademy/NayaPOWER","path":"AIScoreMAXESS code","operation":"surgical-write-and-push"}' \
            --evidence "workflow_dispatch approval granted" \
            --evidence "known-good bridge workflow"

      - name: Establish baseline
        run: |
          test -f 'AIScoreMAXESS code'
          git rev-parse HEAD > bridge-baseline-commit.txt
          git rev-parse HEAD:'AIScoreMAXESS code' > bridge-baseline-blob.txt
          wc -c 'AIScoreMAXESS code'

      - name: Apply deterministic bridge mutation
        run: python tools/execute_maxess_result_bridge.py

      - name: Static bridge QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('AIScoreMAXESS code')
          s=p.read_text(encoding='utf-8')
          required=[
            'MAXESS_RESULT_BRIDGE_V1',
            'window.MAXESS_RESULT',
            'MAXESS_RESULT_READY',
            'MAXESS_RESULT_V1',
            'results.nayanet.xyz',
            'overallScore',
            'fiveDimensions',
            'strongestCapability',
            'highestLeverageOpportunity',
            'selectedInterests',
            'nayaScript',
            'nayaAudio',
            'LISTEN TO NAYA',
            'Naya-Profile-black-face-zoom.jpg',
            'refusing legacy Results renderer'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing bridge evidence: '+', '.join(missing))
          if s.count('MAXESS_RESULT_BRIDGE_V1') != 1: raise SystemExit('Bridge marker count failed')
          if re.search(r'(^|\n)(<<<<<<<|=======|>>>>>>>)( |\n|$)',s): raise SystemExit('Conflict marker detected')
          print('ASSESSMENT BRIDGE STATIC QA: PASS')
          print('bytes:',len(s.encode()))
          print('lines:',len(s.splitlines()))
          PY

      - name: Syntax QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('AIScoreMAXESS code').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts:
              raise SystemExit('No script blocks found')
          Path('/tmp/maxess-assessment-scripts.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          print('Extracted script blocks:',len(scripts))
          print('JavaScript bytes:',Path('/tmp/maxess-assessment-scripts.js').stat().st_size)
          PY
          node --check /tmp/maxess-assessment-scripts.js
          echo 'MAXESS ASSESSMENT JAVASCRIPT SYNTAX QA: PASS'

      - name: Diff proof
        run: |
          git diff --check
          if git diff --quiet -- 'AIScoreMAXESS code'; then
            echo 'BRIDGE ALREADY PRESENT IN HEAD — IDEMPOTENT NO-OP'
            git show HEAD:'AIScoreMAXESS code' | grep -Fq 'MAXESS_RESULT_BRIDGE_V1'
            git show HEAD:'AIScoreMAXESS code' | grep -Fq 'window.MAXESS_RESULT'
            git show HEAD:'AIScoreMAXESS code' | grep -Fq 'results.nayanet.xyz'
          else
            echo 'NEW BRIDGE MUTATION DETECTED'
            git diff -- 'AIScoreMAXESS code'
          fi

      - name: Commit bridge when needed
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AIScoreMAXESS code'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NO COMMIT REQUIRED — BRIDGE ALREADY APPLIED'
          else
            git commit -m 'MAXESS assessment → Results bridge [MAXESS_RESULT_V1]'
            git push origin "${GITHUB_REF_NAME}"
          fi
