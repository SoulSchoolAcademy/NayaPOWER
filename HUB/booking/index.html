<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a time — NayaNET</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0b10; color: #f2f0ea; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: #b9b4a8; margin: 0 0 24px; }
  .step { display: none; }
  .step.on { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip, .slot {
    background: #17171f; color: #f2f0ea; border: 1px solid #33333f;
    border-radius: 999px; padding: 10px 16px; cursor: pointer; font-size: 1rem;
  }
  .chip[aria-pressed="true"], .slot[aria-pressed="true"] { border-color: #d4af37; }
  .slot[disabled] { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
  label { display: block; margin: 16px 0 6px; color: #b9b4a8; }
  input, textarea {
    width: 100%; box-sizing: border-box; background: #17171f; color: #f2f0ea;
    border: 1px solid #33333f; border-radius: 10px; padding: 12px; font-size: 1rem;
  }
  .nav { margin-top: 24px; display: flex; gap: 8px; }
  .btn {
    background: #d4af37; color: #14100a; border: 0; border-radius: 999px;
    padding: 12px 22px; font-size: 1rem; cursor: pointer; font-weight: 600;
  }
  .btn.ghost { background: transparent; color: #f2f0ea; border: 1px solid #33333f; }
  .note { color: #b9b4a8; font-size: .9rem; margin-top: 16px; }
  .err { color: #ff9c9c; }
  code { background: #17171f; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Book a time</h1>
  <p class="sub" id="subtitle">One step at a time.</p>

  <section class="step" id="step-state">
    <p id="state-text">Loading…</p>
  </section>

  <section class="step" id="step-day">
    <h2>What day?</h2>
    <div class="chips" id="days"></div>
  </section>

  <section class="step" id="step-time">
    <h2>What time?</h2>
    <div class="chips" id="slots"></div>
    <div class="nav"><button class="btn ghost" data-back="day">Back</button></div>
  </section>

  <section class="step" id="step-who">
    <h2>Who's booking?</h2>
    <label for="visitor-name">Your name</label>
    <input id="visitor-name" autocomplete="name">
    <label for="visitor-note">Anything they should know? (optional)</label>
    <textarea id="visitor-note" rows="3"></textarea>
    <p class="note">We never store your email — if this page ever asks for one,
      it is hashed, the way invites already work here.</p>
    <div class="nav">
      <button class="btn ghost" data-back="time">Back</button>
      <button class="btn" id="to-confirm">Continue</button>
    </div>
  </section>

  <section class="step" id="step-confirm">
    <h2>Confirm</h2>
    <p id="summary"></p>
    <p class="err" id="confirm-error"></p>
    <div class="nav">
      <button class="btn ghost" data-back="who">Back</button>
      <button class="btn" id="do-book">Book it</button>
    </div>
  </section>

  <section class="step" id="step-done">
    <h2>You're booked</h2>
    <p id="done-text"></p>
    <p class="note">Need to cancel? Keep this code — it is the key to your
      booking: <code id="cancel-token"></code></p>
  </section>

  <p class="note" id="plugin-line"></p>
</main>

<script type="module">
import {
  computeSlots, validateBookingRequest, pluginStates,
} from './booking-core.mjs';
import { createBookingStore } from './booking-store.mjs';

// The Hub shell injects window.NayaBookingConfig { supabaseUrl, anonKey,
// getAccessToken } when this page is wired to a live project. Without it
// the page says so — it never invents a page, a window, or a slot.
const cfg = window.NayaBookingConfig || null;
const slug = new URLSearchParams(location.search).get('book') || '';
const $ = (id) => document.getElementById(id);
const show = (id) => {
  document.querySelectorAll('.step').forEach((s) => s.classList.remove('on'));
  $(id).classList.add('on');
};

async function main() {
  show('step-state');
  if (!cfg || !cfg.supabaseUrl || !cfg.anonKey) {
    $('state-text').textContent =
      'This booking page is not wired to a live project yet — nothing here is pretend, so there is nothing to pick from.';
    return;
  }
  if (!slug) {
    $('state-text').textContent = 'This link is missing its booking name.';
    return;
  }
  const store = createBookingStore(cfg);
  const pageRes = await store.getPage(slug);
  if (pageRes.error || !pageRes.page) {
    $('state-text').textContent = 'That booking page is not available.';
    return;
  }
  const page = {
    id: pageRes.page.page_id, page_id: pageRes.page.page_id,
    owner_alias: pageRes.page.owner_alias, title: pageRes.page.title,
    duration_minutes: pageRes.page.duration_minutes,
    calendar_sync_state: pageRes.page.calendar_sync_state,
  };
  $('title').textContent = page.title;
  $('subtitle').textContent = `With ${page.owner_alias} · ${page.duration_minutes} minutes`;
  $('plugin-line').textContent = pluginStates(page)
    .map((p) => `${p.label}: ${p.state.replace('_', ' ')} — ${p.note}`).join(' ');
  const winRes = await store.getWindows(slug);
  const windows = winRes.windows || [];

  const pick = { dateStr: null, slot: null };
  const daysEl = $('days');
  const today = new Date();
  for (let i = 0; i < 14; i++) {
    const d = new Date(today.getTime() + i * 86400000);
    const dateStr = d.toISOString().slice(0, 10);
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    b.addEventListener('click', async () => {
      pick.dateStr = dateStr;
      await renderSlots();
    });
    daysEl.appendChild(b);
  }
  show('step-day');

  async function renderSlots() {
    show('step-time');
    const from = `${pick.dateStr}T00:00:00Z`;
    const to = `${pick.dateStr}T23:59:59Z`;
    const bookedRes = await store.getBookedStarts(slug, from, to);
    const slots = computeSlots({
      windows, booked: bookedRes.booked || [], dateStr: pick.dateStr,
      durationMinutes: page.duration_minutes, nowISO: new Date().toISOString(),
    });
    const el = $('slots');
    el.innerHTML = '';
    if (!slots.length) {
      el.innerHTML = '<p class="note">No times are offered that day.</p>';
      return;
    }
    for (const s of slots) {
      const b = document.createElement('button');
      b.className = 'slot';
      b.textContent = new Date(s.starts_at)
        .toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (!s.available) b.disabled = true;
      b.addEventListener('click', () => { pick.slot = s; show('step-who'); });
      el.appendChild(b);
    }
  }

  document.querySelectorAll('[data-back]').forEach((b) => {
    b.addEventListener('click', () => show(`step-${b.dataset.back}`));
  });

  $('to-confirm').addEventListener('click', () => {
    const name = $('visitor-name').value.trim();
    if (!name) { $('visitor-name').focus(); return; }
    $('summary').textContent =
      `${page.title} — ${new Date(pick.slot.starts_at).toLocaleString()} with ${name}.`;
    $('confirm-error').textContent = '';
    show('step-confirm');
  });

  $('do-book').addEventListener('click', async () => {
    const name = $('visitor-name').value.trim();
    const note = $('visitor-note').value.trim();
    const bookedRes = await store.getBookedStarts(
      slug, pick.slot.starts_at, pick.slot.ends_at);
    const verdict = validateBookingRequest({
      page, windows, booked: bookedRes.booked || [],
      request: {
        visitor_name: name, starts_at: pick.slot.starts_at,
        ends_at: pick.slot.ends_at, note: note || null,
      },
    });
    if (!verdict.ok) {
      $('confirm-error').textContent = verdict.reason === 'slot_taken'
        ? 'That time was just taken — please pick another.'
        : 'That time is no longer available — please pick another.';
      return;
    }
    const created = await store.createBooking(verdict.booking);
    if (!created.ok) {
      $('confirm-error').textContent = created.reason === 'slot_taken'
        ? 'That time was just taken — please pick another.'
        : 'That booking could not be placed.';
      return;
    }
    // Reminders ride the Smart Mail store under a session; deferred is
    // reported, never faked.
    await store.writeReminders(created.booking, page).catch(() => null);
    $('done-text').textContent =
      `${page.title} — ${new Date(created.booking.starts_at).toLocaleString()}. A reminder thread is kept in Smart Mail.`;
    $('cancel-token').textContent = created.booking.cancel_token || '';
    show('step-done');
  });
}

main();
</script>
</body>
</html>
