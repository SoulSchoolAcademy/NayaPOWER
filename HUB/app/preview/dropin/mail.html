<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Mail — Room Preview</title><style>body{margin:0;background:#020202;}/* SMART MAIL — Room. Blue identity. Dark premium, glassmorphism.
   Button law: silver-white at rest, blue ignites on hover/focus.
   Color = stable identity: blue for the room, contact/space colors for avatars. */

.mail-stage{
  --ml-blue:#3b82f6; --ml-blue-lt:#93c5fd;
  --ml-ink:#f4f6fb; --ml-dim:#9aa3b5;
  max-width:1180px; margin:0 auto; padding:36px 24px 90px;
  color:var(--ml-ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;
}

/* header */
.mail-stage .ml-head{ margin:0 0 8px; }
.mail-stage .ml-kicker{
  font-size:11px; letter-spacing:.24em; font-weight:800; color:var(--ml-blue);
  margin:0 0 14px; text-shadow:0 0 14px rgba(59,130,246,.5);
}
.mail-stage .ml-title{
  font-size:clamp(30px,4.4vw,46px); font-weight:900; letter-spacing:-.02em;
  margin:0 0 14px; line-height:1.1; color:#fff;
}
.mail-stage .ml-sub{
  font-size:16px; line-height:1.65; color:#d7dce8; margin:0; max-width:680px; font-weight:500;
}
/* three panes */
.mail-stage .ml-panes{
  display:grid; grid-template-columns:200px 340px 1fr; gap:14px;
  margin:26px 0 0; min-height:480px;
}

/* folder rail — each folder owns its color: inbox blue, unread green, sent purple */
.mail-stage .ml-rail{
  display:flex; flex-direction:column; gap:8px;
  border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:14px;
  background:rgba(14,16,24,.55);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
}
.mail-stage .ml-folder{
  --fc:#3b82f6; --fcl:#93c5fd;
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; border-radius:14px; font-size:11px; font-weight:800; letter-spacing:.14em;
  cursor:pointer; font-family:inherit; color:#fff;
  background:linear-gradient(180deg, #1b1b21, #0b0b0e);
  border:1px solid rgba(232,234,242,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 22px rgba(0,0,0,.55), 0 0 14px -8px var(--fc);
  transition:border-color .22s, box-shadow .25s, transform .15s, background .25s;
}
.mail-stage .ml-folder .ml-ficon{
  width:22px; height:22px; flex:none; color:var(--fcl);
  filter:drop-shadow(0 0 6px var(--fc)) drop-shadow(0 2px 3px rgba(0,0,0,.6));
  transition:filter .25s, transform .2s;
}
.mail-stage .ml-folder .ml-ficon svg{ width:100%; height:100%; display:block; }
.mail-stage .ml-folder .ml-fname{ flex:1; }
.mail-stage .ml-folder:hover, .mail-stage .ml-folder:focus-visible{
  border-color:var(--fc); transform:translateY(-1px); outline:none;
  box-shadow:0 0 20px -6px var(--fc);
}
.mail-stage .ml-folder:hover .ml-ficon, .mail-stage .ml-folder:focus-visible .ml-ficon{
  filter:drop-shadow(0 0 9px var(--fc));
}
.mail-stage .ml-folder.on{
  border-color:var(--fc); color:var(--fcl);
  text-shadow:0 0 12px var(--fc);
  background:linear-gradient(180deg, #232329, #0e0e12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 12px 32px rgba(0,0,0,.6), 0 0 30px -6px var(--fc);
  transform:translateY(-1px);
}
.mail-stage .ml-folder.on .ml-ficon{
  filter:drop-shadow(0 0 11px var(--fc));
  transform:translateY(-1px) scale(1.08);
}
.mail-stage .ml-badge{
  min-width:24px; height:24px; padding:0 7px; border-radius:99px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:900; color:#060a14;
  background:radial-gradient(circle at 35% 30%, #d1fae5, #34d399 60%, #059669);
  box-shadow:0 0 14px rgba(52,211,153,.8), 0 2px 6px rgba(0,0,0,.4);
}

/* thread list */
.mail-stage .ml-listcol{ display:flex; flex-direction:column; gap:10px; min-height:0; }
.mail-stage .ml-searchbar{
  display:flex; align-items:center; gap:10px; flex:none;
  border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:10px 14px;
  background:rgba(0,0,0,.35);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,255,255,.05);
}
.mail-stage .ml-searchbar:focus-within{ border-color:rgba(59,130,246,.6); box-shadow:inset 0 2px 8px rgba(0,0,0,.5), 0 0 16px -6px var(--ml-blue); }
.mail-stage .ml-searchicon{ width:16px; height:16px; flex:none; color:var(--ml-dim); }
.mail-stage .ml-searchicon svg{ width:100%; height:100%; display:block; }
.mail-stage .ml-searchin{
  flex:1; min-width:0; background:transparent; border:0; outline:none;
  font-family:inherit; font-size:13.5px; color:#fff;
}
.mail-stage .ml-searchin::placeholder{ color:var(--ml-dim); }
.mail-stage .ml-list{
  flex:1; min-height:0;
  display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height:640px;
  border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:12px;
  background:rgba(14,16,24,.55);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
}
.mail-stage .ml-empty{ color:var(--ml-dim); font-size:14px; padding:24px 12px; text-align:center; }
.mail-stage .ml-thread{
  position:relative; display:flex; gap:12px; align-items:flex-start;
  padding:14px; border-radius:14px; text-align:left; cursor:pointer; font-family:inherit;
  color:#fff;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  border:2px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 4px 14px rgba(0,0,0,.35);
  transition:border-color .22s, box-shadow .25s, transform .15s, background .22s;
  width:100%;
}
.mail-stage .ml-thread:hover, .mail-stage .ml-thread:focus-visible{
  border-color:rgba(59,130,246,.55); transform:translateY(-2px); outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 10px 26px rgba(0,0,0,.45), 0 0 22px -8px var(--ml-blue);
}
.mail-stage .ml-thread.sel{
  border:2px solid var(--ml-blue);
  background:linear-gradient(180deg, rgba(59,130,246,.1), rgba(59,130,246,.04));
  box-shadow:inset 0 1px rgba(255,255,255,.1), 0 10px 28px rgba(0,0,0,.45), 0 0 26px -6px var(--ml-blue);
}
/* avatars — true balls: radial sphere, specular highlight top-left,
   deep contact-color aura. */
.mail-stage .ml-avatar{
  flex:none; width:40px; height:40px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:900; color:#060a14;
  background:var(--pc,#8b93a3);
  background:radial-gradient(circle at 32% 28%,
    rgba(255,255,255,.95) 0%,
    color-mix(in srgb, var(--pc,#8b93a3) 35%, #ffffff) 24%,
    var(--pc,#8b93a3) 58%,
    color-mix(in srgb, var(--pc,#8b93a3) 48%, #000000) 100%);
  box-shadow:0 6px 18px -4px color-mix(in srgb, var(--pc,#8b93a3) 70%, transparent),
             inset 0 -6px 12px rgba(0,0,0,.35),
             inset 0 3px 6px rgba(255,255,255,.3);
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}
.mail-stage .ml-avatar.sm{ width:34px; height:34px; font-size:13px; }
.mail-stage .ml-thread-mid{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.mail-stage .ml-thread-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.mail-stage .ml-thread-from{ font-size:12.5px; font-weight:800; }
.mail-stage .ml-thread.unread .ml-thread-from{ color:#a7f3d0; }
.mail-stage .ml-thread-time{ font-size:11px; color:var(--ml-dim); flex:none; font-variant-numeric:tabular-nums; }
.mail-stage .ml-thread-subj{ font-size:13.5px; font-weight:700; color:#fff; }
.mail-stage .ml-thread-snip{
  font-size:12.5px; color:var(--ml-dim); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.mail-stage .ml-dot{
  position:absolute; top:14px; right:14px; width:10px; height:10px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #d1fae5, #34d399 55%, #059669);
  box-shadow:0 0 12px #34d399, 0 0 4px rgba(52,211,153,.9);
}
.mail-stage .ml-chip{
  align-self:center; flex:none; font-size:9px; font-weight:800; letter-spacing:.14em;
  color:var(--ml-blue-lt); background:rgba(59,130,246,.1);
  border:1px solid rgba(59,130,246,.55); border-radius:99px; padding:4px 10px;
  text-shadow:0 0 8px rgba(59,130,246,.6);
}
.mail-stage .ml-count{
  align-self:center; flex:none; min-width:24px; height:24px; padding:0 7px; border-radius:99px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:900; color:var(--ml-blue-lt);
  background:rgba(59,130,246,.12); border:1px solid rgba(59,130,246,.5);
  box-shadow:0 0 10px -2px var(--ml-blue), inset 0 1px 0 rgba(255,255,255,.15);
}

/* reading pane */
.mail-stage .ml-read{
  border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:30px 32px;
  background:rgba(14,16,24,.55);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  box-shadow:inset 0 1px rgba(255,255,255,.06), 0 22px 55px rgba(0,0,0,.5);
  overflow-y:auto; max-height:640px;
}
.mail-stage .ml-read-empty{ color:var(--ml-dim); font-size:15px; text-align:center; padding:60px 20px; }
.mail-stage .ml-read-subj{ font-size:clamp(20px,2.6vw,28px); font-weight:900; margin:0 0 18px; color:#fff; line-height:1.3; text-shadow:0 2px 18px rgba(0,0,0,.5); }
.mail-stage .ml-read-subj:focus{ outline:none; }
.mail-stage .ml-read-meta{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid rgba(255,255,255,.08); }
/* the conversation: each message its own sculpted card */
.mail-stage .ml-msg{
  border:1px solid rgba(255,255,255,.09); border-radius:16px;
  padding:18px 20px; margin:0 8% 14px 0;
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 22px rgba(0,0,0,.4);
}
.mail-stage .ml-msg.mine{
  margin:0 0 14px 8%;
  border-color:rgba(59,130,246,.35);
  background:linear-gradient(180deg, rgba(59,130,246,.1), rgba(59,130,246,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 8px 22px rgba(0,0,0,.4), 0 0 20px -10px var(--ml-blue);
}
.mail-stage .ml-msg-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.mail-stage .ml-msg-who{ display:flex; flex-direction:column; gap:2px; }
.mail-stage .ml-msg-from{ font-size:13px; font-weight:800; }
.mail-stage .ml-msg-date{ font-size:11px; color:var(--ml-dim); font-variant-numeric:tabular-nums; }
.mail-stage .ml-msg-body{ font-size:14.5px; line-height:1.7; color:#dde2ee; }
.mail-stage .ml-msg-body p{ margin:0 0 12px; }
.mail-stage .ml-msg-body p:last-child{ margin-bottom:0; }
.mail-stage .ml-read-to{ font-size:12px; color:var(--ml-dim); }
.mail-stage .ml-read-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }

/* buttons — obsidian black (Shawn, 2026-10-02): black with depth —
   top-light edge and deep shadow — never grey. Color ignites on hover. */
.mail-stage .ml-btn, .mail-stage .ml-compose{
  padding:10px 24px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.14em;
  cursor:pointer; font-family:inherit; color:#fff;
  background:linear-gradient(180deg, #1c1c22, #0a0a0d);
  border:1px solid rgba(232,234,242,.35);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 22px rgba(0,0,0,.55);
  transition:border-color .22s, box-shadow .25s, transform .15s, color .22s;
}
.mail-stage .ml-btn:hover, .mail-stage .ml-btn:focus-visible,
.mail-stage .ml-compose:hover, .mail-stage .ml-compose:focus-visible{
  border-color:var(--ml-blue); color:var(--ml-blue-lt); transform:translateY(-2px); outline:none;
  text-shadow:0 0 12px rgba(59,130,246,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 10px 28px rgba(0,0,0,.6), 0 0 26px -6px var(--ml-blue);
}
.mail-stage .ml-btn:disabled{ opacity:.55; cursor:default; transform:none; }
.mail-stage .ml-btn.primary{ border-color:rgba(147,197,253,.55); }
.mail-stage .ml-btn.danger[data-arm="1"]{
  border-color:#f87171; color:#fca5a5;
  text-shadow:0 0 12px rgba(248,113,113,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 22px rgba(0,0,0,.55), 0 0 26px -6px #f87171;
}
.mail-stage .ml-compose{
  position:fixed; bottom:28px; right:28px; z-index:40; padding:14px 30px;
  border-color:rgba(147,197,253,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 10px 30px rgba(0,0,0,.6), 0 0 30px -8px var(--ml-blue);
}

/* compose modal */
.mail-stage .ml-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.mail-stage .ml-modal{
  max-width:600px; width:100%; max-height:88vh; overflow:auto;
  background:rgba(16,19,30,.94);
  -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px);
  border:2px solid rgba(59,130,246,.5); border-radius:24px; padding:32px;
  box-shadow:0 40px 120px rgba(0,0,0,.75), 0 0 60px -12px var(--ml-blue);
}
.mail-stage .ml-modal-title{ font-size:13px; font-weight:800; letter-spacing:.2em; color:var(--ml-blue-lt); margin:0 0 22px; }
.mail-stage .ml-field{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.mail-stage .ml-field-l{ font-size:10px; font-weight:800; letter-spacing:.16em; color:var(--ml-dim); }
.mail-stage .ml-input{
  font-family:inherit; font-size:14px; color:#fff; padding:12px 16px; border-radius:12px;
  background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.14);
  transition:border-color .2s, box-shadow .2s;
}
.mail-stage .ml-input:focus{ border-color:var(--ml-blue); outline:none; box-shadow:0 0 16px -4px var(--ml-blue); }
.mail-stage textarea.ml-input{ resize:vertical; min-height:120px; line-height:1.6; }
.mail-stage select.ml-input option, .mail-stage select.ml-input optgroup{ background:#10131e; }
.mail-stage .ml-err{ font-size:13px; color:#f87171; margin:0 0 14px; }
.mail-stage .ml-modal-row{ display:flex; gap:10px; flex-wrap:wrap; }

/* responsive */
@media(max-width:760px){
  .mail-stage{ padding:28px 16px 110px; }
  .mail-stage .ml-panes{ grid-template-columns:1fr; }
  .mail-stage .ml-rail{ flex-direction:row; overflow-x:auto; }
  .mail-stage .ml-folder{ flex:1; white-space:nowrap; }
  .mail-stage .ml-list{ max-height:320px; }
  .mail-stage .ml-read{ max-height:none; padding:24px 20px; }
  .mail-stage .ml-compose{ bottom:18px; right:18px; }
}

/* reduced motion: the room goes still — no transitions, no animation */
@media (prefers-reduced-motion: reduce){
  .mail-stage *{ animation:none !important; transition:none !important; }
}
