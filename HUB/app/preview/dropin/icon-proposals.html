<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Jewel Icon Proposals — Smart Mail</title>
<style>
body{background:#050507;color:#fff;font-family:sans-serif;padding:40px;margin:0}
h1{font-size:20px;margin-bottom:8px} p{color:#999;font-size:14px;margin-bottom:30px}
.row{display:flex;gap:40px;flex-wrap:wrap;margin-bottom:40px}
.cell{text-align:center}.cell .lbl{font-size:12px;color:#888;margin-top:10px;max-width:140px}
.jewel{width:72px;height:72px}
h2{font-size:14px;color:#9d75ff;margin:30px 0 16px;text-transform:uppercase;letter-spacing:2px}
</style></head><body>
<h1>Jewel icon proposals — Smart Mail</h1>
<p>Rendered with the production jewel renderer (radial-gradient sphere + white glyph). Current production glyph first, then candidates.</p>
<h2>Mail — current vs candidates</h2>
<div class="row" id="mailrow"></div>
<h2>Also refreshed for congruence — Spaces / Library / Connections</h2>
<div class="row" id="otherrow"></div>
<script>
let __jewelSeq=0;
function icon(name,glyph,color){
  const id='jewel'+(++__jewelSeq);
  return `<svg class="jewel" viewBox="0 0 24 24" aria-hidden="true"><defs>`
  +`<radialGradient id="${id}" cx="35%" cy="30%" r="78%"><stop offset="0%" stop-color="#ffffff"/><stop offset="38%" stop-color="${color}"/><stop offset="100%" stop-color="#0a0612"/></radialGradient>`
  +`<filter id="${id}-g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.7"/></filter></defs>`
  +`<circle cx="12" cy="12" r="8.6" fill="url(#${id})" filter="url(#${id}-g)" opacity="0.6"/>`
  +`<circle cx="12" cy="12" r="6.8" fill="url(#${id})"/>`
  +`<circle cx="12" cy="12" r="6.8" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>`
  +`<ellipse cx="9.5" cy="8.9" rx="2.5" ry="1.6" fill="#ffffff" opacity="0.92" transform="rotate(-24 9.5 8.9)"/>`
  +`<g transform="translate(8.6,8.6) scale(0.283)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${glyph}</g></svg>`;
}
const BLUE='#4d9fff';
// current production glyphs
const curMail='<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4 8l8 6 8-6"/>';
const curSpaces='<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/>';
const curLibrary='<path d="M4 5h7v14H4zM13 5h7v14h-7z"/><path d="M4 9h7M13 9h7"/>';
// candidates — mail
const mailV2='<rect x="4" y="6.5" width="16" height="11.5" rx="2.5"/><path d="M5 8.5L12 13.5L19 8.5"/><circle cx="12" cy="12.5" r="2.4" fill="#ffffff" stroke="none"/><circle cx="12" cy="12.5" r="2.4"/>';
const mailV3='<path d="M3.5 7.5L12 13l8.5-5.5"/><rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M8 7.5V4.8c0-.8.6-1.3 1.3-1.3h5.4c.7 0 1.3.5 1.3 1.3v2.7"/><path d="M10 5.5h4"/>';
const mailV4='<path d="M21 3L10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8z"/><path d="M10.5 13.5L21 3"/>';
// candidates — others (lighter touch)
const spacesV2='<path d="M12 2.8l8.2 4.6v9.2L12 21.2l-8.2-4.6V7.4z"/><path d="M12 12l8.2-4.6M12 12L3.8 7.4M12 12v9.2"/><circle cx="12" cy="12" r="1.6" fill="#ffffff" stroke="none"/>';
const libV2='<path d="M5 4.5C5 4.5 7 4 9 4c1.5 0 2 .5 3 .5v14c-1 0-1.5-.5-3-.5-2 0-4 .5-4 .5z"/><path d="M19 4.5c0 0-2-.5-4-.5-1.5 0-2 .5-3 .5v14c1 0 1.5-.5 3-.5 2 0 4 .5 4 .5z"/><path d="M12 4.5v14"/>';
function cell(parent, glyph, color, label){
  const d=document.createElement('div');d.className='cell';
  d.innerHTML=icon('',glyph,color)+`<div class="lbl">${label}</div>`;
  parent.appendChild(d);
}
const mr=document.getElementById('mailrow'), orr=document.getElementById('otherrow');
cell(mr,curMail,BLUE,'CURRENT production mail');
cell(mr,mailV2,BLUE,'V2 — envelope + wax seal');
cell(mr,mailV3,BLUE,'V3 — envelope + rising letter');
cell(mr,mailV4,BLUE,'V4 — paper plane');
cell(orr,curSpaces,'#22d3ee','CURRENT spaces');
cell(orr,spacesV2,'#22d3ee','V2 — cube + heart dot');
cell(orr,curLibrary,'#a78bfa','CURRENT library');
cell(orr,libV2,'#a78bfa','V2 — open book');
</script></body></html>
