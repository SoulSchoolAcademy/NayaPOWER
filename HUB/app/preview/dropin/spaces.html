<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Spaces — Room Preview</title><style>body{margin:0;background:#020202;}/* SMART SPACES — living rooms inside NayaNET.
   Violet room chrome #8b5cf6; each space carries ITS OWN identity color (--sc).
   Obsidian buttons, living depth, ball avatars. Type floor 16px/11px. */

.sp-stage{
  --sp-violet:#8b5cf6; --sp-violet-lt:#c4b5fd; --sp-dim:#a09a8a;
  max-width:1180px; margin:0 auto; padding:36px 24px 90px; color:#f5f2ea;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;
}
.sp-stage .sp-head{ margin:0 0 8px; }
.sp-stage .sp-kicker{
  font-size:11px; letter-spacing:.24em; font-weight:800; color:var(--sp-violet);
  margin:0 0 14px; text-shadow:0 0 14px rgba(139,92,246,.6);
}
.sp-stage .sp-title{
  font-size:clamp(30px,4.4vw,46px); font-weight:900; letter-spacing:-.02em;
  margin:0 0 14px; line-height:1.1; color:#fff;
}
.sp-stage .sp-sub{
  font-size:16px; line-height:1.65; color:#d8d3c4; margin:0; max-width:640px; font-weight:500;
}
.sp-stage .sp-demo{
  display:inline-block; margin:16px 0 0; padding:7px 14px; border-radius:99px;
  font-size:10px; font-weight:800; letter-spacing:.16em; color:var(--sp-violet-lt);
  background:rgba(139,92,246,.08); border:1px solid rgba(139,92,246,.45);
  text-shadow:0 0 10px rgba(139,92,246,.6);
}
.sp-stage .sp-body{ margin-top:26px; min-height:300px; }
.sp-stage .sp-empty{ color:var(--sp-dim); font-size:16px; padding:24px 0; }

/* ---------- obsidian buttons (violet ignition) ---------- */
.sp-stage .sp-create, .sp-stage .sp-back, .sp-stage .sp-addppl,
.sp-stage .sp-mailspace, .sp-stage .sp-btn, .sp-stage .sp-padd{
  padding:12px 26px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.14em;
  cursor:pointer; font-family:inherit; color:#fff;
  background:linear-gradient(180deg, #1b1b21, #0b0b0e);
  border:1px solid rgba(232,234,242,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 22px rgba(0,0,0,.55);
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  transition:border-color .22s, box-shadow .25s, color .22s, transform .15s, opacity .2s;
}
.sp-stage .sp-create:hover, .sp-stage .sp-back:hover, .sp-stage .sp-addppl:hover,
.sp-stage .sp-mailspace:hover, .sp-stage .sp-btn.primary:hover, .sp-stage .sp-padd:hover,
.sp-stage .sp-create:focus-visible, .sp-stage .sp-back:focus-visible,
.sp-stage .sp-addppl:focus-visible, .sp-stage .sp-mailspace:focus-visible,
.sp-stage .sp-btn.primary:focus-visible, .sp-stage .sp-padd:focus-visible{
  border-color:var(--sp-violet); color:var(--sp-violet-lt); outline:none; transform:translateY(-2px);
  text-shadow:0 0 12px rgba(139,92,246,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 10px 28px rgba(0,0,0,.6),
    0 0 26px -6px var(--sp-violet);
}
.sp-stage .sp-btn:disabled, .sp-stage .sp-send:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
.sp-stage .sp-create{ border-color:rgba(196,181,253,.5); }

/* ---------- GRID ---------- */
.sp-stage .sp-gridhead{ display:flex; align-items:center; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.sp-stage .sp-gridhint{ font-size:12px; color:var(--sp-dim); letter-spacing:.06em; }
.sp-stage .sp-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.sp-stage .sp-card{
  position:relative; overflow:hidden; cursor:pointer;
  border:2px solid rgba(255,255,255,.35); border-radius:22px; padding:26px 28px;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)),
    rgba(13,11,10,.62);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  box-shadow:inset 0 1px rgba(255,255,255,.09), 0 22px 55px rgba(0,0,0,.55);
  transition:transform .22s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .3s;
  animation:spcardin .5s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc(var(--i,0) * .07s);
}
@keyframes spcardin{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
.sp-stage .sp-card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
  background:var(--sc); box-shadow:0 0 20px var(--sc);
  animation:spbar 3.2s ease-in-out infinite;
  animation-delay:calc(var(--i,0) * .3s);
}
@keyframes spbar{ 0%,100%{ opacity:.7;} 50%{ opacity:1; box-shadow:0 0 30px var(--sc);} }
.sp-stage .sp-card:hover, .sp-stage .sp-card:focus-visible{
  transform:translateY(-3px); outline:none;
  border-color:var(--sc);
  box-shadow:inset 0 1px rgba(255,255,255,.12), 0 28px 65px rgba(0,0,0,.6),
             0 0 44px -6px var(--sc);
}
.sp-stage .sp-card-top{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.sp-stage .sp-jewel{ font-size:20px; color:var(--sc); text-shadow:0 0 14px var(--sc); }
.sp-stage .sp-card-name{ font-size:20px; font-weight:800; margin:0; color:#fff; flex:1; }
.sp-stage .sp-demo-chip{
  font-size:9px; font-weight:800; letter-spacing:.14em; color:var(--sp-violet-lt);
  background:rgba(139,92,246,.1); border:1px solid rgba(139,92,246,.6); border-radius:99px; padding:4px 10px;
  text-shadow:0 0 8px rgba(139,92,246,.7); white-space:nowrap;
}
.sp-stage .sp-demo-chip.sm{ padding:3px 8px; }
.sp-stage .sp-card-desc{ font-size:16px; line-height:1.6; color:#d8d3c4; margin:0 0 16px; font-weight:500; }
.sp-stage .sp-card-members{ display:flex; align-items:center; gap:8px; }
.sp-stage .sp-mdot{
  width:22px; height:22px; border-radius:50%; display:inline-block; flex:none;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%,
    color-mix(in srgb, var(--mc,#888888) 35%, #fff) 24%,
    var(--mc,#888888) 58%,
    color-mix(in srgb, var(--mc,#888888) 48%, #000) 100%);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.35), inset 0 2px 4px rgba(255,255,255,.4),
    0 0 8px var(--mc,#888888);
}
.sp-stage .sp-card-count{ font-size:12px; color:var(--sp-dim); margin-left:6px; }

/* ---------- DETAIL: dense conversation feed ----------
   Research (Discord + WhatsApp, 2026-10-02): the feel of a group is density.
   Messages are tight rows, not cards. Header is slim. Composer is sticky. */
.sp-stage .sp-detail{ display:flex; flex-direction:column; min-height:70vh; }

/* slim header bar */
.sp-stage .sp-dbar{
  display:flex; align-items:center; gap:12px; padding:10px 4px;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky; top:0; z-index:5;
  background:rgba(10,10,12,.88);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
}
.sp-stage .sp-dback{
  width:36px; height:36px; border-radius:50%; flex:none; cursor:pointer;
  font-size:16px; color:#fff; font-family:inherit;
  background:linear-gradient(180deg,#1b1b21,#0b0b0e);
  border:1px solid rgba(232,234,242,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 18px rgba(0,0,0,.5);
  transition:border-color .2s, transform .15s;
}
.sp-stage .sp-dback:hover{ border-color:var(--sp-violet); transform:translateY(-1px); }
.sp-stage .sp-dbar-t{ flex:1; min-width:0; }
.sp-stage .sp-dbar-n{ font-size:17px; font-weight:800; color:#fff; display:flex; align-items:center; gap:8px; }
.sp-stage .sp-dbar-m{
  font-size:12px; color:var(--sp-dim); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sp-stage .sp-dbar-a{ display:flex; gap:8px; flex:none; }
.sp-stage .sp-dact{
  padding:8px 14px; border-radius:999px; font-size:10px; font-weight:800;
  letter-spacing:.12em; cursor:pointer; font-family:inherit; color:#fff;
  background:linear-gradient(180deg,#1b1b21,#0b0b0e);
  border:1px solid rgba(232,234,242,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 18px rgba(0,0,0,.5);
  transition:border-color .2s, color .2s, transform .15s;
}
.sp-stage .sp-dact:hover{ border-color:var(--sp-violet); color:var(--sp-violet-lt); transform:translateY(-1px); }

/* topic: one quiet line */
.sp-stage .sp-dtopic{
  font-size:13px; color:var(--sp-dim); margin:10px 4px 0; line-height:1.5;
}
.sp-stage .sp-dtopic-b{ color:var(--sp-violet-lt); }

/* the feed: tight rows, no card chrome */
.sp-stage .sp-feed{
  display:flex; flex-direction:column; padding:6px 4px 12px; flex:1;
}
.sp-stage .sp-fdiv{
  display:flex; align-items:center; gap:12px; margin:14px 0 6px;
}
.sp-stage .sp-fdiv-l{ flex:1; height:1px; background:rgba(255,255,255,.08); }
.sp-stage .sp-fdiv-t{
  font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--sp-dim);
  text-transform:uppercase;
}
.sp-stage .sp-frow{
  display:flex; gap:10px; padding:5px 6px; border-radius:10px; align-items:flex-start;
  transition:background .15s;
}
.sp-stage .sp-frow:hover{ background:rgba(255,255,255,.025); }
.sp-stage .sp-frow.cont{ padding-left:50px; } /* aligned under text, avatar column skipped */
.sp-stage .sp-frow.mine{ background:rgba(139,92,246,.05); }
.sp-stage .sp-frow.mine:hover{ background:rgba(139,92,246,.08); }
.sp-stage .sp-fmain{ flex:1; min-width:0; }
.sp-stage .sp-fmeta{ display:flex; align-items:baseline; gap:8px; margin-bottom:1px; }
.sp-stage .sp-fauthor{ font-size:13px; font-weight:800; letter-spacing:.02em; }
.sp-stage .sp-ftime{
  font-size:11px; font-weight:600; color:var(--sp-dim);
  font-variant-numeric:tabular-nums;
}
.sp-stage .sp-fdemo{
  font-size:9px; font-weight:800; letter-spacing:.1em; color:var(--sp-violet-lt);
  border:1px solid rgba(139,92,246,.4); border-radius:999px; padding:1px 7px;
  opacity:.75;
}
.sp-stage .sp-ftext{ font-size:15px; line-height:1.55; color:#e8e4d8; margin:0; overflow-wrap:break-word; }
.sp-stage .sp-fempty{ font-size:14px; color:var(--sp-dim); text-align:center; padding:28px 0; }

/* ball avatars: specular spheres, color = stable identity */
.sp-stage .sp-avatar{
  width:44px; height:44px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:800; color:#0a0a0c;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%,
    color-mix(in srgb, var(--av,#888888) 35%, #fff) 24%,
    var(--av,#888888) 58%,
    color-mix(in srgb, var(--av,#888888) 48%, #000) 100%);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.35), inset 0 4px 8px rgba(255,255,255,.4),
    0 0 14px var(--av,#888888);
}
.sp-stage .sp-avatar.sm{ width:34px; height:34px; font-size:11px; }
/* ball avatar, extra-small for the dense feed */
.sp-stage .sp-avatar.xs{ width:30px; height:30px; font-size:10px; }

/* sticky composer */
.sp-stage .sp-composer{
  position:sticky; bottom:0; z-index:5;
  display:flex; align-items:flex-end; gap:10px;
  padding:12px 4px 4px;
  background:linear-gradient(180deg, transparent, rgba(10,10,12,.92) 30%);
}
.sp-stage .sp-composer .sp-ta{
  flex:1; min-height:44px; max-height:140px;
  background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.14); border-radius:22px;
  color:#fff; font-size:16px; line-height:1.5; padding:11px 18px; font-family:inherit;
  resize:none; transition:border-color .22s, box-shadow .22s;
}
.sp-stage .sp-composer .sp-ta:focus{ outline:none; border-color:var(--sp-violet); box-shadow:0 0 18px -4px var(--sp-violet); }
.sp-stage .sp-composer .sp-ta::placeholder{ color:#6b665c; }
.sp-stage .sp-composer .sp-send{ flex:none; margin-bottom:2px; }
.sp-stage .sp-send{
  padding:12px 28px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.14em;
  cursor:pointer; font-family:inherit; color:#fff;
  background:linear-gradient(180deg,#1b1b21,#0b0b0e);
  border:1px solid rgba(232,234,242,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 14px 30px rgba(0,0,0,.6);
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  transition:border-color .22s, box-shadow .25s, color .22s, transform .15s, opacity .2s;
}
.sp-stage .sp-send:not(:disabled):hover, .sp-stage .sp-send:not(:disabled):focus-visible{
  border-color:var(--sp-violet); color:var(--sp-violet-lt); outline:none; transform:translateY(-1px);
  text-shadow:0 0 12px rgba(139,92,246,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 16px 34px rgba(0,0,0,.65),
    0 0 26px -6px var(--sp-violet);
}

/* legacy composer block (kept for reference, unused by detailView) */
.sp-stage .sp-compose{
  border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:20px; margin-top:14px;
  background:rgba(255,255,255,.02);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
}

/* ---------- modals ---------- */
.sp-stage .sp-overlay{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.6); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  padding:20px;
}
.sp-stage .sp-modal{
  width:100%; max-width:480px; max-height:86vh; overflow-y:auto;
  border-radius:22px; padding:28px;
  background:linear-gradient(180deg, #17171c, #0b0b0e);
  border:1px solid rgba(232,234,242,.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 24px 70px rgba(0,0,0,.7),
    0 0 40px -10px var(--sp-violet);
}
.sp-stage .sp-modal-title{ font-size:20px; font-weight:900; color:#fff; margin:0 0 6px; letter-spacing:.02em; }
.sp-stage .sp-modal-sub{ font-size:14px; color:var(--sp-dim); margin:0 0 18px; }
.sp-stage .sp-field{ display:block; margin-bottom:16px; }
.sp-stage .sp-flabel{
  display:block; font-size:11px; font-weight:800; letter-spacing:.14em; color:#fff; margin-bottom:8px;
}
.sp-stage .sp-input{
  width:100%; box-sizing:border-box; font-family:inherit;
  background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.16); border-radius:12px;
  color:#fff; font-size:16px; padding:12px 14px;
  transition:border-color .22s, box-shadow .22s;
}
.sp-stage .sp-input:focus{ outline:none; border-color:var(--sp-violet); box-shadow:0 0 16px -4px var(--sp-violet); }
.sp-stage .sp-input::placeholder{ color:#6b665c; }
.sp-stage select.sp-input option{ background:#141416; }
.sp-stage .sp-modal-row{ display:flex; justify-content:flex-end; gap:12px; margin-top:20px; }

/* add-people list */
.sp-stage .sp-plist{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
.sp-stage .sp-prow{
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  border:1px solid rgba(255,255,255,.1); border-radius:14px; background:rgba(255,255,255,.02);
}
.sp-stage .sp-ptx{ display:flex; flex-direction:column; gap:2px; flex:1; }
.sp-stage .sp-pname{ font-size:16px; font-weight:700; color:#fff; }
.sp-stage .sp-prole{ font-size:12px; color:var(--sp-dim); }
.sp-stage .sp-padd{ padding:8px 18px; }

.sp-stage .sp-foot{
  margin:34px 0 0; padding-top:20px; text-align:center;
  font-size:11px; letter-spacing:.1em; color:var(--sp-dim);
  border-top:1px solid rgba(255,255,255,.08);
}

@media(max-width:760px){
  .sp-stage{ padding:28px 16px 70px; }
  .sp-stage .sp-grid{ grid-template-columns:1fr; }
  .sp-stage .sp-dhero{ padding:22px 20px; }
  .sp-stage .sp-card{ padding:22px 20px 22px 26px; }
  .sp-stage .sp-modal{ padding:22px 20px; }
}

/* Reduced motion: still everything, never moving. */
@media (prefers-reduced-motion: reduce){
  .sp-stage *{ animation:none !important; transition:none !important; }
}

/* last-message preview: the grid shows life — latest message per space */
.sp-stage .sp-card-preview{
  margin:14px 0 0; font-size:14px; line-height:1.5; color:#b9b3a6;
  border-top:1px solid rgba(255,255,255,.08); padding-top:12px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.sp-stage .sp-card-preview-who{ color:#fff; font-weight:700; }

  var CUSTOM_KEY = 'naya.smartspaces.custom';
  var LASTOPEN_KEY = 'naya.smartspaces.lastOpen'; /* return to your conversation */
  var PALETTE = ['#8b5cf6','#22d3ee','#ec4899','#a3e635','#facc15','#38bdf8','#fb923c'];

  function fmtTime(ts){
    if(!ts) return '';
    var d = new Date(ts);
    if(isNaN(d)) return '';
    var diff = Date.now() - d.getTime();
    var m = Math.floor(diff/60000);
    if(m < 1) return 'just now';
    if(m < 60) return m + 'm ago';
    var h = Math.floor(m/60);
    if(h < 24) return h + 'h ago';
    return Math.floor(h/24) + 'd ago';
  }
  function esc(s){ return String(s == null ? '' : s); }

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      var v = raw ? JSON.parse(raw) : fallback;
      return v === undefined ? fallback : v;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }
  function loadPosts(){ var p = loadJSON(STORE_KEY, {}); return (p && typeof p === 'object') ? p : {}; }

  function initials(name){
    return String(name || '').split(/\s+/).map(function(w){ return w[0]; })
      .join('').slice(0,2).toUpperCase();
  }
  function colorFor(id){
    var h = 0, s = String(id || '');
    for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) % 997; }
    return PALETTE[h % PALETTE.length];
  }

  function SmartSpaces(el, ctx){
    ctx = ctx || {};
    var seeded = Array.isArray(ctx.spaces) ? ctx.spaces : [];
    var ctxContacts = Array.isArray(ctx.contacts) ? ctx.contacts : [];
    var me = ctx.me || null;
    var onMail = (typeof ctx.onMail === 'function') ? ctx.onMail : null;
    var onCompose = (typeof ctx.onCompose === 'function') ? ctx.onCompose : null;
    var posts = loadPosts();

    /* ---------- people: shared spine first, ctx.contacts as fallback ---------- */
    function allPeople(){
      var out = [], seen = {};
      function push(p){
        if(!p || !p.id || seen[p.id]) return;
        seen[p.id] = 1;
        out.push({id:p.id, name:p.name || p.id, role:p.role || '', color:p.color || '#888888'});
      }
      try{
        if(window.NayaPeople && typeof window.NayaPeople.load === 'function'){
          (window.NayaPeople.load() || []).forEach(push);
        }
      }catch(e){}
      ctxContacts.forEach(push);
      seeded.forEach(function(s){
        (s.members || []).forEach(push);
      });
      return out;
    }
    function personById(id){
      var found = null;
      allPeople().forEach(function(p){ if(p.id === id) found = p; });
      return found;
    }
    function myName(){
      if(me){ var p = personById(me); if(p) return p.name; }
      return 'You';
    }

    /* ---------- spaces: seeded + user-created ---------- */
    function customSpaces(){ return loadJSON(CUSTOM_KEY, []); }
    function effectiveSpaces(){
      var out = seeded.slice();
      customSpaces().forEach(function(c){
        if(!c || !c.id) return;
        out.push({
          id: c.id, name: c.name || 'Untitled space',
          color: c.color || colorFor(c.id),
          desc: c.topic || '',
          topic: c.topic || '', block: c.block || null,
          memberIds: c.memberIds || [],
          custom: true, demo: false
        });
      });
      return out;
    }
    function spaceById(id){
      var found = null;
      effectiveSpaces().forEach(function(s){ if(s.id === id) found = s; });
      return found;
    }
    function memberOverrides(){ return loadJSON(MEMBER_KEY, {}); }
    function effectiveMembers(space){
      var out = [], seen = {};
      function push(p){
        if(!p || !p.id || seen[p.id]) return;
        seen[p.id] = 1;
        out.push({id:p.id, name:p.name || p.id, role:p.role || '', color:p.color || '#888888'});
      }
      (space.members || []).forEach(push);                    /* seeded members */
      (space.memberIds || []).forEach(function(id){ push(personById(id)); }); /* custom space members */
      ((memberOverrides()[space.id]) || []).forEach(function(id){ push(personById(id)); }); /* added later */
      return out;
    }
    function addMember(spaceId, personId){
      var ov = memberOverrides();
      var arr = Array.isArray(ov[spaceId]) ? ov[spaceId] : [];
      if(arr.indexOf(personId) < 0) arr.push(personId);
      ov[spaceId] = arr;
      saveJSON(MEMBER_KEY, ov);
    }

    /* ---------- conversation: one unified thread, oldest first ----------
       Space posts AND mailed-to-space messages live in the same store:
       a mail addressed to a space IS a post here. */
    function conversation(space){
      var seededActs = (space.activity || []).map(function(a){
        return {ts:a.ts || '', text:String(a.text || ''), author:a.author || '',
                demo:true, mine:false};
      });
      var posted = (posts[space.id] || []).map(function(p){
        return {ts:p.ts || '', text:String(p.text || ''), author:p.author || 'You',
                demo:!!p.demo, mine:!p.demo};
      });
      var all = seededActs.concat(posted);
      all.sort(function(a,b){ return String(a.ts).localeCompare(String(b.ts)); });
      return all;
    }

    var stage = el('div','sp-stage');
    var state = { view:'grid', spaceId:null };
    /* a chat app opens INTO the conversation: preview can force one via
       ctx.initialSpaceId; otherwise return to the last-opened space. */
    (function(){
      var startId = ctx.initialSpaceId || loadJSON(LASTOPEN_KEY, null);
      if(startId && spaceById(startId)){ state.view = 'detail'; state.spaceId = startId; }
    })();
    var modalStack = [];

    /* header */
    var head = el('header','sp-head');
    head.appendChild(el('p','sp-kicker','SMART SPACES'));
    var h1 = el('h1','sp-title',''); h1.textContent = 'Rooms where people talk';
    head.appendChild(h1);
    var sub = el('p','sp-sub','');
    sub.textContent = 'Create a space on any topic, gather around a block of intelligence, and talk — instant chat here, or mail the whole space at once. Anyone can add people.';
    head.appendChild(sub);
    var demo = el('p','sp-demo','');
    demo.textContent = 'DEMO SPACES \u00B7 illustrative groups for design review \u00B7 your spaces and posts are yours';
    head.appendChild(demo);
    stage.appendChild(head);

    var body = el('div','sp-body');
    stage.appendChild(body);

    var foot = el('footer','sp-foot','');
    foot.textContent = 'no canonical group store yet \u00B7 your spaces and posts are saved on this device';
    stage.appendChild(foot);

    function render(){
      body.innerHTML = '';
      if(state.view === 'grid') body.appendChild(gridView());
      else {
        var s = spaceById(state.spaceId);
        if(!s){ state.view = 'grid'; body.appendChild(gridView()); return; }
        body.appendChild(detailView(s));
      }
    }
    function openSpace(id){ state.view = 'detail'; state.spaceId = id; saveJSON(LASTOPEN_KEY, id); render(); }
    function goGrid(){ state.view = 'grid'; state.spaceId = null; render(); }

    /* ---------- focus trap ---------- */
    function trapFocus(container){
      container.addEventListener('keydown', function(ev){
        if(ev.key !== 'Tab') return;
        var all = container.querySelectorAll('button, input, textarea, select');
        var vis = [];
        for(var i=0;i<all.length;i++){ if(!all[i].disabled) vis.push(all[i]); }
        if(!vis.length) return;
        var first = vis[0], last = vis[vis.length-1];
        if(ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
        else if(!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
      });
    }
    function openModal(card){
      var overlay = el('div','sp-overlay');
      overlay.appendChild(card);
      overlay.addEventListener('click', function(ev){ if(ev.target === overlay) closeModal(); });
      stage.appendChild(overlay);
      modalStack.push(overlay);
      trapFocus(card);
      var first = card.querySelector('input, textarea, select, button');
      if(first) first.focus();
      return overlay;
    }
    function closeModal(){
      var ov = modalStack.pop();
      if(ov && ov.parentNode) ov.parentNode.removeChild(ov);
    }

    /* ---------------- GRID ---------------- */
    function gridView(){
      var wrap = el('div','sp-gridwrap');
      var headrow = el('div','sp-gridhead');
      var create = el('button','sp-create','+ CREATE A SPACE');
      create.type = 'button';
      create.addEventListener('click', createSpaceModal);
      headrow.appendChild(create);
      var hint = el('span','sp-gridhint','');
      hint.textContent = 'a space for any topic \u00B7 any group of people';
      headrow.appendChild(hint);
      wrap.appendChild(headrow);

      var grid = el('div','sp-grid');
      var spaces = effectiveSpaces();
      if(!spaces.length){
        grid.appendChild(el('p','sp-empty','No spaces yet. Create the first one.'));
      }
      spaces.forEach(function(s, i){
        var card = el('article','sp-card');
        card.style.setProperty('--sc', s.color);
        card.style.setProperty('--i', i);
        card.setAttribute('role','button');
        card.setAttribute('tabindex','0');
        card.setAttribute('aria-label','Open space: ' + s.name);
        var top = el('div','sp-card-top');
        var jewel = el('span','sp-jewel',''); jewel.textContent = '\u25C9';
        top.appendChild(jewel);
        var nm = el('h2','sp-card-name',''); nm.textContent = s.name;
        top.appendChild(nm);
        if(s.demo) top.appendChild(el('span','sp-demo-chip','DEMO'));
        card.appendChild(top);
        var topic = s.topic || s.desc;
        if(topic){ var dc = el('p','sp-card-desc',''); dc.textContent = topic; card.appendChild(dc); }
        var row = el('div','sp-card-members');
        effectiveMembers(s).slice(0,5).forEach(function(m){
          var dot = el('span','sp-mdot','');
          dot.style.setProperty('--mc', m.color || '#888888');
          dot.title = m.name;
          row.appendChild(dot);
        });
        var cnt = el('span','sp-card-count',''); 
        var n = effectiveMembers(s).length;
        cnt.textContent = n + (n === 1 ? ' person' : ' people') + ' \u00B7 ' + conversation(s).length + ' messages';
        row.appendChild(cnt);
        card.appendChild(row);
        /* the grid shows life: the latest message, so a space reads as a
           conversation at a glance — like every chat app. */
        var conv = conversation(s);
        if(conv.length){
          var lastM = conv[conv.length-1];
          var prev = el('p','sp-card-preview','');
          var who = el('b','sp-card-preview-who','');
          who.textContent = (lastM.author || 'You') + ' \u00B7 ' + fmtTime(lastM.ts);
          prev.appendChild(who);
          var rest = el('span','','');
          rest.textContent = ' \u2014 ' + String(lastM.text || '').slice(0, 90);
          prev.appendChild(rest);
          card.appendChild(prev);
        }
        var open = function(){ openSpace(s.id); };
        card.addEventListener('click', open);
        card.addEventListener('keydown', function(ev){
          if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); open(); }
        });
        grid.appendChild(card);
      });
      wrap.appendChild(grid);
      return wrap;
    }

    /* ---------------- DETAIL (the living room) ---------------- */
    /* Research notes (2026-10-02, Discord + WhatsApp references):
       a group feed feels alive through DENSITY (6-10 messages/viewport,
       <=8px between rows), NO card chrome on messages (avatar+name+time+text
       in one tight row), a SLIM header (name+topic+count in 3 lines), a
       STICKY composer, and thin date dividers. Author color = stable identity
       via colorFor(). */
    function dayLabel(ts){
      var d = new Date(ts);
      if(isNaN(d)) return '';
      var now = new Date();
      var a = d.toDateString(), b = now.toDateString();
      if(a === b) return 'Today';
      var y = new Date(now.getTime() - 86400000).toDateString();
      if(a === y) return 'Yesterday';
      return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
    }
    function firstName(n){ return String(n||'').split(/\s+/)[0] || ''; }
    function detailView(s){
      var d = el('div','sp-detail');
      d.style.setProperty('--sc', s.color);

      /* ---- slim header bar: back | ball + name + meta | actions ---- */
      var bar = el('div','sp-dbar');
      var back = el('button','sp-dback','\u2190');
      back.type = 'button';
      back.setAttribute('aria-label','Back to all spaces');
      back.addEventListener('click', goGrid);
      bar.appendChild(back);
      var sball = el('span','sp-avatar xs','');
      sball.textContent = initials(s.name);
      sball.style.setProperty('--av', s.color || '#8b5cf6');
      sball.setAttribute('aria-hidden','true');
      bar.appendChild(sball);
      var bt = el('div','sp-dbar-t');
      var bn = el('div','sp-dbar-n',''); bn.textContent = s.name;
      if(s.demo){ var dc = el('span','sp-fdemo','DEMO'); bn.appendChild(dc); }
      bt.appendChild(bn);
      var meta = el('div','sp-dbar-m','');
      (function(){
        var ms = effectiveMembers(s);
        var names = ms.slice(0,3).map(function(m){ return firstName(m.name); }).join(', ');
        var more = ms.length > 3 ? ' +' + (ms.length - 3) : '';
        meta.textContent = ms.length + (ms.length === 1 ? ' person' : ' people') +
          (names ? ' \u00B7 ' + names + more : '');
      })();
      bt.appendChild(meta);
      bar.appendChild(bt);
      var acts = el('div','sp-dbar-a');
      if(onCompose){
        var mailBtn = el('button','sp-dact','MAIL');
        mailBtn.type = 'button';
        mailBtn.setAttribute('aria-label','Mail the whole space');
        mailBtn.addEventListener('click', function(){
          try { onCompose({to:s.id, toKind:'space'}); } catch(e){}
        });
        acts.appendChild(mailBtn);
      }
      var addBtn = el('button','sp-dact','+ ADD');
      addBtn.type = 'button';
      addBtn.setAttribute('aria-label','Add people to ' + s.name);
      addBtn.addEventListener('click', function(){ addPeopleModal(s); });
      acts.appendChild(addBtn);
      bar.appendChild(acts);
      d.appendChild(bar);

      /* topic: one quiet line, not a billboard */
      var topic = s.topic || s.desc;
      if(topic){
        var tl = el('p','sp-dtopic',''); tl.textContent = topic;
        if(s.block){ var bl = el('span','sp-dtopic-b',''); bl.textContent = ' \u00B7 gathered around ' + s.block; tl.appendChild(bl); }
        d.appendChild(tl);
      }

      /* author color: the person's stable identity color when known, hash fallback */
      var colorByName = {};
      allPeople().forEach(function(p){ colorByName[p.name] = p.color || colorFor(p.id); });
      effectiveMembers(s).forEach(function(m){ colorByName[m.name] = m.color || colorFor(m.id); });
      function authorColor(name){ return colorByName[name] || colorFor(name || '?'); }

      /* ---- dense conversation feed ---- */
      var feed = el('div','sp-feed');
      feed.setAttribute('aria-live','polite');
      function paintFeed(scroll){
        feed.innerHTML = '';
        var msgs = conversation(s);
        if(!msgs.length) feed.appendChild(el('p','sp-fempty','Nothing said yet. Start the conversation.'));
        var prev = null;
        msgs.forEach(function(m){
          var day = dayLabel(m.ts);
          if(day && (!prev || dayLabel(prev.ts) !== day)){
            var dv = el('div','sp-fdiv');
            dv.appendChild(el('span','sp-fdiv-l',''));
            var dl = el('span','sp-fdiv-t',''); dl.textContent = day; dv.appendChild(dl);
            dv.appendChild(el('span','sp-fdiv-l',''));
            feed.appendChild(dv);
          }
          var sameDay = prev && dayLabel(prev.ts) === day;
          var dt = new Date(m.ts).getTime(), pt = prev ? new Date(prev.ts).getTime() : 0;
          var grouped = !!(prev && sameDay && prev.author === m.author && !isNaN(dt) && !isNaN(pt) && (dt - pt) < 5*60000);
          var row = el('div','sp-frow' + (grouped ? ' cont' : '') + (m.mine ? ' mine' : ''));
          var main = el('div','sp-fmain');
          if(!grouped){
            var av = el('span','sp-avatar xs','');
            av.textContent = initials(m.author || '?');
            av.style.setProperty('--av', authorColor(m.author));
            av.setAttribute('aria-hidden','true');
            row.appendChild(av);
            var mh = el('div','sp-fmeta');
            var au = el('span','sp-fauthor',''); au.textContent = m.author || 'You';
            au.style.color = authorColor(m.author);
            mh.appendChild(au);
            var t = el('span','sp-ftime',''); t.textContent = fmtTime(m.ts); mh.appendChild(t);
            if(m.demo) mh.appendChild(el('span','sp-fdemo','DEMO'));
            main.appendChild(mh);
          }
          var tx = el('p','sp-ftext',''); tx.textContent = m.text; main.appendChild(tx);
          row.appendChild(main);
          feed.appendChild(row);
          prev = m;
        });
        if(scroll) feed.scrollTop = feed.scrollHeight;
      }
      paintFeed(false);
      d.appendChild(feed);

      /* ---- sticky composer ---- */
      var box = el('div','sp-composer');
      var ta = el('textarea','sp-ta','');
      ta.placeholder = 'Message ' + s.name + '\u2026';
      ta.setAttribute('aria-label','Message to ' + s.name);
      ta.rows = 1;
      box.appendChild(ta);
      var send = el('button','sp-send','SEND');
      send.type = 'button';
      send.disabled = true;
      ta.addEventListener('input', function(){ send.disabled = !ta.value.trim(); });
      function doSend(){
        var text = ta.value.trim();
        if(!text) return;
        var entry = {ts:new Date().toISOString(), text:text, author:myName()};
        posts[s.id] = posts[s.id] || [];
        posts[s.id].push(entry);
        saveJSON(STORE_KEY, posts);
        ta.value = '';
        send.disabled = true;
        paintFeed(true);
        if(onMail){ try { onMail(s, text); } catch(e){} }
      }
      send.addEventListener('click', doSend);
      ta.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); doSend(); }
      });
      box.appendChild(send);
      d.appendChild(box);

      return d;
    }

    /* ---------------- CREATE SPACE ---------------- */
    var DEMO_BLOCKS = [
      'IB-004 \u2014 14 NayaPOWER blueprint images',
      'IB-006 \u2014 freeze-and-extend protocol',
      'IB-OP-001 \u2014 the 6-to-10 doctrine'
    ];
    function createSpaceModal(){
      var card = el('div','sp-modal');
      card.setAttribute('role','dialog');
      card.setAttribute('aria-label','Create a space');
      card.appendChild(el('h2','sp-modal-title','CREATE A SPACE'));

      var nameF = field('Space name', 'text', 'e.g. Launch crew');
      var topicF = field('Topic \u2014 what is this space about?', 'text', 'e.g. everything about the Hub launch');
      card.appendChild(nameF.wrap); card.appendChild(topicF.wrap);

      var bw = el('label','sp-field');
      bw.appendChild(el('span','sp-flabel','Gather around an intelligent block (optional)'));
      var sel = el('select','sp-input'); sel.name = 'block';
      var opt0 = document.createElement('option'); opt0.value = ''; opt0.textContent = 'Just a subject \u2014 no block';
      sel.appendChild(opt0);
      DEMO_BLOCKS.forEach(function(b){
        var o = document.createElement('option'); o.value = b; o.textContent = b + '  [DEMO]';
        sel.appendChild(o);
      });
      bw.appendChild(sel);
      card.appendChild(bw);

      var row = el('div','sp-modal-row');
      var cancel = el('button','sp-btn','CANCEL'); cancel.type = 'button';
      var create = el('button','sp-btn primary','CREATE SPACE'); create.type = 'button';
      create.disabled = true;
      function valid(){ create.disabled = !(nameF.input.value.trim() && topicF.input.value.trim()); }
      nameF.input.addEventListener('input', valid);
      topicF.input.addEventListener('input', valid);
      cancel.addEventListener('click', closeModal);
      create.addEventListener('click', function(){
        var name = nameF.input.value.trim(), topic = topicF.input.value.trim();
        if(!name || !topic) return;
        var id = 'sp-' + Date.now().toString(36);
        var memberIds = [];
        if(me && personById(me)) memberIds.push(me);
        var list = customSpaces();
        list.push({id:id, name:name, topic:topic, block:sel.value || null,
                   color:colorFor(id), memberIds:memberIds});
        saveJSON(CUSTOM_KEY, list);
        closeModal();
        openSpace(id);
      });
      row.appendChild(cancel); row.appendChild(create);
      card.appendChild(row);
      openModal(card);
    }
    function field(label, type, placeholder){
      var wrap = el('label','sp-field');
      wrap.appendChild(el('span','sp-flabel',label));
      var input = el('input','sp-input','');
      input.type = type; input.placeholder = placeholder;
      wrap.appendChild(input);
      return {wrap:wrap, input:input};
    }

    /* ---------------- ADD PEOPLE ---------------- */
    function addPeopleModal(s){
      var card = el('div','sp-modal');
      card.setAttribute('role','dialog');
      card.setAttribute('aria-label','Add people to ' + s.name);
      card.appendChild(el('h2','sp-modal-title','ADD PEOPLE'));
      var sub = el('p','sp-modal-sub','');
      sub.textContent = 'Anyone in your network can join the conversation.';
      card.appendChild(sub);
      var list = el('div','sp-plist');
      function paintList(){
        list.innerHTML = '';
        var have = {};
        effectiveMembers(s).forEach(function(m){ have[m.id] = 1; });
        var cands = allPeople().filter(function(p){ return !have[p.id]; });
        if(!cands.length) list.appendChild(el('p','sp-empty','Everyone is already here.'));
        cands.forEach(function(p){
          var row = el('div','sp-prow');
          var av = el('span','sp-avatar sm','');
          av.textContent = initials(p.name);
          av.style.setProperty('--av', p.color || '#888888');
          row.appendChild(av);
          var tx = el('div','sp-ptx');
          var pn = el('span','sp-pname',''); pn.textContent = p.name; tx.appendChild(pn);
          if(p.role){ var pr = el('span','sp-prole',''); pr.textContent = p.role; tx.appendChild(pr); }
          row.appendChild(tx);
          var add = el('button','sp-padd','ADD');
          add.type = 'button';
          add.addEventListener('click', function(){
            addMember(s.id, p.id);
            closeModal();  /* remove this overlay from the DOM + stack */
            render();      /* refresh the detail members row */
            addPeopleModal(s); /* reopen fresh */
          });
          row.appendChild(add);
          list.appendChild(row);
        });
      }
      paintList();
      card.appendChild(list);
      var row = el('div','sp-modal-row');
      var done = el('button','sp-btn primary','DONE'); done.type = 'button';
      done.addEventListener('click', closeModal);
      row.appendChild(done);
      card.appendChild(row);
      openModal(card);
    }

    render();

    /* Escape: close modal first, else back to grid from detail */
    stage.addEventListener('keydown', function(ev){
      if(ev.key !== 'Escape') return;
      if(modalStack.length){ closeModal(); return; }
      if(state.view === 'detail') goGrid();
    });

    return stage;
  }
