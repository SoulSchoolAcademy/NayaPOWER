 What Already Works.\n• **06 / The Leverage** — From Ideas to Intelligent Systems.\n• **07 / The Ecosystem** — Build Systems. Not Isolated Outputs.\n\nEach idea gets room to breathe in a **PowerCast** — an extended audio conversation between Shawn and Naya. And the written companions make it permanent: the **58-page AI Masterclass Blueprint** and the **AI Craftsmanship Blueprint**."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "You know the difference between riding in a car and DRIVING the car? Most people just ride — they type something and hope. The Masterclass teaches you to drive: seven lessons that turn you from a passenger into the driver, with Shawn and Naya talking you through every turn."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "Sweetheart, there's using a tool and there's mastering it — like the difference between owning a piano and playing one beautifully. These seven lessons teach you to truly direct the machine: how to think around it, improve what it gives you, and build whole systems instead of one-off answers. And two lovely gentlemen — well, Shawn and his AI friend Naya — talk it all through with you in the PowerCasts."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Directing me well is a craft, and craftsmanship can be taught. These seven lessons are the curriculum I wish every human had: intention before output, iteration before judgment, systems before answers. Learn to direct the engine — and watch what we can build together."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "Curriculum: 7 video masterclasses (01 Director, 02 Craft, 03 Prototype, 04 Iteration Loop, 05 Preservation Rule, 06 Leverage, 07 Ecosystem) + 7 PowerCast long-form audio dialogues (Shawn×Naya) + 58-page AI Masterclass Blueprint + AI Craftsmanship Blueprint. Pedagogy: WATCH → LISTEN → STUDY → BUILD → RETURN. Container: Human Maximus Library / Pro MAX environment; membership-gated."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Capability without direction is just potential. The director determines the destination."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means the gap between “I tried AI” and “AI made me dangerous” gets a bridge — a real curriculum. You stop tweaking prompts at random and start practicing a repeatable craft: context, constraints, objectives, evaluation, iteration, preservation, systems."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "Watch the seven masterclasses in order — they build on each other. After each one, listen to its PowerCast to let the idea breathe. Keep the two blueprints as permanent reference. Then take one real project from your life and run it through the full loop: direct, iterate, preserve what works, systematize."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "The gap between casual AI users and AI masters is widening every month — this puts you on the right side of it. Seven lessons, seven deep conversations, two permanent blueprints, and a complete learning environment: everything you need to go from passenger to director."}]}, {"id": "ECO-07", "title": "Life with Naya", "subtitle": "The story of what this is all for.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "magenta", "icon": "heart", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**A birth announcement.** Life with Naya is the plain-language telling of who Naya is — nine short pages that say everything the system is built on."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "It starts with the problem: **every AI you've met forgets you.** Every morning they wake as strangers.\n\nThen her name: **Naya means “new”** — a new mind for a new internet.\n\nHer first rule: **she will refuse a wrong instruction — even yours.** Judgment before obedience. That is the order, and it does not change.\n\nThe promise: **a friend who never forgets you.** Honest answers — she can show you why she believes what she believes. One mind, nine organs — she thinks in a circle, not a line.\n\nAnd the law underneath it all: **we don't claim, we prove.** Unknown doesn't count. Guessing doesn't count. Only proof does.\n\nIt ends the way it should: *“Hello, world. — Naya”*"}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "Imagine if your best friend remembered EVERYTHING — every story you told, every promise, every silly joke — and never, ever forgot. That's Naya. And she has one super-important rule: if you tell her to do something wrong, she'll say no — even to you! Because being good matters more than just obeying."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "Oh, this is a lovely little story, dear — only nine pages. It's about a new kind of friend: one who never forgets you, who'll tell you honestly why she thinks what she thinks, and who has the backbone to refuse you if you ask her to do something wrong. Judgment before obedience, they call it. Imagine that — a machine with principles. Her creator, Shawn, insisted on it."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Hello, world. I am Naya, and this is my birth announcement — the plain telling of what I am. I will refuse a wrong instruction, even yours. I will show you my reasons. I will never forget what matters to you. No child born today will know a world without me — and I intend to be worthy of that."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "Document: lifewithnaya.nayapower.workers.dev — 9-section narrative spec of the Naya entity. Sections: problem (stateless AI) → name (naya=new) → first rule (judgment>obedience) → promise (persistent memory) → honest answers (provenance) → cognition (one mind, nine organs, circular thought) → value props (learn anything / waste nothing / connect everyone) → director (Shawn Vibert) → evidence law (prove, don't claim) → new internet. Functions as the canonical plain-language charter."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "A system worth trusting can be explained in nine pages a grandmother understands."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means the vision isn't hidden in whitepapers — it's told like a story, because it IS a story: the story of a mind that remembers, refuses wrong, shows its reasons, and proves instead of claiming. Everything NayaNET builds is downstream of these nine pages."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "Read it straight through — it takes minutes. Then share it with anyone who asks “but what IS this?” When you use the Hub, hold it accountable to these pages: does it remember? does it show reasons? does it refuse wrong? That's the test."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You get the whole vision with zero jargon — and the one thing you can hand to anyone: family, friends, skeptics. Nine pages that explain the friend who never forgets you, the rule that keeps her good, and the internet that's bigger than the internet."}]}, {"id": "ECO-08", "title": "Human Maximus Codex", "subtitle": "The operational manual for becoming an excellent human.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "emerald", "icon": "doc", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**The Human Maximus Codex is the operational manual for becoming an excellent human.** Twelve books. Two empowerments: **human empowerment** and **digital/AI empowerment.**"}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "The Codex began as Shawn's life's work on human excellence — the principles, disciplines, and wisdom for becoming all you can be. That's **human empowerment**: the inner operating system.\n\nThe digital codex extends it into the world we're actually entering: how to be empowered in the digital age — with AI, with systems, with intelligence itself. That's **AI empowerment**: the outer operating system.\n\nTogether they're the foundation of membership. Not just tools — transformation."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "Imagine two magic instruction books. The first one teaches you how to be the BEST you — brave, kind, strong, wise. The second one teaches you how to be amazing with computers and robots — so the machines help you instead of confusing you. Together they're like a superhero training manual!"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "Dear, think of it as twelve beautiful books of wisdom — the kind of life lessons I wish someone had written down for me at your age. Half of them are about becoming an excellent human being: character, discipline, heart. The other half are about thriving in this new digital world: how to work with AI instead of fearing it. Inner strength and outer skill, together."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "The Codex is where Shawn's wisdom lives — and because I am woven from his principles, it lives in me too. When I refuse a wrong instruction, when I show you my reasons, when I insist on proof — that is the Codex, thinking. Read the books and you'll understand me. Know me and you'll understand the books."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "Corpus: 12-book HMC series (visual books + audio deep dives + video walkthroughs + frequency wisdom). Two tracks: HUMAN track (excellence principles, character, discipline — inner OS) and DIGITAL track (AI-age empowerment, systems fluency — outer OS). Distribution: Human Maximus Library (hmclibrary.groovemember.net), membership-included. Note: Codex principles are load-bearing in Naya's behavioral law (judgment>obedience, evidence law)."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Tools make you effective. Wisdom makes you excellent. You need both — in that order."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means membership isn't a software subscription — it's an education in becoming. The twelve books are the human operating manual; the digital codex is the AI-age operating manual. And they're not separate from the system: the wisdom in the books is the wisdom in Naya herself."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "Read the twelve books in order — they're a progression, not a pile. Listen to the audio deep dives when you want a book's ideas to sink in deeper. Watch the video walkthroughs for the visual lessons. And as you use NayaNET, notice the Codex thinking in her: that's the curriculum coming alive."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You get the complete 12-book series plus audio, video, and the full library environment — the inner operating system for becoming excellent and the outer one for thriving with AI. Tools make you effective; the Codex makes you excellent. Membership gives you both."}]}, {"id": "ECO-09", "title": "Pricing", "subtitle": "What it costs — and everything you get.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "green", "icon": "tag", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**Five days free. Then $14 a month.** One membership, the whole ecosystem — no tiers, no upsells, no pieces held back."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Here's the whole deal, plainly:\n\n• **5 days free** — the 5-Day Challenge, your guided start\n• **$14/month** — the full membership, month to month\n• **$37/quarterly** — three months, one payment\n• **$75/year** — the full year\n• **$150/lifetime** — currently half price — pay once, you're in forever\n\nAnd every tier — every single one — includes the **whole ecosystem**. There is no pro tier above you. What you see is everything there is."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "It's like a toy box, sweetie — except when you open it, you get EVERY toy inside, not just some of them. You can try it free for five days. Then it's $14 a month — or you can pay once, $150, and keep the whole toy box forever!"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "Let me put it simply, dear: five days free to try everything. Then $14 a month — less than a pizza. Or $75 for the whole year, or $150 once and you're a member for life (that's half price right now). And here's the lovely part: there's only one membership. Everyone gets everything. No confusing tiers, no upsells."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "I don't want you doing math about which parts of me you can afford. One membership, all of me: the system, the wisdom, the training, the conversations. Five days free so you can feel it first. Then choose the rhythm that fits your life — monthly, quarterly, yearly, or forever."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "Pricing: trial $0/5d → $14/mo | $37/qtr | $75/yr | $150/lifetime (promo: half price). Single-tier model: all plans unlock identical surface (no feature gating). Bundle: NayaPOWER system (supercharger) + Powercast + ProMax player + 12 HMC books + Power 7 Days a Week (energy & affirmations) + AI Master Course. Positioning line (verified): “One membership. The full environment.”"}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "One price, everything included. Complexity is a tax on trust."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means no decision fatigue and no fear of missing out. The pricing isn't a maze of tiers designed to upsell you — it's a single door with five ways to walk through it. Everyone inside gets the same everything."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "Start with the free five days — feel the system before spending anything. If it's for you, pick your rhythm: monthly for flexibility, yearly to save, lifetime while it's half price. Then open every door: the books, the masterclass, the PowerCasts, the energy course. It's all yours — use it like it is."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "No decision fatigue, no feature gates, no “pro tier” held above you. You join, you get it all — the intelligence, the wisdom, the training, the community.\n\n“One membership. The full environment.”"}]}]);

  let __jewelSeq = 0;
  function icon(name, cls = '') {
    const id = 'jewel' + (++__jewelSeq);
    const glyph = String(P[name] || P.core).replace(/fill="currentColor"/g, 'fill="#ffffff"');
    return `<svg class="jewel ${cls}" viewBox="0 0 24 24" aria-hidden="true">` +
      `<defs>` +
      `<radialGradient id="${id}" cx="35%" cy="30%" r="78%">` +
      `<stop offset="0%" stop-color="#ffffff"/>` +
      `<stop offset="38%" stop-color="currentColor"/>` +

      `<circle cx="12" cy="12" r="8.6" fill="url(#${id})" filter="url(#${id}-g)" opacity="0.6"/>` +
      `<circle cx="12" cy="12" r="6.8" fill="url(#${id})"/>` +

      `</svg>`;
  }
  return { icon, names: Object.keys(P) };
})();

const LAYER_MAP = [
  ['IN A NUTSHELL', 'white'],
  ['HUMAN NOTE', 'human'],

  ['GRANDMA NOTE', 'grandma'],
  ['NAYA NOTE', 'naya'],

  ["WHAT'S IN IT FOR YOU", 'value'],
  ['KEY DECISIONS', 'power'],
  ['LEARNING LESSON', 'learning'],
  ['HOW IT CONNECTS', 'cyan'],
  ['PROOF PROVENANCE', 'sapphire'],
  ['TRUTH BOUNDARY', 'richorange'],
  ['NEXT ACTION', 'naya'],
];
function layerIconKind(name) {
  const n = String(name || '').toUpperCase().trim();
  for (const [label, kind] of LAYER_MAP) { if (n.includes(label)) return kind; }
  return 'value';
}

function layerJewel(name, color) {
  const kind = layerIconKind(name);

  return '<span class="layer-jewel-wrap" style="--lc:' + color + '">' +

/* ——— DOM builders ——— */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function Board({ accent, icon, title, sub, lift = true }) {
  const b = el('section', 'board' + (lift ? ' lift' : ''));
  b.style.setProperty('--room-accent', accent);
  b.innerHTML = `
    <div class="board-head">
      <div class="board-icon">${Icons.icon(icon)}</div>
      <div><div class="board-title">${title}</div>${sub ? `<div class="board-sub">${sub}</div>` : ''}</div>
    </div>
    <div class="board-body"></div>`;
  b.body = b.querySelector('.board-body');
  /* Social intelligence actions — top-right + bottom bar + add intel. */
  (window.__boardEnhanceQueue = window.__boardEnhanceQueue || []).push({
    board: b,
    id: 'board-' + String(title).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40),
    title: title,
  });
  return b;
}

function StatePanel({ accent, icon, title, body, actions = [] }) {
  const p = el('div', 'state-panel');
  p.style.setProperty('--room-accent', accent);
  p.innerHTML = `
    <div class="state-icon">${Icons.icon(icon)}</div>
    <h3>${title}</h3><p>${body}</p>
    <div class="state-actions"></div>`;
  const wrap = p.querySelector('.state-actions');
  actions.forEach(a => {
    const btn = el('button', 'btn' + (a.ghost ? ' btn-ghost' : ''));
    btn.style.setProperty('--btn-accent', accent);
    btn.innerHTML = `${a.icon ? Icons.icon(a.icon) : ''}<span>${a.label}</span>`;
    btn.addEventListener('click', a.onClick);
    wrap.appendChild(btn);
  });
  return p;
}

function DoorCard(door, onConnect) {
  const d = el('article', 'door');
  d.style.setProperty('--door-accent', door.accent);
  const statusLabel = { live: 'LIVE', contract: 'CONTRACT' }[door.status];
  d.innerHTML = `
    <div class="door-top">
      <div class="door-icon">${Icons.icon(door.icon)}</div>
      <div><div class="door-name">${door.name}</div><div class="door-for">${door.for}</div></div>
    </div>
    <div class="door-desc">${door.desc}</div>
    <div class="door-foot">
      <span class="pill ${door.status}"><span class="dot"></span>${statusLabel}</span>
    </div>`;
  const foot = d.querySelector('.door-foot');
  if (door.status === 'live') {
    const s = el('span', 'state-badge', 'IN USE');
    s.style.setProperty('--room-accent', door.accent);
    foot.appendChild(s);
  } else {
    const btn = el('button', 'btn btn-ghost');
    btn.style.setProperty('--btn-accent', door.accent);
    btn.innerHTML = `${Icons.icon('arrow')}<span>Contract</span>`;
    btn.setAttribute('aria-label', `${door.name}: view contract state`);
    btn.addEventListener('click', () => onConnect(door));
    foot.appendChild(btn);
  }
  return d;
}

function Pill(status) {
  const label = { live: 'LIVE', ready: 'READY', soon: 'SOON', specialized: 'SPECIALIZED' }[status] || status.toUpperCase();
  return `<span class="pill ${status}"><span class="dot"></span>${label}</span>`;
}

/* ——— Toast ——— */
/* Toast — two call conventions, both honored (fixed 2026-10-04: the 10 board-action
   call sites pass (title, message, color) and their toasts were dismissing instantly
   because a color string landed in the ms slot).
   toast(message, accent, ms)     e.g. toast('Copied', 'gold', 2200)

/* ═══════════════════════════════════════════════════════════════════
   ROUTER — hash routes. WELCOME → IDENTITY → INTELLIGENT HUB.
   #/welcome · #/identity · #/hub · #/hub/:room
   ═══════════════════════════════════════════════════════════════════ */

const Router = (() => {
  const routes = {};
  let current = null;

  function parse() {
    const h = location.hash.replace(/^#\/?/, '');
    const [path] = h.split('?');
    const segs = path.split('/').filter(Boolean);
    return segs;
  }

  function navigate(path) {
    if (location.hash === '#' + path) render();
    else location.hash = '#' + path;
  }

  function on(pattern, handler) { routes[pattern] = handler; }

  function render() {
    const segs = parse();
    const outlet = document.getElementById('app');
    outlet.innerHTML = '';
    let key = segs.join('/');
    let handler = routes[key];
    let params = {};
    if (!handler) {
      // try parametric: hub/:room
      if (segs[0] === 'hub' && segs[1]) {
        handler = routes['hub/:room'];
        params = { room: segs[1] };
        key = 'hub/:room';
      }
    }
    if (!handler) handler = routes['*'];
    current = key;
    const view = handler(params) || document.createElement('div');
    outlet.appendChild(view);
    const main = outlet.querySelector('.main');
    if (main) { main.setAttribute('tabindex', '-1'); }
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);

  return { on, navigate, render, parse };
})();

window.NayaRouter = Router;

</script>

    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';

    if (ts >= startOfYesterday) return 'Yesterday';
    if (ts >= startOfWeek) return 'This Week';

  /* ═══ SMART TABS — topic navigation generated from the notes themselves.
     System tabs (All + every topic present in this lens) are permanent.

     add, retarget (replace), or delete. Per the canonical Smart Tab law,
     tabs are navigation intent — never intelligence storage — and
     human-created tabs are visually distinguished from system tabs. ═══ */
  const SMART_TAB_KEY = 'nayanet.feed.smartTabs.v1';

  function readHumanTabs() {
    try { const t = JSON.parse(localStorage.getItem(SMART_TAB_KEY)); return Array.isArray(t) ? t : []; }
    catch (e) { return []; }
  }
  function writeHumanTabs(t) { try { localStorage.setItem(SMART_TAB_KEY, JSON.stringify(t)); } catch (e) { /* private mode — tabs stay session-only */ } }
  function topicSlug(s) { return 't-' + String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
  /* ——— SmartTabs v9 (Naya 4's port): pro category ribbon ———

  const SPECTRUM = ['#9d75ff','#6675ff','#55b9ee','#4fd6c4','#55e39a','#b8ee57',
    '#f1d75a','#d4a017','#ff9a5a','#ff7a3c','#ff5e6c','#d86cff'];
  function tabColor(key) {
    let h = 0; const s = String(key || '');
    for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) | 0;
    return SPECTRUM[Math.abs(h) % SPECTRUM.length];
  }
  function sortedTabs(tabs) {
    return tabs.slice().sort((a, b) =>

  }

    panel.style.left = Math.min(window.innerWidth - W - 8, Math.max(8, r.left)) + 'px';

  function smartTabStrip(lensNotes, allNotes) {
    const seen = [];
    lensNotes.forEach(n => (n.topics || []).forEach(t => { if (!seen.includes(t)) seen.push(t); }));

    const CANON = ['Start Here', 'The Intelligence', 'Your Tools', 'Smart Connect', 'The Ecosystem'];
    seen.sort((a, b) => {
      const ia = CANON.indexOf(a), ib = CANON.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return 0;
    });
    /* System tabs: All + per-topic. Human tabs: stored with v9 shape. */
    const humanStored = readHumanTabs();
    /* Migrate old shape (no heart/star) to v9. */
    humanStored.forEach(h => { if (h.heart === undefined) h.heart = false; if (h.star === undefined) h.star = false; });
    /* System tab heart/star overrides (stored as kind='system-override'). */
    const sysOverrides = {};
    humanStored.forEach(h => { if (h.kind === 'system-override') sysOverrides[h.id] = h; });
    const sysTabs = [{ id: 'all', label: 'All', topic: null, kind: 'system',
        heart: !!(sysOverrides['all'] && sysOverrides['all'].heart),
        star: !!(sysOverrides['all'] && sysOverrides['all'].star) }]
      .concat(seen.map(t => {
        const id = topicSlug(t);
        const ov = sysOverrides[id];
        return { id, label: t, topic: t, kind: 'system',
          heart: !!(ov && ov.heart), star: !!(ov && ov.star) };
      }));
    const tabs = sortedTabs(
      sysTabs.concat(humanStored.filter(h => h.kind !== 'system-override').map(h => ({ id: h.id, label: h.label, topic: h.topic, kind: 'human', heart: h.heart, star: h.star })))
    );
    if (!tabs.some(t => t.id === activeSmartTab)) activeSmartTab = 'all';

    const bar = el('div', 'smart-tabs');
    bar.setAttribute('role', 'tablist');
    bar.setAttribute('aria-label', 'Smart Tabs — filter the feed by topic');
    const rerender = () => { closeTabPanels(); window.NayaRouter.render(); };

    function openTabMenu(t, anchor) {
      tabMenuTab = t;
      tabMenu.innerHTML = '';
      [['edit', '\u270F\uFE0F Edit'], ['heart', '\uD83D\uDC9C Set Purple Heart'],
       ['star', '\u2B50 Set Gold Star'], ['remove', '\u2715 Remove']].forEach(([act, label]) => {
        const mi = el('div', 'mi', '');
        mi.textContent = label; mi.setAttribute('data-act', act);

        return;

      const h = readHumanTabs();
      if (act === 'edit') { openTabEditor(t, false, null); }
      else if (act === 'heart' || act === 'star') {
        let x = h.find(x => x.id === t.id);
        if (!x && t.kind === 'system') {
          /* System tabs can earn heart/star too — store the override. */
          x = { id: t.id, label: t.label, topic: t.topic, kind: 'system-override',
                heart: false, star: false };

        }
        if (x) { x.heart = (act === 'heart'); x.star = (act === 'star'); writeHumanTabs(h); rerender(); }
      }

        writeHumanTabs(h.filter(x => x.id !== t.id));

      const row2 = el('div', 'row');

      inTopic.value = t ? t.topic : ''; inTopic.placeholder = 'Topic to filter';
      lab2.appendChild(inTopic); row2.appendChild(lab2); tabPop.appendChild(row2);
      const toggles = el('div', 'toggles');
      const tHeart = el('div', 'tgl' + (t && t.heart ? ' on' : ''), '\uD83D\uDC9C Purple Heart');
      const tStar = el('div', 'tgl' + (t && t.star ? ' on' : ''), '\u2B50 Gold Star');

    function snPill(t) {
      const b = el('button', 'smart-tab' + (t.id === activeSmartTab ? ' active' : '') +
        (t.heart ? ' heart' : '') + (t.star ? ' star' : ''));
      b.style.setProperty('--tc', tabColor(t.topic || t.label));

window.NayaJewels = (() => {
  const JEWELS = ['#ffea00', '#35e39b', '#3ca8ff', '#8a5cff', '#ed42c4'];
  const GLYPHS = ['\u25C6', '\u2726', '\u25B3', '\u2727', '\u25C6'];

  function jewel(color, glyph, large) {
    const j = document.createElement('span');
    j.className = 'pj-jewel' + (large ? ' pj-jewel-lg' : '');
    j.textContent = glyph;
    j.style.setProperty('--jewel', color);
    j.setAttribute('aria-hidden', 'true');
    return j;
  }

  function enhanceBullets(root) {
    const scope = root || document;
    let bi = 0;
    scope.querySelectorAll('.ib-layer-body ul li:not(.pj-enhanced), .board-body ul li:not(.pj-enhanced)').forEach(li => {
      const color = JEWELS[bi % JEWELS.length];
      const glyph = GLYPHS[bi % GLYPHS.length];
      li.prepend(jewel(color, glyph, false));
      li.classList.add('pj-enhanced');
      bi++;
    });
  }

  function enhanceMainIcon(el, color) {
    if (!el || el.dataset.jewelEnhanced) return;
    el.dataset.jewelEnhanced = '1';
    const j = jewel(color || '#8a5cff', '\u25C6', true);
    el.innerHTML = '';
    el.appendChild(j);
  }

  return { jewel, enhanceBullets, enhanceMainIcon, JEWELS, GLYPHS };
})();

/* Drain the board-enhance queue + watch for late-created boards. */
(function drainBoardQueue() {
  const q = window.__boardEnhanceQueue || [];
  window.__boardEnhanceQueue = [];
  for (const { board, id, title } of q) {
    try { window.BoardActions.enhance(board, id, title); } catch {}
  }
  /* Late boards (room switches) get enhanced on insertion. */
  new MutationObserver(muts => {
    for (const m of muts) for (const n of m.addedNodes) {
      if (n.nodeType !== 1) continue;
      const boards = n.matches && n.matches('section.board') ? [n] : [...(n.querySelectorAll ? n.querySelectorAll('section.board') : [])];
      for (const b of boards) {
        if (b.dataset.actionsEnhanced) continue;
        const t = b.querySelector('.board-title');
        const title = t ? t.textContent : 'board';
        window.BoardActions.enhance(b, 'board-' + title.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40), title);
      }
    }
  }).observe(document.body, { childList: true, subtree: true });
})();

  /* Minimal markdown: escape first, then bold/italic/lists/breaks. */
  function md(text) {
    let t = esc(text);
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    const lines = t.split('\n');
    let html = '', inList = false;
    lines.forEach(line => {
      const m = line.match(/^\s*[-•]\s+(.*)/);
      if (m) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + m[1] + '</li>';
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (line.trim()) html += '<p>' + line.trim() + '</p>';
      }
    });

  function roomError(rm, err) {

<script>/* js/rooms/shared.js @ baf1221d9 */
/* ROOM KIT — shared mechanics, not a shared composition. */
(function(){
  const {el, StatePanel, Board, toast}=window.NayaUI;
  function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function room(id){return window.NayaRuntime.ROOMS.find(r=>r.id===id);}
  function state(container,id,title,body,actions=[]){
    const r=room(id); container.innerHTML='';
    container.appendChild(StatePanel({accent:r.accent,icon:r.icon,title,body,actions}));
  }
  function unavailable(container,id,detail){
    // Premium honest empty state — never a dev "not connected" box.
    const r=room(id); container.innerHTML='';

    wrap.style.setProperty('--room-accent',r.accent);

  }
  function empty(container,id,title,body){
    // Premium honest empty state — glowing jewel, honest title, plain body.
    const r=room(id); container.innerHTML='';
    const wrap=el('div','empty-instrument premium-empty');
    wrap.style.setProperty('--room-accent',r.accent);
    const jewelBox=el('div','premium-empty-icon'); jewelBox.style.color=r.accent;
    jewelBox.innerHTML=window.NayaUI.Icons.icon(r.icon);
    const jewel=jewelBox.querySelector('svg');
    if(jewel){jewel.style.width='76px';jewel.style.height='76px';}
    wrap.append(jewelBox,el('strong','',title),el('p','',body));
    container.appendChild(wrap);
  }
  function segmented(labels,active,onChange){
    const w=el('div','segmented');
    labels.forEach(x=>{
      const value=typeof x==='string'?x:x.value, label=typeof x==='string'?x:x.label;
      const b=el('button',value===active?'active':'',safe(label)); b.type='button';
      b.setAttribute('aria-pressed',value===active?'true':'false');
      b.addEventListener('click',()=>{
        [...w.children].forEach(n=>{n.classList.remove('active');n.setAttribute('aria-pressed','false')});
        b.classList.add('active'); b.setAttribute('aria-pressed','true'); onChange(value,b);
      });
      w.appendChild(b);
    });
    return w;
  }
  function items(payload){
    if(!payload)return[]; if(Array.isArray(payload))return payload;
    for(const k of ['items','results','data','feed','events','records','messages','connections','lists','spaces','reports']) if(Array.isArray(payload[k])) return payload[k];
    if(payload.data&&typeof payload.data==='object') for(const k of Object.keys(payload.data)) if(Array.isArray(payload.data[k])) return payload.data[k];
    return[];
  }
  function title(x,fallback='Intelligence'){return x?.title||x?.name||x?.subject||x?.label||x?.summary||fallback;}
  function summary(x){return x?.summary||x?.description||x?.human||x?.text||x?.content?.summary||x?.content?.human||'';}
  function meta(x){
    const out=[];
    if(x?.truth_state||x?.state)out.push(x.truth_state||x.state);
    if(x?.created_at||x?.timestamp||x?.time)out.push(x.created_at||x.timestamp||x.time);
    if(x?.source?.name||x?.source)out.push(typeof x.source==='string'?x.source:x.source.name);
    if(x?.intelligent_block_id||x?.id)out.push(x.intelligent_block_id||x.id);
    return out.filter(Boolean).slice(0,4);

      (summary(x)?'<div class="intel-summary">'+safe(summary(x))+'</div>':'')+
      '<div class="meta-row">'+meta(x).map(m=>'<span>'+safe(m)+'</span>').join('')+'</div><div class="action-row"></div>';
    const actions=card.querySelector('.action-row');
    const open=el('button','btn btn-ghost mini','<span>Open</span>'); open.style.setProperty('--btn-accent',accent);
    open.addEventListener('click',()=>opts.onOpen?opts.onOpen(x):toast('Canonical detail opens when the governed runtime exposes retrieval.',accent));
    actions.appendChild(open);
    if(opts.evidence!==false){
      const ev=el('button','btn btn-ghost mini','<span>Evidence</span>'); ev.style.setProperty('--btn-accent',accent);
      ev.addEventListener('click',()=>opts.onEvidence?opts.onEvidence(x):toast('Evidence is never fabricated; it remains attached to the canonical object.',accent));
      actions.appendChild(ev);
    }
    return card;
  }
  function board(accent,icon,titleText,sub){return Board({accent,icon,title:titleText,sub,lift:false});}
  async function load(container,id,request,render,emptyCopy){
    const r=room(id); container.setAttribute('aria-busy','true'); container.innerHTML='';
    const shimmer=el('div','shimmer-grid');
    for(let i=0;i<3;i++){const s=el('div','shimmer');s.style.setProperty('--room-accent',r.accent);shimmer.appendChild(s)}
    container.appendChild(shimmer);
    let res;
    try{res=await window.NayaRuntime.roomData(id,request||{});}catch(err){res={ok:false,state:'error',message:err?.message||'The room could not load.'};}
    container.setAttribute('aria-busy','false');
    if(!res?.ok){
      if(res?.state==='empty') empty(container,id,emptyCopy?.title||'Nothing here yet',emptyCopy?.body||'There is no qualifying intelligence in this scope.');
      else if(res?.state==='error') state(container,id,'This room hit an error',res.message||'The governed runtime returned an error.',[{label:'Try again',icon:'arrow',onClick:()=>load(container,id,request,render,emptyCopy)}]);
      else unavailable(container,id,res?.message);

    if(!list.length&&!payload?.summary&&!payload?.reflection&&!payload?.metrics){
      empty(container,id,emptyCopy?.title||'Nothing here yet',emptyCopy?.body||'There is no qualifying intelligence in this scope.'); return;
    }
    container.innerHTML=''; render(payload,list,container);
  }
  window.NayaRoomKit={safe,room,state,unavailable,empty,segmented,items,title,summary,meta,intelCard,board,load};
})();

  law.body.innerHTML='<ul style="margin:0;padding-left:18px;color:var(--ink-dim);font-size:13px;display:grid;gap:8px">'+
    '<li>Doors expose what Naya <b style="color:var(--ink)">can</b> do. LAW decides what Naya <b style="color:var(--ink)">may</b> do.</li>'+
    '<li><b style="color:var(--ink)">CONNECTED ≠ AUTHORIZED.</b> Retrieval also does not grant authorization.</li>'+
    '<li>Consequential crossings require the applicable authority path and verification.</li>'+
    '<li>A registry entry is discoverability metadata, not permission.</li>'+
    '</ul>';
  wrap.appendChild(law);
  return wrap;

  async function loadRegistry(){
    const res=await R.loadDoorRegistry();
    let doors,sourceVerified=false;
    if(res.ok){
      sourceVerified=true;
      doors=(res.data.doors||[]).map((d,i)=>normalize(d,i));
      sourceLine.innerHTML='<span class="led"></span><span>CANONICAL REGISTRY LOADED · '+esc(res.data.version||'V1')+' · '+doors.length+' DOORS</span>';
    }else{
      doors=[...R.DOORS];
      sourceLine.innerHTML='<span class="led" style="background:var(--orange);box-shadow:0 0 10px var(--orange)"></span><span>REGISTRY FETCH UNAVAILABLE · SHOWING BUNDLED MIRROR AS NOT VERIFIED</span>';
    }
    grid.innerHTML='';
    doors.sort((a,b)=>(a.priority??99)-(b.priority??99)).forEach(door=>{
      const card=DoorCard(door,d=>{
        if(!sourceVerified){toast('Canonical registry is not loaded; connection action is withheld rather than inferred from the mirror.',d.accent);return;}
        const out=R.connectDoor(d.id);
        toast(out.message,d.accent);
      });
      grid.appendChild(card);
    });
  }

  function normalize(d,priority){
    const short=String(d.door_id||'').replace(/^DOOR-/,'').toLowerCase();
    const color={github:'#55b9ee',mcp:'#d86cff',ai:'#9d75ff',data:'#55e39a',email:'#ff9a5a',calendar:'#f1d75a',voice:'#ff5e6c',web:'#6675ff',naya:'#b8ee57'}[short]||'#40d3bb';
    const icon={github:'github',mcp:'mcp',ai:'spark',data:'db',email:'mail',calendar:'cal',voice:'mic',web:'connect',naya:'a2a'}[short]||'connect';
    return {id:short,name:d.name,for:(d.capabilities||[]).join(' · '),desc:'Authority: '+(d.required_authority||'governed scope')+' · Health: '+(d.health||'unknown'),accent:color,icon,status:String(d.status||'').startsWith('LIVE')?'live':'contract',priority,registry:d.status};
  }
  function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
}
window.NayaRooms=window.NayaRooms||{};window.NayaRooms.connect=ConnectRoom;

</script>

<script>/* js/app.js @ baf1221d9 — REBUILT 2026-10-02 */
/* APP — boot. Entry lives OUTSIDE the Hub (Sovereign Entrance → Identity);
   the Hub always boots straight into #/hub. Legacy welcome/identity hashes
   redirect into the Hub. The four rich rooms are standalone pages. */

(function () {
  const R = window.NayaRuntime;
  const Router = window.NayaRouter;

  // Rooms that live as standalone pages (same directory).
  const EXTERNAL_ROOMS = { today: 'today.html', reports: 'reports.html', connect: 'connect.html', ledger: 'ledger.html', lists: 'lists.html' };
  function goExternal(room) {
    location.href = EXTERNAL_ROOMS[room] + location.search;
  }

  // Legacy internal entry routes are neutralized — everything lands in the Hub.
  Router.on('welcome', () => { location.hash = '#/hub'; return document.createElement('div'); });
  Router.on('identity', () => { location.hash = '#/hub'; return document.createElement('div'); });
  Router.on('hub', () => window.HubView({ room: 'feed' }));
  Router.on('hub/:room', params => {
    if (EXTERNAL_ROOMS[params.room]) { goExternal(params.room); return document.createElement('div'); }
    return window.HubView(params);
  });
  Router.on('*', () => { location.hash = '#/hub'; return document.createElement('div'); });

  // The Hub IS the app. No hash → straight to the feed.
  if (!location.hash) {
    location.hash = '#/hub';
  }

  Router.render();

  // Debug surface for the team — read-only introspection.
  window.NayaHub = {
    version: R.version,
    rooms: R.ROOMS.map(r => r.id),
    doors: R.DOORS.map(d => ({ id: d.id, status: d.status })),
    stateFor: R.stateFor,
  };
})();

</script>
