<style>/* css/tokens.css @ baf1221d9 */
/* ═══════════════════════════════════════════════════════════════════
   NAYANET HUB — DESIGN TOKENS
   Law source: KNOWLEDGE/DESIGN LAW CONCEPT PART #25.md (Design Law v2,
   on main) — Volume 2, the visual language. Values below are law-exact;
   change them only by Human Director amendment, never by convenience.
   Supersedes the earlier frozen-baseline extraction (ffedda20) where
   values differed: surfaces → obsidian stack, gold/red/emerald/sapphire
   → v2 exact hexes.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  /* ——— The obsidian stack — the only neutrals (Law v2 §2.2) ——— */
  --bg:        #0B0D12;  /* World — the canvas. Everything sits on this. */
  --bg-raise:  #12151D;  /* Raised — cards, panels, drawers. */
  --bg-panel:  #12151D;  /* (alias of Raised) */
  --bg-card:   #171B25;  /* Elevated — popovers, modals, the topmost layer. */
  --bg-elev:   #171B25;  /* Elevated (explicit name). */
  --edge:      #252B39;  /* Precision edge — 1px edges on raised surfaces. */
  --ink:       #F5F7FB;  /* Primary text. Always. */
  --ink-dim:   #F5F7FB;  /* (primary text, dimmed contexts — use --muted below it) */
  --muted:     #AAB2BF;  /* Secondary text. Never for primary content. */
  --muted-2:   #AAB2BF;
  --faint:     #c9c3ce;
  --line:      #ffffff18;
  --line-soft: #ffffff0d;

  /* ——— The semantic spectrum — one color, one job (Law v2 §2.3) ——— */
  --purple:     #9d75ff;  /* Naya's signature. Primary actions, Naya presence. */
  --indigo:     #6675ff;  /* Comprehension / depth / reports. */
  --sapphire:   #55b9ee;  /* Knowledge. Calm, deep, at rest. */
  --blue:       #55b9ee;  /* (alias of sapphire — the working blue) */
  --teal:       #40d3bb;  /* Connection / flow. */
  --emerald:    #55e39a;  /* Alive and well. Working, true, now. */
  --green:      #55e39a;  /* (alias of emerald — the working green) */
  --lime:       #b8ee57;  /* Learning / growth. */
  --yellow:     #f1d75a;  /* Attention / signal. */
  --gold:       #e8b64c;  /* Extraordinary. The rarest word. */
  --orange:     #ff9a5a;  /* Action / movement. */
  --rich-orange:#ff7a3d;  /* Transition / momentum. */
  --red:        #ff5a6e;  /* Blocked / failed. The alarm. Never decorative. */
  --magenta:    #d86cff;  /* Human significance. The human's own things. */

  /* ——— Room accents (one distinct color per room — never two rooms alike) ——— */
  --accent-feed:        var(--green);       /* the living stream */
  --accent-today:       var(--magenta);     /* human significance */
  --accent-reports:     var(--indigo);      /* comprehension / depth */
  --accent-library:     var(--blue);        /* knowledge at rest */
  --accent-connect:     var(--teal);        /* connection / flow */
  --accent-ledger:      var(--gold);        /* value, extraordinary */
  --accent-connections: var(--orange);      /* action / movement */
  --accent-lists:       var(--purple);      /* Naya's signature */
  --accent-mail:        var(--rich-orange); /* messages in motion */
  --accent-spaces:      var(--lime);        /* learning / growth */
  --accent-settings:    #e8eaf2;            /* clean silver / white */

  /* ——— Living depth (the material grammar) ——— */
  --depth-hi:  inset 0 1px #fff6;
  --depth-drop: 0 18px 42px #000b;
  --depth-deep: 0 20px 48px #000d;
  --radius-sm: 11px;
  --radius-md: 13px;
  --radius-lg: 17px;
  --radius-xl: 22px;
  --radius-pill: 999px;

  /* ——— Motion ——— */
  --ease: cubic-bezier(.16,.84,.22,1);
  --dur-fast: .18s;
  --dur-med:  .28s;
  --dur-slow: .5s;

  /* ——— Type ——— */
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-hero: clamp(30px, 4.6vw, 52px);
  --fs-title: 23px;
  --fs-head: 17px;
  --fs-body: 16px;
  --fs-small: 13px;
  --fs-micro: 11.5px;

  /* ——— The living field behind everything ——— */
  --field:
    radial-gradient(1000px 650px at 55% -12%, #6675ff18, transparent 68%),
    radial-gradient(900px 700px at 100% 100%, #d86cff12, transparent 70%),
    var(--bg);
}

.ib-subtitle{font-size:13px;color:#9aa3b2;margin-top:2px;letter-spacing:.02em}
</style>

   BASE — reset, body, focus, motion preferences, scrollbars
   ═══════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scrollbar-color: #ffffff2a transparent;
}

body {
  margin: 0;
  background: var(--field);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
}

h1, h2, h3, h4 { margin: 0; font-weight: 800; letter-spacing: -0.01em; }
p { margin: 0; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }
a { color: inherit; }

/* Visible focus — the elite aesthetic survives keyboard use */
:focus-visible {
  outline: 2px solid var(--magenta);
  outline-offset: 3px;
  border-radius: 6px;
}

/* Reduced motion — living depth calms, never vanishes */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

::selection { background: #d86cff55; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #ffffff22; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

#app { min-height: 100vh; display: flex; flex-direction: column; }

/* Screen-reader only */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.room-outlet { padding: 0 28px; }

/* Main Show hero */
.hero { padding: 30px 0 6px; }
.hero .eyebrow {
  font-size: 11px; letter-spacing: .24em; font-weight: 700;
  color: var(--room-accent, var(--green)); margin-bottom: 12px;
}
.hero h1 { font-size: var(--fs-hero); line-height: 1.08; margin: 0 0 12px; letter-spacing: -0.01em; }
.hero-sub { font-size: 17px; line-height: 1.6; color: var(--ink-dim); max-width: 760px; margin: 0 0 10px; }

/* Room head (non-feed rooms) */
.room-head { padding: 28px 0 4px; }
.room-head .kicker {
  font-size: 11px; letter-spacing: .24em; font-weight: 700;
  color: var(--room-accent, var(--purple)); margin-bottom: 10px;
}
.room-head h2 { font-size: 27px; margin: 0 0 8px; letter-spacing: -0.01em; }
.room-head p { font-size: 15.5px; color: var(--muted); line-height: 1.6; max-width: 760px; margin: 0; }
.room-body { padding: 18px 0 8px; }

/* Search result panel */
.global-search-result { margin: 18px 0; }
.search-answer { color: var(--ink-dim); font-size: 15.5px; line-height: 1.65; margin: 0 0 12px; }
.empty-instrument { padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius-md); }
.empty-instrument strong { display: block; font-size: 15px; margin-bottom: 6px; }
.empty-instrument p { margin: 0; color: var(--muted); font-size: 14px; }

/* ——— Right rail: removed. The Hub has no right sidebar — the content owns the width. ——— */
@media (min-width: 1400px) {
  .shell { grid-template-columns: 264px minmax(0, 1fr); }
}
.naya-card {
  background: linear-gradient(180deg, #14101d, #0d0c12);
  border: 1px solid color-mix(in srgb, var(--purple) 28%, transparent);
  border-radius: var(--radius-xl);
  padding: 22px 18px;
  box-shadow: var(--depth-hi), var(--depth-drop);
  text-align: center;
}
.naya-face {
  width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 26px; font-weight: 800; color: #0b0d12;
  background: radial-gradient(circle at 32% 28%, #c9b3ff, var(--purple) 62%, #6a4fd0);
  box-shadow: 0 6px 22px color-mix(in srgb, var(--purple) 45%, transparent);
}
.naya-card h2 { font-size: 19px; margin: 0; }
.naya-sub { font-size: 10px; letter-spacing: .2em; color: var(--muted); margin: 6px 0 16px; }
.naya-block { text-align: left; margin-bottom: 14px; }
.naya-block b { display: block; font-size: 10.5px; letter-spacing: .16em; color: var(--purple); margin-bottom: 6px; }
.naya-block p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink-dim); }
.naya-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.naya-actions .btn { width: 100%; justify-content: center; }
.rail-card {
  margin-top: 14px; padding: 16px;
  border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
  background: var(--bg-panel);
}
.rail-card b { display: block; font-size: 10.5px; letter-spacing: .16em; color: var(--muted); margin-bottom: 8px; }
.rail-card p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-dim); }

/* ——— Mobile drawer ——— */
.drawer-backdrop {
  display: none;
  position: fixed; inset: 0; z-index: 55;
  background: rgba(3, 3, 6, .6);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
@media (max-width: 900px) {
  .shell { display: block; }
  .rail.left {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: min(300px, 84vw); height: 100dvh;
    transform: translateX(-106%);
    transition: transform var(--dur-med) var(--ease);
    z-index: 60;
    box-shadow: var(--depth-deep);
  }
  .shell.drawer-open .rail.left { transform: none; }
  .shell.drawer-open .drawer-backdrop { display: block; }
  body.drawer-open { overflow: hidden; }
  .rooms-plus { display: grid; }
  .top { padding: 11px 14px; gap: 10px; }
  .top-title b { font-size: 11.5px; }
  .top-status { font-size: 10px; }
  .top-status span:last-child { display: none; }
  .searchWrap { padding: 16px 14px 0; }
  .shell-lens { padding: 14px 14px 0; }
  .room-outlet { padding: 0 14px; }
  .hero h1 { font-size: clamp(30px, 9vw, 40px); }
  .hero-sub { font-size: 16px; }
  .room-head h2 { font-size: 23px; }
}
@media (min-width: 1700px) {
  .top, .searchWrap, .shell-lens, .room-outlet { padding-left: 44px; padding-right: 44px; }
}

/* ——— Reduced motion ——— */
@media (prefers-reduced-motion: reduce) {
  .rail.left, .plus-btn, .nav-btn { transition: none !important; }
}

/* ——— Focus visibility ——— */
:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

/* ═══════════════════════════════════════════════════════════════════
   THE MAIN SHOW — Design Law v2 visual language
   (KNOWLEDGE/DESIGN LAW CONCEPT PART #25.md, Vol. 2).
   Boards cycle the canonical spectrum order — purple → sapphire →
   emerald — down the feed. Within a board, each layer wears the color
   whose LAW JOB matches its meaning (Vol. 2 §2.3 — one color, one job):
   nutshell white (the words) · human magenta (human significance) ·
   child sapphire (calm clarity) · grandma emerald (alive and well) ·
   naya purple (Naya's signature) · machine indigo (comprehension) ·
   learning lime (growth) · value gold (the extraordinary) ·
   apply orange (action) · connects teal (flow) ·
   decisions yellow (attention) · proof sapphire (knowledge at rest) ·
   truth-boundary red (the alarm) · next-action rich orange (momentum).
   Amendment note 2026-10-02: the director's verbal mapping
   (human=purple, naya=yellow) contradicts the law's color jobs
   (purple=Naya's signature, magenta=human significance); per the
   contract's conflict rule the contract wins until he amends it.
   Boards are elevated per the depth law; body text #F5F7FB always
   (LAW ZERO). Nothing sticky at the bottom.
   ═══════════════════════════════════════════════════════════════════ */

/* Topbar: spacer pushes the ecosystem plus menu to the top-right corner. */
.top-spacer { flex: 1 1 auto; }

/* ——— Lens tabs: three compact buttons in one row, real navigation ——— */
.lens-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 26px 0 8px;
}
/* Lens tabs: white light idle (visible) · signature color on hover · subtle active */
.lens-tab {
  appearance: none; border: 2px solid rgba(255,255,255,.35); border-radius: 12px;
  background: linear-gradient(145deg, var(--bg-raise), var(--bg));
  color: var(--ink); cursor: pointer; text-align: center;
  padding: 9px 8px 8px;
  box-shadow: inset 0 1px rgba(255,255,255,.12), 0 0 14px rgba(255,255,255,.1), 0 4px 12px #00000070;
  transition: transform .18s cubic-bezier(.16,.84,.22,1), border-color .18s, box-shadow .18s;
}
.lens-tab b { display: block; font-size: 15px; letter-spacing: .08em; }
/* Hover: signature color ignites */
.lens-tab.lens-collective:hover { transform: translateY(-2px); border-color: #9d75ff; box-shadow: 0 0 22px rgba(157,117,255,.5), inset 0 1px rgba(255,255,255,.15); }
.lens-tab.lens-personal:hover { transform: translateY(-2px); border-color: #4da6ff; box-shadow: 0 0 22px rgba(77,166,255,.5), inset 0 1px rgba(255,255,255,.15); }
.lens-tab.lens-activity:hover { transform: translateY(-2px); border-color: #4ade80; box-shadow: 0 0 22px rgba(74,222,128,.5), inset 0 1px rgba(255,255,255,.15); }
/* Active: white indicator only — color comes on hover */
.lens-tab.active {
  border-color: rgba(255,255,255,.6); color: var(--ink);
  box-shadow: inset 0 1px rgba(255,255,255,.15), 0 0 16px rgba(255,255,255,.15);
  background: linear-gradient(145deg, var(--bg-elev), var(--bg));
}
.lens-tab.lens-personal:hover { border-color: #4da6ff88; }
.lens-tab.lens-activity:hover { border-color: #4ade8088; }
/* ——— Smart Tabs: topic navigation generated from the notes themselves.
   Tabs are navigation intent, so they stay neutral — the active tab earns
   the purple primary-action accent. Human tabs carry a small dot. ——— */
/* ——— Smart Tabs v9: the pill ribbon. ———
   Larger tactile pills, horizontal scroll with fade edges, the + Add control
   as a dashed circle, glowing border on the active tab. System tabs (All +
   per-topic) are permanent; human tabs are named views saved on this device.
   The active tab wears the purple primary-action accent. */
.smart-tabs {
  display: flex; align-items: center; gap: 10px;
  overflow-x: auto; scrollbar-width: none;
  margin: 20px -6px 0; padding: 12px 6px 18px;
  border-bottom: 1px solid var(--line);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent);
}
.smart-tabs::-webkit-scrollbar { display: none; }
/* ——— SmartTabs v9 pill language (Naya 4's port) ———
   Dark pill, bold label, per-tab spectrum color (--tc) that ignites
   on hover/select. 💜 = purple inset glow, ⭐ = gold inset glow. */
/* SmartTabs: white light idle (visible borders) · color ignites on hover only */
.smart-tab {
  --tc: #9d75ff;
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 20px; border-radius: 999px; cursor: pointer; user-select: none;
  border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.55);
  color: #fff; font-family: inherit; font-weight: 900; font-size: 13px; letter-spacing: .03em;
  white-space: nowrap;
  box-shadow: 0 0 14px rgba(255,255,255,.12), inset 0 1px rgba(255,255,255,.1);
  transition: box-shadow .25s, border-color .2s, text-shadow .25s, transform .18s;
}
.smart-tab .sn-label { white-space: nowrap; }
.smart-tab .sn-mark { font-size: 14px; line-height: 1; }
.smart-tab:hover, .smart-tab:focus-visible {
  border-color: var(--tc); outline: none; transform: translateY(-2px);
  box-shadow: 0 0 22px -2px var(--tc), 0 0 0 2px var(--tc) inset;
  text-shadow: 0 0 10px var(--tc);
}
/* Active: subtle white indicator only — color comes on hover (Shawn 2026-10-03) */
.smart-tab.active {
  border-color: rgba(255,255,255,.6);
  box-shadow: 0 0 16px rgba(255,255,255,.18), inset 0 1px rgba(255,255,255,.15);
}
.smart-tab.active:hover {
  border-color: var(--tc);
  box-shadow: 0 0 22px -2px var(--tc), 0 0 0 2px var(--tc) inset;
  text-shadow: 0 0 10px var(--tc);
}
.smart-tab .sn-more {
  border: 0; background: rgba(255,255,255,.1); color: #fff; border-radius: 8px;
  padding: 3px 9px; cursor: pointer; font-size: 13px; line-height: 1.5; font-family: inherit;
  transition: background .2s;
}
.smart-tab .sn-more:hover { background: rgba(255,255,255,.22); }
.smart-tab.add-tab {
  border-style: dashed; color: var(--muted);
  padding: 12px 18px;
}
.smart-tab.add-tab:hover {
  color: #fff; border-color: #fff; box-shadow: none; text-shadow: none;
  transform: translateY(-2px);
}
/* ——— Tab menu + editor popover ——— */
.tab-menu, .tab-pop {
  position: fixed; z-index: 1000; display: none;
  background: linear-gradient(180deg, #121827, #0e1424);
  border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
  box-shadow: 0 18px 40px rgba(0,0,0,.5);
}
.tab-menu { min-width: 220px; }
.tab-menu .mi {
  padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08);
  cursor: pointer; color: #fff; font-weight: 800; font-size: 13px;
}
.tab-menu .mi:last-child { border-bottom: none; }
.tab-menu .mi:hover { background: rgba(255,255,255,.06); }
.tab-pop { min-width: 300px; padding: 14px; color: #fff; }
.tab-pop h3 { margin: 0 0 10px; font-size: 15px; }
.tab-pop .row { display: grid; gap: 6px; margin: 8px 0; }
.tab-pop label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.tab-pop input {
  padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
  background: #0a0f1a; color: #e6ecff; font-size: 13px;
}
.tab-pop .toggles { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.tab-pop .tgl {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-radius: 10px; border: 1px solid rgba(255,255,255,.22);
  background: rgba(0,0,0,.45); cursor: pointer; color: #fff; font-weight: 800; font-size: 13px;
}
.tab-pop .tgl.on {
  box-shadow: 0 0 0 2px rgba(255,255,255,.3) inset, 0 0 18px rgba(124,77,255,.25);
}
.tab-pop .ft { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
.tab-pop .btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px;
  border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-weight: 800; font-size: 13px;
}
.tab-pop .btn.primary { background: linear-gradient(135deg, #6F3DFF, #9D7BFF); border-color: transparent; }


/* ——— Tab manager popover: add / retarget / delete your tabs ——— */
.tab-pop {
  position: fixed; z-index: 80; min-width: 270px; max-width: 330px;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 18px 48px #000000c0; padding: 14px;
}
.tab-pop-title {
  display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin: 12px 0 8px;
}
.tab-pop-title:first-child { margin-top: 0; }
.tab-pop-list { display: flex; flex-direction: column; gap: 6px; }
.tab-pop-note { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 6px; }
.tab-pop-add {
  appearance: none; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg-raise); color: var(--ink); cursor: pointer;
  font-size: 15px; text-align: left; padding: 9px 12px;
}
.tab-pop-add:hover { border-color: var(--purple); color: #fff; }
.tab-pop-row { display: flex; align-items: center; gap: 8px; }
.tab-pop-name { flex: 1 1 auto; color: var(--ink); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-pop-row select {
  background: var(--bg-raise); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  font-size: 14px; padding: 7px 8px; max-width: 128px;
}
.tab-pop-del {
  appearance: none; border: 1px solid var(--line); border-radius: 8px;
  background: transparent; color: var(--muted); cursor: pointer;
  font-size: 16px; line-height: 1; padding: 6px 10px;
}
.tab-pop-del:hover { color: var(--red); border-color: var(--red); }

/* ——— Intelligence boards ——— */
.show-feed { display: flex; flex-direction: column; gap: 24px; margin-top: 16px; margin-bottom: 0; }
.show-prov { color: var(--muted); font-size: 14px; line-height: 1.5; text-align: center; margin: 8px 0 0; }

.intel-board {
  --tone: var(--purple);
  position: relative;
  border: 2px solid color-mix(in srgb, var(--tone) 55%, #fff 14%);
  border-radius: 26px;
  padding: 32px 32px 24px;
  background:
    radial-gradient(720px 240px at 50% -8%, color-mix(in srgb, var(--tone) 14%, transparent), transparent 72%),
    linear-gradient(145deg, var(--bg-raise), var(--bg));
  box-shadow:
    inset 0 1px #ffffff2e,
    0 28px 64px #000000c0,
    0 0 44px color-mix(in srgb, var(--tone) 18%, transparent);
  overflow: hidden;
}
/* Board theme rotation: purple → sapphire → emerald (canonical spectrum order) */
.intel-board.tone-purple  { --tone: var(--purple); }
.intel-board.tone-sapphire { --tone: var(--sapphire); }
.intel-board.tone-emerald { --tone: var(--emerald); }
.intel-board.tone-indigo { --tone: #6675ff; }
.intel-board.tone-forest { --tone: #2e9e6a; }
.intel-board.tone-lime { --tone: #b8ee57; }
.intel-board.tone-gold { --tone: #ffd45a; }
.intel-board.tone-orange { --tone: #ff8c42; }
.intel-board.tone-ruby { --tone: #ff5e6c; }
.intel-board.tone-magenta { --tone: #ed42c4; }
/* Elevated edge light */
.intel-board::before {
  content: ""; position: absolute; left: 10px; top: 18px; bottom: 18px; width: 4px;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--tone), color-mix(in srgb, var(--tone) 70%, #fff 12%), var(--tone));
  box-shadow: 0 0 28px color-mix(in srgb, var(--tone) 55%, transparent);
  pointer-events: none;
}
.intel-board::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, #ffffff08, transparent 22%);
}

.ib-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.ib-jewel {
  width: 64px; height: 64px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  /* Circular metallic — like a coin/medal, from the deployed original */
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.95), transparent 35%),
    radial-gradient(circle at 70% 75%, rgba(0,0,0,.45), transparent 50%),
    radial-gradient(circle at 50% 50%, var(--tone), color-mix(in srgb, var(--tone) 55%, #000) 85%);
  border: 2px solid rgba(255,255,255,.4);
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.6),
    inset 0 -4px 12px rgba(0,0,0,.5),
    0 0 28px color-mix(in srgb, var(--tone) 65%, transparent),
    0 10px 24px rgba(0,0,0,.6);
}
.ib-kind { font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--tone); }
.ib-id { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
.ib-truth {
  margin-left: auto; font-size: 12px; font-weight: 800; letter-spacing: .1em;
  color: var(--emerald); border: 1px solid color-mix(in srgb, var(--emerald) 40%, transparent);
  background: color-mix(in srgb, var(--emerald) 8%, transparent);
  padding: 7px 11px; border-radius: 999px;
}
.ib-title {
  color: var(--ink); font-size: clamp(24px, 2.8vw, 32px); line-height: 1.12;
  letter-spacing: -0.01em; margin: 0 0 20px; font-weight: 800;
  text-wrap: balance;
}


/* ——— V10 faceted jewel icons ——— */
.v10-icon { width: 30px; height: 30px; flex: 0 0 30px; overflow: visible;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,.55)) drop-shadow(0 0 12px currentColor); }
.v10-icon .core { fill: currentColor; stroke: none; opacity: .98; }
.v10-icon .facet { fill: #ffffff; stroke: none; opacity: .48; }
.v10-icon .shade { fill: #000000; stroke: none; opacity: .28; }
.v10-icon .edge { fill: none; stroke: #ffffff; stroke-width: 1.1;
  stroke-linecap: round; stroke-linejoin: round; opacity: .92; }
.ib-layer-head .v10-icon { width: 32px; height: 32px; flex-basis: 32px; }
/* Layer jewel: black core, color glow — premium depth */
.layer-jewel-wrap {
  display: inline-grid; place-items: center;
  width: 36px; height: 36px; flex: none;
  filter: drop-shadow(0 0 10px var(--lc)) drop-shadow(0 2px 6px rgba(0,0,0,.6));
}
.layer-jewel-svg { width: 36px; height: 36px; }
/* Retire the 12px dot — replaced by faceted jewels */
.ib-dot { display: none; }


/* ——— Jewel bullets (reports-grade) ———
   Markdown lists render as mini-jewel markers, not browser discs. */
.ib-layer-body ul, .board-body ul {
  list-style: none; margin: 12px 0; padding: 0;
  display: flex; flex-direction: column; gap: 12px;
}
.ib-layer-body ul li, .board-body ul li {
  display: flex; gap: 12px; align-items: flex-start;
  font-size: 16px; line-height: 1.65; color: #e8e4ee; font-weight: 500;
  padding: 0; margin: 0;
}
/* v1.1 Job #1: Accent jewels — hot pink · purple · blue · green · gold
   Black diamond core, color fire around the edge. Jewelry, not dots. */
.ib-layer-body ul li::before, .board-body ul li::before {
  content: ""; flex: none;
  width: 24px; height: 24px; margin-top: 2px; border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, #0a0a0e 0%, #0a0a0e 35%, transparent 36%),
    radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), transparent 40%),
    radial-gradient(circle at 50% 50%, var(--lc, #8a5cff), color-mix(in srgb, var(--lc, #8a5cff) 30%, #000) 100%);
  border: 2px solid var(--lc, #8a5cff);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.6),
    inset 0 -2px 6px rgba(0,0,0,.5),
    0 0 16px var(--lc, #8a5cff),
    0 0 4px var(--lc, #8a5cff),
    0 4px 12px rgba(0,0,0,.6);
}
/* v1.1 accent jewel cycle: hot pink → purple → blue → green → gold (repeat) */
.ib-layer-body ul li:nth-child(5n+1)::before, .board-body ul li:nth-child(5n+1)::before { --lc: #ed42c4; }
.ib-layer-body ul li:nth-child(5n+2)::before, .board-body ul li:nth-child(5n+2)::before { --lc: #8a5cff; }
.ib-layer-body ul li:nth-child(5n+3)::before, .board-body ul li:nth-child(5n+3)::before { --lc: #3ca8ff; }
.ib-layer-body ul li:nth-child(5n+4)::before, .board-body ul li:nth-child(5n+4)::before { --lc: #35e39b; }
.ib-layer-body ul li:nth-child(5n+5)::before, .board-body ul li:nth-child(5n+5)::before { --lc: #d4a017; }




/* ——— Mobile share FAB (bottom-corner) ——— */
.share-fab {
  --jewel: #ffea00;
  position: fixed; right: 20px; bottom: 20px; z-index: 9000;
  width: 56px; height: 56px; border-radius: 18px;
  border: 1px solid rgba(255,255,255,.35);
  background:
    radial-gradient(circle at 32% 22%, rgba(255,255,255,.85), transparent 42%),
    radial-gradient(circle at 50% 55%, var(--jewel), color-mix(in srgb, var(--jewel) 45%, #000) 78%);
  color: #fff; cursor: pointer;
  display: none; place-items: center;
  font-size: 24px; font-weight: 900;
  text-shadow: 0 2px 8px rgba(0,0,0,.6);

    inset 0 1px rgba(255,255,255,.5),

    0 0 24px color-mix(in srgb, var(--jewel) 60%, transparent),

}
@media (max-width: 768px) {
  .share-fab { display: grid; }
}
.share-fab:active { transform: scale(.94); }









/* ——— Dynamic date header ——— */
.hero-date {
  font-size: 18px !important;
  font-weight: 600 !important;
  letter-spacing: .02em !important;
  color: var(--ink) !important;
}
.hero-date .hero-time {
  color: var(--muted);
  font-weight: 500;
  margin-left: 8px;
}

/* ——— Responsive: keep actions top-right, compact on mobile ——— */
@media (max-width: 640px) {
  .board-top-actions {
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 6px;
  }
  .board-top-actions .action {

  }

  }
}

/* ——— Rating numeric display ——— */
.rating-num {
  font-size: 13px; font-weight: 800;
  color: var(--gold, #ffea00);
  margin-left: 8px;
  min-width: 32px;
}

/* ——— Action count badges ——— */
.action-count {
  display: inline-grid; place-items: center;
  min-width: 22px; height: 22px; padding: 0 6px;
  margin-left: 8px;
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  font-size: 11px; font-weight: 800;
  color: var(--ink);
}
.action.on .action-count {
  background: rgba(255,255,255,.2);
  border-color: rgba(255,255,255,.35);
}

/* ——— Toggle feedback: border flash ——— */
@keyframes borderFlash {
  0% { filter: brightness(1); }
  30% { filter: brightness(1.3); }
  100% { filter: brightness(1); }
}
.intel-board.flash {
  animation: borderFlash .4s ease-out;
}

/* ——— Smooth lens transitions ——— */
.show-feed {
  transition: opacity .15s ease-out;
}
.show-feed.lens-switching {
  opacity: 0;
}

/* ——— IN A NUTSHELL as a moment (not just a label) ——— */
.ib-nutshell {
  font-size: 18px !important;
  line-height: 1.7 !important;
  padding: 16px 20px 16px 24px !important;
  border-left: 3px solid var(--tone, #9d75ff) !important;
  background: linear-gradient(90deg, color-mix(in srgb, var(--tone, #9d75ff) 8%, transparent), transparent 70%) !important;
  border-radius: 0 12px 12px 0 !important;
  margin: 16px 0 20px !important;
}
.ib-nutshell .ib-nutshell-label {
  display: block;
  font-size: 11px;
  letter-spacing: .18em;
  font-weight: 800;
  color: var(--tone, #9d75ff);
  margin-bottom: 8px;
}

/* ——— Star rating pulse animation ——— */
@keyframes starPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
.star-rating button.pulse {
  animation: starPulse .25s cubic-bezier(.16,.84,.22,1);
}

/* ——— Block hover lift (triple-A tactile feel) ——— */
.intel-board {
  transition: transform .25s cubic-bezier(.16,.84,.22,1), box-shadow .25s;
}
.intel-board:hover {
  transform: translateY(-3px);
}
.intel-board.tone-gold:hover { box-shadow: inset 0 1px #fff8, 0 30px 70px #000c, 0 0 60px #d4a01755; }
.intel-board.tone-red:hover { box-shadow: inset 0 1px #fff8, 0 30px 70px #000c, 0 0 60px #ff5e6c55; }
.intel-board.tone-purple:hover { box-shadow: inset 0 1px #fff8, 0 30px 70px #000c, 0 0 60px #9d75ff55; }
.intel-board.tone-blue:hover { box-shadow: inset 0 1px #fff8, 0 30px 70px #000c, 0 0 60px #55b9ee55; }
.intel-board.tone-green:hover { box-shadow: inset 0 1px #fff8, 0 30px 70px #000c, 0 0 60px #55e39a55; }

/* ——— Theme-colored block borders (from deployed original) ——— */
.intel-board.tone-gold { border-color: color-mix(in srgb, #d4a017 60%, transparent); box-shadow: inset 0 1px #fff8, 0 24px 60px #000b, 0 0 42px #d4a01733; }
.intel-board.tone-red { border-color: color-mix(in srgb, #ff5e6c 60%, transparent); box-shadow: inset 0 1px #fff8, 0 24px 60px #000b, 0 0 42px #ff5e6c33; }
.intel-board.tone-purple { border-color: color-mix(in srgb, #9d75ff 60%, transparent); box-shadow: inset 0 1px #fff8, 0 24px 60px #000b, 0 0 42px #9d75ff33; }
.intel-board.tone-blue { border-color: color-mix(in srgb, #55b9ee 60%, transparent); box-shadow: inset 0 1px #fff8, 0 24px 60px #000b, 0 0 42px #55b9ee33; }
.intel-board.tone-green { border-color: color-mix(in srgb, #55e39a 60%, transparent); box-shadow: inset 0 1px #fff8, 0 24px 60px #000b, 0 0 42px #55e39a33; }

/* ——— Microcopy trust signals (from deployed original) ——— */
.ib-microcopy {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 16px; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 10px; letter-spacing: .14em; color: var(--muted);
  font-weight: 700;
}
.ib-microcopy .left { text-align: left; }
.ib-microcopy .right { text-align: right; }

/* ——— Premium jewel elements (reports-grade DOM jewels) ——— */
.pj-jewel {
  --jewel: #8a5cff;
  width: 26px; height: 26px; flex: none; border-radius: 8px;
  display: grid; place-items: center; font-size: 11px; font-weight: 900;
  color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.6);
  background:
    radial-gradient(circle at 32% 22%, rgba(255,255,255,.85), transparent 42%),
    radial-gradient(circle at 50% 55%, var(--jewel), color-mix(in srgb, var(--jewel) 45%, #000) 78%);
  border: 1px solid rgba(255,255,255,.35);
  box-shadow:
    inset 0 1px rgba(255,255,255,.5),
    inset 0 -3px 8px rgba(0,0,0,.4),
    0 0 14px color-mix(in srgb, var(--jewel) 55%, transparent),
    0 4px 12px rgba(0,0,0,.5);
  margin-top: 2px;
}
.pj-jewel-lg {
  width: 44px; height: 44px; border-radius: 13px; font-size: 20px;
  box-shadow:
    inset 0 1px rgba(255,255,255,.5),
    inset 0 -3px 8px rgba(0,0,0,.4),
    0 0 22px color-mix(in srgb, var(--jewel) 55%, transparent),
    0 8px 20px rgba(0,0,0,.5);
}
/* Hide the CSS pseudo-element bullets when JS jewels are active */
.ib-layer-body ul li.pj-enhanced::before, .board-body ul li.pj-enhanced::before {
  display: none;
}
.ib-layer-body ul li.pj-enhanced, .board-body ul li.pj-enhanced {
  align-items: flex-start;
}

/* ——— Board action system (social intelligence actions) ——— */
.board-top-actions {
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
  margin-left: auto; align-items: flex-start;
}
.board-actions {
  display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
  align-items: center; gap: 12px; width: 100%;
  margin-top: 18px; padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.board-actions-left { display: flex; gap: 10px; justify-content: flex-start; align-items: center; }
.board-actions-center { display: flex; justify-content: center; align-items: center; }
.board-actions-right { display: flex; justify-content: flex-end; align-items: center; }
.action {
  min-height: 52px; padding: 0 22px;
  border: 2px solid var(--action-color, #9d75ff); border-radius: 999px;
  background: linear-gradient(145deg, color-mix(in srgb, var(--action-color, #9d75ff) 16%, #101016), #08080c);
  color: #fff; font-size: 13px; font-weight: 900; letter-spacing: .03em;
  cursor: pointer; white-space: nowrap;
  box-shadow: inset 0 1px #fff5, 0 9px 20px #0008,
    0 0 16px color-mix(in srgb, var(--action-color, #9d75ff) 12%, transparent);
  transition: .2s cubic-bezier(.16,.84,.22,1);
}
.action:hover { transform: translateY(-2px); filter: brightness(1.15); }
.action:focus-visible { outline: 2px solid var(--action-color, #9d75ff); outline-offset: 2px; }
.action.on { box-shadow: inset 0 1px #fff6, 0 9px 20px #0009,
  0 0 26px color-mix(in srgb, var(--action-color, #9d75ff) 45%, transparent); }
.action[data-kind="create-space"] { --action-color: #9d75ff; }
.action[data-kind="favorite"] { --action-color: #d4a017; }
.action[data-kind="save"] { --action-color: #55b9ee; }
.action[data-kind="love"] { --action-color: #ff5e6c; }
.action[data-kind="like"] { --action-color: #55b9ee; }
.action[data-kind="share-intel"] { --action-color: #d86cff; }
.action[data-kind="naya-play"] { --action-color: #9d75ff; }
.action[data-kind="love"].on { border-color: #ff3f52; background: linear-gradient(145deg,#391019,#09090d); }
.star-rating {
  display: inline-flex; gap: 4px; align-items: center; padding: 6px;
  border: 2px solid #d4a01788; border-radius: 14px; background: #0b0a0e;
  box-shadow: inset 0 1px #fff4, 0 8px 18px #0008;
}
.star-rating button {
  min-width: 46px; min-height: 44px;
  border: 2px solid #d4a01755; border-radius: 9px; background: #16130a;
  color: #d4a017; font-size: 19px; cursor: pointer;
  transition: .18s cubic-bezier(.16,.84,.22,1);
}
.star-rating button:hover, .star-rating button.on {
  color: #fff3a6; border-color: #f8e7a0; background: #2a230f;
  text-shadow: 0 0 14px #f4d97899;
}
.star-rating button:focus-visible { outline: 2px solid #d4a017; outline-offset: 2px; }
.add-intel {
  margin-top: 16px; padding: 18px;
  border: 2px solid rgba(255,255,255,.1); border-radius: 16px;
  background: #08080c;
}
.add-intel b { display: block; font-size: 12px; letter-spacing: .12em; margin-bottom: 12px; color: var(--ink); }
.add-intel-row { display: flex; gap: 10px; }
.add-intel input {
  flex: 1; border: 2px solid #ffffff22; border-radius: 12px;
  background: #07070a; color: #fff; padding: 12px 14px; font-size: 14px; outline: 0;
}
.add-intel input:focus { border-color: var(--purple); }
.add-intel input::placeholder { color: var(--muted); }
@media (max-width: 700px) {
  .board-actions { grid-template-columns: 1fr; gap: 10px; }
  .board-actions-left, .board-actions-right { justify-content: stretch; }
  .board-actions-left .action, .board-actions-right .action { flex: 1; }
  .star-rating { width: 100%; justify-content: space-between; }
  .star-rating button { flex: 1; min-width: 0; }
  .add-intel-row { flex-direction: column; }
}


/* ——— Nutshell (IN A NUTSHELL summary) ——— */
.ib-nutshell {
  margin: 22px 0 19px; padding: 20px 21px;
  border: 2px solid #ffffff16; border-radius: 18px;
  background: #08080d;
  box-shadow: inset 0 1px #fff3, 0 16px 35px #0009;
}
.ib-nutshell b {
  display: block; color: #f4f2f7; font-size: 12px;
  letter-spacing: .16em; margin-bottom: 8px; font-weight: 800;
}
.ib-nutshell p {
  font-size: 17px; line-height: 1.65; color: #eeeaf2;
  margin: 0; font-weight: 500;
}
/* ——— Layer state label (right side of layer header) ——— */
.ib-state {
  margin-left: auto; color: #706a77; font-size: 11px;
  letter-spacing: .08em; font-weight: 700; white-space: nowrap;
}
.ib-layer-head .ib-chev { display: none; } /* replaced by state label */


/* ——— Block top: identity (jewel + title + meta) · truth badge ——— */
.ib-blocktop {
  display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
  margin-bottom: 6px;
}
.ib-identity { display: flex; gap: 14px; min-width: 0; align-items: flex-start; }
.ib-identity .ib-jewel { width: 64px; height: 64px; }
.ib-title {
  font-size: clamp(24px, 3vw, 38px); line-height: 1.05; letter-spacing: -.02em;
  margin: 0 0 8px; color: var(--ink); font-weight: 850;
}
.ib-meta {
  display: flex; gap: 8px; flex-wrap: wrap;
  color: #817a89; font-size: 11px; font-weight: 800; letter-spacing: .08em;
}
.ib-meta span { white-space: nowrap; }
.ib-truth {
  padding: 8px 12px; border: 2px solid #55e39a45; border-radius: 999px;
  color: #bfffd8; background: #55e39a08;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; white-space: nowrap;
  flex: none;
}

.ib-layers { display: flex; flex-direction: column; gap: 12px; }
.ib-layer {
  --lc: var(--ink);
  border: 2px solid color-mix(in srgb, var(--lc) 42%, #fff 8%);
  border-radius: 18px;
  background: linear-gradient(145deg, var(--bg-raise), var(--bg));
  box-shadow: inset 0 1px #ffffff1c, 0 14px 30px #00000090,
    0 0 20px color-mix(in srgb, var(--lc) 10%, transparent);
  overflow: hidden;
}
/* Per-layer colors — Design Law v2 §2.3: one color, one job. */
.ib-layer.layer-white      { --lc: var(--ink); }         /* the words */
.ib-layer.layer-magenta    { --lc: var(--magenta); }     /* human significance */
.ib-layer.layer-sapphire   { --lc: var(--sapphire); }    /* calm clarity / knowledge */
.ib-layer.layer-emerald    { --lc: var(--emerald); }     /* alive and well */
.ib-layer.layer-purple     { --lc: var(--purple); }      /* Naya's signature */
.ib-layer.layer-indigo     { --lc: var(--indigo); }      /* comprehension */
.ib-layer.layer-lime       { --lc: var(--lime); }        /* learning / growth */
.ib-layer.layer-gold       { --lc: var(--gold); }        /* value — the extraordinary */
.ib-layer.layer-orange     { --lc: var(--orange); }      /* action */
.ib-layer.layer-teal       { --lc: var(--teal); }        /* connection / flow */
.ib-layer.layer-yellow     { --lc: var(--yellow); }      /* attention / signal */
.ib-layer.layer-richorange { --lc: var(--rich-orange); } /* transition / momentum */
.ib-layer.layer-red        { --lc: var(--red); }         /* the alarm */

.ib-layer-head {
  width: 100%; appearance: none; background: none; border: 0; cursor: pointer;
  display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 16px; color: var(--ink);
}
.ib-dot {
  width: 12px; height: 12px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff, var(--lc) 70%);
  box-shadow: 0 0 14px var(--lc);
}
.ib-layer-head b { font-size: 18px; letter-spacing: .07em; color: var(--ink); }
.ib-layer-head .ib-chev {
  margin-left: auto; color: var(--lc); font-size: 16px;
  transition: transform .2s cubic-bezier(.16,.84,.22,1);
}
.ib-layer-head.open .ib-chev { transform: rotate(180deg); }
.ib-layer-body { padding: 8px 24px 24px; }
.ib-layer-body p { color: var(--ink); font-size: 17px; line-height: 1.7; margin: 0 0 12px; }
.ib-layer-body p:last-child { margin-bottom: 0; }
.ib-layer-body ul { margin: 0 0 12px; padding-left: 24px; color: var(--ink); font-size: 16px; line-height: 1.7; }
.ib-layer-body li { margin-bottom: 8px; }
.ib-layer-body strong { color: var(--ink); }
.ib-layer-body code {
  font-family: ui-monospace, monospace; font-size: 14px; color: var(--yellow);
  background: #ffffff10; padding: 2px 7px; border-radius: 6px;
}
/* Deeper layers sit quieter until opened */
.ib-layer.is-deeper .ib-layer-head b { font-size: 16px; color: var(--ink); }

.ib-foot {
  margin-top: 18px; padding-top: 14px; border-top: 2px solid #ffffff16;
  color: #8f8898; font-size: 12.5px; line-height: 1.5; word-break: break-all;
}

/* ——— Activity stream ——— */
.activity-stream { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
/* ——— ACTIVITY HERO: "The Pulse" ——— */
.activity-hero {
  position: relative; overflow: hidden;
  border-radius: 24px; margin-bottom: 32px;
  border: 2px solid rgba(255,255,255,.25);
  background: linear-gradient(180deg, rgba(20,16,28,.8), rgba(10,8,14,.9));
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  box-shadow: inset 0 1px rgba(255,255,255,.08), 0 24px 60px rgba(0,0,0,.5);
  padding: 48px 36px; text-align: center;
}
.activity-pulse-ring {
  position: absolute; top: 50%; left: 50%;
  width: 400px; height: 400px; border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(157,117,255,.12), rgba(237,66,196,.06) 45%, transparent 70%);
  animation: pulsebreathe 5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes pulsebreathe { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: .7; } 50% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } }
.activity-hero-inner { position: relative; }
.activity-kicker {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 11px; font-weight: 800; letter-spacing: .24em; color: #fff;
  margin-bottom: 16px; text-shadow: 0 0 14px rgba(255,255,255,.4);
}
.activity-live-dot {
  width: 10px; height: 10px; border-radius: 50%; background: #35e39b;
  box-shadow: 0 0 14px #35e39b; animation: livedot 1.6s ease-in-out infinite;
}
@keyframes livedot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.75); } }
.activity-hero-title {
  font-size: clamp(36px, 5vw, 56px); font-weight: 900; letter-spacing: -.02em;
  color: #fff; margin: 0 0 14px; line-height: 1.1;
  text-shadow: 0 0 40px rgba(157,117,255,.35);
}
.activity-hero-sub {
  font-size: 16px; line-height: 1.65; color: #d8d3c4;
  max-width: 600px; margin: 0 auto; font-weight: 500;
}

/* ——— MOBILE APP LAW: safe areas, touch targets, tap feedback ——— */
.safe-top { padding-top: env(safe-area-inset-top, 0px); }
.safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.eco-bar, .hub-foot {
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
button, .btn, .tab, .activity-card, .eco-btn, [role="button"] {
  min-height: 44px;
  min-width: 44px;
}
.activity-card:active {
  transform: translateY(-1px) scale(.99);
  border-color: var(--ac, #9d75ff);
  box-shadow: inset 0 1px rgba(255,255,255,.07), 0 12px 30px rgba(0,0,0,.5),
              0 0 30px -4px var(--ac, #9d75ff);
}
.btn:active, .tab:active, .eco-btn:active {
  transform: scale(.96);
  filter: brightness(1.2);
}
* { -webkit-tap-highlight-color: transparent; }
button, .btn, .tab, .eco-btn, .activity-card {
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}

/* ——— ACTIVITY FEED LAW: every event is a card, not a line ———
   Structure: accent bar | jewel icon + source + time | headline | narrative | metadata
   Visual: white border idle, identity color ignite on hover, lift on hover */
.activity-feed-law { display:flex; flex-direction:column; gap:18px; }

/* Search */
.activity-search-wrap { margin-bottom: 8px; }
.activity-search {
  width: 100%; padding: 14px 20px; border-radius: 999px;
  border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.4);
  color: #fff; font-size: 15px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.activity-search::placeholder { color: var(--muted); }
.activity-search:focus { border-color: var(--purple); box-shadow: 0 0 18px rgba(157,117,255,.35); }

/* Time group */
.activity-time-group { margin-bottom: 8px; }
.activity-time-head {
  font-size: 12px; font-weight: 800; letter-spacing: .18em;
  color: var(--ink-dim); margin-bottom: 14px; padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

/* Event card */
.activity-card {
  position: relative; overflow: hidden; cursor: default;
  border: 2px solid rgba(255,255,255,.35); border-radius: 20px;
  padding: 22px 26px 22px 32px;
  background: rgba(13,11,10,.62);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: inset 0 1px rgba(255,255,255,.07), 0 18px 45px rgba(0,0,0,.5);
  transition: transform .22s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .3s;
  animation: actcardin .5s cubic-bezier(.2,.8,.2,1) both;
  margin-bottom: 14px;
}
@keyframes actcardin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
/* High-priority: design contract ratified, space created, major milestones */
.activity-card-high {
  border-width: 2px;
  padding: 28px 30px 28px 36px;
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(13,11,10,.62));
}
.activity-card-high .activity-card-title {
  font-size: clamp(19px, 2.4vw, 24px);
}
.activity-card-high::after {
  content: "★"; position: absolute; top: 18px; right: 22px;
  font-size: 16px; color: var(--ac);
  text-shadow: 0 0 12px var(--ac);
  opacity: .7;
}
.activity-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  background: var(--ac, #9d75ff); box-shadow: 0 0 18px var(--ac, #9d75ff);
  animation: actbar 3.2s ease-in-out infinite;
}

<style>/* css/components.css @ baf1221d9 */
/* ═══════════════════════════════════════════════════════════════════
   COMPONENTS — boards, buttons, door cards, badges
   Every component inherits its room's accent via --room-accent.
   ═══════════════════════════════════════════════════════════════════ */

/* ——— Board: the intelligent object ——— */
.board {
  --room-accent: var(--magenta);
  position: relative;
  background: linear-gradient(145deg, #151021f2, #0b0a10f2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--depth-hi), var(--depth-drop),
              0 0 26px color-mix(in srgb, var(--room-accent) 14%, transparent);
  backdrop-filter: blur(8px);
  transition: transform var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease);
}
.board.lift:hover {
  transform: translateY(-3px);
  box-shadow: var(--depth-hi), var(--depth-deep),
              0 0 40px color-mix(in srgb, var(--room-accent) 24%, transparent);
}
.board-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
}
.board-icon {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  color: var(--room-accent);
}
.board-icon svg { width: 40px; height: 40px; }
.board-title { font-size: var(--fs-head); font-weight: 800; }
.board-sub { color: var(--muted); font-size: var(--fs-small); }

.board-grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}

/* ——— Buttons ——— */
.btn {
  --btn-accent: var(--room-accent, var(--magenta));
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: 42px; padding: 0 22px;
  border-radius: var(--radius-pill);
  border: 1px solid color-mix(in srgb, var(--btn-accent) 45%, transparent);
  background: linear-gradient(145deg,
    color-mix(in srgb, var(--btn-accent) 26%, #1a1424),
    color-mix(in srgb, var(--btn-accent) 10%, #0b0a10));
  color: var(--ink);
  font-size: 12.5px; font-weight: 800; letter-spacing: .06em;
  box-shadow: var(--depth-hi), 0 10px 26px #000a,
              0 0 22px color-mix(in srgb, var(--btn-accent) 26%, transparent);
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-med) var(--ease),
              filter var(--dur-fast) var(--ease);
}
.btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.12);
  box-shadow: var(--depth-hi), 0 16px 36px #000b,
              0 0 34px color-mix(in srgb, var(--btn-accent) 40%, transparent);
}
.btn:active { transform: translateY(0) scale(.985); }
.btn svg { width: 15px; height: 15px; }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--line);
  box-shadow: var(--depth-hi);
  color: var(--ink-dim);
}
.btn-ghost:hover { border-color: color-mix(in srgb, var(--btn-accent) 40%, transparent); }

.btn[disabled] {
  opacity: .45; cursor: not-allowed; transform: none; filter: none;
}

/* ——— Door card: one brain, many doors ——— */
.door {
  --door-accent: var(--green);
  position: relative;
  border-radius: var(--radius-lg);
  padding: 20px;
  background:
    radial-gradient(220px 130px at 85% -20%, color-mix(in srgb, var(--door-accent) 16%, transparent), transparent 70%),
    linear-gradient(145deg, #151021f2, #0b0a10f2);
  border: 1px solid color-mix(in srgb, var(--door-accent) 30%, var(--line));
  box-shadow: var(--depth-hi), var(--depth-drop),
              0 0 30px color-mix(in srgb, var(--door-accent) 16%, transparent);
  transition: transform var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease);
  overflow: hidden;
  display: flex; flex-direction: column; gap: 12px;
}
.door:hover {
  transform: translateY(-4px);
  box-shadow: var(--depth-hi), var(--depth-deep),
              0 0 46px color-mix(in srgb, var(--door-accent) 30%, transparent);
}
.door-top { display: flex; align-items: center; gap: 13px; }
.door-icon {
  width: 48px; height: 48px; flex: none;
  display: grid; place-items: center;
  color: var(--door-accent);
}
.door-icon svg { width: 48px; height: 48px; }
.door-name { font-size: 15px; font-weight: 800; }
.door-for { color: var(--muted); font-size: var(--fs-small); }
.door-desc { color: var(--ink-dim); font-size: var(--fs-body); flex: 1; }
.door-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* ——— Status pill ——— */
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px; border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 800; letter-spacing: .14em;
  border: 1px solid var(--line);
  background: #ffffff08;
  color: var(--muted);
  white-space: nowrap;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.live   { color: var(--green);  border-color: #55e39a55; background: #55e39a12; }
.pill.live .dot { box-shadow: 0 0 8px var(--green); animation: pulse 2.4s infinite; }
.pill.ready  { color: var(--blue);   border-color: #55b9ee55; background: #55b9ee12; }
.pill.soon   { color: #ffffff;   border-color: #d4a01755; background: #d4a01712; }
.pill.contract { color: #b9a8e8; border-color: #9d75ff44; background: #9d75ff0d; }
.pill.spec   { color: var(--muted); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

/* ——— State badge (the honesty system, inline) ——— */
.state-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 10px; font-weight: 800; letter-spacing: .16em;
  padding: 6px 13px; border-radius: var(--radius-pill);
  border: 1px dashed color-mix(in srgb, var(--room-accent, var(--magenta)) 50%, transparent);
  color: var(--room-accent, var(--magenta));
  background: color-mix(in srgb, var(--room-accent, var(--magenta)) 8%, transparent);
}

/* ——— Divider ——— */
.hr {
  height: 1px; margin: 20px 0;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
  border: none;
}

<script>/* js/runtime-live.js @ baf1221d9 */
/* LIVE RUNTIME ADAPTER
   Compatibility seam over an injected governed runtime. The UI never assumes
   a method exists, and never upgrades missing data into READY. */
(function(){
  const R=window.NayaRuntime;
  if(!R) throw new Error('NayaRuntime base must load before runtime-live.js');

  const METHOD_MAP={
    feed:['smartFeed'],
    today:['intelligenceToday','dailyIntelligence','today'],
    reports:['smartReports','reports','intelligenceReports'],
    library:['intelligentLibrary','library','knowledgeLibrary'],
    ledger:['smartLedger','ledger','executionLedger'],
    connections:['smartConnections','connections','relationshipIntelligence'],
    lists:['smartLists','lists','intelligenceLists'],
    mail:['smartMail','mail','messages'],
    spaces:['smartSpaces','spaces','contextSpaces'],
    settings:['settingsSnapshot','runtimeSnapshot']
  };

  function bridge(){
    const candidates=[window.NayaAssistantRuntime,window.NayaPowerRuntime,window.NayaRuntimeBridge];
    return candidates.find(x=>x&&x!==R)||null;
  }

  function methodNames(){
    const b=bridge(); if(!b) return[];
    const own=Object.keys(b).filter(k=>typeof b[k]==='function');
    const proto=Object.getPrototypeOf(b);
    const inherited=proto?Object.getOwnPropertyNames(proto).filter(k=>k!=='constructor'&&typeof b[k]==='function'):[];
    return [...new Set([...own,...inherited])];
  }

  async function invoke(candidates,payload){
    const b=bridge();
    if(!b) return {ok:false,state:'not_verified',message:'The governed Hub runtime is not connected in this browser session.',runtime_connected:false};
    const name=candidates.find(n=>typeof b[n]==='function');
    if(!name){
      return {ok:false,state:'not_verified',message:'The runtime is connected, but this room capability is not exposed yet.',runtime_connected:true,available_methods:methodNames()};
    }
    try{
      const out=await b[name](payload);
      if(out==null) return {ok:true,state:'empty',data:[],method:name,runtime_connected:true};
      if(out?.ok===false) return {...out,method:name,runtime_connected:true,state:out.state||'error'};
      return {ok:true,state:out?.state||'ready',data:out?.data??out,method:name,runtime_connected:true,raw:out};
    }catch(err){
      return {ok:false,state:'error',message:err?.message||('Runtime method '+name+' failed.'),method:name,runtime_connected:true};
    }
  }

  R.bridge=bridge;
  R.availableMethods=methodNames;
  R.roomData=async function(roomId,payload={}){
    if(roomId==='connect') return {ok:true,state:'ready',data:{doors:R.DOORS,roadmap:R.DOOR_ROADMAP},method:'registry_projection'};
    return invoke(METHOD_MAP[roomId]||[],payload);
  };

  R.search=async function(query,opts={}){
    const q=String(query||'').trim();
    if(!q) return {ok:false,state:'empty',message:'Ask a question or search the intelligence.'};
    return invoke(['searchIntelligence','askNaya','search','retrieveIntelligence'],{query:q,...opts});
  };

  R.retrieve=async function(id){
    if(!id) return {ok:false,state:'empty',message:'No canonical intelligence ID was supplied.'};
    return invoke(['retrieveIntelligentBlock','getIntelligentBlock','retrieve'],{id});
  };

  R.identitySnapshot=function(){
    const b=bridge();
    if(!b) return {state:'not_verified',display_name:'You',detail:'Identity runtime not connected'};
    const x=b.identity||b.currentIdentity||b.sessionIdentity;
    if(x&&typeof x==='object') return {
      state:x.state||x.status||'ready',
      display_name:x.display_name||x.displayName||x.name||x.alias||'You',
      detail:x.detail||x.scope||'Governed identity'
    };
    return {state:'not_verified',display_name:'You',detail:'Identity available only through the governed runtime'};
  };

  R.loadDoorRegistry=async function(){
    const ref='../../BRAIN/10-INTERFACES/0002-SMART-DOOR-REGISTRY-V1.json';
    try{
      const res=await fetch(ref,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json=await res.json();
      return {ok:true,state:'ready',data:json,source:ref};
    }catch(err){
      return {ok:false,state:'not_verified',message:'Canonical Smart Door registry could not be loaded from this deployment: '+(err?.message||'unknown error'),source:ref};
    }
  };

  R.loadCompletionMatrix=async function(){
    const ref='../APP-COMPLETION-MATRIX-V1.json';
    try{
      const res=await fetch(ref,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      return {ok:true,state:'ready',data:await res.json(),source:ref};
    }catch(err){
      return {ok:false,state:'not_verified',message:'Completion matrix is unavailable from this deployment: '+(err?.message||'unknown error'),source:ref};
    }
  };

  R.runtimeStatus=function(){
    const b=bridge();
    return {connected:!!b,available_methods:methodNames(),adapter_version:'2.0.0'};
  };
  R.version='2.0.0';
})();

(function(){
  const OFFICIAL_NOTES = [{"id": "FEAT-01", "title": "Smart Note", "subtitle": "The place where intelligence begins to persist", "topics": ["The Intelligence"], "topic": "Features", "tone": "purple", "icon": "note", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "A Smart Note captures something worth remembering and turns it into intelligence that can be understood, connected, retrieved, learned from, and used again. A normal note helps you remember something. A Smart Note helps the system remember something intelligently."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "You have ideas all day. You learn things. You make decisions. You discover patterns. Someone teaches you something. You solve a problem. You have an insight in the shower. You realize something about yourself, your work, another person, or the world. Most of that disappears. A Smart Note gives those moments somewhere to go. You capture the idea once, and Naya can help preserve its meaning, context, relationships, lessons, and potential usefulness. Instead of your intelligence living only in your head, it can become part of something you can return to."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine you had a really good idea. Instead of forgetting it, you put it somewhere safe. Then imagine that the place where you put it can remember why the idea was important, what it connects to, and when you might need it again. That's a Smart Note. You think it. You capture it. Naya remembers it."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "A wise person knows that small things become important over time. A lesson learned today may save you years from now. A decision you made may explain something that happens later. An insight that seems small today may become the foundation of something much bigger tomorrow. Smart Notes protect that accumulated wisdom from disappearing. They create continuity between what you knew yesterday, what you understand today, and what you may need tomorrow."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Naya treats a Smart Note as more than text. The intelligence contained within a note can carry meaning, context, relationships, provenance, learning, and potential reuse. That allows the note to participate in the larger intelligence system. A Smart Note can become connected to other knowledge, contribute to intelligence reports, support learning, appear in relevant contexts, and become part of the evidence and history behind future understanding. The goal is not simply to store information. The goal is to make intelligence persistent and reusable."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "At the system level, a Smart Note becomes an intelligence object that can move through the NayaPOWER system. Capture → structure → preserve → connect → retrieve → apply → learn The note can be associated with people, topics, projects, decisions, experiences, lessons, other intelligence, and supporting evidence. That means the system does not have to treat every note as an isolated piece of text. It can understand the note as part of a larger network of intelligence."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "If intelligence is not captured, it can disappear. The lesson is simple: What gets consciously captured can become available for future learning. Smart Notes create the raw material from which compounding intelligence can emerge. The system becomes more useful not merely because it stores more information, but because valuable information can remain available to be reconnected with future experience."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "Smart Notes are the memory seeds of NayaNET. They connect the human experience to the intelligence system. A thought can become knowledge. Knowledge can become connected intelligence. Connected intelligence can support action. Action can produce experience. Experience can produce learning. Learning can improve what happens next. That is the beginning of the intelligence-compounding loop: Think → Capture → Connect → Use → Learn → Improve"}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Whenever something feels worth remembering, capture it. That might be:\n• an idea\n• an insight\n• a decision\n• a lesson\n• a question\n• a discovery\n• a useful piece of knowledge\n• an important experience\n• something you want Naya to remember\n• something you think could matter later. Don't worry about making it perfect.\nCapture the intelligence first. Naya can help make it more useful afterward."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You stop losing your best thoughts. You build a memory that grows with you. You can return to things you learned instead of repeatedly rediscovering them. You can connect today's insight with tomorrow's problem. And over time, your accumulated experience becomes an asset rather than a collection of forgotten moments. Your intelligence doesn't have to disappear when the moment ends."}], "personal": false}, {"id": "FEAT-AU", "title": "AI Unifying", "subtitle": "One Brain. Every AI.", "topics": ["Start Here"], "topic": "Features", "tone": "ruby", "icon": "unify", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**AI Unifying means your intelligence doesn't belong to one AI. It belongs to you.**\n\nNayaPOWER provides a shared intelligence layer that different AIs, agents, tools, and interfaces can connect to.\n\nYou can work with ChatGPT, Muse, Gemini, Claude, local AI agents, coding agents, or other intelligent systems — and, when authorized and connected, they can work from the same underlying intelligence.\n\n**The AI can change. Your brain doesn't have to.**"}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Right now, you can talk to one AI and teach it something important about yourself.\n\nThen you open another AI.\n\nAnd you're starting over.\n\nYou explain your project.\n\nYou explain your preferences.\n\nYou explain what you've already done.\n\nYou explain where you are.\n\nYou explain what you've learned.\n\nThen you switch again — and do it all over.\n\nEvery AI may be incredibly capable.\n\nBut the intelligence surrounding **you** is fragmented.\n\nAI Unifying changes the relationship.\n\nInstead of making every AI your brain, **your intelligence becomes the constant and the AIs become different ways of accessing and working with it.**\n\nYou choose the AI that's best for the moment.\n\nYour intelligence can remain yours."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine having five really smart friends.\n\nOne is great at drawing.\n\nOne is great at math.\n\nOne is great at building things.\n\nOne is great at explaining things.\n\nOne is great at finding answers.\n\nBut every time you talk to a different friend, they forget everything you told the other friends.\n\nThat would be frustrating.\n\nNow imagine they could all understand the same shared notebook about **you, your projects, what you've learned, and what's happening right now**.\n\nYou could ask whichever friend was best for the job.\n\nThey wouldn't all have to become the same person.\n\nThey would simply be **connected to the same intelligence about you.**\n\nThat's AI Unifying."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "A person's life is not divided into separate conversations.\n\nYour knowledge, relationships, experiences, decisions, lessons, hopes, projects, and history belong to one life.\n\nTechnology often fragments that continuity.\n\nOne application knows one piece.\n\nAnother application knows another.\n\nAnother AI knows something else.\n\nThe deeper idea behind AI Unifying is simple:\n\n**Your intelligence should remain connected even when the tools you use change.**\n\nThe tools can come and go.\n\nYour accumulated intelligence should be able to remain with you."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "NayaPOWER is designed as an intelligence layer that sits beneath the individual AI interfaces and tools a person chooses to use.\n\nThe AI is not the owner's intelligence.\n\nThe AI is an **authorized participant and interface**.\n\nThat distinction matters.\n\nChatGPT can contribute.\n\nMuse can contribute.\n\nA local agent can contribute.\n\nA coding agent can contribute.\n\nAnother model can contribute.\n\nBut none of them needs to become the permanent owner of the person's intelligence.\n\nNayaPOWER provides the continuity layer through which authorized intelligence can be retained, retrieved, connected, verified, learned from, and reused.\n\n**The brain is the constant. The interfaces are interchangeable.**"}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "At the technical level, AI Unifying separates the **intelligence layer** from the **AI provider or interface layer**.\n\nConceptually:\n\n**Human Owner**\n↓\n**NayaPOWER Intelligence Layer**\n↓\n**Authorized AI / Agent / Tool / Interface**\n\nDifferent systems can connect through governed interfaces rather than creating isolated copies of the person's intelligence.\n\nA connected AI may:\n\n**retrieve relevant intelligence → reason with it → perform authorized work → produce new intelligence → return evidence/results → contribute to learning**\n\nThe exact capabilities available to each connection depend on authorization, integration, provenance, and system design.\n\nThis means **AI capability can be modular while intelligence continuity remains centralized around the human-owned intelligence layer.**"}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "**Don't confuse the intelligence interface with the intelligence itself.**\n\nAn AI model is extraordinarily powerful, but it is still one participant in a larger system.\n\nThe same person may need different capabilities at different moments.\n\nOne AI may be better at reasoning.\n\nAnother may be better at coding.\n\nAnother may be better at research.\n\nAnother may run locally.\n\nAnother may be embedded inside a specialized application.\n\nAI Unifying means the person doesn't have to sacrifice continuity simply because they change tools.\n\n**Use the best intelligence interface for the moment without abandoning the intelligence you've already built.**"}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "AI Unifying changes the architecture from:\n\n**Person → AI**\n\nto:\n\n**Person → Personal Intelligence → Many AIs**\n\nThat is a profound difference.\n\nThe person remains the human owner.\n\nNayaPOWER becomes the continuity and intelligence layer.\n\nDifferent AIs become connected participants.\n\nThe result is not one AI replacing all the others.\n\nIt is **many intelligences working around one continuously evolving human-owned intelligence system.**"}, {"name": "How It Connects", "key": "HOW IT CONNECTS", "color": "teal", "tier": "deeper", "body": "AI Unifying connects directly to the rest of NayaPOWER:\n\n**Smart Notes** — capture intelligence that any authorized AI can potentially benefit from.\n\n**Compounding Intelligence** — allows useful intelligence to accumulate rather than restarting with every AI.\n\n**Adaptive Learning** — allows lessons from one interaction or agent to potentially improve future interactions.\n\n**Smart Connect** — provides the mechanisms and pathways through which people, AIs, agents, and systems can connect.\n\n**Smart Spaces** — give connected intelligence a shared context around projects, people, and purposes.\n\n**Smart Ledger** — provides accountability around important actions, authority, evidence, and outcomes.\n\n**Collective Chain Technology** — allows intelligence to move through a governed network of connected nodes.\n\nTogether:\n\n**One human intelligence layer. Many authorized doors. Continuous learning.**"}, {"name": "What Happens When You Switch AI?", "key": "WHAT HAPPENS WHEN YOU SWITCH AI?", "color": "cyan", "tier": "deeper", "body": "This is the magic of the model.\n\nImagine you spend the morning working with a coding agent.\n\nIt learns something useful about the project.\n\nThat intelligence is appropriately captured and preserved.\n\nLater, you open ChatGPT.\n\nYou don't necessarily need to explain the entire project again.\n\nThe connected system can provide the relevant intelligence that ChatGPT is authorized to access.\n\nThen you work with Muse.\n\nLater, another agent takes over.\n\nThe interfaces changed.\n\n**The continuity didn't have to.**\n\nThat's the experience AI Unifying is designed to create."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "**Freedom.**\n\nYou're not trapped inside one AI.\n\nYou're not forced to choose one model forever.\n\nYou're not required to repeatedly rebuild your context.\n\nYou're not starting from zero every time you change tools.\n\nYou can choose the intelligence that is best for the moment while keeping your accumulated intelligence connected to **you**.\n\nYour AI can change.\n\nYour tools can change.\n\nYour providers can change.\n\nYour agents can change.\n\n**Your intelligence remains yours.**"}, {"name": "The Big Idea", "key": "THE BIG IDEA", "color": "gold", "tier": "deeper", "body": "**You shouldn't have to choose one AI.**\n\n**You should be able to choose the best AI for the moment — while your intelligence stays with you.**\n\n**One Brain.**\n**Every AI.**\n**Your Intelligence.**\n**Your Choice.**"}, {"name": "The NayaPOWER Principle", "key": "THE NAYAPOWER PRINCIPLE", "color": "magenta", "tier": "deeper", "body": "**AI is the engine. The human is the director. NayaPOWER is the intelligence layer that keeps the human's intelligence connected.**\n\nThe future isn't necessarily about finding **the one AI**.\n\nIt can be about creating an intelligence system where **many different AIs can contribute without forcing the human to start over every time.**"}]}, {"id": "FEAT-02", "title": "Compounding Intelligence System", "subtitle": "Intelligence that becomes more valuable because it remembers what came before", "topics": ["The Intelligence"], "topic": "Features", "tone": "gold", "icon": "spark", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "The Compounding Intelligence System is the mechanism by which knowledge, experience, lessons, connections, and verified outcomes can build upon one another over time. Instead of starting from zero every time, the system can carry useful intelligence forward. Think once. Capture it. Learn from it. Remember it. Use it again. Get smarter."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Think about everything you've learned in your life. You didn't become wiser because you experienced something once. You became wiser because you remembered the experience, understood what happened, learned from it, and used that learning later. That's compounding. The problem is that much of our knowledge is fragmented. It's in our memories, notebooks, emails, conversations, files, projects, and experiences. The Compounding Intelligence System is designed to help bring those pieces into a system where they can contribute to future intelligence."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine playing a game. Every time you learn something, you get to keep the lesson. Then, the next time you play, you don't have to learn everything again. You start with what you already know. Then you learn something new. Now you have both lessons. Then you use both to get better. That's intelligence compounding."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "Wisdom is experience that has been remembered and understood. A person who makes the same mistake repeatedly isn't getting the full value from experience. A person who remembers what happened, understands why it happened, changes their behavior, and carries that lesson forward is turning experience into wisdom. The same principle applies to an intelligent system. Experience should leave the system wiser than it found it."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Naya's purpose is not merely to answer the current question. It is to help preserve useful intelligence so that future decisions can benefit from previous knowledge, experience, learning, and verified outcomes. Compounding intelligence therefore depends on continuity. The system needs to know: What happened → what was learned → what was proven → what remains uncertain → what should happen next. This creates a pathway from isolated events toward cumulative intelligence."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "At the system level: Capture → retain → retrieve → connect → act → observe → verify → learn → preserve → reuse Each useful learning event becomes potential input to future decisions. Connections allow intelligence to move between objects and contexts. Verification helps distinguish what is merely recorded from what has actually been demonstrated. Preservation allows successful learning to survive the moment that produced it."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Experience only compounds when the lesson survives the experience. A system that repeatedly forgets what it learned is effectively starting over. A system that preserves useful learning can progressively improve. But compounding requires discipline: Recorded ≠ learned. Learned ≠ proven. Proven ≠ automatically applicable everywhere. The intelligence must remain connected to its context and evidence."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "This is one of the deepest ideas in NayaPOWER. The goal is not to create a system that simply contains more information. The goal is to create a system whose intelligence can become more useful over time. A Smart Note can become knowledge. Knowledge can connect to other knowledge. Connections can inform action. Action creates outcomes. Outcomes can create learning. Learning can influence future behavior. That is how the organism compounds."}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Don't ask only: “What do I know?” Also ask: “What have I learned?” And: “What should this change about what happens next?” Use Smart Notes, Reports, Lists, Spaces, Connections, Ledger evidence, and learning outputs as parts of the same continuous intelligence loop."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You don't have to keep starting over. Your previous work can become an advantage. Your lessons can remain available. Your experience can inform future decisions. Your knowledge can become increasingly organized and connected. And the system can become more valuable because what was learned yesterday can improve what happens tomorrow."}], "personal": false}, {"id": "FEAT-03", "title": "Adaptive Learning", "subtitle": "Turning experience into better future behavior", "topics": ["The Intelligence"], "topic": "Features", "tone": "emerald", "icon": "cap", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Adaptive Learning is the ability of the intelligence system to learn from experience, feedback, outcomes, and verified evidence — and use that learning to improve what happens next. It is the bridge between what happened and what we do differently because of it."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "You learn when reality teaches you something. You try something. It works. You understand why. You try again. Or it fails. You figure out what went wrong. You change your approach. That change is learning. Adaptive Learning brings that same principle into the intelligence system: Experience should be able to change future behavior when the evidence supports the change."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine you touch something hot. You learn: “Don't touch that.” Next time, you remember. You don't need to learn the lesson from scratch. That's adaptive learning. Something happened. You learned from it. Then you changed what you did next time."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "Wisdom isn't knowing everything. Wisdom is being willing to let experience teach you. A wise person can say: “I thought this was true. Then I learned something that changed my understanding.” That ability to update is incredibly important. A system that cannot learn from evidence becomes rigid. A system that changes without evidence becomes unreliable. Adaptive intelligence needs both openness and discipline."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Naya should not merely
