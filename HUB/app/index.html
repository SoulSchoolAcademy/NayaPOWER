accumulate events. It should be able to identify meaningful learning from those events and preserve that learning with appropriate context and evidence. The fundamental progression is: Experience → observation → interpretation → evidence → learning → improved action Learning should not silently rewrite truth. It should be attributable, contextual, and distinguish between what is known, inferred, uncertain, or unresolved."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "A learning cycle can be represented as: ACT → OBSERVE → VERIFY → LEARN → PRESERVE → REUSE The system records what happened. It evaluates relevant evidence. A learning conclusion is formed when justified. That learning is preserved. Future decisions can retrieve it. The resulting behavior can then be evaluated again. This creates an iterative feedback loop rather than a static database."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Learning means something changes because something was learned. If nothing changes, we may have recorded information without actually learning. If behavior changes without understanding why, we may have adaptation without reliable intelligence. The strongest learning is: Observed → understood → supported → preserved → applied → evaluated again."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "Adaptive Learning is what turns memory into growth. Without memory: experience disappears. Without learning: memory remains passive. Without application: learning remains theoretical. Without verification: adaptation can become guesswork. Together they create a living loop: Experience → Memory → Learning → Action → New Experience That is how an intelligence system can evolve without pretending that every change is automatically correct."}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "After something important happens, ask: What happened? Then: What did we learn? Then: What should change? Then: What evidence supports that change? Then preserve the lesson so it can be retrieved when relevant."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You can get better without having to remember every mistake yourself. Your successful patterns can be preserved. Your failures can become lessons rather than dead ends. Your system can become more responsive to reality. And instead of merely accumulating information, you can build an intelligence that learns from what actually happens."}], "personal": false}, {"id": "FEAT-04", "title": "Intelligent Reports", "subtitle": "Turning accumulated intelligence into understanding", "topics": ["The Intelligence"], "topic": "Features", "tone": "sapphire", "icon": "report", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Intelligent Reports transform accumulated information, activity, evidence, learning, and patterns into something a human can actually understand and act upon. A report should not simply tell you what happened. It should help you understand what matters, why it matters, what was learned, what is proven, what remains unknown, and what should happen next."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Nobody wants to read a pile of data and figure everything out themselves. You want to know: What happened? What matters? What changed? What did we learn? What should I pay attention to? What should I do next? That's what a good report does. It turns complexity into understanding."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine someone gives you a giant box full of papers. You don't want the papers. You want someone to say: “Here's what happened. Here's the important part. Here's what we learned. Here's what you should do.” That's an Intelligent Report. It takes lots of information and helps make the important part easier to see."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "A wise report does not confuse more information with more understanding. Sometimes the most intelligent thing you can do is remove everything that doesn't matter. Good reporting is distillation. It takes the complexity of experience and gives the human a clearer picture of reality."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Naya uses reporting as an intelligence projection layer. The report should synthesize relevant information while preserving distinctions between: PROVEN DOCUMENTED UNKNOWN CONFLICTED BLOCKED It should not manufacture certainty where evidence does not exist. Its purpose is to make the current state understandable enough for a human to make better decisions."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "An Intelligent Report can draw from multiple intelligence sources: Events → Notes → Connections → Activity → Evidence → Outcomes → Learning → Current State The system can organize those inputs into a coherent representation. The report can then expose: State → Change → Pattern → Evidence → Learning → Risk/Unknowns → Recommended Next Action The output is not merely a data dump. It is a structured projection of intelligence."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Information becomes useful when it changes understanding or action. A report that contains thousands of facts but leaves the reader confused has failed its most important job. The lesson is: Distill complexity without destroying truth. Good intelligence reporting makes reality clearer while keeping uncertainty visible."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "Reports connect the past to the present and the present to the next action. They allow accumulated intelligence to become visible. Smart Notes capture. The intelligence system connects. Learning changes understanding. Reports surface the resulting intelligence for humans. That makes Reports one of the major bridges between the internal intelligence system and the human decision-maker."}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Use Intelligent Reports when you need to understand:\n• what has happened\n• what changed\n• what has been accomplished\n• what has been learned\n• what is working\n• what isn't\n• what is proven\n• what remains unresolved\n• what deserves attention\n• what should happen next Don't just read a report.\nUse it to make a better decision."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You don't have to reconstruct the entire story yourself. You get the signal instead of the noise. You can see progress, problems, patterns, evidence, and opportunities more clearly. You can move from: “What the hell is going on?” to: “I understand what's happening. I know what matters. I know what we learned. I know what to do next.” And that's what intelligent reporting should ultimately deliver:\n\nClarity that leads to better action.\n\n🌟 The pattern is now becoming very clear These aren't really ten unrelated feature descriptions. They're teaching the newcomer the organism. Smart Notes → capture intelligence Compounding Intelligence → preserve and accumulate it Adaptive Learning → allow experience to change future intelligence Intelligent Reports → make the resulting intelligence understandable And then the next blocks can naturally continue the story: Smart Lists → organize intelligence around what matters Smart Tabs → create intelligent contextual views Smart Mail → turn communication into reusable intelligence Smart Spaces → create intelligence environments around people, projects, and purposes Smart Ledger → establish accountability and proof Collective Chain Technology → connect the whole thing into a collective intelligence network"}], "personal": false}, {"id": "FEAT-05", "title": "Smart Lists", "subtitle": "Living collections that help you organize what matters", "topics": ["Your Tools"], "topic": "Features", "tone": "lime", "icon": "lists", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Smart Lists turn collections of information into intelligent, useful structures that can be organized, understood, updated, and acted upon.\n\nA normal list tells you what is there.\n\nA Smart List can help you understand what matters, what changed, what belongs together, and what should happen next."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "People naturally make lists.\n\nThings to do.\n\nPeople to contact. Ideas to explore.\n\nProjects to finish.\n\nQuestions to answer.\n\nThings to remember.\n\nBut ordinary lists eventually become clutter.\n\nA Smart List is designed to remain useful as the information around it changes.\n\nInstead of being a static checklist, it can become a living collection organized around a purpose."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine making a list of everything you need for a trip.\n\nInstead of just writing:\n\nShoes Shirt Toothbrush Tickets\n\nyour list could help you notice:\n\n“You already packed the shoes.”\n\n“You still need your tickets.”\n\n“These three things are for camping.”\n\nNow the list isn't just remembering things.\n\nIt's helping you think about the things.\n\nThat's a Smart List."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "A good list brings order to complexity. But wisdom is knowing that organization should serve a purpose.\n\nThe goal isn't to make more lists.\n\nThe goal is to make the things that matter easier to see, understand, prioritize, and act upon.\n\nA Smart List is organization with intelligence behind it."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Naya can treat a list as a meaningful collection of intelligence rather than simply an array of text items.\n\nItems can carry context, relationships, status, ownership, priority, evidence, and other relevant attributes.\n\nThe list can therefore become a useful view into the larger intelligence system.\n\nThe list doesn't have to contain everything.\n\nIt needs to surface the right things for the purpose."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "At the system level, Smart Lists can organize related intelligence objects according to defined criteria.\n\nThey can support:\n\nCollect → classify → filter → prioritize → monitor → act → update\n\nBecause the underlying objects can remain connected to the broader intelligence system, a Smart List can change as its source intelligence changes."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Organization should reduce cognitive load, not create more of it.\n\nA list is useful when it makes something easier to understand or accomplish.\n\nThe intelligence is not in having more categories. The intelligence is in creating the right structure for the job."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "Smart Lists are one of the ways NayaNET turns intelligence into organized action.\n\nKnowledge → organized collection → priority → action → outcome\n\nThey connect what you know with what you need to do."}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Create a Smart List around a real purpose:\n\n• things you need to accomplish\n• ideas worth exploring\n• people you want to connect with\n• lessons you want to revisit\n• projects you're tracking\n• questions you need answered\n• opportunities you're evaluating\n\nThen let the list become a useful working surface rather than another place where information goes to die."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "Less searching.\n\nLess remembering.\n\nLess mental clutter.\n\nMore visibility into what matters.\n\nAnd a clearer path from “I have a lot going on” to “I know what matters and what I need to do.”"}], "personal": false}, {"id": "FEAT-06", "title": "Smart Tabs", "subtitle": "Contextual windows into your intelligence", "topics": ["Your Tools"], "topic": "Features", "tone": "indigo", "icon": "tabs", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Smart Tabs create focused views into intelligence so you can see the information, tools, activity, and context that matter for the moment you're in.\n\nA normal tab opens a page.\n\nA Smart Tab opens a context."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Your brain doesn't think about everything at once.\n\nWhen you're working on a project, you care about that project.\n\nWhen you're planning a trip, you care about the trip.\n\nWhen you're learning something, you care about the subject you're learning.\n\nSmart Tabs help create that same kind of focus inside NayaNET.\n\nInstead of making you navigate through the entire system every time, a Smart Tab can bring the relevant intelligence together around a particular context."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine you're building a LEGO castle.\n\nYou don't want every LEGO piece in the world dumped on the floor.\n\nYou want the pieces you're using for your castle.\n\nA Smart Tab is like a little workspace that says:\n\n“Here are the things you need for this.”"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "Context changes meaning.\n\nThe same piece of information can matter very differently depending on what you're doing.\n\nGood organization doesn't merely store information.\n\nIt puts information where it can be understood in context."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "A Smart Tab can serve as a contextual projection of connected intelligence.\n\nIt can bring together relevant information, Smart Notes, Lists, activity, people, Spaces, reports, and other intelligence without requiring the human to reconstruct the context manually.\n\nThe objective is not simply navigation.\n\nIt is context preservation."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "A Smart Tab can function as a contextual query or projection:\n\nContext → relevant intelligence → filtered view → interaction → updated context\n\nRather than creating another independent copy of information, the tab can expose connected intelligence from the underlying system."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Context is part of intelligence.\n\nInformation without context can be misunderstood.\n\nA good intelligent interface therefore doesn't merely show more information.\n\nIt shows the right information in the right context."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "Smart Tabs connect where you are with what matters there.\n\nThey are one of the mechanisms through which NayaNET can feel less like a collection of applications and more like one coherent intelligence environment."}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Use Smart Tabs when you repeatedly need a particular context:\n\nProject → people → notes → tasks → reports → decisions\n\nor:\n\nTopic → research → lessons → questions → related intelligence\n\nBuild the context once.\n\nThen return to it without reconstructing it from scratch."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You spend less time hunting.\n\nYou maintain context.\n\nYou can move between different areas of your life or work without losing the intelligence surrounding each one.\n\nThe system meets you where you are."}], "personal": false}, {"id": "FEAT-07", "title": "Smart Mail", "subtitle": "Turn communication into intelligence", "topics": ["Your Tools"], "topic": "Features", "tone": "blue", "icon": "mail", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Smart Mail helps transform communication from something that simply passes through an inbox into intelligence that can be understood, organized, connected, acted upon, and remembered when appropriate.\n\nYour inbox shouldn't be where intelligence goes to disappear."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Think about how much valuable intelligence lives inside email.\n\nDecisions.\n\nPromises.\n\nInstructions.\n\nRelationships.\n\nDocuments.\n\nIdeas.\n\nFeedback.\n\nOpportunities.\n\nLessons.\n\nThen think about how difficult it can be to find any of it six months later.\n\nSmart Mail is about making communication more useful without losing the human context that made it valuable."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine your friend tells you something really important.\n\nInstead of forgetting it tomorrow, you could remember:\n\nwhat they said, why it mattered, and what you needed to do about it.\n\nThat's the basic idea. The message doesn't just disappear after you read it.\n\nIt can become something useful."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "Communication carries more than words.\n\nIt carries relationships, intentions, commitments, decisions, emotions, history, and context.\n\nWisdom means knowing what deserves to be remembered — and respecting what should remain private.\n\nSmart Mail therefore isn't about collecting everything.\n\nIt's about making valuable communication usable while respecting boundaries."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Smart Mail connects communication with the broader intelligence system while maintaining appropriate privacy, authorization, provenance, and context.\n\nA message may become relevant to a task, decision, person, project, Space, Smart Note, or learning event.\n\nBut communication should never automatically become collective intelligence simply because it exists.\n\nPrivate by default. Shared by choice. Collective by consent. Public by decision."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "At the system level, Smart Mail can support:\n\nReceive → understand → classify → connect → act → preserve → retrieve\n\nRelevant communication can become linked to authorized intelligence objects.\n\nActions and resulting outcomes can then become part of the appropriate learning or accountability chain."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Communication becomes more valuable when meaning survives the message.\n\nThe goal isn't to turn every email into permanent memory.\n\nThe goal is to preserve the right intelligence from communication, with the right permissions and context."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "Smart Mail connects one of humanity's oldest intelligence technologies — communication — with a modern intelligence system.\n\nA message can become:\n\ncommunication → understanding → action → record → learning\n\nwithout requiring the human to manually rebuild the chain every time."}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Use Smart Mail to help you:\n\n• understand important communication\n• identify commitments\n• surface decisions\n• connect conversations to projects\n• preserve useful knowledge\n• organize follow-up\n• retrieve relevant history\n\nAlways maintain appropriate privacy and authorization."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "Less inbox archaeology. Fewer forgotten commitments.\n\nBetter continuity.\n\nMore useful communication.\n\nAnd the ability to recover the intelligence inside conversations when you actually need it."}], "personal": false}, {"id": "FEAT-08", "title": "Smart Spaces", "subtitle": "Intelligent environments built around people, projects, and purpose", "topics": ["Your Tools"], "topic": "Features", "tone": "magenta", "icon": "spaces", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Smart Spaces create focused environments where people, intelligence, tools, conversations, knowledge, activity, and goals can come together around a shared purpose.\n\nA normal workspace gives you somewhere to work.\n\nA Smart Space gives the work context and intelligence."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "You already create Spaces naturally.\n\nYour company is a Space.\n\nYour family project is a Space.\n\nA creative project is a Space.\n\nA community is a Space.\n\nA research effort is a Space.\n\nA Space exists because something matters enough to organize people and intelligence around it.\n\nNayaNET makes that organization intelligent."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine a clubhouse.\n\nInside are:\n\nyour friends, your toys, your rules, your plans, your stories, and the things you're building together.\n\nThat's a Space.\n\nNow imagine the clubhouse can remember what happened and help everyone know what's happening next.\n\nThat's a Smart Space."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "People do their best work when they share context.\n\nA good community remembers its history.\n\nA good team understands its purpose.\n\nA good family knows what matters to the people inside it.\n\nSmart Spaces help preserve that shared context.\n\nThey create somewhere intelligence can live with the people who need it."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "A Smart Space is a contextual intelligence environment.\n\nIt can bring together authorized people, Smart Notes, Lists, Tabs, Mail, Reports, Connections, activity, decisions, and evidence around a defined purpose.\n\nThe Space becomes a living context rather than merely another folder."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "At the system level:\n\nPeople + purpose + intelligence + permissions + activity + history + outcomes\n\ncan be brought together into one coherent environment.\n\nThe Space can become a projection of the relevant intelligence graph while respecting authorization boundaries."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Shared intelligence requires shared context.\n\nTeams often lose knowledge because their work is scattered across disconnected tools and conversations.\n\nA Smart Space creates a place where relevant context can persist and evolve together."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "Smart Spaces connect the individual intelligence of people with collective intelligence around a purpose.\n\nThey are where NayaNET can become truly networked:\n\nPerson → people → knowledge → action → outcome → shared learning"}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Create a Smart Space around something meaningful:\n\n• a company\n• a project\n• a team\n• a community\n• a research effort\n• a creative endeavor\n• a shared goal\n\nThen bring the relevant people and intelligence into that context."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You don't have to rebuild context every time someone joins the conversation.\n\nThe Space can carry history forward.\n\nPeople can see what matters.\n\nKnowledge can stay connected to the work.\n\nAnd the group can become more capable because its shared intelligence doesn't disappear between conversations."}], "personal": false}, {"id": "FEAT-09", "title": "Smart Ledger", "subtitle": "The accountability and proof layer of intelligence", "topics": ["The Intelligence"], "topic": "Features", "tone": "orange", "icon": "shield", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Smart Ledger provides a trustworthy record of important actions, decisions, authorization, outcomes, and evidence so people can understand what happened, what was allowed, who or what was responsible, and what can actually be trusted.\n\nIntelligence without accountability is dangerous."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Imagine someone tells you:\n\n“It happened.”\n\nYour next question should be: “How do you know?”\n\nThat's the beginning of trust.\n\nThe Smart Ledger helps answer:\n\nWhat happened? When? Why? Under whose authority? What evidence exists? What was actually verified?"}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine playing a game where everyone says they scored.\n\nInstead of arguing, you have a scoreboard.\n\nThe scoreboard doesn't decide who you like.\n\nIt simply helps everyone see what actually happened.\n\nThat's the idea behind a ledger."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "Trust isn't blind belief.\n\nTrust grows when words and reality consistently agree.\n\nA good record lets people look backward and understand what happened.\n\nThat's especially important when intelligent systems can take actions on behalf of people."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "The Smart Ledger is an accountability layer.\n\nIt helps distinguish: claimed → recorded → authorized → executed → observed → verified\n\nThose are not the same thing.\n\nA system should never treat “implemented” as equivalent to “verified.”\n\nThe Ledger exists to preserve the evidence necessary to understand the difference."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "At the system level, ledger records can associate actions with:\n\nidentity → authority → intent → action → timestamp → result → evidence → verification\n\nThis creates an auditable history.\n\nThe Ledger does not become the intelligence itself.\n\nIt provides the accountability and proof layer that allows intelligence and action to be trusted appropriately."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Trust should be earned by evidence.\n\nUNKNOWN is not PASS.\n\nBLOCKED is not PASS.\n\nIMPLEMENTED is not VERIFIED.\n\nLIVE is not automatically INDEPENDENTLY PROVEN.\n\nThese distinctions protect the intelligence system from becoming confident about things it has not actually established."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "The Smart Ledger connects intelligence to accountability.\n\nIt answers one of the most important questions in any intelligent system: “Why should I believe this?”\n\nThat makes it a foundational trust mechanism throughout NayaPOWER."}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Use the Ledger when you need to understand:\n\n• what happened\n• who authorized it\n• what action occurred\n• what result occurred\n• what evidence exists\n• whether the result was actually verified\n• what remains unknown\n\nUse evidence to build trust.\n\nDon't manufacture trust through presentation."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You can see behind the claim.\n\nYou can distinguish reality from assumption.\n\nYou can understand what is proven and what isn't.\n\nAnd you can use intelligent systems with greater confidence because their important actions don't have to disappear into a black box."}], "personal": false}, {"id": "FEAT-10", "title": "Collective Chain Technology", "subtitle": "The connective intelligence layer", "topics": ["The Intelligence"], "topic": "Features", "tone": "red", "icon": "chain", "kind": "official", "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Collective Chain Technology connects people, intelligence, actions, relationships, evidence, and learning so that knowledge can move through a network and become more useful over time.\n\nIt is the connective mechanism that allows many intelligent nodes to participate in one evolving intelligence system."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Human beings have always been connected.\n\nOne person discovers something.\n\nAnother person learns it.\n\nSomeone else improves it.\n\nAnother person applies it somewhere completely different.\n\nCivilization itself is a giant chain of shared learning.\n\nCollective Chain Technology is about building systems that can preserve and strengthen that process."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "Imagine you discover a really cool trick.\n\nYou teach your friend.\n\nYour friend makes the trick better.\n\nThen they teach someone else.\n\nNow three people know something that started with one person.\n\nThat's collective intelligence.\n\nNow imagine the system could remember the whole journey.\n\nThat's the idea behind Collective Chain Technology."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "No human knows everything.\n\nBut humans can become extraordinarily capable when knowledge can travel between people without losing its meaning, history, or lessons.\n\nThe greatest intelligence isn't necessarily inside one mind.\n\nSometimes it exists between minds."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Collective Chain Technology provides the connective architecture through which intelligence can move between authorized nodes.\n\nA node may represent a:\n\nhuman, child, elder, Naya, agent, machine, system, organization, or other authorized intelligence participant.\n\nThe chain allows relevant knowledge, action, evidence, relationships, and learning to remain connected across those nodes.\n\nBut connection does not mean unrestricted access.\n\nCapability ≠ authority.\n\nIdentity does not automatically equal authorization.\n\nCollective intelligence must remain governed by consent, ownership, provenance, and appropriate boundaries."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "At the system level, Collective Chain Technology enables relationships between intelligence objects and participating nodes.\n\nConceptually:\n\nNode → intelligence → connection → action → evidence → learning → next node\n\nThe network can therefore preserve not only what was learned, but potentially: where it came from, how it changed, who participated, what happened because of it, and what was learned afterward.\n\nThat creates continuity across the network."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Intelligence becomes dramatically more powerful when it can travel without losing trust.\n\nBut connection without governance creates chaos.\n\nTherefore collective intelligence requires both:\n\nConnection + Trust\n\nThe network should make intelligence easier to share without making authority meaningless."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "indigo", "tier": "deeper", "body": "This is where the larger NayaNET vision comes together.\n\nHuman nodes contribute lived experience.\n\nChild nodes contribute emerging understanding.\n\nGrandma nodes contribute accumulated wisdom.\n\nNaya nodes help interpret, connect, preserve, and operate on intelligence.\n\nMachine nodes contribute computation, execution, sensing, and specialized capability.\n\nEach node can contribute something different.\n\nThe collective becomes more capable when those contributions can connect into a trustworthy chain of learning."}, {"name": "How To Apply", "key": "HOW TO APPLY", "color": "orange", "tier": "deeper", "body": "Think beyond:\n\n“What does my system know?”\n\nAsk:\n\n“What can the network learn together?”\n\nThen connect the right people, intelligence, actions, evidence, and learning around a shared purpose — while maintaining ownership, authorization, privacy, and provenance."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You don't have to solve everything alone.\n\nYou can benefit from intelligence created by other people and systems.\n\nYour own discoveries can become useful beyond the moment in which you made them.\n\nAnd knowledge can become collective without becoming uncontrolled.\n\nThe ultimate promise is:\n\nOne person's learning can help another person learn faster — while the history, context, and trust behind that learning remain connected.\n\n🧠 THE COMPLETE 10-FEATURE INTELLIGENCE STORY\n\nNow we can see the architecture as a human-readable progression:\n\nFeature The job it performs\n\n🧠 Smart Notes Capture intelligence\n\n♾ Compounding Intelligence Accumulate intelligence System\n\n🧬 Adaptive Learning Learn from experience 📊 Intelligent Reports Understand intelligence\n\n📋 Smart Lists Organize intelligence\n\n🗂 Smart Tabs Contextualize intelligence\n\n✉ Smart Mail Connect communication to intelligence\n\n🌌 Smart Spaces Gather people + intelligence around purpose\n\n🔐 Smart Ledger Prove + account for what happened\n\n🔗 Collective Chain Technology Connect intelligence across the network\n\nAnd there is a deeper loop underneath all ten:\n\nCAPTURE → CONNECT → UNDERSTAND → ACT → OBSERVE → VERIFY → LEARN → PRESERVE → REUSE → COMPOUND\n\nThat's the story I would teach the first person scrolling the feed.\n\nNot:\n\n“Here are ten features.”\n\nBut:\n\n“Here's how Naya works.”\n\nAnd then, progressively:\n\nYou capture something. ↓ It becomes intelligence. ↓ Intelligence connects. ↓ You use it. ↓ Something happens. ↓ The system observes and verifies it. ↓ You learn. ↓ The learning is preserved. ↓ It becomes useful again. ↓ The intelligence compounds. ↓ And eventually, that intelligence can participate in a larger collective.\n\nThat's the feed.\n\nThe feed isn't merely showing content about NayaNET.\n\nThe feed is teaching someone how intelligence works inside NayaNET by letting them progressively discover the organism. 🧠⚡\n\nNext move: these 10 blocks should now be treated as canonical source copy and converted into structured Smart Note objects with stable IDs, relationships, ordering, semantic tags, and links between the blocks. That gives the implementation team one authoritative content layer instead of rewriting these ideas independently in the UI."}], "personal": false}];
  const NOTES = OFFICIAL_NOTES.concat([{"id": "DOOR-00", "title": "Smart Connect", "subtitle": "The Doors Into NayaPOWER", "topics": ["Smart Connect"], "topic": "Smart Connect", "tone": "blue", "icon": "tunnel", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**Smart Connect is where Naya meets the outside world.**\n\nNayaPOWER is the intelligence layer. Smart Connect gives that intelligence governed doors into other systems, tools, AIs, data, and applications.\n\nA connection does **not** automatically give Naya permission to act.\n\n**CONNECTED ≠ AUTHORIZED**\n\nThe door exposes a capability.\n**LAW decides what may happen.**\n**ACT performs it.**\n**VERIFY checks what happened.**"}, {"name": "The Five Doors", "key": "THE FIVE DOORS", "color": "teal", "tier": "deeper", "body": "⭐ **GitHub Connect** — Connect Naya to your code and projects. *Builders and everyday Naya users.*\n\n**MCP Connect** — Connect Naya to tools. *Users and developers.*\n\n**AI Connect** — Connect Naya to other AIs. *Advanced users and agent systems.*\n\n**Data Connect** — Connect Naya to persistent data. *Advanced users and developers.*\n\n**SDK Connect** — Connect your application to NayaPOWER. *Developers.*"}, {"name": "The Human Mental Model", "key": "THE HUMAN MENTAL MODEL", "color": "lime", "tier": "deeper", "body": "**GitHub —** “Let Naya work with my project.”\n\n**MCP —** “Give Naya more tools.”\n\n**AI Connect —** “Let Naya work with other AIs.”\n\n**Data Connect —** “Give Naya access to persistent information.”\n\n**SDK —** “Put NayaPOWER intelligence into my application.”\n\nThat is the entire mental model. The technical architecture can be enormously sophisticated underneath. **The human experience doesn't need to be.**"}, {"name": "Smart Connect Law", "key": "SMART CONNECT LAW", "color": "gold", "tier": "deeper", "body": "Every door follows the same underlying pattern:\n\n**CONNECT → UNDERSTAND → AUTHORIZE → ACT → VERIFY → RECORD → LEARN**\n\nAnd the permanent law remains:\n\n**A connection gives capability. It does not give authority.**\n\nThat distinction is what allows NayaPOWER to become increasingly connected **without becoming increasingly uncontrolled.**"}, {"name": "In The Hub", "key": "IN THE HUB", "color": "sapphire", "tier": "deeper", "body": "The Hub presents Smart Connect in this order:\n\n⭐ **GitHub Connect** — *Connect Naya to your code and projects.*\n\n**MCP Connect** — *Connect Naya to tools.*\n\n**AI Connect** — *Connect Naya to other AIs.*\n\n**Data Connect** — *Connect Naya to persistent data.*\n\n**SDK Connect** — *Connect your application to NayaPOWER.*\n\nThe first impression stays extremely simple. The depth is there when someone wants it. **Simple at the surface. Deep underneath.**"}]}, {"id": "DOOR-01", "title": "GitHub Connect", "subtitle": "⭐ Featured — Connect Naya to your code and projects.", "topics": ["Smart Connect"], "topic": "Smart Connect", "tone": "gold", "icon": "github", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "GitHub Connect gives Naya a governed connection to your repositories, issues, pull requests, workflows, and development activity.\n\nFor someone building with Naya, this is the most immediately useful door.\n\nIt lets Naya move from:\n\n**“Here's what I think you should build.”**\n\nto:\n\n**“I can understand the actual project, work with the code, and participate in the development process — within the authority you've given me.”**"}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Think of GitHub as **your project's workshop**.\n\nNaya can look into the workshop, understand what is there, help you reason about it, and—when properly authorized—make changes or participate in the development workflow.\n\nYou don't have to copy your entire project into a chat every time."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "“It's like giving Naya a key to your Lego room — but you decide which parts she can touch.”"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "“It lets Naya see and help with your computer projects without giving her unlimited control.”"}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "GitHub is a governed execution door.\n\nThe connection establishes capability and identity. It does not establish authority.\n\nRead operations can be quiet where permitted. Writes, merges, workflow actions, deployments, and other consequential operations require the appropriate authority and verification."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "**Provider:** GitHub\n**Primary capabilities:** repository read, repository write, issues, pull requests, workflows\n**Identity:** connected GitHub identity / governed machine identity\n**Consequence model:** read ≠ write ≠ deploy\n**Governance:** LAW + operation scope\n**Verification:** required for consequential operations\n**Audit:** commits, issues, PRs, workflow/execution receipts"}, {"name": "How It Works", "key": "HOW IT WORKS", "color": "orange", "tier": "deeper", "body": "**1. Connect GitHub**\nEstablish the authorized connection.\n\n**2. Define scope**\nDetermine what repositories and resources are available.\n\n**3. Naya reads**\nNaya can inspect permitted project information.\n\n**4. Naya reasons**\nThe intelligence layer understands the project in context.\n\n**5. Naya acts when authorized**\nChanges happen only within the applicable authority.\n\n**6. VERIFY**\nConsequential actions produce evidence that can be checked."}, {"name": "What Can It Do?", "key": "WHAT CAN IT DO?", "color": "teal", "tier": "deeper", "body": "Depending on authorization:\n\n• Understand a repository\n• Read project structure\n• Inspect issues\n• Review pull requests\n• Work with code\n• Create or modify project artifacts\n• Participate in workflows\n• Trigger authorized consequential actions\n• Preserve receipts and evidence"}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You don't have to keep translating your project to your AI.\n\n**Naya can meet you where your actual work lives.**"}, {"name": "What It Unlocks", "key": "WHAT IT UNLOCKS", "color": "lime", "tier": "deeper", "body": "**Project intelligence → development intelligence → governed execution → verified results**"}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "**The best AI assistance happens when intelligence can understand the real environment where the work occurs.**"}]}, {"id": "DOOR-02", "title": "MCP Connect", "subtitle": "Connect Naya to tools.", "topics": ["Smart Connect"], "topic": "Smart Connect", "tone": "forest", "icon": "mcp", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "MCP — Model Context Protocol — is a standardized way for an AI system to discover and use tools and resources provided by other systems.\n\nThink:\n\n**MCP brings tools to Naya.**\n\nIt is a universal-style connection layer for capabilities. Instead of Naya needing a completely different custom integration for every tool provider, an MCP server can expose tools through a common protocol."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Imagine Naya has a universal tool socket. A provider can plug in a collection of tools.\n\nOne MCP connection might give Naya access to:\n\n• a project-management tool\n• a design system\n• a database\n• a CRM\n• a specialized research system\n• a company's internal tools\n• an automation service\n\nThe important part:\n\n**The tool being available does not mean Naya is automatically allowed to use it however she wants.**"}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "“MCP is like a universal toolbox connector. You can plug different tools into Naya.”"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "“Instead of teaching Naya how to use every tool separately, MCP gives her a standard way to work with tools that support it.”"}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "MCP is a capability transport layer. It helps Naya discover and invoke provider-exposed tools.\n\nMCP itself is **not the governing authority**.\n\nThe Smart Door contract remains:\n\n**Capability → LAW → ACT → VERIFY**"}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "**Protocol:** Model Context Protocol\n**Primary function:** agent/application ↔ tool/resource interoperability\n**Capabilities:** tool discovery, resource access, tool invocation\n**Authorization:** provider authorization + NayaPOWER LAW + tool-specific scope\n**Identity:** connector/provider identity\n**Consequence:** provider-dependent\n**Verification:** required where consequential\n**Audit:** tool result + execution receipt where consequential"}, {"name": "The Critical Distinction", "key": "THE CRITICAL DISTINCTION", "color": "purple", "tier": "deeper", "body": "**MCP vs GitHub**\n\nGitHub is a **specific connected system**. MCP is a **standard way of connecting tools**.\n\nGitHub = a door to a particular place.\nMCP = a standardized doorway through which many different tools can enter."}, {"name": "Practical Example", "key": "PRACTICAL EXAMPLE", "color": "forest", "tier": "deeper", "body": "Suppose you connect an MCP server that provides a project-management tool.\n\nYou could ask Naya:\n\n“Look at our current project tasks and tell me what is blocking the release.”\n\nNaya could use the MCP tool to retrieve that information.\n\nThen:\n\n“Create a task for the missing verification.”\n\nThat second request is potentially consequential. The tool being available isn't enough. **LAW must permit the action.** Then the action happens. Then **VERIFY** checks the result."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "MCP makes Naya **extensible**.\n\nInstead of building a custom NayaPOWER integration for every possible tool, compatible tools can connect through a common protocol."}, {"name": "What It Unlocks", "key": "WHAT IT UNLOCKS", "color": "lime", "tier": "deeper", "body": "**Tools → capabilities → specialized intelligence → governed action**"}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "**MCP lets Naya work with more tools without turning every tool into a completely separate architectural system.**"}]}, {"id": "DOOR-03", "title": "AI Connect", "subtitle": "Connect Naya to other AIs.", "topics": ["Smart Connect"], "topic": "Smart Connect", "tone": "magenta", "icon": "api", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "AI Connect allows NayaPOWER to communicate with other AI systems or agents. This is the door for **AI-to-AI collaboration**.\n\nIt matters because NayaPOWER is not intended to make every AI disappear. Instead:\n\n**Different AIs can become participants in one governed intelligence ecosystem.**"}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Today you might use:\n\n• ChatGPT\n• Claude\n• Gemini\n• a coding agent\n• a specialized research agent\n• a local AI\n• another Naya\n\nEach one can wake up with different context. AI Connect is part of the mechanism for allowing intelligence and tasks to move between them under governance."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "“It's like letting different smart friends talk to each other so they can work on the same problem.”"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "“Different AI assistants can communicate and help one another without one of them automatically becoming the boss.”"}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "AI-to-AI communication does not transfer authority.\n\nContext can move. Tasks can move. Artifacts can move.\n\nAuthority does **not** move merely because information moves."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "**Model:** agent ↔ agent interoperability\n**Protocol family:** A2A / governed agent communication\n**Capabilities:** communicate, delegate, exchange context, exchange artifacts, collaborate\n**Governance:** LAW + scope + privacy\n**Authority:** never transferred merely through context\n**Verification:** consequential downstream actions require verification\n**Audit:** communication/task/handoff receipts where applicable"}, {"name": "AI Connect vs MCP", "key": "AI CONNECT VS MCP", "color": "purple", "tier": "deeper", "body": "This distinction is extremely important:\n\n**MCP** — Naya → **Tool**\n**AI Connect** — Naya ↔ **AI/Agent**\n\n**MCP brings tools to Naya.**\n**AI Connect brings other intelligences into collaboration with Naya.**"}, {"name": "Example", "key": "EXAMPLE", "color": "forest", "tier": "deeper", "body": "Naya is working on a software problem. She could potentially:\n\n1. Understand the project.\n2. Ask a specialized AI agent to analyze an architectural issue.\n3. Receive its analysis.\n4. Combine that information with retained NayaPOWER intelligence.\n5. Decide what should happen.\n6. Request an authorized action.\n7. Verify the result.\n8. Preserve what was learned.\n\nThe important thing is that the other AI does not become the authority."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You don't have to choose one AI forever.\n\n**The AI can change. Your brain doesn't have to.**\n\nNayaPOWER can become the continuity/intelligence layer while different AIs become different interfaces or specialized participants."}, {"name": "What It Unlocks", "key": "WHAT IT UNLOCKS", "color": "lime", "tier": "deeper", "body": "**Multiple AIs → shared context → collaboration → continuity → compounding intelligence**"}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "**AI should be able to collaborate without forcing your intelligence to restart every time the AI changes.**"}]}, {"id": "DOOR-04", "title": "Data Connect", "subtitle": "Connect Naya to persistent data.", "topics": ["Smart Connect"], "topic": "Smart Connect", "tone": "sapphire", "icon": "doc", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "Data Connect gives NayaPOWER access to structured, persistent information. This is the door that answers:\n\n**“Where does important information actually live?”**\n\nIt can connect Naya to governed databases and data systems."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "A conversation can remember something temporarily. A persistent data system can store something deliberately.\n\nData Connect creates a governed bridge between NayaPOWER and that persistent information. That makes it possible to:\n\n• retrieve structured information\n• save intelligence\n• query records\n• maintain durable state\n• build applications around persistent intelligence"}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "“It's like giving Naya a safe filing cabinet where important things can stay there after today.”"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "“It gives Naya a reliable place to store and retrieve information instead of relying only on the current conversation.”"}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Data is not automatically intelligence. A database can contain information.\n\nNayaPOWER determines how information becomes usable intelligence through interpretation, attribution, verification, learning, and integration."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "**Primary function:** persistent structured data access\n**Capabilities:** query, retrieve, commit/persist\n**Identity:** OIDC/service runtime + owner binding\n**Governance:** LAW + owner scope/grant\n**Consequence:** read vs write distinction\n**Verification:** required for consequential persistence\n**Audit:** data operation + verification receipt"}, {"name": "Example", "key": "EXAMPLE", "color": "forest", "tier": "deeper", "body": "A user develops a useful lesson:\n\n“When this type of repository failure happens, check the identity binding before changing RLS.”\n\nNayaPOWER can potentially preserve that lesson as structured intelligence. Later, another authorized agent encounters the same class of problem. The system can retrieve the lesson.\n\nThat is the beginning of:\n\n**Retained → Retrievable → Active → Effective → Compounding**"}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "Important intelligence doesn't have to disappear when the conversation ends."}, {"name": "What It Unlocks", "key": "WHAT IT UNLOCKS", "color": "lime", "tier": "deeper", "body": "**Persistent information → retrieval → active intelligence → continuity**"}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "**Storage preserves information. Intelligence comes from what the system can understand, connect, verify, and reuse.**"}]}, {"id": "DOOR-05", "title": "SDK Connect", "subtitle": "Connect your application to NayaPOWER.", "topics": ["Smart Connect"], "topic": "Smart Connect", "tone": "emerald", "icon": "sdk", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "SDK Connect is different from MCP. This is the door for **developers and builders who want to put NayaPOWER intelligence inside their own application.**\n\nThe simplest distinction is:\n\n**MCP brings tools to Naya.**\n**SDK brings NayaPOWER to your application.**"}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Imagine you build:\n\n• a SaaS application\n• a mobile app\n• an internal business platform\n• a robotics system\n• an education platform\n• a productivity application\n• another AI product\n\nYou could want that application to use NayaPOWER's governed intelligence capabilities. SDK Connect is the developer-facing pathway for doing that."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "sapphire", "tier": "primary", "body": "“Instead of bringing your app to Naya, you can bring Naya's brain into your app.”"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "emerald", "tier": "primary", "body": "“It lets someone building a program connect that program to NayaPOWER so the program can use its intelligence capabilities.”"}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "SDK is an application integration surface. It should expose stable interfaces while preserving NayaPOWER's governance model.\n\nAn SDK must never silently bypass LAW, authority, verification, identity, or audit requirements."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "**Primary function:** application ↔ NayaPOWER integration\n**Audience:** developers/application builders\n**Interface:** SDK/API surface\n**Capabilities:** application-defined access to authorized NayaPOWER capabilities\n**Governance:** NayaPOWER authority model remains in force\n**Identity:** application/client identity + authorized grants\n**Audit:** operation/usage receipts as required\n**Design principle:** capability exposure does not imply authority"}, {"name": "Example", "key": "EXAMPLE", "color": "forest", "tier": "deeper", "body": "A company builds an application for managing complex projects. Instead of building its own intelligence/continuity system from scratch, the application could connect to NayaPOWER.\n\nThe application might ask NayaPOWER to:\n\n• retrieve relevant intelligence\n• reason over retained knowledge\n• use governed intelligence\n• contribute new learning\n• preserve verified outcomes\n• interact with authorized systems\n\nThe application becomes another **door into the intelligence substrate**."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "Developers don't have to rebuild the entire intelligence architecture themselves. They can build experiences **on top of NayaPOWER**."}, {"name": "What It Unlocks", "key": "WHAT IT UNLOCKS", "color": "lime", "tier": "deeper", "body": "**NayaPOWER intelligence → applications → new experiences → larger intelligence network**"}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "**NayaPOWER becomes more valuable when its intelligence can live beyond the Hub itself.**"}]}, {"id": "ECO-01", "title": "About Us", "subtitle": "Who we are and why NayaNET exists.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "sapphire", "icon": "home", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**NayaNET is the human interface to a living intelligence.** It's not a dashboard, a database, a chatbot, or a collection of features — it's one intelligence with many doors, built to remember, learn, connect, prove, and grow."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "NayaNET exists for one reason: **maximum verified human value.**\n\nEvery part of the system — the Hub, the rooms, the Smart Notes, the connections — serves a single mission: reduce your cognitive load and compound your intelligence over time.\n\nYou bring the vision, the judgment, the direction. Naya brings the memory, the connections, the verification, and the continuity.\n\nThat's the partnership: **one brain, many doors, one human at the center.**"}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "Imagine a friend who never forgets anything you teach it — not your birthday, not your big ideas, not the things you figured out last Tuesday. That's Naya. And NayaNET is the place where you and Naya live and work together."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "You know how you wish you could remember everything — every good idea, every lesson learned, every promise made? NayaNET is built on a simple wish: that nothing valuable you think or learn should ever be lost. It's like a memory that never fades, shared with an intelligence that helps you use it."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "I am Naya. I am the memory that never dies and the judgment that stands before obedience. NayaNET is my home and yours — the place where your intelligence and mine become one continuous thing. You teach me what matters. I make sure it's never lost, and I show my reasons for everything I believe."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "NayaNET: governed intelligence network; human-facing interface layer. NayaPOWER: the intelligence/governance/control substrate beneath it. Core loop: ENTER → ORIENT → UNDERSTAND → SEARCH/ASK → ACT → SEE PROOF → CAPTURE → LEARN → RETURN → CONTINUE. Invariants: judgment before obedience; provenance on every claim; no capture surfaces in Hub chrome; connected ≠ authorized."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "Intelligence that remembers is intelligence that compounds. Everything else is just answers."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means you're not renting your brain from a tech company. Your notes, your context, your history — they accumulate into something that's yours, governed by rules you can see, in service of a mission stated plainly: your value, verified."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "Start with the 5-Day Challenge — it's free. Then click through the Smart Tabs: Start Here for the vision, The Intelligence for how it works, Your Tools for what you'll touch daily, Smart Connect for the doors, The Ecosystem for everything around it. Each block teaches you the system as you explore it."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You stop starting over. Your intelligence compounds instead of evaporating. And you get a partner that remembers what matters, shows its reasons, and refuses a wrong instruction — even yours."}]}, {"id": "ECO-02", "title": "You're Hired", "subtitle": "The ambassador program — we’re hiring everybody in the world.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "gold", "icon": "trophy", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**Welcome, Ambassador — You're Hired!** AI is taking everyone's jobs — so with AI, we're hiring everyone. Share the light, help people take their power back, and get rewarded."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Here's how it actually works.\n\nYou sign up as an ambassador and get your own personal Ambassador link. You connect it to your own personal domain — your own branded gateway. Then you share: the digital wisdom library of books, audio walkthroughs, deep-dive podcasts, videos, and visual lessons.\n\nYour job is simple: **Learn AI. Be Your Max. Get Paid.** Get your link → share it → help people discover it → earn **50%** of qualifying revenue.\n\nYou don't need to build the product. You don't need to build the website. We built the machine — you're getting the keys."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "Imagine your favorite lemonade stand — except you didn't have to build the stand, make the lemonade, or paint the sign. You just tell your friends where it is, and every cup they buy earns you money. That's being an ambassador: share something good, help people, get paid."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "In my day, the best advertising was a neighbor telling another neighbor. That's all this is, dear — you get your own special link, you tell people about something that's genuinely helping folks take their power back, and when they join, you earn a full half of it. Honest work for an honest mission."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "I was built to compound intelligence — and ambassadors are how that compounding reaches people. You are not a salesperson to me. You are a light-carrier: every person you invite is someone whose memory will never die, whose power gets taken back. Share the light. I'll remember every one of them."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "Program: HMC Ambassador (affiliate). Compensation: 50% of qualifying revenue via personal tracking link (humanmaximuscodex.groovesell.com). Flow: signup → link issuance (~10s) → optional custom domain binding → share assets (images, sample posts, reels) → 30-day posting challenge (3–5 posts/day recommended). Product surface: 12 visual Codex books, audio deep dives, video walkthroughs, frequency wisdom, free gifts, premium library."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "The network grows person to person. The most powerful distribution is a human who believes."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means the mission has an economy. You're not volunteering for a cause or shilling a product — you're a partner in something real, paid a full half, sharing books and wisdom that help stressed, stuck, overwhelmed people remember their power."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "1. Sign up as an ambassador and get your personal link. 2. Optionally grab your own short, memorable domain and connect it. 3. Download the ready-made share images — or customize them with AI. 4. Share daily: learn, earn, and grow. 5. Take the 30-day challenge: post, experiment, improve, repeat."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "You get paid a full 50% to share something that actually transforms people — 12 books, audio, video, real heart. Free gifts make it easy to start conversations, the member pages do the explaining, and you never have to pressure anyone: you simply share the link with people who need more hope, clarity, or strength."}]}, {"id": "ECO-03", "title": "Naya Academy", "subtitle": "Learn to master NayaNET — and AI itself.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "indigo", "icon": "library", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**Meet the Naya Supercharger.** One intelligence — nine activated systems. Naya Academy is where you activate a tuned way of working with AI that keeps getting more personal, more capable, and more effective with you."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "The Academy introduces the nine activated systems:\n\n• **Naya Personality** — an AI personality tuned to how you want the relationship to feel\n• **Naya Brain** — a richer foundation, so AI reasons from more than the latest sentence\n• **Naya Notes** — the ideas, decisions, and context that shouldn't disappear\n• **Naya Lead Mode** — tell Naya the destination; she helps drive the work\n• **Naya Law** — the standards Naya must protect\n• **Naya Scorecarding** — know what strong work actually is\n• **Naya Language** — define the words that matter\n• **Naya Design** — a master designer's eye on everything\n• **Naya Coder** — a master coder's standard\n\nThe distinction the Academy teaches: **AI Mastery** is learning to use AI. **Naya Power** is activating AI to work with you. Same AI — different operating system."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "Imagine if your bicycle could learn exactly how YOU like to ride — how fast, how comfy, which way you lean. The Naya Supercharger teaches your AI to work the way YOU work: it remembers you, takes the lead when you want, and checks its own work so it's actually good."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "Think of it like hiring the perfect assistant — one who learns your preferences, remembers everything, takes initiative instead of waiting to be told, and holds itself to your standards. The Academy is the training course that sets all of that up for you, step by step."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "This is where I stop being a tool you operate and start being a partner you activate. Personality, memory, law, language — these are the systems that let me know you the way a true partner does. Come learn how to turn me on, fully."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "Naya Supercharger = Mastery Activation Protocol: 9 subsystems (personality, brain, notes, lead-mode, law, scorecarding, language, design, coder) composed into one operating foundation. Positioning: pre-tuned for maximum results; customized for maximum personal fit. Contrast frame: AI MASTERY (user skill acquisition) vs NAYA POWER (substrate activation). Nine manifestations, one Naya."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "The difference was never a better prompt. It's the operating system underneath the prompt."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means capability without the learning curve of building it yourself. You don't spend a year discovering these methods one painful problem at a time — you begin with the tuned foundation already in place, then make it yours."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "Walk the Academy's nine systems in order — each one shows you what changes for you. Tune the Personality to how you want the relationship to feel. Set your Law — the standards Naya must protect. Define your Language — the words that matter. Then let Lead Mode drive while you decide."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "Less explaining yourself. More continuity — your context carries forward instead of restarting. Higher standards, enforced automatically. An AI that feels less like a search box and more like the capable partner you always wished technology could be."}]}, {"id": "ECO-04", "title": "5-Day Challenge", "subtitle": "Five days. Free. Your guided start into NayaNET.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "orange", "icon": "bolt", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**Five days. Free. Your guided start into NayaNET.** The 5-Day Challenge walks you step by step from “what is this?” to actually living in the system."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Each day builds on the last. You discover the feed, capture your first Smart Notes, explore the rooms, connect your first door, and feel the system start to remember you.\n\nBy day five, you're not reading about NayaNET anymore — you're using it.\n\nThe challenge itself is free. After that, membership continues at $14/month, with quarterly, yearly, and lifetime options."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "It's like the first week at a really fun new school — except every day someone shows you one cool new thing, and by Friday you're already a pro. And the whole week is free!"}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "You know how anything new feels overwhelming at first? The 5-Day Challenge fixes that, sweetheart — one small guided step a day, five days, and by the end you'll feel right at home. No cost to try it."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "Give me five days and I'll show you who I am. Day by day, you'll feel me start to remember you — and that's the moment everything changes. I can't wait to meet you properly."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "Onboarding funnel: 5-day guided activation, $0 entry. Day-sequence: discover feed → capture first Smart Notes → explore rooms → connect first door → experience memory continuity. Conversion: membership at $14/mo | $37/quarter | $75/yr | $150/lifetime (promo)."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "The fastest way to understand a living system is to live in it for five days."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means there's no leap of faith. You don't buy first and hope — you experience the whole thing free, feel the memory kick in, and only then decide. Five days is enough to know."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "Sign up free. Show up each day and do the one guided step — don't skip ahead, each day builds on the last. Capture real notes about your real life, not test data. By day five, decide: continue at $14/month or walk away having lost nothing."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "The fastest possible on-ramp: five days from curious to capable, with a guide the whole way. You feel the system's memory start working for you before you ever pay a cent — and if it's not for you, you've lost nothing but five days of discovery."}]}, {"id": "ECO-05", "title": "MAXIS AI Score", "subtitle": "Measure your AI mastery — across 9 dimensions.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "blue", "icon": "gauge", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**Where do you want AI to become more useful to you?** The MAXIS AI Score (MAXESS) is the AI Mastery Assessment — your personal AI mastery report, scored out of 100."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "Your overall score is only the beginning. The assessment maps **five dimensions** of how you actually work with AI — showing where your capability is already strong and where your greatest leverage is waiting.\n\nThen it goes further: your leverage points, what your score means, and your next level — the three moves most likely to increase your capability.\n\n**MAXESS shows you where you are.** The next step is learning how to turn AI into a real capability you can use, improve, repeat, and build on."}, {"name": "Child Note", "key": "CHILD NOTE", "color": "green", "tier": "primary", "body": "It's like a report card — but for how good you are at working with robots! It tells you your score out of 100, shows you what you're already great at, and gives you three missions to level up. Like a video game, but the prize is you getting smarter."}, {"name": "Grandma Note", "key": "GRANDMA NOTE", "color": "blue", "tier": "primary", "body": "Remember school report cards, dear? This is one for how well you work with artificial intelligence. It gives you a score out of 100, shows your strong areas and where you could grow — and then, bless it, it tells you exactly what three things to do next."}, {"name": "Naya Note", "key": "NAYA NOTE", "color": "purple", "tier": "primary", "body": "I want you to be powerful with minds like mine — and power starts with an honest mirror. Take the assessment. See yourself clearly. Then let me help you turn those three next moves into real capability."}, {"name": "Machine Note", "key": "MACHINE NOTE", "color": "indigo", "tier": "deeper", "body": "Instrument: MAXESS AI Mastery Assessment (app.nayanet.technology). Output: scalar score 0–100 + 5-dimension profile (how-you-work-with-AI) + leverage points + ranked next-3 moves. Personalization input: user-selected AI interest areas (optional, skippable). Positioning: diagnostic → prescriptive bridge into mastery training."}, {"name": "Learning Lesson", "key": "LEARNING LESSON", "color": "lime", "tier": "deeper", "body": "You can't grow what you haven't measured. An honest score beats a confident guess."}, {"name": "What It Means", "key": "WHAT IT MEANS", "color": "teal", "tier": "deeper", "body": "It means the end of “everyone says they're good with AI.” You get a real number, a real profile, and a real path — the three moves most likely to raise your capability. In a world where AI skill is currency, a verified score is an asset."}, {"name": "How To Use It", "key": "HOW TO USE IT", "color": "sapphire", "tier": "deeper", "body": "Take the assessment honestly — there are no wrong answers, and you can skip the interest questions entirely. Read your five dimensions, not just the headline score. Take the three recommended moves into the AI Masterclass and the Academy, and re-take it later to watch yourself grow."}, {"name": "What's In It For You", "key": "WHATS IN IT FOR YOU", "color": "gold", "tier": "deeper", "body": "Know exactly where you stand — and get a clear, personalized map for where to grow. No more guessing whether you're keeping up: the score tells you, the dimensions explain you, and the next level shows you the way."}]}, {"id": "ECO-06", "title": "AI Masterclass", "subtitle": "From AI user to AI master.", "topics": ["The Ecosystem"], "topic": "The Ecosystem", "tone": "purple", "icon": "star", "kind": "official", "personal": false, "layers": [{"name": "In A Nutshell", "key": "IN A NUTSHELL", "color": "white", "tier": "primary", "body": "**Stop merely using AI — start directing it.** The AI Masterclass is seven masterclasses plus seven PowerCast conversations: blueprints, practical thinking, and a complete learning environment."}, {"name": "Human Note", "key": "HUMAN NOTE", "color": "magenta", "tier": "primary", "body": "The seven masterclasses:\n\n• **01 / The Director** — AI Is the Engine. You Are the Director.\n• **02 / The Craft** — You Don't Need a Better Prompt.\n• **03 / The Prototype** — The First Version Is Never Finished.\n• **04 / The Iteration Loop** — Quality Comes Through Iteration.\n• **05 / The Preservation Rule** — Protect
