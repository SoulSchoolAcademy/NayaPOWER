<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome to Naya World</title>
<link rel="stylesheet" href="smart-box.css">
<style>
body{background:#050508;color:#fff;margin:0;min-height:100vh;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:48px 20px;box-sizing:border-box}
.ambient-glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% 0%,rgba(160,107,255,.16),transparent 70%);z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;width:100%;text-align:center}
.doors{display:flex;flex-direction:column;gap:16px;margin-top:32px}
.door{display:flex;align-items:center;gap:16px;padding:20px 24px;text-decoration:none;color:#fff;text-align:left}
.door .orb{width:56px;height:56px;flex:none}
.door h3{margin:0 0 4px;font-size:18px;color:#fff}
.door p{margin:0;font-size:14px;color:#fff;opacity:.65}
.wordmark{font-size:13px;letter-spacing:.3em;color:#fff;opacity:.5;margin-bottom:16px}
h1{font-size:clamp(34px,8vw,54px);margin:0 0 12px;color:#fff;font-weight:800}
.sub{font-size:18px;color:#fff;opacity:.75;line-height:1.5;margin:0}
</style>
</head><body>
<div class="ambient-glow"></div>
<div class="wrap">
  <div class="wordmark">NAYANET</div>
  <div class="orb" style="width:110px;height:110px;margin:0 auto 20px"></div>
  <h1>Welcome to Naya World, Shawn.</h1>
  <p class="sub">One ultimate app. Your doors are open.</p>
  <div class="doors">
    <a class="door ib-card" href="https://nayanet.app/personal">
      <div class="orb" style="--soul:#a06bff"></div>
      <div><h3>Personal</h3><p>Your home. Your world, your way.</p></div>
    </a>
    <a class="door ib-card" href="https://nayanet.app/dashboard">
      <div class="orb" style="--soul:#ffbf3d"></div>
      <div><h3>Business</h3><p>Your numbers. The Bugatti gauge, live.</p></div>
    </a>
    <a class="door ib-card" href="https://nayanet.app/space">
      <div class="orb" style="--soul:#3fb8ff"></div>
      <div><h3>Space</h3><p>Your people. Your community, alive.</p></div>
    </a>
  </div>
  <p style="margin-top:36px;font-size:13px;color:#fff;opacity:.4">ONE INTELLIGENCE · MANY VIEWS · ONE IDENTITY</p>
</div>
</body></html>
