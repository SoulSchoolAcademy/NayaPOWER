.naya-tabs {position: sticky; top: 10px; z-index: 120;

.orbital {position: relative; width: 280px; height: 280px; margin: 0 auto;}

.orbital-center {position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 110px; height: 110px; border-radius: 50%; background: #0a0a0f; border: 2px solid var(--bc); box-shadow: 0 0 30px var(--bc); display: flex; align-items: center; justify-content: center; font-size: 28px;}

.orbital-sat {position: absolute; width: 56px; height: 56px; border-radius: 50%; background: #0a0a0f; border: 1.5px solid var(--sc); box-shadow: 0 0 16px var(--sc); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #F8F7FB;}

.orbital-ring {position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); border: 1px solid rgba(248,247,251,.15); border-radius: 50%; pointer-events: none;}

.circle-row {display: flex; gap: 16px; justify-content: center; align-items: center; padding: 20px;}

.circle-board {width: 72px; height: 72px; border-radius: 50%; background: #0a0a0f; border: 2px solid var(--bc); box-shadow: 0 0 20px var(--bc); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #F8F7FB; flex-shrink: 0;}

.circle-board.lg {width: 120px; height: 120px; font-size: 36px;}

.feature-circle {width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #15151f, #0a0a0f 70%); border: 2px solid var(--bc); box-shadow: 0 0 40px var(--bc), inset 0 0 30px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; margin: 0 auto; position: relative;}

.feature-circle::before {content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid var(--bc); opacity: .3; pointer-events: none;}

.feature-circle .fc-icon {font-size: 36px; margin-bottom: 8px; color: var(--bc); text-shadow: 0 0 16px var(--bc);}

.feature-circle .fc-title {font-size: 18px; font-weight: 700; color: #F8F7FB; margin-bottom: 6px;}

.feature-circle .fc-desc {font-size: 14px; color: #F8F7FB; opacity: .7; line-height: 1.4;}

.stat-grid {display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px;}

.stat-card {animation: fadeUp .6s cubic-bezier(.16,.84,.22,1) backwards; transition: transform .2s, box-shadow .2s;}

.stat-card::before {content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--bc); box-shadow: 0 0 12px var(--bc);}

.stat-value {font-size: 24px; font-weight: 800; color: #F8F7FB; margin-bottom: 4px;}

.stat-label {font-size: 14px; color: #F8F7FB; opacity: .6;}

.stat-trend {font-size: 14px; margin-top: 6px;}

.stat-trend.up {color: #2fe89e;}

.stat-trend.down {color: #ff5e6c;}

.bar-chart {display: flex; align-items: flex-end; gap: 8px; height: 120px; padding: 16px; justify-content: center;}

.bar {flex:1;height:2px;background:var(--edge);margin:0 6px;border-radius:2px;min-width:40px}

.donut {animation: donutFill 1s cubic-bezier(.16,.84,.22,1) backwards;}

.donut-center {font-size: 18px; font-weight: 700; color: #F8F7FB;}

.data-table {width: 100%; border-collapse: collapse; font-size: 14px;}

.data-table th {text-align: left; padding: 10px 12px; color: #F8F7FB; opacity: .5; font-weight: 600; border-bottom: 1px solid rgba(248,247,251,.1);}

.data-table td {padding: 10px 12px; color: #F8F7FB; border-bottom: 1px solid rgba(248,247,251,.05);}

.data-table tr:last-child td {border-bottom: none;}

.cal-grid {display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 16px;}

.cal-day {transition: all .15s; cursor: pointer;}

.cal-day.header {font-weight: 700; opacity: .5; font-size: 12px;}

.cal-day.active {animation: pulseGlow 2s infinite;}

.cal-day.today {background: var(--bc); color: #0a0a0f; font-weight: 700;}

.slot-row {display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; justify-content: center;}

.slot {transition: all .15s; cursor: pointer;}

.slot.on {border-color: var(--bc); box-shadow: 0 0 12px var(--bc); background: rgba(255,255,255,.05);}

.msg-row {transition: background .15s; cursor: pointer;}

.msg-avatar {width: 40px; height: 40px; border-radius: 50%; background: var(--bc); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; box-shadow: 0 0 12px var(--bc);}

.msg-body {flex: 1; min-width: 0;}

.msg-from {font-size: 14px; font-weight: 600; color: #F8F7FB;}

.msg-subject {font-size: 14px; color: #F8F7FB; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

.msg-time {font-size: 12px; color: #F8F7FB; opacity: .4; flex-shrink: 0;}

.timeline {height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}

.timeline::before {content: ''; position: absolute; left: 24px; top: 16px; bottom: 16px; width: 2px; background: var(--bc); opacity: .3;}

.tl-item {display: flex; gap: 12px; margin-bottom: 16px; position: relative;}

.tl-dot {animation: pulseGlow 2.5s infinite;}

.tl-content {font-size: 14px; color: #F8F7FB;}

.tl-time {font-size: 12px; opacity: .4;}

.product-card {padding: 16px; text-align: center;}

.product-img {transition: transform .2s;}

.product-title {font-size: 18px; font-weight: 700; color: #F8F7FB; margin-bottom: 4px;}

.product-price {font-size: 24px; font-weight: 800; color: var(--bc); margin-bottom: 12px;}

.pricing-tier {transition: transform .2s, box-shadow .2s;}

.pricing-tier.featured {animation: pulseGlow 3s infinite;}

.tier-name {font-size: 14px; font-weight: 600; color: #F8F7FB; opacity: .7; margin-bottom: 8px;}

.tier-price {font-size: 28px; font-weight: 800; color: #F8F7FB; margin-bottom: 12px;}

.tier-features {font-size: 14px; color: #F8F7FB; opacity: .6; line-height: 1.8;}

.countdown {display: flex; gap: 12px; justify-content: center; padding: 20px 16px;}

.cd-unit {text-align: center;}

.cd-num {font-variant-numeric: tabular-nums;}

.cd-label {font-size: 12px; color: #F8F7FB; opacity: .5; margin-top: 4px;}

.composer {padding: 16px;}

.composer-input {width: 100%; background: #0d0d14; border: 1px solid rgba(248,247,251,.15); border-radius: 12px; padding: 12px; color: #F8F7FB; font-size: 14px;  margin-bottom: 12px;}

.bar:nth-child(1) {animation-delay:.05s}

.bar:nth-child(2) {animation-delay:.1s}

.bar:nth-child(3) {animation-delay:.15s}

.bar:nth-child(4) {animation-delay:.2s}

.bar:nth-child(5) {animation-delay:.25s}

.bar:nth-child(6) {animation-delay:.3s}

.bar:nth-child(7) {animation-delay:.35s}

.bar:hover {filter: brightness(1.3); transform: scaleY(1.05);}

.stat-card:nth-child(2) {animation-delay:.1s}

.stat-card:nth-child(3) {animation-delay:.2s}

.stat-card:nth-child(4) {animation-delay:.3s}

.stat-card:hover {transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 24px var(--bc);}

.data-table tr {transition: background .15s;}

.data-table tbody tr:hover {background: rgba(255,255,255,.04);}

.cal-day:hover:not(.header) {background: rgba(255,255,255,.08); transform: scale(1.1);}

.slot:hover {transform: translateY(-2px); border-color: var(--bc);}

.msg-row:hover {background: rgba(255,255,255,.04);}

.pricing-tier:hover {transform: translateY(-6px);}

.product-card:hover .product-img {transform: scale(1.05) rotate(2deg);}

.pcard .pmodel {margin-top: 12px;}

.pcard .pname {margin-top: 4px; margin-bottom: 4px;}

.pcard .pdesc {margin-bottom: 12px;}

.psizes {display:flex;gap:6px;flex-wrap:wrap}

.prow {display:flex;gap:10px}

.prow button {flex: 1;}

.pcard > div > div[style*="font-size:12px"] {margin-bottom: 14px !important;}

.szpill {font-size:13px;font-weight:700;padding:12px 18px;display:inline-flex;align-items:center;border-radius:22px;border:1.5px solid #F8F7FB;background:linear-gradient(180deg,#1a1a24,#0c0c12);color:#F8F7FB;cursor:pointer;letter-spacing:.06em;box-shadow:inset 0 1px rgba(255,255,255,.3),inset 0 -2px 6px rgba(0,0,0,.5),0 0 14px rgba(248,247,251,.18),0 6px 16px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s,border-color .2s}

.pcard[data-wide="600"] {flex: 0 0 600px !important; max-width: 600px !important;}

* {box-sizing:border-box;margin:0;padding:0}

body {background:#050507;margin:0;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;min-height:100vh;}

.wrap {max-width:1760px;margin:0 auto;padding:0 32px}

.topnav {display:flex;gap:10px;justify-content:center;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;background:rgba(5,5,7,.92);backdrop-filter:blur(10px);z-index:50;overflow-x:auto;scrollbar-width:none}

.topnav::-webkit-scrollbar {display:none}

.steppill {flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-weight:800;font-size:11px;letter-spacing:.14em;color:#F8F7FB;padding:10px 18px;border-radius:999px;background:linear-gradient(180deg,#262633,#0a0a0f 70%);border:1.5px solid #F8F7FB;box-shadow:inset 0 2px rgba(255,255,255,.5),inset 0 -4px 10px rgba(0,0,0,.6),0 0 22px rgba(248,247,251,.3),0 14px 32px rgba(0,0,0,.7);transition:border-color .25s,box-shadow .25s,transform .2s;white-space:nowrap}

.stepplus {--jewel:#a06bff;flex:0 0 auto;width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:radial-gradient(circle at 32% 22%,rgba(255,255,255,.85),transparent 42%),radial-gradient(circle at 50% 55%,var(--jewel),#1a0f2e 82%);color:#fff;font-size:24px;font-weight:800;cursor:pointer;display:grid;place-items:center;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.6);box-shadow:inset 0 1px rgba(255,255,255,.5),inset 0 -3px 8px rgba(0,0,0,.4),0 0 22px rgba(160,107,255,.55),0 8px 20px rgba(0,0,0,.5);transition:transform .18s cubic-bezier(.16,.84,.22,1),box-shadow .18s}

.stepplus:hover {transform:translateY(-2px) scale(1.04);box-shadow:inset 0 1px rgba(255,255,255,.5),inset 0 -3px 8px rgba(0,0,0,.4),0 0 32px rgba(160,107,255,.75),0 12px 28px rgba(0,0,0,.6)}

.stepplus[aria-expanded="true"] {background:rgba(160,107,255,.28);box-shadow:0 0 18px rgba(160,107,255,.4)}

.plus-menu {position:fixed;top:76px;z-index:400;min-width:300px;max-width:340px;max-height:70vh;overflow-y:auto;background:rgba(13,11,20,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(160,107,255,.35);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 36px rgba(160,107,255,.22);padding:8px;display:none}

.plus-menu.open {display:block}

.plus-menu .pm-head {padding:10px 14px 6px;font-size:11px;font-weight:800;letter-spacing:.18em;color:#F8F7FB;opacity:.85}

.plus-menu .pm-sec {padding:8px 14px 2px;font-size:10px;font-weight:800;letter-spacing:.16em;color:#a06bff}

.plus-menu a {display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;color:#F8F7FB;text-decoration:none;font-weight:700;font-size:14px;cursor:pointer}

.plus-menu a:hover {background:rgba(160,107,255,.14)}

.plus-menu a .jewel {width:14px;height:14px;flex:0 0 14px;transform:rotate(45deg);background:var(--eco,#a06bff);box-shadow:0 0 10px var(--eco,#a06bff);border:1px solid rgba(255,255,255,.7)}

.steppill .sdot {width:8px;height:8px;border-radius:50%;background:#fff;flex:0 0 auto;transition:background .25s,box-shadow .25s}

.steppill:hover {border-color:var(--sc);box-shadow:inset 0 1px rgba(255,255,255,.4),inset 0 -2px 6px rgba(0,0,0,.4),0 0 26px -2px var(--sc),0 10px 24px rgba(0,0,0,.6);transform:translateY(-2px)}

.steppill:hover .sdot {background:var(--sc);box-shadow:0 0 10px var(--sc)}

.steppill.on {border-color:var(--sc);box-shadow:0 0 0 1px var(--sc),0 0 22px -4px var(--sc)}

.steppill.on .sdot {background:var(--sc);box-shadow:0 0 10px var(--sc)}

#nayanet-nav {position:fixed;left:0;right:0;bottom:0;z-index:300;width:100%;max-width:none;padding:0}

#nayanet-nav .naya-tabs {position:static;margin:0;max-width:none;width:100%;border-radius:0;border:0;border-top:2px solid #F8F7FB;background:linear-gradient(180deg,#14141b,#050507);box-shadow:0 -14px 34px rgba(0,0,0,.65),inset 0 1px rgba(255,255,255,.28);padding:12px 16px}

#cartCount {position:absolute;top:-4px;right:-4px;min-width:26px;height:26px;border-radius:14px;background:#e84fff;color:#000;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 7px}

.primo {display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 800; font-size: 15px; letter-spacing: .08em; color: #F8F7FB; padding: 16px 32px; border-radius: 999px; border: 1.5px solid rgba(248,247,251,.9);
  background: linear-gradient(180deg, #1a1a22 0%, #0a0a0f 45%, #050507 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 2px 6px rgba(255,255,255,.15), inset 0 -8px 16px rgba(0,0,0,.8), 0 0 24px rgba(248,247,251,.45), 0 0 48px rgba(248,247,251,.15), 0 12px 32px rgba(0,0,0,.65);
  transition: transform .22s var(--ease), box-shadow .22s var(--ease); --glow: var(--soul); position: relative; overflow: hidden;}

.primo::before {content:''; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%); transform:translateX(-100%); animation:primo-sheen 3.5s ease-in-out infinite; pointer-events:none;}

.primo:hover {transform: translateY(-2px); border-color: var(--glow); box-shadow: inset 0 0 0 1.5px var(--glow), inset 0 2px 5px rgba(255,255,255,.28), inset 0 -6px 14px rgba(0,0,0,.65), 0 0 36px var(--glow), 0 14px 36px rgba(0,0,0,.65);}

.primo:active {transform: translateY(1px) scale(.985);}

.primo.theme-magenta {--glow: var(--magenta);}

.primo.theme-purple {--glow: var(--purple);}

.primo.theme-blue {--glow: var(--blue);}

.primo.theme-green {--glow: var(--green);}

.primo.theme-gold {--glow: var(--gold);}

.primo:disabled {opacity: .6; cursor: default; transform: none;}

.hero-buttons {display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; margin-top: 12px;}

.living-btn {min-width: 100%;}

.living-btn .btn-glow {position: absolute; inset: -2px; border-radius: 999px; opacity: .55; pointer-events: none; transition: opacity .3s;}

.living-btn[data-spectrum="magenta"] .btn-glow {box-shadow: 0 0 34px 4px rgba(232,79,255,.5), inset 0 0 22px rgba(232,79,255,.28);}

.living-btn[data-spectrum="purple"] .btn-glow {box-shadow: 0 0 34px 4px rgba(160,107,255,.5), inset 0 0 22px rgba(160,107,255,.28); animation-delay: 1.4s;}

.living-btn[data-spectrum="blue"] .btn-glow {box-shadow: 0 0 34px 4px rgba(63,184,255,.5), inset 0 0 22px rgba(63,184,255,.28); animation-delay: 2.8s;}

.living-btn::after {content: ""; position: absolute; top: -20%; bottom: -20%; width: 46%; left: -70%;
  background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.34) 50%, transparent 80%);
  transform: skewX(-18deg); pointer-events: none;
  animation: sweep 5.5s var(--ease) infinite;}

.living-btn[data-spectrum="purple"]::after {animation-delay: 1.8s;}

.living-btn[data-spectrum="blue"]::after {animation-delay: 3.6s;}

.living-btn:hover {transform: translateY(-4px) scale(1.025); animation: none;}

.living-btn[data-spectrum="magenta"]:hover {box-shadow: inset 0 0 0 2px var(--magenta), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(232,79,255,.4), 0 6px 18px rgba(0,0,0,.5);}

.living-btn[data-spectrum="purple"]:hover {box-shadow: inset 0 0 0 2px var(--purple), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(160,107,255,.4), 0 6px 18px rgba(0,0,0,.5);}

.living-btn[data-spectrum="blue"]:hover {box-shadow: inset 0 0 0 2px var(--blue), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(63,184,255,.4), 0 6px 18px rgba(0,0,0,.5);}

.living-btn:hover .btn-glow {opacity: 1;}

.living-btn:active {transform: translateY(1px) scale(.975); transition-duration: .08s;}

.living-btn .btn-label {position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 12px;}

.living-btn .btn-label svg {width: 20px; height: 20px;}

.living-btn, .living-btn::after {animation: none;}

.cx-btn {padding: 15px 32px; border-radius: 999px; font-size: 14px; font-weight: 800; letter-spacing: .1em; cursor: pointer; font-family: inherit; color: #fff; background: linear-gradient(180deg,#15151a,#050506); border: 1.5px solid rgba(255,255,255,.55); display: inline-flex; align-items: center; gap: 10px;
  box-shadow: inset 0 2px 2px rgba(255,255,255,.22), inset 0 -3px 6px rgba(0,0,0,.6), 0 0 22px -2px rgba(255,255,255,.28), 0 12px 28px rgba(0,0,0,.65);
  transition: border-color .22s, box-shadow .25s, transform .15s var(--ease);}

.cx-btn:hover {border-color: var(--soul); transform: translateY(-2px);
  box-shadow: inset 0 2px 2px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.5), 0 0 42px -2px var(--soul), 0 16px 34px rgba(0,0,0,.6);}

.cx-btn:active {transform: translateY(1px) scale(.97); box-shadow: inset 0 3px 8px rgba(0,0,0,.7), 0 0 18px -4px var(--soul);}

.trinity {display:flex; gap:16px; justify-content:center; align-items:stretch; margin:34px auto 0; flex-wrap:wrap; max-width:1020px;}

.naya-btn {animation:none !important;}

.naya-btn::before {content:""; position:absolute; inset:0; border-radius:inherit; z-index:0; pointer-events:none; opacity:0; transition:opacity .4s ease;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),rgba(255,255,255,.03) 42%,transparent 68%);}

.naya-btn::after {content:""; position:absolute; inset:-1px; border-radius:inherit; z-index:2; pointer-events:none; opacity:0; transition:opacity .28s ease;
  box-shadow:inset 0 0 0 1.5px rgba(var(--nb-accent-rgb),.92),0 0 18px -2px rgba(var(--nb-accent-rgb),.55),0 0 42px -8px rgba(var(--nb-accent-rgb),.35);}

.naya-btn > * {position:relative; z-index:3;}

.naya-btn .nb-icon {width:18px;height:18px;flex:none;display:grid;place-items:center;font-size:16px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}

.naya-btn .nb-label {letter-spacing:.11em}

.naya-btn.is-aware {animation:none;
  border-color:rgba(238,236,228,.12);
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.58),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.70),
    inset 0 -14px 26px rgba(0,0,0,.46),
    inset 0 10px 18px rgba(255,255,255,.07),
    0 0 0 1px rgba(var(--nb-accent-rgb),.14),
    0 24px 48px rgba(0,0,0,.86),
    0 8px 18px rgba(0,0,0,.60);
  transform:translateY(-1px);}

.naya-btn.is-aware::before {opacity:.75;}

.naya-btn:hover,.naya-btn:focus-visible {animation:none; transform:translateY(-3px) scale(1.012);
  border-color:rgb(var(--nb-accent-rgb));
  box-shadow:
    inset 0 0 0 1.5px rgb(var(--nb-accent-rgb)),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(0,0,0,.66),
    inset 0 -14px 26px rgba(0,0,0,.42),
    0 0 38px rgba(var(--nb-accent-rgb),.85),
    0 30px 56px rgba(0,0,0,.88),
    0 10px 20px rgba(0,0,0,.62);}

.naya-btn:hover::before,.naya-btn:focus-visible::before {opacity:1;}

.naya-btn:hover::after,.naya-btn:focus-visible::after {opacity:1;}

.naya-btn:focus-visible {outline:2px solid rgba(255,255,255,.92); outline-offset:3px;}

.naya-btn:active {transform:translateY(1px) scale(.975) !important;
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.48),
    inset 0 3px 12px rgba(0,0,0,.82),
    inset 0 -4px 10px rgba(0,0,0,.55),
    0 10px 22px rgba(0,0,0,.78);
  transition-duration:.08s;}

.naya-btn:active::after {opacity:.65;}

.naya-btn:disabled,.naya-btn[aria-disabled="true"] {opacity:.42; cursor:not-allowed; animation:none; transform:none !important;
  box-shadow:inset 0 0 0 1px rgba(238,236,228,.22),inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px rgba(0,0,0,.6);}

.naya-btn:disabled::after,.naya-btn[aria-disabled="true"]::after {opacity:0 !important;}

.naya-btn--primary {--nb-accent:#8a5cff;--nb-accent-rgb:138,92,255}

.ib-feed-root {--bg: #0B0D12;
  --bg-raise: #12151D;
  --emerald: #55e39a;
  --ink: #F5F7FB;
  --muted: #AAB2BF;
  --purple: #a06bff;
  --tone: var(--purple);
  --oc: #a06bff;
  --oc-rgb: 160,107,255;}

.ib-blocktop {display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
  margin-bottom: 6px;}

.ib-card-orb {width: 42px; height: 42px; flex: none; margin: 1px 0 0 18px;
  background:
    radial-gradient(circle at 34% 26%, #ffffff 0%, rgba(255,255,255,.85) 10%, rgba(255,255,255,.28) 22%, transparent 38%),
    radial-gradient(circle at 50% 60%, rgba(255,255,255,.22) 0%, transparent 48%),
    radial-gradient(circle at 50% 50%, var(--oc) 0%, color-mix(in srgb, var(--oc) 88%, #fff) 28%, color-mix(in srgb, var(--oc) 72%, #000) 68%, #050507 100%);
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.55),
    inset 0 8px 16px rgba(255,255,255,.22),
    inset 0 -10px 20px rgba(0,0,0,.55),
    0 0 22px rgba(var(--oc-rgb),.9),
    0 0 55px -8px rgba(var(--oc-rgb),.6),
    0 14px 30px rgba(0,0,0,.6);}

.ib-card {position: relative;
  border-radius: 22px;
  padding: 26px 26px 22px;
  margin: 0 0 22px;
  background: linear-gradient(160deg, var(--bg-raise), var(--bg) 60%);
  border: 2px solid color-mix(in srgb, var(--tone) 30%, transparent);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    inset 0 -12px 28px rgba(0,0,0,.35),
    0 18px 44px rgba(0,0,0,.55),
    0 0 34px color-mix(in srgb, var(--tone) 12%, transparent);}

.ib-dot {width: 12px; height: 12px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff, var(--lc, var(--tone)) 70%);
  box-shadow: 0 0 14px var(--lc, var(--tone));}

.ib-foot {margin-top: 18px; padding-top: 14px; border-top: 2px solid #ffffff16;
  color: #8f8898; font-size: 12.5px; line-height: 1.5; word-break: break-all;}

.ib-head {display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 14px;}

.ib-id {font-size: 13px; color: var(--muted); letter-spacing: .06em;}

.ib-identity {display: flex; gap: 14px; min-width: 0; align-items: flex-start; flex: 1;}

.ib-jewel {width: 64px; height: 64px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  font-size: 26px; font-weight: 800; color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,.6);
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.95), transparent 35%),
    radial-gradient(circle at 70% 75%, rgba(0,0,0,.45), transparent 50%),
    radial-gradient(circle at 50% 50%, var(--tone), color-mix(in srgb, var(--tone) 55%, #000) 85%);
  border: 2px solid rgba(255,255,255,.4);
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.6),
    inset 0 -4px 12px rgba(0,0,0,.5),
    0 0 28px color-mix(in srgb, var(--tone) 65%, transparent),
    0 10px 24px rgba(0,0,0,.6);
  animation: ibJewelBreathe 4s ease-in-out infinite;}

.ib-kind {font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--tone);}

.ib-layer {--lc: var(--ink);

  border-radius: 18px;
  background: linear-gradient(145deg, var(--bg-raise), var(--bg));

    0 0 20px color-mix(in srgb, var(--lc) 10%, transparent);

.ib-layer-body {padding: 8px 24px 24px; overflow-wrap: break-word; font-size: 18px; line-height: 1.6; color: #fff;}

.ib-layer-head {width: 100%; appearance: none; background: none; border: 0; cursor: pointer;
  display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 16px; color: var(--ink); font-size: 15px; font-weight: 700;}

.ib-layer-head .ib-chev {margin-left: auto; color: var(--lc); font-size: 16px; transition: transform .2s;}

.ib-layer.open .ib-chev {transform: rotate(180deg);}

.ib-layer .ib-layer-body {display: none;}

.ib-layer.open .ib-layer-body {display: block;}

.ib-layers {display: flex; flex-direction: column; gap: 12px; margin-top: 14px;}

  color: #817a89; font-size: 11px; font-weight: 800; letter-spacing: .08em;
  margin-top: 12px;}

.ib-microcopy {display: flex; justify-content: space-between; align-items: center;
  margin-top: 16px; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 10px; letter-spacing: .14em; color: var(--muted);
  font-weight: 700;}

.ib-nutshell {margin: 16px 0 6px; padding: 20px 21px;
  border: 2px solid #ffffff16; border-radius: 18px;
  border-left: 3px solid var(--tone, #9d75ff);
  background: linear-gradient(90deg, color-mix(in srgb, var(--tone, #9d75ff) 8%, transparent), #0A0A0E 70%);
  box-shadow: inset 0 1px rgba(255,255,255,.10), 0 16px 35px rgba(0,0,0,.55);
  font-size: 20px; line-height: 1.6; font-weight: 500; color: #fff;}

.ib-nutshell-label {display: block;
  font-size: 11px; letter-spacing: .18em; font-weight: 800;
  color: var(--tone, #9d75ff); margin-bottom: 8px;}

.ib-stamp {display: flex; align-items: center; gap: 8px; flex-wrap: wrap;

  font-variant-numeric: tabular-nums;}

.ib-stamp-date {color: #2fe89e; text-shadow: 0 0 14px rgba(47,232,158,.40);}

.ib-stamp-rel {color: #d9d3e6; text-shadow: 0 0 10px rgba(217,211,230,.28);}

.ib-stamp-time {color: #ffbf3d; text-shadow: 0 0 14px rgba(255,191,61,.45);}

.ib-state {margin-left: auto; color: #706a77; font-size: 11px;
  letter-spacing: .08em; font-weight: 700; white-space: nowrap;}

.ib-subtitle {font-size: 18px; color: #f2f2f6; margin: 6px 0 2px; font-weight: 500; letter-spacing: .02em; line-height: 1.4;}

.ib-title {color: var(--ink); font-size: clamp(24px, 3vw, 34px); line-height: 1.08;

.nsb-topstack {position:fixed;top:0;left:0;right:0;z-index:900;
  padding-top:env(safe-area-inset-top);
  font-family:Inter,system-ui,sans-serif;}

.nsb-top {background:rgba(3,3,5,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);

.nsb-searchlevel {background:rgba(8,8,12,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);

.nsb-searchfield {display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto;

  transition:box-shadow .25s, border-color .25s;}

.nsb-searchfield:focus-within {border-color:#a06bff;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.3), inset 0 -8px 16px rgba(0,0,0,.6), 0 0 34px rgba(160,107,255,.6), 0 0 70px rgba(160,107,255,.2), 0 16px 34px rgba(0,0,0,.65);}

.nsb-searchfield svg {width:16px;height:16px;flex:0 0 auto;color:rgba(255,255,255,.6);}

.nsb-searchfield input {flex:1;background:transparent;border:0;color:#fff;font-family:inherit;
  font-size:14px;font-weight:600;outline:none;min-width:0;}

.nsb-searchfield input::placeholder {color:rgba(255,255,255,.45);}

.nsb-search-go {border:1px solid rgba(255,255,255,.16);border-radius:50%;color:#fff;
  width:44px;height:44px;min-width:44px;padding:0;display:grid;place-items:center;
  font-size:19px;line-height:1;cursor:pointer;font-family:inherit;
  background:
    linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.03) 38%, rgba(0,0,0,.14) 68%, rgba(0,0,0,.44)),
    linear-gradient(180deg, #22222c, #0a0a0f 70%, #060609);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(0,0,0,.55),
    0 2px 5px rgba(0,0,0,.7), 0 12px 28px rgba(0,0,0,.55);
  transition:transform .3s cubic-bezier(.2,1.25,.35,1), box-shadow .25s ease-out, border-color .2s ease-out;}

.nsb-search-go:hover {transform:translateY(-2px);border-color:var(--purple);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(0,0,0,.55),
    0 4px 8px rgba(0,0,0,.6), 0 16px 32px rgba(0,0,0,.55), 0 0 22px -4px var(--purple);}

.nsb-search-go:active {transform:translateY(1px);
  transition:transform .1s cubic-bezier(.3,0,.8,.4), box-shadow .12s ease-out;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.6);}

.nsb-topstack.nsb-compact .nsb-search-go {width:38px;height:38px;min-width:38px;font-size:17px;}

.nsb-search-tag {max-width:640px;margin:6px auto 0;font-size:11.5px;color:#E8E8EC;
  opacity:.65;text-align:center;letter-spacing:.02em;transition:opacity .25s, margin .25s;}

.nsb-topstack.nsb-compact .nsb-searchlevel {padding:5px 12px;}

.nsb-topstack.nsb-compact .nsb-search-tag {display:none;}

.nsb-topstack.nsb-compact .nsb-searchfield {padding:6px 6px 6px 14px;}

.nsb {font-family:Inter,system-ui,sans-serif;}

.nsb-top-inner {display:flex;align-items:center;gap:10px;padding:10px 16px;}

.nsb-app {display:flex;align-items:center;gap:9px;flex:0 0 auto;padding-right:6px;}

.nsb-app-name {font-size:15px;font-weight:800;color:#fff;white-space:nowrap;letter-spacing:.02em;}

.nsb-honesty {width:9px;height:9px;border-radius:50%;flex:0 0 auto;

.nsb-honesty.proven {color:var(--green);}

.nsb-honesty.stated {color:var(--blue);}

.nsb-honesty.unknown {color:rgba(255,255,255,.4);box-shadow:none;}

.nsb-row {flex:1 1 auto;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;

.nsb-row::-webkit-scrollbar {display:none;}

.nsb-topstack.nsb-compact .nsb-app-name {display:none;}

.nsb-topstack.nsb-compact .nsb-top-inner {padding:6px 12px;}

.nsb-topstack.nsb-compact .nsb-top .nsb-row {padding:8px 24px 14px;}

.nsb-tab {flex:0 0 auto;display:inline-flex;align-items:center;gap:10px;
  padding:12px 20px;border-radius:999px;cursor:pointer;user-select:none;-webkit-user-select:none;
  border:1px solid rgba(255,255,255,.16);
  background:
    linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.03) 38%, rgba(0,0,0,.14) 68%, rgba(0,0,0,.44)),
    linear-gradient(180deg, #22222c, #0a0a0f 70%, #060609);

  color:#fff;font-family:inherit;font-weight:900;font-size:13px;letter-spacing:.03em;
  white-space:nowrap;min-height:44px;
  text-shadow:0 2px 6px rgba(0,0,0,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 2px 6px rgba(255,255,255,.09),

    0 2px 5px rgba(0,0,0,.7), 0 12px 28px rgba(0,0,0,.55);
  transition:transform .3s cubic-bezier(.2,1.25,.35,1), box-shadow .25s ease-out, border-color .2s ease-out, text-shadow .2s ease-out;}

.nsb-tab:hover,.nsb-tab:focus-visible {border-color:color-mix(in srgb, var(--tc) 65%, rgba(255,255,255,.2));outline:none;
  transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 2px 6px rgba(255,255,255,.12),
    inset 0 0 0 1px var(--tc), inset 0 -1px 0 rgba(0,0,0,.5), inset 0 -9px 16px rgba(0,0,0,.42),
    0 8px 14px rgba(0,0,0,.6), 0 22px 44px rgba(0,0,0,.5),
    0 12px 30px -8px var(--tc);
  text-shadow:0 2px 6px rgba(0,0,0,.55);}

.nsb-tab:active {transform:translateY(1px);
  transition:transform .12s cubic-bezier(.3,0,.8,.4), box-shadow .15s ease-out;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.62), inset 0 1px 3px rgba(0,0,0,.5),
    inset 0 -1px 0 rgba(255,255,255,.08), inset 0 0 0 1px var(--tc),
    0 1px 3px rgba(0,0,0,.7);}

.nsb-tab.active {animation:nsbBreathe 4s ease-in-out infinite;}

.nsb-tab.loved {border-color:color-mix(in srgb, #a06bff 60%, rgba(255,255,255,.25));

  0 2px 5px rgba(0,0,0,.7), 0 12px 28px rgba(0,0,0,.55),
  0 10px 26px -6px rgba(160,107,255,.55);}

.nsb-tab.starred {border-color:color-mix(in srgb, #ffbf3d 60%, rgba(255,255,255,.25));

  inset 0 0 0 1.5px rgba(255,191,61,.8), inset 0 -1px 0 rgba(0,0,0,.5), inset 0 -9px 16px rgba(0,0,0,.45),
  0 2px 5px rgba(0,0,0,.7), 0 12px 28px rgba(0,0,0,.55),
  0 10px 26px -6px rgba(255,191,61,.55);}

.nsb-tab.is-working {border-style:dashed;}

.nsb-tab.is-locked {opacity:.85;}

.nsb-tab.is-locked .nsb-lock {font-size:11px;opacity:.8;}

.nsb-tab.is-dead {opacity:.55;cursor:not-allowed;}

.os-ld-drawer-body {width:100%; max-width:800px; margin:0 auto;
  padding:80px 24px 120px;
  min-height:100%;
  
  overflow-y:auto; max-height:100vh;
  -webkit-overflow-scrolling:touch;}

.os-detail-graph {padding:24px 32px 8px;}

.os-dg-bars {animation:graphBreathe 4s ease-in-out infinite;}

.os-dg-bar {flex:1; min-width:0; border-radius:4px 4px 2px 2px;
  position:relative;
  background:linear-gradient(180deg,
    rgba(255,255,255,.35) 0%,
    var(--nc) 12%,
    var(--nc) 70%,
    rgba(0,0,0,.4) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.5),
    inset 0 -4px 8px rgba(0,0,0,.4),
    inset 2px 0 4px rgba(255,255,255,.1),
    inset -2px 0 4px rgba(0,0,0,.3),
    0 4px 12px rgba(0,0,0,.5),
    0 0 16px -4px var(--nc);
  transition:all .25s ease;
  cursor:pointer;}

.os-dg-bar::before {content:''; position:absolute; top:0; left:10%; right:10%; height:2px;
  background:rgba(255,255,255,.7); border-radius:2px;
  box-shadow:0 0 6px rgba(255,255,255,.5);}

.os-dg-bar:hover {box-shadow:
    inset 0 2px 0 rgba(255,255,255,.7),
    inset 0 -4px 8px rgba(0,0,0,.3),
    0 6px 16px rgba(0,0,0,.5),
    0 0 32px 2px var(--nc);
  transform:scaleY(1.02);
  filter:brightness(1.2);}

.os-dg-label {font-size:10px; letter-spacing:.25em; text-transform:uppercase;
  color:rgba(255,255,255,.35); text-align:center; margin-top:8px;}

.os-detail-recent {padding:16px 32px 0;}

.os-detail-recent .os-dg-label {text-align:left; margin-bottom:8px;}

.os-dg-bar-v {position:absolute; top:-18px; left:50%; transform:translateX(-50%);
  font-size:10px; font-weight:800; color:#fff; white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.8); opacity:0; transition:opacity .2s;}

.os-dg-bar:hover .os-dg-bar-v {opacity:1;}

.os-dg-headline {font-size:14px; font-weight:700; color:#fff;
  margin:0 0 12px; line-height:1.4;
  text-shadow:0 1px 8px rgba(0,0,0,.6);}

.os-dg-headline span {font-weight:800;}

.os-detail-action {margin:24px 0; text-align:center;}

.os-action-btn {font-size:16px; font-weight:800; color:#fff;
  padding:14px 32px; border-radius:14px; cursor:pointer;
  background:linear-gradient(180deg, var(--nc), transparent 200%);
  border:1.5px solid var(--nc);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 0 24px -6px var(--nc);
  transition:all .25s ease;}

.os-action-btn:hover {transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 0 36px -4px var(--nc);}

.os-action-why {font-size:12px; color:rgba(255,255,255,.6);
  margin-top:8px; letter-spacing:.03em;}

.os-flow-svg {width:100%; height:140px; display:block;}

.os-sl-add-top {background:rgba(160,107,255,.05);
  border:1px solid rgba(160,107,255,.2);
  border-radius:16px; padding:20px; margin-bottom:24px;}

.os-sl-why {display:block; font-size:11px; color:rgba(255,255,255,.45);
  margin-top:4px; letter-spacing:.02em; font-weight:400;}

.os-sl-conv {text-align:center; font-size:15px; font-weight:700; color:#fff;
  margin:16px 0 8px; letter-spacing:.02em;}

.os-sl-conv span {font-weight:800;}

.os-sl-leak {color:#ff5e6c !important; font-size:13px; font-weight:600;
  animation:osLeakPulse 2s ease-in-out infinite;}

.os-sl-graph-wrap {position:relative; margin-bottom:8px;}

.os-sl-graph-x {display:flex; justify-content:space-between;
  font-size:10px; color:rgba(255,255,255,.4);
  padding:4px 0 0; letter-spacing:.05em;}

.os-sl-empty {text-align:center; padding:40px 24px;}

.os-sl-empty-icon {font-size:48px; margin-bottom:16px; opacity:.6;}

.os-sl-empty-t {font-size:20px; font-weight:800; color:#fff; margin-bottom:8px;}

.os-sl-empty-s {font-size:14px; color:rgba(255,255,255,.6); margin-bottom:24px; max-width:320px; margin-left:auto; margin-right:auto;}

.os-skel-line {display:inline-block; height:14px; border-radius:7px;
  background:linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.12), rgba(255,255,255,.06));
  background-size:200% 100%;
  animation:skelPulse 1.5s ease-in-out infinite;}

.os-skel-bars {display:flex; align-items:flex-end; gap:4px; height:80px; padding:12px 0;}

.os-skel-bar {flex:1; border-radius:4px 4px 0 0;
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  animation:skelPulse 1.5s ease-in-out infinite;}

.os-stats-tabs {display:flex; gap:8px; justify-content:center; padding:16px 0 12px;}

.os-stats-tab {padding:9px 18px; border-radius:20px; border:1px solid rgba(255,255,255,.2);
  background:#101016; color:#fff; font-size:13px; font-weight:600; cursor:pointer;
  transition:all .25s ease;}

.os-stats-tab:hover {border-color:rgba(255,255,255,.4);}

.os-stats-tab.active {border-color:var(--tc); box-shadow:0 0 16px -4px var(--tc), inset 0 1px 0 rgba(255,255,255,.2);
  background:linear-gradient(180deg, rgba(255,255,255,.08), transparent);}

.os-stats-tab[data-view="bars"].active {--tc:#a06bff; border-color:#a06bff; box-shadow:0 0 16px -4px #a06bff, inset 0 1px 0 rgba(255,255,255,.2);}

.os-stats-tab[data-view="flow"].active {--tc:#3fb8ff; border-color:#3fb8ff; box-shadow:0 0 16px -4px #3fb8ff, inset 0 1px 0 rgba(255,255,255,.2);}

.os-stats-tab[data-view="trend"].active {--tc:#2fe89e; border-color:#2fe89e; box-shadow:0 0 16px -4px #2fe89e, inset 0 1px 0 rgba(255,255,255,.2);}

.os-stats-tab[data-view="breakdown"].active {--tc:#ffbf3d; border-color:#ffbf3d; box-shadow:0 0 16px -4px #ffbf3d, inset 0 1px 0 rgba(255,255,255,.2);}

.os-stats-view {display:none; padding:0 32px;}

.os-stats-view.active {display:block; animation:statsFadeIn .3s ease;}

.os-flow-track {position:relative; height:80px; margin:20px 0;
  border-bottom:2px solid rgba(255,255,255,.1);}

.os-flow-dot {position:absolute; bottom:-6px; width:12px; height:12px; border-radius:50%;
  background:var(--nc); box-shadow:0 0 12px var(--nc);
  transform:translateX(-50%);
  animation:flowPulse 2s ease-in-out infinite;}

.os-flow-line {position:absolute; bottom:0; height:2px; background:var(--nc);
  box-shadow:0 0 8px var(--nc); opacity:.6;}

.os-bd-row {display:flex; align-items:center; gap:12px; padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);}

.os-bd-label {font-size:13px; color:rgba(255,255,255,.6); width:80px;}

.os-bd-bar {flex:1; height:24px; border-radius:6px; position:relative; overflow:hidden;
  background:rgba(255,255,255,.05);}

.os-bd-fill {position:absolute; left:0; top:0; bottom:0; border-radius:6px;
  background:linear-gradient(90deg, var(--nc), transparent 150%);
  box-shadow:0 0 12px -2px var(--nc);}

.os-bd-n {font-size:14px; font-weight:800; color:#fff; width:50px; text-align:right; flex-shrink:0;}

.os-bd-pct {font-size:12px; color:var(--nc); width:50px; text-align:right; flex-shrink:0; opacity:.8;}

.os-dg-intel {display:flex; align-items:center; justify-content:center; gap:24px; padding:12px 0 4px;}

.os-dg-wk {display:flex; align-items:baseline; gap:8px;}

.os-dg-wk-n {font-size:24px; font-weight:900; color:#fff;}

.os-dg-wk-l {font-size:11px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.15em;}

.os-dg-wk-d {font-size:13px; font-weight:700;}

.os-dg-streak {font-size:14px; font-weight:700; color:#ff9a5a; text-shadow:0 0 12px rgba(255,154,90,.4);}

.os-ld-node.os-ld-active {box-shadow:0 0 0 2px var(--nc), 0 0 32px 4px var(--nc), inset 0 2px 0 rgba(255,255,255,.25) !important;}

.os-detail-hero {text-align:center;
  padding:60px 20px 40px;
  margin-bottom:24px;
  position:relative;
  overflow:hidden;}

.os-mini-vortex {width:120px; height:120px; margin:0 auto 16px; display:block;
  filter:drop-shadow(0 0 20px var(--nc));}

.os-multiform {display:flex;gap:26px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:4px 0 8px;}

.os-mg-wrap {text-align:center;}

.os-mini-gauge {width:150px;height:92px;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6));}

.os-mg-cap {font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.65);font-weight:800;margin-top:6px;text-transform:uppercase;}

.os-mg-num {font-size:13px;font-weight:900;color:#fff;margin-top:2px;}

.os-detail-hero::before {content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 40%, var(--nc) 0%, transparent 70%);
  opacity:.12; pointer-events:none;
  animation:heroBreathe 4s ease-in-out infinite;}

.os-detail-rows .os-ld-drow {animation:rowSlideIn .5s cubic-bezier(.2,1,.3,1) backwards;}

.os-detail-rows .os-ld-drow:nth-child(1) {animation-delay:.05s;}

.os-detail-rows .os-ld-drow:nth-child(2) {animation-delay:.1s;}

.os-detail-rows .os-ld-drow:nth-child(3) {animation-delay:.15s;}

.os-detail-rows .os-ld-drow:nth-child(4) {animation-delay:.2s;}

.os-detail-rows .os-ld-drow:nth-child(5) {animation-delay:.25s;}

.os-detail-rows .os-ld-drow:nth-child(n+6) {animation-delay:.3s;}

.os-detail-icon {font-size:64px; line-height:1; margin-bottom:16px;
  color:#fff;
  
  text-shadow:
    0 0 4px #fff,
    0 0 12px var(--nc),
    0 0 30px var(--nc),
    0 0 60px var(--nc),
    0 2px 0 rgba(255,255,255,.3);
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
  animation:osDetailPulse 3s ease-in-out infinite;
  position:relative;}

.os-detail-label {font-size:14px; font-weight:800; letter-spacing:.3em;
  color:var(--nc); margin-top:8px;
  text-shadow:0 0 12px var(--nc);}

.os-detail-sub {font-size:15px; color:rgba(255,255,255,.6); margin-top:12px;}

.os-detail-rows {max-width:600px; margin:0 auto;
  padding:0 20px;}

.os-detail-window {text-align:center; margin-top:30px;
  font-size:13px; color:rgba(255,255,255,.4);}

.os-detail-funnel {margin:24px 0; padding:20px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;}

.os-df-label {font-size:11px; letter-spacing:.15em; text-transform:uppercase;
  color:rgba(255,255,255,.5); margin-bottom:16px; text-align:center;}

.os-df-bars {display:flex; align-items:center; justify-content:center; gap:8px;}

.os-df-stage {flex:1; text-align:center;}

.os-df-bar {height:64px; border-radius:12px;
  background:linear-gradient(180deg, var(--fc), transparent);
  border:1px solid var(--fc);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 20px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.2);
  
  animation:osDfGrow .6s cubic-bezier(.2,1.2,.4,1) both;}

.os-df-stage:nth-child(1) .os-df-bar {animation-delay:.1s;}

.os-df-stage:nth-child(3) .os-df-bar {animation-delay:.25s;}

.os-df-stage:nth-child(5) .os-df-bar {animation-delay:.4s;}

.os-df-bar span {font-size:28px; font-weight:800; color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.5);}

.os-df-meta {font-size:11px; color:rgba(255,255,255,.6); margin-top:8px; line-height:1.4;}

.os-df-conv {font-size:14px; font-weight:800; color:#fff;
  padding:4px 8px; border-radius:8px;
  background:rgba(255,255,255,.08);}

.os-df-leak {text-align:center; font-size:13px; color:#ff5e6c; font-weight:600;
  margin-top:12px;}

.os-ld-drawer-x {position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
  top:auto; right:auto; z-index:201;
  width:64px; height:64px; border-radius:50%;
  background:rgba(20,20,25,.95);
  border:2px solid rgba(255,255,255,.35);
  color:#fff; font-size:28px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(10px);
  box-shadow:0 4px 24px rgba(0,0,0,.5), 0 0 20px rgba(160,107,255,.2);}

.os-ld-drawer-x:hover {background:rgba(255,255,255,.2);
  border-color:#a06bff;
  box-shadow:0 4px 24px rgba(0,0,0,.5), 0 0 32px rgba(160,107,255,.4);}

.os-sales-view {position:fixed !important;inset:0 !important;z-index:10001 !important;
  background:#050508 !important;display:flex !important;flex-direction:column !important;
  align-items:center !important;justify-content:center !important;
  opacity:0;pointer-events:none;transition:opacity .35s ease;overflow:hidden;}

.os-sales-view.open {opacity:1 !important;pointer-events:auto !important;}

.os-sales-x {position:absolute;top:24px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
  background:rgba(20,20,28,.9);border:2px solid rgba(255,255,255,.25);color:#fff;
  font-size:32px;line-height:1;cursor:pointer;z-index:100;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.2), inset 0 -3px 6px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.6);
  transition:all .2s;}

background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff; font-size:26px;line-height:1;cursor:pointer;z-index:6;} .os-sales-x:hover {border-color:#e84fff;box-shadow:0 0 24px rgba(232,79,255,.45);}

.os-sales-pills {position:absolute;right:22px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;z-index:6;}

.os-sales-pills button {background:linear-gradient(180deg, rgba(40,40,55,.9) 0%, rgba(15,15,22,.9) 100%);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:10px 14px;border-radius:999px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 -2px 4px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.4);
  transition:all .18s ease;}

.os-sales-pills button:hover {transform:translateY(-1px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 4px rgba(0,0,0,.5), 0 5px 12px rgba(0,0,0,.5);}

.os-sales-pills button.on {background:linear-gradient(180deg, rgba(40,40,55,.95) 0%, rgba(15,15,22,.95) 100%);
  border:1.5px solid #e84fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 4px rgba(0,0,0,.5), 0 0 16px rgba(232,79,255,.55), 0 3px 8px rgba(0,0,0,.4);}

.os-sales-stage {position:relative;width:min(88vmin,600px);height:min(88vmin,600px);flex:none;}

.os-sales-gauge {position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:54%;aspect-ratio:200/208;}

.os-sales-teeth {position:absolute;inset:-9%;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from -90deg,#d0d4de 0deg 1deg,#7a7e88 1deg 1.8deg,transparent 1.8deg 15deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  opacity:.9;}

.os-sales-readout {position:absolute;left:50%;top:67%;transform:translateX(-50%);
  font-size:15px;font-weight:900;color:#fff;background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 10px;white-space:nowrap;}

.os-sales-readout span {font-size:10px;opacity:.6;margin-left:2px;}

.os-sales-orbs {position:absolute;inset:0;pointer-events:none;z-index:3;}

.os-sales-view .os-ld-node {width:112px;height:112px;animation:none !important;pointer-events:auto;}

.os-chart-switch {position:absolute; left:50%; transform:translateX(-50%);
  bottom:-8px; display:flex; gap:8px; z-index:60;
  background:rgba(10,10,16,.85); border:1px solid rgba(255,255,255,.12);
  border-radius:20px; padding:6px 10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 -2px 4px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.5);
  backdrop-filter:blur(8px);}

.os-chart-switch button {width:44px; height:44px; border-radius:50%; border:1.5px solid rgba(255,255,255,.18);
  background:radial-gradient(circle at 35% 30%, #3a3a4a, #0a0a10 70%);
  color:#fff; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.3);
  transition:all .2s;}

.os-chart-switch button:hover {transform:translateY(-2px) scale(1.05);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3), inset 0 -3px 6px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.6), 0 0 16px var(--sc, #a06bff);
  border-color:var(--sc, #a06bff);}

.os-chart-switch button.on {background:radial-gradient(circle at 35% 30%, #2a2a3a, #0a0a10 70%);
  border:2px solid var(--sc, #a06bff);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.6), 0 0 20px var(--sc, #a06bff), 0 4px 12px rgba(0,0,0,.5);}

.os-chart-switch button[data-chart="bars"].on {border-color:#ffbf3d;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.6), 0 0 20px #ffbf3d, 0 4px 12px rgba(0,0,0,.5);}

.os-chart-switch button[data-chart="bars"]:hover {border-color:#ffbf3d;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3), inset 0 -3px 6px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.6), 0 0 16px #ffbf3d;}

.os-chart-switch button[data-chart="donut"].on {border-color:#7fd4ff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.6), 0 0 20px #7fd4ff, 0 4px 12px rgba(0,0,0,.5);}

.os-chart-switch button[data-chart="donut"]:hover {border-color:#7fd4ff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3), inset 0 -3px 6px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.6), 0 0 16px #7fd4ff;}

.os-chart-switch button[data-chart="bignum"].on {border-color:#2fe89e;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.6), 0 0 20px #2fe89e, 0 4px 12px rgba(0,0,0,.5);}

.os-chart-switch button[data-chart="bignum"]:hover {border-color:#2fe89e;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3), inset 0 -3px 6px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.6), 0 0 16px #2fe89e;}

.ci {width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none;}

.ci-gauge {width:20px;height:20px;border:2px solid rgba(255,255,255,.85);border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #2a2a3a, #050508 70%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.2), inset 0 -2px 3px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.5);}

.ci-gauge i {position:absolute;left:50%;top:50%;width:2px;height:8px;background:#fff;border-radius:1px;
  transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(45deg);
  box-shadow:0 0 3px rgba(255,255,255,.8);}

.ci-bars {align-items:flex-end;gap:3px;}

.ci-bars i {width:5px;border-radius:2px 2px 1px 1px;
  background:linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.4) 40%, rgba(255,255,255,.15) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 2px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.4);}

.ci-bars i:nth-child(1) {height:10px;}

.ci-bars i:nth-child(2) {height:16px;}

.ci-bars i:nth-child(3) {height:13px;}

.ci-donut {width:18px;height:18px;border:4px solid rgba(255,255,255,.85);border-radius:50%;
  background:transparent;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5), inset 0 -1px 2px rgba(255,255,255,.15);}

.ci-bignum {font-size:11px;font-weight:900;letter-spacing:-.5px;color:#fff;
  text-shadow:0 1px 0 rgba(255,255,255,.3), 0 -1px 0 rgba(0,0,0,.8), 0 2px 3px rgba(0,0,0,.6);}

.os-view-title {position:absolute; top:94px; left:50%; transform:translateX(-50%);
  font-size:18px; font-weight:900; letter-spacing:.35em; text-indent:.35em;
  text-transform:uppercase; color:#fff; z-index:60; pointer-events:none; white-space:nowrap;
