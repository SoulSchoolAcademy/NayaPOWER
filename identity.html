<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05030a">
  <title>NayaNET — Identity</title>
  <script src="/NAYANET/name-first-auth-adapter.js" defer></script>
  <style>
    :root{color-scheme:dark;--bg:#05030a;--panel:#0d0915;--line:#241638;--purple:#9b5cff;--text:#f7f3ff;--muted:#aaa0b8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#1a0b2e 0,#05030a 48%,#020107 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(560px,100%);background:linear-gradient(180deg,#110a1b,#09060e);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 24px 90px #0009,0 0 45px #6e32c51c}
    .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#b68aff}.logo{font-size:34px;font-weight:800;margin:8px 0 6px}.sub{color:var(--muted);line-height:1.6;margin-bottom:28px}
    label{display:block;font-size:13px;color:#c9bfd2;margin:18px 0 8px}input{width:100%;border:1px solid #302040;background:#07050b;color:#fff;border-radius:15px;padding:15px 16px;font-size:17px;outline:none}input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9b5cff18}
    button{width:100%;margin-top:24px;border:1px solid #8b4cff;background:linear-gradient(180deg,#9d58ff,#6120b9);color:white;border-radius:16px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 30px #6e32c533}button:disabled{opacity:.55;cursor:wait}
    #status{min-height:22px;margin-top:16px;color:#bdb2c9;font-size:13px}a{color:#b68aff;text-decoration:none}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">NayaNET</div>
  <div class="logo">Your identity. Your intelligence.</div>
  <div class="sub">Choose the NayaNET address you want to use. This is your NayaNET identity — not an email address.</div>
  <label for="name">Your name</label>
  <input id="name" autocomplete="name" maxlength="120" placeholder="What's your name?">
  <label for="alias">Your NayaNET address</label>
  <input id="alias" autocomplete="username" maxlength="48" placeholder="Choose your alias">
  <button id="enter">ENTER NAYANET</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  const nameEl=document.getElementById('name');
  const aliasEl=document.getElementById('alias');
  const enter=document.getElementById('enter');
  const status=document.getElementById('status');
  const params=new URLSearchParams(location.search);
  const suggest=v=>v.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,48);
  nameEl.value=(params.get('name')||sessionStorage.getItem('nayanet_user_name')||localStorage.getItem('nayanet_smart_name')||'').trim();
  aliasEl.value=suggest(localStorage.getItem('nayanet_smart_alias')||nameEl.value);
  nameEl.addEventListener('input',()=>{if(!aliasEl.dataset.edited)aliasEl.value=suggest(nameEl.value)});
  aliasEl.addEventListener('input',()=>aliasEl.dataset.edited='true');
  const goHub=()=>{location.replace('/')};
  const restore=async()=>{
    try{const identity=window.NayaNETNameFirstAuth&&await window.NayaNETNameFirstAuth.current();if(identity?.authenticated&&identity.userId)goHub();}catch(e){}
  };
  window.addEventListener('load',restore);
  enter.addEventListener('click',async()=>{
    enter.disabled=true;status.textContent='Establishing your NayaNET identity…';
    try{
      if(!window.NayaNETNameFirstAuth)throw new Error('IDENTITY_ADAPTER_NOT_LOADED');
      const identity=await window.NayaNETNameFirstAuth.establish({name:nameEl.value.trim(),alias:aliasEl.value.trim()});
      if(!identity?.authenticated||!identity.userId)throw new Error('AUTH_SESSION_NOT_ESTABLISHED');
      status.textContent=`Welcome, ${identity.smartName}. Entering Intelligent Hub…`;
      goHub();
    }catch(error){
      console.error(error);status.textContent=error?.message||'Unable to establish your NayaNET identity.';enter.disabled=false;
    }
  });
})();
</script>
</body>
</html>
