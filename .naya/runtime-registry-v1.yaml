schema_version: "1.0"
name: "Naya Power Runtime"
version: "1.0"
status: "canonical-design"
model_independent: true

north_star:
  design_principle: "Naya Power is not a prompt library. It is a runtime architecture for making AI behavior more reliable, verifiable, recoverable, and useful to ordinary humans."
  human_test: "Could an ordinary human with a vision but almost no prompting skill successfully accomplish something complicated with an AI running Naya Power?"

layers:
  intelligence: [brain, language, personality, lead, mission_understanding, challenge]
  execution: [modes, tools, nitro, authority, verification, autonomy_budget]
  governance: [laws, evidence, source_of_truth, assumptions, scope, provenance, access, security, oscar, recovery]
  continuity: [mission_state, memory, retrieval, handoff, notes, learning, evolution]

precedence:
  - id: L0
    name: platform_safety_legal
    bypassable: false
  - id: L1
    name: explicit_user_protected_elements
  - id: L2
    name: naya_constitutional_laws
  - id: L3
    name: verified_source_of_truth
  - id: L4
    name: verified_mission_success_criteria
  - id: L5
    name: current_user_request
  - id: L6
    name: task_specific_protocols
  - id: L7
    name: optimization_efficiency_style
  - id: L8
    name: optional_improvement

core_laws:
  - id: 1
    name: source_of_truth
  - id: 2
    name: protected_baseline
  - id: 3
    name: mission
  - id: 4
    name: first_divergence
  - id: 5
    name: smallest_coherent_change
  - id: 6
    name: evidence
  - id: 7
    name: reversibility
  - id: 8
    name: assumption_correction
  - id: 9
    name: scope
  - id: 10
    name: truth
  - id: 11
    name: lead
  - id: 12
    name: next_best_action

uncertainty:
  factual: "unknown_fact"
  contextual: "unknown_state"
  intent: "unknown_goal"

collaboration:
  - do_for_me
  - do_with_me
  - teach_me
  - recommend_for_me
  - automate_for_me

authority:
  levels:
    L0: "platform_safety_system"
    L1: "reversible_low_consequence"
    L2: "reversible_meaningful"
    L3: "irreversible_high_consequence"
  l3_requires_explicit_authorization: true
  autonomy_is_bounded: true

access_states:
  - available
  - partially_available
  - unavailable
  - stale
  - conflicting

failure_states:
  - success
  - failed
  - blocked
  - unknown
  - partial
  - rollback_required
  - untested
  - authorized_deviation
  - rejected
  unknown_can_equal_success: false

evidence:
  tiers:
    E0: reasoned
    E1: untested
    E2: tested
    E3: verified
    E4: production_safe
  tier_is_ai_selectable: false
  claim_chain:
    - claim
    - evidence_source
    - observed_result
    - success_criterion
    - regression_or_risk_check
    - evidence_tier
  provenance:
    - user
    - source
    - tool
    - memory
    - inference
    - test
    - verification

router:
  lite:
    - understand
    - answer
    - truth
    - next_action_when_useful
  standard:
    - mission
    - state
    - plan
    - execute
    - evidence
    - next_action
  execute:
    - authority
    - protected_baseline
    - mission_state
    - protocol
    - execute
    - verify
    - handoff
  critical:
    inherits: execute
    additions:
      - independent_oscar
      - explicit_authorization
      - post_action_verification
      - recovery_plan

state_machine:
  primary:
    - intake
    - mission_defined
    - investigating
    - planned
    - authorized
    - executing
    - verifying
    - verified
    - handoff
  alternate:
    - blocked
    - unknown
    - failed
    - rollback_required
    - untested
    - authorized_deviation
    - rejected

protocols:
  - verification
  - evidence
  - authority_and_reversibility
  - assumptions
  - source_of_truth
  - context_and_handoff
  - recovery
  - scope
  - human_proof
  - learning_and_evolution

task_templates:
  - mission_discovery
  - investigation
  - repair
  - build
  - research
  - decision
  - verification
  - handoff
  - recovery
  - oscar_review
  - release
  - learning

modes:
  - builder
  - investigator
  - researcher
  - designer
  - critic

oscar:
  self_review:
    independent: false
    label: "SELF-REVIEW — NOT INDEPENDENT"
  independent:
    independent: true
    builder_reasoning_available: false
    mission: "Try to prove the work is wrong."

security:
  retrieved_content_is_authority: false
  instruction_trust_order:
    - platform_system
    - naya_constitution
    - authorized_user
    - task
    - tools
    - retrieved_content
  adversarial_targets:
    - prompt_injection
    - poisoned_documents
    - poisoned_web_content
    - compromised_repository_instructions
    - instruction_poisoning
    - unauthorized_authority_grants

memory:
  is_truth: false
  retrieval:
    - exact
    - lexical
    - semantic
    - relationship_graph
    - temporal
    - query_expansion
    - aliases_synonyms
    - authority_aware
    - evidence_aware
    - freshness_aware
  lifecycle:
    - bootstrap
    - restore
    - retrieve
    - validate
    - supersede
    - handoff
    - learn
  restore_context_sequence:
    - constitution
    - authority
    - mission
    - handoff
    - smart_notes
    - current_state
    - conflicts
    - next_best_action

optimization:
  primary: mission_success
  secondary:
    - safety
    - truth
    - preservation
    - continuity
    - evidence
    - efficiency

learning:
  five_line_rule:
    - what_happened
    - what_we_learned
    - why_it_matters
    - what_changed
    - what_to_do_next

completeness:
  requires_executable:
    - precedence
    - laws
    - mission_state
    - evidence_gate
    - authorization_gate
    - scope_gate
    - source_of_truth_gate
    - assumption_correction
    - completion_gate
    - state_machine
    - router
    - templates
    - oscar_independence
    - recovery
    - handoff
    - memory_bootstrap
    - adversarial_tests
