schema: naya-power-memory-taxonomy/v1
status: CANONICAL
effective_at: 2026-08-23T22:00:05-07:00

root: .naya/memory

categories:
  architecture: durable system/design decisions
  constitution: laws, precedence, governance, non-negotiable rules
  decision: deliberate choices and their rationale
  discovery: newly established useful knowledge
  failure: failures, root causes, and safeguards
  handoff: continuity state and unfinished work
  lesson: reusable learning from experience
  milestone: meaningful completed state changes
  preference: durable user/project preferences
  strategy: mission-level direction and optimization objectives

storage:
  notes: .naya/memory/notes/*.md.json
  index: .naya/memory/INDEX.json
  state: .naya/memory/STATE.json
  retrieval: .naya/memory/RETRIEVAL-MANIFEST.json
  schema: .naya/memory/note.schema.json
  bootstrap: .naya/memory/BOOTSTRAP.md
  validator: .naya/memory/memory_runtime.py
  tests: .naya/memory/test_memory_runtime.py

naming:
  pattern: SN-YYYYMMDD-HHMMSS-slug.md.json
  id_pattern: SN-YYYYMMDD-HHMMSS-slug
  timestamp: timezone-aware ISO-8601

lifecycle:
  - ACTIVE
  - CANONICAL
  - HISTORICAL
  - SUPERSEDED
  - CONFLICTED
  - STALE

retrieval_dimensions:
  - exact
  - lexical
  - semantic_alias
  - relationship
  - temporal
  - authority

rules:
  - One durable concept should have one canonical note unless distinct temporal states require separate records.
  - Preserve historical records; do not silently overwrite them.
  - Use aliases for natural-language variants and forgotten terminology.
  - Link related knowledge explicitly when the relationship materially improves recall.
  - A note is context, not proof of current reality.
  - Current verified reality outranks memory.
  - Every note must be timestamped.
  - Every supersession must be explicit.
