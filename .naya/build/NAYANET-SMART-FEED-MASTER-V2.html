<style id="NAYANET-SMART-FEED-MASTER-V2">

#page-home .activationRail{display:none!important}

#page-home .master-v2-core{padding:28px 34px 8px}
#page-home .master-v2-nutshell{position:relative;padding:25px 27px 26px;margin:0 0 28px;border:1px solid #ffffff18;border-radius:22px;background:linear-gradient(145deg,#0c0c10,#040406);box-shadow:inset 0 1px #fff4,0 18px 42px #000b}
#page-home .master-v2-nutshell:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;background:#fff;box-shadow:0 0 20px #fff;opacity:.9}
#page-home .master-v2-label{font-size:7px;font-weight:1000;letter-spacing:.19em;color:#fff;margin-bottom:10px}
#page-home .master-v2-nutshell p{margin:0;max-width:1100px;font-size:clamp(18px,1.65vw,24px);line-height:1.58;letter-spacing:-.018em;color:#f7f4f9}
#page-home .master-v2-spine{position:relative;display:grid;gap:10px;padding:2px 0 0}
#page-home .master-v2-spine:before{content:"";position:absolute;left:18px;top:10px;bottom:12px;width:1px;background:linear-gradient(180deg,#ff4fd8,#875cff,#6675ff,#55b9ee,#55e39a,#b7e34b,#f2df58,#e8c766,#ff7043,#ff4fd8);opacity:.7;z-index:0}
#page-home .master-v2-layer{--layer:#9b6cff;position:relative;display:grid;grid-template-columns:38px minmax(0,1fr);gap:17px;padding:20px 21px 21px;border:1px solid color-mix(in srgb,var(--layer) 23%,#fff 4%);border-radius:19px;background:linear-gradient(145deg,#0b0b0f,#040405);box-shadow:inset 0 1px #fff3,0 14px 32px #000a;z-index:1}
#page-home .master-v2-layer:after{content:"";position:absolute;left:0;top:15px;bottom:15px;width:2px;border-radius:2px;background:var(--layer);box-shadow:0 0 18px var(--layer);opacity:.9}
#page-home .master-v2-dot{width:12px;height:12px;margin:9px 0 0 13px;border-radius:50%;background:var(--layer);box-shadow:0 0 18px var(--layer),0 0 34px color-mix(in srgb,var(--layer) 35%,transparent);z-index:2}
#page-home .master-v2-content{padding:0}
#page-home .master-v2-layerhead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:8px}
#page-home .master-v2-layerhead b{font-size:9px;font-weight:1000;letter-spacing:.17em;color:#fff}
#page-home .master-v2-state{font-size:6px;color:#77717e;letter-spacing:.09em}
#page-home .master-v2-content p{margin:0;max-width:1040px;font-size:16px;line-height:1.72;color:#ded9e2}
#page-home .master-v2-layer.human{--layer:#ff4fd8}
#page-home .master-v2-layer.child{--layer:#875cff}
#page-home .master-v2-layer.grandma{--layer:#6675ff}
#page-home .master-v2-layer.naya{--layer:#55b9ee}
#page-home .master-v2-layer.machine{--layer:#55e39a}
#page-home .master-v2-layer.learned{--layer:#f2df58}
#page-home .master-v2-ending{position:relative;margin:0;padding:23px 24px;border:1px solid #e8c76655;border-radius:20px;background:radial-gradient(600px 220px at 85% 0%,#e8c76614,transparent 65%),linear-gradient(145deg,#12100a,#070706);box-shadow:inset 0 1px #fff4,0 18px 42px #000b;z-index:1}
#page-home .master-v2-ending:before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:2px;background:#e8c766;box-shadow:0 0 18px #e8c766}
#page-home .master-v2-ending .master-v2-label{color:#f2dfb1}
#page-home .master-v2-ending p{margin:0;font-size:18px!important;line-height:1.68!important;color:#fff!important}
#page-home .master-v2-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 34px 24px;border-top:1px solid #ffffff12;color:#77717e;font-size:7px;letter-spacing:.09em}
#page-home .master-v2-actions{display:flex;gap:7px;flex-wrap:wrap}
#page-home .master-v2-action{min-height:40px;padding:0 12px;border:1px solid #ffffff20;border-radius:10px;background:#050507;color:#eeeaf2;font-size:7px;font-weight:1000;letter-spacing:.07em;transition:.2s ease}
#page-home .master-v2-action:hover,#page-home .master-v2-action.active{border-color:var(--tone);box-shadow:0 0 22px color-mix(in srgb,var(--tone) 18%,transparent);transform:translateY(-2px)}
#page-home .intelligentFeedHead{padding:4px 2px 18px!important}
#page-home .intelligentFeedHead h2{font-size:clamp(31px,3.2vw,44px)!important;letter-spacing:-.06em!important}
#page-home .intelligentFeedHead p{font-size:11px!important;line-height:1.6!important;max-width:820px!important;color:#aaa4b1!important}
@media(max-width:900px){#page-home .master-v2-top{padding:22px 18px 19px}#page-home .master-v2-core{padding:20px 18px 6px}#page-home .master-v2-footer{padding:15px 18px 20px}#page-home .master-v2-title h3{font-size:30px}#page-home .master-v2-badge{display:none}#page-home .master-v2-nutshell{padding:21px 20px 22px;margin-bottom:21px}#page-home .master-v2-nutshell p{font-size:16px;line-height:1.62}#page-home .master-v2-spine:before{left:13px}#page-home .master-v2-layer{grid-template-columns:28px minmax(0,1fr);gap:12px;padding:17px 16px 18px}#page-home .master-v2-dot{margin-left:8px}#page-home .master-v2-content p{font-size:15px;line-height:1.68}#page-home .master-v2-ending{padding:20px 19px}#page-home .master-v2-ending p{font-size:16px!important}}
</style>
<script id="NAYANET-SMART-FEED-MASTER-V2-RUNTIME">
(()=>{'use strict';
const Q=(s,r=document)=>r.querySelector(s),QA=(s,r=document)=>[...r.querySelectorAll(s)];
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));
const tone=['#9b6cff','#6675ff','#55b9ee','#55e39a','#b7e34b','#f2df58','#e8c766','#ff7043','#ff4fd8','#9b6cff'];
const layerTone={human:'#ff4fd8',child:'#875cff',grandma:'#6675ff',naya:'#55b9ee',machine:'#55e39a',learned:'#f2df58',means:'#e8c766'};
const icon=['◉','◇','◈','✦','⌘','∿','◆','✧'];
function text(el,selectors){for(const s of selectors){const x=Q(s,el);if(x){const t=clean(x.textContent);if(t)return t}}return ''}
function shorten(t,n=460){t=clean(t);if(t.length<=n)return t;const s=t.slice(0,n+40);const c=Math.max(s.lastIndexOf('. '),s.lastIndexOf(' '));return s.slice(0,c>120?c:n).replace(/[.,;:!?-]+$/,'')+'…'}
function layer(k,label,body,state){return `<section class="master-v2-layer ${k}" data-master-layer="${k}"><div class="master-v2-dot" aria-hidden="true"></div><div class="master-v2-content"><div class="master-v2-layerhead"><b>${label}</b><span class="master-v2-state">${state}</span></div><p>${esc(body)}</p></div></section>`}
function transform(block,i){if(block.dataset.masterV2==='1')return;const title=text(block,['.blockTitle h3','.n3-title','.noteBody h3','h3'])||'Intelligent Event';const meta=text(block,['.blockMeta','.n3-eyebrow','.noteTop span'])||'INTELLIGENCE';const body=text(block,['.blockBody p','.n3-nutshell p','.noteBody p','p'])||'Captured intelligence from experience.';const old=QA('.perspective',block);const from=k=>text(old.filter(x=>x.classList.contains(k)),['p']);const human=from('human')||body;const naya=from('naya')||'Naya interpretation is available when the production intelligence service is connected. No AI interpretation is fabricated.';const machine=from('machine')||'Machine perspective is preserved from the source event and its runtime state.';const child='The simplest truthful version: '+shorten(body,270);const grandma='The lasting wisdom: keep the destination clear, learn from the route, and preserve the lesson when the mechanism changes.';const learned='We learned to separate the mission from the mechanism, preserve what matters, and adapt the route without pretending a missing capability exists.';const means='This matters because experience becomes reusable intelligence when it can be remembered, verified, connected, and carried forward.';block.style.setProperty('--tone',tone[i%tone.length]);block.innerHTML=`<div class="master-v2-top"><div class="master-v2-identity"><div class="master-v2-glyph" aria-hidden="true">${icon[i%icon.length]}</div><div class="master-v2-title"><h3>${esc(title)}</h3><div class="master-v2-meta"><span>${esc(meta)}</span><span>ONE INTELLIGENCE EVENT</span><span>PRIVATE BY DEFAULT</span></div></div></div><span class="master-v2-badge">INTELLIGENT BLOCK</span></div><div class="master-v2-core"><section class="master-v2-nutshell"><div class="master-v2-label">IN A NUTSHELL</div><p>${esc(shorten(body,520))}</p></section><div class="master-v2-spine">${layer('human','HUMAN NOTE',human,'EXPERIENCE')}${layer('child','CHILD NOTE',child,'SIMPLIFIED')}${layer('grandma','GRANDMA NOTE',grandma,'WISDOM')}${layer('naya','NAYA NOTE',naya,'INTERPRETATION')}${layer('machine','MACHINE NOTE',machine,'SYSTEM REALITY')}${layer('learned','WHAT WE LEARNED',learned,'DISTILLED LESSON')}<section class="master-v2-ending" data-master-layer="means"><div class="master-v2-label">WHAT IT MEANS</div><p>${esc(means)}</p></section></div></div><div class="master-v2-footer"><span>${esc(meta)} · ${String(i+1).padStart(2,'0')}</span><div class="master-v2-actions"><button class="master-v2-action" type="button" data-master-action="favorite" aria-label="Favorite this intelligence">♡ FAVORITE</button><button class="master-v2-action" type="button" data-master-action="like" aria-label="Like this intelligence">👍 LIKE</button><button class="master-v2-action" type="button" data-master-action="rate" aria-label="Rate this intelligence">★★★★★ RATE</button><button class="master-v2-action" type="button" data-master-action="share" aria-label="Share this intelligence">＋ SHARE</button><button class="master-v2-action" type="button" data-master-action="copy" aria-label="Copy this intelligence">⧉ COPY</button></div></div>`;block.dataset.masterV2='1';QA('[data-master-action]',block).forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.masterAction==='copy'){navigator.clipboard?.writeText(clean(block.innerText));btn.textContent='✓ COPIED';setTimeout(()=>btn.textContent='⧉ COPY',1000)}else if(btn.dataset.masterAction==='share'){const shareText=clean(block.innerText);if(navigator.share)navigator.share({title,url:location.href,text:shareText}).catch(()=>{});else if(navigator.clipboard){navigator.clipboard.writeText(shareText);btn.textContent='✓ COPIED';setTimeout(()=>btn.textContent='＋ SHARE',1000)}}else{btn.classList.toggle('active');btn.setAttribute('aria-pressed',String(btn.classList.contains('active')))}}))}
function run(){const home=Q('#page-home');if(!home)return;QA('.activationRail',home).forEach(x=>x.remove());QA('.homeFeed .intelligentBlock',home).forEach((b,i)=>transform(b,i));}
let tries=0;const tick=setInterval(()=>{run();if(++tries>36)clearInterval(tick)},250);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>
<!-- NAYANET SMART FEED MASTER V2 END -->
