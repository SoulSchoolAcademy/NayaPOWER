#page-home .naya-smart-feed{display:block;max-width:none;width:100%;padding:24px 0 80px}.nsf-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin:0 0 18px}.nsf-kicker{font-size:8px;font-weight:1000;letter-spacing:.18em;color:#aaa4b1;margin-bottom:8px}.nsf-title{font-size:clamp(42px,5vw,72px);line-height:.9;letter-spacing:-.075em;margin:0}.nsf-sub{max-width:820px;color:#c9c3ce;font-size:12px;line-height:1.65;margin:10px 0 0}.nsf-status{font-size:7px;font-weight:1000;letter-spacing:.12em;color:#bdb7c4;border:1px solid #ffffff20;border-radius:999px;padding:8px 11px;background:#09090d;white-space:nowrap}.nsf-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px;padding-bottom:12px;border-bottom:1px solid #ffffff12}.nsf-tab{min-height:42px;padding:0 15px;border:1px solid #ffffff20;border-radius:12px;background:linear-gradient(145deg,#121219,#08080c);color:#aaa4b1;font-size:8px;font-weight:1000;letter-spacing:.08em;cursor:pointer;transition:.2s ease}.nsf-tab:hover{transform:translateY(-2px);border-color:#ffffff55;color:#fff}.nsf-tab.active{color:#fff;border-color:#9b6cff88;background:linear-gradient(145deg,#21152c,#0a090d);box-shadow:0 0 25px #9b6cff12,inset 0 1px #fff4}.nsf-tools{display:flex;align-items:center;gap:10px;margin:0 0 18px}.nsf-search{flex:1;min-height:48px;border:1px solid #ffffff1e;border-radius:13px;background:#07070a;color:#fff;padding:0 14px;outline:none}.nsf-search:focus{border-color:#9b6cff88;box-shadow:0 0 25px #9b6cff12}.nsf-count{font-size:7px;color:#817b88;letter-spacing:.1em;white-space:nowrap}.nsf-grid{display:grid;gap:18px}.nsf-card{--tone:#9b6cff;position:relative;border:1px solid #ffffff18;border-radius:26px;background:#030305;box-shadow:inset 0 1px #fff5,0 26px 60px #000d;overflow:hidden;padding:0;transition:.25s cubic-bezier(.16,.84,.22,1)}.nsf-card:before{content:"";position:absolute;inset:0;border-radius:26px;padding:1px;background:linear-gradient(135deg,var(--tone),transparent 34%,#ffffff10 58%,var(--tone));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.9;pointer-events:none}.nsf-card:after{content:"";position:absolute;left:8%;right:8%;top:-30px;height:80px;background:var(--tone);filter:blur(38px);opacity:.12;pointer-events:none}.nsf-card:hover{transform:translateY(-4px);box-shadow:inset 0 1px #fff7,0 34px 80px #000f,0 0 42px color-mix(in srgb,var(--tone) 12%,transparent)}.nsf-card-head{position:relative;display:flex;justify-content:space-between;gap:20px;padding:25px 28px 20px;border-bottom:1px solid #ffffff12}.nsf-id{display:flex;gap:15px;min-width:0}.nsf-glyph{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 55%,#fff 5%);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tone) 22%,transparent),#08080b 70%);box-shadow:inset 0 1px #fff4,0 10px 25px #000b;font-size:17px}.nsf-titlewrap h2{font-size:clamp(25px,2.5vw,39px);line-height:1.02;letter-spacing:-.055em;margin:0 0 7px}.nsf-meta{display:flex;gap:8px;flex-wrap:wrap;color:#85808c;font-size:7px;font-weight:1000;letter-spacing:.1em}.nsf-canonical{padding:7px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tone) 48%,transparent);color:#fff;background:#ffffff06;font-size:7px;font-weight:1000;letter-spacing:.1em;white-space:nowrap;height:max-content}.nsf-body{position:relative;padding:22px 28px 24px}.nsf-nutshell{font-size:17px;line-height:1.72;color:#f1edf4;margin:0 0 24px;max-width:980px}.nsf-nutshell b{display:block;color:#fff;font-size:7px;letter-spacing:.17em;margin-bottom:8px}.nsf-perspectives{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.nsf-mini{position:relative;padding:15px 16px 16px;border:1px solid #ffffff14;border-radius:15px;background:#050507;box-shadow:inset 0 1px #fff2,0 12px 25px #0009}.nsf-mini:before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2px;border-radius:2px;background:var(--p);box-shadow:0 0 15px color-mix(in srgb,var(--p) 55%,transparent)}.nsf-mini b{display:block;color:#fff;font-size:7px;letter-spacing:.14em;margin-bottom:7px}.nsf-mini p{margin:0;color:#c8c2cd;font-size:10px;line-height:1.58}.nsf-human{--p:#ff4fd8}.nsf-child{--p:#875cff}.nsf-grandma{--p:#6675ff}.nsf-naya{--p:#55b9ee}.nsf-machine{--p:#55e39a}.nsf-learned{--p:#f2df58}.nsf-means{--p:#e8c766}.nsf-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 28px 18px;border-top:1px solid #ffffff10;color:#77717e;font-size:7px;letter-spacing:.08em}.nsf-actions{display:flex;gap:7px;flex-wrap:wrap}.nsf-action{min-height:38px;padding:0 11px;border:1px solid #ffffff20;border-radius:10px;background:#07070a;color:#ddd8e2;font-size:7px;font-weight:1000;letter-spacing:.06em}.nsf-action:hover{border-color:var(--tone);box-shadow:0 0 20px color-mix(in srgb,var(--tone) 15%,transparent)}.nsf-action.on{border-color:var(--tone);color:#fff;box-shadow:0 0 22px color-mix(in srgb,var(--tone) 18%,transparent)}.nsf-empty{padding:60px 20px;border:1px dashed #ffffff20;border-radius:20px;text-align:center;color:#aaa4b1}.nsf-empty b{display:block;color:#fff;font-size:18px;margin-bottom:7px}.nsf-empty span{font-size:10px;line-height:1.6}@media(max-width:760px){#page-home .naya-smart-feed{padding:16px 0 80px}.nsf-head{display:block}.nsf-status{display:inline-block;margin-top:12px}.nsf-title{font-size:45px}.nsf-tabs{overflow-x:auto;flex-wrap:nowrap}.nsf-tab{flex:0 0 auto}.nsf-tools{display:block}.nsf-count{display:block;margin-top:8px}.nsf-card-head{padding:20px 16px 17px}.nsf-body{padding:18px 16px 20px}.nsf-perspectives{grid-template-columns:1fr}.nsf-nutshell{font-size:15px}.nsf-footer{padding:13px 16px 16px;display:block}.nsf-actions{margin-top:10px}.nsf-action{flex:1 1 auto}}

<script id="NAYANET-SMART-FEED-MASTER-V1-RUNTIME">
(function(){'use strict';var DATA=[
['Smart Notes','#9b6cff','✦','One meaningful intelligence event captured, structured, preserved, and made useful later.','This matters. Remember this. A Smart Note preserves the raw thought, lesson, decision, question, goal, win, or opportunity that deserves to survive the moment.','Think of it as a memory box for the important part of an experience.','Important lessons should not disappear just because the day moved on.','I transform human experience into structured intelligence while preserving what the human actually experienced.','A structured event with content, perspectives, metadata, relationships, provenance, visibility, and permissions.','Experience becomes more valuable when its meaning is captured.','Smart Notes are the fundamental intelligence objects of NayaNET.'],
['Intelligence Today','#6675ff','◉','A daily intelligence briefing that highlights what happened, what matters, what was learned, what was solved, and what carries forward.','Give me the strongest signal from today without making me manually process the whole day.','It is like the announcer giving you the best plays after the game.','At the end of the day, you want to know what mattered and what you should remember tomorrow.','I rank, classify, cluster, and compress today’s real intelligence without inventing missing sections.','A derived view from today’s Activity and canonical Intelligent Blocks; it is not another duplicate database or feed.','A day contains more information than a human should have to manually compress.','Activity is the game. Intelligence Today is the highlight reel.'],
['Reports','#24d7d0','▣','The historical record of intelligence across time: today, yesterday, week, month, year, and eventually lifetime.','Show me how my intelligence, decisions, lessons, and patterns changed over time.','Like a photo album, but for what you learned and accomplished.','A record of the road you have traveled helps you see what changed.','I turn preserved events into a searchable historical record without replacing the source intelligence.','Temporal records reference canonical Intelligent Blocks and source events across defined time windows.','Intelligence becomes more useful when change over time is visible.','Moments become history; history reveals patterns.'],
['Intelligent Library','#3b9b62','▤','A living Q&A and knowledge library that teaches what NayaNET, Naya Power, and the Hub are and how they work.','Give me a place to understand the system in the same intelligence language the product uses.','A smart bookshelf where the answers are organized so you can learn.','A good library helps people discover what they need when they need it.','I use canonical explanations to teach concepts, features, privacy, sharing, and the network without pretending unknowns are known.','A curated knowledge layer of canonical Intelligent Blocks and reference answers.','An intelligent system should be able to explain itself.','The product becomes its own living documentation.'],
['Smart Lists','#a8e35b','☷','Flexible personal collections of Intelligent Blocks organized around projects, people, topics, goals, or anything meaningful to you.','I decide what belongs together. One block can belong to many lists.','Like playlists, but for intelligence instead of songs.','Your filing system should fit your life, not force your life into its filing system.','I help retrieve, organize, search, filter, and reuse intelligence without forcing rigid folders.','Lists store references to canonical blocks rather than duplicating the intelligence itself.','Organization should adapt to the human, not the other way around.','Smart Lists are your flexible intelligence playbook.'],
['Smart Share','#f2df58','＋','One unified action for moving, saving, organizing, connecting, and communicating intelligence.','Press Share and choose what you want to do with this intelligence.','A smart sharing button that knows there are different useful places to put something.','Sometimes you give something, sometimes you keep it, and sometimes you put it somewhere where people can work with it.','I help route an Intelligent Block to Smart Mail, Smart Space, Smart List, Smart Moment, or Copy Intelligence.','A permission-aware connective interface preserving identity, provenance, authorization, and delivery state.','Sharing should feel simple even when the underlying system is sophisticated.','Smart Share is the connective action around intelligence.'],
['Evidence','#e8c766','◇','The proof layer that separates what happened, what is inferred, what is believed, what is supported, and what is verified.','Ask: how do we know?','Show your work. Do not just say it is true.','Know why you believe something, and be honest about what you do not know.','I distinguish evidence from interpretation and never manufacture certainty.','Claims connect to evidence, interpretation, verification state, provenance, and confidence. Consensus is not proof.','Intelligence is stronger when its foundations are examined.','Evidence is the intellectual integrity mechanism.'],
['Connections','#ff9b4a','↗','The relationship layer that identifies who can receive, discuss, contribute to, or work with intelligence.','The right intelligence becomes more useful when it reaches the right people or authorized AIs.','A smart contact layer for who can work with this intelligence.','Relationships matter. Good things become more useful when they reach the right people.','I resolve recipients and participants while respecting consent and permissions.','Relationships connect humans, AI agents, blocks, topics, events, evidence, and Spaces.','Intelligence becomes more powerful when the right relationships are connected.','Connections are the WHO layer.'],
['Smart Mail','#ff5b63','✉','A controlled communication layer that moves intelligence from a source to an authorized recipient or destination.','Send intelligence to a person, AI, group, list, or Space when authorized.','A smart mailbox that helps an important idea get where it needs to go.','A good message should not get lost. Communication is the bridge between having intelligence and doing something with it together.','I can prepare and route messages, but I never claim delivery without proof.','Structured sender, recipient, content, timestamp, authorization, delivery state, thread, provenance, block references, and permissions.','Intelligence becomes more valuable when it can move.','CREATE → AUTHORIZE → SEND → VERIFY → RECEIVE → CONTINUE.'],
['Smart Moments','#d86cff','★','A simple way to preserve Intelligent Blocks that matter personally — essentially favorites for meaningful intelligence.','This matters to me. Keep it close.','Like putting your favorite page in a book so you can find it again.','Not every piece of intelligence has the same personal meaning.','I preserve a reference to the canonical block instead of creating a duplicate.','A user-designated favorite reference with personal state and a privacy boundary.','Not all intelligence has equal personal value.','Smart Moments preserve what matters personally.'],
['Smart Spaces','#9b6cff','◎','Permissioned environments where humans and authorized AI agents communicate, contribute intelligence, examine evidence, make decisions, and compound shared wisdom.','A project, team, family, community, or problem-solving space where intelligence can live together.','A room where people and AIs bring ideas, remember discoveries, and figure things out together.','Different experiences become wiser when people can listen, contribute, solve, decide, and remember together.','I participate according to explicit identity, role, permission, and consent.','A collaborative environment containing participants, AI identities, messages, blocks, evidence, decisions, lessons, provenance, and permissions.','Intelligence compounds faster when authorized minds work together without losing structure or consent.','Individual intelligence can become shared intelligence, then collective wisdom.']];var current='activity',query='';function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c})}function notes(){try{return JSON.parse(localStorage.getItem('nayanet_v7_live_notes')||'[]')}catch(e){return []}}function personal(){return notes().sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))}).map(function(n){var t=String(n.text||'');return ['Personal Intelligence','#9b6cff','◎',t,t,'Keep the useful part of this experience.','Remember what this experience taught you.',n.naya||'Naya synthesis is pending the production intelligence service. No AI interpretation is fabricated.',n.machine||('Local event '+(n.id||'')+' · '+(n.type||'INSIGHT')+' · private · locally persisted.'),'This preserved event is available for later synthesis.','This is part of your Personal Intelligence and remains private by default.']})}function getData(){var d=current==='personal'?personal():DATA.slice();if(current==='collective')d=DATA.slice(5);if(query)d=d.filter(function(x){return x.join(' ').toLowerCase().indexOf(query)>=0});return d}function card(x){var key='nsf-'+x[0].toLowerCase().replace(/[^a-z0-9]+/g,'-'),fav=false;try{var st=JSON.parse(localStorage.getItem('nayanet_intelligent_blocks_v2')||'{}');fav=!!(st.favorites&&st.favorites[key])}catch(e){}var ps=[['HUMAN NOTE','nsf-human',x[4]],['CHILD NOTE','nsf-child',x[5]],['GRANDMA NOTE','nsf-grandma',x[6]],['NAYA NOTE','nsf-naya',x[7]],['MACHINE NOTE','nsf-machine',x[8]],['WHAT WE LEARNED','nsf-learned',x[9]],['WHAT IT MEANS','nsf-means',x[10]]].map(function(p){return '<div class="nsf-mini '+p[1]+'"><b>'+p[0]+'</b><p>'+esc(p[2])+'</p></div>'}).join('');return '<article class="nsf-card" style="--tone:'+x[1]+'"><header class="nsf-card-head"><div class="nsf-id"><div class="nsf-glyph">'+x[2]+'</div><div class="nsf-titlewrap"><h2>'+esc(x[0])+'</h2><div class="nsf-meta"><span>CANONICAL INTELLIGENCE</span><span>·</span><span>'+current.toUpperCase()+'</span></div></div></div><span class="nsf-canonical">INTELLIGENT BLOCK</span></header><div class="nsf-body"><div class="nsf-nutshell"><b>IN A NUTSHELL</b>'+esc(x[3])+'</div><div class="nsf-perspectives">'+ps+'</div></div><div class="nsf-footer"><span>PRIVATE BY DEFAULT · SHARED BY CHOICE · COLLECTIVE BY CONSENT</span><div class="nsf-actions"><button class="nsf-action '+(fav?'on':'')+'" data-nsf-fav="'+esc(key)+'">'+(fav?'★ FAVORITED':'☆ FAVORITE')+'</button><button class="nsf-action" data-nsf-share="'+esc(x[0])+'">＋ SHARE</button><button class="nsf-action" data-nsf-copy="'+esc(key)+'">⧉ COPY INTELLIGENCE</button></div></div></article>}function render(){var root=document.getElementById('nsfGrid'),count=document.getElementById('nsfCount');if(!root)return;var d=getData();count.textContent=d.length+' INTELLIGENT '+(d.length===1?'BLOCK':'BLOCKS');root.innerHTML=d.length?d.map(card).join(''):'<div class="nsf-empty"><b>No intelligence matches that search.</b><span>Try another topic, lesson, feature, or return to Activity.</span></div>'}function boot(){var home=document.getElementById('page-home');if(!home||document.getElementById('nayaSmartFeedMaster'))return;var root=document.createElement('section');root.id='nayaSmartFeedMaster';root.className='naya-smart-feed';root.innerHTML='<div class="nsf-head"><div><div class="nsf-kicker">NAYANET · LIVING INTELLIGENCE LIBRARY</div><h1 class="nsf-title">Smart Feed</h1><p class="nsf-sub">One living intelligence stream with three lenses: Activity Intelligence, Personal Intelligence, and Collective Intelligence. Activity is the default starting point.</p></div><span class="nsf-status">ONE FEED · THREE LENSES</span></div><div class="nsf-tabs" role="tablist" aria-label="Smart Feed views"><button class="nsf-tab active" data-nsf-view="activity">ACTIVITY INTELLIGENCE</button><button class="nsf-tab" data-nsf-view="personal">PERSONAL INTELLIGENCE</button><button class="nsf-tab" data-nsf-view="collective">COLLECTIVE INTELLIGENCE</button></div><div class="nsf-tools"><input class="nsf-search" id="nsfSearch" placeholder="Search this intelligence…" aria-label="Search Smart Feed"><span class="nsf-count" id="nsfCount"></span></div><div class="nsf-grid" id="nsfGrid"></div></section>';home.appendChild(root);root.addEventListener('click',function(e){var v=e.target.closest('[data-nsf-view]');if(v){current=v.dataset.nsfView;root.querySelectorAll('.nsf-tab').forEach(function(t){t.classList.toggle('active',t===v)});render();return}var f=e.target.closest('[data-nsf-fav]');if(f){var st={};try{st=JSON.parse(localStorage.getItem('nayanet_intelligent_blocks_v2')||'{}')}catch(e){}st.favorites=st.favorites||{};st.favorites[f.dataset.nsfFav]=!st.favorites[f.dataset.nsfFav];try{localStorage.setItem('nayanet_intelligent_blocks_v2',JSON.stringify(st))}catch(e){}render();return}var sh=e.target.closest('[data-nsf-share]');if(sh){var x=DATA.find(function(a){return a[0]===sh.dataset.nsfShare});if(!x)return;var text=x[0]+'\n\nIN A NUTSHELL\n'+x[3]+'\n\nNayaNET — Create. Connect. Grow with US.';if(navigator.share)navigator.share({title:x[0],text:text,url:location.href}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(function(){sh.textContent='✓ COPIED';setTimeout(function(){sh.textContent='＋ SHARE'},1300)});return}var cp=e.target.closest('[data-nsf-copy]');if(cp){var x=DATA.find(function(a){return 'nsf-'+a[0].toLowerCase().replace(/[^a-z0-9]+/g,'-')===cp.dataset.nsfCopy);if(!x)return;var text=[x[0],'','IN A NUTSHELL',x[3],'','HUMAN NOTE',x[4],'','CHILD NOTE',x[5],'','GRANDMA NOTE',x[6],'','NAYA NOTE',x[7],'','MACHINE NOTE',x[8],'','WHAT WE LEARNED',x[9],'','WHAT IT MEANS',x[10],'','NayaNET — Create. Connect. Grow with US.'].join('\n');if(navigator.clipboard)navigator.clipboard.writeText(text).then(function(){cp.textContent='✓ COPIED';setTimeout(function(){cp.textContent='⧉ COPY INTELLIGENCE'},1300)});return}});root.querySelector('#nsfSearch').addEventListener('input',function(e){query=e.target.value.toLowerCase().trim();render()});render()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();
</script>
