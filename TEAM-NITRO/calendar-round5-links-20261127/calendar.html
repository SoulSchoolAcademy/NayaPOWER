<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>The Ultimate Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet" />
    <style>
      /* FOLLOW-ON (2026-11-18, Amendments #1 + #2 — the black car + the
         unfold): the day view restructured to Shawn's 00:16-00:19Z shape.
         (1) TOP BAR — black gloss obsidian; the day's colour lives only
         as the bottom rim + underglow. The headliner is a grid: the
         date at the left, the live digit-tile time DEAD CENTER, an
         empty cell at the right balancing the date. The date line is
         KEPT VERBATIM from the v18 fix (weekday in Marcellus white +
         "NOVEMBER 17, 2026" uppercase letterspaced) — the v15 headliner
         date in Marcellus "Tuesday, November 17th" could not be located
         verbatim in the filed v15 bytes; that item is a BLOCKER, named
         in the maker report, not approximated. The "i" top-left is the
         approved back-to-month eye (Shawn 2026-11-17 18:33Z) — kept,
         with title="Back to month" added.
         (2) WISDOM + GREETING IN ONE BAR — the greeting (Marcellus,
         the high-level font) moved into the wisdom banner; the S
         initial stays, black middle, gold around.
         (3) DAY NAV — the Mon / Wed stepper sits just under the
         wisdom+greeting bar, in #daystepSlot.
         (4) NOTIFICATIONS — next, by world (Personal / Work / World);
         the "everyday life" section GOES; its doors live where they
         belong (mail, messages, connections ARE notifications; lists
         are a record). All 15 doors remain, none removed.
         (5) APPOINTMENTS — the dash-grid + timeline 6 AM-9 PM, with
         Book a time AND a Smart Meet button (opens the appointments
         door with the Meet toggle already on).
         (6) RECORD — at the bottom: journal, notes, lists, reports.
         THE OBSIDIAN-INSIDE LAW: the six #screen-day rules that
         re-tinted boards by the day's colour are DELETED (the base
         fills stand — obsidian already); the daybar and the wisdom
         banner lose their day-colour washes the same way. The
         screen/scroll ambient washes stay — they are the stage's
         light, not a board's fill. Boards alive on hover: the tiles
         already lifted via the base .tile:hover; .cat and .cat-row
         now lift + light the same way. THE UNFOLD: notifications
         stand open; appointments and record sit folded behind the
         agreement's "Keep reading ◆" button, one at a time — the
         button's CSS/JS shape harvested verbatim from the agreement
         unfold (blob c7b14a98).
         AMENDMENT #3 (2026-11-18, the month-view 10): the month bar is
         rebuilt — the flat medallion pill GOES (its comment claimed it
         turned slowly like the Hz jewel; there is no animation on it in
         the bytes — static, wordless, purposeless) and the date+live-time
         plaque takes DEAD CENTER as a button into today. The plaque's
         time was already live digit tiles (clockTilesHTML, local clock,
         no GMT). Grid numbers grow (18→22px desktop, 18→20px at phone —
         the 7-column arithmetic at 390 caps the phone tiles; the eye
         confirms the fit); the 'i' jewels grow ~25% (17→21 / 22→28 —
         they open the day, same as the cell, named in bytes); the
         weekday discs become real 3D BALLS and the glow comes down
         about a third; today's cell is marked at last (white border +
         day-colour ring + glow — the month file's mechanism); the
         content dots grow 6→8px. The YOUR STATS button sits in the
         headliner's right cell (the time still holds dead center, the
         two 1fr columns balance) and opens the Reports door — the day
         file's day-synced stats for the day being viewed. The Dashboard
         (Smart Score Dashboard) is not in this branch, so its day view
         cannot be the landing yet; that rides the Dashboard round. No
         stats button on the month view. */
      :root {
        --bg: #040407;
        --violet: #8e24aa;
        --panel: #0a0a10;
        --ink: #f4f4f8;
        --rim: rgba(255, 255, 255, 0.09);
        /* The day colors — the week as a color flow, hexes from the
           machine spec's weekday table (§3.3), never from a screenshot */
        --d0: #8e24aa; /* Sunday — royal purple · 963 Hz */
        --d1: #c2410c; /* Monday — burnt orange · 417 Hz */
        --d2: #d4a017; /* Tuesday — deep gold · 528 Hz */
        --d3: #3fb8ff; /* Wednesday — sky blue (Kanye blue) · 741 Hz */
        --d4: #07925f; /* Thursday — emerald · 639 Hz */
        --d5: #c62828; /* Friday — ruby · 396 Hz */
        --d6: #3f51b5; /* Saturday — indigo · 852 Hz */
        /* The official type scale — locked, all the way through:
           headlines 25 · sub-headlines 19 · small text 17.
           No text on this page is set at any other size. */
        --type-headline: 25px;
        --type-sub: 19px;
        --type-small: 17px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(120% 70% at 50% -10%, rgba(255, 255, 255, 0.05), transparent 55%),
          radial-gradient(90% 60% at 50% 115%, rgba(106, 108, 255, 0.05), transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family: "Archivo", system-ui, sans-serif;
        font-size: var(--type-small);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
      button:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.75);
        outline-offset: 2px;
      }

      #app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: clamp(8px, 1.6vmin, 18px);
      }
      .screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .hidden { display: none !important; }

      /* ---------- Digit tiles — harvested VERBATIM from the Dashboard
         (fix-9 mini tiles: cap + digit + rim + chakra colour per digit).
         Not a remake — the Dashboard's own CSS, values untouched. ---------- */
      .os-mini-num{display:inline-flex;align-items:flex-start;gap:3px;white-space:nowrap;vertical-align:middle;}
      .os-mini-tile{display:inline-block;width:30px;border-radius:6px;overflow:hidden;vertical-align:top;background:linear-gradient(180deg,#171720,#0f0f15 55%,#020203);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 10px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile .cap{display:block;height:5px;background:linear-gradient(180deg,#e8e8ec,#c9c9cf 55%,#8a8a90);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 2px rgba(0,0,0,.35);}
      .os-mini-tile .rd{display:block;height:30px;line-height:30px;text-align:center;font-size:27px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(134,126,152,.65),0 0 16px rgba(255,255,255,.25);}
      .os-mini-num.med{gap:4px;}
      .os-mini-num.med .os-mini-tile{width:54px;border-radius:10px;border-width:2px;box-shadow:0 8px 18px rgba(0,0,0,.75),0 0 18px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-num.med .os-mini-tile .cap{height:9px;}
      .os-mini-num.med .os-mini-tile .rd{height:54px;line-height:54px;font-size:48px;}
      .os-mini-tile.dollar{border-color:#ffbf3d;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,191,61,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.dollar .cap{background:linear-gradient(180deg,#fff3a0,#f5d76e 55%,#c9930a);}
      .os-mini-gap{flex:none;width:10px;}
      .os-mini-num.med .os-mini-gap{width:14px;}
      .os-mini-tile.dot{width:12px;}
      .os-mini-num.med .os-mini-tile.dot{width:20px;}
      .os-mini-tile.dot .rd{display:flex;align-items:flex-end;justify-content:center;height:30px;line-height:1;padding-bottom:4px;box-sizing:border-box;}
      .os-mini-num.med .os-mini-tile.dot .rd{height:54px;padding-bottom:8px;}
      .os-mini-tile.pct{width:34px;}
      .os-mini-num.med .os-mini-tile.pct{width:60px;}
      .os-mini-tile.d0{border-color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,255,255,.45),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d0 .cap{background:linear-gradient(180deg,#fff,#d9d9de 55%,#9a9aa0);}
      .os-mini-tile.d1{border-color:#ff2a2a;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,42,42,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d1 .cap{background:linear-gradient(180deg,#ff8a8a,#e60000 55%,#8f0000);}
      .os-mini-tile.d2{border-color:#ff8c00;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,140,0,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d2 .cap{background:linear-gradient(180deg,#ffc27a,#ff8c00 55%,#994d00);}
      .os-mini-tile.d3{border-color:#f5d76e;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(245,215,110,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d3 .cap{background:linear-gradient(180deg,#fff3a0,#f5d76e 55%,#c9930a);}
      .os-mini-tile.d4{border-color:#00a86b;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(0,168,107,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d4 .cap{background:linear-gradient(180deg,#6ee7a0,#00a86b 55%,#005c3a);}
      .os-mini-tile.d5{border-color:#29b6f6;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(41,182,246,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d5 .cap{background:linear-gradient(180deg,#a5e3ff,#29b6f6 55%,#0e6b9e);}
      .os-mini-tile.d6{border-color:#3f51b5;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(63,81,181,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d6 .cap{background:linear-gradient(180deg,#9aa5ff,#3f51b5 55%,#232a6b);}
      .os-mini-tile.d7{border-color:#8e24aa;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(142,36,170,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d7 .cap{background:linear-gradient(180deg,#d8a0ff,#8e24aa 55%,#4d0f5e);}
      .os-mini-tile.d8{border-color:#b388ff;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(179,136,255,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d8 .cap{background:linear-gradient(180deg,#e9d5ff,#b388ff 55%,#6d4bb0);}
      .os-mini-tile.d9{border-color:#ff1493;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,20,147,.5),inset 0 1px 0 rgba(255,255,255,.35);}
      .os-mini-tile.d9 .cap{background:linear-gradient(180deg,#ff9ed2,#ff1493 55%,#8f0057);}
      /* THE CLOCK TILES (v15 amendment, Shawn 2026-11-17): the live time
         as Dashboard blocks — digitsHTML/miniTileHTML above, harvested
         verbatim, nothing rebuilt. The colon is a plain white separator
         between the groups. AM/PM ride in the SAME tile block: the
         harvested .os-mini-tile anatomy (cap + face) with the hour's
         colour (--hc, set on the clock) as rim + glow, because letters
         take the hour's colour. The clock is one treatment everywhere */
      .clocknum { align-items: center; }
      .clock-colon { color: #ffffff; font-weight: 900; font-size: var(--type-sub); line-height: 1; text-shadow: 0 0 8px rgba(255,255,255,.35); }
      .os-mini-tile.letter { border-color: var(--hc, #ffffff); box-shadow: 0 4px 10px rgba(0,0,0,.7), 0 0 12px color-mix(in srgb, var(--hc, #ffffff) 50%, transparent), inset 0 1px 0 rgba(255,255,255,.35); }
      .os-mini-tile.letter .cap { background: linear-gradient(180deg,#ffffff,#d9d9de 55%,#9a9aa0); }
      .os-mini-tile.letter .rd { font-size: 24px; }
      @media (max-width:768px){
        .os-mini-tile{width:20px;border-radius:4px;}
        .os-mini-tile .cap{height:4px;}
        .os-mini-tile .rd{height:22px;line-height:22px;font-size:19px;}
        /* v18-fix: the AM/PM letter is 17px in the 20px tile — the
           v18 19px still clipped 2px live (real Archivo 900 "M" at
           19px is 20px wide in the 18px content box; at 17px the "M"
           is ~18px, the box). The v17 defect was the letter rd
           staying 24px in a 20px tile */
        .os-mini-tile.letter .rd{font-size:17px;}
        .os-mini-num{gap:2px;}
        .os-mini-num.med .os-mini-tile{width:40px;}
        .os-mini-num.med .os-mini-tile .cap{height:7px;}
        .os-mini-num.med .os-mini-tile .rd{height:40px;line-height:40px;font-size:36px;}
        .os-mini-tile.dot{width:8px;}
        .os-mini-num.med .os-mini-tile.dot{width:14px;}
        .os-mini-tile.pct{width:24px;}
        .os-mini-num.med .os-mini-tile.pct{width:44px;}
        .os-mini-gap{width:8px;}
        .os-mini-num.med .os-mini-gap{width:10px;}
      }

      /* ---------- Month screen ---------- */
      /* The PTS / % / MONEY lesson, carried through the whole page: an
         obsidian-black pill, a bold white label you can read at a glance,
         and ONE deep colour per control as its rim + glow. Clean, lit,
         premium — the same language on the header plaque, the TODAY
         button, the back / forward arrows, the weekday plaques and the
         day boards below. */
      /* AMENDMENT #3 — the month bar, rebuilt. The flat medallion pill
         is GONE (deleted, not raised): its comment claimed the diamond
         turned slowly like the Hz jewel, but no animation touches it in
         the bytes — static, wordless, purposeless. In its place the
         date+live-time plaque takes DEAD CENTER across the top, as a
         button: tap it and you are in today. The two arrow clusters
         (one button each, equal width) balance it, so the plaque holds
         the middle at every width. The month being browsed is named
         only in the grid's aria-label, for screen readers, never on
         screen — the date is said once, in the plaque */
      .monthbar {
        display: grid; grid-template-columns: auto 1fr auto; align-items: center;
        gap: 12px; padding: 2px 4px clamp(6px, 1.4vmin, 14px);
      }
      .navcluster { display: flex; gap: 8px; align-items: center; min-width: 96px; }
      .navcluster.right { justify-content: flex-end; }
      .navbtn {
        width: 44px; height: 44px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        color: #fff;
        background: linear-gradient(180deg, #17171f 0%, #0a0a11 62%, #060609 100%);
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 0 16px rgba(255, 255, 255, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -6px 10px rgba(0, 0, 0, 0.5),
          0 5px 12px rgba(0, 0, 0, 0.5);
        transition: box-shadow 0.25s, transform 0.25s, filter 0.25s;
      }
      /* BOTH arrows carry the royal purple — purple and purple
         (Shawn, 2026-11-17: the green forward arrow goes) */
      #prevMonth, #nextMonth {
        border-color: #8e24aa;
        box-shadow:
          0 0 10px rgba(142, 36, 170, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -6px 10px rgba(0, 0, 0, 0.5),
          0 5px 12px rgba(0, 0, 0, 0.5);
      }
      .navbtn:hover { transform: translateY(-1px); filter: brightness(1.22); }
      .navbtn svg { width: 18px; height: 18px; }
      /* The header's now-plaque (Amendment #3): it is the CENTER now —
         the single official headliner, dead center across the top, and a
         button: tap it and you are in today. Today's DATE and the LIVE
         TIME (live digit tiles, viewer's own clock, own time zone,
         ticking every second — no GMT). Same obsidian pill language,
         deep gold rim + glow */
      .nowplaque {
        --dc: #d4a017;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        min-height: 44px; padding: 6px 18px; border-radius: 999px;
        justify-self: center; cursor: pointer; font: inherit; text-align: center;
        transition: box-shadow .25s, transform .25s, filter .25s;
        background:
          radial-gradient(90% 140% at 50% 0%, color-mix(in srgb, var(--dc) 8%, transparent), transparent 62%),
          linear-gradient(180deg, #17171f 0%, #0a0a11 62%, #060609 100%);
        border: 1.5px solid color-mix(in srgb, var(--dc) 62%, transparent);
        box-shadow:
          0 0 10px color-mix(in srgb, var(--dc) 18%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -6px 10px rgba(0, 0, 0, 0.5),
          0 5px 12px rgba(0, 0, 0, 0.5);
      }
      .nowplaque:hover { transform: translateY(-1px); filter: brightness(1.22); }
      .nowplaque:active { transform: scale(0.97); }
      .now-date {
        font-family: "Marcellus", serif; font-size: var(--type-sub);
        letter-spacing: 0.05em; color: #ffffff; white-space: nowrap;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      }
      .now-time {
        /* The time takes TODAY's colour — never gold (Shawn, 2026-11-17);
           --dc is set on the plaque from today's weekday in JS */
        font-size: var(--type-sub); font-weight: 800; letter-spacing: 0.06em;
        color: color-mix(in srgb, var(--dc, #d4a017) 58%, #ffffff 42%);
        font-variant-numeric: tabular-nums; white-space: nowrap;
        text-shadow: 0 0 8px color-mix(in srgb, var(--dc, #d4a017) 30%, transparent);
      }

      .weekrow {
        display: grid; grid-template-columns: repeat(7, 1fr); gap: clamp(5px, 0.9vmin, 10px);
        padding: 0 2px clamp(5px, 1vmin, 10px);
      }
      .weekrow > span {
        /* THE WORD IS THE OBJECT (Shawn, 2026-11-17, from his "Sun"
           mockup): each letter is the object — a dark obsidian letter
           body, the day's own colour as rim + glow around the letter.
           No pill, no diamond above, no rule below — the letters
           themselves carry it. The day's icon sits above the word, a
           real object like the word itself. Abbreviations fit whole
           at desktop AND phone width — nothing clipped, nothing vertical */
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 6px;
        padding: clamp(6px, 1vmin, 9px) 2px 4px;
        white-space: nowrap;
      }
      .weekrow .wk-ico {
        /* The day's icon — a real 3D BALL now (Amendment #3), not a flat
           circle, not a hula hoop: a sphere, lit from the top-left, dark
           at its base, the day's colour as rim + glow outside, white
           glyph as an object inside (§4 THE ICON) */
        position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        color: #ffffff;
        background: radial-gradient(circle at 32% 28%, #4a5068 0%, #232838 38%, #0a0a11 68%, #050607 100%);
        border: 1.5px solid var(--dc);
        box-shadow:
          0 0 8px color-mix(in srgb, var(--dc) 30%, transparent),
          inset 0 2px 3px rgba(255,255,255,.4),
          inset 0 -8px 12px rgba(0,0,0,.6),
          0 5px 12px rgba(0,0,0,.5);
      }
      .weekrow .wk-ico svg { width: 19px; height: 19px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.7)) drop-shadow(0 0 6px rgba(255,255,255,.35)); }
      /* CALENDAR FIX 2 (F2) — the ball, made REAL (same growth as the month
         file; this file's own .wk-ico is the harvested base — see report). */
      .weekrow .wk-ico::before{content:"";position:absolute;top:2px;left:3px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.25) 55%,transparent 75%);pointer-events:none}
      .weekrow .wk-ico::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid transparent;border-top-color:color-mix(in srgb,var(--dc) 70%,#ffffff);border-right-color:color-mix(in srgb,var(--dc) 22%,transparent);animation:orbitspin 90s linear infinite;pointer-events:none}
      .weekrow>span:nth-child(even) .wk-ico::after{animation-duration:120s;animation-direction:reverse}
      /* CALENDAR FIX 2 — DAY FOLLOW-ON (F2): the round-2 press rule targeted
         .wk, a class the day weekrow never uses (its cells are <span
         class="wk-col">), so it matched NOTHING — and the day file had no
         weekrow hover rule at all. Retargeted to .wk-col, and the month's
         hover harvested verbatim (month lines 325 + 359; only the selector
         changes): the whole column lifts + lights in its own weekday colour
         (25% glow), the ball lifts again + lights (45%). Transitions are the
         month's own .18s ease (month lines 324 + 360) — without them the lift
         snaps instead of lifting. */
      .weekrow .wk-col{transition:transform .18s ease,box-shadow .18s ease}
      .weekrow .wk-col:hover{transform:translateY(-2px);box-shadow:0 0 10px color-mix(in srgb,var(--dc) 25%,transparent),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -6px 10px rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.5)}
      .weekrow .wk-ico{transition:transform .18s ease,box-shadow .18s ease}
      .weekrow .wk-col:hover .wk-ico{transform:translateY(-2px);box-shadow:0 0 12px color-mix(in srgb,var(--dc) 45%,transparent),inset 0 2px 3px rgba(255,255,255,.4),inset 0 -8px 12px rgba(0,0,0,.6),0 5px 12px rgba(0,0,0,.5)}
      .weekrow .wk-col:active .wk-ico{transform:scale(.97)}
      .weekrow .wk-word { display: inline-flex; align-items: baseline; gap: 1px; }
      .weekrow .wk-l {
        /* Dark obsidian letter body, the day's colour as rim + glow —
           the mockup's effect, verbatim: big heavy letters, dark faces,
           coloured edge light. The stroke draws the rim; the glow is
           the light around it. Today burns brighter (below) */
        font-family: "Archivo", system-ui, sans-serif; font-weight: 900;
        font-size: clamp(17px, 3.4vw, 34px); line-height: 1;
        color: #07070f;
        -webkit-text-stroke: 2px var(--dc);
        paint-order: stroke fill;
        text-shadow:
          0 0 8px color-mix(in srgb, var(--dc) 35%, transparent),
          0 0 16px color-mix(in srgb, var(--dc) 20%, transparent),
          0 3px 6px rgba(0,0,0,.8);
      }
      .weekrow > span.today-col .wk-l {
        /* Today is known from this word — same dark letters, stronger glow */
        text-shadow:
          0 0 10px color-mix(in srgb, var(--dc) 55%, transparent),
          0 0 22px color-mix(in srgb, var(--dc) 35%, transparent),
          0 3px 6px rgba(0,0,0,.8);
      }
      .weekrow > span.today-col .wk-ico {
        box-shadow:
          0 0 12px color-mix(in srgb, var(--dc) 45%, transparent),
          inset 0 1px 0 rgba(255,255,255,.28),
          inset 0 -6px 10px rgba(0,0,0,.5),
          0 5px 12px rgba(0,0,0,.5);
      }

      .grid {
        flex: 1; min-height: 0;
        display: grid; grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(6, 1fr);
        gap: clamp(5px, 0.9vmin, 10px);
      }
      .cell {
        --dc: #ffffff;
        position: relative;
        min-width: 0;
        border-radius: clamp(10px, 1.6vmin, 16px);
        background: linear-gradient(180deg, #101019 0%, #07070c 78%, #050508 100%);
        /* Quiet at rest: a fine rim in the day's color and a whisper of
           light — the color reads as elegance, not noise. Depth comes
           from the top-edge light and the drop shadow beneath the cell */
        border: 1px solid color-mix(in srgb, var(--dc) 34%, transparent);
        box-shadow:
          0 6px 14px rgba(0, 0, 0, 0.42),
          0 0 10px color-mix(in srgb, var(--dc) 8%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.07),
          inset 0 -10px 16px rgba(0, 0, 0, 0.35);
        display: flex; align-items: flex-start; justify-content: flex-start;
        transition: border-color 0.35s ease, box-shadow 0.35s ease, opacity 0.35s ease;
        min-height: 44px; padding: clamp(6px, 1.1vmin, 11px);
      }
      /* The boards in the same language: a clearer rim in the day's
         colour and a real glow around the board's edge, while the face
         itself stays dark obsidian — lit like the PTS pills, not filled */
      .cell {
        border: 1.5px solid color-mix(in srgb, var(--dc) 52%, transparent);
        box-shadow:
          0 6px 14px rgba(0, 0, 0, 0.42),
          0 0 15px color-mix(in srgb, var(--dc) 18%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.13),
          inset 0 -10px 16px rgba(0, 0, 0, 0.35);
      }
      /* The digit tiles stay — they are the Dashboard's own — but in the
         month cells they sit SMALL: a quiet number in the corner of the
         board, not a billboard. (The day screen's med tiles are untouched) */
      .grid .os-mini-num { gap: 2px; }
      .grid .os-mini-tile {
        width: 22px; border-radius: 4px; border-width: 1px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6), 0 0 7px rgba(255, 255, 255, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .grid .os-mini-tile .cap { height: 4px; }
      .grid .os-mini-tile .rd {
        height: 27px; line-height: 27px; font-size: 21px; font-weight: 800;
        text-shadow: 0 0 6px rgba(134, 126, 152, 0.5), 0 0 10px rgba(255, 255, 255, 0.2);
      }
      .cell:hover, .cell:focus-visible, .cell:active {
        /* Hover brightens the rim and its outside light only — the face
           of the day stays dark and calm */
        border-color: color-mix(in srgb, var(--dc) 78%, #ffffff 22%);
        box-shadow:
          0 0 26px color-mix(in srgb, var(--dc) 28%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        z-index: 2;
      }
      /* Days of the other months are not shown at all — a blank cell */
      .cell.blank {
        border-color: #ffffff0c;
        box-shadow: none;
        cursor: default;
      }
      /* TODAY READS INSTANTLY (Amendment #3): today's cell wears a 2px
         white border + a 2px ring in the day's own colour + a 24px glow
         in the day's colour — the month file's .tile.today mechanism,
         in this grid's language. The weekday column above it burns
         brighter and the plaque names the date; the cell itself is the
         glance. (Before: NO special cell at all — today was invisible
         on the grid.) */
      .cell.today {
        border: 2px solid #ffffff;
        box-shadow:
          0 0 0 2px var(--dc),
          0 0 24px color-mix(in srgb, var(--dc) 75%, transparent),
          0 6px 14px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255,255,255,.3),
          inset 0 -10px 16px rgba(0,0,0,.35);
      }
      /* The day's number — the Dashboard's own digit tiles (cap + digit +
         rim + chakra colour per digit), harvested above, shrunk small
         for the month cells by the .grid rules above. The cell's rim and
         light carry the day's color; the tiles carry the number */
      /* The info jewel — bottom-right of every day, the corner opposite
         the number. A pearl disc raised off the page like a real object:
         lit from above, shadowed beneath, a small dark i at its heart so
         it reads as the day's info. Clicking it opens the day, same as
         the cell around it. Amendment #3: ~25% bigger (17→21 / 22→28),
         so you can see it. */
      .cell .jewel {
        /* The info eye, rebalanced: a small dark obsidian jewel — no
           white disc. A thin rim in the day's color, one soft highlight
           at the top, and a small white i on the black centre. It sits
           quiet in the corner instead of shouting across the cell */
        position: absolute; right: clamp(6px, 1.1vmin, 11px); bottom: clamp(6px, 1.1vmin, 11px);
        width: clamp(21px, 3.4vmin, 28px); height: clamp(21px, 3.4vmin, 28px);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 34% 26%, #2c3044 0%, #13131f 52%, #050508 100%);
        border: 1px solid color-mix(in srgb, var(--dc) 55%, rgba(255, 255, 255, 0.25) 45%);
        box-shadow:
          0 3px 7px rgba(0, 0, 0, 0.6),
          0 0 8px color-mix(in srgb, var(--dc) 22%, transparent),
          inset 0 1px 2px rgba(255, 255, 255, 0.35),
          inset 0 -3px 5px rgba(0, 0, 0, 0.7);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .cell .jewel svg { width: 74%; height: 74%; display: block; }
      .cell:hover .jewel, .cell:focus-visible .jewel {
        transform: translateY(-1px);
        box-shadow:
          0 5px 10px rgba(0, 0, 0, 0.65),
          0 0 12px color-mix(in srgb, var(--dc) 40%, transparent),
          inset 0 1px 2px rgba(255, 255, 255, 0.45),
          inset 0 -3px 5px rgba(0, 0, 0, 0.7);
      }
      .dots {
        position: absolute; left: clamp(7px, 1.2vmin, 12px); bottom: clamp(7px, 1.1vmin, 11px);
        display: flex; justify-content: flex-start; gap: 5px;
      }
      .dots i {
        width: 8px; height: 8px; border-radius: 50%;
        background: color-mix(in srgb, var(--dc) 70%, #ffffff 30%);
        box-shadow: 0 0 5px color-mix(in srgb, var(--dc) 45%, transparent);
      }
      .dots i.note { background: #e8e8f2; box-shadow: 0 0 5px rgba(255,255,255,.55); border-radius: 2px; }

      /* ---------- Shared chrome for inner screens ---------- */
      .backbtn {
        /* The inner screens' back arrow speaks the same language: the
           PTS purple as rim + glow on an obsidian disc, bold white mark */
        width: 46px; height: 46px; flex: none; border-radius: 50%; color: #fff;
        display: inline-flex; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #17171f 0%, #0a0a11 62%, #060609 100%);
        border: 1.5px solid #9a5cff;
        box-shadow:
          0 0 18px rgba(154, 92, 255, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -6px 10px rgba(0, 0, 0, 0.5),
          0 5px 12px rgba(0, 0, 0, 0.5);
        transition: box-shadow 0.25s, filter 0.25s;
      }
      .backbtn:hover { filter: brightness(1.22); }
      .backbtn svg { width: 19px; height: 19px; }
      /* v18 — THE EYE BACK TO MONTH (Shawn's word, 2026-11-17 18:33Z):
         the back control is the approved info eye — the small dark
         obsidian jewel with the white "i", not a white blob and not
         a chevron. Disc treatment harvested verbatim from .cell
         .jewel (same radial, same rim, same shadows, same 74% "i");
         only the size is the back button's own 46px. The day's
         colour rims it, so it reads as this day's eye */
      .backbtn.eye {
        background: radial-gradient(circle at 34% 26%, #2c3044 0%, #13131f 52%, #050508 100%);
        border: 1.5px solid color-mix(in srgb, var(--dc, #fff) 55%, rgba(255, 255, 255, 0.25) 45%);
        box-shadow:
          0 3px 7px rgba(0, 0, 0, 0.6),
          0 0 8px color-mix(in srgb, var(--dc, #fff) 22%, transparent),
          inset 0 1px 2px rgba(255, 255, 255, 0.35),
          inset 0 -3px 5px rgba(0, 0, 0, 0.7);
      }
      .backbtn.eye .jewel { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .backbtn.eye .jewel svg { width: 74%; height: 74%; display: block; }
      .backbtn.eye:hover {
        box-shadow:
          0 5px 10px rgba(0, 0, 0, 0.65),
          0 0 12px color-mix(in srgb, var(--dc, #fff) 40%, transparent),
          inset 0 1px 2px rgba(255, 255, 255, 0.45),
          inset 0 -3px 5px rgba(0, 0, 0, 0.7);
      }

      /* ---------- Day screen ---------- */
      .daybar {
        /* The top bar is black gloss obsidian (follow-on 2026-11-18,
           the black car): obsidian black for the whole thing, the day's
           colour only as the light AROUND it — the bottom rim and the
           underglow beneath. The sheen still passes across, the rays
           still fan behind; the day-colour washes are gone. Inside it:
           ONE official headliner across the top (the eye back to month
           bracketing it left, the Hz jewel right) — the date at the
           left, the live digit-tile time DEAD CENTER. The greeting and
           the stepper left the bar: the greeting shares the wisdom bar
           now, the stepper sits under it */
        position: relative; overflow: hidden;
        display: flex; flex-direction: column; align-items: stretch;
        gap: clamp(10px, 1.8vmin, 16px);
        padding: clamp(14px, 2.2vmin, 22px) clamp(12px, 2vmin, 22px) clamp(16px, 2.6vmin, 26px);
        border-radius: 0 0 22px 22px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 32%, rgba(0, 0, 0, 0.35) 100%),
          repeating-conic-gradient(from 4deg at 50% -8%, rgba(255, 255, 255, 0.016) 0 13deg, transparent 13deg 28deg),
          linear-gradient(180deg, #17171f 0%, #050607 60%, #050607 100%);
        border-bottom: 1.5px solid color-mix(in srgb, var(--dc, #fff) 55%, rgba(255, 255, 255, 0.25) 45%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 14px 30px rgba(0, 0, 0, 0.45),
          0 0 24px color-mix(in srgb, var(--dc, #fff) 25%, transparent);
        margin-bottom: clamp(10px, 2vmin, 18px);
      }
      /* The eye back to month brackets the headliner at the TOP LEFT corner */
      .daybar > .backbtn {
        position: absolute; z-index: 3;
        top: clamp(14px, 2.2vmin, 22px); left: clamp(12px, 2vmin, 22px);
        box-shadow:
          0 0 9px rgba(154, 92, 255, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -6px 10px rgba(0, 0, 0, 0.5),
          0 5px 12px rgba(0, 0, 0, 0.5);
      }
      .daybar > .backbtn.eye {
        /* The eye keeps the jewel's own shadow in the daybar —
           the purple back-arrow shadow above must not win here */
        box-shadow:
          0 3px 7px rgba(0, 0, 0, 0.6),
          0 0 8px color-mix(in srgb, var(--dc, #fff) 22%, transparent),
          inset 0 1px 2px rgba(255, 255, 255, 0.35),
          inset 0 -3px 5px rgba(0, 0, 0, 0.7);
      }
      .daybar::before {
        /* The Hub's passing sheen — light moving slowly across the bar */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
        transform: translateX(-100%);
        animation: barsheen 7s ease-in-out infinite;
      }
      @keyframes barsheen { 0%, 55% { transform: translateX(-100%); } 88%, 100% { transform: translateX(100%); } }
      .daybar > * { position: relative; z-index: 1; }
      .dayhead { display: flex; flex-direction: column; gap: clamp(12px, 2vmin, 18px); min-width: 0; width: 100%; }
      /* ---------- ONE HEADLINER (Shawn, 2026-11-17; grid 2026-11-18) ----------
         The date is said ONCE, the time ONCE — a single official
         headliner across the top of the bar, bracketed by the back
         arrow (top left) and the Hz jewel (top right). Spare: the
         weekday as straight raised words in the day's colour, the
         full date, the live time in the day's colour. Nothing else
         on the page repeats the date or the time — no digit tiles
         beside the date line, no second clock in the greeting.
         Follow-on: a grid now — the date at the left, the live
         digit-tile time DEAD CENTER, an empty cell at the right
         balancing the date so the time holds the middle. Amendment #3:
         the right cell holds the Your Stats button now — the time still
         holds the middle, the two 1fr columns balance. */
      .official-headliner {
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        gap: 8px 14px; min-height: 46px;
        margin: 0 clamp(64px, 9vmin, 96px);
        padding-bottom: clamp(10px, 1.6vmin, 14px);
        border-bottom: 1px solid color-mix(in srgb, var(--dc, #fff) 20%, transparent);
      }
      .hl-left { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 8px 14px; min-width: 0; }
      .hl-time { justify-self: center; }
      /* YOUR STATS (Amendment #3) — the button in the top bar. The pill
         language is the daystep button's, verbatim in shape; the label
         is plain on purpose ("Your Stats" — plain, yours, a stranger
         knows it instantly; the captain's 9/10, confirmed in the
         scorecard). It opens the Reports door — the day file's
         day-synced stats for the day being viewed. */
      .stats-btn {
        justify-self: end;
        min-height: 44px; padding: 0 20px; border-radius: 999px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: var(--type-small); font-weight: 800; letter-spacing: 0.06em;
        color: #ffffff; white-space: nowrap; cursor: pointer;
        background: linear-gradient(180deg, #17171f 0%, #0a0a11 62%, #060609 100%);
        border: 1.5px solid color-mix(in srgb, var(--dc, #fff) 68%, transparent);
        box-shadow:
          0 0 12px color-mix(in srgb, var(--dc, #fff) 20%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -6px 10px rgba(0, 0, 0, 0.5),
          0 5px 12px rgba(0, 0, 0, 0.5);
        transition: box-shadow 0.25s, transform 0.25s, filter 0.25s;
      }
      .stats-btn:hover { transform: translateY(-1px); filter: brightness(1.22); }
      .stats-btn:active { transform: scale(0.97); }
      .hl-weekday {
        /* Straight words, no button — raised, WHITE (Shawn, 2026-11-17:
           the headliner weekday stays white; so much gold on the page
           already, the white-on-gold contrast is good — leave it). The
           day's colour lives in the glow around the letters, never in
           the word itself. This overrides the v14 day-colour treatment */
        font-family: "Marcellus", serif; font-size: var(--type-headline);
        letter-spacing: 0.1em; line-height: 1.05;
        color: #ffffff;
        text-shadow:
          0 -1px 0 rgba(255, 255, 255, 0.28),
          0 2px 3px rgba(0, 0, 0, 0.85),
          0 0 11px color-mix(in srgb, var(--dc, #fff) 35%, transparent);
      }
      .hl-date {
        font-size: var(--type-sub); font-weight: 800;
        letter-spacing: 0.16em; text-transform: uppercase; color: #ffffff;
        text-shadow: 0 1px 0 #000, 0 2px 3px rgba(0, 0, 0, 0.7);
        white-space: nowrap;
      }
      .hl-time {
        /* The time takes the DAY's colour — not gold — with only a
           whisper of its light in the letters */
        font-size: var(--type-sub); font-weight: 800;
        letter-spacing: 0.1em; font-variant-numeric: tabular-nums;
        color: color-mix(in srgb, var(--dc, #fff) 55%, #ffffff 45%);
        text-shadow: 0 0 8px color-mix(in srgb, var(--dc, #fff) 28%, transparent);
        white-space: nowrap;
      }
      .hl-dot {
        flex: none; width: 7px; height: 7px; transform: rotate(45deg); border-radius: 1.5px;
        background: linear-gradient(135deg, #ffffff 0%, var(--dc, #fff) 55%, color-mix(in srgb, var(--dc, #fff) 50%, #000000) 100%);
        box-shadow: 0 0 5px color-mix(in srgb, var(--dc, #fff) 35%, transparent);
      }
      /* The greeting row under the headliner — the Hub's warmth.
         The weather rides at the row's right, kept clear of the
         Hz jewel standing in the corner above it */
      .greet-row {
        display: flex; align-items: center; gap: clamp(12px, 2.4vmin, 26px);
        flex-wrap: wrap; padding-right: clamp(84px, 10vmin, 104px);
      }
      /* The greeting as a grid, so the S disc sits in the greeting's
         own row: its centre aligns EXACTLY with the centre of the
         "Good morning, Shawn." line — never floating between lines.
         v18: ONE row — disc + greeting only. The header says the
         greeting and nothing else (Shawn, 2026-11-17) */
      .greet-layout {
        display: grid; grid-template-columns: auto 1fr;
        column-gap: 16px; row-gap: 3px; align-items: start;
        min-width: min(430px, 100%); flex: 1;
      }
      .greet-layout .avatar-jewel { grid-column: 1; grid-row: 1; align-self: center; }
      .greet-layout .greet-hello { grid-column: 2; grid-row: 1; align-self: center; }
      /* The day's jewel — a faceted gem in the day's color, its frequency
         beneath it. The whole unit stands in the TOP RIGHT corner of
         the bar, bracketing the headliner against the eye at left */
      .dayjewel {
        /* Positioned against the day head, whose own edges ARE the
           bar's content corners — so 0/0 puts the unit exactly in
           the top right corner, level with the eye at left */
        position: absolute; z-index: 3;
        top: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      /* The Hz jewel — a real diamond, not a flat mark: it sits on an
         obsidian pedestal in the day's colour, wrapped in a slow ring
         of travelling light, radiating the day's colour outward, and
         the stone itself turns slowly on its axis like jewelry on a
         stand — a frequency made visible. Slow, always: the ring
         takes 70s, the stone 24s, the radiance breathes over 12s */
      .hz-stage {
        position: relative; flex: none;
        width: clamp(48px, 6.5vmin, 56px); height: clamp(48px, 6.5vmin, 56px);
        display: flex; align-items: center; justify-content: center;
      }
      .hz-aura {
        /* Radiance kept quiet — rich, not glowing (Shawn, 2026-11-17) */
        position: absolute; inset: -10px; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, color-mix(in srgb, var(--dc, #fff) 20%, transparent) 0%, color-mix(in srgb, var(--dc, #fff) 6%, transparent) 52%, transparent 72%);
        animation: hzradiate 12s ease-in-out infinite alternate;
      }
      @keyframes hzradiate { from { opacity: .5; transform: scale(.94); } to { opacity: .85; transform: scale(1.05); } }
      .hz-pedestal {
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 34% 26%, #2c3044 0%, #13131f 52%, #050607 100%);
        border: 2px solid color-mix(in srgb, var(--dc, #fff) 78%, #ffffff 22%);
        box-shadow:
          0 8px 16px rgba(0, 0, 0, 0.65),
          0 0 11px color-mix(in srgb, var(--dc, #fff) 22%, transparent),
          inset 0 2px 3px rgba(255, 255, 255, 0.4),
          inset 0 -8px 12px rgba(0, 0, 0, 0.7);
      }
      .hz-pedestal::after {
        content: ""; position: absolute; inset: -8px; border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: color-mix(in srgb, var(--dc, #fff) 60%, #ffffff 10%);
        border-right-color: color-mix(in srgb, var(--dc, #fff) 22%, transparent);
        animation: orbitspin 70s linear infinite;
      }
      .dayjewel .gem {
        position: relative; z-index: 1;
        width: clamp(32px, 4.8vmin, 40px); height: auto; display: block;
        filter: drop-shadow(0 6px 10px rgba(0,0,0,.75)) drop-shadow(0 0 12px color-mix(in srgb, var(--dc, #fff) 45%, transparent));
        animation: hzspin 24s linear infinite;
        transform-origin: 50% 50%;
      }
      @keyframes hzspin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
      .dayjewel:hover .gem { animation-duration: 12s; }
      .dayjewel:hover .hz-aura { animation-duration: 6s; }
      /* CALENDAR FIX 2 (R3) — THE SIGNATURE PIECE: the flat drawn gem (gemSVG,
         harvested) no longer stands alone — it is the stone in a setting now:
         two concentric pearl rings on the pedestal face, counter-rotating
         (60s / 90s reverse, Laws §1), each carrying a pearl bead (silver-cap
         gradient, harvested from .os-mini-tile .cap). The rings take --dc, so
         the piece changes colour each day with the weekday. NEW composition;
         gem / pedestal / aura / spin are the harvested day-file mechanism. */
      .hz-ring-a,.hz-ring-b{position:absolute;border-radius:50%;pointer-events:none}
      .hz-ring-a{inset:3px;border:1px solid color-mix(in srgb,var(--dc,#fff) 38%,transparent);animation:hzring 60s linear infinite}
      .hz-ring-b{inset:7px;border:1px solid color-mix(in srgb,var(--dc,#fff) 30%,transparent);animation:hzring 90s linear infinite reverse}
      .hz-ring-a::before,.hz-ring-b::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffff 0%,#d9d9de 55%,#8a8a90 100%);box-shadow:0 1px 3px rgba(0,0,0,.6),0 0 6px color-mix(in srgb,var(--dc,#fff) 55%,transparent)}
      @keyframes hzring{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .dayjewel .freq {
        /* The Hz text takes the DAY's colour too */
        font-size: var(--type-small); font-weight: 800; line-height: 1;
        letter-spacing: 0.24em; text-indent: 0.24em;
        color: color-mix(in srgb, var(--dc, #fff) 55%, #ffffff 45%);
        text-shadow: 0 0 7px color-mix(in srgb, var(--dc, #fff) 26%, transparent);
        white-space: nowrap;
      }
      /* CALENDAR FIX 2 (R4) — SCROLL LIGHT (day): same minimal mechanism as
         the month file (no harvest exists — see report). Day boards light in
         spectrum order as they enter (JS assigns --dc down the page, purple
         first, never two the same together) and hold. */
      .tile.lit{border-color:color-mix(in srgb,var(--dc,#fff) 65%,#ffffff 20%);box-shadow:0 0 16px color-mix(in srgb,var(--dc,#fff) 30%,transparent),0 10px 22px rgba(0,0,0,.55)}
      .nblock.lit{border-color:color-mix(in srgb,var(--dc,#fff) 65%,#ffffff 20%);box-shadow:0 0 16px color-mix(in srgb,var(--dc,#fff) 30%,transparent),0 10px 22px rgba(0,0,0,.55)}

      /* ---------- Day dashboard ---------- */
      /* v18 — 635px guard: the day content can never scroll sideways.
         The real fix is the width fixes (the feed pill that ran
         off-screen is gone, the headliner holds its margins); this
         only stops a horizontal scrollbar ever appearing */
      .day-scroll {
        flex: 1; min-height: 0; overflow-y: auto; overflow-x: clip;
        display: flex; flex-direction: column;
        gap: clamp(10px, 1.6vmin, 16px);
        padding: 2px 2px 12px;
      }
      .wisdom-banner {
        flex: none;
        padding: clamp(14px, 2.4vmin, 22px) clamp(16px, 3vmin, 30px);
        border-radius: 16px; text-align: center;
        background: linear-gradient(180deg, #101018 0%, #050607 100%);

      /* ---------- Greeting — inside the top bar, with the Hub's warmth --
         Measured against the Hub hero (his picture, 2026-11-17): the
         italic serif motto above, the greeting HUGE and bold in white,
         a gold sub-line under it, the feed pill, then date + gold time.
         The Hub's own bytes carry the same anatomy: hero h1 at weight
         900 with a deep layered shadow, time in deep gold #d4a017 with
         its glow, a breathing live dot beside the date. The calendar
         keeps its locked type scale — the greeting is the headline,
         set at the headline size, at the Hub's weight */
      .avatar-jewel {
        /* His initial as a real object — a jewel disc like the eye:
           obsidian heart, a rim in the day's colour, light on top,
           shadow beneath, and a slow orbit of light travelling its rim */
        position: relative; flex: none; width: 58px; height: 58px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 34% 26%, #2c3044 0%, #13131f 52%, #050607 100%);

          0 6px 14px rgba(0, 0, 0, 0.65),
          0 0 10px color-mix(in srgb, var(--dc, #fff) 22%, transparent),
          inset 0 2px 3px rgba(255, 255, 255, 0.4),

        text-shadow: 0 0 7px color-mix(in srgb, var(--dc, #fff) 35%, transparent), 0 2px 0 rgba(0,0,0,.6);

        animation: orbitspin 70s linear infinite;

      .greet-hello {
        /* Marcellus, the high-level font (Shawn 00:16Z — the certificate

           judges). The 3-layer shadow is the headliner weekday's,

      /* ---------- Notification blocks — big number displays ----------

      .notif-bar {

            /* v18-fix: the column floor is 260px, not 168px — at 561-860px

         collided. At 260px the band takes two columns (~301px cards

         stack single-column and at 1920 they are still three — the
         pill itself is untouched, still a real object, still 17px */

.face{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:56px;color:#fff;margin:0 auto 12px;position:relative;background:radial-gradient(circle at 35% 30%,#3a1a5e,#0b0714 70%);border:2px solid #8e24aa;box-shadow:0 0 30px rgba(142,36,170,.5),0 12px 28px rgba(0,0,0,.6)}

      .pill{min-height:44px;background:linear-gradient(135deg,#232330 0%,#0b0b12 50%,#171722 100%);border:1.5px solid rgba(255,255,255,.85);color:#fff;padding:10px 14px;border-radius:13px;box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.6);transition:transform .18s ease,border-color .18s,box-shadow .18s}
.pill:hover{transform:translateY(-2px);border-color:var(--violet);box-shadow:0 10px 22px rgba(0,0,0,.6),0 0 18px rgba(142,36,170,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 6px rgba(0,0,0,.6)}
.pill:active{transform:translateY(0) scale(.97)}

      /* ---------- THE ROOM — the day's colour fills the inside ----------
         (Shawn, 2026-11-17, amendment #6: the soul of the day view.)
         The inside of a day is a ROOM, and the room is themed to the
         day's colour: a warm, rich, luxurious fill running through the
         whole interior — the walls (the screen itself), the air (the
         scroll field), and the furniture (every board, block, door and
         panel inside) all carry the day's deep colour mixed into their
         obsidian, so stepping into a day feels like entering a designed
         inner space, not opening a page with a colour on it. The fill
         is COLOUR, never light: no new glows are added anywhere — the
         rims, halos and jewels keep the quiet levels set in the
         less-glow pass, and the colour stays deep (the machine spec's
         weekday hex, mixed down into board black), never neon.
         Where the colour FILLS: the day screen's ground, the daybar's
         body, the scroll field, and the faces of the wisdom banner,
         the notification bar and detail, the doors, the dashboard
         tiles, and — through the door — the door screen's ground and
         its panels. Where it stays an ACCENT only: the month screen
         (each day keeps its own colour there; the room begins when
         you step in), the digit tiles (their colour is their digit's,
         by value, harvested), and every rim, orbit and jewel, which
         were already the day's colour and do not get louder */
      #screen-day {
        background:
          radial-gradient(110% 55% at 50% -6%, color-mix(in srgb, var(--dc, #fff) 22%, transparent), transparent 60%),
          radial-gradient(90% 50% at 50% 112%, color-mix(in srgb, var(--dc, #fff) 10%, transparent), transparent 62%),
          linear-gradient(180deg, color-mix(in srgb, var(--dc, #fff) 15%, #040407) 0%, color-mix(in srgb, var(--dc, #fff) 9%, #040407) 46%, color-mix(in srgb, var(--dc, #fff) 6%, #040407) 100%);
        border-radius: 22px;
      }
      #screen-day .day-scroll {

          radial-gradient(85% 42% at 50% 0%, color-mix(in srgb, var(--dc, #fff) 10%, transparent), transparent 65%),
          linear-gradient(180deg, color-mix(in srgb, var(--dc, #fff) 7%, transparent), color-mix(in srgb, var(--dc, #fff) 4%, transparent) 55%, transparent);
        border-radius: 18px;
      }
      /* FOLLOW-ON (2026-11-18, the black car) — the six rules that

         obsidian already), and the base .tile:hover already lifts

         lift and light without any override. Inside every board is
         standard obsidian black; the day's colour lives only as the

      #screen-door {

      /* ---------- v16 — THE DAY AS ONE PLACE (Shawn, 2026-11-17) ----------
         (1) The day-stepper: the viewer that walks day to day — two
         pills in the day's colour for the day before and the day after,
         prev/next only (FIX3: the return-to-today pill is gone —
         the TODAY button stays gone from the month header). The
         pills name the neighbour by its weekday only, never its date,
         so the headliner stays the day's one saying of the date.
         (2) The Add-source pill in the Notifications header — the
         add-source-by-URL action moved here: same form, same slot,
         one tap, never fighting anything for it.
         (3) Timeline chips for journal + notes, in their doors' own
         colours (journal sapphire, notes emerald), sitting ON the
         timeline at the time they were written.
         (4) The day-to-day slide — the whole place moves when the day
         changes: a short horizontal slide, 0.35s, in the direction of
         travel. Motion that means the day changed, never decoration.
         (5) The journal dot in the month cells — a day with a journal
         entry shows it, in journal blue.
         ---------- v17 — THE LOWER PAGE, START AGAIN (Shawn, 2026-11-17)
         Everything below the wisdom board is thrown away and comes
         back as CATEGORIES — five sections, each a real object in its
         own spectrum colour (18:00Z flow: magenta -> purple -> indigo
         -> cyan -> green, cycling, never adjacent doubles): THE DAY ·
         THE RECORD · THE WORLD AROUND · YOUR WORLDS · EVERYDAY LIFE.
         The 15 doors live inside the categories as rows, never a loose
         grid; the boards (Appointments, Timeline, Daily Intelligence,
         Smart Notes, Notes, Posts) are the categorized sections,
         rebuilt. The life board's rows move into THE RECORD; its

      .daystep {
        display: flex; align-items: center; justify-content: center;
        gap: 12px; flex-wrap: wrap;
        padding-top: clamp(2px, 0.6vmin, 6px);
      }
      .daystep-btn {

      }

      .daystep-btn:active { transform: scale(0.97); }

        box-shadow:
          0 0 12px rgba(255, 255, 255, 0.18),

      .addsrc-pill {
        margin-left: auto; flex: none;
        min-height: 40px; padding: 5px 16px; border-radius: 999px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: var(--type-small); font-weight: 800; letter-spacing: 0.08em;
        text-transform: uppercase; color: #ffffff; white-space: nowrap;
        background: linear-gradient(180deg, #17171f, #08080d);

      }
      .addsrc-pill:hover { transform: translateY(-1px); filter: brightness(1.22); }
      .addsrc-pill:active { transform: scale(0.97); }
      /* ---------- v17 — THE CATEGORY SECTION ----------
         One idea per section, a real object: obsidian slab in the
         room's day colour, its OWN spectrum colour as rim + glow
         outside, white inside. The section lights whole on hover —
         the board itself lights, not just its rim. The spectrum
         flows through the sections in order (laws §3.2, 18:00Z):
         magenta -> purple -> indigo -> cyan -> green, and inside
         each section the rows keep flowing, never two same colours
         together. Least words: a title, one essence line, then the
         rows — each row a door that goes deeper, never away. */
      .cat {
        flex: none; border-radius: 22px; padding: clamp(16px, 2.4vmin, 26px);
        background: linear-gradient(180deg, #151522 0%, #090910 78%, #050508 100%);
        border: 1.5px solid color-mix(in srgb, var(--cc) 55%, transparent);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -12px 18px rgba(0,0,0,.35), 0 14px 30px rgba(0,0,0,.55), 0 0 12px color-mix(in srgb, var(--cc) 14%, transparent);
        transition: box-shadow .3s ease, border-color .3s ease, transform .3s ease;
      }

      .cat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
      .cat-jewel { width: 15px; height: 15px; border-radius: 3px; flex: none; transform: rotate(45deg); background: linear-gradient(135deg, #ffffff 0%, var(--cc) 42%, color-mix(in srgb, var(--cc) 45%, #000000) 100%); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 0 14px var(--cc), inset 0 1px 2px rgba(255,255,255,.9), 0 3px 6px rgba(0,0,0,.6); }
      .cat-title {
        margin: 0; font-family: "Marcellus", serif; font-weight: 400;
        font-size: var(--type-headline); letter-spacing: 0.14em; text-transform: uppercase; color: #ffffff;
        text-shadow: 0 0 12px color-mix(in srgb, var(--cc) 45%, transparent);
      }
      .cat-essence { margin: 0 0 12px 27px; font-size: var(--type-small); font-weight: 600; color: #ffffff; line-height: 1.5; }
      .cat-rows { display: flex; flex-direction: column; }
      /* HARVESTED — the unfold (agreement-unfold-20261117, blob
         c7b14a98; its own header says these lines are byte-for-byte
         from deck-royal-unfolding.html, blob 331496bd). The day view
         takes the agreement's unfold as its spine (Shawn 00:19Z):
         each section behind a button, click and the next thing
         unfolds. .p3-enter is the elite system button; .deck-next
         lights it in the section's --tone; .letter-controls centres
         it; [hidden] folds a section; .cat.reveal plays the
         letter-in rise on the section just opened (the agreement's

         of the beat). */
      .p3-enter{position:relative;overflow:hidden;display:block;margin:12px auto 0;padding:16px 46px;border-radius:999px;font-size:17px;font-weight:800;letter-spacing:.05em;color:#fff;cursor:pointer;background:linear-gradient(180deg,#1b1b24,#050507);border:2px solid #8e24aa;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 12px rgba(142,36,170,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -4px 8px rgba(0,0,0,.55),0 0 24px -4px #8e24aa,0 10px 22px rgba(0,0,0,.55);transition:box-shadow .25s,transform .25s,border-color .25s}
      .p3-enter::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%);transform:translateX(-130%);animation:enterFlow 4.5s ease-in-out infinite;pointer-events:none}
      @keyframes enterFlow{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
      .p3-enter:hover,.p3-enter:active{border-color:#8e24aa;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.5),0 0 38px -2px #8e24aa,0 12px 26px rgba(0,0,0,.6);transform:translateY(-2px)}
      .letter-controls{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:13px;position:relative;z-index:2}
      .letter-controls[hidden]{display:none}
      .letter-next{padding:13px 30px;font-size:17px}
      .deck-next{border-color:var(--tone);text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 12px var(--tone);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -4px 8px rgba(0,0,0,.55),0 0 24px -4px var(--tone),0 10px 22px rgba(0,0,0,.55)}
      .deck-next:hover,.deck-next:active{border-color:var(--tone);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.5),0 0 38px -2px var(--tone),0 12px 26px rgba(0,0,0,.6);transform:translateY(-2px)}
      .deck-next[hidden]{display:none}
      .cat[hidden]{display:none}
      .cat.reveal{animation:letter-in .7s cubic-bezier(.22,1,.36,1)}

      @media (prefers-reduced-motion: reduce){.cat.reveal{animation:none!important}}
      /* The category row — the life board's row anatomy, kept verbatim
         and renamed: icon chip in the row's own colour, the label, the
         glimpse in the day's own words (or the honest line when there
         is nothing yet), the count badge, the chevron. One row, one
         door. The row lights in its own colour on hover. */
      .cat-row {
        --c: #fff;

        padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,.09);

        transition: background .25s ease, transform .25s ease, box-shadow .25s ease;
      }
      .cat-row:last-of-type { border-bottom: none; }
      .cat-row:hover { background: color-mix(in srgb, var(--c) 14%, transparent); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.4), 0 0 12px color-mix(in srgb, var(--c) 18%, transparent); }
      .cat-row .chip {
        flex: none; width: 42px; height: 42px; border-radius: 12px;

        border: 1px solid color-mix(in srgb, var(--c) 65%, transparent);

        /* v18 — the glimpse reads whole (up to two lines) or clamps
           cleanly at a line break — never a mid-word cut */
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; overflow-wrap: break-word;
      }
      .cat-row .badge {
        flex: none; min-width: 34px; height: 34px; padding: 0 9px; border-radius: 999px;
        display: inline-flex; align-items: center; justify-content: center;
        border: 1.5px solid var(--c); color: #fff; font-size: var(--type-small); font-weight: 900;

      /* The unknown-state plaque — the zero rule, RULED 17:28Z: a real

      .state-pill {
        display: inline-flex; align-items: center; min-height: 44px; padding: 6px 18px; border-radius: 999px;
        font-size: var(--type-small); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff;

/* THE SIGNATURE PIECE (Shawn, 2026-11-18 15:17Z — replaces the Hz jewel
   and its text, same spot, both files): circles within circles, pearl
   flow, the day's colour. A real physical object — obsidian glass disc,
   brushed-metal ring, a pearl sphere in the day's colour with a top-left
   specular highlight, two slow pearl-bead orbits (60s / 90s reverse), a
   slow sheen across the pearl. The colour IS the frequency: no Hz text
   on or beside it, ever. --dc is the day's colour (Laws §3.3), set live. */
.sigpiece{position:relative;flex:none;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#2c3044 0%,#13131f 52%,#050607 100%);
  border:2px solid color-mix(in srgb,var(--dc,#fff) 78%,#ffffff 22%);
  box-shadow:0 8px 16px rgba(0,0,0,.65),0 0 14px color-mix(in srgb,var(--dc,#fff) 28%,transparent),inset 0 2px 3px rgba(255,255,255,.4),inset 0 -8px 12px rgba(0,0,0,.7)}
.sp-metal{position:absolute;inset:7px;border-radius:50%;
  /* Seamless wrap: 0% and 100% are the SAME silver, so no hard seam
     where the conic closes (the 3x read caught a diagonal crack);
     fine repeating stripes over the top read as brushed metal. */
  background:
   repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0deg 1deg,transparent 1deg 3deg),
   conic-gradient(from 210deg,#b9bdc6 0%,#e8e8ec 12%,#9a9ea8 28%,#4a4e5a 45%,#c8ccd6 62%,#7a7e88 80%,#e8e8ec 92%,#b9bdc6 100%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.75),inset 0 -2px 4px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.6)}
.sp-pearl{position:absolute;inset:14px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#ffffff 0%,color-mix(in srgb,var(--dc,#fff) 55%,#ffffff) 32%,var(--dc,#fff) 62%,color-mix(in srgb,var(--dc,#fff) 45%,#000000) 100%);
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.45),inset 0 3px 6px rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.6),0 0 16px color-mix(in srgb,var(--dc,#fff) 45%,transparent);
  animation:sigbreathe 12s ease-in-out infinite alternate}
.sp-pearl::before{content:"";position:absolute;top:5px;left:7px;width:12px;height:8px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);transform:rotate(-20deg)}
.sp-pearl::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);transform:translateX(-130%);animation:sigsheen 7s ease-in-out infinite}
