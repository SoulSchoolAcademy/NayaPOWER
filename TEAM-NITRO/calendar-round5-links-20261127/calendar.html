   Smart Block, smartly formatted so it fits perfect. (The Intelligent Block
   remains the universal POSTING format — that standing law is unchanged;
   the names are not conflated: this class is the display block only.)
   THE SMART FLOW is the day view's mode: the unfold, going DOWN (the Smart
   Show — the slideshow, going ACROSS — is the deck/About/Skills mode and is
   NOT built into the calendar). The whole game: maximize the user's
   experience by giving 10-star service through the ultimate formatting for
   their viewpoint — each block is judged against that, not just "does it
   fit". The look: real, high tech, premium high-end software — something
   smart like a Naya — and the royal-kingdom bar.
   Rules, all in force here:
   (1) FULL SCREEN — the day view fills the screen edge to edge, the chamber
       frame as its edge. The panel is 100% x 100% to the frame; pop-ups OVER
       it (the Meet room) stay at 85% (90% small) so the frame stays visible
       around them.
   (2) ONE VISUAL PER BLOCK — a visual gets its own block; never two in one.
       The portal art gets its own block (Block 1, the chamber) — it no
       longer lives as a backdrop behind the panel, because the full-screen
       panel covers the backdrop; the art is seen once, framed.
   (3) IF IT DOESN'T FIT, IT GOES TO TWO SCREENS — a section that won't fit
       one screen SPLITS; never squeeze, never overflow, never leave anything
       half-aligned. The split points are measured by the probe and named in
       the report (width-conditional in dayScreenHTML / renderCategories). A
       block never scrolls internally: overflow hidden.
   (4) NO MORE SCROLLING — down is by button only (Keep reading ◆); the
       top-left back is the only back on every screen (live dictation §5);
       the last block's Keep reading walks to the next day. The panel/day-scroll never scroll in flow
       mode — scrollTop stays 0; the only movement is the button-driven unfold.
   (5) OPTIMIZE FOR PRESENTATION — every block is a new presentation,
       perfectly formatted for the exact screen it's on. Life with Naya is the
       model: one glowing object at the centre, sparseness is the luxury, one
       thing at a time. Content centres at a readable 1100px in the wide
       block; at phone width it fills the screen. Each block its own
       theme/color (its --cc, inside the day's family), with a BREAK between
       blocks — the fold line in the block's own color.
   The frame is the thing each block locks INTO. On unfold the new block comes
   into the screen, pops out toward the viewer a little (scale 1.008, lift
   -2px), and settles exactly in the viewport. */
.smart-block{position:relative;flex:1;min-height:0;flex-direction:column;justify-content:safe center;overflow:hidden;
  border-top:2px solid color-mix(in srgb,var(--cc,var(--dc,#3fb8ff)) 60%,transparent);
  padding-top:20px;padding-bottom:76px}
.smart-block>*{max-width:1100px;width:100%;margin-left:auto;margin-right:auto}
#panelContent .smart-block{margin-top:0}
#dayScroll .smart-block{margin-top:0}
/* One block at a time: the viewer shows exactly one .smart-block (class
   .on); the rest are display:none. #catsWrap is display:contents so the
   three category blocks are flex items of #dayScroll directly. */
.panel.flow #panelContent .smart-block{display:none}
.panel.flow #panelContent .smart-block.on{display:flex}
#dayScroll .smart-block{display:none}
#dayScroll .smart-block.on{display:flex}
#catsWrap{display:contents}
/* Flow mode: the panel is a column (daybar fixed, one block filling the
   rest) and never scrolls; view mode keeps the v1 scroll. The day-scroll
   never scrolls in the day view. */
.panel.flow{overflow:hidden;display:flex;flex-direction:column}
.panel.flow #panelContent{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.panel.flow #panelContent .pdaybar{flex:none}
.panel:not(.flow) #panelContent{max-width:1100px;margin-inline:auto;width:100%}
.day-scroll{overflow:hidden}
/* THE 16:9 VISUAL SLOT (16:12Z clarification): images and video are 16:9
   and interchangeable — a <video> drops into this same frame. The portal art
   is filed verbatim; the rework toward the emblem's language is LIGHT over
   it — a platinum-white top light (::after) and the platinum frame with the
   day's rim — the purple kept in the diamonds and the frame. */
.smart-visual{aspect-ratio:16/9;width:100%;max-width:1100px;margin-inline:auto;position:relative;overflow:hidden;
  border:2px solid var(--dc,#3fb8ff);border-radius:18px;background:#050607;
  box-shadow:0 12px 32px rgba(0,0,0,.6),0 0 28px color-mix(in srgb,var(--dc,#3fb8ff) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.smart-visual img{width:100%;height:100%;object-fit:cover;display:block}
.smart-visual::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(232,232,236,.20) 0%,transparent 34%,transparent 78%,rgba(5,6,7,.28) 100%)}
/* THE BLOCK NAV — pinned to the bottom of the screen, inside the frame:
   Keep reading ◆ DEAD CENTRE by the grid's math, the day before on its
   left and the day after on its right. The top-left back is the only
   Back (live dictation §5 — the small ‹ Back pill duplicated it, so it
   is gone). On the last block Keep reading walks to the next day. */
.sb-nav{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;width:min(1100px,100%);
  display:flex;justify-content:space-between;align-items:center;gap:12px}
/* THE POP: the block comes into the screen, pops out toward the viewer a
   little (scale 1.008, lift -2px), and settles exactly. 450ms, one beat. */
@keyframes smartpop{0%{opacity:0;transform:translateY(18px) scale(.965)}
  60%{opacity:1;transform:translateY(-2px) scale(1.008)}
  100%{opacity:1;transform:translateY(0) scale(1)}}
.smart-block.smart-pop{animation:smartpop .45s cubic-bezier(.2,.7,.3,1.2) both}
/* THE MEET ROOM POP-UP (16:12Z rule 1): the room is a pop-up OVER the day
   view — 85% of the screen (90% at phone width), so the chamber frame stays
   visible around it. The day view stays rendered underneath; Leave returns
   to it. The room keeps the panel's own look (obsidian, white rim, purple
   glow) at pop-up size. */
.meet-pop{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(2,1,6,.66);backdrop-filter:blur(4px)}
.meet-pop[hidden]{display:none}
.meet-pop .meet-card{width:min(1100px,85%);max-height:85dvh;overflow:auto;
  background:radial-gradient(ellipse at 50% 0,#30164f 0,transparent 55%),linear-gradient(180deg,#160b27,#070510 80%);
  border:1.5px solid rgba(255,255,255,.9);border-radius:26px;
  box-shadow:0 0 45px rgba(142,36,170,.5),0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2);
  padding:clamp(15px,2.1vw,26px)}
@media(max-width:740px){.meet-pop .meet-card{width:90%;max-height:90dvh}}

/* ============ V3 — FIX ROUND (checker GOES BACK on v2, 2026-11-18) ============ */
/* THE PINNED BLOCK INDICATOR (from the pricing study: the pricing page's
   12 dots scroll out of view once you advance the letter — these do not.
   They ride the block's own nav cluster, pinned above the nav row on every
   screen, the current lit in the day's color, tappable to jump to that
   block. The count is the LIVE block count — split blocks count too — so
   the number of dots is the number of screens (5 to 9 by file and width). */
.sb-dots{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;display:flex;gap:8px;align-items:center;justify-content:center;z-index:2}
.sb-dots button{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:#0b0b12;cursor:pointer;padding:0;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.sb-dots button:hover{transform:scale(1.25)}
.sb-dots button.lit{background:var(--dc,#3fb8ff);border-color:#fff;box-shadow:0 0 10px var(--dc,#3fb8ff);transform:scale(1.25)}
@media(max-width:560px){.sb-dots{gap:6px;bottom:72px}.sb-dots button{width:10px;height:10px}}
/* ONE-LINE GLIMPSE AT PHONE WIDTH (rule 5, per-width format — the v2
   record fix, extended to every day-file row: at ≤740px the glimpse reads
   one line so six rows fit one screen; the row still opens its door, where
   the whole text lives). */
@media(max-width:740px){.cat-rows .lr-g{-webkit-line-clamp:1}}
/* COMPACT NOTIFICATION CARDS AT PHONE WIDTH (rule 5: at ≤410px the three
   scope cards tighten — padding, gap, pill, head — so the cards block fits
   one screen at 390; the name, the sub and the state pill all stay). */
@media(max-width:410px){
  .nblock{min-height:0;padding:8px 12px;gap:6px}
  .nblock .state-pill{min-height:32px;padding:4px 14px}
  .notif-head{font-size:19px;gap:8px;margin-bottom:10px}
  .addsrc-pill{padding:4px 12px;min-height:32px;font-size:17px}
}

/* ============ V4 — FIX ROUND (checker GOES BACK on v3 + eye blockers, 2026-11-18) ============ */
/* BLOCKER 1 — the open scope's detail menu scrolls inside its own region.
   At 1920, Personal unfolded is 7 rows + head + sub — taller than the
   block — and the block is overflow:hidden with no scroll, so the last
   rows slid under the fixed nav/dots and Shares could not be reached.
   The detail is now a shrinking flex item (it was flex:none, so it could
   never shrink): it takes the space left after the head, the essence and
   the scope cards, and scrolls inside it, with a visible scrollbar in
   the scope's own colour. The cards, the head, the nav and the dots never
   move. Chosen over compacting the rows (content-driven height — the
   per-row source lists expand further — so compaction cannot guarantee
   fit at 1920 or 390) and over moving the dots/nav (that would break the
   v3 pinned-indicator law). */
.smart-block .notif-detail{flex:0 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--sc,#3fb8ff) rgba(255,255,255,.12)}
.smart-block .notif-detail::-webkit-scrollbar{width:10px}
.smart-block .notif-detail::-webkit-scrollbar-track{background:rgba(255,255,255,.08);border-radius:999px}
.smart-block .notif-detail::-webkit-scrollbar-thumb{background:var(--sc,#3fb8ff);border-radius:999px;border:2px solid #090910}
/* MUTED SUBLINES — every subline under the Notifications, Appointments and
   Record rows is explicit layered white: pure #fff with the black depth
   layer, so it reads bright white beside the bold labels instead of
   muted. (No muted hex exists in the code — the sublines were flat
   regular-weight white with no depth layer; the layer is the fix.) */
.cat-row .lr-g,.nb-sub,.nd-sub,.nd-src,.cat-essence,.tl-row .te,.tile-appt-row .tt,.tile-empty,.intel-line,.door .sub2,.sub,.daytimeline .tl-sub,.tl-text,.tl-note,.tl-empty,.recrow .rl span,.list li,.hint,.pwx,.viewcard p,.pcat-essence{color:#fff;text-shadow:0 1px 0 #000,0 2px 3px rgba(0,0,0,.7)}

/* ============ V5 — FIX ROUND (eye GOES BACK on v4, 2026-11-18) ============ */
/* (2) SHORT VIEWPORTS — at 340px tall the absolute nav row and dots sit
   on the centred content (Back over heading letters, Keep reading over
   sublines). At short heights the block top-aligns and scrolls, and the
   nav row and dots flow in place below the content instead of overlaying
   it. At normal heights the nav and dots stay pinned and only the detail
   scrolls. No text shrinks below the 17px floor. */
@media (max-height:480px){
.smart-block{justify-content:flex-start!important;overflow-y:auto!important;padding-bottom:24px!important}
.sb-nav{position:static!important;transform:none!important;margin-top:16px;flex:none}
.sb-dots{position:static!important;transform:none!important;margin-top:10px;flex:none}
}
/* (4) BRAND MARKS — Shawn 18:44Z, his word wins over Laws §4 here: the
   LOGO (the N in a circle) goes TOP LEFT; the ICON (the emblem crest)
   goes BOTTOM RIGHT. NO glow on either mark. Behind both, obsidian
   black, so no square edge shows at all — the marks feel part of the
   natural calendar. The mounts are transparent on the obsidian page,
   circular-clipped, with a real drop shadow only (no coloured glow). */
.logo,.dlogo,.corner-n{background:transparent!important;border:none!important;border-radius:50%!important;overflow:hidden!important;box-shadow:0 8px 20px rgba(0,0,0,.65)!important}
.logo img,.dlogo img,.corner-n img{filter:drop-shadow(0 4px 8px rgba(0,0,0,.7))!important}
.logo:hover,.dlogo:hover,.corner-n:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.7)!important}
.logo:active,.dlogo:active,.corner-n:active{transform:scale(.97)}
/* (5) THE DATE, ALIVE — the date line is a living plaque in the day's
   colour (Kanye blue #3fb8ff on Wednesday, the day's own colour every
   other day): obsidian pill, rim and underglow in the day's colour,
   breathing slowly. The weekday stays white (settled law) and its
   light is the day's colour, brighter now so Wednesday reads Kanye blue. */
.hl-date,.phl-date{display:inline-flex;align-items:center;background:linear-gradient(180deg,#171720,#0a0a11 60%,#050507);border:1.5px solid var(--dc,#3fb8ff);border-radius:999px;padding:8px 16px;box-shadow:0 0 16px color-mix(in srgb,var(--dc,#3fb8ff) 45%,transparent),0 8px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35);animation:datelive 6s ease-in-out infinite}
@keyframes datelive{0%,100%{box-shadow:0 0 12px color-mix(in srgb,var(--dc,#3fb8ff) 35%,transparent),0 8px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 28px color-mix(in srgb,var(--dc,#3fb8ff) 60%,transparent),0 10px 22px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.45)}}
.hl-weekday,.phl-weekday{text-shadow:0 -1px 0 rgba(255,255,255,.28),0 2px 3px rgba(0,0,0,.85),0 0 18px color-mix(in srgb,var(--dc,#3fb8ff) 65%,transparent)}
/* (6) BUTTONS ALIVE, TO THE CIRCLE-N STANDARD — every button is the
   circle N's construction: obsidian gradient, rim in its own colour,
   inset top light, deep bottom shade, underglow in its own colour,
   lift on hover, press to 0.97. Harvested from .corner-n, never remade. */
.pill{border:2px solid color-mix(in srgb,var(--dc,#8e24aa) 75%,#ffffff 25%)!important;background:linear-gradient(135deg,#232330 0%,#0b0b12 55%,#050507 100%)!important;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -4px 8px rgba(0,0,0,.55),0 0 16px color-mix(in srgb,var(--dc,#8e24aa) 35%,transparent),0 8px 18px rgba(0,0,0,.6)!important}
.pill:hover{transform:translateY(-2px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.5),0 0 28px color-mix(in srgb,var(--dc,#8e24aa) 55%,transparent),0 12px 24px rgba(0,0,0,.65)!important}
.pill:active{transform:scale(.97)}
.door,.cat-row,.recrow{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -4px 8px rgba(0,0,0,.5),0 0 16px color-mix(in srgb,var(--c,#8e24aa) 30%,transparent),0 8px 18px rgba(0,0,0,.55)}
.door:hover,.cat-row:hover,.recrow:hover{transform:translateY(-2px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -4px 8px rgba(0,0,0,.5),0 0 28px color-mix(in srgb,var(--c,#8e24aa) 55%,transparent),0 12px 24px rgba(0,0,0,.6)}
.door:active,.cat-row:active,.recrow:active{transform:scale(.97)}
.viewbtn{border-width:2px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.5),0 0 12px color-mix(in srgb,var(--dc,#3fb8ff) 35%,transparent),0 6px 14px rgba(0,0,0,.55)!important}
.viewbtn:hover{transform:translateY(-2px)}
.viewbtn:active{transform:scale(.97)}
.stats-btn,.navbtn,.backbtn,.close{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -4px 8px rgba(0,0,0,.5),0 0 16px color-mix(in srgb,var(--dc,#3fb8ff) 35%,transparent),0 8px 18px rgba(0,0,0,.6)}
.stats-btn:hover,.navbtn:hover,.backbtn:hover,.close:hover{transform:translateY(-2px)}
.stats-btn:active,.navbtn:active,.backbtn:active,.close:active{transform:scale(.97)}
/* (6) THE INFO EYE, ALIVE IN THE DAY'S COLOUR — the little "i" jewel
   takes the viewed day's colour as its rim, bright and lit. On
   Wednesday that is Kanye blue #3fb8ff, by the data-day-theme rule.
   The white eye on a black middle (Laws §8) is kept. */
.tile .ijewel,.pback.eye,.backbtn .jewel{border-color:color-mix(in srgb,var(--dc,#3fb8ff) 80%,#ffffff 20%)!important;box-shadow:0 3px 7px rgba(0,0,0,.6),0 0 14px color-mix(in srgb,var(--dc,#3fb8ff) 55%,transparent),inset 0 1px 2px rgba(255,255,255,.4)!important}
html[data-day-theme="wednesday"] .tile .ijewel,html[data-day-theme="wednesday"] .pback.eye,html[data-day-theme="wednesday"] .backbtn .jewel{border-color:#3fb8ff!important;box-shadow:0 3px 7px rgba(0,0,0,.6),0 0 14px rgba(63,184,255,.6),inset 0 1px 2px rgba(255,255,255,.4)!important}

/* (1b) THE DETAIL SCROLLBAR, GENUINELY VISIBLE — the v4 thumb was 10px
   with a dark border and a barely-there track; the eye saw no thumb
   and no track at 621, and the cards, head, nav and dots scrolled out
   of view. The rail is now 12px, always shown, the track a visible
   pale rail, the thumb solid in the scope's colour; the scroll is
   contained to the detail so the rest never moves. */
.smart-block .notif-detail{overflow-y:scroll!important;scrollbar-width:auto!important;scrollbar-color:var(--sc,#3fb8ff) rgba(255,255,255,.16)!important;overscroll-behavior:contain}
.smart-block .notif-detail::-webkit-scrollbar{width:12px!important}
.smart-block .notif-detail::-webkit-scrollbar-track{background:rgba(255,255,255,.12)!important;border-radius:999px}
.smart-block .notif-detail::-webkit-scrollbar-thumb{background:var(--sc,#3fb8ff)!important;border-radius:999px;border:2px solid #090910}
/* (3) ONE JEWEL AND ONE COLOUR PER CHAPTER — spectrum order, never the
   same colour twice in a row (Laws §3.2). Follow-on 2026-11-18: the
   notification-family blocks take the DAY's colour as their rim now
   (live dictation §6/§7 — the centre's frame lights in the day colour);
   the jewels stay diamond / orb / faceted hex. Each jewel is a real
   jewel object, never a flat dot. */
.cat.jewel-orb .cat-jewel{border-radius:50%;transform:none;background:radial-gradient(circle at 34% 26%,#ffffff 0%,var(--cc) 55%,color-mix(in srgb,var(--cc) 45%,#000000) 100%)}
.cat.jewel-hex .cat-jewel{border-radius:3px;transform:none;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
    
/* ============ V6 — CALENDAR ALIGNMENT (Shawn 2026-11-18 22:04Z; day view is the page) ============ */
/* THE KINGDOM BORDER — the portal art lives ON the border, all the way around.
   96px desktop / 64px tablet / 32px phone; never under 24, never over 96.
   The border is part of the interface: screens sit INSIDE it, nothing under it. */
:root{--bw:96px}
@media(max-width:1024px){:root{--bw:64px}}
@media(max-width:560px){:root{--bw:32px}}
.screen{flex:none!important;margin:var(--bw,96px) var(--bw,96px) 0!important;height:calc(100vh - 2*var(--bw,96px))!important;height:calc(100dvh - 2*var(--bw,96px))!important}
.royal-frame{border:0!important;border-image:none!important;box-shadow:none!important}
.royal-frame::after{content:"";position:absolute;inset:var(--bw,96px);border:2px solid var(--dc,#3fb8ff);border-radius:4px;box-shadow:0 0 24px color-mix(in srgb,var(--dc,#3fb8ff) 35%,transparent),inset 0 0 48px rgba(5,6,7,.85);pointer-events:none}
.royal-frame .rf-c,.royal-frame .rf-seal{position:absolute;width:var(--em);height:var(--em);border-radius:50%;object-fit:contain;background:transparent!important;border:none!important;box-shadow:0 4px 12px rgba(0,0,0,.6);animation:none!important}
.royal-frame .rf-c.tl{top:calc(var(--bw,96px)/2 - var(--em)/2);left:calc(var(--bw,96px)/2 - var(--em)/2);transform:rotate(135deg)}
.royal-frame .rf-c.tr{top:calc(var(--bw,96px)/2 - var(--em)/2);right:calc(var(--bw,96px)/2 - var(--em)/2);transform:rotate(225deg)}
.royal-frame .rf-c.bl{bottom:calc(var(--bw,96px)/2 - var(--em)/2);left:calc(var(--bw,96px)/2 - var(--em)/2);transform:rotate(45deg)}
.royal-frame .rf-c.br{bottom:calc(var(--bw,96px)/2 - var(--em)/2);right:calc(var(--bw,96px)/2 - var(--em)/2);transform:rotate(-45deg)}
.royal-frame .rf-seal{left:calc(50% - var(--em)/2)}
.royal-frame .rf-seal.top{top:calc(var(--bw,96px)/2 - var(--em)/2)}
.royal-frame .rf-seal.bottom{bottom:calc(var(--bw,96px)/2 - var(--em)/2)}
/* The crystal N sits INSIDE the interface now, off the frame (eye fix 3) —
   16px inside the screen's bottom-right corner, so all four corner seals stay whole. */
.corner-n{width:80px!important;height:80px!important;right:calc(var(--bw,96px) + 16px)!important;bottom:calc(var(--bw,96px) + 16px)!important;z-index:41!important;background:linear-gradient(135deg,#232330 0%,#0b0b12 55%,#050507 100%)!important;border:2px solid #8e24aa!important}
@media(max-width:560px){.corner-n{width:40px!important;height:40px!important;right:calc(var(--bw,96px) + 12px)!important;bottom:calc(var(--bw,96px) + 12px)!important}.corner-n img{width:28px!important;height:28px!important}}
/* (1) DATE LINE — "November 18th 2026", weekday lit in the day's colour (computed, never hard-coded). */
.hl-date{text-transform:none!important}
/* (2) THE LITTLE "i" — solid day-colour rim everywhere; the middle stays black so the "i" reads. */
.cell .jewel{border-color:var(--dc,#3fb8ff)!important;box-shadow:0 0 12px color-mix(in srgb,var(--dc,#3fb8ff) 55%,transparent),inset 0 1px 2px rgba(255,255,255,.35),inset 0 -3px 5px rgba(0,0,0,.7)!important}
.backbtn.eye{border-color:var(--dc,#3fb8ff)!important;box-shadow:0 0 14px color-mix(in srgb,var(--dc,#3fb8ff) 55%,transparent),inset 0 1px 2px rgba(255,255,255,.35),inset 0 -3px 5px rgba(0,0,0,.7)!important}
/* (3) BACK TO MONTH as words, beside the eye. */
.daybar>.backbtn.eye{width:auto!important;height:46px;padding:0 18px 0 6px!important;gap:10px;display:inline-flex!important;align-items:center}
.daybar>.backbtn.eye .jewel{width:36px!important;height:36px!important;flex:none!important}
.daybar>.backbtn.eye .btw{font-size:17px;font-weight:800;letter-spacing:.14em;color:#fff;white-space:nowrap}
@media(max-width:560px){.daybar>.backbtn.eye{width:46px!important;padding:0!important;gap:0}.daybar>.backbtn.eye .btw{display:none}}
/* (4) BRAND MARKS — no glow on either; drop shadow only, never a colour glow. */
.dlogo img,.corner-n img{filter:drop-shadow(0 4px 8px rgba(0,0,0,.7))!important}
/* (5) SCROLLBARS in the day's colour — the page scrollbar AND the dialog scrollbar. */
html{scrollbar-color:var(--dc,#3fb8ff) rgba(255,255,255,.12);scrollbar-width:thin}
html::-webkit-scrollbar{width:12px}
html::-webkit-scrollbar-track{background:rgba(255,255,255,.08)}
html::-webkit-scrollbar-thumb{background:var(--dc,#3fb8ff);border-radius:999px;border:2px solid #090910}

/* ============ V6.1 — LIVE-PROBE FIXES (maker's own eye, staged v6 build, 1920px) ============
   The probe caught three geometry errors in the v6 frame/header. All three are
   position arithmetic, not taste — fixed here, measured again after filing.
   (a) The frame's abs-positioned children position against the frame's PADDING
   box (which starts INSIDE the 96px border), so the V6 offsets landed 96px too
   far in: corner emblems and seals sat inside the content, the top seal over
   the clock tiles, the bottom seal over "Keep reading", and the inner rim
   floated at inset 192px instead of hugging the content edge. The correction
   is -var(--bw)/2 - var(--em)/2 (centre the emblem ON the ring) and inset:0
   for the rim (the padding box IS the content edge).
   (b) The wide BACK TO MONTH pill (absolute, top-left) covered "Wedne" of the
   weekday: the headliner grid's margin was sized for a 46px circle. Desktop
   now gives the headliner symmetric 260px margins — the clock stays dead
   centre, the left cell wraps to two lines (square+weekday / date pill, the
   wrap the base flex already designed for) and clears the pill. The pill's
   letter-spacing tightens .14em -> .06em so it ends before the grid starts.
   (c) At <=1024px the pill goes in-flow on its own row above the headline
   (flex column daybar) so the words show at every width with no overlap. */
.royal-frame::after{inset:0!important}

/* ============ V6.2 — CALC GOTCHA FIX (maker's own eye, staged v6.1 build) ============
   v6.1's corner/seal offsets NEVER APPLIED: all six emblems fell to their
   static position (measured centre 128,128 at 1920 — the padding-box origin)
   instead of the ring (48,48). Root cause, proven by the bytes: the offset
   was written calc(-var(--bw,96px)/2 - var(--em)/2). In CSS tokenization a
   leading "-var(" is NOT "minus + var()" — it is a FUNCTION token named
   "-var" (identifiers may start with a hyphen), an unknown function, so the
   calc is invalid at computed-value time; the !important invalid declaration
   still wins the cascade and then resolves to the property's initial value
   (top:auto). The valid V6 calc underneath it lost. The seals proved it:
   their left:calc(50% - var(--em)/2) (no leading minus) DID apply (x=960).
   Fix: literal offsets, no calc at all — they cannot fail to parse.
   Arithmetic (emblem centred ON the ring): -(bw/2 + em/2); em = max(28,
   bw*.66): desktop bw 96 em 63.36 -> -79.68 ~ -80px; tablet bw 64 em 42.24
   -> -53.12 ~ -53px; phone bw 32 em 28 -> -30px. */
.royal-frame .rf-c.tl{top:-80px!important;left:-80px!important}
.royal-frame .rf-c.tr{top:-80px!important;right:-80px!important}
.royal-frame .rf-c.bl{bottom:-80px!important;left:-80px!important}
.royal-frame .rf-c.br{bottom:-80px!important;right:-80px!important}
.royal-frame .rf-seal.top{top:-80px!important}
.royal-frame .rf-seal.bottom{bottom:-80px!important}
@media(max-width:1024px){.royal-frame .rf-c.tl{top:-53px!important;left:-53px!important}.royal-frame .rf-c.tr{top:-53px!important;right:-53px!important}.royal-frame .rf-c.bl{bottom:-53px!important;left:-53px!important}.royal-frame .rf-c.br{bottom:-53px!important;right:-53px!important}.royal-frame .rf-seal.top{top:-53px!important}.royal-frame .rf-seal.bottom{bottom:-53px!important}}
@media(max-width:560px){.royal-frame .rf-c.tl{top:-30px!important;left:-30px!important}.royal-frame .rf-c.tr{top:-30px!important;right:-30px!important}.royal-frame .rf-c.bl{bottom:-30px!important;left:-30px!important}.royal-frame .rf-c.br{bottom:-30px!important;right:-30px!important}.royal-frame .rf-seal.top{top:-30px!important}.royal-frame .rf-seal.bottom{bottom:-30px!important}}

.world-ico .world-badge{position:absolute!important;top:-8px!important;right:-8px!important;min-width:30px!important;height:30px!important;padding:0 7px!important;border-radius:999px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:17px!important;font-weight:900!important;color:#fff!important;background:linear-gradient(180deg,#17171f,#08080d)!important;border:1.5px solid var(--c,#fff)!important;box-shadow:0 0 10px color-mix(in srgb,var(--c,#fff) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.3)!important;z-index:2!important}
/* ============ FIX12 — calendar day follow-on, items 1,2,5,6,7,9,10,11,12,13 + A1,A2,A3 (2026-11-19) ============ */
/* (12)(A3) THE DAY'S COVER AS THE INNER-FRAME BACKGROUND — the cover
   image is a layer pinned behind the day's slides (the frame's own
   background, never over the content). The slides themselves are
   transparent boards, so the cover shows in the gaps between them.

   nav. #dayScroll is positioned so both layers anchor to it. */
#dayScroll{position:relative!important}
.day-cover-bg{position:absolute!important;inset:0!important;z-index:0!important;pointer-events:none!important;overflow:hidden!important}

/* ============ FIX14 — calendar day follow-on, 390 day view (2026-11-19) ============ */
/* (1) THE 390 DEFECT — reproduced on the fix-13 bytes: the Wisdom quote
   stayed 48px at 390 (FIX12 item 7, the desktop sweet-spot scale), so its
   box ran 54px past the viewport and the banner clipped it; the day
   header's one-column headliner kept 92/58px side margins against a
   309px nowrap monthline, so November lost its N at the left and the
   2026/Hz tiles ran past the right, while the vertically-centred orb
   sat on the monthline and the clock; the Weather pill wrapped to two
   lines and its bottom rim sat on the viewport edge, cut. All
   phone-only, all below: 48px at 1920 is untouched and reads beautifully.
   Round 2 (maker's own 390 re-read): the day-teach's last lines sat
   under the floating Change cover, and the banner's own content ran
   46px past its box — so the slide is tightened to fit, and Change
   cover flows below the wisdom slide only, where it can never cover
   text. */
@media(max-width:560px){
  /* HEADER — the orb anchors to the daybar's top-right corner (the
     dayhead stops being its positioned parent), beside Back to Month
     and clear of every headliner row; the vestigial clearance margins
     go, so the one-column headliner takes the full width and the 309px
     monthline fits whole on one line; the wrap is freed too, so the
     longest months (September, December) wrap to a second line instead
     of clipping — the FIX9e intent the line-2700 nowrap overrode.
     Back to Month keeps its label (FIX3 item 15, deliberate) and its
     own row. */
  .dayhead{position:static!important}
  .daybar .sigpiece{top:14px!important;right:14px!important;transform:none!important}
  .official-headliner{margin:0 16px!important}
  .hl-center .hl-monthline{white-space:normal!important}
  /* WISDOM — the FIX12 desktop scale steps back to the pre-FIX12
     proportions at phone width only, so the whole slide reads at 390:
     quote 48→32 (the certificate script size), label 25→17, greeting
     28→25, S orb 88→58, day-teach 19→17. Then the stack is tightened
     to fit the slide's 468px box: label on one line, quote and
     day-teach line-height down, the margins around them in. */
  #wisdomBanner blockquote{font-size:32px!important;line-height:1.25!important}
  #wisdomBanner .wq-label{font-size:17px!important;margin-bottom:8px!important;letter-spacing:.18em!important;text-indent:.18em!important}
  #wisdomBanner .greet-hello{font-size:25px!important}
  #wisdomBanner .avatar-jewel{width:58px!important;height:58px!important;font-size:25px!important}
  #wisdomBanner .greet-layout{gap:8px!important}
  #wisdomBanner .dayteach{font-size:17px!important;line-height:1.35!important;margin-top:8px!important;margin-bottom:8px!important}
  #wisdomBanner .wq-store{margin-top:8px!important}
  #wisdomBanner .greet-row{margin-bottom:8px!important}
  /* CHANGE COVER — on the wisdom slide only, the floating pill (which
     sat over the day-teach's last lines at 390) flows below the slide
     instead, and the deck scrolls so it is reachable; every other
     slide keeps the floating pill exactly as it was. */
  #dayScroll:has(#wisdomBanner.on){overflow-y:auto!important}
  #dayScroll:has(#wisdomBanner.on) #wisdomBanner{flex:none!important}
  #dayScroll:has(#wisdomBanner.on)>.cover-change{position:static!important;order:10!important;align-self:flex-end!important;flex:none!important;margin:12px 16px 0 auto!important}
  /* WEATHER — one line and fully visible: tighter tracking and padding
     so "Weather · Enter your city" fits its slot on one line, 44px
     tall, its bottom rim 4px clear of the viewport edge instead of
     cut by it. */
  .wx-bottomleft{bottom:4px!important}
  .wx-bottomleft .wx-btn{height:44px!important;padding:0 14px!important;letter-spacing:.02em!important;white-space:nowrap!important}
}
/* ============ FIX15 — calendar day follow-on, 390 readability, two items (2026-11-19) ============ */
/* (1) WEATHER PILL vs DAY-TEACH — reproduced on the fix-14 bytes by 7-day
   sweep at 390 in the no-webfont state (the state the fix-14 checker
   measured: Marcellus fallback, 5-line quotes): Wed 18 the pill covered
   the teach's closing words by 18px ("words said today travel." hidden)
   and Sat 21 by 41px ("honestly, look forward with care." hidden), the
   store line 32/55px below the fold. The quote stays 32px (its sweet
   spot) — the room is bought from spacing and flow instead, all
   phone-only: the day bar gives back 31px (its padding/gap/margin in,
   the headliner's bottom padding in), the wisdom stack tightens (banner
   padding 20->8, orb 58->50, greet/label/teach/store margins in, quote
   line-height 1.25->1.15, teach 1.35->1.25), the Weather pill steps down
   44->36px tall (still one line, still 4px clear), and Keep reading
   rides below the fold at rest (margin-top 160 on the nav — as on the
   fix-14 base in both font states — so the pill never slices it; one
   deck scroll reaches it). The two-ID selector is required: the base
   rule at line 2637 (#dayScroll #wisdomBanner .sb-nav) beats one ID.
   Proved by 7-day sweep in BOTH font states (webfonts loaded and
   blocked): day-teach and store line whole at rest on all seven days,
   pill one line, 4px clear; worst day Sat, store 7px clear of the pill. */
/* (2) YOUR WORLDS — reproduced on the fix-14 bytes at 390: a later
   repeat(6,1fr)!important rule (FIX12, six boards in one row) beat the
   repeat(3,1fr) rule, squeezing six cells to 39px with 29px icons;

   ("Messages" ~89px, "Connections" ~111px) overflow their cells and
   their glyphs touch — "MessageConnections" — and fallback glyphs run
   wider still. 2-across is the robust shape in both font states.)
   The slide's title/note chrome tightens so row 1 reads whole at rest;
   rows 2-3 ride the slide's own scroll, as on wisdom — both rows cannot

/* ITEM 1 — "November 2026" as ONE centered title line (Shawn, 2026-11-20 ~08:06 MST).
   MEASURED ON THE FIX-17 BYTES (Firefox + Chromium, 1920 and 390): the monthline
   was already dead-center at 1920 (cx 960 = viewport center in both browsers),

   inline-flex drops the whitespace-only text node between the two spans, so

   tiles centered on the script. No styling, color, or size changes — the

   the monthline, centered, in the same column; "Friday 20" stays left (1920)
   / centered in its own row (390); BACK TO MONTH stays left; Your Stats +
   orb stay right. Nothing else moves. */

   string (base line 4219), and nothing else in that line. The wisdom line
   (#dayTeach, two frequency mentions) and the WISDOM quote are untouched. */

   cover is actually visible (Shawn, 2026-11-20 ~08:10 MST, Notifications).

   Summary, Naya Notes, Smart Notes) at both widths, in both browsers —

        /* The day's jewel — a faceted gem in the day's own color, lit from
           the top, carrying the day's frequency beneath it in the header.

           itself fully opaque (the stone never lets the background show
           through), the crown brighter, the shadow facet deeper, a
           heavier rim and a deeper drop-shadow. Same facet geometry,
           harvested verbatim — only the material changed (Shawn,
           2026-11-17: the jewel must read as a real diamond) */
        function gemSVG(dc) {
          return '<svg class="gem" viewBox="0 0 72 72" aria-hidden="true" focusable="false">' +
            '<defs><linearGradient id="gemg" x1="0" y1="0" x2="0" y2="1">' +

            "</linearGradient></defs>" +
            '<path d="M14 27 26 13h20L58 27 36 59Z" fill="' + dc + '" stroke="none"/>' +
            '<path d="M14 27 26 13h20L58 27 36 59Z" fill="url(#gemg)" stroke="rgba(255,255,255,1)" stroke-width="2" stroke-linejoin="round"/>' +
            '<path d="M14 27h44M26 13l5 14 5 32M46 13l-5 14-5 32M31 27h10" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>' +
            '<path d="M26 13h20l-5 14H31Z" fill="#ffffff" opacity="0.55"/>' +
            '<path d="M31 27l5 32 5-32Z" fill="#ffffff" opacity="0.10"/>' +

            '<circle cx="27" cy="19" r="2.4" fill="#ffffff" opacity="0.95"/>' +
            '<circle cx="45" cy="21" r="1.5" fill="#ffffff" opacity="0.8"/>' +
            '<path d="M52 8l1.1 2.9L56 12l-2.9 1.1L52 16l-1.1-2.9L48 12l2.9-1.1Z" fill="#ffffff" opacity="0.9"/' +
            "</svg>";
        }
        function isToday(d) {
          return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
        }

        /* Weekday header — THE WORD IS THE OBJECT (Shawn, 2026-11-17,
           from his "Sun" mockup): each abbreviation is dark obsidian
           letters, the day's own colour as rim + glow around each
           letter, with the day's own icon above the word — one unique
           icon per day, for what the day represents (its chakra +
           frequency + colour, laws §3.3). Sun crown 963 Hz (his
           anchor) · Mon moon 417 Hz sacral, water, the Moon's day ·
           Tue sun 528 Hz solar plexus · Wed waves 741 Hz throat, the
           voice · Thu heart 639 Hz heart, love · Fri mountain 396 Hz
           root, the ground · Sat eye 852 Hz third eye, inner sight.
           The Wed–Sat icons are derived from the day's chakra and
           frequency, named here and in the maker report — never
           guessed silently. The little diamonds above the words and
           the rule below are gone. The full name rides as the title */
        var WEEKDAY_ICONS = ["crown", "moon", "sun", "waves", "heart", "mountain", "eye"];
        function renderWeekRow() {
          weekRow.innerHTML = WEEKDAY_ABBR.map(function (s, i) {
            var letters = s.split("").map(function (ch) { return '<span class="wk-l">' + ch + "</span>"; }).join("");
            return '<span class="wk-col" style="--dc:' + DAY_COLORS[i] + '" title="' + WEEKDAYS[i] + '">' +
              '<span class="wk-ico">' + ICONS[WEEKDAY_ICONS[i]] + "</span>" +
              '<span class="wk-word">' + letters + "</span></span>";
          }).join("");
          var viewingNow = viewY === now.getFullYear() && viewM === now.getMonth();
          weekRow.querySelectorAll(".wk-col").forEach(function (s, i) {
            s.classList.toggle("today-col", viewingNow && i === now.getDay());
          });
        }
        renderWeekRow();
        window.addEventListener("resize", renderWeekRow);

        function renderMonth() {
          /* The browsed month is named for screen readers only — the
             visible page says the date exactly once, in the plaque */
          grid.setAttribute("aria-label", "Days of " + MONTHS[viewM] + " " + viewY);
          /* The month name, big and centred up top (§5), in today's
             colour — and the range: a year ahead, a year behind */
          var mn = $("monthName");
          if (mn) { mn.textContent = MONTHS[viewM] + " " + viewY; mn.style.setProperty("--dc", DAY_COLORS[now.getDay()]); }
          var nowIdx = now.getFullYear() * 12 + now.getMonth(), viewIdx = viewY * 12 + viewM;
          var pm = $("prevMonth"), nm = $("nextMonth");
          if (pm) { pm.classList.toggle("off", viewIdx <= nowIdx - 12); pm.setAttribute("aria-disabled", viewIdx <= nowIdx - 12 ? "true" : "false"); }
          if (nm) { nm.classList.toggle("off", viewIdx >= nowIdx + 12); nm.setAttribute("aria-disabled", viewIdx >= nowIdx + 12 ? "true" : "false"); }
          /* Today's weekday plaque fills with its color — only while the
             month on screen is the month that holds today */
          var viewingNow = viewY === now.getFullYear() && viewM === now.getMonth();
          weekRow.querySelectorAll(".wk-col").forEach(function (s, i) {
            s.classList.toggle("today-col", viewingNow && i === now.getDay());
          });
          var first = new Date(viewY, viewM, 1);
          var startDay = first.getDay();
          var start = new Date(viewY, viewM, 1 - startDay);
          var html = "";
          for (var i = 0; i < 42; i++) {
            var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
            var dow = d.getDay();
            var dc = DAY_COLORS[dow];
            var k = keyOf(d);
            var na = dayApptsFor(k).length;
            var nn = mergedNotesFor(k).length;
            var nj = (journal[k] || []).length;
            var dots = "";
            if (na || nn || nj) {
              dots = '<span class="dots" aria-hidden="true">';
              for (var a = 0; a < Math.min(na, 3); a++) dots += "<i></i>";
              if (nn) dots += '<i class="note"></i>';
              if (nj) dots += '<i class="journal"></i>';
              dots += "</span>";
            }
            if (d.getMonth() !== viewM) {
              /* The other months are not shown at all — the cell stays
                 blank, no numbers bleeding into this month */
              html += '<div class="cell blank" aria-hidden="true"></div>';
              continue;
            }
            /* Today is marked on the cell itself now (Amendment #3) —
               white border + day-colour ring + glow, class "today" below.
               The aria-label still says so for screen readers, the
               weekday plaque still burns brighter, the header still
               names the date + live time */
            var label = WEEKDAYS[dow] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear() +
                        (isToday(d) ? " — today" : "") + (na ? " — " + na + (na === 1 ? " appointment" : " appointments") : "");
            html += '<button type="button" role="gridcell" class="cell' + (isToday(d) ? ' today' : '') + '" style="--dc:' + dc + '" data-y="' + d.getFullYear() +
                    '" data-m="' + d.getMonth() + '" data-d="' + d.getDate() + '" aria-label="' + label + '">' +
                    dayDigitsHTML(d.getDate(), dc) +
                    dots + jewelSVG() + "</button>";
          }
          grid.innerHTML = html;
        }

        function show(screen) {
          ["screen-month", "screen-day", "screen-door"].forEach(function (id) {
            $(id).classList.toggle("hidden", id !== screen);
          });
          window.scrollTo(0, 0);
        }

        /* A city name in proper case — "kELOWNA" reads "Kelowna",
           "new york" reads "New York" — as entered, cleaned */
        function properCaseCity(v) {
          return v.trim().replace(/\s+/g, " ").split(" ").map(function (w) {
            return w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w;
          }).join(" ");
        }
        /* The greeting lives in the TOP BAR now, under the one
           headliner — the Hub hero's warmth carried over (a feeling,
           discerned for this place, not the Hub's shape pasted in):
           the greeting big and bold and nothing else (v18 — the
           motto, the daily line and the feed pill are gone).
           The clock it drives is the
           headliner's time — the only time on the page, as Dashboard
           tiles with the hour's colour (clockTilesHTML). Weather rides
           in the bar too: no city yet means an honest enter-your-city
           button; a city shows in proper case, and the weather says
           plainly it is not connected — a forecast is never invented */
        function renderTopGreeting() {
          var t = new Date();
          var hello = $("greetHello"), clock = $("greetClock");
          if (hello) hello.textContent = greetingWord(t) + ", Shawn.";
          if (clock) clock.innerHTML = clockTilesHTML(t);
          /* Weather lives in the BOTTOM LEFT bar now (§5) — the same
             control, moved out of the wisdom banner into its own spot */
          var wxBar = $("wxBottomLeft");
          if (wxBar) {
            wxBar.innerHTML = wxCity
              ? '<span class="wx-note"><strong>' + escapeHTML(properCaseCity(wxCity)) + '</strong> · Weather is not connected yet — no forecast to invent.</span>'
              : '<button type="button" class="wx-btn" id="wxBtn">Weather · Enter your city</button><span id="wxSlot"></span>';
            var btn = $("wxBtn");
            if (btn) btn.addEventListener("click", function () {
              $("wxSlot").innerHTML =
                '<form class="wx-form" id="wxForm"><input type="text" id="wxCity" placeholder="Your city" aria-label="Your city" maxlength="60" />' +
                '<button type="submit">Set</button></form>';
              var inp = $("wxCity"); if (inp) inp.focus();
              $("wxForm").addEventListener("submit", function (ev) {
                ev.preventDefault();
                var v = $("wxCity").value.trim();
                if (!v) return;
                wxCity = properCaseCity(v);
                renderTopGreeting();
              });
            });
          }
          if (greetTimer) clearInterval(greetTimer);
          greetTimer = setInterval(function () {
            var c = $("greetClock"), g = $("greetHello");
            if (!c && !g) { clearInterval(greetTimer); greetTimer = null; return; }
            var n = new Date();
            if (c) c.innerHTML = clockTilesHTML(n);
            if (g) g.textContent = greetingWord(n) + ", Shawn.";
          }, 20000);
          /* The day clock ticks every second, like the plaque — the
             tile seconds must never sit stale. One interval; it
             updates only while the day screen is showing */
          if (clockTimer) clearInterval(clockTimer);
          clockTimer = setInterval(function () {
            var c = $("greetClock");
            if (!c || $("screen-day").classList.contains("hidden")) return;
            c.innerHTML = clockTilesHTML(new Date());
            var cc = $("coverClock");
            if (cc) cc.innerHTML = clockTilesHTML(new Date());
          }, 1000);
        }

        /* The big blocks: one block per world — name above, the big
           Dashboard-tile number below — one block per added source,
           and the + block the same size. v16 (Shawn, 2026-11-17): the
           + means WRITE FOR THIS DAY — it is Add journal now, and one
           tap opens the journal room for the day. The add-source-by-URL
           action does not vanish: it lives in the header now, a small
           "Add source" pill beside "Notifications" — same form, same
           slot, one tap, never fighting the + for it */
        /* The big blocks, v17: one card per world — name, the one
           REAL number (or the unknown-state plaque, never a 0), and
           what the world is. The Add journal block is gone from this
           row: Add journal lives in THE RECORD now, where the day is
           written down. The cards open that world's notification menu
           below them, inside YOUR WORLDS — the menu is the world's,
           not the page's */
        function renderNotifBar() {
          /* The centre's frame lights in the DAY's colour (§6) — the
             inner blocks keep their own area colours, the outer block
             lights in the day colour, obsidian black underneath */
          if (sel) $("notifBar").style.setProperty("--dc", DAY_COLORS[sel.getDay()]);
          var blocks = NOTIF_SCOPES.map(function (s) {
            var real = scopeRealCount(s.id);
            /* FIX9 item 8 — the five blocks show their big real number
               only: the area's actual count, 0 where there is nothing.
               No state pill, no "not connected" substitute. */
            /* FIX12 item 5 — one label at the top, one big number
               CENTRED in the middle, no doubles: the corner badge (a
               second number) and the sub-label (a second name) are gone. */
            var count = real === null ? 0 : real;
            var num = worldDigitsHTML(count, s.color, true, true);
            var unit = s.id === "appointments" ? "appointment" : "notification";
            var aria = s.label + ", " + count + " " + unit + (count === 1 ? "" : "s");
            return '<button type="button" class="nblock" style="--sc:' + s.color + ';--dc:' + (sel ? DAY_COLORS[sel.getDay()] : '#3fb8ff') + '" data-scope="' + s.id + '" aria-expanded="' + (openScopeId === s.id) + '" aria-label="' + aria + '">' +
              '<span class="nb-name"><span class="live-dot"></span>' + s.label + "</span>" +
              '<span class="nb-num">' + num + "</span></button>";
          }).join("");
          blocks += customSources.map(function (s) {
            return '<button type="button" class="nblock" style="--sc:' + s.color + ';--dc:' + (sel ? DAY_COLORS[sel.getDay()] : '#3fb8ff') + '" data-scope="' + s.id + '" aria-expanded="' + (openScopeId === s.id) + '" aria-label="' + escapeHTML(s.label) + ', not connected yet">' +
              '<span class="nb-name"><span class="live-dot"></span>' + escapeHTML(s.label) + "</span>" +
              '<span class="state-pill">Not connected yet</span></button>';
          }).join("");
          $("notifBar").innerHTML =
            '<p class="notif-head"><span class="ndot"></span>Notifications<button type="button" class="addsrc-pill" id="addSrcHeadBtn">Add source</button></p>' +
            '<div class="notif-blocks">' + blocks + '</div><div id="addSrcSlot"></div>';
          $("notifBar").querySelectorAll("[data-scope]").forEach(function (chip) {
            chip.addEventListener("click", function () {
              var id = chip.getAttribute("data-scope");
              openScopeId = openScopeId === id ? null : id;
              openRowId = null;
              renderNotifBar();
              renderNotifDetail();
            });
          });
          $("addSrcHeadBtn").addEventListener("click", function () {
            var slot = $("addSrcSlot");
            if (!slot) return;
            if (slot.innerHTML) { slot.innerHTML = ""; return; }
            slot.innerHTML =
              '<form class="addsrc-form" id="addSrcForm"><input type="url" id="addSrcUrl" placeholder="Paste a URL — its notifications join this bar" aria-label="Source URL" maxlength="300" />' +
              '<button type="submit">Add</button></form>';
            var inp = $("addSrcUrl"); if (inp) inp.focus();
            $("addSrcForm").addEventListener("submit", function (ev) {
              ev.preventDefault();
              var raw = $("addSrcUrl").value.trim();
              if (!raw) return;
              var label = raw;
              try {
                var u = new URL(raw.indexOf("://") === -1 ? "https://" + raw : raw);
                label = u.hostname.replace(/^www\./, "") || raw;
              } catch (e) { label = raw.slice(0, 28); }
              var src = {
                id: "src" + Date.now(),
                label: label,
                url: raw,
                color: SOURCE_COLORS[customSources.length % SOURCE_COLORS.length]
              };
              customSources.push(src);
              openScopeId = src.id;
              openRowId = null;
              renderNotifBar();
              renderNotifDetail();
            });
          });
          /* CALENDAR FIX 3 (R4-day) — ARM THE NBLOCKS HERE: this function
             (re)builds the three .nblock scope cards, and every caller
             runs AFTER renderCategories — so the round-2 arm (inside
             renderCategories) always ran BEFORE these nodes existed, and
             the nblocks were never observed: 0 lit at any scroll, ever.
             Arming here covers every rebuild path (openDay, unfold,
             scope tap); the observe-once guard in armScrollLight makes
             repeat arming safe. */
          armScrollLight();
        }

        /* One world's menu for this day — rows with living counts.
           Tap a row and its source list opens: where it came from */
        function renderNotifDetail() {
          var box = $("notifDetail");
          if (!openScopeId) { box.classList.add("hidden"); box.innerHTML = ""; return; }
          var scope = NOTIF_SCOPES.filter(function (s) { return s.id === openScopeId; })[0];
          var custom = null;
          if (!scope) custom = customSources.filter(function (s) { return s.id === openScopeId; })[0];
          if (!scope && !custom) { box.classList.add("hidden"); box.innerHTML = ""; return; }
          var color = scope ? scope.color : custom.color;
          var title = scope ? scope.label : escapeHTML(custom.label);
          var sub = scope ? scope.note
            : "Added from " + escapeHTML(custom.url) + " — nothing is connected to it yet, so there is no number to show.";
          box.style.setProperty("--sc", color);
          var rows;
          if (custom) {
            rows = '<div class="nd-sources" style="border-bottom:none"><p class="nd-src">Nothing here yet for this day — this source was just added and is not connected yet, so there is no number to show.</p></div>';
          } else {
            var items = (NOTIF_SOURCES[scope.id] || []).concat(NOTIF_COMMON);
            rows = items.map(function (pair) {
              var itId = pair[0], itLabel = pair[1];
              var open = openRowId === itId;
              var srcs = open ? '<div class="nd-sources">' + rowSources(scope.id, itId).map(function (s) {
                return '<p class="nd-src">' + s + "</p>";
              }).join("") + "</div>" : "";
              var c = countFor(scope.id, itId);
              var shown = c === null
                ? '<span class="state-pill small">Not connected</span>'
                : worldDigitsHTML(c, color, true);
              return '<button type="button" class="nd-row" data-row="' + itId + '" aria-expanded="' + open + '">' +
                '<span class="nr-l">' + itLabel + '</span>' +
                '<span style="display:inline-flex;align-items:center;gap:10px">' + shown +
                '<span class="nr-chev" aria-hidden="true">' + (open ? "▾" : "▸") + "</span></span></button>" + srcs;
            }).join("");
          }
          box.innerHTML =
            '<div class="nd-head"><p class="nd-title"><span class="live-dot"></span>' + title + '</p>' +
            '<button type="button" class="nd-close" id="ndClose">Close</button></div>' +
            /* No date repeated here — the headliner above already
               says it, once (Shawn, 2026-11-17) */
            '<p class="nd-sub">' + sub + "</p>" + rows;
          box.classList.remove("hidden");
          $("ndClose").addEventListener("click", function () {
            openScopeId = null; openRowId = null;
            renderNotifBar();
            renderNotifDetail();
          });
          box.querySelectorAll("[data-row]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var id = btn.getAttribute("data-row");
              openRowId = openRowId === id ? null : id;
              renderNotifDetail();
            });
          });
        }

        /* FIX3 (10) — YOUR STATS, REAL NUMBERS: a stats board rendering
           the day's real counts as digit tiles, harvested from the data
           the page already has. Appointments via dayApptsFor, notes via
           mergedNotesFor (smart notes = notes starting "Smart note — "),
           journal via journal[k], posts = 0 honestly (nothing is
           connected to count), lists via lists[k]. Never invented — a 0
           shows as a 0 tile. Cell colours are the doors' own, in
           spectrum flow, never two the same together. */
        function statsBoardHTML() {
          var k = keyOf(sel);
          var dayAppts = dayApptsFor(k);
          var dayNotes = mergedNotesFor(k);
          var dayJournal = journal[k] || [];
          var dayList = lists[k] || [];
          var smart = dayNotes.filter(function (n) { return (n.text || "").indexOf("Smart note — ") === 0; }).length;
          function cell(label, n, color) {
            return '<div class="stat-cell"><span class="stat-label">' + label + '</span>' + worldDigitsHTML(n, color, true, true) + '</div>';
          }
          return '<div class="stats-board" role="group" aria-label="Your stats for this day">' +
            cell("Appointments", dayAppts.length, "#8e24aa") +
            cell("Notes", dayNotes.length, "#d4a017") +
            cell("Smart notes", smart, "#0e7490") +
            cell("Journal", dayJournal.length, "#07925f") +
            cell("Posts", 0, "#c2410c") +
            cell("List items", dayList.length, "#c62828") +
            '</div>';
        }

        /* The Daily Intelligence report for the selected day, built
           only from what is really recorded for it */
        function intelHTML() {
          var k = keyOf(sel);
          var dayAppts = dayApptsFor(k);
          var dayNotes = mergedNotesFor(k);
          var dayJournal = journal[k] || [];
          var dayList = lists[k] || [];
          if (!dayAppts.length && !dayNotes.length && !dayJournal.length && !dayList.length) {
            return '<p class="none-line">Nothing recorded yet for this day — book an appointment or add a note and this report builds itself from what is really here.</p>';
          }
          /* No date restated here — the door's subtitle above already
             carries this day's date, once (Shawn, 2026-11-17) */
          /* v18-fix — the Latest note preview takes the same word-safe
             cut as latestText: a word straddling char 90 is dropped
             whole, never split (same single-word exception as clipText) */
          var lastTxt = dayNotes.length ? (dayNotes[dayNotes.length - 1].text || "") : "";
          var lastCut = lastTxt.slice(0, 90), lastSp = lastTxt.length > 90 ? lastCut.lastIndexOf(" ") : -1;
          if (lastSp > 0) lastCut = lastCut.slice(0, lastSp);
          return '<p class="intel-line"><strong>This day</strong> — ' +
            dayAppts.length + (dayAppts.length === 1 ? " appointment" : " appointments") + " · " + dayNotes.length + (dayNotes.length === 1 ? " note" : " notes") +
            (dayJournal.length ? " · " + dayJournal.length + (dayJournal.length === 1 ? " journal entry" : " journal entries") : "") +
            (dayList.length ? " · " + dayList.length + (dayList.length === 1 ? " list item" : " list items") : "") + ".</p>" +
            (dayAppts.length ? '<p class="intel-line">First up: <strong>' + fmtTime(dayAppts[0].time) + " — " + escapeHTML(dayAppts[0].title) + "</strong>" + (dayAppts[0].meet ? " (Smart Meet)" : "") + ".</p>" : "") +
            (dayNotes.length ? '<p class="intel-line">Latest note: \u201C' + escapeHTML(lastCut) + (lastTxt.length > 90 ? "\u2026" : "") + "\u201D</p>" : "") +
            '<p class="intel-line">Wisdom carried: \u201C' + escapeHTML(WISDOM[sel.getDay()]) + "\u201D</p>";
        }

        /* THE DAY-TO-DAY VIEWER (Shawn, 2026-11-17, v16): the day's
           whole place moves day to day — the stepper under the greeting
           walks one day at a time (‹ yesterday · today · tomorrow ›),
           a swipe across the day screen walks it too, and the arrow
           keys walk it on a keyboard. The place itself slides in the
           direction of travel (opts.anim), same place, new colour.
           Back to the month always lands on the month holding the day
           on screen, and the stepper's today step always brings today
           back, so the viewer never strands them */
        function stepDay(dir) {
          if (!sel) return;
          var d = new Date(sel.getFullYear(), sel.getMonth(), sel.getDate() + dir);
          openDay(d, { anim: dir > 0 ? "next" : "prev" });
        }

        /* THE TIMELINE, 6 AM – 9 PM — the day's spine, built once and
           shared: the day screen's appointments block AND the appointments
           door render this same timeline (live dictation §9 — timeline
           and scheduler merge into one screen). A preview never cuts a
           word in half: the cut lands on the last space at or before the
           limit, and the "…" follows a whole word. */
        function clipText(s, n) {
          if (s.length <= n) return s;
          var cut = s.slice(0, n), sp = cut.lastIndexOf(" ");
          if (sp > 0) cut = cut.slice(0, sp);
          return cut + "\u2026";
        }
        function timelineHTML(k) {
          var dayAppts = dayApptsFor(k);
          var dayJournal = journal[k] || [];
          var dayNotes = mergedNotesFor(k);
          function hourOfEntry(e) {
            var h = e.at ? new Date(e.at).getHours() : 12;
            return h < 6 ? 6 : h > 21 ? 21 : h;
          }
          function fmtTimeOf(ts) {
            var dd = new Date(ts);
            return fmtTime(String(dd.getHours()).padStart(2, "0") + ":" + String(dd.getMinutes()).padStart(2, "0"));
          }
          var tl = "";
          for (var h = 6; h <= 21; h++) {
            var hh = h % 12; if (hh === 0) hh = 12;
            var hlabel = hh + " " + (h < 12 ? "AM" : "PM");

            if (Math.abs(dx) > 60 && Math.abs(dy) < 80) stepDay(dx < 0 ? 1 : -1);
          }, { passive: true });
        })();
        $("prevMonth").addEventListener("click", function () {
          var nowIdx = now.getFullYear() * 12 + now.getMonth();
          if (viewY * 12 + viewM <= nowIdx - 12) return;
          viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderMonth();
        });
        $("nextMonth").addEventListener("click", function () {
          var nowIdx = now.getFullYear() * 12 + now.getMonth();
          if (viewY * 12 + viewM >= nowIdx + 12) return;
          viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderMonth();
        });
        /* The header's now-plaque — today's date and the LIVE time.
           Read fresh from the viewer's own clock on every tick, so it
           is always their time in their time zone — never hardcoded,
           never stale. The time is just the time: NO zone label ever
           (Shawn, 2026-11-17 — "GMT-8" goes). The time is the
           Dashboard tile clock (clockTilesHTML), separated a little
           from the date. There is no TODAY button anymore (Shawn,
           2026-11-17): today reads from this plaque and the weekday plaque */
        function renderNowPlaque() {
          var dEl = $("nowDate"), tEl = $("nowTime");
          if (!dEl || !tEl) return;
          var t = new Date();
          dEl.textContent = WEEKDAYS[t.getDay()] + ", " + MONTHS[t.getMonth()] + " " + t.getDate() + ", " + t.getFullYear();
          tEl.innerHTML = clockTilesHTML(t, true); /* FIX3 item 17: the month plaque is always LOCAL time. */
          /* The plaque follows TODAY's colour — its rim and its live
             dot take the day's colour, never gold. The time itself
             takes the HOUR's colour now (clockTilesHTML) */
          var dc = DAY_COLORS[t.getDay()];
          var plaque = $("nowPlaque"), dot = $("nowDot");
          if (plaque) plaque.style.setProperty("--dc", dc);
          if (dot) dot.style.setProperty("--sc", dc);
        }
        renderNowPlaque();
        setInterval(renderNowPlaque, 1000);
        /* Amendment #3 — the plaque is the door into today */
        $("nowPlaque").addEventListener("click", function () { openDay(new Date()); });
        $("backToMonth").addEventListener("click", function () { stopMeet(); renderMonth(); document.documentElement.style.setProperty("--dc", DAY_COLORS[new Date().getDay()]); document.documentElement.setAttribute("data-day-theme", WEEKDAYS[new Date().getDay()].toLowerCase()); show("screen-month"); });
        $("backToDay").addEventListener("click", function () { if (sel) openDay(sel); });
        /* FIX3 items 11 + 17 — one delegated tap handler: the world-clock
           button opens its city chooser, a zone pill sets the time, and
           any [data-backmonth] walks back to the month. */
        document.addEventListener("click", function (ev) {
          var t = ev.target; if (!t || !t.closest) return;
          if (t.closest("#greetClock")) { ev.preventDefault(); openClockMenu(); return; }
          if (t.closest("#clockToolBtn")) { ev.preventDefault(); openClockMenu(); return; }
          var zp = t.closest("[data-clockzone]");
          if (zp) { setClockZone(zp.getAttribute("data-clockzone")); return; }
          if (t.closest("[data-clockzone-close]")) { closeClockMenu(); return; }
          if (t.closest("[data-backmonth]")) { stopMeet(); renderMonth(); show("screen-month"); return; }
        });
        document.addEventListener("keydown", function (ev) {
          /* Arrow keys walk day to day while the day screen is showing
             — never while typing in a field */
          if ((ev.key === "ArrowLeft" || ev.key === "ArrowRight") && !$("screen-day").classList.contains("hidden")) {
            var tag = ev.target && ev.target.tagName;
            if (tag === "INPUT" || tag === "TEXTAREA") return;
            stepDay(ev.key === "ArrowRight" ? 1 : -1);
            return;
          }
          if (ev.key !== "Escape") return;
          var cm = $("clockMenu"); if (cm && !cm.classList.contains("hidden")) { closeClockMenu(); return; }
          if (!$("screen-door").classList.contains("hidden")) { if (sel) openDay(sel); }
          else if (!$("screen-day").classList.contains("hidden")) { stopMeet(); renderMonth(); show("screen-month"); }
        });

        /* What was written before is kept — load it before the first render */
        loadStores();
        renderMonth();
      })();
    </script>
  </body>
</html>
