<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NayaNET — Main entrance, variant B: all obsidian</title>
<style>
/* VARIANT B — all obsidian (2026-11-12, Shawn's order 03:43Z).
   A copy of the staged v8 entrance (signature-preview-main-page-v8.html,
   28,882 B, sha 69884a5e), changed ONLY where the brief says: the whole
   inner field is obsidian black (no purple anywhere in it), NO inner
   circle at all — one continuous obsidian field from the silver rim
   inward — and the Enter button's edge light is green (#2fe89e, lit on
   ready/hover — green = go). Aligned to the LIVE v8 main page: name-only,
   no code field, button "Enter NayaNET →", Pricing → the verified
   pricing URL. Geometry NEVER moved: orbit 493px desktop / 90vw phone,
   jewelSize 7.5px, factor .487, 108 jewels. */

:root{
  --bg:#010103;
  --white:#fff;
  --muted:#94a3b8;
  --green:#10b981;
  --dark:#064e3b;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  position:relative;
  isolation:isolate;
}

body:before{
  content:"";
  position:fixed;
  inset:-40%;
  z-index:-1;
  background:radial-gradient(
    circle,
    rgba(168,85,247,.12),
    transparent 55%
  );
  animation:ambient 8s ease-in-out infinite alternate;
}

@keyframes ambient{
  from{
    transform:scale(.9);
    opacity:.55;
  }
  to{
    transform:scale(1.08);
    opacity:1;
  }
}

main{
  flex:1;
  min-height:0;
  position:relative;
  z-index:2;
}

.intro{
  flex:0 0 auto;
  position:relative;
  z-index:10;
}

.intro h1{
  font-size:clamp(1.18rem,6vw,1.75rem);
  font-weight:950;
  letter-spacing:.11em;
  text-transform:uppercase;
  line-height:1.15;
}

.tag{
  margin-top:4px;
  color:var(--muted);
  font-size:clamp(.76rem,3.4vw,1rem);
  font-weight:700;
  line-height:1.25;
}

.tag strong{
  color:white;
}

.stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1200px;
  overflow:visible;
  container-type:size;
}

.naya-orbit{
  position:absolute;
  left:50%;
  top:50%;
  width:min(90vw,493px,calc(100svh - 245px));
  height:min(90vw,493px,calc(100svh - 245px));
  width:min(90vw,493px,calc(100svh - 245px),calc(100cqh - 20px));
  height:min(90vw,493px,calc(100svh - 245px),calc(100cqh - 20px));
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:0;
  overflow:visible;
}

.naya-color-orbit{
  position:absolute;
  inset:0;
  border-radius:50%;
  transform-origin:center;
  animation:nayaSpectrum 78s linear infinite;
  will-change:transform;
}

.naya-jewel{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--size);
  height:var(--size);
  margin-left:calc(var(--size) / -2);
  margin-top:calc(var(--size) / -2);
  clip-path:polygon(
    50% 0%,
    86% 28%,
    74% 82%,
    50% 100%,
    26% 82%,
    14% 28%
  );
  background:
    radial-gradient(
      circle at 31% 20%,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,.88) 10%,
      rgba(255,255,255,.18) 25%,
      rgba(255,255,255,0) 38%
    ),
    linear-gradient(
      135deg,
      rgba(255,255,255,.98) 0%,
      var(--jewel) 25%,
      var(--jewel) 58%,
      rgba(255,255,255,.16) 73%,
      rgba(0,0,0,.32) 100%
    );
  box-shadow:
    0 0 2px rgba(255,255,255,.85),
    0 0 5px var(--jewel),
    0 0 10px var(--jewel),
    0 0 16px color-mix(
      in srgb,
      var(--jewel) 42%,
      transparent
    );
  transform:
    rotate(var(--angle))
    translateY(calc(var(--orbit-radius) * -1))
    rotate(calc(var(--angle) * -1))
    scale(var(--scale));
  transform-origin:center;
  opacity:var(--opacity);
  will-change:transform;
}

.naya-jewel:before{
  content:"";
  position:absolute;
  left:15%;
  top:11%;
  width:35%;
  height:34%;
  clip-path:polygon(
    50% 0%,
    100% 25%,
    65% 100%,
    0% 68%
  );
  background:linear-gradient(
    135deg,
    rgba(255,255,255,1),
    rgba(255,255,255,.28),
    rgba(255,255,255,0)
  );
  opacity:.88;
}

.naya-jewel:after{
  content:"";
  position:absolute;
  width:25%;
  height:25%;
  left:22%;
  top:18%;
  border-radius:50%;
  background:#fff;
  filter:blur(.3px);
  opacity:.78;
  box-shadow:
    0 0 3px rgba(255,255,255,.9);
}

@keyframes nayaSpectrum{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(-360deg);
  }
}

.naya-white-orbit{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  height:100%;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:nayaWhite 31s linear infinite;
  will-change:transform;
}

.naya-white-light{
  position:absolute;
  left:50%;
  top:2.6%;
  width:7px;
  height:7px;
  margin-left:-3.5px;
  margin-top:-3.5px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 4px #fff,
    0 0 10px rgba(255,255,255,.95),
    0 0 21px rgba(255,255,255,.7),
    0 0 42px rgba(255,255,255,.24);
}

.naya-white-light:after{
  content:"";
  position:absolute;
  width:34px;
  height:3px;
  right:3px;
  top:2px;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,0),
    rgba(255,255,255,.04),
    rgba(255,255,255,.24)
  );
  filter:blur(2px);
  transform:rotate(-7deg);
  transform-origin:right center;
}

@keyframes nayaWhite{
  from{
    transform:translate(-50%,-50%) rotate(0deg);
  }
  to{
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

.portal{
  width:min(80vw,459px);
  height:min(80vw,459px);
  max-width:calc(100svh - 285px);
  max-height:calc(100svh - 285px);
  min-width:230px;
  min-height:230px;
  position:relative;
  border-radius:50%;
  padding:12px;
  background:conic-gradient(
    from 0deg,
    #101218,
    #94a3b8,
    #1e2230,
    #fff,
    #1e2230,
    #64748b,
    #101218,
    #94a3b8,
    #1e2230,
    #fff,
    #1e2230,
    #64748b,
    #101218
  );
  box-shadow:
    0 0 0 1px rgba(255,255,255,.65),
    0 25px 70px #000;
  transition:
    transform 1s cubic-bezier(.16,1,.3,1),
    filter 1s ease,
    box-shadow 1s ease;
  transform-style:preserve-3d;
  transform:translateY(0);
}

.portal:before{
  content:"";
  position:absolute;
  inset:-18px;
  border-radius:50%;
  z-index:-1;
  background:radial-gradient(
    circle,
    rgba(255,255,255,.20),
    transparent 63%
  );
  filter:blur(15px);
  opacity:.55;
  transition:all 1s ease;
}

.core{
  width:100%;
  height:100%;
  border-radius:50%;
  background:radial-gradient(
    circle at 35% 30%,
    #0a0a12 0%,
    #050508 48%,
    #010102 100%
  );
  border:1px solid rgba(255,255,255,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

/* Variant B — NO inner circle: the .core:after ring is removed entirely.
   One continuous obsidian field from the silver rim inward. */

.content{
  width:82%;
  position:relative;
  z-index:5;
}

.presence{
  /* v6 — the Naya welcome has to be in the middle (Shawn 22:20Z): the text
     was left-aligned in the content box, so it sat ~120px left of the
     dial's center on desktop ("way off"). Centered now, dot and all. */
  text-align:center;
  font-size:clamp(.58rem,2.6vw,.75rem);
  font-weight:950;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-bottom:11px;
  transition:.5s;
}

.presence:before{
  content:"";
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px var(--green);
  margin:0 9px 1px 0;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.72);
  }
}

.input{
  width:100%;
  height:43px;
  border-radius:30px;
  padding:0 20px;
  background:linear-gradient(
    180deg,
    #141725,
    #05060a
  );
  border:1.5px solid rgba(255,255,255,.55);
  color:white;
  text-align:center;
  font-size:clamp(.88rem,4vw,1.1rem);
  font-weight:750;
  outline:none;
  box-shadow:inset 0 2px 8px #000;
  transition:.35s;
}

.input::placeholder{
  color:#aab3c2;
}

.input:focus{
  border-color:#2fe89e;
  box-shadow:
    0 0 28px rgba(47,232,158,.45),
    inset 0 2px 5px #000;
}

.enter{
  /* A compact jewel button in the center — NOT the same width as the inputs. */
  display:block;
  margin:12px auto 0;
  width:auto;
  min-width:179px;
  max-width:258px;
  height:41px;
  padding:0 24px;
  white-space:nowrap;
  border-radius:30px;
  border:1.5px solid rgba(47,232,158,.65);
  color:white;
  background:radial-gradient(
    circle at 50% 0%,
    #0b2e21,
    #05060a
  );
  font-size:clamp(.84rem,3.6vw,1rem);
  font-weight:950;
  letter-spacing:.18em;
  box-shadow:
    0 0 18px rgba(47,232,158,.22);
  cursor:pointer;
  transition:
    transform .2s ease,
    box-shadow .35s ease,
    background .35s ease;
}

.enter:hover,
.enter.ready{
  /* Green = go: full green edge + green glow when the name is entered
     (ready state) or on hover. At rest the edge is a dim green. */
  border-color:#2fe89e;
  box-shadow:
    0 0 35px rgba(47,232,158,.55),
    inset 0 0 20px rgba(47,232,158,.10);
}

.enter:active{
  transform:scale(.97);
}

@media(max-height:700px){
  main{
    padding-top:5px;
  }

  .intro h1{
    font-size:clamp(1.05rem,5.5vw,1.35rem);
  }

  .tag{
    font-size:.72rem;
    margin-top:2px;
  }

  .portal{
    max-width:calc(100svh - 278px);
    max-height:calc(100svh - 278px);
    min-width:250px;
    min-height:250px;
    padding:10px;
    transform:translateY(-8px);
  }

  .presence{
    margin-bottom:9px;
    letter-spacing:.22em;
  }

  .input{
    height:48px;
  }

  .enter{
    height:48px;
    margin-top:8px;
  }

  .naya-orbit{
    width:min(112vw,500px,calc(100svh - 238px));
    height:min(112vw,500px,calc(100svh - 238px));
    width:min(112vw,500px,calc(100svh - 238px),calc(100cqh - 20px));
    height:min(112vw,500px,calc(100svh - 238px),calc(100cqh - 20px));
  }

  .naya-jewel{
    box-shadow:
      0 0 2px rgba(255,255,255,.62),
      0 0 5px var(--jewel),
      0 0 9px var(--jewel);
  }
}

/* --- The actual image behind the dial (this variant) --- */
body{background:#010103;}
body:before{display:none;}
@media(min-width:768px){
  /* v5 (Shawn 22:05Z — everything must always be aligned): the dial sits
     6px below the stage center so it matches the vault's circle — the
     vault's center sits ~6px below the image's center (v2's 12px nudge,
     scaled to this stage's image scale). The ring and the portal move
     together by the same 6px, so they stay aligned with each other. */
  .naya-orbit{transform:translate(-50%,calc(-50% + 6px));}
  .portal{transform:translateY(6px);}
}

/* v6 — BRING IT IN (Shawn 22:20Z): the dial doesn't fit perfectly in the
   vault's circle on the laptop — it overflows the arch. The whole object
   goes 15% smaller (portal 540→459px, orbit 580→493px) so it fits
   literally inside the vault's circle, with the rings shining in the
   black area around it — more depth. On mobile it fits nice already, so
   it comes in just a tad (portal 88vw→80vw, orbit 98vw→90vw). The inputs
   + button scale with it (50→43px, 48→41px) so the whole object is smaller,
   not just the ring. And the Naya welcome is in the middle now: the
   presence text was left-aligned in the content box, sitting ~120px left
   of the dial's center on desktop — centered (text-align:center, dot and
   all). Alignment is measured in numbers before anything reaches his
   eyes: dial center vs stage center, middle dot vs page center, presence
   centered on the dial. */

/* v8 — THE SWEET SPOT (Shawn 23:21Z): v6 was too far in (the lights
   touched the silver, ~2px) and v7 was too far out (the ring floated
   ~19px clear). The sweet spot is in between. And "bigger" means the
   INDIVIDUAL lights, not the whole circle: the orbit container stays
   v6's size (493px desktop, 90vw phone) — the whole thing does NOT get
   bigger — the factor moves the lights out just a bit (47% → 48.7%) and
   each light gets bigger (4.9→7.5px desktop, 4.25→6px mobile). Yes, the
   lights CAN be made bigger — all 108 share one size setting, so it is
   a single change. The portal does NOT move (the fit law). */
.topbar{
  position:relative;
  height:62px;
  flex:0 0 62px;
  width:100%;
  padding:0 15px;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(5,6,10,.92);
  border-bottom:1px solid rgba(168,85,247,.35);
  z-index:20;
}
.brandmark{
  display:flex;
  align-items:center;
  gap:10px;
  flex:none;
  font-size:12px;
  font-weight:950;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:#fff;
}
/* v5 — his ACTUAL logo (the gate's brand image, the crystal N in its ring),
   as a circular jewel mark beside the wordmark. No more "◆" text. */
.brand-logo{
  width:34px;
  height:34px;
  border-radius:50%;
  box-shadow:0 0 14px rgba(168,85,247,.55),inset 0 0 0 1px rgba(255,255,255,.25);
}
.eco-inline{
  /* v5 — TRULY centered on the page center (Shawn 22:05Z: the icons must be
     centered to the center point). Absolute, left:50% + translateX(-50%),
     shrink-to-fit — no flex item, no width, no justify-content. The middle
     dot lands on the page center. On phone all 9 fit (9×30 + 8×8 = 334px). */
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:nowrap;
  z-index:5;
}
.eco-inline::-webkit-scrollbar{display:none;}
.eco-dot:hover{transform:translateY(-2px) scale(1.18);border-color:var(--eco-c,#8a5cff) !important;
  box-shadow:0 0 22px var(--eco-c,#8a5cff),0 0 6px var(--eco-c,#8a5cff),inset 0 1px rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.5) !important;}
.eco-dot:hover svg{filter:drop-shadow(0 0 7px var(--eco-c,#8a5cff)) !important;}
.eco-dot:hover svg *{stroke:var(--eco-c,#8a5cff) !important;}
.eco-dot:active{transform:scale(1.05);}
@media (max-width:640px){
  /* v5 — phone: the centered 9-dot nav (334px at 30px dots) overlaps the
     brandmark at the left (the logo + "NAYA" text ran into the first two
     dots). Fix: show the logo mark alone (no wordmark text) and shrink
     the dots to 27px / 6px gap — the nav is 291px, its left edge at 49px,
     clearing the 30px logo (ends 45px). The nav stays centered on the
     page center; the logo is still his actual logo. */
  .brandmark span{display:none;}
  .brand-logo{width:30px !important;height:30px !important;}
  .eco-inline{gap:6px !important;}
  .eco-dot{width:27px !important;height:27px !important;min-width:27px !important;}
  .eco-dot svg{width:14px !important;height:14px !important;}
}

<script>
/* NAYANET ORBITAL JEWEL GENERATOR — harvested verbatim from the live gate.
   12 color families × 3 shades × 3 repetitions = 108 luxury crystal jewels. */
(function(){

  const orbit =
    document.getElementById('nayaColorOrbit');

  const orbitFrame =
    document.querySelector('.naya-orbit');

  if(!orbit || !orbitFrame){
    return;
  }

  const palette = [
    '#ffffff',
    '#fff5fb',
    '#ffe7f3',
    '#ffb6d9',
    '#ff78bb',
    '#ff3f9f',
    '#ff36c8',
    '#e91caf',
    '#c91a9e',
    '#c56bff',
    '#a94dff',
    '#8735e8',
    '#7b4dff',
    '#6634e6',
    '#5125bd',
    '#4c3bd4',
    '#3f42b9',
    '#343b98',
    '#3f68e8',
    '#3d8cff',
    '#55adff',
    '#54d9ff',
    '#45d5d2',
    '#38c5b4',
    '#40cf91',
    '#49d878',
    '#63df61',
    '#91e94f',
    '#c4ee4b',
    '#e9ed55',
    '#f4d14e',
    '#f5ad45',
    '#f48a3e',
    '#f05a46',
    '#ed3d50',
    '#d82f61'
  ];

  const repeats = 3;

  const total =
    palette.length * repeats;

  const jewelSize = 7.5;

  function positionJewels(){

    const orbitSize =
      orbitFrame.getBoundingClientRect().width;

    const radius =
      orbitSize * .487; /* 48.7%, not the gate's 44% and not v7's 47% on a
      bigger container: v7 went too far (the ring floated ~19px clear of
      the silver). v8 (Shawn 23:21Z — the sweet spot in between): the
      orbit container stays v6's size (493px desktop, 90vw phone) — the
      WHOLE circle does NOT get bigger — and the factor moves the lights
      out just a bit, to ~240px desktop (gap ~10.6px to the jewel's center,
      ~6.9px to its edge) and ~171px phone (gap ~14.9px center, ~11.9px
      edge). The individual lights get bigger (7.5px desktop, 6px mobile)
      — that is where "bigger" goes, not the circle. */

    orbit.style.setProperty(
      '--computed-orbit-radius',
      radius + 'px'
    );

    const jewels =
      orbit.querySelectorAll('.naya-jewel');

    jewels.forEach(function(jewel){

      jewel.style.setProperty(
        '--orbit-radius',
        radius + 'px'
      );

    });

  }

  for(let i = 0; i < total; i++){

    const jewel =
      document.createElement('span');

    const angle =
      (360 / total) * i;

    const colorIndex =
      i % palette.length;

    jewel.className =
      'naya-jewel';

    jewel.style.setProperty(
      '--jewel',
      palette[colorIndex]
    );

    jewel.style.setProperty(
      '--angle',
      angle + 'deg'
    );

    jewel.style.setProperty(
      '--size',
      jewelSize + 'px'
    );

    jewel.style.setProperty(
      '--size-mobile',
      '6px'
    );

    jewel.style.setProperty(
      '--scale',
      '1'
    );

    jewel.style.setProperty(
      '--opacity',
      '.9'
    );

    orbit.appendChild(jewel);

  }

  positionJewels();

  window.addEventListener(
    'resize',
    positionJewels,
    {passive:true}
  );

})();

/* The Enter button lights GREEN when the name is entered (ready = go).
   At rest the edge is a dim green; typed name or hover lights it full. */
(function(){
  var name=document.getElementById('userName');
  var btn=document.querySelector('.enter');
  if(!name||!btn){return;}
  function sync(){btn.classList.toggle('ready',name.value.trim().length>0);}
  name.addEventListener('input',sync);
  sync();
})();
</script>
