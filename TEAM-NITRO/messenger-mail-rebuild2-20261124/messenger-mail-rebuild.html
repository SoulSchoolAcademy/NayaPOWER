<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Messenger &amp; Smart Mail — NayaNET</title><style>body{margin:0;background:#050607;}/* SMART MAIL — Room. Blue identity. Dark premium, glassmorphism.
   Button law: silver-white at rest, blue ignites on hover/focus.
   Color = stable identity: blue for the room, contact/space colors for avatars. */

.mail-stage{
  position:relative; --ml-blue:#0f52ba; --ml-blue-lt:#0f52ba;
  --ml-ink:#ffffff; --ml-soft:#ffffff;
  max-width:none; width:100%; box-sizing:border-box; margin:0; padding:0 clamp(16px,4vw,64px) calc(232px + env(safe-area-inset-bottom,0px));
  color:var(--ml-ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;
}

/* header */
.mail-stage 
.ml-banner{ text-align:center; font-size:17px; letter-spacing:.14em; color:#ffffff; opacity:1; margin:14px 0 4px; font-weight:600; }
.ml-head{ margin:0 0 12px; }
.ml-head-row{ display:grid; grid-template-columns:224px 340px 1fr; gap:24px; align-items:center; }
.mail-stage .ml-kicker{
  font-size:17px; letter-spacing:.24em; font-weight:800; color:var(--ml-blue);
  margin:0 0 14px; text-shadow:0 0 14px rgba(15,82,186,.75);
}
.mail-stage .ml-title{
  font-size:25px; font-weight:900; letter-spacing:-.02em;
  margin:0 0 14px; line-height:1.1; color:#fff;
}
.mail-stage .ml-sub{
  font-size:17px; line-height:1.65; color:#ffffff; margin:0; max-width:680px; font-weight:500;
}
/* three panes */
.mail-stage .ml-panes{
  display:grid; grid-template-columns:224px 340px 1fr; gap:24px;
  margin:0; min-height:400px;
}

/* folder rail — each folder owns its color: inbox blue, unread green, sent purple */
.mail-stage .ml-rail{ display:flex; flex-direction:column; gap:4px;
  border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:6px 12px;
  background:linear-gradient(180deg, rgba(22,26,40,.72), rgba(10,12,20,.62));
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  box-shadow:0 10px 36px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
.mail-stage .ml-folder{ --fc:#0f52ba; --fcl:#0f52ba;
  display:flex; align-items:center; gap:8px;
  padding:3px 12px; overflow:hidden;box-sizing:border-box;border-radius:14px; width:100%; text-align:left; white-space:nowrap;
  font-size:17px; font-weight:700; letter-spacing:.02em; line-height:1.25;
  cursor:pointer; font-family:inherit; color:#ffffff;
  background:#050607;
  border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 8px rgba(0,0,0,.4);
  transition:border-color .25s, box-shadow .3s, color .25s;
  -webkit-tap-highlight-color:transparent; }
.mail-stage .ml-folder .ml-ficon{ width:20px; height:20px; flex:none;
  color:color-mix(in srgb, var(--fc) 62%, #ffffff);
  filter:drop-shadow(0 0 5px color-mix(in srgb, var(--fc) 55%, transparent));
  transition:filter .3s, color .25s; }
.mail-stage .ml-folder .ml-ficon svg{ width:100%; height:100%; display:block; }
.mail-stage .ml-folder .ml-fname{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:normal; }
.mail-stage .ml-folder:hover, .mail-stage .ml-folder:focus-visible{ outline:none;
  border-color:color-mix(in srgb, var(--fc) 55%, transparent);
  background:#050607;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 16px -4px var(--fc); }
.mail-stage .ml-folder:hover .ml-ficon, .mail-stage .ml-folder:focus-visible .ml-ficon{ color:var(--fc); filter:drop-shadow(0 0 8px color-mix(in srgb, var(--fc) 70%, transparent)); }
.mail-stage .ml-folder.on{ border-color:var(--fc); color:var(--fcl);
  text-shadow:0 0 10px color-mix(in srgb, var(--fc) 80%, transparent);
  background:#050607;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 0 20px -4px var(--fc), 0 0 4px 0 color-mix(in srgb, var(--fc) 75%, transparent); }
.mail-stage .ml-folder.on .ml-ficon{ color:var(--fc); filter:drop-shadow(0 0 10px color-mix(in srgb, var(--fc) 85%, transparent)); }
.ml-folder.on .ml-badge{ color:#fff; background:#050607; border-color:color-mix(in srgb, var(--fc) 70%, transparent);
  box-shadow:0 0 10px -2px var(--fc), inset 0 1px 0 rgba(255,255,255,.12); text-shadow:0 0 8px var(--fc); }
/* ===== Quick Access (10-year Smart Mail) ===== */
.ml-qa-label{ margin:0 4px 4px; font-size:17px; font-weight:800; letter-spacing:.06em; color:#ffffff; }
.ml-qa{ display:flex; flex-direction:column; gap:6px; }
.ml-qa-item{ --qc:#0e7490; display:flex; align-items:center; gap:6px; width:100%; max-width:100%; box-sizing:border-box; overflow:hidden; padding:7px 10px; border-radius:12px; cursor:pointer; font-family:inherit; font-size:17px; font-weight:800; letter-spacing:.14em; color:#ffffff; background:rgba(255,255,255,.02); border:1px solid rgba(232,234,242,.12); transition:border-color .2s, box-shadow .25s, transform .15s, background .25s; text-align:left; }
.ml-qa-item:hover{ border-color:var(--qc); box-shadow:0 0 18px -6px var(--qc); transform:translateY(-1px); }
.ml-qa-item:hover .ml-qicon{ color:var(--qc); filter:drop-shadow(0 0 6px var(--qc)); }
.ml-qicon{ width:20px; height:20px; flex:none; color:#ffffff; transition:color .25s, filter .25s; }
.ml-qicon svg{ width:100%; height:100%; display:block; }
.ml-qname{ flex:1 1 auto; min-width:0; white-space:normal; line-height:1.25; font-size:17px; letter-spacing:.02em; }
.ml-qcount{ flex:none; margin-left:2px; min-width:20px; height:20px; padding:0 5px; border-radius:99px; display:inline-flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; color:#ffffff; border:1px solid rgba(232,234,242,.18); background:rgba(0,0,0,.3); }
.ml-qa-item:hover .ml-qcount{ color:#fff; border-color:var(--qc); }
.ml-qa-panel{ position:absolute; top:0; right:0; bottom:0; width:min(340px,92%); z-index:60; display:flex; flex-direction:column; background:rgba(13,16,26,.97); border-left:1px solid rgba(255,255,255,.12); box-shadow:-24px 0 60px rgba(0,0,0,.55); transform:translateX(102%); transition:transform .32s cubic-bezier(.2,.8,.2,1); }
.ml-qa-panel.open{ transform:none; }
.ml-qa-backdrop{ position:absolute; inset:0; z-index:55; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .3s; }
.ml-qa-backdrop.open{ opacity:1; pointer-events:auto; }
.ml-qa-head{ display:flex; align-items:center; gap:10px; padding:18px 18px 12px; }
.ml-qa-title{ flex:1; font-size:17px; font-weight:800; letter-spacing:.18em; }
.ml-qa-x{ width:32px; height:32px; border-radius:99px; border:1px solid rgba(255,255,255,.16); background:transparent; color:#ffffff; cursor:pointer; font-size:17px; line-height:1; }
.ml-qa-x:hover{ color:#fff; border-color:#fff; }
.ml-qa-list{ flex:1; overflow-y:auto; padding:4px 18px 18px; display:flex; flex-direction:column; gap:8px; }
.ml-qa-row{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.02); }
.ml-qa-ava{ width:34px; height:34px; flex:none; border-radius:99px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; color:#fff; background:rgba(255,255,255,.06); border:1.5px solid var(--pc,#0f52ba); }
.ml-qa-meta{ flex:1; min-width:0; }
.ml-qa-nm{ font-size:17px; font-weight:700; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ml-qa-sub{ font-size:17px; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ml-qa-dot{ width:10px; height:10px; flex:none; border-radius:99px; background:var(--pc,#0f52ba); box-shadow:0 0 8px var(--pc,#0f52ba); }
@media(max-width:760px){ .mail-stage .ml-qa-label{ display:none; } .mail-stage .ml-qa{ flex-direction:row; } .mail-stage .ml-qa-item{ flex:1 0 210px; white-space:nowrap; } }

.mail-stage .ml-badge{ margin-left:4px; flex:none; min-width:20px; height:20px; padding:0 7px; border-radius:99px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:800; letter-spacing:.04em; line-height:1; color:#ffffff;
  background:#050607;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 4px rgba(0,0,0,.35); text-shadow:none; }

/* thread list */
.mail-stage .ml-list{
  display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height:480px;
  border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:12px;
  background:rgba(14,16,24,.55);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
}
.mail-stage .ml-empty{ color:var(--ml-soft); font-size:17px; padding:12px 12px; text-align:center; }
.mail-stage .ml-thread{ position:relative; display:flex; gap:14px; align-items:flex-start;
  padding:18px 18px 18px 16px; border-radius:18px; text-align:left; cursor:pointer; font-family:inherit;
  color:#fff; width:100%;
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 8px 24px -12px rgba(0,0,0,.7);
  transition:border-color .22s, box-shadow .25s, transform .15s, background .22s; }
.ml-thread:hover{ border-color:rgba(15,82,186,.75); box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 8px 28px -10px rgba(15,82,186,.75); transform:translateY(-1px); }
.ml-thread.sel{ border-color:rgba(15,82,186,.75); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 0 24px -6px rgba(15,82,186,.75); background:linear-gradient(180deg, rgba(15,82,186,.08), rgba(15,82,186,.02)); }
.mail-stage .ml-thread:hover, .mail-stage .ml-thread:focus-visible{
  border-color:rgba(15,82,186,.75); transform:translateY(-1px); outline:none;
  box-shadow:0 0 22px -8px var(--ml-blue);
}
.mail-stage .ml-thread.sel{
  border:2px solid var(--ml-blue);
  box-shadow:0 0 26px -6px var(--ml-blue), inset 0 1px rgba(255,255,255,.08);
  background:rgba(15,82,186,.07);
}
/* avatars — living depth: gradient sphere, top-light catch, deep contact glow */
.mail-stage .ml-avatar{
  flex:none; width:40px; height:40px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:800; color:#ffffff;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
  border:1.5px solid color-mix(in srgb, var(--pc,#ffffff) 55%, transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 8px rgba(0,0,0,.4);
}
.mail-stage .ml-avatar.sm{ width:34px; height:34px; font-size:17px; }
.mail-stage .ml-thread-mid{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.mail-stage .ml-thread-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.ml-thread-from{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mail-stage .ml-thread-from{ font-size:17px; font-weight:800; letter-spacing:.02em; }
.mail-stage .ml-thread.unread .ml-thread-from{ color:#0f52ba; font-weight:800; }
.mail-stage .ml-thread-time{ font-size:17px; color:var(--ml-soft); flex:none; font-variant-numeric:tabular-nums; }
.mail-stage .ml-thread-subj{ font-size:17px; font-weight:700; color:#fff; }
.mail-stage .ml-thread-snip{
  font-size:17px; color:var(--ml-soft); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.mail-stage .ml-dot{ position:absolute; top:18px; right:18px; width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e0f2fe, #0f52ba 55%, #0f52ba);
  box-shadow:0 0 14px 2px rgba(15,82,186,.75), 0 0 4px rgba(15,82,186,.75);
  animation:ml-pulse 2.4s ease-in-out infinite; }
@keyframes ml-pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:1; transform:scale(.85); } }
.mail-stage .ml-chip{ flex:none; font-size:17px; font-weight:800; letter-spacing:.18em;
  color:rgba(15,82,186,.75); background:rgba(15,82,186,.06);
  border:1px solid rgba(15,82,186,.75); border-radius:99px; padding:3px 8px;
  text-shadow:none; opacity:1; }

/* reading pane */
.mail-stage .ml-read{
  border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:30px 32px;
  background:rgba(14,16,24,.55);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  box-shadow:inset 0 1px rgba(255,255,255,.06), 0 22px 55px rgba(0,0,0,.5);
  overflow-y:auto; max-height:480px;
}
.mail-stage .ml-read-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:40vh; text-align:center; padding:32px 32px; gap:20px; }
.ml-read-empty .ml-empty-mark{ position:relative; width:72px; height:72px; border-radius:50%;
  border:1.5px solid #0f52ba; background:linear-gradient(135deg,#141419 0%,#050607 50%,#141419 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:25px; color:#ffffff;
  box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 32px -8px rgba(15,82,186,.65), inset 0 1px 0 rgba(255,255,255,.12); }
.ml-read-empty .ml-empty-mark::after{ content:""; position:absolute; inset:-7px; border-radius:50%; border:1.5px solid #0f52ba; opacity:.55; animation:nm-orbit 120s linear infinite; pointer-events:none; }
.ml-empty-orb-n{ position:absolute; right:-14px; bottom:-8px; width:40px; height:40px; border-radius:50%; background:#050607; border:1.5px solid #8e24aa; color:#ffffff; display:grid; place-items:center; font-size:19px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
.ml-empty-orb-d{ position:absolute; left:-12px; top:-10px; width:32px; height:32px; border-radius:50%; background:#050607; border:1.5px solid #d4a017; color:#d4a017; display:grid; place-items:center; font-size:17px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
.ml-read-empty p{ color:#ffffff; font-size:17px; font-weight:500; letter-spacing:.02em; margin:0; max-width:280px; line-height:1.7; }
.ml-read-empty .ml-empty-sub{ color:#ffffff; font-size:17px; letter-spacing:.08em; margin:0; }
.mail-stage .ml-read-subj{ font-size:19px; font-weight:900; margin:0 0 18px; color:#fff; line-height:1.3; }
.mail-stage .ml-read-subj:focus{ outline:none; }
.mail-stage .ml-read-meta{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid rgba(255,255,255,.08); }
.mail-stage .ml-read-who{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:160px; }
.mail-stage .ml-read-from{ font-size:17px; font-weight:800; }
.mail-stage .ml-read-to{ font-size:17px; color:var(--ml-soft); }
.mail-stage .ml-read-date{ font-size:17px; color:var(--ml-soft); font-variant-numeric:tabular-nums; }
.mail-stage .ml-read-body{ font-size:17px; line-height:1.75; color:#ffffff; }
.mail-stage .ml-read-body p{ margin:0 0 16px; }
.mail-stage .ml-read-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }

/* buttons */
.mail-stage .ml-btn, .mail-stage .ml-compose{
  padding:10px 24px; border-radius:999px; font-size:17px; font-weight:800; letter-spacing:.14em;
  cursor:pointer; font-family:inherit; color:#fff;
  background:rgba(10,12,20,.6); border:1px solid rgba(232,234,242,.4);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  text-shadow:0 0 10px rgba(255,255,255,.3);
  box-shadow:0 0 16px -6px rgba(255,255,255,.4), inset 0 1px 0 rgba(255,255,255,.2);
  transition:border-color .22s, box-shadow .25s, transform .15s, color .22s;
}
.mail-stage .ml-btn:hover, .mail-stage .ml-btn:focus-visible,
.mail-stage .ml-compose:hover, .mail-stage .ml-compose:focus-visible{
  border-color:var(--ml-blue); color:var(--ml-blue-lt); transform:translateY(-1px); outline:none;
  text-shadow:0 0 12px rgba(15,82,186,.75);
  box-shadow:0 0 26px -6px var(--ml-blue), inset 0 1px 0 rgba(255,255,255,.15);
}
.mail-stage .ml-btn.primary{ border-color:var(--ml-blue); }
.mail-stage .ml-compose{ position:fixed; bottom:28px; right:28px; z-index:40; padding:14px 30px; }

/* compose modal */
.mail-stage .ml-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.mail-stage .ml-modal{
  max-width:600px; width:100%; max-height:88vh; overflow:auto;
  background:rgba(16,19,30,.94);
  -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px);
  border:2px solid rgba(15,82,186,.75); border-radius:24px; padding:32px;
  box-shadow:0 40px 120px rgba(0,0,0,.75), 0 0 60px -12px var(--ml-blue);
}
.mail-stage .ml-modal-title{ font-size:17px; font-weight:800; letter-spacing:.2em; color:var(--ml-blue-lt); margin:0 0 22px; }
.mail-stage .ml-field{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.mail-stage .ml-field-l{ font-size:17px; font-weight:800; letter-spacing:.16em; color:var(--ml-soft); }
.mail-stage .ml-input{
  font-family:inherit; font-size:17px; color:#fff; padding:12px 16px; border-radius:12px;
  background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.14);
  transition:border-color .2s, box-shadow .2s;
}
.mail-stage .ml-input:focus{ border-color:var(--ml-blue); outline:none; box-shadow:0 0 16px -4px var(--ml-blue); }
.mail-stage textarea.ml-input{ resize:vertical; min-height:120px; line-height:1.6; }
.mail-stage select.ml-input option, .mail-stage select.ml-input optgroup{ background:#141419; }
.mail-stage .ml-err{ font-size:17px; color:#ffffff; border-left:3px solid #c62828; padding-left:12px; margin:0 0 14px; }
.mail-stage .ml-modal-row{ display:flex; gap:10px; flex-wrap:wrap; }

/* responsive */
@media(max-width:760px){
  .mail-stage{ padding:28px 16px calc(216px + env(safe-area-inset-bottom,0px)); }
  .mail-stage .ml-panes{ grid-template-columns:1fr; }
  .mail-stage .ml-rail{ flex-direction:row; overflow-x:auto; }
  .mail-stage .ml-folder{ flex:1 0 190px; white-space:nowrap; }
  .mail-stage .ml-list{ max-height:320px; }
  .mail-stage .ml-read{ max-height:none; padding:24px 20px; }
  .mail-stage .ml-compose{ bottom:18px; right:18px; }
}

/* --- compose CTA: primary action, top of page --- */
.ml-cta-row{ display:flex; align-items:center; gap:18px; margin:8px 0 4px; flex-wrap:wrap; }
.ml-compose-top{
  position:relative; overflow:hidden; width:100%; box-sizing:border-box;
  padding:8px 32px; border-radius:999px; font-size:17px; font-weight:800; letter-spacing:.18em;
  cursor:pointer; font-family:inherit; color:#fff; min-height:52px; min-width:0;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  background:linear-gradient(135deg,#141419 0%,#050607 50%,#141419 100%);
  border:1.5px solid #0f52ba;
  box-shadow:0 12px 34px -8px rgba(0,0,0,.6), 0 0 24px -4px rgba(15,82,186,.65),
    inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .16s ease, box-shadow .25s ease, filter .25s ease;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
/* v3: the bright sheen sweep went with the bright fill — inside stays board black. */
.ml-compose-top .ml-plus{
  display:inline-block; font-size:17px; font-weight:800; margin-right:10px; color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.8); transition:transform .25s ease; vertical-align:-1px;
}
.ml-compose-top:hover{ transform:translateY(-2px);
  box-shadow:0 16px 40px -8px rgba(0,0,0,.6), 0 0 30px -4px rgba(15,82,186,.65),
    inset 0 1px 0 rgba(255,255,255,.12);
}
/* v3: the + glyph NEVER rotates (§8) — the harvested rotate is out. */
.ml-compose-top:active{ transform:scale(.97);
  box-shadow:0 4px 14px -6px rgba(0,0,0,.6), 0 0 14px -6px rgba(15,82,186,.65),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.ml-compose-top:focus-visible{ outline:2px solid rgba(147,197,253,.9); outline-offset:3px; }
@media (prefers-reduced-motion: reduce){
  .ml-compose-top::before{ animation:none; display:none; }
  .ml-compose-top, .ml-compose-top .ml-plus{ transition:none; }
  .ml-folder, .ml-folder .ml-ficon{ transition:none; }
  .ml-folder:hover{ transform:none; }
}
/* v3: duplicate hover/active rules removed — the rules above govern. */
.ml-cta-hint{ font-size:17px; letter-spacing:.1em; color:#ffffff; font-weight:600; }
@media (max-width:760px){ .ml-col2{ display:flex; flex-direction:column; gap:4px; min-width:0; } .ml-compose-top{ width:100%; min-width:0; } }

/* ===== Smart Mail 10-year features ===== */
/* Toast */

   The frame IS master-frame.png, harvested verbatim (sha 865357f6…, 1672x941):

   centre top and centre bottom, thin purple rim light, no pink wash.
   Technique verbatim from the calendar border redesign (build-border.py):
   border-image, slice 300, `round` — corners hold the seals whole; the
   top/bottom strips tile the centre pattern (the extension rule: repeat the
   centre metal pattern as needed, top and bottom stay the frame). `round`
   rescales to a whole number of tiles, so an ODD count puts one N dead centre:

<div id="app"></div><script>
/* ===== Toast notifications (10-year Smart Mail) ===== */
function showToast(msg, kind){

  t.className = 'ml-toast';
  var k = document.createElement('span');
  k.className = 'tk';
  k.textContent = kind==='sched' ? '◐' : '✓';
  t.appendChild(k);
  var tx = document.createElement('span');
  tx.textContent = msg;
  t.appendChild(tx);
  wrap.appendChild(t);
  document.body.appendChild(wrap);
  requestAnimationFrame(function(){ wrap.classList.add('show'); });
  setTimeout(function(){ wrap.classList.remove('show'); setTimeout(function(){ wrap.remove(); }, 400); }, 3000);
}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=text;return e;}window.NayaRooms=window.NayaRooms||{};
  'use strict';

  var KEY = 'naya.people.registry';

  function clean(p){
    if(!p || typeof p !== 'object' || p.id == null) return null;
    return {
      id: String(p.id),
      name: String(p.name != null ? p.name : p.id),
      role: String(p.role || ''),
      color: String(p.color || '#ffffff'),
      note: String(p.note || '')
    };
  }

  function load(){
    try{
      var raw = window.__nmPeopleRaw || null;
      var a = raw ? JSON.parse(raw) : null;
      if(!Array.isArray(a)) return null;
      var out = [];
      a.forEach(function(p){ var c = clean(p); if(c) out.push(c); });
      return out;
    }catch(e){ return null; }
  }

  function save(people){
    try{ window.__nmPeopleRaw = JSON.stringify(people || []); }catch(e){}
  }

  function ensureLoaded(ctxContacts){
    var people = load();
    if(people) return people;
    people = [];
    (Array.isArray(ctxContacts) ? ctxContacts : []).forEach(function(p){
      var c = clean(p); if(c) people.push(c);
    });
    save(people);
    return people;
  }

  function add(person){
    var people = load() || [];
    var c = clean(person);
    if(c && !people.some(function(p){ return p.id === c.id; })){
      people.push(c);
      save(people);
    }
    return people;
  }

  function get(id){
    var people = load() || [];
    for(var i = 0; i < people.length; i++){
      if(people[i].id === String(id)) return people[i];
    }
    return null;
  }

  window.NayaPeople = {
    KEY: KEY,
    load: load,
    save: save,
    ensureLoaded: ensureLoaded,
    add: add,
    get: get
  };

  'use strict';

  function isStr(v){ return typeof v==='string' && v.length>0; }

  function parseOne(t){
    if(!t || typeof t!=='object') return null;
    if(!isStr(t.id) || !isStr(t.from) || !isStr(t.to) || !isStr(t.subject)) return null;
    var ts = t.ts;
    if(typeof ts!=='number' || !isFinite(ts)) ts = Date.now();
    return {
      id: t.id,
      from: t.from,
      fromAlias: isStr(t.fromAlias) ? t.fromAlias : null,
      to: t.to,
      toKind: t.toKind==='space' ? 'space' : 'person',
      toLabel: isStr(t.toLabel) ? t.toLabel : null,
      mode: t.mode==='instant' ? 'instant' : (t.mode==='post' ? 'post' : 'inbox'),
      subject: t.subject,
      snippet: isStr(t.snippet) ? t.snippet : String(t.body||'').slice(0,120),
      body: isStr(t.body) ? t.body : '',
      ts: ts,
      scheduledFor: (typeof t.scheduledFor==='number' && isFinite(t.scheduledFor)) ? t.scheduledFor : null,
      status: (t.status==='scheduled'||t.status==='draft'||t.status==='post') ? t.status : null,
      isPost: t.isPost===true,
      attachedNotes: Array.isArray(t.attachedNotes) ? t.attachedNotes.filter(isStr) : [],
      unread: t.unread===true,
      demo: t.demo!==false   /* seeded content is demo unless explicitly real */
    };
  }

  function parseThreads(raw){
    var list = Array.isArray(raw) ? raw : [];
    var out = [];
    list.forEach(function(t){
      try{ var e=parseOne(t); if(e) out.push(e); }catch(err){ /* skip */ }
    });
    out.sort(function(a,b){ return b.ts - a.ts; });
    return out;
  }

  window.MailAdapter = { parseThreads: parseThreads };

  'use strict';

  var BLUE = '#0f52ba';
  var SENT_KEY = 'naya.smartmail.sent';

  function timeAgo(ts){
    var s = Math.max(0, Math.floor((Date.now()-ts)/1000));
    if(s < 60) return 'just now';
    var m = Math.floor(s/60); if(m < 60) return m+'m ago';
    var h = Math.floor(m/60); if(h < 24) return h+'h ago';
    var d = Math.floor(h/24); if(d < 7) return d+'d ago';
    return Math.floor(d/7)+'w ago';
  }

  function fmtFull(ts){
    var d = new Date(ts);
    return d.toLocaleDateString('en-US',{month:'long',day:'numeric'}) + ' · ' +
           d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }

  function esc(s){ return String(s==null?'':s); }

  function SmartMail(el, ctx){
    ctx = ctx || {};
    var me = ctx.me || 'naya4';
    /* people spine: one shared registry across rooms; seeds from ctx.contacts
       on first run, then every room reads the same truth. */

      ? window.NayaPeople.ensureLoaded(ctx.contacts)
      : (Array.isArray(ctx.contacts) ? ctx.contacts : []);

    var contactLists = Array.isArray(ctx.contactLists) ? ctx.contactLists : [];
    var noteLists = Array.isArray(ctx.noteLists) ? ctx.noteLists : [];
    var smartNotes = Array.isArray(ctx.smartNotes) ? ctx.smartNotes : [];
    var byId = {};
    var clistById = {}; contactLists.forEach(function(l){ clistById[l.id]=l; });
    var nlistById = {}; noteLists.forEach(function(l){ nlistById[l.id]=l; });
    function reloadPeople(){
      if(window.NayaPeople && window.NayaPeople.load){
        var p = window.NayaPeople.load();
        if(p) contacts = p;
      }
      byId = {};
      contacts.forEach(function(c){ byId[c.id]=c; });
    }
    reloadPeople();
    var spaceById = {};
    spaces.forEach(function(s){ spaceById[s.id]=s; });

    /* threads: seeded (demo) + previously sent (persisted) */
    var threads = Array.isArray(ctx.threads) ? ctx.threads.slice() : [];
    loadSent().forEach(function(s){
      if(!threads.some(function(t){ return t.id===s.id; })) threads.push(s);
    });
    threads.sort(function(a,b){ return b.ts - a.ts; });

    var state = { folder:'inbox', selectedId:null, checked:{}, selecting:false, search:'', filter:'all' };

    var stage = el('div','mail-stage');

    /* header */
    var composeTop = el('button','ml-compose-top',''); composeTop.innerHTML='<span class="ml-plus">+</span>COMPOSE';
    composeTop.type='button';
    composeTop.setAttribute('aria-label','Compose new mail');
    composeTop.addEventListener('click', function(){ openCompose({}); });

    /* three panes */
    var panes = el('div','ml-panes');

    var rail = el('nav','ml-rail'); rail.setAttribute('aria-label','Mail folders');
    panes.appendChild(rail);

    var col2 = el('div','ml-col2');
    col2.appendChild(composeTop);
    var list = el('div','ml-list'); list.setAttribute('role','listbox'); list.setAttribute('aria-label','Threads');
    col2.appendChild(list);
    panes.appendChild(col2);

    var read = el('article','ml-read'); read.setAttribute('aria-live','polite');
    panes.appendChild(read);

    stage.appendChild(panes);



    /* ---------- folders ---------- */
    function inboxThreads(){ return threads.filter(function(t){ return t.from!==me && !t.isPost; }); }
    function sentThreads(){ return threads.filter(function(t){ return t.from===me; }); }
    function unreadCount(){ return inboxThreads().filter(function(t){ return t.unread; }).length; }

    /* folder identity: each folder owns a stable color + icon (Shawn, 2026-10-02).
       inbox stays blue, unread is green, sent is purple when lit. */
    var F_INBOX  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/><path d="M3 14l2.5-7h13L21 14"/><path d="M12 3v7m0 0-2.8-2.8M12 10l2.8-2.8"/></svg>';
    var F_UNREAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3.5 7.5 8.5 6 8.5-6"/><circle cx="18.5" cy="5.5" r="3" fill="currentColor" stroke="#050607" stroke-width="1.2"/></svg>';
    var F_SENT   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.5 2.5-6.8 19-3.8-8.6-8.4-3.8z"/><path d="M21.5 2.5 10.9 12.9"/><path d="M3 20.5c2.8-.8 5-2.6 6.6-4.6"/></svg>';
    var F_SCHED  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="14.8" r="3.4"/><path d="M12 13.2v1.7l1.3 1.3"/></svg>';
    var F_POST   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><path d="M8.6 8.6a4.8 4.8 0 0 0 0 6.8M15.4 8.6a4.8 4.8 0 0 1 0 6.8M5.8 5.8a8.8 8.8 0 0 0 0 12.4M18.2 5.8a8.8 8.8 0 0 1 0 12.4"/></svg>';
    var F_DRAFT  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M13 7l3 3"/><path d="M4 21h6"/></svg>';
    var QA_CONTACTS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M15.5 5.2a3.4 3.4 0 0 1 0 5.9M17.8 14.2a6 6 0 0 1 3.2 5.8"/></svg>';
    var QA_LISTS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 1.2 1.2L7.5 5M4 12l1.2 1.2L7.5 11M4 18l1.2 1.2L7.5 17"/><path d="M11 6h9M11 12h9M11 18h9"/></svg>';
    var QA_SPACES = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12.5" height="12.5" rx="2.5"/><path d="M15.5 8.5v-3a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg>';

    function renderRail(){
      rail.innerHTML='';
      var scheduledCount = function(){ return threads.filter(function(t){return t.status==='scheduled';}).length; };
      var postsCount = function(){ return threads.filter(function(t){return t.isPost;}).length; };
      var draftsCount = function(){ return threads.filter(function(t){return t.status==='draft';}).length; };
      var defs = [
        ['inbox','INBOX', unreadCount(), '#0f52ba', '#0f52ba', F_INBOX],
        ['unread','UNREAD', null,        '#07925f', '#07925f', F_UNREAD],
        ['sent','SENT',   null,          '#8e24aa', '#8e24aa', F_SENT],

      defs.forEach(function(d){

        b.style.setProperty('--fc', d[3]);

        var ic = el('span','ml-ficon',''); ic.innerHTML = d[5]; b.appendChild(ic);
        var nm = el('span','ml-fname',''); nm.textContent=d[1]; b.appendChild(nm);
        if(d[2]){
          var badge = el('span','ml-badge',''); badge.textContent=d[2]; b.appendChild(badge);
        }
        b.addEventListener('click', function(){
          state.folder=d[0]; state.selectedId=null;
      state.search=''; state.filter='all'; state.selecting=false; state.checked={};
          renderRail(); renderList(); renderRead();
        });
        rail.appendChild(b);
      });
      /* ===== Quick Access: contacts · smart lists · spaces ===== */
      var qaLabel = el('div','ml-qa-label','QUICK ACCESS');

      var qaWrap = el('div','ml-qa');
      var qaDefs = [
        ['contacts','CONTACTS', contacts.length, '#0e7490', QA_CONTACTS],

      ];

    function openQaPanel(kind, title, color){
      closeQaPanel(true);
      var bd = el('div','ml-qa-backdrop');
      var panel = el('aside','ml-qa-panel');
      panel.setAttribute('role','dialog');

      var head = el('div','ml-qa-head');

      tt.style.color = color;
      var x = el('button','ml-qa-x','\u00d7');
      x.type='button';
      x.setAttribute('aria-label','Close panel');
      x.addEventListener('click', function(){ closeQaPanel(false); });
      head.appendChild(tt); head.appendChild(x);
      panel.appendChild(head);
      var listEl = el('div','ml-qa-list');
      function qaRow(main, sub, pc, initial){

        });
        if(!anyL) qaEmpty('No lists yet');
      } else if(kind==='spaces'){
        if(!spaces.length) qaEmpty('No spaces yet');

      if(state.folder==='scheduled') return threads.filter(function(t){ return t.status==='scheduled'; }).sort(function(a,b){return (a.scheduledFor||a.ts)-(b.scheduledFor||b.ts);});
      if(state.folder==='posts') return threads.filter(function(t){ return t.isPost; });
      if(state.folder==='drafts') return threads.filter(function(t){ return t.status==='draft'; });

    function findThread(id){
      for(var i=0;i<threads.length;i++) if(threads[i].id===id) return threads[i];
      return null;
    }

    function selectThread(id){
      var t = findThread(id);
      if(!t) return;
      state.selectedId = id;
      if(t.unread){ t.unread=false; }
      renderRail(); renderList(); renderRead();
      var pane = read.querySelector('.ml-read-subj');
      if(pane) pane.focus();
      /* Delivery-only read: the full body of this thread, for the citizen reading it. */
      if(window.__nmLoadThreadBody){
        window.__nmLoadThreadBody(t).then(function(){ renderRead(); });
      }
    }
      /* ===== Bulk actions ===== */
      function bulkMarkRead(){
        var ids = Object.keys(state.checked).filter(function(k){return state.checked[k];});
        ids.forEach(function(id){ var t=findThread(id); if(t) t.unread=false; });
        state.checked={}; state.selecting=false;
        renderRail(); renderList(); renderRead();
        showToast('Marked '+ids.length+' as read');
      }
      function bulkDelete(){
        var ids = Object.keys(state.checked).filter(function(k){return state.checked[k];});
        if(!ids.length) return;
        /* remove from threads array */
        for(var i=THREADS.length-1;i>=0;i--){ if(ids.indexOf(THREADS[i].id)>-1) THREADS.splice(i,1); }
        if(ids.indexOf(state.selectedId)>-1) state.selectedId=null;
        state.checked={}; state.selecting=false;
        try{ persistSent(); }catch(e){}
        renderRail(); renderList(); renderRead();
        showToast('Deleted '+ids.length+' thread'+(ids.length===1?'':'s'));
      }
      /* ===== Keyboard shortcuts ===== */
      document.addEventListener('keydown', function(ev){
        var tag = (ev.target.tagName||'').toLowerCase();
        var inInput = tag==='input'||tag==='textarea'||tag==='select'||ev.target.isContentEditable;
        if(ev.key==='Escape'){
          if(document.querySelector('.ml-qa-panel')){ closeQaPanel(false); }
          else if(document.querySelector('.mlx-modal')){ closeCompose(); }
          else if(state.selecting){ state.selecting=false; state.checked={}; renderList(); }
          return;
        }
        if(inInput) return;
        if(ev.key==='c'||ev.key==='C'){ ev.preventDefault(); openCompose(); }
        else if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){
          var ts2 = folderThreads();
          if(!ts2.length) return;
          ev.preventDefault();
          var cur = ts2.findIndex(function(t){return t.id===state.selectedId;});

        if(composeMode!=='instant' && !subject){
          err.textContent='Give it a subject first.'; err.style.display='block'; return;
        }
        if(!body){
          err.textContent='The message needs words before sending.'; err.style.display='block'; return;
        }
        var isPost = (composeMode==='post');
        var toIds=[], toKind='person';
        if(isPost){
          toIds=[spaceSel.value]; toKind='space';
        } else {
          for(var i=0;i<sel.options.length;i++){
            if(sel.options[i].selected){
              var parts=sel.options[i].value.split(':');
              toIds.push({kind:parts[0], id:parts.slice(1).join(':')});
            }
          }
          if(!toIds.length){
            err.textContent='Pick at least one recipient.'; err.style.display='block'; return;
          }
        }
        var schedMs = (schedMode==='later') ? schedAt : null;
        if(schedMode==='later' && !schedMs){
          err.textContent='Pick a date and time for the scheduled send.'; err.style.display='block'; return;
        }
        var atIds = Object.keys(attached).filter(function(k){return attached[k];});
        var aliasName = (aliases.filter(function(a){return a.id===aliasSel.value;})[0]||{}).name || me;

        /* expand lists into concrete recipient descriptors for the thread record */
        var toLabel, firstTo, firstKind;
        if(isPost){
          var sp0 = spaceById[spaceSel.value];
          toLabel = sp0?sp0.name:spaceSel.value; firstTo=spaceSel.value; firstKind='space';

          var labels=[];
          toIds.forEach(function(r){

            else if(r.kind==='nlist'){ var nl=nlistById[r.id]; labels.push(nl?nl.name+' ('+nl.noteCount+' notes)':r.id); }
            else if(r.kind==='space'){ var sp2=spaceById[r.id]; labels.push((sp2?sp2.name:r.id)+' (space)'); }
          });
          toLabel = labels.join(', ');
          firstTo = toIds[0].id;
          firstKind = toIds[0].kind==='space' ? 'space' : 'person';
        }

        if(isPost){

          else if(r.kind==='clist'){ var cl = clistById[r.id]; (cl && cl.memberIds || []).forEach(function(m){ nmTargets.push(m); }); }
          else if(r.kind==='space'){ nmTargets.push(r.id); }
        });
        nmTargets = nmTargets.filter(function(v,i,a){ return v && a.indexOf(v)===i; });
        if(!nmTargets.length){ showToast('Pick someone to send to first.'); return; }
        var nmKind = (composeMode==='instant') ? 'dm' : 'mail';

          sendBtn.disabled = false;
          var ok = results.filter(function(r){ return r && r.ok; });
          var fail = results.filter(function(r){ return r && !r.ok; })[0];

          var first = ok[0];
          state.folder = 'sent';
          state.selectedId = first.threadId;
          ok.forEach(function(r){
            threads.unshift({ id:r.threadId, from:me, fromAlias:aliasName, to:r.to, toKind:'person', toLabel:toLabel, mode:composeMode, subject:nmSubj, snippet:body.slice(0,120), body:body, ts:Date.now(), unread:false, demo:false });
          });
          try{
            var recents = window.__nmRecents || [];
            toIds.forEach(function(r){
              var key = r.kind+':'+r.id;
              recents = recents.filter(function(x){ return x.key!==key; });

    b.textContent = r[1];
    if (r[0] === ACTIVE) b.setAttribute('aria-current','page');

  function toggle(which){

  });

  document.body.insertBefore(rightDrawer, document.body.firstChild);
  document.body.insertBefore(leftDrawer, document.body.firstChild);
  document.body.insertBefore(top, document.body.firstChild);
})();

      };
      rec.onend = function(){ if(nmVoice.listening){ try { rec.start(); } catch(e){} } };
      rec.start();
      nmVoice.rec = rec;
    } catch(e){ if(note) note.textContent = 'Transcription is not available here — type instead.'; }
  }
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      nmVoice.media = stream;
      if(window.MediaRecorder){
        try { var mr = new MediaRecorder(stream); mr.start(); nmVoice.mr = mr; } catch(e){}
      }
    }, function(){ /* microphone denied — transcription alone still works */ });
  }
}
function nmSyncToggle(){
  document.querySelectorAll('.nm-toggle-btn').forEach(function(b){
    b.setAttribute('aria-pressed', (b.getAttribute('data-tempo') === nmTempo) ? 'true' : 'false');

}
function nmSetTempo(tempo){

  var st = document.querySelector('.mail-stage'); if(st) st.setAttribute('data-tempo', nmTempo);

    + '<button type="button" class="nm-icon" data-nm-icon="search" style="--ic:#0e7490" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>'
    + '<button type="button" class="nm-icon" data-nm-icon="compose" style="--ic:#a21caf" aria-label="Compose" title="Compose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M13 7l3 3"/></svg></button>'
    + '<button type="button" class="nm-icon" data-nm-icon="send" style="--ic:#c2410c" aria-label="Send" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.5 2.5-6.8 19-3.8-8.6-8.4-3.8z"/><path d="M21.5 2.5 10.9 12.9"/></svg></button>'
    + '</div><p class="nm-note nm-icon-note" id="nmIconNote" hidden></p>'
    + '<div class="nm-steps"><span class="nm-step"><b>1</b> Pick a person</span><span class="nm-step"><b>2</b> Write it</span><span class="nm-step"><b>3</b> Tap Send</span></div>'
    + '<div class="nm-orb-row"><span class="nm-orb">N</span><span class="nm-orb nm-orb2">◆</span></div>';
  stage.insertBefore(chrome, panes);
  stage.insertAdjacentHTML('beforeend', nmMsgViewHtml());
  chrome.querySelectorAll('.nm-toggle-btn').forEach(function(b){
    b.addEventListener('click', function(){ nmSetTempo(b.getAttribute('data-tempo')); });
  });
  nmBootData();
  nmLoadDMs().then(function(){ if(window.__nmActBadgeUpdate) window.__nmActBadgeUpdate(); if(nmTempo === 'chat') nmRefreshMsgView(); });
  nmBindMsgView();
  nmSetTempo(nmTempo); /* sync the initial view to the initial toggle — v2.1 never did, so load showed Mail under a MESSENGER toggle */
  return true;
}
var __nmTries = 0;
var __nmTimer = setInterval(function(){
  __nmTries++;
  if(nmInit() || __nmTries > 40){ clearInterval(__nmTimer); }
}, 250);
window.NayaMsgRebuild = {
  version: '2026-11-24-rebuild2-v3',
  tempo: function(){ return nmTempo; },
  setTempo: nmSetTempo,
  send: sendMessage,
  loadDMs: nmLoadDMs,
  members: function(){ return nmMembers; },
  convs: function(){ return nmConvs; }
};
})();
</script>

<script>
/* REBUILD2 wiring — icon row + ONE bar. Delegated: the chrome is built by nmInit. */
(function(){
  function note(t){ var n = document.getElementById('nmIconNote'); if(!n) return; if(!t){ n.hidden = true; n.textContent=''; return; } n.hidden = false; n.textContent = t; }
  function tempo(t){ if(window.NayaMsgRebuild && window.NayaMsgRebuild.setTempo) window.NayaMsgRebuild.setTempo(t); }
  function focusEl(el){ if(!el) return false; el.scrollIntoView({block:'center'}); el.focus({preventScroll:true}); return true; }
  /* + menu (settled ADD): create a post, create a world, create a note. */
  var plusMenu = null;
  function closePlusMenu(){ if(plusMenu){ plusMenu.remove(); plusMenu = null; } }
  function openPlusMenu(){
    if(plusMenu){ closePlusMenu(); return; }
    var bar = document.querySelector('.nm-onebar');
    plusMenu = document.createElement('div');
    plusMenu.className = 'nm-plus-menu'; plusMenu.setAttribute('role','menu'); plusMenu.setAttribute('aria-label','Create');
    plusMenu.innerHTML = '<button type="button" class="nm-plus-item" data-plus="post" style="--pc:#8e24aa">Create a post</button>'
      + '<button type="button" class="nm-plus-item" data-plus="world" style="--pc:#d4a017">Create a world</button>'
      + '<button type="button" class="nm-plus-item" data-plus="note" style="--pc:#0e7490">Create a note</button>';
    document.body.appendChild(plusMenu);
    var bt = bar ? bar.getBoundingClientRect().top : window.innerHeight - 120;
    plusMenu.style.bottom = Math.max(8, window.innerHeight - bt + 8) + 'px';
    plusMenu.querySelectorAll('[data-plus]').forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        var k = b.getAttribute('data-plus'); closePlusMenu();
        if(k === 'post'){ tempo('mail'); setTimeout(function(){ var c = document.querySelector('.ml-compose-top'); if(c) c.click(); setTimeout(function(){ var m = document.querySelector('.ml-mode[data-mode="post"]'); if(m) m.click(); }, 200); }, 200); }
        else if(k === 'world'){ note('Create a world — not live yet.'); }
        else { note('Create a note — notes live in Smart Notes, not here yet.'); }
      });
    });
  }
  /* ACTIVITY badge: the REAL live unread total from messenger_messages
     (nmConvs unread = to me, never read). No network-wide notifications
     table exists in this build, so no number is ever invented: the badge
     shows only when the live total is above zero, and stays hidden otherwise. */
  window.__nmActBadgeUpdate = function(){
    var badge = document.getElementById('nmActBadge'); if(!badge) return;
    var total = 0;
    try{ (window.NayaMsgRebuild ? window.NayaMsgRebuild.convs() : []).forEach(function(c){ total += (c.unread || 0); }); }catch(e){}
    if(total > 0){ badge.hidden = false; badge.textContent = String(total); badge.setAttribute('aria-label', total + ' unread messages'); }
    else { badge.hidden = true; badge.textContent = ''; }
  };
  document.addEventListener('click', function(ev){
    if(plusMenu && !(ev.target.closest && ev.target.closest('.nm-plus-menu')) && !(ev.target.closest && ev.target.closest('[data-nm-bar="add"]'))){ closePlusMenu(); }
    var ic = ev.target.closest ? ev.target.closest('[data-nm-icon]') : null;
    if(ic){
      var k = ic.getAttribute('data-nm-icon'); note(null);
      if(k === 'mail'){ tempo('mail'); }
      else if(k === 'chat'){ tempo('chat'); }
      else if(k === 'voice'){ var mic = document.getElementById('nmMic'); if(mic){ mic.click(); } else { note('Pick a person first — the mic lives in the composer.'); } }
      else if(k === 'video'){ note('Video calls — not live yet.'); }
      else if(k === 'search'){ if(!focusEl(document.getElementById('nmSearch'))) note('Pick a person first — search lives with the people.'); }
      else if(k === 'compose'){ if(!focusEl(document.getElementById('nmMsgBody'))) focusEl(document.getElementById('nmSearch')); }
      else if(k === 'send'){ var s = document.getElementById('nmMsgSend'); if(s){ s.click(); } else { note('Pick a person first — then write, then send.'); } }
      return;
    }
    var b = ev.target.closest ? ev.target.closest('[data-nm-bar]') : null;
    if(!b) return;
    var a = b.getAttribute('data-nm-bar'); note(null);
    if(a === 'add'){ openPlusMenu(); }
    else if(a === 'mail'){ tempo('mail'); var l = document.getElementById('nmConvList'); if(l) l.scrollIntoView({block:'start'}); }
    else if(a === 'activity'){ tempo('chat'); var c = document.getElementById('nmConvList'); if(c) c.scrollIntoView({block:'start'}); }
    else if(a === 'worlds'){ var w = document.querySelector('.nm-space-pick'); if(w) w.scrollIntoView({block:'center'}); }
    else if(a === 'ecosystem'){ window.location.href = 'https://nayanet.app/hub'; }
    else if(a === 'connect'){ window.location.href = 'https://nayanet.app/rooms/connections'; }
  });
})();
</script>
