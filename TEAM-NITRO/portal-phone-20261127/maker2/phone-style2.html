<style>
/* BLACK DIAMOND PHONE v2 2026-11-27 — the walkthrough as a real object,
   rebuilt to Shawn's ~10:0x collapsed flow.
   Reference: Black Diamond Series phone (dead forward, diamond-faceted chrome

   big elevated purple jewel ball in chrome, ENTER under it).
   Laws: one light top-left 135deg, shadows down-right, inside = board black
   #050607, no glow inside, text Marcellus white 25/19/17, no gray text,
   deep palette only (#8e24aa royal purple), press = scale .97, alive on hover.
   No gold light-ups: unhighlighted white, highlighted purple.
   The white card is the reference's own screen card (white light, black
   Marcellus text — never gray) — the one brief-ordered exception to
   inside-black, named in MAKER-REPORT.md §11.
   D1: the ball is never hidden on the end screen (finish() no longer hides it).
   D2: the end screen fits whole at 390 (tight 2-column end grid).
   D3: NO Skip pill anywhere (his ~10:41 count — no skip button).
   D4: the jewel face is an SVG facet map — chunky triangular facets, not rays.
   D5: the frame ring is 12 discrete 30-degree diamond facets, not striping.
   D6: the whole phone fits in 844 at 390 (ball 96, tight chin) — ENTER
   reachable on arrival, no scroll.
   D7: cards size to their content — no big empty white slab. */
