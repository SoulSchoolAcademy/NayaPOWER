function notesListHTML(list, emptyWords, emptyHint){
  if(!list.length) return emptyState('✧', emptyWords, emptyHint);
  return `<div class="viewcard ph-card"><div class="timeline">${list.slice().sort((a,b)=>(TF_ORDER[a.timeframe]-TF_ORDER[b.timeframe])||String(a.createdAt).localeCompare(String(b.createdAt))).map(n=>`<p><strong>${esc(n.timeframe||'')}</strong> · ${esc(n.type==='smart'?'Smart Note ❖':n.type==='post'?'Post':'Note')} · ${esc(n.world)}${n.rank?' · rank '+n.rank:''} — ${esc(n.text)}</p>`).join('')}</div></div>`;
}
function showView(){
  const ds=selKey();
  const wd=WEEKDAY[new Date(year,month,day).getDay()];
  const notes=dayNotes(ds), books=dayBookings(ds);
  let html=viewHeadHTML(section+' — '+dlabel(year,month,day), ds);
  if(section==='Appointments'){
    html+=appointmentsHTML(ds);
  } else if(section==='Local news'||section==='Provincial news'||section==='Global news'){
    html+=emptyState('♁','No archived news','No archived news for this date in this build. The news archive is not wired yet — and today’s headlines are never shown as past news. When the archive is wired, this view will show sourced, date-stamped headlines published on this day.');
  } else if(section==='Personal feed'||section==='Business feed'||section==='Thing feed'){
    const w=section==='Personal feed'?'Personal':section==='Business feed'?'Business':'Thing';
    const list=dayNotes(ds).filter(n=>n.world===w);
    html+=notesListHTML(list,'Nothing in '+w+' for this day','No records for this day in '+w+'. Nothing is shown from any other day.');
  } else if(section==='Your World'){
    const r=dirFor(ds);
    html+=`<div class="viewcard ph-card"><h3>Your world for this day</h3>
    <div class="statgrid">
      <div class="stat">${miniNumHTML(notes.filter(n=>n.type==='smart').length)}<span>SMART NOTES</span></div>
      <div class="stat">${miniNumHTML(books.length)}<span>APPOINTMENTS</span></div>
      <div class="stat">${miniNumHTML(notes.length)}<span>NOTES + POSTS</span></div>
    </div>
    ${r?`<p><strong>What was learned:</strong> ${esc(r.learned)}</p>`:`<p class="hint">No records for this day — unknown is not zero, and no report is invented.</p>`}
    <p class="hint">Counts from this device's local record only. A past day shows what was recorded for that day — never today's numbers.</p></div>`;
  } else if(section==='Smart Notes for that day'){
    html+=notesListHTML(notes.filter(n=>n.type==='smart'),'No Smart Notes','No Smart Notes recorded for this day. Notes you write are tied to their day and time frame, and the timeline orders them morning to night.');
  } else if(section==='Notes for that day'){
    html+=notesListHTML(notes.filter(n=>n.type==='naya'),'No notes','No notes recorded for this day. Write one from the day menu — it lands on this day, in its time frame.');
  } else if(section==='Weather'){
    html+=emptyState('☀','Weather unavailable','No weather provider is wired yet. Nothing is shown in its place.');
  } else if(section==='Horoscope'){
    html+=emptyState('☾','Horoscope unavailable','No horoscope source is wired yet. Nothing is shown in its place.');
  } else if(section==='Posts for that day'){
    html+=notesListHTML(notes.filter(n=>n.type==='post'),'No posts','No posts for this day yet. A post you write lands here, on its day.');
  } else if(section==='Smart Meet'){
    html+=meetViewHTML(ds);
  } else if(section==='Create'){
    html+=createHTML(ds, isFutureDs(ds));
  } else {
    html+=emptyState('✧','Nothing here','No records for this day in this view.');
  }
  $('viewView').classList.add('show');
  $('viewView').setAttribute('aria-hidden','false');
  $('viewBody').innerHTML=html;
  wireView();
  const h=$('viewBody').querySelector('h2'); if(h){ h.setAttribute('tabindex','-1'); h.focus(); }
  const si=$('searchInput'); if(si){ si.focus(); }
  const ni=$('noteText'); if(ni) ni.focus();
  const be=$('mwCalBookErr'); if(be&&pendingBookErr){ be.textContent=pendingBookErr; pendingBookErr=''; }
}
function wireView(){
  document.querySelectorAll('#viewView [data-op]').forEach(b=>b.onclick=()=>{ const op=b.dataset.op;
    if(meetId&&(op==='back'||op==='close'||op==='prevday'||op==='nextday')) leaveMeet(true);
    if(op==='close'){ closeView(true); return; }
    if(op==='back'){ backToDay(); return; }
    if(op==='prevday'||op==='nextday'){ const d=new Date(year,month,day+(op==='prevday'?-1:1)); year=d.getFullYear(); month=d.getMonth(); day=d.getDate(); render(); pushRoute(); showView(); return; }
    if(op.startsWith('slot:')){ slot=op.slice(5); showView(); return; }
    if(op.startsWith('join:')){ openMeet(op.slice(5)); return; }
    if(op.startsWith('cancel:')){ cancelBooking(op.slice(7)); return; }
    if(op==='confirm'){ confirmBooking(); return; }
    if(op==='saveNote'){ saveNote(); return; }
    if(op==='leaveMeet'){ leaveMeet(); return; }
    section=op; screen='view'; slot=''; pushRoute(); showView();
  });
  document.querySelectorAll('#viewView [data-kind]').forEach(b=>b.onclick=()=>{ createKind=b.dataset.kind; showView(); });
  document.querySelectorAll('#viewView [data-mode]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#viewView [data-mode]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('mwCalMeetMode').value=b.dataset.mode; });
  document.querySelectorAll('#viewView [data-mw-cal-slot]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#viewView [data-mw-cal-slot]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); const h=$('mwCalBookTime'); if(h) h.value=b.dataset.mwCalSlot; });
  const mb=$('mwCalBookMeet'); if(mb) mb.onchange=()=>{ const r=$('mwCalMeetModeRow'); if(r) r.hidden=!mb.checked; };
}
function backToDay(){ $('viewView').classList.remove('show'); $('viewView').setAttribute('aria-hidden','true'); screen='day'; pushRoute(); showDay(); }
function closeView(fromView){
  $('viewView').classList.remove('show'); $('viewView').setAttribute('aria-hidden','true');
  closeDay();
}

/* ============ BOOKING — [C] appointmentsHTML + confirmBooking, owner-only ============ */
/* The old build's visitor paths (public view, open-times-only, taken slots
   hidden) are NOT carried: this build is the citizen's own calendar — the
   brief orders nothing else on the page, no selector, no second view. The
   owner path below is [C] verbatim in function. */
function appointmentsHTML(ds){
  const todayKey=dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  const past=ds<todayKey;
  const books=dayBookings(ds);
  let h=`<div class="viewcard ph-card"><h3>Appointments — ${esc(dlabel(year,month,day))}</h3>`;
  if(books.length){
    h+='<ul class="list">'+books.map(b=>{
      return `<li><b>${esc(fmtTime(b.time))}</b> — ${esc(b.who||'Appointment')}${b.what?' — '+esc(b.what):''}${b.meet?` <span class="chip" style="color:#fff">✧ ${b.mode==='audio'?'Audio meet':'Video meet'}</span> <button class="primo" data-op="join:${esc(b.id)}" type="button">Join the meet →</button>`:''} <button class="primo" data-op="cancel:${esc(b.id)}" type="button">Cancel</button></li>`;
    }).join('')+'</ul>';
  } else h+='<p>No appointments in this calendar’s record for this day.</p>';
  if(past){
    h+='<p class="hint">This day has passed — bookings live on today and the days ahead.</p>';
  } else {
    const firstFree=BOOK_SLOTS.find(t=>!bookTimeTaken(ds,t))||'';
    h+=`<h3 style="margin-top:18px">Book a time on this day</h3>
    <label class="flab">Pick a time</label><div class="slotbox">${BOOK_SLOTS.map(t=>{const taken=bookTimeTaken(ds,t);
      return `<button type="button" class="slot${taken?' taken':''}${(!taken&&t===firstFree)?' on':''}" data-mw-cal-slot="${t}"${taken?' disabled':''}>${taken?`<s>${esc(fmtTime(t))}</s> Taken`:esc(fmtTime(t))}</button>`;}).join('')}</div>
    <input type="hidden" id="mwCalBookTime" value="${esc(firstFree)}">
    ${firstFree?'':`<p class="hint">Every time on this day is booked.</p>`}
    <label class="flab" for="mwCalBookWho">Who are you meeting?</label>
    <input class="field" type="text" id="mwCalBookWho" placeholder="Their name" autocomplete="off">
    <label class="flab" for="mwCalBookWhat">What is it about?</label>
    <input class="field" type="text" id="mwCalBookWhat" placeholder="The subject of the appointment" autocomplete="off">
    <div style="margin-top:12px"><label><input type="checkbox" id="mwCalBookMeet"> Meet with them — Smart Meet, in this calendar</label></div>
    <div id="mwCalMeetModeRow" hidden style="margin-top:10px"><input type="hidden" id="mwCalMeetMode" value="video">
      <button type="button" class="primo" data-mode="audio">Audio meet</button>
      <button type="button" class="primo on" data-mode="video">Video meet</button></div>
    <div class="actions"><button class="primo" data-op="confirm" type="button">Book this time →</button></div>
    <p class="err" id="mwCalBookErr" role="alert"></p>
    <p class="hint">Requested is not confirmed: a booking is confirmed only when it is saved into this calendar's store (<b>mw.cal.bookings.v1</b>). Server sync is not wired yet — bookings live on this device.</p>`;
  }
  return h+'</div>';
}
function confirmBooking(){
  const ds=selKey();
  const time=($('mwCalBookTime')||{}).value||'';
  const who=($('mwCalBookWho')||{}).value.trim();
  const what=($('mwCalBookWhat')||{}).value.trim();
  const err=$('mwCalBookErr');
  if(!time){ if(err) err.textContent='Pick a time first.'; return; }
  if(bookTimeTaken(ds,time)){ pendingBookErr='That time was just taken — pick another time.'; showView(); return; }
  if(!who){ if(err) err.textContent='Add a name so the appointment says who it is with.'; return; }
  const meet=!!($('mwCalBookMeet')||{}).checked;
  const mode=(($('mwCalMeetMode')||{}).value)||'video';
  const all=loadBookings();
  all.push({id:uid(),date:ds,time,who,what,meet,mode});
  if(!saveBookings(all)){ if(err) err.textContent='The booking could not be saved on this device. Nothing was confirmed.'; return; }
  slot=time;
  section='Appointments'; screen='view'; pushRoute(); showView();
  render();
  const card=document.querySelector('#viewBody .viewcard');
  if(card){ const p=document.createElement('p'); p.className='status';
    p.textContent='Booked — '+fmtTime(time)+' on '+dlabel(year,month,day)+'. Saved in this device’s calendar store (mw.cal.bookings.v1). Server sync is not wired yet.';
    card.prepend(p); }
}
function cancelBooking(id){
  const all=loadBookings().filter(b=>b.id!==id);
  saveBookings(all); render(); showView();
}

/* ============ MEET — [C] meetViewHTML + openMeet + leaveMeet verbatim in function ============ */
let meetTimer=null, meetSecs=0, meetStream=null, micOn=true, camOn=true;
function meetViewHTML(ds){
  const books=dayBookings(ds).filter(b=>b.meet);
  let h=`<div class="viewcard ph-card"><h3>Smart Meet — ${esc(dlabel(year,month,day))}</h3>`;
  if(!books.length){ h+='<p>No confirmed Smart Meet booking on this day. Meet joins a confirmed booking only — book a time with Smart Meet first. There is no dead Join button here.</p>'; }
  else h+='<ul class="list">'+books.map(b=>`<li><b>${esc(fmtTime(b.time))}</b> — ${esc(b.who||'')} ${b.what?'— '+esc(b.what):''} (${b.mode==='audio'?'Audio':'Video'}) <button class="primo" data-op="join:${esc(b.id)}" type="button">Join the meet →</button></li>`).join('')+'</ul>';
  h+='<p class="hint">Meet gates: video/audio authorization, runtime availability, waiting room, safe link, guest access, privacy. The live media leg is proven only in a browser that can grant camera and mic — this seat reports the outcome honestly instead of claiming it.</p></div>';
  return h;
}
function openMeet(id){
  const b=loadBookings().find(x=>x.id===id);
  if(!b){ return; }
  meetId=id; meetSecs=0; micOn=true; camOn=true;
  const ds=selKey();
  $('viewBody').innerHTML=viewHeadHTML('Smart Meet — '+fmtTime(b.time), ds)+
   `<div class="viewcard ph-card meetbox"><div class="face" aria-hidden="true">◉</div>
    <h3>${esc(b.who||'Meet')} · ${esc(dlabel(year,month,day))} · ${esc(fmtTime(b.time))} · ${b.mode==='audio'?'Audio':'Video'}</h3>
    <div class="timer" id="meetTimer">${timerTilesHTML(0,0)}</div>
    <p id="meetStatus">Joining the room…</p>
    <video id="meetVideo" autoplay playsinline muted></video>
    <div class="actions" style="justify-content:center">
      <button class="primo" id="micBtn" type="button">🎙 Mic on</button>
      <button class="primo" id="camBtn" type="button">📷 Camera on</button>
      <button class="primo" data-op="leaveMeet" type="button">Leave</button>
    </div>
    <p class="hint">Waiting room: only the booked parties can enter. No recording unless everyone consents — recording is not implemented here.</p></div>`;
  wireView();
  $('micBtn').onclick=()=>{ micOn=!micOn; if(meetStream) meetStream.getAudioTracks().forEach(t=>t.enabled=micOn); $('micBtn').textContent=micOn?'🎙 Mic on':'🎙 Mic off'; };
  $('camBtn').onclick=()=>{ camOn=!camOn; if(meetStream) meetStream.getVideoTracks().forEach(t=>t.enabled=camOn); $('camBtn').textContent=camOn?'📷 Camera on':'📷 Camera off'; };
  meetTimer=setInterval(()=>{ meetSecs++; const t=$('meetTimer'); if(t) t.innerHTML=timerTilesHTML(Math.floor(meetSecs/60),meetSecs%60); },1000);
  const status=$('meetStatus');
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true,video:b.mode!=='audio'}).then(st=>{
      meetStream=st;
      if(status) status.textContent='Camera and mic are live — you are in the room.';
      const v=$('meetVideo');
      if(v&&b.mode!=='audio'){ v.srcObject=st; v.style.display='block'; }
    }).catch(e=>{
      if(status) status.textContent='Camera/mic unavailable here ('+(e&&e.name?e.name:'unknown')+') — you are still in the room, audio/video off. Join from a device that can grant them, or meet in person.';
    });
  } else if(status) status.textContent='This browser cannot grant camera/mic here — you are still in the room. Join from a device that can, or meet in person.';
}
function leaveMeet(keepPanel){
  if(meetTimer){ clearInterval(meetTimer); meetTimer=null; }
  if(meetStream){ meetStream.getTracks().forEach(t=>t.stop()); meetStream=null; }
  meetId='';
  if(!keepPanel){ screen='view'; section='Smart Meet'; showView(); }
}

  ${createKind==='smart'?`<label class="flab" for="noteRank">Rank (1–5 — the highest-ranked Smart Note of the day becomes tomorrow's wisdom)</label>
  <select class="field" id="noteRank"><option value="">No rank</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>`:''}
  <label class="flab" for="noteText">${createKind==='smart'?'Smart Note':createKind==='post'?'Post':'Note'}</label>
  <textarea class="field" id="noteText" placeholder="Write it in your own words…"></textarea>
  <div class="actions"><button class="primo" data-op="saveNote" type="button">Save to this day →</button></div>
  <p class="err" id="noteErr" role="alert"></p>
  <p class="hint">Saved into this device's notes store (mw.cal.notes.v1), with its date, world, source and permission. Nothing is copied into the calendar by hand.</p>
  <div class="actions"><button class="primo" data-op="Appointments" type="button">Or book a time instead →</button></div></div>`;
}
function saveNote(){
  const err=$('noteErr');
  const text=($('noteText')||{}).value.trim();
  if(!text){ if(err) err.textContent='Write the note first.'; return; }
  const tf=($('noteTF')||{}).value||'Morning';
  const world=($('noteWorld')||{}).value||'Personal';
  const rankEl=$('noteRank');
  const all=loadNotes();
  all.push({id:uid(),date:selKey(),world, type:createKind, rank:rankEl?parseInt(rankEl.value||'0',10)||null:null, timeframe:tf, text, createdAt:new Date().toISOString()});
  if(!saveNotes(all)){ if(err) err.textContent='The note could not be saved on this device.'; return; }
  render(); section=createKind==='smart'?'Smart Notes for that day':createKind==='post'?'Posts for that day':'Notes for that day'; screen='view'; pushRoute(); showView();
  /* FIX-7 (item 5b): say where the note landed, at the moment of saving —
     the same .status line confirmBooking prepends for a booking. A Smart
     Note counts in SMART NOTES, a Post in POSTS, a plain Note in NOTES;
     all three count in their world's feed and in INTEL TODAY. Naming the
     bucket here is what stops "NOTES says 0" reading as a stale count: the
     NOTES board counts plain Notes only, by design, and the line says so. */
  const card=document.querySelector('#viewBody .viewcard');
  if(card){ const p=document.createElement('p'); p.className='status';
    p.textContent='Saved — '+(createKind==='smart'?'Smart Note':createKind==='post'?'Post':'Note')+' on '+dlabel(year,month,day)+'. It counts in '+(createKind==='smart'?'SMART NOTES':createKind==='post'?'POSTS':'NOTES')+' and '+world+' feed, and in INTEL TODAY.';
    card.prepend(p); }
}

/* ============ ROUTING — [C] pushRoute/applyState, Month → Day → View → Day → Month ============ */
function pushRoute(){
  const st={view:screen, year, month, day, section};
  try{ history.pushState(st,'',''); }catch(e){}
}
function applyState(st){
  if(!st) return;
  screen=st.view||'month'; year=st.year!=null?st.year:year; month=st.month!=null?st.month:month;
  day=st.day!=null?st.day:day; section=st.section||'Appointments';
  render();
  if(screen==='month'){ $('dayView').classList.remove('show'); $('viewView').classList.remove('show'); }
  else if(screen==='day') showDay();
  else showView();
}
window.addEventListener('popstate',e=>{ leaveMeet(true); applyState(e.state); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&screen!=='month'){
    if(meetId){ leaveMeet(); return; }
    if(screen==='view'){ backToDay(); }
    else closeDay();
  }
  if(e.key==='Tab'&&($('dayView').classList.contains('show')||$('viewView').classList.contains('show'))){
    const scope=screen==='view'?$('viewView'):$('dayView');
    const f=Array.from(scope.querySelectorAll('button,input,textarea,select,[tabindex]'))
      .filter(el=>!el.disabled&&el.type!=='hidden'&&el.getAttribute('tabindex')!=='-1'&&!el.closest('[hidden]'));
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
$('prev').onclick=()=>{ const d=new Date(year,month-1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('next').onclick=()=>{ const d=new Date(year,month+1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
/* SWEEP-3 (F2/F6): the header's now-plaque — today's date and the LIVE
   time, harvested from v15 (renderNowPlaque, index.html lines 2511–2533).
   Read fresh from the viewer's own clock on every tick, so it is always
   their time in their time zone — never hardcoded, never stale. The time
   is just the time: NO zone label ever. There is no TODAY button anymore:
   today reads from this plaque and the weekday plaque. The plaque follows
   TODAY's color — its rim and its live dot take the day's color, never
   gold. The same tick fills the day header's clock (#dayClock, F6) while
   the day view is open. */
function renderNowPlaque(){
  const dEl=$('nowDate'), tEl=$('nowTime');
  if(!dEl||!tEl) return;
  const t=new Date();
  dEl.textContent=dlabel(t.getFullYear(),t.getMonth(),t.getDate());
  tEl.innerHTML=clockTilesHTML(t);
  const dc=WEEKDAY[t.getDay()].color;
  const plaque=$('nowPlaque');
  if(plaque){ plaque.style.setProperty('--dc',dc); plaque.style.setProperty('--dc-rgb',dc.match(/\w\w/g).map(x=>parseInt(x,16)).join(',')); }
  const dcEl=$('dayClock');
  if(dcEl) dcEl.innerHTML=clockTilesHTML(t);
}
/* "Back to today" — the return gesture (v15 line 2117), shown only when
   the viewed month is not the month holding today (render() toggles the
   row). Never the old TODAY button, which stays gone. */
$('backTodayBtn').onclick=()=>{ year=NOW.getFullYear(); month=NOW.getMonth(); day=NOW.getDate(); render(); };
/* SWEEP-3 (F5): the bottom five. ADD opens Create for today — a real
   action. MAIL / ACTIVITY / WORLDS / ECOSYSTEM have no destination inside
   this file, so they answer honestly in the five-note line instead of
   pretending to navigate. */
let fiveNoteTimer=null;
function fiveNote(msg){
  const n=$('fiveNote'); if(!n) return;
  n.textContent=msg; n.hidden=false;
  if(fiveNoteTimer) clearTimeout(fiveNoteTimer);
  fiveNoteTimer=setTimeout(()=>{ n.hidden=true; },4000);
}
$('fiveAdd').onclick=()=>{ year=NOW.getFullYear(); month=NOW.getMonth(); day=NOW.getDate(); render(); openDay(day); section='Create'; screen='view'; pushRoute(); showView(); };
document.querySelectorAll('[data-five]').forEach(b=>b.onclick=()=>fiveNote(b.dataset.five+' is not wired into this calendar yet.'));
render();
renderNowPlaque();
setInterval(renderNowPlaque,1000);
try{ history.replaceState({view:'month',year,month,day},'',''); }catch(e){}
</script></body></html>
