<style>
/* ============ ROOT + BASE ============ */
/* [P] :root — pricing v77, first :root rule. --purple deepened to [L] royal
   purple #8e24aa (the bright #a06bff is superseded by the Deep Palette). */
:root{color-scheme:dark;--ink:#fff;--soft:#e8e8ec;--purple:#8e24aa;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{height:100%}
/* [D] body — dashboard-pass9.html line 628: background #050607, Inter stack.
   Board black is [L] #050607. */
body{background:#050607;color:#F8F7FB;font-family:Inter,system-ui,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ============ THE BOARD — [D] .ph-card verbatim ============ */
/* dashboard-pass9.html lines 2084-2089: gradient, 2px rim, 20px radius,
   inset top light, drop shadow; hover lifts with gold glow. The day cell
   and the view boards are this board, with --dc (the day's color) as the
   rim/glow instead of gold. */
.ph-card{background:linear-gradient(180deg,#07070b,#050607);
  border:2px solid rgba(255,255,255,.16);border-radius:20px;padding:28px;margin-bottom:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.5);
  transition:all .25s;}
.ph-card:hover{border-color:rgba(217,165,33,.6);transform:translateY(-4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 56px rgba(0,0,0,.6),0 0 44px rgba(217,165,33,.25);}
.ph-card h3{font-size:18px;margin:0 0 12px;color:#fff;}
.ph-card p{font-size:14px;color:#fff;margin:0 0 14px;line-height:1.65;}

/* ============ THE PILL BUTTON — [P] .primo verbatim ============ */
/* pricing v77: "Harvested from factory.css (NAYA-BTN-005)". The door pill:
   obsidian pill, radius 999px, rim, white word, icon left, sheen sweep.
   --glow is the door's own color (default: --purple). */
.primo{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:800;font-size:15px;letter-spacing:.08em;color:#F8F7FB;padding:16px 32px;border-radius:999px;border:1.5px solid rgba(248,247,251,.9);
  background:linear-gradient(180deg,#1a1a22 0%,#0a0a0f 45%,#050507 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 2px 6px rgba(255,255,255,.15),inset 0 -8px 16px rgba(0,0,0,.8),0 0 24px rgba(248,247,251,.45),0 0 48px rgba(248,247,251,.15),0 12px 32px rgba(0,0,0,.65);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);--glow:var(--purple);position:relative;overflow:hidden;font-family:inherit}
.primo::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-100%);animation:primo-sheen 3.5s ease-in-out infinite;pointer-events:none}
@keyframes primo-sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.primo:hover{transform:translateY(-2px);border-color:var(--glow);box-shadow:inset 0 0 0 1.5px var(--glow),inset 0 2px 5px rgba(255,255,255,.28),inset 0 -6px 14px rgba(0,0,0,.65),0 0 36px var(--glow),0 14px 36px rgba(0,0,0,.65)}
.primo:active{transform:translateY(1px) scale(.985)}
.primo .ico{font-size:18px;line-height:1}
.primo.on{border-color:var(--glow);box-shadow:inset 0 0 0 1.5px var(--glow),inset 0 2px 5px rgba(255,255,255,.28),inset 0 -6px 14px rgba(0,0,0,.65),0 0 36px var(--glow),0 14px 36px rgba(0,0,0,.65)}

/* ============ THE DIGIT TILE — [D] .os-mini-tile, VERBATIM ============ */
/* dashboard-pass9.html lines 4816-4865 (PASS 3 — ADDENDUM 8), copied
   byte-for-byte: comment, base, cap, digit, med, dollar, gap, dot, pct,
   and the d0–d9 chakra rims/caps. Amendment #3(4) (03:02Z, the newest
   word) restores the Dashboard's EXACT tile values — the brief's deep-digit
   instruction and the Deep Palette's digit supersession are overridden FOR
   THE TILES ONLY. Day colors, door colors and every other system color
   stay Deep Palette [L] per the brief and amendment #3(5). The tile's own
   halo (0 0 12px, alpha .5) is part of the harvested object, not a glow
   added here. A structural diff of this block vs [D] 4821-4865 now returns
   zero differences (see the maker report). */
.os-mini-num{display:inline-flex;align-items:flex-start;gap:3px;white-space:nowrap;vertical-align:middle;}
.os-mini-tile{display:inline-block;width:30px;border-radius:6px;overflow:hidden;vertical-align:top;background:linear-gradient(180deg,#171720,#0f0f15 55%,#020203);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 10px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile .cap{display:block;height:5px;background:linear-gradient(180deg,#e8e8ec,#c9c9cf 55%,#8a8a90);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 2px rgba(0,0,0,.35);}
.os-mini-tile .rd{display:block;height:30px;line-height:30px;text-align:center;font-size:27px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(134,126,152,.65),0 0 16px rgba(255,255,255,.25);}
/* medium: drill / dialog totals — [D] lines 4827-4830 */
.os-mini-num.med{gap:4px;}
.os-mini-num.med .os-mini-tile{width:54px;border-radius:10px;border-width:2px;box-shadow:0 8px 18px rgba(0,0,0,.75),0 0 18px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-num.med .os-mini-tile .cap{height:9px;}
.os-mini-num.med .os-mini-tile .rd{height:54px;line-height:54px;font-size:48px;}
/* the $ tile (money only), the dot tile (decimals), the % tile — [D] 4831-4844 */
.os-mini-tile.dollar{border-color:#ffbf3d;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,191,61,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.dollar .cap{background:linear-gradient(180deg,#fff3a0,#f5d76e 55%,#c9930a);}
.os-mini-gap{flex:none;width:10px;}
.os-mini-num.med .os-mini-gap{width:14px;}
.os-mini-tile.dot{width:12px;}
.os-mini-num.med .os-mini-tile.dot{width:20px;}
.os-mini-tile.dot .rd{display:flex;align-items:flex-end;justify-content:center;height:30px;line-height:1;padding-bottom:4px;box-sizing:border-box;}
.os-mini-num.med .os-mini-tile.dot .rd{height:54px;padding-bottom:8px;}
.os-mini-tile.pct{width:34px;}
.os-mini-num.med .os-mini-tile.pct{width:60px;}
/* chakra colours — the same as the big number */
.os-mini-tile.d0{border-color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,255,255,.45),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d0 .cap{background:linear-gradient(180deg,#fff,#d9d9de 55%,#9a9aa0);}
.os-mini-tile.d1{border-color:#ff2a2a;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,42,42,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d1 .cap{background:linear-gradient(180deg,#ff8a8a,#e60000 55%,#8f0000);}
.os-mini-tile.d2{border-color:#ff8c00;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,140,0,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d2 .cap{background:linear-gradient(180deg,#ffc27a,#ff8c00 55%,#994d00);}
.os-mini-tile.d3{border-color:#f5d76e;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(245,215,110,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d3 .cap{background:linear-gradient(180deg,#fff3a0,#f5d76e 55%,#c9930a);}
.os-mini-tile.d4{border-color:#00a86b;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(0,168,107,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d4 .cap{background:linear-gradient(180deg,#6ee7a0,#00a86b 55%,#005c3a);}
.os-mini-tile.d5{border-color:#29b6f6;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(41,182,246,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d5 .cap{background:linear-gradient(180deg,#a5e3ff,#29b6f6 55%,#0e6b9e);}
.os-mini-tile.d6{border-color:#3f51b5;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(63,81,181,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d6 .cap{background:linear-gradient(180deg,#9aa5ff,#3f51b5 55%,#232a6b);}
.os-mini-tile.d7{border-color:#8e24aa;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(142,36,170,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d7 .cap{background:linear-gradient(180deg,#d8a0ff,#8e24aa 55%,#4d0f5e);}
.os-mini-tile.d8{border-color:#b388ff;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(179,136,255,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d8 .cap{background:linear-gradient(180deg,#e9d5ff,#b388ff 55%,#6d4bb0);}
.os-mini-tile.d9{border-color:#ff1493;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,20,147,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d9 .cap{background:linear-gradient(180deg,#ff9ed2,#ff1493 55%,#8f0057);}
/* [P] .os-mini-tile.inf — the ∞ tile, pricing v77: silver/white,
   black-and-silver (the d0 silver cap language), sized to sit in line
   with the digit tiles. Verbatim. */
.os-mini-tile.inf{width:34px;border-color:#e8e8ec;box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 12px rgba(232,232,236,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.os-mini-tile.inf .cap{background:linear-gradient(180deg,#fff,#d9d9de 55%,#9a9aa0)}
/* (The med-width override for .inf that used to sit here was invented —
   no such rule exists in [D] or [P]. Removed per amendment #3(4). The
   base 34px .inf tile stands, verbatim from [P].) */

/* [P] THE INFO-EYE — .plan-eye verbatim, pricing v77 ============ */
/* The "see what is included" eye (pricing v77, harvested before for the
   Factory flow). A human eye: almond outline, white iris, dark pupil,
   highlight dot. Amendment #3(1): NO color in it — the eye is NORMAL and
   WHITE. The rim and the glow are white only (--pc is white, fixed, not
   the day's color). The SVG markup is pricing v77 verbatim. Placement only
   is adapted: pricing sits it top-right of a plan card; here it sits
   bottom-right of the day cell, the door to the day's info. */
.plan-eye{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;display:grid;place-items:center;border-radius:12px;cursor:pointer;color:#fff;background:radial-gradient(circle at 32% 22%,rgba(255,255,255,.28),rgba(255,255,255,0) 48%),linear-gradient(180deg,#262633,#0b0b12 80%);border:1.5px solid #fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px rgba(0,0,0,.55),0 0 12px rgba(255,255,255,.25)}
.plan-eye svg{width:21px;height:21px;display:block;filter:drop-shadow(0 0 5px rgba(255,255,255,.45))}
.plan-eye:hover,.plan-eye:focus-visible{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 10px rgba(0,0,0,.55),0 0 18px rgba(255,255,255,.45);outline:2px solid #fff;outline-offset:2px}
/* Calendar placement: bottom-right of the day cell, the door to the day. */
.cal-day .plan-eye{top:auto;bottom:10px;right:10px}
@media(max-width:640px){
  .plan-eye{width:30px;height:30px;top:6px;right:6px;border-radius:10px}
  .plan-eye svg{width:17px;height:17px}
  .cal-day .plan-eye{top:auto;bottom:8px;right:8px}
}

/* ============ DAY COLORS — [L] + [C] WEEKDAY ============ */
/* The day's color is its rim at rest; on hover only the OUTSIDE rim
   lights, brighter — the middle never lights (amendment #1, 02:58Z).
   Per-weekday classes carry the deep hex + its rgb triplet for the pearl
   halo. Hz from [C] WEEKDAY. */
.dow-0{--dc:#8e24aa;--dc-rgb:142,36,170}
.dow-1{--dc:#c2410c;--dc-rgb:194,65,12}
.dow-2{--dc:#d4a017;--dc-rgb:212,160,23}
.dow-3{--dc:#0f52ba;--dc-rgb:15,82,186}
.dow-4{--dc:#07925f;--dc-rgb:7,146,95}
.dow-5{--dc:#c62828;--dc-rgb:198,40,40}
.dow-6{--dc:#3f51b5;--dc-rgb:63,81,181}

/* ============ MONTH VIEW — the whole screen is just a calendar ============ */
#monthView{height:100dvh;display:flex;flex-direction:column;padding:16px 16px 12px;gap:10px}
/* The month name + prev/next are the calendar itself — nothing else. */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.cal-title{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:clamp(26px,4.4vw,44px);line-height:1.05;color:#fff;margin:0;text-align:center}
.cal-title em{font-style:normal;color:#e9e0c3}
.cal-nav{display:flex;gap:8px;align-items:center;flex:none}
.cal-nav .primo{padding:12px 18px;font-size:14px}
.cal-nav .primo.today{padding:12px 20px}
/* Weekday names in their day's color — [C] render() colored them so. */
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;flex:none}
.cal-week div{text-align:center;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
/* The grid fills the screen. No scrolling. Rows = the weeks the month
   actually needs (4–6) — the grid ends at the month's last day; no trailing
   next-month days, no trailing blank row at the bottom. Rows stretch to
   fill, so the cells are BIG. */
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;min-height:0}
/* THE DAY BLOCK — the .ph-card board [D], rim in the day's color.
   AMENDMENT (Shawn 02:58Z): the number sits TOP LEFT; the eye sits BOTTOM
   RIGHT and is the door to the day's info; on hover the whole cell does NOT
   light up — only the OUTSIDE rim lights, brighter on hover, with a light
   glow of the day's color even at rest; NO glow in the middle. Every day is
   lit at rest (you can see each day's color line), just not as bright as
   the hovered day. Pearl gems, not neon — Deep Palette hexes only. */
.cal-day{margin:0;padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;cursor:pointer;border:2px solid var(--dc);border-radius:20px;background:linear-gradient(180deg,#07070b,#050607);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.5),0 0 10px rgba(var(--dc-rgb),.22);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease);position:relative;overflow:hidden}
/* Hover: rim only. The middle stays obsidian — no wash, no inner glow.
   The rim brightens and the outside halo strengthens; the number lifts.
   Pearl, never neon — one soft halo, amendment #3(2)(5). */
.cal-day:hover,.cal-day:focus-visible{transform:translateY(-4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 8px rgba(0,0,0,.3),0 20px 44px rgba(0,0,0,.6),0 0 24px rgba(var(--dc-rgb),.45)}
.cal-day:hover .os-mini-tile,.cal-day:focus-visible .os-mini-tile{transform:translateY(-2px)}
.cal-day:active{transform:translateY(1px) scale(.985)}
.cal-day .os-mini-tile{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
/* Today glows brighter than the rest at rest — rim + halo only, never the middle. Pearl. */
.cal-day.today{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 8px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.6),0 0 22px rgba(var(--dc-rgb),.5),0 0 44px rgba(var(--dc-rgb),.22)}
.cal-day.today::after{content:'';position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 14px rgba(var(--dc-rgb),.5)}
/* A day with a record carries one small dot, bottom-left, in its day's
   color — the presence signal, [C] .dots, reduced to a single dot. */
.cal-day .has{position:absolute;left:12px;bottom:12px;width:7px;height:7px;border-radius:50%;background:var(--dc);box-shadow:0 0 8px var(--dc);flex:none}
.cal-day .has.none{visibility:hidden}
.cal-day.blank{background:transparent;border:2px solid transparent;box-shadow:none;cursor:default}
.cal-day.blank:hover{transform:none;background:transparent;box-shadow:none}

/* ============ DAY VIEW — inside the day ============ */
#dayView,#viewView{position:fixed;inset:0;background:#050607;z-index:50;display:none;flex-direction:column;overflow-y:auto;padding:20px 16px 40px}
#dayView.show,#viewView.show{display:flex}
.day-head{max-width:1060px;width:100%;margin:0 auto 8px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.day-head .daynum-wrap{flex:none}
/* [P] THE DAY JEWEL — .os-jewel verbatim, pricing v77 (also Dashboard
   line 4019, same rule). Amendment #2(1): the day header carries a
   beautiful jewel icon for the day — the day's own icon, like a jewel.
   The jewel's color is the day's color (--jc set inline); inside it sits
   the day's frequency — Monday = 417 Hz, orange in it. A number inside a
   jewel is the harvested pattern (pricing carries digits 1–10 in jewels).
   --dc-rgb is set on #dayView by showDay, so the name's glow reads the
   day's color. Amendment #2(2): the day name is white inside with the
   day's color glowing OUTSIDE it; no gray text underneath — the gray date
   line is dropped (the Hz now lives in the jewel). */
.os-jewel{--jc:#cfc09a;display:inline-grid;place-items:center;flex:none;line-height:1;color:#fff;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.30),rgba(255,255,255,0) 48%),linear-gradient(180deg,#262633,#0b0b12 80%);border:1.5px solid var(--jc);border-radius:9px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.6),0 5px 12px rgba(0,0,0,.55),0 0 14px -3px var(--jc);text-shadow:0 0 9px var(--jc),0 1px 2px rgba(0,0,0,.65)}
.os-jewel-lg{width:46px;height:46px;font-size:22px;border-radius:13px}
.day-title{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:clamp(24px,4vw,38px);line-height:1.1;color:#fff;margin:0;text-shadow:0 0 18px rgba(var(--dc-rgb),.5),0 0 48px rgba(var(--dc-rgb),.25)}
.day-back{margin-left:auto}
.view-wrap{max-width:1060px;width:100%;margin:0 auto}
/* The 13 doors — .primo pills [P], each its own color rim via --glow.
   Icon on the left, white word in the middle (Naya Code §2.2). Amendment
   #2(3): a door is NOT a big empty black bar — each carries a live glimpse
   of what's inside it (the .sub), so the bar is a window into the day.
   The doors are wide enough for the glimpse to read (300px min). */
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:18px 0}

   [D] .os-sl-stat: number on top, label underneath. */
.instruments{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}

/* Timeline — [C] .daytimeline board, .ph-card construction, rim in the day color. */
.daytimeline{border:2px solid var(--dc);border-radius:20px;padding:20px 22px;margin:18px 0 0;background:linear-gradient(180deg,#07070b,#050607);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.5),0 0 24px rgba(var(--dc-rgb),.25)}

.tl-time{font-weight:800;font-size:13px;white-space:nowrap}

/* Wisdom + Intel boards — .ph-card boards, rim in the day color. */
.dayboards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:18px 0}

/* Empty state — an object, not a paragraph: board + glyph + day tiles + two words. */

/* Views inside a day */
.view-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 auto 18px;max-width:1060px;width:100%}
.view-head h2{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:clamp(22px,3.4vw,32px);color:#fff;margin:0;flex:1;min-width:220px}

.viewcard .stat{text-align:center;padding:14px 8px;border:1.5px solid rgba(255,255,255,.2);border-radius:14px;background:linear-gradient(180deg,#0a0a0f,#050607)}

/* Booking slots — [C] slot buttons, rebuilt in the pill language. */
.slotbox{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.slot{cursor:pointer;font-weight:800;font-size:14px;color:#fff;padding:12px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);background:linear-gradient(180deg,#1a1a22,#050607);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(0,0,0,.5);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}

.field{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.35);border-radius:12px;color:#fff;font-size:15px;padding:14px;font-family:inherit;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}

.field::placeholder{color:rgba(255,255,255,.85)}
textarea.field{min-height:110px;resize:vertical}
select.field option{background:#0a0a0f;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

.meetbox{text-align:center}

  background:linear-gradient(180deg,#1a1a22,#050607);border:2px solid #8e24aa;box-shadow:0 0 24px rgba(142,36,170,.5),inset 0 1px 0 rgba(255,255,255,.35)}

/* Phone — [D] 480px med-tile overrides, verbatim (lines 4592-4600). */
@media (max-width:480px){
  #monthView{padding:10px 8px 8px;gap:8px}
  .cal-grid{gap:4px}
  .cal-week{gap:5px}

  .cal-day{border-radius:14px;padding:8px 2px;gap:4px}

  .os-sl-gauge-num .os-mini-num.med{gap:3px}
  .os-mini-num.med .os-mini-tile{width:28px;border-radius:5px;border-width:1.5px}
  .os-mini-num.med .os-mini-tile .cap{height:5px}
  .os-mini-num.med .os-mini-tile .rd{height:28px;line-height:28px;font-size:25px}

  .os-mini-num.med .os-mini-tile.pct{width:31px}
  .os-mini-num.med .os-mini-gap{width:7px}
  /* Day numbers on a 390px phone: two 28px tiles + gap = 59px, the cell is
     ~50px — so the day tiles take the harvested 22px revenue-cell pattern
     ([D] lines 4608-4613, same values, selector moved from the 4th gauge
     to the day cell). 2×22+2 = 46px, fits the cell. */
  .cal-day .os-mini-num.med{gap:2px}
  .cal-day .os-mini-num.med .os-mini-tile{width:22px;border-radius:4px;border-width:1.5px}

}

  .primo::before{animation:none}

<body>
<!-- MONTH VIEW — the whole screen is just a calendar. Nothing else. -->
<main id="monthView" aria-label="Living calendar">
  <div class="cal-head">
    <div class="cal-nav"><button class="primo" id="prev" type="button" aria-label="Previous month">‹</button></div>
    <h1 class="cal-title" id="monthname"></h1>
    <div class="cal-nav">
      <button class="primo today" id="todayBtn" type="button">Today</button>
      <button class="primo" id="next" type="button" aria-label="Next month">›</button>
    </div>
  </div>
  <div class="cal-week" id="weeknames" aria-hidden="true"></div>
  <div class="cal-grid" id="days" role="grid" aria-label="Days of the month"></div>
</main>

<!-- DAY VIEW — inside the day. -->
<section id="dayView" aria-label="Day view" aria-hidden="true">
  <div class="day-head" id="dayHead"></div>
  <div class="view-wrap" id="dayBody"></div>
</section>

<!-- DESTINATION VIEW — one door open. Back everywhere. -->

  <div class="view-wrap" id="viewBody"></div>
</section>

<script>
/* ============ STATE ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TZ=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
const NOW=new Date();
let year=NOW.getFullYear(), month=NOW.getMonth(), day=NOW.getDate();
let screen='month', section='Dashboard', slot='', meetId='', createKind='smart';
let lastFocus=null, pendingBookErr='';

/* Weekday identity — [C] WEEKDAY verbatim (colors already the Deep Palette [L]). */
const WEEKDAY=[
 {name:'Sunday',   short:'Sun', color:'#8e24aa', hz:963, label:'purple'},
 {name:'Monday',   short:'Mon', color:'#c2410c', hz:417, label:'orange'},
 {name:'Tuesday',  short:'Tue', color:'#d4a017', hz:528, label:'gold'},
 {name:'Wednesday',short:'Wed', color:'#0f52ba', hz:741, label:'sapphire'},
 {name:'Thursday', short:'Thu', color:'#07925f', hz:639, label:'green'},
 {name:'Friday',   short:'Fri', color:'#c62828', hz:396, label:'red'},
 {name:'Saturday', short:'Sat', color:'#3f51b5', hz:852, label:'indigo'}];

/* The 13 doors, in the brief's exact order and names. Amendment #2(4):
   the door colors follow the SPECTRUM FLOW in order — never the same color
   twice in a row. Playbook order: purple → blue → green → gold → orange →
   red → magenta, then indigo → cyan → violet, cycling. All hexes from the
   Deep Palette [L] only. Icons are the white object-glyphs of [C]'s
   vocabulary. The glimpse under each name is live (doorGlimpse, below) —
   amendment #2(3): a door is a window into the day, not a blank bar. */
const DOORS=[
 ['Appointments','◷','#8e24aa'],
 ['Local news','⌖','#0f52ba'],
 ['Provincial news','▧','#07925f'],
 ['Global news','◎','#d4a017'],
 ['Personal feed','♙','#c2410c'],
 ['Business feed','▣','#c62828'],
 ['Thing feed','◈','#a21caf'],
 ['Your World','✦','#3f51b5'],
 ['Smart Notes for that day','✧','#0e7490'],
 ['Notes for that day','☰','#6d28d9'],
 ['Weather','☀','#8e24aa'],
 ['Horoscope','☾','#0f52ba'],
 ['Posts for that day','✎','#07925f']];

/* ============ DOOR GLIMPSES — amendment #2(3) ============ */
/* Each door carries a live glimpse of what's inside it, from the day's own
   local record only — the next appointment, the count, the latest note.
   Nothing invented: news, weather and horoscope have no live source wired
   yet, so their glimpse says so honestly (the honest-absence rule of the
   brief). The glimpse is rendered under the door's name, white, one line. */
function escT(t){ const s=String(t||''); return s.length>56? s.slice(0,55)+'…' : s; }
function doorGlimpse(name,ds){
  const books=dayBookings(ds), notes=dayNotes(ds);
  const open=BOOK_SLOTS.filter(t=>!bookTimeTaken(ds,t)).length;
  switch(name){
    case 'Appointments': {
      if(!books.length) return open? open+' open times — book one' : 'Fully booked';
      const b=books[0];
      return 'Next: '+fmtTime(b.time)+' — '+(b.who||'Appointment');
    }
    case 'Local news': case 'Provincial news': case 'Global news':
      return 'Archive not wired yet';
    case 'Personal feed': case 'Business feed': case 'Thing feed': {
      const w=name.split(' ')[0];
      const list=notes.filter(n=>n.world===w);
      if(!list.length) return 'Nothing in '+w+' today';
      const last=list[list.length-1];
      return list.length+(list.length===1?' note':' notes')+' · “'+escT(last.text)+'”';
    }
    case 'Your World': {
      const b=books.length, n=notes.length;
      return b+' appointment'+(b===1?'':'s')+' · '+n+' note'+(n===1?'':'s');
    }
    case 'Smart Notes for that day': {
      const list=notes.filter(n=>n.type==='smart');
      if(!list.length) return 'No Smart Notes yet';
      const top=list.filter(n=>n.rank).sort((a,b)=>b.rank-a.rank)[0]||list[list.length-1];
      return list.length+(list.length===1?' Smart Note':' Smart Notes')+' · “'+escT(top.text)+'”';
    }
    case 'Notes for that day': {
      const list=notes.filter(n=>n.type==='naya');
      if(!list.length) return 'No notes yet';
      return list.length+(list.length===1?' note':' notes')+' · “'+escT(list[list.length-1].text)+'”';
    }
    case 'Weather': return 'No provider wired';
    case 'Horoscope': return 'No source wired';
    case 'Posts for that day': {
      const list=notes.filter(n=>n.type==='post');
      if(!list.length) return 'No posts yet';
      return list.length+(list.length===1?' post':' posts')+' · “'+escT(list[list.length-1].text)+'”';
    }
  }
  return '';
}

/* ============ DIGIT TILES — [D] miniTileHTML + _osMiniNumHTML verbatim ============ */
/* dashboard-pass9.html lines 26593-26620: one number, one style. A landed
   tile shows cap + digit + rim + digit colour. Money gets the $ tile,
   decimals a dot tile, percentages a % tile. A comma becomes a gap. */
function miniTileHTML(ch){
  if (ch === ' ' || ch === ',') return '<span class="os-mini-gap"></span>';
  if (ch === '$') return '<span class="os-mini-tile dollar"><span class="cap"></span><span class="rd">$</span></span>';
  if (ch === '.') return '<span class="os-mini-tile dot"><span class="cap"></span><span class="rd">.</span></span>';
  if (ch === '%') return '<span class="os-mini-tile pct"><span class="cap"></span><span class="rd">%</span></span>';
  if (ch === '∞') return '<span class="os-mini-tile inf"><span class="cap"></span><span class="rd">∞</span></span>';
  var d = parseInt(ch, 10);
  if (!isFinite(d)) return '';
  return '<span class="os-mini-tile d' + d + '"><span class="cap"></span><span class="rd">' + d + '</span></span>';
}
function miniNumHTML(value, size){
  if (value == null) return '—';
  var str = String(value).trim().replace(/,/g, ' ').replace(/ +/g, ' ');
  if (str === '' || str === '—' || str === '-') return '—';
  if (!/^[$]?[0-9][0-9 ]*(\.[0-9]+)?%?$/.test(str) && str !== '∞') return esc(String(value));
  var cls = (size === 'med') ? 'os-mini-num med' : 'os-mini-num';
  var html = '<span class="' + cls + '">';
  for (var i = 0; i < str.length; i++) html += miniTileHTML(str[i]);
  return html + '</span>';
}

/* ============ STORES — [C] verbatim ============ */
/* Booking logic harvested from the old calendar build (branch
   personal/calendar-booking-meet-20261116, blob 15e0a2fc): store
   'mw.cal.bookings.v1', 9 hourly slots 09:00-17:00, taken slots disabled,
   double-booking refused, survives reload. Meet room: getUserMedia on join. */
const BOOK_KEY='mw.cal.bookings.v1';
const NOTE_KEY='mw.cal.notes.v1';
const BOOK_SLOTS=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
function loadBookings(){ try{ var a=JSON.parse(localStorage.getItem(BOOK_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveBookings(a){ try{ localStorage.setItem(BOOK_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function dayBookings(ds){ return loadBookings().filter(b=>b.date===ds).sort((x,y)=>String(x.time).localeCompare(String(y.time))); }
function bookTimeTaken(ds,t){ return dayBookings(ds).some(b=>b.time===t); }
function loadNotes(){ try{ var a=JSON.parse(localStorage.getItem(NOTE_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveNotes(a){ try{ localStorage.setItem(NOTE_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function dayNotes(ds, w){ return loadNotes().filter(n=>n.date===ds && (!w || n.world===w)); }
function fmtTime(t){ try{ var h=+t.slice(0,2), m=t.slice(3); var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }catch(e){ return t; } }
function dateKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function selKey(){ return dateKey(year,month,day); }
function isToday(y,m,d){ return y===NOW.getFullYear()&&m===NOW.getMonth()&&d===NOW.getDate(); }
function isFutureDs(ds){ return ds>dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()); }
function dlabel(y,m,d){ return new Date(y,m,d).toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const TF_ORDER={Morning:0,Afternoon:1,Evening:2};

/* Fallback wisdom store — [C] WISDOM_STORE verbatim, 7 lines. */
const WISDOM_STORE=[
 'The day is yours to shape — begin with the one thing that matters most, and let the rest follow.',
 'Ask Naya to carry the small things, so your mind stays free for the big ones.',
 'A note written down is a thought kept — what you record today, you can build on tomorrow.',
 'Success is a habit, not a moment — small steps, taken every day, add up to a life.',
 'Work with the intelligence beside you, not against it — tell it what you want, and let it do the doing.',
 'Share what you learn — wisdom grows when it is given away.',
 'Rest is part of the work — a clear mind sees further than a tired one.'];

/* ============ DAILY WISDOM / REPORT / INTEL — [C] verbatim ============ */
function wisdomFor(ds){
  const parts=ds.split('-').map(Number);
  const prev=new Date(parts[0],parts[1]-1,parts[2]-1);
  const prevKey=dateKey(prev.getFullYear(),prev.getMonth(),prev.getDate());
  const ranked=loadNotes().filter(n=>n.date===prevKey&&n.type==='smart'&&n.rank)
    .sort((a,b)=>(b.rank-a.rank)||String(a.createdAt).localeCompare(String(b.createdAt)));
  if(ranked.length) return {text:ranked[0].text, source:'Carried forward — the highest-ranked Smart Note of '+dlabel(prev.getFullYear(),prev.getMonth(),prev.getDate())};
  const idx=Math.floor(new Date(parts[0],parts[1]-1,parts[2]).getTime()/86400000);
  return {text:WISDOM_STORE[((idx%WISDOM_STORE.length)+WISDOM_STORE.length)%WISDOM_STORE.length], source:'NayaNET wisdom store — from what we have learned'};
}
function dirFor(ds){
  const notes=dayNotes(ds), books=dayBookings(ds);
  if(!notes.length && !books.length) return null;
  const smart=notes.filter(n=>n.type==='smart'), naya=notes.filter(n=>n.type==='naya'), posts=notes.filter(n=>n.type==='post');
  const top=notes.filter(n=>n.rank).sort((a,b)=>b.rank-a.rank)[0];
  return {notes:notes.length, smart:smart.length, naya:naya.length, posts:posts.length,
    books:books.length,
    learned: top ? top.text : 'Nothing was recorded as learned on this day yet.'};
}
function intelLine(ds){
  const books=dayBookings(ds), notes=dayNotes(ds);
  const bits=[];
  if(books.length) bits.push(books.length+(books.length===1?' appointment':' appointments')+' booked');
  if(notes.length) bits.push(notes.length+(notes.length===1?' note':' notes')+' saved');
  if(!bits.length) bits.push('No records for this day yet');
  bits.push('News archive not wired — no headlines shown for this date');
  return bits.join(' · ')+'.';
}
function dirLine(ds){
  if(isFutureDs(ds)) return 'This day has not happened yet — no report until the day has a record.';
  const r=dirFor(ds);
  return r? (r.notes+' notes · '+r.books+' appointments · what was learned: '+r.learned) : 'No report — no records for this day.';
}

/* ============ TIMELINE JOURNAL — [C] timelineHTML, world filter removed ============ */
/* The day's whole story in time order, built ONLY from the day's own local
   record: bookings by their time; notes by time frame (Morning 09:00,
   Afternoon 14:00, Evening 19:00) then created time. Past days show their
   real record; future days show what is booked and what is open; today
   shows both. News: the archive is not wired, so the timeline says so
   honestly instead of inventing headlines. */
function timelineHTML(ds){
  const todayKey=dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  const past=ds<todayKey, future=isFutureDs(ds);
  const TF_MIN={Morning:540,Afternoon:840,Evening:1140};
  const entry=(min,time,color,kind,text)=>`<li style="--tc:${color}"><span class="tl-time">${esc(time)}</span><span class="tl-kind">${esc(kind)}</span><div class="tl-text">${esc(text)}</div></li>`;
  const entries=[];
  dayBookings(ds).forEach(b=>{
    const h=+String(b.time).slice(0,2), m=+String(b.time).slice(3);
    entries.push({min:h*60+m, html:entry(h*60+m,fmtTime(b.time),'#07925f','Appointment'+(b.meet?' · Smart Meet':''),(b.who||'Appointment')+(b.what?' — '+b.what:''))});
  });
  dayNotes(ds).forEach(n=>{
    const kind=n.type==='smart'?'Smart Note ✧':n.type==='post'?'Post':'Note';
    const color=n.type==='smart'?'#6d28d9':n.type==='post'?'#07925f':'#c62828';
    entries.push({min:TF_MIN[n.timeframe]||540, html:entry(TF_MIN[n.timeframe]||540,n.timeframe||'Morning',color,kind+' · '+n.world,n.text)});
  });
  entries.sort((a,b)=>a.min-b.min);
  const sub=past?'What went on this day — from this day’s own record.':future?'What is booked, and what is still open.':'Today so far, and what is still open.';
  let body='';
  if(entries.length) body=`<ol class="tl-list">${entries.map(e=>e.html).join('')}</ol>`;
  else body=`<p class="tl-empty">${past?'No records for this day — nothing was recorded. Unknown is not zero, and no record is invented.':'Nothing booked or written for this day yet.'}</p>`;
  if(!past){
    const open=BOOK_SLOTS.filter(t=>!bookTimeTaken(ds,t));
    body+=open.length?`<p class="tl-note">Open times on this day: ${open.map(t=>esc(fmtTime(t))).join(', ')} — bookable.</p>`:`<p class="tl-note">Every time on this day is booked.</p>`;
  }
  body+=`<p class="tl-note">News for this day: the news archive is not wired yet — no headlines are shown, and today’s headlines are never shown as past news.</p>`;
  return `<section class="daytimeline" aria-label="Timeline for this day"><strong>THE DAY, IN ORDER</strong><div class="tl-sub">${esc(sub)}</div>${body}</section>`;
}

function render(){

function confirmBooking(){
  const ds=selKey();
  const time=($('mwCalBookTime')||{}).value||'';
  const who=($('mwCalBookWho')||{}).value.trim();
  const what=($('mwCalBookWhat')||{}).value.trim();
  const err=$('mwCalBookErr');
  if(!time){ if(err) err.textContent='Pick a time first.'; return; }
  if(bookTimeTaken(ds,time)){ pendingBookErr='That time was just taken — pick another time.'; showView(); return; }
  if(!who){ if(err) err.textContent='Add a name so the appointment says who it is with.'; return; }
  const meet=!!($('mwCalBookMeet')||{}).checked;
  const mode=(($('mwCalMeetMode')||{}).value)||'video';
  const all=loadBookings();
  all.push({id:uid(),date:ds,time,who,what,meet,mode});
  if(!saveBookings(all)){ if(err) err.textContent='The booking could not be saved on this device. Nothing was confirmed.'; return; }
  slot=time;
  section='Appointments'; screen='view'; pushRoute(); showView();
  render();
  const card=document.querySelector('#viewBody .viewcard');
  if(card){ const p=document.createElement('p'); p.className='status';
    p.textContent='Booked — '+fmtTime(time)+' on '+dlabel(year,month,day)+'. Saved in this device’s calendar store (mw.cal.bookings.v1). Server sync is not wired yet.';
    card.prepend(p); }
}
function cancelBooking(id){
  const all=loadBookings().filter(b=>b.id!==id);
  saveBookings(all); render(); showView();
}

  const ds=selKey();
  $('viewBody').innerHTML=viewHeadHTML('Smart Meet — '+fmtTime(b.time), ds)+
   `<div class="viewcard ph-card meetbox"><div class="face" aria-hidden="true">◉</div>
    <h3>${esc(b.who||'Meet')} · ${esc(dlabel(year,month,day))} · ${esc(fmtTime(b.time))} · ${b.mode==='audio'?'Audio':'Video'}</h3>
    <div class="timer" id="meetTimer">00:00</div>
    <p id="meetStatus">Joining the room…</p>
    <video id="meetVideo" autoplay playsinline muted></video>
    <div class="actions" style="justify-content:center">
      <button class="primo" id="micBtn" type="button">🎙 Mic on</button>
      <button class="primo" id="camBtn" type="button">📷 Camera on</button>
      <button class="primo" data-op="leaveMeet" type="button">Leave</button>
    </div>
    <p class="hint">Waiting room: only the booked parties can enter. No recording unless everyone consents — recording is not implemented here.</p></div>`;
  wireView();
  $('micBtn').onclick=()=>{ micOn=!micOn; if(meetStream) meetStream.getAudioTracks().forEach(t=>t.enabled=micOn); $('micBtn').textContent=micOn?'🎙 Mic on':'🎙 Mic off'; };
  $('camBtn').onclick=()=>{ camOn=!camOn; if(meetStream) meetStream.getVideoTracks().forEach(t=>t.enabled=camOn); $('camBtn').textContent=camOn?'📷 Camera on':'📷 Camera off'; };
  meetTimer=setInterval(()=>{ meetSecs++; const m=String(Math.floor(meetSecs/60)).padStart(2,'0'), s=String(meetSecs%60).padStart(2,'0'); const t=$('meetTimer'); if(t) t.textContent=m+':'+s; },1000);
  const status=$('meetStatus');
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true,video:b.mode!=='audio'}).then(st=>{
      meetStream=st;
      if(status) status.textContent='Camera and mic are live — you are in the room.';
      const v=$('meetVideo');
      if(v&&b.mode!=='audio'){ v.srcObject=st; v.style.display='block'; }
    }).catch(e=>{
      if(status) status.textContent='Camera/mic unavailable here ('+(e&&e.name?e.name:'unknown')+') — you are still in the room, audio/video off. Join from a device that can grant them, or meet in person.';
    });
  } else if(status) status.textContent='This browser cannot grant camera/mic here — you are still in the room. Join from a device that can, or meet in person.';
}
function leaveMeet(keepPanel){
  if(meetTimer){ clearInterval(meetTimer); meetTimer=null; }
  if(meetStream){ meetStream.getTracks().forEach(t=>t.stop()); meetStream=null; }
  meetId='';
  if(!keepPanel){ screen='view'; section='Smart Meet'; showView(); }
}

/* ============ CREATE — [C] createHTML + saveNote, owner-only ============ */
function createHTML(ds, future){
  const kinds=[['smart','Smart Note ✧'],['naya','Note'],['post','Post']];
  return `<div class="viewcard ph-card"><h3>Create — ${esc(dlabel(year,month,day))}</h3>
  <p>Create on this day. A note is tied to its day and time frame; the timeline orders it morning to night.</p>
  <div class="actions">${kinds.map(([k,l])=>`<button class="primo${createKind===k?' on':''}" data-kind="${k}" type="button">${l}</button>`).join('')}</div>
  <label class="flab" for="noteTF">Time frame</label>
  <select class="field" id="noteTF"><option>Morning</option><option>Afternoon</option><option>Evening</option></select>
  <label class="flab" for="noteWorld">Which world is this for?</label>
  <select class="field" id="noteWorld"><option>Personal</option><option>Business</option><option>Thing</option></select>
  ${createKind==='smart'?`<label class="flab" for="noteRank">Rank (1–5 — the highest-ranked Smart Note of the day becomes tomorrow's wisdom)</label>
  <select class="field" id="noteRank"><option value="">No rank</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>`:''}
  <label class="flab" for="noteText">${createKind==='smart'?'Smart Note':createKind==='post'?'Post':'Note'}</label>
  <textarea class="field" id="noteText" placeholder="Write it in your own words…"></textarea>
  <div class="actions"><button class="primo" data-op="saveNote" type="button">Save to this day →</button></div>
  <p class="err" id="noteErr" role="alert"></p>
  <p class="hint">Saved into this device's notes store (mw.cal.notes.v1), with its date, world, source and permission. Nothing is copied into the calendar by hand.</p>
  <div class="actions"><button class="primo" data-op="Appointments" type="button">Or book a time instead →</button></div></div>`;
}
function saveNote(){
  const err=$('noteErr');
  const text=($('noteText')||{}).value.trim();
  if(!text){ if(err) err.textContent='Write the note first.'; return; }
  const tf=($('noteTF')||{}).value||'Morning';
  const world=($('noteWorld')||{}).value||'Personal';
  const rankEl=$('noteRank');
  const all=loadNotes();
  all.push({id:uid(),date:selKey(),world, type:createKind, rank:rankEl?parseInt(rankEl.value||'0',10)||null:null, timeframe:tf, text, createdAt:new Date().toISOString()});
  if(!saveNotes(all)){ if(err) err.textContent='The note could not be saved on this device.'; return; }
  render(); section=createKind==='smart'?'Smart Notes for that day':createKind==='post'?'Posts for that day':'Notes for that day'; screen='view'; pushRoute(); showView();
}

/* ============ ROUTING — [C] pushRoute/applyState, Month → Day → View → Day → Month ============ */
function pushRoute(){
  const st={view:screen, year, month, day, section};
  try{ history.pushState(st,'',''); }catch(e){}
}
function applyState(st){
  if(!st) return;
  screen=st.view||'month'; year=st.year!=null?st.year:year; month=st.month!=null?st.month:month;
  day=st.day!=null?st.day:day; section=st.section||'Appointments';
  render();
  if(screen==='month'){ $('dayView').classList.remove('show'); $('viewView').classList.remove('show'); }
  else if(screen==='day') showDay();
  else showView();
}
window.addEventListener('popstate',e=>{ leaveMeet(true); applyState(e.state); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&screen!=='month'){
    if(meetId){ leaveMeet(); return; }
    if(screen==='view'){ backToDay(); }
    else closeDay();
  }
  if(e.key==='Tab'&&($('dayView').classList.contains('show')||$('viewView').classList.contains('show'))){
    const scope=screen==='view'?$('viewView'):$('dayView');
    const f=Array.from(scope.querySelectorAll('button,input,textarea,select,[tabindex]'))
      .filter(el=>!el.disabled&&el.type!=='hidden'&&el.getAttribute('tabindex')!=='-1'&&!el.closest('[hidden]'));
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
$('prev').onclick=()=>{ const d=new Date(year,month-1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('next').onclick=()=>{ const d=new Date(year,month+1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('todayBtn').onclick=()=>{ year=NOW.getFullYear(); month=NOW.getMonth(); day=NOW.getDate(); render(); };
render();
try{ history.replaceState({view:'month',year,month,day},'',''); }catch(e){}
</script></body></html>
