<style>
/* ============ ROOT + BASE ============ */
/* [P] :root — pricing v77, first :root rule. --purple deepened to [L] royal
   purple #8e24aa (the bright #a06bff is superseded by the Deep Palette). */
:root{color-scheme:dark;--ink:#fff;--soft:#e8e8ec;--purple:#8e24aa;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{height:100%}
/* [D] body — dashboard-pass9.html line 628: background #050607, Inter stack.
   Board black is [L] #050607. */
body{background:#050607;color:#F8F7FB;font-family:Inter,system-ui,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ============ THE BOARD — [D] .ph-card verbatim ============ */
/* dashboard-pass9.html lines 2084-2089: gradient, 2px rim, 20px radius,
   inset top light, drop shadow; hover lifts with gold glow. The day cell
   and the view boards are this board, with --dc (the day's color) as the
   rim/glow instead of gold. */
.ph-card{background:linear-gradient(135deg,#07070b,#050607);
  border:2px solid rgba(255,255,255,.16);border-radius:20px;padding:28px;margin-bottom:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3),8px 14px 36px rgba(0,0,0,.5);
  transition:all .25s;}
.ph-card:hover{border-color:rgba(212,160,23,.6);transform:translateY(-4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),14px 24px 56px rgba(0,0,0,.6),0 0 44px rgba(212,160,23,.25);}
.ph-card h3{font-size:18px;margin:0 0 12px;color:#fff;}
.ph-card p{font-size:17px;color:#fff;margin:0 0 14px;line-height:1.65;}

/* ============ THE PILL BUTTON — [P] .primo verbatim ============ */
/* pricing v77: "Harvested from factory.css (NAYA-BTN-005)". The door pill:
   obsidian pill, radius 999px, rim, white word, icon left, sheen sweep.
   --glow is the door's own color (default: --purple). */
.primo{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:800;font-size:17px;letter-spacing:.08em;color:#F8F7FB;padding:16px 32px;border-radius:999px;border:1.5px solid rgba(248,247,251,.9);
  background:linear-gradient(135deg,#1a1a22 0%,#0a0a0f 45%,#050507 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 2px 6px rgba(255,255,255,.15),inset 0 -8px 16px rgba(0,0,0,.8),0 0 24px rgba(248,247,251,.45),0 0 48px rgba(248,247,251,.15),7px 12px 32px rgba(0,0,0,.65);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);--glow:var(--purple);position:relative;overflow:hidden;font-family:inherit}
.primo::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-100%);animation:primo-sheen 120s ease-in-out infinite;pointer-events:none}
/* SWEEP-3 (F7): the sheen was a 3.5s infinite sweep on EVERY button at rest
   — faster than the 12s ambient floor, decorative motion that means
   nothing. It now runs once per 120s, inside the 60–180s ambient band
   (laws §1: slow, alternating, never faster than 12s ambient). The
   keyframes still hold the sweep off-screen for the first 60% of the
   cycle, so the sweep itself stays a brief pass, not a constant shimmer.
   prefers-reduced-motion still disables it (below). */
@keyframes primo-sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.primo:hover{transform:translateY(-2px);border-color:var(--glow);box-shadow:inset 0 0 0 1.5px var(--glow),inset 0 2px 5px rgba(255,255,255,.28),inset 0 -6px 14px rgba(0,0,0,.65),0 0 36px var(--glow),8px 14px 36px rgba(0,0,0,.65)}
.primo:active{transform:translateY(1px) scale(.985)}
.primo .ico{font-size:18px;line-height:1}
.primo.on{border-color:var(--glow);box-shadow:inset 0 0 0 1.5px var(--glow),inset 0 2px 5px rgba(255,255,255,.28),inset 0 -6px 14px rgba(0,0,0,.65),0 0 36px var(--glow),8px 14px 36px rgba(0,0,0,.65)}

/* ============ THE DIGIT TILE — [D] .os-mini-tile, FORM VERBATIM, VALUES DEEP ============ */
/* dashboard-pass9.html lines 4816-4865 (PASS 3 — ADDENDUM 8): the form is
   copied byte-for-byte — comment, base, cap, digit, med, dollar, gap, dot,
   pct, and the d0–d9 chakra rims/caps. The VALUES are the Deep Palette
   [L], per the 03:47Z scorecard (7) — the newest word on the tiles,
   superseding amendment #3(4)'s verbatim-bright rule: the bright rims
   (red 1, indigo 6, orange, gold, green all at once) fought, and the
   order is ONE elegant flow, Deep Palette only. So d1–d5, d8–d9 and the $
   tile take their hue's deep hex for rim, cap mid, and glow; d0, d6, d7
   already were their deep hex and stand. Each cap gradient is derived
   from its deep hex by the file's own lighten/darken rule — light = hex
   mixed 55% toward white, dark = hex mixed 45% toward black, mid = hex —
   the same relationship [D]'s own d7 cap already uses (#d8a0ff / #8e24aa /
   #4d0f5e; the formula reproduces it as #cc9cd9 / #8e24aa / #4e145e).
   Day colors, door colors and every other system color stay Deep Palette
   [L]. The tile's own halo (0 0 12px, alpha .5) is part of the harvested
   object, not a glow added here. A structural diff of this block vs [D]
   4821-4865 now returns differences ONLY in these rim/cap/glow values
   (see the maker report). */
.os-mini-num{display:inline-flex;align-items:flex-start;gap:3px;white-space:nowrap;vertical-align:middle;}
.os-mini-tile{display:inline-block;width:30px;border-radius:6px;overflow:hidden;vertical-align:top;background:linear-gradient(135deg,#171720,#0f0f15 55%,#020203);border:1.5px solid rgba(255,255,255,.9);box-shadow:2px 4px 10px rgba(0,0,0,.7),0 0 10px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile .cap{display:block;height:5px;background:linear-gradient(135deg,#e8e8ec,#c9c9cf 55%,#8a8a90);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 2px rgba(0,0,0,.35);}
.os-mini-tile .rd{display:block;height:30px;line-height:30px;text-align:center;font-size:27px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(134,126,152,.65),0 0 16px rgba(255,255,255,.25);}
/* medium: drill / dialog totals — [D] lines 4827-4830 */
.os-mini-num.med{gap:4px;}
.os-mini-num.med .os-mini-tile{width:54px;border-radius:10px;border-width:2px;box-shadow:5px 8px 18px rgba(0,0,0,.75),0 0 18px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-num.med .os-mini-tile .cap{height:9px;}
.os-mini-num.med .os-mini-tile .rd{height:54px;line-height:54px;font-size:48px;}
/* FIX-7 (item 1): a two-digit DATE is one object. Fix-6's seam (gap:0 +
   -2px overlap) only closed the flex gap: each tile kept its own rounded
   corners, rim, cap and halo, so "17" still read live as two tiles — in
   the month grid (never patched) and in the day header. The join is
   structural now: miniNumHTML emits ONE .duo tile holding both digits
   (white, as in every tile) when the number is a two-digit day, rim/cap/
   glow in the DAY's color — per-date, not per-digit. One border, one cap,
   one shadow: one date. Counts never take this path (no label, no color)
   and keep their per-digit tiles. The cell rule (0,5,0) beats every
   per-breakpoint tile width below (0,4,0), so the duo tile always sizes
   to its two digits instead of being squeezed into one digit's width. */
.os-mini-num .os-mini-tile.duo{width:auto;min-width:0;padding:0 6px;border-color:var(--dc);box-shadow:2px 4px 10px rgba(0,0,0,.7),0 0 12px rgba(var(--dc-rgb),.5),inset 0 1px 0 rgba(255,255,255,.35)}
.os-mini-num.med .os-mini-tile.duo{width:auto;padding:0 8px;box-shadow:5px 8px 18px rgba(0,0,0,.75),0 0 18px rgba(var(--dc-rgb),.5),inset 0 1px 0 rgba(255,255,255,.35)}
.cal-day .os-mini-num.med .os-mini-tile.duo{width:auto;padding:0 2px}
/* the $ tile (money only), the dot tile (decimals), the % tile — [D] 4831-4844 */
.os-mini-tile.dollar{border-color:#d4a017;box-shadow:2px 4px 10px rgba(0,0,0,.7),0 0 12px rgba(212,160,23,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.dollar .cap{background:linear-gradient(135deg,#ecd497,#d4a017 55%,#75580d);}
.os-mini-gap{flex:none;width:10px;}
.os-mini-num.med .os-mini-gap{width:14px;}
.os-mini-tile.dot{width:12px;}
.os-mini-num.med .os-mini-tile.dot{width:20px;}
.os-mini-tile.dot .rd{display:flex;align-items:flex-end;justify-content:center;height:30px;line-height:1;padding-bottom:4px;box-sizing:border-box;}
.os-mini-num.med .os-mini-tile.dot .rd{height:54px;padding-bottom:8px;}
.os-mini-tile.pct{width:34px;}
.os-mini-num.med .os-mini-tile.pct{width:60px;}
/* chakra colours — the same as the big number */
.os-mini-tile.d0{border-color:#fff;box-shadow:2px 4px 10px rgba(0,0,0,.7),0 0 12px rgba(255,255,255,.45),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d0 .cap{background:linear-gradient(135deg,#fff,#d9d9de 55%,#9a9aa0);}
.os-mini-tile.d1{border-color:#c62828;box-shadow:2px 4px 10px rgba(0,0,0,.7),0 0 12px rgba(198,40,40,.5),inset 0 1px 0 rgba(255,255,255,.35);}
.os-mini-tile.d1 .cap{background:linear-gradient(135deg,#e59e9e,#c62828 55%,#6d1616);}
.os-mini-tile.d2{border-color:#c2410c;box-shadow:2px 4px 10px rgba(0,0,0,.7),0 0 12px rgba(194,65,12,.5),inset 0 1px 0 rgba(255,255,255,.35);}

/* [P] THE INFO EYE — the harvested .eye-jewel circle, pricing v77 ===== */
/* Amendment #4(2) (Shawn's eye, 03:19Z): the info eye becomes a CIRCLE, a
   real element coming off the page, pearl/diamond, with a little 'i' info
   thing inside it so people know to click it for the day's info. The
   object already exists in [P] — pricing v77 line 140 `.eye-jewel`
   (20px circle, Marcellus 700, border-radius:50%). `.eye-jewel` exists in
   pricing only as CSS (lines 140, 1460), never in markup — no
   'i'-inside-a-white-jewel usage exists there; pricing's nearest usage is
   the white jewel + SVG eye at [P] line 2259. The 'i' here is the
   amendment's directed mark. This button IS that object, at the
   harvested .os-jewel-md size (36px, 17px — [P] line 42): the .os-jewel
   base below (verbatim from [P], already in this file) with --jc:#ffffff,
   border-radius:50% from .eye-jewel, Marcellus 700 from .eye-jewel.
   Pearl/diamond = the jewel in white: white rim, white glow outside, and
   the 'i' itself white (the .os-jewel's own color:#fff).
   v5 (Shawn's eye, 03:35Z — THE EYE, BLACK IN THE MIDDLE): the disc was
   too bright to read, so the FACE goes BLACK — board black #050607 — and
   the white glow on the 'i' itself is gone. The 'i' reads white on black;
   the pearl rim, the elevation and the outside glow stay, so the disc is
   still a real object coming off the page. The light lives outside only.
   Amendment #6 (Shawn's eye, 03:47Z — BALANCED, SMALLER, LESS WHITE):
   the eye was too big, too much white, unbalanced — a white blob, not a
   jewel. It shrinks 36px → 30px (26px at ≤640, 22px at ≤480), the rim
   thins to 1.25px, the inset top light and the outside glow soften, and
   the 'i' drops to 14px so it sits balanced in the disc. The black middle
   and the white 'i' on it stand — the eye still reads, it just reads as
   a jewel now.
   No color in it — amendment
   #3(1) still stands. Placement only
   is adapted: pricing sits it top-right of a plan card; here it sits
   bottom-right of the day cell, the door to the day's info. The old
   almond eye SVG is gone — the 'i' is the info mark now.
   FIX-6 (2026-11-17 — item 1, the desktop eye): the eye as built read as
   a plain "i" info button — a thin white ring on plain black, no pearl
   fill, no distinct dark middle. The face is a pearl now: a pearl radial
   (white to pearl gray, light top-left) with a distinct dark middle disc
   (board black, its own top-light) holding the white "i", the two split
   by a hairline light ring — pearl band, dark middle, white "i", at every
   width. The rim and the outside glow take the day's color (--jc set
   inline per day by render()/showDay) — the color-matched eye with its
   glow Shawn approved 03:54Z. The pearl face itself carries no color
   (amendment #3(1) still stands: no colored iris). Still 30px (26px
   ≤640, 22px ≤480), still balanced, still less white than the v4 blob —
   the pearl is a band, the middle is dark.
   SWEEP-3 (F3 — DECISION, recorded): the "i" glyph sizes (14px / 12px /
   11px at ≤640 / ≤480) are a glyph inside a jewel object, not reading
   text — the eye is the approved object (03:54Z) and is NOT re-scaled.
   The checker flags these three lines; they are a recorded decision,
   not an oversight. */
.plan-eye{position:absolute;top:8px;right:8px;z-index:3;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:#fff;--jc:#ffffff;font-family:Marcellus,Georgia,serif;font-weight:700;font-size:14px;line-height:1;background:radial-gradient(circle at 50% 50%,#17171f 0%,#050607 52%,rgba(255,255,255,.5) 55%,rgba(255,255,255,0) 59%),radial-gradient(circle at 34% 28%,#ffffff 0%,#f0f0f3 38%,#cfcfd6 68%,#9a9aa2 100%);border:1.25px solid var(--jc);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.55),0 0 10px -4px var(--jc);text-shadow:0 1px 2px rgba(0,0,0,.65)}
.plan-eye:hover,.plan-eye:focus-visible{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.6),0 0 16px -3px var(--jc);outline:2px solid #fff;outline-offset:2px}
/* Calendar placement: bottom-right of the day cell, the door to the day. */
.cal-day .plan-eye{top:auto;bottom:10px;right:10px}
@media(max-width:640px){
  .plan-eye{width:26px;height:26px;top:6px;right:6px;font-size:12px}
  .cal-day .plan-eye{top:auto;bottom:8px;right:8px}
  /* FIX-6 (item 7): on phones the cell is too narrow for the glimpse
     words — the record signal is the plain dot, fully inside the cell.
     FIX-7 (item 4): the .has{display:block} that stood here NEVER fired —
     the base .has{display:none} below comes LATER in source order, and at
     equal specificity (0,2,0) the later rule wins, so the phone dot was
     display:none at every width and Nov 20 showed no signal at 635. The
     override now lives in the later ≤640 block, after the base rule. */
  .cal-day .day-glimpse{display:none}
}

/* ============ DAY COLORS — [L] + [C] WEEKDAY ============ */

/* ============ MONTH VIEW — the whole screen is just a calendar ============ */
#monthView{height:100dvh;display:flex;flex-direction:column;padding:16px 16px 76px;gap:10px}
/* The month name + prev/next are the calendar itself — nothing else. */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;flex-wrap:wrap}
/* Amendment 2 (03:54Z — THE BUTTON LESSON): the month header is a royal
   object too — an obsidian plaque, white Marcellus, white rim, its own
   soft glow, elevated. The year's color is white (the header's own color
   is white); the plaque is the object, not plain text on black. */
.cal-title{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:clamp(26px,4.4vw,44px);line-height:1.05;color:#fff;margin:0;text-align:center;display:inline-block;white-space:nowrap;background:linear-gradient(135deg,#1a1a22,#050607 70%);border:1.5px solid rgba(255,255,255,.9);border-radius:999px;padding:10px 28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),5px 8px 24px rgba(0,0,0,.55),0 0 18px rgba(255,255,255,.35)}
.cal-title em{font-style:normal;color:#fff}
.cal-nav{display:flex;gap:8px;align-items:center;flex:none}
.cal-nav .primo{padding:12px 18px;font-size:17px}
/* SWEEP-3 (F2): the TODAY button is GONE — Shawn's newest word (v15).
   The rules that styled it (.cal-nav .primo.today, its border/glow and
   its hover) are removed with it. The header carries the date + the live
   time now, in the now-plaque below. The "Back to today" return gesture
   lives under the header, shown only off-month — never a TODAY button. */
/* Amendment 2 — THE BUTTON LESSON ([D] .os-pts-btn, harvested): each button
   wears its own color as an outer glow at rest; the lit one burns brighter.
   SWEEP-3 (F2): the TODAY button is gone, and the sentence that styled it
   went with it — the record of it lives in the header design notes above.
   The arrows wear their own colors in the BORDER and in the outer glow,
   not only in a --glow variable. Fix-6 set --glow/--glow-rgb and added a
   colored glow at the END of the shadow stack, but never set border-color
   (the .primo base border is white) and the two big WHITE outer glows sat
   ahead of the colored one in the stack — box-shadow paints first-listed
   on top — so the color was buried and the arrows read black/white live.
   The rule below drops the white outer glows and leads with the own-color
   glow. */
/* FIX-6 (item 8): the month arrows are the button standard now — PTS / %
   MONEY quality, each its own color, premium, readable at a glance. Back
   wears sapphire blue, forward wears deep emerald. No harvested per-arrow
   mapping exists — the brief orders each its own color, and cool-back /
   go-forward is the pick, both Deep Palette. The glyph grows to 22px.
   SWEEP-3 (F1): SUPERSEDED — both arrows royal purple now (see below). */
/* FIX-7 (item 2): the Fix-6 colors never painted (see the note above) —
   the border now takes --glow and the outer glow leads with the own color,
   so sapphire/emerald are the first thing the eye reads, at rest and on
   hover. The white stays only in the inner highlights and the chevron.
   SWEEP-3 (F1, 2026-11-17 — Shawn's newest word, v15 index.html lines
   191–200): BOTH arrows royal purple now — the green forward arrow goes.
   Supersedes Fix-6 item 8 (back sapphire, forward emerald). The arrows
   are separated by the title plaque, not adjacent, so the two-purples
   tension does not bite. */
#prev{--glow:#8e24aa;--glow-rgb:142,36,170}
#next{--glow:#8e24aa;--glow-rgb:142,36,170}
.cal-nav #prev,.cal-nav #next{font-size:22px;line-height:1;padding:12px 22px;border-color:var(--glow);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 2px 6px rgba(255,255,255,.15),inset 0 -8px 16px rgba(0,0,0,.8),0 0 24px rgba(var(--glow-rgb),.6),0 0 48px rgba(var(--glow-rgb),.25),7px 12px 32px rgba(0,0,0,.65)}
.cal-nav #prev:hover,.cal-nav #next:hover{border-color:var(--glow);box-shadow:inset 0 0 0 1.5px var(--glow),inset 0 2px 5px rgba(255,255,255,.28),inset 0 -6px 14px rgba(0,0,0,.65),0 0 36px rgba(var(--glow-rgb),.75),8px 14px 36px rgba(0,0,0,.65)}
/* ============ THE NOW-PLAQUE — harvested from v15 (SWEEP-3 F2) ============ */
/* v15 ~/workspace/ts-spaces/the-ultimate-calendar/index.html — the TODAY
   button is GONE (Shawn, 2026-11-17); in its place the header carries
   today's DATE and the LIVE TIME, read from the viewer's own clock in
   their own time zone, ticking every second. Harvested: the plaque
   (v15 lines 208–233), the live dot (lines 773–782), the clock tiles
   (lines 104–114), the one-row-at-390 behavior (lines 1293/1320).
   Adapted, not rebuilt: color-mix() becomes this file's rgba(var(--dc-rgb))
   idiom (--dc/--dc-rgb set by renderNowPlaque from today's weekday);
   gradients at 135° and shadows down-right per laws §5 (the harvest is
   the source of the values, not the angle — F8); the date wraps at a
   space instead of ever overflowing the pill (v15 ≤560). The plaque
   follows TODAY's color — rim, live dot, and the hour's color on the
   time — never gold. The month title plaque beside it still names the
   month being browsed; the plaque names today. */
.nowplaque{--dc:#d4a017;--dc-rgb:212,160,23;flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;min-height:44px;padding:6px 18px;border-radius:999px;
  background:radial-gradient(90% 140% at 50% 0%,rgba(var(--dc-rgb),.08),transparent 62%),linear-gradient(135deg,#17171f 0%,#0a0a11 62%,#060609 100%);
  border:1.5px solid rgba(var(--dc-rgb),.62);
  box-shadow:0 0 10px rgba(var(--dc-rgb),.18),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -6px 10px rgba(0,0,0,.5),3px 5px 12px rgba(0,0,0,.5)}
.now-date{font-family:Marcellus,Georgia,serif;font-size:19px;letter-spacing:.05em;color:#fff;white-space:nowrap;text-shadow:0 0 12px rgba(255,255,255,.3)}
.now-time{display:inline-flex;align-items:center}
/* The live dot — v15's .live-dot, harvested: a jewel dot in today's
   color that pulses to say "live" — the pulse IS the live signal, not
   decoration. One lit icon, never an icon beside its own light. */
.live-dot{flex:none;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,var(--dc) 55%,rgba(0,0,0,.5) 100%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 0 7px var(--dc),0 0 13px rgba(var(--dc-rgb),.32);
  animation:livepulse 2.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.78)}}
/* The clock tiles — v15's clocknum/clock-colon/letter tiles (lines
   104–114), harvested: the live time as Dashboard digit tiles, the colon
   a plain white separator, AM/PM in the SAME tile block with the hour's
   color as rim (letters take the hour's color). --hc/--hc-rgb are set by
   clockTilesHTML from the hour's digit color (laws §4). */
.clocknum{align-items:center}
.clock-colon{color:#fff;font-weight:900;font-size:19px;line-height:1;text-shadow:0 0 8px rgba(255,255,255,.35)}
.os-mini-tile.letter{border-color:var(--hc,#fff);box-shadow:2px 4px 10px rgba(0,0,0,.7),0 0 12px rgba(var(--hc-rgb,255,255,255),.5),inset 0 1px 0 rgba(255,255,255,.35)}
.os-mini-tile.letter .cap{background:linear-gradient(135deg,#fff,#d9d9de 55%,#9a9aa0)}
.os-mini-tile.letter .rd{font-size:24px}
/* The day header's live time (F6) — the same clock tiles, under the date. */
.day-clock{margin-top:8px}
/* "Back to today" — the return gesture (v15 line 2117), never the old
   TODAY button, which stays gone from the month header. Shown only when
   the viewed month is not the month holding today (render() toggles it). */
.back-today-row{display:flex;justify-content:center;flex:none}
.back-today-row[hidden]{display:none}
/* F19 — one quiet line that guides like a best friend, then never again:
   "tap a day to open it", white, 17px, once on the page. */
.cal-hint{font-size:17px;font-weight:600;letter-spacing:.04em;color:#fff;text-align:center;margin:0;flex:none}
/* SWEEP-3 (F10 — the zero rule): a missing number is a STATE in words,
   never a bare dash. miniNumHTML returns this for null/empty input. */
.num-state{font-size:17px;font-weight:800;letter-spacing:.08em;color:#fff;white-space:nowrap}
/* ============ THE BOTTOM FIVE — laws §3.2 (SWEEP-3 F5) ============ */
/* The page had no bottom bar at all — a calendar with no way back to the
   rest of NayaNET. The five are fixed, everywhere, one bar: + ADD royal
   purple #8e24aa · MAIL sapphire #0f52ba · ACTIVITY emerald #07925f ·
   WORLDS deep gold #d4a017 · ECOSYSTEM burnt orange #c2410c.
   No single byte-verbatim five-bar file exists to harvest (the evidence
   shows three different bars — Personal's six tiles, the Hub's nine
   icons, the Smart Bar + trio — laws §13), so the bar is composed in
   this file's own harvested language: the [P] .primo pill, each pill
   wearing its own deep color as rim + glow, bold white 17px labels.
   ADD opens Create for today (a real action). MAIL / ACTIVITY / WORLDS /
   ECOSYSTEM have no destination inside this file, so they answer
   honestly in the five-note line instead of pretending to navigate.
   Fixed to the bottom; the month grid and the day/view scrolls leave
   room for it (padding below). */
.naya-five{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,transparent,rgba(5,5,8,.94) 30%);border-top:1px solid rgba(255,255,255,.08)}
.naya-five .primo{padding:12px 18px;font-size:17px;border-color:var(--glow);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 2px 6px rgba(255,255,255,.15),inset 0 -8px 16px rgba(0,0,0,.8),0 0 18px rgba(var(--glow-rgb),.5),7px 12px 32px rgba(0,0,0,.65)}
.naya-five .primo:hover{box-shadow:inset 0 0 0 1.5px var(--glow),inset 0 2px 5px rgba(255,255,255,.28),inset 0 -6px 14px rgba(0,0,0,.65),0 0 36px rgba(var(--glow-rgb),.7),8px 14px 36px rgba(0,0,0,.65)}
.naya-five .five-add{--glow:#8e24aa;--glow-rgb:142,36,170}
.naya-five .five-mail{--glow:#0f52ba;--glow-rgb:15,82,186}
.naya-five .five-activity{--glow:#07925f;--glow-rgb:7,146,95}
.naya-five .five-worlds{--glow:#d4a017;--glow-rgb:212,160,23}
.naya-five .five-eco{--glow:#c2410c;--glow-rgb:194,65,12}
.five-note{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:61;max-width:min(92vw,560px);padding:12px 18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.9);background:linear-gradient(135deg,#1a1a22,#050607 70%);color:#fff;font-size:17px;font-weight:700;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),3px 8px 24px rgba(0,0,0,.55)}
.five-note[hidden]{display:none}
@media (max-width:640px){
  .naya-five{gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .naya-five .primo{padding:10px 12px;font-size:17px}
  .five-note{bottom:124px}
}
/* Weekday names in their day's color — [C] render() colored them so.
   Amendment #4(1) (Shawn's eye, 03:19Z): the FULL day names (Sunday,
   Monday...), almost in royalty, in Marcellus — not S/M/T/W/T/F/S. The
   Marcellus is real now (the [P] font link in <head>); the size scales
   with the viewport so the longest name still fits its cell. */
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;flex:none}
.cal-week div{text-align:center;font-family:Marcellus,Georgia,serif;font-weight:400;font-size:clamp(17px,2.2vw,20px);letter-spacing:.04em;white-space:nowrap;color:#fff}
/* Amendment #6 (Shawn's eye, 03:47Z — THE WEEKDAY NAME IS A ROYAL OBJECT):
   "Sunday at the top is not written in royalty, it's just written in plain
   text." Each weekday name is a real object now — an obsidian pill, rim in
   its day's color (--dc from the dow-N class the renderer sets), elevated
   with its own outside glow. The pill IS the grid cell, so it always fits
   its track; padding stays small so the longest name still fits at 390.
   Amendments 2 + 3 (03:54Z/03:55Z — THE BUTTON LESSON, [D] .os-pts-btn
   harvested): the label is BOLD WHITE, readable at a glance like the PTS /
   % / MONEY pills — the day's color lives in the rim and in the outer glow
   at rest (0 0 18px, the mode pills' rest treatment), not in the text.
   TODAY's plaque is the LIT one (the mode-pill active treatment — the
   border thickens, the glow burns brighter): today is known from the
   plaque, never from lighting the cell (Amendment 2). The .today class is
   toggled by render(), only while the displayed month is the current one. */
.cal-week div{background:linear-gradient(135deg,#1a1a22,#050607 70%);border:1.5px solid var(--dc);border-radius:999px;padding:6px 4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),2px 4px 10px rgba(0,0,0,.5)}
/* FIX-6 (item 2): the plaques' rest glow lives only in the current month
   (.cur on #weeknames, toggled by render()) — in any other month no
   plaque glows, so no weekday can read as "today" there (the desktop eye
   read December's gold Tuesday plaque as lit). The lit (.today) plaque
   exists only in the current month, by the same toggle. */
.cal-week.cur div{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),2px 4px 10px rgba(0,0,0,.5),0 0 18px rgba(var(--dc-rgb),.5)}
.cal-week div.today{border-width:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),2px 4px 10px rgba(0,0,0,.5),0 0 36px rgba(var(--dc-rgb),.7),0 0 72px rgba(var(--dc-rgb),.35)}
/* The grid fills the screen. No scrolling. Rows = the weeks the month
   actually needs (4–6) — the grid ends at the month's last day; no trailing
   next-month days, no trailing blank row at the bottom. Rows stretch to
   fill, so the cells are BIG. */
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;min-height:0}
/* THE DAY BLOCK — the .ph-card board [D], rim in the day's color.
   AMENDMENT (Shawn 02:58Z): the number sits TOP LEFT; the eye sits BOTTOM
   RIGHT and is the door to the day's info; on hover the whole cell does NOT
   light up — only the OUTSIDE rim lights, brighter on hover, with a light
   glow of the day's color even at rest; NO glow in the middle. Every day is
   lit at rest (you can see each day's color line), just not as bright as
   the hovered day. Pearl gems, not neon — Deep Palette hexes only. */
.cal-day{margin:0;padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;cursor:pointer;border:2px solid var(--dc);border-radius:20px;background:linear-gradient(135deg,#07070b,#050607);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3),5px 8px 22px rgba(0,0,0,.5),0 0 10px rgba(var(--dc-rgb),.14);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease);position:relative;overflow:hidden}
/* Hover: rim only. The middle stays obsidian — no wash, no inner glow.
   The rim brightens and the outside halo strengthens; the number lifts.
   Pearl, never neon — one soft halo, amendment #3(2)(5). */
.cal-day:hover,.cal-day:focus-visible{transform:translateY(-4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 8px rgba(0,0,0,.3),12px 20px 44px rgba(0,0,0,.6),0 0 24px rgba(var(--dc-rgb),.30)}
.cal-day:hover .os-mini-tile,.cal-day:focus-visible .os-mini-tile{transform:translateY(-2px)}
.cal-day:active{transform:translateY(1px) scale(.985)}
.cal-day .os-mini-tile{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
/* Today carries NO light of its own — Amendment 2 (Shawn, 03:54Z) REVISES
   the 03:47Z "today lights up WAY more": "I don't want it to light up.
   Um glowing over the day itself." No huge TODAY pill, no glow over the
   day itself, no cell filled with the day's color, no pulse, no TODAY
   tag. The Amendment #6 treatment (second rim, strong halos, jewel dot)
   is REMOVED — today's cell reads exactly like its siblings. Today is
   known from the weekday plaque (the lit one) and the header TODAY
   button, not from lighting the cell. The .today class stays on the cell
   (state only). FIX-6 (item 2): it renders exactly ONE quiet thing now —
   the small dot below, the day's color, no glow, no fill, no pill (the
   NO-HUGE-TODAY law stands). The mark is the only .cal-day.today rule in
   the file; the cell otherwise reads exactly like its siblings. */
/* FIX-6 (item 2): the quiet mark — a small dot in the day's color, top
   right of today's cell only. Never a fill, never a glow, never a pill.
   Today reads from the plaque + the header now-plaque + this mark.
   FIX-7 (item 3): the 7px dot was found only by zooming on desktop and
   not at all at 635 — too small to find at a glance. The mark is 12px
   now, ringed white so it cannot blend into the day's rim, and z-indexed
   above the tiles so nothing can paint over it. Still a dot, still no
   fill, no glow, no pill — the NO-HUGE-TODAY law stands.
   FIX-8 (item 1): the Fix-7 checker claimed the white ring from the
   border, but the live eye measured computed box-shadow: none — the ring
   as the eye measures it did not exist. The ring is now BOTH: the 2px
   white border AND a spread-only box-shadow (0 0 0 2px #fff, zero blur —
   a hard ring, never a glow), so computed box-shadow reads the ring too.
   Nothing else changes: no fill, no glow over the cell, no pill, no
   cell-border change.
   FIX-9 (item 1): the 12px dot passes at 635 + 390 (14–24% of the cell)
   but at desktop 1919 the ~263px cell makes it ~5% — the captain's eye
   had to hunt for it. The dot scales with the cell now: 18px here
   (desktop, ~7% of the cell, ~26px with its ring ≈ 10%), 14px at
   ≤1088px, 12px at ≤768px (the narrow widths that already pass keep
   their 12px). Same corner, same ring, same z-index — still a dot,
   still no fill, no glow over the cell, no pill. The NO-HUGE-TODAY law
   stands. */
.cal-day.today::after{content:'';position:absolute;top:8px;right:8px;z-index:2;width:18px;height:18px;border-radius:50%;background:var(--dc);border:2px solid #fff;box-shadow:0 0 0 2px #fff;flex:none}
/* FIX-6 (item 7): a day with records carries a proper visible signal,
   explained — a glimpse line at the bottom of the cell ("2 appointments
   · 1 note"), white, the day's own words, never invented (it counts the
   day's own local record only). The cell uses its space: color rim,
   number, eye, and a glimpse of what's inside. The tiny dot is retired
   on desktop — it read as a speck, half-clipped and unexplained. On
   phones (≤640px) the cell is too narrow for words, so the signal is a
   plain dot again — 8px, fully inside the cell, no glow to clip. Days
   with nothing keep number + eye only; nothing is invented for an
   empty day. */
.cal-day .day-glimpse{position:absolute;left:14px;right:52px;bottom:12px;max-height:52px;overflow:hidden;font-size:17px;font-weight:800;letter-spacing:.06em;line-height:1.5;text-transform:uppercase;color:#fff;text-align:left}
.cal-day .has{display:none;position:absolute;left:8px;bottom:8px;width:8px;height:8px;border-radius:50%;background:var(--dc);flex:none}
.cal-day.blank{background:transparent;border:2px solid transparent;box-shadow:none;cursor:default}
.cal-day.blank:hover{transform:none;background:transparent;box-shadow:none}

/* ============ DAY VIEW — inside the day ============ */
#dayView,#viewView{position:fixed;inset:0;background:#050607;z-index:50;display:none;flex-direction:column;overflow-y:auto;padding:20px 16px 84px}
#dayView.show,#viewView.show{display:flex}
/* FIX-6 (item 5 — PRIME REAL ESTATE): the day view fills the desktop
   width now. The 1060px column (55% of a 1920 screen, ~400px of black
   margin each side) is gone; the containers run to 1600px — the dash
   grid spreads, the boards breathe, and the doors row keeps its shape
   (5 across, 2 empty slots beside the 13th, as in v5 — full-bleed would
   leave 5). Mobile is unchanged: width:100% throughout. */
.day-head{max-width:1600px;width:100%;margin:0 auto 8px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.day-head .daynum-wrap{flex:none}
/* [P] THE DAY JEWEL — .os-jewel verbatim, pricing v77 (also Dashboard
   line 4019, same rule). Amendment #2(1): the day header carries a
   beautiful jewel icon for the day — the day's own icon, like a jewel.
   The jewel's color is the day's color (--jc set inline); inside it sits
   the day's frequency — Monday = 417 Hz, orange in it. A number inside a
   jewel is the harvested pattern (pricing carries digits 1–10 in jewels).
   --dc-rgb is set on #dayView by showDay, so the name's glow reads the
   day's color. Amendment #2(2): the day name is white inside with the
   day's color glowing OUTSIDE it; no gray text underneath — the gray date
   line is dropped (the Hz now lives in the jewel). */
.os-jewel{--jc:#cfc09a;display:inline-grid;place-items:center;flex:none;line-height:1;color:#fff;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.30),rgba(255,255,255,0) 48%),linear-gradient(135deg,#262633,#0b0b12 80%);border:1.5px solid var(--jc);border-radius:9px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.6),3px 5px 12px rgba(0,0,0,.55),0 0 14px -3px var(--jc);text-shadow:0 0 9px var(--jc),0 1px 2px rgba(0,0,0,.65)}
.os-jewel-lg{width:46px;height:46px;font-size:22px;border-radius:13px}
/* FIX-6 (item 3): the jewel names the unit — "417 Hz", not a bare number.
   Same jewel object, widened to carry number + unit on one line (auto
   width, 20px — the number stays the hero, "Hz" rides beside it). The
   .os-jewel-lg rule above stays in the file, harvested and untouched. */
.os-jewel-hz{width:auto;min-width:46px;height:46px;padding:0 12px;font-size:20px;border-radius:13px}
.day-title{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:clamp(24px,4vw,38px);line-height:1.1;color:#fff;margin:0;text-shadow:0 0 18px rgba(var(--dc-rgb),.5),0 0 48px rgba(var(--dc-rgb),.25)}
.day-back{margin-left:auto}
/* v5: the same eye lives in the day header — the door to the day's report.
   Static in the flex header (not absolute like the month-cell eye); it sits
   at the right, beside Back to month, and opens the Daily Intelligence
   Report board below. Same black-middle object as the month cells. */
.day-head .plan-eye{position:static;flex:none;margin-left:auto}
.day-head .day-back{margin-left:12px}
/* FIX-7 (item 1): the Fix-6 seam rules (gap:0 + margin-left:-2px) are
   REMOVED — they only closed the flex gap while each tile kept its own
   object cues, so "17" still read as two tiles live. The join is the
   .duo tile above (one tile, one rim, one cap, one glow, in the day's
   color); with it there are never two adjacent digit tiles in a day
   number, at any width, in the month grid, the day header or the section
   views. Counts keep their per-digit tiles (they never take the duo path). */
.view-wrap{max-width:1600px;width:100%;margin:0 auto}
/* The 13 doors — INSTRUMENTS, not buttons (scorecard (8), 03:47Z). The
   doors were a row of .primo pills; a pill is a button, and thirteen
   buttons read as a form. An instrument is a board that shows you
   something: an obsidian board with a jewel icon in the door's own color,
   the name, and the live glimpse as its reading — touch it and it opens
   that door. Same 13 names, order, colors and glimpses; only the form
   changes, pill → instrument board. The .primo pill stays for the
   navigation buttons (prev/next/Today/Back/Create). Amendment #2(3)
   still governs the glimpse: a door is a window into the day, never a
   blank bar. The doors are wide enough for the glimpse to read (300px min). */
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:18px 0}
.doors .door-inst{display:flex;align-items:center;gap:14px;width:100%;min-width:0;cursor:pointer;text-align:left;color:#F8F7FB;font-family:inherit;font-weight:800;font-size:17px;letter-spacing:.08em;padding:16px 18px;border-radius:18px;border:1.5px solid rgba(255,255,255,.2);
  background:linear-gradient(135deg,#1a1a22 0%,#0a0a0f 45%,#050507 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 6px rgba(0,0,0,.5),5px 8px 20px rgba(0,0,0,.5),0 0 18px -6px var(--glow);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);--glow:var(--purple)}
.doors .door-inst:hover,.doors .door-inst:focus-visible{transform:translateY(-2px);border-color:var(--glow);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 6px rgba(0,0,0,.5),0 0 28px var(--glow),7px 12px 28px rgba(0,0,0,.6)}
.doors .door-inst:active{transform:translateY(1px) scale(.985)}
.doors .door-inst .ico{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:20px;line-height:1;color:#fff;border:1.5px solid var(--glow);
  background:linear-gradient(135deg,#0b0b12,#050607 80%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),2px 4px 10px rgba(0,0,0,.55),0 0 12px -2px var(--glow)}
.doors .door-inst .lbl{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
.doors .door-inst .sub{display:block;font-size:17px;font-weight:700;letter-spacing:.1em;color:#fff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* v5: the 3-count instrument row is gone — its counts live in the dashboard
   board headers below (.dash-board .db-count), and the day view is a
   dashboard now. The [D] .os-sl-stat pattern (number on top, label
   underneath) is superseded here by the board headers. */
/* Timeline — [C] .daytimeline board, .ph-card construction, rim in the day color. */
.daytimeline{border:2px solid var(--dc);border-radius:20px;padding:20px 22px;margin:18px 0 0;background:linear-gradient(135deg,#07070b,#050607);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3),8px 14px 36px rgba(0,0,0,.5),0 0 18px rgba(var(--dc-rgb),.35)}
.daytimeline>strong{display:block;font-size:19px;letter-spacing:.14em}
.daytimeline .tl-sub{font-size:17px;color:#fff;margin-top:4px}
.tl-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.tl-list li{display:grid;grid-template-columns:auto auto auto 1fr;gap:10px;align-items:baseline;padding:10px 12px;border-left:3px solid var(--tc,#8e24aa);background:rgba(255,255,255,.04);border-radius:0 12px 12px 0}
.tl-time{font-weight:800;font-size:17px;white-space:nowrap}
.tl-kind{font-size:17px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tc,#8e24aa);white-space:nowrap}
.tl-text{font-size:17px;line-height:1.5}
.tl-empty,.tl-note{font-size:17px;line-height:1.6;margin:12px 0 0}
.tl-note{color:#fff}
/* Scorecard (5): open times as objects — obsidian chips, white time. */
.tl-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.tl-chip{display:inline-block;padding:8px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:linear-gradient(135deg,#1a1a22,#050607);color:#fff;font-size:17px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),2px 4px 10px rgba(0,0,0,.5)}
/* ============ v5 — THE DAY DASHBOARD: wisdom banner + instrument boards ============ */
/* Shawn's words, 03:35Z: "maybe a quote or wisdom for the Monday that goes
   across the top ... imagine a different dashboard in this ... prime real
   estate." The wisdom banner runs across the top of the day view — the
   harvested [C] wisdomFor, moved up from the bottom board, full width,
   Marcellus, rim in the day's color. Below the doors, the day's
   instruments fill the page as boards: appointments as tiles, the daily
   report, Intel Today, daily notes, daily smart notes, posts, the
   timeline, news, weather, horoscope. Every board is the harvested [D]
   .ph-card already in this file, rim in the day's color, lighting whole
   on hover (Naya Code §8 — boards light up). Counts are the harvested
   digit tiles (miniNumHTML). List rows reuse the .viewcard .list item
   construction already in this file, same values. Nothing invented:
   news/weather/horoscope have no live source wired, so their boards say
   so honestly as beautiful empty states — never blank, never fake. Each
   board with a matching door opens that door on tap (role=button). */
.wisdom-banner{margin:18px 0 0;border-color:var(--dc);text-align:center;padding:26px 28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3),8px 14px 36px rgba(0,0,0,.5),0 0 18px rgba(var(--dc-rgb),.35)}
.wisdom-banner:hover{border-color:var(--dc);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),14px 24px 56px rgba(0,0,0,.6),0 0 44px rgba(var(--dc-rgb),.2)}
.wisdom-banner .wq-glyph{display:block;font-size:22px;line-height:1;color:#fff;text-shadow:0 0 18px rgba(var(--dc-rgb),.8);margin-bottom:10px}
.wisdom-banner .wq{font-family:Marcellus,Georgia,serif;font-size:clamp(19px,2.6vw,26px);line-height:1.45;color:#fff;margin:0}
.wisdom-banner .ws{display:block;margin-top:12px;font-size:17px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#fff}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.dash .span2{grid-column:span 2}
.dash-board{margin:0;border-color:var(--bc,var(--dc));cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3),8px 14px 36px rgba(0,0,0,.5),0 0 18px rgba(var(--bc-rgb,var(--dc-rgb)),.35)}
.dash-board:hover{border-color:var(--bc,var(--dc));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),14px 24px 56px rgba(0,0,0,.6),0 0 44px rgba(var(--bc-rgb,var(--dc-rgb)),.2)}
.dash .daytimeline{margin:0}
.db-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.db-ico{font-size:20px;line-height:1;color:#fff}
.db-head strong{font-size:19px;letter-spacing:.14em;color:#fff}
.db-count{margin-left:auto}
.db-go{font-size:20px;line-height:1;color:#fff;margin-left:auto}
.db-count + .db-go{margin-left:6px}
.db-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.db-list li{padding:10px 12px;border:1.5px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.04);font-size:17px;line-height:1.55;color:#fff}
.db-list li b{color:#fff}
.db-text{font-size:17px;line-height:1.65;color:#fff;margin:10px 0 0}
.db-empty{font-size:17px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;margin:12px 0 0}
.db-note{font-size:17px;line-height:1.6;color:#fff;margin:8px 0 0}
@media(max-width:900px){.dash{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.dash{grid-template-columns:1fr}.dash .span2{grid-column:auto}}
/* Empty state — an object, not a paragraph: board + glyph + day tiles + two words.
   FIX-6 (item 6): the honest-empty section view was one small tile in a
   vast blank black field. It presents as a FULL BOARD now — the card
   fills the view's width (item 5) and stands 56vh tall, content centered,
   glyph and words grown to board scale. The WORDS are unchanged and stay
   honest ("No provider wired", "No source wired", "Archive not wired
   yet") — only the presentation changes, never the truth. */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:56px 28px;min-height:56vh}
.empty .glyph{font-size:60px;line-height:1;color:#fff;text-shadow:0 0 24px rgba(var(--dc-rgb),.8)}
.empty .words{font-size:19px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.empty .hintline{font-size:17px;color:#fff;max-width:560px;line-height:1.6}
/* Views inside a day */
.view-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 auto 18px;max-width:1600px;width:100%}
.view-head h2{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:clamp(22px,3.4vw,32px);color:#fff;margin:0;flex:1;min-width:220px}
.view-head .primo{padding:12px 18px;font-size:17px}
.viewcard{margin:0 auto 18px;max-width:1600px}
.viewcard .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:14px 0}
.viewcard .stat{text-align:center;padding:14px 8px;border:1.5px solid rgba(255,255,255,.2);border-radius:14px;background:linear-gradient(135deg,#0a0a0f,#050607)}
.viewcard .stat b{display:block;font-size:34px;font-weight:900;color:#fff;line-height:1}
.viewcard .stat span{display:block;font-size:17px;font-weight:800;letter-spacing:.16em;color:#fff;margin-top:6px}
.viewcard .list{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.viewcard .list li{padding:12px 14px;border:1.5px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.04);font-size:17px;line-height:1.55}
.viewcard .list li b{color:#fff}
.viewcard .hint{font-size:17px;color:#fff;line-height:1.6}
.viewcard .err{font-size:17px;color:#fff;font-weight:700;min-height:18px}
.viewcard .status{font-size:17px;font-weight:700;color:#fff;border:1.5px solid #07925f;border-radius:12px;padding:12px 14px}
/* Booking slots — [C] slot buttons, rebuilt in the pill language. */
.slotbox{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.slot{cursor:pointer;font-weight:800;font-size:17px;color:#fff;padding:12px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);background:linear-gradient(135deg,#1a1a22,#050607);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),4px 6px 16px rgba(0,0,0,.5);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.slot:hover{transform:translateY(-2px);border-color:#07925f;box-shadow:6px 10px 20px rgba(0,0,0,.55),0 0 16px rgba(7,146,95,.4)}
.slot.on{border-color:#07925f;box-shadow:0 0 16px rgba(7,146,95,.5)}
.slot.taken{opacity:1;cursor:not-allowed}
/* SWEEP-3 (F14): a taken slot was 35% opacity — its text rendered at 35%
   white, dimmed past reading. Full white now; "taken" is marked with a
   struck time + the state word TAKEN in the button itself (see
   appointmentsHTML), not by dimming. */
.slot.taken:hover{transform:none;border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),4px 6px 16px rgba(0,0,0,.5)}
.flab{display:block;font-size:17px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;margin:16px 0 8px}
.field{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.35);border-radius:12px;color:#fff;font-size:17px;padding:14px;font-family:inherit;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.field:focus{outline:none;border-color:#fff;box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 18px rgba(255,255,255,.25)}
.field::placeholder{color:#fff}
/* SWEEP-3 (F14): the placeholder was 85% white — dimmed text, which the
   law does not carve out (the carve-out covers dimmed state DOTS, not
   dimmed TEXT). Full white now; the placeholder still reads as a hint
   because it is the field's own words ("Their name", "Write it in your
   own words…"), not because it is dimmed. */
textarea.field{min-height:110px;resize:vertical}
select.field option{background:#0a0a0f;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions .primo{padding:13px 22px;font-size:17px}
/* SWEEP-3 (F18): the day-view prev/next-day buttons wear the same royal
   purple as the month arrows (F1) — the both-arrows-purple law governs
   the day view's arrows as well. Same treatment as .cal-nav #prev/#next:
   border in the own color, outer glow leading with the own color. */
.actions .primo.daystep{--glow:#8e24aa;--glow-rgb:142,36,170;border-color:var(--glow);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 2px 6px rgba(255,255,255,.15),inset 0 -8px 16px rgba(0,0,0,.8),0 0 24px rgba(var(--glow-rgb),.6),0 0 48px rgba(var(--glow-rgb),.25),7px 12px 32px rgba(0,0,0,.65)}
.actions .primo.daystep:hover{border-color:var(--glow);box-shadow:inset 0 0 0 1.5px var(--glow),inset 0 2px 5px rgba(255,255,255,.28),inset 0 -6px 14px rgba(0,0,0,.65),0 0 36px rgba(var(--glow-rgb),.75),8px 14px 36px rgba(0,0,0,.65)}
.meetbox{text-align:center}
.meetbox .face{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;

    <h1 class="cal-title" id="monthname"></h1>
    <div class="nowplaque" id="nowPlaque" role="timer" aria-label="Today's date and your local time">

    </div>
    <div class="cal-nav"><button class="primo" id="next" type="button" aria-label="Next month">›</button></div>

  <p class="cal-hint">Tap a day to open it</p>
  <div class="back-today-row" id="backTodayRow" hidden><button class="primo" id="backTodayBtn" type="button">‹ Back to today</button></div>
  <div class="cal-week" id="weeknames" aria-hidden="true"></div>
  <div class="cal-grid" id="days" role="grid" aria-label="Days of the month"></div>
</main>

<!-- THE BOTTOM FIVE — laws §3.2 (SWEEP-3 F5). One bar, everywhere. -->
<nav class="naya-five" aria-label="NayaNET">
  <button class="primo five-add" id="fiveAdd" type="button"><span class="ico" aria-hidden="true">+</span>ADD</button>
  <button class="primo five-mail" data-five="Smart Mail" type="button">MAIL</button>

<!-- DAY VIEW — inside the day. -->

  <div class="day-head" id="dayHead"></div>
  <div class="view-wrap" id="dayBody"></div>
</section>

  <div class="view-wrap" id="viewBody"></div>
</section>

<script>
/* ============ STATE ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TZ=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
const NOW=new Date();
let year=NOW.getFullYear(), month=NOW.getMonth(), day=NOW.getDate();
let screen='month', section='Dashboard', slot='', meetId='', createKind='smart';
let lastFocus=null, pendingBookErr='';

/* Weekday identity — [C] WEEKDAY verbatim (colors already the Deep Palette [L]). */
const WEEKDAY=[
 {name:'Sunday',   short:'Sun', color:'#8e24aa', hz:963, label:'purple'},
 {name:'Monday',   short:'Mon', color:'#c2410c', hz:417, label:'orange'},
 {name:'Tuesday',  short:'Tue', color:'#d4a017', hz:528, label:'gold'},
 {name:'Wednesday',short:'Wed', color:'#0f52ba', hz:741, label:'sapphire'},
 {name:'Thursday', short:'Thu', color:'#07925f', hz:639, label:'green'},
 {name:'Friday',   short:'Fri', color:'#c62828', hz:396, label:'red'},
 {name:'Saturday', short:'Sat', color:'#3f51b5', hz:852, label:'indigo'}];

/* The 13 doors, in the brief's exact order and names. Amendment #2(4):
   the door colors follow the SPECTRUM FLOW in order — never the same color
   twice in a row. SWEEP-3 (F4): the Flow is Shawn's 18:00Z law — magenta
   → purple → indigo → cyan → green → gold → orange → red → magenta,
   cycling; start varies by area, here purple (door 1 keeps its purple).
   The old playbook order (purple → blue → green → gold → orange → red
   → magenta → indigo → cyan → violet) is gone: blue (#0f52ba) and violet
   (#6d28d9) have no place in the Flow's eight hues and are re-mapped.
   All hexes from the Deep Palette [L] only. SWEEP-3 (F13): the icons are
   distinct glyphs now — the near-duplicates are gone (✦ vs ✧, ▧ vs ▣,
   ◷ vs ◎ were the same shapes in different colors, which §8 forbids
   calling two icons). Icons are the white object-glyphs of [C]'s
   vocabulary. The glimpse under each name is live (doorGlimpse, below) —
   amendment #2(3): a door is a window into the day, not a blank bar. */
const DOORS=[
 ['Appointments','◷','#8e24aa'],
 ['Local news','⌖','#3f51b5'],
 ['Provincial news','▧','#0e7490'],
 ['Global news','♁','#07925f'],
 ['Personal feed','♙','#d4a017'],
 ['Business feed','▲','#c2410c'],
 ['Thing feed','◈','#c62828'],
 ['Your World','✦','#a21caf'],
 ['Smart Notes for that day','❖','#8e24aa'],
 ['Notes for that day','☰','#3f51b5'],
 ['Weather','☀','#0e7490'],
 ['Horoscope','☾','#07925f'],
 ['Posts for that day','✎','#d4a017']];

/* ============ DOOR GLIMPSES — amendment #2(3) ============ */
/* Each door carries a live glimpse of what's inside it, from the day's own
   local record only — the next appointment, the count, the latest note.
   Nothing invented: news, weather and horoscope have no live source wired
   yet, so their glimpse says so honestly (the honest-absence rule of the
   brief). The glimpse is rendered under the door's name, white, one line. */
function escT(t){ const s=String(t||''); return s.length>56? s.slice(0,55)+'…' : s; }
/* FIX-7 (item 5b): doorGlimpse takes an optional (books, notes) snapshot —
   when the day view passes its one freshly-read snapshot, every door on
   the page counts from the same truth; when omitted it reads the store
   itself, exactly as before. The open-times count uses the snapshot books
   (same test bookTimeTaken runs). */
function doorGlimpse(name,ds,books,notes){
  books=books||dayBookings(ds); notes=notes||dayNotes(ds);
  const open=BOOK_SLOTS.filter(t=>!books.some(b=>b.time===t)).length;
  switch(name){
    case 'Appointments': {
      if(!books.length) return open? open+' open times — book one' : 'Fully booked';
      const b=books[0];
      return 'Next: '+fmtTime(b.time)+' — '+(b.who||'Appointment');
    }
    case 'Local news': case 'Provincial news': case 'Global news':
      return 'Archive not wired yet';
    case 'Personal feed': case 'Business feed': case 'Thing feed': {
      const w=name.split(' ')[0];
      const list=notes.filter(n=>n.world===w);
      if(!list.length) return 'Nothing in '+w+' today';
      const last=list[list.length-1];
      return list.length+(list.length===1?' note':' notes')+' · “'+escT(last.text)+'”';
    }
    case 'Your World': {
      const b=books.length, n=notes.length;
      return b+' appointment'+(b===1?'':'s')+' · '+n+' note'+(n===1?'':'s');
    }
    case 'Smart Notes for that day': {
      const list=notes.filter(n=>n.type==='smart');
      if(!list.length) return 'No Smart Notes yet';
      const top=list.filter(n=>n.rank).sort((a,b)=>b.rank-a.rank)[0]||list[list.length-1];
      return list.length+(list.length===1?' Smart Note':' Smart Notes')+' · “'+escT(top.text)+'”';
    }
    case 'Notes for that day': {
      const list=notes.filter(n=>n.type==='naya');
      if(!list.length) return 'No notes yet';
      return list.length+(list.length===1?' note':' notes')+' · “'+escT(list[list.length-1].text)+'”';
    }
    case 'Weather': return 'No provider wired';
    case 'Horoscope': return 'No source wired';
    case 'Posts for that day': {
      const list=notes.filter(n=>n.type==='post');
      if(!list.length) return 'No posts yet';
      return list.length+(list.length===1?' post':' posts')+' · “'+escT(list[list.length-1].text)+'”';
    }
  }
  return '';
}

/* ============ DIGIT TILES — [D] miniTileHTML + _osMiniNumHTML, ADAPTED ============ */
/* dashboard-pass9.html lines 26593-26620: one number, one style. A landed
   tile shows cap + digit + rim + digit colour. Money gets the $ tile,
   decimals a dot tile, percentages a % tile. A comma becomes a gap.
   ADAPTED, not verbatim (checker correction, v4): the tile branches are
   exact, but this file renames the function (window._osMiniNumHTML →
   plain miniNumHTML), adds an ∞ branch and a space/comma gap branch,
   extends the regex with `str !== '∞'`, returns esc(...) instead of
   String(value), and drops the 'orb' size branch. Functionally equivalent
   for digits — the only inputs day numbers and counts use. */
function miniTileHTML(ch){
  if (ch === ' ' || ch === ',') return '<span class="os-mini-gap"></span>';
  if (ch === '$') return '<span class="os-mini-tile dollar"><span class="cap"></span><span class="rd">$</span></span>';
  if (ch === '.') return '<span class="os-mini-tile dot"><span class="cap"></span><span class="rd">.</span></span>';
  if (ch === '%') return '<span class="os-mini-tile pct"><span class="cap"></span><span class="rd">%</span></span>';
  if (ch === '∞') return '<span class="os-mini-tile inf"><span class="cap"></span><span class="rd">∞</span></span>';
  var d = parseInt(ch, 10);
  if (!isFinite(d)) return '';
  return '<span class="os-mini-tile d' + d + '"><span class="cap"></span><span class="rd">' + d + '</span></span>';
}
/* FIX-7 (item 1): mix a hex color toward another by amt (0–1). The file's
   own lighten/darken rule for tile caps — light = hex mixed 55% toward
   white, dark = hex mixed 45% toward black — verified against [D]'s own
   d7 cap: mixHex('#8e24aa', white, .55) = '#cc9cd9', toward black .45 =
   '#4e145e', exactly the values the tile comment documents. */
function mixHex(hex, toward, amt){
  const a=hex.match(/\w\w/g).map(x=>parseInt(x,16));
  const b=toward.match(/\w\w/g).map(x=>parseInt(x,16));
  return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*amt).toString(16).padStart(2,'0')).join('');
}
/* FIX-7 (item 1): ONE tile for a two-digit day — the duo tile. Both digits
   ride inside a single tile (white, as in every tile) with one rim, one
   cap and one glow in the DAY's color (--dc/--dc-rgb set inline). The cap
   gradient follows the file's own lighten/darken rule above.
   SWEEP-3 (F16 — DECISION, recorded): this is a deliberate, recorded
   exception to laws §4 ("a digit's color is its digit's color"). The DATE
   is one object in the day's color — Fix-7 ordered the join so "17" reads
   as one date, not two digits — while COUNTS keep their per-digit tiles
   (no label, no color, never the duo path). The tension is named here so
   no later round "fixes" the join back into two tiles, and no checker
   reads it as an accident. */
function duoTileHTML(str, color){
  const rgb=color.match(/\w\w/g).map(x=>parseInt(x,16)).join(',');
  const light=mixHex(color,'#ffffff',0.55), dark=mixHex(color,'#000000',0.45);
  return '<span class="os-mini-tile duo" style="--dc:'+color+';--dc-rgb:'+rgb+'"><span class="cap" style="background:linear-gradient(135deg,'+light+','+color+' 55%,'+dark+')"></span><span class="rd">'+str+'</span></span>';
}
function miniNumHTML(value, size, label, color){
  /* SWEEP-3 (F10 — the zero rule, Shawn 17:28Z): a missing number never
     wears a bare dash. A verified zero shows as a digit tile (the call
     sites pass counts, and 0 renders as the d0 tile); unknown / unmeasured
     shows as a STATE in words. No live call site passes null today — the
     path is removed now, before one does. */
  if (value == null) return '<span class="num-state">Not counted yet</span>';
  var str = String(value).trim().replace(/,/g, ' ').replace(/ +/g, ' ');
  if (str === '' || str === '—' || str === '-') return '<span class="num-state">Not counted yet</span>';
  if (!/^[$]?[0-9][0-9 ]*(\.[0-9]+)?%?$/.test(str) && str !== '∞') return esc(String(value));
  var cls = (size === 'med') ? 'os-mini-num med' : 'os-mini-num';
  /* FIX-6 (item 9): when the number is a day, the wrapper names it outright
     (role="img" + aria-label) so the date is exposed as one number — "20",
     not a digit at a time — whatever reads the name. Counts pass no label
     and are unchanged. */
  var html = '<span class="' + cls + '"' + (label ? ' role="img" aria-label="' + esc(label) + '"' : '') + '>';
  /* FIX-7 (item 1): a two-digit DAY is one duo tile (see above) — the day's
     color is passed by the three day-number call sites. Single digits and
     all counts (no label, no color) fall through to the per-digit tiles,
     byte-identical to before. */
  if (label && color && /^[0-9]{2}$/.test(str)) return html + duoTileHTML(str, color) + '</span>';
  for (var i = 0; i < str.length; i++) html += miniTileHTML(str[i]);
  return html + '</span>';
}

/* SWEEP-3 (F2/F6/F9 — the live clocks, harvested from v15): the live time
   as Dashboard digit tiles — v15's clockTilesHTML (index.html lines
   1681–1695), adapted to this file's own miniTileHTML (v15's digitsHTML
   is the same construction). The digits keep their digit colors (laws
   §4); the colon is a plain white separator; AM/PM ride in the SAME tile
   block with the hour's color as rim (letters take the hour's color).
   The hour's color IS its frequency made visible — the color of the
   hour's FIRST digit under the digit law: 1 ruby, 2 orange, 3 gold,
   4 emerald, 5 cyan, 6 indigo, 7 purple, 8 violet, 9 magenta, 10/11/12
   red (leading 1). Deep Palette hues only. The seconds ride in their own
   span so CSS can hide them where the one-row header has no room (390);
   the tick still updates them, hidden, so the time is never stale. */
const HOUR_COLORS={1:'#c62828',2:'#c2410c',3:'#d4a017',4:'#07925f',5:'#0e7490',6:'#3f51b5',7:'#8e24aa',8:'#6d28d9',9:'#a21caf',10:'#c62828',11:'#c62828',12:'#c62828'};
function clockTilesHTML(d){
  const h24=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
  const ap=h24>=12?'PM':'AM';
  const h12=h24%12||12;
  const hc=HOUR_COLORS[h12];
  const rgb=hc.match(/\w\w/g).map(x=>parseInt(x,16)).join(',');
  const hh=String(h12), mm=String(m).padStart(2,'0'), ss=String(s).padStart(2,'0');
  let t='<span class="os-mini-num clocknum" style="--hc:'+hc+';--hc-rgb:'+rgb+'" role="img" aria-label="Live time, '+h12+':'+mm+':'+ss+' '+ap+'">';
  for(let i=0;i<hh.length;i++) t+=miniTileHTML(hh[i]);
  t+='<span class="clock-colon" aria-hidden="true">:</span>';
  t+=miniTileHTML(mm[0])+miniTileHTML(mm[1]);
  t+='<span class="clock-secs"><span class="clock-colon" aria-hidden="true">:</span>'+miniTileHTML(ss[0])+miniTileHTML(ss[1])+'</span>';
  t+='<span class="os-mini-gap"></span>';
  t+='<span class="os-mini-tile letter"><span class="cap"></span><span class="rd">'+ap.charAt(0)+'</span></span>';
  t+='<span class="os-mini-tile letter"><span class="cap"></span><span class="rd">'+ap.charAt(1)+'</span></span>';
  return t+'</span>';
}
/* SWEEP-3 (F9): the meet timer is digit tiles now, never plain text —
   the same clock construction, minus the hours and the AM/PM. MM:SS as
   tiles with a plain white colon between the groups. */
function timerTilesHTML(mins, secs){
  const mm=String(mins).padStart(2,'0'), ss=String(secs).padStart(2,'0');
  return '<span class="os-mini-num clocknum" role="img" aria-label="Meet time, '+mins+' minutes '+secs+' seconds">'
    +miniTileHTML(mm[0])+miniTileHTML(mm[1])
    +'<span class="clock-colon" aria-hidden="true">:</span>'
    +miniTileHTML(ss[0])+miniTileHTML(ss[1])+'</span>';
}

/* ============ STORES — [C] verbatim ============ */

function loadBookings(){ try{ var a=JSON.parse(localStorage.getItem(BOOK_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveBookings(a){ try{ localStorage.setItem(BOOK_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function dayBookings(ds){ return loadBookings().filter(b=>b.date===ds).sort((x,y)=>String(x.time).localeCompare(String(y.time))); }
function bookTimeTaken(ds,t){ return dayBookings(ds).some(b=>b.time===t); }
function loadNotes(){ try{ var a=JSON.parse(localStorage.getItem(NOTE_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveNotes(a){ try{ localStorage.setItem(NOTE_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function dayNotes(ds, w){ return loadNotes().filter(n=>n.date===ds && (!w || n.world===w)); }
function fmtTime(t){ try{ var h=+t.slice(0,2), m=t.slice(3); var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }catch(e){ return t; } }
function dateKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

function isFutureDs(ds){ return ds>dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()); }
function dlabel(y,m,d){ return new Date(y,m,d).toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* Fallback wisdom store — [C] WISDOM_STORE verbatim, 7 lines. */
const WISDOM_STORE=[
 'The day is yours to shape — begin with the one thing that matters most, and let the rest follow.',

/* ============ DAILY WISDOM / REPORT / INTEL — [C] verbatim ============ */
function wisdomFor(ds){
  const parts=ds.split('-').map(Number);
  const prev=new Date(parts[0],parts[1]-1,parts[2]-1);
  const prevKey=dateKey(prev.getFullYear(),prev.getMonth(),prev.getDate());
  const ranked=loadNotes().filter(n=>n.date===prevKey&&n.type==='smart'&&n.rank)
    .sort((a,b)=>(b.rank-a.rank)||String(a.createdAt).localeCompare(String(b.createdAt)));
  if(ranked.length) return {text:ranked[0].text, source:'Carried forward — the highest-ranked Smart Note of '+dlabel(prev.getFullYear(),prev.getMonth(),prev.getDate())};
  const idx=Math.floor(new Date(parts[0],parts[1]-1,parts[2]).getTime()/86400000);
  return {text:WISDOM_STORE[((idx%WISDOM_STORE.length)+WISDOM_STORE.length)%WISDOM_STORE.length], source:'NayaNET wisdom store — from what we have learned'};
}
/* FIX-7 (item 5b): dirFor takes the same optional snapshot.
   FIX-8 (item 2): "what was learned" used to read "Nothing was recorded
   as learned on this day yet." whenever no note carried a rank — even
   with a smart note sitting on the same screen. Learned prefers the
   highest-ranked note, as before; with no ranked note it now quotes the
   day's earliest smart note (the day's recorded learning, unranked but
   real). "Nothing recorded" fires ONLY when the day has no smart note
   at all — it can never contradict a smart note on the same screen. */
function dirFor(ds,notes,books){
  notes=notes||dayNotes(ds); books=books||dayBookings(ds);
  if(!notes.length && !books.length) return null;
  const smart=notes.filter(n=>n.type==='smart'), naya=notes.filter(n=>n.type==='naya'), posts=notes.filter(n=>n.type==='post');
  const top=notes.filter(n=>n.rank).sort((a,b)=>b.rank-a.rank)[0];
  const firstSmart=smart.slice().sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')))[0];
  return {notes:notes.length, smart:smart.length, naya:naya.length, posts:posts.length,
    books:books.length,
    learned: top ? top.text : (firstSmart ? firstSmart.text : 'Nothing was recorded as learned on this day yet.')};
}
/* FIX-7 (item 5b): intelLine takes the same optional snapshot. */
function intelLine(ds,books,notes){
  books=books||dayBookings(ds); notes=notes||dayNotes(ds);
  const bits=[];
  if(books.length) bits.push(books.length+(books.length===1?' appointment':' appointments')+' booked');
  if(notes.length) bits.push(notes.length+(notes.length===1?' note':' notes')+' saved');
  if(!bits.length) bits.push('No records for this day yet');
  bits.push('News archive not wired — no headlines shown for this date');
  return bits.join(' · ')+'.';
}
/* FIX-7 (item 5b): dirLine takes the same optional snapshot.
   FIX-8 (item 3): the future check used to fire FIRST, so a day WITH
   records still read "This day has not happened yet". Records are checked
   first now: a day with a record gets its report even if it lies ahead;
   "not happened yet" fires ONLY for a future day with NO record.
   FIX-9 (item 3): counts are singular at 1 ("1 note", "1 appointment"),
   same ternary idiom as intelLine — the line used to read "1 notes". */
function dirLine(ds,books,notes){
  const r=dirFor(ds,notes,books);
  if(r) return (r.notes+(r.notes===1?' note':' notes')+' · '+r.books+(r.books===1?' appointment':' appointments')+' · what was learned: '+r.learned);
  if(isFutureDs(ds)) return 'This day has not happened yet — no report until the day has a record.';
  return 'No report — no records for this day.';
}

/* ============ TIMELINE JOURNAL — [C] timelineHTML, world filter removed ============ */
/* The day's whole story in time order, built ONLY from the day's own local
   record: bookings by their time; notes by time frame (Morning 09:00,
   Afternoon 14:00, Evening 19:00) then created time. Past days show their
   real record; future days show what is booked and what is open; today
   shows both. News: the archive is not wired, so the timeline says so
   honestly instead of inventing headlines. */
/* FIX-7 (item 5b): timelineHTML takes the same optional snapshot. */
function timelineHTML(ds,books,notes,flow){
  const todayKey=dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  const past=ds<todayKey, future=isFutureDs(ds);
  books=books||dayBookings(ds); notes=notes||dayNotes(ds);
  const TF_MIN={Morning:540,Afternoon:840,Evening:1140};
  const entry=(min,time,color,kind,text)=>`<li style="--tc:${color}"><span class="tl-time">${esc(time)}</span><span class="tl-kind">${esc(kind)}</span><div class="tl-text">${esc(text)}</div></li>`;
  const entries=[];
  books.forEach(b=>{
    const h=+String(b.time).slice(0,2), m=+String(b.time).slice(3);
    entries.push({min:h*60+m, html:entry(h*60+m,fmtTime(b.time),'#07925f','Appointment'+(b.meet?' · Smart Meet':''),(b.who||'Appointment')+(b.what?' — '+b.what:''))});
  });
  notes.forEach(n=>{
    const kind=n.type==='smart'?'Smart Note ❖':n.type==='post'?'Post':'Note';
    const color=n.type==='smart'?'#6d28d9':n.type==='post'?'#07925f':'#c62828';
    entries.push({min:TF_MIN[n.timeframe]||540, html:entry(TF_MIN[n.timeframe]||540,n.timeframe||'Morning',color,kind+' · '+n.world,n.text)});
  });
  entries.sort((a,b)=>a.min-b.min);
  const sub=past?'What went on this day — from this day’s own record.':future?'What is booked, and what is still open.':'Today so far, and what is still open.';
  let body='';
  if(entries.length) body=`<ol class="tl-list">${entries.map(e=>e.html).join('')}</ol>`;
  else body=`<p class="tl-empty">${past?'No records for this day — nothing was recorded. Unknown is not zero, and no record is invented.':'Nothing booked or written for this day yet.'}</p>`;
  if(!past){
    const open=BOOK_SLOTS.filter(t=>!books.some(b=>b.time===t));
    /* Scorecard (5), 03:47Z: the timeline is a day lived in, not a list of
       times — the open times are objects (chips), not a comma list. */
    body+=open.length?`<div class="tl-chips" aria-label="Open times on this day">${open.map(t=>`<span class="tl-chip">${esc(fmtTime(t))}</span>`).join('')}</div><p class="tl-note">These times are open — bookable.</p>`:`<p class="tl-note">Every time on this day is booked.</p>`;
  }
  body+=`<p class="tl-note">News for this day: the news archive is not wired yet — no headlines are shown, and today’s headlines are never shown as past news.</p>`;
  return `<section class="daytimeline" aria-label="Timeline for this day"${flow?` style="--dc:${flow[0]};--dc-rgb:${flow[1]}"`:''}><strong>THE DAY, IN ORDER</strong><div class="tl-sub">${esc(sub)}</div>${body}</section>`;
}

/* ============ MONTH — the numbers fill the screen ============ */
/* Amendment #6: the weekday pill takes its day's color from the dow-N class
   (--dc / --dc-rgb), so the rim and the glow read the day's color. The

$('weeknames').innerHTML=WEEKDAY.map((w,i)=>`<div class="dow-${i}">${w.name}</div>`).join('');
function dayHasRecord(ds){ return dayBookings(ds).length>0 || dayNotes(ds).length>0; }
/* The eye mark — [P] .eye-jewel CSS, pricing v77 line 140: a white jewel
   circle (Marcellus 700). `.eye-jewel` exists in pricing only as CSS
   (lines 140, 1460), never in markup; the 'i' is the amendment's directed
   mark. The button carries the 'i' as its text; the circle, pearl rim and
   glow are the .plan-eye rule above. Amendment #4(2). v5: the disc's
   middle is black now (amendment #5(1)) — the 'i' reads white on black. */
function render(){
  const first=new Date(year,month,1).getDay();
  const n=new Date(year,month+1,0).getDate();
  /* Amendment 2 (03:54Z): today is known from the weekday plaque — the
     plaque for today's weekday is the lit one (the mode-pill active
     treatment) — and from the header now-plaque, which carries today's
     date + the live time. SWEEP-3 (F2): the header TODAY button is gone;
     the plaque replaces it. Only while the displayed month is the current
     month; the cell itself carries no light. */
  document.querySelectorAll('#weeknames div').forEach((el,i)=>{
    el.classList.toggle('today', year===NOW.getFullYear()&&month===NOW.getMonth()&&i===NOW.getDay());
  });
  /* FIX-6 (item 2): the plaques' rest glow lives only in the current month
     (.cur on #weeknames) — in any other month no plaque glows, so no
     weekday can read as "today" there; the lit plaque exists only here. */
  $('weeknames').classList.toggle('cur', year===NOW.getFullYear()&&month===NOW.getMonth());
  /* SWEEP-3 (F2): "Back to today" — the return gesture, shown only when
     the viewed month is not the month holding today. Never the old TODAY
     button, which stays gone from the month header. */
  $('backTodayRow').hidden=(year===NOW.getFullYear()&&month===NOW.getMonth());
  /* AMENDMENT (Shawn 02:58Z): the grid ends at the month's last day — no
     trailing next-month days, no trailing blank row. Rows = the weeks the
     month actually needs; they stretch to fill, so the cells are BIG. */
  const rows=Math.ceil((first+n)/7);
  const total=first+n;
  $('days').style.gridTemplateRows='repeat('+rows+',1fr)';
  $('monthname').innerHTML=new Date(year,month,1).toLocaleDateString('en-CA',{month:'long'})+' <em>'+year+'</em>';
  $('days').innerHTML=Array.from({length:total},(_,i)=>{
    const d=i-first+1;
    if(d<1||d>n) return '<div class="cal-day blank" aria-hidden="true"></div>';
    const wd=WEEKDAY[new Date(year,month,d).getDay()];
    const ds=dateKey(year,month,d);
    const today=isToday(year,month,d);
    const rec=dayHasRecord(ds);
    const bN=dayBookings(ds).length, nN=dayNotes(ds).length;
    const summary=rec?((bN?bN+' appointment'+(bN===1?'':'s'):'')+(bN&&nN?', ':'')+(nN?nN+' note'+(nN===1?'':'s'):'')+'.'):'No records for this day.';
    /* FIX-6 (item 7): the glimpse says what is inside the day, in the
       day's own words — counts from the local record only, never invented.
       SWEEP-3 (F17): a second line — the first appointment's time — from
       the same record, via doorGlimpse ("Next: 9:00 AM", time only, never
       invented). Empty days stay empty; days with no booking show no
       second line. */
    const glimpse=rec?((bN?bN+' appointment'+(bN===1?'':'s'):'')+(bN&&nN?' · ':'')+(nN?nN+' note'+(nN===1?'':'s'):'')) : '';
    const apptG=rec?doorGlimpse('Appointments',ds,dayBookings(ds),dayNotes(ds)):'';
    const nextLine=apptG.indexOf('Next: ')===0?apptG.split(' — ')[0]:'';
    return `<div class="cal-day dow-${new Date(year,month,d).getDay()}${today?' today':''}" data-day="${d}" role="button" tabindex="0" aria-label="Open ${dlabel(year,month,d)}. ${esc(summary)}">
      ${miniNumHTML(d,'med',String(d),wd.color)}
      ${rec?`<span class="day-glimpse">${esc(glimpse)}${nextLine?'<br>'+esc(nextLine):''}</span><span class="has" aria-hidden="true"></span>`:''}
      <button class="plan-eye" type="button" data-eye="${d}" style="--jc:${wd.color}" aria-label="See inside ${dlabel(year,month,d)}">i</button></div>`;
  }).join('');
  document.querySelectorAll('[data-day]').forEach(b=>{ b.onclick=()=>openDay(+b.dataset.day);
    b.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDay(+b.dataset.day); } }; });
  document.querySelectorAll('[data-eye]').forEach(b=>{ b.onclick=e=>{ e.stopPropagation(); openDay(+b.dataset.eye); }; });
}
function openDay(d){ day=d; screen='day'; section='Dashboard'; slot=''; pushRoute(); showDay(); }

  renderNowPlaque();
  /* v5: the wisdom banner runs across the top of the day view (the harvested

  $('dayBody').innerHTML=`

    ${dashHTML(ds)}

function wireDay(){
  document.querySelectorAll('#dayView [data-view]').forEach(b=>b.onclick=()=>{ section=b.dataset.view; screen='view'; slot=''; pushRoute(); showView(); });
  /* v5: the dashboard boards are doors too — keyboard-openable like the buttons. */
  document.querySelectorAll('#dayView article[data-view]').forEach(b=>{ b.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); section=b.dataset.view; screen='view'; slot=''; pushRoute(); showView(); } }; });
  document.querySelectorAll('#dayView [data-op]').forEach(b=>b.onclick=()=>{ const op=b.dataset.op;
    if(op==='close'){ closeDay(); return; }
    /* v5: the day header's eye is the door to the day's info — it takes you
       to the Daily Intelligence Report board and puts focus on it.
       Instant scroll (behavior:'auto') + focus({preventScroll:true}): the
       smooth scroll + focus pair raced and landed 48px short of the board
       (probe 03:52Z: scrollTop 0 → 48, board top still at 676px). */
    if(op==='report'){ const r=$('dayReport'); if(r){ r.scrollIntoView({behavior:'auto',block:'start'}); r.focus({preventScroll:true}); } return; }
    if(op==='prevday'||op==='nextday'){ const d=new Date(year,month,day+(op==='prevday'?-1:1)); year=d.getFullYear(); month=d.getMonth(); day=d.getDate(); render(); pushRoute(); showDay(); return; }
    section=op; screen='view'; slot=''; pushRoute(); showView();
  });
}
function closeDay(){
  screen='month'; $('dayView').classList.remove('show'); $('dayView').setAttribute('aria-hidden','true');
  if(history.state && history.state.view!=='month') history.replaceState({view:'month',year,month,day},'','');
  render();
  const t=document.querySelector(`[data-day="${day}"]`); if(t) t.focus();
}

/* ============ DESTINATION VIEWS — one door open, Back everywhere ============ */
function viewHeadHTML(title, ds){

}
function emptyState(glyph, words, hint){
  const wd=WEEKDAY[new Date(year,month,day).getDay()];
  return `<div class="viewcard ph-card empty" style="--dc:${wd.color};--dc-rgb:${wd.color.match(/\w\w/g).map(x=>parseInt(x,16)).join(',')}"><span class="glyph" aria-hidden="true">${glyph}</span>${miniNumHTML(day,'med',String(day),wd.color)}<span class="words">${esc(words)}</span><span class="hintline">${esc(hint)}</span></div>`;
