<style>
:root{color-scheme:dark;--bg:#050607;--type-headline:25px;--type-sub:19px;--type-small:17px;--panel:#0a0a0f;--line:#43345b;--violet:#8e24aa;--text:#f9f7ff;--news:#0f52ba;--book:#07925f;--social:#a21caf;--biz:#0e7490;--notes:#8e24aa}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse 55% 40% at 50% 98%,#26103f 0,transparent 80%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100%;letter-spacing:.01em;font-size:17px}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px}
.shell{height:100dvh;display:flex;flex-direction:column;padding:14px clamp(10px,2.2vw,40px) 28px;gap:9px}
/* CALENDAR FIX 2 (F1) — DEAD CENTRE: the head was `auto 1fr auto` with
   a ~400px brand left and a ~130px toptools right, so the middle column centred
   ~105-115px RIGHT of the viewport centre (eye 02:53Z: plaque centre ~1065-1075
   vs viewport 960). `1fr auto 1fr` makes the two outer lanes equal, so the auto
   column — the plaque+jewel pair — centres exactly on the viewport. */
.head{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;min-height:65px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;justify-self:start}
.logo{height:56px;width:56px;flex:none;display:grid;place-items:center;font:bold 44px Georgia,serif;color:#fff;text-shadow:0 0 10px #8e24aa,0 0 26px #8e24aa;background:linear-gradient(145deg,#130723,#06030c);border:1px solid #8e24aa;border-radius:16px;box-shadow:inset 0 0 14px #351453,0 0 16px #8e24aa,0 8px 20px rgba(0,0,0,.6)}
.logo{cursor:pointer;padding:0;transition:transform .18s ease,box-shadow .18s ease}
.logo:hover{transform:translateY(-2px);box-shadow:inset 0 0 14px #351453,0 0 24px #8e24aa,0 12px 26px rgba(0,0,0,.6)}
.logo:active{transform:scale(.97)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brandtxt strong{font-size:clamp(22px,2.6vw,32px);letter-spacing:.02em;white-space:nowrap}
.brandtxt div{font-size:clamp(17px,1.5vw,19px);color:#fff}
.toptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;justify-self:end}
.pill{min-height:44px;background:linear-gradient(135deg,#232330 0%,#0b0b12 50%,#171722 100%);border:1.5px solid rgba(255,255,255,.85);color:#fff;padding:10px 14px;border-radius:13px;box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.6);transition:transform .18s ease,border-color .18s,box-shadow .18s}
.pill:hover{transform:translateY(-2px);border-color:var(--violet);box-shadow:0 10px 22px rgba(0,0,0,.6),0 0 18px rgba(142,36,170,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 6px rgba(0,0,0,.6)}
.pill:active{transform:translateY(0) scale(.97)}
.pill.active{border-color:#8e24aa;box-shadow:0 0 16px #8e24aa,0 6px 16px rgba(0,0,0,.55)}
.pill[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.monthtitle{font-size:clamp(19px,2.6vw,28px);min-width:166px;text-align:center;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.eyebrow{font-size:17px;letter-spacing:.17em;text-transform:uppercase;color:#fff;font-weight:800}
/* CALENDAR FIX 2026-11-18 (1) — time + date DEAD CENTER across the top.
   Harvested VERBATIM from the day file (blob e11cfd83): the day file's own
   month grid already has this centered plaque, weekday balls and 'i'
   jewels — the month file takes them byte for byte instead of rebuilding.
   The plaque is a button: tap it and you are in today. */
      .nowplaque {
        --dc: #d4a017;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        min-height: 44px; padding: 6px 18px; border-radius: 999px;
        justify-self: center; cursor: pointer; font: inherit; text-align: center;
        transition: box-shadow .25s, transform .25s, filter .25s;
        background:
          radial-gradient(90% 140% at 50% 0%, color-mix(in srgb, var(--dc) 8%, transparent), transparent 62%),
          linear-gradient(180deg, #17171f 0%, #0a0a11 62%, #060609 100%);
        border: 1.5px solid color-mix(in srgb, var(--dc) 62%, transparent);
        box-shadow:
          0 0 10px color-mix(in srgb, var(--dc) 18%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -6px 10px rgba(0, 0, 0, 0.5),
          0 5px 12px rgba(0, 0, 0, 0.5);
      }
      .nowplaque:hover { transform: translateY(-1px); filter: brightness(1.22); }
      .nowplaque:active { transform: scale(0.97); }
      .now-date {
        font-family: "Marcellus", serif; font-size: var(--type-sub);
        letter-spacing: 0.05em; color: #ffffff; white-space: nowrap;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      }
      .now-time {
        /* The time takes TODAY's colour — never gold (Shawn, 2026-11-17);
           --dc is set on the plaque from today's weekday in JS */
        font-size: var(--type-sub); font-weight: 800; letter-spacing: 0.06em;
        color: color-mix(in srgb, var(--dc, #d4a017) 58%, #ffffff 42%);
        font-variant-numeric: tabular-nums; white-space: nowrap;
        text-shadow: 0 0 8px color-mix(in srgb, var(--dc, #d4a017) 30%, transparent);
      }
      .live-dot {
        flex: none; width: 11px; height: 11px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--sc) 55%, color-mix(in srgb, var(--sc) 50%, #000000) 100%);
        border: 1px solid rgba(255,255,255,.85);
        box-shadow: 0 0 7px var(--sc), 0 0 13px color-mix(in srgb, var(--sc) 32%, transparent);
        animation: livepulse 2.4s ease-in-out infinite;
      }
      @keyframes livepulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.78); } }
      .clocknum { align-items: center; }
      .clock-colon { color: #ffffff; font-weight: 900; font-size: var(--type-sub); line-height: 1; text-shadow: 0 0 8px rgba(255,255,255,.35); }
      .os-mini-tile.letter { border-color: var(--hc, #ffffff); box-shadow: 0 4px 10px rgba(0,0,0,.7), 0 0 12px color-mix(in srgb, var(--hc, #ffffff) 50%, transparent), inset 0 1px 0 rgba(255,255,255,.35); }
      .os-mini-tile.letter .cap { background: linear-gradient(180deg,#ffffff,#d9d9de 55%,#9a9aa0); }
      .os-mini-tile.letter .rd { font-size: 24px; }
      @media (max-width:768px){
        .os-mini-tile{width:20px;border-radius:4px;}
        .os-mini-tile .cap{height:4px;}
        .os-mini-tile .rd{height:22px;line-height:22px;font-size:19px;}
        /* v18-fix: the AM/PM letter is 17px in the 20px tile — the
           v18 19px still clipped 2px live (real Archivo 900 "M" at
           19px is 20px wide in the 18px content box; at 17px the "M"
           is ~18px, the box). The v17 defect was the letter rd
           staying 24px in a 20px tile */
        .os-mini-tile.letter .rd{font-size:17px;}
        .os-mini-num{gap:2px;}
        .os-mini-num.med .os-mini-tile{width:40px;}
        .os-mini-num.med .os-mini-tile .cap{height:7px;}
        .os-mini-num.med .os-mini-tile .rd{height:40px;line-height:40px;font-size:36px;}
        .os-mini-tile.dot{width:8px;}
        .os-mini-num.med .os-mini-tile.dot{width:14px;}
        .os-mini-tile.pct{width:24px;}
        .os-mini-num.med .os-mini-tile.pct{width:44px;}
        .os-mini-gap{width:8px;}
        .os-mini-num.med .os-mini-gap{width:10px;}
      }
/* CALENDAR FIX 2026-11-18 — AMENDMENT: the real spinning Hz jewel BESIDE
   the plaque (the eye's follow-on: 'with the real spinning Hz jewel
   beside it'). Harvested VERBATIM from the day file's DAY SCREEN
   (blob e11cfd83): the .dayjewel unit — pedestal, aura, faceted gem,
   hzspin — the same unit that sits beside the date + live digit-tile
   time in the day screen's top bar. Sizes are the day file's fix-6
   sizes (see the harvest note at the top of this script).
   ONE adaptation, named: the day rule positions the jewel ABSOLUTE in
   its bar's top-right corner (top:0; right:0); here the jewel sits IN
   FLOW beside the plaque, so .nowcenter .dayjewel below sets
   position:static. The harvested rule itself stays byte-identical. */
      .dayjewel {
        /* Positioned against the day head, whose own edges ARE the
           bar's content corners — so 0/0 puts the unit exactly in
           the top right corner, level with the eye at left */
        position: absolute; z-index: 3;
        top: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      .hz-stage {
        position: relative; flex: none;
        width: clamp(48px, 6.5vmin, 56px); height: clamp(48px, 6.5vmin, 56px);
        display: flex; align-items: center; justify-content: center;
      }
      .hz-aura {
        /* Radiance kept quiet — rich, not glowing (Shawn, 2026-11-17) */
        position: absolute; inset: -10px; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, color-mix(in srgb, var(--dc, #fff) 20%, transparent) 0%, color-mix(in srgb, var(--dc, #fff) 6%, transparent) 52%, transparent 72%);
        animation: hzradiate 12s ease-in-out infinite alternate;
      }
      @keyframes hzradiate { from { opacity: .5; transform: scale(.94); } to { opacity: .85; transform: scale(1.05); } }
      .hz-pedestal {
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 34% 26%, #2c3044 0%, #13131f 52%, #050607 100%);
        border: 2px solid color-mix(in srgb, var(--dc, #fff) 78%, #ffffff 22%);
        box-shadow:
          0 8px 16px rgba(0, 0, 0, 0.65),
          0 0 11px color-mix(in srgb, var(--dc, #fff) 22%, transparent),
          inset 0 2px 3px rgba(255, 255, 255, 0.4),
          inset 0 -8px 12px rgba(0, 0, 0, 0.7);
      }
      .hz-pedestal::after {
        content: ""; position: absolute; inset: -8px; border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: color-mix(in srgb, var(--dc, #fff) 60%, #ffffff 10%);
        border-right-color: color-mix(in srgb, var(--dc, #fff) 22%, transparent);
        animation: orbitspin 70s linear infinite;
      }
      .dayjewel .gem {
        position: relative; z-index: 1;
        width: clamp(32px, 4.8vmin, 40px); height: auto; display: block;
        filter: drop-shadow(0 6px 10px rgba(0,0,0,.75)) drop-shadow(0 0 12px color-mix(in srgb, var(--dc, #fff) 45%, transparent));
        animation: hzspin 24s linear infinite;
        transform-origin: 50% 50%;
      }
      @keyframes hzspin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
      @keyframes orbitspin { to { transform: rotate(360deg); } }
      .dayjewel:hover .gem { animation-duration: 12s; }
      .dayjewel:hover .hz-aura { animation-duration: 6s; }
      /* CALENDAR FIX 2 (R3) — THE SIGNATURE PIECE: the flat drawn gem (gemSVG,
         harvested) no longer stands alone — it is the stone in a setting now:
         two concentric pearl rings on the pedestal face, counter-rotating
         (60s / 90s reverse, Laws §1), each carrying a pearl bead (silver-cap
         gradient, harvested from .os-mini-tile .cap). The rings take --dc, so
         the piece changes colour each day with the weekday. NEW composition;
         gem / pedestal / aura / spin are the harvested day-file mechanism. */
      .hz-ring-a,.hz-ring-b{position:absolute;border-radius:50%;pointer-events:none}
      .hz-ring-a{inset:3px;border:1px solid color-mix(in srgb,var(--dc,#fff) 38%,transparent);animation:hzring 60s linear infinite}
      .hz-ring-b{inset:7px;border:1px solid color-mix(in srgb,var(--dc,#fff) 30%,transparent);animation:hzring 90s linear infinite reverse}
      .hz-ring-a::before,.hz-ring-b::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffff 0%,#d9d9de 55%,#8a8a90 100%);box-shadow:0 1px 3px rgba(0,0,0,.6),0 0 6px color-mix(in srgb,var(--dc,#fff) 55%,transparent)}
      @keyframes hzring{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .dayjewel .freq {
        /* The Hz text takes the DAY's colour too */
        font-size: var(--type-small); font-weight: 800; line-height: 1;
        letter-spacing: 0.24em; text-indent: 0.24em;
        color: color-mix(in srgb, var(--dc, #fff) 55%, #ffffff 45%);
        text-shadow: 0 0 7px color-mix(in srgb, var(--dc, #fff) 26%, transparent);
        white-space: nowrap;
      }
/* The centre cell: plaque + jewel as ONE centred unit, 8px apart.
   The pair is dead center; the jewel takes today's weekday colour
   and frequency from renderNowPlaque, like the plaque. Unit height:
   56px stage + 2px gap + 17px freq = 75px, so the header grows from
   its 65px min-height to 75px — calculated, not eyeballed. */
.nowcenter{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.nowcenter .dayjewel{position:static;flex:none}

.hint{color:#fff;font-size:17px}
.barleft,.barright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.board{flex:1;min-height:0;border:1.5px solid rgba(255,255,255,.85);box-shadow:inset 0 0 34px #180926,0 0 32px #1f0e35,0 14px 34px rgba(0,0,0,.6);border-radius:22px;padding:10px;display:flex;flex-direction:column;background:linear-gradient(135deg,#15151f 0%,#0b0816 55%,#07050b 100%);overflow:hidden}
/* CALENDAR FIX 2 (R4) — SCROLL LIGHT: NO scroll-light mechanism exists in the
   filed bytes (0x IntersectionObserver, 0x scroll listener in either file) —
   this is the minimal build, not a harvest. A board lights in its own colour
   as it enters the viewpoint and HOLDS a restrained lit state. The tiles carry
   their weekday --dc (never two the same together down a week); the board
   takes today's weekday colour, set in JS. */
.board.lit{border-color:color-mix(in srgb,var(--dc,#8e24aa) 65%,#ffffff 20%);box-shadow:inset 0 0 34px #180926,0 0 24px color-mix(in srgb,var(--dc,#8e24aa) 30%,transparent),0 14px 34px rgba(0,0,0,.6)}
.tile.lit{border-color:color-mix(in srgb,var(--dc) 75%,#ffffff 15%);box-shadow:0 0 0 1px color-mix(in srgb,var(--dc) 55%,#ffffff 10%),0 0 16px color-mix(in srgb,var(--dc) 30%,transparent),0 12px 28px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -4px 10px rgba(0,0,0,.65)}
.weekrow .wk.lit{box-shadow:0 0 12px color-mix(in srgb,var(--dc) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -6px 10px rgba(0,0,0,.5),0 5px 12px rgba(0,0,0,.5)}

/* CALENDAR FIX 2026-11-18 (2) — the day's icon as a real 3D BALL above the
   word, harvested VERBATIM from the day file (blob e11cfd83). */
      .weekrow .wk-ico {
        /* The day's icon — a real 3D BALL now (Amendment #3), not a flat
           circle, not a hula hoop: a sphere, lit from the top-left, dark
           at its base, the day's colour as rim + glow outside, white
           glyph as an object inside (§4 THE ICON) */

          0 5px 12px rgba(0,0,0,.5);

      /* CALENDAR FIX 2 (F2) — the ball, made REAL (see note above). Specular:

      .weekrow .wk-ico::before{content:"";position:absolute;top:2px;left:3px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.25) 55%,transparent 75%);pointer-events:none}
      .weekrow .wk-ico::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid transparent;border-top-color:color-mix(in srgb,var(--dc) 70%,#ffffff);border-right-color:color-mix(in srgb,var(--dc) 22%,transparent);animation:orbitspin 90s linear infinite;pointer-events:none}
      .weekrow .wk:nth-child(even) .wk-ico::after{animation-duration:120s;animation-direction:reverse}

.weekrow .wk-ico{transition:transform .18s ease,box-shadow .18s ease}
      /* CALENDAR FIX 3 (F2) — PRESS AFTER HOVER: the press rule sat before

/* ---- DAY TILE — Living Obsidian, seven layers ---- */
.tile{--dc:#8e24aa;position:relative;text-align:left;min-height:64px;color:#fff;overflow:hidden;border-radius:16px;padding:10px 10px 8px;cursor:pointer;display:flex;flex-direction:column;

  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.tile::before{content:"";position:absolute;left:8%;right:8%;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--dc),transparent);opacity:.75;pointer-events:none}
/* FOLLOW-ON (1) PRICING FEEL — the whole cell ignites in its OWN weekday
   color on hover/touch, like the pricing chart: a soft own-color wash fills
   the tile (Naya Code §8: boards light up WHOLE on hover), the rim and the
   glow are the day's own color — never the generic purple. */
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .18s ease;
  background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--dc) 38%,transparent),transparent 65%),
  linear-gradient(135deg,color-mix(in srgb,var(--dc) 26%,transparent),transparent 60%)}
.tile:not(.blank):hover,.tile:not(.blank):focus-visible{transform:translateY(-5px);border-color:var(--dc);
  box-shadow:0 22px 38px rgba(0,0,0,.7),0 0 0 1.5px var(--dc),0 0 34px color-mix(in srgb,var(--dc) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -4px 10px rgba(0,0,0,.6)}
.tile:not(.blank):hover::after,.tile:not(.blank):focus-visible::after{opacity:1}
.tile:not(.blank):hover .daynum,.tile:not(.blank):focus-visible .daynum{transform:scale(1.07)}
.tile:not(.blank):active{transform:translateY(0) scale(.97)}
/* FOLLOW-ON (3) TODAY GLOWS — always, by rim + halo, never by fill
   (follow-on 2026-11-18, Shawn 00:16Z obsidian-inside law: black in the
   middle, the day's colour only as the light AROUND the board). The wash
   that used to sit at 0.55 at rest is off at rest; the rim glows more,
   and hover still ignites the whole cell like every other day. */
.tile.today{border:2px solid #fff;box-shadow:0 0 0 2px #8e24aa,0 0 36px color-mix(in srgb,var(--dc) 75%,transparent),0 0 20px rgba(142,36,170,.6),0 16px 32px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -4px 10px rgba(0,0,0,.6)}
.tile.today::after{opacity:0}
.tile.today:hover::after,.tile.today:focus-visible::after{opacity:1}
.tile.sel{box-shadow:0 0 0 2px var(--dc),0 0 30px rgba(255,255,255,.25),0 18px 34px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -4px 10px rgba(0,0,0,.6)}

   VERBATIM from the day file's .cell .jewel (blob e11cfd83); only the size
   grows — clamp(28px,4.4vmin,36px) here, bigger than the day grid's
   clamp(21px,3.4vmin,28px). It sits bottom-right, the corner opposite the
   number, and opens the day's info panel — the day's info, one tap. */
      .tile .ijewel {
        /* The info eye, rebalanced: a small dark obsidian jewel — no

        position: absolute; right: clamp(6px, 1.1vmin, 11px); bottom: clamp(6px, 1.1vmin, 11px);

/* THE SMART BLOCK is the DISPLAY unit: every screen as it unfolds is a new
   Smart Block, smartly formatted so it fits perfect. (The Intelligent Block
   remains the universal POSTING format — that standing law is unchanged;
   the names are not conflated: this class is the display block only.)
   THE SMART FLOW is the day view's mode: the unfold, going DOWN (the Smart
   Show — the slideshow, going ACROSS — is the deck/About/Skills mode and is
   NOT built into the calendar). The whole game: maximize the user's
   experience by giving 10-star service through the ultimate formatting for
   their viewpoint — each block is judged against that, not just "does it
   fit". The look: real, high tech, premium high-end software — something
   smart like a Naya — and the royal-kingdom bar.
   Rules, all in force here:
   (1) FULL SCREEN — the day view fills the screen edge to edge, the chamber
       frame as its edge. The panel is 100% x 100% to the frame; pop-ups OVER
       it (the Meet room) stay at 85% (90% small) so the frame stays visible
       around them.
   (2) ONE VISUAL PER BLOCK — a visual gets its own block; never two in one.
       The portal art gets its own block (Block 1, the chamber) — it no
       longer lives as a backdrop behind the panel, because the full-screen
       panel covers the backdrop; the art is seen once, framed.
   (3) IF IT DOESN'T FIT, IT GOES TO TWO SCREENS — a section that won't fit
       one screen SPLITS; never squeeze, never overflow, never leave anything
       half-aligned. The split points are measured by the probe and named in
       the report (width-conditional in dayScreenHTML / renderCategories). A
       block never scrolls internally: overflow hidden.
   (4) NO MORE SCROLLING — down is by button only (Keep reading ◆); a back
       control (‹ Back) is on every screen after the first; the last block
       goes home (Back to month ◆). The panel/day-scroll never scroll in flow
       mode — scrollTop stays 0; the only movement is the button-driven unfold.
   (5) OPTIMIZE FOR PRESENTATION — every block is a new presentation,
       perfectly formatted for the exact screen it's on. Life with Naya is the
       model: one glowing object at the centre, sparseness is the luxury, one
       thing at a time. Content centres at a readable 1100px in the wide
       block; at phone width it fills the screen. Each block its own
       theme/color (its --cc, inside the day's family), with a BREAK between
       blocks — the fold line in the block's own color.
   The frame is the thing each block locks INTO. On unfold the new block comes
   into the screen, pops out toward the viewer a little (scale 1.008, lift
   -2px), and settles exactly in the viewport. */
.smart-block{position:relative;flex:1;min-height:0;flex-direction:column;justify-content:safe center;overflow:hidden;

/* CALENDAR FIX 2 (R4) — the scroll-light driver (see CSS note). Re-armed at
   the end of render() because render() rebuilds the tiles and weekrow. */
let scrollIO=null;
function armScrollLight(){
  if(typeof IntersectionObserver==='undefined') return;
  if(!scrollIO){ scrollIO=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('lit'); scrollIO.unobserve(e.target); } }); },{threshold:.25}); }
  const b=document.querySelector('.board');
  if(b){ b.style.setProperty('--dc',WEEKDAY[NOW.getDay()].color); scrollIO.observe(b); }
  document.querySelectorAll('.weekrow .wk').forEach(function(el){ scrollIO.observe(el); });
  document.querySelectorAll('.tile').forEach(function(el){ if(!el.classList.contains('blank')) scrollIO.observe(el); });
}

/* FOLLOW-ON (4) TIMELINE JOURNAL — the day's whole story in time order,
   first after the day header. Built ONLY from the day's own local record:
   bookings by their time; notes by time frame (Morning 09:00, Afternoon
   14:00, Evening 19:00) then created time. The timeline spans worlds — it
   is the day's journal, all in one place — and labels each entry's world.
   Past days show their real record; future days show what is booked and
   what is open; today shows both. News: the archive is not wired, so the
   timeline says so honestly instead of inventing headlines. Visitors see
   only genuinely open times — never bookings, notes, or counts. */
function timelineHTML(ds){
  const todayKey=dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  const past=ds<todayKey, future=isFutureDs(ds);
  const TF_MIN={Morning:540,Afternoon:840,Evening:1140};
  const entry=(min,time,color,kind,text)=>`<li style="--tc:${color}"><span class="tl-dot"></span><span class="tl-time">${esc(time)}</span><span class="tl-kind">${esc(kind)}</span><div class="tl-text">${esc(text)}</div></li>`;
  if(role==='visitor'){
    const open=past?[]:BOOK_SLOTS.filter(t=>!bookTimeTaken(ds,t));
    if(!open.length) return `<p class="tl-empty">${past?'This day has passed — past availability is not bookable.':'No times are open on this day.'}</p>`;
    return `<ol class="tl-list">${open.map(t=>{const h=+t.slice(0,2),m=+t.slice(3);return entry(h*60+m,fmtTime(t),'#07925f','Open time','Genuinely open — bookable with the owner.');}).join('')}</ol>`;
  }
  const entries=[];
  dayBookings(ds).forEach(b=>{
    const h=+String(b.time).slice(0,2), m=+String(b.time).slice(3);
    entries.push({min:h*60+m, html:entry(h*60+m,fmtTime(b.time),'#07925f','Appointment'+(b.meet?' · Smart Meet':''),(b.who||'Appointment')+(b.what?' — '+b.what:''))});
  });
  dayNotes(ds).forEach(n=>{
    const kind=n.type==='smart'?'Smart Note':n.type==='post'?'Post':'Note';
    const color=n.type==='smart'?'#8e24aa':'#07925f';
    entries.push({min:TF_MIN[n.timeframe]||540, html:entry(TF_MIN[n.timeframe]||540,n.timeframe||'Morning',color,kind+' · '+n.world,n.text)});
  });
  entries.sort((a,b)=>a.min-b.min);
  if(!entries.length) return `<p class="tl-empty">${past?'No records for this day — nothing was recorded. Unknown is not zero, and no record is invented.':'Nothing booked or written for this day yet.'}</p>`;
  return `<ol class="tl-list">${entries.map(e=>e.html).join('')}</ol>`;
}

/* SMART FLOW VIEWER (16:12Z + 16:15Z): the day view shows one Smart
   Block at a time. panelShow(i) hides the rest, pops the new block in (it
   comes into the screen, pops out toward the viewer a little, settles
   exactly), and keeps the panel's scroll at 0 — the only movement is the
   button-driven unfold; there is no scrolling in the flow. panelBlock is
   the current block (0 = the chamber); openDay resets it, Leave from the
   room returns to it. */
function panelBlocks(){ return Array.prototype.slice.call(document.querySelectorAll('#panelContent .smart-block')); }
function panelShow(i){
  var blocks=panelBlocks(); if(!blocks.length) return;
  panelBlock=Math.max(0,Math.min(i,blocks.length-1));
  blocks.forEach(function(b,idx){ var on=idx===panelBlock; b.classList.toggle('on',on); if(on){ b.classList.remove('smart-pop'); void b.offsetWidth; b.classList.add('smart-pop'); } });
  var pn=document.querySelector('.panel'); if(pn) pn.scrollTop=0;
  panelDots();
}
/* THE MEET ROOM POP-UP (16:12Z rule 1): the room renders into #meetPop —
   an 85% overlay over the day view (90% small) — not into #panelContent.
   The day view stays rendered underneath. meetPopEl creates the overlay
   lazily inside the scrim (below the frame, z 40, so the frame stays visible
   around it); a click on its backdrop leaves the room. */
function meetPopEl(){
  var mp=document.getElementById('meetPop');
  if(!mp){ mp=document.createElement('div'); mp.id='meetPop'; mp.className='meet-pop'; mp.hidden=true;
    mp.addEventListener('click',function(ev){ if(ev.target===mp) leaveMeet(); });
    document.getElementById('scrim').appendChild(mp); }
  return mp;
}
/* V3: the pinned block indicator — one dot per Smart Block, the
   current lit in the day's color, tappable to jump. Rebuilt from the live
   block list every time, so split blocks count too. */
function panelDots(){
  var blocks=panelBlocks(); if(!blocks.length) return;
  blocks.forEach(function(b){
    var el=b.querySelector('.sb-dots'); if(!el) return;
    if(el.childElementCount!==blocks.length){
      el.innerHTML='';
      for(var i=0;i<blocks.length;i++){ var d=document.createElement('button'); d.type='button'; d.setAttribute('aria-label','Go to block '+(i+1)+' of '+blocks.length); d.setAttribute('data-dot',i); el.appendChild(d); }
    }
    Array.prototype.forEach.call(el.children,function(d,i){ d.classList.toggle('lit', i===panelBlock); });
  });
}
var _panelSplitMode=null;

function showPanel(){
  const publicView=role==='visitor';
  $('scrim').classList.add('show');
  const ds=selKey();
  const wd=WEEKDAY[new Date(year,month,day).getDay()];
  document.documentElement.style.setProperty('--dc',wd.color);
  document.documentElement.setAttribute('data-day-theme',wd.name.toLowerCase());
  const future=isFutureDs(ds);
  let html='';
  if(screen==='day'){
    html=dayScreenHTML(ds, wd, publicView, future);
  } else {
    html=viewHTML(ds, future, wd);
  }
  $('panelContent').innerHTML=html;
  /* Smart Flow: the day view is the flow (one Smart Block at a time, no
     scroll); every other screen keeps the v1 scroll. */
  document.querySelector('.panel').classList.toggle('flow', screen==='day' && !publicView);
  if(screen==='day' && !publicView){ _panelSplitMode=_panelSplit(); panelShow(panelBlock); }
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ section=b.dataset.view; screen='view'; slot=''; pushRoute(); showPanel(); });
  document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{ const op=b.dataset.op;
    if(op==='close'){ closePanel(); return; }
    if(op==='back'){ screen='day'; pushRoute(); showPanel(); return; }
    if(op==='prevday'||op==='nextday'){ const d=new Date(year,month,day+(op==='prevday'?-1:1)); year=d.getFullYear(); month=d.getMonth(); day=d.getDate(); panelBlock=0; render(); pushRoute(); showPanel(); return; }
    if(op==='nextblock'){ panelBlock=Math.min(panelBlock+1, panelBlocks().length-1); panelShow(panelBlock); return; }
    if(op==='prevblock'){ panelBlock=Math.max(panelBlock-1,0); panelShow(panelBlock); return; }
    if(op.startsWith('slot:')){ slot=op.slice(5); showPanel(); return; }
    if(op.startsWith('join:')){ openMeet(op.slice(5)); return; }
    if(op.startsWith('cancel:')){ cancelBooking(op.slice(7)); return; }
    if(op==='confirm'){ confirmBooking(); return; }
    if(op==='saveNote'){ saveNote(); return; }
    if(op==='sendMsg'){ sendMessage(); return; }

  });

  document.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>{ panelShow(parseInt(b.dataset.dot,10)); });

  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('mwCalMeetMode').value=b.dataset.mode; });

  const mb=$('mwCalBookMeet'); if(mb) mb.onchange=()=>{ const r=$('mwCalMeetModeRow'); if(r) r.hidden=!mb.checked; };
  const si=$('searchInput'); if(si){ si.focus(); si.oninput=()=>renderSearch(si.value); }
  const ni=$('noteText'); if(ni) ni.focus();
  const mh=$('modalTitle'); if(mh) mh.setAttribute('tabindex','-1'), mh.focus();
  const be=$('mwCalBookErr'); if(be&&pendingBookErr){ be.textContent=pendingBookErr; pendingBookErr=''; }
}
function intelLine(ds){
  const books=dayBookings(ds), notes=dayNotes(ds, world);
  const bits=[];
  if(books.length) bits.push(books.length+(books.length===1?' appointment':' appointments')+' booked');
  if(notes.length) bits.push(notes.length+(notes.length===1?' note':' notes')+' saved');
  if(!bits.length) bits.push('No records for this day yet');
  bits.push('News archive not wired — no headlines shown for this date');
  return bits.join(' · ')+'.';
}
function dirLine(ds){
  if(isFutureDs(ds)) return 'This day has not happened yet — no report until the day has a record.';

function confirmBooking(){

    if(op==='prevday'||op==='nextday'){ leaveMeet(true); const d=new Date(year,month,day+(op==='prevday'?-1:1)); year=d.getFullYear(); month=d.getMonth(); day=d.getDate(); render(); pushRoute(); showPanel(); return; }
  });
  $('micBtn').onclick=()=>{ micOn=!micOn; if(meetStream) meetStream.getAudioTracks().forEach(t=>t.enabled=micOn); $('micBtn').textContent=micOn?'Mic on':'Mic off'; };
  $('camBtn').onclick=()=>{ camOn=!camOn; if(meetStream) meetStream.getVideoTracks().forEach(t=>t.enabled=camOn); $('camBtn').textContent=camOn?'Camera on':'Camera off'; };
  meetTimer=setInterval(()=>{ meetSecs++; const m=String(Math.floor(meetSecs/60)).padStart(2,'0'), s=String(meetSecs%60).padStart(2,'0'); const t=$('meetTimer'); if(t) t.textContent=m+':'+s; },1000);
  const status=$('meetStatus');
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true,video:b.mode!=='audio'}).then(st=>{
      meetStream=st;
      if(status) status.textContent='Camera and mic are live — you are in the room.';
      const v=$('meetVideo');
      if(v&&b.mode!=='audio'){ v.srcObject=st; v.style.display='block'; }
    }).catch(e=>{
      if(status) status.textContent='Camera/mic unavailable here ('+(e&&e.name?e.name:'unknown')+') — you are still in the room, audio/video off. Join from a device that can grant them, or meet in person.';
    });
  } else if(status) status.textContent='This browser cannot grant camera/mic here — you are still in the room. Join from a device that can, or meet in person.';
}
function leaveMeet(keepPanel){
  if(meetTimer){ clearInterval(meetTimer); meetTimer=null; }
  if(meetStream){ meetStream.getTracks().forEach(t=>t.stop()); meetStream=null; }
  meetId='';
  var mp2=document.getElementById('meetPop'); if(mp2){ mp2.hidden=true; mp2.innerHTML=''; }
  if(!keepPanel){ if(meetFrom==='view'){ screen='view'; section='Smart Meet'; } else { screen='day'; } showPanel(); }
}
/* ============ CREATE ============ */
function createHTML(ds, future){
  const kinds=[['smart','Smart Note'],['naya','Note'],['post','Post']];
  return `<div class="viewcard"><h3>Create — ${esc(dlabel(year,month,day))}</h3>
  <p>Create on this day, in ${esc(world)}. A note is tied to its day and time frame; the timeline orders it morning to night.</p>
  <div class="actions">${kinds.map(([k,l])=>`<button class="pill${createKind===k?' active':''}" data-kind="${k}">${l}</button>`).join('')}</div>
  <label class="flab" for="noteTF">Time frame</label>
  <select class="field" id="noteTF"><option>Morning</option><option>Afternoon</option><option>Evening</option></select>
  ${createKind==='smart'?`<label class="flab" for="noteRank">Rank (1–5 — the highest-ranked Smart Note of the day becomes tomorrow's wisdom)</label>
  <select class="field" id="noteRank"><option value="">No rank</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>`:''}
  <label class="flab" for="noteText">${createKind==='smart'?'Smart Note':createKind==='post'?'Post':'Note'}</label>
  <textarea class="field" id="noteText" placeholder="Write it in your own words…"></textarea>
  <div class="actions"><button class="pill" data-op="saveNote">Save to this day →</button></div>
  <p class="err" id="noteErr" role="alert"></p>
  <p class="hint">Saved into this device's notes store (mw.cal.notes.v1), with its date, world, source and permission. Nothing is copied into the calendar by hand.</p>
  <div class="actions"><button class="pill" data-op="Appointments">Or book a time instead →</button></div></div>`;
}
function saveNote(){
  const err=$('noteErr');
  /* F4(c): a visitor must never write into the owner's mw.cal.notes.v1 store. */
  if(role==='visitor'){ if(err) err.textContent='Visitors cannot save notes — notes belong to the owner.'; return; }
  const text=($('noteText')||{}).value.trim();
  if(!text){ if(err) err.textContent='Write the note first.'; return; }
  const tf=($('noteTF')||{}).value||'Morning';
  const rankEl=$('noteRank');
  const all=loadNotes();
  all.push({id:uid(),date:selKey(),world, type:createKind, rank:rankEl?parseInt(rankEl.value||'0',10)||null:null, timeframe:tf, text, createdAt:new Date().toISOString()});
  if(!saveNotes(all)){ if(err) err.textContent='The note could not be saved on this device.'; return; }
  render(); section='Notes + Smart Notes'; screen='view'; pushRoute(); showPanel();
}
/* ============ SEARCH ============ */
function renderSearch(q){
  const box=$('searchResults'); if(!box) return;
  /* F4(a): visitors never search private notes or bookings. */
  if(role==='visitor'){ box.innerHTML='<p>Search is available to the owner only. Visitors never search private notes or bookings.</p>'; return; }
  q=(q||'').trim().toLowerCase();
  if(!q){ box.innerHTML='<p class="hint">Type to search your notes and bookings.</p>'; return; }
  const hits=[];
  loadNotes().forEach(n=>{ if(n.text.toLowerCase().includes(q)||n.date.includes(q)||n.world.toLowerCase().includes(q)) hits.push({kind:n.type==='smart'?'Smart Note':n.type==='post'?'Post':'Note', date:n.date, text:n.text}); });
  loadBookings().forEach(b=>{ if((b.who||'').toLowerCase().includes(q)||(b.what||'').toLowerCase().includes(q)||b.date.includes(q)) hits.push({kind:'Appointment', date:b.date, text:fmtTime(b.time)+' — '+(b.who||'')+(b.what?' — '+b.what:'')}); });
  if(!hits.length){ box.innerHTML='<p>No matches in this device\u2019s local record. Nothing is searched beyond your own record.</p>'; return; }
  box.innerHTML='<ul class="list">'+hits.slice(0,20).map((h,i)=>`<li><b>${esc(h.date)}</b> · ${esc(h.kind)} — ${esc(h.text)} <button class="pill" data-jump="${esc(h.date)}">Open day →</button></li>`).join('')+'</ul>';
  box.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ const p=b.dataset.jump.split('-').map(Number); year=p[0]; month=p[1]-1; day=p[2]; render(); openDay(day); });
}
function sendMessage(){
  const st=$('msgStatus');
  if(st) st.textContent='Not sent — messaging needs a verified private delivery path, which is not wired in this build. Nothing was sent.';
}
/* ============ ROUTING — Month → Day → Destination → Day → Month ============ */
function pushRoute(){
  const st={view:screen, year, month, day, world, role, section};
  try{ history.pushState(st,'',''); }catch(e){}
}
function applyState(st){
  if(!st) return;
  screen=st.view||'month'; year=st.year!=null?st.year:year; month=st.month!=null?st.month:month;
  day=st.day!=null?st.day:day; world=st.world||world; role=st.role||role; section=st.section||'Dashboard';
  render();
  if(screen==='month'){ $('scrim').classList.remove('show'); }
  else showPanel();
}
window.addEventListener('popstate',e=>{ leaveMeet(true); applyState(e.state); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&screen!=='month'){
    if(meetId){ leaveMeet(); return; }
    if(screen==='view'){ screen='day'; pushRoute(); showPanel(); }
    else closePanel();
  }
});
/* F7 — focus trap: while the scrim dialog is shown, Tab cycles inside
   .panel and never escapes to the background month controls. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab'||!$('scrim').classList.contains('show')) return;
  const f=Array.from(document.querySelectorAll('.panel button,.panel input,.panel textarea,.panel select,.panel [tabindex]'))
    .filter(el=>!el.disabled&&el.type!=='hidden'&&el.getAttribute('tabindex')!=='-1'&&!el.closest('[hidden]'));
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
});
$('scrim').addEventListener('click',e=>{ if(e.target===$('scrim')) closePanel(); });
$('prev').onclick=()=>{ const d=new Date(year,month-1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('next').onclick=()=>{ const d=new Date(year,month+1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('today').onclick=()=>{ year=NOW.getFullYear(); month=NOW.getMonth(); day=NOW.getDate(); render(); };
$('role').onclick=()=>{ role=role==='owner'?'visitor':'owner'; render(); if(screen!=='month'){ screen='day'; showPanel(); } };
for(const w of ['Personal','Business','Space','Thing'])
  $(w==='Personal'?'pers':w==='Business'?'biz':w.toLowerCase()).onclick=()=>{ world=w; render(); if(screen!=='month'){ screen='day'; showPanel(); } };
renderNowPlaque();
setInterval(renderNowPlaque,1000);
$('nowPlaque').onclick=()=>{ const t=new Date(); year=t.getFullYear(); month=t.getMonth(); render(); openDay(t.getDate()); };
$('brandHome').onclick=()=>{ const t=new Date(); year=t.getFullYear(); month=t.getMonth(); render(); openDay(t.getDate()); };
$('cornerN').onclick=()=>{ const t=new Date(); year=t.getFullYear(); month=t.getMonth(); render(); openDay(t.getDate()); };
/* FOLLOW-ON (5) B3 — the Search / Add / Naya handlers are gone with their
   buttons (see the header note). Search and Create stay reachable from
   inside a day view (Notes view, Create action); the Naya view has no entry
   point from the month view, per the ruling. */
render();
try{ history.replaceState({view:'month',year,month,day,world,role},'',''); }catch(e){}
