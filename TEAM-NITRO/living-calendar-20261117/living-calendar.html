<style>

/* ---- DAY TILE — Living Obsidian, seven layers ---- */
.tile{--dc:#8e24aa;position:relative;text-align:left;min-height:64px;color:#fff;overflow:hidden;border-radius:16px;padding:10px 10px 8px;cursor:pointer;display:flex;flex-direction:column;
  background:linear-gradient(135deg,#232330 0%,#0b0b12 48%,#171722 100%);
  border:1.5px solid #6b5a80;
  border-color:color-mix(in srgb,var(--dc) 55%,#ffffff 12%);
  box-shadow:0 12px 28px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -4px 10px rgba(0,0,0,.65);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.tile::before{content:"";position:absolute;left:8%;right:8%;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--dc),transparent);opacity:.75;pointer-events:none}
/* FOLLOW-ON (1) PRICING FEEL — the whole cell ignites in its OWN weekday
   color on hover/touch, like the pricing chart: a soft own-color wash fills
   the tile (Naya Code §8: boards light up WHOLE on hover), the rim and the
   glow are the day's own color — never the generic purple. */
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .18s ease;
  background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--dc) 38%,transparent),transparent 65%),
  linear-gradient(135deg,color-mix(in srgb,var(--dc) 26%,transparent),transparent 60%)}
.tile:not(.blank):hover,.tile:not(.blank):focus-visible{transform:translateY(-5px);border-color:var(--dc);
  box-shadow:0 22px 38px rgba(0,0,0,.7),0 0 0 1.5px var(--dc),0 0 34px color-mix(in srgb,var(--dc) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -4px 10px rgba(0,0,0,.6)}
.tile:not(.blank):hover::after,.tile:not(.blank):focus-visible::after{opacity:1}
.tile:not(.blank):hover .daynum,.tile:not(.blank):focus-visible .daynum{transform:scale(1.07)}
.tile:not(.blank):active{transform:translateY(0) scale(.97)}
/* FOLLOW-ON (3) TODAY GLOWS — always. Today is always activated at rest:
   its own-color wash is on, its rim glows more, and it lifts — while every
   other day lights only on hover. You can still click into any day. */
.tile.today{border:2px solid #fff;box-shadow:0 0 0 2px #8e24aa,0 0 36px color-mix(in srgb,var(--dc) 75%,transparent),0 0 20px rgba(142,36,170,.6),0 16px 32px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -4px 10px rgba(0,0,0,.6)}
.tile.today::after{opacity:.55}
.tile.today:hover::after,.tile.today:focus-visible::after{opacity:1}
.tile.sel{box-shadow:0 0 0 2px var(--dc),0 0 30px rgba(255,255,255,.25),0 18px 34px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -4px 10px rgba(0,0,0,.6)}
.tile.blank{opacity:.22;cursor:default;box-shadow:none}
.tile.past{opacity:.92}
.daynum{font-size:clamp(20px,2.1vw,32px);font-weight:800;line-height:1;color:#fff;text-shadow:0 1px 0 rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.85);display:inline-block;transition:transform .18s ease}
/* FOLLOW-ON (2) DASHBOARD DIGIT-TILE NUMBERS — each digit of the day number
   in its OWN gematria color, so every day has a different number-color
   combination. Day 16 = ruby 1 + indigo 6. Day 23 = burnt orange 2 + deep gold 3.
   The number is the tile's jewel: each digit carries its own glow.

   1 ruby · 2 burnt orange · 3 deep gold · 4 emerald · 5 deep cyan ·
   6 indigo · 7 royal purple · 8 deep violet · 9 deep magenta. */

<body>
<main class="shell">
  <header class="head">
    <div class="brand"><div class="logo" aria-hidden="true">N</div><div class="brandtxt"><strong>NayaNET · MY WORLD</strong><div id="worldname">Your life, organized by day.</div></div></div>
    <div class="toptools">
      <!-- FOLLOW-ON (5) B3 RULING — Search, Add (+) and Naya's profile are OFF
           the month view: they open non-day views and break the one-purpose
           viewport (DNA §8). The month view carries only: month title,
           prev/next/Today, world selector — plus the page brand and the
           owner/visitor switch, which stay. The Search, Create and Naya
           views remain in code with no entry point from the month view. -->
      <button class="pill" id="role" aria-label="Switch owner or visitor view">Owner view ▾</button>
    </div>

  </section>
</main>
<div class="scrim" id="scrim"><section class="panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="panelContent"></div></section></div>
<script>
/* ============ STATE ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TZ=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
const NOW=new Date();
let year=NOW.getFullYear(), month=NOW.getMonth(), day=NOW.getDate();
let role='owner', world='Personal';
let screen='month', section='Dashboard', slot='', meetId='', createKind='smart';
let lastFocus=null, pendingBookErr='';
/* Weekday identity light — DNA §1 (LOCKED 2026-11-03, governs). */
const WEEKDAY=[
 {name:'Sunday',   short:'Sun', color:'#8e24aa', hz:963, label:'purple'},
 {name:'Monday',   short:'Mon', color:'#c2410c', hz:417, label:'orange'},
 {name:'Tuesday',  short:'Tue', color:'#d4a017', hz:528, label:'gold'},
 {name:'Wednesday',short:'Wed', color:'#0f52ba', hz:741, label:'sapphire'},
 {name:'Thursday', short:'Thu', color:'#07925f', hz:639, label:'green'},
 {name:'Friday',   short:'Fri', color:'#c62828', hz:396, label:'red'},
 {name:'Saturday', short:'Sat', color:'#3f51b5', hz:852, label:'indigo'}];
/* Category chips inside the tile — brief §4 (never the whole tile). */
const CAT={
 Notes:['#8e24aa','✧'], News:['#0f52ba','◎'], Meeting:['#07925f','◷'],
 Event:['#a21caf','✦'], Project:['#0e7490','◈'], Journal:['#f5f5ff','☰'],
 Community:['#a21caf','♧'], Business:['#0e7490','▣'], Open:['#07925f','◷']};
/* Fallback wisdom store — harvested VERBATIM from the old calendar build
   (branch personal/calendar-booking-meet-20261116, blob 15e0a2fc), 7 lines. */
const WISDOM_STORE=[
 'The day is yours to shape — begin with the one thing that matters most, and let the rest follow.',
 'Ask Naya to carry the small things, so your mind stays free for the big ones.',
 'A note written down is a thought kept — what you record today, you can build on tomorrow.',
 'Success is a habit, not a moment — small steps, taken every day, add up to a life.',
 'Work with the intelligence beside you, not against it — tell it what you want, and let it do the doing.',
 'Share what you learn — wisdom grows when it is given away.',
 'Rest is part of the work — a clear mind sees further than a tired one.'];
/* ============ STORES (harvested booking store; notes store in the same pattern) ============ */
const BOOK_KEY='mw.cal.bookings.v1';
const NOTE_KEY='mw.cal.notes.v1';
const BOOK_SLOTS=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
function loadBookings(){ try{ var a=JSON.parse(localStorage.getItem(BOOK_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveBookings(a){ try{ localStorage.setItem(BOOK_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function dayBookings(ds){ return loadBookings().filter(b=>b.date===ds).sort((x,y)=>String(x.time).localeCompare(String(y.time))); }
function bookTimeTaken(ds,t){ return dayBookings(ds).some(b=>b.time===t); }
function loadNotes(){ try{ var a=JSON.parse(localStorage.getItem(NOTE_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveNotes(a){ try{ localStorage.setItem(NOTE_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function dayNotes(ds, w){ return loadNotes().filter(n=>n.date===ds && (!w || n.world===w)); }
function fmtTime(t){ try{ var h=+t.slice(0,2), m=t.slice(3); var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }catch(e){ return t; } }
function dateKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function selKey(){ return dateKey(year,month,day); }
function isToday(y,m,d){ return y===NOW.getFullYear()&&m===NOW.getMonth()&&d===NOW.getDate(); }
function isFutureDs(ds){ return ds>dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()); }
function dlabel(y,m,d){ return new Date(y,m,d).toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const TF_ORDER={Morning:0,Afternoon:1,Evening:2};
/* FOLLOW-ON (2) — each digit of the day number in its own gematria color.
   DEEP PALETTE (2026-11-17): 0 white · 1 ruby · 2 burnt orange · 3 deep gold ·
   4 emerald · 5 deep cyan · 6 indigo · 7 royal purple · 8 deep violet ·
   9 deep magenta. Day 16 = ruby 1 + indigo 6. */
const DIGIT_CLASS=['dg0','dg1','dg2','dg3','dg4','dg5','dg6','dg7','dg8','dg9'];
function digitNum(d){ return String(d).split('').map(ch=>`<span class="dg ${DIGIT_CLASS[+ch]}">${ch}</span>`).join(''); }
/* ============ DAILY WISDOM — sourced, with carry-forward ============ */
function wisdomFor(ds){
  /* Highest-ranked Smart Note of yesterday becomes today's wisdom (definition
     T26). Otherwise the NayaNET wisdom store, one per day, deterministic. */
  const parts=ds.split('-').map(Number);
  const prev=new Date(parts[0],parts[1]-1,parts[2]-1);
  const prevKey=dateKey(prev.getFullYear(),prev.getMonth(),prev.getDate());
  const ranked=loadNotes().filter(n=>n.date===prevKey&&n.type==='smart'&&n.rank)
    .sort((a,b)=>(b.rank-a.rank)||String(a.createdAt).localeCompare(String(b.createdAt)));
  if(ranked.length) return {text:ranked[0].text, source:'Carried forward — the highest-ranked Smart Note of '+dlabel(prev.getFullYear(),prev.getMonth(),prev.getDate())};
  const idx=Math.floor(new Date(parts[0],parts[1]-1,parts[2]).getTime()/86400000);
  return {text:WISDOM_STORE[((idx%WISDOM_STORE.length)+WISDOM_STORE.length)%WISDOM_STORE.length], source:'NayaNET wisdom store — from what we have learned'};
}
/* ============ DAILY INTELLIGENCE REPORT — computed from the day's own record ============ */
function dirFor(ds, w){
  /* Notes filter by world; bookings carry no world field on the record
     ({id,date,time,who,what,meet,mode}), so they cannot be world-filtered. */
  const notes=dayNotes(ds, w), books=dayBookings(ds);
  if(!notes.length && !books.length) return null;
  const smart=notes.filter(n=>n.type==='smart'), naya=notes.filter(n=>n.type==='naya'), posts=notes.filter(n=>n.type==='post');
  const top=notes.filter(n=>n.rank).sort((a,b)=>b.rank-a.rank)[0];
  return {notes:notes.length, smart:smart.length, naya:naya.length, posts:posts.length,
    books:books.length,
    learned: top ? top.text : 'Nothing was recorded as learned on this day yet.'};
}
/* Day highlights for the tile: up to 2 category chips + count of the rest.
   World-scoped: the world pill scopes the month, its tiles, and its stats. */
function dayHighlights(ds){
  const out=[];
  const books=dayBookings(ds);
  if(books.length) out.push('Meeting');
  const notes=dayNotes(ds, world);
  if(notes.some(n=>n.type==='smart')) out.push('Notes');
  if(notes.some(n=>n.type==='naya')) out.push('Journal');
  if(notes.some(n=>n.type==='post')) out.push(notes.some(n=>n.world==='Business')?'Business':'Community');
  return out;
}
function daySummary(ds){
  if(role==='visitor'){
    /* Open count is never shown: with 9 known slots it would reveal the
       booked count. Visitors see only that times are open, or fully booked. */
    const open=BOOK_SLOTS.some(t=>!bookTimeTaken(ds,t));
    return open?'open times available':'fully booked';
  }
  const h=dayHighlights(ds), n=dayNotes(ds, world).length, b=dayBookings(ds).length;
  const bits=[];
  if(b) bits.push(b+(b===1?' appointment':' appointments'));
  if(n) bits.push(n+(n===1?' note':' notes'));
  return bits.length?bits.join(', '):'no highlighted activity';
}
/* ============ MONTH ============ */
$('weeknames').innerHTML=WEEKDAY.map(w=>`<div style="color:${w.color}">${w.short}</div>`).join('');
function render(){
  const first=new Date(year,month,1).getDay();
  const n=new Date(year,month+1,0).getDate();
  const total=Math.ceil((first+n)/7)*7;
  $('monthname').textContent=new Date(year,month,1).toLocaleDateString('en-CA',{month:'long',year:'numeric'});
  $('worldname').textContent=world+' world · '+TZ;
  const todayKey=dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  $('days').innerHTML=Array.from({length:total},(_,i)=>{
    const d=i-first+1;
    if(d<1||d>n) return '<div class="tile blank" aria-hidden="true"></div>';
    const wd=WEEKDAY[new Date(year,month,d).getDay()];
    const ds=dateKey(year,month,d);
    /* Visitor sees availability only — never private notes, counts, or text. */
    const h = role==='visitor'
      ? (BOOK_SLOTS.some(t=>!bookTimeTaken(ds,t)) ? ['Open'] : [])
      : dayHighlights(ds);
    const today=isToday(year,month,d), sel=(ds===selKey());
    const past=ds<todayKey;
    const wis=wisdomFor(ds).text;
    return `<div class="tile ${today?'today':''} ${sel?'sel':''} ${past?'past':''}" data-day="${d}" role="button" tabindex="0" style="--dc:${wd.color}" aria-label="Open ${dlabel(year,month,d)}, ${esc(daySummary(ds))}">
      <div class="tilerow"><span class="daynum">${digitNum(d)}</span><button type="button" class="viewbtn" data-viewday="${d}" aria-label="View ${dlabel(year,month,d)}">VIEW</button></div>
      <div class="dayname">${wd.short} · ${wd.hz} Hz</div>
      <div class="tilewisdom" title="${esc(wis)}">${esc(wis)}</div>
      <div class="chiplane">${h.slice(0,2).map(x=>`<span class="chip" style="--chip:${CAT[x][0]}">${CAT[x][1]} ${esc(x)}</span>`).join('')||`<span class="minitext">${(role==='visitor'&&!BOOK_SLOTS.some(t=>!bookTimeTaken(ds,t)))?'Fully booked':'Open day'}</span>`}</div>
      ${h.length>2?`<div class="more">+${h.length-2} more</div>`:''}
      <div class="dots">${h.slice(0,3).map(x=>`<span class="dot" style="background:${CAT[x][0]}"></span>`).join('')}</div>
      ${h.length?'<span class="spark">✧</span>':''}</div>`;
  }).join('');
  document.querySelectorAll('[data-day]').forEach(b=>{ b.onclick=()=>openDay(+b.dataset.day);
    b.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDay(+b.dataset.day); } }; });
  document.querySelectorAll('[data-viewday]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openDay(+b.dataset.viewday); });
  for(const w of ['Personal','Business','Space','Thing'])
    $(w==='Personal'?'pers':w==='Business'?'biz':w.toLowerCase()).classList.toggle('active',world===w);
  $('role').textContent=role==='owner'?'Owner view ▾':'Visitor view ▾';
}
function openDay(d){ day=d; screen='day'; section='Dashboard'; slot=''; pushRoute(); showPanel(); }
function button(text, fn, cls){ return `<button class="${cls||'pill'}" data-op="${esc(fn)}">${text}</button>`; }
/* FOLLOW-ON (4) TIMELINE JOURNAL — the day's whole story in time order,
   first after the day header. Built ONLY from the day's own local record:
   bookings by their time; notes by time frame (Morning 09:00, Afternoon
   14:00, Evening 19:00) then created time. The timeline spans worlds — it
   is the day's journal, all in one place — and labels each entry's world.
   Past days show their real record; future days show what is booked and
   what is open; today shows both. News: the archive is not wired, so the
   timeline says so honestly instead of inventing headlines. Visitors see
   only genuinely open times — never bookings, notes, or counts. */
function timelineHTML(ds){
  const todayKey=dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  const past=ds<todayKey, future=isFutureDs(ds);
  const TF_MIN={Morning:540,Afternoon:840,Evening:1140};
  const entry=(min,time,color,kind,text)=>`<li style="--tc:${color}"><span class="tl-dot"></span><span class="tl-time">${esc(time)}</span><span class="tl-kind">${esc(kind)}</span><div class="tl-text">${esc(text)}</div></li>`;
  if(role==='visitor'){
    const open=past?[]:BOOK_SLOTS.filter(t=>!bookTimeTaken(ds,t));
    const body=open.length
      ? `<ol class="tl-list">${open.map(t=>{const h=+t.slice(0,2),m=+t.slice(3);return entry(h*60+m,fmtTime(t),'#07925f','Open time','Genuinely open — bookable with the owner.');}).join('')}</ol>`
      : `<p class="tl-empty">${past?'This day has passed — past availability is not bookable.':'No times are open on this day.'}</p>`;
    return `<section class="daytimeline" aria-label="Timeline for this day"><strong>THE DAY, IN ORDER</strong><div class="tl-sub">Public view — open times only. Private appointments and notes are never shown.</div>${body}</section>`;
  }
  const entries=[];
  dayBookings(ds).forEach(b=>{
    const h=+String(b.time).slice(0,2), m=+String(b.time).slice(3);
    entries.push({min:h*60+m, html:entry(h*60+m,fmtTime(b.time),'#07925f','Appointment'+(b.meet?' · Smart Meet':''),(b.who||'Appointment')+(b.what?' — '+b.what:''))});
  });
  dayNotes(ds).forEach(n=>{
    const kind=n.type==='smart'?'Smart Note ✧':n.type==='post'?'Post':'Note';
    const color=n.type==='smart'?'#8e24aa':'#f5f5ff';
    entries.push({min:TF_MIN[n.timeframe]||540, html:entry(TF_MIN[n.timeframe]||540,n.timeframe||'Morning',color,kind+' · '+n.world,n.text)});
  });
  entries.sort((a,b)=>a.min-b.min);
  const sub=past?'What went on this day — from this day\u2019s own record.':future?'What is booked, and what is still open.':'Today so far, and what is still open.';
  let body='';
  if(entries.length) body=`<ol class="tl-list">${entries.map(e=>e.html).join('')}</ol>`;
  else body=`<p class="tl-empty">${past?'No records for this day — nothing was recorded. Unknown is not zero, and no record is invented.':'Nothing booked or written for this day yet.'}</p>`;
  if(!past){
    const open=BOOK_SLOTS.filter(t=>!bookTimeTaken(ds,t));
    body+=open.length?`<p class="tl-note">Open times on this day: ${open.map(t=>esc(fmtTime(t))).join(', ')} — bookable.</p>`:`<p class="tl-note">Every time on this day is booked.</p>`;
  }
  body+=`<p class="tl-note">News for this day: the news archive is not wired yet — no headlines are shown, and today\u2019s headlines are never shown as past news.</p>`;
  return `<section class="daytimeline" aria-label="Timeline for this day"><strong>THE DAY, IN ORDER</strong><div class="tl-sub">${esc(sub)}</div>${body}</section>`;
}
/* ============ DAY MENU (8 doors + Book/Meet/Create + 3 cards) ============ */
const DOORS=[['Dashboard','▥','#8e24aa','Daily stats'],['Personal','♙','#f5f5ff','My activity'],
 ['Business','▣','#0e7490','Work and income'],['Space / Thing','◈','#8e24aa','My communities'],
 ['Local','⌖','#0f52ba','My area'],['Provincial','▧','#0f52ba','My province'],
 ['Global','◎','#0f52ba','The world'],['Notes + Smart Notes','✧','#8e24aa','Notes + Smart Notes']];
function showPanel(){
  const publicView=role==='visitor';
  $('scrim').classList.add('show');
  const ds=selKey();
  const wd=WEEKDAY[new Date(year,month,day).getDay()];
  const future=isFutureDs(ds);
  let html='';
  if(screen==='day'){
    html=`<div class="panelhead"><div><div class="eyebrow">${publicView?'Public calendar':'Inside your day'} · ${esc(world)} · ${wd.name} ${wd.hz} Hz · ${esc(TZ)}</div>
    <h2 id="modalTitle">YOUR WORLD FOR THIS DAY — ${esc(dlabel(year,month,day))}</h2>
    <div class="sub">${publicView?'Public events, available times, and ways to connect':'Your whole world for this date, intelligently organized'}</div>
    <div class="sub">Weather: unavailable — no weather provider is wired yet. Nothing is shown in its place.</div></div>${button('×','close','pill close')}</div>
    ${timelineHTML(ds)}
    ${publicView?'':`<article class="wisdomcard"><strong>Daily Wisdom</strong><span>${esc(wisdomFor(ds).text)}</span><br><span>${esc(wisdomFor(ds).source)}</span></article>`}
    <div class="actions">${button('‹ Previous day','prevday')}${button('Next day ›','nextday')}${button('← Back to month','close')}</div>`;
    if(publicView){
      html+=`<div class="doors">${[['Public Events','✦','#a21caf','What is open to all'],['Available Times','◷','#07925f','Genuinely open slots'],['Send a Message','✉','#8e24aa','Through an authorized channel'],['About This World','◎','#0f52ba','About this world']].map(([x,i,c,s])=>`<button class="door" style="--c:${c}" data-view="${esc(x)}"><span class="ico">${i}</span>${esc(x)}<span class="sub2">${esc(s)}</span></button>`).join('')}</div>
      <div class="insight"><article><strong>Public information only</strong><span>Visitors never see private appointments, notes, mail, or daily statistics.</span></article>
      <article><strong>Booking</strong><span>Only genuinely open slots are displayed. Taken times are never listed — never with a name or subject.</span></article>
      <article><strong>Stay connected</strong><span>Message the owner through an authorized channel.</span></article></div>`;
    } else {
      const meetBooks=dayBookings(ds).filter(b=>b.meet);
      html+=`<div class="doors">${DOORS.map(([x,i,c,s])=>`<button class="door" style="--c:${c}" data-view="${esc(x)}"><span class="ico">${i}</span>${esc(x)}<span class="sub2">${esc(s)}</span></button>`).join('')}</div>
      <div class="actions">${button('◷ Book','Appointments')}${button('▣ Smart Meet','Smart Meet')}${button('+ Create','Create')}</div>
      ${meetBooks.length?'':'<p class="hint">Smart Meet joins a confirmed booking — book a time with Smart Meet first.</p>'}
      <div class="insight">
        <article><strong>Intel Today</strong><span>${esc(intelLine(ds))}</span></article>
        <article><strong>Daily Intelligence Report</strong><span>${esc(dirLine(ds))}</span></article>
      </div>`;
    }
  } else {
    html=viewHTML(ds, future, wd);
  }
  $('panelContent').innerHTML=html;
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ section=b.dataset.view; screen='view'; slot=''; pushRoute(); showPanel(); });
  document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{ const op=b.dataset.op;
    if(op==='close'){ closePanel(); return; }
    if(op==='back'){ screen='day'; pushRoute(); showPanel(); return; }
    if(op==='prevday'||op==='nextday'){ const d=new Date(year,month,day+(op==='prevday'?-1:1)); year=d.getFullYear(); month=d.getMonth(); day=d.getDate(); render(); pushRoute(); showPanel(); return; }
    if(op.startsWith('slot:')){ slot=op.slice(5); showPanel(); return; }
    if(op.startsWith('join:')){ openMeet(op.slice(5)); return; }
    if(op.startsWith('cancel:')){ cancelBooking(op.slice(7)); return; }
    if(op==='confirm'){ confirmBooking(); return; }
    if(op==='saveNote'){ saveNote(); return; }
    if(op==='sendMsg'){ sendMessage(); return; }
    if(op==='leaveMeet'){ leaveMeet(); return; }
    section=op; screen='view'; slot=''; pushRoute(); showPanel();
  });
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ createKind=b.dataset.kind; showPanel(); });
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('mwCalMeetMode').value=b.dataset.mode; });
  document.querySelectorAll('[data-mw-cal-slot]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-mw-cal-slot]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); const h=$('mwCalBookTime'); if(h) h.value=b.dataset.mwCalSlot; });
  const mb=$('mwCalBookMeet'); if(mb) mb.onchange=()=>{ const r=$('mwCalMeetModeRow'); if(r) r.hidden=!mb.checked; };
  const si=$('searchInput'); if(si){ si.focus(); si.oninput=()=>renderSearch(si.value); }
  const ni=$('noteText'); if(ni) ni.focus();
  const mh=$('modalTitle'); if(mh) mh.setAttribute('tabindex','-1'), mh.focus();

  if(notes.length) bits.push(notes.length+(notes.length===1?' note':' notes')+' saved');

function confirmBooking(){
  const ds=selKey();
  const time=($('mwCalBookTime')||{}).value||'';
  const who=($('mwCalBookWho')||{}).value.trim();
  const what=($('mwCalBookWhat')||{}).value.trim();
  const err=$('mwCalBookErr');
  if(!time){ if(err) err.textContent='Pick a time first.'; return; }
  /* F10: the "just taken" error must survive the showPanel() re-render —
     stash it in pendingBookErr; showPanel() restores it into #mwCalBookErr. */
  if(bookTimeTaken(ds,time)){ pendingBookErr='That time was just taken — pick another time.'; showPanel(); return; }
  if(!who){ if(err) err.textContent='Add a name so the appointment says who it is with.'; return; }
  const meet=!!($('mwCalBookMeet')||{}).checked;
  const mode=(($('mwCalMeetMode')||{}).value)||'video';
  const all=loadBookings();
  all.push({id:uid(),date:ds,time,who,what,meet,mode});
  if(!saveBookings(all)){ if(err) err.textContent='The booking could not be saved on this device. Nothing was confirmed.'; return; }
  slot=time;
  section='Appointments'; screen='view'; pushRoute(); showPanel();
  render();
  const card=document.querySelector('.viewcard');
  if(card){ const p=document.createElement('p'); p.className='status';
    p.textContent='Booked — '+fmtTime(time)+' on '+dlabel(year,month,day)+'. Saved in this device\u2019s calendar store (mw.cal.bookings.v1). Server sync is not wired yet.';
    card.prepend(p); }
}
function cancelBooking(id){
  const all=loadBookings().filter(b=>b.id!==id);
  saveBookings(all); render(); showPanel();
}

function openMeet(id){

  document.querySelectorAll('[data-op]').forEach(x=>x.onclick=()=>{ const op=x.dataset.op;
    if(op==='leaveMeet'){ leaveMeet(); return; }
    if(op==='back'){ leaveMeet(true); screen='day'; pushRoute(); showPanel(); return; }

  });

  $('camBtn').onclick=()=>{ camOn=!camOn; if(meetStream) meetStream.getVideoTracks().forEach(t=>t.enabled=camOn); $('camBtn').textContent=camOn?'📷 Camera on':'📷 Camera off'; };

function saveNote(){

function renderSearch(q){
  const box=$('searchResults'); if(!box) return;
  /* F4(a): visitors never search private notes or bookings. */
  if(role==='visitor'){ box.innerHTML='<p>Search is available to the owner only. Visitors never search private notes or bookings.</p>'; return; }
  q=(q||'').trim().toLowerCase();
  if(!q){ box.innerHTML='<p class="hint">Type to search your notes and bookings.</p>'; return; }
  const hits=[];
  loadNotes().forEach(n=>{ if(n.text.toLowerCase().includes(q)||n.date.includes(q)||n.world.toLowerCase().includes(q)) hits.push({kind:n.type==='smart'?'Smart Note':n.type==='post'?'Post':'Note', date:n.date, text:n.text}); });
  loadBookings().forEach(b=>{ if((b.who||'').toLowerCase().includes(q)||(b.what||'').toLowerCase().includes(q)||b.date.includes(q)) hits.push({kind:'Appointment', date:b.date, text:fmtTime(b.time)+' — '+(b.who||'')+(b.what?' — '+b.what:'')}); });
  if(!hits.length){ box.innerHTML='<p>No matches in this device\u2019s local record. Nothing is searched beyond your own record.</p>'; return; }
  box.innerHTML='<ul class="list">'+hits.slice(0,20).map((h,i)=>`<li><b>${esc(h.date)}</b> · ${esc(h.kind)} — ${esc(h.text)} <button class="pill" data-jump="${esc(h.date)}">Open day →</button></li>`).join('')+'</ul>';
  box.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ const p=b.dataset.jump.split('-').map(Number); year=p[0]; month=p[1]-1; day=p[2]; render(); openDay(day); });
}

  day=st.day!=null?st.day:day; world=st.world||world; role=st.role||role; section=st.section||'Dashboard';

   .panel and never escapes to the background month controls. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab'||!$('scrim').classList.contains('show')) return;
  const f=Array.from(document.querySelectorAll('.panel button,.panel input,.panel textarea,.panel select,.panel [tabindex]'))
    .filter(el=>!el.disabled&&el.type!=='hidden'&&el.getAttribute('tabindex')!=='-1'&&!el.closest('[hidden]'));
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
});
$('scrim').addEventListener('click',e=>{ if(e.target===$('scrim')) closePanel(); });
$('prev').onclick=()=>{ const d=new Date(year,month-1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('next').onclick=()=>{ const d=new Date(year,month+1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('today').onclick=()=>{ year=NOW.getFullYear(); month=NOW.getMonth(); day=NOW.getDate(); render(); };
$('role').onclick=()=>{ role=role==='owner'?'visitor':'owner'; render(); if(screen!=='month'){ screen='day'; showPanel(); } };
for(const w of ['Personal','Business','Space','Thing'])
  $(w==='Personal'?'pers':w==='Business'?'biz':w.toLowerCase()).onclick=()=>{ world=w; render(); if(screen!=='month'){ screen='day'; showPanel(); } };
/* FOLLOW-ON (5) B3 — the Search / Add / Naya handlers are gone with their
   buttons (see the header note). Search and Create stay reachable from
   inside a day view (Notes view, Create action); the Naya view has no entry
   point from the month view, per the ruling. */
render();
try{ history.replaceState({view:'month',year,month,day,world,role},'',''); }catch(e){}
</script></body></html>
