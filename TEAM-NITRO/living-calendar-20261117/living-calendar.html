<!--
  LIVING CALENDAR — FULL SCREEN (2026-11-17)
  Structure + navigation harvested VERBATIM from Shawn's clickable prototype
  ~/workspace/user/files/NayaNET-Living-Calendar-Concept.html (17,828 B,
  md5 657796bebb5d790e7cfe69fc91730f11). Demo/sample data inside the prototype
  is placeholder and is REPLACED here by real local records or honest empty
  states — nothing in this file is presented as real unless it comes from a
  record named in the code.
  Booking logic harvested from the old calendar build
  (branch personal/calendar-booking-meet-20261116, blob 15e0a2fc):
  store 'mw.cal.bookings.v1', 9 hourly slots 09:00-17:00, taken slots disabled,
  double-booking refused, survives reload. Meet room: getUserMedia on join,
  honest outcome reporting, timer, Mic/Camera, Leave.
  Notes store 'mw.cal.notes.v1' (this round, same pattern): {id,date,world,
  type,rank,timeframe,text,createdAt}. Daily Intelligence Report is computed
  from the day's own record; an empty day gets no report, none invented.
  Weekday identity light (Living Calendar definition T1-T38, still law):
  Sun purple 963 · Mon orange 417 · Tue yellow 528 · Wed sky blue 741 ·
  Thu green 639 · Fri red 396 · Sat indigo 852. Category chips inside the
  tile (never the whole tile): Smart Notes #9B5CFF · news #38A4FF ·
  appointments #19CA9B · community #E05CBE · business #49D6E8 ·
  personal #F5F5FF.
  SUPERSESSIONS (brief §3): (1) the 13-button day menu is REPLACED by 8 doors
  + Book/Meet/Create + 3 featured cards — the 13-button menu is not rebuilt.
  (2) Weekday colors STAND as each tile's rim/edge light; content shows as
  semantic category chips inside the tile.
  Design law: Living Obsidian, seven layers (Shadow, Body, Bevel, Rim, Jewel,
  Label, Response). One light, top-left, 135deg. White at rest, color ignites
  on interaction in the object's own color only. No flat buttons.
  Honest limits, stated on the page where they apply: news archive not wired
  (never today's news relabeled as past news); weather provider not wired;
  bookings live in this device's calendar store (server sync not wired yet);
  Smart Meet joins a confirmed booking only, live media leg unproven here.
-->
<style>

/* ---- DAY TILE — Living Obsidian, seven layers ---- */
.tile{--dc:#a06bff;position:relative;text-align:left;min-height:64px;color:#fff;overflow:hidden;border-radius:16px;padding:10px 10px 8px;
  background:linear-gradient(135deg,#232330 0%,#0b0b12 48%,#171722 100%);

  border-color:color-mix(in srgb,var(--dc) 55%,#ffffff 12%);
  box-shadow:0 12px 28px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -4px 10px rgba(0,0,0,.65);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.tile::before{content:"";position:absolute;left:8%;right:8%;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--dc),transparent);opacity:.75;pointer-events:none}
.tile:not(.blank):hover,.tile:not(.blank):focus-visible{transform:translateY(-3px);border-color:var(--dc);
  box-shadow:0 18px 34px rgba(0,0,0,.65),0 0 0 1px var(--dc),0 0 26px rgba(160,107,255,.35),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -4px 10px rgba(0,0,0,.6)}

.door{--c:#a06bff;position:relative;text-align:center;min-height:96px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:#fff;font-weight:700;border-radius:16px;padding:12px 10px;
  background:linear-gradient(135deg,#241a33 0%,#0b0b12 50%,#171722 100%);

.door:hover,.door:focus-visible{transform:translateY(-3px);border-color:var(--c);box-shadow:0 16px 30px rgba(0,0,0,.65),0 0 0 1px var(--c),0 0 24px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -4px 10px rgba(0,0,0,.6)}

.field{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.85);background:#050508;color:#fff;box-shadow:inset 0 2px 8px rgba(0,0,0,.7)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

      <button class="pill" id="searchBtn" aria-label="Search your calendar">⌕ Search</button>

<script>
/* ============ STATE ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TZ=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
const NOW=new Date();
let year=NOW.getFullYear(), month=NOW.getMonth(), day=NOW.getDate();
let role='owner', world='Personal';
let screen='month', section='Dashboard', slot='', meetId='', createKind='smart';
let lastFocus=null;
/* Weekday identity light — Living Calendar definition T1-T38 (still law). */
const WEEKDAY=[
 {name:'Sunday',   short:'Sun', color:'#a06bff', hz:963, label:'purple'},
 {name:'Monday',   short:'Mon', color:'#ff9a5a', hz:417, label:'orange'},
 {name:'Tuesday',  short:'Tue', color:'#ffbf3d', hz:528, label:'yellow'},
 {name:'Wednesday',short:'Wed', color:'#3fb8ff', hz:741, label:'sky blue'},
 {name:'Thursday', short:'Thu', color:'#2fe89e', hz:639, label:'green'},
 {name:'Friday',   short:'Fri', color:'#ff5e6c', hz:396, label:'red'},
 {name:'Saturday', short:'Sat', color:'#7b5cff', hz:852, label:'indigo'}];
/* Category chips inside the tile — brief §4 (never the whole tile). */
const CAT={
 Notes:['#9b5cff','✧'], News:['#38a4ff','◎'], Meeting:['#19ca9b','◷'],
 Event:['#e05cbe','✦'], Project:['#49d6e8','◈'], Journal:['#f5f5ff','☰'],
 Community:['#e05cbe','♧'], Business:['#49d6e8','▣'], Open:['#19ca9b','◷']};
const WISDOM_STORE=[
 'Think before you act. The wise choice is the one that serves everyone it touches.',
 'One day at a time, done right, beats ten days rushed.',
 'Your notes are your memory. Write what matters, and the day stays alive.',
 'Invite one person who thinks like you. A world grows one connection at a time.',
 'The calendar shows what was. Go back, see it, learn from it, carry it forward.',
 'Small steps, every day, in the right direction — that is how a world is built.',
 'Ask Naya before you decide. A second mind sees what one mind misses.',
 'What you share wisely returns to you. Give the best of what you know.',
 'A booked hour kept is trust kept. Keep your word to the day.',
 'Order your day by what matters most, and the rest finds its place.',
 'The best of today becomes the wisdom of tomorrow.',
 'Slow down, look at the whole day, then choose the one thing that moves it.',
 'Your world is yours to shape. Build it one honest day at a time.',
 'Learn one true thing each day, and in a year you will know a thousand.'];
/* ============ STORES (harvested booking store; notes store in the same pattern) ============ */
const BOOK_KEY='mw.cal.bookings.v1';
const NOTE_KEY='mw.cal.notes.v1';
const BOOK_SLOTS=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
function loadBookings(){ try{ var a=JSON.parse(localStorage.getItem(BOOK_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveBookings(a){ try{ localStorage.setItem(BOOK_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function dayBookings(ds){ return loadBookings().filter(b=>b.date===ds).sort((x,y)=>String(x.time).localeCompare(String(y.time))); }
function bookTimeTaken(ds,t){ return dayBookings(ds).some(b=>b.time===t); }
function loadNotes(){ try{ var a=JSON.parse(localStorage.getItem(NOTE_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveNotes(a){ try{ localStorage.setItem(NOTE_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function dayNotes(ds, w){ return loadNotes().filter(n=>n.date===ds && (!w || n.world===w)); }
function fmtTime(t){ try{ var h=+t.slice(0,2), m=t.slice(3); var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }catch(e){ return t; } }
function dateKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function selKey(){ return dateKey(year,month,day); }
function isToday(y,m,d){ return y===NOW.getFullYear()&&m===NOW.getMonth()&&d===NOW.getDate(); }
function isFutureDs(ds){ return ds>dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()); }
function dlabel(y,m,d){ return new Date(y,m,d).toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const TF_ORDER={Morning:0,Afternoon:1,Evening:2};
/* ============ DAILY WISDOM — sourced, with carry-forward ============ */
function wisdomFor(ds){
  /* Highest-ranked Smart Note of yesterday becomes today's wisdom (definition
     T26). Otherwise the NayaNET wisdom store, one per day, deterministic. */
  const parts=ds.split('-').map(Number);
  const prev=new Date(parts[0],parts[1]-1,parts[2]-1);
  const prevKey=dateKey(prev.getFullYear(),prev.getMonth(),prev.getDate());
  const ranked=loadNotes().filter(n=>n.date===prevKey&&n.type==='smart'&&n.rank)
    .sort((a,b)=>(b.rank-a.rank)||String(a.createdAt).localeCompare(String(b.createdAt)));
  if(ranked.length) return {text:ranked[0].text, source:'Carried forward — the highest-ranked Smart Note of '+dlabel(prev.getFullYear(),prev.getMonth(),prev.getDate())};
  const idx=Math.floor(new Date(parts[0],parts[1]-1,parts[2]).getTime()/86400000);
  return {text:WISDOM_STORE[((idx%WISDOM_STORE.length)+WISDOM_STORE.length)%WISDOM_STORE.length], source:'NayaNET wisdom store — from what we have learned'};
}
/* ============ DAILY INTELLIGENCE REPORT — computed from the day's own record ============ */
function dirFor(ds){
  const notes=dayNotes(ds), books=dayBookings(ds);
  if(!notes.length && !books.length) return null;
  const smart=notes.filter(n=>n.type==='smart'), naya=notes.filter(n=>n.type==='naya'), posts=notes.filter(n=>n.type==='post');
  const top=notes.filter(n=>n.rank).sort((a,b)=>b.rank-a.rank)[0];
  return {notes:notes.length, smart:smart.length, naya:naya.length, posts:posts.length,
    books:books.length,
    learned: top ? top.text : 'Nothing was recorded as learned on this day yet.'};
}
/* Day highlights for the tile: up to 2 category chips + count of the rest. */
function dayHighlights(ds){
  const out=[];
  const books=dayBookings(ds);
  if(books.length) out.push('Meeting');
  const notes=dayNotes(ds);
  if(notes.some(n=>n.type==='smart')) out.push('Notes');
  if(notes.some(n=>n.type==='naya')) out.push('Journal');
  if(notes.some(n=>n.type==='post')) out.push(notes.some(n=>n.world==='Business')?'Business':'Community');
  return out;
}
function daySummary(ds){
  if(role==='visitor'){
    const open=BOOK_SLOTS.filter(t=>!bookTimeTaken(ds,t)).length;
    return open? open+' open times' : 'fully booked';
  }
  const h=dayHighlights(ds), n=dayNotes(ds).length, b=dayBookings(ds).length;
  const bits=[];
  if(b) bits.push(b+(b===1?' appointment':' appointments'));
  if(n) bits.push(n+(n===1?' note':' notes'));
  return bits.length?bits.join(', '):'no highlighted activity';
}
/* ============ MONTH ============ */
$('weeknames').innerHTML=WEEKDAY.map(w=>`<div style="color:${w.color}">${w.short}</div>`).join('');
function render(){
  const first=new Date(year,month,1).getDay();
  const n=new Date(year,month+1,0).getDate();
  const total=Math.ceil((first+n)/7)*7;
  $('monthname').textContent=new Date(year,month,1).toLocaleDateString('en-CA',{month:'long',year:'numeric'});
  $('worldname').textContent=world+' world · '+TZ;
  const todayKey=dateKey(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  $('days').innerHTML=Array.from({length:total},(_,i)=>{
    const d=i-first+1;
    if(d<1||d>n) return '<div class="tile blank" aria-hidden="true"></div>';
    const wd=WEEKDAY[new Date(year,month,d).getDay()];
    const ds=dateKey(year,month,d);
    /* Visitor sees availability only — never private notes, counts, or text. */
    const h = role==='visitor'
      ? (BOOK_SLOTS.some(t=>!bookTimeTaken(ds,t)) ? ['Open'] : [])
      : dayHighlights(ds);
    const today=isToday(year,month,d), sel=(screen!=='month'&&ds===selKey());
    const past=ds<todayKey;
    return `<button class="tile ${today?'today':''} ${sel?'sel':''} ${past?'past':''}" data-day="${d}" style="--dc:${wd.color}" aria-label="Open ${dlabel(year,month,d)}, ${esc(daySummary(ds))}">
      <div class="daynum">${d}</div><div class="dayname">${wd.short} · ${wd.hz} Hz</div>
      <div class="chiplane">${h.slice(0,2).map(x=>`<span class="chip" style="--chip:${CAT[x][0]}">${CAT[x][1]} ${esc(x)}</span>`).join('')||`<span class="minitext">${(role==='visitor'&&!BOOK_SLOTS.some(t=>!bookTimeTaken(ds,t)))?'Fully booked':'Open day'}</span>`}</div>
      ${h.length>2?`<div class="more">+${h.length-2} more</div>`:''}
      <div class="dots">${h.slice(0,3).map(x=>`<span class="dot" style="background:${CAT[x][0]}"></span>`).join('')}</div>
      ${h.length?'<span class="spark">✧</span>':''}</button>`;
  }).join('');
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openDay(+b.dataset.day));
  for(const w of ['Personal','Business','Space','Thing'])
    $(w==='Personal'?'pers':w==='Business'?'biz':w.toLowerCase()).classList.toggle('active',world===w);
  $('role').textContent=role==='owner'?'Owner view ▾':'Visitor view ▾';
  const w=wisdomFor(todayKey);
  $('ribbonText').textContent=w.text;
}

function button(text, fn, cls){ return `<button class="${cls||'pill'}" data-op="${esc(fn)}">${text}</button>`; }

const DOORS=[['Dashboard','▥','#a06bff','Daily stats'],['Personal','♙','#f5f5ff','My activity'],
 ['Business','▣','#49d6e8','Work and income'],['Space / Thing','◈','#c987ff','My communities'],
 ['Local','⌖','#38a4ff','My area'],['Provincial','▧','#38a4ff','My province'],
 ['Global','◎','#38a4ff','The world'],['Notes + Smart Notes','✧','#9b5cff','Notes + Smart Notes']];
function showPanel(){
  const publicView=role==='visitor';
  $('scrim').classList.add('show');
  const ds=selKey();
  const wd=WEEKDAY[new Date(year,month,day).getDay()];
  const future=isFutureDs(ds);
  let html='';
  if(screen==='day'){
    html=`<div class="panelhead"><div><div class="eyebrow">${publicView?'Public calendar':'Inside your day'} · ${esc(world)} · ${wd.name} ${wd.hz} Hz · ${esc(TZ)}</div>
    <h2 id="modalTitle">YOUR WORLD FOR THIS DAY — ${esc(dlabel(year,month,day))}</h2>
    <div class="sub">${publicView?'Public events, available times, and ways to connect':'Your whole world for this date, intelligently organized'}</div>
    <div class="sub">Weather: unavailable — no weather provider is wired yet. Nothing is shown in its place.</div></div>${button('×','close','pill close')}</div>
    <div class="actions">${button('‹ Previous day','prevday')}${button('Next day ›','nextday')}${button('← Back to month','close')}</div>`;
    if(publicView){
      html+=`<div class="doors">${[['Public Events','✦','#e05cbe','What is open to all'],['Available Times','◷','#19ca9b','Genuinely open slots'],['Send a Message','✉','#9b5cff','Through an authorized channel'],['About This World','◎','#38a4ff','About this world']].map(([x,i,c,s])=>`<button class="door" style="--c:${c}" data-view="${esc(x)}"><span class="ico">${i}</span>${esc(x)}<span class="sub2">${esc(s)}</span></button>`).join('')}</div>
      <div class="insight"><article><strong>Public information only</strong><span>Visitors never see private appointments, notes, mail, or daily statistics.</span></article>
      <article><strong>Booking</strong><span>Only genuinely open slots are displayed. Taken times show as unavailable — never with a name or subject.</span></article>
      <article><strong>Stay connected</strong><span>Message the owner through an authorized channel.</span></article></div>`;
    } else {
      const meetBooks=dayBookings(ds).filter(b=>b.meet);
      html+=`<div class="doors">${DOORS.map(([x,i,c,s])=>`<button class="door" style="--c:${c}" data-view="${esc(x)}"><span class="ico">${i}</span>${esc(x)}<span class="sub2">${esc(s)}</span></button>`).join('')}</div>
      <div class="actions">${button('◷ Book','Appointments')}${button('▣ Smart Meet','Smart Meet')}${button('+ Create','Create')}</div>
      ${meetBooks.length?'':'<p class="hint">Smart Meet joins a confirmed booking — book a time with Smart Meet first.</p>'}
      <div class="insight">
        <article><strong>Daily Wisdom</strong><span>${esc(wisdomFor(ds).text)}</span><br><span>${esc(wisdomFor(ds).source)}</span></article>
        <article><strong>Intel Today</strong><span>${esc(intelLine(ds))}</span></article>
        <article><strong>Daily Intelligence Report</strong><span>${esc(dirLine(ds))}</span></article>
      </div>`;
    }
  } else {
    html=viewHTML(ds, future, wd);
  }
  $('panelContent').innerHTML=html;
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ section=b.dataset.view; screen='view'; slot=''; pushRoute(); showPanel(); });
  document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{ const op=b.dataset.op;
    if(op==='close'){ closePanel(); return; }
    if(op==='back'){ screen='day'; pushRoute(); showPanel(); return; }
    if(op==='prevday'||op==='nextday'){ const d=new Date(year,month,day+(op==='prevday'?-1:1)); year=d.getFullYear(); month=d.getMonth(); day=d.getDate(); render(); pushRoute(); showPanel(); return; }
    if(op.startsWith('slot:')){ slot=op.slice(5); showPanel(); return; }
    if(op.startsWith('join:')){ openMeet(op.slice(5)); return; }
    if(op.startsWith('cancel:')){ cancelBooking(op.slice(7)); return; }
    if(op==='confirm'){ confirmBooking(); return; }
    if(op==='saveNote'){ saveNote(); return; }
    if(op==='sendMsg'){ sendMessage(); return; }
    if(op==='leaveMeet'){ leaveMeet(); return; }
    section=op; screen='view'; slot=''; pushRoute(); showPanel();
  });
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ createKind=b.dataset.kind; showPanel(); });
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('mwCalMeetMode').value=b.dataset.mode; });
  document.querySelectorAll('[data-mw-cal-slot]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-mw-cal-slot]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); const h=$('mwCalBookTime'); if(h) h.value=b.dataset.mwCalSlot; });
  const mb=$('mwCalBookMeet'); if(mb) mb.onchange=()=>{ const r=$('mwCalMeetModeRow'); if(r) r.hidden=!mb.checked; };
  const si=$('searchInput'); if(si){ si.focus(); si.oninput=()=>renderSearch(si.value); }
  const ni=$('noteText'); if(ni) ni.focus();
  const mh=$('modalTitle'); if(mh) mh.setAttribute('tabindex','-1'), mh.focus();
}
function intelLine(ds){
  const books=dayBookings(ds), notes=dayNotes(ds);
  const bits=[];
  if(books.length) bits.push(books.length+(books.length===1?' appointment':' appointments')+' booked');
  if(notes.length) bits.push(notes.length+(notes.length===1?' note':' notes')+' saved');
  if(!bits.length) bits.push('No records for this day yet');
  bits.push('News archive not wired — no headlines shown for this date');
  return bits.join(' · ')+'.';
}
function dirLine(ds){
  if(isFutureDs(ds)) return 'This day has not happened yet — no report until the day has a record.';
  const r=dirFor(ds);
  return r? (r.notes+' notes · '+r.books+' appointments · what was learned: '+r.learned) : 'No report — no records for this day.';
}
function closePanel(){
  screen='month'; $('scrim').classList.remove('show');
  if(history.state && history.state.view!=='month') history.pushState({view:'month',year,month,day,world,role},'','');
  render();
  const t=document.querySelector(`[data-day="${day}"]`); if(t) t.focus();
}

/* ============ BOOKING (harvested store + slots; single system, never a second one) ============ */
function appointmentsHTML(ds, future){
  const books=dayBookings(ds);
  let h=`<div class="viewcard"><h3>${role==='visitor'?'Available times':'Appointments'} — ${esc(dlabel(year,month,day))}</h3>`;
  if(books.length){
    h+='<ul class="list">'+books.map(b=>{
      if(role==='visitor') return `<li><b>${esc(fmtTime(b.time))}</b> — Unavailable (booked). No name or subject is shown to visitors.</li>`;
      return `<li><b>${esc(fmtTime(b.time))}</b> — ${esc(b.who||'Appointment')}${b.what?' — '+esc(b.what):''}${b.meet?` <span class="chip" style="--chip:#9b5cff">✧ ${b.mode==='audio'?'Audio meet':'Video meet'}</span> <button class="pill" data-op="join:${esc(b.id)}">Join the meet →</button>`:''} <button class="pill" data-op="cancel:${esc(b.id)}">Cancel</button></li>`;
    }).join('')+'</ul>';
  } else h+='<p>No appointments in this calendar\u2019s record for this day.</p>';
  if(future||!isFutureDs(ds)){
    if(!future){
      h+='<p class="hint">This day has passed — bookings live on today and the days ahead.</p>';
    } else {
      const firstFree=BOOK_SLOTS.find(t=>!bookTimeTaken(ds,t))||'';
      h+=`<h3 style="margin-top:18px">Book a time on this day</h3>
      <label class="flab">Pick a time</label><div class="slotbox">${BOOK_SLOTS.map(t=>{const taken=bookTimeTaken(ds,t);
        return `<button type="button" class="slot${taken?' taken':''}${(!taken&&t===firstFree)?' on':''}" data-mw-cal-slot="${t}"${taken?' disabled':''}>${esc(fmtTime(t))}</button>`;}).join('')}</div>
      <input type="hidden" id="mwCalBookTime" value="${esc(firstFree)}">
      ${firstFree?'':`<p class="hint">Every time on this day is booked.</p>`}
      <label class="flab" for="mwCalBookWho">${role==='visitor'?'Your name':'Who are you meeting?'}</label>
      <input class="field" type="text" id="mwCalBookWho" placeholder="${role==='visitor'?'Your name':'Their name'}" autocomplete="off">
      <label class="flab" for="mwCalBookWhat">What is it about?</label>
      <input class="field" type="text" id="mwCalBookWhat" placeholder="The subject of the appointment" autocomplete="off">
      <div style="margin-top:12px"><label><input type="checkbox" id="mwCalBookMeet"> Meet with them — Smart Meet, in this calendar</label></div>
      <div id="mwCalMeetModeRow" hidden style="margin-top:10px"><input type="hidden" id="mwCalMeetMode" value="video">
        <button type="button" class="pill" data-mode="audio">Audio meet</button>
        <button type="button" class="pill on" data-mode="video">Video meet</button></div>
      <div class="actions"><button class="pill" data-op="confirm">Book this time →</button></div>
      <p class="err" id="mwCalBookErr" role="alert"></p>
      <p class="hint">Requested is not confirmed: a booking is confirmed only when it is saved into this calendar's store (<b>mw.cal.bookings.v1</b>). Server sync is not wired yet — bookings live on this device.</p>`;
    }
  }
  return h+'</div>';
}
function confirmBooking(){
  const ds=selKey();
  const time=($('mwCalBookTime')||{}).value||'';
  const who=($('mwCalBookWho')||{}).value.trim();
  const what=($('mwCalBookWhat')||{}).value.trim();
  const err=$('mwCalBookErr');
  if(!time){ if(err) err.textContent='Pick a time first.'; return; }
  if(bookTimeTaken(ds,time)){ if(err) err.textContent='That time was just taken — pick another time.'; showPanel(); return; }
  if(!who){ if(err) err.textContent='Add a name so the appointment says who it is with.'; return; }
  const meet=!!($('mwCalBookMeet')||{}).checked;
  const mode=(($('mwCalMeetMode')||{}).value)||'video';
  const all=loadBookings();
  all.push({id:uid(),date:ds,time,who,what,meet,mode});
  if(!saveBookings(all)){ if(err) err.textContent='The booking could not be saved on this device. Nothing was confirmed.'; return; }
  slot=time;
  section='Appointments'; screen='view'; pushRoute(); showPanel();
  render();
  const card=document.querySelector('.viewcard');
  if(card){ const p=document.createElement('p'); p.className='status';
    p.textContent='Booked — '+fmtTime(time)+' on '+dlabel(year,month,day)+'. Saved in this device\u2019s calendar store (mw.cal.bookings.v1). Server sync is not wired yet.';
    card.prepend(p); }
}
function cancelBooking(id){
  const all=loadBookings().filter(b=>b.id!==id);
  saveBookings(all); render(); showPanel();
}
/* ============ MEET (downstream of Booking, separately gated) ============ */
let meetTimer=null, meetSecs=0, meetStream=null, micOn=true, camOn=true;
function meetViewHTML(ds){
  const books=dayBookings(ds).filter(b=>b.meet);
  let h=`<div class="viewcard"><h3>Smart Meet — ${esc(dlabel(year,month,day))}</h3>`;
  if(role==='visitor'){ h+='<p>Smart Meet is offered only to a confirmed booking\u2019s parties. Book a genuinely open time with Smart Meet to receive a meet.</p>'; }
  else if(!books.length){ h+='<p>No confirmed Smart Meet booking on this day. Meet joins a confirmed booking only — book a time with Smart Meet first. There is no dead Join button here.</p>'; }
  else h+='<ul class="list">'+books.map(b=>`<li><b>${esc(fmtTime(b.time))}</b> — ${esc(b.who||'')} ${b.what?'— '+esc(b.what):''} (${b.mode==='audio'?'Audio':'Video'}) <button class="pill" data-op="join:${esc(b.id)}">Join the meet →</button></li>`).join('')+'</ul>';
  h+='<p class="hint">Meet gates: video/audio authorization, runtime availability, waiting room, safe link, guest access, privacy. The live media leg is proven only in a browser that can grant camera and mic — this seat reports the outcome honestly instead of claiming it.</p></div>';
  return h;
}
function openMeet(id){
  const b=loadBookings().find(x=>x.id===id);
  if(!b){ return; }
  meetId=id; meetSecs=0; micOn=true; camOn=true;
  const ds=selKey();
  $('panelContent').innerHTML=viewHead('Smart Meet — '+fmtTime(b.time), ds)+
   `<div class="viewcard meetbox"><div class="face" aria-hidden="true">◉</div>
    <h3>${esc(b.who||'Meet')} · ${esc(dlabel(year,month,day))} · ${esc(fmtTime(b.time))} · ${b.mode==='audio'?'Audio':'Video'}</h3>
    <div class="timer" id="meetTimer">00:00</div>
    <p id="meetStatus">Joining the room…</p>
    <video id="meetVideo" autoplay playsinline muted style="width:100%;max-width:520px;border-radius:16px;background:#000;display:none"></video>
    <div class="actions" style="justify-content:center">
      <button class="pill" id="micBtn">🎙 Mic on</button>
      <button class="pill" id="camBtn">📷 Camera on</button>
      <button class="pill" data-op="leaveMeet">Leave</button>
    </div>
    <p class="hint">Waiting room: only the booked parties can enter. No recording unless everyone consents — recording is not implemented here.</p></div>`;
  document.querySelectorAll('[data-op]').forEach(x=>x.onclick=()=>{ const op=x.dataset.op;
    if(op==='leaveMeet'){ leaveMeet(); return; }
    if(op==='back'){ leaveMeet(true); screen='day'; pushRoute(); showPanel(); return; }
    if(op==='close'){ leaveMeet(true); closePanel(); return; }
    if(op==='prevday'||op==='nextday'){ leaveMeet(true); const d=new Date(year,month,day+(op==='prevday'?-1:1)); year=d.getFullYear(); month=d.getMonth(); day=d.getDate(); render(); pushRoute(); showPanel(); return; }
  });
  $('micBtn').onclick=()=>{ micOn=!micOn; if(meetStream) meetStream.getAudioTracks().forEach(t=>t.enabled=micOn); $('micBtn').textContent=micOn?'🎙 Mic on':'🎙 Mic off'; };
  $('camBtn').onclick=()=>{ camOn=!camOn; if(meetStream) meetStream.getVideoTracks().forEach(t=>t.enabled=camOn); $('camBtn').textContent=camOn?'📷 Camera on':'📷 Camera off'; };
  meetTimer=setInterval(()=>{ meetSecs++; const m=String(Math.floor(meetSecs/60)).padStart(2,'0'), s=String(meetSecs%60).padStart(2,'0'); const t=$('meetTimer'); if(t) t.textContent=m+':'+s; },1000);
  const status=$('meetStatus');
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true,video:b.mode!=='audio'}).then(st=>{
      meetStream=st;
      if(status) status.textContent='Camera and mic are live — you are in the room.';
      const v=$('meetVideo');
      if(v&&b.mode!=='audio'){ v.srcObject=st; v.style.display='block'; }
    }).catch(e=>{
      if(status) status.textContent='Camera/mic unavailable here ('+(e&&e.name?e.name:'unknown')+') — you are still in the room, audio/video off. Join from a device that can grant them, or meet in person.';
    });
  } else if(status) status.textContent='This browser cannot grant camera/mic here — you are still in the room. Join from a device that can, or meet in person.';
}
function leaveMeet(keepPanel){
  if(meetTimer){ clearInterval(meetTimer); meetTimer=null; }
  if(meetStream){ meetStream.getTracks().forEach(t=>t.stop()); meetStream=null; }
  meetId='';
  if(!keepPanel){ screen='view'; section='Smart Meet'; showPanel(); }
}
/* ============ CREATE ============ */
function createHTML(ds, future){
  const kinds=[['smart','Smart Note ✧'],['naya','Note'],['post','Post']];
  return `<div class="viewcard"><h3>Create — ${esc(dlabel(year,month,day))}</h3>
  <p>Create on this day, in ${esc(world)}. A note is tied to its day and time frame; the timeline orders it morning to night.</p>
  <div class="actions">${kinds.map(([k,l])=>`<button class="pill${createKind===k?' active':''}" data-kind="${k}">${l}</button>`).join('')}</div>
  <label class="flab" for="noteTF">Time frame</label>
  <select class="field" id="noteTF"><option>Morning</option><option>Afternoon</option><option>Evening</option></select>
  ${createKind==='smart'?`<label class="flab" for="noteRank">Rank (1–5 — the highest-ranked Smart Note of the day becomes tomorrow's wisdom)</label>
  <select class="field" id="noteRank"><option value="">No rank</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>`:''}
  <label class="flab" for="noteText">${createKind==='smart'?'Smart Note':createKind==='post'?'Post':'Note'}</label>
  <textarea class="field" id="noteText" placeholder="Write it in your own words…"></textarea>
  <div class="actions"><button class="pill" data-op="saveNote">Save to this day →</button></div>
  <p class="err" id="noteErr" role="alert"></p>
  <p class="hint">Saved into this device's notes store (mw.cal.notes.v1), with its date, world, source and permission. Nothing is copied into the calendar by hand.</p>
  <div class="actions"><button class="pill" data-op="Appointments">Or book a time instead →</button></div></div>`;
}
function saveNote(){
  const text=($('noteText')||{}).value.trim();
  const err=$('noteErr');
  if(!text){ if(err) err.textContent='Write the note first.'; return; }
  const tf=($('noteTF')||{}).value||'Morning';
  const rankEl=$('noteRank');
  const all=loadNotes();
  all.push({id:uid(),date:selKey(),world, type:createKind, rank:rankEl?parseInt(rankEl.value||'0',10)||null:null, timeframe:tf, text, createdAt:new Date().toISOString()});
  if(!saveNotes(all)){ if(err) err.textContent='The note could not be saved on this device.'; return; }
  render(); section='Notes + Smart Notes'; screen='view'; pushRoute(); showPanel();
}
/* ============ SEARCH ============ */
function renderSearch(q){
  const box=$('searchResults'); if(!box) return;
  q=(q||'').trim().toLowerCase();
  if(!q){ box.innerHTML='<p class="hint">Type to search your notes and bookings.</p>'; return; }
  const hits=[];
  loadNotes().forEach(n=>{ if(n.text.toLowerCase().includes(q)||n.date.includes(q)||n.world.toLowerCase().includes(q)) hits.push({kind:n.type==='smart'?'Smart Note':n.type==='post'?'Post':'Note', date:n.date, text:n.text}); });
  loadBookings().forEach(b=>{ if((b.who||'').toLowerCase().includes(q)||(b.what||'').toLowerCase().includes(q)||b.date.includes(q)) hits.push({kind:'Appointment', date:b.date, text:fmtTime(b.time)+' — '+(b.who||'')+(b.what?' — '+b.what:'')}); });
  if(!hits.length){ box.innerHTML='<p>No matches in this device\u2019s local record. Nothing is searched beyond your own record.</p>'; return; }
  box.innerHTML='<ul class="list">'+hits.slice(0,20).map((h,i)=>`<li><b>${esc(h.date)}</b> · ${esc(h.kind)} — ${esc(h.text)} <button class="pill" data-jump="${esc(h.date)}">Open day →</button></li>`).join('')+'</ul>';
  box.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ const p=b.dataset.jump.split('-').map(Number); year=p[0]; month=p[1]-1; day=p[2]; render(); openDay(day); });
}
function sendMessage(){
  const st=$('msgStatus');
  if(st) st.textContent='Not sent — messaging needs a verified private delivery path, which is not wired in this build. Nothing was sent.';
}
/* ============ ROUTING — Month → Day → Destination → Day → Month ============ */
function pushRoute(){
  const st={view:screen, year, month, day, world, role, section};
  try{ history.pushState(st,'',''); }catch(e){}
}
function applyState(st){
  if(!st) return;
  screen=st.view||'month'; year=st.year!=null?st.year:year; month=st.month!=null?st.month:month;
  day=st.day!=null?st.day:day; world=st.world||world; role=st.role||role; section=st.section||'Dashboard';
  render();
  if(screen==='month'){ $('scrim').classList.remove('show'); }
  else showPanel();
}
window.addEventListener('popstate',e=>{ leaveMeet(true); applyState(e.state); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&screen!=='month'){
    if(meetId){ leaveMeet(); return; }
    if(screen==='view'){ screen='day'; pushRoute(); showPanel(); }
    else closePanel();
  }
});
$('scrim').addEventListener('click',e=>{ if(e.target===$('scrim')) closePanel(); });
$('prev').onclick=()=>{ const d=new Date(year,month-1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('next').onclick=()=>{ const d=new Date(year,month+1,1); year=d.getFullYear(); month=d.getMonth(); render(); };
$('today').onclick=()=>{ year=NOW.getFullYear(); month=NOW.getMonth(); day=NOW.getDate(); render(); };
$('role').onclick=()=>{ role=role==='owner'?'visitor':'owner'; render(); if(screen!=='month'){ screen='day'; showPanel(); } };
for(const w of ['Personal','Business','Space','Thing'])
  $(w==='Personal'?'pers':w==='Business'?'biz':w.toLowerCase()).onclick=()=>{ world=w; render(); if(screen!=='month'){ screen='day'; showPanel(); } };
$('searchBtn').onclick=()=>{ lastFocus=document.activeElement; section='Search'; screen='view'; pushRoute(); showPanel(); };
$('addBtn').onclick=()=>{ createKind='smart'; section='Create'; screen='view'; pushRoute(); showPanel(); };
$('nayaBtn').onclick=()=>{ section='Naya'; screen='view'; pushRoute(); showPanel(); };
$('ribbon').onclick=()=>{ day=NOW.getDate(); year=NOW.getFullYear(); month=NOW.getMonth(); openDay(day); };
render();
try{ history.replaceState({view:'month',year,month,day,world,role},'',''); }catch(e){}
</script></body></html>
