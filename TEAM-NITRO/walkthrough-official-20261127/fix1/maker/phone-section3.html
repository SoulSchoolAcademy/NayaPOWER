     stacked scrolling one after another on phone. Groupings in order:

         video DIRECT FILE (9:16, 576x1024) filling the phone's own screen,
         fitted perfect, ball plays/pauses. YouTube is a fallback link only.
         ONE spot only, mid-flow; NO video at the end.
       3 motto · mission · goal
       4 vision · love · don't love
       5 your thing · education/work/experience · achievements/values/where-you-stand
       6 your promise · your gift · unique
       7 what's in it for you · connect · categories LAST

     anywhere. Back/forward arrows below the trio move between groups.

     full-bleed 9:16 layer BEHIND the input — it never takes layout space
     from the input. The input phase shows the input card whole at rest,
     covering the stage. The ball IS Enter: tap the N to peek the picture,
     tap the ball to reveal it full-screen in place.
     Values sits ONCE, in achievements/values/where-you-stand. It was also
     named in a "values/promise/gift" trio — that placement is still open
     for Shawn's word (see MAKER-REPORT.md).
     IDs kept so the harvested walk script keeps working: fpWalk, fpWalkQ,
     fpWalkProgress, fpWalkAnswer, fpWalkBack, fpWalkEnter (the ball, in the
     end phone), fpWalkSkip (kept in the DOM, hidden — NO SKIP on the page),
     fpWalkEnd, fpWalkLinkRow, fpWalkLink, fpWalkCopy, fpWalkReadyLine,
     fpWalkFailLine, fpWalkWorld, fpWalkPricing, fpWalkRetry, fpWalkHub,
     fpWalkDash, fpWalkBiz, fpWalkSpace, fpWalkCopyAll, fpWalkNext.
     New: bdTrio (the three phones), bdGroupProg, bdGroupBack/bdGroupNext
     (the same fpWalkBack/fpWalkNext arrows), bdEndPhone (the payoff phone).
     Phones are built by window.bdPhone.buildPhone(step, n) in
     phone-script3.html — one template, cloned, never rebuilt. -->
