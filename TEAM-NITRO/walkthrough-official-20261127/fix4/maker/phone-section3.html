<!-- BLACK DIAMOND PHONE v4 2026-11-27 — ONE PHONE PER SCREEN, THE SETTINGS
     PHONE CLONED VERBATIM (Shawn's voice calls 2026-11-27 ~21:11-21:18 MST:
     "take the whole concept from the Settings page and just use it").
     No trio, no grouping header, no ENTER ENTER ENTER. One phone, one
     screen: put in, tap the ball, next. The phone is Settings fix13 whole:
     stage frame (393x852, chrome, island, home bar) + inner screen +
     graphite foot with the real N ball + ENTER + back/forward arrows.
     The ball IS Enter: tap 1 flashes the related image where the step has
     one; tap 2 moves to the next input. Steps with no picture advance on
     the first tap. Video: the ball plays/pauses; arrows advance.
     IDs kept so the portal's kept walk code keeps working: fpWalk,
     fpWalkQ, fpWalkProgress, fpWalkAnswer, fpWalkBack, fpWalkEnter (the
     ball, in the end phone), fpWalkSkip (kept in the DOM, hidden — NO SKIP
     on the page), fpWalkEnd, fpWalkLinkRow, fpWalkLink, fpWalkCopy,
     fpWalkReadyLine, fpWalkFailLine, fpWalkWorld, fpWalkPricing, fpWalkRetry,
     fpWalkHub, fpWalkDash, fpWalkBiz, fpWalkSpace, fpWalkCopyAll, fpWalkNext.
     New: bdSingle (the one phone, built per step by window.bdPhone
     .buildPhone(step, n, total) in phone-script3.html), bdEndPhone (the
     payoff phone, same frame). Phones are built by one template, cloned,
     never rebuilt. -->
<section id="fpWalk" hidden>
  <div id="bdSingle"></div>
  <div class="bd-endphone" id="bdEndPhone" hidden>
    <div class="bd-phone">
      <div class="bd-inner">
        <div class="bd-statusbar">
          <span class="bd-clock">9:41</span>
          <span class="bd-status-right">
            <span class="bd-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="bd-5g">5G</span>
            <svg class="bd-wifi" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#fff" d="M12 18.5c.8 0 1.5.7 1.5 1.5s-.7 1.5-1.5 1.5-1.5-.7-1.5-1.5.7-1.5 1.5-1.5zm0-4.2c1.9 0 3.6.8 4.9 2l-1.5 1.6c-.9-.9-2.1-1.4-3.4-1.4s-2.5.5-3.4 1.4L7.1 16.3c1.3-1.2 3-2 4.9-2zm0-4.3c3 0 5.8 1.2 7.8 3.2l-1.5 1.6c-1.6-1.6-3.8-2.6-6.3-2.6s-4.7 1-6.3 2.6L4.2 13.2C6.2 11.2 9 10 12 10z"/></svg>
            <span class="bd-batt" aria-hidden="true"><i class="bd-batt-fill"></i></span><span class="bd-batt-num">87</span>
          </span>
        </div>
        <!-- FIX1 D5 — slide header on the end screen too: emblem left, Naya right. -->
        <div class="bd-walkhead"><img class="bd-walkhead-logo" src="/naya-emblem-cut.png" alt="NayaNET emblem"><img class="bd-walkhead-naya" src="/agmt-b06.png" alt="Naya"></div>
        <div class="bd-stage bd-stage-end">
          <div id="fpWalkEnd" hidden>
            <h2 class="fp-walk-endtitle" id="fpWalkQ">Welcome home.</h2>
            <!-- FIX3 — real faceted diamond jewel dividing title from lines. -->
            <div class="fp-walk-endjewel" aria-hidden="true"><svg viewBox="0 0 24 24"><polygon points="5,3 12,3 12,9 3,9" fill="#d8b4fe"/><polygon points="12,3 19,3 21,9 12,9" fill="#a855f7"/><polygon points="3,9 12,9 12,21" fill="#7e22ce"/><polygon points="12,9 21,9 12,21" fill="#4c1d95"/><polygon points="5,3 19,3 21,9 3,9" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".6"/></svg></div>
            <p class="fp-walk-endline" id="fpWalkProgress">Welcome complete</p>
            <p class="fp-walk-endline">Your own personal branded Smart Link</p>
            <p class="fp-walk-linkrow" id="fpWalkLinkRow"><span class="fp-walk-link" id="fpWalkLink"></span> <button class="fp-walk-copy" id="fpWalkCopy" type="button">Copy</button></p>
            <p class="fp-walk-endline" id="fpWalkReadyLine">Your answers are saved on this device. Your world is ready &mdash; go see it, then choose your plan.</p>
            <p class="fp-walk-endline" id="fpWalkFailLine" hidden></p>
            <p class="fp-walk-endline"><button class="fp-walk-copy" id="fpWalkCopyAll" type="button">Copy my answers</button></p>
            <div class="fp-walk-endgrid">
              <button class="fp-walk-enter fp-walk-endgrid-wide" id="fpWalkWorld" type="button">See my world &rarr;</button>
              <!-- FIX3 — grid order follows the named end sequence:
                   answers (Copy my answers, above) -> Hub -> pricing. -->
              <button class="fp-walk-enter" id="fpWalkHub" type="button">Smart hub &rarr;</button>
              <button class="fp-walk-navbtn" id="fpWalkPricing" type="button">Choose plan &rarr;</button>
              <button class="fp-walk-enter" id="fpWalkRetry" type="button" hidden>Try again &rarr;</button>
              <button class="fp-walk-navbtn" id="fpWalkDash" type="button">Dashboard &rarr;</button>
              <button class="fp-walk-navbtn" id="fpWalkBiz" type="button">Business &rarr;</button>
              <button class="fp-walk-navbtn" id="fpWalkSpace" type="button">Space &rarr;</button>
            </div>
            <textarea class="fp-walk-answer bd-answer" id="fpWalkAnswer" rows="2" hidden></textarea>
          </div>
        </div>
        <div class="bd-foot">
          <div class="bd-chin-label">BLACK DIAMOND SERIES</div>
          <button class="fp-walk-enter bd-ball" id="fpWalkEnter" type="button" aria-label="Enter">
            <span class="bd-orbit" aria-hidden="true"><span class="bd-orbit-jewel"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="5,3 12,3 12,9 3,9" fill="#d8b4fe"/><polygon points="12,3 19,3 21,9 12,9" fill="#a855f7"/><polygon points="3,9 12,9 12,21" fill="#7e22ce"/><polygon points="12,9 21,9 12,21" fill="#4c1d95"/><polygon points="5,3 19,3 21,9 3,9" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".6"/></svg></span></span>
            <span class="bd-ball-jewel"><span class="bd-ball-spin" aria-hidden="true"></span><span class="bd-ball-n">N</span></span>
          </button>
          <div class="bd-enter-label">ENTER</div>
        </div>
      </div>
    </div>
  </div>
  <button class="fp-walk-skip" id="fpWalkSkip" type="button" hidden>Skip this question &rarr;</button>
</section>
