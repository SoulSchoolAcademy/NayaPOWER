/* ——— Hub .primo pill ——— */
/* ——— NAYA-BTN-005 "Primo Purple" — harvested verbatim from factory.css (STANDARD .primo) ——— */
.primo { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 800; font-size: 17px; letter-spacing: .08em; color: #F8F7FB; padding: 16px 32px; border-radius: 999px; border: 1.5px solid rgba(248,247,251,.9);
  background: #050607; /* BLACK DIAMOND: flat board black */
  box-shadow: inset 0 -8px 16px rgba(0,0,0,.8), 0 0 24px rgba(248,247,251,.45), 0 0 48px rgba(248,247,251,.15), 0 12px 32px rgba(0,0,0,.65), 0 18px 44px rgba(0,0,0,.65);
  transition: transform .22s var(--ease), box-shadow .22s var(--ease); --glow: var(--soul, #8e24aa); position: relative; overflow: hidden; }
.primo:hover { transform: translateY(-2px); border-color: var(--glow); box-shadow: inset 0 0 0 1.5px var(--glow), inset 0 -6px 14px rgba(0,0,0,.65), 0 0 14px -2px var(--glow), 0 14px 36px rgba(0,0,0,.65); /* EYE-NOTES §3.2 edge-only */ }
.primo.theme-purple { --glow: var(--purple); }
.primo:disabled { opacity: .6; cursor: default; transform: none; }
/* ——— Authored glue: one viewport, one frame, clean separation. ——— */
html,body{height:100%;margin:0;background:#050607;overflow:hidden;}
body{color:#fff;-webkit-text-size-adjust:100%;}
.page{height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;padding:12px 12px calc(var(--today-bar-h,88px) + 12px);}
.promax.today-frame{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:0;align-items:stretch;}
.today-frame-body{flex:1;min-height:0;display:flex;flex-direction:column;}
.today-frame .ib-layer{flex:1;min-height:0;}
.today-frame .ib-layer-body{overflow-y:auto;min-height:0;scrollbar-width:thin;}
.today-state{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px;font-size:19px;line-height:1.6;color:#fff;}
.today-state .retry{font-size:17px;font-weight:800;color:#fff;background:#050607;border:1.5px solid #8e24aa;border-radius:999px;padding:14px 28px;cursor:pointer;}
.today-frame .ib-meta{margin:8px 0 0;font-size:17px;line-height:1.5;letter-spacing:.08em;color:#fff;text-transform:uppercase;}
.today-frame .ib-meta b{font-weight:900;}
@media (max-width:640px){
  .today-frame .ib-face{width:96px;height:96px;}
  .today-frame .ib-n,.today-frame .ib-n img{width:64px;height:64px;}
}
.today-frame .ib-n{cursor:pointer;background:none;border:none;padding:0;-webkit-tap-highlight-color:transparent;}
.today-frame .ib-n:active{transform:scale(.93);}
.today-frame .ib-n:active img{filter:brightness(1.12) saturate(1.2);box-shadow:0 0 0 2px rgba(255,255,255,.35),0 6px 12px rgba(0,0,0,.6),0 0 26px rgba(255,45,70,.55);}
/* ——— Foot: SAVE/SHARE row, then the arrows row. Two stacked rows, static,
       nothing overlapping, nothing clipped. ——— */
.today-foot{flex:none;display:flex;flex-direction:column;gap:8px;padding-top:10px;}
.today-actions{flex:none;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.today-actions .action.primo{font-size:17px !important;padding:14px 28px;min-height:52px;}
.today-frame .floatnav{position:static;flex:none;margin:0;padding:2px 0 0;transform:none;z-index:auto;}
.today-frame .naya-btn{font-size:17px;}
.fc-plusitem{font-size:17px;}
.today-step-inline{font-size:17px;color:#fff;letter-spacing:.04em;min-width:160px;text-align:center;}
.today-step-inline b{font-weight:900;}
@media (max-width:640px){
  .today-step-inline{min-width:0;}
  .today-step-inline .today-total{display:none;}
}
/* The board is a column: the telling scrolls, the red N sits at the foot. */
.today-frame .ib-layer{flex-direction:column;}
.today-frame .ib-foot{flex:none;display:flex;justify-content:center;padding:4px 0 12px;}
/* ——— Full note overlay: the same frame, the whole note, scrollable inside. ——— */
.note-overlay{position:fixed;inset:0;z-index:80;background:rgba(3,3,6,.94);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;}
.note-overlay[hidden]{display:none;}
.note-overlay .promax{max-width:720px;width:100%;max-height:calc(100dvh - 32px);}
.ov-body{flex:1;min-height:0;overflow-y:auto;padding:24px 24px 56px;box-sizing:border-box;text-align:center;}
.ov-body h3{margin:0 0 8px;font-size:25px;line-height:1.25;color:#fff;}
.ov-body .ov-meta{margin:0 0 16px;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#fff;}
.ov-body h4{margin:24px 0 8px;font-size:19px;color:#fff;}
.ov-body p{margin:0 0 12px;font-size:17px;line-height:1.7;color:#fff;}
.ov-close{flex:none;margin:12px auto 16px;display:block;font-size:17px;font-weight:800;color:#fff;background:#050607;border:1.5px solid #8e24aa;border-radius:999px;padding:14px 28px;cursor:pointer;}
</style>

var SELECT='ib_id,id,title,nutshell,human_note,child_note,grandma_note,naya_note,machine_note,what_it_means,whats_in_it_for_you,source,github_path,created_at';
var MAP={nutshell:'nutshell',human:'human_note',child:'child_note',grandma:'grandma_note',naya:'naya_note',machine:'machine_note',means:'what_it_means',value:'whats_in_it_for_you'};
/* TIMEZONE CALL (named, not silent): the day is Shawn's day — America/Vancouver.
   A note filed 00:00-08:00 UTC is still the previous evening in Vancouver, so
   UTC bucketing would call yesterday-evening's notes "today". The two day
   groups below are Vancouver calendar days, newest first within each. */
var vFmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Vancouver',year:'numeric',month:'2-digit',day:'2-digit'});
function vDay(iso){return vFmt.format(new Date(iso));}
function deriveCat(r){var gp=String(r.github_path||'');var m=gp.match(/SMART-NOTES\/\d{4}\/\d{2}\/\d{2}\/([A-Z]+)\//);if(m&&m[1])return m[1].charAt(0)+m[1].slice(1).toLowerCase();return r.category||'Intelligence';}
/* FIX (2026-11-23, checker verdict 2 O1) — the live rows carry raw markdown
   (double-asterisk bold markers such as THE PIECES, GROUNDED) that rendered
   literally on screen. Strip the markers at shape time so no literal
   asterisk ever reaches the frame or the overlay. Double-asterisk pairs and
   stray asterisks/underscores are all removed; the words stay verbatim. */
function cleanMd(s){return String(s).replace(/\*\*/g,'').replace(/__/g,'').replace(/\*/g,'');}
function shape(r){var o={id:r.ib_id||r.id,title:cleanMd(r.title||''),created_at:r.created_at||'',github_path:r.github_path||''};Object.keys(MAP).forEach(function(k){var v=r[MAP[k]];if(typeof v==='string'&&v.trim())o[k]=cleanMd(v.trim());});o.category=deriveCat(r);o.day=vDay(r.created_at);return o;}
/* FIX (2026-11-23, fix round 3 — captain's-eye catch on the PASS) — every
   frame's highlight ended mid-sentence at the same vertical point, just
   above the red N. The cause is in the layout, not the data: the full
   nutshell is rendered (shape() keeps it whole — frame 1 is 705 chars,
   frame 15 is 1,387, frame 88 is 887), but the telling sits in
   .ib-layer-body, a fixed-height flex child with overflow-y:auto inside a
   100dvh board whose foot is the fixed red N — so a long nutshell runs
   past the visible bottom and the rest sits below, scrollable with no
   affordance, reading as cut off mid-thought. The full note stays one tap
   away (red N overlay, SHARE text — both untouched, whole). The frame
   highlight now ends on a complete thought: whole sentences are dropped
   from the end until the telling fits without scrolling, measured live at
   this viewport — phone shows fewer sentences, desktop more, a short
   nutshell shows whole. No text is shrunk, no word is cut, no sentence is
   ever split. Trade-off, named: on small screens the frame shows the
   opening sentences of a long nutshell, not all of them — the whole note
   is one tap on the red N away. */
function splitSentences(s){
  var t=String(s).replace(/\s+/g,' ').trim();
  if(!t)return [];
  var tmp=t.replace(/(\d)\.(\d)/g,'$1\x00$2');
  tmp=tmp.replace(/\b(U\.S|U\.K|e\.g|i\.e|Mr|Mrs|Ms|Dr|vs|etc|[A-Z])\./g,function(m){return m.replace(/\./g,'\x00');});
  tmp=tmp.replace(/([.!?]+["'\)\]]*)(\s+|$)/g,'$1\x01$2');
  return tmp.split('\x01').map(function(x){return x.replace(/\x00/g,'.').trim();}).filter(Boolean);
}
var curInner=null,curPar=null;
/* Second resort (same round): a single opening sentence can itself be
   taller than the telling — 7 of the 88 notes (longest first sentences
   200–410 chars). Dropping sentences cannot help there, so the fit falls
   back to whole CLAUSES inside that one sentence: cut points after a
   semicolon or an em-dash, outside parentheses, longest fitting prefix
   wins, never shorter than 80 chars, never ending on a colon, never
   leaving a quote or paren open — and, only if none of those fits, after
   a colon (the colon itself is not shown, the same as the semicolon and
   the dash at any other cut: the separator is dropped, the words stay
   verbatim). A clause is a complete phrase in the note's own words — no
   punctuation added, no word changed. If no clause fits either, the whole
   sentence stays (scrollable) and the frame is named as owed, not
   silently trimmed. */
function clauseCut(s){
  var cuts=[];var colonCuts=[];var depth=0;var i;var ch;
  for(i=0;i<s.length;i++){
    ch=s[i];
    if(ch==='(')depth++;
    else if(ch===')')depth=Math.max(0,depth-1);
    else if(depth===0){
      if(ch===';'&&s[i+1]===' ')cuts.push(i);
      else if(ch==='\u2014'&&s[i-1]===' '&&s[i+1]===' ')cuts.push(i-1);
      else if(ch===':'&&s[i+1]===' ')colonCuts.push(i);
    }
  }
  cuts.sort(function(a,b){return b-a;});
  colonCuts.sort(function(a,b){return b-a;});
  var lists=[cuts,colonCuts];
  for(var l=0;l<lists.length;l++){
    var list=lists[l];
    for(var k=0;k<list.length;k++){
      var pre=s.slice(0,list[k]).trim();
      if(pre.length<80)continue;
      if(/[:(\u2014]$/.test(pre))continue;
      var quotes=(pre.match(/"/g)||[]).length;
      if(quotes%2!==0)continue;
      curPar.textContent=pre;
      if(curInner.scrollHeight<=curInner.clientHeight+1)return pre;
    }
  }
  return null;
}
function fitHighlight(){
  if(!curInner||!curPar)return;
  var full=curPar.dataset.full||curPar.textContent;
  curPar.dataset.full=full;
  var parts=splitSentences(full);
  if(!parts.length){curPar.textContent=full;return;}
  var n=parts.length;
  curPar.textContent=parts.join(' ');
  while(n>1&&curInner.scrollHeight>curInner.clientHeight+1){
    n--;
    curPar.textContent=parts.slice(0,n).join(' ');
  }
  if(n===1&&curInner.scrollHeight>curInner.clientHeight+1){
    var cut=clauseCut(parts[0]);
    if(cut)curPar.textContent=cut;
    else curPar.textContent=parts[0];
  }
}
var notes=[];var ix=0;var todayStr='';var ydayStr='';
var SMARTLIST_KEY='nayanet.today.smartlist.v1';
var smartList=[];try{var raw=localStorage.getItem(SMARTLIST_KEY);if(raw)smartList=JSON.parse(raw).filter(function(x){return typeof x==='string';});}catch(err){smartList=[];}
function persistSmartList(){try{localStorage.setItem(SMARTLIST_KEY,JSON.stringify(smartList));}catch(err){}}
var bodyEl=document.getElementById('frameBody');
var footEl=document.getElementById('frameFoot');
var actionsEl=document.getElementById('frameActions');
var navEl=document.getElementById('frameNav');
var overlay=document.getElementById('noteOverlay');
var ovBody=document.getElementById('ovBody');
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function load(){
  var now=new Date();todayStr=vDay(now.toISOString());ydayStr=vDay(new Date(now.getTime()-86400000).toISOString());
  fetch(SB+'/hub_smart_notes?select='+SELECT+'&order=created_at.desc&limit=200',{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store'})
  .then(function(res){if(!res.ok)throw new Error('live read HTTP '+res.status);return res.json();})
  .then(function(rows){
    if(!Array.isArray(rows)||!rows.length)throw new Error('live read: no rows');
    notes=rows.filter(function(r){return String(r.ib_id||'').indexOf('daily-intelligence-report')<0;}).map(shape).filter(function(n){return n.day===todayStr||n.day===ydayStr;});
    if(!notes.length)throw new Error('live read: no notes for today or yesterday');
    ix=0;render();
  })
  .catch(function(){
    footEl.hidden=true;
    bodyEl.innerHTML='';
    var s=el('div','today-state','');
    var p=el('p','','The notes could not be read right now.');
    var b=el('button','retry','TRY AGAIN');b.type='button';
    b.addEventListener('click',function(){bodyEl.innerHTML='';bodyEl.appendChild(el('div','today-state','Reading today\u2019s notes\u2026'));load();});
    s.appendChild(p);s.appendChild(b);bodyEl.appendChild(s);
  });
}
function dayLabel(n){return n.day===todayStr?'Today':'Yesterday';}
function groupCount(n){return notes.filter(function(x){return x.day===n.day;}).length;}
function groupAt(n){return notes.filter(function(x){return x.day===n.day;}).findIndex(function(x){return x.id===n.id;})+1;}
function render(){
  var n=notes[ix];if(!n)return;
  bodyEl.innerHTML='';
  curInner=null;curPar=null;
  var board=el('div','ib-layer');
  board.style.setProperty('--lc','#8e24aa');
  var inner=el('div','ib-layer-body');
  var face=el('img','ib-face');face.src=FACE;face.alt='Naya';
  face.addEventListener('error',function(){face.style.display='none';});
  inner.appendChild(face);
  var h=el('h3','b-script',n.title||'');
  inner.appendChild(h);
  var meta=el('p','ib-meta','');
  var mb=el('b','',dayLabel(n));var mt=document.createElement('span');mt.textContent=' \u00B7 '+n.category;
  meta.appendChild(mb);meta.appendChild(mt);inner.appendChild(meta);
  var hl=n.nutshell||n.human||'';
  if(hl){var par=el('p','',hl);inner.appendChild(par);curInner=inner;curPar=par;}
  board.appendChild(inner);
  /* The red N sits at the FOOT of the board, outside the scrolling telling —
     so it is on first paint at phone width too, never scrolled out of reach. */
  var foot=el('div','ib-foot');
  var nb=el('button','ib-n');nb.type='button';nb.setAttribute('aria-label','Go in \u2014 the full smart note: '+(n.title||''));
  var img=el('img','');img.src=BALL;img.alt='The red N';nb.appendChild(img);
  nb.addEventListener('click',function(e){e.stopPropagation();openNote(n);});
  foot.appendChild(nb);
  board.appendChild(foot);
  board.addEventListener('click',function(){step(ix+1);});
  bodyEl.appendChild(board);
  /* SAVE / SHARE: the Hub primo pills, rebuilt for this note. */
  actionsEl.innerHTML='';
  var isOn=smartList.indexOf(n.id)>=0;
  var save=el('button','action primo'+(isOn?' carry-on':''),isOn?'\u2605 SAVED':'SAVE');save.type='button';
  save.setAttribute('aria-pressed',isOn?'true':'false');
  save.setAttribute('aria-label',(isOn?'Remove from your Smart List: ':'Save to your Smart List: ')+(n.title||''));
  save.style.setProperty('--action-color',isOn?'#7dffb0':'#55e39a');
  save.style.setProperty('--glow',isOn?'#7dffb0':'#55e39a');
  save.addEventListener('click',function(e){e.stopPropagation();
    var at=smartList.indexOf(n.id);
    if(at>=0)smartList.splice(at,1);else smartList.push(n.id);
    persistSmartList();render();
  });
  var share=el('button','action primo','SHARE');share.type='button';
  share.style.setProperty('--action-color','#55b9ee');share.style.setProperty('--glow','#55b9ee');
  share.setAttribute('aria-label','Share: '+(n.title||''));
  share.addEventListener('click',function(e){e.stopPropagation();
    var text=(n.title||'')+(n.nutshell?'\n\n'+n.nutshell:'');
    if(navigator.share){navigator.share({title:n.title||'Intel Today',text:text,url:location.href}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){share.textContent='COPIED';setTimeout(function(){share.textContent='SHARE';},1500);}).catch(function(){});}
  });
  actionsEl.appendChild(save);actionsEl.appendChild(share);
  /* Arrows: back, position, forward — one row, clear of the pills above. */
  navEl.innerHTML='';
  var back=el('button','naya-btn');back.type='button';back.id='todayBack';back.setAttribute('aria-label','Back');
  back.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  back.disabled=ix<=0;
  back.addEventListener('click',function(){step(ix-1);});
  var mid=el('span','today-step-inline','');
  var midB=el('b','','');midB.textContent=dayLabel(n)+' \u00B7 '+groupAt(n)+' of '+groupCount(n);
  var midT=el('span','today-total','');midT.textContent=' \u00B7 '+(ix+1)+' of '+notes.length;
  mid.appendChild(midB);mid.appendChild(midT);
  var fwd=el('button','naya-btn');fwd.type='button';fwd.id='todayForward';fwd.setAttribute('aria-label','Forward');
  fwd.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  fwd.disabled=ix>=notes.length-1;
  fwd.addEventListener('click',function(){step(ix+1);});
  navEl.appendChild(back);navEl.appendChild(mid);navEl.appendChild(fwd);
  footEl.hidden=false;
  fitHighlight();
}
function step(next){var c=Math.max(0,Math.min(notes.length-1,next));if(c===ix)return;ix=c;render();}
function openNote(n){
  ovBody.innerHTML='';
  ovBody.appendChild(el('h3','',n.title||''));
  var meta=el('p','ov-meta','');meta.textContent=dayLabel(n)+' \u00B7 '+n.category;ovBody.appendChild(meta);
  [['In a nutshell',n.nutshell],['For a child',n.child],['For a grandma',n.grandma],['What it means',n.means],['What\u2019s in it for you',n.value]].forEach(function(pair){
    if(!pair[1])return;
    ovBody.appendChild(el('h4','',pair[0]));
    ovBody.appendChild(el('p','',pair[1]));
  });
  overlay.hidden=false;
}
function closeNote(){overlay.hidden=true;}
document.getElementById('ovClose').addEventListener('click',closeNote);
overlay.addEventListener('click',function(e){if(e.target===overlay)closeNote();});
document.addEventListener('keydown',function(e){
  if(!overlay.hidden){if(e.key==='Escape')closeNote();return;}
  if(e.key==='ArrowLeft'){step(ix-1);}
  else if(e.key==='ArrowRight'){step(ix+1);}
  else if(e.key==='Escape'){closeNote();}
});
window.addEventListener('resize',function(){fitHighlight();});
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){fitHighlight();});}
/* The ready promise above can resolve before the frame font is even
   requested (no Cormorant text exists until the first render), so the
   refit that matters is the one AFTER the font actually arrives: the
   loadingdone event and window load both re-run the fit, which starts
   from the full text each time and re-expands when there is room. */
if(document.fonts&&document.fonts.addEventListener){document.fonts.addEventListener('loadingdone',function(){fitHighlight();});}
window.addEventListener('load',function(){fitHighlight();});
load();
})();
</script>
