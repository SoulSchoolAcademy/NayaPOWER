<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naya Power Player — Pro Max Test (Powercast 01)</title>
  <style>
    body { background: #010103; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; background: #0b0e17; border: 2px solid #a855f7; border-radius: 28px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: center; }
    .art-wrap { width: 100%; aspect-ratio: 1/1; border-radius: 20px; overflow: hidden; border: 2px solid #fff; background: #000; margin-bottom: 24px; }
    .art { width: 100%; height: 100%; object-fit: cover; display: block; }
    .num { font-size: 0.85rem; font-weight: 900; letter-spacing: 0.25em; color: #10b981; text-transform: uppercase; margin-bottom: 8px; }
    .title { font-size: 1.4rem; font-weight: 900; margin-bottom: 24px; }
    
    /* Visible, genuine HTML5 audio element */
    audio { width: 100%; outline: none; border-radius: 12px; margin-bottom: 24px; background: #1a1f35; }
    
    /* Diagnostics Debug Panel */
    .debug-panel { background: #030406; border: 1px solid rgba(168,85,247,0.3); border-radius: 14px; padding: 16px; text-align: left; font-family: monospace; font-size: 0.8rem; color: #94a3b8; }
    .debug-title { color: #a855f7; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.1em; }
    .log-line { margin: 4px 0; word-break: break-all; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="art-wrap">
      <!-- 1:1 Clean Aspect Ratio Thumbnail -->
      <img src="https://lh3.googleusercontent.com/d/1Pz7KjdlZ77FzlZn50zXe8Ces0vyv9eQk" class="art" alt="Powercast 01 Art">
    </div>
    
    <div class="num">POWERCAST 01 — ISOLATED PROOF TEST</div>
    <div class="title">WHAT IS NAYA POWER</div>

    <!-- Genuine Audio Player with direct Google Drive export stream URL -->
    <audio id="audioPlayer" controls crossorigin="anonymous" preload="metadata">
      <source src="https://docs.google.com/uc?export=download&id=1ci3rTF-Y2F3dDbGBtlpITOeQptAEK-1b" type="audio/mp4">
      Your browser does not support the audio element.
    </audio>

    <div class="debug-panel">
      <div class="debug-title">Live Media Diagnostics & Event Monitor</div>
      <div id="logContainer"></div>
    </div>
  </div>

  <script>
    const player = document.getElementById('audioPlayer');
    const logContainer = document.getElementById('logContainer');

    function log(msg, type = '') {
      const div = document.createElement('div');
      div.className = `log-line ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logContainer.prepend(div);
    }

    log("Test page initialized. Attempting to load audio source...");

    player.addEventListener('loadstart', () => log("Media loading started (loadstart)..."));
    player.addEventListener('loadedmetadata', () => log(`Metadata loaded successfully. Duration: ${player.duration.toFixed(2)}s`, 'success'));
    player.addEventListener('canplay', () => log("Media buffer ready: canplay event fired.", 'success'));
    player.addEventListener('play', () => log("Playback initiated: play event fired.", 'success'));
    player.addEventListener('playing', () => log("Audio stream is actively playing!", 'success'));
    player.addEventListener('error', (e) => {
      const err = player.error;
      log(`AUDIO ERROR DETECTED! Code: ${err ? err.code : 'unknown'}, Message: ${err ? err.message : 'none'}`, 'error');
    });
  </script>
</body>
</html>
