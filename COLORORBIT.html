<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="description" content="NayaNET — Create. Connect. Grow with US.">
<title>NayaNET — Sovereign Entrance</title>

<style>
/* =========================================================
   NAYANET SOVEREIGN ENTRANCE
   ORBITAL VAULT EDITION
   ---------------------------------------------------------
   No external assets.
   No external libraries.
   The orbital intelligence field is generated in code.
   ========================================================= */

:root {
  --black: #030305;
  --black-2: #08080d;
  --white: #ffffff;
  --silver: #dfe4ea;
  --silver-2: #9ea7b2;
  --silver-3: #68717c;
  --purple: #8d45ff;
  --purple-2: #b47cff;
  --purple-3: #5d18cf;
  --blue: #56aaff;
  --pink: #ff5fd7;

  --vault-size: min(64vw, 590px);
  --orbit-size: min(82vw, 760px);
  --white-orbit-size: min(91vw, 850px);

  --intro-height: 100px;
}

/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
  background: var(--black);
  color: var(--white);
}

body {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  overflow-y: auto;
  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(92, 36, 153, .15) 0%,
      rgba(25, 10, 45, .08) 27%,
      rgba(3, 3, 5, 0) 58%
    ),
    #030305;
  color: #fff;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background .8s ease;
}

/* =========================================================
   ATMOSPHERE
   ========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.025) 0%,
      transparent 55%
    ),
    linear-gradient(
      115deg,
      transparent 0%,
      rgba(255,255,255,.012) 48%,
      transparent 52%
    );
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: .22;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.55) 0 1px, transparent 1.4px),
    radial-gradient(circle at 75% 31%, rgba(255,255,255,.35) 0 1px, transparent 1.3px),
    radial-gradient(circle at 34% 76%, rgba(255,255,255,.3) 0 1px, transparent 1.2px),
    radial-gradient(circle at 88% 78%, rgba(255,255,255,.28) 0 1px, transparent 1.2px);
  background-size: 240px 240px, 330px 330px, 290px 290px, 410px 410px;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
  position: relative;
  z-index: 50;
  width: 100%;
  min-height: 62px;
  padding:
    max(13px, env(safe-area-inset-top))
    clamp(16px, 4vw, 42px)
    10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .25em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
}

.brand-crystal {
  width: 17px;
  height: 17px;
  position: relative;
  transform: rotate(45deg);
  border: 1px solid rgba(255,255,255,.75);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.95),
      rgba(141,69,255,.72) 45%,
      rgba(30,10,60,.9)
    );
  box-shadow:
    0 0 10px rgba(180,124,255,.65),
    inset 0 0 8px rgba(255,255,255,.3);
}

.auto-login {
  appearance: none;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.035);
  color: rgba(255,255,255,.72);
  padding: 9px 14px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  cursor: pointer;
  transition:
    border-color .25s ease,
    background .25s ease,
    color .25s ease,
    box-shadow .25s ease;
}

.auto-login:hover {
  color: #fff;
  border-color: rgba(180,124,255,.65);
  background: rgba(141,69,255,.12);
  box-shadow: 0 0 20px rgba(141,69,255,.18);
}

/* =========================================================
   MAIN
   ========================================================= */

main {
  position: relative;
  z-index: 5;
  width: 100%;
  min-height: calc(100vh - var(--intro-height));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 14px 18px 30px;
  transition:
    transform 1.35s cubic-bezier(.2,.8,.2,1),
    opacity 1s ease;
}

.intro {
  position: relative;
  z-index: 20;
  text-align: center;
  margin: 4px 0 6px;
  user-select: none;
}

.intro h1 {
  margin: 0;
  font-size: clamp(22px, 3vw, 34px);
  line-height: 1.1;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.94);
  text-shadow:
    0 0 24px rgba(255,255,255,.08),
    0 0 45px rgba(141,69,255,.08);
}

.intro p {
  margin: 9px 0 0;
  font-size: clamp(9px, 1.2vw, 12px);
  line-height: 1.5;
  font-weight: 600;
  letter-spacing: .28em;
  color: rgba(255,255,255,.42);
  text-transform: uppercase;
}

/* =========================================================
   STAGE
   ========================================================= */

.stage {
  position: relative;
  width: min(96vw, 940px);
  height: min(72vh, 710px);
  min-height: 480px;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* =========================================================
   ORBITAL SYSTEM
   ========================================================= */

.orbit-system {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--white-orbit-size);
  height: var(--white-orbit-size);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 3;
}

/*
   The colored spectrum field.
   The orbit itself is transparent; individual jewels
   create the living color ring.
*/

.color-orbit {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--orbit-size);
  height: var(--orbit-size);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  animation: spectrumOrbit 68s linear infinite;
  will-change: transform;
}

/*
   Very subtle atmospheric ring.
   This is deliberately restrained so the jewels remain
   the artwork rather than becoming a generic UI ring.
*/

.color-orbit::before {
  content: "";
  position: absolute;
  inset: 1.8%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.035);
  box-shadow:
    0 0 30px rgba(141,69,255,.035),
    inset 0 0 30px rgba(255,255,255,.015);
}

/* =========================================================
   JEWELS
   ========================================================= */

.jewel {
  --size: 8px;
  --color: #fff;
  --glow: rgba(255,255,255,.8);
  --angle: 0deg;
  --depth: 1;

  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--size);
  height: var(--size);
  margin-left: calc(var(--size) / -2);
  margin-top: calc(var(--size) / -2);

  transform:
    rotate(var(--angle))
    translateY(calc(var(--orbit-radius) * -1))
    rotate(calc(var(--angle) * -1));

  border-radius: 50%;
  background:
    radial-gradient(
      circle at 32% 28%,
      rgba(255,255,255,.98) 0 8%,
      rgba(255,255,255,.72) 18%,
      var(--color) 44%,
      rgba(0,0,0,.18) 100%
    );

  box-shadow:
    0 0 calc(var(--size) * 1.2) var(--glow),
    0 0 calc(var(--size) * 2.8) color-mix(
      in srgb,
      var(--color) 48%,
      transparent
    ),
    inset calc(var(--size) * -.15)
      calc(var(--size) * -.15)
      calc(var(--size) * .35)
      rgba(0,0,0,.28);

  opacity: calc(.56 + (var(--depth) * .22));
  filter: saturate(1.18);
  animation:
    jewelPulse var(--pulse, 4.8s) ease-in-out infinite alternate,
    jewelFloat var(--float, 7s) ease-in-out infinite alternate;
}

/* occasional faceted jewel */
.jewel.facet {
  border-radius: 28% 72% 57% 43% / 48% 42% 58% 52%;
  transform:
    rotate(var(--angle))
    translateY(calc(var(--orbit-radius) * -1))
    rotate(45deg);
}

.jewel.star {
  border-radius: 40%;
}

.jewel.star::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 220%;
  height: 1px;
  transform: translate(-50%, -50%);
  background: linear-gradient(
    90deg,
    transparent,
    var(--color),
    transparent
  );
  opacity: .55;
}

@keyframes jewelPulse {
  from {
    opacity: .42;
    filter: brightness(.82) saturate(1.05);
  }
  to {
    opacity: .95;
    filter: brightness(1.42) saturate(1.3);
  }
}

@keyframes jewelFloat {
  from {
    margin-top: calc(var(--size) / -2 - 1px);
  }
  to {
    margin-top: calc(var(--size) / -2 + 1px);
  }
}

@keyframes spectrumOrbit {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(-360deg);
  }
}

/* =========================================================
   WHITE LIGHT ORBIT
   ========================================================= */

.white-orbit {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--white-orbit-size);
  height: var(--white-orbit-size);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  animation: whiteOrbit 24s linear infinite;
  will-change: transform;
}

.white-orbit::before {
  content: "";
  position: absolute;
  inset: 3.5%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.035);
}

.white-comet {
  position: absolute;
  left: 50%;
  top: 0;
  width: 15px;
  height: 15px;
  margin-left: -7.5px;
  margin-top: -7.5px;
  border-radius: 50%;
  background:
    radial-gradient(
      circle,
      #fff 0%,
      #fff 25%,
      rgba(255,255,255,.98) 40%,
      rgba(255,255,255,.48) 65%,
      transparent 100%
    );
  box-shadow:
    0 0 8px #fff,
    0 0 22px rgba(255,255,255,.95),
    0 0 55px rgba(255,255,255,.75),
    0 0 100px rgba(255,255,255,.34);
}

.white-comet::before {
  content: "";
  position: absolute;
  width: 125px;
  height: 26px;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0),
    rgba(255,255,255,.04),
    rgba(255,255,255,.22),
    rgba(255,255,255,.8)
  );
  filter: blur(5px);
  opacity: .72;
  transform-origin: right center;
}

.white-comet::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 260%;
  height: 260%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255,255,255,.18),
    transparent 68%
  );
}

@keyframes whiteOrbit {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

/* =========================================================
   VAULT
   ========================================================= */

.portal {
  position: relative;
  z-index: 12;
  width: var(--vault-size);
  aspect-ratio: 1 / 1;
  border-radius: 50%;

  background:
    radial-gradient(
      circle at 36% 30%,
      rgba(255,255,255,.2),
      transparent 18%
    ),
    radial-gradient(
      circle at 50% 50%,
      rgba(35,35,42,.95) 0%,
      rgba(11,11,16,.98) 58%,
      rgba(2,2,5,1) 100%
    );

  border:
    2px solid rgba(224,229,236,.62);

  box-shadow:
    0 0 0 1px rgba(255,255,255,.08),
    0 0 0 7px rgba(100,106,116,.08),
    0 0 0 9px rgba(255,255,255,.025),
    0 18px 65px rgba(0,0,0,.85),
    0 0 55px rgba(117,50,205,.16),
    inset 0 0 40px rgba(0,0,0,.9),
    inset 0 0 15px rgba(255,255,255,.08);

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    transform 1.35s cubic-bezier(.16,.82,.24,1),
    filter 1.35s ease,
    box-shadow 1.35s ease;
}

.portal::before {
  content: "";
  position: absolute;
  inset: 5.5%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.19);
  box-shadow:
    inset 0 0 24px rgba(255,255,255,.045),
    0 0 18px rgba(141,69,255,.09);
  pointer-events: none;
}

.portal::after {
  content: "";
  position: absolute;
  inset: 13%;
  border-radius: 50%;
  border: 1px solid rgba(141,69,255,.16);
  box-shadow:
    inset 0 0 35px rgba(92,24,207,.16),
    0 0 35px rgba(141,69,255,.08);
  pointer-events: none;
}

.core {
  position: absolute;
  inset: 20%;
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 38% 32%,
      rgba(255,255,255,.06),
      transparent 16%
    ),
    radial-gradient(
      circle,
      rgba(22,10,38,.96),
      rgba(5,5,9,.99) 72%
    );
  box-shadow:
    inset 0 0 45px rgba(0,0,0,.95),
    inset 0 0 22px rgba(141,69,255,.1);
  border: 1px solid rgba(255,255,255,.06);
}

/* =========================================================
   VAULT CONTENT
   ========================================================= */

.content {
  position: relative;
  z-index: 20;
  width: 70%;
  max-width: 350px;
  text-align: center;
}

.presence {
  margin-bottom: 18px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: rgba(255,255,255,.48);
  transition:
    color .8s ease,
    text-shadow .8s ease,
    letter-spacing 1s ease;
}

.presence::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 8px;
  vertical-align: 1px;
  border-radius: 50%;
  background: #fff;
  box-shadow:
    0 0 7px rgba(255,255,255,.85),
    0 0 15px rgba(180,124,255,.4);
  animation: listeningPulse 2.2s ease-in-out infinite;
}

@keyframes listeningPulse {
  0%,100% { opacity: .45; transform: scale(.82); }
  50% { opacity: 1; transform: scale(1.18); }
}

.entry-form {
  width: 100%;
}

#userName {
  width: 100%;
  height: 50px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.18);
  outline: none;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  color: #fff;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .08em;

  box-shadow:
    inset 0 0 15px rgba(0,0,0,.4),
    0 0 20px rgba(0,0,0,.12);

  transition:
    border-color .3s ease,
    box-shadow .3s ease,
    background .3s ease;
}

#userName::placeholder {
  color: rgba(255,255,255,.38);
}

#userName:focus {
  border-color: rgba(180,124,255,.72);
  background: rgba(141,69,255,.07);
  box-shadow:
    0 0 0 3px rgba(141,69,255,.07),
    0 0 30px rgba(141,69,255,.16),
    inset 0 0 15px rgba(0,0,0,.3);
}

.enter-button {
  width: 100%;
  min-height: 49px;
  margin-top: 12px;
  border: 1px solid rgba(255,255,255,.34);
  border-radius: 999px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.12),
      rgba(141,69,255,.12)
    );

  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .2em;
  text-transform: uppercase;

  cursor: pointer;

  box-shadow:
    0 0 20px rgba(141,69,255,.08),
    inset 0 0 12px rgba(255,255,255,.035);

  transition:
    transform .25s ease,
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.enter-button:hover {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,.72);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.18),
      rgba(141,69,255,.24)
    );
  box-shadow:
    0 8px 30px rgba(0,0,0,.35),
    0 0 35px rgba(141,69,255,.22);
}

.enter-button:active {
  transform: translateY(0);
}

/* =========================================================
   NAVIGATION
   ========================================================= */

.nav {
  position: relative;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 12px;
}

.nav-button {
  min-width: 105px;
  min-height: 37px;
  padding: 8px 13px;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;

  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.12);

  background: rgba(255,255,255,.025);
  color: rgba(255,255,255,.55);

  text-decoration: none;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;

  transition:
    color .25s ease,
    border-color .25s ease,
    background .25s ease,
    transform .25s ease,
    box-shadow .25s ease;
}

.nav-button:hover {
  color: #fff;
  border-color: rgba(180,124,255,.42);
  background: rgba(141,69,255,.08);
  transform: translateY(-1px);
  box-shadow: 0 0 22px rgba(141,69,255,.1);
}

.nav-icon {
  font-size: 12px;
  line-height: 1;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer {
  position: relative;
  z-index: 20;
  padding: 5px 20px 18px;
  text-align: center;
  color: rgba(255,255,255,.2);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .25em;
  text-transform: uppercase;
}

/* =========================================================
   ENTER SEQUENCE
   ========================================================= */

body.entering {
  overflow: hidden;
}

body.entering .portal {
  transform: scale(1.18) translateZ(40px);
  filter:
    brightness(1.3)
    saturate(1.18);

  box-shadow:
    0 0 0 1px rgba(255,255,255,.22),
    0 0 0 8px rgba(141,69,255,.1),
    0 0 80px rgba(141,69,255,.58),
    0 0 180px rgba(100,35,220,.35),
    inset 0 0 55px rgba(141,69,255,.16);
}

body.entering .portal::before {
  border-color: rgba(255,255,255,.55);
  box-shadow:
    inset 0 0 35px rgba(255,255,255,.08),
    0 0 70px rgba(141,69,255,.45);
}

body.entering .presence {
  color: #fff;
  text-shadow:
    0 0 14px rgba(255,255,255,.45),
    0 0 30px rgba(180,124,255,.55);
  letter-spacing: .36em;
}

body.entering .color-orbit {
  animation-duration: 16s;
}

body.entering .white-orbit {
  animation-duration: 7s;
}

body.entering .white-comet {
  box-shadow:
    0 0 12px #fff,
    0 0 35px rgba(255,255,255,1),
    0 0 85px rgba(255,255,255,.9),
    0 0 160px rgba(255,255,255,.5);
}

body.entering main {
  animation: wholeForward 1.35s cubic-bezier(.16,.82,.24,1) forwards;
}

@keyframes wholeForward {
  0% {
    transform: scale(1);
    opacity: 1;
  }

  65% {
    transform: scale(1.035);
    opacity: 1;
  }

  100% {
    transform: scale(1.12);
    opacity: 0;
  }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }

  .color-orbit,
  .white-orbit {
    animation: none !important;
  }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-height: 760px) {
  :root {
    --vault-size: min(55vw, 500px);
    --orbit-size: min(73vw, 650px);
    --white-orbit-size: min(82vw, 735px);
  }

  .stage {
    height: min(69vh, 610px);
    min-height: 410px;
  }

  .intro h1 {
    font-size: 25px;
  }

  .intro {
    margin-top: 0;
  }
}

@media (max-height: 700px) {
  :root {
    --vault-size: min(50vw, 440px);
    --orbit-size: min(67vw, 585px);
    --white-orbit-size: min(76vw, 665px);
  }

  .stage {
    min-height: 370px;
  }

  .content {
    width: 72%;
  }

  #userName,
  .enter-button {
    height: 43px;
    min-height: 43px;
  }

  .nav-button {
    min-height: 33px;
    padding: 6px 11px;
  }
}

@media (max-width: 700px) {
  :root {
    --vault-size: min(70vw, 480px);
    --orbit-size: min(91vw, 620px);
    --white-orbit-size: min(104vw, 710px);
  }

  .stage {
    width: 100%;
    height: 64vh;
    min-height: 430px;
  }

  .content {
    width: 68%;

<script>
/* =========================================================
   NAYANET ORBIT GENERATOR
   ---------------------------------------------------------
   The color field is deliberately generated as individual
   jewel objects rather than a single CSS gradient.

   This creates:
   - depth
   - variation
   - individual luminosity
   - jewel-like visual character
   - a continuous spectrum
   ========================================================= */

(function buildOrbitalSpectrum() {

  const orbit = document.getElementById("colorOrbit");

  if (!orbit) return;

  /*
    72 jewels gives enough visual density for a rich,
    continuous spectrum while still allowing each light
    to remain visually distinct.
  */

  const total = 72;

  /*
    Continuous spectrum beginning at 12 o'clock.

    The hue progression intentionally moves through the
    complete visible spectrum rather than creating six
    obvious colored segments.
  */

  const colors = [
    "#ffffff",
    "#fff7fb",
    "#ffd9ee",
    "#ffb8df",
    "#ff86ce",
    "#ff5fc3",
    "#ff36b5",
    "#f51ba8",
    "#e91aaf",
    "#d923c4",
    "#c633d9",
    "#b34be9",
    "#9d5af5",
    "#8a55ff",
    "#7448ef",
    "#6540d9",
    "#5639c5",
    "#4d45c7",
    "#4659d9",
    "#4374e9",
    "#438fe9",
    "#48a9ef",
    "#51c2ee",
    "#4bd5e0",
    "#4adbd0",
    "#45d2b9",
    "#42c9a3",
    "#46cf88",
    "#5bd96c",
    "#78e15a",
    "#9ae84e",
    "#b9ed48",
    "#d7ef49",
    "#edf05a",
    "#f7df57",
    "#f9cc4f",
    "#f7b94a",
    "#f5a044",
    "#f58b3f",
    "#f36f3e",
    "#ef5543",
    "#e94248",
    "#e83258",
    "#e72b70",
    "#e92b8d",
    "#ed35a7",
    "#f04ebc",
    "#f56bca",
    "#f98ed8",
    "#ffb1e5",
    "#ffd2ef",
    "#ffe9f7",
    "#fff5fb"
  ];

  for (let i = 0; i < total; i++) {

    const jewel = document.createElement("span");

    jewel.className = "jewel";

    /*
      12 o'clock = 0 degrees.
      The spectrum is distributed continuously around
      the entire circle.
    */

    const angle = (360 / total) * i;

    /*
      Multiple orbital depths keep the ring from feeling
      mechanically flat.
    */

    const depthBand = i % 7;

    let radius;

    if (depthBand === 0) {
      radius = 47.9;
    } else if (depthBand === 1 || depthBand === 2) {
      radius = 48.5;
    } else if (depthBand === 3 || depthBand === 4) {
      radius = 50;
    } else {
      radius = 49.2;
    }

    const sizePattern = i % 13;

    let size;

    if (sizePattern === 0) {
      size = 13;
      jewel.classList.add("facet");
    } else if (sizePattern === 5 || sizePattern === 10) {
      size = 11;
      jewel.classList.add("star");
    } else if (sizePattern % 4 === 0) {
      size = 8.5;
    } else {
      size = 6 + ((i * 7) % 5);
    }

    const colorIndex = Math.round(
      (i / (total - 1)) * (colors.length - 1)
    );

    const color = colors[colorIndex];

    jewel.style.setProperty("--angle", angle + "deg");
    jewel.style.setProperty("--orbit-radius", radius + "%");
    jewel.style.setProperty("--size", size + "px");
    jewel.style.setProperty("--color", color);

    jewel.style.setProperty(
      "--glow",
      color + "99"
    );

    jewel.style.setProperty(
      "--depth",
      String(.45 + ((i * 17) % 55) / 100)
    );

    jewel.style.setProperty(
      "--pulse",
      (3.3 + ((i * 19) % 42) / 10) + "s"
    );

    jewel.style.setProperty(
      "--float",
      (4.8 + ((i * 11) % 34) / 10) + "s"
    );

    /*
      Stagger animation phases so the entire ring doesn't
      pulse synchronously.
    */

    jewel.style.animationDelay =
      (-((i * 137) % 5100)) + "ms";

    orbit.appendChild(jewel);
  }

})();


/* =========================================================
   SUBTLE WHITE-LIGHT / JEWEL INTERACTION
   ---------------------------------------------------------
   The orbit remains elegant and restrained.

   The white light doesn't physically manipulate every jewel;
   instead, the entire spectrum receives a tiny atmospheric
   brightness shift while the comet travels.
   ========================================================= */

(function enhanceOrbitalAtmosphere() {

  const whiteOrbit = document.querySelector(".white-orbit");
  const colorOrbit = document.querySelector(".color-orbit");

  if (!whiteOrbit || !colorOrbit) return;

  let start = performance.now();

  function frame(now) {

    const elapsed = (now - start) / 1000;

    /*
      24 second clockwise revolution.
    */

    const phase =
      ((elapsed % 24) / 24) * Math.PI * 2;

    /*
      Extremely subtle breathing synchronized to the
      white light's journey.
    */

    const glow =
      0.92 +
      Math.sin(phase) * 0.045;

    colorOrbit.style.opacity = glow.toFixed(3);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

})();


/* =========================================================
   AUTO LOGIN
   ========================================================= */

function checkAutoLogin() {

  const savedAlias =
    localStorage.getItem("nayanet_smart_alias");

  if (savedAlias) {
    window.location.href = "identity.html";
    return;
  }

  alert(
    "No saved NayaNET identity was found on this device."
  );
}


/* =========================================================
   ENTRY
   ========================================================= */

const entryForm =
  document.getElementById("entryForm");

const userName =
  document.getElementById("userName");

const presence =
  document.getElementById("presence");


if (entryForm) {

  entryForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
      userName.value.trim();

    if (!name) {

      userName.focus();

      return;
    }

    /*
      Preserve the existing working identity handoff.
    */

    sessionStorage.setItem(
      "nayanet_user_name",
      name
    );

    document.body.classList.add("entering");

    presence.textContent =
      "Naya Responding";

    /*
      Allow the cinematic entrance sequence to complete
      before handing the user to the identity experience.
    */

    window.setTimeout(function() {

      window.location.href =
        "identity.html?name=" +
        encodeURIComponent(name);

    }, 1350);

  });

}


/* =========================================================
   OPTIONAL KEYBOARD POLISH
   ========================================================= */

document.addEventListener("keydown", function(event) {

  if (
    event.key === "Enter" &&
    document.activeElement === userName
  ) {
    /*
      Native form submission handles this.
      This listener intentionally does nothing else.
    */
    return;
  }

});


/* =========================================================
   SAFETY:
   Prevent accidental selection during orbital interaction.
   ========================================================= */

document
  .querySelectorAll(".orbit-system")
  .forEach(function(element) {

    element.setAttribute(
      "aria-hidden",
      "true"
    );

  });

</script>
