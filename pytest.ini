[pytest]
# Constitution §15 (AAA standard), §7 (LAW OF PROOF), §14 (never weaken gates).
#
# LAW: Test collection isolation.
# A single broken test module must never kill the whole suite. Collection
# errors are reported as ERRORS for the offending file only; all other
# modules still collect and run.
#
# WHY: Without this, one bad import aborts pytest at COLLECTION — 3,000 tests
# never execute. This creates pressure to bypass verification ("tests are
# broken anyway") and hides real regressions behind a single bad file.
#
# This weakens nothing: the run still exits non-zero when any error exists,
# so CI stays red on genuinely broken files. It just stops one bad import
# from masking the results of every other test.
addopts = --continue-on-collection-errors
