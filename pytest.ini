[pytest]
# A single broken test module must never kill the whole suite.
# Collection errors are reported as ERRORS for the offending file only;
# all other modules still collect and run. The run still exits non-zero
# when any error exists, so CI stays red on genuinely broken files —
# this weakens nothing, it just stops one bad import from masking
# the results of 3000 other tests.
addopts = --continue-on-collection-errors
