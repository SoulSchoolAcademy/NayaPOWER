<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pipetest2 — NayaNET</title>
<style>
/* DNA ROOT — imported, never overridden */
:root {
  --naya-bg: #050607;
  --naya-purple: #a06bff; --naya-blue: #3fb8ff; --naya-green: #2fe89e;
  --naya-gold: #ffbf3d; --naya-orange: #ff9a5a; --naya-red: #ff5e6c;
  --naya-magenta: #e84fff; --naya-indigo: #3a5bff; --naya-sky: #7fd4ff;
  --naya-text: #ffffff;
  --naya-nutshell: 20px;
}
body { background: var(--naya-bg) !important; color: var(--naya-text); margin: 0; width: 100%; max-width: none !important; font-family: system-ui, sans-serif; }

/* SMART BARS — top and bottom, the flow */
.naya-topbar, .naya-bottombar {
  position: fixed; left: 0; right: 0; z-index: 100;
  background: rgba(5,6,7,0.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; padding: 12px 20px; gap: 16px;
}
.naya-topbar { top: 0; }
.naya-bottombar { bottom: 0; border-bottom: none; border-top: 1px solid rgba(255,255,255,0.1); justify-content: center; }

/* SMART VIEW — feature front and center */
.naya-smartview {
  margin-top: 70px; margin-bottom: 70px; padding: 20px;
  min-height: calc(100vh - 140px);
}

/* HERO — 16:9, obsidian, elevated */
.naya-hero {
  aspect-ratio: 16/9; width: 100%; max-height: 60vh;
  background: linear-gradient(135deg, #0a0c10, #050607);
  border: 1.5px solid rgba(255,255,255,0.9);
  border-top: 2px solid rgba(255,255,255,0.4);
  border-radius: 12px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(0,0,0,0.5), 0 0 20px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.6);
  margin-bottom: 24px; position: relative; overflow: hidden;
}
.naya-hero h1 { font-size: 3em; margin: 0; color: var(--naya-text); }
.naya-hero .naya-vision { font-size: var(--naya-nutshell); color: var(--naya-text); opacity: 0.9; margin-top: 12px; max-width: 600px; text-align: center; }

/* SECTIONS — 16:9 rectangles, spectrum-accented */
.naya-section {
  background: var(--naya-bg); border: 1.5px solid rgba(255,255,255,0.9);
  border-radius: 12px; padding: 24px; margin-bottom: 20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(0,0,0,0.5), 0 0 20px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.6);
  position: relative;
}
.naya-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 12px 12px 0 0; background: var(--section-color, var(--naya-purple)); }

/* SMART TAB BUTTONS */
.naya-btn {
  background: var(--naya-bg); border: 1.5px solid #fff; border-top: 2px solid rgba(255,255,255,0.4);
  color: var(--naya-text); padding: 12px 24px; border-radius: 8px; cursor: pointer;
  font-size: 16px; transition: all 0.2s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 4px 12px rgba(0,0,0,0.6);
}
.naya-btn:hover { border-color: var(--btn-color, var(--naya-purple)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 24px var(--btn-color, var(--naya-purple)), 0 4px 12px rgba(0,0,0,0.6); }

/* HIDE BY TYPE — sections show/hide via data-type */
[data-show-for] { display: none; }
body[data-pagetype="personal"] [data-show-for~="personal"],
body[data-pagetype="business"] [data-show-for~="business"],
body[data-pagetype="space"] [data-show-for~="space"],
body[data-pagetype="membership"] [data-show-for~="membership"] { display: block; }

/* NO VOICE */
.naya-voice-btn, button[class*="voice"], button[class*="powercast"], .powercast-topbtn, [data-action="play-voice"], [data-action="powercast"] { display: none !important; }
</style>
</head>
<body data-pagetype="personal">

<!-- SMART BAR TOP -->
<nav class="naya-topbar">
  <span style="font-weight:bold; font-size:1.2em;">pipetest2</span>
  <span style="opacity:0.6;">personal</span>
</nav>

<!-- SMART VIEW -->
<main class="naya-smartview">
  <!-- HERO -->
  <div class="naya-hero">
    <h1>pipetest2</h1>
    <div class="naya-vision">v</div>
  </div>

  <!-- MISSION -->
  <div class="naya-section" style="--section-color: var(--naya-blue);">
    <h2>Mission</h2>
    <p style="font-size: var(--naya-nutshell);">m</p>
  </div>

  <!-- GOAL -->
  <div class="naya-section" style="--section-color: var(--naya-green);">
    <h2>Goal</h2>
    <p style="font-size: var(--naya-nutshell);">g</p>
  </div>

  <!-- PERSONAL ONLY -->
  <div class="naya-section" data-show-for="personal" style="--section-color: var(--naya-purple);">
    <h2>Connections</h2>
    <p>Your people, your world.</p>
  </div>

  <!-- BUSINESS ONLY -->
  <div class="naya-section" data-show-for="business" style="--section-color: var(--naya-gold);">
    <h2>Intelligence</h2>
    <p>Data, stats, the heartbeat.</p>
  </div>

  <!-- SPACE ONLY -->
  <div class="naya-section" data-show-for="space" style="--section-color: var(--naya-sky);">
    <h2>Community</h2>
    <p>The group, the stream, the conversation.</p>
  </div>

  <!-- MEMBERSHIP ONLY (locked) -->
  <div class="naya-section" data-show-for="membership" style="--section-color: var(--naya-magenta);">
    <h2>Members Only</h2>
    <p>🔒 Private content for members.</p>
  </div>
</main>

<!-- SMART BAR BOTTOM -->
<nav class="naya-bottombar">
  <button class="naya-btn" style="--btn-color: var(--naya-purple);">Home</button>
  <button class="naya-btn" style="--btn-color: var(--naya-blue);">Mail</button>
  <button class="naya-btn" style="--btn-color: var(--naya-green);">Share</button>
</nav>

</body>
</html>
