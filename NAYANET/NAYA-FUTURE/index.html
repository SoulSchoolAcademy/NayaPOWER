<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050509"><meta name="description" content="NayaNET — Create. Connect. Grow with US.">
<title>NayaNET — Living Intelligence</title>
<style>
:root{--bg:#040408;--white:#f8f7ff;--muted:#9d98a7;--green:#7dffb2;--magenta:#ff35bb;--red:#ff315b;--violet:#9c5cff;--gold:#ffd86e;--cyan:#6fffe9;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit}
.app{position:relative;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(156,92,255,.17),transparent 27%),radial-gradient(circle at 15% 25%,rgba(255,49,91,.09),transparent 25%),radial-gradient(circle at 84% 72%,rgba(125,255,178,.08),transparent 29%),#040408}
.app:before{content:"";position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at center,#000,transparent 78%);pointer-events:none}
.app:after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 20deg,transparent 0 25%,rgba(255,53,187,.025) 32%,rgba(255,49,91,.04) 39%,rgba(125,255,178,.035) 48%,transparent 57%);animation:ambient 18s linear infinite;pointer-events:none}@keyframes ambient{to{transform:rotate(360deg)}}
.top{position:absolute;top:0;left:0;right:0;height:72px;padding:18px 25px;display:flex;align-items:center;justify-content:space-between;z-index:30}.brand{display:flex;gap:10px;align-items:center;font-weight:950;letter-spacing:-.03em}.brand i{font-style:normal;font-size:22px;filter:drop-shadow(0 0 12px var(--gold))}.live{display:flex;align-items:center;gap:8px;color:#bcb7c5;font-size:9px;letter-spacing:.16em;text-transform:uppercase}.live b{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green);animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.45;transform:scale(.75)}}
.stage{height:100%;display:grid;place-items:center;padding:70px 18px 22px}.core{position:relative;width:min(1180px,100%);height:min(720px,calc(100dvh - 94px));display:grid;place-items:center}.intro{position:absolute;top:2%;left:50%;transform:translateX(-50%);width:min(760px,92%);text-align:center;z-index:5;pointer-events:none}.eyebrow{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--green);text-shadow:0 0 16px rgba(125,255,178,.4)}.intro h1{margin:9px 0 5px;font-size:clamp(18px,2.5vw,31px);letter-spacing:.13em;text-transform:uppercase}.intro p{margin:0;color:#85808e;font-size:11px}.rings{position:absolute;width:min(680px,72vw);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.07);box-shadow:0 0 120px rgba(156,92,255,.1),inset 0 0 90px rgba(156,92,255,.045)}.rings:before,.rings:after{content:"";position:absolute;border-radius:50%;inset:9%;border:1px solid rgba(125,255,178,.09);animation:ring 9s linear infinite}.rings:after{inset:21%;border-color:rgba(255,53,187,.12);animation-direction:reverse;animation-duration:13s}@keyframes ring{to{transform:rotate(360deg)}}
.orbit{position:absolute;inset:0;animation:orbit 32s linear infinite}.node{position:absolute;width:176px;height:108px;transform:translate(-50%,-50%);animation:counter 32s linear infinite}.node:nth-child(1){left:50%;top:5%}.node:nth-child(2){left:90%;top:28%}.node:nth-child(3){left:82%;top:77%}.node:nth-child(4){left:18%;top:77%}.node:nth-child(5){left:10%;top:28%}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes counter{to{transform:translate(-50%,-50%) rotate(-360deg)}}
.board{position:relative;width:100%;height:100%;padding:0;text-align:left;border:1px solid rgba(125,255,178,.7);border-radius:20px;overflow:hidden;cursor:pointer;background:rgba(7,10,9,.92);box-shadow:0 0 20px rgba(125,255,178,.14),inset 0 0 25px rgba(125,255,178,.035);transition:transform .28s,box-shadow .28s,border-color .28s}.board:before{content:"";position:absolute;inset:-100%;background:conic-gradient(from 0deg,transparent 0 26%,var(--magenta) 33%,var(--red) 43%,var(--green) 54%,transparent 64%);animation:spin 4.8s linear infinite;opacity:.48}.board:after{content:"";position:absolute;inset:1px;border-radius:19px;background:linear-gradient(145deg,rgba(10,16,13,.98),rgba(10,7,13,.96));z-index:1}@keyframes spin{to{transform:rotate(360deg)}}.board:hover,.board:focus-visible{transform:translateY(-5px) scale(1.035);border-color:#fff;box-shadow:0 0 32px rgba(125,255,178,.42),0 0 72px rgba(255,53,187,.16),inset 0 0 30px rgba(125,255,178,.09);outline:none}.board.active{border-color:var(--magenta);box-shadow:0 0 35px rgba(255,53,187,.36),0 0 80px rgba(125,255,178,.13)}.board>*{position:relative;z-index:2}.board-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 0}.icon{font-size:20px;filter:drop-shadow(0 0 9px var(--green))}.signal{font-size:7px;letter-spacing:.17em;text-transform:uppercase;color:var(--green)}.board h2{font-size:14px;margin:8px 14px 2px}.board p{font-size:9px;color:#98929f;margin:0 14px}.meter{position:absolute;bottom:10px;left:14px;right:14px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;z-index:2}.meter i{display:block;height:100%;width:82%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--magenta),var(--red));box-shadow:0 0 12px var(--green);animation:meter 2.6s ease-in-out infinite alternate}@keyframes meter{to{width:96%}}
.naya{position:relative;width:min(276px,31vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:12;background:radial-gradient(circle at 37% 30%,#fff 0 2%,#f1dcff 8%,#b66cff 24%,#702bcf 47%,#170a29 69%,#07040c 73%);box-shadow:0 0 50px rgba(181,96,255,.58),0 0 130px rgba(255,53,187,.16),inset 0 0 42px rgba(255,255,255,.34);transition:.3s}.naya:before{content:"";position:absolute;inset:-13px;border-radius:50%;border:1px solid rgba(125,255,178,.28);box-shadow:0 0 30px rgba(125,255,178,.18);animation:corepulse 3.2s ease-in-out infinite}@keyframes corepulse{50%{inset:-22px;opacity:.48}}.naya:hover,.naya:focus-visible{transform:scale(1.045);outline:none;box-shadow:0 0 72px rgba(181,96,255,.76),0 0 170px rgba(255,53,187,.22),inset 0 0 45px rgba(255,255,255,.4)}.naya-inner{width:74%;height:74%;border-radius:50%;display:grid;place-items:center;text-align:center;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);box-shadow:inset 0 0 35px rgba(255,255,255,.08)}.naya strong{display:block;font-size:clamp(28px,4vw,43px);letter-spacing:-.05em}.naya span{display:block;margin-top:5px;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#eee2fa}.naya small{display:block;margin-top:10px;color:var(--green);font-size:8px;letter-spacing:.13em;text-transform:uppercase}
.enter{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);z-index:15}.enter button{position:relative;min-width:270px;padding:17px 30px;border:1px solid rgba(125,255,178,.85);border-radius:18px;background:linear-gradient(100deg,rgba(125,255,178,.16),rgba(156,92,255,.2),rgba(255,53,187,.2),rgba(255,49,91,.16));box-shadow:0 0 30px rgba(125,255,178,.25),0 0 75px rgba(255,53,187,.14),inset 0 0 22px rgba(255,255,255,.07);font-weight:950;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;overflow:hidden;transition:.25s}.enter button:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-120%);animation:sweep 3.2s ease-in-out infinite}.enter button:hover,.enter button:focus-visible{border-color:#fff;transform:translateY(-3px);box-shadow:0 0 42px rgba(125,255,178,.5),0 0 90px rgba(255,53,187,.24),inset 0 0 28px rgba(255,255,255,.1);outline:none}@keyframes sweep{45%,100%{transform:translateX(120%)}}
.world{position:absolute;inset:0;z-index:25;display:none;background:rgba(3,3,7,.78);backdrop-filter:blur(24px);padding:82px 26px 26px}.world.open{display:block;animation:fade .35s ease}@keyframes fade{from{opacity:0}}.world-shell{height:100%;max-width:1120px;margin:auto;display:grid;grid-template-rows:auto 1fr;gap:22px}.world-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.world-kicker{color:var(--green);font-size:9px;letter-spacing:.2em;text-transform:uppercase}.world h2{font-size:clamp(34px,6vw,68px);line-height:.95;margin:8px 0}.world-lead{max-width:670px;color:#aaa5b1;margin:0;font-size:14px;line-height:1.6}.close{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:20px}.close:hover{border-color:#fff;background:rgba(255,255,255,.1)}.world-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;min-height:0}.live-card,.mini-card{border:1px solid rgba(125,255,178,.22);border-radius:24px;background:linear-gradient(145deg,rgba(19,16,24,.96),rgba(7,8,12,.96));box-shadow:inset 0 0 35px rgba(125,255,178,.025);padding:24px}.live-card{position:relative;overflow:hidden}.live-card:before{content:"";position:absolute;inset:-50%;background:conic-gradient(transparent,var(--magenta),var(--red),var(--green),transparent);opacity:.12;animation:spin 8s linear infinite}.live-card>*{position:relative}.big-action{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:13px 17px;border:1px solid var(--green);border-radius:13px;background:rgba(125,255,178,.08);font-weight:850;cursor:pointer;box-shadow:0 0 22px rgba(125,255,178,.12)}.big-action:hover{background:rgba(125,255,178,.16);box-shadow:0 0 35px rgba(125,255,178,.3)}.stack{display:grid;gap:16px}.mini-card h3{margin:0 0 7px;font-size:16px}.mini-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.mini-card .dots{display:flex;gap:5px;margin-top:14px}.dots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}.dots i:nth-child(2){background:var(--magenta);box-shadow:0 0 9px var(--magenta)}.dots i:nth-child(3){background:var(--red);box-shadow:0 0 9px var(--red)}
@media(max-width:760px){.top{padding:14px}.live{font-size:7px}.stage{padding:64px 6px 14px}.core{height:calc(100dvh - 82px)}.rings{width:90vw}.naya{width:175px}.node{width:120px;height:82px}.node:nth-child(1){top:4%}.node:nth-child(2){left:93%;top:29%}.node:nth-child(3){left:78%;top:83%}.node:nth-child(4){left:22%;top:83%}.node:nth-child(5){left:7%;top:29%}.board-head{padding:9px 10px 0}.board h2{font-size:10px;margin:5px 10px 1px}.board p{font-size:7px;margin:0 10px}.meter{left:10px;right:10px}.signal{font-size:6px}.intro{top:1%}.intro h1{font-size:12px}.intro p{font-size:8px}.enter{bottom:1%}.enter button{min-width:218px;padding:14px;font-size:10px}.world{padding:72px 14px 14px}.world-grid{grid-template-columns:1fr;overflow:auto}.world h2{font-size:40px}.world-lead{font-size:12px}.live-card,.mini-card{padding:18px;border-radius:19px}.world-shell{gap:15px}.stack{gap:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><i>☀️</i><span>NayaNET</span></div><div class="live"><b></b>Living intelligence online</div></header>
<main class="stage"><div class="core">
<section class="intro"><div class="eyebrow">A new kind of internet</div><h1>Create · Connect · Grow with US</h1><p>The internet connected information. NayaNET connects intelligence.</p></section>
<div class="rings"></div>
<div class="orbit">
<div class="node"><button class="board" data-world="power"><div class="board-head"><span class="icon">⚡</span><span class="signal">ACTIVE</span></div><h2>NayaPOWER</h2><p>Activate your intelligence.</p><div class="meter"><i></i></div></button></div>
<div class="node"><button class="board" data-world="player"><div class="board-head"><span class="icon">◉</span><span class="signal">PLAYING</span></div><h2>Power Player</h2><p>Hear · learn · grow.</p><div class="meter"><i></i></div></button></div>
<div class="node"><button class="board" data-world="hub"><div class="board-head"><span class="icon">◎</span><span class="signal">LIVE</span></div><h2>Intelligent Hub</h2><p>What matters now.</p><div class="meter"><i></i></div></button></div>
<div class="node"><button class="board" data-world="network"><div class="board-head"><span class="icon">✦</span><span class="signal">CONNECTED</span></div><h2>Your Network</h2><p>Connect intelligence.</p><div class="meter"><i></i></div></button></div>
<div class="node"><button class="board" data-world="maxess"><div class="board-head"><span class="icon">◇</span><span class="signal">READY</span></div><h2>MAXESS</h2><p>Master AI capability.</p><div class="meter"><i></i></div></button></div>
</div>
<button class="naya" id="naya" aria-label="Open Naya" type="button"><span class="naya-inner"><span><strong>Naya</strong><span>Your intelligent guide</span><small>I'm here →</small></span></span></button>
<div class="enter"><button id="enter" type="button">ENTER NayaNET&nbsp; →</button></div>
</div></main>

<section class="world" id="world" aria-hidden="true"><div class="world-shell"><div class="world-top"><div><div class="world-kicker" id="kicker">NayaNET / WORLD</div><h2 id="worldTitle">Welcome.</h2><p class="world-lead" id="worldLead"></p></div><button class="close" id="close" aria-label="Close world">×</button></div><div class="world-grid"><article class="live-card"><div class="world-kicker">Naya says</div><h3 id="message" style="font-size:25px;line-height:1.15;max-width:650px"></h3><p id="detail" style="color:#aaa5b1;line-height:1.6;max-width:650px"></p><button class="big-action" id="primary" type="button">Begin →</button></article><div class="stack"><article class="mini-card"><h3>What happens here</h3><p id="happens"></p><div class="dots"><i></i><i></i><i></i></div></article><article class="mini-card"><h3>Your next move</h3><p id="next"></p></article></div></div></div></section>
<script>
const world=document.getElementById('world'),boards=[...document.querySelectorAll('.board')];
const data={
 power:{k:'NayaNET / NayaPOWER',t:'Activate your intelligence.',l:'The intelligence layer behind NayaNET. Your companion, context and capability move together.',m:'Hey, beautiful soul. Naya is ready to help you turn attention into intelligence.',d:'NayaPOWER is where the relationship begins: understand, remember, reason, learn and compound. You do not have to navigate the system alone.',h:'Open the intelligence layer, establish your intent and let Naya orient the experience around what matters to you.',n:'Tell Naya what you want to create, solve, learn or become.',a:'Activate NayaPOWER →'},
 player:{k:'NayaNET / Power Player',t:'Let intelligence move.',l:'The heartbeat of NayaNET — a living place to hear, experience and learn.',m:'Press play. Listen differently. Let an idea change what you do next.',d:'Power Player turns intelligence into an experience rather than another page of information. Content, voice and context can become a continuous stream.',h:'Listen to a featured intelligence experience, move through learning and return to the network with new context.',n:'Start the current intelligence experience.',a:'Start Power Player →'},
 hub:{k:'NayaNET / Intelligent Hub',t:'See what matters now.',l:'Your connected intelligence environment — context, signals, memory and action in one place.',m:'Welcome to the Hub. This is where your intelligence starts compounding.',d:'The Hub is not a dashboard maze. It is the living context layer: what happened, what you learned, what changed and what deserves attention now.',h:'Enter your current intelligence stream and move from insight to action without losing the thread.',n:'Open the intelligence stream.',a:'Enter the Hub →'},
 network:{k:'NayaNET / Your Network',t:'Connect intelligence.',l:'A network designed for meaningful connection between humans, ideas and AI.',m:'You are not entering a feed. You are entering a network that can help you find the right intelligence.',d:'Your Network is about purposeful connection: people, creators, collaborators, ideas and intelligent agents that expand what you can do.',h:'Discover people, intelligence and opportunities that are relevant to your journey.',n:'Explore the living network.',a:'Explore Network →'},
 maxess:{k:'NayaNET / MAXESS',t:'Measure. Master. Become.',l:'A premium intelligence assessment and capability system for your next level.',m:'Let us find your edge — then build it.',d:'MAXESS reveals capability instead of simply giving you a score. Assessment becomes a map for learning, practice and compounding intelligence.',h:'Begin an assessment, discover your current capability and receive a clear next-level path.',n:'Discover your AI capability.',a:'Open MAXESS →'},
 naya:{k:'NayaNET / Naya',t:'I am Naya.',l:'Your intelligent companion inside NayaNET.',m:'Hey, beautiful soul. I am here. You do not need to know where to start.',d:'Tell me what you are trying to create, understand, solve or become. I will help you find the right place, keep the context and carry the intelligence forward.',h:'Start with a conversation. Naya can orient you toward the part of NayaNET that will create the most value now.',n:'Say what matters to you right now.',a:'Begin with Naya →'},
 enter:{k:'NayaNET / Welcome',t:'Welcome to NayaNET.',l:'Create. Connect. Grow with US.',m:'You are in. The network is alive. Naya is with you.',d:'This is not a collection of disconnected pages. It is a living intelligence environment. Choose a direction or begin with Naya and the system will help you move.',h:'Explore NayaPOWER, Power Player, Intelligent Hub, Your Network and MAXESS — all connected through Naya.',n:'Start wherever your curiosity is strongest.',a:'Meet Naya →'}
};
function openWorld(key){const x=data[key]||data.enter;document.getElementById('kicker').textContent=x.k;document.getElementById('worldTitle').textContent=x.t;document.getElementById('worldLead').textContent=x.l;document.getElementById('message').textContent=x.m;document.getElementById('detail').textContent=x.d;document.getElementById('happens').textContent=x.h;document.getElementById('next').textContent=x.n;document.getElementById('primary').textContent=x.a;world.classList.add('open');world.setAttribute('aria-hidden','false');boards.forEach(b=>b.classList.toggle('active',b.dataset.world===key));document.getElementById('close').focus()}
boards.forEach(b=>b.addEventListener('click',()=>openWorld(b.dataset.world)));
document.getElementById('naya').addEventListener('click',()=>openWorld('naya'));
document.getElementById('enter').addEventListener('click',()=>openWorld('enter'));
document.getElementById('close').addEventListener('click',closeWorld);
world.addEventListener('click',e=>{if(e.target===world)closeWorld()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&world.classList.contains('open'))closeWorld()});
function closeWorld(){world.classList.remove('open');world.setAttribute('aria-hidden','true');boards.forEach(b=>b.classList.remove('active'))}
document.getElementById('primary').addEventListener('click',()=>{const t=document.getElementById('worldTitle').textContent;if(t==='Welcome to NayaNET.'||t==='I am Naya.')openWorld('naya')});
</script>
</div>
</body>
</html>
