validation_requirements:
  yaml_parse: REQUIRED
  all_product_sections: "P01-P15 must exist"
  all_narrative_units: "N01-N08 must exist"
  execution_target: E01
  implementation_module: M01
  resolution: "P02 -> E01 -> M01 -> N02"
  no_renumbering: REQUIRED
  no_section_01_modification: REQUIRED
  no_v4_promotion: REQUIRED
  no_smart_notes_deletion: REQUIRED
  no_implementation_owner_change: REQUIRED
  no_authority_broadening: REQUIRED
  registry_references: REQUIRED
  cold_start: REQUIRED

cold_start:
  allowed_read_set:
    - START-HERE.md
    - docs/REPOSITORY-MAP.md
    - docs/NAYA-AUTHORITY-IDENTITY-REGISTRY.yml
  expected_answers:
    WHERE_AM_I: "SoulSchoolAcademy/MaxRESULTS; main is canonical governance/reference; maxess-results-v21-working is active Results engineering."
    WHAT_GOVERNS: "main governance owners, led by NAYA-OS and routed by NAYA-GOVERNANCE-REGISTRY."
    PRODUCT_AUTHORITY: "main:docs/MAXESS-RESULTS-PRODUCT-SPEC.md for product requirements."
    DESIGN_AUTHORITY: "No promoted design authority; V4 is proposed."
    IMPLEMENTATION_AUTHORITY: "active:tools/build_v21_canonical.py for E01/M01."
    MEMORY: "main:docs/NAYA-SMART-NOTES-SYSTEM.md plus main docs/smart-notes/ index/dates."
    HISTORY: "active:docs/MAXESS-SMART-NOTES.md and other explicitly historical material."
    PROPOSED: "V4 and dependent active Golden/Ultimate directives."
    APPROVED: "No global Section 01 product baseline is established by repository evidence; authority and approval are separate states."
    PROTECTED: "E01 Orb + Orbital Bead behavior for the current task only."
    P01: "Naya Arrival / Orientation."
    E01: "Orb / Score Reveal execution target."
    M01: ".v21-score-orb implementation module."
    N01: "Naya Arrival / Hero Reveal."
    N02: "Score Orb + Five Mini-Orbs."
    CURRENT_EXECUTION_TARGET: E01
    MUST_NOT_TOUCH: "Protected E01 Orb/Bead behavior, unrelated active implementation, V4 promotion, Smart Notes deletion/migration, and renumbering."
    NEXT: "Inspect E01 owner and task-specific contract, then execute only the authorized Section 01 work through the Nitro verification loop."
  ambiguity_rule: "If the allowed read set cannot answer a material question, mark UNKNOWN and use the missing owner/routing field rather than infer."

audit:
  implementation_scope: "One new registry file only."
  mutation_scope: "Create this registry on main only. No product implementation, CI, Smart Notes, V4, or active-branch files are changed."
