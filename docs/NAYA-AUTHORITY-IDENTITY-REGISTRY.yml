smart_notes:
  canonical_protocol: "main:docs/NAYA-SMART-NOTES-SYSTEM.md"
  canonical_index: "main:docs/smart-notes/INDEX.md"
  memory_paths:
    main: "main:docs/smart-notes/YYYY-MM-DD.md"
    active: "active:docs/smart-notes/YYYY-MM-DD.md"
  classifications:
    "main:docs/NAYA-SMART-NOTES-SYSTEM.md": PROTOCOL
    "main:docs/smart-notes/INDEX.md": INDEX
    "active:docs/SMART-NOTES.md": IMPLEMENTATION GUIDE
    "active:docs/MAXESS-SMART-NOTES.md": HISTORY
    "dated Smart Notes": MEMORY
  rule: "Smart Notes are memory, not authority. Main protocol governs until a deliberate migration is approved."

v4:
  canonical_location: "main:docs/MAXESS-MASTER-DESIGN-DIRECTIVE-V4.md"
  active_branch_presence: ABSENT
  status: PROPOSED
  authority_state: PROPOSED
  approval_state: PROPOSED
  promote: false
  depends_on:
    - "active:docs/MAXESS-GOLDEN-MASTER-DIRECTIVE.md"
    - "active:docs/MAXESS-ULTIMATE-AI-DESIGN-EXECUTION-DIRECTIVE.md"
  dependency_note: "Golden Master declares V4 as parent authority; Ultimate Directive requires V4 as an input. These are dependency references, not promotion evidence."
  promotion_prerequisites:
    - "Explicit human approval naming V4 as design authority."
    - "Resolved product conflict between 15 product sections and 8 narrative units."
    - "Resolved P09/P10/P13 narrative placement."
    - "Explicit relationship to current Master Contract and product specification."
    - "Validated active-branch availability or an intentional cross-branch routing rule."
    - "No unresolved higher-precedence contradiction."
    - "Documented approval evidence in repository."

protection:
  E01:
    protected:
      - "Orb core behavior"
      - "Orbital Bead behavior"
    protection_scope: "CURRENT TASK ONLY"
    global_baseline: false
    implementation_change_authorized: false

