<!-- ============================================================
  NJ-BRIEFING-STRIP · v1.0.0 · Blessed 05 — Briefing strip
  The Tell-Me-My-Stats strip. ONE line: WHAT + WHY + ONE VERB.
  Factory gap #1 (parts map v1, 2026-10-31): Dashboard, Intel Today,
  Reports all need it; no registry entry or block existed before this.
  Law: ~/workspace/team-nitro/design-gate/RATIFICATION-2026-10-31.md

  IMPORT — three steps, verbatim, never rewritten:
  1. Paste the <style> block once per page (in <head>).
  2. Use the markup pattern wherever a briefing lives.
  3. Paste the <script> block once per page (before </body>).

  MARKUP PATTERN (link — the whole strip is ONE control, Law 13):
  <a class="nj-brief" style="--nj-c:#a06bff;--nj-c-rgb:160,107,255" href="/dashboard">
    <span class="nj-brief-what">825 points to go</span>
    <span class="nj-brief-sep" aria-hidden="true">—</span>
    <span class="nj-brief-why">about 33 wall posts at your pace</span>
    <span class="nj-brief-dot" aria-hidden="true">·</span>
    <span class="nj-brief-verb">See how<span class="nj-brief-arrow" aria-hidden="true">→</span></span>
  </a>

  Action variant (button — same DNA, no destination):
  <button type="button" class="nj-brief" style="--nj-c:#2fe89e;--nj-c-rgb:47,232,158">
    ...same spans...
  </button>

  Own color: --nj-c (verbatim spectrum token) + --nj-c-rgb (same as r,g,b).
  One strip owns ONE color (Law 5). Adjacent strips never share a hue (Law 4).
  Text is ALWAYS white — hierarchy from size/weight, never from color (Law 1).
  States: rest · hover-touch · press · focus-visible.
  ============================================================ -->
<style>
/* ---- NJ-BRIEFING-STRIP v1.0.0 · tokens are verbatim (Law 9) ---- */
.nj-brief{
  --nj-c:#a06bff; --nj-c-rgb:160,107,255; /* own ignition color — override per instance */
  display:flex; align-items:center; flex-wrap:wrap;
  gap:6px 10px; width:100%; box-sizing:border-box;
  min-height:60px; padding:14px 22px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#ffffff; text-decoration:none;
  /* L2 base: sharp obsidian face — NO white top-wash (Shawn's eye, 2026-10-31) */
  background:linear-gradient(180deg,#17171e,#0a0a0f 70%,#050507);
  /* L3 rim: visible white at rest, 1.5px+ (Law 6) */
  border:2px solid rgba(255,255,255,.3); border-radius:18px;
  /* L1 seating shadow + L4 hairline top edge light (DNA: "top edge light") */
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 2px 5px rgba(0,0,0,.7),
    0 12px 28px rgba(0,0,0,.55);
  cursor:pointer; user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:transform .18s cubic-bezier(.2,.9,.25,1),
             box-shadow .25s ease-out, border-color .2s ease-out;
}
/* WHAT — the fact. Bold, largest. White, always. */
.nj-brief-what{
  font-size:16px; font-weight:800; letter-spacing:.01em; line-height:1.35;
  color:#ffffff; white-space:nowrap;
}
/* separators — quiet chrome, never colored */
.nj-brief-sep, .nj-brief-dot{
  color:#ffffff; opacity:.55; font-weight:400; flex:none;
}
/* WHY — why it matters. Regular weight, one step down in size. White, always. */
.nj-brief-why{
  font-size:15px; font-weight:500; line-height:1.35; color:#ffffff;
}
/* VERB — the one action. Bold, own-color arrow that nudges on touch. */
.nj-brief-verb{
  display:inline-flex; align-items:center; gap:6px; flex:none;
  margin-left:auto; padding-left:10px;
  font-size:15px; font-weight:800; letter-spacing:.01em; color:#ffffff;
  white-space:nowrap;
}
.nj-brief-arrow{
  display:inline-block; color:var(--nj-c); font-weight:800;
  transition:transform .18s cubic-bezier(.2,.9,.25,1);
}
/* L3 ALIVE — hover/touch: lifts, rim ignites in OWN color, arrow nudges.
   Text stays white. (Law 6: ignition on touch ONLY.) */
.nj-brief:hover, .nj-brief.nj-demo-hover{
  transform:translateY(-2px);
  border-color:var(--nj-c);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 4px 8px rgba(0,0,0,.6),
    0 16px 32px rgba(0,0,0,.55),
    0 0 22px -4px rgba(var(--nj-c-rgb),.6);
}
.nj-brief:hover .nj-brief-arrow, .nj-brief.nj-demo-hover .nj-brief-arrow{
  transform:translateX(4px);
}
/* PRESS — sinks toward the page, shadow shortens */
.nj-brief:active, .nj-brief.nj-demo-press, .nj-brief.nj-is-pressed{
  transform:translateY(1px);
  transition:transform .1s cubic-bezier(.3,0,.8,.4), box-shadow .12s ease-out;
  box-shadow:
    inset 0 3px 10px rgba(0,0,0,.55),
    0 1px 3px rgba(0,0,0,.6);
}
/* FOCUS — always visible: rim thickens + own-color ring */
.nj-brief:focus{ outline:none; }
.nj-brief:focus-visible, .nj-brief.nj-demo-focus{
  border-color:var(--nj-c);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 2px 5px rgba(0,0,0,.7),
    0 12px 28px rgba(0,0,0,.55),
    0 0 0 3px rgba(var(--nj-c-rgb),.4),
    0 0 24px -2px rgba(var(--nj-c-rgb),.5);
}
/* PHONE — wraps gracefully: the line becomes two, the verb keeps its own
   line and stays tappable. Never clipped, never ellipsized into silence. */
@media (max-width:560px){
  .nj-brief{ padding:12px 16px; border-radius:16px; }
  .nj-brief-what{ font-size:15px; white-space:normal; }
  .nj-brief-why{ font-size:14px; }
  /* separators retire on phone — the wrapped lines read clean without them */
  .nj-brief-sep, .nj-brief-dot{ display:none; }
  .nj-brief-verb{ margin-left:0; padding-left:0; width:100%; }
}
/* Reduced motion: states change instantly, still visible */
@media (prefers-reduced-motion:reduce){
  .nj-brief{ transition:none; }
  .nj-brief:hover, .nj-brief:active{ transform:none; }
  .nj-brief-arrow{ transition:none; }
}
</style>
<script>
/* ---- NJ-BRIEFING-STRIP v1.0.0 · behavior (idempotent) ---- */
(function(){
  if (window.NayaBrief) return;
  /* Touch press state: :active is unreliable on mobile Safari without a
     touch handler — this makes the press sink real on every phone. */
  document.addEventListener("touchstart", function(e){
    var b = e.target && e.target.closest ? e.target.closest(".nj-brief") : null;
    if (b) b.classList.add("nj-is-pressed");
  }, {passive:true});
  document.addEventListener("touchend", function(){
    var ps = document.querySelectorAll(".nj-brief.nj-is-pressed");
    for (var i = 0; i < ps.length; i++) ps[i].classList.remove("nj-is-pressed");
  }, {passive:true});
  document.addEventListener("touchcancel", function(){
    var ps = document.querySelectorAll(".nj-brief.nj-is-pressed");
    for (var i = 0; i < ps.length; i++) ps[i].classList.remove("nj-is-pressed");
  }, {passive:true});
  window.NayaBrief = { version: "1.0.0" };
})();
</script>
