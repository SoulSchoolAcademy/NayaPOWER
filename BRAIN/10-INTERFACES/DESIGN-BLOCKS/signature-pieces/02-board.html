<style>
/* --- VERBATIM HARVEST (do not restyle; compose only) --- */
.intel-board {
  --tone: var(--purple);
  position: relative;
  border: 2px solid color-mix(in srgb, var(--tone) 55%, #fff 14%);
  border-radius: 26px;
  padding: 32px 32px 24px;
  background:
    radial-gradient(720px 240px at 50% -8%, color-mix(in srgb, var(--tone) 14%, transparent), transparent 72%),
    linear-gradient(145deg, var(--bg-raise), var(--bg));
  box-shadow:
    inset 0 1px #ffffff2e,
    0 28px 64px #000000c0,
    0 0 44px color-mix(in srgb, var(--tone) 18%, transparent);
  overflow: hidden;
}

/* Board theme rotation: purple → sapphire → emerald (canonical spectrum order) */
.intel-board.tone-purple  { --tone: var(--purple); }

.intel-board.tone-sapphire { --tone: var(--sapphire); }

.intel-board.tone-emerald { --tone: var(--emerald); }

.intel-board.tone-indigo { --tone: #6675ff; }

.intel-board.tone-forest { --tone: #2e9e6a; }

.intel-board.tone-lime { --tone: #b8ee57; }

.intel-board.tone-gold { --tone: #ffd45a; }

.intel-board.tone-orange { --tone: #ff8c42; }

.intel-board.tone-ruby { --tone: #ff5e6c; }

.intel-board.tone-magenta { --tone: #ed42c4; }

/* Elevated edge light */
.intel-board::before {
  content: ""; position: absolute; left: 10px; top: 18px; bottom: 18px; width: 4px;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--tone), color-mix(in srgb, var(--tone) 70%, #fff 12%), var(--tone));
  box-shadow: 0 0 28px color-mix(in srgb, var(--tone) 55%, transparent);
  pointer-events: none;
}

.intel-board::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, #ffffff08, transparent 22%);
}

.ib-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 14px;
}

.ib-jewel {
  width: 64px; height: 64px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  /* Circular metallic — like a coin/medal, from the deployed original */
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.95), transparent 35%),
    radial-gradient(circle at 70% 75%, rgba(0,0,0,.45), transparent 50%),
    radial-gradient(circle at 50% 50%, var(--tone), color-mix(in srgb, var(--tone) 55%, #000) 85%);
  border: 2px solid rgba(255,255,255,.4);
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.6),
    inset 0 -4px 12px rgba(0,0,0,.5),
    0 0 28px color-mix(in srgb, var(--tone) 65%, transparent),
    0 10px 24px rgba(0,0,0,.6);
  /* The board icon lights up — breathing glow (Shawn 2026-10-20) */
  animation: jewelBreathe 4s ease-in-out infinite;
}

@keyframes jewelBreathe {
  0%, 100% { box-shadow: inset 0 2px 4px rgba(255,255,255,.6), inset 0 -4px 12px rgba(0,0,0,.5), 0 0 28px color-mix(in srgb, var(--tone) 65%, transparent), 0 10px 24px rgba(0,0,0,.6); }
  50% { box-shadow: inset 0 2px 4px rgba(255,255,255,.6), inset 0 -4px 12px rgba(0,0,0,.5), 0 0 46px color-mix(in srgb, var(--tone) 95%, transparent), 0 10px 24px rgba(0,0,0,.6); }
}

.ib-kind { font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--tone); }

.ib-id { font-size: 13px; color: var(--muted); letter-spacing: .06em; }

.ib-truth {
  margin-left: auto; font-size: 12px; font-weight: 800; letter-spacing: .1em;
  color: var(--emerald); border: 1px solid color-mix(in srgb, var(--emerald) 40%, transparent);
  background: color-mix(in srgb, var(--emerald) 8%, transparent);
  padding: 7px 11px; border-radius: 999px;
}

.ib-title {
  color: var(--ink); font-size: clamp(24px, 2.8vw, 32px); line-height: 1.12;
  letter-spacing: -0.01em; margin: 0 0 20px; font-weight: 800;
  text-wrap: balance;
}

.ib-subtitle{font-size:18px;color:#f2f2f6;text-align:center;margin:6px 0 2px;font-weight:500;letter-spacing:.02em;line-height:1.4}
</style>

<!-- SPECIMEN-START -->
<article class="intel-board tone-purple">
  <div class="ib-head"><div class="ib-jewel">{{jewel_glyph}}</div>
    <div><div class="ib-kind">{{kind}}</div><h2 class="ib-title">{{title}}</h2></div>
    <span class="ib-truth">{{truth_state}}</span></div>
  <div class="ib-subtitle">&ldquo;{{quote}}&rdquo;</div>
</article>
