<style>
/* --- VERBATIM HARVEST (do not restyle; compose only) --- */
/* ============ HERO BUTTONS — .living-btn (Shawn-approved) ============ */
.hero-buttons { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }

.living-btn {
  position: relative; overflow: hidden; cursor: pointer; border: none;
  font-family: Inter, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: .12em;
  color: #fff; padding: 22px 44px; border-radius: 999px; min-width: 300px;
  background: linear-gradient(180deg, #17171c 0%, #050505 55%, #0a0a0e 100%);
  box-shadow:
    inset 0 0 0 1.7px rgba(255,255,255,.92),
    inset 0 2px 6px rgba(255,255,255,.22),
    inset 0 -8px 18px rgba(0,0,0,.75),
    0 14px 40px rgba(0,0,0,.6),
    0 4px 14px rgba(0,0,0,.5);
  transition: transform .28s var(--ease), box-shadow .28s var(--ease);
  animation: idleBreathe 4.2s ease-in-out infinite;
}

.living-btn .btn-glow { position: absolute; inset: -2px; border-radius: 999px; opacity: .55; pointer-events: none; transition: opacity .3s; }

.living-btn[data-spectrum="magenta"] .btn-glow { box-shadow: 0 0 34px 4px rgba(232,79,255,.5), inset 0 0 22px rgba(232,79,255,.28); }

.living-btn[data-spectrum="purple"] .btn-glow { box-shadow: 0 0 34px 4px rgba(160,107,255,.5), inset 0 0 22px rgba(160,107,255,.28); animation-delay: 1.4s; }

.living-btn[data-spectrum="blue"] .btn-glow { box-shadow: 0 0 34px 4px rgba(63,184,255,.5), inset 0 0 22px rgba(63,184,255,.28); animation-delay: 2.8s; }

.living-btn::after {
  content: ""; position: absolute; top: -20%; bottom: -20%; width: 46%; left: -70%;
  background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.34) 50%, transparent 80%);
  transform: skewX(-18deg); pointer-events: none;
  animation: sweep 5.5s var(--ease) infinite;
}

.living-btn[data-spectrum="purple"]::after { animation-delay: 1.8s; }

.living-btn[data-spectrum="blue"]::after { animation-delay: 3.6s; }

.living-btn:hover { transform: translateY(-4px) scale(1.025); animation: none; }

.living-btn[data-spectrum="magenta"]:hover { box-shadow: inset 0 0 0 2px var(--magenta), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(232,79,255,.4), 0 6px 18px rgba(0,0,0,.5); }

.living-btn[data-spectrum="purple"]:hover { box-shadow: inset 0 0 0 2px var(--purple), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(160,107,255,.4), 0 6px 18px rgba(0,0,0,.5); }

.living-btn[data-spectrum="blue"]:hover { box-shadow: inset 0 0 0 2px var(--blue), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(63,184,255,.4), 0 6px 18px rgba(0,0,0,.5); }

.living-btn:hover .btn-glow { opacity: 1; }

.living-btn:active { transform: translateY(1px) scale(.975); transition-duration: .08s; }

.living-btn .btn-label { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 12px; }

.living-btn .btn-label svg { width: 20px; height: 20px; }

 .living-btn { min-width: 100%; }

 .living-btn, .living-btn::after { animation: none; }

.trinity{display:flex; gap:16px; justify-content:center; align-items:stretch; margin:34px auto 0; flex-wrap:wrap; max-width:1020px;}

.naya-btn{
  --nb-accent:#8a5cff;
  --nb-accent-rgb:138,92,255;
  position:relative; isolation:isolate; overflow:hidden;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
   padding:0 28px; border-radius:999px;
  border:1.5px solid #F8F7FB; /* Law 6: white light at rest, never faint */
  font-family:var(--ui); font-size:15px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:#f6f5ef; cursor:pointer; white-space:nowrap;
  text-shadow:0 -1px 1px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.6);
  background:
    linear-gradient(180deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.015) 38%,rgba(0,0,0,.18) 100%),
    linear-gradient(180deg,#2a2b33 0%,#0c0c0f 52%,#030304 100%);
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.38),
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -1px 0 rgba(0,0,0,.72),
    inset 0 -14px 26px rgba(0,0,0,.52),
    inset 0 10px 18px rgba(255,255,255,.04),
    0 20px 42px rgba(0,0,0,.84),
    0 6px 14px rgba(0,0,0,.58);
  transition:transform .22s var(--ease),box-shadow .38s var(--ease),border-color .3s ease,background .3s ease;
  animation:naya-breathe 7s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
}

.naya-btn::before{ /* cursor proximity sheen — quiet, follows --mx/--my */
  content:""; position:absolute; inset:0; border-radius:inherit; z-index:0; pointer-events:none; opacity:0; transition:opacity .4s ease;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),rgba(255,255,255,.03) 42%,transparent 68%);
}

.naya-btn::after{ /* machined edge fire — 5% only, ignites on hover/focus */
  content:""; position:absolute; inset:-1px; border-radius:inherit; z-index:2; pointer-events:none; opacity:0; transition:opacity .28s ease;
  box-shadow:inset 0 0 0 1.5px rgba(var(--nb-accent-rgb),.92),0 0 18px -2px rgba(var(--nb-accent-rgb),.55),0 0 42px -8px rgba(var(--nb-accent-rgb),.35);
}

.naya-btn > *{position:relative; z-index:3;}

.naya-btn .nb-icon{width:18px;height:18px;flex:none;display:grid;place-items:center;font-size:16px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));}

.naya-btn .nb-label{letter-spacing:.11em;}

/* AWARE — cursor is near (JS adds .is-aware within ~140px) */
.naya-btn.is-aware{
  animation:none;
  border-color:rgba(238,236,228,.12);
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.58),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.70),
    inset 0 -14px 26px rgba(0,0,0,.46),
    inset 0 10px 18px rgba(255,255,255,.07),
    0 0 0 1px rgba(var(--nb-accent-rgb),.14),
    0 24px 48px rgba(0,0,0,.86),
    0 8px 18px rgba(0,0,0,.60);
  transform:translateY(-1px);
}

.naya-btn.is-aware::before{opacity:.75;}

/* IGNITED — hover / focus-visible */
.naya-btn:hover,.naya-btn:focus-visible{
  animation:none; transform:translateY(-3px) scale(1.012);
  border-color:rgb(var(--nb-accent-rgb));
  box-shadow:
    inset 0 0 0 1.5px rgb(var(--nb-accent-rgb)),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(0,0,0,.66),
    inset 0 -14px 26px rgba(0,0,0,.42),
    0 0 38px rgba(var(--nb-accent-rgb),.85),
    0 30px 56px rgba(0,0,0,.88),
    0 10px 20px rgba(0,0,0,.62);
}

.naya-btn:hover::before,.naya-btn:focus-visible::before{opacity:1;}

.naya-btn:hover::after,.naya-btn:focus-visible::after{opacity:1;}

.naya-btn:focus-visible{outline:2px solid rgba(255,255,255,.92); outline-offset:3px;}

.naya-btn:active{
  transform:translateY(1px) scale(.975) !important;
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.48),
    inset 0 3px 12px rgba(0,0,0,.82),
    inset 0 -4px 10px rgba(0,0,0,.55),
    0 10px 22px rgba(0,0,0,.78);
  transition-duration:.08s;
}

.naya-btn:active::after{opacity:.65;}

.naya-btn:disabled,.naya-btn[aria-disabled="true"]{
  opacity:.42; cursor:not-allowed; animation:none; transform:none !important;
  box-shadow:inset 0 0 0 1px rgba(238,236,228,.22),inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px rgba(0,0,0,.6);
}

.naya-btn:disabled::after,.naya-btn[aria-disabled="true"]::after{opacity:0 !important;}

/* Variants — same DNA, different jobs */
.naya-btn--primary{--nb-accent:#8a5cff;--nb-accent-rgb:138,92,255;}

.naya-btn--secondary{
  --nb-accent:#e8e6df;--nb-accent-rgb:232,230,223;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 40%,rgba(0,0,0,.14)),linear-gradient(180deg,#1e1f26 0%,#0a0a0d 55%,#050506 100%);
  color:#eceade;
}

.naya-btn--ghost{
  --nb-accent:#ffffff;--nb-accent-rgb:255,255,255;
  background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 55%),rgba(255,255,255,.015);
  box-shadow:inset 0 0 0 1px rgba(238,236,228,.26),inset 0 1px 0 rgba(255,255,255,.22),0 14px 30px rgba(0,0,0,.55);
  animation:naya-breathe-ghost 8s ease-in-out infinite;
}

.naya-btn--ghost.is-aware{box-shadow:inset 0 0 0 1px rgba(238,236,228,.48),inset 0 1px 0 rgba(255,255,255,.32),0 18px 36px rgba(0,0,0,.62);}

.naya-btn--ghost:hover,.naya-btn--ghost:focus-visible{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 55%),rgba(255,255,255,.03);}

.naya-btn--danger{--nb-accent:#ff4d5e;--nb-accent-rgb:255,77,94;
  background:linear-gradient(180deg,rgba(255,77,94,.10),rgba(255,255,255,.01) 42%,rgba(0,0,0,.20)),linear-gradient(180deg,#2e2226 0%,#12090c 54%,#050304 100%);}

.naya-btn--icon{
  width:52px; min-width:52px; padding:0; border-radius:999px;
}

.naya-btn--icon.naya-btn--sm{width:44px;min-width:44px;}

.naya-btn--sm{padding:0 20px;font-size:13px;letter-spacing:.12em;}

.naya-btn--lg{padding:0 36px;font-size:16px;}

.naya-btn--block{width:100%;}

/* Selected state — one treatment for every .naya-btn toggle */
.naya-btn[aria-pressed="true"]{
  animation:none;
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.60),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.68),
    inset 0 -14px 26px rgba(0,0,0,.44),
    inset 0 10px 18px rgba(255,255,255,.06),

    0 0 30px -10px rgba(var(--nb-accent-rgb),.55),
    0 28px 54px rgba(0,0,0,.86),
    0 8px 18px rgba(0,0,0,.60);
}

.naya-btn[aria-pressed="true"]::after{opacity:1;}

.naya-btn--foundation .nb-sub{font-family:var(--ui); font-size:12px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; line-height:1.3; opacity:.74;}

}

.naya-btn.naya-btn--foundation-light:hover,.naya-btn.naya-btn--foundation-light:focus-visible{

.naya-btn.naya-btn--foundation-soul{

.naya-btn{animation:none !important;}
