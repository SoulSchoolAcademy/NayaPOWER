<!-- Smart Block specimen: pulse-rings -->
<!-- Rings: messages (fast) / blocks (mid) / shares (slow). Center: events today. -->
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="pulse-rings.css">
<div class="sg-card lit" style="max-width:420px">
  <h4>NayaNET heartbeat</h4>
  <div class="c-sub">Automatic · live</div>
  <div class="pr-stage">
    <div class="pr-ring" style="--rc:var(--gold);--rcrgb:var(--gold-rgb);--pd:6s;animation-delay:0s"></div>
    <div class="pr-ring" style="--rc:var(--blue);--rcrgb:var(--blue-rgb);--pd:4.5s;animation-delay:1.5s"></div>
    <div class="pr-ring" style="--rc:var(--purple);--rcrgb:var(--purple-rgb);--pd:3s;animation-delay:.7s"></div>
    <div class="pr-core">
      <span class="pr-num">1,204</span>
      <span class="pr-label">events today</span>
    </div>
  </div>
  <div class="pr-keys">
    <span><i style="--kc:var(--purple)"></i>Messages</span>
    <span><i style="--kc:var(--blue)"></i>Blocks</span>
    <span><i style="--kc:var(--gold)"></i>Shares</span>
  </div>
  <div class="sg-foot"><span>Ring pace = event rate</span><span>SAMPLE DATA</span></div>
</div>
