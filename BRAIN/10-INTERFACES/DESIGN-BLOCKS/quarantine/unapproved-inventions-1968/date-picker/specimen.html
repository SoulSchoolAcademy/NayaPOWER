<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date Picker — Smart Block Specimen</title>
<link rel="stylesheet" href="date-picker.css">
<style>
  body{ background:#050507; color:#F8F7FB; font-family:-apple-system,"SF Pro Text",Inter,sans-serif;
        margin:0; padding:48px 20px; min-height:100vh; }
  .wrap{ max-width:640px; margin:0 auto; }
  h1{ font-size:24px; font-weight:800; margin:0 0 8px; }
  .sub{ font-size:14px; color:rgba(248,247,251,.55); margin:0 0 40px; }
  .demo{ margin-bottom:56px; }
  .cap{ font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:1.2px;
        color:rgba(248,247,251,.55); margin:0 0 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Smart Block · forms/date-picker</h1>
  <p class="sub">Tap the trigger to open the obsidian calendar. Arrows move, Enter selects, Escape closes.</p>

  <div class="demo">
    <p class="cap">Empty state</p>
    <div class="dp-root">
      <button class="dp-trigger" aria-haspopup="dialog" aria-expanded="false">
        <span class="dp-label dp-empty">Select a date</span>
        <svg class="dp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M3 10h18M8 3v4M16 3v4"/>
        </svg>
      </button>
      <div class="dp-popup" role="dialog" aria-label="Choose a date">
        <div class="dp-head">
          <div class="dp-nav"><button data-dp-prev aria-label="Previous month">‹</button></div>
          <div class="dp-month">October 2026</div>
          <div class="dp-nav"><button data-dp-next aria-label="Next month">›</button></div>
        </div>
        <div class="dp-week">
          <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
        </div>
        <div class="dp-grid"></div>
      </div>
    </div>
  </div>

  <div class="demo">
    <p class="cap">Pre-selected state</p>
    <div class="dp-root">
      <button class="dp-trigger" aria-haspopup="dialog" aria-expanded="false">
        <span class="dp-label">October 9, 2026</span>
        <svg class="dp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M3 10h18M8 3v4M16 3v4"/>
        </svg>
      </button>
      <div class="dp-popup" role="dialog" aria-label="Choose a date">
        <div class="dp-head">
          <div class="dp-nav"><button data-dp-prev aria-label="Previous month">‹</button></div>
          <div class="dp-month">October 2026</div>
          <div class="dp-nav"><button data-dp-next aria-label="Next month">›</button></div>
        </div>
        <div class="dp-week">
          <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
        </div>
        <div class="dp-grid"></div>
      </div>
    </div>
  </div>
</div>
<script src="date-picker.js"></script>
</body>
</html>
