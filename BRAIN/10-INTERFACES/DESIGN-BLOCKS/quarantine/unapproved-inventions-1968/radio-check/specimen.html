<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio + Check — Smart Block Specimen</title>
<link rel="stylesheet" href="radio-check.css">
<style>
  body{ background:#050507; color:#F8F7FB; font-family:-apple-system,"SF Pro Text",Inter,sans-serif;
        margin:0; padding:48px 20px; min-height:100vh; }
  .wrap{ max-width:560px; margin:0 auto; }
  h1{ font-size:24px; font-weight:800; margin:0 0 8px; }
  .sub{ font-size:14px; color:rgba(248,247,251,.55); margin:0 0 40px; }
  .demo{ margin-bottom:48px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Smart Block · forms/radio-check</h1>
  <p class="sub">Native inputs — keyboard, click, and screen readers all work. Tab through to see the focus rings.</p>

  <div class="demo">
    <fieldset class="rc-group" style="border:none;padding:0;margin:0;">
      <p class="rc-grouplabel">Power mode</p>
      <label class="rc-row rc-radio">
        <input type="radio" name="power" checked>
        <span class="rc-box" aria-hidden="true"></span>
        <span class="rc-text">
          <span class="rc-label">Deep Focus</span>
          <span class="rc-detail">Single task, distractions silenced for 90 minutes.</span>
        </span>
      </label>
      <label class="rc-row rc-radio">
        <input type="radio" name="power">
        <span class="rc-box" aria-hidden="true"></span>
        <span class="rc-text">
          <span class="rc-label">Flow</span>
          <span class="rc-detail">Balanced pace with gentle nudges between tasks.</span>
        </span>
      </label>
      <label class="rc-row rc-radio">
        <input type="radio" name="power">
        <span class="rc-box" aria-hidden="true"></span>
        <span class="rc-text">
          <span class="rc-label">Sprint</span>
          <span class="rc-detail">Maximum intensity, short bursts, full telemetry.</span>
        </span>
      </label>
    </fieldset>
  </div>

  <div class="demo">
    <fieldset class="rc-group" style="border:none;padding:0;margin:0;">
      <p class="rc-grouplabel">Notifications</p>
      <label class="rc-row rc-check">
        <input type="checkbox" checked>
        <span class="rc-box" aria-hidden="true"></span>
        <span class="rc-text">
          <span class="rc-label">Smart summaries</span>
          <span class="rc-detail">One distilled digest instead of every ping.</span>
        </span>
      </label>
      <label class="rc-row rc-check">
        <input type="checkbox">
        <span class="rc-box" aria-hidden="true"></span>
        <span class="rc-text">
          <span class="rc-label">Achievement chimes</span>
          <span class="rc-detail">A soft tone when a goal milestone lands.</span>
        </span>
      </label>
      <label class="rc-row rc-check">
        <input type="checkbox">
        <span class="rc-box" aria-hidden="true"></span>
        <span class="rc-text">
          <span class="rc-label">Quiet hours</span>
          <span class="rc-detail">Nothing after 10pm unless it's urgent.</span>
        </span>
      </label>
    </fieldset>
  </div>
</div>
<script src="radio-check.js"></script>
</body>
</html>
