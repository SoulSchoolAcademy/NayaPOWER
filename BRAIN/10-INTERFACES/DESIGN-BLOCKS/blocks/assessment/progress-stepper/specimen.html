<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Block: progress-stepper</title>
<link rel="stylesheet" href="progress-stepper.css">
<style>
/* SPECIMEN ONLY — page ground + tokens normally provided by tokens.css */
:root{
  --bg:#020204;--surface:#09090d;
  --text:#f8f7fb;--muted:#aaa7b3;
  --purple:#8a5cff;--purple2:#b895ff;
  --line:rgba(255,255,255,.11);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html,body{margin:0;padding:0}
body{background:#020204;color:#f8f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:48px 20px;box-sizing:border-box}
.demo{width:min(680px,100%)}
.demo-note{font-size:12px;color:#aaa7b3;margin:0 0 18px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="demo">
  <p class="demo-note">SPECIMEN — markup verbatim from the source body. The fill width is set by JS in the source (style="width:7%" added here for the demo).</p>

  <div
    class="progress-hud"
    id="progressHud"
    aria-label="Assessment progress"
    aria-live="polite"
  >

    <div class="progress-location">
      <span class="progress-dot"></span>
      <span
        class="progress-label"
        id="progressLabel"
      >
        QUESTION 1 OF 15
      </span>
    </div>

    <div
      class="progress-track"
      aria-hidden="true"
    >
      <span
        class="progress-fill"
        id="progressFill"
        style="width:7%"
      ></span>
    </div>

    <span
      class="progress-percent"
      id="progressPercent"
    >
      7%
    </span>

  </div>
</div>
</body>
</html>
