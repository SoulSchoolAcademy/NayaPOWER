<!-- Smart Block specimen: assessment/interest-picker -->
<div class="interest-intro">
  <div class="interest-eyebrow">ONE LAST THING</div>
  <h2 class="interest-title">Where should intelligence show up for you?</h2>
  <p class="interest-description">Choose anything that interests you. There are no wrong answers.</p>
</div>
<div class="interest-board">
  <button type="button" class="interest-area" style="--interest:#8a5cff" aria-pressed="true">
    <span class="interest-orb" aria-hidden="true"><span class="interest-check">✓</span></span>
    <span class="interest-name">Deep work</span>
    <span class="interest-description">Focus sessions, distilled briefs.</span>
  </button>
  <button type="button" class="interest-area" style="--interest:#35e39b" aria-pressed="false">
    <span class="interest-orb" aria-hidden="true"><span class="interest-check">✓</span></span>
    <span class="interest-name">Health</span>
    <span class="interest-description">Signals from your own body.</span>
  </button>
</div>
<div class="selected-interests">
  <span class="interest-pill">Deep work</span>
</div>
<div class="interest-actions">
  <button type="button" class="interest-skip">Skip this step</button>
</div>
