<!-- Smart Block specimen: assessment/answer -->
<div class="answers" role="group" aria-label="Answer choices">
  <button type="button" class="answer" style="--accent:#8a5cff" aria-pressed="false">
    <span class="jewel" aria-hidden="true"><span class="glyph">◆</span></span>
    <span class="answer-copy">
      <span class="answer-title">Score it first</span>
      <span class="answer-sub">Run the value calculus before touching anything.</span>
    </span>
    <span class="chevron" aria-hidden="true">›</span>
  </button>
  <button type="button" class="answer" style="--accent:#35e39b" aria-pressed="true">
    <span class="jewel" aria-hidden="true"><span class="glyph">✦</span></span>
    <span class="answer-copy">
      <span class="answer-title">Build the smallest thing</span>
      <span class="answer-sub">One verified rung beats ten promised ones.</span>
    </span>
    <span class="chevron" aria-hidden="true">›</span>
  </button>
</div>
