<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Block specimen: chat/sp-audio-msg</title>
<link rel="stylesheet" href="block.css">
<style>
  body{ background:#050507; color:#e8eaf2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:32px 20px; }
  .demo{ max-width:560px; margin:0 auto; }
  .demo h2{ font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:#8a8a96; margin:28px 0 12px; }
  .demo h2:first-child{ margin-top:0; }
  .hint{ font-size:12px; color:#5b5f6e; margin-top:6px; }
</style>
</head>
<body>
<div class="demo">
  <h2>Purple accent (#7c3aed)</h2>
  <div id="a1"></div>
  <h2>Blue accent (#1e6fd9) — longer clip</h2>
  <div id="a2"></div>
  <h2>Green accent (#0d9e6f) — short clip</h2>
  <div id="a3"></div>
  <p class="hint">No audio file is attached; the play button emits a short synthesized tone (specimen wiring only) so the toggle can be seen.</p>
</div>
<script src="block.js"></script>
<script>
  /* Specimen-only wiring: synthesize a short tone so the play toggle is visible. */
  var AC = null;
  function blip(){
    try{
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = 440;
      g.gain.setValueAtTime(0.15, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.5);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + 0.5);
    }catch(e){}
  }
  document.getElementById('a1').appendChild(spAudioMsg({label:'0:24', accent:'#7c3aed', onPlay: blip}));
  document.getElementById('a2').appendChild(spAudioMsg({label:'1:03', accent:'#1e6fd9', onPlay: blip}));
  document.getElementById('a3').appendChild(spAudioMsg({label:'0:07', accent:'#0d9e6f', onPlay: blip}));
</script>
</body>
</html>
