<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Block specimen: chat/sp-chat</title>
<link rel="stylesheet" href="block.css">
<style>
  body{ background:#050507; color:#e8eaf2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:32px 20px; }
  .demo{ max-width:560px; margin:0 auto; }
  .demo h2{ font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:#8a8a96; margin:34px 0 12px; }
  .demo h2:first-child{ margin-top:0; }
  #postlog{ margin-top:10px; font-size:13px; color:#9aa3b5; }
</style>
</head>
<body>
<div class="demo">
  <h2>Message list</h2>
  <div id="list1"></div>

  <h2>Chat composer (text input + mic + send)</h2>
  <div id="comp1"></div>

  <h2>Post composer (from posts tab)</h2>
  <div id="comp2"></div>
  <div id="postlog"></div>

  <h2>Empty state</h2>
  <div id="list2"></div>
</div>
<script src="block.js"></script>
<script>
  var ACCENT = '#7c3aed';
  var now = Date.now();
  var msgs = [
    {name:'Naya', color:'#7c3aed', text:'Welcome to Design Space. This is the sp-chat message list, extracted from the Smart Spaces page.', ts: now - 1000*60*62},
    {name:'Shawn', color:'#1e6fd9', text:'Clean. The bubbles, the timestamps, the little avatars — it all carries over.', ts: now - 1000*60*24},
    {name:'Naya 4', color:'#0d9e6f', text:'Verified against the source builder. Same classes, same structure.', ts: now - 1000*60*3},
    {name:'Shawn', color:'#1e6fd9', audioLabel:'0:12', text:'Quick voice note to go with it.'}
  ];
  var list1 = spChatList(msgs, {accent: ACCENT});
  document.getElementById('list1').appendChild(list1);
  setTimeout(function(){ list1.scrollTop = list1.scrollHeight; }, 60);

  document.getElementById('comp1').appendChild(spChatComposer({
    name: 'Design Space', accent: ACCENT,
    onSend: function(t){
      spChatAppend(list1, {name:'You', color:'#d4a017', text:t, ts:Date.now()}, {accent:ACCENT});
    },
    onMic: function(btn){
      btn.classList.toggle('rec');
      setTimeout(function(){ btn.classList.remove('rec'); }, 1200);
    }
  }));

  document.getElementById('comp2').appendChild(spPostComposer({
    placeholder: 'Share something with Design Space…',
    onPost: function(t, sched){
      var log = document.getElementById('postlog');
      var row = document.createElement('div');
      row.textContent = (sched ? '⏱ Scheduled post: ' : '📝 Posted: ') + t;
      log.appendChild(row);
    }
  }));

  document.getElementById('list2').appendChild(spChatList([], {accent: ACCENT}));
</script>
</body>
</html>
