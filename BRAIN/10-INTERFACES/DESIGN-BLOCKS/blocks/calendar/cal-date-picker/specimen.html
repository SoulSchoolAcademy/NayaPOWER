<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Block specimen: calendar/cal-date-picker</title>
<link rel="stylesheet" href="block.css">
<style>
  body{ background:#050507; color:#e8eaf2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:32px 20px; }
  .demo{ max-width:560px; margin:0 auto; }
  .demo h2{ font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:#8a8a96; margin:34px 0 12px; }
  .demo h2:first-child{ margin-top:0; }
  .demo-note{ font-size:12px; color:#9aa3b5; margin:6px 0 12px; }
  .demo-ctl button{ font:inherit; font-size:12px; letter-spacing:.06em; color:#e8eaf2; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:8px 16px; margin:0 8px 8px 0; cursor:pointer; }
  .demo-ctl button:hover{ border-color:#a06bff; box-shadow:0 0 18px -4px rgba(160,107,255,.7); }
</style>
</head>
<body>
<div class="demo">
  <h2>Date picker</h2>
  <div class="cal cal-pick">
    <button class="cal-trigger" id="dpTrig" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <span class="ph" id="dpLabel">Choose a date</span>
    </button>
    <div class="cal-drop" id="dpDrop" role="dialog" aria-label="Choose a date" hidden>
      <div class="cal-drop-head">
        <h3>October 2026</h3>
      </div>
      <div class="cal-mini" id="dpGrid" role="grid" aria-label="October 2026">
        <span class="wd">M</span><span class="wd">T</span><span class="wd">W</span><span class="wd">T</span><span class="wd">F</span><span class="wd">S</span><span class="wd">S</span>
      </div>
      <p class="cal-tz">Calendar date only — no timezone is assumed or stored.</p>
    </div>
  </div>
</div>
<script src="block.js"></script>
</body>
</html>
