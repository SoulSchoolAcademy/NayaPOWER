<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Block: orb-ctx-card</title>
<link rel="stylesheet" href="orb-ctx-card.css">
<style>
/* SPECIMEN ONLY — page ground + tokens normally provided by tokens.css */
:root {
  /* The field — the world. Deep, never gray. */
  --field: #050507;
  --obsidian: #0B0D12;
  --raise: #10141d;
  --card: #141a28;
  --deep: #0a0e16;

  /* The light — text 99% of the time. Every idle rim. */
  --white: #F8F7FB;
  --ink: #F5F7FB;
  --quiet: rgba(248,247,251,.72);
  --secondary: rgba(248,247,251,.55);
  --line: rgba(255,255,255,.12);

  /* The soul — chrome accent. Naya's presence. Never a flood. */
  --soul: #a06bff;

  /* The spectrum — in law order. Richest first, ultra-rich magenta leading. */
  --magenta: #e84fff;  /* The living edge. Leads every flow. */
  --purple: #a06bff;   /* Choosing intelligence. The soul. */
  --blue: #3fb8ff;     /* Knowledge moving. */
  --green: #2fe89e;    /* Alive and well. */
  --gold: #ffbf3d;     /* Attention, earned. */

  /* Spectrum RGB triplets — for rgba() glows */
  --magenta-rgb: 232,79,255;
  --purple-rgb: 160,107,255;
  --blue-rgb: 63,184,255;
  --green-rgb: 47,232,158;
  --gold-rgb: 255,191,61;

  /* Extended family */
  --teal: #40d3bb;
  --teal-rgb: 64,211,187;
  --coral: #ff5e6c;
  --coral-rgb: 255,94,108;
  --lime: #b8ee57;
  --lime-rgb: 184,238,87;
  --indigo: #6675ff;
  --indigo-rgb: 102,117,255;

  /* Truth states */
  --verified: #2fe89e;
  --verified-rgb: 47,232,158;
  --claim: #ffbf3d;
  --claim-rgb: 255,191,61;
  --demo: #e84fff;
  --demo-rgb: 232,79,255;

  /* Motion */
  --ease: cubic-bezier(.22,1,.36,1);
  --snap: cubic-bezier(.32,.72,0,1);

  /* Elevation */
  --lift: 0 18px 50px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.4);
  --ring: 0 0 0 2px rgba(160,107,255,.35);

  /* Radii */
  --r-sm: 11px;
  --r-md: 13px;
  --r-lg: 18px;
  --r-xl: 26px;
  --r-pill: 999px;

  /* Type scale — size separates, color doesn't */
  --type-display: 64px;
  --type-chapter: 40px;
  --type-headline: 24px;
  --type-body: 18px;
  --type-small: 14px;
}
body { background:#050507; color:#F8F7FB; font-family:system-ui,-apple-system,sans-serif; padding:48px 32px; min-height:100vh; }
.sb-note { max-width:760px; margin:0 0 32px; padding:16px 20px; border:1px dashed rgba(255,255,255,.25); border-radius:12px; font-size:13px; color:rgba(255,255,255,.65); }
.sb-note b { color:#fff; }
</style>
</head>
<body>
<div class="sb-note"><b>Smart Block: orb-ctx-card</b> &mdash; specimen. Block CSS is byte-true from <i>Naya Jewel Library - N5.html</i>. Requires <b>tokens.css</b>, orbs/orb.</div>
<div class="orb-context">
  <div class="orb-ctx-card">
    <h4><span class="orb orb--sm" style="--oc:#a06bff;--oc-rgb:160,107,255"></span>Section marks</h4>
    <p style="margin:0;font-size:15px">A 56px orb beside a heading turns a title into a destination. One color per section, in spectrum order.</p>
  </div>
  <div class="orb-ctx-card">
    <h4>Bullets</h4>
    <ul class="orb-bullet-list">
      <li><span class="orb orb--xs" style="--oc:#e84fff;--oc-rgb:232,79,255"></span>Every list item earns its light</li>
    </ul>
  </div>
</div>

</body>
</html>
