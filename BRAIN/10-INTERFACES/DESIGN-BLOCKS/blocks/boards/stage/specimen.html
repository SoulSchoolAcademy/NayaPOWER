<!-- Smart Block specimen: stage -->
<!-- Source: Naya_Lego-blocks.html -->
<div class="stage">
    <span class="stage-label">Live demo</span>
    <style>
      .nl-field{max-width:440px;margin:0 auto 18px}
      .nl-field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;color:var(--ink)}
      .nl-field .req{color:var(--magenta)}
      .nl-well{position:relative;display:flex;align-items:center;gap:10px;border-radius:16px;padding:0 16px;
        background:linear-gradient(180deg,#040406,#0a0b0f);
        border:1px solid rgba(255,255,255,.10);
        box-shadow:inset 0 3px 10px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(0,0,0,.5);
        transition:border-color .22s var(--ease),box-shadow .25s var(--ease)}
      .nl-well .icon{color:var(--quiet);flex:none;transition:color .2s}
      .nl-well input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font:500 16px/1.5 inherit;padding:15px 0;min-width:0}
      .nl-well input::placeholder{color:#5c5a66}
      .nl-field:focus-within .nl-well{border-color:rgba(228,85,244,.65);box-shadow:inset 0 3px 10px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(228,85,244,.35),0 0 24px -4px rgba(228,85,244,.55)}
      .nl-field:focus-within .icon{color:var(--magenta)}
      .nl-hint{font-size:13.5px;color:var(--quiet);margin-top:8px}
      .nl-field.err .nl-well{border-color:rgba(255,107,107,.7);box-shadow:inset 0 3px 10px rgba(0,0,0,.85),0 0 0 1px rgba(255,107,107,.3),0 0 22px -6px rgba(255,107,107,.6)}
      .nl-field.err .nl-msg{color:var(--error)}
      .nl-field.ok .nl-well{border-color:rgba(52,211,138,.6);box-shadow:inset 0 3px 10px rgba(0,0,0,.85),0 0 0 1px rgba(52,211,138,.3),0 0 22px -6px rgba(52,211,138,.5)}
      .nl-field.ok .nl-msg{color:var(--green)}
      .nl-msg{font-size:13.5px;margin-top:8px;min-height:22px;color:var(--quiet)}
      .nl-well input:disabled{color:#6a6875;cursor:not-allowed}
      .nl-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
      .nl-state-demo{font-size:13px;color:var(--quiet);text-align:center;margin-top:14px}
    </style>
    <div class="nl-field" id="demo-email-wrap">
      <label for="demo-email">Email address <span class="req">*</span></label>
      <div class="nl-well">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
        <input id="demo-email" type="email" placeholder="you@nayanet.live" autocomplete="email">
      </div>
      <div class="nl-msg" id="demo-email-msg">We'll only use this to reach you about your app.</div>
    </div>
    <div class="nl-row">
      <div class="nl-field" style="max-width:300px;margin:0">
        <label for="demo-disabled">Disabled</label>
        <div class="nl-well"><input id="demo-disabled" type="text" value="Locked value" disabled></div>
      </div>
    </div>
