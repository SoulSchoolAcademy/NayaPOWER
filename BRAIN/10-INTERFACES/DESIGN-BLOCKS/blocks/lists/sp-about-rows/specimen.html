<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Block specimen: lists/sp-about-rows</title>
<link rel="stylesheet" href="block.css">
<style>
  body{ background:#050507; color:#fff; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; margin:0; padding:40px 24px; }
  h1{ font-size:18px; letter-spacing:.1em; text-transform:uppercase; color:#8a8a96; margin:0 0 24px; }
  .demo{ max-width:560px; margin-bottom:32px; }
</style>
</head>
<body>
<h1>lists / sp-about-rows</h1>
<div id="demo"></div>
<script src="block.js"></script>
<script>
  var demo = document.getElementById('demo');
  var a = spAboutRows(
    [['Topic','Creativity'],
     ['Privacy','🌐 Public'],
     ['Members','128'],
     ['Posts','342'],
     ['Created','October 1, 2026']],
    'World-class interface craft. The bar is 10 stars or it never ships.'
  );
  a.className += ' demo';
  demo.appendChild(a);

  var b = spAboutRows(
    [['Topic','Governance'],
     ['Privacy','🔒 Private'],
     ['Members','32']]
  );
  b.className += ' demo';
  demo.appendChild(b);
</script>
</body>
</html>
