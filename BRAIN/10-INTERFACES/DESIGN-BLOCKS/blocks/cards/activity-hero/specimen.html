<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Block: activity-hero</title>
<link rel="stylesheet" href="activity-hero.css">
<style>
/* SPECIMEN ONLY — page ground + tokens normally provided by tokens.css */
:root{
  --bg:#0B0D12;
  --ink:#F5F7FB;--muted:#AAB2BF;
  --purple:#9d75ff;
  --ease:cubic-bezier(.16,.84,.22,1);--dur-med:.28s;
  --depth-deep:0 20px 48px #000d;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{margin:0;padding:0}
body{background:#0B0D12;color:#F5F7FB;font-family:var(--font);min-height:100vh;display:grid;place-items:center;padding:48px 20px;box-sizing:border-box}
.demo{width:min(760px,100%)}
.demo-note{font-size:12px;color:#AAB2BF;margin:0 0 18px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="demo">
  <p class="demo-note">SPECIMEN — reconstructed from CSS: the .activity-hero classes have NO rendered instance in the source (CSS-only). Structure follows the class names.</p>

  <div class="activity-hero">
    <div class="activity-hero-inner">
      <h2 class="activity-hero-title">Your activity, beautifully summarized</h2>
      <p class="activity-hero-sub">Every event across your spaces, connections and rooms — distilled into one living stream, newest first.</p>
    </div>
  </div>
</div>
</body>
</html>
