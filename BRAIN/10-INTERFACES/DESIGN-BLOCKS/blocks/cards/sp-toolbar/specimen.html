<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sp-toolbar — specimen</title>
<link rel="stylesheet" href="sp-toolbar.css">
<link rel="stylesheet" href="../../buttons/sp-btn/sp-btn.css">
<style>
  body{margin:0;background:#050507;color:#e8eaf2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 20px;}
  .demo{max-width:980px;margin:0 auto;display:grid;gap:22px;align-content:start;}
  .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b93a3;}
</style>
</head>
<body>
<div class="demo">
  <div class="cap">Spaces toolbar — title cluster, view switcher, create CTA</div>
  <div class="sp-toolbar" style="--sc:#7c3aed">
    <div class="sp-tb-title">
      <span class="sp-tb-kicker">Smart Spaces</span>
      <h2 class="sp-tb-name">Your Spaces</h2>
      <span class="sp-tb-count">12 spaces</span>
    </div>
    <div class="sp-tb-controls">
      <div class="sp-tb-views" role="tablist" aria-label="View">
        <button class="sp-tb-view on" data-view="grid">Grid</button>
        <button class="sp-tb-view" data-view="list">List</button>
      </div>
      <button class="sp-btn sp-btn--create" style="--sc:#7c3aed"><span class="sp-btn-icon">＋</span> Create Space</button>
    </div>
  </div>
</div>
<script src="sp-toolbar.js"></script>
</body>
</html>
