<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sp-post — specimen</title>
<link rel="stylesheet" href="sp-post.css">
<style>
  body{margin:0;background:#050507;color:#e8eaf2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 20px;}
  .demo{max-width:520px;margin:0 auto;display:grid;gap:22px;align-content:start;}
  .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b93a3;}
</style>
</head>
<body>
<div class="demo">
<div class="sp-post">
  <div class="sp-post-top">
    <div class="sp-ava sm" style="--cc:#1e6fd9">M</div>
    <div class="sp-post-who">
      <div class="sp-post-name">Maya</div>
      <div class="sp-post-time">2h ago</div>
    </div>
    <span class="sp-sched-badge">🕐 Posts Monday at 9:00 AM</span>
  </div>
  <div class="sp-post-text">First prototype is live — drop your harshest feedback below.</div>
  <div class="sp-post-actions">
    <button class="sp-like on">♥ 12</button>
    <button class="sp-mail-author">✉ Message</button>
  </div>
</div>
<div class="sp-post">
  <div class="sp-post-top">
    <div class="sp-ava sm" style="--cc:#0d9e6f">J</div>
    <div class="sp-post-who">
      <div class="sp-post-name">Jo</div>
      <div class="sp-post-time">just now</div>
    </div>
  </div>
  <div class="sp-post-text">…</div>
  <div class="sp-post-actions">
    <button class="sp-like">♥ 0</button>
    <button class="sp-mail-author">✉ Message</button>
  </div>
</div>
</div>
</body>
</html>
