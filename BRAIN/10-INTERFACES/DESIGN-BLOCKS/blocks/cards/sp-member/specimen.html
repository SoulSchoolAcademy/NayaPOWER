<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sp-member — specimen</title>
<link rel="stylesheet" href="sp-member.css">
<style>
  body{margin:0;background:#050507;color:#e8eaf2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 20px;}
  .demo{max-width:520px;margin:0 auto;display:grid;gap:22px;align-content:start;}
  .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b93a3;}
</style>
</head>
<body>
<div class="demo">
<div class="sp-member">
  <div class="sp-ava md" style="--cc:#7c3aed">S</div>
  <div class="sp-member-info">
    <div class="sp-member-name">Shawn</div>
    <div class="sp-member-role">Director</div>
  </div>
  <button class="sp-save-contact">＋ Save as Contact</button>
  <button class="sp-member-mail" title="Mail Shawn">✉</button>
</div>
<div class="sp-member">
  <div class="sp-ava md" style="--cc:#1e6fd9">M</div>
  <div class="sp-member-info">
    <div class="sp-member-name">Maya</div>
    <div class="sp-member-role">Member</div>
  </div>
  <span class="sp-saved-badge">✓ In Contacts</span>
  <button class="sp-member-mail" title="Mail Maya">✉</button>
</div>
</div>
</body>
</html>
