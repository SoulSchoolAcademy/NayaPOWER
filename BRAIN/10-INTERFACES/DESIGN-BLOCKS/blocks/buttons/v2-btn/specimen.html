<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Block: v2-btn</title>
<link rel="stylesheet" href="v2-btn.css">
<style>
/* SPECIMEN ONLY — tokens normally provided by tokens.css */
:root{--bg:#06060a;--base:#0b0b12;--rise:#15141f;--white:#fff;--purple:#9d75ff;--indigo:#7285ff;--blue:#55b9ee;--teal:#40d3bb;--emerald:#55e39a;--lime:#b8ee57;--gold:#e8b64c;--orange:#ff9557;--red:#ff5e6c;--magenta:#ed58cd;--ease:cubic-bezier(.16,.84,.22,1)}
body{background:#06060a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:40px 24px;margin:0}
</style>
</head>
<body>
<div style="display:flex;gap:15px;flex-wrap:wrap">
<button class="btn" type="button"><span class="btn-icon" aria-hidden="true">✧</span> Try this button</button>
<button class="btn" type="button" style="--glow:var(--teal)"><span class="btn-icon" aria-hidden="true">♡</span> Save this example</button>
<button class="btn" disabled type="button"><span class="btn-icon" aria-hidden="true">○</span> Not available yet</button>
</div>
</body>
</html>
