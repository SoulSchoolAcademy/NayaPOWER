<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Block specimen — data/li-day</title>
<link rel="stylesheet" href="block.css">
<style>
  body{ margin:0; background:#050507; }
  .demo-note{ color:#a09a8a; font-size:12px; letter-spacing:.18em; font-weight:800; margin:0 0 18px; }
  .demo-row{ color:#d8d3c4; font-size:15px; padding:10px 4px; border-bottom:1px solid rgba(255,255,255,.06); }
</style>
</head>
<body>
<div class="li-stage">
  <p class="demo-note">DATA / LI-DAY — SPECIMEN</p>
  <div id="stream"></div>
</div>
<script src="block.js"></script>
<script>
  var host = document.getElementById('stream');
  var days = [
    ['TODAY', ['Nine lanes report green', 'Brain index re-bake completes']],
    ['YESTERDAY', ['Relay posts receipt 6024356065']],
    ['WEDNESDAY, OCT 7', ['Collision scan clears wave-sequenced repair']]
  ];
  days.forEach(function(pair){
    host.appendChild(liDay(pair[0]));
    pair[1].forEach(function(txt){
      var row = document.createElement('div');
      row.className = 'demo-row';
      row.textContent = txt;
      host.appendChild(row);
    });
  });
</script>
</body>
</html>
