<h3 style="margin:20px 0 12px">Like pill <code>.like-pill</code> + action chip <code>.act-chip</code></h3>
<div class="demo-row">
  <button class="like-pill on" type="button">♥ 12</button>
  <button class="act-chip" type="button">↗ Share</button>
  <button class="act-chip on" type="button" style="--sc:#a06bff">◈ Pin</button>
</div>

<h3 style="margin:20px 0 12px">Toggle chip <code>.tog-chip</code> + day picker <code>.day-dot</code></h3>
<div class="demo-row">
  <button class="tog-chip on" type="button">Design</button>
  <button class="tog-chip" type="button">Voice</button>
  <button class="day-dot on" type="button">M</button>
  <button class="day-dot" type="button">T</button>
  <button class="day-dot" type="button">W</button>
</div>

<h3 style="margin:20px 0 12px">Send CTA <code>.send-cta</code> + mic <code>.mic-btn</code> + FAB <code>.fab</code></h3>
<div class="demo-row">
  <button class="send-cta" type="button">SEND NOW</button>
  <button class="mic-btn" type="button" aria-label="Record">🎤</button>
  <button class="fab" type="button" aria-label="Add">＋</button>
</div>
