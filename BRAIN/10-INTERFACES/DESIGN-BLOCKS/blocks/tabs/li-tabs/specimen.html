<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>li-tabs specimen</title>
<link rel="stylesheet" href="li-tabs.css">
<style>html,body{margin:0;background:#020202;padding:24px;}</style>
</head>
<body>
<div class="li-stage">

  <nav class="li-tabs">
    <button class="li-tab on" type="button" style="--tab-c:#c084fc" aria-pressed="true"><span>ALL</span><span style="margin-left:8px;font-size:12px;opacity:.7;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;">{{count}}</span></button>
    <button class="li-tab" type="button" style="--tab-c:#38bdf8" aria-pressed="false"><span>INTEL</span><span style="margin-left:8px;font-size:12px;opacity:.7;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;">{{count}}</span></button>
    <button class="li-tab" type="button" style="--tab-c:#d4a017" aria-pressed="false"><span>ACTIONS</span><span style="margin-left:8px;font-size:12px;opacity:.7;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;">{{count}}</span></button>
    <button class="li-tab" type="button" style="--tab-c:#6366f1" aria-pressed="false"><span>CONNECT</span><span style="margin-left:8px;font-size:12px;opacity:.7;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;">{{count}}</span></button>
  </nav>

</div>
</body>
</html>
