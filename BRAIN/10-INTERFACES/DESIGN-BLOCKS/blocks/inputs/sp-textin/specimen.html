<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sp-textin — specimen</title>
<link rel="stylesheet" href="sp-textin.css">
<style>
  body{margin:0;background:#050507;color:#e8eaf2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 20px;}
  .demo{max-width:520px;margin:0 auto;display:grid;gap:22px;align-content:start;}
  .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b93a3;}
</style>
</head>
<body>
<div class="demo">
  <div class="cap">Text input — recessed well, visible label, jewel ignite on focus</div>
  <label class="sp-textin" style="--sc:#7c3aed">
    <span class="sp-textin-label">Space name</span>
    <span class="sp-textin-well"><input type="text" placeholder="Give it a name people remember"></span>
  </label>
  <label class="sp-textin sp-textin--tall" style="--sc:#1e6fd9">
    <span class="sp-textin-label">Description</span>
    <span class="sp-textin-well"><textarea placeholder="What happens here? Who is it for?"></textarea></span>
    <span class="sp-textin-hint">A sentence or two is plenty — the people make the place.</span>
  </label>
</div>
</body>
</html>
