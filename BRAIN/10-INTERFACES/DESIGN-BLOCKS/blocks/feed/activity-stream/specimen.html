<!-- Smart Block specimen: activity-stream -->
<!-- Source: Naya Smart Hub Design.html -->
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="activity-stream.css">
<div style="background:#0B0D12;min-height:100vh;padding:32px 20px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#F5F7FB">

<div style="max-width:640px;margin:0 auto;position:relative">
  <div class="activity-pulse-ring"></div>
  <div class="activity-stream">
    <div class="activity-time-group">
      <div class="activity-time-head">TODAY</div>
      <div class="activity-timeline-row" style="display:flex;gap:12px;align-items:center;padding:10px 0">
        <span class="activity-live-dot"></span>
        <span style="font-size:14px">Calculator merged to main</span>
      </div>
      <div class="activity-timeline-row" style="display:flex;gap:12px;align-items:center;padding:10px 0">
        <span class="activity-live-dot" style="background:#9d75ff;box-shadow:0 0 14px #9d75ff"></span>
        <span style="font-size:14px">Smart Blocks extraction shipped</span>
      </div>
    </div>
    <div class="activity-time-group">
      <div class="activity-time-head">YESTERDAY</div>
      <div class="activity-timeline-row" style="display:flex;gap:12px;align-items:center;padding:10px 0">
        <span class="activity-live-dot" style="background:#AAB2BF;box-shadow:none;animation:none"></span>
        <span style="font-size:14px;color:#AAB2BF">Reveal deck narration fixed</span>
      </div>
    </div>
  </div>
</div>

</div>
