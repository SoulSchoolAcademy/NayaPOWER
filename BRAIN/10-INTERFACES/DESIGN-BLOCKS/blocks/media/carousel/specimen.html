<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>carousel — specimen</title>
<link rel="stylesheet" href="carousel.css">
<style>
  body { background:#050508; color:#f5f7fb; font-family:system-ui,-apple-system,sans-serif; margin:0; padding:48px 24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h2 { font-size:14px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:16px; }
  .ph { aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:rgba(255,255,255,.7); }
  .ph1 { background: radial-gradient(120% 120% at 20% 10%, #3a1a5e, #0a0a0e); }
  .ph2 { background: radial-gradient(120% 120% at 80% 20%, #0e3a5e, #0a0a0e); }
  .ph3 { background: radial-gradient(120% 120% at 50% 80%, #0e5e3a, #0a0a0e); }
</style>
</head>
<body>
<div class="wrap">
  <h2>Carousel</h2>
  <div class="cr" data-autoplay="6000" role="region" aria-label="Featured gallery">
    <div class="cr-track">
      <div class="cr-slide"><div class="ph ph1">01</div><div class="cr-cap">The Intelligent Hub — every door, one brain</div></div>
      <div class="cr-slide"><div class="ph ph2">02</div><div class="cr-cap">Smart Spaces — where connections live</div></div>
      <div class="cr-slide"><div class="ph ph3">03</div><div class="cr-cap">Living Intel — the feed that thinks</div></div>
    </div>
    <button class="cr-arrow cr-prev" aria-label="Previous slide">‹</button>
    <button class="cr-arrow cr-next" aria-label="Next slide">›</button>
    <div class="cr-dots" role="tablist" aria-label="Slides">
      <button class="cr-dot" aria-label="Slide 1"></button>
      <button class="cr-dot" aria-label="Slide 2"></button>
      <button class="cr-dot" aria-label="Slide 3"></button>
    </div>
  </div>
</div>
<script src="carousel.js"></script>
</body>
</html>
