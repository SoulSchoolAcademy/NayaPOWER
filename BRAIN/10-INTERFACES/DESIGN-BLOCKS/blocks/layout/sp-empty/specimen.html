<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sp-empty — specimen</title>
<link rel="stylesheet" href="sp-empty.css">
<link rel="stylesheet" href="../../buttons/sp-btn/sp-btn.css">
<style>
  body{margin:0;background:#050507;color:#e8eaf2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 20px;}
  .demo{margin:0 auto;display:grid;gap:22px;align-content:start;}
  .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b93a3;text-align:center;}
</style>
</head>
<body>
<div class="demo">
  <div class="cap">Empty state — invitation, not documentation</div>
  <div class="sp-empty" style="--sc:#7c3aed">
    <span class="sp-empty-mark" aria-hidden="true"></span>
    <h2 class="sp-empty-title">No spaces yet</h2>
    <p class="sp-empty-lead">Every gathering starts as an idea between people who care. Yours is welcome here.</p>
    <p class="sp-empty-hint">Create a space and invite the people who should be in the room.</p>
    <button class="sp-btn sp-btn--create" style="--sc:#7c3aed"><span class="sp-btn-icon">＋</span> Create your first space</button>
  </div>
</div>
</body>
</html>
