<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wb-entrance specimen</title>
<link rel="stylesheet" href="wb-entrance.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="{{logo}}" alt="NayaNET" style="width:52px;height:52px;object-fit:contain;display:block;">
  </div>
  <nav class="eco-inline" aria-label="NayaNET destinations" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 8px;max-width:60vw;">
    <a href="{{url}}" target="_blank" rel="noopener" title="{{TITLE}}" aria-label="{{TITLE}}" class="eco-dot" data-color="{{color}}" style="width:38px;height:38px;min-width:38px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;border:1.5px solid rgba(232,234,242,.55);background:radial-gradient(circle at 35% 28%,rgba(52,52,66,.95),rgba(8,8,12,.98) 72%);transition:all .25s cubic-bezier(.16,.84,.22,1);cursor:pointer;box-shadow:0 0 10px rgba(232,234,242,.25),inset 0 1px rgba(255,255,255,.25),inset 0 -2px 6px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent;text-decoration:none;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#e8eaf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 2px {{color}}66);"><path d="M3 11l9-8 9 8v9a2 2 0 01-2 2h-4v-7h-6v7H5a2 2 0 01-2-2z"/></svg></a>
    <!-- … remaining .eco-dot links (see eco-inline block) … -->
  </nav>
  <button class="auto" type="button">Auto-Login</button>
</header>

<main>
  <section class="intro">
    <h1>Welcome to NayaNET</h1>
    <p class="tag">Create. Connect. Grow <strong>with US.</strong></p>
  </section>

  <section class="stage">
    <div class="naya-orbit" aria-hidden="true">
      <div class="naya-color-orbit" id="nayaColorOrbit">
        <span class="naya-jewel" style="--jewel:{{color}}; --angle:{{deg}}; --size:4.9px; --size-mobile:4.25px; --scale:1; --opacity:.9;"></span>
        <span class="naya-jewel" style="--jewel:{{color}}; --angle:{{deg}}; --size:4.9px; --size-mobile:4.25px; --scale:1; --opacity:.9;"></span>
        <!-- … 108 .naya-jewel spans generated by wb-entrance.js … -->
      </div>
      <div class="naya-white-orbit">
        <span class="naya-white-light"></span>
      </div>
    </div>
    <div class="portal">
      <div class="core">
        <div class="content">
          <div class="presence" id="presence">Naya Listening</div>
          <form id="entryForm">
            <input id="userName" class="input" type="text" placeholder="Enter Your Name" autocomplete="name" autocapitalize="words" required>
            <button class="enter" type="submit">Enter NayaNET →</button>
          </form>
          <!-- welcome-back state (JS-rendered when a saved identity exists): -->
          <div id="welcomeBack">
            <div class="wb-name">Good to see you,<br><strong>{{name}}</strong></div>
            <button class="enter" type="button" id="wbJump">Jump back in →</button>
            <button class="wb-switch" type="button" id="wbSwitch">Use a different identity</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">Create. Connect. Grow with US.</footer>

<script src="wb-entrance.js"></script>
</body>
</html>
