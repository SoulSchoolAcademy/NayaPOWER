<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sp-marquee — specimen</title>
<link rel="stylesheet" href="sp-marquee.css">
<style>
  body{margin:0;background:#050507;color:#e8eaf2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 20px;}
  .demo{max-width:520px;margin:0 auto;display:grid;gap:22px;align-content:start;}
  .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b93a3;}
</style>
</head>
<body>
<div class="demo">
<!-- chips below are .sp-inv-chip: link ../../cards/sp-invite/sp-invite.css to render them -->
<div class="sp-marquee">
  <div class="sp-marquee-track">
      <button class="sp-inv-chip" data-sid="sp-builders" style="--sc:#7c3aed"><span class="sp-inv-chip-name">Builders Collective</span><span class="sp-inv-chip-join">Join →</span></button>
      <button class="sp-inv-chip" data-sid="sp-vision" style="--sc:#1e6fd9"><span class="sp-inv-chip-name">NayaNET Vision</span><span class="sp-inv-chip-join">Join →</span></button>
      <button class="sp-inv-chip" data-sid="sp-health" style="--sc:#0d9e6f"><span class="sp-inv-chip-name">Health Lab</span><span class="sp-inv-chip-join">Join →</span></button>
      <button class="sp-inv-chip" data-sid="sp-builders" style="--sc:#7c3aed"><span class="sp-inv-chip-name">Builders Collective</span><span class="sp-inv-chip-join">Join →</span></button>
      <button class="sp-inv-chip" data-sid="sp-vision" style="--sc:#1e6fd9"><span class="sp-inv-chip-name">NayaNET Vision</span><span class="sp-inv-chip-join">Join →</span></button>
      <button class="sp-inv-chip" data-sid="sp-health" style="--sc:#0d9e6f"><span class="sp-inv-chip-name">Health Lab</span><span class="sp-inv-chip-join">Join →</span></button>
  </div>
</div>
</div>
</body>
</html>
