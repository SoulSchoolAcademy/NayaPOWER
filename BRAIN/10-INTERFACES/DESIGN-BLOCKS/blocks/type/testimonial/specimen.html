<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>testimonial — specimen</title>
<link rel="stylesheet" href="testimonial.css">
<style>
  body { background:#050508; color:#f5f7fb; font-family:system-ui,-apple-system,sans-serif; margin:0; padding:48px 24px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  h2 { font-size:14px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Testimonials</h2>
  <div class="tm-grid">
    <figure class="tm">
      <div class="tm-stars" aria-label="5 out of 5 stars">★★★★★</div>
      <blockquote class="tm-quote">I asked one question and the whole room answered. It felt less like software and more like sitting down with everyone I've ever learned from.</blockquote>
      <figcaption class="tm-who">
        <span class="tm-ava">R</span>
        <span><p class="tm-name">Rena Okafor</p><p class="tm-role">Guild lead, Lagos</p></span>
      </figcaption>
    </figure>
    <figure class="tm">
      <div class="tm-stars" aria-label="5 out of 5 stars">★★★★★</div>
      <blockquote class="tm-quote">The feed distills our conversations into things I actually use. We stopped taking meeting notes — Naya remembers better than we do.</blockquote>
      <figcaption class="tm-who">
        <span class="tm-ava">D</span>
        <span><p class="tm-name">Devon Marsh</p><p class="tm-role">Founder, Portland</p></span>
      </figcaption>
    </figure>
  </div>
</div>
</body>
</html>
