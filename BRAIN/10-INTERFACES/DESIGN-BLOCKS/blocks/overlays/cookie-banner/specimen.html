<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cookie-banner — specimen</title>
<link rel="stylesheet" href="cookie-banner.css">
<style>
  body { background:#050508; color:#f5f7fb; font-family:system-ui,-apple-system,sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .demo { text-align:center; color:rgba(255,255,255,.5); font-size:18px; }
  .demo button { margin-top:16px; background:#0a0a0e; border:1px solid rgba(255,255,255,.12); color:#f5f7fb; border-radius:999px; padding:12px 28px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<div class="demo">
  <p>The banner slides up on first visit.<br>Clear localStorage to see it again.</p>
  <button onclick="localStorage.removeItem('naya-consent');location.reload()">Reset demo</button>
</div>

<div class="ck" role="dialog" aria-label="Cookie consent">
  <div class="ck-copy">
    <p class="ck-title">Your presence, your rules</p>
    <p class="ck-text">NayaNET uses a few cookies to keep you signed in and remember your doors. Nothing sold, nothing shared. <a href="#">Read the plain version</a>.</p>
  </div>
  <div class="ck-actions">
    <button class="ck-btn ck-btn--ghost" data-ck-decline>Only essentials</button>
    <button class="ck-btn" data-ck-accept>Accept</button>
  </div>
</div>

<script src="cookie-banner.js"></script>
</body>
</html>
