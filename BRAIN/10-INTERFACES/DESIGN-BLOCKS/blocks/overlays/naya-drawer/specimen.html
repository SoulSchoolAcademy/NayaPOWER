<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Smart Block: naya-drawer &mdash; specimen</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="naya-drawer.css">
<style>
/* specimen chrome only -- not part of the block */
body{background:#050507;color:#f8f7fb;font:500 16px/1.6 Manrope,ui-sans-serif,system-ui,sans-serif;margin:0;padding:48px 20px}
.spec-note{max-width:960px;margin:0 auto 28px;color:#c8c2ce;font-size:13px;letter-spacing:.04em}

</style>

<body>
<p class="spec-note">SMART BLOCK SPECIMEN &middot; <b>naya-drawer</b> &middot; Right-side notification drawer &mdash; markup and CSS ported byte-faithful from <i>naya5/smart-blocks-library</i> (branch).</p>
<div class="spec-stage">
<button class="naya-btn" data-drawer-open="demo-drawer" aria-expanded="false">Open notifications</button>
<div class="naya-drawer-backdrop" hidden></div>
<aside class="naya-drawer" id="demo-drawer" hidden aria-label="Notifications">
  <div class="naya-drawer-head"><h2>Notifications</h2><button class="naya-btn icon micro" data-drawer-close aria-label="Close">&#10005;</button></div>
  <div class="naya-drawer-list">
    <div class="naya-note is-unread"><div class="naya-note-body"><strong>Learning loop closed.</strong> The drawer block survived porting.</div></div>
    <div class="naya-note"><div class="naya-note-body"><strong>Quiet hour.</strong> Nothing needed you.</div></div>
  </div>
</aside>
</div>
<script src="naya-drawer.js"></script>
</body>
