<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="drawer.css">
<div style="background:#0B0D12;min-height:100vh;padding:32px 20px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#F5F7FB">

<div class="shell" id="demo-shell" style="display:block;position:relative;min-height:60vh">
  <aside class="rail left" style="position:absolute;top:0;left:0;bottom:0;width:260px">
    <p style="color:#AAB2BF;font-size:13px;padding:0 6px">Drawer panel — nav lives here.</p>
  </aside>
  <div class="drawer-backdrop" id="demo-backdrop"></div>
  <div style="padding:40px 20px 40px 300px">
    <button class="rooms-plus" id="demo-drawer-btn" aria-expanded="false"
      style="display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid #ffffff18;background:#12151D;color:#F5F7FB;font-size:22px">+</button>
    <p style="color:#AAB2BF;font-size:14px;margin-top:16px">Tap + to slide the drawer in (mobile pattern; resize under 900px for the true behavior).</p>
  </div>
</div>

</div>
<script src="drawer.js"></script>
