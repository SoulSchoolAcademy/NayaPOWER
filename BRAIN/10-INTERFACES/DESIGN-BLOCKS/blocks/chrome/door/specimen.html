<!-- Smart Block specimen: door -->
<!-- Source: Naya Smart Hub Design.html -->
<!-- Depends on: data/state-badge (used in .door-foot per the DoorCard builder) -->
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../data/state-badge/state-badge.css">
<link rel="stylesheet" href="door.css">
<div style="background:#0B0D12;min-height:100vh;padding:32px 20px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#F5F7FB">

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;max-width:900px;margin:0 auto">
  <article class="door" style="--door-accent:#55e39a">
    <div class="door-top">
      <div class="door-icon">&#9670;</div>
      <div><div class="door-name">Smart Mail</div><div class="door-for">for staying in signal</div></div>
    </div>
    <div class="door-desc">Every message that matters, distilled to what deserves you.</div>
    <div class="door-foot"><span class="state-badge" style="--room-accent:#55e39a">IN USE</span></div>
  </article>
  <article class="door" style="--door-accent:#9d75ff">
    <div class="door-top">
      <div class="door-icon">&#9671;</div>
      <div><div class="door-name">Smart Spaces</div><div class="door-for">for connecting</div></div>
    </div>
    <div class="door-desc">Rooms where humans and Nayas think together.</div>
    <div class="door-foot"><span class="state-badge" style="--room-accent:#9d75ff">LIVE</span></div>
  </article>
  <article class="door" style="--door-accent:#55b9ee">
    <div class="door-top">
      <div class="door-icon">&#9672;</div>
      <div><div class="door-name">Smart Ledger</div><div class="door-for">for proof</div></div>
    </div>
    <div class="door-desc">The black box. Every claim carries its receipt.</div>
    <div class="door-foot"><span class="state-badge" style="--room-accent:#55b9ee">NEW</span></div>
  </article>
</div>

</div>
