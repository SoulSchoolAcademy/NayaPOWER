<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Graphs · 01 · Pulse Orb — Intelligent Blocks created</title>
<link rel="stylesheet" href="../../DESIGN-BLOCKS/tokens.css">
<link rel="stylesheet" href="../../DESIGN-BLOCKS/blocks/jewels/gem-bullet/gem-bullet.css">
<link rel="stylesheet" href="../../DESIGN-BLOCKS/blocks/graphs/pulse-orb/pulse-orb.css">
<link rel="stylesheet" href="sg-chrome.css">
</head>
<body class="sg-page">
<div class="sg-wrap">
  <div class="sg-kicker"><span class="gem"></span>Smart Graphs · Specimen 01</div>
  <div class="sg-mode">Automatic · NayaNET pulse</div>
  <div class="sg-card lit">
    <h4>Intelligent Blocks created</h4>
    <div class="c-sub">Automatic · this week · you asked, Naya rendered</div>
    <div class="pulse-orb-stage">
      <div class="pulse-orb" style="--v:.72; --d:.1s">
        <div class="po-val">
          <span class="po-num">47</span>
          <span class="po-label">blocks</span>
        </div>
      </div>
    </div>
    <div class="sg-foot">
      <span class="sg-delta up"><span class="gem-bullet" style="--tone:var(--green);margin-top:0"></span>+12% vs last week</span>
      <span style="font-size:12px;color:var(--quiet)">SAMPLE DATA</span>
    </div>
  </div>
  <div class="sg-actions">
    <button class="sg-action" disabled><span class="gem"></span>Save</button>
    <button class="sg-action" disabled><span class="gem"></span>Share</button>
    <button class="sg-action" disabled><span class="gem"></span>PDF</button>
    <button class="sg-action" disabled><span class="gem"></span>Send to NayaNET</button>
  </div>
  <p class="sg-honesty">Actions reserved in v1 — the contract ships before the wiring.<br>Sample data. The instrument is real; the feed is next.</p>
</div>
<script>
// light on entry (the .lit contract)
new IntersectionObserver((es, io) => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('lit'); io.disconnect(); }
}), { threshold: .35 }).observe(document.querySelector('.sg-card'));
</script>
</body>
</html>
