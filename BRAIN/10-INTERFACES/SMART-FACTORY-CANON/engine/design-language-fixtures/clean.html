<!doctype html><html><head><title>clean fixture</title><style>
:root{--ac:#a06bff}
body{font-size:17px;color:#ffffff;background:#0a0a0e}
.board{border:2px solid #ffffff;border-radius:12px;padding:10px}
.board:hover{border-color:#a06bff;box-shadow:0 0 12px #a06bff}
.btn{border:2px solid #f2f2f7;color:#ffffff;background:#0a0a0e;font-size:16px}
.btn:hover{border-color:#3fb8ff;box-shadow:0 0 10px #3fb8ff}
.chip{border:1px solid #ffffff;padding:2px 8px}
.chip:hover{border-color:#2fe89e}
</style></head><body>
<section style="--ac:#a06bff"><h2>One</h2><div class="board"><button class="btn" type="button">Go</button></div></section>
<section style="--ac:#3fb8ff"><h2>Two</h2><div class="board"><button class="btn" type="button">Go two</button></div></section>
<section style="--ac:#2fe89e"><h2>Three</h2><div class="chips"><span class="chip" style="--ac:#a06bff">Alpha</span><span class="chip" style="--ac:#3fb8ff">Beta</span><span class="chip" style="--ac:#2fe89e">Gamma</span></div></section>
</body></html>
