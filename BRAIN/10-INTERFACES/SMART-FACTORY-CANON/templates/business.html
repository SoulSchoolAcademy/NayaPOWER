@keyframes micpulse{0%,100%{box-shadow:inset 0 2px 2px rgba(255,255,255,.22),inset 0 -6px 12px rgba(0,0,0,.7),0 0 0 0 rgba(255,94,108,.45),0 12px 28px rgba(0,0,0,.65)}50%{box-shadow:inset 0 2px 2px rgba(255,255,255,.22),inset 0 -6px 12px rgba(0,0,0,.7),0 0 0 12px rgba(255,94,108,0),0 12px 28px rgba(0,0,0,.65)}}
.fab{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 35% 28%,#3a2f55,#0b0a10 68%);border:1.5px solid #F8F7FB;box-shadow:0 0 24px -2px rgba(157,117,255,.55),0 16px 32px rgba(0,0,0,.7);color:#fff;font-size:26px;font-weight:300;transition:transform .2s var(--ease),box-shadow .25s var(--ease)}
.fab:hover{transform:scale(1.07);box-shadow:0 0 32px -2px rgba(157,117,255,.75),0 18px 36px rgba(0,0,0,.7)}
.fab:active{transform:scale(.96)}
/* BTN-019 signature variants — extend the shared .naya-btn base */
.naya-btn.lead{padding:16px 32px;font-size:15px;letter-spacing:.14em}
.naya-btn.machine{background:linear-gradient(180deg,#101016,#050506);border:1.5px solid #F8F7FB;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.55)}
.naya-btn.prism{background:linear-gradient(180deg,#141419,#050507);color:#F8F7FB;border:1.5px solid #F8F7FB;font-weight:900;position:relative}
.naya-btn.prism::before{content:'';position:absolute;inset:-2px;border-radius:inherit;padding:2.5px;filter:brightness(1.3) saturate(1.4);background:linear-gradient(120deg,#8d63f5,#3fb8ff,#35e0a1,#e8c766,#ff9a5a,#e84fff,#8d63f5);background-size:300% 100%;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:prism-slide 6s linear infinite;pointer-events:none;opacity:.9}
.naya-btn.prism:hover{box-shadow:inset 0 1px rgba(255,255,255,.35),0 0 30px rgba(141,99,245,.6),0 0 50px rgba(63,184,255,.3),0 12px 28px rgba(0,0,0,.6);transform:translateY(-2px)}
@keyframes prism-slide{to{background-position:300% 0}}
.naya-btn.proximity{border-color:#F8F7FB;box-shadow:inset 0 2px 2px rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.6),0 0 26px -4px rgba(157,117,255,.55),0 12px 28px rgba(0,0,0,.65)}
.naya-btn.streak{position:relative;overflow:hidden}
.naya-btn.streak:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:streak-sweep 2.6s var(--ease) infinite;pointer-events:none}
@keyframes streak-sweep{to{transform:translateX(100%)}}
/* BTN-022 split button */
.naya-btn.split{position:relative;overflow:visible;padding-right:64px}
.naya-btn .split-orb{position:absolute;right:4px;top:4px;bottom:4px;width:48px;border-radius:999px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2a2436,#0a0a0e 70%);border:1px solid rgba(255,255,255,.5);color:#fff}
.naya-btn .split-orb svg{width:18px;height:18px}
/* BTN-026 orbit button — light flows around the rim */
@property --oa{syntax:'<angle>';inherits:false;initial-value:0deg}
.orbit-btn{--oc:#a06bff;position:relative;display:inline-flex;align-items:center;justify-content:center;padding:14px 34px;border-radius:999px;background:#050506;color:#fff;font-size:14px;font-weight:800;letter-spacing:.08em;cursor:pointer;border:1px solid rgba(255,255,255,.55)}
.orbit-btn:before{content:"";position:absolute;inset:-3px;border-radius:inherit;padding:2px;background:conic-gradient(from var(--oa),transparent 0 200deg,var(--oc) 290deg,#fff 320deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:orbit-spin 3.2s linear infinite;pointer-events:none}
@keyframes orbit-spin{to{--oa:360deg}}
.orbit-label{position:relative;z-index:1}

/* ============ SWEEP WAVE 2 — batch 4: inputs (2026-10-18) ============ */
.segmented{display:inline-flex;padding:4px;border:1px solid rgba(255,255,255,.35);border-radius:15px;background:#050507;box-shadow:inset 0 2px 8px #000,0 12px 24px rgba(0,0,0,.4)}
.segmented button{padding:8px 15px;border:1px solid transparent;border-radius:11px;background:transparent;color:#F8F7FB;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.segmented button[aria-selected=true]{color:#fff;border-color:rgba(255,255,255,.65);background:linear-gradient(180deg,#20172e,#100b18);box-shadow:inset 0 1px rgba(255,255,255,.2),0 0 12px rgba(157,117,255,.32)}
.segmented button{transition:border-color .22s var(--ease),box-shadow .22s var(--ease),transform .22s var(--ease)}
.segmented button:hover{border-color:var(--purple)!important;box-shadow:inset 0 2px 8px rgba(0,0,0,.8),0 0 14px -4px var(--purple)!important}
.naya-toggle{position:relative;flex:none;width:54px;height:32px;padding:0;border:1.5px solid rgba(255,255,255,.72);border-radius:999px;background:#050507;box-shadow:inset 0 3px 8px #000;cursor:pointer}
.naya-toggle span{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,#fff,#9a95a0);box-shadow:0 3px 8px #000;transition:transform .22s var(--ease)}
.naya-toggle[aria-checked=true]{border-color:var(--purple);box-shadow:inset 0 3px 8px #000,0 0 12px -3px var(--purple)}
.naya-toggle[aria-checked=true] span{transform:translateX(22px);background:radial-gradient(circle at 35% 25%,#fff,var(--purple) 40%,#16101f)}
.naya-toggle{transition:border-color .22s var(--ease),box-shadow .22s var(--ease),transform .22s var(--ease)}
.naya-toggle:hover{border-color:var(--purple)!important;box-shadow:inset 0 2px 8px rgba(0,0,0,.8),0 0 14px -4px var(--purple)!important}
.recessed-field{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1.5px solid rgba(255,255,255,.72);border-radius:13px;background:#030304;box-shadow:inset 0 3px 10px rgba(0,0,0,.9),inset 0 1px rgba(255,255,255,.08);color:#c9c3cf;width:100%}
.recessed-field>span{flex:none;max-width:46%;font-size:13px}
.recessed-field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:16px;font-family:inherit}
.recessed-field:focus-within{border-color:var(--purple)!important;box-shadow:inset 0 2px 8px rgba(0,0,0,.8),0 0 14px -4px var(--purple)!important}
.naya-check{display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;color:var(--ink-dim);position:relative}
.naya-check input{position:absolute;opacity:0;pointer-events:none}
.naya-check .box{width:26px;height:26px;border-radius:8px;flex:none;border:1.5px solid var(--line-bright);background:linear-gradient(180deg,#17141f,#0a090e);box-shadow:inset 0 1px rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.5);display:grid;place-items:center;color:transparent;transition:box-shadow .22s var(--ease),border-color .22s var(--ease),color .22s var(--ease),transform .15s var(--ease)}
.naya-check:hover .box{border-color:rgba(255,255,255,.7)}
.naya-check input:checked + .box{border-color:rgba(47,232,158,.6);color:#2fe89e;background:radial-gradient(circle at 50% 30%,rgba(47,232,158,.28),rgba(47,232,158,.05) 70%),linear-gradient(180deg,#17141f,#0a090e);box-shadow:inset 0 1px rgba(255,255,255,.4),0 0 18px -4px rgba(47,232,158,.6),0 6px 14px rgba(0,0,0,.5)}
.naya-check input:focus-visible + .box{outline:2px solid #fff;outline-offset:3px}
.naya-check:active .box{transform:scale(.92)}
.naya-check .txt{transition:color .2s var(--ease)}
.naya-check input:checked ~ .txt{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:rgba(47,232,158,.5)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid rgba(255,255,255,.12);width:100%}
.setting-row strong{display:block;font-size:14px;color:#fff}
.setting-row small{display:block;color:#F8F7FB;font-size:11px;margin-top:3px}

/* ============ SWEEP WAVE 2 — batch 5a: boards, naya-smart-blocks set (2026-10-18) ============ */
.micro{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:10px 0 0;text-align:center}
/* BRD-008 job cards */
.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sb-job{border:1.5px solid rgba(255,255,255,.22);border-radius:16px;padding:20px;background:linear-gradient(180deg,#0c0c12,#060608);box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .25s var(--ease)}
.sb-job:hover{border-color:var(--jc,#ffffff);box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 30px -6px var(--jc,#ffffff),inset 0 1px 0 rgba(255,255,255,.1);transform:translateY(-3px)}
.sb-job .swatch{width:100%;height:44px;border-radius:10px;margin-bottom:12px;border:1.5px solid rgba(255,255,255,.45);box-shadow:0 8px 22px rgba(0,0,0,.55),0 0 20px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 10px rgba(0,0,0,.35);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.sb-job:hover .swatch{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.6),0 0 28px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -4px 10px rgba(0,0,0,.3)}
.sb-job h3{font-size:14px;letter-spacing:.2em;margin:0 0 6px;color:#fff}
.sb-job p{font-size:14px;color:#fff;margin:0;opacity:.9}
/* BRD-009 world tiles */
.sb-layer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:16px}
.sb-layer{--tone:#3fb8ff;border:1px solid rgba(255,255,255,.6);background:linear-gradient(145deg,#15151c,#0d0c12);border-radius:16px;padding:22px;box-shadow:inset 0 1px rgba(255,255,255,.13),0 9px 25px rgba(0,0,0,.65),0 0 18px -10px var(--tone);transition:box-shadow .25s}
.sb-layer:hover{box-shadow:inset 0 1px rgba(255,255,255,.13),0 15px 30px rgba(0,0,0,.65),0 0 22px -8px var(--tone)}
.sb-layer .micro{color:#fff;display:flex;gap:10px;align-items:center;letter-spacing:.09em;font-size:13px;text-transform:uppercase;font-weight:800;margin:0;text-align:left}
.sb-layer p{margin:14px 0 0;color:#ece6f3;font-size:16px;line-height:1.7}
/* BRD-010 hero vessel */
.vessel{position:relative;display:grid;place-items:center;isolation:isolate}
.vessel:before{content:"";position:absolute;width:min(88%,470px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(141,99,245,.18),rgba(141,99,245,.035) 45%,transparent 71%);filter:blur(4px)}
.vessel-label{position:absolute;bottom:20px;z-index:4;font-size:14px;font-weight:800;letter-spacing:.12em;color:#F8F7FB}
.vessel-demo{}
/* BRD-011 truth pair */
.sb-truth{border:1.5px solid rgba(255,255,255,.22);border-radius:16px;padding:22px;background:linear-gradient(180deg,#0c0c12,#060608);box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);display:flex;gap:16px;align-items:flex-start;transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .25s var(--ease)}
.sb-truth:hover{border-color:var(--tc2);box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 30px -6px var(--tc2),inset 0 1px 0 rgba(255,255,255,.1);transform:translateY(-3px)}
.sb-torb{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,var(--tc2),#000 130%);border:2px solid var(--tc2);box-shadow:0 0 18px var(--tc2)}
.sb-truth b{display:block;font-size:14px;letter-spacing:.18em;color:#fff;margin-bottom:4px}
.sb-truth p{font-size:18px;color:#fff;margin:0;opacity:.92}
/* BRD-012 self-scorecard */
.scorecard{border:1.5px solid rgba(255,255,255,.9);border-radius:18px;padding:8px 26px 18px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 12px 32px rgba(0,0,0,.55)}
.score-row{--sc:#9d75ff;display:flex;gap:18px;align-items:flex-start;padding:16px 18px;margin-bottom:12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.35);border-left:4px solid var(--sc)}
.score-row .dim{font-size:18px;font-weight:700;flex:0 0 215px;color:#fff}
.score-row .score-num{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;font-weight:600;flex:0 0 64px;color:var(--sc);text-shadow:0 0 18px var(--sc)}
.score-row .note{font-size:17px;flex:1;color:#fff}
.verdict{margin-top:18px;padding:18px 22px;border:1.5px solid rgba(255,255,255,.9);border-radius:14px;font-size:17px;transition:border-color .3s,box-shadow .3s;color:#fff}
.verdict:hover{border-color:#9d75ff;box-shadow:0 0 26px rgba(157,117,255,.5)}
.verdict strong{font-size:18px;color:#fff;display:block;margin-bottom:6px}
.verdict span{display:block;font-size:14px;opacity:.75}
/* BRD-013 ship-gate checklist */
.sb-gate{border:2px solid #8a5cff;border-radius:20px;padding:32px;background:linear-gradient(160deg,#0e0a18,#050508);box-shadow:0 0 44px rgba(138,92,255,.25)}
.sb-gate ul{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column}
.sb-gate li{display:flex;gap:16px;align-items:flex-start;font-size:18px;color:#fff;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.sb-gate li:last-child{border-bottom:none}
.sb-gate .jw{width:28px;height:28px;font-size:13px;margin-top:1px}
.aiphase{font-size:14px;font-weight:800;letter-spacing:.26em;color:rgba(255,255,255,.55);text-transform:uppercase;margin:16px 0 8px}
/* BRD-014 data table + shared .naya-badge */
.naya-table-wrap{border:1px solid var(--line-soft);border-radius:22px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%)}
table.naya-table{width:100%;border-collapse:collapse;font-size:13.5px}
.naya-table thead th{text-align:left;padding:12px 16px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);white-space:nowrap}
.naya-table tbody td{padding:13px 16px;border-bottom:1px solid var(--line-soft);color:var(--ink-dim)}
.naya-table tbody tr:last-child td{border-bottom:0}
.naya-table tbody tr{transition:background .15s var(--ease)}
.naya-table tbody tr:hover{background:rgba(255,255,255,.028)}
.naya-badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.045);box-shadow:inset 0 1px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.5)}
.naya-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-faint)}
.naya-badge.is-verified{border-color:rgba(47,232,158,.4)}
.naya-badge.is-verified::before{background:#2fe89e;box-shadow:0 0 8px #2fe89e}
.naya-badge.is-claim{border-color:rgba(255,191,61,.4)}
.naya-badge.is-claim::before{background:#ffbf3d;box-shadow:0 0 8px #ffbf3d}
/* BRD-015 media player */
.media-player{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:17px;border:1px solid rgba(255,255,255,.32);border-radius:19px;background:#050507;box-shadow:inset 0 3px 10px #000,0 14px 28px rgba(0,0,0,.55)}
.media-copy strong{display:block;font-size:14px;color:#fff}
.media-copy small{display:block;color:#F8F7FB;font-size:11px;margin-top:3px}
.timeline{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
.timeline span{display:block;height:100%;background:var(--purple);border-radius:3px}
/* BRD-016 orbiting login */
.login-card{position:relative;z-index:2;width:min(100%,300px);padding:23px;border:1px solid rgba(255,255,255,.38);border-radius:21px;background:linear-gradient(155deg,rgba(25,19,35,.95),rgba(6,6,9,.96));box-shadow:inset 0 1px rgba(255,255,255,.13),0 25px 55px rgba(0,0,0,.58);color:#fff}
.login-card h3{text-align:center;font-size:22px;font-weight:600;margin:0 0 5px;font-family:Georgia,serif;color:#fff}
.login-card p{text-align:center;color:#F8F7FB;font-size:12px;margin:0 0 16px}
.login-orbit{position:absolute;width:285px;aspect-ratio:1;border:1px solid rgba(188,169,255,.34);border-radius:50%;animation:ring-spin 18s linear infinite}
.login-orbit.two{width:230px;border-color:rgba(63,159,245,.32);animation-duration:26s;animation-direction:reverse}
.login-orbit:after{content:"";position:absolute;top:12%;left:8%;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 18px 5px var(--purple)}
.login-orbit.two:after{top:auto;bottom:8%;left:auto;right:18%;width:6px;height:6px;box-shadow:0 0 9px #fff,0 0 16px 4px #3fb8ff}
/* BRD-024 page shell */
.naya-shell{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto auto;min-height:0;background:#050507;border:1px solid var(--line);border-radius:22px;overflow:hidden;color:#fff}
.naya-shell-head{padding:14px 18px;border-bottom:1px solid var(--line-soft);background:rgba(5,5,7,.7);display:flex;align-items:center;gap:14px}
.naya-shell-title{font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.naya-shell-sub{font-size:12.5px;color:var(--ink-faint)}
.naya-shell-main{padding:18px}
.naya-grid{display:grid;gap:20px;grid-template-columns:repeat(12,1fr)}
.naya-grid > .span-12{grid-column:span 12;color:var(--ink-dim);font-size:13px}

/* ============ SWEEP WAVE 2 — batch 5b: boards, design-system + ELITE set (2026-10-18) ============ */
.naya-icon{width:20px;height:20px}
/* BRD-017/018/019 shared elevated-board family */
.elevated-board{--tone:#8d63f5;position:relative;overflow:hidden;padding:26px 24px 24px;border:1.5px solid #F8F7FB;border-radius:24px;color:#F8F7FB;background:linear-gradient(155deg,#0b0b10,#050507 60%,#020203);box-shadow:inset 0 2px 2px rgba(255,255,255,.14),inset 0 -8px 18px rgba(0,0,0,.6),0 5px 0 #000,0 35px 75px rgba(0,0,0,.75),0 0 26px rgba(248,247,251,.28);transition:transform .28s cubic-bezier(.16,.84,.22,1),box-shadow .3s,border-color .3s}
.elevated-board:hover{transform:translateY(-5px);border-color:#F8F7FB;box-shadow:inset 0 2px 2px rgba(255,255,255,.2),inset 0 -8px 18px rgba(0,0,0,.5),0 7px 0 #000,0 44px 86px rgba(0,0,0,.8),0 0 44px rgba(248,247,251,.5)}
.elevated-board .board-spine{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--tone);box-shadow:0 0 28px var(--tone),0 0 55px -7px var(--tone)}
.elevated-board .board-corner{position:absolute;right:20px;top:20px;width:44px;height:44px;display:grid;place-items:center;border:1.5px solid #F8F7FB;border-radius:50%;background:radial-gradient(circle at 32% 24%,#fff 0%,var(--tone) 38%,#0a0a10 82%);box-shadow:inset 0 2px 4px rgba(255,255,255,.6),inset 0 -6px 10px rgba(0,0,0,.55),0 0 20px rgba(248,247,251,.35),0 8px 18px rgba(0,0,0,.6);transition:transform .25s cubic-bezier(.16,.84,.22,1),box-shadow .25s}
.elevated-board:hover .board-corner{transform:translateY(-3px) scale(1.1);box-shadow:inset 0 2px 4px rgba(255,255,255,.7),inset 0 -6px 10px rgba(0,0,0,.5),0 0 30px var(--tone),0 12px 24px rgba(0,0,0,.65)}
.elevated-board h3{font:600 24px/1.2 Georgia,serif;margin:42px 48px 8px 0;color:#F8F7FB}
.elevated-board p{color:#F8F7FB;font-size:14px;margin:0;opacity:.92}
.elevated-board.editorial{border-radius:14px 30px 30px 14px}
.elevated-board.orbital{border-radius:36px 36px 22px 22px;background:radial-gradient(circle at 50% 5%,rgba(63,159,245,.15),transparent 43%),linear-gradient(155deg,#171820,#050506)}
.source-rank{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:#F8F7FB;font-size:11px;font-weight:800;letter-spacing:.07em}
.source-rank b{color:#fff}
.board-floor{display:grid;gap:8px;margin-top:28px}
.board-floor span{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(0,0,0,.24);font-size:12px;color:#fff}
.board-floor i{width:7px;height:7px;transform:rotate(45deg);background:var(--tone);box-shadow:0 0 9px var(--tone)}
/* BRD-020 relationship orbit */
.orbit-board{position:relative;overflow:hidden;padding:26px;border:1px solid rgba(255,255,255,.24);border-radius:26px;background:radial-gradient(circle at 50% 18%,rgba(63,159,245,.13),transparent 43%),linear-gradient(160deg,#11131b,#050506);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.1),0 24px 55px rgba(0,0,0,.5)}
.orbit-board h3{font:600 24px/1.2 Georgia,serif;color:#fff;margin:0 0 8px}
.orbit-board p{color:#F8F7FB;font-size:14px;margin:0}
.orbital-diagram{position:relative;width:min(100%,290px);aspect-ratio:1;margin:14px auto 4px}
.orbital-diagram .orbit-track{position:absolute;inset:6%;border:1px solid rgba(255,255,255,.24);border-radius:50%;animation:ring-spin 18s linear infinite}
.orbital-diagram .orbit-track.orbit-two{inset:21%;border-color:rgba(63,159,245,.4);animation-direction:reverse;animation-duration:13s}
.orbital-diagram .orbit-track:after{content:"";position:absolute;top:10%;left:8%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 13px 4px #3f9ff5}
.orbital-diagram .orbit-track.orbit-two:after{top:auto;bottom:4%;left:auto;right:20%;width:7px;height:7px;box-shadow:0 0 12px 3px #8d63f5}
.orbital-core{position:absolute;inset:35%;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 24%,#fff,#8d63f5 24%,#0b0713 72%);border:1px solid #fff;box-shadow:inset 0 -8px 14px rgba(0,0,0,.5),0 0 25px rgba(141,99,245,.5)}
@media(prefers-reduced-motion:reduce){.orbital-diagram .orbit-track{animation:none!important}}
/* BRD-021 faceted door */
.brd021-room{--tone:#9d75ff;appearance:none;text-align:left;padding:21px 20px;color:white;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#17131d,#09090d);border:1.5px solid rgba(255,255,255,.5);border-radius:19px;box-shadow:inset 0 1px rgba(255,255,255,.25),0 14px 31px rgba(0,0,0,.73),0 0 22px -12px var(--tone);transition:transform .28s,box-shadow .28s,border-color .28s;cursor:pointer;width:100%}
.brd021-room .room-icon{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.99);background:#09090e;border-radius:13px;box-shadow:0 0 14px -4px var(--tone);color:#fff}
.brd021-room .room-name{display:block;font-size:17px;line-height:1.2;font-weight:820;margin-top:27px;color:#fff}
.brd021-room .room-purpose{font-size:14px;color:#d8d3e0;display:block;margin-top:7px;line-height:1.4}
/* BRD-022 editorial report card */
.brd022-board{--tone:#9d75ff;position:relative;overflow:hidden;border-radius:28px;border:1.7px solid rgba(242,238,255,.53);background:linear-gradient(145deg,#171021,#0d0b11 38%,#07070a);box-shadow:inset 0 1px rgba(255,255,255,.33),0 28px 64px rgba(0,0,0,.8),0 0 40px -18px var(--tone);transition:border-color .28s,transform .28s,box-shadow .28s}
.brd022-board .board-content{position:relative;z-index:1;padding:24px}
.brd022-board .board-header{display:flex;align-items:center;gap:18px;margin-bottom:25px;flex-wrap:wrap}
.brd022-board .board-tag{font-size:14px;letter-spacing:.17em;text-transform:uppercase;font-weight:850;color:#e2d5f7}
.brd022-board .board-name{font-family:Georgia,serif;font-size:30px;font-weight:500;line-height:1.07;letter-spacing:-.03em;margin:2px 0 5px;color:#fff}
.brd022-board .board-sub{font-size:16px;color:#ddd4e9;margin:0}
.brd022-board .brd022-spacer{flex:1}
.brd022-board .brd022-truth{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(212,168,255,.58);background:rgba(24,15,37,.88);border-radius:999px;padding:8px 13px;font-size:14px;letter-spacing:.07em;font-weight:850;color:#fff}
.brd022-board .status-dot{width:7px;height:7px;background:#bda0ff;border-radius:50%;box-shadow:0 0 12px #ab82ff}
.brd022-board .nutshell{border:1px solid rgba(226,214,255,.44);background:linear-gradient(135deg,#191125,#0c0a13);border-radius:17px;padding:24px;box-shadow:inset 0 1px rgba(255,255,255,.11),0 10px 28px rgba(0,0,0,.6)}
.brd022-board .brd022-layer{--tone:#55b9ee;border:1px solid rgba(255,255,255,.6);background:linear-gradient(145deg,#15151c,#0d0c12);border-radius:16px;padding:22px;box-shadow:inset 0 1px rgba(255,255,255,.13),0 9px 25px rgba(0,0,0,.67),0 0 18px -10px var(--tone)}
.brd022-board .brd022-layer .micro{color:#fff;margin:0;text-align:left}
.brd022-board .layer-grid{display:grid;grid-template-columns:1fr;gap:15px;margin-top:16px}
.brd022-board .jewel{--gem:#9d75ff;position:relative;width:66px;height:66px;flex:none;display:grid;place-items:center;border-radius:19px;background:radial-gradient(circle at 33% 20%,rgba(255,255,255,.6),transparent 39%),linear-gradient(135deg,#9d75ff,#3a2a55 63%,#110b17);border:1px solid rgba(255,255,255,.88);box-shadow:inset 0 1px rgba(255,255,255,.6),inset 0 -8px 15px rgba(0,0,0,.53),0 0 27px rgba(157,117,255,.48),0 11px 25px rgba(0,0,0,.73);transform:rotate(-7deg);color:#fff}
.brd022-board .micro{font-size:14px;line-height:1.4;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:flex;gap:10px;align-items:center;margin:0 0 8px;text-align:left}
/* BRD-023 onboarding steps (shared step family) */
.step-rail{display:flex;align-items:center;gap:0;max-width:490px;margin:23px 0 14px}
.step-dot{position:relative;flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;background:#050507;color:#fff;border:1.5px solid rgba(255,255,255,.51);border-radius:50%;font-size:14px;font-weight:850;box-shadow:inset 0 1px rgba(255,255,255,.27),0 9px 19px rgba(0,0,0,.73);transition:.25s}
.step-dot[aria-current="step"]{border-color:#9d75ff;box-shadow:0 0 19px rgba(157,117,255,.67),inset 0 1px rgba(255,255,255,.53);background:#1d112e}
.step-dot[data-done="true"]{border-color:#55e39a;box-shadow:0 0 14px rgba(85,227,154,.52)}
.step-line{height:2px;min-width:8px;flex:1;background:linear-gradient(90deg,rgba(255,255,255,.39),rgba(157,117,255,.56));margin:0 7px}
.step-message{font-size:16px;color:#fff;line-height:1.55}

/* ============ SWEEP WAVE 2 — batch 6: navigation (2026-10-18) ============ */
/* NAV-004 top nav bar */
.sb-nav{display:flex;align-items:center;gap:16px;padding:10px 24px;background:rgba(5,5,7,.86);border-bottom:1px solid rgba(255,255,255,.10);backdrop-filter:blur(18px)}
.nav-orb{position:relative;width:40px;height:40px;flex:none;border:1px solid rgba(255,255,255,.6);border-radius:50%;background:radial-gradient(circle at 36% 26%,#6c5799,#120d1d 50%,#020203 85%);box-shadow:inset 0 1px 3px rgba(255,255,255,.42),0 7px 20px rgba(0,0,0,.35)}
.nav-orb:before{content:"";position:absolute;inset:-4px;border-radius:inherit;background:conic-gradient(from 40deg,transparent 0 205deg,rgba(255,255,255,.88) 236deg,var(--purple) 264deg,transparent 300deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0);animation:ring-spin 12s linear infinite}
.nav-label{font-size:14px;font-weight:800;letter-spacing:.12em;color:#fff}
.nav-links{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav-links a{color:#F8F7FB;text-decoration:none;font-size:14px;font-weight:700;padding:8px 11px;border-radius:999px}
.nav-links a:hover{background:#17181f;color:#f8f7fb}
/* NAV-005 favorites ribbon */
.sn-row{display:flex;gap:8px;overflow-x:auto;padding:8px;border-radius:999px;background:rgba(255,255,255,.03);border:1px solid var(--line);box-shadow:inset 0 1px rgba(255,255,255,.4),0 10px 26px rgba(0,0,0,.55);scrollbar-width:none}
.sn-row::-webkit-scrollbar{display:none}
.sn-pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;border:1px solid rgba(232,234,242,.28);background:linear-gradient(180deg,#17141f,#0a090e);color:var(--ink-dim);font-weight:700;font-size:13.5px;cursor:pointer;user-select:none;box-shadow:inset 0 1px rgba(255,255,255,.14),inset 0 -2px 5px rgba(0,0,0,.55),0 6px 16px rgba(0,0,0,.5);transition:transform .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),box-shadow .22s var(--ease)}
.sn-pill:hover{transform:translateY(-1px);color:var(--ink);border-color:rgba(232,234,242,.5)}
.sn-pill:active{transform:translateY(1px) scale(.98);box-shadow:inset 0 2px 8px rgba(0,0,0,.75)}
.sn-pill.heart{border-color:rgba(160,107,255,.55);color:var(--ink);box-shadow:inset 0 1px rgba(255,255,255,.16),inset 0 -2px 5px rgba(0,0,0,.5),0 0 14px -4px rgba(160,107,255,.5),0 8px 20px rgba(0,0,0,.55)}
.sn-pill.star{border-color:rgba(255,191,61,.5);color:var(--ink);box-shadow:inset 0 1px rgba(255,255,255,.16),inset 0 -2px 5px rgba(0,0,0,.5),0 0 14px -4px rgba(255,191,61,.45),0 8px 20px rgba(0,0,0,.55)}
.sn-pill.add{border-style:dashed;color:var(--ink-faint)}
.sn-pill.add:hover{color:var(--ink);border-color:rgba(232,234,242,.5)}
.sn-label{white-space:nowrap}
.sn-mark{display:inline-flex}
/* NAV-006 app room nav */
.app-nav{display:grid;gap:6px}
.app-nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;color:#F8F7FB;background:transparent;border:1px solid transparent;border-radius:13px;text-align:left;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.app-nav button[aria-selected=true]{color:var(--ink);background:#101116;border-color:var(--line);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.app-nav button[aria-selected=true] .nav-jewel{background:var(--tone);box-shadow:0 0 10px var(--tone)}
.nav-jewel{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--tone,#a06bff)}
/* NAV-007 anchor TOC */
.toc{display:flex;flex-wrap:wrap;gap:10px;margin:32px 0;justify-content:center}
.toc a{color:#F8F7FB;text-decoration:none;font-size:14px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;transition:all .2s}
.toc a:hover{color:#F8F7FB;border-color:#a06bff;box-shadow:0 0 16px rgba(160,107,255,.3)}
/* NAV-010 real footer */
.naya-footer{border-top:1px solid var(--line-soft);padding:40px 28px 32px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.015))}
.naya-footer-inner{max-width:1180px;margin:0 auto;display:grid;gap:28px}
.naya-footer-brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;color:var(--ink)}
.naya-footer-tag{font-size:13px;color:var(--ink-faint);margin-top:8px;max-width:260px;line-height:1.6}
.naya-footer a{display:block;font-size:13.5px;color:var(--ink-dim);text-decoration:none;padding:5px 0}
.naya-footer a:hover{color:var(--ink)}
.naya-footer-base{max-width:1180px;margin:32px auto 0;padding-top:20px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-faint)}
/* NAV-008 shared chrome */
.section-rail{background:rgba(11,9,19,.93);border-bottom:1px solid rgba(255,255,255,.13);backdrop-filter:blur(16px)}
.rail-inner{display:flex;align-items:center;gap:16px;overflow:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.rail-label{flex:none;color:#dcd0f2;font-size:14px;letter-spacing:.18em;font-weight:850}
.rail-link{flex:none;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:750;border:1px solid transparent;padding:8px 14px;border-radius:50px;color:#d4cfe0;transition:.2s}
.rail-link[aria-current="location"]{color:#fff;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.38);box-shadow:0 0 16px -6px rgba(255,255,255,.6)}
.elite-layout{width:min(100%,1770px);margin:0 auto;padding:0 22px}
/* NAV-009 brand mark */
.naya-brand{margin:0 auto;background:none;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;gap:11px;padding:6px 8px;font-family:inherit;-webkit-tap-highlight-color:transparent}
.naya-brand:hover .naya-brand-text b{color:#d9d4ff}
.naya-brand:active .naya-brand-text b{color:#d9d4ff}
.naya-brand:active{transform:scale(.97)}
.naya-brand-img{width:46px;height:46px;border-radius:12px;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 26px rgba(216,108,255,.27)}
.naya-brand-text b{display:block;font-size:13px;letter-spacing:.14em;text-align:left;font-weight:700;color:#fff}
.naya-brand-text small{display:block;color:#8a8a96;font-size:10px;letter-spacing:.22em;text-align:left}
.naya-brand:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* NAV-011 journey panel (shares .step family from BRD-023) */
.journey-demo{position:relative;overflow:hidden;padding:27px 29px;border:1.5px solid rgba(255,255,255,.45);border-radius:24px;background:linear-gradient(145deg,#16101e,#07080c 65%);box-shadow:inset 0 1px rgba(255,255,255,.27),0 22px 48px rgba(0,0,0,.8)}
.journey-demo h3{font:600 26px/1.2 Georgia,serif;color:#fff;margin:10px 0 8px}
.journey-demo p{color:#d8d3e0;font-size:14px;margin:0 0 4px}

/* ============ SWEEP WAVE 2 — batch 7: jewels + markers (2026-10-18) ============ */
/* JWL-020 meaning spheres */
.sphere{--tone:var(--purple);--rgb:var(--purple-rgb);position:relative;width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 23%,rgba(255,255,255,.55),rgba(var(--rgb),.5) 22%,rgba(var(--rgb),.18) 48%,#050507 78%);border:1px solid rgba(255,255,255,.6);box-shadow:inset -10px -14px 18px rgba(0,0,0,.5),inset 7px 7px 12px rgba(255,255,255,.1),0 18px 28px rgba(0,0,0,.28),0 0 22px rgba(var(--rgb),.25)}
.sphere:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,255,255,.42);border-top-color:#fff;animation:ring-spin 11s linear infinite}
.sphere .icon{width:26px;height:26px;color:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.6))}
.fine{font-size:12px;color:var(--ink-faint)}
/* JWL-021 avatar stack (shares .naya-avatar base from OVL-005) */
.naya-avatar-stack{display:inline-flex}
.naya-avatar-stack .naya-avatar{margin-left:-10px;border-color:#050507}
.naya-avatar-stack .naya-avatar:first-child{margin-left:0}
/* MRK-005 spectrum bar */
.spectrum-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;max-width:560px;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.5);width:100%}
.spectrum-bar span{flex:1}
.spectrum-bar span:nth-child(1){background:#a06bff;box-shadow:0 0 18px #a06bff}
.spectrum-bar span:nth-child(2){background:#6675ff;box-shadow:0 0 18px #6675ff}
.spectrum-bar span:nth-child(3){background:#3fb8ff;box-shadow:0 0 18px #3fb8ff}
.spectrum-bar span:nth-child(4){background:#2fe89e;box-shadow:0 0 18px #2fe89e}
.spectrum-bar span:nth-child(5){background:#40d3bb;box-shadow:0 0 18px #40d3bb}
.spectrum-bar span:nth-child(6){background:#ffd45a;box-shadow:0 0 18px #ffd45a}
.spectrum-bar span:nth-child(7){background:#ff9a5a;box-shadow:0 0 18px #ff9a5a}
.spectrum-bar span:nth-child(8){background:#ff5e6c;box-shadow:0 0 18px #ff5e6c}
.spectrum-bar span:nth-child(9){background:#e84fff;box-shadow:0 0 18px #e84fff}
/* MRK-006 count badge — shared .naya-badge, no new CSS */
/* MRK-007 skeleton loading */
.naya-skel{position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#16121f,#0d0c12);border:1px solid var(--line-soft);}
.naya-skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.07) 50%,transparent 80%);animation:naya-skel-sweep 1.8s ease-in-out infinite}
@keyframes naya-skel-sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* MRK-008 error state */
.naya-state{text-align:center;padding:56px 28px;border:1px dashed var(--line);border-radius:22px;background:rgba(255,255,255,.012)}
.naya-state-icon{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,#1b1726,#0a0a0e 70%);box-shadow:inset 0 1px rgba(255,255,255,.4),0 12px 30px rgba(0,0,0,.6);margin-bottom:16px;color:var(--ink-faint)}
.naya-state h3{font-size:17px;font-weight:800;color:var(--ink);margin:0 0 8px}
.naya-state p{font-size:13.5px;color:var(--ink-dim);max-width:380px;margin:0 auto 18px;line-height:1.6}
.naya-state.is-error .naya-state-icon{color:#ff5e6c;border-color:rgba(255,94,108,.35);box-shadow:inset 0 1px rgba(255,255,255,.4),0 0 26px -8px rgba(255,94,108,.5),0 12px 30px rgba(0,0,0,.6)}

.lawrect{background:#0c0c11;border:1.5px solid var(--lc);border-radius:12px;padding:16px 18px}
.lawrect b{display:block;font-size:11px;letter-spacing:.16em;color:var(--lc);margin-bottom:6px}
.lawrect span{font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.railblock{margin:0 0 18px}
.railblock{--sec:#a06bff}
.hero-show .hero-grid{display:flex;align-items:center;gap:48px;margin-top:8px}
.hero-show .hero-orb-wrap{flex:none}
.hero-show .orb--hero{width:220px;height:220px}
.hero-show .hero-copy{flex:1;min-width:0;text-align:left}
.hero-show h1{margin:0 0 16px}
@media(max-width:760px){.hero-show .hero-grid{flex-direction:column;gap:28px}.hero-show .orb--hero{width:170px;height:170px}}

/* --- tachometer/tn-tacho.css --- */
/* =====================================================================
   TN-TACHOMETER — the heartbeat. Scoped styles. Every class prefixed
   tn-tacho-.
   CIRCLE, NOT A BOX (Shawn 2026-10-31): the gauge is a freestanding circle —
   no card, no panel. The thin white rim (famring) is the family tie to the
   constellation orbs. Elevation lives in the needle, the numerals, the rim.
   SMART SPEEDOMETER (Shawn 2026-10-31): the dial's scale adapts to the score —
   bands 0–1K · 1K–10K · 10K–25K · 25K–50K · 50K–75K · 75K+. The dial always
   shows the current band; the needle shows position within the band.
   ===================================================================== */

.tn-tacho{
  position:relative;
  width:100%;
  max-width:420px;
  margin:0 auto;
  background:transparent;
  border:none;
  border-radius:0;
  padding:0;
  box-shadow:none;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* 2026-11-01 — Shawn: BLACK OBSIDIAN dial (sharper than Bugatti's grey),
   CHROME aluminum kept. The greys become blacks, the metal stays brilliant.
   This sharpens it — blacker blacks, brighter chrome. */
.tn-tacho-dialwrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, #0c0c10 0%, #060608 70%, #020203 100%);
  /* 2026-11-01 — Shawn: BUGATTI BEZEL. Machined aluminum, brushed metal.
     Thick, physical, real. Not a thin border — a machined ring.
     2026-11-02 — GRADE 12: The dial is RECESSED 12px into the housing.
     Deep inner shadow = you see the depth, the dial is IN the metal. */
  border:12px solid transparent; /* 2026-11-02 — Shawn: out further */
  background-clip:padding-box;
  box-shadow:
    /* the recess: dial sits DEEP — shadow all around the inner edge */
    inset 0 20px 60px rgba(0,0,0,1),
    inset 0 -16px 40px rgba(0,0,0,.95),
    inset 0 0 0 4px rgba(0,0,0,1),
    /* subtle inner edge light — the metal lip catching light */
    inset 0 0 0 5px rgba(255,255,255,.06),
    /* outer: the housing has mass, sits on the page */
    0 40px 100px rgba(0,0,0,.95),
    0 8px 24px rgba(0,0,0,.8);
}
/* 2026-11-01 — Shawn: BRUSHED METAL. The bezel is machined aluminum.
   Fine circular brushing, highlights at top-left (the light source). */
.tn-tacho-dialwrap::after{
  content:''; position:absolute; inset:-12px; border-radius:50%; z-index:4; /* 2026-11-02 — Shawn: out further, black visible */
  animation:orbVortex 50s linear infinite; /* 2026-11-02 — Shawn: outer ring spins CW, slightly faster than inner vortex */
  background:
    /* 2026-11-02 — Shawn: ORB GEARS on the main gauge. Dark, toothed, unified.
       Same language as orbs. Tighter (14px, not 18px). */
    /* 2026-11-02 — Shawn: SAME teeth as orbs, just bigger. One family. */
    /* 2026-11-02 — Shawn: THIN teeth like orbs, black gaps visible. Ball effect. */
    /* 2026-11-02 — Shawn: NO glow — clean black gaps all the way through. */
    repeating-conic-gradient(from -90deg,
      #d0d4de 0deg 1deg,
      #7a7e88 1deg 1.8deg,
      transparent 1.8deg 15deg);
  -webkit-mask: radial-gradient(circle at 50% 50%, transparent 65%, black 65%, black 100%);
  mask: radial-gradient(circle at 50% 50%, transparent 65%, black 65%, black 100%);
  pointer-events:none;
}
/* 2026-11-01 — DIAL TEXTURE. Real dials have subtle grain, not flat black. */
.tn-tacho-dialwrap::before{
  /* CRYSTAL: real glass with a visible reflection, like the Bugatti's sapphire crystal.
     You see the reflection arc across the top — proof it's glass, not a flat image. */
  content:''; position:absolute; inset:0; border-radius:50%; z-index:5;
  background:
    linear-gradient(115deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.10) 18%, transparent 38%),
    linear-gradient(295deg, rgba(255,255,255,.08) 0%, transparent 25%),
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.04) 0%, transparent 40%);
  pointer-events:none;
}
/* 2026-11-02 — Shawn: SMART TAB BEZEL REMOVED. Replaced with orb teeth (rule above). */

.tn-tacho-dial{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* 2026-11-01 — Shawn: FORGET THE LIGHT. The gauge must look REAL first.
   Energy track hidden until the gauge itself is a real instrument. */
.tn-tacho-track{ display:none; }
.tn-tacho-fill{ display:none; }
.tn-tacho-comet{ display:none; }
.tn-tacho-famring{ animation:tnFamBreathe 4.5s ease-in-out infinite; }
@keyframes tnFamBreathe{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@media(prefers-reduced-motion:reduce){ .tn-tacho-famring{ animation:none; } }

/* --- the living fill: ENERGY IN A CHANNEL. Not a neon tube on top.
       The light sits INSIDE the recessed groove, narrower than the channel,
       glowing outward and illuminating the dial around it. Like plasma. --- */
.tn-tacho-fill{
  fill:none;
  stroke:url(#tnLaser);
  stroke-width:12;
  stroke-linecap:round;
  stroke-dasharray:377;
  stroke-dashoffset:377;
  filter:
    drop-shadow(0 0 6px rgba(255,255,255,.9))
    drop-shadow(0 0 18px rgba(160,200,255,.6))
    drop-shadow(0 0 36px rgba(160,107,255,.4));
}
/* 2026-11-01 — Shawn: THE COMET LAYER. White-hot energy flowing through the arc.
   Not a separate object — the brightness lives IN the spectrum. */
.tn-tacho-comet{
  fill:none;
  stroke:url(#tnCometFlow);
  stroke-width:10;
  stroke-linecap:round;
  stroke-dasharray:377;
  stroke-dashoffset:377;
  filter:
    drop-shadow(0 0 6px rgba(255,255,255,.9))
    drop-shadow(0 0 16px rgba(255,255,255,.5));
  mix-blend-mode:screen;
}


/* --- ticks: harvested geometry, 11 ticks, 27° steps --- */
/* tick styles are inline per-tick */

/* --- THE needle: frame-driven for sync, but sweeps like acceleration.
       When the score changes, the needle SWEEPS with power — like a supercar
       on startup. The easing is aggressive: fast start, smooth settle. --- */
.tn-tacho-needle{
  transform-origin:100px 104px;
  /* the needle casts a shadow — it's a physical object above the dial */
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.8));
  /* ACCELERATION: the needle sweeps, never jumps */
  transition:transform 1.2s cubic-bezier(.15,.85,.25,1);
}
/* 2026-11-01 — REBUILT. Old needle line/circle replaced by physical needle
   (tn-needle-body, tn-needle-counter, tn-needle-hub, tn-needle-cap above). */

/* --- readout: the numeral sits BELOW the arc, in the dial's open bottom
       gap (Shawn 2026-10-31: the number must never block the needle's sweep).
       The needle sweeps 135deg->405deg; the bottom 90deg gap is never touched. --- */
/* 2026-11-01 — RED ZONE. The danger zone, like the Bugatti. */
.tn-tacho-redzone{ fill:none; stroke:#ff5e6c; stroke-width:4; opacity:.9;
  filter:drop-shadow(0 0 4px rgba(255,94,108,.6)); }

/* 2026-11-01 — Shawn: DEPTH PLATE. Dark recess behind the gears.
   The movement floats ABOVE the plate. You see depth, not flatness. */
.tn-depth-plate{ fill:#050508; stroke:#1a1a24; stroke-width:1;
  filter:drop-shadow(0 -2px 6px rgba(0,0,0,.9)); }
/* 2026-11-01 — Shawn: TITANIUM. Platinum silver, luminous, real machined metal.
   Like a Swiss movement — bright, precise, you see the machining.
   DEPTH underneath: dark recess so the gears float above the plate. */
.tn-gear-tooth{ fill:#8a8a9c; stroke:#c0c0d0; stroke-width:.7; }
/* 2026-11-02 — ALUMINUM, NOT PLASTIC. Shawn: "don't copy the color, copy the aluminum."
   Metal = sharp highlights + machining marks + high contrast. Plastic = flat fill.
   These overrides give the gears a machined aluminum material. */
.tn-gear-tooth{
  fill:url(#tnAluTooth);
  stroke:#d0d0da; stroke-width:.6;
}
/* 2026-11-02 — SHAWN: Dark aluminum layers for strong separation. */
.tn-dark-layer .tn-gear-tooth{
  fill:url(#tnAluDark);
  stroke:#5a5e6a; stroke-width:.6;
}
.tn-gear-bevel{ stroke:rgba(255,255,255,.7); stroke-width:.6; }
.tn-gear-hub{ fill:url(#tnAluHub); stroke:#a0a0b0; stroke-width:.8; }

/* 2026-11-02 — REFERENCE BUILD. Purple jewels (bearings) like the luxury gauge.

/* 2026-11-01 — REBUILT. The needle is a PHYSICAL OBJECT.

.tn-needle-body{ fill:#f0f0f8; stroke:#ffffff; stroke-width:.8;

  filter:drop-shadow(0 3px 6px rgba(0,0,0,.9))

}
.tn-tacho-ticks line{ /* stroke set inline per-tick: purple/white alternating */ }
/* 2026-11-02 — BUGATTI DIAL SCREWS. 4 screws holding the dial.

/* 2026-11-02 — CLEAN REBUILD. New gauge classes. */
.tn-dial-num{ font-size:7.5px; font-weight:700; fill:#ffffff; font-family:Georgia,'Times New Roman',serif; letter-spacing:.08em; }
.tn-dial-num-shadow{ font-size:7.5px; font-weight:600; font-family:Georgia,'Times New Roman',serif; letter-spacing:.08em; fill:#000000; opacity:.85; font-family:'Arial Narrow',Inter,Arial,sans-serif; letter-spacing:.05em; }

/* 2026-11-01 — Shawn: digital readout like Bugatti's "000".

/* 2026-11-01 — Shawn: NO OVERLAY TEXT. Real speedometers don't have floating text.

}
.tn-tacho-num{

/* 2026-11-01 — Shawn: green flashing LIVE badge. The data is live from the

.tn-live-badge{

}
/* 2026-11-01 — Shawn: time pills on the constellation. */
/* 2026-11-01 — Shawn: time pills live BESIDE the constellation, not below it.

.os-ld-timepills{

/* --- band edge labels on the dial: the current band's range, always labeled --- */
.tn-tacho-bandlo,.tn-tacho-bandhi{
  font-size:9.5px;
  font-weight:700;
  fill:#777;
  font-family:inherit;
}
/* --- human words under the number: "175 of 1,000 — Stirring at 1,000" --- */
.tn-tacho-bandline{
  display:block;
  margin-top:8px;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.02em;
  color:#fff;

/* V4: responsive beat on band change — Law 6, alive = responsive, not lit at rest. */
.tn-tacho-bandline.tn-bl-beat{ animation:tnBandlineBeat .6s ease-out 1; }
@keyframes tnBandlineBeat{ 0%{ transform:scale(1);} 30%{ transform:scale(1.14);} 100%{ transform:scale(1);} }
/* --- band ladder: completed bands marked, current band lit.
       Lives INSIDE the dial's open bottom (absolute) so the gauge stays
       compact — the birth orb above must never be clipped.
       V4: dots 10px → 16px (Shawn: "barely see"), pointer events on so
       tap/hover names the band, label above the row. --- */
/* 2026-11-01 — Shawn: "not sure what the dots are doing." Gone. The orbs
   are the story now; the dots were decoration without purpose. */
.tn-tacho-bands{ display:none !important; }
.tn-tacho-bands-label{ display:none !important; }
.tn-tacho-bands-label{
  position:absolute;
  left:0; right:0; bottom:calc(1.5% + 26px);
  text-align:center;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:rgba(255,255,255,.85);
  opacity:0;
  transition:opacity .25s;
  pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.tn-tacho-bands-label.show{ opacity:1; }
.tn-tacho-band{
  width:16px;height:16px;border-radius:50%;
  border:2px solid var(--bc);
  background:transparent;
  opacity:.55;
  transition:all .3s;
  cursor:pointer;
  /* lens 1 — elevation: inset depth on every dot, nothing flat.
     No outer glow at rest (lens: alive = responsive). */
  box-shadow:inset 0 1px 1px rgba(255,255,255,.28), inset 0 -2px 4px rgba(0,0,0,.55);
}
.tn-tacho-band.done{ background:var(--bc); opacity:1;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.45), inset 0 -2px 5px rgba(0,0,0,.5); }
/* V4 + design law: the current band reads by FILL (identity) at rest — never lit
   at rest. Glow/ignition on touch only. */
.tn-tacho-band.cur{
  background:var(--bc); opacity:1;
  box-shadow:none;
  /* 2026-11-01 — Shawn's eye: the dots must feel ALIVE. The current
     band breathes gently (scale pulse, no glow — alive, not lit). */
  animation:tnBandBreathe 2.4s ease-in-out infinite;
}
@keyframes tnBandBreathe{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.18);} }
.tn-tacho-band.done{ animation:tnBandBreathe 3.2s ease-in-out infinite; }
.tn-tacho-band:hover,.tn-tacho-band:focus-visible{
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 0 14px var(--bc);
}
@keyframes tnBandPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.25);} }
/* --- truth line: gate check #17 — one line, always --- */
/* 2026-11-01 — Shawn: ledger text removed from the constellation.
   It overlapped the orbs. The orbs speak for themselves. */
.tn-tacho-truth{ display:none !important; }
/*__orig__*/.tn-tacho-truth{
  margin:4px 6px 0;
  text-align:center;
  font-size:10.5px;
  line-height:1.45;
  letter-spacing:.04em;
  color:#8a8a96;
}
/* --- band shift: when the dial opens to a wider band, it breathes — the
       needle reset reads as the dial opening, never a glitch --- */
.tn-tacho-dialwrap.tn-tacho-bandshift{ animation:tnBandShift .5s ease-out 1; }
@keyframes tnBandShift{ 0%{ transform:scale(.97);} 60%{ transform:scale(1.015);} 100%{ transform:scale(1);} }
@media(prefers-reduced-motion:reduce){
  .tn-tacho-band.cur{ animation:none; }
  .tn-tacho-dialwrap.tn-tacho-bandshift{ animation:none; }
  .tn-tacho-bandline.tn-bl-beat{ animation:none; }
}

/* --- small screens: the instrument stays legible --- */
@media (max-width:420px){
  .tn-tacho{ max-width:340px; }
  .tn-tacho-num{ font-size:40px; }
  .tn-tacho-label{ font-size:10px; letter-spacing:.22em; }
}

/* --- reduced motion: the needle jumps cleanly, no sweep, no pulse --- */
@media (prefers-reduced-motion: reduce){
  .tn-tacho-livedot{ animation:none !important; }
}


/* --- voice/tn-voice.css --- */
/* ============================================================================
   TN-VOICE styles — scoped. Every class is prefixed tn-voice-.
   The narrator whispers: quiet type, generous line-height, numerals that pop
   in bright spectrum green (#2fe89e) — the settled "numbers pop" color.
   Grandmother-readable: 15px minimum, high contrast, no decoration that
   shouts over the meaning.
   ========================================================================== */

/* A mounted sentence. The integrator places [data-tn-voice] slots; this makes
   whatever lands in them read as one calm voice. */
.tn-voice-sent {
  font-size: 15px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.84);
  font-weight: 400;
  letter-spacing: 0.01em;
  max-width: 72ch;
  margin: 0;
}

/* Numerals inside sentences: the number is the proof, so it pops. */
.tn-voice-sent .tn-voice-num {
  color: #2fe89e;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Empty slots (e.g. the quiet slot when there IS activity) take no space. */
.tn-voice-empty {
  display: none !important;
}

/* Chart-pinned annotations: a thin edge in the annotation's own color, never
   a wash. Depth, not glow. */
.tn-voice-annot {
  border-left: 2px solid #2fe89e;
  padding-left: 12px;
  margin-top: 10px;
}
.tn-voice-annot[data-tn-voice="annotation-journey"] { border-left-color: #a06bff; }
.tn-voice-annot[data-tn-voice="annotation-mix"]     { border-left-color: #ffbf3d; }

/* The signature line: smaller, dimmer — it signs the work, not shouts it. */
.tn-voice-sig {
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 0.02em;
}

/* The hero sentence may carry more weight where the design wants it. */
.tn-voice-hero {
  font-size: 17px;
  color: rgba(255, 255, 255, 0.92);
}

/* Reduced motion: the words never animate anyway, but honor the setting. */
@media (prefers-reduced-motion: reduce) {
  .tn-voice-sent { transition: none; }
}

/* Small screens: never smaller than 14px — readable or it doesn't ship. */
@media (max-width: 480px) {
  .tn-voice-sent { font-size: 14px; }
  .tn-voice-hero { font-size: 16px; }
}


/* --- rooms/rooms.css --- */
/* ==========================================================================
   TN-ROOMS — the bottom half, rebuilt. One instrument, perfected.
   Every class prefixed tn-rooms-. Scoped: nothing here touches the page
   outside [data-tn-rooms] mounts.

   STRUCTURAL LAW (the overlap can never return):
   - Grid children NEVER combine aspect-ratio with min-height. That combo
     forced card width past the track (444px card in a 324px track = the
     108px bleed Shawn photographed). Cards size to their TRACK:
     width:100%, max-width:100%, min-width:0, overflow:hidden.
   - Every flex/grid child gets min-width:0. Long words can't force width.
   - Text clips (ellipsis / line-clamp), never pushes.
   ========================================================================== */

[data-tn-rooms]{ --tn-purple:#a06bff; --tn-blue:#3fb8ff; --tn-green:#2fe89e;
  --tn-gold:#ffbf3d; --tn-orange:#ff9a5a; --tn-red:#ff5e6c; --tn-magenta:#e84fff;
  --tn-ink:#fff; --tn-dim:#a7a7b3; --tn-faint:#8a8a96;
  --tn-card:#101016; --tn-card2:#0a0a10; --tn-line:rgba(255,255,255,.09); }

/* ---------- section chrome ---------- */
.tn-rooms-sec{ margin:30px 0; }
.tn-rooms-h{ display:flex; align-items:center; gap:10px; margin:0 0 4px;
  font-size:17px; font-weight:800; color:var(--tn-ink); letter-spacing:.01em; }
.tn-rooms-sub{ margin:0 0 14px; font-size:13px; color:var(--tn-dim); max-width:70ch; }
.tn-rooms-jewel{ flex:none; width:34px; height:34px; border-radius:11px;
  display:inline-flex; align-items:center; justify-content:center; font-size:17px;
  background:#0c0c12; border:1.5px solid var(--jc,#a06bff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 0 14px -5px var(--jc,#a06bff); }

/* ---------- the grid that cannot overlap ---------- */
.tn-rooms-grid{ display:grid; gap:14px;
  grid-template-columns:repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }

.tn-rooms-card{ --ac:#a06bff;
  min-width:0; max-width:100%; width:100%; overflow:hidden; box-sizing:border-box;
  display:flex; flex-direction:column; gap:9px;
  min-height:212px; /* calm floor only — content decides the rest; NEVER aspect-ratio here */
  background:linear-gradient(180deg, var(--tn-card), var(--tn-card2));
  border:1px solid var(--tn-line); border-radius:16px; padding:16px 16px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),
             inset 0 -10px 18px rgba(0,0,0,.35),
             0 10px 24px rgba(0,0,0,.45);
  transition:border-color .25s, box-shadow .25s, transform .25s; }
.tn-rooms-card > *{ min-width:0; }
.tn-rooms-card:hover{ border-color:var(--ac); transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),
             0 0 20px -6px var(--ac),
             0 14px 28px rgba(0,0,0,.5); }

.tn-rooms-top{ display:flex; align-items:center; gap:10px; }
.tn-rooms-name{ flex:1 1 auto; min-width:0; font-size:15px; font-weight:800;
  color:var(--tn-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tn-rooms-chip{ flex:none; font-size:10px; font-weight:800; letter-spacing:.1em;
  color:#0b0b11; background:var(--tn-green); border-radius:999px; padding:3px 9px;
  box-shadow:0 0 10px -2px var(--tn-green); }
.tn-rooms-chip.idle{ color:#c9c9d4; background:transparent;
  border:1px solid rgba(255,255,255,.22); box-shadow:none; letter-spacing:.08em; }
.tn-rooms-chip.born{ color:#0b0b11; background:var(--tn-blue);
  box-shadow:0 0 10px -2px var(--tn-blue); }

.tn-rooms-sig{ margin:0; font-size:13px; font-weight:800; color:var(--tn-ink);
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.tn-rooms-sig.quiet{ color:var(--tn-faint); font-weight:600; font-style:italic; }
.tn-rooms-note{ margin:0; font-size:12.5px; line-height:1.5; color:var(--tn-dim);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden; }
.tn-rooms-faces{ display:flex; gap:6px; margin:2px 0 0; }
.tn-rooms-face{ width:26px; height:26px; border-radius:50%; flex:none;
  display:inline-flex; align-items:center; justify-content:center;

/* — Reports: the LIVING dashboard — layout scoped here; the life itself is
     harvested from the page's own elite layer (.donut + donutFill, .bar +
     barGrow, .stat-card fadeUp + hover lift, pulseGlow). The donutFill
     keyframes hold rotate(-90deg) at both ends, so the ring carries that
     as its base transform (no end-of-animation snap) and the conic
     gradient starts from 90deg to compensate — segments begin at top. — */
.os-donut-wrap{position:relative;width:120px;height:120px;margin:18px auto 8px;border-radius:50%;--bc:#e84fff;box-shadow:inset 0 2px 4px rgba(255,255,255,.16),inset 0 -10px 22px rgba(0,0,0,.55),0 16px 34px rgba(0,0,0,.5)}

.os-donut-cap{font-size:9px;letter-spacing:.18em;color:#E8E8EC;font-weight:800;margin-top:2px}
.os-legend{display:flex;flex-direction:column;gap:7px;margin-top:12px}

.os-week-counts span{font-size:12px;font-weight:800;color:#fff}
.os-week-counts span.zero{color:#E8E8EC;opacity:.45;font-weight:600}
.os-week-days span{font-size:11px;color:#E8E8EC;letter-spacing:.03em}
.os-week-days span.today{color:#fff;font-weight:800}

/* — BATCH 2 (ten-star items 3–10): faces, the invite journey, conversation
     inbox, and ONE LIFE PASS over every block. All life is the page's own
     harvested machinery: fadeUp entrances, pulseGlow breathing (fed by
     --bc), spectrum colors per author/stage, ignite in the card's own
     --ac. Nothing invented; composed. — */
/* life pass: a block's children rise in, staggered, every time it opens */
.os-view.on>*{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) backwards}
.os-view.on>*:nth-child(2){animation-delay:.05s}
.os-view.on>*:nth-child(3){animation-delay:.10s}
.os-view.on>*:nth-child(4){animation-delay:.15s}
.os-view.on>*:nth-child(5){animation-delay:.20s}
.os-view.on>*:nth-child(6){animation-delay:.25s}
.os-view.on>*:nth-child(7){animation-delay:.30s}
.os-view.on>*:nth-child(8){animation-delay:.35s}
/* breathing accents: section dots breathe in their own color */
.ph-dot{--bc:currentColor;animation:pulseGlow 3s infinite}
/* ignite on hover/touch — EDGE ONLY (Shawn's hover law, EYE-PASS CURE
   2026-10-22): the border + glow light in the board's own spectrum
   position (--igc, assigned by board order in each view by osIgnite —
   Addition B: boards walk purple → blue → green → gold → orange → red
   → magenta, never all one color); the TEXT never changes color. */
.os-view .ph-card{transition:border-color .25s ease,box-shadow .25s ease}
.os-view .ph-card:hover{border-color:var(--igc,var(--ac,#a06bff));box-shadow:0 0 22px -6px var(--igc,var(--ac,#a06bff)),inset 0 1px 0 rgba(255,255,255,.14)}
.os-view .ph-card:active{border-color:var(--igc,var(--ac,#a06bff));box-shadow:0 0 30px -4px var(--igc,var(--ac,#a06bff)),inset 0 1px 0 rgba(255,255,255,.20)}
/* people, present: spectrum initial avatars; active-in-a-day = glowing ring */
.os-av{position:relative;width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(180deg,#17171f,#0a0a0f);border:2px solid var(--avc,#a06bff);box-shadow:0 0 12px -3px var(--avc,#a06bff)}

.os-who{display:flex;gap:12px;align-items:flex-start}
.os-who-main{flex:1;min-width:0}

.os-face-name{font-weight:800;color:#fff;font-size:13.5px;line-height:1.25;word-break:break-word}
.os-face-fact{font-size:11.5px;color:#E8E8EC;line-height:1.35}
.os-face-msg{margin-top:2px;padding:6px 13px;font-size:12px}

.os-funnel{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.os-fbar{height:40px;border-radius:10px;background:linear-gradient(90deg,var(--fc,#ff5e6c),rgba(255,255,255,.05));display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:800;font-size:13.5px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.4)}
.os-fconv{font-size:12px;color:#E8E8EC;padding-left:6px}

/* inbox, conversational: snippets, relative times, an honest NEW glow */
.os-thread-new{border-color:#ff9a5a!important;box-shadow:0 0 22px -6px #ff9a5a}
.os-newchip{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.12em;color:#0b0b11;background:#ff9a5a;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:2px}
.os-snippet{color:#E8E8EC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ph-navtab .os-badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff9a5a;margin-left:7px;box-shadow:0 0 10px 1px #ff9a5a;vertical-align:2px}

@media (prefers-reduced-motion: reduce){
.os-view.on>*{animation:none}

}
/* — LIVING GRAPHICS PASS (2026-10-22): the data objects themselves become
     lit, physical, moving things. Wells are recessed stages; bars are lit
     objects with value pills; numerals are light, never print; the donut
     is a beveled jewel with a traveling sheen; funnel stages are slabs
     joined by flowing light; faces are coins with rotating hot arcs.
     Calm / reduced-motion = the same scene, lit and static. — */
.os-well{position:relative;border-radius:14px;padding:14px 10px 10px;background:linear-gradient(180deg,#08080d,#10101a);box-shadow:inset 0 3px 10px rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.28),0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.os-well-grid{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 23px),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 46px);background-color:#0a0a12}
.os-beam{position:absolute;top:0;bottom:0;width:44px;left:0;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transition:opacity .25s}
.os-week-counts:empty{display:none}
.os-week .bar{animation:osBarGrow .8s cubic-bezier(.2,.7,.2,1) both,osBarBreathe 3.4s ease-in-out .9s infinite;position:relative;transform-origin:50% 100%;background:linear-gradient(180deg,#fff 0,color-mix(in srgb,var(--barc,#e84fff) 88%,#fff) 12%,var(--barc,#e84fff) 55%,color-mix(in srgb,var(--barc,#e84fff) 42%,#000) 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85),inset 1px 0 0 rgba(255,255,255,.18),0 10px 18px rgba(0,0,0,.6),inset -1.5px 0 0 rgba(0,0,0,.4),inset 0 -6px 10px rgba(0,0,0,.35);animation-delay:calc(var(--i,0)*60ms),calc(var(--i,0)*60ms + .9s)}
@keyframes osBarGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes osBarBreathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
.os-week .bar.today{animation:osBarGrow .8s cubic-bezier(.2,.7,.2,1) both,osBarPulse 2.6s ease-in-out .9s infinite}
@keyframes osBarPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
.os-bar-pill{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:900;line-height:1;color:#0b0b11;background:linear-gradient(180deg,#fff,var(--barc,#e84fff));border-radius:7px;padding:3px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 4px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.5);white-space:nowrap}
/* ═══ DASHBOARD VITALITY (directive #31, 2026-10-30 — Shawn) ═══ */
.os-daylegend{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0 2px;font-size:10px;font-weight:800;letter-spacing:.06em;color:#c9c9d2}

.os-donut-hole{z-index:3;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 10px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.14)}

.os-fbar{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--fc,#ff5e6c) 72%,#fff) 0,var(--fc,#ff5e6c) 34%,color-mix(in srgb,var(--fc,#ff5e6c) 45%,#000) 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -5px 9px rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.5),0 0 16px -6px var(--fc,#ff5e6c);animation:osSlabIn .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}

/* THE COVER GEOMETRY (EYE ROUND 3, decided 2026-10-22 21:51Z —
   Phi's round-2 scorecard item 1, closed by name): the cover is a
   BAND with fixed geometry: aspect-ratio 16/9 (Shawn's ruled 1.7778,
   embodied in the bytes) with a max-height cap of 360px on wide
   screens. Phones get the true 16:9 band (≈219px at 390 wide);
   desktops get a cinematic ≈3.5:1 window instead of a full-screen
   wall. The photo fills the band (object-fit: cover, never
   distorted) and the owner drags it to choose the window — the
   position persists (the engine's cover-drag, fm.coverPos). The
   identity composition anchors to the band's bottom edge. */
.ph-cover{height:auto;aspect-ratio:16/9;max-height:min(55vh,600px);background:radial-gradient(560px 240px at 12% -10%,rgba(160,107,255,.5),transparent 60%),radial-gradient(520px 260px at 88% 0%,rgba(232,79,255,.32),transparent 60%),radial-gradient(640px 300px at 55% 118%,rgba(63,184,255,.34),transparent 62%),linear-gradient(135deg,#1a1a3e,#2d1b4e 30%,#4a2b7a 55%,#0f3460 80%,#16537e)}

/* 2026-11-02 — SHAWN: Orbs get the vortex treatment. A thin dashed ring inside,
   rotating slowly — mechanical presence, same family as the gauge.
   Subtle, not flashy. The orb is part of the machine. */
.os-ld-vortex{
  /* 2026-11-02 — Shawn: MECHANICAL GEAR behind the number.
     Subtle toothed ring, counter-rotating against the ticks.
     Faint — the number and label are the heroes. */
  position:absolute; inset:14px; border-radius:50%; pointer-events:none;
  background:repeating-conic-gradient(from 0deg,
    rgba(255,255,255,.06) 0deg 3deg,
    transparent 3deg 10deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
  opacity:.5;
  animation:orbVortexRev 60s linear infinite;
}
/* 2026-11-02 — SHAWN: Orbs are mini speedometers. A lit tick ring in the orb's
   own color circles each orb — the mother gauge's chapter ring, in miniature.
   Same machine language: ticks, rotation, own-color light. */
.os-ld-ticks{
  /* 2026-11-02 — Shawn: MECHANICAL. Engraved ticks on the outer bezel edge.
     Tight to the orb, like a watch bezel. Ticks CW, inner gear CCW. */
  position:absolute; inset:-7px; border-radius:50%; pointer-events:none;
  background:repeating-conic-gradient(from -90deg,
    #d0d4de 0deg 1deg,
    #7a7e88 1deg 1.8deg,
    transparent 1.8deg 15deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  opacity:.85;
  filter:none;
  animation:orbVortex 48s linear infinite;
}
@keyframes orbVortex{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}
@keyframes orbVortexRev{
  from{ transform:rotate(360deg); }
  to{ transform:rotate(0deg); }
}

   viewport). Now the org hugs the instrument and the mount centers it. */
.os-ld-links{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.os-ld-core{position:absolute;left:50%;top:52%;width:244px;height:244px;border-radius:50%;z-index:3;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 30%, #181820 0%, #0b0b11 58%, #060608 100%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 3px 10px rgba(255,255,255,.10), inset 0 -16px 30px rgba(0,0,0,.65),
    0 18px 44px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  animation:osLdBreathe 4.5s ease-in-out infinite;}
@keyframes osLdBreathe{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.022);}}
.os-ld-core.ld-flare{animation:osLdFlare 1.1s ease-out 1, osLdBreathe 4.5s ease-in-out 1.15s infinite;}
@keyframes osLdFlare{0%{transform:translate(-50%,-50%) scale(1);}35%{transform:translate(-50%,-50%) scale(1.07);}100%{transform:translate(-50%,-50%) scale(1);}}
.os-ld-ring{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);pointer-events:none;}
.os-ld-score b{display:block;font-size:62px;font-weight:900;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.55);}
/* V9.8 EPIC HERO (Framework + Philosophy): the score is PRECIOUS.
   Gold (value), massive, glowing aura — like the most precious data in the universe. */
.os-ld-score b{
  font-size:88px !important;
  color:#ffbf3d !important;
  text-shadow:0 0 40px rgba(255,191,61,.45),0 0 80px rgba(255,191,61,.2),0 4px 0 rgba(0,0,0,.6) !important;

}
.os-ld-score{

}
.os-ld-score::before{
