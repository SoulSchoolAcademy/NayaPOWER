<style>
/* Smart Tabs unit v13 — inlined, single file, bar renders anywhere */
/* Naya Smart Tabs — native unit. The circulation system: every app ships it.
   Laws baked in: white text always · white rim at rest, own color ignites on
   touch · spectrum only on edges/glows · black heart always · zero flat. */
.naya-tabs {
  position: sticky; top: 10px; z-index: 120;
  display: flex; gap: 8px; align-items: center;
  justify-content: safe center; /* centered when they fit, left-flow when they overflow */
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 10px 12px; border-radius: 999px;
  background: rgba(5,5,7,.82);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: 0 12px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.5);
}
.naya-tabs::-webkit-scrollbar { display: none; }
/* + Add pins to the right edge of the bar, always in reach. */
.naya-tabs .add-tab {
  background: #0b0b11;
  border-style: dashed;
}
.naya-tab {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 9px;
  padding: 10px 16px; border-radius: 999px; cursor: pointer;
  background: linear-gradient(180deg,#17171f,#0a0a0f); /* Law 15: zero flat */
  border: 1.5px solid #F8F7FB; /* bright white at rest — never a dead button */
  color: #F8F7FB; font-weight: 800; font-size: 14px; letter-spacing: .02em;
  transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
  user-select: none; -webkit-user-select: none;
  box-shadow: inset 0 2px 3px rgba(255,255,255,.45), inset 0 -3px 8px rgba(0,0,0,.55),
    0 0 22px rgba(248,247,251,.4), 0 12px 26px rgba(0,0,0,.65);
}
.naya-tab:hover, .naya-tab:focus-visible {
  border-color: var(--tab-color, #a06bff);
  box-shadow: inset 0 1px rgba(255,255,255,.5), inset 0 -2px 6px rgba(0,0,0,.4),
              0 0 0 1.5px var(--tab-color, #a06bff),
              0 0 28px color-mix(in srgb, var(--tab-color, #a06bff) 75%, transparent),
              0 14px 30px rgba(0,0,0,.6);
  transform: translateY(-3px);
  outline: none;
}
.naya-tab:hover .tab-jewel, .naya-tab:focus-visible .tab-jewel {
  transform: rotate(45deg) scale(1.35);
  box-shadow: 0 0 14px var(--tab-color, #a06bff), 0 0 34px color-mix(in srgb, var(--tab-color, #a06bff) 65%, transparent);
}
.naya-tab.active {
  border-color: var(--tab-color, #a06bff);
  box-shadow: 0 0 0 1.5px var(--tab-color, #a06bff),
              0 0 22px color-mix(in srgb, var(--tab-color, #a06bff) 65%, transparent);
}
.naya-tab .tab-jewel {
  width: 9px; height: 9px; flex: 0 0 auto;
  transform: rotate(45deg); border-radius: 2px;
  background: var(--tab-color, #a06bff);
  box-shadow: 0 0 8px var(--tab-color, #a06bff);
  transition: transform .25s cubic-bezier(.16,.84,.22,1), box-shadow .25s;
}
.naya-tab .tab-label { white-space: nowrap; }
.naya-tab .tab-state { font-size: 12px; opacity: .9; margin-left: 2px; }
/* Quick heart/star: one tap marks the tab right there — no menu digging. */
.naya-tab .qact {
  appearance: none; border: 1px solid transparent; background: transparent;
  color: rgba(248,247,251,.38); font-size: 15px; line-height: 1;
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; margin-left: 2px; transition: color .2s, box-shadow .2s, transform .15s;
}
.naya-tab .qact:hover { transform: scale(1.15); color: #F8F7FB; }
.naya-tab .q-heart.on { color: #a06bff; text-shadow: 0 0 10px #a06bff; }
.naya-tab .q-star.on { color: #ffd45a; text-shadow: 0 0 10px #ffd45a; }
.naya-tab .qact:focus-visible { outline: 2px solid #F8F7FB; outline-offset: 1px; }
/* Compact density: twelve worlds in one bar — smaller pills, same laws. */
.naya-tabs.compact { gap: 6px; padding: 8px 10px; }
.naya-tabs.compact .naya-tab { padding: 8px 12px; font-size: 12.5px; gap: 7px; }
.naya-tabs.compact .naya-tab .qact { width: 24px; height: 24px; font-size: 12px; margin-left: 1px; }
.naya-tabs.compact .naya-tab .tab-edit { padding: 4px 8px; font-size: 12px; }
.naya-tab .tab-edit {
  border: 0; background: rgba(255,255,255,.10); color: #F8F7FB;
  border-radius: 8px; padding: 3px 8px; cursor: pointer; font-size: 13px;
  line-height: 1;
}
.naya-tab .tab-edit:hover { background: rgba(255,255,255,.20); }
.naya-tab.add-tab { border-style: dashed; opacity: .85; }
/* anchored menu + editor popover */
.naya-tabs-menu, .naya-tabs-pop {
  position: fixed; z-index: 1000; display: none;
  background: linear-gradient(180deg, #101018, #08080c);
  border: 1px solid rgba(255,255,255,.16); border-radius: 14px;
  box-shadow: 0 22px 60px rgba(0,0,0,.6), 0 0 24px rgba(160,107,255,.12);
  color: #F8F7FB;
}
.naya-tabs-menu { min-width: 230px; overflow: hidden; }
.naya-tabs-menu .mi {
  padding: 11px 14px; cursor: pointer; font-weight: 700; font-size: 14px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center; gap: 10px;
}
.naya-tabs-menu .mi:last-child { border-bottom: none; }
.naya-tabs-menu .mi:hover { background: rgba(255,255,255,.06); }
.naya-tabs-pop { min-width: 300px; padding: 14px; }
.naya-tabs-pop h3 { margin: 0 0 10px; font-size: 15px; }
.naya-tabs-pop .row { display: grid; gap: 6px; margin: 8px 0; }
.naya-tabs-pop label { font-size: 12px; opacity: .75; display: grid; gap: 5px; }
.naya-tabs-pop input, .naya-tabs-pop select {
  padding: 10px 12px; border-radius: 10px; font-size: 14px;
  border: 1px solid rgba(255,255,255,.20); background: #0a0a0e; color: #F8F7FB;
}
.naya-tabs-pop .toggles { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.naya-tabs-pop .tgl {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 13px;
  border: 1.5px solid rgba(248,247,251,.85); background: #050507; color: #F8F7FB;
}
.naya-tabs-pop .tgl.on-heart { border-color: #a06bff; box-shadow: 0 0 14px rgba(160,107,255,.5); }
.naya-tabs-pop .tgl.on-star { border-color: #ffd45a; box-shadow: 0 0 14px rgba(255,212,90,.5); }
.naya-tabs-pop .ft { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.naya-tabs-pop .ft button {
  padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 800; font-size: 13px;
  border: 1.5px solid #F8F7FB; background: linear-gradient(180deg,#141419,#050507); color: #F8F7FB;
  box-shadow:inset 0 1px rgba(255,255,255,.3),inset 0 -2px 6px rgba(0,0,0,.5),0 0 14px rgba(248,247,251,.25),0 6px 14px rgba(0,0,0,.5);
  transition:transform .2s,box-shadow .25s;
}
.naya-tabs-pop .ft button:hover{transform:translateY(-2px);box-shadow:inset 0 1px rgba(255,255,255,.35),0 0 22px rgba(248,247,251,.45),0 10px 20px rgba(0,0,0,.55)}
.naya-tabs-pop .ft button.primary:hover{border-color:#a06bff;box-shadow:inset 0 1px rgba(255,255,255,.35),0 0 26px #a06bff,0 10px 20px rgba(0,0,0,.55)}
.naya-tabs-pop .ft button.primary {
  background: linear-gradient(135deg, #6F3DFF, #9D7BFF); border-color: transparent;
}

/* Hub bottom icon dock — verbatim standard. Law 14: compose, don't create. */
.eco-bottombar{position:fixed;bottom:0;left:0;right:0;z-index:350;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;background:linear-gradient(180deg,transparent,rgba(5,5,8,.92) 30%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.eco-bb-btn{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:radial-gradient(circle at 35% 30%,#2a2a32,#0a0a0e 70%);color:#fff;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:all .22s cubic-bezier(.16,.84,.22,1);box-shadow:inset 0 1px rgba(255,255,255,.15),0 0 14px rgba(255,255,255,.1),0 4px 10px rgba(0,0,0,.4);position:relative}
.eco-bb-btn svg{width:20px;height:20px;transition:transform .22s;filter:drop-shadow(0 0 3px rgba(255,255,255,.4))}
.eco-bb-btn:hover{transform:translateY(-3px) scale(1.08);border-color:var(--eco);box-shadow:inset 0 1px rgba(255,255,255,.2),0 0 24px var(--eco),0 6px 16px rgba(0,0,0,.5)}
.eco-bb-btn:hover svg{color:var(--eco);filter:drop-shadow(0 0 6px var(--eco))}
.eco-bb-btn .docknum{font-weight:800;font-size:16px;color:#F8F7FB;transition:color .22s}
.eco-bb-btn:hover .docknum{color:var(--eco)}
.eco-bb-btn::after{content:attr(data-label);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:.1em;color:#fff;background:rgba(10,10,14,.95);border:1px solid var(--eco);padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
.eco-bb-btn:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){.eco-bottombar{gap:8px;padding:12px 12px}.eco-bb-btn{width:42px;height:42px;flex:0 0 42px}.eco-bb-btn svg{width:18px;height:18px}}

.cd-num { font-size: 32px; font-weight: 800; color: var(--bc); text-shadow: 0 0 16px var(--bc); }
.cd-label { font-size: 12px; color: #F8F7FB; opacity: .5; margin-top: 4px; }
.composer { padding: 16px; }
.composer-input { width: 100%; background: #0d0d14; border: 1px solid rgba(248,247,251,.15); border-radius: 12px; padding: 12px; color: #F8F7FB; font-size: 14px;  margin-bottom: 12px; }

/* ELITE: 10/10 polish — animations, depth, life */
@keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes donutFill { from { transform: rotate(-90deg) scale(.8); opacity: 0; } to { transform: rotate(-90deg) scale(1); opacity: 1; } }
@keyframes pulseGlow { 0%,100% { box-shadow: 0 0 16px var(--bc); } 50% { box-shadow: 0 0 32px var(--bc); } }
.bar { transform-origin: bottom; animation: barGrow .8s cubic-bezier(.16,.84,.22,1) backwards; }
.bar:nth-child(1){animation-delay:.05s}.bar:nth-child(2){animation-delay:.1s}.bar:nth-child(3){animation-delay:.15s}.bar:nth-child(4){animation-delay:.2s}.bar:nth-child(5){animation-delay:.25s}.bar:nth-child(6){animation-delay:.3s}.bar:nth-child(7){animation-delay:.35s}
.bar:hover { filter: brightness(1.3); transform: scaleY(1.05); }
.stat-card { animation: fadeUp .6s cubic-bezier(.16,.84,.22,1) backwards; transition: transform .2s, box-shadow .2s; }
.stat-card:nth-child(2){animation-delay:.1s}.stat-card:nth-child(3){animation-delay:.2s}.stat-card:nth-child(4){animation-delay:.3s}
.stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 24px var(--bc); }
.donut { animation: donutFill 1s cubic-bezier(.16,.84,.22,1) backwards; }
.data-table tr { transition: background .15s; }
.data-table tbody tr:hover { background: rgba(255,255,255,.04); }
.cal-day { transition: all .15s; cursor: pointer; }
.cal-day:hover:not(.header) { background: rgba(255,255,255,.08); transform: scale(1.1); }
.cal-day.active { animation: pulseGlow 2s infinite; }
.slot { transition: all .15s; cursor: pointer; }
.slot:hover { transform: translateY(-2px); border-color: var(--bc); }
.msg-row { transition: background .15s; cursor: pointer; }
.msg-row:hover { background: rgba(255,255,255,.04); }
.tl-dot { animation: pulseGlow 2.5s infinite; }
.pricing-tier { transition: transform .2s, box-shadow .2s; }
.pricing-tier:hover { transform: translateY(-6px); }
.pricing-tier.featured { animation: pulseGlow 3s infinite; }
.cd-num { font-variant-numeric: tabular-nums; }
.product-img { transition: transform .2s; }
.product-card:hover .product-img { transform: scale(1.05) rotate(2deg); }

/* CARD LAYOUT FIX: no more empty space, content distributes properly */
.pcard { display: flex !important; flex-direction: column !important; }
.pcard .pstage { flex-shrink: 0; }
.pcard .pfoot { padding-top: 16px; }
.pcard .pmodel { margin-top: 12px; }
.pcard .pname { margin-top: 4px; margin-bottom: 4px; }
.pcard .pdesc { margin-bottom: 12px; }

.prow { display: flex !important; gap: 12px !important; }
.prow button { flex: 1; }

/* UNIVERSAL CARD SPACING: fixes old sections too */
.pcard > div > div[style*="font-size:12px"] { margin-bottom: 14px !important; }
.pcard .psizes { margin-top: 4px !important; margin-bottom: 14px !important; }
.pcard .prow { margin-top: 0 !important; }
/* Pills need breathing room */
.szpill { margin: 3px !important; }

/* THE RULE: never stretch cards to match outliers. Natural height, scroll sideways. */
.railblock .rail { align-items: flex-start !important; }

/* WIDE CARDS: wider not longer — the rule */
.pcard[data-wide="600"] { flex: 0 0 600px !important; max-width: 600px !important; }

.living-btn {
  position: relative; overflow: hidden; cursor: pointer; border: none;
  font-family: Inter, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: .12em;
  color: #fff; padding: 22px 44px; border-radius: 999px; min-width: 300px;
  background: linear-gradient(180deg, #17171c 0%, #050505 55%, #0a0a0e 100%);
  box-shadow:
    inset 0 0 0 1.7px rgba(255,255,255,.92),
    inset 0 2px 6px rgba(255,255,255,.22),
    inset 0 -8px 18px rgba(0,0,0,.75),
    0 14px 40px rgba(0,0,0,.6),
    0 4px 14px rgba(0,0,0,.5);
  transition: transform .28s var(--ease), box-shadow .28s var(--ease);
  animation: idleBreathe 4.2s ease-in-out infinite;
}

.living-btn .btn-glow { position: absolute; inset: -2px; border-radius: 999px; opacity: .55; pointer-events: none; transition: opacity .3s; }

.living-btn[data-spectrum="magenta"] .btn-glow { box-shadow: 0 0 34px 4px rgba(232,79,255,.5), inset 0 0 22px rgba(232,79,255,.28); }

.living-btn[data-spectrum="purple"] .btn-glow { box-shadow: 0 0 34px 4px rgba(160,107,255,.5), inset 0 0 22px rgba(160,107,255,.28); animation-delay: 1.4s; }

.living-btn[data-spectrum="blue"] .btn-glow { box-shadow: 0 0 34px 4px rgba(63,184,255,.5), inset 0 0 22px rgba(63,184,255,.28); animation-delay: 2.8s; }

.living-btn::after {
  content: ""; position: absolute; top: -20%; bottom: -20%; width: 46%; left: -70%;
  background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.34) 50%, transparent 80%);
  transform: skewX(-18deg); pointer-events: none;
  animation: sweep 5.5s var(--ease) infinite;
}

.living-btn[data-spectrum="purple"]::after { animation-delay: 1.8s; }

.living-btn[data-spectrum="blue"]::after { animation-delay: 3.6s; }

.living-btn:hover { transform: translateY(-4px) scale(1.025); animation: none; }

.living-btn[data-spectrum="magenta"]:hover { box-shadow: inset 0 0 0 2px var(--magenta), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(232,79,255,.4), 0 6px 18px rgba(0,0,0,.5); }

.living-btn[data-spectrum="purple"]:hover { box-shadow: inset 0 0 0 2px var(--purple), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(160,107,255,.4), 0 6px 18px rgba(0,0,0,.5); }

.living-btn[data-spectrum="blue"]:hover { box-shadow: inset 0 0 0 2px var(--blue), inset 0 2px 8px rgba(255,255,255,.3), inset 0 -8px 18px rgba(0,0,0,.7), 0 22px 60px rgba(63,184,255,.4), 0 6px 18px rgba(0,0,0,.5); }

.living-btn:hover .btn-glow { opacity: 1; }

.living-btn:active { transform: translateY(1px) scale(.975); transition-duration: .08s; }

.living-btn .btn-label { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 12px; }

.living-btn .btn-label svg { width: 20px; height: 20px; }
 .living-btn { min-width: 100%; }
 .living-btn, .living-btn::after { animation: none; }


/* ============ ESSENTIAL — .cx-btn (4 layers, when simplicity wins) ============ */
.cx-btn { padding: 15px 32px; border-radius: 999px; font-size: 14px; font-weight: 800; letter-spacing: .1em; cursor: pointer; font-family: inherit; color: #fff; background: linear-gradient(180deg,#15151a,#050506); border: 1.5px solid rgba(255,255,255,.55); display: inline-flex; align-items: center; gap: 10px;
  box-shadow: inset 0 2px 2px rgba(255,255,255,.22), inset 0 -3px 6px rgba(0,0,0,.6), 0 0 22px -2px rgba(255,255,255,.28), 0 12px 28px rgba(0,0,0,.65);
  transition: border-color .22s, box-shadow .25s, transform .15s var(--ease); }

.cx-btn:hover { border-color: var(--soul); transform: translateY(-2px);
  box-shadow: inset 0 2px 2px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.5), 0 0 42px -2px var(--soul), 0 16px 34px rgba(0,0,0,.6); }

.cx-btn:active { transform: translateY(1px) scale(.97); box-shadow: inset 0 3px 8px rgba(0,0,0,.7), 0 0 18px -4px var(--soul); }

/* foundation trinity — the first three buttons on the page are the
   official .naya-btn in its three foundation skins (see §02 library).
   One standard, one system: no competing button implementation. */
.trinity{display:flex; gap:16px; justify-content:center; align-items:stretch; margin:34px auto 0; flex-wrap:wrap; max-width:1020px;}

.naya-btn{
  --nb-accent:#8a5cff;
  --nb-accent-rgb:138,92,255;
  position:relative; isolation:isolate; overflow:hidden;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
   padding:0 28px; border-radius:999px;
  border:1.5px solid #F8F7FB; /* Law 6: white light at rest, never faint */
  font-family:var(--ui); font-size:15px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:#f6f5ef; cursor:pointer; white-space:nowrap;
  text-shadow:0 -1px 1px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.6);
  background:
    linear-gradient(180deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.015) 38%,rgba(0,0,0,.18) 100%),
    linear-gradient(180deg,#2a2b33 0%,#0c0c0f 52%,#030304 100%);
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.38),
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -1px 0 rgba(0,0,0,.72),
    inset 0 -14px 26px rgba(0,0,0,.52),
    inset 0 10px 18px rgba(255,255,255,.04),
    0 20px 42px rgba(0,0,0,.84),
    0 6px 14px rgba(0,0,0,.58);
  transition:transform .22s var(--ease),box-shadow .38s var(--ease),border-color .3s ease,background .3s ease;
  animation:naya-breathe 7s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
}

.naya-btn::before{ /* cursor proximity sheen — quiet, follows --mx/--my */
  content:""; position:absolute; inset:0; border-radius:inherit; z-index:0; pointer-events:none; opacity:0; transition:opacity .4s ease;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),rgba(255,255,255,.03) 42%,transparent 68%);
}

.naya-btn::after{ /* machined edge fire — 5% only, ignites on hover/focus */
  content:""; position:absolute; inset:-1px; border-radius:inherit; z-index:2; pointer-events:none; opacity:0; transition:opacity .28s ease;
  box-shadow:inset 0 0 0 1.5px rgba(var(--nb-accent-rgb),.92),0 0 18px -2px rgba(var(--nb-accent-rgb),.55),0 0 42px -8px rgba(var(--nb-accent-rgb),.35);
}

.naya-btn > *{position:relative; z-index:3;}

.naya-btn .nb-icon{width:18px;height:18px;flex:none;display:grid;place-items:center;font-size:16px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));}

.naya-btn .nb-label{letter-spacing:.11em;}


/* AWARE — cursor is near (JS adds .is-aware within ~140px) */
.naya-btn.is-aware{
  animation:none;
  border-color:rgba(238,236,228,.12);
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.58),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.70),
    inset 0 -14px 26px rgba(0,0,0,.46),
    inset 0 10px 18px rgba(255,255,255,.07),
    0 0 0 1px rgba(var(--nb-accent-rgb),.14),
    0 24px 48px rgba(0,0,0,.86),
    0 8px 18px rgba(0,0,0,.60);
  transform:translateY(-1px);
}

.naya-btn.is-aware::before{opacity:.75;}


/* IGNITED — hover / focus-visible */
.naya-btn:hover,.naya-btn:focus-visible{
  animation:none; transform:translateY(-3px) scale(1.012);
  border-color:rgb(var(--nb-accent-rgb));
  box-shadow:
    inset 0 0 0 1.5px rgb(var(--nb-accent-rgb)),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(0,0,0,.66),
    inset 0 -14px 26px rgba(0,0,0,.42),
    0 0 38px rgba(var(--nb-accent-rgb),.85),
    0 30px 56px rgba(0,0,0,.88),
    0 10px 20px rgba(0,0,0,.62);
}

.naya-btn:hover::before,.naya-btn:focus-visible::before{opacity:1;}

.naya-btn:hover::after,.naya-btn:focus-visible::after{opacity:1;}

.naya-btn:focus-visible{outline:2px solid rgba(255,255,255,.92); outline-offset:3px;}

.naya-btn:active{
  transform:translateY(1px) scale(.975) !important;
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.48),
    inset 0 3px 12px rgba(0,0,0,.82),
    inset 0 -4px 10px rgba(0,0,0,.55),
    0 10px 22px rgba(0,0,0,.78);
  transition-duration:.08s;
}

.naya-btn:active::after{opacity:.65;}

.naya-btn:disabled,.naya-btn[aria-disabled="true"]{
  opacity:.42; cursor:not-allowed; animation:none; transform:none !important;
  box-shadow:inset 0 0 0 1px rgba(238,236,228,.22),inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px rgba(0,0,0,.6);
}

.naya-btn:disabled::after,.naya-btn[aria-disabled="true"]::after{opacity:0 !important;}


/* Variants — same DNA, different jobs */
.naya-btn--primary{--nb-accent:#8a5cff;--nb-accent-rgb:138,92,255;}

.naya-btn--secondary{
  --nb-accent:#e8e6df;--nb-accent-rgb:232,230,223;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 40%,rgba(0,0,0,.14)),linear-gradient(180deg,#1e1f26 0%,#0a0a0d 55%,#050506 100%);
  color:#eceade;
}

.naya-btn--ghost{
  --nb-accent:#ffffff;--nb-accent-rgb:255,255,255;
  background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 55%),rgba(255,255,255,.015);
  box-shadow:inset 0 0 0 1px rgba(238,236,228,.26),inset 0 1px 0 rgba(255,255,255,.22),0 14px 30px rgba(0,0,0,.55);
  animation:naya-breathe-ghost 8s ease-in-out infinite;
}

.naya-btn--ghost.is-aware{box-shadow:inset 0 0 0 1px rgba(238,236,228,.48),inset 0 1px 0 rgba(255,255,255,.32),0 18px 36px rgba(0,0,0,.62);}

.naya-btn--ghost:hover,.naya-btn--ghost:focus-visible{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 55%),rgba(255,255,255,.03);}

.naya-btn--danger{--nb-accent:#ff4d5e;--nb-accent-rgb:255,77,94;
  background:linear-gradient(180deg,rgba(255,77,94,.10),rgba(255,255,255,.01) 42%,rgba(0,0,0,.20)),linear-gradient(180deg,#2e2226 0%,#12090c 54%,#050304 100%);}

.naya-btn--icon{
  width:52px; min-width:52px; padding:0; border-radius:999px;
}

.naya-btn--icon.naya-btn--sm{width:44px;min-width:44px;}

.naya-btn--icon.naya-btn--lg{width:60px;min-width:60px;}

.naya-btn--sm{padding:0 20px;font-size:13px;letter-spacing:.12em;}

.naya-btn--lg{padding:0 36px;font-size:16px;}

.naya-btn--block{width:100%;}


/* Selected state — one treatment for every .naya-btn toggle */
.naya-btn[aria-pressed="true"]{
  animation:none;
  box-shadow:
    inset 0 0 0 1px rgba(238,236,228,.60),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.68),
    inset 0 -14px 26px rgba(0,0,0,.44),
    inset 0 10px 18px rgba(255,255,255,.06),
    0 0 0 1.5px rgba(var(--nb-accent-rgb),.85),
    0 0 30px -10px rgba(var(--nb-accent-rgb),.55),
    0 28px 54px rgba(0,0,0,.86),
    0 8px 18px rgba(0,0,0,.60);
}

.naya-btn[aria-pressed="true"]::after{opacity:1;}

/* Living button system (inline for index demo) */

.orb--hero{width:200px;height:200px}
.orb--hero::before{inset:-26px;padding:4px;animation-duration:9s}
.orb--hero::after{bottom:-46px;height:36px}
.orb--glyph{display:inline-grid;place-items:center;font-size:46px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.75),0 0 22px rgba(var(--oc-rgb),.95)}
.orb--icon{width:64px;height:64px;font-size:26px}
.orb--icon::before{inset:-11px;padding:2px}
.orb--icon::after{bottom:-18px;height:14px}
.orb--twin::after{inset:-30px;left:auto;right:auto;top:auto;bottom:auto;height:auto;border-radius:50%;filter:none;z-index:auto;background:conic-gradient(from 90deg,transparent 0deg,transparent 310deg,rgba(var(--oc-rgb),.6) 345deg,transparent 360deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:2px;animation:orb-spin-rev 11s linear infinite;opacity:.7}
button.orb--btn{cursor:pointer;font-family:inherit;border:none}
.orb--btn:active{transform:scale(.9);transition:transform .1s ease}
@keyframes orb-spin{to{transform:rotate(360deg)}}
@keyframes orb-spin-rev{to{transform:rotate(-360deg)}}
@keyframes orb-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
/* ============ HUB ELEMENTS — verbatim from Shawn's 12 hub pages ============ */
:root{--line:rgba(255,255,255,.12);--line-soft:rgba(255,255,255,.08);--ink:#F8F7FB;--ink-dim:rgba(248,247,251,.72);--muted:rgba(248,247,251,.55);--text-muted:rgba(248,247,251,.55);--green:#2fe89e;--emerald:#2fe89e;--purple:#a06bff;--magenta:#e84fff;--purple-glow:rgba(160,107,255,.5);--edge:rgba(255,255,255,.1);--radius-md:13px;--radius-pill:999px;--depth-hi:0 18px 50px rgba(0,0,0,.55);--btn-accent:#a06bff}
/* B-1 ghost button */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-weight:800;font-size:13px;width:100%;justify-content:center}
.btn-ghost{background:linear-gradient(180deg,#17171f,#0a0a0f);border:1.5px solid #F8F7FB;box-shadow:inset 0 1px rgba(255,255,255,.3),inset 0 -2px 5px rgba(0,0,0,.5),0 0 14px rgba(248,247,251,.22),0 6px 14px rgba(0,0,0,.5);color:#F8F7FB;transition:transform .2s,box-shadow .25s,border-color .25s}
.btn-ghost:hover{border-color:#a06bff;color:#fff;transform:translateY(-2px);box-shadow:inset 0 1px rgba(255,255,255,.35),0 0 20px #a06bff,0 10px 20px rgba(0,0,0,.55)}
/* B-2 toggle chip */
.tgl{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.45);cursor:pointer;color:#fff;font-weight:800;font-size:13px}
.tgl.on{box-shadow:0 0 0 2px rgba(255,255,255,.3) inset,0 0 18px rgba(124,77,255,.25)}
/* B-3 smart-note buttons */
.sn-btn{padding:10px 20px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;background:linear-gradient(180deg,#1c1c24,#0a0a0f);border:1.5px solid #F8F7FB;box-shadow:inset 0 1px rgba(255,255,255,.35),inset 0 -3px 8px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.55);transition:transform .2s var(--ease),box-shadow .25s}
.sn-btn.primary{background:linear-gradient(180deg,#16161e,#050507);border:1.5px solid #F8F7FB;color:#F8F7FB;box-shadow:inset 0 2px 3px rgba(255,255,255,.4),inset 0 -4px 10px rgba(0,0,0,.6),0 0 26px rgba(160,107,255,.55),0 12px 28px rgba(0,0,0,.65);transition:transform .22s cubic-bezier(.16,.84,.22,1),box-shadow .25s,border-color .25s}
.sn-btn.primary:hover{transform:translateY(-2px);border-color:#a06bff;box-shadow:inset 0 2px 3px rgba(255,255,255,.45),inset 0 -4px 10px rgba(0,0,0,.55),0 0 40px #a06bff,0 16px 34px rgba(0,0,0,.7)}
/* B-4 nav buttons */
.nav-button{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 18px;border-radius:28px;text-decoration:none;color:#fff;font-size:.68rem;font-weight:950;letter-spacing:.13em;text-transform:uppercase;transition:transform .25s ease,box-shadow .3s ease}
.nav-button:hover{transform:translateY(-2px)}
.nav-button:active{transform:scale(.98)}
.nav-icon{font-size:.9rem;line-height:1}
.about-button{border:1px solid rgba(168,85,247,.9);background:linear-gradient(180deg,rgba(168,85,247,.25),rgba(50,20,75,.35));box-shadow:0 0 22px rgba(168,85,247,.24),inset 0 1px 0 rgba(255,255,255,.1)}
.whitepaper-button{border:1px solid rgba(255,255,255,.72);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(80,80,95,.14));box-shadow:0 0 18px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1)}
.player{border:1px solid var(--green);background:linear-gradient(180deg,rgba(16,185,129,.22),rgba(6,78,59,.32));box-shadow:0 0 22px rgba(16,185,129,.28),inset 0 1px 0 rgba(255,255,255,.08)}
/* I-1 icon socket */
.ico{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:12px;color:var(--nav,var(--purple));background:rgba(160,107,255,.1);border:1px solid rgba(160,107,255,.25)}
.ico svg{width:24px;height:24px;stroke-width:1.8}
/* I-2 facet support */
.facet{fill:#fff;stroke:none;opacity:.48}.edge{fill:none;stroke:#fff;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;opacity:.92}.shade{fill:#000;stroke:none;opacity:.28}.core{fill:currentColor;stroke:none;opacity:.98}
/* J-1 LED */
.led{width:28px;height:28px;border-radius:50%;display:inline-block;position:relative;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--green) 35%,#0a5a37 75%,#041a10 100%);border:2px solid #1a1a22;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),inset 0 -3px 6px rgba(0,0,0,.5),0 0 18px var(--green),0 0 36px rgba(47,232,158,.4);animation:led-pulse 2s ease-in-out infinite}
@keyframes led-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
/* J-2 corner jewel */
.corner-jewel{position:absolute;width:14px;height:14px;transform:rotate(45deg);background:linear-gradient(135deg,#fff 0%,var(--tone,var(--purple)) 45%,#000 100%);box-shadow:0 0 14px var(--tone-glow,var(--purple-glow));z-index:2}
/* D-1 metric stat */
.metric{background:linear-gradient(155deg,#121019,#09080d);padding:18px 16px;border-radius:14px;border:1px solid var(--line)}
.metric b{display:block;font-size:28px;line-height:1;margin-bottom:8px;color:var(--ink)}
.metric span{font-size:13px;color:var(--muted)}
/* D-2 empty state */
.empty-instrument{padding:18px;border:1px dashed var(--line);border-radius:var(--radius-md)}
.empty-instrument strong{display:block;font-size:15px;margin-bottom:6px}
.empty-instrument p{font-size:14px;color:var(--muted);margin:0}
/* D-3 identity box */
.id-box{position:relative;overflow:hidden;border-radius:20px;padding:20px 22px;display:flex;align-items:center;gap:18px;background:linear-gradient(165deg,#0b0d13 0%,#040507 55%,#010203 100%);border:1px solid rgba(255,255,255,.07);border-top:2px solid var(--tone,var(--purple));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -14px 26px rgba(0,0,0,.6),0 22px 44px rgba(0,0,0,.55)}
.id-box-label{font-size:.72rem;font-weight:900;letter-spacing:.28em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
.id-box-value{font-size:1.32rem;font-weight:800;color:#fff;text-shadow:0 0 24px var(--tone-glow,var(--purple-glow))}
/* R-1 meta row */
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px}
.meta-row span{padding:9px 16px;border:1.5px solid #F8F7FB;border-radius:999px;background:linear-gradient(180deg,#17171f,#0a0a0f);color:#F8F7FB;font-size:13px;font-weight:700;box-shadow:inset 0 1px rgba(255,255,255,.3),inset 0 -2px 5px rgba(0,0,0,.5),0 0 14px rgba(248,247,251,.22),0 6px 14px rgba(0,0,0,.5);cursor:pointer;transition:transform .2s,box-shadow .25s,border-color .25s}
.meta-row span:hover{transform:translateY(-2px);border-color:var(--sc,#a06bff);box-shadow:inset 0 1px rgba(255,255,255,.35),0 0 20px var(--sc,#a06bff),0 10px 20px rgba(0,0,0,.55)}
/* R-2 action row */
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
/* R-3 menu item */
.mi{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;color:#fff;font-weight:800;font-size:13px}
.mi:last-child{border-bottom:none}
/* R-4 import-method row */
.im-row{position:relative;display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.im-jewel{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(160,107,255,.14);border:1px solid rgba(160,107,255,.35);color:var(--purple)}
.im-steps{margin:6px 0 0;padding-left:22px}
.im-steps li{margin:3px 0;color:rgba(255,255,255,.84);font-size:.84rem;line-height:1.5}
/* N-1 search bar */
.search-wrap{margin:0 auto;max-width:640px;width:100%}
.search-input{width:100%;font-size:16px;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:0 18px;font-family:inherit}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{outline:none;border-color:#d86cff;box-shadow:0 0 0 3px rgba(216,108,255,.18)}
/* N-2 alias field */
.alias-input-box{width:100%;max-width:520px;margin:0 auto;text-align:left}
.alias-label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700}
.alias-field-wrapper{display:flex;align-items:center;background:#06070a;border:2px solid rgba(255,255,255,.85);border-radius:20px;padding:10px 18px;box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 1px 2px rgba(255,255,255,.15)}
.alias-field-wrapper:focus-within{border-color:var(--purple);box-shadow:0 0 32px var(--purple-glow),inset 0 1px 2px rgba(255,255,255,.25)}
.alias-field-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:1.25rem;font-weight:800;font-family:inherit}
.alias-field-input::placeholder{color:rgba(248,247,251,.85);opacity:1}
/* H-1 eyebrow */
.eyebrow{font-size:11px;letter-spacing:.24em;font-weight:700;color:var(--room-accent,var(--green));margin-bottom:12px}
/* H-2 intelligence trio */
.intel-type{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--room-accent,var(--magenta));text-transform:uppercase;margin-bottom:7px}
.intel-title{font-size:16px;font-weight:850;line-height:1.25}
.intel-summary{color:var(--ink-dim);font-size:13px;line-height:1.55;margin-top:7px}
/* H-3 step number */
.num{display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--c,var(--purple))}
.num .jewel{width:11px;height:11px;transform:rotate(45deg);flex-shrink:0;background:linear-gradient(135deg,#fff,var(--c,var(--purple)) 60%,#3a2a55);box-shadow:0 0 12px var(--c,var(--purple))}
/* K-1 status pill */
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:800;letter-spacing:.14em;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{color:var(--green);border-color:rgba(47,232,158,.4)}
/* K-2 done mark */
.done-mark{display:flex;margin-top:20px;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--emerald)}
.done-mark .tick{width:22px;height:22px;border-radius:50%;background:var(--emerald);color:#04240f;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;box-shadow:0 0 14px rgba(85,227,154,.53)}
/* K-3 search highlight */
.hl{background:rgba(138,92,255,.5);color:#fff;border-radius:3px;padding:0 2px}
/* K-4 divider bar */
.bar{flex:1;height:2px;background:var(--edge);margin:0 6px;border-radius:2px;min-width:40px}
/* piece cards */
.pcard{scroll-snap-align:start;background:linear-gradient(180deg,#0b0b10,#050507);border:1.5px solid #F8F7FB;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 2px 3px rgba(255,255,255,.12),inset 0 -6px 14px rgba(0,0,0,.5),0 0 22px rgba(248,247,251,.22),0 16px 40px rgba(0,0,0,.6);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.pcard:hover{transform:translateY(-4px);box-shadow:inset 0 2px 3px rgba(255,255,255,.16),inset 0 -6px 14px rgba(0,0,0,.5),0 0 36px var(--sc,#F8F7FB),0 22px 50px rgba(0,0,0,.65)}
.pcard:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.22)}
.pstage{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0d0d13,#050507);border:1.5px solid rgba(255,255,255,.14);border-radius:16px;padding:36px 24px;overflow:visible;transition:border-color .3s,box-shadow .3s}
.pcard:hover .pstage{border-color:var(--sc,#F8F7FB);box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 0 26px -6px var(--sc,#F8F7FB)}
.pstage .zoom{transition:transform .25s var(--ease);display:flex;align-items:center;justify-content:center}
.pmodel{font-size:11px;letter-spacing:.18em;color:#a06bff;font-weight:700}
.pname{font-size:17px;font-weight:600}
.psizes{display:flex;gap:6px;flex-wrap:wrap}
.szpill{font-size:13px;font-weight:700;padding:12px 18px;display:inline-flex;align-items:center;border-radius:22px;border:1.5px solid #F8F7FB;background:linear-gradient(180deg,#1a1a24,#0c0c12);color:#F8F7FB;cursor:pointer;letter-spacing:.06em;box-shadow:inset 0 1px rgba(255,255,255,.3),inset 0 -2px 6px rgba(0,0,0,.5),0 0 14px rgba(248,247,251,.18),0 6px 16px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s,border-color .2s}
.szpill:hover{transform:translateY(-2px);border-color:var(--sc,#a06bff);box-shadow:inset 0 1px rgba(255,255,255,.3),0 0 22px var(--sc,#a06bff),0 10px 22px rgba(0,0,0,.55)}.szpill.on{border-color:var(--sc,#a06bff);background:linear-gradient(180deg,#141419,#050505);box-shadow:inset 0 0 0 1.5px var(--sc,#a06bff),inset 0 1px rgba(255,255,255,.25),0 0 20px var(--sc,#a06bff),0 8px 20px rgba(0,0,0,.5);transform:translateY(-1px)}
.prow{display:flex;gap:10px}
.btn-select,.btn-notes{flex:1;padding:13px;border-radius:14px;font-size:13px;font-weight:700;letter-spacing:.08em;cursor:pointer;border:1.5px solid rgba(255,255,255,.6);background:linear-gradient(180deg,#1c1c26,#101015);color:#fff;box-shadow:inset 0 2px 2px rgba(255,255,255,.16),inset 0 -3px 6px rgba(0,0,0,.6),0 0 16px -4px rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.6);transition:all .25s var(--ease)}
.btn-select.picked{border-color:#2fe89e;background:rgba(47,232,158,.14);box-shadow:0 0 16px -4px #2fe89e}
/* toggle switch — elevated */
.tog{position:relative;width:60px;height:34px;border-radius:20px;background:#050507;cursor:pointer;flex:none;border:1.5px solid #F8F7FB;box-shadow:inset 0 3px 8px rgba(0,0,0,.75),inset 0 1px 0 rgba(0,0,0,.6);transition:all .25s var(--ease)}
.tog .knob{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2e2e3a,#0e0e12);box-shadow:0 3px 8px rgba(0,0,0,.65);transition:all .25s var(--ease)}
.tog.on{border-color:var(--fc,#2fe89e);box-shadow:inset 0 3px 8px rgba(0,0,0,.75),0 0 18px -2px var(--fc,#2fe89e)}
.tog.on .knob{left:28px;background:radial-gradient(circle at 35% 30%,#ffffff,var(--fc,#2fe89e) 55%,#0a0a0e);box-shadow:0 3px 8px rgba(0,0,0,.6),0 0 14px -2px var(--fc,#2fe89e)}
/* cart */
#cartFab{position:fixed;bottom:100px;right:20px;z-index:352;width:68px;height:68px;border-radius:50%;background:linear-gradient(180deg,#2a2140,#14101f);border:1.5px solid #a06bff;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(0,0,0,.6),0 0 24px -6px #a06bff}
#cartCount{position:absolute;top:-4px;right:-4px;min-width:26px;height:26px;border-radius:14px;background:#e84fff;color:#000;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 7px}
#cartDrawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100vh;z-index:95;background:#0b0b10;border-left:1px solid rgba(255,255,255,.12);transition:right .35s var(--ease);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
#cartDrawer.open{right:0}
.cartitem{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:14px;margin:8px 16px;background:#101016}
.filterpill{padding:10px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.16);background:#0e0e14;color:#fff;font-size:13px;cursor:pointer}
.filterpill.on{border-color:#3fb8ff;background:rgba(63,184,255,.14);box-shadow:0 0 14px -4px #3fb8ff}
.visioncard{background:linear-gradient(180deg,#0b0b10,#050507);border:1.5px solid #F8F7FB;border-radius:20px;padding:24px;box-shadow:inset 0 2px 3px rgba(255,255,255,.14),inset 0 -6px 14px rgba(0,0,0,.55),0 0 24px rgba(248,247,251,.28),0 18px 44px rgba(0,0,0,.6);transition:transform .28s cubic-bezier(.16,.84,.22,1),box-shadow .3s}
.visioncard:hover{transform:translateY(-4px);box-shadow:inset 0 2px 3px rgba(255,255,255,.18),inset 0 -6px 14px rgba(0,0,0,.5),0 0 40px rgba(248,247,251,.45),0 24px 54px rgba(0,0,0,.65)}
textarea.visionin{width:100%;background:#020203;color:#F8F7FB;border:1.5px solid #F8F7FB;border-radius:14px;padding:16px;font-size:14px;font-family:inherit;resize:vertical;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),inset 0 1px 2px rgba(255,255,255,.12),0 0 18px rgba(248,247,251,.3);transition:border-color .25s,box-shadow .25s,transform .25s}
textarea.visionin:hover{transform:translateY(-2px);box-shadow:inset 0 3px 10px rgba(0,0,0,.8),inset 0 1px 2px rgba(255,255,255,.14),0 0 30px rgba(248,247,251,.45)}
textarea.visionin:focus{outline:none;border-color:#a06bff;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 0 0 1.5px #a06bff,0 0 34px #a06bff}
.contractbox{background:#060609;border:1px solid rgba(160,107,255,.35);border-radius:16px;padding:20px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:420px;overflow:auto}
.stepnum{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#000;margin-right:10px}
h2.stept{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;margin:6px 0 10px;color:#F8F7FB}
.kicker{font-size:11px;letter-spacing:.24em;opacity:.55;margin-bottom:4px}
.lede{font-size:14px;line-height:1.65;color:#F8F7FB;opacity:.95;max-width:640px}
.tmpl{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:20px;cursor:pointer;transition:all .25s var(--ease);background:linear-gradient(180deg,#121218,#0b0b0f)}
.tmpl.sel{border-color:var(--tc);box-shadow:0 0 24px -8px var(--tc)}
.tdot{width:14px;height:14px;border-radius:50%;background:var(--tc);box-shadow:0 0 10px var(--tc);display:inline-block;margin-right:8px}

.pcard{background:linear-gradient(180deg,#101016,#0a0a0f);border:1.5px solid rgba(255,255,255,.1);box-shadow:0 8px 22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14)}

.day-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#17171f,#08080c);border:1.5px solid #F8F7FB;color:#F8F7FB;box-shadow:inset 0 1px rgba(255,255,255,.35),inset 0 -3px 8px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.55);font-size:12px;font-weight:800;cursor:pointer;transition:border-color .2s var(--ease),box-shadow .25s var(--ease),transform .15s var(--ease)}

.send-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 26px;border-radius:999px;background:linear-gradient(180deg,#15151a,#050506);border:1.5px solid #F8F7FB;color:#fff;font-size:14px;font-weight:800;letter-spacing:.06em;cursor:pointer;box-shadow:inset 0 2px 2px rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.6),0 0 22px -2px rgba(157,117,255,.28),0 12px 28px rgba(0,0,0,.65);transition:border-color .22s var(--ease),box-shadow .22s var(--ease),transform .22s var(--ease)}
.send-cta:hover{transform:translateY(-2px);box-shadow:inset 0 2px 2px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.5),0 0 18px -2px rgba(157,117,255,.5),0 16px 34px rgba(0,0,0,.68)}
.send-cta:active{transform:translateY(1px) scale(.98)}
.send-cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.mic-btn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 35% 30%,#2a2436,#0a0a0e 70%);border:1.5px solid rgba(255,255,255,.78);box-shadow:inset 0 2px 2px rgba(255,255,255,.22),inset 0 -6px 12px rgba(0,0,0,.7),0 12px 28px rgba(0,0,0,.65);color:#fff;transition:transform .2s var(--ease),box-shadow .25s var(--ease)}
.mic-btn:hover{transform:scale(1.05)}
.mic-btn.listening{animation:micpulse 1.6s ease-in-out infinite;border-color:#ff5e6c}
