}
@keyframes osHeroBreathe{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.06);}}
.os-ld-score b.ld-tick{animation:osLdTick .55s ease-out 1;}
@keyframes osLdTick{0%{transform:scale(1.14);}100%{transform:scale(1);}}
/* V9.8: hero entrance — the precious number arrives, it doesn't just appear. */
.os-ld-score b{animation:osHeroArrive 1.2s cubic-bezier(.2,.9,.25,1.1) backwards;}
@keyframes osHeroArrive{0%{opacity:0;transform:scale(.7) translateY(20px);}60%{opacity:1;transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}
.os-ld-score i{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.22em;
  color:#b9b3c7;margin-top:8px;}
.os-ld-lvl{margin-top:10px;font-size:12.5px;color:#E8E8EC;}
.os-ld-lvl b{color:#fff;font-variant-numeric:tabular-nums;}
.os-ld-next{font-size:10.5px;color:#8a8a96;margin-top:4px;padding:0 20px;line-height:1.4;}
/* ---- nodes ---- */
/* 2026-11-01 — Shawn: ORBS ARE LUMINOUS. Not flat circles, not bordered discs.
   Each orb is a sphere of light floating in space — glowing from WITHIN
   in its own color. The number is illuminated, like it's made of light.
   Less is more: the color IS the identity. No separate icon needed. */
/* ═══════════════════════════════════════════════════════════════════
   OBJECT: ORB — Glossy black marble.
   Like a billiard ball. Hard, shiny, heavy.
   - SHARP highlight (window reflection, top-left)
   - Deep sphere shading (form is unmistakable)
   - Rim light (reflected light on bottom edge)
   - Hard contact shadow (weight)
   ═══════════════════════════════════════════════════════════════════ */
/* 2026-11-01 — Shawn: JS-DRIVEN ORBIT. CSS rotation was fragile (out-of-sync
   counter-rotation = tilted text). Now JS moves orbs by left/top — elements
   NEVER rotate, text ALWAYS upright. Counterclockwise (to the left).
   Tight circular orbit, close to the gauge. */
.os-ld-nodes{
  position:absolute; inset:0;
  transform-origin:center center;
}
.os-ld-node{
  transform-origin:center center;
  /* float only — position handled by JS rAF */
  animation:osOrbFloat 7s ease-in-out infinite;
}
/* Pause float on hover so they can read */
.os-ld-node:hover{ animation-play-state:paused; }
/* 2026-11-01 — Shawn: OBSIDIAN ORBS. Black glass, white numbers that POP.
   Colored edge ignites on hover. Like the Smart Tabs — same designer, same DNA.
   Real object: machined bezel, deep black face, floating number. */
.os-ld-node{
  position:absolute; width:120px; height:120px; border-radius:50%;
  z-index:2; font-family:inherit; padding:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; cursor:pointer;
  /* OBSIDIAN BODY — deep black glass */
  background:
    radial-gradient(circle at 35% 30%, #2a2a38 0%, #14141c 30%, #0a0a10 60%, #000000 100%);
  border:none;
  box-shadow:
    /* 2026-11-02 — Shawn: BEAUTIFUL ALWAYS. The hover glow is now permanent.
       Machined bezel + subtle orb-color light. No hover needed. */
    0 0 0 5px #9a9ea8,
    0 0 0 6px rgba(255,255,255,.25),
    0 0 14px 1px var(--nc),
    inset 0 0 0 2px rgba(255,255,255,.12),
    inset 0 2px 4px rgba(255,255,255,.15),
    inset 0 -4px 8px rgba(0,0,0,.9),
    0 0 0 1px rgba(255,255,255,.18),
    0 16px 32px rgba(0,0,0,.7),
    0 6px 12px rgba(0,0,0,.5);
  transition:transform .3s cubic-bezier(.2,1.2,.4,1), box-shadow .3s;
}
/* HOVER: edge ignites in orb's color — glow only (transform is used by orbit) */
.os-ld-node:hover{
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.15),
    inset 0 2px 4px rgba(255,255,255,.2),
    inset 0 -4px 8px rgba(0,0,0,.8),
    0 0 0 2.5px var(--nc),
    0 0 12px 2px var(--nc),
    0 16px 32px rgba(0,0,0,.7);
}
/* TOP GLASS SHEEN */
.os-ld-node::before{
  content:''; position:absolute; top:5%; left:12%; width:40%; height:22%;
  border-radius:50%; transform:rotate(-20deg);
  background:linear-gradient(135deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,.08) 50%, transparent 100%);
  filter:blur(1px);
  z-index:2;
}
/* 2026-11-02 — SHAWN: "Don't break shit." The conic-gradient rings broke the layout.
   REMOVED. Orbs are clean without them. Only premium, mind-blowing, working stuff. */
/* 2026-11-01 — Shawn: ORB CONTENT. Big white numbers that POP on obsidian.
   Icon crisp, label clear in orb's color. Readable at a glance. */
.os-ld-icon{
  position:relative; z-index:1;
  font-size:16px; line-height:1; margin-bottom:2px;
  color:rgba(255,255,255,.9);
  text-shadow:0 0 8px rgba(255,255,255,.4);
}
/* 2026-11-02 — Shawn: LABEL ALWAYS VISIBLE. Uppercase, white, bold.
   Like the hover state, permanently. */
.os-ld-nodes .os-ld-node .os-ld-lbl,
.os-constellation .os-ld-node .os-ld-lbl,
button.os-ld-node .os-ld-lbl{
  display:block !important;
  margin-top:5px !important;
  font-size:10px !important; font-weight:800 !important;
  letter-spacing:.14em !important; text-transform:uppercase !important;
  color:#ffffff !important;
  text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 10px var(--nc) !important;
  opacity:1 !important;
  visibility:visible !important;
  white-space:nowrap !important;
}
.os-ld-n{
  /* 2026-11-02 — Shawn: REAL OBJECT. A digital readout SET INTO the orb.
     Like an LCD embedded in a physical sphere. Not text — an object.
     Recessed with inner shadows, number glows like an LED. */
  position:relative; z-index:1;
  display:inline-block;
  font-size:32px; font-weight:900; line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
  color:#fff !important;
  opacity:1 !important;
  /* The readout window: dark, recessed */
  background:#020203;
  padding:6px 14px;
  border-radius:8px;
  /* Inner shadows = recessed into the orb surface */
  box-shadow:
    inset 0 3px 8px rgba(0,0,0,.95),
    inset 0 -1px 2px rgba(255,255,255,.08),
    inset 2px 0 4px rgba(0,0,0,.6),
    inset -2px 0 4px rgba(0,0,0,.6),
    0 1px 0 rgba(255,255,255,.1);
  /* LED glow: number lights up from within */
  text-shadow:
    0 0 8px rgba(255,255,255,.9),
    0 0 16px var(--nc);
  /* Physical: sits IN the orb, not on it */
  transform:translateZ(0);
}
.os-ld-l{
  position:relative; z-index:1;
  font-size:9px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
  color:var(--nc);
  margin-top:4px;
  text-shadow:0 0 10px var(--nc);
  display:none; /* 2026-11-02 — Shawn: get rid of the mini text */
}
/* 2026-11-01 — Shawn: FLOWING LIGHT around each orb. The orb's color flows
   in a ring around it — like energy orbiting. Plus under-glow beneath,
   like the orb floats above a surface, lighting it. */
/* 2026-11-01 — Shawn: GLASS SHEEN. Subtle top light on the titanium bezel.
   Not a bubble reflection — machined metal catching the light source. */
.os-ld-node::before{
  content:''; position:absolute; top:2%; left:15%; width:70%; height:18%;
  border-radius:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.18) 0%, transparent 100%);
  pointer-events:none; z-index:3;
}
/* 2026-11-01 — Shawn: SUBTLE BREATH. Merged into the main orb animation above.
   (Counter-spin + float combined on .os-ld-node) */
@keyframes osOrbFlow{
  0%{ box-shadow:
    inset -8px -12px 24px rgba(0,0,0,.9),
    inset 4px 6px 12px rgba(255,255,255,.15),
    0 0 16px -2px var(--nc),
    0 18px 36px rgba(0,0,0,.8),
    0 28px 48px -8px var(--nc); }
  25%{ box-shadow:
    inset -8px -12px 24px rgba(0,0,0,.9),
    inset 4px 6px 12px rgba(255,255,255,.15),
    0 0 24px 0px var(--nc),
    0 18px 36px rgba(0,0,0,.8),
    0 32px 56px -6px var(--nc); }
  50%{ box-shadow:
    inset -8px -12px 24px rgba(0,0,0,.9),
    inset 4px 6px 12px rgba(255,255,255,.15),
    0 0 16px -2px var(--nc),
    0 18px 36px rgba(0,0,0,.8),
    0 28px 48px -8px var(--nc); }
  75%{ box-shadow:
    inset -8px -12px 24px rgba(0,0,0,.9),
    inset 4px 6px 12px rgba(255,255,255,.15),
    0 0 12px -4px var(--nc),
    0 18px 36px rgba(0,0,0,.8),
    0 24px 40px -10px var(--nc); }
  100%{ box-shadow:
    inset -8px -12px 24px rgba(0,0,0,.9),
    inset 4px 6px 12px rgba(255,255,255,.15),
    0 0 16px -2px var(--nc),
    0 18px 36px rgba(0,0,0,.8),
    0 28px 48px -8px var(--nc); }
}
.os-ld-node::after{
  /* RIM LIGHT: reflected light on the bottom edge */
  content:''; position:absolute; bottom:4%; left:20%; right:20%; height:18%;
  border-radius:50%;
  background:radial-gradient(ellipse at center, var(--nc) 0%, transparent 70%);
  opacity:.35; filter:blur(4px); pointer-events:none;
}
@keyframes osOrbFloat{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}
.os-ld-node:hover .os-ld-n{
  /* 2026-11-02 — Shawn: NUMBER NEVER CHANGES ON HOVER. No scale, no blink, no flash.
     The number is a physical LCD — it doesn't react to hover. */
  transform:none !important;
  animation:none !important;
  opacity:1 !important;
}
.os-ld-node:hover{
  /* 2026-11-02 — Shawn: HOVER DOES NOTHING. The orb is already beautiful.
     No changes on hover. What you see is what you get. */
  animation-play-state:paused;
}
.os-ld-node:active{
  /* PRESSED: the sphere depresses like a physical button */
  transform:scale(.96);
}
.os-ld-node:focus-visible{outline:2px solid var(--nc);outline-offset:3px;}
.os-ld-node svg{width:76px;height:40px;display:block;}
/* 2026-11-01 — Shawn: orbs get beautiful icons and come alive on entrance.
   The jewel is the icon — large, glowing, in the orb's own color. */
/* 2026-11-01 — Shawn: ICONS ARE PHYSICAL JEWELS. Not flat emoji.
   A real gemstone has facets, depth, inner fire. The icon sits IN the orb
   like a jewel in a setting — elevated, catching light. */
.os-ld-jewel{
  font-size:30px; line-height:1; margin-bottom:4px;
  display:block; min-height:34px;
  text-shadow:
    0 0 16px currentColor,
    0 0 32px currentColor,
    0 1px 0 rgba(255,255,255,.5),
    0 3px 8px rgba(0,0,0,.7);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));
  animation:osJewelBreathe 4s ease-in-out infinite;
}
@keyframes osJewelBreathe{
  0%,100%{ transform:scale(1); filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)) brightness(1); }
  50%{ transform:scale(1.08); filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)) brightness(1.15); }
}
@keyframes osJewelGlow{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.85; transform:scale(1.08);} }
/* Entrance: orbs bloom onto the screen, staggered by JS (animation-delay). */
/* 2026-11-01 — Shawn: CLEAN AND CRISP. No float, no bobbing.
   Orbs are solid, grounded, confident. */
.os-ld-node{
  animation:osOrbIn .7s cubic-bezier(.2,1.4,.4,1) both !important;
}
@keyframes osOrbIn{ 0%{ opacity:0; transform:scale(.6);} 100%{ opacity:1; transform:scale(1);} }
/* 2026-11-01 — Shawn: CLEAN AND CRISP. Removed satellites — too much overlay.
   The orbs are the heroes. Nothing competes with them. */
.os-ld-sat{ display:none !important; }
/* 2026-11-01 — Shawn: NUMBER is white-hot, brightest in the middle.
   LABEL is the orb's color, bright. High contrast. Like a real instrument. */
/* 2026-11-02 — Shawn: FLAT GLOWING TEXT. Like the hover version, permanent.
   Bright white with purple halo. No box, no LCD — just beautiful text.
   20% smaller than old hover so it fits nicely in the orb. */
.os-ld-nodes .os-ld-node .os-ld-n,
.os-constellation .os-ld-node .os-ld-n,
button.os-ld-node .os-ld-n{
  font-size:38px !important;font-weight:900 !important;color:#ffffff !important;
  font-variant-numeric:tabular-nums;line-height:1 !important;margin:0 !important;
  display:inline-block !important;
  background:none !important;
  padding:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
  text-shadow:
    0 0 12px rgba(255,255,255,.95),
    0 0 32px var(--nc),
    0 0 48px var(--nc),
    0 2px 6px rgba(0,0,0,.9) !important;
  letter-spacing:.02em;
  opacity:1 !important;
  visibility:visible !important;
}
.os-ld-node .os-ld-l{display:none !important;font-size:11px;font-weight:800;letter-spacing:.14em;color:#fff;text-transform:uppercase;margin-top:8px;
  text-shadow:0 0 12px rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.9);
  white-space:nowrap;overflow:visible;max-width:130px;}
.os-ld-node .os-ld-pts.is-na{opacity:.4;}
.os-ld-node.ld-node-hit::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--nc);animation:osLdHit 1s ease-out 1;pointer-events:none;}
@keyframes osLdHit{0%{transform:scale(.85);opacity:.9;}100%{transform:scale(1.28);opacity:0;}}
.os-ld-node .os-ld-trace{position:absolute;bottom:6px;right:10px;font-size:11px;color:#8a8a96;text-decoration:none;}
.os-ld-node .os-ld-trace:hover{color:var(--nc);}
.os-ld-node.is-sample{border-style:dashed;}
.os-ld-node .os-sample-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);margin:0;}
.os-ld-node.ld-newnode{animation:osLdNodeIn .8s cubic-bezier(.2,.8,.3,1.2) 1;}
@keyframes osLdNodeIn{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
/* ---- node detail drawer: nodes are doors, not displays ---- */
/* 2026-11-01 — Shawn: the orb story pops up IN THE CENTER, over the gauge.
   One spot, every time. Optimized for the screen. Click the orb again (or X)
   to dismiss. On mobile it's the perfect viewpoint. */
/* 2026-11-01 — Shawn: TRUE FULLSCREEN DETAIL. Tap an orb → the screen BECOMES
   the detail view. Not a modal, not an overlay — the view itself.
   X in the corner → back to the constellation.
   2026-11-01 — Shawn: INSET, NOT EDGE-TO-EDGE. When it opens, pull it in —
   smaller, with breathing room. Shouldn't overlay everything edge-to-edge. */
/* 2026-11-02 — REBUILT. Bulletproof fullscreen modal. No animations, no transforms. */
.os-ld-drawer{
  position:fixed !important;
  left:0 !important; top:0 !important;
  width:100vw !important; height:100vh !important;
  max-width:100vw !important; max-height:100vh !important;
  min-width:100vw !important; min-height:100vh !important;
  z-index:9999 !important;
  background:#050508 !important;
  margin:0 !important; padding:0 !important;
  border:none !important; border-radius:0 !important;
  box-shadow:none !important;
  transform:none !important;
  opacity:0; pointer-events:none;
  transition:opacity .3s ease;
  overflow-y:auto; overflow-x:hidden;
}
.os-ld-drawer.open{
  opacity:1 !important;
  pointer-events:auto !important;
  display:block !important;
  visibility:visible !important;
}
/* Detail content fills the screen beautifully */
.os-ld-drawer-body{
  width:100%; max-width:800px; margin:0 auto;
  padding:80px 24px 120px;
  min-height:100%;
  /* 2026-11-01 — Shawn: SCROLLABLE. The detail scrolls, not the background. */
  overflow-y:auto; max-height:100vh;
  -webkit-overflow-scrolling:touch;
}
/* 2026-11-01 — Shawn: DETAIL HERO. Fullscreen stats that look AMAZING.
   Giant glowing number, big icon, clean breakdown. Center stage.
   2026-11-01 — Shawn: DETAIL GRAPH. 30-day bars in the orb's color.
   The visual IS the breakdown. ORB IGNITES ON CLICK — edge lights up
   in its color when selected. */
.os-detail-graph{ padding:24px 32px 8px; }
.os-dg-bars{
  display:flex; align-items:flex-end; gap:3px; height:110px;
  border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:2px;
}
/* 2026-11-01 — Shawn: NAYA OBJECTS. Every bar is a real physical object.
   Top edge light · depth · elevation · glass · own-color ignition on hover.
   Not charts — objects you could touch. */
.os-dg-bar{
  flex:1; min-width:0; border-radius:4px 4px 2px 2px;
  position:relative;
  background:linear-gradient(180deg,
    rgba(255,255,255,.35) 0%,
    var(--nc) 12%,
    var(--nc) 70%,
    rgba(0,0,0,.4) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.5),
    inset 0 -4px 8px rgba(0,0,0,.4),
    inset 2px 0 4px rgba(255,255,255,.1),
    inset -2px 0 4px rgba(0,0,0,.3),
    0 4px 12px rgba(0,0,0,.5),
    0 0 16px -4px var(--nc);
  transition:all .25s ease;
  cursor:pointer;
}
.os-dg-bar::before{
  content:''; position:absolute; top:0; left:10%; right:10%; height:2px;
  background:rgba(255,255,255,.7); border-radius:2px;
  box-shadow:0 0 6px rgba(255,255,255,.5);
}
.os-dg-bar:hover{
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.7),
    inset 0 -4px 8px rgba(0,0,0,.3),
    0 6px 16px rgba(0,0,0,.5),
    0 0 32px 2px var(--nc);
  transform:scaleY(1.02);
  filter:brightness(1.2);
}
/* 2026-11-01 — Shawn: AMBIENT LIFE. Graphs breathe — subtle, alive, never dead. */
.os-dg-bars{
  animation:graphBreathe 4s ease-in-out infinite;
}
@keyframes graphBreathe{

  50%{ filter:brightness(1.08); }
}
.os-sl-graph{
  animation:graphBreathe 4s ease-in-out infinite;
}
.os-dg-label{
  font-size:10px; letter-spacing:.25em; text-transform:uppercase;
  color:rgba(255,255,255,.35); text-align:center; margin-top:8px;
}
.os-detail-recent{ padding:16px 32px 0; }
.os-detail-recent .os-dg-label{ text-align:left; margin-bottom:8px; }
.os-dg-bar-v{
  position:absolute; top:-18px; left:50%; transform:translateX(-50%);
  font-size:10px; font-weight:800; color:#fff; white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.8); opacity:0; transition:opacity .2s;
}
.os-dg-bar:hover .os-dg-bar-v{ opacity:1; }
/* 2026-11-01 — Shawn: EVERY CHART EXPLAINS ITSELF. Headline with the story. */
.os-dg-headline{

  margin:0 0 12px; line-height:1.4;

.os-dg-headline span{ font-weight:800; }
/* 2026-11-01 — Shawn: ORB → ACTION. Stats lead to doing. */
.os-detail-action{ margin:24px 0; text-align:center; }
.os-action-btn{
  font-size:16px; font-weight:800; color:#fff;

  background:linear-gradient(180deg, var(--nc), transparent 200%);
  border:1.5px solid var(--nc);

.os-action-btn:hover{

}
.os-action-why{

  margin-top:8px; letter-spacing:.03em;
}
.os-flow-svg{ width:100%; height:140px; display:block; }
/* 2026-11-01 — Shawn: ADD LINK AT TOP. The action first, stats below. */
.os-sl-add-top{
  background:rgba(160,107,255,.05);
  border:1px solid rgba(160,107,255,.2);
  border-radius:16px; padding:20px; margin-bottom:24px;

/* 2026-11-01 — VIEWPORT OPTIMIZATION LAW (SN-0834). When an orb's story opens,
   the screen morphs to the stats: search fades, top nav fades, the detail
   takes center stage. A tiny back button restores the full view. */
body.viewport-focus .nsb-topstack,
body.viewport-focus .tn-search-wrap,
body.viewport-focus #os-ld-timepills{
  opacity:0 !important; pointer-events:none !important; transform:translateY(-8px);
  transition:opacity .3s, transform .3s;
}
.nsb-topstack, .tn-search-wrap, #os-ld-timepills{
  transition:opacity .3s, transform .3s;
}
/* Tiny back button — restores the full viewport */
#viewport-back{
  /* 2026-11-01 — Shawn: BACK BUTTON. Always visible in hero mode, top-LEFT.
     The fullscreen button (hero-toggle) is top-right. They're a pair.
     2026-11-02 — FIX: Hidden in non-hero mode. Was overlapping content when scrolled. */
  position:fixed; top:16px; left:16px; z-index:100;
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(180deg, #1a1a22, #0c0c12);
  border:1.5px solid rgba(255,255,255,.85); color:#fff;
  font-size:20px; cursor:pointer; display:none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    0 4px 16px rgba(0,0,0,.6);
  transition:opacity .3s, transform .2s;
}
body.hero-mode #viewport-back{ display:block; }
#viewport-back:hover{ transform:scale(1.1); border-color:#a06bff; }
body.viewport-focus #viewport-back{ display:block; }

.os-ld-ev.ld-ev-new{animation:osLdEvIn .7s ease-out 1;}
@keyframes osLdEvIn{0%{background:rgba(255,255,255,.09);transform:translateX(-8px);}100%{background:transparent;transform:none;}}
.os-ld-ev-empty{font-size:12.5px;color:#8a8a96;padding:8px 2px;}
.os-ld-narr{background:linear-gradient(180deg, rgba(18,18,26,.9), rgba(8,8,12,.92));

.os-ld-narr #os-ld-story{font-size:13.5px;line-height:1.6;color:#fff;}

/* ---- trajectory chips ---- */
.os-traj{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px;}
.os-traj-chip{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#E8E8EC;

  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.os-traj-chip .up{color:#2fe89e;} .os-traj-chip .dn{color:#ff5e6c;} .os-traj-chip .flat{color:#b9b3c7;}
/* ---- river ---- */
.os-ld-riverwrap{position:relative;z-index:2;padding:14px 18px 0;}
.os-ld-riverhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}

.os-ld-legend span{display:inline-flex;align-items:center;gap:5px;}

.os-ld-readout{font-size:12px;color:#b9b3c7;margin-top:6px;min-height:18px;}
.os-ld-readout b{color:#fff;}
/* ---- time switch (carried, de-golded) ---- */
.os-time-switch{display:flex;gap:6px;flex-wrap:wrap;margin:12px 18px 0;position:relative;z-index:2;align-items:center;}
.os-time-switch-label{font-size:10px;font-weight:800;letter-spacing:.18em;color:#8a8a96;text-transform:uppercase;margin-right:4px;}
.os-time-switch button{border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,#1c1c26,#0a0a10);
  color:#b9b3c7;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;font-family:inherit;

.os-time-switch button.on{background:linear-gradient(180deg,#241d3f,#100d1d);color:#e84fff;border-color:rgba(232,79,255,.6);

/* ================= UNIVERSAL CHART ENGINE (Shawn 2026-10-31: "a real live actual charting system") ===
   One engine: any stat × any window. Obsidian board, white text, spectrum data colors.
   Law: white rim at rest, own-color ignition on touch, zero flat, 16:9. */
.os-uchart{margin:14px 18px 0;position:relative;z-index:2;
  background:linear-gradient(180deg,#13131a 0%,#0a0a10 60%,#060608 100%);
  border:1.5px solid rgba(255,255,255,.16);border-radius:18px;

.os-uchart-title{display:flex;align-items:baseline;gap:12px;min-width:0;}
.os-uchart-statname{font-size:15px;font-weight:800;color:#fff;letter-spacing:.02em;white-space:nowrap;}
.os-uchart-total{font-size:30px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;line-height:1;}
.os-uchart-wind{font-size:11px;font-weight:700;letter-spacing:.14em;color:#8a8a96;text-transform:uppercase;}
.os-uchart-pills{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 2px;align-items:center;}
.os-uchart-pillslabel{font-size:10px;font-weight:800;letter-spacing:.18em;color:#8a8a96;text-transform:uppercase;margin-right:4px;}
.os-uchart-pill{border:1.5px solid rgba(255,255,255,.3);
  background:linear-gradient(180deg,#17171e,#0a0a0f 70%,#050507);

  font-family:inherit;letter-spacing:.04em;flex:1 1 auto;

  transition:border-color .18s,box-shadow .22s,color .18s,transform .18s;

.os-uchart-pill:hover{color:#fff;border-color:var(--sc,#a06bff);transform:translateY(-1px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -6px 12px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.45),0 0 16px -2px var(--sc,#a06bff);}
.os-uchart-pill.on{color:#fff;border-color:var(--sc,#a06bff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -6px 12px rgba(0,0,0,.5),0 6px 14px rgba(0,0,0,.45),0 0 18px -2px var(--sc,#a06bff);}
.os-uchart-body{position:relative;padding:6px 10px 0;}
.os-uchart-svg{width:100%;height:auto;display:block;aspect-ratio:16/9;min-height:420px;}
/* 2026-11-01 — Shawn: the chart was a giant gold block filling the screen.
   Capped at 280px so the stats AND the content below are visible.
   The chart serves the numbers, never swallows the screen.
   (min-height:0 overrides the 420px floor — min wins over max in CSS.) */
.os-uchart-svg{max-height:280px;min-height:0;aspect-ratio:auto;}
.os-uchart-tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .15s;z-index:5;
  background:rgba(10,10,16,.96);border:1.5px solid rgba(255,255,255,.25);border-radius:10px;
  padding:8px 12px;font-size:12px;color:#fff;white-space:nowrap;
  box-shadow:0 8px 22px rgba(0,0,0,.6);}
.os-uchart-tip b{font-variant-numeric:tabular-nums;}
.os-uchart-tip .os-uchart-tiplbl{color:#b9b3c7;font-size:10.5px;letter-spacing:.06em;}
.os-uchart-prov{padding:10px 18px 14px;font-size:11px;color:#8a8a96;letter-spacing:.03em;
  display:flex;align-items:center;gap:8px;}
.os-uchart-prov .os-uchart-dot{width:7px;height:7px;border-radius:50%;background:#2fe89e;flex:none;
  box-shadow:0 0 8px #2fe89e;}
.os-uchart-empty{padding:34px 18px;text-align:center;color:#b9b3c7;font-size:13px;}
@media(max-width:640px){
  .os-uchart{margin:12px 12px 0;border-radius:14px;}
  .os-uchart-head{padding:12px 14px 2px;}
  .os-uchart-total{font-size:24px;}
  .os-uchart-pills{padding:8px 14px 2px;}
  .os-uchart-prov{padding:8px 14px 12px;}
  .os-uchart-svg{min-height:0;}
  .os-uchart-viewrow{padding:8px 14px 2px;}
}
/* ---- milestones ---- */
.os-milestones{display:flex;gap:10px;flex-wrap:wrap;margin:14px 18px 0;position:relative;z-index:2;}
.os-ms{flex:1 1 200px;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;
  background:linear-gradient(180deg,#121218,#0a0a0e);border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 -8px 18px rgba(0,0,0,.4);}
.os-ms.done{border-color:rgba(47,232,158,.5);}
.os-ms.ld-new{animation:osLdMsIn 1s cubic-bezier(.2,.8,.3,1.15) 1;}
@keyframes osLdMsIn{0%{transform:translateY(14px) scale(.96);opacity:0;}100%{transform:none;opacity:1;}}
.os-ms .os-ms-ic{font-size:22px;}
.os-ms b{display:block;font-size:13px;color:#fff;}
.os-ms i{display:block;font-style:normal;font-size:11px;color:#b9b3c7;}
/* ---- sample badge (carried) ---- */
.os-sample-badge{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.14em;color:#0b0b11;

#os-points-board #os-points-note{position:relative;z-index:2;margin:12px 18px 16px;}
#os-points-board .os-lawone{position:relative;z-index:2;}
/* ---- small screens: the organism becomes a constellation grid ---- */
@media (max-width:700px){
  .os-ld-org{min-height:0;padding:8px 12px 4px;}

    width:212px;height:212px;animation:osLdBreatheM 4.5s ease-in-out infinite;}
  @keyframes osLdBreatheM{0%,100%{transform:scale(1);}50%{transform:scale(1.022);}}
  .os-ld-core.ld-flare{animation:osLdFlareM 1.1s ease-out 1, osLdBreatheM 4.5s ease-in-out 1.15s infinite;}
  @keyframes osLdFlareM{0%{transform:scale(1);}35%{transform:scale(1.07);}100%{transform:scale(1);}}
  .os-ld-links{display:none;}
  .os-ld-nodes{position:static;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .os-ld-node{position:static;width:108px;height:108px;}

  .os-ld-duo{grid-template-columns:1fr;}
  .os-ld-score b{font-size:54px;}
}
@media (prefers-reduced-motion:reduce){
  .os-ld-core,.os-ld-node,.os-ld-ev,.os-ms,.os-ld-mom-live i,.os-ld-livedot{animation:none !important;}
}

  background:#050508;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.85), inset 0 1px 0 rgba(0,0,0,.9),
    0 -16px 44px rgba(0,0,0,.68);}
.nsb-bottom.nsb-kb-hidden{transform:translateY(110%);transition:transform .3s;}
.nsb-bottom{transition:transform .3s;}
.nsb-bottom-inner{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px 12px;}
/* network anchor: the persistent connection, one touch away */
.nsb-net{display:flex;align-items:center;gap:7px;flex:0 0 auto;padding-right:4px;
  color:#fff;font-size:12px;font-weight:800;white-space:nowrap;opacity:.85;}
.nsb-net .nsb-net-glyph{width:24px;height:24px;border-radius:8px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.03) 45%,rgba(0,0,0,.3));
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.5),
    0 2px 5px rgba(0,0,0,.6), 0 0 14px -4px var(--blue);}
.nsb-net small{font-weight:600;opacity:.7;}
/* 2026-11-01 — Shawn: the settings gear is hidden. Nobody knew what it
   was for; the bar is clean without it. (JS still builds it; CSS hides it.) */
.nsb-gear{display:none !important;}
/* settings gear */
.nsb-gear{flex:0 0 auto;border:1px solid rgba(255,255,255,.22);color:#fff;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 45%, rgba(0,0,0,.34));
  border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(0,0,0,.5),
    0 2px 5px rgba(0,0,0,.65), 0 10px 22px rgba(0,0,0,.55);
  transition:transform .2s cubic-bezier(.2,1.25,.35,1), box-shadow .2s ease-out, border-color .2s;}
.nsb-gear:hover{border-color:var(--blue);transform:rotate(30deg) translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.45),
    0 0 20px -2px var(--blue), 0 4px 8px rgba(0,0,0,.6), 0 14px 28px rgba(0,0,0,.6);}
.nsb-gear:active{transform:rotate(30deg) translateY(1px);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.6);}
/* settings popover */
.nsb-settings{position:fixed;z-index:1000;display:none;
  background:linear-gradient(180deg,#171e33,#0b0f1d 60%,#070a14);
  border:1px solid rgba(255,255,255,.24);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 -10px 28px rgba(0,0,0,.4),
    0 0 0 1px rgba(0,0,0,.55),
    0 34px 80px rgba(0,0,0,.78), 0 10px 28px rgba(0,0,0,.55);
  min-width:270px;max-width:88vw;padding:18px;}
.nsb-settings.open{display:block;}
.nsb-settings h4{margin:0 0 4px;font-size:15px;color:#fff;letter-spacing:.02em;
  text-shadow:0 2px 8px rgba(0,0,0,.7);}
.nsb-settings p{margin:0 0 12px;font-size:12.5px;color:#E8E8EC;line-height:1.5;}
.nsb-settings .nsb-speed-labels{display:flex;justify-content:space-between;
  font-size:11px;color:#E8E8EC;margin:6px 2px 0;opacity:.8;}
.nsb-settings input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;
  background:transparent;margin:8px 0 2px;cursor:pointer;}
.nsb-settings input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:999px;
  background:linear-gradient(180deg,#040407,#0c0c12);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.08),
    0 1px 0 rgba(255,255,255,.07);}
.nsb-settings input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:26px;height:26px;border-radius:50%;margin-top:-8px;
  background:radial-gradient(circle at 35% 30%, #a8d9ff, var(--blue) 55%, #1663a8);
  border:2px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -3px 6px rgba(0,0,0,.35),
    0 4px 0 rgba(0,0,0,.3), 0 8px 18px rgba(0,0,0,.55), 0 0 16px -2px var(--blue);}
.nsb-settings input[type=range]::-moz-range-track{height:10px;border-radius:999px;
  background:linear-gradient(180deg,#040407,#0c0c12);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.08);}
.nsb-settings input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #a8d9ff, var(--blue) 55%, #1663a8);
  border:2px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -3px 6px rgba(0,0,0,.35),
    0 4px 0 rgba(0,0,0,.3), 0 8px 18px rgba(0,0,0,.55), 0 0 16px -2px var(--blue);}
.nsb-settings .nsb-speed-val{font-size:13px;font-weight:800;color:#fff;text-align:center;margin-top:6px;}
.nsb-settings .nsb-speed-val span{color:var(--blue);}
/* signature: the active tab breathes, gently — alive, never a flood */
@keyframes nsbBreathe{0%,100%{filter:brightness(1);}50%{filter:brightness(1.14);}}
.nsb-tab.active{animation:nsbBreathe 4s ease-in-out infinite;}
/* signature: touch ripple — the network feels your touch.
   Neighbors lift briefly, outward from the tap, like a pebble in water. */
@keyframes nsbRipple{0%{filter:brightness(1);}35%{filter:brightness(1.28);}100%{filter:brightness(1);}}
.nsb-tab.nsb-ripple{animation:nsbRipple .55s ease-out;animation-delay:var(--rd,0s);}
@media (prefers-reduced-motion: reduce){ .nsb-tab.active{animation:none;} .nsb-tab.nsb-ripple{animation:none;} }
html.nsb-calm .nsb-tab.active{animation:none;}
html.nsb-calm .nsb-tab.nsb-ripple{animation:none;}
.nsb-bottom .nsb-row{padding:10px 24px 2px;
/* 2026-11-01 — bar sits FLUSH with the viewport bottom. Was 18px, then 10px;
   Shawn's eye: the pills must touch the bottom edge, like the top bar
   touches the top. 2px is breathing room, not a gap. */
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);}
/* ============ SEARCH RESULTS (dropdown from the search level) ============ */
.nsb-search-results{position:fixed;z-index:950;display:none;
  background:linear-gradient(180deg,#171e33,#0b0f1d 60%,#070a14);
  border:1px solid rgba(255,255,255,.24);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 -10px 28px rgba(0,0,0,.4),
    0 0 0 1px rgba(0,0,0,.55),
    0 34px 80px rgba(0,0,0,.78), 0 10px 28px rgba(0,0,0,.55);
  min-width:260px;max-width:min(420px,92vw);
  max-height:50vh;overflow-y:auto;padding:8px;}
.nsb-search-results.open{display:block;}
.nsb-sr-item{display:block;padding:12px 14px;border-radius:10px;color:#fff;text-decoration:none;
  font-size:14px;font-weight:700;cursor:pointer;border:1px solid transparent;background:none;
  width:100%;text-align:left;font-family:inherit;transition:all .15s;}
.nsb-sr-item:hover{background:linear-gradient(180deg, rgba(63,184,255,.2), rgba(63,184,255,.07));
  border-color:rgba(63,184,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 0 16px -4px var(--blue), 0 4px 12px rgba(0,0,0,.4);
  transform:translateY(-1px);}
.nsb-sr-item small{display:block;font-weight:400;color:#E8E8EC;font-size:12px;margin-top:2px;}
.nsb-sr-none{padding:14px;color:#E8E8EC;font-size:13px;}
/* ============ ⋯ MENU (bottom bar tabs) ============ */
.nsb-menu{position:fixed;z-index:1000;display:none;
  background:linear-gradient(180deg,#171e33,#0b0f1d 60%,#070a14);
  border:1px solid rgba(255,255,255,.24);border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 -8px 22px rgba(0,0,0,.4),
    0 0 0 1px rgba(0,0,0,.55),
    0 28px 64px rgba(0,0,0,.75), 0 8px 22px rgba(0,0,0,.5);
  min-width:220px;padding:6px;}
.nsb-menu .mi{padding:11px 14px;border-radius:10px;cursor:pointer;color:#fff;
  font-weight:800;font-size:13px;font-family:inherit;border:1px solid transparent;background:none;
  width:100%;text-align:left;display:block;transition:all .15s;}
.nsb-menu .mi:hover{background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
  border-color:rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 4px 12px rgba(0,0,0,.4);
  transform:translateY(-1px);}
.nsb-menu .mi:active{transform:translateY(1px);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5);}
/* v1.6 COLOR LANGUAGE: rest = beautiful black; hover ignites EACH in its own color. Never all the same. */
.nsb-menu .mi-ico{font-style:normal;}
.nsb-menu .mi-heart .mi-ico{color:var(--purple);text-shadow:0 0 10px rgba(160,107,255,.85);}
.nsb-menu .mi-star .mi-ico{color:var(--gold);text-shadow:0 0 10px rgba(255,191,61,.85);}
.nsb-menu .mi-edit:hover{border-color:var(--green);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 4px 12px rgba(0,0,0,.4), 0 0 16px -4px var(--green);}
.nsb-menu .mi-heart:hover{border-color:var(--purple);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 4px 12px rgba(0,0,0,.4), 0 0 16px -4px var(--purple);}
.nsb-menu .mi-star:hover{border-color:var(--gold);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 4px 12px rgba(0,0,0,.4), 0 0 16px -4px var(--gold);}
.nsb-menu .mi-remove:hover{border-color:var(--red);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 4px 12px rgba(0,0,0,.4), 0 0 16px -4px var(--red);}
/* suggestion highlight (keyboard) + suggestion URL line — new elements, v1.4 values untouched */
.nsb-menu .mi.sel{background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.04));border-color:rgba(255,255,255,.14);}
.nsb-sug-url{display:block;font-size:11px;opacity:.6;font-weight:400;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* ============ EDITOR ============ */
.nsb-ed{display:none;margin:0 16px 12px;border:1px solid rgba(255,255,255,.22);
  border-radius:14px;padding:16px;background:linear-gradient(180deg,#141a2e,#0b0e18 65%,#070a12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -8px 22px rgba(0,0,0,.35),
    0 18px 44px rgba(0,0,0,.6);
  transition:border-color .25s ease-out, box-shadow .25s ease-out;}
.nsb-ed.open{display:block;}
/* v1.6: nothing static — the panel's outer edge ignites purple on hover (Aliveness law). */
.nsb-ed:hover{border-color:rgba(160,107,255,.65);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -8px 22px rgba(0,0,0,.35),
    0 18px 44px rgba(0,0,0,.6), 0 0 26px -4px rgba(160,107,255,.5);}
.nsb-ed p{margin:0 0 4px;font-size:16px;font-weight:700;color:#fff;}
.nsb-ed label{display:block;font-size:13px;color:#fff;margin:10px 0 4px;opacity:.85;}
.nsb-ed input,.nsb-ed select{width:100%;box-sizing:border-box;color:#fff;
  background:linear-gradient(180deg,#060609,#0f0f16);
  border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:11px 12px;
  font-size:14px;font-family:inherit;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.68), inset 0 1px 3px rgba(0,0,0,.5),
    0 1px 0 rgba(255,255,255,.06);}
.nsb-ed input:focus,.nsb-ed select:focus{outline:none;border-color:var(--purple);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.68), 0 0 18px -4px var(--purple);}
.nsb-ed-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.nsb-btn{color:#fff;border:1.5px solid rgba(255,255,255,.4);
  background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.03) 45%, rgba(0,0,0,.3)), #141419;
  border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;min-height:44px;
  cursor:pointer;font-family:inherit;transition:all .2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -3px 8px rgba(0,0,0,.4),
    0 5px 0 rgba(0,0,0,.3), 0 10px 22px rgba(0,0,0,.5);}
/* v1.6 COLOR LANGUAGE: rest = beautiful black for ALL; hover ignites each in its OWN color. Never all the same. */
.nsb-btn.save:hover,.nsb-btn.primary:hover{border-color:var(--blue);transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.35),
    0 7px 0 rgba(0,0,0,.28), 0 14px 28px rgba(0,0,0,.55), 0 0 18px -4px var(--blue);}
.nsb-btn.move-left:hover{border-color:var(--green);transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.35),
    0 7px 0 rgba(0,0,0,.28), 0 14px 28px rgba(0,0,0,.55), 0 0 18px -4px var(--green);}
.nsb-btn.move-right:hover{border-color:var(--purple);transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.35),
    0 7px 0 rgba(0,0,0,.28), 0 14px 28px rgba(0,0,0,.55), 0 0 18px -4px var(--purple);}
.nsb-btn.close:hover{border-color:rgba(255,255,255,.9);transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.35),
    0 7px 0 rgba(0,0,0,.28), 0 14px 28px rgba(0,0,0,.55), 0 0 18px -4px rgba(255,255,255,.5);}
.nsb-btn:active{transform:translateY(2px);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.5);}
.nsb-btn.primary{border-color:rgba(255,255,255,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -3px 8px rgba(0,0,0,.4),
    0 5px 0 rgba(0,0,0,.3), 0 10px 22px rgba(0,0,0,.5);}
.nsb-btn.danger:hover{border-color:var(--red);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.35),
    0 7px 0 rgba(0,0,0,.28), 0 14px 28px rgba(0,0,0,.55), 0 0 18px -4px var(--red);}
/* 2026-11-01 — Shawn: the status line ("Bar motion: Cruise.") sat below the
   pills INSIDE the fixed bar, making the bar look like it floated above the
   bottom. Visually hidden now — the pills define the bottom edge.
   (Kept in DOM for aria-live announcements.) */
.nsb-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
/* ============ MOTION ============ */
@media (prefers-reduced-motion: reduce){
  .nsb-tab,.nsb-search-btn{transition:none;}
}
html.nsb-calm .nsb-tab{transition:none;}
/* phone tuning */
@media (max-width:480px){
  .nsb-top-inner{padding-left:64px;padding-right:64px;}
  .nsb-bottom-inner{padding-left:10px;padding-right:10px;}
  .nsb-tab{padding:11px 16px;font-size:12.5px;min-height:42px;}
  .nsb-app-name{font-size:13.5px;}
  .nsb-search-box{min-width:0;flex:1;}
  .nsb-search{flex:1;justify-content:flex-end;}
  .nsb-search.open{flex:1;}
}

/* ============ ELITE POLISH 2026-10-30 — Shawn's eye pass ============
   Every element alive. Color language on every hover. Living depth everywhere.
   Law: rest = beautiful black + white light; hover = own-color edge ignition. */
@keyframes livePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.7}}

/* ---- LIVE badge: black pill, alive green dot, green edge ignition ---- */
.os-src-chip.live{background:linear-gradient(180deg,#16161e,#0a0a10);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.5);transition:border-color .18s cubic-bezier(.16,.84,.22,1),box-shadow .18s,transform .18s;cursor:default}
.os-src-chip.live::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;background:#2fe89e;box-shadow:0 0 8px 2px rgba(47,232,158,.65);animation:livePulse 2s ease-in-out infinite}
.os-src-chip.live:hover{border-color:#2fe89e;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 18px -4px #2fe89e,0 4px 10px rgba(0,0,0,.5);transform:translateY(-1px)}
.os-sl-live{background:linear-gradient(180deg,#16161e,#0a0a10);border:1.5px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.5);transition:border-color .18s cubic-bezier(.16,.84,.22,1),box-shadow .18s,transform .18s}
.os-sl-live i{width:8px;height:8px;border-radius:50%;flex:none;background:#2fe89e;box-shadow:0 0 10px 2px rgba(47,232,158,.7);animation:livePulse 2s ease-in-out infinite}
.os-sl-live:hover{border-color:#2fe89e;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 18px -4px #2fe89e,0 4px 10px rgba(0,0,0,.5);transform:translateY(-1px)}

.os-page-tile{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 1px 0 0 rgba(255,255,255,.08),inset 0 -6px 12px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);transition:border-color .18s cubic-bezier(.16,.84,.22,1),box-shadow .18s,transform .18s;cursor:default}
.os-page-tile:hover{transform:translateY(-2px)}

.os-page-tile:nth-child(2):hover{border-color:#3fb8ff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 12px rgba(0,0,0,.5),0 0 12px -2px #3fb8ff,0 10px 24px rgba(0,0,0,.45)}
.os-page-tile:nth-child(3):hover{border-color:#2fe89e;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 12px rgba(0,0,0,.5),0 0 12px -2px #2fe89e,0 10px 24px rgba(0,0,0,.45)}
.os-page-tile:nth-child(4):hover{border-color:#ffbf3d;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 12px rgba(0,0,0,.5),0 0 12px -2px #ffbf3d,0 10px 24px rgba(0,0,0,.45)}
.os-page-tile:nth-child(5):hover{border-color:#ff9a5a;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 12px rgba(0,0,0,.5),0 0 12px -2px #ff9a5a,0 10px 24px rgba(0,0,0,.45)}
.os-page-tile:nth-child(6):hover{border-color:#ff5e6c;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 12px rgba(0,0,0,.5),0 0 12px -2px #ff5e6c,0 10px 24px rgba(0,0,0,.45)}

/* ---- Page invite: gentle ignition ---- */
.os-page-invite{transition:border-color .18s cubic-bezier(.16,.84,.22,1),box-shadow .18s}
.os-page-invite:hover{border-color:rgba(255,255,255,.5);box-shadow:0 0 18px -6px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.12)}

/* ---- Ledger records: own-accent ignition ---- */
.os-ledger-rec{transition:border-color .18s cubic-bezier(.16,.84,.22,1),box-shadow .18s,transform .18s;cursor:default}
.os-ledger-rec:hover{border-color:var(--ac,#a06bff);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 20px -6px var(--ac,#a06bff),0 10px 24px rgba(0,0,0,.45);transform:translateY(-2px)}

/* ---- Orbs: lift on hover (they already breathe) ---- */
.os-orb{transition:transform .18s cubic-bezier(.16,.84,.22,1),box-shadow .18s}
.os-orb:hover{transform:translateY(-2px) scale(1.04)}

/* ---- Jewels: alive on hover ---- */
.os-jewel{transition:transform .18s cubic-bezier(.16,.84,.22,1),box-shadow .18s}
.os-jewel:hover{transform:scale(1.1)}

  border:none !important;
