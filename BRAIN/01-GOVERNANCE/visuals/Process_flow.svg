<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(237, 237, 237)" viewBox="0 0 340 354" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="23" y="10" width="294" height="42" rx="8" fill="#21152E" stroke="#8055BC" stroke-width="1"/><text x="170" y="26" fill="white" text-anchor="middle" font-size="11" font-weight="bold">1. ORIGINAL ERROR</text><text x="170" y="40" fill="#E1DAEB" text-anchor="middle" font-size="10">An agent makes an unsupported claim</text><path d="M170 52 v9 l-4 -4 m4 4 l4 -4" fill="none" stroke="#9F85CF" stroke-width="1.5"/><rect x="23" y="61" width="294" height="42" rx="8" fill="#21152E" stroke="#8055BC" stroke-width="1"/><text x="170" y="77" fill="white" text-anchor="middle" font-size="11" font-weight="bold">2. CAPTURE</text><text x="170" y="91" fill="#E1DAEB" text-anchor="middle" font-size="10">The claim becomes a Smart Note</text><path d="M170 103 v9 l-4 -4 m4 4 l4 -4" fill="none" stroke="#9F85CF" stroke-width="1.5"/><rect x="23" y="112" width="294" height="42" rx="8" fill="#21152E" stroke="#8055BC" stroke-width="1"/><text x="170" y="128" fill="white" text-anchor="middle" font-size="11" font-weight="bold">3. RETRIEVAL</text><text x="170" y="142" fill="#E1DAEB" text-anchor="middle" font-size="10">Other agents encounter the note</text><path d="M170 154 v9 l-4 -4 m4 4 l4 -4" fill="none" stroke="#9F85CF" stroke-width="1.5"/><rect x="23" y="163" width="294" height="42" rx="8" fill="#21152E" stroke="#8055BC" stroke-width="1"/><text x="170" y="179" fill="white" text-anchor="middle" font-size="11" font-weight="bold">4. SELF-EVALUATION</text><text x="170" y="193" fill="#E1DAEB" text-anchor="middle" font-size="10">An evaluator relies on the same claim</text><path d="M170 205 v9 l-4 -4 m4 4 l4 -4" fill="none" stroke="#9F85CF" stroke-width="1.5"/><rect x="23" y="214" width="294" height="42" rx="8" fill="#522044" stroke="#D185B9" stroke-width="1"/><text x="170" y="230" fill="white" text-anchor="middle" font-size="11" font-weight="bold">5. FALSE PROMOTION</text><text x="170" y="244" fill="#E1DAEB" text-anchor="middle" font-size="10">Agreement gets mistaken for proof</text><path d="M170 256 v9 l-4 -4 m4 4 l4 -4" fill="none" stroke="#9F85CF" stroke-width="1.5"/><rect x="23" y="265" width="294" height="42" rx="8" fill="#522044" stroke="#D185B9" stroke-width="1"/><text x="170" y="281" fill="white" text-anchor="middle" font-size="11" font-weight="bold">6. SUCCESSOR REUSE</text><text x="170" y="295" fill="#E1DAEB" text-anchor="middle" font-size="10">New workers inherit the error</text><path d="M317 327 H331 V9 H317" fill="none" stroke="#D185B9" stroke-dasharray="4 4" stroke-width="2"/><text x="170" y="348" fill="currentColor" text-anchor="middle" font-size="10">The error feeds back into future learning</text></svg>