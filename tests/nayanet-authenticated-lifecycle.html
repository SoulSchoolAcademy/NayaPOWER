<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NayaNET Authenticated Lifecycle Test</title><style>body{margin:0;background:#08070c;color:#fff;font:15px system-ui,sans-serif;padding:32px}main{max-width:900px;margin:auto}h1{margin-bottom:6px}.sub{color:#aaa}.card{border:1px solid #3b334d;border-radius:16px;padding:18px;margin:18px 0;background:#111019}.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ffffff12}.badge{min-width:82px;text-align:center;border:1px solid #8b63ff66;border-radius:999px;padding:4px 8px;font-size:11px}.ok{border-color:#55e39a66;color:#8ff0b8}.wait{color:#e8c766}.muted{color:#aaa}.btn{margin:10px 8px 0 0;padding:11px 15px;border:1px solid #8b63ff66;border-radius:10px;background:#15121e;color:#fff;font-weight:700;cursor:pointer}.btn:hover{border-color:#d86cff}.notice{padding:12px;border:1px solid #8b63ff44;border-radius:12px;background:#0e0c14;margin-top:16px}</style></head>
<body><main><h1>NayaNET — Authenticated Birth → Death → Resurrection → Successor</h1><div class="sub">Evidence-first browser harness. It never asks for or stores credentials. Death clears the local cognitive cache; resurrection must recover the state from authoritative persistence.</div><div id="steps" class="card"></div><button class="btn" id="run">RUN AUTHENTICATED TEST</button><button class="btn" id="reload">RELOAD / RESURRECT</button><div id="result" class="notice muted">Waiting for an authenticated browser session.</div></main><script src="../scripts/nayanet-cognitive-engine.js"></script><script>
(function(){'use strict';const KEY='nayanet:lifecycle:test:v2';const $=id=>document.getElementById(id);const rows=[['BIRTH','Authenticated session detected'],['WRITE','Canonical cognition event persisted'],['RECEIPT','Durable execution receipt confirmed'],['DEATH','Local cognitive state discarded'],['RESURRECTION','Fresh page retrieves prior event from authoritative memory'],['SUCCESSOR','Successor handoff recovered after local state loss']];function draw(states={}){$('steps').innerHTML=rows.map(([k,t])=>`<div class="step"><span class="badge ${states[k]==='PASS'?'ok':'wait'}">${states[k]||'WAIT'}</span><div><b>${k}</b><div class="muted">${t}</div></div></div>`).join('')}function save(v){localStorage.setItem(KEY,JSON.stringify(v))}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}function msg(t){$('result').textContent=t}
async function apiReady(){for(let i=0;i<100;i++){if(window.NayaNetCognition)return window.NayaNetCognition;await new Promise(r=>setTimeout(r,100))}throw Error('Cognitive engine did not initialize')}
async function run(){draw({});try{const api=await apiReady();const p=api.persistence();if(p.status!=='connected')throw Error('AUTH_REQUIRED: open this page while signed into NayaNET/Supabase');draw({BIRTH:'PASS'});const token='NAYANET-LIFECYCLE-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);const event=await api.recordPersistent({event_id:'lifecycle_'+Date.now().toString(36),title:'Authenticated lifecycle proof event',content:'Lifecycle proof token '+token,type:'test',classification:'verification',source:'nayanet-authenticated-lifecycle',actor:'human',status:'active',metadata:{test:'birth-death-resurrection-successor',token}});if(!event.persisted)throw Error('WRITE_NOT_CONFIRMED');draw({BIRTH:'PASS',WRITE:'PASS'});if(!(event.receipt&&event.receipt.event_id))throw Error('LOCAL_RECEIPT_MISSING');const remote=await api.searchRemote(token,{project:'NayaNET'});if(!remote.some(x=>x.content&&x.content.includes(token)))throw Error('REMOTE_EVENT_NOT_FOUND');draw({BIRTH:'PASS',WRITE:'PASS',RECEIPT:'PASS'});const h=api.handoff('authenticated-lifecycle-successor-test','NayaNET');if(!h?.handoff_id)throw Error('HANDOFF_NOT_CREATED');save({token,event_id:event.event.event_id,handoff_id:h.handoff_id,phase:'death'});await new Promise(r=>setTimeout(r,700));api.clear();draw({BIRTH:'PASS',WRITE:'PASS',RECEIPT:'PASS',DEATH:'PASS'});msg('Durable write and handoff created. Local cognitive cache was cleared. Reload now to force resurrection from authoritative memory.');}catch(e){msg(String(e.message||e))}}
async function resurrect(){const s=load();if(!s.token){msg('No prior lifecycle proof state found. Run the authenticated test first.');return}try{const api=await apiReady();const p=api.persistence();if(p.status!=='connected')throw Error('AUTH_REQUIRED: the resurrected session is not authenticated');const remote=await api.searchRemote(s.token,{project:'NayaNET'});if(!remote.some(x=>x.event_id===s.event_id||x.content?.includes(s.token)))throw Error('RESURRECTED_EVENT_NOT_FOUND');const successor=api.getSuccessor();const successorRecovered=successor?.handoff_id===s.handoff_id;draw({BIRTH:'PASS',WRITE:'PASS',RECEIPT:'PASS',DEATH:'PASS',RESURRECTION:'PASS',SUCCESSOR:successorRecovered?'PASS':'WAIT'});if(!successorRecovered)throw Error('SUCCESSOR_HANDOFF_NOT_RECOVERED_FROM_AUTHORITATIVE_STATE');s.phase='complete';save(s);msg('LIFECYCLE PASS — durable event survived local state destruction, the fresh session retrieved it, and successor state was recovered.');}catch(e){draw({BIRTH:'PASS',WRITE:'PASS',RECEIPT:'PASS',DEATH:'PASS',RESURRECTION:'WAIT',SUCCESSOR:'WAIT'});msg(String(e.message||e))}}
$('run').onclick=run;$('reload').onclick=()=>location.reload();draw(load().phase==='complete'?{BIRTH:'PASS',WRITE:'PASS',RECEIPT:'PASS',DEATH:'PASS',RESURRECTION:'PASS',SUCCESSOR:'PASS'}:{});if(load().phase==='death')setTimeout(resurrect,300);
})();</script></body></html>
