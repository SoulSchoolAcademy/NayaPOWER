    "</div>";


  academy.appendChild(feedback);


  /* ==========================================================
     INSERT — NEVER REPLACE THE EXISTING PAGE
     ========================================================== */

  const existingPage =
    document.querySelector(
      ".ny-page-inner"
    );


  if (existingPage) {

    existingPage.appendChild(
      academy
    );

  } else {

    document.body.appendChild(
      academy
    );

  }


  /* ==========================================================
     CTA ENFORCEMENT
     ========================================================== */

  academy
    .querySelectorAll(
      ".ny-academy-cta, .ny-feel-day"
    )
    .forEach(function (link) {

      link.href =
        CHECKOUT_URL;

    });


})();
</script>
