<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen Contract — Geometry Fixture (SAMPLE)</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#09090e;color:#fff;font:17px/1.4 Arial,sans-serif}
header{height:74px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #373744;font-weight:700}
main{min-height:calc(100dvh - 148px);display:flex;align-items:center;justify-content:center;padding:12px 16px 86px}
#os-points-board{width:min(100%,620px);border:2px solid #706080;border-radius:24px;background:linear-gradient(160deg,#1b1724,#0a0a0e);padding:18px;display:flex;align-items:center;flex-direction:column;gap:12px}
h3{font:700 22px/1.2 Arial;margin:0}
.tn-tacho{width:192px;height:192px;border:6px solid #a06bff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;background:radial-gradient(circle at 45% 32%,#292038,#0a0a0e)}
#os-v6-next{border:1.5px solid #fff;border-radius:16px;padding:10px 16px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px}
button{min-width:44px;min-height:48px;border:1.5px solid white;border-radius:999px;background:#17121f;color:white;font-size:16px;padding:8px 18px}
#nsbBottom{position:fixed;bottom:0;left:0;right:0;height:74px;background:#09090e;border-top:1px solid #777;display:flex;align-items:center;justify-content:center;font-weight:700}
@media(max-width:500px){header{height:68px}main{padding:10px 12px 82px;min-height:calc(100dvh - 140px)}#os-points-board{padding:14px;gap:10px}.tn-tacho{width:170px;height:170px}#nsbBottom{height:72px}}
