<style id="os-style">
/* ═══ ONE-SYSTEM APP LAYER — the flagship functions as named blocks inside
   the page's own system (ph-* grammar). One chrome (twin-plus), one
   navigation (the page's navtabs, now the block router), blocks shown one
   at a time. Geometry values harvested from the verified flagship layer;
   no second shell, no second hero, no second settings. ═══ */
/* — Blocks: one visible at a time, opened by the app's own doors — */
.os-view{display:none}
.os-view.on{display:block}
/* — Twin-plus chrome (Hub geometry: rooms-plus top-left, eco-plus top-right,
     48×48, extreme corners — the app's two doors, above every block) — */
#os-chrome .rooms-plus,#os-chrome .eco-plus{position:fixed;top:12px;z-index:900;width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:#fff;background:linear-gradient(180deg,#1b1b24,#07070b);border:1.5px solid #fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -4px 8px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.55);transition:border-color .25s,box-shadow .25s,transform .25s}
#os-chrome .rooms-plus{left:12px;--jewel:#a06bff}
#os-chrome .eco-plus{right:12px;--jewel:#e84fff}
#os-chrome .rooms-plus svg,#os-chrome .eco-plus svg{width:20px;height:20px}
#os-chrome .rooms-plus:hover,#os-chrome .eco-plus:hover{transform:translateY(-2px) scale(1.04);border-color:var(--jewel);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 8px rgba(0,0,0,.4),0 0 32px var(--jewel),0 12px 28px rgba(0,0,0,.6)}
/* — Rooms drawer (rooms-plus door) — contents verbatim from the Hub — */
.os-drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);z-index:960;background:#12151D;transform:translateX(-106%);transition:transform .32s cubic-bezier(.16,.84,.22,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),24px 0 60px rgba(0,0,0,.6);padding:18px 14px;overflow-y:auto}
.os-drawer.open{transform:none}
.os-drawer .os-drawer-head{font-size:11px;letter-spacing:.18em;color:#E8E8EC;margin:2px 6px 12px;font-weight:800}
.os-drawer a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;border:1.5px solid rgba(255,255,255,.85);background:linear-gradient(180deg,#17171f,#0a0a0f);margin-bottom:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.55),0 6px 16px rgba(0,0,0,.5)}
.os-drawer a:hover{border-color:var(--rc,#a06bff);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.5),0 0 22px var(--rc,#a06bff),0 8px 20px rgba(0,0,0,.55)}
.os-backdrop{position:fixed;inset:0;z-index:950;background:rgba(3,3,6,.6);display:none}
.os-backdrop.open{display:block}
/* — Ecosystem menu (eco-plus door) — contents verbatim from the Hub ECO_LINKS — */
#os-chrome .eco-menu{position:fixed;top:72px;right:12px;z-index:960;width:min(320px,88vw);background:#171B25;border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px;display:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 60px rgba(0,0,0,.65)}
#os-chrome .eco-menu.open{display:block}
#os-chrome .eco-menu .eco-head{font-size:10.5px;letter-spacing:.16em;color:#E8E8EC;padding:6px 8px 10px;font-weight:800}
#os-chrome .eco-menu a{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;letter-spacing:.04em}
#os-chrome .eco-menu a:hover{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px var(--eco,#a06bff),0 0 18px -4px var(--eco,#a06bff)}
#os-chrome .eco-menu .eco-ico{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:#0b0b11;color:var(--eco,#a06bff);font-size:13px}
#os-chrome .eco-menu .ext{margin-left:auto;color:#E8E8EC}
/* — Form controls inside blocks (values harvested from the verified
     flagship forms; the base page styles its own inputs inline) — */
.os-input,.os-textarea{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.55);border-radius:12px;color:#fff;font-size:14.5px;padding:12px 14px;font-family:inherit;margin:0 0 10px;box-sizing:border-box}
.os-input:focus,.os-textarea:focus{outline:none;border-color:#a06bff;box-shadow:0 0 18px -4px #a06bff}
/* — Block pieces in the page's own grammar — */
.os-stamp{font-size:12px;margin-top:10px;color:#E8E8EC}
.os-date{color:#2fe89e;font-weight:800}
.os-time{color:#ffbf3d;font-weight:800}
.os-status{font-size:13px;color:#E8E8EC;min-height:18px;margin-top:8px}
#os-sl-verdict{font-size:15.5px;color:#fff;line-height:1.5}
#os-sl-status{font-size:15px;color:#fff;line-height:1.5}
.os-group-h{font-size:15px;font-weight:800;color:#fff;letter-spacing:.02em;margin:16px 0 8px}
.os-avatar-img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#0b0b11;box-shadow:0 0 18px -4px #a06bff}
.os-count{font-size:34px;font-weight:900;color:#fff}
/* — The app's navigation scrolls (the page's own bars, cured once here) — */
#navtabs{display:flex!important;overflow-x:auto!important;overflow-y:hidden!important;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#navtabs::-webkit-scrollbar{display:none}
.ph-navtab{flex:none!important}
#smarttabs .nf-tabs-row{display:flex!important;overflow-x:auto!important;overflow-y:hidden!important;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch}
#smarttabs .nf-tabs-row>*{flex:none!important}
/* — Reports: the LIVING dashboard — layout scoped here; the life itself is
     harvested from the page's own elite layer (.donut + donutFill, .bar +
     barGrow, .stat-card fadeUp + hover lift, pulseGlow). The donutFill
     keyframes hold rotate(-90deg) at both ends, so the ring carries that
     as its base transform (no end-of-animation snap) and the conic
     gradient starts from 90deg to compensate — segments begin at top. — */
.os-donut-wrap{position:relative;width:120px;height:120px;margin:18px auto 8px;border-radius:50%;--bc:#e84fff;animation:pulseGlow 3s infinite}
.os-donut-wrap .donut{margin:0;transform:rotate(-90deg)}
.os-donut-hole{position:absolute;inset:17px;border-radius:50%;background:linear-gradient(180deg,#14141c,#0a0a10);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 8px rgba(0,0,0,.3)}
.os-donut-cap{font-size:9px;letter-spacing:.18em;color:#E8E8EC;font-weight:800;margin-top:2px}
.os-legend{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.os-leg{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#E8E8EC}
.os-leg b{margin-left:auto;color:#fff;font-size:15px}
.os-leg-dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px -1px currentColor}
.os-week{display:flex;align-items:flex-end;height:92px;padding:12px 2px 0}
.os-week .bar{min-width:0;margin:0 4px;border-radius:5px 5px 2px 2px}
.os-week-counts,.os-week-days{display:flex;padding:0 2px}
.os-week-counts span,.os-week-days span{flex:1;text-align:center}
.os-week-counts span{font-size:12px;font-weight:800;color:#fff}
.os-week-counts span.zero{color:#E8E8EC;opacity:.45;font-weight:600}
.os-week-days span{font-size:11px;color:#E8E8EC;letter-spacing:.03em}
.os-week-days span.today{color:#fff;font-weight:800}
.os-note{font-size:13.5px;color:#E8E8EC;line-height:1.5;margin-top:8px}
/* — BATCH 2 (ten-star items 3–10): faces, the invite journey, conversation
     inbox, and ONE LIFE PASS over every block. All life is the page's own
     harvested machinery: fadeUp entrances, pulseGlow breathing (fed by
     --bc), spectrum colors per author/stage, ignite in the card's own
     --ac. Nothing invented; composed. — */
/* life pass: a block's children rise in, staggered, every time it opens */
.os-view.on>*{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) backwards}
.os-view.on>*:nth-child(2){animation-delay:.05s}
.os-view.on>*:nth-child(3){animation-delay:.10s}
.os-view.on>*:nth-child(4){animation-delay:.15s}
.os-view.on>*:nth-child(5){animation-delay:.20s}
.os-view.on>*:nth-child(6){animation-delay:.25s}
.os-view.on>*:nth-child(7){animation-delay:.30s}
.os-view.on>*:nth-child(8){animation-delay:.35s}
/* breathing accents: section dots breathe in their own color */
.ph-dot{--bc:currentColor;animation:pulseGlow 3s infinite}
/* ignite on hover/touch — EDGE ONLY (Shawn's hover law, EYE-PASS CURE
   2026-10-22): the border + glow light in the board's own spectrum
   position (--igc, assigned by board order in each view by osIgnite —
   Addition B: boards walk purple → blue → green → gold → orange → red
   → magenta, never all one color); the TEXT never changes color. */
.os-view .ph-card{transition:border-color .25s ease,box-shadow .25s ease}
.os-view .ph-card:hover{border-color:var(--igc,var(--ac,#a06bff));box-shadow:0 0 22px -6px var(--igc,var(--ac,#a06bff)),inset 0 1px 0 rgba(255,255,255,.14)}
.os-view .ph-card:active{border-color:var(--igc,var(--ac,#a06bff));box-shadow:0 0 30px -4px var(--igc,var(--ac,#a06bff)),inset 0 1px 0 rgba(255,255,255,.20)}
/* people, present: spectrum initial avatars; active-in-a-day = glowing ring */
.os-av{position:relative;width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(180deg,#17171f,#0a0a0f);border:2px solid var(--avc,#a06bff);box-shadow:0 0 12px -3px var(--avc,#a06bff)}
.os-av.hot{animation:pulseGlow 3s infinite}
.os-who{display:flex;gap:12px;align-items:flex-start}
.os-who-main{flex:1;min-width:0}
/* faces board (Connections): faces first — full-width horizontal rows
   stacked vertically (EYE-PASS CURE: Shawn's connections-2.html layout
   standard; the mini-box grid is retired) */
.os-faces{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.os-face{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.14)}
.os-face .os-av{width:52px;height:52px;font-size:19px}
.os-face-name{font-weight:800;color:#fff;font-size:13.5px;line-height:1.25;word-break:break-word}
.os-face-fact{font-size:11.5px;color:#E8E8EC;line-height:1.35}
.os-face-msg{margin-top:2px;padding:6px 13px;font-size:12px}
/* journey funnel (Growth): the invite journey as tapered stages */
.os-funnel{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.os-fbar{height:40px;border-radius:10px;background:linear-gradient(90deg,var(--fc,#ff5e6c),rgba(255,255,255,.05));display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:800;font-size:13.5px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.4)}
.os-fconv{font-size:12px;color:#E8E8EC;padding-left:6px}
.os-fconv b{color:#fff}
/* inbox, conversational: snippets, relative times, an honest NEW glow */
.os-thread-new{border-color:#ff9a5a!important;box-shadow:0 0 22px -6px #ff9a5a}
.os-newchip{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.12em;color:#0b0b11;background:#ff9a5a;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:2px}
.os-snippet{color:#E8E8EC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ph-navtab .os-badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff9a5a;margin-left:7px;box-shadow:0 0 10px 1px #ff9a5a;vertical-align:2px}
/* calm mode: the Settings "Motion & glow" control, made real */
html.os-calm .os-view.on>*,html.os-calm .ph-dot,html.os-calm .os-donut-wrap,html.os-calm .os-av.hot{animation:none!important}
@media (prefers-reduced-motion: reduce){
.os-view.on>*{animation:none}
.ph-dot{animation:none}
}
/* — LIVING GRAPHICS PASS (2026-10-22): the data objects themselves become
     lit, physical, moving things. Wells are recessed stages; bars are lit
     objects with value pills; numerals are light, never print; the donut
     is a beveled jewel with a traveling sheen; funnel stages are slabs
     joined by flowing light; faces are coins with rotating hot arcs.
     Calm / reduced-motion = the same scene, lit and static. — */
.os-well{position:relative;border-radius:14px;padding:14px 10px 10px;background:linear-gradient(180deg,#08080d,#10101a);box-shadow:inset 0 3px 10px rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.28),0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.os-well-grid{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 23px),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 46px);background-color:#0a0a12}
.os-beam{position:absolute;top:0;bottom:0;width:44px;left:0;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transition:opacity .25s}
.os-week-counts:empty{display:none}
.os-week .bar{animation:osBarGrow .8s cubic-bezier(.2,.7,.2,1) both,osBarBreathe 3.4s ease-in-out .9s infinite;position:relative;transform-origin:50% 100%;background:linear-gradient(180deg,#fff 0,color-mix(in srgb,var(--barc,#e84fff) 88%,#fff) 12%,var(--barc,#e84fff) 55%,color-mix(in srgb,var(--barc,#e84fff) 42%,#000) 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85),inset 1px 0 0 rgba(255,255,255,.18),0 6px 12px rgba(0,0,0,.55),0 0 14px -4px var(--barc,#e84fff);animation-delay:calc(var(--i,0)*60ms),calc(var(--i,0)*60ms + .9s)}
@keyframes osBarGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes osBarBreathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
.os-week .bar.today{animation:osBarGrow .8s cubic-bezier(.2,.7,.2,1) both,osBarPulse 2.6s ease-in-out .9s infinite}
@keyframes osBarPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
.os-bar-pill{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:900;line-height:1;color:#0b0b11;background:linear-gradient(180deg,#fff,var(--barc,#e84fff));border-radius:7px;padding:3px 6px;box-shadow:0 0 12px -2px var(--barc,#e84fff),inset 0 1px 0 rgba(255,255,255,.8);white-space:nowrap}
.os-lit-num,.os-count,.os-donut-hole .donut-center{background:linear-gradient(180deg,#fff 18%,var(--ac,#a06bff) 135%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 9px var(--ac,#a06bff))}
.os-donut-wrap .donut{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));box-shadow:inset 0 2px 3px rgba(255,255,255,.5),inset 0 -6px 12px rgba(0,0,0,.45)}
.os-donut-sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 68%,rgba(255,255,255,.5) 78%,transparent 88%);-webkit-mask:radial-gradient(circle,transparent 0 69%,#000 71% 97%,transparent 99%);mask:radial-gradient(circle,transparent 0 69%,#000 71% 97%,transparent 99%);animation:osSheenSpin 9s linear infinite;z-index:2}
@keyframes osSheenSpin{to{transform:rotate(360deg)}}
.os-donut-hole{z-index:3;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 10px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.14)}
.os-donut-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 8px 1px rgba(255,255,255,.75);z-index:2;pointer-events:none}
.os-fbar{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--fc,#ff5e6c) 72%,#fff) 0,var(--fc,#ff5e6c) 34%,color-mix(in srgb,var(--fc,#ff5e6c) 45%,#000) 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -5px 9px rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.5),0 0 16px -6px var(--fc,#ff5e6c);animation:osSlabIn .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.os-fbar::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent)}
.os-fbar::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);background-size:250% 100%;animation:osSlabSheen 3.8s ease-in-out infinite}
@keyframes osSlabSheen{0%{background-position:130% 0}55%,100%{background-position:-130% 0}}
@keyframes osSlabIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.os-fbar-n{display:inline-block;background:linear-gradient(180deg,#fff,var(--fc,#ff5e6c));color:#0b0b11;border-radius:7px;padding:2px 8px;margin-left:2px;box-shadow:0 0 12px -2px var(--fc,#ff5e6c),inset 0 1px 0 rgba(255,255,255,.85);font-weight:900}
.os-fconv{display:flex;align-items:center;gap:8px}
.os-farrow{flex:none;width:3px;height:24px;border-radius:2px;background:repeating-linear-gradient(180deg,var(--fc,#ff9a5a) 0 5px,transparent 5px 10px);background-size:100% 20px;animation:osFlow 1s linear infinite;box-shadow:0 0 8px -1px var(--fc,#ff9a5a)}
@keyframes osFlow{to{background-position:0 20px}}
.os-av{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 42%),radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--avc,#a06bff) 55%,#101014) 0%,color-mix(in srgb,var(--avc,#a06bff) 28%,#060607) 78%);border:2px solid color-mix(in srgb,var(--avc,#a06bff) 80%,white);box-shadow:0 0 24px -4px var(--avc,#a06bff),inset 0 2px 3px rgba(255,255,255,.25),inset 0 -6px 12px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.55);text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* THE ORB (EYE-PASS CURE, Shawn 2026-10-22 — the standard is his
   connections-2.html .cx-ava): a light sweep flows around the initial,
   forever — the initial is a jewel, not a letter in a flat disc. */
.os-av::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,255,255,.35) 40deg,transparent 90deg);animation:osOrbFlow 7s linear infinite;pointer-events:none}
@keyframes osOrbFlow{to{transform:rotate(360deg)}}
.os-av-arc{position:absolute;inset:-5px;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 55%,var(--avc,#a06bff) 78%,#fff 88%,transparent 100%);-webkit-mask:radial-gradient(circle,transparent 0 78%,#000 80% 94%,transparent 96%);mask:radial-gradient(circle,transparent 0 78%,#000 80% 94%,transparent 96%);animation:osArcSpin 3.2s linear infinite}
@keyframes osArcSpin{to{transform:rotate(360deg)}}
.os-face .os-av{width:60px;height:60px;font-size:22px}
.os-face{border-color:rgba(255,255,255,.26)}
.os-skel{position:relative;overflow:hidden;min-height:84px;border-radius:12px;background:linear-gradient(180deg,#10101a,#0a0a12);box-shadow:inset 0 2px 8px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.18)}
.os-skel::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);animation:osSkel 1.3s ease-in-out infinite}
@keyframes osSkel{from{transform:translateX(-110%)}to{transform:translateX(240%)}}
.os-period{display:flex;gap:7px;margin:10px 0 2px}
.os-period button{flex:none;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;color:#E8E8EC;background:linear-gradient(180deg,#17171f,#0a0a0f);border:1.5px solid rgba(255,255,255,.3);cursor:pointer;font-family:inherit;box-shadow:inset 0 2px 5px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.15)}
.os-period button{position:relative;transition:box-shadow .25s,border-color .25s,text-shadow .25s}
.os-period button.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 46%,rgba(0,0,0,.34)),#0a0a10;border:1.5px solid var(--pc,#e84fff);text-shadow:0 0 10px var(--pc,#e84fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -9px 15px -8px var(--pc,#e84fff),0 0 18px -2px var(--pc,#e84fff),0 6px 14px rgba(0,0,0,.5)}
.os-flare{animation:osFlare .7s ease-out!important}
@keyframes osFlare{0%{filter:brightness(1)}35%{filter:brightness(1.65) drop-shadow(0 0 18px var(--ac,#a06bff))}100%{filter:brightness(1)}}
.os-view .ph-card{box-shadow:inset 0 2px 0 rgba(255,255,255,.13),inset 0 -5px 13px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.07),0 16px 44px rgba(0,0,0,.55),0 5px 18px rgba(0,0,0,.45)}
.ph-sec-t,.os-view h3{text-shadow:0 1px 0 rgba(255,255,255,.22),0 3px 10px rgba(0,0,0,.65)}
.os-note{color:#F0F0F4}

/* THE COVER GEOMETRY (EYE ROUND 3, decided 2026-10-22 21:51Z —
   Phi's round-2 scorecard item 1, closed by name): the cover is a
   BAND with fixed geometry: aspect-ratio 16/9 (Shawn's ruled 1.7778,
   embodied in the bytes) with a max-height cap of 360px on wide
   screens. Phones get the true 16:9 band (≈219px at 390 wide);
   desktops get a cinematic ≈3.5:1 window instead of a full-screen
   wall. The photo fills the band (object-fit: cover, never
   distorted) and the owner drags it to choose the window — the
   position persists (the engine's cover-drag, fm.coverPos). The
   identity composition anchors to the band's bottom edge. */
.ph-cover{height:auto;aspect-ratio:16/9;max-height:360px;background:radial-gradient(560px 240px at 12% -10%,rgba(160,107,255,.5),transparent 60%),radial-gradient(520px 260px at 88% 0%,rgba(232,79,255,.32),transparent 60%),radial-gradient(640px 300px at 55% 118%,rgba(63,184,255,.34),transparent 62%),linear-gradient(135deg,#1a1a3e,#2d1b4e 30%,#4a2b7a 55%,#0f3460 80%,#16537e)}
