  function bucketize(times, period){
    var today=new Date(); today.setHours(0,0,0,0);
    var buckets=[], i, start;
    if (period===7 || period===30){
      var n=period; start=new Date(today.getTime()-(n-1)*864e5);
      for (i=0;i<n;i++) buckets.push({d:new Date(start.getTime()+i*864e5), n:0, label:'', note:'', today:false});
      times.forEach(function(t){ var td=new Date(t); td.setHours(0,0,0,0); var idx=Math.round((td-start)/864e5); if (idx>=0 && idx<n) buckets[idx].n++; });

        var last=ix===buckets.length-1;
        b.label=last?'Today':(period===7?b.d.toLocaleDateString('en-US',{weekday:'short'}):(ix%5===0?String(b.d.getDate()):''));

        b.today=last;

      var oldest=today.getTime();
      times.forEach(function(t){ var td=new Date(t); td.setHours(0,0,0,0); if (td.getTime()<oldest) oldest=td.getTime(); });
      var weeks=Math.min(260, Math.max(1, Math.ceil((today.getTime()-oldest)/(7*864e5))+1));

      for (i=0;i<weeks;i++) buckets.push({d:new Date(start.getTime()+i*7*864e5), n:0, label:'', note:'', today:false});
      times.forEach(function(t){ var td=new Date(t); var idx=Math.floor((td-start)/(7*864e5)); if (idx>=0 && idx<weeks) buckets[idx].n++; });

        var last=ix===buckets.length-1;

        b.note='Week of '+b.d.toLocaleDateString('en-US',{month:'long', day:'numeric'})+': '+b.n+(b.n===1?' event':' events')+'.';
        b.today=last;
      });
    }
    return buckets;
  }

  function donutSegs(el, vals, colors){
    var wrap=el.closest?el.closest('.os-donut-wrap'):null;
    var t=0; vals.forEach(function(v){ t+=v; });
    if (!t){ el.style.background='conic-gradient(from 90deg, rgba(255,255,255,.10) 0 100%)'; }
    else {
      var gap=1.4, cursor=0, parts=[], lastIdx=-1;
      vals.forEach(function(v, idx){ if (v>0) lastIdx=idx; });
      vals.forEach(function(v, idx){
        if (!v) return;
        var share=v/t*100, end=cursor+share;
        var ge=(idx===lastIdx)?end:Math.max(cursor, end-gap);
        parts.push(colors[idx]+' '+cursor.toFixed(2)+'% '+ge.toFixed(2)+'%');
        cursor=end;

        });
      }
    }

  function sparkPoints(times){
    var start=new Date(); start.setHours(0,0,0,0); start=new Date(start.getTime()-6*864e5);

    times.forEach(function(t){
      var td=new Date(t); td.setHours(0,0,0,0);
      var idx=Math.round((td-start)/864e5);
      if (idx>=0 && idx<7) days[idx]++;

    return days.map(function(n, i){ return (i*(100/6)).toFixed(1)+','+(25-(n/max)*21).toFixed(1); }).join(' ');

  /* — Shared boot read (#23 speed pass): the boot burst used to fire

  /* — Cover focal drag (EYE ROUND 3 steer, 2026-10-22 21:51Z): the
     cover is a 16:9 band capped at 360px; the owner drags the photo
     inside the band to choose what shows. The position persists as
     object-position in this device's page data (fm.coverPos) and is
     re-applied whenever the photo lands. No distortion, ever — the
     photo is only ever windowed, and the owner chooses the window.
     A real drag (past 6px of travel) swallows the click that follows
     it, so the cover's tap-to-change never fires mid-reposition.
     Touch keeps vertical page scroll (the photo allows pan-y); the
     drag is full two-axis with a mouse or pen. — */
  (function(){
    var cvr=document.getElementById('cvr'); if (!cvr) return;
    var KEY='fm.coverPos';
    function stored(){ try{ return localStorage.getItem(KEY)||''; }catch(e){ return ''; } }
    function applyPos(){ var img=cvr.querySelector('img'); var p=stored(); if (img && p) img.style.objectPosition=p; }
    applyPos();
    if (window.MutationObserver){ new MutationObserver(applyPos).observe(cvr, { childList:true, attributes:true, attributeFilter:['src'] }); }
    var drag=null, suppressUntil=0;
    document.addEventListener('click', function(e){
      if (Date.now()<suppressUntil && e.target && cvr.contains(e.target)){ e.stopPropagation(); e.preventDefault(); }
    }, true);
    cvr.addEventListener('pointerdown', function(e){
      var img=cvr.querySelector('img'); if (!img || e.target!==img) return;
      var btn=document.getElementById('cvrbtn');
      if (btn && btn.offsetParent===null) return;
      if (e.button!==undefined && e.button>0) return;
      var cr=cvr.getBoundingClientRect();
      var iw=img.naturalWidth||0, ih=img.naturalHeight||0; if (!iw || !ih) return;
      var scale=Math.max(cr.width/iw, cr.height/ih), rw=iw*scale, rh=ih*scale;
      var parts=(img.style.objectPosition||'50% 50%').split(/\s+/);
      var px=parseFloat(parts[0])||50, py=parseFloat(parts.length>1?parts[1]:parts[0])||50;
      drag={ x:e.clientX, y:e.clientY, moved:0, pid:e.pointerId,
             offX:(cr.width-rw)*px/100, offY:(cr.height-rh)*py/100,
             minX:cr.width-rw, minY:cr.height-rh };

      if (!drag || e.pointerId!==drag.pid) return;
      var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      drag.moved=Math.max(drag.moved, Math.abs(dx)+Math.abs(dy));
      if (drag.moved<3) return;
      var img=cvr.querySelector('img'); if (!img) return;
      var nx=Math.min(0, Math.max(drag.minX, drag.offX+dx));
      var ny=Math.min(0, Math.max(drag.minY, drag.offY+dy));
      var px=drag.minX ? nx/drag.minX*100 : 50;
      var py=drag.minY ? ny/drag.minY*100 : 50;

    });

  /* — Message actions (Inbox): every message in a conversation carries

           inside it. The conversion is built from the message's own
           structure on this surface — no model is called — and it is

  var osMsgById = {};

  function msgSmartConvert(m){

    if (hook.length > 90){ var cut = hook.slice(0, 90); hook = cut.slice(0, cut.lastIndexOf(' ') > 40 ? cut.lastIndexOf(' ') : 90) + '…'; }
    var sender = humanize(m.from), subject = m.subject || 'a conversation', when = msgWhen(m.at);

    var means = 'It meant enough to keep. Nothing here is a summary of the message — the conversion adds the frame (what it is, why it matters, how to use it) and the message itself stays exactly as written.';
    var forYou = 'Conversations in this app clear 7 days after their last message. A saved Smart Note is how what mattered survives that clear — kept in the form your Smart Feed speaks.';
    var applies = 'Read it back any time from your Naya Notes, filed under Smart Note. Copy it, share it, or build on it — the original words travel with it.';

  /* — Naya Notes block (Notes view): the member's private notes TO

       enter any feed. Capture (typed or dictated), list mine newest

  var nnCats = [], nnNotes = [], nnFilter = 'All', nnPick = '';

  /* — Smart Link block (Growth): the owner's own nayanet.live/<name>.

    if (st.joins) s += ' ' + st.joins + (st.joins === 1 ? ' join' : ' joins') + ' credited to this link — someone who clicked became a member.';

      return '<div class="os-well" style="padding:14px 16px;margin-top:12px;">'
        + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><b style="font-size:17px;color:#fff;">nayanet.live/' + esc(l.name) + '</b>'

        + '<div class="ph-actions"><button class="ph-msg" type="button" data-sl-copy="' + esc(l.name) + '">Copy the link</button><button class="ph-msg" type="button" data-sl-open="' + esc(l.name) + '">Open it</button></div>'

  function slCheckLive(name){

      });
    });
    briefRows(sb.from('invites').select('id,dry_run').eq('inviter_alias', PAGE_ALIAS).eq('status','pending').limit(200)).then(function(vs){
      briefState.invites=vs?{ count:vs.length, allDry:(vs.length>0 && vs.every(function(v){ return v.dry_run; })) }:null;
      tryRenderBrief();
    });
    briefRows(sb.from('naya_notes').select('id').eq('owner_alias', PAGE_ALIAS).gte('created_at', dsISO).limit(500)).then(function(ns){
      briefState.notes=ns?ns.length:null;

  function briefSetWaiting(waitingT, threadCount){

  function briefOrb(n, label, color){

  /* — The spoken brief's player: the Hub player's contract in miniature.
       Chunk ≤600 on sentence bounds → key = sha256(chunk)[:16] → probe
       the text cache → on a miss, POST /synthesize and poll every 2s
       (up to ~90s) → play the file. The browser never synthesizes. — */
  function briefChunkText(text, max){
    var clean=String(text||'').replace(/\s+/g,' ').trim();
    if (!clean) return [];
    if (clean.length<=max) return [clean];
    var out=[], rest=clean;
    while (rest.length>max){
      var cut=rest.lastIndexOf('. ', max);
      if (cut<max*0.4) cut=rest.lastIndexOf(' ', max);
      if (cut<=0) cut=max;
      out.push(rest.slice(0, cut+1).trim());
      rest=rest.slice(cut+1).trim();
    }
    if (rest) out.push(rest);
    return out;
  }
  function briefKey(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){
      var b=new Uint8Array(buf), h='';
      for (var i=0;i<b.length;i++) h+=('0'+b[i].toString(16)).slice(-2);
      return h.slice(0,16);
    });
  }
  function briefProbe(url){
    return fetch(url, { headers:{ 'Range':'bytes=0-0' } }).then(function(r){ return r.ok; }, function(){ return false; });
  }
  function briefResolveChunk(text, session){
    return briefKey(text).then(function(key){
      var url='https://naya-voice.nayapower.workers.dev/cache-'+key+'.mp3';
      return briefProbe(url).then(function(hit){
        if (hit) return url;
        return fetch('https://naya-voice.nayapower.workers.dev/synthesize', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ text:text }) }).then(function(){
          return new Promise(function(done){
            var waited=0;
            var iv=setInterval(function(){
              waited+=2;
              if (session!==briefSession){ clearInterval(iv); done(null); return; }
              briefProbe(url).then(function(ok){
                if (ok){ clearInterval(iv); done(url); }
                else if (waited>=90){ clearInterval(iv); done(null); }
              });
            }, 2000);
          });
        }, function(){ return null; });
      });
    }, function(){ return null; });
  }
  function briefPlayUrl(url, session){
    return new Promise(function(done){
      if (session!==briefSession){ done(false); return; }
      var a=new Audio();
      briefAudio=a;
      a.src=url;
      a.onended=function(){ if (briefAudio===a) briefAudio=null; done(true); };
      a.onerror=function(){ if (briefAudio===a) briefAudio=null; done(false); };
      var pr=a.play();
      if (pr && pr.catch) pr.catch(function(){ done(false); });
    });
  }
  function briefSetBtn(label){
    if (briefBtn) briefBtn.textContent=label||'▶ Listen to your brief';
  }
  function briefVoiceSay(msg){
    var el=$('os-today-brief');
    var line=el?el.querySelector('[data-os-brief-voice]'):null;

  }
  function briefStopListen(){
    briefSession++;
    if (briefAudio){ try{ briefAudio.pause(); }catch(e){} briefAudio=null; }
    briefBusy=false;
    briefSetBtn(null);
  }
  function briefToggleListen(btn){
    if (briefBusy || briefAudio){ briefStopListen(); return; }
    briefBtn=btn;
    if (!briefSpoken){ briefVoiceSay('The brief is still loading — give it a moment, then tap again.'); return; }
    if (!window.crypto || !crypto.subtle){ briefVoiceSay('Her voice needs a secure connection on this surface — the brief is written above.'); return; }
    var session=++briefSession;
    briefBusy=true;
    briefSetBtn('Naya is preparing her voice… tap to stop');
    briefVoiceSay('');
    var chunks=briefChunkText(briefSpoken, 600), i=0;
    (function next(){
      if (session!==briefSession) return;
      if (i>=chunks.length){ briefBusy=false; briefSetBtn(null); return; }
      briefResolveChunk(chunks[i], session).then(function(url){
        if (session!==briefSession) return;
        if (!url){
          briefBusy=false; briefSetBtn(null);
          briefVoiceSay('Her voice could not be prepared this time — the brief is written above. A fresh reading can take a little while to bake; try again shortly.');

  }

  /* — Today block: today's date + this page's real latest activity — */

    Promise.all([fetchWall(8), thrP, invP, msgP]).then(function(out){

            +'<p style="margin-top:12px">The latest: '+(/^[aeiou]/.test(newest.kind.toLowerCase())?'an':'a')+' '+newest.kind.toLowerCase()+', '+relLabel(newest.at)+'. '

  /* — Connections block: the Faces Board (Living Data) — faces first.

  /* — THE PER-PERSON TIMELINE (the Phase-0 step-2 read model's face):
       tap a face — on this board, in Today, in Reports, or on the
       Dashboard — and their story in this app unfolds under the Faces
       board: every event public.person_timeline_events holds for them,
       newest first, each carrying the timestamp standard. The view is
       a live union over this app's own tables, person-keyed with its

       CLOSING LINES ARE COMPUTED ONLY FROM THE EVENTS: "last spoke"
       reads the latest message event and says who wrote it; a

  var TL_KINDS={wall_post:'Wall post', profile_changed:'Profile picture', note_published:'Smart Note', connection_recorded:'Connected', message_received:'Message received', message_sent:'Message sent', conversation_started:'Conversation started', invite_recorded:'Invite recorded', invite_sent:'Invite sent', invite_visited:'Invite visited', invite_joined:'Joined', invite_send_logged:'Invite sent', voice_note:'Voice note', video_note:'Video note', booking:'Booking', payment:'Payment'};
  function openTimeline(name){

  var SL_KIND_LABEL = { smart_note: 'Smart Note', naya_note: 'Naya Note', person: 'Person', mail_thread: 'Mail', smart_link: 'Smart Link', text: 'Note to self' };

  function slFetch(){

  function slMigrate(data){
    var flag = 'os.sl.migrated.' + PAGE_ALIAS;
    try { if (localStorage.getItem(flag)) return Promise.resolve(data); } catch(e){}
    var lists = data.lists.slice(), items = data.items.slice();
    function findList(title){ var f = null; lists.forEach(function(l){ if (l.title === title) f = l; }); return f; }
    function ensureList(title){
      var f = findList(title); if (f) return Promise.resolve(f);
      return sb.from('smart_lists').insert({ owner_alias: PAGE_ALIAS, title: title, category: 'General', position: lists.length }).select('id,title,category,position,created_at').single().then(function(res){
        if (res.error) throw res.error; lists.push(res.data); return res.data;
      });
    }
    function addText(list, text, done, pos){
      if (!text) return Promise.resolve();
      var dup = items.some(function(it){ return it.list_id === list.id && it.item_kind === 'text' && it.text === text; });
      if (dup) return Promise.resolve();
      return sb.from('smart_list_items').insert({ owner_alias: PAGE_ALIAS, list_id: list.id, item_kind: 'text', text: text, done: !!done, position: pos }).select('id,list_id,item_kind,item_ref,label,text,done,position,created_at').single().then(function(res){ if (!res.error && res.data) items.push(res.data); });

    if (local.length){

        return c3;
      });
    }

  }

  function slCreateList(title, cb){

    if (slOffline || !sb){ var st = $('os-list-status'); if (st) st.textContent = 'Lists need the connection — a new list cannot be saved from this device alone.'; return; }
    sb.from('smart_lists').insert({ owner_alias: PAGE_ALIAS, title: title, category: 'General', position: (slLists || []).length }).select('id,title,category,position,created_at').single().then(function(res){
      if (res.error){ var st2 = $('os-list-status'); if (st2) st2.textContent = 'Could not create the list — ' + res.error.message; return; }
      slLists.push(res.data); slCurrent = res.data.id;
      if ($('os-list-rows')) renderLists();
      if (cb) cb(res.data);
    });
  }

  function slDeleteList(id, btn){
    if (slDelArm !== id){
      slDelArm = id;
      if (btn) btn.textContent = 'Tap again to delete — the things in it are only filed here; they are not deleted';
      setTimeout(function(){ if (slDelArm === id){ slDelArm = null; if ($('os-list-rows')) renderLists(); } }, 4500);
      return;
    }
    slDelArm = null;
    if (!sb) return;
    sb.from('smart_lists').delete().eq('id', id).then(function(res){
      if (res && res.error){ var st = $('os-list-status'); if (st) st.textContent = 'Delete failed: ' + res.error.message; return; }
      slLists = (slLists || []).filter(function(l){ return l.id !== id; });
      slItems = (slItems || []).filter(function(it){ return it.list_id !== id; });
      if (slCurrent === id) slCurrent = slLists.length ? slLists[0].id : null;
      renderLists();
    });
  }

  function slDoAdd(){
    var addIn = $('os-list-input'); if (!addIn) return;
    var v = (addIn.value || '').trim(); if (!v){ addIn.focus(); return; }
    function proceed(){
      var cur = slListById(slCurrent);
      if (!cur){ slCreateList('Things That Matter', function(){ slDoAdd(); }); return; }
      var mine = slSortedMine(cur.id);
      var pos = mine.length ? Math.min.apply(null, mine.map(function(x){ return x.position || 0; })) - 1 : 0;
      if (slOffline){
        slItems.unshift({ id: 'l' + Date.now().toString(36), list_id: 'local', item_kind: 'text', item_ref: null, label: null, text: v, done: false, position: pos, created_at: null });
        slPersistLocal(); addIn.value = ''; renderLists(); return;
      }
      sb.from('smart_list_items').insert({ owner_alias: PAGE_ALIAS, list_id: cur.id, item_kind: 'text', text: v, done: false, position: pos }).select('id,list_id,item_kind,item_ref,label,text,done,position,created_at').single().then(function(res){
        if (res.error){ var st = $('os-list-status'); if (st) st.textContent = 'Could not add — ' + res.error.message; return; }
        slItems.push(res.data); addIn.value = ''; renderLists();
      });
    }
    if (!slLists) slLoad().then(proceed); else proceed();
  }

  /* — the shared filing picker: pick an existing list or name a new one.
       The same drawer the cards already open (the Notes block's moverow,
       the Smart Note card's action row, the message row after a save). — */
  function slFileInto(listId, target, after){
    var existing = null;
    (slItems || []).forEach(function(it){ if (it.list_id === listId && it.item_kind === target.kind && it.item_ref === target.ref) existing = it; });
    if (existing){
      slItems = slItems.filter(function(it){ return it.id !== existing.id; });
      sb.from('smart_list_items').delete().eq('id', existing.id).then(function(res){ if (after) after(res && res.error ? null : false); });
      return;
    }
    var mine = slSortedMine(listId);
    var pos = mine.length ? Math.max.apply(null, mine.map(function(x){ return x.position || 0; })) + 1 : 0;
    sb.from('smart_list_items').insert({ owner_alias: PAGE_ALIAS, list_id: listId, item_kind: target.kind, item_ref: target.ref, label: (target.label || '').slice(0, 280), position: pos }).select('id,list_id,item_kind,item_ref,label,text,done,position,created_at').single().then(function(res){
      if (!res.error && res.data){ slItems.push(res.data); if (after) after(true); }
      else if (after) after(null);
    });
  }
  function slFindHost(target){
    if (target.kind === 'naya_note') return document.querySelector('[data-nn-moverow="' + target.ref + '"]');
    if (target.kind === 'smart_note') return document.querySelector('[data-os-listrow="r' + target.ref + '"]');
    return null;
  }
  function slRenderPicker(host, target, statusText){
    if (!host) return;
    function draw(){
      if (slOffline || !sb){
        host.innerHTML = '<div class="os-sl-picker"><div class="os-sl-plabel">FILE INTO A LIST</div><p class="os-note">Lists need the connection — filing waits until it is back.</p></div>';
        return;
      }
      var mem = slMemberships()[target.kind + ':' + target.ref] || [];
      var chips = (slLists || []).map(function(l, i){
        var has = mem.indexOf(l.id) >= 0;
        return '<button class="os-like' + (has ? ' on' : '') + '" type="button" data-sl-file="' + esc(l.id) + '" style="--ac:' + NN_WALK[i % NN_WALK.length] + ';margin:0 6px 6px 0;">' + (has ? '✓ ' : '+ ') + esc(l.title) + '</button>';
      }).join('');
      host.innerHTML = '<div class="os-sl-picker"><div class="os-sl-plabel">FILE INTO A LIST — TAP TO FILE, TAP AGAIN TO REMOVE</div>'
        + '<div>' + chips + '</div>'
        + '<div style="display:flex;gap:8px;margin-top:2px;"><input class="os-input" data-sl-newname type="text" placeholder="…or name a new list" maxlength="80" style="flex:1;margin:0;"><button class="os-savebtn" type="button" data-sl-createnew style="--ac:#2fe89e">Create &amp; file</button></div>'
        + '<div class="os-status" data-sl-pickstatus>' + (statusText ? esc(statusText) : '') + '</div></div>';
      host.querySelectorAll('[data-sl-file]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var listId = btn.getAttribute('data-sl-file');
          var list = slListById(listId); var title = list ? list.title : 'the list';
          slFileInto(listId, target, function(filed){
            var msg = filed === null ? 'That did not save — check the connection and try again.' : (filed ? ('Filed in “' + title + '” ✓ — find it in Lists.') : ('Removed from “' + title + '”.'));
            slPickerState = { target: target, statusText: msg };
            if (target.kind === 'naya_note' && typeof nnRenderList === 'function') nnRenderList();
            if (target.kind === 'smart_note') renderNotes();
            var h = (host && document.contains(host)) ? host : slFindHost(target);
            if (h){ h.setAttribute('data-sl-open', '1'); slRenderPicker(h, target, msg); }

        });

      var createBtn = host.querySelector('[data-sl-createnew]');
      if (createBtn) createBtn.addEventListener('click', function(){
        var inp = host.querySelector('[data-sl-newname]');
        var name = (inp && inp.value || '').trim();
        if (!name){ if (inp) inp.focus(); return; }
        slCreateList(name, function(list){
          slFileInto(list.id, target, function(filed){
            var msg = filed ? ('Filed in “' + list.title + '” ✓ — find it in Lists.') : 'The list was made, but the filing did not save — tap it above to file.';
            slPickerState = { target: target, statusText: msg };
            if (target.kind === 'naya_note' && typeof nnRenderList === 'function') nnRenderList();
            if (target.kind === 'smart_note') renderNotes();
            var h = (host && document.contains(host)) ? host : slFindHost(target);
            if (h){ h.setAttribute('data-sl-open', '1'); slRenderPicker(h, target, msg); }
          });
        });

    if (!slLists) slLoad().then(draw); else draw();

  function slTogglePicker(host, target){

  function slRedrawPicker(){

  /* Card re-renders (a late notes load finishing, a save) rebuild the
     picker's host element — redraw the open picker into the fresh host so

  if (typeof renderNotes === 'function'){ var slRnOrig = renderNotes; renderNotes = function(){ var r = slRnOrig.apply(this, arguments); slRedrawPicker(); return r; }; }
  if (typeof nnRenderList === 'function'){ var slNnOrig = nnRenderList; nnRenderList = function(){ var r = slNnOrig.apply(this, arguments); slRedrawPicker(); return r; }; }
  /* — The Intelligent Library (wave #5, contract S11): the page's own Q&A,
       saved onto the page's own store (smart_notes kind 'qa'), searchable
       in place, with an honest empty state. loadLibrary / saveQuestion. — */
  var osLibCache=null;
  function loadLibrary(){
    if (osLibCache===null) osLibCache=lsGet(lsKey('library'), []);
    renderLibrary();
    if (!sb) return;
    sb.from('smart_notes').select('id,content,created_at').eq('owner_alias', PAGE_ALIAS).order('created_at',{ascending:false}).limit(300).then(function(res){
      if (res && !res.error){
        var rows=(res.data||[]).map(function(r){ return {r:r, c:parseRow(r)}; }).filter(function(x){ return x.c.k==='qa'; });
        osLibCache=rows.map(function(x){ return {q:x.c.q||'', a:x.c.a||'', at:x.r.created_at}; });
        lsSet(lsKey('library'), osLibCache);
        renderLibrary();
      }
    }, function(){});
  }
  function renderLibrary(){
    var listEl=$('os-lib-list'); if (!listEl) return;
    var all=osLibCache||[];
    var meta=$('os-lib-meta');
    if (meta) meta.textContent=all.length?(all.length+(all.length===1?' answer':' answers')+' in this app’s library'+(all[0]&&all[0].at?(' — newest added '+relLabel(all[0].at)):'')+'.'):'This library is empty — the first answer added below starts it.';
    var q=(($('os-lib-q')||{}).value||'').trim().toLowerCase();
    var shown=q?all.filter(function(x){ return (x.q+' '+x.a).toLowerCase().indexOf(q)>=0; }):all;
    listEl.innerHTML=shown.length?shown.map(function(x, i){ return '<div class="ph-card os-draw-in" style="--ac:#3fb8ff;margin-top:12px;animation-delay:'+Math.min(i*0.05, 0.35)+'s"><h3 style="font-size:16px">'+esc(x.q)+'</h3><p>'+esc(x.a)+'</p>'+(x.at?'<div class="os-stamp" style="margin-top:8px">'+stamp(x.at)+'</div>':'')+'</div>'; }).join(''):(all.length?'<p class="os-note" style="margin-top:12px">No answer matches that yet — try other words, or add it below.</p>':'<p class="os-note" style="margin-top:12px">No entries yet.</p>');
  }
  function saveQuestion(){
    var qEl=$('os-lib-nq'), aEl=$('os-lib-na'), st=$('os-lib-status');
    var q=(qEl.value||'').trim(), a=(aEl.value||'').trim();
    if (!q || !a){ if (st) st.textContent='A question and its answer — the library needs both.'; return; }
    if (!sb){ if (st) st.textContent='This app is offline right now — the entry was not saved.'; return; }
    sb.from('smart_notes').insert({owner_alias:PAGE_ALIAS, content:JSON.stringify({k:'qa', q:q, a:a})}).then(function(res){
      if (res.error){ if (st) st.textContent='That entry could not be saved — try once more.'; return; }
      qEl.value=''; aEl.value='';
      if (st) st.textContent='Added — it is in the library above, in this app, for every visitor.';
      osLibCache=null; loadLibrary();
    });
  }

  /* — About gains structure (wave #26) + its story lives in the page's own
       data (wave #20): facts read live; the latest 'about' row wins over
       the baked text; saving writes a row back to the page's store. — */
  function loadAbout(){
    var facts=$('os-about-facts'); if (!facts) return;
    var name=(($('pname')||{textContent:''}).textContent||'').trim();
    if (!sb){ facts.innerHTML='<p class="os-note">Connection unavailable — the facts cannot load right now.</p>'; return; }
    function rows(p){ return p.then(function(r){ return (r && r.data)||[]; }, function(){ return []; }); }
    Promise.all([fetchWall(200),
      rows(sb.from('smart_mail_threads').select('from_alias,created_at').eq('to_alias', PAGE_ALIAS).limit(30)),
      rows(sb.from('invites').select('invitee_name,created_at').eq('inviter_alias', PAGE_ALIAS).limit(200)),
      rows(sb.from('smart_notes').select('content,created_at').eq('owner_alias', PAGE_ALIAS).order('created_at',{ascending:false}).limit(300))
    ]).then(function(out){
      var names={};
      out[0].forEach(function(p){ if (p.j.a && p.j.a!=='This page') names[p.j.a.toLowerCase()]={name:p.j.a, at:p.at}; });
      out[1].forEach(function(t){ var n=humanize(t.from_alias); names[n.toLowerCase()]={name:n, at:t.created_at}; });
      out[2].forEach(function(v){ if (v.invitee_name) names[v.invitee_name.toLowerCase()]={name:v.invitee_name, at:v.created_at}; });
      var arr=Object.keys(names).map(function(k){ return names[k]; }).sort(function(a, b){ return new Date(b.at)-new Date(a.at); });
      var firstAt=out[0].length?out[0][out[0].length-1].at:null;
      facts.innerHTML='<p style="margin:0 0 6px"><b style="color:#fff">'+esc(name)+'</b> · this app</p>'
        +'<p class="os-note" style="margin:0 0 6px">'+(firstAt?('On this app since '+new Date(firstAt).toLocaleDateString('en-US',{month:'long', year:'numeric'})+' — the first post is still on the wall.'):'A new app — its story starts with the first post.')+'</p>'
        +'<p class="os-note" style="margin:0">'+arr.length+(arr.length===1?' person has':' people have')+' shown up here so far.</p>';
      var fh=$('os-about-faces');
      if (fh) fh.innerHTML=arr.length?('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">'+arr.slice(0,8).map(function(p, ix){ return avatarHTML(p.name, p.at, SPECTRUM[ix%SPECTRUM.length]); }).join('')+'</div>'):'';
      var abRows=out[3].map(function(r){ return {r:r, c:parseRow(r)}; }).filter(function(x){ return x.c.k==='about'; });
      if (abRows.length && abRows[0].c.text){ var tx=$('abouttext'); if (tx) tx.textContent=abRows[0].c.text; }
      /* the grown-up About sections (EYE-PASS CURE #8): About · Goals ·
         Mission · Vision · What I love · What I don't · My motto — each
         stored as a smart_notes row {k:'aboutsec', s:<key>, text},
         latest per section wins, exactly the Your Story discipline.
         Empty stays an honest prompt line, never fake content. */
      var parsed=out[3].map(function(r){ return parseRow(r); });
      window.__osAboutSecs=window.__osAboutSecs||{};
      ['about','goals','mission','vision','love','dont','motto'].forEach(function(key){
        var sec=parsed.filter(function(c){ return c.k==='aboutsec' && c.s===key && c.text; });
        var tp=$('os-sec-'+key+'-text'); if (!tp || !sec.length) return;
        window.__osAboutSecs[key]=sec[0].text;
        tp.textContent=sec[0].text; tp.classList.remove('os-note');
      });
    });
  }

  /* — About sections: the same Edit/Save discipline as Your Story — */
  function secEdit(key, on){
    var tp=$('os-sec-'+key+'-text'), ta=$('os-sec-'+key+'-edit');
    var be=document.querySelector('[data-os-sec-edit="'+key+'"]'), bs=document.querySelector('[data-os-sec-save="'+key+'"]');
    if (!tp || !ta) return;

    if (be) be.style.display=on?'none':'';
    if (bs) bs.style.display=on?'':'none';

  }
  function secSave(key){
    var ta=$('os-sec-'+key+'-edit'), st=$('os-sec-'+key+'-status'), tp=$('os-sec-'+key+'-text');
    var text=((ta&&ta.value)||'').trim();

      if (res && res.error){ if (st) st.innerHTML='<p class="os-note">Could not save just now — nothing was written.</p>'; return; }

      if (tp){ if (text){ tp.textContent=text; tp.classList.remove('os-note'); } else { tp.textContent='Nothing here yet — tap Edit and write the first line.'; tp.classList.add('os-note'); } }
      secEdit(key, false);
      if (st) st.innerHTML='<p class="os-note" style="color:#2fe89e">Saved — it is this app&rsquo;s own data now.</p>';
    });
  }

  /* — Smart Tabs ribbon: PROVABLY moving (Shawn's law: one-way gentle
     drift across the bottom — his phone is the operative test, not the
     presence of drift code). The unit renders the pills; this layer
     guarantees the motion: the pill set is duplicated until the track
     always overflows the viewport, then scrollLeft advances gently in
     ONE direction and wraps by exactly one set width — the content at
     the wrap point is identical, so there is no jump and never any
     ping-pong. It pauses while touched (and for a few seconds after),
     and stands down entirely when the visitor prefers reduced motion:
     fully lit, static, still scrollable by hand. Clone pills exist for
     motion only — a delegated click forwards to the real pill, so
     navigation and the ⋯ menu keep working on every copy. — */
  var osTabsDrift = (function(){
    var row=null, half=0, pos=0, poke=0, setting=false, started=false, enabled=true;
    function reduced(){ try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch(e){ return false; } }
    function originals(){ return Array.prototype.filter.call(row.children, function(el){ return !el.hasAttribute('data-os-clone'); }); }
    function markClone(c){
      c.setAttribute('data-os-clone','1');
      c.setAttribute('aria-hidden','true');
      c.setAttribute('tabindex','-1');
      var m=c.querySelector('.sn-more'); if (m) m.setAttribute('tabindex','-1');
    }
    function setup(){
      if (!row || setting || reduced() || !enabled) return;
      var orig=originals();
      if (!orig.length || row.querySelector('[data-os-clone]')) return;
      setting=true;
      row.scrollLeft=0; pos=0;
      var x0=orig[0].getBoundingClientRect().left, cloneFirst=null;
      orig.forEach(function(el){ var c=el.cloneNode(true); markClone(c); if (!cloneFirst) cloneFirst=c; row.appendChild(c); });
      var setW=cloneFirst.getBoundingClientRect().left-x0;
      if (setW<=0){ setting=false; return; }
      var sets=2;
      while ((sets-1)*setW<row.clientWidth && sets<8){
        orig.forEach(function(el){ var c=el.cloneNode(true); markClone(c); row.appendChild(c); });
        sets++;
      }
      half=setW;
      setting=false;
    }
    function tick(){
      if (!row || !half || reduced() || !enabled) return;
      if (Date.now()-poke<5000){ pos=row.scrollLeft; return; }
      pos+=0.7;
      if (pos>=half) pos-=half;
      row.scrollLeft=pos;
    }
    function cloneClick(e){
      var t=e.target;
      var pill=(t && t.closest) ? t.closest('[data-os-clone]') : null;
      if (!pill) return;
      e.preventDefault(); e.stopPropagation();
      var target=null;
      if (pill.classList.contains('add')) target=row.querySelector('.nf-smtab.add:not([data-os-clone])');
      else { var id=pill.getAttribute('data-id'); if (id) target=row.querySelector('.nf-smtab[data-id="'+id+'"]:not([data-os-clone])'); }
      if (!target) return;
      if (t.closest && t.closest('.sn-more')){ var m=target.querySelector('.sn-more'); if (m){ m.click(); return; } }
      target.click();
    }
    /* the Settings "Smart Tabs drift" control drives this switch: off
       strips the clones and stills the ribbon (hand-scroll remains);
       on rebuilds the duplicated, always-overflowing track. */
    function setEnabled(on){
      enabled=!!on;
      if (!row) return;
      if (!enabled){
        Array.prototype.slice.call(row.querySelectorAll('[data-os-clone]')).forEach(function(c){ c.parentNode.removeChild(c); });
        half=0; pos=0; row.scrollLeft=0;
      } else { setup(); }
    }
    function boot(){
      row=document.querySelector('#smarttabs .nf-tabs-row');
      if (!row) return false;
      if (started) return true;
      started=true;
      if (reduced()) return true; /* honored: fully lit, static */
      setup();
      ['pointerdown','touchstart','wheel','focusin'].forEach(function(ev){
        row.addEventListener(ev, function(){ poke=Date.now(); }, {passive:true});
      });
      row.addEventListener('click', cloneClick, true);
      new MutationObserver(function(){ if (!setting && row && !row.querySelector('[data-os-clone]')) setup(); }).observe(row, {childList:true});
      setInterval(tick, 40);
      window.osTabsDrift={active:true, setEnabled:setEnabled};
      return true;
    }
    if (!boot()){
      var tries=0, iv=setInterval(function(){ if (boot() || ++tries>24) clearInterval(iv); }, 250);
    }
    return {boot:boot, setEnabled:setEnabled};
  })();

  /* — Top Smart Tabs: THE MIRRORED DRIFT (EYE-PASS CURE, Addition A —
     Shawn 2026-10-22): the bottom ribbon glides slowly LEFT; the top
     tab bar glides slowly RIGHT. Same gentle one-way law, same speed,
     duplicated content for a seamless loop, same Settings switch and
     the same courtesy: it pauses while a hand is on it and resumes
     after. Rightward = scrollLeft decreasing from one full set in, so
     the identical second set carries the wrap invisibly. */
  window.osNavDrift=(function(){
    var row=document.getElementById('navtabs'); if (!row) return null;
    var originals=[].slice.call(row.querySelectorAll('.ph-navtab'));
    if (!originals.length) return null;
    var reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return { setEnabled:function(){} };
    var gap=parseFloat(getComputedStyle(row).gap)||10;
    var setW=0; originals.forEach(function(t){ setW+=t.getBoundingClientRect().width+gap; });
    if (!setW) return null;
    var sets=1;
    while (sets*setW < row.clientWidth + setW && sets<6){
      originals.forEach(function(t){ var c=t.cloneNode(true); c.setAttribute('data-os-clone','1'); c.setAttribute('aria-hidden','true'); c.setAttribute('tabindex','-1'); c.removeAttribute('id'); row.appendChild(c); });
      sets++;
    }
    var pos=setW, lastPoke=0, enabled=true;
    row.scrollLeft=pos;
    row.addEventListener('click', function(e){
      var c=e.target.closest?e.target.closest('.ph-navtab[data-os-clone]'):null;
      if (!c) return;
      var orig=c.hasAttribute('data-os-invite') ? row.querySelector('.ph-navtab[data-os-invite]:not([data-os-clone])') : row.querySelector('.ph-navtab[data-view="'+c.getAttribute('data-view')+'"]:not([data-os-clone])');
      if (orig) orig.click();
    });
    ['pointerdown','touchstart','wheel','focusin'].forEach(function(ev){ row.addEventListener(ev, function(){ lastPoke=Date.now(); }, {passive:true}); });
    setInterval(function(){
      if (!enabled || document.hidden) return;
      if (Date.now()-lastPoke<4000){ pos=row.scrollLeft; return; }
      pos-=0.7;
      if (pos<0) pos+=setW;
      row.scrollLeft=pos;
    }, 40);
    return { setEnabled:function(on){ enabled=!!on; if (enabled && row.scrollLeft===0){ pos=setW; row.scrollLeft=pos; } } };
  })();

  /* — BOARD IGNITION FOLLOWS THE WALK (EYE-PASS CURE, Addition B —
     Shawn 2026-10-22): every board in a view ignites at its edge in
     ITS OWN spectrum position — purple, blue, green, gold, orange,
     red, magenta by board order — never all one color (Growth's
     boards all lit red; that is what this cures). The --igc custom
     property is assigned here in DOM order per view, for cards and
     the sub-boards inside them (plug-in tiles, next-best-move rows),
     and re-applied as boards render, via a childList observer (style
     writes are attribute changes, so the observer cannot loop). */
  function osIgnite(){
    document.querySelectorAll('[data-os-view]').forEach(function(view){
      view.querySelectorAll('.ph-card, .os-src, .os-insight').forEach(function(b, i){
        var c=SPECTRUM[i%SPECTRUM.length];
        b.style.setProperty('--igc', c);
        /* the header jewel walks WITH its board (the same assignment) —
           except inside identity lists, where color means the author,
           the kind or the category, never the position. */
        if (!b.closest('#os-wall-list, #os-today-list, #os-inbox-list, #os-nn-list, #os-note-list, #os-invite-list, #os-today-faces, #os-faces, #os-born, #os-members, #os-sl-mine, #os-inv-share, #os-funnel')){
          var j=b.querySelector(':scope > h3 .os-jewel, :scope > .os-src-top .os-jewel');
          if (j) j.style.setProperty('--jc', c);
        }
      });
    });
  }
  window.osIgnite=osIgnite;
  osIgnite();
  var __igcT=null;
  if (window.MutationObserver && document.body){
    new MutationObserver(function(){ if (__igcT) return; __igcT=setTimeout(function(){ __igcT=null; osIgnite(); }, 120); }).observe(document.body, {childList:true, subtree:true});
  }

  /* — Settings: EVERY control real (item 9). Each one flips, persists on
       this device, produces its effect immediately, and says what it did
       in #os-set-status. The three page-behaviour controls are this
       layer's own (localStorage os.set.*); the legacy Preferences three
       keep their own persistence (naya.setting.*) and gain real effects:
       Dark mode already brightens (its own script); Public profile now
       genuinely closes/opens wall posting + messaging on this page;
       Notifications gates the Inbox tab's new-mail dot. — */
  var SET_DFLT={drift:true, motion:true, refresh:false};
  function getSet(key){ try { var v=localStorage.getItem('os.set.'+key); return v===null?SET_DFLT[key]:v==='on'; } catch(e){ return SET_DFLT[key]; } }
  function putSet(key, on){ try { localStorage.setItem('os.set.'+key, on?'on':'off'); } catch(e){} }
  function setStatus(msg){ var el=$('os-set-status'); if (el) el.textContent=msg; }
  function applyMotion(){ document.documentElement.classList.toggle('os-calm', !getSet('motion')); }
  var osRefreshTimer=null;
  function applyRefresh(){
    if (osRefreshTimer){ clearInterval(osRefreshTimer); osRefreshTimer=null; }
    if (getSet('refresh')){
      osRefreshTimer=setInterval(function(){
        var home=document.querySelector('[data-block="wall"].on');
        var today=document.querySelector('[data-block="today"].on');
        var inbox=document.querySelector('[data-block="inbox"].on');
        var reports=document.querySelector('[data-block="reports"].on');
        var dash=document.querySelector('[data-block="dashboard"].on');
        if (home) loadWall();
        if (today) loadToday();
        if (inbox) loadInbox();
        if (reports) loadReports();
        if (dash && window.osLoadDashboard) window.osLoadDashboard();
      }, 60000);
    }
  }
  /* Lit switches (Steer 2 §2): the track is a well, the knob glows in the
     row's own color, and a caption repeats the state — unmistakable. */
  function setSwitch(btn, on){
    if (!btn) return;
    btn.classList.toggle('on', !!on);
    btn.setAttribute('aria-checked', on?'true':'false');
    var cap=btn.parentElement?btn.parentElement.querySelector('.os-switch-cap'):null;
    if (cap) cap.textContent=on?'On':'Off';
  }
  function bindSwitch(id, on, apply){
    var b=$(id); if (!b) return;
    setSwitch(b, on);
    b.addEventListener('click', function(){ var now=!b.classList.contains('on'); setSwitch(b, now); apply(now); });
  }
  function legacySetting(label){ try { return localStorage.getItem('naya.setting.'+label); } catch(e){ return null; } }
  function putLegacySetting(label, on){ try { localStorage.setItem('naya.setting.'+label, on?'on':'off'); } catch(e){} }
  var PRIVATE_NOTE='This app is set to private — posting and messaging are closed here. Turn Public profile back on in Settings to reopen them.';
  var MSG_REST='Your message goes to the owner’s Smart Mail inbox in this app.';
  function publicOn(){ return legacySetting('🔒 Public profile')!=='off'; }
  function applyPrivacy(){
    var off=!publicOn();
    /* the switch shows the EFFECTIVE state from first paint: the markup
       default is the effective default (on), and this sync runs at boot
       before the page is used — the privacy promise never flashes wrong */
    setSwitch($('publictoggle'), !off);
    ['os-post-author','os-post-body','os-post-btn','os-msg-name','os-msg-subject','os-msg-body','os-msg-btn'].forEach(function(id){ var el=$(id); if (el) el.disabled=off; });
    var ps=$('os-post-status'), ms=$('os-msg-status');
    if (off){ if (ps) ps.textContent=PRIVATE_NOTE; if (ms) ms.textContent=PRIVATE_NOTE; }
    else {
      if (ps && ps.textContent===PRIVATE_NOTE) ps.textContent='';
      if (ms && ms.textContent===PRIVATE_NOTE) ms.textContent=MSG_REST;
    }
  }

  /* — Boot — */
  loadProfile();
  loadWall();
  renderInstallState();
  bindSwitch('os-set-drift', getSet('drift'), function(on){ putSet('drift', on); if (window.osTabsDrift && osTabsDrift.setEnabled) osTabsDrift.setEnabled(on); if (window.osNavDrift && osNavDrift.setEnabled) osNavDrift.setEnabled(on); setStatus('Smart Tabs drift is '+(on?'on — the bottom ribbon glides left, the top bar glides right, each on its own.':'off — the tab bars sit still; they still scroll by hand.')+' Saved on this device.'); });
  bindSwitch('os-set-motion', getSet('motion'), function(on){ putSet('motion', on); applyMotion(); setStatus('Motion & glow is '+(on?'on — blocks rise in, dots breathe, cards ignite on touch.':'off — the page is stilled: no entrances, no breathing, no pulse.')+' Saved on this device.'); });
  bindSwitch('os-set-refresh', getSet('refresh'), function(on){ putSet('refresh', on); applyRefresh(); setStatus('Auto-refresh is '+(on?'on — whichever board is open (Home, Today, Inbox, Reports or Dashboard) is quietly re-read every minute.':'off — boards refresh when you open them.')+' Saved on this device.'); });
  bindSwitch('os-set-dark', legacySetting('🌙 Dark mode')!=='off', function(on){ putLegacySetting('🌙 Dark mode', on); document.body.style.filter=on?'':'brightness(1.2)'; setStatus('Deep black is '+(on?'on — the page keeps its deep-night look.':'off — the page renders brighter.')+' Saved on this device.'); });
  if (legacySetting('🌙 Dark mode')==='off') document.body.style.filter='brightness(1.2)';
  bindSwitch('os-set-notif', legacySetting('🔔 Notifications')!=='off', function(on){ putLegacySetting('🔔 Notifications', on); refreshInboxBadge(); setStatus('Notifications are '+(on?'on — a glowing dot appears on the Inbox tab when new mail lands.':'off — no dot on the Inbox tab; your mail still arrives, quietly.')+' Saved on this device.'); });
  bindSwitch('publictoggle', publicOn(), function(on){ putLegacySetting('🔒 Public profile', on); applyPrivacy(); setStatus('Public profile is '+(on?'on — visitors can post on the wall and send messages again.':'off — this app is private here: wall posting and messaging are closed until you turn it back on.')+' Saved on this device.'); });
  applyMotion(); applyRefresh(); applyPrivacy();
  if (!getSet('drift') && window.osTabsDrift) osTabsDrift.setEnabled(false);
  if (!getSet('drift') && window.osNavDrift) osNavDrift.setEnabled(false);
  /* the cured blocks' own controls: capture, list add, library, about save */
  (function(){
    var capBtn=$('os-note-capture-btn'), capIn=$('os-note-capture');
    function doCapture(){
      var st=$('os-note-capture-status'); var text=(capIn.value||'').trim();
      if (!text){ if (st) st.textContent='Write the thought first — then Note it.'; capIn.focus(); return; }
      if (!sb){ if (st) st.textContent='This app is offline right now — the note was not saved.'; return; }
      capBtn.disabled=true;
      var t=text.length>60?text.slice(0, 60).trim()+'…':text;
      sb.from('smart_notes').insert({owner_alias:PAGE_ALIAS, content:JSON.stringify({k:'note', t:t, b:text})}).then(function(res){
        capBtn.disabled=false;
        if (res.error){ if (st) st.textContent='The note could not be saved — try once more.'; return; }
        capIn.value='';
        if (st) st.textContent='Captured — it is a card below, in this app, with the time it landed.';
        loadNotes();
      });
    }
    if (capBtn && capIn){ capBtn.addEventListener('click', doCapture); capIn.addEventListener('keydown', function(e){ if (e.key==='Enter') doCapture(); }); }
    var addBtn=$('os-list-add'), addIn=$('os-list-input');
    if (addBtn && addIn){ addBtn.addEventListener('click', slDoAdd); addIn.addEventListener('keydown', function(e){ if (e.key==='Enter') slDoAdd(); }); }
    var slNewBtn=$('os-sl-newcreate'), slNewIn=$('os-sl-newname');
    function slDoCreate(){ var v=(slNewIn.value||'').trim(); if (!v){ slNewIn.focus(); return; } slCreateList(v, function(){ slNewIn.value=''; var nr=$('os-sl-newrow'); if (nr) nr.style.display='none'; }); }
    if (slNewBtn && slNewIn){ slNewBtn.addEventListener('click', slDoCreate); slNewIn.addEventListener('keydown', function(e){ if (e.key==='Enter') slDoCreate(); }); }
    document.addEventListener('os-connect-request', function(){
      if (!sb){ document.dispatchEvent(new CustomEvent('os-connect-failed')); return; }
      sb.from('smart_notes').insert({owner_alias:PAGE_ALIAS, content:JSON.stringify({k:'connect', a:'A visitor'})}).then(function(res){
        if (res.error){ document.dispatchEvent(new CustomEvent('os-connect-failed')); return; }
        try { localStorage.setItem('os.connected', '1'); } catch(e){}
        document.dispatchEvent(new CustomEvent('os-connect-done'));
      }, function(){ document.dispatchEvent(new CustomEvent('os-connect-failed')); });
    });
    var libBtn=$('os-lib-add'); if (libBtn) libBtn.addEventListener('click', saveQuestion);
    var libQ=$('os-lib-q'); if (libQ) libQ.addEventListener('input', renderLibrary);
    var saveBtn=$('saveabout');
    if (saveBtn) saveBtn.addEventListener('click', function(){
      var tx=$('abouttext'), st=$('os-about-status');
      if (!tx || !sb) return;
      sb.from('smart_notes').insert({owner_alias:PAGE_ALIAS, content:JSON.stringify({k:'about', text:tx.textContent.trim()})}).then(function(res){
        if (st) st.textContent=res.error?'Saved on this device — the page copy will be written when the connection is back.':'Saved — this story now lives in the page’s own data, not just this device.';
      }, function(){});
    });
  })();
  /* Back (wave #6): seed history with the view this page opened on, so the
     phone/browser Back button walks the app's own views and never exits. */
  (function(){
    var onTab=document.querySelector('.ph-navtab.on');
    var bootView=onTab?onTab.getAttribute('data-view'):'home';
    if (VIEWS.indexOf(bootView)<0) bootView='home';
    var hash=(location.hash||'').replace('#','');
    try { history.replaceState({osView:bootView}, '', location.pathname+location.search); } catch(e){}
    if (VIEWS.indexOf(hash)>=0 && hash!==bootView) showView(hash, true);
  })();
  /* the timestamp standard is alive: relative labels recompute in place */
  setInterval(function(){ document.querySelectorAll('.os-rel[data-at]').forEach(function(n){ n.textContent=relLabel(n.getAttribute('data-at')); }); }, 30000);
  if (window.osAnnounce) { window.osAnnounce('Welcome — this app is live. Post on the wall or send a message; everything here is real and saved.').then(function(){ loadWall(); }); }
})();
</script>
