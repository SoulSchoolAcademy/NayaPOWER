  /* — HEAT & STREAKS (step 6): the shape of the last fourteen days and

  function dayCounts(times, n){

  var slPrevNums = {};

    (rows || []).forEach(function(r){
      var b = byKey[r.day]; if (!b) return;
      b.n += Number(r.clicks || 0); b.j += Number(r.joins || 0);
    });
    out.forEach(function(b){ b.note += ': ' + b.n + (b.n === 1 ? ' click' : ' clicks') + (b.j ? ', ' + b.j + (b.j === 1 ? ' join' : ' joins') : '') + '.'; });
    return out;
  }
  function slGraphHTML(buckets, c){
    var max = 1; buckets.forEach(function(b){ if (b.n > max) max = b.n; });
    var total = 0; buckets.forEach(function(b){ total += b.n; });
    var bars = buckets.map(function(b, i){
      var h = b.n ? Math.max(12, Math.round(b.n / max * 100)) : 3;
      return '<div class="bar' + (b.today ? ' today' : '') + '" style="height:' + h + '%;--barc:' + (b.n ? c : '#3a3a46') + ';--i:' + i + '" data-note="' + esc(b.note) + '">' + (b.n ? '<span class="os-bar-pill">' + b.n + '</span>' : '') + '</div>';
    }).join('');
    var days = buckets.map(function(b){ return '<span class="' + (b.today ? 'today' : '') + '">' + esc(b.lab) + '</span>'; }).join('');
    var bi = 0; buckets.forEach(function(b, k){ if (b.n > buckets[bi].n) bi = k; });
    var note = total ? ('Busiest: ' + buckets[bi].note + ' Tap a bar to read its day.') : 'No clicks yet — this graph wakes with the first click.';
    return '<div class="os-sl-graph os-spark-wrap"><div class="os-week">' + bars + '</div><div class="os-sl-graph-days">' + days + '</div><p class="os-sl-graph-note">' + esc(note) + '</p></div>';
  }
  function renderLinks(links, stats, linksErr, dims){
    var head=$('os-dash-links-head'), box=$('os-dash-links'); if (!box) return;
    if (linksErr){
      if (head) head.textContent='Your links couldn’t be read — tap to retry.';
      box.innerHTML='<div class="ph-actions"><button class="ph-msg" type="button" data-dash-retry-links="1">Retry</button></div>';
      return;
    }
    var byId={}, byDay={};
    (stats||[]).forEach(function(s){
      var a=byId[s.link_id]=byId[s.link_id]||{clicks:0, joins:0}; a.clicks+=Number(s.clicks||0); a.joins+=Number(s.joins||0);
      (byDay[s.link_id]=byDay[s.link_id]||[]).push(s);
    });
    var rows=(links||[]).map(function(l){ var a=byId[l.id]||{clicks:0, joins:0}; return {id:l.id, name:l.name, url:l.target_url, clicks:a.clicks, joins:a.joins}; });
    rows.sort(function(a, b){ return (b.clicks-a.clicks)||(b.joins-a.joins)||(a.name<b.name?-1:1); });
    var tc=0, tj=0; rows.forEach(function(r){ tc+=r.clicks; tj+=r.joins; });
    if (head) head.textContent=!rows.length?'No Smart Links yet — claim a name and every click through it starts counting here.'
      :(rows.length+(rows.length===1?' link':' links')+' out in the world — '+tc+(tc===1?' click':' clicks')+' counted, '+tj+(tj===1?' join':' joins')+' attributed.');
    if (!rows.length){ box.innerHTML=''; return; }
    box.innerHTML=rows.map(function(r, ix){
      var c=SPECTRUM[ix%SPECTRUM.length];
      var host=r.url; try { host=new URL(r.url).hostname; } catch(e){}
      var dim=dimFor(r, dims);
      return '<div class="os-link-row os-litobj" style="--ac:'+c+'"><div class="os-link-main"><span class="os-link-name">nayanet.live/'+esc(r.name)+'</span><span class="os-link-host">'+esc(host)+'</span></div><span class="os-link-nums"><span class="os-link-num"><b data-sl-num="'+esc(r.name)+':clicks">0</b><i>clicks</i></span><span class="os-link-num"><b data-sl-num="'+esc(r.name)+':joins">0</b><i>joins</i></span></span><button class="ph-msg" type="button" data-sl-copy="'+esc(r.name)+'">Copy the link</button><button class="ph-msg" type="button" data-sl-open="'+esc(r.name)+'">Open it</button>'+(dim?'<button class="ph-msg" type="button" data-sl-dim="'+esc(r.name)+'">Breakdown</button>':'')+slGraphHTML(slDayBuckets(byDay[r.id]), c)+'</div>'+dimPanel(r, dim);
    }).join('')+(tc>0?'<p class="os-note">Clicked &rarr; Joined: '+tc+(tc===1?' click':' clicks')+' became '+tj+(tj===1?' join':' joins')+(tj?(' — '+Math.round(tj/tc*100)+'% of clicks joined.'):' — the first join is the milestone ahead.')+'</p>':'<p class="os-note">No clicks yet — share a link and the first click lands here.</p>');
    rows.forEach(function(r){
      ['clicks', 'joins'].forEach(function(k){
        var el=box.querySelector('[data-sl-num="'+r.name+':'+k+'"]');
        var key=r.name+':'+k;
        slCountTo(el, slPrevNums[key]||0, r[k]);
        slPrevNums[key]=r[k];
      });
    });
    box.querySelectorAll('.os-sl-graph .bar').forEach(function(bar){
      bar.addEventListener('click', function(){
        var g=bar.closest('.os-sl-graph'); var n=g?g.querySelector('.os-sl-graph-note'):null;
        if (n) n.textContent=bar.getAttribute('data-note');
      });
    });
    flashChange('dash-links', box, tc+'/'+tj);
  }
  /* — the board stays alive while the Dashboard is open: every
     30 seconds the links trio is quietly re-read and the board
     re-renders — the numbers move, the graphs grow, nothing else
     on the page reloads. Same selector the quiet-refresh uses. — */
  function loadLinksOnly(){
    if (!sb) return;
    var linkErr={v:false};
    var linkP=sb.from('smart_links').select('id,name,target_url,created_at').eq('owner_alias', PAGE_ALIAS).eq('active', true).order('created_at',{ascending:true}).limit(100).then(function(r){ if (r.error) linkErr.v=true; return (r&&r.data)||[]; }, function(){ linkErr.v=true; return []; });
    var statsP=rowsOf(sb.from('smart_link_daily_stats').select('link_id,day,clicks,joins').eq('owner_alias', PAGE_ALIAS).limit(1000));
    var dimsP=rowsOf(sb.from('smart_link_dimension_stats').select('link_id,name,day,referrer_class,user_agent_class,country,clicks').eq('owner_alias', PAGE_ALIAS).limit(1000));
    Promise.all([linkP, statsP, dimsP]).then(function(out){ renderLinks(out[0], out[1], linkErr.v, out[2]); });
  }
  setInterval(function(){
    if (document.hidden) return;
    if (!document.querySelector('[data-block="dashboard"].on')) return;
    loadLinksOnly();
  }, 30000);
  function loadDashboard(){
    var front=$('os-dash'); if (!front) return;
    if (!sb){
      var n=$('os-dash-n-posts-note'); if (n) n.textContent='Connection unavailable — this front reads live data only, so it shows nothing rather than something invented.';
      var lh=$('os-dash-links-head'); if (lh) lh.textContent='Connection unavailable — Smart Links read live data only.';
      return;
    }
    var wallP=(window.osNotesRows ? window.osNotesRows() : rowsOf(sb.from('smart_notes').select('id,content,created_at').eq('owner_alias', PAGE_ALIAS).order('created_at',{ascending:false}).limit(500)));
    var thrP=rowsOf(sb.from('smart_mail_threads').select('id,subject,from_alias,preview,created_at').eq('to_alias', PAGE_ALIAS).order('created_at',{ascending:false}).limit(30));
    var invP=rowsOf(sb.from('invites').select('invitee_name,status,dry_run,created_at').eq('inviter_alias', PAGE_ALIAS).order('created_at',{ascending:false}).limit(200));
    var linkErr={v:false};
    var linkP=sb.from('smart_links').select('id,name,target_url,created_at').eq('owner_alias', PAGE_ALIAS).eq('active', true).order('created_at',{ascending:true}).limit(100).then(function(r){ if (r.error) linkErr.v=true; return (r&&r.data)||[]; }, function(){ linkErr.v=true; return []; });
    var statsP=rowsOf(sb.from('smart_link_daily_stats').select('link_id,day,clicks,joins').eq('owner_alias', PAGE_ALIAS).limit(1000));
    var dimsP=rowsOf(sb.from('smart_link_dimension_stats').select('link_id,name,day,referrer_class,user_agent_class,country,clicks').eq('owner_alias', PAGE_ALIAS).limit(1000));
    Promise.all([wallP, thrP, invP, linkP, statsP, dimsP]).then(function(out){
      /* the loader KEEPS the note rows now (step 4): one fetch of this
         app's smart_notes carries wall posts (the Posts series), notes
         (the Notes series) and save records (the best-content rule) —
         the old k==='wall' filter threw two of the three away. */
      var allNoteRows=out[0].map(function(r){ return {id:r.id, j:parseRow(r), at:r.created_at}; });
      var wallRows=allNoteRows.filter(function(x){ return x.j.k==='wall'; });
      var noteRows=allNoteRows.filter(function(x){ return x.j.k==='note'; });
      var saveRows=allNoteRows.filter(function(x){ return x.j.k==='save'; });
      var threads=out[1], invRows=out[2];
      var ids=threads.map(function(t){ return t.id; });
      var msgP=ids.length?rowsOf(sb.from('smart_mail_messages').select('thread_id,from_alias,body,created_at').in('thread_id', ids).order('created_at',{ascending:true})):Promise.resolve([]);
      msgP.then(function(msgs){
        var byThread={};
        msgs.forEach(function(m){ (byThread[m.thread_id]=byThread[m.thread_id]||[]).push(m); });
        /* TRUTH PASS (step 5): "messages received" counts real rows in
           smart_mail_messages, never threads. Direction follows the
           timeline read model's rule exactly: a message whose
           from_alias is the thread's to_alias (this app) was SENT by
           the owner; every other message in the thread was received. */
        var received=msgs.filter(function(m){ return m.from_alias!==PAGE_ALIAS; });
        var msgTimes=received.map(function(m){ return m.created_at; }).sort(function(x, y){ return new Date(y)-new Date(x); });
        /* waiting-for-reply (step 5): a thread waits when its latest
           message is inbound — the same rule the timeline model's
           acceptance query (c) proves. Oldest first. */
        var waiting=[];
        threads.forEach(function(t){
          var ms=byThread[t.id]||[];
          if (!ms.length) return;
          var latest=ms[ms.length-1];
          if (latest.from_alias!==PAGE_ALIAS) waiting.push({name:humanize(t.from_alias), subject:t.subject, at:latest.created_at, threadId:t.id});
        });
        waiting.sort(function(x, y){ return new Date(x.at)-new Date(y.at); });
        /* best content by saves (step 6): save rows carry {ref} = the
           saved note's row id; the most-saved note on this app's own
           store is the fact. No saves → no claim (bestSave stays null). */
        var saveCounts={};
        saveRows.forEach(function(r){ if (r.j.ref) saveCounts[r.j.ref]=(saveCounts[r.j.ref]||0)+1; });
        var bestSave=null;
        noteRows.forEach(function(r){ var n=saveCounts[r.id]||0; if (n>0 && (!bestSave || n>bestSave.n)) bestSave={title:r.j.t||'Untitled note', n:n}; });
        /* people, derived exactly as the Faces Board derives them */
        var faces={};
        function add(name, fact, at){
          if (!name || !at) return;
          var k=String(name).toLowerCase();
          if (!faces[k]) faces[k]={name:name, fact:fact, at:at};
          else if (new Date(at)>new Date(faces[k].at)) { faces[k].at=at; faces[k].fact=fact; }
        }
        var postCounts={};
        wallRows.forEach(function(p){ var a=p.j.a||'Guest'; postCounts[a.toLowerCase()]=(postCounts[a.toLowerCase()]||0)+1; });
        wallRows.forEach(function(p){ var a=p.j.a||'Guest'; var n=postCounts[a.toLowerCase()]; add(a, n+(n===1?' wall post':' wall posts'), p.at); });
        threads.forEach(function(t){ add(humanize(t.from_alias), 'Sent a message', t.created_at); });
        invRows.forEach(function(v){ add(v.invitee_name, 'Invited', v.created_at); });
        var peopleList=Object.keys(faces).map(function(k){ return faces[k]; });
        peopleList.sort(function(a,b){ return new Date(b.at)-new Date(a.at); });
        /* "people around you" EXCLUDES the owner (one definition on every
           surface — Phi re-audit §4): peopleList keeps every face for the
           boards (the owner's tile renders, badged "You"); peopleAround is
           the set every people numeral + sentence on this front speaks. */
        var peopleAround=peopleList.filter(function(f){ return String(f.name).toLowerCase()!=='this page'; });
        function isStatus(r, set){ return set.indexOf(String(r.status||'').toLowerCase())>=0; }
        var postTimes=wallRows.map(function(p){ return p.at; });
        var noteTimes=noteRows.map(function(p){ return p.at; });
        var invTimes=invRows.map(function(v){ return v.created_at; });
        var d={
          posts:wallRows,
          postTimes:postTimes,
          noteTimes:noteTimes,
          msgTimes:msgTimes,
          invTimes:invTimes,
          allTimes:postTimes.concat(noteTimes, msgTimes, invTimes),
          invRows:invRows,
          threads:threads,
          msgsByThread:byThread,
          waiting:waiting,
          waitingCount:waiting.length,
          bestSave:bestSave,
          peopleList:peopleList,
          peopleAround:peopleAround,
          opened:invRows.filter(function(r){ return isStatus(r, ['opened','clicked','viewed']); }).length,
          joined:invRows.filter(function(r){ return isStatus(r, ['joined','accepted','converted','member']); }).length,
          allDry:invRows.length>0 && invRows.every(function(r){ return !!r.dry_run; })
        };
        renderPulse(d);
        renderSparks(d);
        renderWeekFront(d);
        renderFunnelFront(invRows, out[4]);
        renderDonutFront(d.postTimes.length, d.msgTimes.length, d.invTimes.length);
        renderFacesFront(d);
        renderInsights(d);
        renderConvos(d);
        renderHeat(d);
        renderLinks(out[3], out[4], linkErr.v, out[5]);
        renderPluginsNative(d);
        dashCache=d;
        if (!loadDashboard._wired){ loadDashboard._wired=true; wirePeriod('dash', function(pd){ dashPeriod=pd; if (dashCache) renderWeekFront(dashCache); }); wireKind('dash', function(k){ dashKind=k; if (dashCache) renderWeekFront(dashCache); }); }
      });
    });
  }
  window.osLoadDashboard = loadDashboard;

  /* plug-in invitation cards: the "how it works" note is a real toggle —
     the card promises a shape and explains it; it never fakes a connect. */
  /* the Smart Links board's retry door: a failed read is named, never
     dressed as an empty board — tapping re-runs the whole loader. */
  document.addEventListener('click', function(e){
    var rl=e.target && e.target.closest ? e.target.closest('[data-dash-retry-links]') : null;
    if (rl) loadDashboard();
  });

  /* the breakdown toggle: the panel rides directly under its row */
  document.addEventListener('click', function(e){
    var b=e.target && e.target.closest ? e.target.closest('[data-sl-dim]') : null;
    if (!b) return;
    var row=b.closest('.os-link-row'); var p=row?row.nextElementSibling:null;
    if (!p || !p.classList.contains('os-link-dim')) return;
    var open=p.hasAttribute('hidden');
    if (open) p.removeAttribute('hidden'); else p.setAttribute('hidden','');
    b.textContent=open?'Hide breakdown':'Breakdown';
  });

  document.querySelectorAll('[data-dash-how]').forEach(function(b){
    b.addEventListener('click', function(){
      var p=$('os-dash-how-'+b.getAttribute('data-dash-how'));
      if (!p) return;
      var open=p.hasAttribute('hidden');
      if (open) p.removeAttribute('hidden'); else p.setAttribute('hidden','');
      b.textContent=open?'Hide how it works':'How connecting works';
    });
  });

  /* sparklines: living lines — area fill, glowing stroke, breathing
     head dot — from the same real per-day buckets as the Trend Panel */
  function renderSparks(d){
    renderSpark('os-dash-spark-posts', d.postTimes);
    renderSpark('os-dash-spark-messages', d.msgTimes);
    renderSpark('os-dash-spark-invites', d.invTimes);
    renderSpark('os-dash-spark-people', d.peopleList.map(function(f){ return f.at; }));
  }

  /* HELP-SHAPE-IT (v3 harvest): a REAL door — feedback lands as a thread
     in this page's own Smart Mail, through the same tables the Message
     block writes. No dead buttons. */
  var fbBtn=$('os-dash-fb-btn');
  if (fbBtn) fbBtn.addEventListener('click', function(){
    var inp=$('os-dash-fb-body'), st=$('os-dash-fb-status');
    var body=inp?inp.value.trim():'';
    if (!body){ if (st) st.textContent='Write one line first.'; return; }
    if (!sb){ if (st) st.textContent='Connection unavailable — feedback not sent.'; return; }
    if (st) st.textContent='Sending…';
    sb.from('smart_mail_threads').insert({subject:'Feedback — help shape this app', from_alias:'dashboard-feedback', to_alias:PAGE_ALIAS, preview:body.slice(0, 120)}).select().single().then(function(res){
      if (res.error){ if (st) st.textContent='Send failed: '+res.error.message; return; }
      sb.from('smart_mail_messages').insert({thread_id:res.data.id, from_alias:'dashboard-feedback', body:body}).then(function(r2){
        if (r2.error){ if (st) st.textContent='Send failed: '+r2.error.message; return; }
        inp.value=''; if (st) st.textContent='Sent — it is in this app’s Smart Mail inbox, for the person who runs this app. Thank you.';
      });
    });
  });

  /* the app router calls osLoadDashboard when the Dashboard view opens
     (showView hook in the page engine); boot also loads once, so the
     front is already alive the moment the button is tapped. */
  loadDashboard();
})();
</script>
