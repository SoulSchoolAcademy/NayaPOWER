<script>
(function(){
'use strict';
if(window.__MAXESS_RESULT_CONSUMER_V2__)return;
window.__MAXESS_RESULT_CONSUMER_V2__=true;
var CONTRACT='MAXESS_RESULT_V1',READY='MAXESS_RESULT_READY',UPDATED='maxess:result-updated',lastSig='';
function valid(r){
  if(!r||typeof r!=='object'||r.contractVersion!==CONTRACT)return false;
  var score=Number(r.overallScore);
  if(!Number.isFinite(score)||score<0||score>100)return false;
  if(!Array.isArray(r.dimensions)||r.dimensions.length!==5)return false;
  if(!Array.isArray(r.responses)||r.responses.length!==15)return false;
  for(var i=0;i<5;i++){
    var d=r.dimensions[i];
    if(!d||typeof d.name!=='string'||!d.name.trim())return false;
    var ds=Number(d.score);
    if(!Number.isFinite(ds)||ds<0||ds>100)return false;
  }
  return true;
}
function sig(r){
  var a=[r.contractVersion,Number(r.overallScore),r.masteryBand||''];
  for(var i=0;i<r.dimensions.length;i++)a.push(String(r.dimensions[i].name)+':'+Number(r.dimensions[i].score));
  a.push(r.responses.length);
  return a.join('::');
}
function hydrateE01(r){
  var score=Number(r.overallScore);
  var nodes=document.querySelectorAll('#e01 #score-number,#maxess-e01-v2 #score-number,#maxess-e01-v3 #score-number');
  for(var i=0;i<nodes.length;i++){
    nodes[i].textContent=String(Math.round(score*10)/10).replace(/\.0$/,'');
    nodes[i].setAttribute('data-hydrated','true');
    nodes[i].setAttribute('data-demo','false');
  }
}
function hydrateE02(r){
  var roots=document.querySelectorAll('#maxess-e02-v2,#maxess-e02-v3,#e02');
  for(var x=0;x<roots.length;x++){
    var names=roots[x].querySelectorAll('.e02-name'),scores=roots[x].querySelectorAll('.e02-score');
    for(var i=0;i<5;i++){
      var d=r.dimensions[i],score=Number(d.score);
      if(names[i])names[i].textContent=String(d.name).toUpperCase();
      if(scores[i]){
        scores[i].textContent=String(Math.round(score*10)/10).replace(/\.0$/,'');
        scores[i].setAttribute('data-score',String(score));
        scores[i].setAttribute('data-demo','false');
      }
    }
  }
}
function hydrate(r){try{hydrateE01(r)}catch(_){}try{hydrateE02(r)}catch(_){}
}
function accept(r){
  if(!valid(r))return false;
  var s=sig(r);
  window.MAXESS_RESULT=r;
  hydrate(r);
  if(s!==lastSig)lastSig=s;
  return true;
}
function onResultEvent(event){accept(event&&event.detail)}
window.MAXESS_RESULT_CONSUMER_V1={
  consume:function(r){return accept(r)},
  get:function(){return window.MAXESS_RESULT||null},
  contractVersion:CONTRACT,
  version:'V2',
  authority:'E00'
};
window.MAXESS_RESULT_CONSUMER_V2=window.MAXESS_RESULT_CONSUMER_V1;
window.addEventListener(READY,onResultEvent);
window.addEventListener(UPDATED,onResultEvent);
if(window.MAXESS_RESULT)accept(window.MAXESS_RESULT);
})();
</script>
