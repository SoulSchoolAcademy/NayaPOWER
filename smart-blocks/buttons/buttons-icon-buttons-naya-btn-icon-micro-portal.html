<!-- Icon buttons .naya-btn.icon / .micro / .portal | buttons-icon-buttons-naya-btn-icon-micro-portal | tier: canonical -->
<!-- needs: buttons/buttons.css + tokens.css + base.css | icons: use #i-name from icons.svg -->
<button class="naya-btn icon" aria-label="Search"><svg class="icon"><use href="#i-search"/></svg></button>
      <button class="naya-btn icon" aria-label="Play" style="--tone:var(--emerald);--rgb:var(--emerald-rgb)"><svg class="icon"><use href="#i-play"/></svg></button>
      <button class="naya-btn icon micro" aria-label="Add"><svg class="icon"><use href="#i-plus"/></svg></button>
      <button class="naya-btn icon micro" aria-label="Notify" style="--tone:var(--gold);--rgb:var(--gold-rgb)"><svg class="icon"><use href="#i-bell"/></svg></button>
      <button class="naya-btn icon portal" aria-label="Enter"><svg class="icon"><use href="#i-door"/></svg></button>
