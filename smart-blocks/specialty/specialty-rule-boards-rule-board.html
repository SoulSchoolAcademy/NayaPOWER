<!-- Rule boards .rule-board | specialty-rule-boards-rule-board | tier: canonical -->
<!-- needs: specialty/specialty.css + tokens.css + base.css | icons: use #i-name from icons.svg -->
<div class="rule-boards">
      <div class="rule-board" style="--rc:var(--magenta)">
        <span class="rule-n">01 · Magenta</span>
        <p class="rule-do"><b>✓</b><span>Black ground, white light, purple soul</span></p>
        <p class="rule-dont"><b>✕</b><span>Flat elements — no elevation, no depth, no good</span></p>
      </div>
      <div class="rule-board" style="--rc:var(--emerald)">
        <span class="rule-n">02 · Emerald</span>
        <p class="rule-do"><b>✓</b><span>One accent per board, in law order</span></p>
        <p class="rule-dont"><b>✕</b><span>Color on chrome at rest — never</span></p>
      </div>
    </div>
