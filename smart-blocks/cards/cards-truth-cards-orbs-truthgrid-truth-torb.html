<!-- Truth cards + orbs .truthgrid / .truth / .torb | cards-truth-cards-orbs-truthgrid-truth-torb | tier: canonical -->
<!-- needs: cards/cards.css + tokens.css + base.css | icons: use #i-name from icons.svg -->
<div class="truthgrid">
      <div class="truth" style="--tc2:var(--verified)"><span class="torb" style="--tc2:var(--verified)">✓</span><b>Auth verified</b><p>Proven against a live source, receipt attached.</p></div>
      <div class="truth" style="--tc2:var(--claim)"><span class="torb" style="--tc2:var(--claim)">?</span><b>Claim</b><p>Our honest best guess — labeled as such, never inflated.</p></div>
      <div class="truth" style="--tc2:var(--demo)"><span class="torb" style="--tc2:var(--demo)">◈</span><b>Demo</b><p>A specimen to feel the shape of it — not real data.</p></div>
    </div>
