<!DOCTYPE html>
<html lang="en">
<head>

<title>Smart Spaces — NayaNET</title>
<style>

/* NAYA NAV — exact Reports pattern */

/* NAYA NAV v1 + bottom ecosystem bar (shared chrome, mobile-first 2026-10-03) */
/* ═══════════════════════════════════════════════════════════════
   NAYA NAV v1 — standalone room navigation (2026-10-03).
   Sticky topbar: left + → rooms drawer, right + → NayaNET drawer,
   centered brand → Hub. Identical in every room. No dependencies.
   VISUAL LAW: rest = silver-white luminous; hover = ignite identity color.
   ═══════════════════════════════════════════════════════════════ */
.naya-topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;background:linear-gradient(180deg,rgba(11,10,16,.96),rgba(11,10,16,.80));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.naya-corner-btn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid rgba(232,234,242,.42);background:linear-gradient(145deg,rgba(26,20,36,.9),rgba(11,10,16,.9));color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 0 16px -6px rgba(255,255,255,.45),0 8px 20px rgba(0,0,0,.6);transition:border-color .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
.naya-corner-btn:hover{border-color:#7c3aed;box-shadow:0 0 20px -2px #7c3aed,0 0 6px #7c3aed,0 8px 20px rgba(0,0,0,.6)}
.naya-corner-btn:active{border-color:#7c3aed;box-shadow:0 0 20px -2px #7c3aed,0 0 6px #7c3aed,0 8px 20px rgba(0,0,0,.6);transform:scale(.94)}
.naya-corner-btn svg{width:20px;height:20px}
.naya-corner-btn[aria-expanded="true"]{border-color:#0d9e6f;box-shadow:0 0 18px rgba(85,227,154,.35)}
.naya-brand{margin:0 auto;background:none;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;gap:11px;padding:6px 8px;font-family:inherit;-webkit-tap-highlight-color:transparent}
.naya-brand:hover .naya-brand-text b{color:#d9d4ff}
.naya-brand:active .naya-brand-text b{color:#d9d4ff}
.naya-brand:active{transform:scale(.97)}
.naya-brand-img{width:46px;height:46px;border-radius:12px;flex:none;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 26px rgba(216,108,255,.27)}
.naya-brand-text b{display:block;font-size:13px;letter-spacing:.14em;text-align:left;font-weight:700}
.naya-brand-text small{display:block;color:#8a8a96;font-size:10px;letter-spacing:.22em;text-align:left}
.naya-drawer{position:fixed;top:0;bottom:0;z-index:70;width:300px;max-width:84vw;display:flex;flex-direction:column;gap:6px;padding:calc(22px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));background:linear-gradient(180deg,rgba(13,12,18,.97),rgba(7,7,11,.97));border-right:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow-y:auto;overscroll-behavior:contain;transition:transform .25s ease}
.naya-drawer-left{left:0;transform:translateX(-102%);box-shadow:30px 0 60px rgba(0,0,0,.8)}
.naya-drawer-right{right:0;transform:translateX(102%);box-shadow:-30px 0 60px rgba(0,0,0,.8);border-right:none;border-left:1px solid rgba(255,255,255,.08)}
body[data-naya-drawer="left"] .naya-drawer-left{transform:none;}
body[data-naya-drawer="right"] .naya-drawer-right{transform:none;}
body[data-naya-drawer="left"] 
body[data-naya-drawer="right"] 
.naya-drawer-kicker{font-size:11px;letter-spacing:.28em;color:#8a8a96;padding:0 10px 10px;margin:0}
/* ——— Drawer buttons: silver-luminous at rest, ignite identity color on hover ——— */
.naya-drawer-btn{--nc:#7c3aed;position:relative;min-height:48px;border:1px solid rgba(232,234,242,.30);border-radius:12px;background:rgba(255,255,255,.03);padding:0 12px;display:flex;align-items:center;gap:12px;color:#e8eaf2;font-size:16px;text-align:left;cursor:pointer;text-decoration:none;width:100%;font-family:inherit;box-shadow:0 0 14px -6px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.08);transition:border-color .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease,transform .1s ease;-webkit-tap-highlight-color:transparent}
.naya-drawer-btn:hover{border-color:var(--nc);background:rgba(255,255,255,.05);color:#fff;box-shadow:0 0 20px -2px var(--nc),0 0 6px var(--nc),inset 0 1px 0 rgba(255,255,255,.12)}
.naya-drawer-btn:active{border-color:var(--nc);background:rgba(255,255,255,.05);color:#fff;box-shadow:0 0 20px -2px var(--nc),0 0 6px var(--nc),inset 0 1px 0 rgba(255,255,255,.12);transform:scale(.98)}
.naya-drawer-btn.naya-active{border-color:var(--nc);background:rgba(255,255,255,.06);color:#fff;box-shadow:0 0 22px -2px var(--nc),0 0 6px var(--nc),inset 0 1px 0 rgba(255,255,255,.12)}
.naya-drawer-btn.naya-active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--nc);box-shadow:0 0 12px var(--nc)}
.naya-drawer-btn.naya-ext{font-size:12px;letter-spacing:.18em;font-weight:700}
.naya-drawer-privacy{margin-top:auto;padding:12px 8px 2px;color:#8a8a96;font-size:11px;letter-spacing:.12em;line-height:1.7;border-top:1px solid rgba(255,255,255,.07)}
.naya-drawer-backdrop{position:fixed;inset:0;z-index:65;background:rgba(3,3,6,.66);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s ease}
body[data-naya-drawer] .naya-drawer-backdrop{opacity:1;pointer-events:auto}
body.naya-drawer-open{overflow:hidden}
.naya-drawer-btn:focus-visible,.naya-corner-btn:focus-visible,.naya-brand:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.naya-drawer,.naya-drawer-backdrop{transition:none}}

/* --- Bottom ecosystem bar: fixed quick access to all 12 destinations (mirrors Hub eco-bottombar) --- */
.eco-bottombar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom, 0px));background:linear-gradient(180deg,transparent,rgba(5,5,8,.92) 30%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.eco-bb-btn{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:radial-gradient(circle at 35% 30%,#2a2a32,#0a0a0e 70%);color:#fff;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:all .22s cubic-bezier(.16,.84,.22,1);box-shadow:inset 0 1px rgba(255,255,255,.15),0 0 14px rgba(255,255,255,.1),0 4px 10px rgba(0,0,0,.4);position:relative;-webkit-tap-highlight-color:transparent}
.eco-bb-btn svg{width:20px;height:20px;transition:transform .22s;filter:drop-shadow(0 0 3px rgba(255,255,255,.4))}
.eco-bb-btn:hover{transform:translateY(-3px) scale(1.08);border-color:var(--eco);box-shadow:inset 0 1px rgba(255,255,255,.2),0 0 24px var(--eco),0 6px 16px rgba(0,0,0,.5)}
.eco-bb-btn:hover svg{color:var(--eco);filter:drop-shadow(0 0 6px var(--eco))}
.eco-bb-btn:active{transform:translateY(-3px) scale(1.08);border-color:var(--eco);box-shadow:inset 0 1px rgba(255,255,255,.2),0 0 24px var(--eco),0 6px 16px rgba(0,0,0,.5)}
.eco-bb-btn:active svg{color:var(--eco);filter:drop-shadow(0 0 6px var(--eco))}
.eco-bb-btn::after{content:attr(data-label);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:.1em;color:#fff;background:rgba(10,10,14,.95);border:1px solid var(--eco);padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.eco-bb-btn:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
.eco-bb-btn:active::after{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){.eco-bottombar{gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom, 0px))}.eco-bb-btn{width:44px;height:44px;flex:0 0 44px}.eco-bb-btn svg{width:18px;height:18px}}



/* SMART SPACES v1.1 */
html,body{margin:0;padding:0;background:#060608;color:#f4f6fb;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;}
#app{min-height:100vh;}
.sp-stage{
  position:relative; width:100%; margin:0;
  padding:10px clamp(16px,4vw,64px) 120px;
  color:#f4f6fb; box-sizing:border-box;
}
.sp-stage *, .sp-stage *::before, .sp-stage *::after{ box-sizing:border-box; }

/* ---- tabs row ---- */
.sp-tabs-wrap{ margin:6px 0 14px; }
.sp-tabs-wrap .sn-row{
  position:sticky; top:76px; z-index:40;
  display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding:10px 12px; border-radius:999px;
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12);
  scrollbar-width:none;
}
.sp-tabs-wrap .sn-row::-webkit-scrollbar{ display:none; }

/* ---- toolbar ---- */
.sp-toolbar{ display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
.sp-search-wrap{ flex:1; min-width:220px; }
.sp-search{
  width:100%; padding:13px 18px; border-radius:999px; font-size:14px; font-family:inherit;
  color:#fff; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.14);
}
.sp-search:focus{ outline:none; border-color:#7c3aed; box-shadow:0 0 18px -6px #7c3aed; }
.sp-search::placeholder{ color:#6b7280; }
.sp-create-btn{
  padding:13px 26px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.1em;
  cursor:pointer; font-family:inherit; color:#e8eaf2; white-space:nowrap;
  background:linear-gradient(180deg,#161618,#0a0a0c);
  border:1px solid rgba(157,117,255,.35);
  box-shadow:0 8px 24px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .15s, box-shadow .25s;
}
.sp-create-btn:hover{ transform:translateY(-2px); color:#fff; text-shadow:0 0 14px rgba(255,255,255,.7); border-color:rgba(157,117,255,.85); box-shadow:0 12px 32px -6px rgba(124,92,255,.9), 0 0 28px -4px rgba(157,117,255,.55), inset 0 1px 0 rgba(255,255,255,.15); }

/* ---- space cards ---- */
.sp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
.sp-empty{ color:#8a8a96; font-size:14px; padding:32px 0; text-align:center; grid-column:1/-1; }
.sp-card{
  --sc:#7c3aed;
  border-radius:22px; overflow:hidden; cursor:pointer;
  background:linear-gradient(180deg,#0d0c15 0%,#07070c 100%);
  border:1px solid color-mix(in srgb, var(--sc) 38%, transparent);
  box-shadow:inset 0 1px rgba(255,255,255,.06), 0 18px 44px rgba(0,0,0,.55);
  transition:transform .22s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .3s;
}
.sp-card:hover{
  transform:translateY(-6px);
  border-color:color-mix(in srgb, var(--sc) 82%, #fff);
  box-shadow:inset 0 1px rgba(255,255,255,.08), 0 18px 44px rgba(0,0,0,.55), 0 0 38px -6px var(--sc), 0 0 12px -2px var(--sc);
}
.sp-cover{
  padding:26px 22px;
  background:
    radial-gradient(130% 120% at 50% -10%, color-mix(in srgb, var(--sc) 44%, transparent), transparent 62%),
    linear-gradient(180deg, #0b0a12, #060609);
  border-bottom:1px solid color-mix(in srgb, var(--sc) 30%, transparent);
}
.sp-card-name{ font-size:21px; font-weight:900; color:#fff; margin-bottom:4px; transition:text-shadow .25s; }
.sp-card:hover .sp-card-name{ text-shadow:0 0 18px rgba(255,255,255,.5); }
.sp-card-topic{ font-size:11px; font-weight:800; letter-spacing:.18em; color:var(--sc); text-transform:uppercase; }
.sp-card-body{ padding:18px 20px; }
.sp-card-desc{ font-size:13.5px; line-height:1.6; color:#c9cdd8; margin-bottom:14px; min-height:44px; }
.sp-card-meta{ display:flex; align-items:center; gap:10px; }
.sp-mstack{ display:flex; }
.sp-mstack .sp-ava{ margin-left:-8px; border:2px solid #0c0c10; }
.sp-mstack .sp-ava:first-child{ margin-left:0; }
.sp-mcount{ font-size:12px; color:#8a8a96; font-weight:600; }
.sp-priv{ font-size:11px; color:#8a8a96; margin-left:auto; }
.sp-join{
  margin-left:auto; padding:8px 16px; border-radius:999px; font-size:11px; font-weight:800;
  cursor:pointer; font-family:inherit; color:#fff; letter-spacing:.06em;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
  transition:border-color .2s, box-shadow .25s, transform .15s;
}
.sp-join:hover{ border-color:var(--sc); box-shadow:0 0 16px -4px var(--sc); transform:translateY(-1px); }
.sp-join.in{ border-color:var(--sc); color:var(--sc); background:color-mix(in srgb, var(--sc) 12%, transparent); }
.sp-priv + .sp-join{ margin-left:0; }


/* ---- avatars ---- */
.sp-ava{
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:44px; height:44px; border-radius:50%;
  font-size:16px; font-weight:900; color:#fff; letter-spacing:.02em;
  text-shadow:0 1px 6px rgba(0,0,0,.75);
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 44%),
    radial-gradient(circle at 50% 58%, color-mix(in srgb, var(--cc,#8b93a3) 92%, #000) 0%, color-mix(in srgb, var(--cc,#8b93a3) 42%, #050508) 100%);
  border:1px solid color-mix(in srgb, var(--cc,#8b93a3) 72%, #fff);
  box-shadow:0 0 14px -3px var(--cc,#8b93a3), inset 0 1px 2px rgba(255,255,255,.35), inset 0 -4px 8px rgba(0,0,0,.55);
}
.sp-ava.xs{ width:28px; height:28px; font-size:10px; }
.sp-ava.sm{ width:36px; height:36px; font-size:12px; }
.sp-ava.md{ width:52px; height:52px; font-size:16px; }

/* ---- detail view ---- */
.sp-back{
  background:none; border:none; color:#8a8a96; font-size:13px; font-weight:700;
  cursor:pointer; font-family:inherit; padding:8px 0; margin-bottom:8px;
}
.sp-back:hover{ color:#fff; }
.sp-detail{ --sc:#7c3aed; width:100%; margin:0; }
.sp-dhead{ margin-bottom:18px; }
.sp-dcover{
  border-radius:24px; padding:36px 30px; margin-bottom:16px;
  background:
    radial-gradient(120% 130% at 50% -20%, color-mix(in srgb, var(--sc) 42%, transparent), transparent 60%),
    linear-gradient(180deg, #0c0b14, #060609);
  border:1px solid color-mix(in srgb, var(--sc) 48%, transparent);
  box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 70px -18px var(--sc);
}
.sp-dtitle{ font-size:clamp(28px,4vw,42px); font-weight:900; color:#fff; letter-spacing:-.02em; margin-bottom:6px; }
.sp-dtopic{ display:inline-block; font-size:12px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
  color:#fff; background:color-mix(in srgb, var(--sc) 24%, rgba(0,0,0,.6));
  border:1px solid color-mix(in srgb, var(--sc) 60%, transparent);
  padding:7px 15px; border-radius:999px; }
.sp-ddesc{ font-size:15px; line-height:1.65; color:#c9cdd8; margin-bottom:14px; max-width:640px; }
.sp-dhrow{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.sp-dcount{ font-size:13px; color:#8a8a96; font-weight:600; }
.sp-invite-btn{
  padding:9px 20px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.08em;
  cursor:pointer; font-family:inherit; color:#fff;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
  transition:border-color .2s, box-shadow .25s;
}
.sp-invite-btn:hover{ border-color:var(--sc); box-shadow:0 0 16px -4px var(--sc); }

.sp-dtabs{ display:flex; gap:8px; margin-bottom:18px; border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:2px; }
.sp-dtab{
  background:none; border:none; border-bottom:2px solid transparent;
  color:#8a8a96; font-size:13px; font-weight:800; letter-spacing:.06em;
  padding:10px 16px; cursor:pointer; font-family:inherit;
  display:inline-flex; align-items:center; gap:8px;
  transition:color .2s, border-color .2s;
}
.sp-dtab:hover{ color:#fff; }
.sp-dtab.on{ color:#fff; border-bottom-color:var(--sc); text-shadow:0 0 12px var(--sc); }
.sp-dtab-n{
  font-size:10px; font-weight:800; background:var(--sc); color:#060608;
  border-radius:99px; padding:2px 8px;
}
.sp-dcontent{ min-height:300px; }

/* ---- posts ---- */
.sp-composer{
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1);
  border-radius:18px; padding:16px; margin-bottom:18px;
}
.sp-composer-ta{
  width:100%; min-height:80px; resize:vertical; border:none; background:transparent;
  color:#fff; font-size:14px; font-family:inherit; line-height:1.6; margin-bottom:12px;
}
.sp-composer-ta:focus{ outline:none; }
.sp-composer-ta::placeholder{ color:#5b5f6e; }
.sp-composer-row{ display:flex; gap:10px; justify-content:flex-end; }
.sp-sched-btn, .sp-post-btn{
  padding:10px 20px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.08em;
  cursor:pointer; font-family:inherit;
}
.sp-sched-btn{
  color:#c9cdd8; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
}
.sp-sched-btn.set{ border-color:#7c3aed; color:#a78bfa; }
.sp-post-btn{
  color:#fff; background:linear-gradient(180deg,#161618,#0a0a0c); color:#e8eaf2;
  border:1px solid rgba(157,117,255,.6);
  box-shadow:0 6px 18px -6px rgba(124,92,255,.6);
}
.sp-post-btn:hover{ transform:translateY(-2px); color:#fff; text-shadow:0 0 12px rgba(255,255,255,.7); border-color:rgba(157,117,255,.85); box-shadow:0 10px 26px -6px rgba(124,92,255,.9), 0 0 22px -4px rgba(157,117,255,.55); }
.sp-post{
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
  border-radius:18px; padding:18px; margin-bottom:14px;
}
.sp-post-top{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.sp-post-who{ flex:1; }
.sp-post-name{ font-size:14px; font-weight:800; color:#fff; }
.sp-post-time{ font-size:11px; color:#6b7280; }
.sp-sched-badge{
  font-size:10px; font-weight:800; color:#a78bfa;
  background:rgba(157,117,255,.12); border:1px solid rgba(157,117,255,.35);
  border-radius:99px; padding:4px 12px;
}
.sp-post-text{ font-size:14.5px; line-height:1.65; color:#e2e5ec; margin-bottom:12px; }
.sp-post-actions{ display:flex; gap:8px; }
.sp-like, .sp-mail-author{
  padding:8px 16px; border-radius:999px; font-size:11px; font-weight:700;
  cursor:pointer; font-family:inherit; color:#8a8a96;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  transition:all .2s;
}
.sp-like.on{ color:#f87171; border-color:rgba(248,113,113,.4); }
.sp-like:hover, .sp-mail-author:hover{ color:#fff; border-color:rgba(255,255,255,.3); }


/* ---- members (the magic) ---- */
.sp-magic-note{
  padding:14px 20px; border-radius:14px; margin-bottom:16px;
  font-size:13px; font-weight:600; color:#a78bfa; line-height:1.6;
  background:rgba(157,117,255,.08); border:1px solid rgba(157,117,255,.25);
}
.sp-member{
  display:flex; align-items:center; gap:16px;
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
  border-radius:18px; padding:16px 18px; margin-bottom:12px;
  transition:border-color .2s, transform .15s;
}
.sp-member:hover{ border-color:rgba(157,117,255,.4); transform:translateX(4px); }
.sp-member-info{ flex:1; min-width:0; }
.sp-member-name{ font-size:16px; font-weight:800; color:#fff; }
.sp-member-role{ font-size:12px; color:#8a8a96; margin-top:2px; }
.sp-save-contact{
  padding:11px 22px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.08em;
  cursor:pointer; font-family:inherit; color:#fff; white-space:nowrap;
  background:linear-gradient(180deg,#161618,#0a0a0c);
  border:1px solid rgba(157,117,255,.6);
  box-shadow:0 6px 20px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(157,117,255,.05,.25);
  transition:transform .15s, box-shadow .25s;
}

/* ---- modals ---- */
.sp-overlay{

.sp-mtitle{ font-size:20px; font-weight:900; color:#fff; margin:0 0 20px; }
.sp-mnote{ font-size:13px; color:#8a8a96; line-height:1.6; margin:0 0 16px; }

.sp-textin{
  width:100%; border-radius:12px; padding:13px 16px; font-size:14px; font-family:inherit;

}

.sp-topic-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.sp-topic-btn{

}
.sp-topic-btn.on{ border-color:#7c3aed; color:#a78bfa; background:rgba(157,117,255,.12); box-shadow:0 0 14px -4px #7c3aed; }
.sp-swatches{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.sp-sw{

}

.sp-mrow{ display:flex; gap:12px; justify-content:flex-end; margin-top:8px; }
.sp-btn{

}

.sp-btn.primary{
  color:#e8eaf2; background:linear-gradient(180deg,#161618,#0a0a0c);

}

.sp-invite-list{ max-height:320px; overflow-y:auto; margin-bottom:16px; }
.sp-invite-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06); }
.sp-invite-name{ flex:1; font-size:14px; font-weight:600; color:#fff; }
.sp-invite-add{

}

/* ---- schedule picker ---- */
.sp-sched-tabs{ display:flex; gap:8px; margin-bottom:16px; }
.sp-sched-tab{
  flex:1; padding:10px; border-radius:12px; font-size:11px; font-weight:800; letter-spacing:.08em;

}

.sp-sched-body{ margin-bottom:12px; }
.sp-sched-body input[type="date"], .sp-sched-body input[type="time"]{ color-scheme:dark; }
.sp-days-row{ display:flex; gap:8px; margin-bottom:8px; }
.sp-day-btn{
  width:40px; height:40px; border-radius:50%; font-size:13px; font-weight:800;
  cursor:pointer; font-family:inherit; color:#8a8a96;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15);
}
.sp-day-btn.on{ color:#fff; border-color:#7c3aed; background:rgba(157,117,255,.2); box-shadow:0 0 12px -2px #7c3aed; }
.sp-month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px; }
.sp-dom-btn{

  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
}
.sp-dom-btn.on{ color:#fff; border-color:#7c3aed; background:rgba(157,117,255,.2); }
.sp-sched-summary{
  padding:14px 18px; border-radius:12px; margin:12px 0;

}
.sp-tz{ font-size:11px; color:#5b5f6e; margin-bottom:8px; }

/* ---- toast ---- */
.sp-toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
  z-index:500; padding:14px 28px; border-radius:999px;

  background:rgba(20,16,28,.95); border:1px solid rgba(157,117,255,.5);
  box-shadow:0 12px 40px rgba(0,0,0,.6), 0 0 30px -8px #7c3aed;
  opacity:0; pointer-events:none; transition:opacity .3s, transform .3s;
}
.sp-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---- sn menu/pop (from v9 spec) ---- */
.sn-menu .mi{ padding:10px 14px; cursor:pointer; color:#fff; font-weight:700; font-size:13px; border-bottom:1px solid rgba(255,255,255,.08); }
.sn-menu .mi:last-child{ border-bottom:none; }
.sn-menu .mi:hover{ background:rgba(255,255,255,.07); }
.sn-pop h3{ margin:0 0 12px; font-size:16px; }
.sn-pop .row{ margin-bottom:10px; }
.sn-pop label{ font-size:12px; color:#c9cdd8; }
.sn-pop input{
  width:100%; margin-top:6px; padding:10px 14px; border-radius:10px;

}
.sn-pop .toggles{ display:flex; gap:8px; margin:10px 0; }
.sn-pop .tgl{
  padding:9px 14px; border-radius:10px; font-size:12px; font-weight:800;
  cursor:pointer; color:#fff; border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.45);
}
.sn-pop .tgl.on{ box-shadow:0 0 0 2px rgba(255,255,255,.35) inset, 0 0 16px rgba(124,77,255,.3); }
.sn-pop .ft{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
.sn-btn{
  padding:10px 20px; border-radius:10px; font-size:12px; font-weight:800;
  cursor:pointer; font-family:inherit; color:#fff;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25);
}
.sn-btn.primary{ background:linear-gradient(135deg,#6F3DFF,#9D7BFF); border-color:transparent; }

/* ---- responsive ---- */
@media(max-width:760px){
  .sp-stage{ padding:10px 14px 110px; }
  .sp-grid{ grid-template-columns:1fr; }
  .sp-detail{ max-width:100%; }
  .sp-member{ flex-wrap:wrap; }
  .sp-save-contact{ width:100%; text-align:center; }
  .sp-toolbar{ flex-direction:column; align-items:stretch; }
  .sp-create-btn{ width:100%; }
  .sp-modal{ padding:24px 20px; }
}
@media(prefers-reduced-motion:reduce){
  .sp-card, .sp-member, .sp-modal, .sp-save-contact{ transition:none; animation:none; }
}

.sn-pill{
  --tc:#fff;
  flex:0 0 auto; display:inline-flex; align-items:center; gap:10px;
  padding:10px 16px; border-radius:999px; cursor:pointer; user-select:none;
  border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.55);
  color:#fff; font-family:inherit; font-weight:900; font-size:12px; letter-spacing:.03em;
  transition:box-shadow .25s, border-color .2s, text-shadow .25s;
}
.sn-pill .sn-label{ white-space:nowrap; }
.sn-pill.heart{ box-shadow:0 0 0 2px rgba(183,114,255,.4) inset; }
.sn-pill.star{ box-shadow:0 0 0 2px rgba(248,201,56,.4) inset; }
.sn-mark{ font-size:13px; line-height:1; }
.sn-pill:hover, .cx-stage .sn-pill:focus-visible{
  border-color:var(--tc); outline:none;
  box-shadow:0 0 18px -4px var(--tc), 0 0 0 2px var(--tc) inset;
  text-shadow:0 0 10px var(--tc);
}
.sn-pill.on{
  border-color:var(--tc);
  box-shadow:0 0 22px -4px var(--tc), 0 0 0 2px var(--tc) inset;
  text-shadow:0 0 12px var(--tc);
}
.sn-pill.add{ border-style:dashed; color:var(--cx-dim); }
.sn-pill.add:hover{ color:#fff; border-color:#fff; box-shadow:none; text-shadow:none; }
.sn-more{
  border:0; background:rgba(255,255,255,.1); color:#fff; border-radius:8px;
  padding:3px 9px; cursor:pointer; font-size:13px; line-height:1.5; font-family:inherit;
  transition:background .2s;
}
.sn-more:hover{ background:rgba(255,255,255,.22); }
.sn-more.sn-x:hover{ background:rgba(248,113,113,.3); color:#fca5a5; }
.sn-count{
  font-size:10px; font-weight:800; color:var(--cx-dim); font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.07); border-radius:99px; padding:2px 8px;
}
.sn-menu{
  position:fixed; z-index:1000; display:none; min-width:220px; overflow:hidden;
  background:linear-gradient(180deg,#121827,#0e1424);
  border:1px solid rgba(255,255,255,.18); border-radius:12px;
  box-shadow:0 18px 40px rgba(0,0,0,.5);
}
.sn-menu .mi{
  padding:10px 14px; border-bottom:1px solid rgba(255,255,255,.08);
  cursor:pointer; color:#fff; font-weight:700; font-size:13px;
}
.sn-menu .mi:last-child{ border-bottom:none; }
.sn-menu .mi:hover{ background:rgba(255,255,255,.07); }
.sn-pop{
  position:fixed; z-index:1000; display:none; min-width:300px; max-width:92vw;
  background:linear-gradient(180deg,#111727,#0e1424);

  box-shadow:0 22px 60px rgba(0,0,0,.5); padding:16px; color:#fff;
}
.sn-pop h3{ margin:0 0 10px; font-size:15px; }
.sn-pop .row{ display:grid; gap:6px; margin:8px 0; }
.sn-pop label{ display:grid; gap:6px; font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--cx-dim); }
.sn-pop input{
  padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2);
  background:#0a0f1a; color:#fff; font-family:inherit; font-size:14px;
}
.sn-pop .toggles{ display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
.sn-pop .tgl{
  display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px;
  border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.45);

}
.sn-pop .tgl.on{
  box-shadow:0 0 0 2px rgba(255,255,255,.35) inset, 0 0 18px rgba(124,77,255,.3);
}
.sn-pop .ft{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
.sn-btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:10px;
  border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.55); color:#fff;

}
.sn-btn.primary{ background:linear-gradient(135deg,#6F3DFF,#9D7BFF); border-color:transparent; }

/* ============ V2 PREMIUM UPGRADE ============ */
/* Richer space cards */
.sp-card{

  background:
    radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, var(--sc) 22%, transparent), transparent 55%),

  border:1px solid color-mix(in srgb, var(--sc) 34%, rgba(255,255,255,.10));

}
.sp-card:hover{

function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtTime(ts){
  var d = new Date(ts), now = new Date();
  var diff = now - d;
  if(diff < 60000) return 'just now';
  if(diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if(diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function uid(p){ return (p||'id') + '-' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }

/* ============ palette (standard only) ============ */
var PALETTE = ['#7c3aed','#1e6fd9','#0d9e6f','#d4a017','#0e9bd8','#a78bfa','#7dd3fc','#d4a017'];
function colorFor(id){
  var h = 0, s = String(id || '');
  for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) % 997; }
  return PALETTE[h % PALETTE.length];
}

/* ============ storage ============ */
function loadJSON(k, fb){
  try{ var v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; }

}

function allPeople(){
  var out = [], seen = {};

    if(!p || !p.id || seen[p.id]) return;

      id: String(p.id), name: String(p.name || p.id),
      role: String(p.role || ''), color: String(p.color || '#8b93a3'),
      note: String(p.note || '')
    });
  }
  try{
    if(window.NayaPeople && typeof window.NayaPeople.load === 'function')
      (window.NayaPeople.load() || []).forEach(push);
  }catch(e){}
  // also read raw registry directly
  loadJSON(LS_PEOPLE, []).forEach(push);
  return out;
}
function personById(id){
  var f = null;
  allPeople().forEach(function(p){ if(p.id === id) f = p; });

}
function savePerson(p){
  var reg = loadJSON(LS_PEOPLE, []);
  var found = false;
  reg = reg.map(function(x){
    if(String(x.id) === String(p.id)){ found = true; return Object.assign({}, x, p); }
    return x;
  });
  if(!found) reg.push(p);
  saveJSON(LS_PEOPLE, reg);
  // notify NayaPeople if available
  try{ if(window.NayaPeople && typeof window.NayaPeople.save === 'function') window.NayaPeople.save(p); }catch(e){}
}

/* Pinned blocks per space: spaceId -> [blockIds] */
function loadPins(){
  try{ var p = JSON.parse(localStorage.getItem('naya.spaces.pins.v1')); if(p && typeof p === 'object') return p; }catch(e){}
  var d = {};
  SEED_BLOCKS.forEach(function(b){ (b.spaceIds||[]).forEach(function(sid){ (d[sid] = d[sid] || []).push(b.id); }); });
  return d;
}
var spacePins = loadPins();
function savePins(){ try{ localStorage.setItem('naya.spaces.pins.v1', JSON.stringify(spacePins)); }catch(e){} }
function pinnedBlocks(spaceId){ var ids = spacePins[spaceId] || []; return ids.map(function(id){ return SEED_BLOCKS.find(function(b){ return b.id === id; }); }).filter(Boolean); }
function pinBlock(spaceId, blockId){ var a = spacePins[spaceId] = spacePins[spaceId] || []; if(a.indexOf(blockId) < 0){ a.push(blockId); savePins(); } }
function unpinBlock(spaceId, blockId){ var a = spacePins[spaceId] || []; spacePins[spaceId] = a.filter(function(id){ return id !== blockId; }); savePins(); }


function seedIfEmpty(){
  // seed people into registry if none of them exist
  var reg = loadJSON(LS_PEOPLE, []);
  var ids = {};
  reg.forEach(function(p){ ids[String(p.id)] = 1; });
  var added = false;
  SEED_PEOPLE.forEach(function(p){
    if(!ids[p.id]){ reg.push(Object.assign({}, p)); added = true; }
  });
  if(added) saveJSON(LS_PEOPLE, reg);
  if(!localStorage.getItem(LS_POSTS)) saveJSON(LS_POSTS, SEED_POSTS);
  if(!localStorage.getItem(LS_CHAT)) saveJSON(LS_CHAT, []);
}

function customSpaces(){ return loadJSON(LS_CUSTOM, []); }
function effectiveSpaces(){
  var out = SEED_SPACES.map(function(s){ return Object.assign({}, s); });
  customSpaces().forEach(function(c){
    if(!c || !c.id) return;
    out.push({
      id: c.id, name: c.name || 'Untitled space',
      topic: c.topic || 'General', desc: c.desc || '',
      color: c.color || colorFor(c.id),
      privacy: c.privacy || 'public',
      memberIds: c.memberIds || [], custom: true,
      created: c.created || Date.now()
    });
  });
  return out;
}
function spaceById(id){
  var f = null;
  effectiveSpaces().forEach(function(s){ if(s.id === id) f = s; });
  return f;
}
function spaceMembers(space){
  var out = [], seen = {};
  var ids = (space.memberIds || []).slice();
  // include invite overrides for seed spaces
  var ov = loadJSON('naya.spaces.memberov.v1', {});
  (ov[space.id] || []).forEach(function(id){ if(ids.indexOf(id) < 0) ids.push(id); });
  ids.forEach(function(id){
    var p = personById(id);
    if(p && !seen[p.id]){ seen[p.id] = 1; out.push(p); }
  });
  return out;

/* ============ Smart Tabs v9 for Spaces ============ */
var SN_TABS_KEY = LS_TABS;
function loadSnTabs(){
  var t = loadJSON(SN_TABS_KEY, null);
  if(Array.isArray(t) && t.length) return t;
  return [
    {id:'st-all', label:'All Spaces', heart:false, star:false, custom:false, filter:'all'},
    {id:'st-mine', label:'My Spaces', heart:true, star:false, custom:false, filter:'mine'},
    {id:'st-start', label:'Start Here', heart:false, star:false, custom:false, filter:'topic:Start Here'},
    {id:'st-vision', label:'Vision', heart:false, star:false, custom:false, filter:'topic:Vision'},
    {id:'st-learn', label:'Learn', heart:false, star:false, custom:false, filter:'topic:Learn'},
    {id:'st-create', label:'Create', heart:false, star:false, custom:false, filter:'topic:Create'},
    {id:'st-connect', label:'Connect', heart:false, star:false, custom:false, filter:'topic:Connect'},
    {id:'st-grow', label:'Grow', heart:false, star:false, custom:false, filter:'topic:Grow'}
  ];
}
function saveSnTabs(t){ saveJSON(SN_TABS_KEY, t); }
function sortedSnTabs(tabs){
  return tabs.slice().sort(function(a,b){
    return ((b.heart?2:0)+(b.star?1:0)) - ((a.heart?2:0)+(a.star?1:0));
  });
}
function tabMatches(space, tab, myIds){
  if(!tab || tab.filter === 'all') return true;
  if(tab.filter === 'mine') return myIds.indexOf(space.id) >= 0;
  if(tab.filter.indexOf('topic:') === 0){
    var topics = tab.filter.slice(6).split(',');
    return topics.indexOf(space.topic) >= 0;
  }
  if(tab.filter.indexOf('custom:') === 0){
    // custom tab: filter is a comma list of space ids
    var ids = tab.filter.slice(7).split(',');
    return ids.indexOf(space.id) >= 0;
  }
  return true;
}

var activeSnTab = 'st-all';
var mySpaceIds = loadJSON('naya.spaces.mine.v1', ['sp-ai','sp-friends']);

function renderSnTabs(container, onSelect){
  var tabs = loadSnTabs();
  container.innerHTML = '';
  var row = el('div','sn-row');
  row.setAttribute('role','navigation');
  row.setAttribute('aria-label','Space filters');
  sortedSnTabs(tabs).forEach(function(t){
    var cls = 'sn-pill' + (t.heart ? ' heart' : t.star ? ' star' : '') + (t.id === activeSnTab ? ' on' : '');
    var pill = el('div', cls);
    var tc = t.id === 'st-all' ? '#fff' : colorFor(t.id);
    pill.style.setProperty('--tc', tc);
    pill.setAttribute('data-id', t.id);
    var label = el('span','sn-label', t.label);
    pill.appendChild(label);

    else if(t.star){ var ms = el('span','sn-mark','⭐'); pill.appendChild(ms); }
    var more = el('button','sn-more','⋯');
    more.setAttribute('aria-label','Tab options');
    more.addEventListener('click', function(e){
      e.stopPropagation(); openSnTabMenu(t, pill, container, onSelect);
    });
    pill.appendChild(more);
    pill.addEventListener('click', function(){ onSelect(t.id); });
    pill.addEventListener('contextmenu', function(e){
      e.preventDefault(); openSnTabMenu(t, pill, container, onSelect);
    });
    row.appendChild(pill);
  });
  var add = el('div','sn-pill add');
  add.style.setProperty('--tc','#fff');
  add.appendChild(el('span','sn-label','＋ Add'));
  add.addEventListener('click', function(){ openSnTabEditor(null, add, container, onSelect); });
  row.appendChild(add);
  container.appendChild(row);
}

function closeSnPanels(){
  document.querySelectorAll('.sn-menu,.sn-pop').forEach(function(p){ p.style.display = 'none'; });
}
function placeNear(anchor, panel, oy){
  oy = oy || 8;
  var r = anchor.getBoundingClientRect();
  var W = panel.offsetWidth || 280, H = panel.offsetHeight || 160;
  var left = Math.min(window.innerWidth - W - 8, Math.max(8, r.left));
  var top = Math.min(window.innerHeight - H - 8, r.bottom + oy);
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
}
function ensureSnMenu(){
  var m = document.querySelector('.sn-menu.sp-tabs-menu');
  if(m) return m;
  m = el('div','sn-menu sp-tabs-menu');
  m.setAttribute('role','menu');
  m.innerHTML =
    '<div class="mi" data-act="edit">✏️ Edit</div>' +
    '<div class="mi" data-act="heart">💜 Set Purple Heart</div>' +
    '<div class="mi" data-act="star">⭐ Set Gold Star</div>' +
    '<div class="mi" data-act="remove">✕ Remove</div>';
  document.body.appendChild(m);
  return m;
}
function openSnTabMenu(tab, anchor, container, onSelect){
  closeSnPanels();
  var m = ensureSnMenu();
  placeNear(anchor, m, 6);
  m.style.display = 'block';
  m.onclick = function(e){
    var mi = e.target.closest('.mi'); if(!mi) return;
    var act = mi.getAttribute('data-act');
    m.style.display = 'none';
    var tabs = loadSnTabs();
    var t = tabs.filter(function(x){ return x.id === tab.id; })[0];
    if(!t) return;
    if(act === 'edit'){ openSnTabEditor(t, anchor, container, onSelect); }
    else if(act === 'heart'){ t.heart = true; t.star = false; saveSnTabs(tabs); renderSnTabs(container, onSelect); }
    else if(act === 'star'){ t.star = true; t.heart = false; saveSnTabs(tabs); renderSnTabs(container, onSelect); }
    else if(act === 'remove'){
      if(t.custom){
        saveSnTabs(tabs.filter(function(x){ return x.id !== t.id; }));
        if(activeSnTab === t.id) activeSnTab = 'st-all';
        renderSnTabs(container, onSelect); onSelect(activeSnTab);
      } else { toast('System tabs can\'t be removed'); }
    }
  };
}
function ensureSnPop(){
  var p = document.querySelector('.sn-pop.sp-tabs-pop');
  if(p) return p;
  p = el('div','sn-pop sp-tabs-pop');
  p.setAttribute('role','dialog');
  p.innerHTML =
    '<h3 class="sn-pop-title">Add Tab</h3>' +
    '<div class="row"><label>Label<br><input class="sn-in-label" placeholder="e.g. Design"></label></div>' +
    '<div class="toggles">' +
    '<div class="tgl sn-tgl-heart">💜 Purple Heart</div>' +
    '<div class="tgl sn-tgl-star">⭐ Gold Star</div>' +
    '</div>' +
    '<div class="ft"><button class="sn-btn sn-cancel">Cancel</button>' +
    '<button class="sn-btn primary sn-save">Save</button></div>';
  document.body.appendChild(p);
  return p;
}
function openSnTabEditor(tab, anchor, container, onSelect){
  closeSnPanels();
  var pop = ensureSnPop();
  var isNew = !tab;
  pop.querySelector('.sn-pop-title').textContent = isNew ? 'Add Tab' : 'Edit Tab';
  var inLabel = pop.querySelector('.sn-in-label');
  var tHeart = pop.querySelector('.sn-tgl-heart');
  var tStar = pop.querySelector('.sn-tgl-star');
  inLabel.value = tab ? tab.label : '';
  tHeart.classList.toggle('on', !!(tab && tab.heart));
  tStar.classList.toggle('on', !!(tab && tab.star));
  tHeart.onclick = function(){
    tHeart.classList.toggle('on');
    if(tHeart.classList.contains('on')) tStar.classList.remove('on');
  };
  tStar.onclick = function(){
    tStar.classList.toggle('on');
    if(tStar.classList.contains('on')) tHeart.classList.remove('on');
  };
  placeNear(anchor, pop, 6);
  pop.style.display = 'block';
  pop.querySelector('.sn-cancel').onclick = function(){ pop.style.display = 'none'; };
  pop.querySelector('.sn-save').onclick = function(){
    var label = (inLabel.value || '').trim() || 'New Tab';
    var heart = tHeart.classList.contains('on');
    var star = tStar.classList.contains('on');
    var tabs = loadSnTabs();
    if(isNew){
      var nt = {id: uid('st'), label: label, heart: heart, star: star, custom: true, filter: 'custom:'};
      tabs.push(nt); saveSnTabs(tabs);
      activeSnTab = nt.id;
    } else {
      tabs.forEach(function(x){
        if(x.id === tab.id){ x.label = label; x.heart = heart; x.star = star; }
      });
      saveSnTabs(tabs);
    }
    pop.style.display = 'none';
    renderSnTabs(container, onSelect); onSelect(activeSnTab);
  };
}
document.addEventListener('click', function(e){
  if(!e.target.closest('.sn-row') && !e.target.closest('.sn-menu') && !e.target.closest('.sn-pop')) closeSnPanels();
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSnPanels(); });


/* ============ toast ============ */
function toast(msg){
  var t = document.querySelector('.sp-toast');
  if(!t){
    t = el('div','sp-toast');
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

function filteredSpaces(){

    if(q && (s.name + ' ' + s.topic + ' ' + (s.desc||'')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

  cin.addEventListener('keydown', function(e){ if(e.key === 'Enter') doComment(); });

var __recorder = null, __recChunks = [], __recStart = 0, __recStream = null;
function renderAudioMsg(m, s){
  var box = el('div','sp-audio-msg');
  box.style.setProperty('--sc', s.color);
  var play = el('button','sp-audio-play','▶');
  var wave = el('div','sp-audio-wave');
  var bars = 24;
  var seed = 0; for(var i=0;i<m.audioLabel.length;i++) seed += m.audioLabel.charCodeAt(i);
  for(var i=0;i<bars;i++){
    var b = el('i');
    var h = 4 + ((seed * (i+7)) % 20);
    b.style.height = h + 'px';
    wave.appendChild(b);
  }
  var dur = el('span','sp-audio-dur', m.audioLabel);
  var audioEl = null;
  play.addEventListener('click', function(){
    if(!m.audioData){ toast('Audio stored locally only'); return; }
    if(!audioEl){ audioEl = new Audio(m.audioData); audioEl.onended = function(){ play.textContent = '▶'; }; }
    if(audioEl.paused){ audioEl.play(); play.textContent = '⏸'; }
    else { audioEl.pause(); play.textContent = '▶'; }
  });
  box.appendChild(play); box.appendChild(wave); box.appendChild(dur);
  return box;
}


function toggleRecording(btn, s){
  if(__recorder && __recorder.state === 'recording'){
    __recorder.stop();
    return;
  }
  if(!window.MediaRecorder){ toast('Voice messages not supported in this browser'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Microphone unavailable'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    __recStream = stream; __recChunks = []; __recStart = Date.now();
    __recorder = new MediaRecorder(stream);
    __recorder.ondataavailable = function(e){ if(e.data.size) __recChunks.push(e.data); };
    __recorder.onstop = function(){
      btn.classList.remove('rec'); btn.textContent = '🎤';
      var secs = Math.max(1, Math.round((Date.now() - __recStart) / 1000));
      var blob = new Blob(__recChunks, {type: __recorder.mimeType || 'audio/webm'});
      var reader = new FileReader();
      reader.onload = function(){
        var me = allPeople()[0];
        addChatMsg({
          id: uid('chat'), spaceId: s.id,
          authorId: me ? me.id : 'you', authorName: me ? me.name : 'You',
          text: '', ts: Date.now(),
          audioData: reader.result,
          audioLabel: '0:' + String(secs).padStart(2,'0')
        });
        renderDetail(document.querySelector('.sp-stage'));
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(function(t){ t.stop(); });
      __recorder = null;
    };
    __recorder.start();
    btn.classList.add('rec'); btn.textContent = '⏹';
    toast('Recording… tap again to stop');
  }).catch(function(){ toast('Microphone permission denied'); });
}

/* ============ NayaGate: honest connection gating (2026-10-04) ============
   Reads the shared connection contract written by the Smart Connect room:
   localStorage['naya.connection.v1'] = {connected:true, doors:[...], at:...}
   Browsing/joining spaces is always free. Anything needing a live
   connection goes through require() -> honest prompt, never a fake connect. */
window.NayaGate = (function(){
  var KEY = 'naya.connection.v1';
  function state(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
  function isConnected(){ return !!state().connected; }
  function require(opts){
    opts = opts || {};
    if(isConnected()) return true;
    var feature = opts.feature || 'This feature';
    var door = opts.door || 'GitHub';
    var modal = openModal();
    modal.appendChild(el('h3','sp-mtitle','\uD83D\uDD0C Connection needed'));
    modal.appendChild(el('p','sp-mnote', feature + ' needs your NayaPOWER connection. Connect ' + door + ' in Smart Connect to activate this feature \u2014 it takes a minute, and your intelligence stays yours.'));
    var row = el('div','sp-mrow');
    var go = el('button','sp-btn primary','Go to Smart Connect \u2192');
    go.addEventListener('click', function(){ closeModal(); window.location.href = 'connect.html'; });
    var later = el('button','sp-btn ghost','Not now');
    later.addEventListener('click', closeModal);
    row.appendChild(go); row.appendChild(later);
    modal.appendChild(row);
    return false;
  }
  return { state: state, isConnected: isConnected, require: require, KEY: KEY };
})();

function openSchedulePicker(cb){

  modal.appendChild(el('h3','sp-mtitle','Schedule Post'));

  var tabs = [['once','Once'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']];
  var sel = 'once';
  var tabRow = el('div','sp-sched-tabs');
  tabs.forEach(function(t){

    b.addEventListener('click', function(){
      sel = t[0];
      tabRow.querySelectorAll('.sp-sched-tab').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      syncBody();
    });
    tabRow.appendChild(b);
  });
  modal.appendChild(tabRow);

  var body = el('div','sp-sched-body');
  modal.appendChild(body);

  var dateIn = el('input','sp-textin'); dateIn.type = 'date';
  var tomorrow = new Date(Date.now() + 86400000);
  dateIn.value = tomorrow.toISOString().slice(0,10);
  dateIn.min = new Date().toISOString().slice(0,10);

  var timeIn = el('input','sp-textin'); timeIn.type = 'time';
  timeIn.value = '09:00';

  var daysRow = el('div','sp-days-row');
  var selDays = [1]; // Monday
  var dayNames = ['S','M','T','W','T','F','S'];
  dayNames.forEach(function(dn, i){
    var b = el('button','sp-day-btn' + (selDays.indexOf(i) >= 0 ? ' on' : ''), dn);
    b.addEventListener('click', function(){
      var ix = selDays.indexOf(i);
      if(ix >= 0){ if(selDays.length > 1) selDays.splice(ix,1); }
      else selDays.push(i);
      daysRow.querySelectorAll('.sp-day-btn').forEach(function(x, xi){
        x.classList.toggle('on', selDays.indexOf(xi) >= 0);
      });
      updateSummary();
    });
    daysRow.appendChild(b);
  });

  var monthRow = el('div','sp-month-grid');
  var selDom = 15;
  for(var d = 1; d <= 31; d++){
    (function(day){
      var b = el('button','sp-dom-btn' + (day === selDom ? ' on' : ''), String(day));
      b.addEventListener('click', function(){
        selDom = day;
        monthRow.querySelectorAll('.sp-dom-btn').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        updateSummary();
      });
      monthRow.appendChild(b);
    })(d);
  }

  var summary = el('div','sp-sched-summary');
  modal.appendChild(summary);

  function ord(n){
    if(n >= 11 && n <= 13) return n + 'th';
    switch(n % 10){ case 1: return n + 'st'; case 2: return n + 'nd'; case 3: return n + 'rd'; default: return n + 'th'; }
  }
  function dayName(i){ return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][i]; }
  function fmtT(t){
    var parts = t.split(':'); var h = parseInt(parts[0],10), m = parts[1];
    var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if(h === 0) h = 12;
    return h + ':' + m + ' ' + ap;
  }
  function updateSummary(){
    var label = '';
    if(sel === 'once'){
      var dt = new Date(dateIn.value + 'T' + timeIn.value);
      label = 'Posts on ' + dt.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'}) + ' at ' + fmtT(timeIn.value);
    } else if(sel === 'daily'){
      label = 'Posts every day at ' + fmtT(timeIn.value);
    } else if(sel === 'weekly'){
      var names = selDays.slice().sort().map(dayName);
      label = 'Posts every ' + names.join(', ') + ' at ' + fmtT(timeIn.value);
    } else {
      label = 'Posts on the ' + ord(selDom) + ' of every month at ' + fmtT(timeIn.value);
    }
    summary.textContent = label;
    return label;
  }
  function syncBody(){
    body.innerHTML = '';
    if(sel === 'once'){ body.appendChild(el('label','sp-mlabel','Date')); body.appendChild(dateIn); }
    if(sel === 'weekly'){ body.appendChild(el('label','sp-mlabel','Days')); body.appendChild(daysRow); }
    if(sel === 'monthly'){ body.appendChild(el('label','sp-mlabel','Day of month')); body.appendChild(monthRow); }
    body.appendChild(el('label','sp-mlabel','Time'));
    body.appendChild(timeIn);
    updateSummary();
  }
  dateIn.addEventListener('change', updateSummary);
  timeIn.addEventListener('change', updateSummary);
  timeIn.addEventListener('input', updateSummary);
  syncBody();

  var tz = el('div','sp-tz','Timezone: ' + Intl.DateTimeFormat().resolvedOptions().timeZone);
  modal.appendChild(tz);

  var btnRow = el('div','sp-mrow');
  var cancel = el('button','sp-btn ghost','Cancel');
  cancel.addEventListener('click', closeModal);
  var set = el('button','sp-btn primary','Set Schedule');
  set.addEventListener('click', function(){
    var label = updateSummary();
    closeModal();
    cb({freq: sel, label: label, date: dateIn.value, time: timeIn.value, days: selDays.slice(), dom: selDom});
  });
  btnRow.appendChild(cancel); btnRow.appendChild(set);
  modal.appendChild(btnRow);
}


/* ============ app bootstrap ============ */
function renderApp(){
  var stage = document.querySelector('.sp-stage');
  if(!stage){
    stage = el('div','sp-stage');
    document.getElementById('app').appendChild(stage);
  }
  if(state.view === 'detail') renderDetail(stage);
  else renderDiscovery(stage);
}

function init(){
  seedIfEmpty();
  // mount point
  if(!document.getElementById('app')){
    var app = el('div'); app.id = 'app';
    document.body.appendChild(app);
  }
  renderApp();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();

  var leftDrawer = h('nav','naya-drawer naya-drawer-left');
  leftDrawer.setAttribute('aria-label','Hub rooms');
  leftDrawer.appendChild(h('p','naya-drawer-kicker','ROOMS'));
  ROOMS.forEach(function(r){
    var b = h('button','naya-drawer-btn' + (r[0] === ACTIVE ? ' naya-active' : ''));
    b.style.setProperty('--nc', r[3]);
    b.textContent = r[1];
    if (r[0] === ACTIVE) b.setAttribute('aria-current','page');
    b.addEventListener('click', function(){
      closeDrawers();
      if (r[0] === ACTIVE) { window.scrollTo({top:0, behavior:'smooth'}); return; }
      location.href = r[2];
    });
    leftDrawer.appendChild(b);
  });
  var priv = h('div','naya-drawer-privacy');
  priv.innerHTML = 'PRIVATE BY DEFAULT.<br>SHARED BY CHOICE.<br>COLLECTIVE BY CONSENT.';
  leftDrawer.appendChild(priv);

  /* ——— Right drawer: NayaNET ——— */
  var rightDrawer = h('nav','naya-drawer naya-drawer-right');
  rightDrawer.setAttribute('aria-label','NayaNET menu');
  rightDrawer.appendChild(h('p','naya-drawer-kicker','NAYANET'));
  var FLOW = ['#7c3aed','#6675ff','#0e9bd8','#35b779','#b8ee57','#f1d75a','#d4a017','#ff9a5a','#ff5e6c','#d86cff','#ff5e6c','#ff9a5a'];
  NAYA_LINKS.forEach(function(pair, i){
    var a = h('a','naya-drawer-btn naya-ext'); a.textContent = pair[0];
    a.style.setProperty('--nc', FLOW[i % FLOW.length]);
    a.href = pair[1]; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', pair[0] + ' (opens in a new tab)');
    rightDrawer.appendChild(a);
  });

  var backdrop = h('div','naya-drawer-backdrop');
  backdrop.addEventListener('click', closeDrawers);

  var lastFocus = null;
  function openDrawer(which){
    lastFocus = document.activeElement;
    document.body.setAttribute('data-naya-drawer', which);
    document.body.classList.add('naya-drawer-open');
    leftBtn.setAttribute('aria-expanded', which === 'left' ? 'true' : 'false');
    rightBtn.setAttribute('aria-expanded', which === 'right' ? 'true' : 'false');
    var first = (which === 'left' ? leftDrawer : rightDrawer).querySelector('.naya-drawer-btn');
    if (first) first.focus();
  }
  function closeDrawers(){
    document.body.removeAttribute('data-naya-drawer');
    document.body.classList.remove('naya-drawer-open');
    leftBtn.setAttribute('aria-expanded','false');
    rightBtn.setAttribute('aria-expanded','false');
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch(e){} lastFocus = null; }
  }
  function toggle(which){
    if (document.body.getAttribute('data-naya-drawer') === which) closeDrawers();
    else openDrawer(which);
  }
  leftBtn.addEventListener('click', function(){ toggle('left'); });
  rightBtn.addEventListener('click', function(){ toggle('right'); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.body.hasAttribute('data-naya-drawer')) closeDrawers();
  });

  document.body.insertBefore(backdrop, document.body.firstChild);
  document.body.insertBefore(rightDrawer, document.body.firstChild);
  document.body.insertBefore(leftDrawer, document.body.firstChild);
  document.body.insertBefore(top, document.body.firstChild);
})();


</script>
